apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sealedsecrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        revision: HEAD
        files:
          - path: sealedsecret/*/kustomization.yaml
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-secrets'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        targetRevision: HEAD
        path: 'sealedsecret/{{ index .path.segments 1 }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
