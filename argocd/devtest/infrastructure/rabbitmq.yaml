apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: messaging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/rabbitmq
    targetRevision: HEAD
    helm:
      releaseName: rabbitmq
      values: |
        # RabbitMQ DevTest Configuration
        replicaCount: 1

        image:
          repository: rabbitmq
          tag: "3.12-management"
          pullPolicy: IfNotPresent

        # Authentication
        auth:
          username: postal
          existingSecret: "rabbitmq-credentials"
          existingSecretPasswordKey: "password"
          existingSecretErlangCookieKey: "erlang-cookie"

        # Default vhost for Postal
        vhost: postal

        # Service configuration
        service:
          type: ClusterIP
          port: 5672
          managementPort: 15672

        # Resources for devtest
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi

        # Storage
        persistence:
          enabled: true
          storageClass: "standard-rwo"
          size: 5Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: email
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
