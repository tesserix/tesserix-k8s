apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-marketplace
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: database
    target-namespace: marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/postgresql
    targetRevision: HEAD
    helm:
      releaseName: postgresql
      values: |
        # PostgreSQL for Marketplace (Tesseract Hub)
        postgresql:
          database: marketplace_db
          username: postgres
          existingSecret: "postgresql-password"
          existingSecretKey: "postgresql-password"

        architecture: standalone

        primary:
          persistence:
            enabled: true
            storageClass: "standard-rwo"
            size: 100Gi
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 4Gi
          # Note: Database initialization is now handled by the initdb Job
          # which runs after PostgreSQL is ready and is idempotent

        service:
          type: ClusterIP
          port: 5432

        postgresqlConfiguration:
          max_connections: 500
          shared_buffers: 1GB
          effective_cache_size: 3GB
          work_mem: 16MB

        pdb:
          create: true
          minAvailable: 1

        metrics:
          enabled: true
          serviceMonitor:
            enabled: false

        # SSL/TLS Configuration - Uses K8s secret: postgresql-ssl-certs
        ssl:
          enabled: true
          existingSecret: "postgresql-ssl-certs"
  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql-marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
