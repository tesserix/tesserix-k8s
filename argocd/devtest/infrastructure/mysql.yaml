apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/mysql
    targetRevision: HEAD
    helm:
      releaseName: mysql
      values: |
        # MySQL DevTest Configuration
        replicaCount: 1

        image:
          repository: mysql
          tag: "8.0"
          pullPolicy: IfNotPresent

        # Credentials from sealed secret
        auth:
          existingSecret: "mysql-credentials"
          existingSecretRootKey: "root-password"

        # Databases for Postal and Mautic
        databases:
          - postal
          - mautic

        users:
          - name: postal
            database: postal
            existingSecret: "mysql-credentials"
            existingSecretPasswordKey: "postal-password"
            # Postal needs CREATE privilege for per-server message databases
            extraPrivileges:
              - "GRANT CREATE ON *.* TO 'postal'@'%'"
              - "GRANT ALL PRIVILEGES ON `postal_%`.* TO 'postal'@'%'"
          - name: mautic
            database: mautic
            existingSecret: "mysql-credentials"
            existingSecretPasswordKey: "mautic-password"

        # Storage
        persistence:
          enabled: true
          storageClass: "standard-rwo"
          size: 10Gi

        # Resources for devtest
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi

        # MySQL configuration
        config:
          maxConnections: 200
          characterSetServer: utf8mb4
          collationServer: utf8mb4_unicode_ci

        # Disable SealedSecret - use ExternalSecrets instead
        sealedSecret:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: email
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
