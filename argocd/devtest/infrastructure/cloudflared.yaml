apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    # Deploy after external-secrets is ready
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/infrastructure/cloudflared
    helm:
      releaseName: cloudflared
      valueFiles:
        - values.yaml
      values: |
        # DevTest environment overrides
        image:
          tag: "2026.2.0"

        # Tunnel configuration
        tunnel:
          existingSecret: "cloudflare-tunnel-token"
          existingSecretKey: "token"

        # ExternalSecrets configuration
        externalSecrets:
          enabled: true
          refreshInterval: "1h"
          secretStore: "gcp-secret-store"
          remoteKey: "devtest-cloudflare-tunnel-token"

        # Resources
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi

        # Autoscaling
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
