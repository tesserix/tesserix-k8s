apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/external-secrets
    helm:
      releaseName: external-secrets
      valueFiles:
        - values.yaml
      values: |
        # Override for devtest environment
        gcp:
          projectId: "tesseracthub-480811"
          serviceAccount:
            name: "external-secrets-sa"
            gcpServiceAccount: "external-secrets-sa@tesseracthub-480811.iam.gserviceaccount.com"
        environment: "devtest"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
