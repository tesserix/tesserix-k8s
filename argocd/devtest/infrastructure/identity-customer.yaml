apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-customer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/identity-customer
    targetRevision: HEAD
    helm:
      releaseName: identity-customer
      valueFiles:
        - values.yaml
      values: |
        # Password policy for tesserix-customer realm
        passwordPolicy: "length(8) and lowerCase(1) and upperCase(1) and digits(1) and specialChars(1)"

        # DevTest specific overrides
        keycloak:
          replicaCount: 2
          hostname: "devtest-customer-idp.tesserix.app"

          # Reduce resources for devtest
          resources:
            requests:
              memory: 768Mi
            limits:
              memory: 1536Mi

          # Disable autoscaling for devtest
          autoscaling:
            enabled: false

        # DISABLED: Using shared PostgreSQL in postgresql-global namespace
        keycloak-db:
          enabled: false

        # Database connection - Using shared PostgreSQL
        database:
          vendor: postgres
          host: "postgresql.postgresql-global.svc.cluster.local"
          port: 5432
          database: keycloak_customer
          username: postgres
          existingSecret: "keycloak-db-credentials"
          passwordKey: "password"

        # Redis - standalone for devtest
        keycloak-redis:
          architecture: standalone  # Use standalone instead of replication
          sentinel:
            enabled: false  # Must disable sentinel for standalone mode
          master:
            persistence:
              size: 2Gi
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 1Gi
          metrics:
            enabled: false  # Disable until image version is fixed

        # Admin SSO Configuration
        adminSSO:
          enabled: true
          googleCredentialsSecret: "keycloak-google-sso"
          facebookCredentialsSecret: "keycloak-facebook-sso"
          superAdmins:
            - "unidevidp@gmail.com"
            - "mahesh.sangawar@gmail.com"
            - "samyak.rout@gmail.com"
          disablePasswordLogin: false  # Keep password as break-glass

  destination:
    server: https://kubernetes.default.svc
    namespace: identity-customer
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
