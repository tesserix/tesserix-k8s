apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-auth-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: security
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/infrastructure/istio-auth-policies
    targetRevision: HEAD
    helm:
      releaseName: istio-auth-policies
      valueFiles:
        - values.yaml
      values: |
        # DevTest environment configuration
        environment: devtest

        # Istio Ingress Gateway
        ingressGateway:
          namespace: istio-ingress
          selector:
            istio: ingressgateway

        # Application namespaces
        appNamespaces:
          global: marketplace
          marketplace: marketplace

        # Keycloak IDP Configuration - DevTest
        # Dual IDP setup: customer (B2C) and internal (staff/admin)
        keycloak:
          customer:
            enabled: true
            issuer: "https://devtest-customer-idp.tesserix.app/realms/tesserix-customer"
            jwksUri: "https://devtest-customer-idp.tesserix.app/realms/tesserix-customer/protocol/openid-connect/certs"
            audiences:
              - "tesserix-api"
              - "mobile-app"
              - "web-storefront"
              - "admin-dashboard"
              - "account"
          internal:
            enabled: true
            issuer: "https://devtest-internal-idp.tesserix.app/realms/tesserix-internal"
            jwksUri: "https://devtest-internal-idp.tesserix.app/realms/tesserix-internal/protocol/openid-connect/certs"
            audiences:
              - "admin-web"
              - "admin-bff"
              - "marketplace-dashboard"
              - "marketplace-onboarding-admin"

        # Service mesh principals for internal communication
        meshPrincipals:
          - "cluster.local/ns/devtest/sa/*"
          - "cluster.local/ns/marketplace/sa/*"
          - "cluster.local/ns/identity-internal/sa/*"
          - "cluster.local/ns/identity-customer/sa/*"
          - "cluster.local/ns/identity/sa/*"
          - "cluster.local/ns/istio-ingress/sa/*"
          - "cluster.local/ns/istio-system/sa/*"
          - "cluster.local/ns/monitoring/sa/*"

        # mTLS mode - PERMISSIVE during migration
        mtls:
          mode: PERMISSIVE

        # Frontend apps - these need to be accessible without authentication
        # for initial page load (login page, static assets, etc.)
        # Note: All traffic to these hosts goes to Next.js apps which handle
        # both static content and BFF routes internally
        #
        # Using *.tesserix.app wildcard for tenant subdomains:
        # - Allows automated tenant onboarding without policy updates
        # - VirtualService routing controls which subdomains reach services
        # - Unknown subdomains get 404 from Istio (no matching route)
        frontendApps:
          - name: tenant-apps
            label: admin
            namespace: marketplace
            hosts:
              # Wildcard matches all subdomains - routing controls actual access
              - "*.tesserix.app"
          - name: keycloak-customer
            label: keycloak
            namespace: identity-customer
            hosts:
              - "devtest-customer-idp.tesserix.app"
          - name: keycloak-internal
            label: keycloak
            namespace: identity-internal
            hosts:
              - "devtest-internal-idp.tesserix.app"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
