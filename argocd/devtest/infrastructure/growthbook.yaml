apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: growthbook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: feature-flags
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/growthbook
    targetRevision: HEAD
    helm:
      releaseName: growthbook
      values: |
        # GrowthBook configuration for devtest environment
        replicaCount: 1

        image:
          repository: growthbook/growthbook
          tag: "latest"
          pullPolicy: Always

        # Service configuration
        service:
          type: ClusterIP
          appPort: 3000
          apiPort: 3100

        # Resource configuration for devtest
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi

        # GrowthBook environment configuration
        config:
          nodeEnv: "production"
          appOrigin: "https://dev-growthbook.tesserix.app"
          apiHost: "https://dev-growthbook.tesserix.app:443"
          uploadMethod: "local"
          disableTelemetry: true
          enableOpenFeature: true

        # Secrets reference
        secrets:
          jwtSecretName: "growthbook-secrets"
          jwtSecretKey: "jwt-secret"
          encryptionKeySecretName: "growthbook-secrets"
          encryptionKeyKey: "encryption-key"

        # MongoDB configuration
        mongodb:
          enabled: true
          image:
            repository: mongo
            tag: "7.0"
          auth:
            enabled: false
          persistence:
            enabled: true
            size: 8Gi
            storageClassName: standard-rwo
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi

        # Persistence for local uploads
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: standard-rwo

        # Extra environment variables for self-hosted setup
        extraEnv:
          - name: ALLOW_SELF_ORG_CREATION
            value: "true"
          - name: IS_MULTI_ORG
            value: "false"
          # Explicitly mark as self-hosted (not cloud)
          - name: IS_CLOUD
            value: "false"
          # Allow local authentication without SSO
          - name: AUTH_TYPE
            value: "local"
          # Enable unauthenticated API access for SDK
          - name: ALLOW_UNAUTHENTICATED_API
            value: "true"

        # Feature Seeding Configuration
        # Automatically creates all 34 feature flags on install/upgrade
        featureSeeding:
          enabled: true
          environment: "devtest"
          organizationName: "Tesserix"
          sdkConnectionName: "Tesserix Platform"
          sdkEnvironment: "production"
          adminEmail: "admin@tesserix.app"
          adminName: "Tesserix Admin"
          createAdminSecret: false
          adminPasswordSecret:
            name: "growthbook-admin-secret"
            key: "password"
          # SDK key is now managed by ExternalSecrets in marketplace namespace
          createSdkSecret: false
          image:
            repository: curlimages/curl
            tag: "8.5.0"
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: growthbook
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
