apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-internal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/identity-internal
    targetRevision: HEAD
    helm:
      releaseName: identity-internal
      valueFiles:
        - values.yaml
      values: |
        # Password policy for tesserix-internal realm
        passwordPolicy: "length(10) and lowerCase(1) and upperCase(1) and digits(1) and specialChars(1) and notUsername"

        # DevTest specific overrides
        keycloak:
          replicaCount: 1  # Single replica for devtest
          hostname: "devtest-internal-idp.tesserix.app"

          # Reduce resources for devtest
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi

          # Disable autoscaling for devtest
          autoscaling:
            enabled: false

          # PDB with maxUnavailable for single replica
          podDisruptionBudget:
            enabled: true
            maxUnavailable: 1

        # DISABLED: Using shared PostgreSQL in postgresql-global namespace
        keycloak-db:
          enabled: false

        # Redis - standalone for devtest
        keycloak-redis:
          architecture: standalone  # Use standalone instead of replication
          sentinel:
            enabled: false  # Must disable sentinel for standalone mode
          master:
            persistence:
              size: 1Gi
            resources:
              requests:
                memory: 128Mi
              limits:
                memory: 512Mi
          replica:
            replicaCount: 0  # No replicas in standalone mode
          metrics:
            enabled: false  # Disable until image version is fixed

        # Disable admin SSO for devtest internal realm
        adminSSO:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: identity-internal
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
