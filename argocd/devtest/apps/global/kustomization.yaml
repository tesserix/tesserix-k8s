apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Global Namespace - Shared Platform Services
# These services are used by ALL applications.
#
# The legacy mark8ly per-microservice apps (auth-bff, tenant-service,
# tenant-router-service, location-service, verification-service,
# notification-service, notification-hub, settings-service,
# subscription-service, audit-service, document-service, tickets-service,
# feature-flags-service, qr-service, status-dashboard-service,
# translation-service, search-service) were removed when the legacy
# stack was retired. The new mark8ly v2 stack lives under its own
# `mark8ly` namespace and is wired via argocd/devtest/apps/mark8ly/.

resources:
  # Secrets are now managed by External Secrets Operator
  # See: external-secrets/devtest/ for ExternalSecret resources

  # Company Website (Tesserix Homepage & Admin Portal)
  - company.yaml

  # Translation pipeline (still active)
  - bergamot-service.yaml
  - huggingface-mt-service.yaml

  # Shared infra
  - secret-provisioner.yaml
  - yes-hospital.yaml
