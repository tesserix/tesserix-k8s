  # See: external-secrets/devtest/ for ExternalSecret resources
  # Company Website (Tesserix Homepage & Admin Portal)
  - company.yaml
  # Services (auth-service removed - using Keycloak for authentication)
  - tenant-service.yaml
  - tenant-router-service.yaml
  - notification-service.yaml
  - notification-hub.yaml
  - verification-service.yaml
  - settings-service.yaml
  - location-service.yaml
  - translation-service.yaml
  - bergamot-service.yaml
  - huggingface-mt-service.yaml
  - search-service.yaml
  - audit-service.yaml
  - feature-flags-service.yaml
  - document-service.yaml
  - qr-service.yaml
  - status-dashboard-service.yaml
  - subscription-service.yaml
  - secret-provisioner.yaml
  - yes-hospital.yaml
