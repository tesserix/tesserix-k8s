apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status-dashboard-service
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-devtest:status-dashboard-service-dev
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/status-dashboard-service
    helm:
      valueFiles:
      - values.yaml
      - ../global-config.yaml
      parameters:
      - name: image.tag
        value: latest
      - name: gcp.workloadIdentity.gcpServiceAccount
        value: app-secrets-marketplace@tesseracthub-480811.iam.gserviceaccount.com
      # Dynamic namespace configuration - override for different environments (devtest, prod, pilot)
      - name: env.SERVICES_NAMESPACE
        value: marketplace
      - name: gcp.secretManager.secretPrefix
        value: devtest
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
