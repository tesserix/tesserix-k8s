apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yes-hospital
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: frontend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/yes-hospital
    helm:
      valueFiles:
      - values.yaml
      parameters:
      - name: image.tag
        value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: yes-hospital
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
