apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-provisioner
  namespace: argocd
  labels:
    app.kubernetes.io/name: secret-provisioner
    app.kubernetes.io/part-of: tesserix
    environment: devtest
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/global-services/secret-provisioner
    helm:
      valueFiles:
      - values.yaml
      values: |
        # DevTest environment overrides
        replicaCount: 1

        image:
          repository: ghcr.io/tesserix/global-services/secret-provisioner
          tag: latest

        # Environment configuration
        env:
          SERVER_PORT: "8080"
          LOG_LEVEL: "debug"
          LOG_FORMAT: "json"

        # Database configuration - uses shared tesseract_hub database
        database:
          host: "postgresql.postgresql-marketplace.svc.cluster.local"
          port: "5432"
          name: "tesseract_hub"
          user: "postgres"
          sslmode: "require"

        # GCP configuration for devtest
        gcp:
          projectId: "tesseracthub-480811"
          workloadIdentity:
            gcpServiceAccount: "secret-provisioner-sa@tesseracthub-480811.iam.gserviceaccount.com"
          secretManager:
            secretPrefix: "devtest"

        # Authorized services that can call the Secret Provisioner API
        authorizedServices:
          - admin-bff
          - payment-service
          - shipping-service
          - tenant-onboarding

        # KEDA autoscaling disabled for devtest
        keda:
          enabled: false

        # PDB disabled for devtest (single replica)
        pdb:
          enabled: false

        # VPA disabled for devtest
        vpa:
          enabled: false
      parameters:
      - name: gcp.workloadIdentity.gcpServiceAccount
        value: secret-provisioner-sa@tesseracthub-480811.iam.gserviceaccount.com
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
