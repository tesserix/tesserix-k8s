apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# tesserix-social — devtest cluster apps.
#
# Order matters at first activation: postgres → external-secrets → auth-bff
# (with migrate init container) → platform-api (also with migrate) →
# reports-agent → web. ArgoCD's syncWaves can enforce this; for v1 the
# resources-finalizer + automated retry handle the race.

resources:
  - postgres.yaml
  - auth-bff.yaml
  - platform-api.yaml
  - reports-agent.yaml
  - web.yaml
