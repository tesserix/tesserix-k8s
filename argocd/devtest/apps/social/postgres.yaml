apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: social-postgres
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-social
    app.kubernetes.io/component: database
    environment: devtest
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: social
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/social/postgres
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: social
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
