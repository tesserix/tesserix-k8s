apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bka-report-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: bookkeeping-app
    app.kubernetes.io/component: backend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/bookkeeping-report-service
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: main
        - name: database.host
          value: postgresql.postgresql-bookkeeping.svc.cluster.local
  destination:
    server: https://kubernetes.default.svc
    namespace: bookkeeping
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
