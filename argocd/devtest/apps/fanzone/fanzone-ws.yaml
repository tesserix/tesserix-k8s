apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanzone-ws
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: fanzone-devtest:fanzone-ws-dev
  labels:
    app.kubernetes.io/part-of: fanzone-battle-ground
    app.kubernetes.io/component: websocket
    environment: devtest
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/fanzone-ws
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: fanzone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
