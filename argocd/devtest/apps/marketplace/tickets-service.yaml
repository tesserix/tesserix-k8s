apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tickets-service
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-devtest:tickets-service-dev
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: backend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/tickets-service
    helm:
      valueFiles:
      - values.yaml
      - ../global-config.yaml
      parameters:
      - name: image.tag
        value: latest
      - name: database.host
        value: postgresql.postgresql-marketplace.svc.cluster.local
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
