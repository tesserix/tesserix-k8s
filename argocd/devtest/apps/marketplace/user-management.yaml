apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-management
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-devtest:user-management-dev
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: mfe
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/user-management
    helm:
      valueFiles:
      - values.yaml
      - ../global-config.yaml
      parameters:
      - name: image.tag
        value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
