apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketplace-db-schema-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: marketplace-db-schema-bootstrap
      parameters:
        - name: app
          value: marketplace
      valueFiles:
        - values.yaml
        - values-devtest.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
