apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-devtest:admin-dev
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: frontend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/admin
    helm:
      valueFiles:
      - values.yaml
      - ../global-config.yaml
      parameters:
      - name: image.tag
        value: latest
      - name: env.REDIS_HOST
        value: redis.redis-marketplace.svc.cluster.local
      - name: ingress.hosts[0].host
        value: dev-admin.tesserix.app
      - name: env.CATEGORIES_SERVICE_URL
        value: http://categories-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.PRODUCTS_SERVICE_URL
        value: http://products-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.ORDERS_SERVICE_URL
        value: http://orders-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.VENDORS_SERVICE_URL
        value: http://vendor-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.STAFF_SERVICE_URL
        value: http://staff-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.CUSTOMERS_SERVICE_URL
        value: http://customers-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.REVIEWS_SERVICE_URL
        value: http://reviews-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.COUPONS_SERVICE_URL
        value: http://coupons-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.TICKETS_SERVICE_URL
        value: http://tickets-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.INVENTORY_SERVICE_URL
        value: http://inventory-service.marketplace.svc.cluster.local:8088/api/v1
      - name: env.PAYMENTS_SERVICE_URL
        value: http://payment-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.TAX_SERVICE_URL
        value: http://tax-service.marketplace.svc.cluster.local:8091/api/v1
      - name: env.ANALYTICS_SERVICE_URL
        value: http://analytics-service.marketplace.svc.cluster.local:8092/api/v1
      - name: env.MARKETING_SERVICE_URL
        value: http://marketing-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.GIFT_CARDS_SERVICE_URL
        value: http://gift-cards-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.SETTINGS_SERVICE_URL
        value: http://settings-service.marketplace.svc.cluster.local:8085/api/v1
      - name: env.LOCATION_SERVICE_URL
        value: http://location-service.marketplace.svc.cluster.local:8080
      - name: env.DOCUMENT_SERVICE_URL
        value: http://document-service.marketplace.svc.cluster.local:8080
      - name: env.TENANT_SERVICE_URL
        value: http://tenant-service.marketplace.svc.cluster.local:8080
      # Auth BFF for session management and token retrieval
      - name: env.AUTH_BFF_URL
        value: http://auth-bff.marketplace.svc.cluster.local:8080
      - name: env.AUTH_BFF_INTERNAL_URL
        value: http://auth-bff.marketplace.svc.cluster.local:8080
      - name: env.APPROVAL_SERVICE_URL
        value: http://approval-service.marketplace.svc.cluster.local:8099/api/v1
      - name: env.NEXT_PUBLIC_BASE_DOMAIN
        value: tesserix.app
      # OpenPanel Analytics (client ID injected from K8s Secret by openpanel-project-init Job)
      - name: env.NEXT_PUBLIC_OPENPANEL_ENABLED
        value: "true"
      - name: env.NEXT_PUBLIC_OPENPANEL_API_URL
        value: "https://dev-analytics.tesserix.app"
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
