apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-devtest:payment-service-dev
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: backend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/payment-service
    helm:
      valueFiles:
      - values.yaml
      - ../global-config.yaml
      parameters:
      - name: image.tag
        value: latest
      - name: database.host
        value: postgresql.postgresql-marketplace.svc.cluster.local
      - name: env.ORDERS_SERVICE_URL
        value: http://orders-service.marketplace.svc.cluster.local:8080
      - name: env.CUSTOMERS_SERVICE_URL
        value: http://customers-service.marketplace.svc.cluster.local:8080
      # Secret Provisioner integration for dynamic payment credentials
      - name: env.SECRET_PROVISIONER_URL
        value: http://secret-provisioner.marketplace.svc.cluster.local:8080
      - name: env.GCP_PROJECT_ID
        value: tesseracthub-480811
      - name: env.ENVIRONMENT
        value: devtest
      - name: env.USE_DYNAMIC_CREDENTIALS
        value: "true"
      values: |
        # Disable SealedSecrets - use ExternalSecrets/dynamic credentials instead
        paypal:
          sealedSecret:
            enabled: false
        stripe:
          sealedSecret:
            enabled: false
        razorpay:
          sealedSecret:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
