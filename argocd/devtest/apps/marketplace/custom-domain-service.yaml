apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-domain-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: backend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/custom-domain-service
    helm:
      valueFiles:
      - values.yaml
      values: |
        image:
          tag: main

        config:
          ginMode: debug

        database:
          host: postgresql.postgresql-marketplace.svc.cluster.local
          name: custom_domains_db
          sslMode: require
          existingSecret: postgresql-password
          existingSecretKey: postgres-password

        redis:
          host: redis.redis-marketplace.svc.cluster.local
          existingSecret: redis
          existingSecretKey: redis-password

        keycloak:
          adminUrl: http://keycloak.identity-customer.svc.cluster.local:8080
          existingSecret: keycloak-admin-credentials
          existingSecretKey: clientSecret
          clientId: custom-domain-admin

        istio:
          gatewayName: custom-domains-gateway
          # Use istio-ingress namespace where custom-ingressgateway is deployed
          gatewayNamespace: istio-ingress
          vsNamespace: marketplace

        dns:
          verificationDomain: devtest.tesserix.app
          proxyDomain: proxy.devtest.tesserix.app
          # LoadBalancer IP is now dynamically fetched from K8s API
          # Empty value = use dynamic fetching from custom-ingressgateway service
          proxyIP: ""

        # CNAME Delegation for automatic SSL certificate management via DNS-01
        cnameDelegation:
          enabled: true
          acmeZone: "acme.tesserix.app"
          verificationInterval: "5m"
          maxAttempts: 100

        ssl:
          issuerName: letsencrypt-staging
          issuerKind: ClusterIssuer

        tenant:
          serviceUrl: http://tenant-service.marketplace.svc.cluster.local:8080

        # Cloudflare Tunnel for custom domains
        # SSL is handled by Cloudflare's edge, no cert-manager needed
        cloudflare:
          enabled: true
          tunnelId: "30a5a0e4-f621-4082-9dde-34f1eed8e8ab"
          accountId: "6fe6e1aa18c221b529ce76c9631ba4e0"
          originService: "http://istio-ingressgateway.istio-ingress.svc.cluster.local:80"
          existingSecret: cloudflare-tunnel-api-token
          existingSecretKey: api-token

        resources:
          limits:
            memory: 512Mi
          requests:
            memory: 128Mi

        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 3

        replicaCount: 1

        externalSecrets:
          enabled: true
          refreshInterval: 1h
          secretStore: gcp-secret-store
          gcpSecrets:
            postgresqlPassword: devtest-marketplace-postgresql-password
            # Note: redis secret is managed by external-secrets-resources, not here
            keycloakClientSecret: devtest-keycloak-customer-admin-client-secret
            cloudflareApiToken: devtest-cloudflare-tunnel-api-token

  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
