apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staff-service
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-devtest:staff-service-dev
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: backend
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/staff-service
    helm:
      valueFiles:
      - values.yaml
      - ../global-config.yaml
      parameters:
      - name: image.tag
        value: latest
      - name: database.host
        value: postgresql.postgresql-marketplace.svc.cluster.local
      - name: migrations.enabled
        value: "false"
      # RBAC Role Sync Configuration - Critical for Keycloak role synchronization
      # These settings ensure Keycloak realm roles are synced to staff-service RBAC database
      - name: env.RBAC_AUTO_SYNC_ROLES
        value: "true"
      - name: env.RBAC_SYNC_CACHE_TTL
        value: "300"
      - name: env.RBAC_SEED_DEFAULT_ROLES
        value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
