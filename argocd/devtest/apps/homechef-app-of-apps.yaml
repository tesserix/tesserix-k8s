apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-homechef
    app.kubernetes.io/component: food
    environment: devtest
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/devtest/apps/homechef
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
