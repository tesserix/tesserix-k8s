apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-api
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: homechef-devtest:homechef-api-dev
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: backend
    environment: devtest
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/homechef-api
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: latest
        - name: ingress.hosts[0].host
          value: dev-homechef.tesserix.app
        - name: env.DATABASE_HOST
          value: postgresql.postgresql.svc.cluster.local
        - name: env.REDIS_HOST
          value: global-valkey-cache.global.svc.cluster.local
        - name: env.NATS_URL
          value: nats://nats.nats.svc.cluster.local:4222
        - name: env.CORS_ORIGINS
          value: https://dev-homechef.tesserix.app
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
