apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DevTest Applications - Multi-Namespace App of Apps Pattern
# Each namespace has its own app-of-apps that manages services within that namespace

resources:
  # Global Services - Shared Platform Services (16 services)
  # Authentication, tenant management, notifications, etc.
  - global-app-of-apps.yaml

  # Marketplace - E-commerce Platform (27 services)
  # Products, orders, customers, vendors, etc.
  # - marketplace-app-of-apps.yaml  # Disabled — scaling down to reduce cluster costs

  # HMS - Hospital Management System (12 services)
  # Patient management, appointments, billing, etc.
  # - hms-app-of-apps.yaml  # Disabled

  # FanZone - Sports/Gaming Platform (6 services)
  # Sports data, fan engagement, etc.
  # - fanzone-app-of-apps.yaml  # Disabled

  # HomeChef - Food Platform (3 services)
  # Home chef and food delivery services
  # - homechef-app-of-apps.yaml  # Disabled

  # Bookkeeping - Accounting Platform (8 services)
  # Invoicing, tax, reporting, etc.
  # - bookkeeping-app-of-apps.yaml  # Disabled - pending GCP secrets integration

  # Blog - Engineering Blog (2 services)
  # tesserix-blog app + dedicated mongodb-blog
  - blog-app-of-apps.yaml
