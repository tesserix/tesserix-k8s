apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.2
    helm:
      releaseName: sealed-secrets
      values: |
        # Namespace for sealed-secrets controller
        namespace: kube-system

        # Controller configuration
        controller:
          # Create the controller
          create: true

        # Resource limits (required for AKS Azure Policy)
        resources:
          requests:
            cpu: null
            memory: 64Mi
          limits:
            cpu: null
            memory: 256Mi

        # Service account
        serviceAccount:
          create: true
          name: sealed-secrets-controller

        # RBAC
        rbac:
          create: true

        # Metrics
        metrics:
          serviceMonitor:
            enabled: false

        # Secret rotation
        secretRotation:
          enabled: false

        # Key renewal period (30 days)
        keyrenewperiod: "720h"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
