---
# Keycloak Identity Provider Secrets
# These are placeholder secrets - replace encrypted values with actual credentials
# To update: kubectl create secret ... --dry-run=client -o yaml | kubeseal ...

# =============================================================================
# SOCIAL IDENTITY PROVIDERS
# =============================================================================

# Google OAuth2 Client Secret
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-idp-google
  namespace: identity
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
spec:
  encryptedData:
    # To update: KUBECONFIG=~/.kube/gke-devtest kubectl create secret generic keycloak-idp-google --namespace=identity --from-literal=client-secret='YOUR_GOOGLE_CLIENT_SECRET' --dry-run=client -o yaml | kubeseal ...
    client-secret: 
  template:
    metadata:
      name: keycloak-idp-google
      namespace: identity
