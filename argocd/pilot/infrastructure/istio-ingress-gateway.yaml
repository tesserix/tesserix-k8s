apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.29.1
    helm:
      releaseName: istio-ingress
      values: |
        # Gateway name
        name: istio-ingressgateway

        # Revision for canary upgrades
        revision: ""

        # Service configuration
        service:
          # Type of service (LoadBalancer for external access)
          type: LoadBalancer
          # CRITICAL: Preserve client IP - without this, all IPs show as internal cluster IPs
          externalTrafficPolicy: Local

          # Ports configuration
          ports:
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            - name: http2
              port: 80
              protocol: TCP
              targetPort: 80
            - name: https
              port: 443
              protocol: TCP
              targetPort: 443
            - name: tcp
              port: 31400
              protocol: TCP
              targetPort: 31400
            - name: tls
              port: 15443
              protocol: TCP
              targetPort: 15443

          # Annotations for cloud load balancer
          annotations:
            # For Azure AKS
            service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz/ready
            # External DNS annotation
            external-dns.alpha.kubernetes.io/hostname: "*.tesserix.app"

          # Load balancer source ranges (restrict access if needed)
          # loadBalancerSourceRanges:
          #   - 10.0.0.0/8

        # Resource configuration (required for AKS Azure Policy)
        resources:
          requests:
            cpu: null
            memory: 128Mi
          limits:
            cpu: null
            memory: 512Mi

        # Auto-scaling configuration
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          # CPU target nulled: the chart defaults it to 80, and with no cpu
          # request the metric reads <unknown> so the HPA never scales.
          targetCPUUtilizationPercentage: null
          targetMemoryUtilizationPercentage: 80

        # Pod disruption budget
        # Use maxUnavailable instead of minAvailable to allow node drains with single replica
        podDisruptionBudget:
          maxUnavailable: 1

        # Service account
        serviceAccount:
          create: true
          name: istio-ingressgateway

        # Pod annotations
        podAnnotations:
          # Prometheus scraping
          prometheus.io/scrape: "true"
          prometheus.io/port: "15020"
          prometheus.io/path: "/stats/prometheus"

        # Security context
        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true

        # Container security context
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        # Labels for the gateway pods
        labels:
          app: istio-ingressgateway
          istio: ingressgateway

        # Topology spread constraints for HA
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: istio-ingressgateway
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
