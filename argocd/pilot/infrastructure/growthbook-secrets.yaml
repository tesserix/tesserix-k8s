---
# GrowthBook Secrets - JWT authentication and data encryption
# Sealed using kubeseal with the cluster's sealed-secrets certificate
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: growthbook-secrets
  namespace: growthbook
spec:
  encryptedData:
    encryption-key: 
    jwt-secret: 
  template:
    metadata:
      name: growthbook-secrets
      namespace: growthbook
    type: Opaque
