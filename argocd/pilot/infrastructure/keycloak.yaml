apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/keycloak
    targetRevision: HEAD
    helm:
      releaseName: keycloak
      values: |
        # Keycloak DevTest Configuration
        replicaCount: 1

        image:
          repository: quay.io/keycloak/keycloak
          tag: "24.0"
          pullPolicy: IfNotPresent

        # Keycloak Configuration
        keycloak:
          hostname: "dev-auth.tesserix.app"
          proxy: "edge"
          httpEnabled: "true"
          httpPort: 8080
          httpsPort: 8443
          hostnameStrict: "false"
          hostnameStrictHttps: "false"
          healthEnabled: "true"
          metricsEnabled: "true"
          logLevel: "INFO"
          logFormat: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n"
          javaOpts: "-Xms512m -Xmx1024m"

          # Admin credentials (use sealed secret)
          admin:
            username: admin
            existingSecret: "keycloak-admin-password"
            existingSecretKey: "admin-password"

          # Cache configuration
          # Note: Redis cache store is not natively supported in Keycloak 24
          # Using database-backed sessions via persistent-user-sessions feature
          cache:
            stack: "local"
            redis:
              enabled: false

          # Features to enable
          features:
            - "token-exchange"
            - "admin-fine-grained-authz"
            - "preview"

        # Database configuration
        database:
          vendor: "postgres"
          host: "postgresql.database.svc.cluster.local"
          port: "5432"
          database: "keycloak"
          username: "keycloak"
          existingSecret: "keycloak-db-password"
          existingSecretKey: "password"
          poolInitialSize: "5"
          poolMinSize: "5"
          poolMaxSize: "20"

        # Service configuration
        service:
          type: ClusterIP
          port: 80
          httpsPort: 443
          annotations: {}

        # Ingress configuration with Kong
        ingress:
          enabled: true
          className: "kong"
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            konghq.com/protocols: "https"
            konghq.com/https-redirect-status-code: "301"
          hosts:
            - host: "dev-auth.tesserix.app"
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: keycloak-tls
              hosts:
                - "dev-auth.tesserix.app"
          certManager:
            clusterIssuer: "letsencrypt-prod"

        # Resource configuration
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi

        # Health probes
        livenessProbe:
          enabled: true
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          enabled: true
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        startupProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1

        # Autoscaling (disabled for devtest)
        autoscaling:
          enabled: false

        # Pod disruption budget (disabled for devtest)
        podDisruptionBudget:
          enabled: false

        # Network policy
        networkPolicy:
          enabled: false

        # Service account
        serviceAccount:
          create: true
          annotations: {}

        # Pod security context
        podSecurityContext:
          fsGroup: 1000

        # Container security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
