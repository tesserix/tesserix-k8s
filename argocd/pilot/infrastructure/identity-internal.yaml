apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-internal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/identity-internal
    targetRevision: HEAD
    helm:
      releaseName: identity-internal
      valueFiles:
        - values.yaml
      values: |
        # DevTest specific overrides
        keycloak:
          replicaCount: 2
          hostname: "devtest-internal-idp.tesserix.app"

          # Reduce resources for devtest
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi

          # Disable autoscaling for internal (always fixed)
          autoscaling:
            enabled: false

        # PostgreSQL - smaller for devtest/internal
        keycloak-db:
          primary:
            persistence:
              size: 10Gi
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 1Gi
          readReplicas:
            replicaCount: 1
            persistence:
              size: 10Gi
          metrics:
            enabled: false  # Disable until image version is fixed

        # Redis - standalone for devtest/internal
        keycloak-redis:
          architecture: standalone  # Use standalone instead of replication
          sentinel:
            enabled: false  # Must disable sentinel for standalone mode
          master:
            persistence:
              size: 1Gi
            resources:
              requests:
                memory: 128Mi
              limits:
                memory: 512Mi
          metrics:
            enabled: false  # Disable until image version is fixed

        # Admin SSO Configuration
        adminSSO:
          enabled: true
          googleCredentialsSecret: "keycloak-google-sso"
          superAdmins:
            - "unidevidp@gmail.com"
            - "mahesh.sangawar@gmail.com"
            - "samyak.rout@gmail.com"
          disablePasswordLogin: false  # Keep password as break-glass

  destination:
    server: https://kubernetes.default.svc
    namespace: identity-internal
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
