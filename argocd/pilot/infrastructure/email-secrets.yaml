# MySQL Credentials for Postal and Mautic
# Regenerated with proper base64 encoding
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mysql-credentials
  namespace: email
spec:
  encryptedData:
    mautic-password: 
    postal-password: 
    root-password: 
  template:
    metadata:
      name: mysql-credentials
      namespace: email
---
# RabbitMQ Credentials for Postal
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rabbitmq-credentials
  namespace: email
spec:
  encryptedData:
    erlang-cookie: 
    password: 
  template:
    metadata:
      name: rabbitmq-credentials
      namespace: email
---
# Postal Credentials (secret-key and signing-key)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postal-credentials
  namespace: email
spec:
  encryptedData:
    secret-key: 
    signing-key: 
  template:
    metadata:
      name: postal-credentials
      namespace: email
---
# Mautic Admin Credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mautic-credentials
  namespace: email
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: mautic-credentials
      namespace: email
