apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pilot Infrastructure - Pre-production environment
# Enables most production features for validation testing
resources:
  # Certificate Management
  - cert-manager.yaml
  - cert-manager-secrets.yaml
  - cert-manager-issuers.yaml

  # Sealed Secrets (secrets management)
  - sealed-secrets.yaml

  # DNS Management
  - external-dns-secrets.yaml
  - external-dns.yaml

  # Service Mesh (Istio)
  - istio-base.yaml
  - istio-istiod.yaml
  - istio-ingress-gateway.yaml
  - istio-egress-gateway.yaml
  - istio-config.yaml
  - kiali.yaml

  # Database - Per-namespace PostgreSQL instances
  # postgresql-marketplace removed with the legacy mark8ly stack — the
  # new mark8ly v2 platform-api uses CloudNativePG via the mark8ly
  # app-of-apps under mark8ly-postgres.
  - postgresql-global.yaml
  # - postgresql-hms.yaml       # Enable when HMS is ready
  # - postgresql-fanzone.yaml   # Enable when FanZone is ready
  # - postgresql-homechef.yaml  # Enable when HomeChef is ready

  # Identity Platform (Customer Keycloak only - internal IDP disabled)
  - keycloak-secrets.yaml
  - keycloak-idp-secrets.yaml
  - keycloak.yaml
  - identity-customer.yaml
  # - identity-internal.yaml  # Disabled - using only identity-customer

  # Messaging (NATS)
  - nats.yaml

  # Monitoring Stack (enabled for pilot)
  - prometheus-operator-crds.yaml
  - prometheus.yaml
  - monitoring-secrets.yaml
  - grafana.yaml

  # Autoscaling (KEDA)
  - keda.yaml

  # Logging Stack (removed — unused, all components were scaled to 0)
  # - logging-secrets.yaml
  # - elasticsearch.yaml
  # - kibana.yaml
  # - fluent-bit.yaml

  # Feature Flags (GrowthBook)
  - growthbook-secrets.yaml
  - growthbook.yaml

  # Search Engine (Typesense)
  - typesense-secrets.yaml
  - typesense.yaml

  # OSRM (Open Source Routing Machine)
  - osrm.yaml

  # Translation Infrastructure (LibreTranslate)
  - libretranslate.yaml

  # API Documentation (Swagger UI - enabled for pilot testing)
  - swagger-ui.yaml
