apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: email
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/postal
    targetRevision: HEAD
    helm:
      releaseName: postal
      values: |
        # Postal DevTest Configuration
        replicaCount: 1

        image:
          repository: ghcr.io/postalserver/postal
          tag: "latest"
          pullPolicy: Always

        # Postal hostnames
        postal:
          webHostname: "dev-postal.tesserix.app"
          smtpHostname: "smtp.tesserix.app"

        # Database configuration (MySQL in email namespace)
        database:
          host: "mysql.email.svc.cluster.local"
          port: "3306"
          database: "postal"
          username: "postal"
          existingSecret: "mysql-credentials"
          existingSecretPasswordKey: "postal-password"
          poolSize: 5

        messageDatabase:
          host: "mysql.email.svc.cluster.local"
          port: "3306"
          prefix: "postal"
          username: "postal"
          existingSecret: "mysql-credentials"
          existingSecretPasswordKey: "postal-password"

        # RabbitMQ configuration
        rabbitmq:
          host: "rabbitmq.email.svc.cluster.local"
          port: "5672"
          vhost: "postal"
          username: "postal"
          existingSecret: "rabbitmq-credentials"
          existingSecretPasswordKey: "password"

        # SMTP server configuration
        smtp:
          enabled: true
          port: 25

        # DNS configuration
        dns:
          mxRecords:
            - "smtp.tesserix.app"
          spfInclude: "spf.postal.tesserix.app"
          returnPathDomain: "rp.postal.tesserix.app"
          routeDomain: "routes.postal.tesserix.app"
          trackDomain: "track.postal.tesserix.app"

        # Web service
        web:
          service:
            type: ClusterIP
            port: 5000

        # SMTP service
        smtpService:
          type: ClusterIP
          port: 25

        # Credentials
        credentials:
          existingSecret: "postal-credentials"
          secretKeySecretKey: "secret-key"
          signingKeySecretKey: "signing-key"

        # SMTP Relay Configuration - Use AWS SES
        relay:
          enabled: true
          provider: "ses"  # Use AWS SES SMTP instead of SendGrid
          ses:
            host: "email-smtp.ap-south-1.amazonaws.com"
            port: 587
            username: "AKIAQ4IPRTEL63ZSGOPD"
            existingSecret: "ses-smtp-credentials"
            existingSecretPasswordKey: "SES_SMTP_PASSWORD"
            sealedSecret:
              enabled: false  # Using existing secret created separately

        # Resources for devtest
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi

        # Storage
        persistence:
          enabled: true
          storageClass: "standard-rwo"
          size: 5Gi

        # Worker
        worker:
          enabled: true
          replicaCount: 1
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi

        # Cron
        cron:
          enabled: true

        # Init containers for database setup
        initContainers:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: email
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
