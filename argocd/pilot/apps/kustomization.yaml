apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pilot Applications - Multi-Namespace App of Apps Pattern
# Each namespace has its own app-of-apps that manages services within that namespace

resources:
  # Global Services - Shared Platform Services
  # Authentication, tenant management, notifications, etc.
  - global-app-of-apps.yaml

  # Bookkeeping - Accounting Platform
  # Invoicing, tax, reporting, etc.

  # HMS - Hospital Management System
  # Patient management, appointments, billing, etc.
  # - hms-app-of-apps.yaml  # Enable when ready

  # FanZone - Sports/Gaming Platform
  # - fanzone-app-of-apps.yaml  # Enable when ready

  # HomeChef - Food Platform
  # - homechef-app-of-apps.yaml  # Enable when ready
