apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  labels:
    product: mark8ly
    environment: prod
    component: database-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/cloudnative-pg
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  # K8s 1.36+ surfaces .status.terminatingReplicas on Deployments/StatefulSets,
  # which ArgoCD's structured-merge-diff can't yet build a typed value for —
  # producing a ComparisonError that blocks the whole app from syncing. That
  # left the operator's MutatingWebhookConfiguration unapplied, so the CNPG
  # operator crash-looped ("unable to setup PKI infrastructure ... not found")
  # and no new CNPG clusters could be provisioned. Ignore the field so the diff
  # succeeds and the app syncs.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
