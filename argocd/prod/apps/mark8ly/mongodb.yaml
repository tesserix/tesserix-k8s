apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mark8ly-mongodb
  namespace: argocd
  annotations:
    # Sync wave before otto — otto won't boot until the Mongo StatefulSet
    # is accepting connections.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    product: mark8ly
    environment: prod
    component: database
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mark8ly-mongodb
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mark8ly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
