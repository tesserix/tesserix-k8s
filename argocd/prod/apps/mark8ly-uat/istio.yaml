apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mark8ly-uat-istio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    product: mark8ly
    environment: uat
    component: istio
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mark8ly-uat-istio
  destination:
    server: https://kubernetes.default.svc
    namespace: mark8ly-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
