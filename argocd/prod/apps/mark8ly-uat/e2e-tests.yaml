# Argo CD Application that hosts the UAT Playwright e2e Job. Kargo's
# smoke Stage is authorized to mutate this App's image.tag (via the
# kargo.akuity.io/authorized-stage annotation), so each smoke promotion
# triggers a fresh Job run with the latest test image.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mark8ly-uat-e2e-tests
  namespace: argocd
  annotations:
    # Smoke Stage's argocd-update step writes a new image.tag here on
    # every promotion. Without this annotation Kargo refuses to mutate.
    kargo.akuity.io/authorized-stage: kargo-mark8ly:smoke
    # argocd-notifications subscription. The on-mark8ly-uat-smoke-failed
    # trigger fires when this App's operationState.phase is Failed/Error
    # — i.e. the e2e Job exited non-zero past backoffLimit. Posts to
    # #mark8ly-smoke-test-verification via the slack-token Secret synced
    # from prod-argocd-notifications-slack-token in GCP SM.
    notifications.argoproj.io/subscribe.on-mark8ly-uat-smoke-failed.slack: mark8ly-smoke-test-verification
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: e2e-tests
    environment: uat
    product: mark8ly
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mark8ly-uat-e2e-tests
    helm:
      releaseName: mark8ly-uat-e2e-tests
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mark8ly-uat
  ignoreDifferences:
    # Kargo writes image.tag here on each smoke promotion.
    - group: ""
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false        # mark8ly-uat namespace already exists
      - RespectIgnoreDifferences=true
    # Argo CD sync retries are NOT useful here: the e2e Job has its own
    # backoffLimit (2 reruns / 3 attempts) at the workload layer. Once
    # the Job exhausts that, recreating it via another sync will just
    # produce the same failure. Setting limit: 0 means Argo CD reports
    # the failure to Kargo immediately on the first sync attempt — no
    # 6+ minute Argo retry loop hiding the result.
    retry:
      limit: 0
