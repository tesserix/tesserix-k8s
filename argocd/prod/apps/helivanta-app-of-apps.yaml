apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helivanta-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: helivanta-services
    environment: prod
spec:
  project: helivanta
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/helivanta
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kargo owns workload image overrides; Git owns the dedicated GrowthBook pins.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      namespace: argocd
      name: helivanta-growthbook
      jsonPointers:
        - /spec/source/targetRevision
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - select(.metadata.name != "helivanta-growthbook") | .spec.source.helm.parameters
    # Kargo pins each promoted chart to its Freight's tesserix-k8s commit.
    - group: argoproj.io
      kind: Application
      namespace: argocd
      name: helivanta-api
      jsonPointers:
        - /spec/source/targetRevision
    - group: argoproj.io
      kind: Application
      namespace: argocd
      name: helivanta-global-api
      jsonPointers:
        - /spec/source/targetRevision
    - group: argoproj.io
      kind: Application
      namespace: argocd
      name: helivanta-shell
      jsonPointers:
        - /spec/source/targetRevision
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
