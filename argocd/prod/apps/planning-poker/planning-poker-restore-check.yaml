apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planning-poker-restore-check
  namespace: argocd
spec:
  project: planning-poker
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: manifests/planning-poker-restore-check
  destination:
    server: https://kubernetes.default.svc
    namespace: planning-poker
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
