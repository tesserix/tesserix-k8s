apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planning-poker-postgres
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: planning-poker
    app.kubernetes.io/component: database
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: planning-poker
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/planning-poker-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: planning-poker
  syncPolicy:
    automated:
      # No prune: an accidental path or name change would take the Cluster with
      # it, and with it the PVCs. Deletions here are deliberate, by hand.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
