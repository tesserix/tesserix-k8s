apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-database-namespace
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-database
    app.kubernetes.io/component: namespace
    environment: prod
  annotations:
    # Namespace, mesh policy and NetworkPolicies must exist before Qdrant.
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-database
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/ai-database-namespace
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
