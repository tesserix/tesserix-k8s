apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-registry-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: registry-bootstrap
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Runs AFTER the agentic control planes (aregistry / agentgateway /
    # kagent — all in infrastructure/ at waves -5/-4/-3). Sync wave 5
    # is well past those.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-registry-bootstrap
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - Replace=true   # let the new Job replace the prior one
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
