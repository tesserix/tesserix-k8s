apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postsocial-redis
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: postsocial
    app.kubernetes.io/component: cache
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: scrapper
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/postsocial-redis
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: scrapper
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
