apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stock-analysis
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/stockpilot-api
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # NOTE: image.tag was previously hard-coded here as "latest" via
      # an ArgoCD parameter override, which silently won over whatever
      # values-prod.yaml said. Removed so values-prod.yaml's `image.tag`
      # is the single source of truth — bump it on each rollout to
      # defeat the GCP Artifact Registry remote-pull tag-cache that
      # served stale `:latest` digests in the past.
      parameters:
        - name: env.CORS_ORIGINS
          value: "https://stockpilot.tesserix.app"
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
