apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postiz
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: postiz
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: postiz
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/postiz
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: postiz
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # Namespace is a chart-managed resource (templates/namespace.yaml) so the
      # ambient-mesh labels are declarative — don't let ArgoCD create it bare.
      - CreateNamespace=false
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
