apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrapper-identity-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: social-media-scrapper
    app.kubernetes.io/component: identity
    environment: prod
spec:
  project: scrapper
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/identity-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: scrapper-identity-bootstrap
      values: |
        app: scrapper

        targets:
          - name: internal
            url: http://keycloak.identity-internal.svc.cluster.local:8080
            adminSecretName: keycloak-internal-admin
            realm:
              name: social-scrapper
              displayName: Social Scrapper
              registrationAllowed: false
              loginWithEmailAllowed: true
              resetPasswordAllowed: false
            clients:
              - clientId: social-scrapper-web
                publicClient: false
                gcpSecretClientSecret: prod-scrapper-keycloak-client-secret
                rootUrl: https://social-scrapper.tesserix.app
                redirectUris:
                  - "https://social-scrapper.tesserix.app/api/auth/nextauth/callback/keycloak"
                  - "http://localhost:3000/api/auth/nextauth/callback/keycloak"
                webOrigins:
                  - "https://social-scrapper.tesserix.app"
                  - "http://localhost:3000"
            identityProviders:
              - alias: google
                providerId: google
                displayName: Sign in with Google
                defaultScope: "openid email profile"
                gcpSecretClientId: prod-google-client-id
                gcpSecretClientSecret: prod-google-client-secret
            adminUsers:
              - email: samyak.rout@gmail.com
                firstName: Samyak
                lastName: Rout
              - email: mahesh.sangawar@gmail.com
                firstName: Mahesh
                lastName: Sangawar

        gcp:
          enabled: true
          project: tesseracthub-480811

  destination:
    server: https://kubernetes.default.svc
    namespace: scrapper
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
