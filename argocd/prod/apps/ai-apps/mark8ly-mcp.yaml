apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mark8ly-mcp
  namespace: argocd
  annotations:
    # Kargo's prod stage writes image.tag via argocd-update — the
    # authorized-stage annotation tells Kargo it's allowed to.
    kargo.akuity.io/authorized-stage: kargo-support-platform:prod
  labels:
    app.kubernetes.io/part-of: support-platform
    app.kubernetes.io/component: mcp-stub
    mcp.tesserix.app/tenant: mark8ly
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mcp-gateway
    helm:
      parameters:
        - name: tenant
          value: "mark8ly"
        - name: namespace
          value: "mark8ly"
        # Kargo support-platform/prod overwrites image.tag with the
        # newest mcp-gateway main-<sha> on every CI build.
        - name: image.tag
          value: "main"
        # Phase 3 — auto-register marketplace-api's storefront read
        # operations tagged `x-mcp-expose: customer-read` as MCP
        # tools. The spec is served without the storefront-key gate
        # (it's metadata, not data), so the gateway can fetch it
        # unauthenticated. The actual backend calls the auto-tools
        # make DO need the storefront key — injected via the secret
        # block below.
        #
        # Two things this URL must get right, both of which it got
        # wrong until #412 and neither of which reports a failure:
        #   * :8080 — the Service exposes 8080 -> targetPort http;
        #     omitting it defaults to :80, which nothing listens on.
        #   * /api/v1 — ServeOpenAPISpec is mounted on the /api/v1
        #     group, not at the root.
        # Verified against the live pod:
        #   /storefront/openapi.json         -> 404
        #   /api/v1/storefront/openapi.json  -> 200 (OpenAPI 3.0.3,
        #     5 operations: getStoreBranding, listStoreCategories,
        #     listProductsByCategory, listStoreProducts, getStoreProduct)
        - name: openapi.urls
          value: "http://mark8ly-marketplace-api-storefront.mark8ly.svc.cluster.local:8080/api/v1/storefront/openapi.json"
        - name: openapi.headers.template
          value: "X-Storefront-Key: $(STOREFRONT_KEY)"
        - name: openapi.headers.secret.enabled
          value: "true"
        - name: openapi.headers.secret.envVar
          value: "STOREFRONT_KEY"
        - name: openapi.headers.secret.name
          value: "mark8ly-marketplace-api-storefront-key"
        - name: openapi.headers.secret.key
          value: "STOREFRONT_KEY"
        # MARKETPLACE_INTERNAL_AUTH for create_support_ticket is auto-enabled
        # by the mcp-gateway chart for the mark8ly tenant (Kargo rewrites this
        # parameter list on image promotion, so it must NOT live here).
  destination:
    server: https://kubernetes.default.svc
    namespace: mark8ly
  ignoreDifferences:
    # ArgoCD's structured-merge crashes on the newer
    # Deployment.status.terminatingReplicas field. Cosmetic; the
    # comparison succeeds, sync still runs.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
