apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mark8ly-mcp
  namespace: argocd
  annotations:
    # Kargo's prod stage writes image.tag via argocd-update — the
    # authorized-stage annotation tells Kargo it's allowed to.
    kargo.akuity.io/authorized-stage: kargo-support-platform:prod
  labels:
    app.kubernetes.io/part-of: support-platform
    app.kubernetes.io/component: mcp-stub
    mcp.tesserix.app/tenant: mark8ly
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mcp-gateway
    helm:
      parameters:
        - name: tenant
          value: "mark8ly"
        - name: namespace
          value: "mark8ly"
        # Kargo support-platform/prod overwrites image.tag with the
        # newest mcp-gateway main-<sha> on every CI build.
        - name: image.tag
          value: "main"
        # Phase 3 — auto-register marketplace-api's storefront read
        # operations tagged `x-mcp-expose: customer-read` as MCP
        # tools. The spec is served at /storefront/openapi.json
        # without the storefront-key gate (it's metadata, not data),
        # so the gateway can fetch it unauthenticated. The actual
        # backend calls the auto-tools make DO need the storefront
        # key — injected via the secret block below.
        - name: openapi.urls
          value: "http://mark8ly-marketplace-api-storefront.mark8ly.svc.cluster.local/storefront/openapi.json"
        - name: openapi.headers.template
          value: "X-Storefront-Key: $(STOREFRONT_KEY)"
        - name: openapi.headers.secret.enabled
          value: "true"
        - name: openapi.headers.secret.envVar
          value: "STOREFRONT_KEY"
        - name: openapi.headers.secret.name
          value: "mark8ly-marketplace-api-storefront-key"
        - name: openapi.headers.secret.key
          value: "STOREFRONT_KEY"
  destination:
    server: https://kubernetes.default.svc
    namespace: mark8ly
  ignoreDifferences:
    # ArgoCD's structured-merge crashes on the newer
    # Deployment.status.terminatingReplicas field. Cosmetic; the
    # comparison succeeds, sync still runs.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
