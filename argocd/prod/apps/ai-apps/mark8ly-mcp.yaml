apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mark8ly-mcp
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: support-platform
    app.kubernetes.io/component: mcp-stub
    mcp.tesserix.app/tenant: mark8ly
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mcp-gateway
    helm:
      parameters:
        - name: tenant
          value: "mark8ly"
        - name: namespace
          value: "mark8ly"
  destination:
    server: https://kubernetes.default.svc
    namespace: mark8ly
  ignoreDifferences:
    # ArgoCD's structured-merge crashes on the newer
    # Deployment.status.terminatingReplicas field. Cosmetic; the
    # comparison succeeds, sync still runs.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
