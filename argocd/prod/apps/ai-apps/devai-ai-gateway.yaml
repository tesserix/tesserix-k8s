apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-ai-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: ai-gateway
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  ignoreDifferences:
    # K8s 1.36+ surfaces .status.terminatingReplicas which ArgoCD's
    # structured-merge-diff doesn't yet recognise. Without this every
    # sync errors with ComparisonError and the desired-state apply
    # silently no-ops (which is what blocked the SNI fix from landing).
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    # DEP-8: external-secrets.io webhook-defaulted fields drift to OutOfSync
    # forever; ignore them explicitly (RespectIgnoreDifferences alone is a
    # no-op without spec.ignoreDifferences).
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/target/deletionPolicy
        - /spec/template/engineVersion
        - /spec/template/mergePolicy
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
