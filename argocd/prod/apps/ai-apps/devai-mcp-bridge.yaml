apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-mcp-bridge
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: mcp-bridge
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kargo's kargo-devai:prod stage owns image.tag now (7th devai image on the
    # shared `services` warehouse). It's its OWN image (python+node,
    # Dockerfile.mcpbridge) but ensure-image-tags re-tags its :latest as
    # main-<sha> every commit, so the commit-derived tag always resolves —
    # exactly like the other six images. Kargo overwrites the value below on
    # each promotion; the app-of-apps ignoreDifferences on helm/parameters keeps
    # selfHeal from reverting it.
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-mcp-bridge
    helm:
      valueFiles:
        - values.yaml
      # Seeded concrete (Kargo overwrites on promotion). A concrete main-<sha>
      # also dodges the GAR remote-proxy :latest cache.
      parameters:
        - name: image.tag
          value: "main-19b4edb"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
