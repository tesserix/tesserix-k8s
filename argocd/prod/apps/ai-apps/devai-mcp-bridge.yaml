apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-mcp-bridge
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: mcp-bridge
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-mcp-bridge
    helm:
      valueFiles:
        - values.yaml
      # The bridge is its OWN image (python + node, Dockerfile.mcpbridge), not
      # the shared `devai` image — so it isn't on the Kargo `prod` stage.
      # Pin a concrete main-<sha>: the GCP Artifact Registry remote-proxy
      # CACHES the :latest tag, so pullPolicy:Always still serves a stale image
      # after a new :latest is pushed. Immutable main-<sha> tags bypass that.
      # Bump this to the newest mcpbridge-build sha on each bridge change.
      parameters:
        - name: image.tag
          value: "main-7617f00"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
