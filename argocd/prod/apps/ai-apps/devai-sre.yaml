apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-sre
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: sre-monitoring
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-sre
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "fix-multi-provider-user-routing-c5d89ea@sha256:23feec0dc1c04f25cfdc79864edbe45accd8aab6cc308a5b9f5b7dfc53516f6a"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
