apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-auth-bff
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: auth
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-auth-bff
    helm:
      # Kargo-managed: kargo-devai:prod writes the freight tag into this
      # parameter on every promotion. CHART-7: seed with a concrete main-<sha>
      # (not :latest) so selfHeal never reconciles the auth boundary to a
      # floating tag before Kargo's first promotion. ignoreDifferences on
      # /spec/source/helm/parameters (ai-apps-app-of-apps) lets Kargo overwrite.
      parameters:
        - name: image.tag
          value: "main-eab49a8"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
