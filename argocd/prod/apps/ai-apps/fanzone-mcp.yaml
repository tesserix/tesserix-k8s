apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanzone-mcp
  namespace: argocd
  annotations:
    # Kargo's prod stage writes image.tag via argocd-update — the
    # authorized-stage annotation tells Kargo it's allowed to.
    kargo.akuity.io/authorized-stage: kargo-support-platform:prod
  labels:
    app.kubernetes.io/part-of: support-platform
    app.kubernetes.io/component: mcp-stub
    mcp.tesserix.app/tenant: fanzone
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fanzone
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mcp-gateway
    helm:
      parameters:
        - name: tenant
          value: "fanzone"
        - name: namespace
          value: "fanzone"
        # image.tag is overwritten by the Kargo support-platform/prod
        # promotion (see kargo-manifests). Default "main" is just a
        # bootstrap value; Kargo bumps it to main-<sha> on every CI
        # build.
        - name: image.tag
          value: "main"
        # Phase 4 file-backed OpenAPI loading is on by default in
        # the chart (values.yaml: openapi.fileEnabled=true). The
        # gateway looks at /app/openapi/fanzone/spec.yaml on
        # startup and auto-registers any customer-read operations
        # found there. No per-Application override needed —
        # important because Kargo's argocd-update step rewrites
        # helm.parameters on every image bump.
  destination:
    server: https://kubernetes.default.svc
    namespace: fanzone
  ignoreDifferences:
    # ArgoCD's structured-merge crashes on the newer
    # Deployment.status.terminatingReplicas field. Cosmetic; the
    # comparison succeeds, sync still runs.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
