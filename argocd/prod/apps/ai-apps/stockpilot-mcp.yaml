apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-mcp
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: support-platform
    app.kubernetes.io/component: mcp-stub
    mcp.tesserix.app/tenant: stockpilot
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/mcp-gateway
    helm:
      parameters:
        - name: tenant
          value: "stockpilot"
        - name: namespace
          value: "stockpilot"
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
