apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-sandbox-operator
  namespace: argocd
spec:
  project: infrastructure
  source: {repoURL: https://github.com/tesserix/tesserix-k8s.git, targetRevision: HEAD, path: operators/db-anonymise}
  destination: {server: https://kubernetes.default.svc, namespace: devai}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
