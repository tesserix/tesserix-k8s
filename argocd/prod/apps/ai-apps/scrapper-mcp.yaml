apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrapper-mcp
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-scrapper:prod
  labels:
    app.kubernetes.io/part-of: social-media-scrapper
    app.kubernetes.io/component: mcp-server
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: scrapper
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/scrapper-mcp
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "main-042f6e4"
  destination:
    server: https://kubernetes.default.svc
    namespace: scrapper
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
