apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: database
    environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: devai-db-schema-bootstrap
      values: |
        app: devai

        targets:
          # `name` is a k8s-resource label (ConfigMap/volume names, schema dir,
          # secret mount) and MUST be RFC-1123 (no underscores). The actual
          # database name is derived from the SQL filename (devai_db.sql ->
          # devai_db), so this label is decoupled from it.
          - name: devai-db
            host: devai-postgres-rw.devai.svc.cluster.local
            port: 5432
            user: devai
            secretName: devai-postgres-app-credentials
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
