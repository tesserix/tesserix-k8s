apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: database
    environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: devai-db-schema-bootstrap
      values: |
        app: devai

        # devai_db.sql IS the schema's source of truth — devai-api is Python/
        # asyncpg with no AutoMigrate, so it never evolves the schema and the
        # file is purely additive (CREATE ... IF NOT EXISTS, ADD COLUMN IF NOT
        # EXISTS). Without this, a table added to the file after the database
        # was provisioned never lands: `sandboxes` was missing in prod and
        # every /sandboxes load returned HTTP 500.
        applySchemaToExistingDatabases: true

        targets:
          # `name` is a k8s-resource label (ConfigMap/volume names, schema dir,
          # secret mount) and MUST be RFC-1123 (no underscores). The actual
          # database name is derived from the SQL filename (devai_db.sql ->
          # devai_db), so this label is decoupled from it.
          #
          # Runs AS SUPERUSER: the schema needs CREATE EXTENSION vector
          # (agent_memories has a vector(1536) column + HNSW index) and
          # pgvector is not a trusted extension, so the devai app role
          # cannot install it — as user devai the extension create was
          # silently skipped and agent_memories failed on every cycle.
          # devai-postgres-superuser is materialized by
          # enableSuperuserAccess: true on the devai-postgres Cluster.
          - name: devai-db
            host: devai-postgres-rw.devai.svc.cluster.local
            port: 5432
            user: postgres
            secretName: devai-postgres-superuser
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
