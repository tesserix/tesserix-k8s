apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - stockpilot-api.yaml
  - stockpilot-web.yaml
  - stockpilot-worker.yaml
  - stockpilot-istio.yaml
  - stockpilot-db-seed.yaml
  - openbb.yaml
  - fingpt-inference.yaml
  # CNPG PostgreSQL
  - stockpilot-postgres.yaml
  # Temporal — shared durable-execution cluster (#116; HomeChef + future products).
  # Single-node auto-setup + own Postgres, SQL visibility (Elasticsearch off).
  # Temporal (scrapper namespace). Retained deliberately — Temporal is not
  # being removed anywhere, even though the scrapper product around it is.
  - temporal.yaml
  # PostSocial publishing engine
  # Postiz — self-hosted social scheduler (own namespace; shares Temporal above)
  - postiz-postgres.yaml
  - postiz.yaml
  # SLM Support Platform — shared chat (Otto) + slm-router + inference +
  # RAG stack serving mark8ly, fanzone, homechef tenants.
  - support-platform-namespace.yaml
  - support-platform-postgres.yaml
  - support-platform-mongo.yaml
  - support-platform-slm-inference.yaml
  - support-platform-embedder.yaml
  - support-platform-reranker.yaml
  - support-platform-otto.yaml
  - support-platform-slm-router.yaml
  # Per-product MCP stubs the slm-router routes config references. These
  # are nginx-served JSON-RPC handshake stubs today; product teams swap
  # them for real FastMCP servers when they have tool implementations.
  - mark8ly-mcp.yaml
  # FanZone decommissioned 2026-07-23 — file retained, uncomment to redeploy.
  # - fanzone-mcp.yaml
  - homechef-mcp.yaml
  - stockpilot-mcp.yaml
  # platform-mcp serves tesserix-home (company app) chats; runs in the
  # support-platform namespace alongside slm-router.
  - platform-mcp.yaml
  # RAG bootstrap: db-schema-bootstrap creates the `chunks` pgvector
  # table; kb-seed populates it with per-tenant starter content via
  # the embedder. Both are idempotent — safe to re-sync.
  - support-platform-db-schema-bootstrap.yaml
  - support-platform-kb-seed.yaml
  # Nightly conversation export to GCS — training corpus for the
  # per-tenant LoRA adapters in phase2-optimizations/2a-model-serving.
  - support-platform-export.yaml
  # Hourly markdown-corpus ingest into pgvector — replaces the
  # one-shot kb-seed pattern. Corpus baked into the mcp-gateway
  # image at /app/docs/<tenant>; CronJob walks every tenant slug
  # on each fire. See charts/apps/mcp-gateway-docs-ingest.
  - mcp-gateway-docs-ingest.yaml

  # ─── DevAI — AI-powered ALM + SRE platform ────────────────────
  # The DevAI namespace serves both the ALM pipeline runtime (FastAPI
  # + LangGraph + the new Fiber-style blueprint runtime) and the SRE
  # monitoring subsystem. Each component is its own helm chart under
  # charts/apps/devai-*. Order below matches dependency chain:
  # postgres + auth-bff first; api + sre afterward; dashboards last.
  - devai-postgres.yaml
  - devai-auth-bff.yaml
  - devai-db-seed.yaml
  - devai-istio.yaml
  # devai-previews namespace + RBAC + quota + auth policy for live-preview pods.
  - devai-previews.yaml
  - devai-api.yaml
  - devai-sre.yaml
  # devai-mcp-hub — registry-driven MCP multiplexer (one /mcp over many MCPs).
  - devai-mcp-hub.yaml
  # devai-mcp-bridge — runs stdio MCP servers (npx) and fronts them as
  # streamable-https so the hub federates the npx/community long tail.
  - devai-mcp-bridge.yaml
  - devai-dashboard.yaml
  - devai-sre-dashboard.yaml
  # Registry bootstrap — Job that seeds the YAML specializations /
  # MCP servers / Agent CRs into aregistry once it's healthy.
  # Idempotent; safe to re-sync.
  - devai-registry-bootstrap.yaml
  # Log archive — CronJobs shipping pod logs to gs://devai-prod-logs-in
  # (every 6h) and purging objects older than purge.days (daily). The
  # bucket lifecycle (Nearline 2d -> Coldline 7d -> Delete 15d) keeps cost low.
  - devai-log-archiver.yaml
  # Our own agentic-registry — serves aregistry.tesserix.app from the
  # agentregistry-system slot (replaces the third-party agentregistry-dev
  # deployment formerly synced by argocd/prod/infrastructure). It runs its own
  # in-namespace CNPG Postgres (agentregistry-postgres); the schema-bootstrap
  # app provisions the `registry` schema inside agentic_registry_db there.
  - agentregistry-postgres.yaml
  - agentic-registry-db-schema-bootstrap.yaml
  - agentic-registry.yaml
  # VirtualServices + AuthorizationPolicies for kagent.tesserix.app
  # and aregistry.tesserix.app, routing through oauth2-proxy.
  - agentic-istio.yaml
  # AI gateway — nginx-based forwarder in agentgateway-system that
  # routes /anthropic + /openai traffic with auth injection. Once
  # the Solo.io agentgateway data plane is deployed, this chart can
  # be retired by repointing the Service at the AgentgatewayBackend.
  - devai-ai-gateway.yaml
  # agentgateway MCP routing (G1) — a data-plane Gateway + a CronJob that
  # renders the registry's MCP servers into AgentgatewayBackend + HTTPRoute
  # so each registered MCP server is reachable at {gateway}/mcp/<name>.
  - agentgateway-route-sync.yaml
  # kagent agent-sync (G2) — a CronJob that renders long-lived (labelled)
  # registry agents into kagent.dev Agent + ToolServer CRs so the kagent
  # controller reconciles them into managed Deployments.
  - kagent-agent-sync.yaml
