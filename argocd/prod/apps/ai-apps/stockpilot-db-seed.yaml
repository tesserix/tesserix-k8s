apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stockpilot
    app.kubernetes.io/component: database
    environment: prod
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: stockpilot-db-schema-bootstrap
      values: |
        app: stockpilot

        # parked — product scaled down to zero
        suspend: true

        targets:
          - name: stockpilot
            host: stockpilot-postgres-rw.stockpilot.svc.cluster.local
            port: 5432
            user: stockpilot
            secretName: stockpilot-postgres-app-credentials
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
