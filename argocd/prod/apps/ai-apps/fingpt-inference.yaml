apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fingpt-inference
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stock-analysis
    app.kubernetes.io/component: ai-inference
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/fingpt-inference
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
