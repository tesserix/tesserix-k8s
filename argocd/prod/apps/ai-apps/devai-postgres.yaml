apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-postgres
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-postgres
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  # DEP-2: ArgoCD has no built-in health assessment for the CNPG Cluster CR, so
  # a Ready=False / continuous-archiving-broken cluster reported the Application
  # Healthy and hid the 2026-06 outage. The durable fix is a cluster-scoped
  # ArgoCD resource health customization for postgresql.cnpg.io/Cluster in the
  # argocd-cm ConfigMap (Lua: degraded unless status.phase == "Cluster in
  # healthy state" and a Ready=True condition). That ConfigMap is managed
  # outside this repo's app-of-apps; until it lands, the CNPGClusterNotReady /
  # CNPGWALArchiveFailing PrometheusRule alerts (devai-postgres chart) are the
  # surfacing path. Apply the same to agentregistry-postgres.
  ignoreDifferences:
    # DEP-8: the external-secrets.io admission webhook defaults several fields
    # on ExternalSecret that are not present in the rendered manifest, so the
    # app drifts to OutOfSync forever. RespectIgnoreDifferences in syncOptions
    # is a no-op without an explicit spec.ignoreDifferences, so list them here.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /spec/target/deletionPolicy
        - /spec/template/engineVersion
        - /spec/template/mergePolicy
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
