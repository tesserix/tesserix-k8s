apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-registry
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-apps
    app.kubernetes.io/component: registry
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/agentic-registry
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "latest"
  destination:
    server: https://kubernetes.default.svc
    # Occupies the agentregistry-system slot vacated by the third-party
    # agentregistry-dev deployment, so devai-auth-bff / Istio VS /
    # AuthorizationPolicies route to us unchanged (Service agentregistry:12121).
    namespace: agentregistry-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
