apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-registry
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-apps
    app.kubernetes.io/component: registry
    environment: prod
  annotations:
    # Authorizes the kargo-devai:prod Stage to rewrite spec.source.helm
    # parameters (image.tag) on this Application — agentic-registry is promoted
    # alongside the rest of the DevAI stack. Without this, Kargo refuses to
    # mutate it. selfHeal reverts are prevented by the ignoreDifferences on
    # /spec/source/helm/parameters in ai-apps-app-of-apps.
    kargo.akuity.io/authorized-stage: kargo-devai:prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/agentic-registry
    helm:
      valuesObject:
        openbao:
          prod-agentic-registry-devai-deploy-key: devai/app/devai-registry-deploy-key
          prod-agentic-registry-devai-deploy-key-sha256: devai/app/devai-registry-deploy-key-sha256
          prod-agentic-registry-kora-deploy-key: kora/app/kora-registry-deploy-key
          prod-agentic-registry-kora-deploy-key-sha256: kora/app/kora-registry-deploy-key-sha256
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        # Seed tag for the first roll-out; Kargo (kargo-devai:prod) overwrites
        # this with the newest main-<sha> Freight on every subsequent build.
        - name: image.tag
          value: "main-ae12d7e"
  destination:
    server: https://kubernetes.default.svc
    # Occupies the agentregistry-system slot vacated by the third-party
    # agentregistry-dev deployment, so the Zitadel proxy, Istio routes, and
    # machine consumers share the stable Service agentregistry:12121.
    namespace: agentregistry-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
