apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-worker
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-stockpilot:prod
  labels:
    app.kubernetes.io/part-of: stock-analysis
    app.kubernetes.io/component: worker
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/stockpilot-worker
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "main-63e1bc0"
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
