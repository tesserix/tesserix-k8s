apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrapper-postgres
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: scrapper
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-apps
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/scrapper-postgres
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: scrapper
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
