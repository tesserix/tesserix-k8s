apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrapper-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: social-media-scrapper
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: scrapper
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: scrapper-db-schema-bootstrap
      values: |
        app: scrapper

        # Targets the scrapper Postgres CNPG cluster. Permissions, indexes
        # and reference seeds come from
        # charts/apps/db-schema-bootstrap/schemas/scrapper/scrapper/scrapper_db.sql
        # Tables themselves are created by SQLAlchemy in scrapper-api at boot.
        targets:
          - name: scrapper
            host: scrapper-postgres-rw.scrapper.svc.cluster.local
            port: 5432
            user: scrapper
            database: scrapper_db
            secretName: scrapper-postgres-app-credentials
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: scrapper
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
