apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-registry-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-apps
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: agentic-registry-db-schema-bootstrap
      values: |
        app: agentic-registry

        # Agent Registry has no application-side auto-migration in production,
        # so this idempotent schema remains the source of truth for upgrades.
        applySchemaToExistingDatabases: true

        # Provisions the `registry` schema inside agentic_registry_db on the
        # registry's OWN in-namespace CNPG cluster (agentregistry-postgres). The
        # database is created by CNPG bootstrap, so the file is named
        # agentic_registry_db.sql and the bootstrap just applies the (idempotent)
        # DDL as its owner. See
        # charts/apps/db-schema-bootstrap/schemas/agentic-registry/agentregistry-postgres/agentic_registry_db.sql
        targets:
          - name: agentregistry-postgres
            host: agentregistry-postgres-rw.agentregistry-system.svc.cluster.local
            port: 5432
            # CREATE EXTENSION vector requires the CNPG superuser. The secret is
            # operator-managed because enableSuperuserAccess is on for this
            # cluster; no credential is committed here.
            user: postgres
            database: agentic_registry_db
            secretName: agentregistry-postgres-superuser
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    # Runs in agentregistry-system where the CNPG credentials secret lives.
    namespace: agentregistry-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
