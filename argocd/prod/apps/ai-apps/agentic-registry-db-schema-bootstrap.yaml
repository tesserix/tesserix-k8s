apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-registry-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-apps
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: agentic-registry-db-schema-bootstrap
      values: |
        app: agentic-registry

        # Provisions the registry's `registry` schema inside the EXISTING
        # devai_db on the shared devai-postgres CNPG cluster. The schema file
        # is named devai_db.sql so the bootstrap targets that database (it
        # already exists, so no CREATE DATABASE — the `devai` owner role has no
        # CREATEDB here). DDL is idempotent (CREATE ... IF NOT EXISTS).
        # See charts/apps/db-schema-bootstrap/schemas/agentic-registry/devai/devai_db.sql
        targets:
          - name: devai
            host: devai-postgres-rw.devai.svc.cluster.local
            port: 5432
            user: devai
            database: devai_db
            secretName: devai-postgres-app-credentials
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    # Runs in the devai namespace where devai-postgres-app-credentials lives.
    namespace: devai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
