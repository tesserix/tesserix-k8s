apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-mcp-hub
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: mcp-hub
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-mcp-hub
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # mcp-hub shares the `devai` image with devai-api. It is NOT in the Kargo
      # `prod` stage's app list (which updates api/sre/dashboards/auth-bff/
      # registry), so this Git value is the source of truth — pin it to the same
      # main-<sha> the api runs and bump it when the api image advances. TODO:
      # add devai-mcp-hub to the Kargo prod stage so it tracks api automatically.
      parameters:
        - name: image.tag
          value: "main-2a4c0b6"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
