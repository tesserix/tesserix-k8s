apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-mcp-hub
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: mcp-hub
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-mcp-hub
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # CHART-7: seed with a concrete main-<sha> (mcp-hub shares the `devai`
      # image), not :latest. Kargo (kargo-devai:prod) overwrites this on each
      # promotion; ignoreDifferences keeps selfHeal from reverting it.
      parameters:
        - name: image.tag
          value: "main-922249b"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
