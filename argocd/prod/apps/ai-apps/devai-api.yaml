apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-api
    helm:
      valuesObject:
        podAnnotations:
          secrets.tesserix.app/migration: devai-openbao-20260927
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # CHART-7: seed with an immutable tag and digest. The ArgoCD helm
      # parameter overrides the chart value, so it must also be pinned here.
      # Kargo (kargo-devai:prod) overwrites it on each promotion;
      # ignoreDifferences (ai-apps-app-of-apps) keeps selfHeal from reverting.
      parameters:
        - name: image.tag
          value: "main-5714b54"
        - name: k8sRuntime.runnerImage
          value: "asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-runner:main-5714b54"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
