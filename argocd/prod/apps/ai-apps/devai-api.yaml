apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    kargo.akuity.io/authorized-stage: kargo-devai:prod
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/devai-api
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # CHART-7: seed with a concrete main-<sha> (not :latest). The ArgoCD helm
      # parameter overrides the chart value, so it must also be pinned here.
      # Kargo (kargo-devai:prod) overwrites it on each promotion;
      # ignoreDifferences (ai-apps-app-of-apps) keeps selfHeal from reverting.
      parameters:
        - name: image.tag
          value: "main-922249b"
  destination:
    server: https://kubernetes.default.svc
    namespace: devai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
