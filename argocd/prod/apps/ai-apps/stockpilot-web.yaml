apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-web
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stock-analysis
    app.kubernetes.io/component: frontend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stockpilot
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/stockpilot-web
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # NOTE: image.tag was previously hard-coded here as "latest" via
      # an ArgoCD parameter override, which silently won over whatever
      # values-prod.yaml said. Removed so values-prod.yaml is the
      # single source of truth — bumped on each rollout by the
      # `Bump image tag in tesserix-k8s` step in
      # tesserix/stock-analysis::.github/workflows/stockpilot-web-build.yml.
  destination:
    server: https://kubernetes.default.svc
    namespace: stockpilot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
