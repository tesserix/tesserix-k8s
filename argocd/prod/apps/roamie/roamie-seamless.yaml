apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roamie-seamless
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-roamie:models-prod
  labels:
    app.kubernetes.io/part-of: roamie
    app.kubernetes.io/component: inference
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: roamie
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/roamie-seamless
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: roamie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
