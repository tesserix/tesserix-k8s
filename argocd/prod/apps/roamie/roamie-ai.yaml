apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roamie-ai
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roamie
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: roamie
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/roamie-ai
    helm:
      valueFiles:
      - values.yaml
      - values-validation.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: roamie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
