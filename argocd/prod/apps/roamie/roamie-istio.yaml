apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roamie-istio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roamie
    app.kubernetes.io/component: networking
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: roamie
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: manifests/roamie-istio
  destination:
    server: https://kubernetes.default.svc
    namespace: roamie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
