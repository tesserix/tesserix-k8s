apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roamie-api-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roamie
spec:
  project: roamie
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/roamie-ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    syncOptions: [PruneLast=true]
