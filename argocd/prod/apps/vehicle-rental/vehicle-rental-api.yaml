apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vehicle-rental-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: api
    environment: prod
  annotations:
    # Kargo writes image.tag here on promotion; without this it refuses.
    kargo.akuity.io/authorized-stage: kargo-vehicle-rental:prod
    # Wave -1: after the schema bootstrap, before the three UIs that call it.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vehicle-rental-app
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/vehicle-rental-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vehicle-rental
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
