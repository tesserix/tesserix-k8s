apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vehicle-rental-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: schema
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vehicle-rental-app
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: vehicle-rental-db-schema-bootstrap
      values: |
        app: vehicle-rental

        # The schema is written idempotent — CREATE ... IF NOT EXISTS, additive
        # ALTERs — and no ORM manages these tables at runtime, so replaying it
        # every 30 minutes converges. Same reasoning as dwellm8.
        applySchemaToExistingDatabases: true

        targets:
          # The -rw service, not the pooler: DDL through a transaction-mode
          # PgBouncer is how a migration ends up half-applied.
          - name: vehicle_rental
            host: vehicle-rental-postgres-rw.vehicle-rental-data.svc.cluster.local
            port: 5432
            user: vehicle_rental
            secretName: vehicle-rental-postgres-app-credentials
            secretKey: password
            # One database in ordered chapters, one file per module —
            # 000_extensions through 900_rls. Order is the file name.
            combineInto: vehicle_rental
  destination:
    server: https://kubernetes.default.svc
    namespace: vehicle-rental-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Server-side apply: a client-side apply stores the whole ConfigMap in the
      # last-applied-configuration annotation, which is capped at 262144 bytes.
      # dwellm8's schema hit that ceiling and every sync failed on it while the
      # CronJob kept happily applying the stale ConfigMap.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
