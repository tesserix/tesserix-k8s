apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: dwellm8-services
    environment: prod
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/dwellm8
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # No ignoreDifferences on /spec/source/helm/parameters yet: dwellm8 has no
  # Kargo Warehouse, so nothing writes that field and the exception only made a
  # stale `image.tag: latest` unremovable by git. Restore it when Kargo lands.
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
