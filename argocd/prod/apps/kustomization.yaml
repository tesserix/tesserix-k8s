apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production Applications - Multi-Namespace App of Apps Pattern
# All namespaces enabled for production

resources:
  # Global Services - Shared Platform Services
  - global-app-of-apps.yaml

  # FanZone - Sports/Gaming Platform
  - fanzone-app-of-apps.yaml

  # HomeChef - Food Platform
  - homechef-app-of-apps.yaml

  # Blog - Engineering Blog (tesserix-blog + mongodb-blog)
  - blog-app-of-apps.yaml

  # GameVerse - Board Games Platform (stayandplays.com)
  - gameverse-app-of-apps.yaml

  # AI Apps - StockPilot + Social Media Scrapper
  - ai-apps-app-of-apps.yaml

  # mark8ly - Multi-tenant marketplace platform (v2)
  - mark8ly-app-of-apps.yaml

  # mark8ly-uat — UAT staging environment for the mark8ly product.
  # Lives in the mark8ly-uat namespace, deploys to admin-uat.mark8ly.com
  # and uat.mark8ly.com. The kargo-mark8ly Project's `uat` Stage writes
  # image.tag on every mark8ly-uat-* App; the `prod` Stage promotes
  # downstream once smoke tests pass.
  - mark8ly-uat-app-of-apps.yaml

  # Guardix - Multi-tenant safety platform for kids and dementia patients
  - guardix-app-of-apps.yaml

  # tesserix-social — AI-powered social media scheduler & analytics.
  # Lives at social.tesserix.app.
  - social-app-of-apps.yaml

  # Tesserix Horoscope — astrology + Claude vision palm/face reading.
  # Lives at astronomy.tesserix.app.
  - horoscope-app-of-apps.yaml

  # Release / promotion tooling — Kargo Projects + ClusterPromotionTasks.
  # Sourced from the tesserix/kargo-manifests repo via apps/release/.
  - release-app-of-apps.yaml
