apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production Applications - Multi-Namespace App of Apps Pattern
# All namespaces enabled for production

resources:
  # Global Services - Shared Platform Services
  - global-app-of-apps.yaml

  # FanZone - Sports/Gaming Platform
  # DECOMMISSIONED from the cluster 2026-07-23 to reclaim capacity. All fanzone
  # charts/manifests are retained in git untouched — uncomment to redeploy.
  # - fanzone-app-of-apps.yaml

  # HomeChef - Food Platform
  - homechef-app-of-apps.yaml

  # Blog - Engineering Blog (tesserix-blog + mongodb-blog)
  - blog-app-of-apps.yaml

  # GameVerse - Board Games Platform (stayandplays.com)

  # AI Apps - StockPilot + Social Media Scrapper
  - ai-apps-app-of-apps.yaml

  # mark8ly - Multi-tenant marketplace platform (v2)
  - mark8ly-app-of-apps.yaml

  # mark8ly-uat — DECOMMISSIONED 2026-07-26. UAT environment removed; the
  # namespace, its 16 apps and their data are gone. Restore from git history
  # if a staging environment is needed again.

  # Guardix - Multi-tenant safety platform for kids and dementia patients

  # tesserix-social — AI-powered social media scheduler & analytics.
  # Lives at social.tesserix.app.

  # Tesserix Horoscope — astrology + Claude vision palm/face reading.
  # Lives at astronomy.tesserix.app.

  # Release / promotion tooling — Kargo Projects + ClusterPromotionTasks.
  # Sourced from the tesserix/kargo-manifests repo via apps/release/.
  - release-app-of-apps.yaml

  # Kora - Food memory / nutrition logging (LLM-assisted, pgvector recall).
  # Lives at kora-api.tesserix.app.
  - kora-app-of-apps.yaml

  # AI Database - shared vector store (Qdrant) for the agent platform.
  - ai-database-app-of-apps.yaml

  # Dwellm8 - Property management for India. Lives at dwellm8.com.
  # One modular-monolith API (ADR-0001) on its own CNPG cluster.
  - dwellm8-app-of-apps.yaml

  # Security - OpenBao, the cluster's secret store. ESO reads from it.
  - security-app-of-apps.yaml

  # Planning Poker - real-time sprint estimation for agile teams.
  # Lives at planningpoker.tesserix.app.
  - planning-poker-app-of-apps.yaml

  # Platform onboarding - organizations, product grants, domains and SSO.
  # Lives at onboard.tesserix.app.
  - platform-app-of-apps.yaml

  # Vehicle Rental - rental marketplace (added in #355; the app-of-apps and its
  # AppProject were left unregistered, so kustomize never built either and
  # ArgoCD reported Synced while neither resource existed).
  - vehicle-rental-app-of-apps.yaml
