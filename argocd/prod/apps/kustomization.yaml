apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production Applications - Multi-Namespace App of Apps Pattern
# All namespaces enabled for production

resources:
  # Global Services - Shared Platform Services
  - global-app-of-apps.yaml

  # Bookkeeping - Accounting Platform
  - bookkeeping-app-of-apps.yaml

  # FanZone - Sports/Gaming Platform
  - fanzone-app-of-apps.yaml

  # HomeChef - Food Platform
  - homechef-app-of-apps.yaml

  # Blog - Engineering Blog (tesserix-blog + mongodb-blog)
  - blog-app-of-apps.yaml

  # GameVerse - Board Games Platform (stayandplays.com)
  - gameverse-app-of-apps.yaml

  # AI Apps - StockPilot + Social Media Scrapper
  - ai-apps-app-of-apps.yaml

  # mark8ly - Multi-tenant marketplace platform (v2)
  - mark8ly-app-of-apps.yaml

  # Guardix - Multi-tenant safety platform for kids and dementia patients
  - guardix-app-of-apps.yaml

  # tesserix-social — AI-powered social media scheduler & analytics.
  # Lives at social.tesserix.app. Uncomment once prod-social-* secrets
  # are provisioned in GCP Secret Manager (see docs/setup/gip.md in
  # the tesserix-social repo) AND the social entry is uncommented in
  # external-secrets/prod/kustomization.yaml.
  # - social-app-of-apps.yaml  # Disabled — pending GIP + secrets
