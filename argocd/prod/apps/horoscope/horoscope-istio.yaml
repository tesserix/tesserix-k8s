apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horoscope-istio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-horoscope
    app.kubernetes.io/component: networking
    environment: prod
spec:
  project: horoscope
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: manifests/horoscope-istio
  destination:
    server: https://kubernetes.default.svc
    namespace: horoscope
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
