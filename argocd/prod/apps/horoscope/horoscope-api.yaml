apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horoscope-api
  namespace: argocd
  annotations:
    # Kargo's prod Stage rewrites spec.source.helm.parameters[image.tag]
    # on every promotion. Without this annotation Kargo refuses to
    # mutate the Application even when the Project authorises it.
    kargo.akuity.io/authorized-stage: kargo-horoscope:prod
  labels:
    app.kubernetes.io/part-of: tesserix-horoscope
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: horoscope
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/horoscope-api
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        # PLACEHOLDER — Kargo overwrites this on every promotion with
        # the freshly-discovered `main-<sha>` tag from the GHCR-mirrored
        # AR repo. Don't hand-edit; chart values.yaml :: image.tag is
        # the no-Kargo fallback (also "latest", same caveat).
        - name: image.tag
          value: "latest"
        - name: "podAnnotations.client\\.knative\\.dev/updateTimestamp"
          value: "2026-05-09T22:30:00Z"
  destination:
    server: https://kubernetes.default.svc
    namespace: horoscope
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
