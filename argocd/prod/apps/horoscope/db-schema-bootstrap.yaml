apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horoscope-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: horoscope
    app.kubernetes.io/component: database
    environment: prod
spec:
  project: horoscope
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: horoscope-db-schema-bootstrap
      values: |
        app: horoscope

        targets:
          - name: horoscope
            host: horoscope-postgres-rw.horoscope.svc.cluster.local
            port: 5432
            user: horoscope
            secretName: horoscope-postgres-app-credentials
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: horoscope
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
