apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horoscope-web
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-horoscope
    app.kubernetes.io/component: frontend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: horoscope
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/horoscope-web
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "latest"
        - name: "podAnnotations.client\\.knative\\.dev/updateTimestamp"
          value: "2026-05-09T10:00:00Z"
  destination:
    server: https://kubernetes.default.svc
    namespace: horoscope
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
