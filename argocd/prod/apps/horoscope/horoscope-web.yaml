apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horoscope-web
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-horoscope
    app.kubernetes.io/component: frontend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: horoscope
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/horoscope-web
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        # Image tag is also pinned in charts/apps/horoscope-web/values.yaml.
        # Both must agree; ArgoCD parameters here are last-write-wins so
        # leaving "latest" here would silently override the SHA pin in the
        # chart and pull a stale digest from the AR pull-through cache.
        # When Kargo is wired up it will manage this value.
        - name: image.tag
          value: "a543cbe5280a9dce06517fa7b9272542622ee023"
        - name: "podAnnotations.client\\.knative\\.dev/updateTimestamp"
          value: "2026-05-09T22:30:00Z"
  destination:
    server: https://kubernetes.default.svc
    namespace: horoscope
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
