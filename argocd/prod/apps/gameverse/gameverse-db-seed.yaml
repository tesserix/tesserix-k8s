apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gameverse-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gameverse
    app.kubernetes.io/component: database
    environment: prod
spec:
  project: gameverse
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: gameverse-db-schema-bootstrap
      values: |
        app: gameverse

        targets:
          - name: gameverse
            host: gameverse-postgres-rw.gameverse.svc.cluster.local
            port: 5432
            user: postgres
            secretName: gameverse-server-secrets
            secretKey: DB_PASSWORD
  destination:
    server: https://kubernetes.default.svc
    namespace: gameverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
