apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gameverse-identity-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gameverse
    app.kubernetes.io/component: identity
    environment: prod
spec:
  project: gameverse
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/identity-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: gameverse-identity-bootstrap
      values: |
        app: gameverse

        targets:
          # Customer Keycloak — player login (Google + Meta SSO)
          - name: customer
            url: http://keycloak.identity-customer.svc.cluster.local:8080
            adminSecretName: keycloak-customer-admin
            realm:
              name: gameverse
              displayName: GameVerse
              registrationAllowed: true
              loginWithEmailAllowed: true
              resetPasswordAllowed: true
            clients:
              - clientId: gameverse-web
                publicClient: true
                rootUrl: https://stayandplays.com
                redirectUris:
                  - "https://stayandplays.com/*"
                  - "https://www.stayandplays.com/*"
                  - "http://localhost:3100/*"
                webOrigins:
                  - "https://stayandplays.com"
                  - "https://www.stayandplays.com"
                  - "http://localhost:3100"
            identityProviders:
              - alias: google
                providerId: google
                displayName: Sign in with Google
                defaultScope: "openid email profile"
                gcpSecretClientId: prod-google-client-id
                gcpSecretClientSecret: prod-google-client-secret
              - alias: facebook
                providerId: facebook
                displayName: Sign in with Meta
                defaultScope: "email public_profile"
                gcpSecretClientId: prod-facebook-app-id
                gcpSecretClientSecret: prod-facebook-app-secret
            adminUsers:
              - email: samyak.rout@gmail.com
                firstName: Samyak
                lastName: Rout

        gcp:
          enabled: true
          project: tesseracthub-480811

  destination:
    server: https://kubernetes.default.svc
    namespace: gameverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
