apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gameverse-istio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gameverse-platform
    app.kubernetes.io/component: istio-routing
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gameverse
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: manifests/gameverse-istio
  destination:
    server: https://kubernetes.default.svc
    namespace: gameverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
