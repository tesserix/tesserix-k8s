apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gameverse-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gameverse-platform
    app.kubernetes.io/component: secrets
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gameverse
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: external-secrets/prod/gameverse
  destination:
    server: https://kubernetes.default.svc
    namespace: gameverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
