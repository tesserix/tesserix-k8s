apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanzone-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: fanzone-services
    environment: prod
spec:
  project: fanzone
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/fanzone
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kargo's argocd-update step writes spec.source.helm.parameters
  # (specifically `image.tag`) on each child Application during a
  # Promotion. Without an ignoreDifferences exception here, this parent
  # app-of-apps notices the child drift and self-heals the parameter
  # back to whatever placeholder value is checked in to git — which
  # rolls every fanzone service back to a non-existent tag and
  # leaves the Stage stuck in Unhealthy.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
