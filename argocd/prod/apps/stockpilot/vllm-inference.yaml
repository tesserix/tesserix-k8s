apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockpilot-vllm-inference
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: stockpilot
    app.kubernetes.io/component: ai-inference
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/vllm-inference
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
        - ../global-config-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-inference
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
