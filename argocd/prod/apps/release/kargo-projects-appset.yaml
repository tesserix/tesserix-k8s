---
# ApplicationSet — one Argo CD Application per `projects/<name>` directory
# in tesserix/kargo-manifests. Adding a project = creating a directory in
# that repo; nothing else.
#
# The generator treats `projects/*` as the source of truth for what is
# deployed. If a directory disappears, the corresponding Application is
# pruned (and its `resources-finalizer.argocd.argoproj.io` finalizer
# cascade-deletes the Kargo Project, which deletes its Warehouses,
# Stages, Freight, Promotions and finally the kargo-<name> namespace).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-projects
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: release
    environment: prod
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/tesserix/kargo-manifests.git
        revision: HEAD
        directories:
          - path: projects/*
          # Vehicle Rental decommissioned 2026-08-20. Excluded rather than
          # deleted so kargo-manifests keeps projects/vehicle-rental intact.
          - path: projects/vehicle-rental
            exclude: true
        # Belt-and-braces: don't generate from the placeholder file or
        # any nested `examples/` someone forgets to move.
        # (`exclude: true` removes matches.)
        # - path: projects/_archive/*
        #   exclude: true
  template:
    metadata:
      name: 'kargo-project-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: tesseract-platform
        app.kubernetes.io/component: release
        kargo.akuity.io/project: '{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/sync-wave: "5"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: release
      source:
        repoURL: https://github.com/tesserix/kargo-manifests.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
        directory:
          recurse: true
          jsonnet: {}
      destination:
        server: https://kubernetes.default.svc
        namespace: 'kargo-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # ApplyOutOfSyncOnly is deliberately ABSENT: since the ArgoCD 3
          # upgrade (2026-06-12) the sync-time diff disagrees with the
          # status diff for Kargo's open-schema CRDs, so with that option
          # the operation filtered every resource out and reported
          # "Succeeded" in 0s while applying nothing — spec changes to
          # Warehouses/Stages never reached the cluster. These apps hold
          # a handful of small CRs; applying all of them each sync is free.
          - PruneLast=true
          # RespectIgnoreDifferences is deliberately ABSENT too. The
          # ignoreDifferences rules for Kargo CRDs in argocd-cm are scoped
          # *inside arrays* (`.spec.subscriptions[]?.chart.discoveryLimit`,
          # `.spec.promotionTemplate.spec.steps[]?.retry.timeout`). At sync
          # time those exclusions cannot be expressed as a merge patch on an
          # array, so the whole `subscriptions` / `steps` array was dropped
          # from the object being applied: every sync reported
          # "serverside-applied" while the Warehouse stayed at generation 1.
          # That is how the allowTags→regex migration sat unapplied for weeks. Diff-time normalisation still
          # works (the rules stay in argocd-cm) — only sync-time respect is
          # off, so a sync now applies the full spec from git.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m

  # Treat kargo-manifests as authoritative — pruned directories must
  # propagate to the cluster.
  syncPolicy:
    preserveResourcesOnDeletion: false
