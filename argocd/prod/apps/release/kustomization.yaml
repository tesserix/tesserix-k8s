apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Release / promotion tooling — fed from the kargo-manifests repo.
resources:
  # Cluster-scoped reusable PromotionTasks (one Application — single git path)
  - kargo-templates-app.yaml
  # Per-project ApplicationSet — one Argo CD Application per
  # projects/<name>/ directory in kargo-manifests.
  - kargo-projects-appset.yaml
