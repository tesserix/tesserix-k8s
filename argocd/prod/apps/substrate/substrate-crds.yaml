# STAGED — not wired into any kustomization; MANUAL sync (no automated).
# Installs the Agent Substrate CRDs (WorkerPool, ActorTemplate, …). Safe (CRDs
# only) but gated behind the runbook so nothing deploys before the sandbox node
# pool exists. See devai/docs/agentic/SUBSTRATE-SETUP.md. Pin targetRevision to a
# real version (step 2) before syncing — do NOT float latest on prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-substrate
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/substrate/helm
    chart: substrate-crds
    targetRevision: PIN-ME # `helm show chart oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds`
    helm:
      releaseName: substrate-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  # MANUAL sync on purpose — operator syncs per the runbook, after the node pool.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
