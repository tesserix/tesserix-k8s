apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hms-db-seed
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hospital-management
    app.kubernetes.io/component: database-seed
    environment: prod
  annotations:
    # Run after PostgreSQL and before HMS services
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: hms
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/hms-db-seed
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
