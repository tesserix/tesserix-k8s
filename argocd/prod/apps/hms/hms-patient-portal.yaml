apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hms-patient-portal
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hospital-management
    app.kubernetes.io/component: frontend
    environment: prod
spec:
  project: hms
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/hms-patient-portal
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "1.0.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: hms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
