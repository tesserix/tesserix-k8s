apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helivanta-shell
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: helivanta
    app.kubernetes.io/component: shell
    environment: prod
  annotations:
    # Kargo writes image.tag onto this Application's helm parameters when the
    # kargo-helivanta:prod Stage promotes (#824 Task 8). Without this
    # annotation Kargo refuses to touch it — the authorization is on the
    # Application, not on the Stage.
    #
    # The app-of-apps already carries the matching
    # ignoreDifferences on /spec/source/helm/parameters, added in slice 1a in
    # anticipation of exactly this. Both halves are required: the annotation
    # lets Kargo write, ignoreDifferences stops git and Kargo fighting over
    # what it wrote. dwellm8's own comment records what omitting the second
    # costs — a stale image.tag that git can no longer remove.
    kargo.akuity.io/authorized-stage: kargo-helivanta:prod
    # After helivanta-api (-1). Not because the shell needs the API to boot —
    # it does not; its API calls happen in the browser — but because the first
    # page a signed-out clinician loads immediately calls /api/v1/auth/login,
    # and a namespace brought up cold in the other order serves a shell whose
    # every request fails for as long as the API takes to arrive.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helivanta
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/helivanta-shell
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helivanta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
