apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helivanta-global-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: helivanta
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    kargo.akuity.io/authorized-stage: kargo-helivanta:prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helivanta
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: c6e12219e98ad181c06baf21f530e38f5e85ba48
    path: charts/apps/helivanta-global-api
    helm:
      valuesObject:
        supplierTrade:
          enabled: true
        clinicalConsent:
          enabled: true
      valueFiles: [values.yaml]
      parameters:
        - name: image.tag
          value: "6eb1d9b46e90bb2e92adee0b3c1a78bbaf65f6d9@sha256:f1daa40dff765eb85a4eb0abc9fba2171f0ff9010a8c595d68fb175c70462be0"
  destination:
    server: https://kubernetes.default.svc
    namespace: helivanta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
