apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helivanta-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: helivanta
    app.kubernetes.io/component: api
    environment: prod
  annotations:
    # Kargo writes image.tag onto this Application's helm parameters when the
    # kargo-helivanta:prod Stage promotes (#824 Task 8). Without this
    # annotation Kargo refuses to touch it — the authorization is on the
    # Application, not on the Stage.
    #
    # The app-of-apps already carries the matching
    # ignoreDifferences on /spec/source/helm/parameters, added in slice 1a in
    # anticipation of exactly this. Both halves are required: the annotation
    # lets Kargo write, ignoreDifferences stops git and Kargo fighting over
    # what it wrote. dwellm8's own comment records what omitting the second
    # costs — a stale image.tag that git can no longer remove.
    kargo.akuity.io/authorized-stage: kargo-helivanta:prod
    # After the broker (-6) and the authorization engine (-2) — both are
    # dependencies /readyz checks at request time (postgres, nats, openfga),
    # so this pod would otherwise boot straight into a permanently-unready
    # state on a cold namespace bring-up.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helivanta
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: c6e12219e98ad181c06baf21f530e38f5e85ba48
    path: charts/apps/helivanta-api
    helm:
      parameters:
        - name: image.tag
          value: "6eb1d9b46e90bb2e92adee0b3c1a78bbaf65f6d9@sha256:f1daa40dff765eb85a4eb0abc9fba2171f0ff9010a8c595d68fb175c70462be0"
      valuesObject:
        supplierTrade:
          enabled: true
          kubernetesApiCIDR: 172.16.0.2/32
        env:
          WORKFORCE_EMPLOYMENT_ACTIVATION_ENABLED: "true"
        clinicalConsent:
          enabled: true
          proxyCaptureEnabled: true
          kubernetesApiCIDR: 172.16.0.2/32
        meshRegistryRevision: gar-2026-10-19
        emergencyDispatch: {enabled: true, acceptNew: false}
        supplyEvidence: {enabled: true}
        pharmacyEvidence: {enabled: true}
        documents:
          enabled: true
          acceptUploads: true
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helivanta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
