apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helivanta-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: helivanta
    app.kubernetes.io/component: api
    environment: prod
  annotations:
    # After the broker (-6) and the authorization engine (-2) — both are
    # dependencies /readyz checks at request time (postgres, nats, openfga),
    # so this pod would otherwise boot straight into a permanently-unready
    # state on a cold namespace bring-up.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helivanta
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/helivanta-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helivanta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
