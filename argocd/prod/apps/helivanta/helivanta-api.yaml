apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helivanta-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: helivanta
    app.kubernetes.io/component: api
    environment: prod
  annotations:
    # Kargo writes image.tag onto this Application's helm parameters when the
    # kargo-helivanta:prod Stage promotes (#824 Task 8). Without this
    # annotation Kargo refuses to touch it — the authorization is on the
    # Application, not on the Stage.
    #
    # The app-of-apps already carries the matching
    # ignoreDifferences on /spec/source/helm/parameters, added in slice 1a in
    # anticipation of exactly this. Both halves are required: the annotation
    # lets Kargo write, ignoreDifferences stops git and Kargo fighting over
    # what it wrote. dwellm8's own comment records what omitting the second
    # costs — a stale image.tag that git can no longer remove.
    kargo.akuity.io/authorized-stage: kargo-helivanta:prod
    # After the broker (-6) and the authorization engine (-2) — both are
    # dependencies /readyz checks at request time (postgres, nats, openfga),
    # so this pod would otherwise boot straight into a permanently-unready
    # state on a cold namespace bring-up.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: helivanta
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/helivanta-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helivanta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
