apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civiclens-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: civiclens
    app.kubernetes.io/component: civiclens-services
    environment: prod
spec:
  project: civiclens
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/civiclens
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kargo writes image.tag onto the child Application; the parent must not revert it.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
