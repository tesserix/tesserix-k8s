apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beautyandcruor-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: beautyandcruor
    app.kubernetes.io/component: beautyandcruor-services
    environment: prod
spec:
  project: beautyandcruor
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/beautyandcruor
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
