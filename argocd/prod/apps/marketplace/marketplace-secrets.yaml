apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketplace-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: marketplace
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: sealedsecret/prod/marketplace
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  ignoreDifferences:
    - group: serving.knative.dev
      kind: Service
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/image  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
