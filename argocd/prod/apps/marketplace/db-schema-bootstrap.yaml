apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketplace-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: marketplace
    app.kubernetes.io/component: database
    environment: prod
spec:
  project: marketplace
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: marketplace-db-schema-bootstrap
      values: |
        app: marketplace

        targets:
          - name: marketplace
            host: postgresql.postgresql-marketplace.svc.cluster.local
            port: 5432
            user: postgres
            secretName: postgresql-marketplace-password
            secretKey: postgresql-password

  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
