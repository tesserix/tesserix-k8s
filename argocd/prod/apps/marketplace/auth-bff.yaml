apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketplace-auth-bff
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: marketplace
    app.kubernetes.io/component: auth
    environment: prod
spec:
  project: marketplace
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/auth-bff
    targetRevision: HEAD
    helm:
      releaseName: marketplace-auth-bff
      values: |
        fullnameOverride: "auth-bff"

        image:
          repository: ghcr.io/tesserix/auth-bff
          tag: "latest"

        replicaCount: 1

        podAnnotations:
          proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
          traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
          traffic.sidecar.istio.io/excludeOutboundPorts: "443"

        # Fix probe paths - auth-bff uses /health not /health/live or /health/ready
        livenessProbe:
          enabled: true
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          enabled: true
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          enabled: true
          httpGet:
            path: /health
            port: http
          failureThreshold: 10
          periodSeconds: 5

        serviceAccount:
          annotations:
            iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

        env:
          GIN_MODE: "release"
          APP_ENV: "production"
          ENVIRONMENT: "production"
          BASE_DOMAIN: "mark8ly.com"
          ALLOWED_ORIGINS: "https://*.mark8ly.com,https://tesserix.app,https://www.tesserix.app"
          PORT: "8080"
          SERVICE_AUTH_MODE: "mesh"
          GCP_PROJECT_ID: "tesseracthub-480811"
          TENANT_SERVICE_URL: "http://tenant-service-direct.marketplace.svc.cluster.local:8080"
          VERIFICATION_SERVICE_URL: "http://verification-service-direct.marketplace.svc.cluster.local:8080"
          SESSION_MAX_AGE: "172800"
          REDIS_URL: "redis://redis.redis-marketplace.svc.cluster.local:6379"
          RATE_LIMIT_RPM: "300"
          WEBAUTHN_RP_ID: "mark8ly.com"
          WEBAUTHN_RP_NAME: "Mark8ly"
          OPENFGA_URL: "http://openfga-direct.marketplace.svc.cluster.local:8080"
          OPENFGA_AUTH_MODE: "mesh"

        gcp:
          projectId: tesseracthub-480811
          secretManager:
            secretPrefix: "prod"

        keda:
          enabled: false

        externalSecrets:
          enabled: true
          secretStoreRef: gcp-secret-store

  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
