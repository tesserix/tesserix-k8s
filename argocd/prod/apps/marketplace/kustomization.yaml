apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Secrets (must be first - sync-wave: -5)
  - marketplace-secrets.yaml
  # Backend services (Go, Knative)
  - mp-products.yaml
  - mp-orders.yaml
  - mp-payments.yaml
  - mp-inventory.yaml
  - mp-shipping.yaml
  - mp-categories.yaml
  - mp-coupons.yaml
  - mp-reviews.yaml
  - mp-vendors.yaml
  - mp-customers.yaml
  - mp-staff.yaml
  - mp-content.yaml
  - mp-approvals.yaml
  - mp-gift-cards.yaml
  - mp-marketing.yaml
  - mp-connector.yaml
  - mp-tax.yaml
  # Frontend services (Next.js, Knative)
  - marketplace-admin.yaml
  - marketplace-onboarding.yaml
  - mp-storefront.yaml
  # Auth BFF (GIP authentication gateway)
  - auth-bff.yaml
  # OpenFGA (authorization engine — required by all marketplace services for RBAC)
  - openfga.yaml
  # Database schema bootstrap (CronJob, runs every 30min)
  - db-schema-bootstrap.yaml
