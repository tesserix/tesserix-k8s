apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-namespace
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: security
    app.kubernetes.io/component: namespace
    environment: prod
  annotations:
    # Namespace, mesh policy and NetworkPolicies must exist before OpenBao.
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: security
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/openbao-namespace
    helm:
      releaseName: openbao-namespace
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
