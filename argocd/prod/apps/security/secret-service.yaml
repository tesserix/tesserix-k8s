apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: security
    app.kubernetes.io/component: console
    environment: prod
  annotations:
    # After OpenBao: the API's Kubernetes auth role is created by the bootstrap
    # Job, and without it the readiness probe never passes.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: security
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/secret-service
    helm:
      releaseName: secret-service
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: secret-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
