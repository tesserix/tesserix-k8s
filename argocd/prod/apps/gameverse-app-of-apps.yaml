apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gameverse-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: gameverse-services
    environment: prod
spec:
  project: gameverse
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/gameverse
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Same reason as fanzone/mark8ly/homechef/blog: Kargo writes
  # spec.source.helm.parameters.image.tag on child Applications during
  # a Promotion. Without this exception, this parent app-of-apps would
  # revert every Kargo update via selfHeal.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
