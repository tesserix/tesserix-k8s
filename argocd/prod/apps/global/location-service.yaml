apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: location-service
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-prod:location-service-prod
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: backend
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/location-service
    helm:
      valueFiles:
      - values.yaml
      - values-prod.yaml
      - ../global-config-prod.yaml
      parameters:
      - name: image.tag
        value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
