apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-usage-ingest
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: ai-usage
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/ai-usage-ingest
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "latest"
  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  # Automated sync is deliberately absent for the first release. The ledger's
  # tables (apps/web/db/migrations 0030) and the ReferenceGrant this chart
  # creates must both exist before the gateway starts exporting, and a manual
  # first sync is where that is checked.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
