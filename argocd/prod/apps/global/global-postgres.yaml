apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: global-postgres
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: global
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/global-postgres
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: global
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # RespectIgnoreDifferences is deliberately absent — same trap as
      # dwellm8-postgres. With SSA and the argocd-cm jq ignores into
      # spec.managed.roles[], it normalised the roles list out of every apply:
      # sync reported Succeeded, the Cluster's generation never moved, and the
      # onboarding role could not land. The ignore rules still quiet the diff.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
