apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: huggingface-mt-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: translation
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/huggingface-mt-service
    helm:
      valueFiles:
      - values.yaml
      - values-prod.yaml
      - ../global-config-prod.yaml
      parameters:
      - name: image.tag
        value: "1.3.2"
      - name: gcp.workloadIdentity.gcpServiceAccount
        value: app-secrets-marketplace@tesseracthub-480811.iam.gserviceaccount.com
  destination:
    server: https://kubernetes.default.svc
    namespace: translation
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
