apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: questionnaires-db-schema-bootstrap
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/db-schema-bootstrap
    helm:
      valuesObject:
        image:
          postgres: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        app: questionnaires
        namespaceOverride: tesserix
        schedule: '*/5 * * * *'
        targets:
          - name: tesserix
            host: tesserix-postgres-rw.tesserix.svc.cluster.local
            port: 5432
            user: tesserix_admin
            secretName: tesserix-postgres-tesserix-admin
            secretKey: password
            combineInto: questionnaires
            reapplyExistingSchemas: [questionnaires]
  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions: [ServerSideApply=true]
