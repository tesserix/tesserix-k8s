apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yes-hospital
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: frontend
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/yes-hospital
    helm:
      valueFiles:
      - values.yaml
      parameters:
      - name: image.tag
        value: "1.3.0"
      # Production domain
      - name: ingress.hosts[0].host
        value: yes-hospital.mark8ly.com
  destination:
    server: https://kubernetes.default.svc
    namespace: yes-hospital
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
