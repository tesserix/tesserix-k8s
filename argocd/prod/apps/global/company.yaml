apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: company
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-tesserix-home:prod
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: frontend
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/company
    helm:
      valueFiles:
      - values.yaml
      - values-prod.yaml
      - ../global-config-prod.yaml
      parameters:
      # Per-commit SHA tag rather than `latest`. The GAR remote-repository
      # mirror caches the digest behind `latest` aggressively; pinning the
      # SHA forces a fresh pull on every CI build. Kargo's prod Stage
      # (kargo-tesserix-home:prod) rewrites this value when a new
      # main-<sha> image lands — see kargo-manifests/projects/tesserix-home.
      - name: image.tag
        value: "main-e2aeda2"
      - name: ingress.hosts[0].host
        value: tesserix.app
      - name: ingress.tls[0].hosts[0]
        value: tesserix.app
      - name: env.NEXT_PUBLIC_SITE_URL
        value: https://tesserix.app
      - name: env.AUTH_BFF_URL
        value: http://auth-bff.marketplace.svc.cluster.local:8080
      - name: env.TENANT_SERVICE_URL
        value: http://tenant-service.marketplace.svc.cluster.local:8080
      - name: env.TICKETS_SERVICE_URL
        value: http://tickets-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.AUDIT_SERVICE_URL
        value: http://audit-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.STATUS_DASHBOARD_SERVICE_URL
        value: http://status-dashboard-service.marketplace.svc.cluster.local:8097/api/v1
      - name: env.FEATURE_FLAGS_SERVICE_URL
        value: http://feature-flags-service.marketplace.svc.cluster.local:8096/api/v1
      - name: env.NOTIFICATION_SERVICE_URL
        value: http://notification-service.marketplace.svc.cluster.local:8090/api/v1
      # Mark8ly /internal endpoints — used by tesserix-home's email-templates
      # admin UI to evict the per-process template cache after a save and to
      # fire test-sends through the real send pipeline. In-cluster URLs (no
      # CF egress). NetworkPolicy + AuthorizationPolicy on the mark8ly side
      # restrict who can reach /internal/*.
      #
      # marketplace-api runs as two Knative services (admin + storefront)
      # in prod; we point at -admin because the operator-driven /internal
      # endpoints are mounted on the admin pod (storefront stays minimal).
      # The storefront pod has its own template cache that ages out via
      # the 5-min TTL, which is acceptable for runtime sends.
      - name: env.MARK8LY_PLATFORM_API_URL
        value: http://mark8ly-platform-api.mark8ly.svc.cluster.local:8086
      - name: env.MARK8LY_MARKETPLACE_API_URL
        value: http://mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080
      # Workload identity for this pod. MUST live here as a helm PARAMETER,
      # not in charts/apps/company/values-prod.yaml: valueFiles below are
      # ordered values.yaml -> values-prod.yaml -> ../global-config-prod.yaml,
      # so the shared global file is applied LAST and silently beats anything
      # values-prod.yaml sets. Parameters outrank every value file, so this is
      # the only place a per-app override actually takes effect. (An override
      # was first written into values-prod.yaml; the sync went green and the
      # ServiceAccount annotation did not change.)
      #
      # Overrides global-config-prod.yaml's shared default,
      # app-secrets-marketplace-prod, for two reasons:
      #
      # 1. It was broken for this namespace. That GSA's workloadIdentityUser
      #    binding lists 42 members, none from `tesserix`, so the KSA was
      #    annotated to impersonate an account that did not trust it back.
      #    Every Secret Manager call 403'd with "Permission
      #    'iam.serviceAccounts.getAccessToken' denied", and the Kora overview
      #    read "AI keys configured: 0" under a hint saying "should be 2"
      #    while both keys existed.
      #
      # 2. That shared GSA holds PROJECT-LEVEL secretmanager.admin — admin over
      #    every secret in tesseracthub-480811, mark8ly's and homechef's
      #    included — for a feature that reads two secrets' version metadata.
      #
      # kora-key-health-prod holds secretmanager.viewer on exactly
      # prod-kora-gemini-api-key and prod-kora-openai-api-key. viewer, NOT
      # secretAccessor: lib/secrets/key-health.ts calls listSecretVersions and
      # never accessSecretVersion, so the portal cannot read a key VALUE even
      # if code later tried to. Key rotation (2026-08-05 spec) would need
      # secretmanager.secretVersionAdder added deliberately, not a revert to
      # the admin account.
      #
      # Not yet in Terraform — the app-secrets-* accounts live in
      # tesserix-infra. Created out-of-band; fold in to stop it drifting.
      - name: gcp.workloadIdentity.gcpServiceAccount
        value: kora-key-health-prod@tesseracthub-480811.iam.gserviceaccount.com
  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  # Deploy is owned by Kargo (kargo-tesserix-home:prod), which rewrites
  # the `image.tag` Helm parameter above to the freshly-built main-<sha>
  # tag. Because that tag is unique per build (never :latest), the chart
  # renders a distinct image every time and the GAR mirror always pulls
  # fresh — so the old ignoreDifferences/RespectIgnoreDifferences hack
  # (which was needed when CI ran `kubectl set image`) is no longer
  # required, and Argo reconciles the image normally.
  syncPolicy:
    automated:
      # prune: true is required for this app to ever converge. With only
      # selfHeal, a resource deleted from the chart stays in the cluster
      # forever and the app is pinned OutOfSync -- which is what kept the
      # decommissioned Kong Ingress alive and the app amber.
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
