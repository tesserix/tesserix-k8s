apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: company
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: tesserix-prod:company-prod
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: frontend
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/company
    helm:
      valueFiles:
      - values.yaml
      - values-prod.yaml
      - ../global-config-prod.yaml
      parameters:
      - name: image.tag
        value: "latest"
      - name: ingress.hosts[0].host
        value: tesserix.app
      - name: ingress.tls[0].hosts[0]
        value: tesserix.app
      - name: env.NEXT_PUBLIC_SITE_URL
        value: https://tesserix.app
      - name: env.AUTH_BFF_URL
        value: http://auth-bff.marketplace.svc.cluster.local:8080
      - name: env.TENANT_SERVICE_URL
        value: http://tenant-service.marketplace.svc.cluster.local:8080
      - name: env.TICKETS_SERVICE_URL
        value: http://tickets-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.AUDIT_SERVICE_URL
        value: http://audit-service.marketplace.svc.cluster.local:8080/api/v1
      - name: env.STATUS_DASHBOARD_SERVICE_URL
        value: http://status-dashboard-service.marketplace.svc.cluster.local:8097/api/v1
      - name: env.FEATURE_FLAGS_SERVICE_URL
        value: http://feature-flags-service.marketplace.svc.cluster.local:8096/api/v1
      - name: env.NOTIFICATION_SERVICE_URL
        value: http://notification-service.marketplace.svc.cluster.local:8090/api/v1
  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  # CI sets the deployment's image to a specific SHA tag after each build
  # (see tesserix-home/.github/workflows/ci.yml). This is necessary because
  # the GAR remote-repository mirror caches :latest's digest aggressively
  # and would otherwise serve stale content to kubelet on rollout. We
  # therefore exclude the image field from reconciliation — Argo will not
  # revert CI's pinned SHA back to whatever the chart renders.
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: company
    namespace: tesserix
    jsonPointers:
    - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
