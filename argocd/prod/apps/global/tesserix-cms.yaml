apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tesserix-cms
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: cms
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/tesserix-cms
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # Pin the per-commit SHA tag (ghcr.io/tesserix/tesserix-cms, pulled
        # through the GAR mirror). Bump this to promote a new build.
        - name: image.tag
          value: "main-4af2ec0"
  destination:
    server: https://kubernetes.default.svc
    # Labels (ambient enrollment, deletion guard) come from istio-config.
    namespace: cms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
