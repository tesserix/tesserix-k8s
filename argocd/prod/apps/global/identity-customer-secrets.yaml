apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-customer-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: identity
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: sealedsecret/prod/identity-customer
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: identity-customer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
