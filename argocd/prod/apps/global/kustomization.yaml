apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Global namespace secrets
  - global-secrets.yaml
  # Platform services (deploy to marketplace namespace)
  - analytics-service.yaml
  - audit-service.yaml
  - document-service.yaml
  - feature-flags-service.yaml
  - location-service.yaml
  - notification-hub.yaml
  - notification-service.yaml
  - qr-service.yaml
  - search-service.yaml
  - settings-service.yaml
  - status-dashboard-service.yaml
  - subscription-service.yaml
  - tenant-router-service.yaml
  - tenant-service.yaml
  - tickets-service.yaml
  - verification-service.yaml
  # Company / tesserix-home
  - company.yaml
  # Translation services
  - bergamot-service.yaml
  - huggingface-mt-service.yaml
  - translation-service.yaml
  - translation-secrets.yaml
  # Identity
  - identity-customer-secrets.yaml
  # Other
  - yes-hospital.yaml
  # Database bootstrap (CronJob, runs every 30min)
  - db-schema-bootstrap.yaml
