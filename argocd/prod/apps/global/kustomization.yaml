apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Global namespace secrets
  # Company / tesserix-home
  - company.yaml
  # Console — operator-only surface at console.tesserix.app, built from the
  # same tesserix-home repo (apps/console) and promoted by the same Kargo
  # project as `company`.
  - console.yaml
  # Platform API — the Go modular monolith (ADR-003 D2), from the same
  # tesserix-home repo (platform-api/) and the same Kargo project. Unlike its
  # two siblings it is cluster-internal: no ingress, no VirtualService, no
  # hostname parameter. The console calls it over the in-namespace ClusterIP.
  - platform-api.yaml
  # tesserix-auth-bff — OIDC gateway for tesserix.app super-admin portal
  - tesserix-auth-bff.yaml
  # tesserix-postgres — CNPG cluster owning the super-admin's local data
  # (apps registry + leads). Cross-product reads happen live; no ETL.
  - tesserix-postgres.yaml
  # Identity
  # CNPG PostgreSQL
  - global-postgres.yaml
  - global-valkey-cache.yaml
  - global-valkey-queue.yaml
  # Platform: weekly Secret Manager version retention enforcement
  - sm-version-cleanup.yaml
  # Identity platform: every-6h CronJob that pins admin custom claims
  # on the GIP Internal tenant to the prod-platform-admin-emails list.
  - gip-admin-claims.yaml
  # AI usage ingest — OTLP receiver in front of JetStream, filling the
  # console's cost and token ledger from the agentgateway data plane.
  - ai-usage-ingest.yaml
  # Schema bootstrap for global Postgres (CNPG)
  - global-db-schema-bootstrap.yaml
  # Design system: docs site and Storybook
  - tesserix-docs.yaml
  - tesserix-storybook.yaml
  # Yes Hospital & Research Centre — Next.js marketing site (yes-hospital.tesserix.app)
  - yes-hospital.yaml
