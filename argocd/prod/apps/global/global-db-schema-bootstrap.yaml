apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: global-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: global
    app.kubernetes.io/component: database
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: global-db-schema-bootstrap
      values: |
        app: global

        targets:
          - name: global
            host: global-postgres-rw.global.svc.cluster.local
            port: 5432
            user: global
            secretName: global-postgres-app-credentials
            secretKey: password
            # onboarding-service has no application-side migration runner. Its
            # SQL is idempotent, so reconcile only this existing database while
            # leaving every other global snapshot in provision-only mode.
            reapplyExistingSchemas:
              - onboarding_db
              # devai_evals_db has no migration runner either: the sandbox
              # sync worker only TRUNCATE+COPYs. Its SQL is idempotent, and
              # reapplying converges grants for the devai_evals role, which
              # CNPG creates asynchronously.
              - devai_evals_db
              # evals_db is grader-written; its SQL owns the schema and converges grader grants.
              - evals_db
  destination:
    server: https://kubernetes.default.svc
    namespace: global
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
