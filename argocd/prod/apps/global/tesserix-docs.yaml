apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tesserix-docs
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: frontend
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/tesserix-docs
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
        - ../global-config-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  # Strip Deployment .status.terminatingReplicas before diff — K8s 1.32 added
  # this field but the ArgoCD version running here has an older OpenAPI schema,
  # which causes "field not declared in schema" ComparisonError and blocks sync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
