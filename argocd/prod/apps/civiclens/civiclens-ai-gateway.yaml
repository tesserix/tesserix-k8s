apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civiclens-ai-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: civiclens
spec:
  project: civiclens
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/civiclens-ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions: [PruneLast=true]
