apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civiclens-api
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-civiclens:prod
  labels:
    app.kubernetes.io/part-of: civiclens
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: civiclens
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/civiclens-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: civiclens
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
