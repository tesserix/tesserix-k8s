apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-web-app
  namespace: argocd
  annotations:
    # Lets the kargo-homechef prod Stage write image.tag into this Application.
    # Without it Kargo refuses the update and the SPA can only be deployed by
    # patching the Application by hand — which also drifts, because the
    # app-of-apps sets ignoreDifferences on /spec/source/helm/parameters, so a
    # tag committed to git here never reaches the cluster.
    kargo.akuity.io/authorized-stage: kargo-homechef:prod
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: frontend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/homechef-web-app
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "main-c018e8f"
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
