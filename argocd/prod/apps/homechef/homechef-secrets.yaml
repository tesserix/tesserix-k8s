apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: secrets
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: sealedsecret/homechef
    directory:
      recurse: false
      include: "*.sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
