apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-identity-bootstrap
  namespace: argocd
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: manifests/homechef-park
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      selfHeal: true
