apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-identity-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: identity
    environment: prod
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/identity-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: homechef-identity-bootstrap
      values: |
        app: homechef

        targets:
          # Customer Keycloak — customer/vendor/delivery login
          - name: customer
            url: http://keycloak.identity-customer.svc.cluster.local:8080
            adminSecretName: keycloak-customer-admin
            realm:
              name: homechef
              displayName: HomeChef
              registrationAllowed: true
              loginWithEmailAllowed: true
              resetPasswordAllowed: true
            clients:
              - clientId: homechef-bff
                publicClient: true
                rootUrl: https://fe3dr.com
                redirectUris:
                  - "https://fe3dr.com/*"
                  - "https://www.fe3dr.com/*"
                  - "https://vendors.fe3dr.com/*"
                  - "https://delivery.fe3dr.com/*"
                  - "http://localhost:5173/*"
                webOrigins:
                  - "https://fe3dr.com"
                  - "https://www.fe3dr.com"
                  - "https://vendors.fe3dr.com"
                  - "https://delivery.fe3dr.com"
                  - "http://localhost:5173"
            identityProviders:
              - alias: google
                providerId: google
                displayName: Sign in with Google
                defaultScope: "openid email profile"
                gcpSecretClientId: prod-google-client-id
                gcpSecretClientSecret: prod-google-client-secret
            adminUsers:
              - email: samyak.rout@gmail.com
                firstName: Samyak
                lastName: Rout
              - email: mahesh.sangawar@gmail.com
                firstName: Mahesh
                lastName: Sangawar
              - email: unidevidp@gmail.com
                firstName: Admin
                lastName: User

          # Internal Keycloak — admin portal login
          - name: internal
            url: http://keycloak.identity-internal.svc.cluster.local:8080
            adminSecretName: keycloak-internal-admin
            realm:
              name: tesserix-internal
              displayName: Tesserix Internal
              registrationAllowed: false
              loginWithEmailAllowed: true
              resetPasswordAllowed: false
            clients:
              - clientId: admin-bff
                publicClient: false
                rootUrl: https://admin.fe3dr.com
                redirectUris:
                  - "https://admin.fe3dr.com/*"
                  - "http://localhost:3001/*"
                webOrigins:
                  - "https://admin.fe3dr.com"
                  - "http://localhost:3001"
            identityProviders:
              - alias: google
                providerId: google
                displayName: Sign in with Google
                defaultScope: "openid email profile"
                gcpSecretClientId: prod-google-client-id
                gcpSecretClientSecret: prod-google-client-secret
            adminUsers:
              - email: samyak.rout@gmail.com
                firstName: Samyak
                lastName: Rout
              - email: mahesh.sangawar@gmail.com
                firstName: Mahesh
                lastName: Sangawar
              - email: unidevidp@gmail.com
                firstName: Admin
                lastName: User

        gcp:
          enabled: true
          project: tesseracthub-480811

  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
