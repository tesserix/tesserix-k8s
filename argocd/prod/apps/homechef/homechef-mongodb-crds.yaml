apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-mongodb-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/component: chat-database
    environment: prod
  annotations:
    # CRDs first — the operator + CR depend on them.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://percona.github.io/percona-helm-charts/
    chart: psmdb-operator-crds
    targetRevision: 1.22.0
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
