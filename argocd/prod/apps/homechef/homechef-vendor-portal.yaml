apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-vendor-portal
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-homechef:prod
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: vendor-portal
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/homechef-vendor-portal
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "main-0fb5c78"
        - name: ingress.hosts[0].host
          value: vendors.fe3dr.com
        - name: env.VITE_API_URL
          value: https://vendors.fe3dr.com/api/v1
        - name: env.VITE_BFF_URL
          value: https://vendors.fe3dr.com/bff
        - name: env.VITE_WS_URL
          value: wss://vendors.fe3dr.com/ws
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
