apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-mongodb
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/component: chat-database
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Percona Server for MongoDB (OSS) managed by the Percona Operator — replaces
  # the hand-rolled single-node StatefulSet with an operator-managed 3-member
  # replica set (HA, users-via-secret, TLS via cert-manager, PBM-ready). #53.
  source:
    repoURL: https://percona.github.io/percona-helm-charts/
    chart: psmdb-db
    targetRevision: 1.22.2
    helm:
      values: |
        fullnameOverride: homechef-mongodb
        # Replica set only — no sharding for a single chat DB.
        sharding:
          enabled: false
          # Disabled, but the chart still writes these into the CR spec, and
          # its defaults carry cpu. Null them so the CR stays memory-only.
          configrs:
            resources:
              requests:
                cpu: null
              limits:
                cpu: null
          mongos:
            resources:
              requests:
                cpu: null
              limits:
                cpu: null
        logcollector:
          resources:
            requests:
              cpu: null
        replsets:
          rs0:
            name: rs0
            hidden:
              resources:
                requests:
                  cpu: null
                limits:
                  cpu: null
            nonvoting:
              resources:
                requests:
                  cpu: null
                limits:
                  cpu: null
            arbiter:
              resources:
                requests:
                  cpu: null
                limits:
                  cpu: null
            size: 3
            # Opt the mongod pods out of the namespace L7 waypoint
            # (istio.io/use-waypoint=waypoint). The waypoint mangles raw,
            # non-HTTP protocols — the same fix devai-postgres uses for raw
            # PostgreSQL and temporal uses for gRPC — so MongoDB wire traffic
            # rides ztunnel L4 (mTLS) directly. Without this the API's
            # connection is closed mid-handshake (EOF).
            labels:
              istio.io/use-waypoint: none
            # Memory-only resources per the tesserix k8s convention (no CPU).
            resources:
              requests:
                cpu: null
                memory: "512Mi"
              limits:
                cpu: null
                memory: "1Gi"
            volumeSpec:
              pvc:
                storageClassName: standard-rwo
                resources:
                  requests:
                    storage: 20Gi
        # Percona Backup for MongoDB (PBM) → GCS. The operator runs a pbm-agent
        # sidecar in each mongod pod (percona/percona-backup-mongodb, which pulls
        # fine) and streams scheduled backups of homechef_chat (chat #53) to GCS.
        # This is the native replacement for the mongodump CronJob, whose shared
        # db-backup-tools image was never published to Artifact Registry.
        #
        # PBM uses native GCS storage. It can't use Workload Identity — the CR
        # requires a credentialsSecret — so a least-privilege GCS service-account
        # key (GCS_CLIENT_EMAIL / GCS_PRIVATE_KEY) is synced from GCP Secret
        # Manager into the homechef-mongodb-backup-gcs secret by
        # external-secrets/prod/homechef. (SA JSON key, not HMAC: the Percona
        # docs flag a known PBM+GCS-HMAC bug.)
        backup:
          enabled: true
          image:
            repository: percona/percona-backup-mongodb
            tag: 2.12.0
          storages:
            gcs-backups:
              type: gcs
              gcs:
                bucket: tesseract-prod-backups-in
                prefix: homechef-mongodb
                credentialsSecret: homechef-mongodb-backup-gcs
          # Point-in-time recovery. Without this, Mongo's RPO is the gap between
          # base backups (6h) — i.e. up to six hours of chat history lost on a
          # restore. PBM streams oplog slices continuously between backups,
          # which brings Mongo to the same continuous-recovery posture CNPG
          # already has via WAL archiving.
          #
          # PBM requires exactly ONE configured storage for PITR; gcs-backups is
          # the only one, so this is valid. Oplog slices land under the same
          # bucket prefix and are pruned with their parent backup set.
          pitr:
            enabled: true
            oplogOnly: false
            oplogSpanMin: 10
            compressionType: gzip
          tasks:
            # Every 6h (00:00, 06:00, 12:00, 18:00 UTC). 4/day x 30d = 120 sets,
            # matching the 30-day recovery window used for the CNPG clusters.
            # PBM is the chain-aware pruner and deletes its own sets (plus their
            # oplog slices) from the bucket; the bucket lifecycle Delete rule is
            # only a backstop for orphans and MUST stay longer than this window.
            - name: six-hourly-gcs
              enabled: true
              schedule: "0 */6 * * *"
              storageName: gcs-backups
              compressionType: gzip
              retention:
                count: 120
                type: count
                deleteFromStorage: true
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
