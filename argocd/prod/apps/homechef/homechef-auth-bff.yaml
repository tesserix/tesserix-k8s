apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-auth-bff
  namespace: argocd
  annotations:
    # Authorize Kargo's prod stage to update this app's image.tag, same as the
    # other homechef services. Without this Kargo refuses to mutate the app.
    kargo.akuity.io/authorized-stage: kargo-homechef:prod
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/component: auth-bff
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/homechef-auth-bff
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "main-9e8c813"
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
