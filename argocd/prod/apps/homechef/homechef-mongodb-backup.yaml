apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-mongodb-backup
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/component: backup
    environment: prod
  annotations:
    # After the replica set itself (homechef-mongodb is sync-wave 0).
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Automated backups of the in-app chat data (#53): the homechef_chat database
  # on the Percona replica set — conversations, mediated_messages and the GridFS
  # chat_attachments (uploaded documents). mongodump -> GCS twice daily.
  #
  # Runs IN the homechef namespace so it (a) can read the operator-generated
  # backup credentials in homechef-mongodb-secrets and (b) reaches rs0 over the
  # waypoint-bypassed path (the mongod pods carry istio.io/use-waypoint=none, so
  # the wire protocol isn't mangled — same reason the API connects directly).
  #
  # Destination bucket gs://tesseract-prod-backups-in already holds the homechef
  # PostgreSQL (CNPG) backups and carries a cost-tiered lifecycle policy:
  # STANDARD -> NEARLINE @7d -> COLDLINE @15d -> ARCHIVE @30d -> delete @90d
  # (plus noncurrent-version cleanup). So these dumps inherit the same retention
  # automatically — support tickets (Postgres) and chat (Mongo) age out together.
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/mongodb-backup
    targetRevision: HEAD
    helm:
      releaseName: homechef-mongodb-backup
      values: |
        backup:
          enabled: true
          # Twice daily: 00:00 and 12:00 UTC (matches the platform backup cadence).
          schedule: "0 0,12 * * *"

          database:
            host: homechef-mongodb-rs0.homechef.svc.cluster.local
            port: 27017
            authDatabase: admin
            # Least-privilege PBM backup role generated by the Percona operator.
            user: backup
            authEnabled: true
            passwordSecretName: homechef-mongodb-secrets
            passwordSecretKey: MONGODB_BACKUP_PASSWORD

          # Dump every application database (just homechef_chat today); the
          # system databases are excluded.
          settings:
            allDatabases: true
            excludeDatabases:
              - admin
              - local
              - config

          gcs:
            bucket: tesseract-prod-backups-in
            prefix: homechef-mongodb

        # Backup pods talk to rs0 directly (no waypoint); no NetworkPolicy needed.
        networkPolicy:
          enabled: false

        # Ambient mesh: the dump pod is enrolled in ambient, so ztunnel gives it
        # L4 mTLS to rs0 automatically (same path the API uses) — no opt-out
        # needed. Must stay false: the chart's disableMtls renders a
        # selector-LESS PeerAuthentication that would disable mTLS for the WHOLE
        # homechef namespace (the blog backup can set it true only because it
        # lives in a dedicated backup namespace).
        istio:
          disableMtls: false

        # Reuse the homechef Workload Identity SA (bound to
        # app-secrets-homechef-prod@) that the Postgres backups already use to
        # write to tesseract-prod-backups-in — no new IAM binding required.
        serviceAccount:
          create: false
          name: homechef-postgres

        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
