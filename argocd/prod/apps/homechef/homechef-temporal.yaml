apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-temporal
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: orchestrator
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homechef
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/temporal
    helm:
      valueFiles:
        - values-homechef.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
