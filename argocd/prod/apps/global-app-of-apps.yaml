apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: global-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: global-services
    environment: prod
spec:
  project: platform
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/global
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # company (tesserix-home) is Kargo-managed: kargo-tesserix-home:prod
  # writes image.tag onto the live company Application. Without this
  # ignoreDifferences, this app-of-apps' selfHeal reverts that write back
  # to the git-seeded image.tag and the deploy flaps. Mirrors blog-/
  # ai-apps-/homechef-app-of-apps; a no-op for non-Kargo global apps
  # (their helm params already match git).
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
