apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dwellm8
    app.kubernetes.io/component: secrets
    environment: prod
  annotations:
    # Before anything that pulls an image.
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: external-secrets/prod/dwellm8
  destination:
    server: https://kubernetes.default.svc
    namespace: dwellm8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
