apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pull credentials before anything that pulls an image.
  - dwellm8-secrets.yaml
  # CNPG first, then the schema, then the API that needs both.
  - dwellm8-postgres.yaml
  - dwellm8-db-schema-bootstrap.yaml
  - dwellm8-api.yaml
