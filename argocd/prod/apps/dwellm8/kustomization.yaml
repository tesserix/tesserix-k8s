apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The namespace lock first, so nothing runs unprotected even briefly.
  - dwellm8-network-policies.yaml
  # Pull credentials before anything that pulls an image.
  - dwellm8-secrets.yaml
  # CNPG first, then the schema, then the API that needs both.
  - dwellm8-postgres.yaml
  - dwellm8-db-schema-bootstrap.yaml
  # Temporal's own store, then Temporal, then the broker. All before the API,
  # which is the thing that will eventually dial them.
  - dwellm8-temporal-postgres.yaml
  - dwellm8-temporal.yaml
  - dwellm8-nats.yaml
  # The verb half of ADR-0020; the API fails closed without it.
  - dwellm8-openfga.yaml
  - dwellm8-api.yaml
