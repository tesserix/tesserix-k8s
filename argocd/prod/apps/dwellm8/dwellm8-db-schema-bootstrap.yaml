apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-db-schema-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dwellm8
    app.kubernetes.io/component: database
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/db-schema-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: dwellm8-db-schema-bootstrap
      values: |
        app: dwellm8

        # Dwellm8's schema file is idempotent by construction, not a frozen
        # pg_dump, and no ORM manages these tables at runtime — so replaying it
        # converges rather than diverges. The chart's default is false because
        # of HomeChef, where a snapshot fought GORM AutoMigrate on a 30-minute
        # loop; that failure mode does not exist here.
        applySchemaToExistingDatabases: true

        targets:
          - name: dwellm8
            host: dwellm8-postgres-rw.dwellm8.svc.cluster.local
            port: 5432
            user: dwellm8
            secretName: dwellm8-postgres-app-credentials
            secretKey: password
          # OpenFGA's datastore (ADR-0020). The bootstrap creates the database
          # and hands the openfga role its grants; the schema inside is
          # OpenFGA's own, applied by the dwellm8-openfga migrate Job.
          - name: openfga
            host: dwellm8-postgres-rw.dwellm8.svc.cluster.local
            port: 5432
            user: dwellm8
            secretName: dwellm8-postgres-app-credentials
            secretKey: password
  destination:
    server: https://kubernetes.default.svc
    namespace: dwellm8
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Server-side apply, because the schema outgrew client-side apply.
      #
      # A client-side apply stores the whole object in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, and an
      # annotation may not exceed 262144 bytes. dwellm8.sql passed that on
      # 2026-07-31 (271,708 bytes, with ADR-0022's mandates section) and every
      # sync failed on it:
      #
      #   ConfigMap "dwellm8-db-schema-bootstrap-schemas-dwellm8" is invalid:
      #   metadata.annotations: Too long: may not be more than 262144 bytes
      #
      # The failure is loud in ArgoCD and silent everywhere else: the CronJob
      # keeps running happily against the *old* ConfigMap, reports "OK — no
      # unexpected errors", and the new tables simply never appear. Server-side
      # apply writes no such annotation, which removes the ceiling rather than
      # postponing it. dwellm8-api already uses it.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
