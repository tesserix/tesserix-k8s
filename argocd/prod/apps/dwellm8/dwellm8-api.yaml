apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-api
  namespace: argocd
  annotations:
    # Without this Kargo refuses to write the promoted tag onto this app.
    kargo.akuity.io/authorized-stage: kargo-dwellm8:prod
  labels:
    app.kubernetes.io/part-of: dwellm8
    app.kubernetes.io/component: api
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/dwellm8-api
    helm:
      valueFiles:
        - values.yaml
      # No image.tag written by hand here: values.yaml holds the floor, and the
      # kargo-dwellm8:prod Stage writes the promoted tag into this source's
      # helm parameters.
  destination:
    server: https://kubernetes.default.svc
    namespace: dwellm8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
