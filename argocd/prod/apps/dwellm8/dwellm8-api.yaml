apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dwellm8
    app.kubernetes.io/component: api
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/dwellm8-api
    helm:
      valueFiles:
        - values.yaml
      # No image.tag override here: values.yaml is the one place the tag lives,
      # and a second copy of it silently pinned prod to `latest`. Kargo writes
      # values.yaml when the Warehouse is wired.
  destination:
    server: https://kubernetes.default.svc
    namespace: dwellm8
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
