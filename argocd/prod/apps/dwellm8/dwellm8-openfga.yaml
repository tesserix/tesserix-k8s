apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-openfga
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dwellm8
    app.kubernetes.io/component: authz
  annotations:
    # After the database (-8) and before the API (0), beside Temporal (-6):
    # the API is the caller and fails closed until this is up.
    argocd.argoproj.io/sync-wave: "-6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/dwellm8-openfga
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dwellm8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
