apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dwellm8-network-policies
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dwellm8
    app.kubernetes.io/component: security
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dwellm8
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/dwellm8-network-policies
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dwellm8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Ambient enrolment. ztunnel takes over the namespace's L4 — mTLS between
    # every pod and from the ingress gateway in. Declared on this app alone:
    # two apps managing one namespace's metadata is a fight ArgoCD lets them
    # have. The 15008 HBONE NetworkPolicy this chart ships was written for
    # this day.
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
