apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kora-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/component: secrets
    environment: prod
spec:
  project: kora
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: external-secrets/prod/kora
  destination:
    server: https://kubernetes.default.svc
    namespace: kora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
