apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kora-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/component: kora-services
    environment: prod
spec:
  project: kora
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/kora
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Same reason as the homechef / horoscope / mark8ly app-of-apps: when
  # Kargo eventually drives image promotion, it writes
  # spec.source.helm.parameters.image.tag on the child Applications and
  # we don't want this parent to revert that.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
