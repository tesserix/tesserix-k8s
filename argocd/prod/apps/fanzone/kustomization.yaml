apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - db-schema-bootstrap.yaml
  - fanzone-api.yaml  # GKE Knative (scale-to-zero)
  - fanzone-auth.yaml  # GKE Knative (always-on, minScale: 1)
  - fanzone-auth-bff.yaml  # GKE Knative (scale-to-zero)
  - fanzone-chat.yaml  # GKE Knative (scale-to-zero)
  - fanzone-media.yaml  # GKE Knative (scale-to-zero)
  - fanzone-prediction.yaml  # GKE Knative (scale-to-zero)
  - fanzone-user.yaml  # GKE Knative (scale-to-zero)
  - fanzone-notification.yaml  # GKE Knative (scale-to-zero)
  - fanzone-game.yaml  # GKE Knative (scale-to-zero)
  - fanzone-web.yaml  # GKE Knative (always-on, minScale: 1)
  - fanzone-ws.yaml  # GKE Knative (scale-to-zero)
  - sports-data.yaml  # GKE Knative (scale-to-zero)
  - fanzone-prediction-bot.yaml  # GKE Knative (scale-to-zero)
  - fanzone-cleanup.yaml  # GKE Knative (scale-to-zero)
  - fanzone-sportsbook.yaml  # GKE Knative (scale-to-zero)
  - fanzone-commentary.yaml  # GKE Knative (scale-to-zero)
  - fanzone-fan-connect.yaml  # GKE Knative (scale-to-zero)
  - fanzone-quest.yaml  # GKE Knative (scale-to-zero)
  - fanzone-micro-prediction.yaml  # GKE Knative (scale-to-zero)
  - fanzone-book-cricket.yaml  # GKE Knative (scale-to-zero)
  - fanzone-cricket-quiz.yaml  # GKE Knative (scale-to-zero)
  - fanzone-moderation.yaml  # GKE Knative (scale-to-zero)
  - external-secret-cricketdata.yaml  # Re-enabled for GKE sports-data (failover)
  - external-secret-sportmonks.yaml  # SportMonks cricket API key (primary)
  - external-secret-sports-api-key.yaml  # API auth token for sports-data
  - external-secret-anthropic.yaml  # Re-enabled for GKE prediction-bot
  - external-secret-jwt.yaml  # JWT secret for prediction-bot admin token
  # CNPG PostgreSQL
  - fanzone-postgres.yaml
