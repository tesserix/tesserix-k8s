apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanzone-identity-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fanzone
    app.kubernetes.io/component: identity
    environment: prod
spec:
  project: fanzone
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/identity-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: fanzone-identity-bootstrap
      values: |
        app: fanzone

        targets:
          - name: customer
            url: http://keycloak.identity-customer.svc.cluster.local:8080
            adminSecretName: keycloak-customer-admin
            realm:
              name: fanzone
              displayName: FanZone
              registrationAllowed: true
              loginWithEmailAllowed: true
              resetPasswordAllowed: true
            clients:
              - clientId: fanzone-bff
                publicClient: true
                rootUrl: https://fanzonebattleground.com
                redirectUris:
                  - "https://fanzonebattleground.com/*"
                  - "https://www.fanzonebattleground.com/*"
                  - "https://auth.fanzonebattleground.com/*"
                  - "http://localhost:3000/*"
                webOrigins:
                  - "https://fanzonebattleground.com"
                  - "https://www.fanzonebattleground.com"
                  - "http://localhost:3000"
            identityProviders:
              - alias: google
                providerId: google
                displayName: Google
                defaultScope: "openid email profile"
                gcpSecretClientId: prod-google-client-id
                gcpSecretClientSecret: prod-google-client-secret
              - alias: facebook
                providerId: facebook
                displayName: Facebook
                defaultScope: "email,public_profile"
                gcpSecretClientId: prod-facebook-app-id
                gcpSecretClientSecret: prod-facebook-app-secret
            adminUsers:
              - email: samyak.rout@gmail.com
                firstName: Samyak
                lastName: Rout
              - email: mahesh.sangawar@gmail.com
                firstName: Mahesh
                lastName: Sangawar
              - email: unidevidp@gmail.com
                firstName: Admin
                lastName: User

        gcp:
          enabled: true
          project: tesseracthub-480811

  destination:
    server: https://kubernetes.default.svc
    namespace: fanzone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
