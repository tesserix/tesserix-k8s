apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanzone-auth
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: fanzone--prod:fanzone-auth-prod
  labels:
    app.kubernetes.io/part-of: fanzone-battle-ground
    app.kubernetes.io/component: auth
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fanzone
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/fanzone-auth
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "latest"
        - name: env.FRONTEND_URL
          value: https://fanzonebattleground.com
        - name: env.OAUTH_CALLBACK_URL
          value: https://fanzonebattleground.com/auth
  destination:
    server: https://kubernetes.default.svc
    namespace: fanzone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
