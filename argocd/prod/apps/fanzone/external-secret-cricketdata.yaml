apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fanzone-cricketdata-api-key
  namespace: fanzone
  labels:
    app.kubernetes.io/part-of: fanzone-battle-ground
    app.kubernetes.io/component: secrets
    environment: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: fanzone-cricketdata-api-key
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: fanzone-cricketdata-api-key
