apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-data
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-fanzone:prod
  labels:
    app.kubernetes.io/part-of: fanzone-battle-ground
    app.kubernetes.io/component: backend
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fanzone
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/sports-data
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: "main-32d3561"
        # Ingress disabled - traffic routed via main fanzone-web ingress at /api/v1/sports
        - name: ingress.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: fanzone
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
