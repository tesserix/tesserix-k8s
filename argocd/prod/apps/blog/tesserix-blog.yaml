apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tesserix-blog
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-tesserix-blog:prod
  labels:
    app.kubernetes.io/part-of: tesserix-blog
    app.kubernetes.io/component: blog
    environment: prod
spec:
  project: tesserix-blog
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/tesserix-blog
    helm:
      valueFiles:
        - values.yaml
        - ../global-config.yaml
      parameters:
        - name: externalSecrets.provider
          value: "openbao"
        - name: externalSecrets.secretStoreRef
          value: "openbao-blog-production"
        - name: image.tag
          value: "main-00cf99d"
        - name: gcp.secretManager.secretPrefix
          value: "prod"
  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
