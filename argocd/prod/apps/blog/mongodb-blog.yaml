apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-blog
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-blog
    app.kubernetes.io/component: database
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: tesserix-blog
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/mongodb-blog
    helm:
      valueFiles:
        - values.yaml
      # Kargo owns the parameters array; these settings must reconcile separately.
      valuesObject:
        externalSecrets:
          provider: openbao
          secretStoreRef: openbao-blog-production
        storage:
          # Match the existing disk without replacing the StatefulSet.
          storageClassName: standard
      parameters:
        - name: externalSecrets.secretPrefix
          value: "prod"
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb-blog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
