apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-blog
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-blog
    app.kubernetes.io/component: database
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: tesserix-blog
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/mongodb-blog
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # Match the existing PVC; never replace a database to change its class.
        - name: storage.storageClassName
          value: "standard"
        - name: externalSecrets.provider
          value: "openbao"
        - name: externalSecrets.secretStoreRef
          value: "openbao-blog-production"
        - name: externalSecrets.secretPrefix
          value: "prod"
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb-blog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
