apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog-identity-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix-blog
    app.kubernetes.io/component: identity
    environment: prod
spec:
  project: tesserix-blog
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/identity-bootstrap
    targetRevision: HEAD
    helm:
      releaseName: blog-identity-bootstrap
      values: |
        app: blog

        targets:
          - name: customer
            url: http://keycloak.identity-customer.svc.cluster.local:8080
            adminSecretName: keycloak-customer-admin
            realm:
              name: blog
              displayName: Tesserix Blog
              registrationAllowed: true
              loginWithEmailAllowed: true
              resetPasswordAllowed: true
            clients:
              - clientId: blog-bff
                publicClient: false
                gcpSecretClientSecret: prod-blog-keycloak-client-secret
                rootUrl: https://blog.tesserix.app
                redirectUris:
                  - "https://blog.tesserix.app/*"
                  - "http://localhost:3003/*"
                webOrigins:
                  - "https://blog.tesserix.app"
                  - "http://localhost:3003"
            identityProviders:
              - alias: google
                providerId: google
                displayName: Sign in with Google
                defaultScope: "openid email profile"
                gcpSecretClientId: prod-google-client-id
                gcpSecretClientSecret: prod-google-client-secret
            adminUsers:
              - email: unidevidp@gmail.com
                firstName: Admin
                lastName: User
              - email: samyak.rout@gmail.com
                firstName: Samyak
                lastName: Rout
              - email: mahesh.sangawar@gmail.com
                firstName: Mahesh
                lastName: Sangawar

        gcp:
          enabled: true
          project: tesseracthub-480811

  destination:
    server: https://kubernetes.default.svc
    namespace: tesserix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
