apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bka-web
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: bookkeeping-app
    app.kubernetes.io/component: frontend
    environment: prod
spec:
  project: bookkeeping
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/bookkeeping-web
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: image.tag
          value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: bookkeeping
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
