apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devai-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: devai
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/devai
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
