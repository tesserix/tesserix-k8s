apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ax-postgres
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-production
    kind: SecretStore
  target:
    name: ax-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
  - secretKey: username
    remoteRef:
      key: ax-system/production/ax-postgres
      property: username
  - secretKey: password
    remoteRef:
      key: ax-system/production/ax-postgres
      property: password
---
