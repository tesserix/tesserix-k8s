apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ax-actor-id-ca-pool
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-production
    kind: SecretStore
  target:
    name: ax-actor-id-ca-pool
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: pool
    remoteRef:
      key: ax-system/production/ax-actor-id-ca-pool
      property: pool
---
