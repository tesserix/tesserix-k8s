apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ax-ate-api-server-secret-envvars
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-production
    kind: SecretStore
  target:
    name: ax-ate-api-server-secret-envvars
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ATE_API_POSTGRES_CONNECTION_STRING: host=ax-postgres-rw.ax-system.svc port=5432
          dbname=ax_substrate user=ax_substrate password={{ .password }} sslmode=verify-full
          sslrootcert=/run/postgres-server-ca/ca.crt
  data:
  - secretKey: password
    remoteRef:
      key: ax-system/production/ax-postgres
      property: password
---
