apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ax-ate-node-critical
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
value: 1000
globalDefault: false
description: Node-local ate components that every actor activation depends on.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: atelet-ax944abe
  namespace: ax-system
  labels:
    app: atelet
    ax.ate.dev/substrate-version: ax944abe
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    matchLabels:
      app: atelet
      ax.ate.dev/substrate-version: ax944abe
  template:
    metadata:
      labels:
        app: atelet
        ax.ate.dev/substrate-version: ax944abe
        ax.tesserix.app/component: atelet-ax944abe
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '19090'
    spec:
      serviceAccountName: atelet
      priorityClassName: ax-ate-node-critical
      nodeSelector:
        cloud.google.com/gke-nodepool: optimized-v2
      terminationGracePeriodSeconds: 330
      tolerations:
      - key: ax.ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: atelet
        image: asia-south1-docker.pkg.dev/tesseracthub-480811/global/ax-runtime/atelet:ax-944abe3278b8-v1@sha256:725c165bbf594af9bb4b9e8c56ac36b3b8481b4de2d7014494dc4e4fd386b124
        args:
        - --gcp-auth-for-image-pulls=true
        - --grpc-server-cred-bundle=/run/podidentity.podcert.ax.ate.dev/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.ax.ate.dev/trust-bundle.pem
        - --ateapi-ca-file=/run/servicedns.podcert.ax.ate.dev/trust-bundle.pem
        - --drain-delay=0s
        - --drain-timeout=5m
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        - name: ATE_STORAGE_BACKEND
          value: gcs
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: grpc
          containerPort: 18085
          hostPort: 18085
        - name: prometheus
          containerPort: 19090
          hostPort: 19090
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 19090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 19090
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: run-ateom
          mountPath: /var/lib/ax-ateom-gvisor
        - name: podidentity
          mountPath: /run/podidentity.podcert.ax.ate.dev
        - name: servicedns-ca
          mountPath: /run/servicedns.podcert.ax.ate.dev
          readOnly: true
        - name: kubelet-plugins
          mountPath: /var/lib/kubelet/plugins
        - name: device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: host-dev
          mountPath: /host/dev
          readOnly: true
      volumes:
      - name: run-ateom
        hostPath:
          path: /var/lib/ax-ateom-gvisor
          type: DirectoryOrCreate
      - name: kubelet-plugins
        hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
      - name: device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
      - name: host-dev
        hostPath:
          path: /dev
          type: Directory
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ax.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ax.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ax.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ax.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ax.ate.dev/canarying: live
              path: trust-bundle.pem
      automountServiceAccountToken: true
