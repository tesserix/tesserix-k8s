apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-ate-controller
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ax.ate.dev
  resources:
  - workerpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ax.ate.dev
  resources:
  - workerpools/finalizers
  verbs:
  - update
- apiGroups:
  - ax.ate.dev
  resources:
  - workerpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certificates.k8s.io
  resourceNames:
  - egress-mitm.ax.ate.dev/*
  resources:
  - signers
  verbs:
  - attest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-controller
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - ax-egress-mitm-ca-pool
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
