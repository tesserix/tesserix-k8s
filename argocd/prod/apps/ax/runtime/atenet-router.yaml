apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-router
  namespace: ax-system
  labels:
    app: atenet-router
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atenet-router-endpointslices
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atenet-router-endpointslices
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
subjects:
- kind: ServiceAccount
  name: atenet-router
  namespace: ax-system
roleRef:
  kind: Role
  name: atenet-router-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-router-envoy-config
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
data:
  envoy.yaml: "admin:\n  address:\n    socket_address:\n      # ipv4_compat keeps\
    \ `kubectl port-forward` to the admin port working;\n      # in-pod callers dial\
    \ localhost and need no help.\n      address: \"::\"\n      ipv4_compat: true\n\
    \      port_value: 9901\n\nnode:\n  id: substrate-envoy-node\n  cluster: substrate-router-cluster\n\
    \n# Required for main_internal (see xds.go's buildMainInternalListener):\n# Envoy\
    \ rejects any Listener.internal_listener without this registered,\n# with \"InternalListener\
    \ bootstrap extension is mandatory\".\nbootstrap_extensions:\n- name: envoy.bootstrap.internal_listener\n\
    \  typed_config:\n    \"@type\": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener\n\
    \ndynamic_resources:\n  lds_config:\n    resource_api_version: V3\n    ads: {}\n\
    \  cds_config:\n    resource_api_version: V3\n    ads: {}\n  ads_config:\n   \
    \ api_type: GRPC\n    transport_api_version: V3\n    grpc_services:\n    - envoy_grpc:\n\
    \        cluster_name: xds_cluster\n\nstatic_resources:\n  clusters:\n  - name:\
    \ xds_cluster\n    connect_timeout: 0.25s\n    type: STRICT_DNS\n    lb_policy:\
    \ ROUND_ROBIN\n    typed_extension_protocol_options:\n      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:\n\
    \        \"@type\": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions\n\
    \        explicit_http_config:\n          http2_protocol_options: {}\n    load_assignment:\n\
    \      cluster_name: xds_cluster\n      endpoints:\n      - lb_endpoints:\n  \
    \      - endpoint:\n            address:\n              socket_address:\n    \
    \            address: 127.0.0.1\n                port_value: 18000\n"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atenet-router
  namespace: ax-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: atenet-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-router
  namespace: ax-system
  labels:
    app: atenet-router
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
        ax.tesserix.app/component: atenet-router
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
    spec:
      serviceAccountName: atenet-router
      terminationGracePeriodSeconds: 60
      containers:
      - name: atenet-router
        image: asia-south1-docker.pkg.dev/tesseracthub-480811/global/ax-runtime/atenet:ax-944abe3278b8-v1@sha256:11e3ffe970e0b25d3e1baf474532bdd6d976d04a6d4f4de5945d061d6e3f045a
        args:
        - router
        - --mode=ingress
        - --namespace=ax-system
        - --port-http=8080
        - --port-xds=18000
        - --port-extproc=50051
        - --extproc-address=127.0.0.1
        - --status-port=4040
        - --port-https=8443
        - --envoy-cert-path=/run/servicedns.podcert.ax.ate.dev/credential-bundle.pem
        - --port-connect=8081
        - --port-connect-tls=8444
        - --ateapi-address=k8s:///api.ax-system.svc:443
        - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ax.ate.dev/credential-bundle.pem
        - --drain-delay=13s
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        ports:
        - name: xds
          containerPort: 18000
        - name: extproc
          containerPort: 50051
        - name: status
          containerPort: 4040
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: podidentity
          mountPath: /run/podidentity.podcert.ax.ate.dev
        - name: servicedns-ca
          mountPath: /run/servicedns-ca
        - name: drain-signal
          mountPath: /var/run/atenet
        - name: runtime-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
      - name: envoy
        image: envoyproxy/envoy:v1.39-latest@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
        command:
        - /usr/local/bin/envoy
        - -c
        - /etc/envoy/envoy.yaml
        - --component-log-level
        - upstream:debug,router:debug,ext_proc:debug
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: connect
          containerPort: 8081
        - name: connect-tls
          containerPort: 8444
        - name: admin
          containerPort: 9901
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        - name: servicedns
          mountPath: /run/servicedns.podcert.ax.ate.dev
        - name: podidentity
          mountPath: /run/podidentity.podcert.ax.ate.dev
        - name: drain-signal
          mountPath: /var/run/atenet
          readOnly: true
        - name: runtime-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
            cpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
      volumes:
      - name: envoy-config
        configMap:
          name: atenet-router-envoy-config
      - name: drain-signal
        emptyDir: {}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ax.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ax.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ax.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ax.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ax.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ax.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
      automountServiceAccountToken: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: *id001
            topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: '0'
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: connect
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: connect-tls
    port: 8444
    targetPort: 8444
    protocol: TCP
  - name: status
    port: 4040
    targetPort: status
    protocol: TCP
