apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-podcert-ate-dev-signer
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
rules:
- apiGroups:
  - ''
  resources:
  - services
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests/status
  verbs:
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - servicedns.podcert.ax.ate.dev/*
  - podidentity.podcert.ax.ate.dev/*
  verbs:
  - sign
  - attest
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
