apiVersion: batch/v1
kind: CronJob
metadata:
  name: ax-ca-expiry
  namespace: ax-system
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  schedule: 15 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
          - name: verify
            image: python:3.12-bookworm@sha256:e91fec3d1ac69f04e4eddcd29c327e630ce34658cf31075bfa7e8b0e052bafea
            command:
            - python3
            - -c
            - "import glob, ssl, time\nfor path in sorted(glob.glob('/certs/*/ca.crt')):\n\
              \    cert = ssl._ssl._test_decode_cert(path)\n    remaining = (ssl.cert_time_to_seconds(cert['notAfter'])\
              \ - time.time()) / 86400\n    print(path.split('/')[-2], 'days remaining:',\
              \ round(remaining))\n    if remaining < 30:\n        raise SystemExit('AX\
              \ CA rotation required within 30 days')\n"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
                cpu: '1'
            volumeMounts:
            - name: actor-id
              mountPath: /certs/actor-id
              readOnly: true
            - name: service-dns
              mountPath: /certs/service-dns
              readOnly: true
            - name: pod-identity
              mountPath: /certs/pod-identity
              readOnly: true
            - name: egress-mitm
              mountPath: /certs/egress-mitm
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              capabilities:
                drop:
                - ALL
          volumes:
          - name: actor-id
            secret:
              secretName: ax-actor-id-ca
          - name: service-dns
            secret:
              secretName: ax-service-dns-ca
          - name: pod-identity
            secret:
              secretName: ax-pod-identity-ca
          - name: egress-mitm
            secret:
              secretName: ax-egress-mitm-ca
          - name: runtime-tmp
            emptyDir:
              sizeLimit: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
