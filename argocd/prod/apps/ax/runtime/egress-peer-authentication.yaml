apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: ax-egress-native-mtls
  namespace: ax-system
spec:
  selector:
    matchLabels:
      app: atenet-egress
  mtls:
    mode: STRICT
  portLevelMtls:
    # Sandboxes use AX actor certificates here, not Istio workload certificates.
    # Envoy still requires and validates the native client certificate.
    "443":
      mode: DISABLE
