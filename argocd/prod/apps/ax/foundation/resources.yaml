apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
  labels:
    app.kubernetes.io/part-of: ax
    istio-injection: disabled
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-secret-reader
  namespace: ax-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-bootstrap
  namespace: ax-system
automountServiceAccountToken: false
