apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vehicle-rental-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: vehicle-rental-services
    environment: prod
  # Cascades the prune to the eight child Applications on decommission; without
  # it they orphan and keep reconciling.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vehicle-rental-app
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/vehicle-rental
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
