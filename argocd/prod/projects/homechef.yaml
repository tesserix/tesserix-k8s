apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homechef
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: homechef
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    # Required for the dedicated homechef-ingressgateway AuthorizationPolicy
    # which must live in the same namespace as the gateway pod it selects.
    - namespace: istio-ingress
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: networking.istio.io
      kind: '*'
    - group: security.istio.io
      kind: '*'
