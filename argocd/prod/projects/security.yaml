apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  labels:
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Secret management and cluster security primitives — OpenBao and its admin console
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: openbao
      server: https://kubernetes.default.svc
    - namespace: secret-service
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    # The openbao chart renders one SecretStore per whitelisted app, into that
    # app's own namespace. Keep this list equal to `namespaceWhitelist` in
    # charts/thirdparty/openbao/values.yaml — a namespace missing here fails the
    # sync with "namespace X is not permitted in project 'security'".
    - namespace: homechef
      server: https://kubernetes.default.svc
    - namespace: ai-database
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # ESO's ClusterSecretStore, and the ClusterRoleBinding the chart creates
    # for `service_registration "kubernetes"`.
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # Scheduling priority for OpenBao, which is cluster-scoped and so has to be
    # named here even though only one namespace ever uses it.
    - group: scheduling.k8s.io
      kind: PriorityClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
