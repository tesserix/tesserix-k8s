apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-database
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-database
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: AI data stores — vector/embedding databases backing the agent platform
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: ai-database
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
