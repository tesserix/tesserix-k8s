apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: beautyandcruor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: tesserix
      server: https://kubernetes.default.svc
    # The Gateway and Certificate for beautyandcruor.com live alongside the
    # gateway workload and its TLS secrets, not in the app namespace. Without
    # this destination the chart renders but those two resources are refused.
    - namespace: istio-ingress
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
