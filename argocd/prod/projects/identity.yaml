apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: zitadel
      server: https://kubernetes.default.svc
    - namespace: identity-operator
      server: https://kubernetes.default.svc
    # The gateway ALLOW policy has to sit beside the gateway workload it selects.
    - namespace: istio-ingress
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
