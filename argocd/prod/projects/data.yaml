apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: postgresql-global
      server: https://kubernetes.default.svc
    - namespace: postgresql-marketplace
      server: https://kubernetes.default.svc
    - namespace: postgresql-bookkeeping
      server: https://kubernetes.default.svc
    - namespace: postgresql-hms
      server: https://kubernetes.default.svc
    - namespace: postgresql-fanzone
      server: https://kubernetes.default.svc
    - namespace: postgresql-homechef
      server: https://kubernetes.default.svc
    - namespace: postgresql-gameverse
      server: https://kubernetes.default.svc
    - namespace: postgresql-scrapper
      server: https://kubernetes.default.svc
    - namespace: postgresql-stockpilot
      server: https://kubernetes.default.svc
    - namespace: redis-global
      server: https://kubernetes.default.svc
    - namespace: redis-marketplace
      server: https://kubernetes.default.svc
    - namespace: redis-hms
      server: https://kubernetes.default.svc
    - namespace: redis-fanzone
      server: https://kubernetes.default.svc
    - namespace: redis-homechef
      server: https://kubernetes.default.svc
    - namespace: redis-gameverse
      server: https://kubernetes.default.svc
    - namespace: redis-scrapper
      server: https://kubernetes.default.svc
    - namespace: redis-stockpilot
      server: https://kubernetes.default.svc
    - namespace: redis-tesserix
      server: https://kubernetes.default.svc
    - namespace: mongodb-fanzone
      server: https://kubernetes.default.svc
    - namespace: db-backup-and-restore
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
