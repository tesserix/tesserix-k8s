apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    # Shared HA Postgres for platform components (Temporal first). Deliberately
    # not per-product: the estate had nine single-instance clusters holding
    # under a gigabyte between them, and a single instance on Spot-only nodes
    # is an outage waiting for a preemption.
    - namespace: infra
      server: https://kubernetes.default.svc
    - namespace: postgresql-global
      server: https://kubernetes.default.svc
    - namespace: postgresql-marketplace
      server: https://kubernetes.default.svc
    - namespace: postgresql-fanzone
      server: https://kubernetes.default.svc
    - namespace: postgresql-homechef
      server: https://kubernetes.default.svc
    - namespace: postgresql-gameverse
      server: https://kubernetes.default.svc
    - namespace: postgresql-scrapper
      server: https://kubernetes.default.svc
    - namespace: postgresql-stockpilot
      server: https://kubernetes.default.svc
    - namespace: postgresql-devai
      server: https://kubernetes.default.svc
    - namespace: mongodb-fanzone
      server: https://kubernetes.default.svc
    - namespace: db-backup-and-restore
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
