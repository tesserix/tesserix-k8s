apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: roamie
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roamie
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Roamie — login-free travel companion (translation, talk, nearby, receipts)
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: roamie
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
