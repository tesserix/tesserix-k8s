apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vehicle-rental-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Vehicle rental — multi-tenant rental shops (<shop>.tesserix.app)
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  # No Namespace in clusterResourceWhitelist: istio-config owns both namespaces
  # so it can label them for the mesh, and a second owner SSA-stomps those labels.
  destinations:
    - namespace: vehicle-rental
      server: https://kubernetes.default.svc
    - namespace: vehicle-rental-data
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: networking.istio.io
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
