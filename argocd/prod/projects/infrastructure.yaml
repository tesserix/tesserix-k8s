apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
    - https://github.com/tesserix/tesserix-k8s.git
    - https://istio-release.storage.googleapis.com/charts
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns
    - https://kedacore.github.io/charts
    - https://kiali.org/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://helm.elastic.co
    - ghcr.io/actions/actions-runner-controller-charts
    - https://nats-io.github.io/k8s/helm/charts
    # Stakater Reloader — auto-restarts Pods whose Secrets/ConfigMaps
    # change. Required by argocd/prod/infrastructure/reloader.yaml.
    - https://stakater.github.io/stakater-charts
    # Fluent Bit — log shipping; argocd/prod/infrastructure/fluent-bit.yaml.
    - https://fluent.github.io/helm-charts
    # Kyverno — policy engine backing TIG; argocd/prod/infrastructure/kyverno.yaml.
    - https://kyverno.github.io/kyverno
  destinations:
    - namespace: istio-system
      server: https://kubernetes.default.svc
    - namespace: istio-ingress
      server: https://kubernetes.default.svc
    - namespace: istio-egress
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: external-dns
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: keda
      server: https://kubernetes.default.svc
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: cloudflared
      server: https://kubernetes.default.svc
    - namespace: nats
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: opencost
      server: https://kubernetes.default.svc
    - namespace: logging
      server: https://kubernetes.default.svc
    - namespace: growthbook
      server: https://kubernetes.default.svc
    - namespace: typesense
      server: https://kubernetes.default.svc
    - namespace: openpanel
      server: https://kubernetes.default.svc
    - namespace: email
      server: https://kubernetes.default.svc
    - namespace: translation
      server: https://kubernetes.default.svc
    - namespace: marketplace
      server: https://kubernetes.default.svc
    - namespace: global
      server: https://kubernetes.default.svc
    - namespace: tesserix
      server: https://kubernetes.default.svc
    # Stakater Reloader controller. Watches Secrets/ConfigMaps
    # cluster-wide and restarts Pods that consume them — required so
    # ExternalSecrets rotations actually take effect without manual
    # kubectl rollout restart.
    - namespace: reloader
      server: https://kubernetes.default.svc
    - namespace: fanzone
      server: https://kubernetes.default.svc
    - namespace: homechef
      server: https://kubernetes.default.svc
    - namespace: postgresql-global
      server: https://kubernetes.default.svc
    - namespace: postgresql-marketplace
      server: https://kubernetes.default.svc
    - namespace: postgresql-fanzone
      server: https://kubernetes.default.svc
    - namespace: postgresql-homechef
      server: https://kubernetes.default.svc
    - namespace: redis-marketplace
      server: https://kubernetes.default.svc
    - namespace: redis-fanzone
      server: https://kubernetes.default.svc
    - namespace: redis-homechef
      server: https://kubernetes.default.svc
    - namespace: mongodb-fanzone
      server: https://kubernetes.default.svc
    - namespace: db-backup-and-restore
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: redis-global
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    # Wildcard for cross-namespace resources (ExternalSecrets, namespace-protection)
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
