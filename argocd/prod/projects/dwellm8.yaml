apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dwellm8
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Dwellm8 — property management for India (dwellm8.com)
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: dwellm8
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: networking.istio.io
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
