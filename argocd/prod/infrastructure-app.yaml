---
# Infrastructure App-of-Apps for Production Environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: infrastructure
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kargo's infra auto-upgrade stages (kargo-manifests projects/infra) bump
  # child Application spec.source.targetRevision live when an upstream chart
  # publishes a new version inside the allowed semver range. Ignore that
  # field so selfHeal doesn't revert promotions — the revision in Git is the
  # bootstrap/minimum value; the live value is Kargo-managed.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/targetRevision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
