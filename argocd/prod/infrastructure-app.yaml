---
# Infrastructure App-of-Apps for Production Environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: infrastructure
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The controller appends pre/post-delete-finalizer entries to child
  # Applications whose charts ship delete hooks (kyverno, zitadel). Finalizer
  # lists diff atomically, so those children showed permanently OutOfSync here
  # and selfHeal churned without ever winning — the controller re-adds the
  # entries after every sync. SSA field ownership keeps real syncs from
  # stripping them, so ignoring the field only silences the false diff.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
