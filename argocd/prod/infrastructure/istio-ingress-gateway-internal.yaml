apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress-gateway-internal
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    kargo.akuity.io/authorized-stage: kargo-infra:istio-prod
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: infrastructure
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.8
    helm:
      valuesObject:
        name: istio-ingressgateway-internal
        replicaCount: 0
        service:
          type: ClusterIP
          annotations: {}
          ports:
          - name: status-port
            port: 15021
            protocol: TCP
            targetPort: 15021
          - name: http2
            port: 80
            protocol: TCP
            targetPort: 80
          - name: https
            port: 443
            protocol: TCP
            targetPort: 443
        resources:
          requests:
            cpu: null
            memory: 128Mi
          limits:
            cpu: null
            memory: 512Mi
        autoscaling:
          enabled: false
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 0
          targetMemoryUtilizationPercentage: 80
        podDisruptionBudget:
          maxUnavailable: 1
        serviceAccount:
          create: true
          name: istio-ingressgateway-internal
        podAnnotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '15020'
          prometheus.io/path: /stats/prometheus
          istioUpgradeVersion: 1.30.8
        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        labels:
          app: istio-ingressgateway-internal
          istio: ingressgateway-internal
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: istio-ingressgateway-internal
      releaseName: istio-ingress-internal
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  ignoreDifferences:
  - kind: Service
    jsonPointers:
    - /spec/clusterIP
    - /spec/clusterIPs
    - /spec/ports/0/nodePort
    - /spec/ports/1/nodePort
    - /spec/ports/2/nodePort
    - /metadata/finalizers
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
