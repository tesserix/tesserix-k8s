apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-istiod
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:istio-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    # Bumped from 1.29.1 -> 1.29.2 to pick up the upstream LDS-push
    # fix for gateway proxies and to roll the istiod pod, which had
    # accumulated a stuck per-proxy push state after several hours
    # that prevented incremental LDS/RDS from reaching new public
    # ingressgateway pods. The rolling restart triggered by this
    # bump is itself the clean way to recover from that state.
    targetRevision: 1.29.6
    helm:
      releaseName: istiod
      values: |
        # Istiod (Pilot) configuration
        pilot:
          # Enable status port for health checks
          enabled: true

          # Enable Ambient mesh mode
          env:
            PILOT_ENABLE_AMBIENT: "true"

          # Resource configuration
          resources:
            requests:
              cpu: null
              memory: 256Mi
            limits:
              cpu: null
              memory: 1Gi

          # Auto-scaling
          # HPA disabled: the istiod chart emits its cpu metric unconditionally
          # (no `if` guard), so with no cpu request the metric reads <unknown>
          # and the HPA cannot scale. Pinned replicas instead.
          autoscaleEnabled: false
          replicaCount: 2

          # Pod disruption budget
          # Use maxUnavailable instead of minAvailable to allow node drains with single replica
          podDisruptionBudget:
            maxUnavailable: 1

          # Enable tracing
          traceSampling: 100.0

        # Global mesh configuration
        global:
          # Default proxy settings (used by waypoint proxies in ambient mode)
          proxy:
            resources:
              requests:
                cpu: null
                memory: 64Mi
              limits:
                cpu: null
                memory: 256Mi
            accessLogFile: /dev/stdout
            accessLogEncoding: JSON

          # Logging configuration
          logging:
            level: "default:info"

          # Enable tracing
          tracer:
            zipkin:
              address: ""

        # Mesh configuration
        meshConfig:
          # Enable access logging
          accessLogFile: /dev/stdout
          accessLogEncoding: JSON

          # Enable distributed tracing
          enableTracing: true

          # Default proxy configuration
          defaultConfig:
            # Enable Envoy metrics
            proxyMetadata:
              ISTIO_META_DNS_AUTO_ALLOCATE: "true"
              ISTIO_META_DNS_CAPTURE: "true"

            # Hold application start until proxy is ready
            holdApplicationUntilProxyStarts: true

            # Tracing configuration
            tracing:
              sampling: 100.0
              zipkin:
                address: ""

          # Enable auto mTLS
          enableAutoMtls: true

          # Trust domain
          trustDomain: cluster.local

          # Outbound traffic policy (ALLOW_ANY or REGISTRY_ONLY)
          outboundTrafficPolicy:
            mode: ALLOW_ANY

          # Enable protocol sniffing
          enablePrometheusMerge: true

        # Telemetry configuration
        telemetry:
          enabled: true
          v2:
            enabled: true
            prometheus:
              enabled: true
            stackdriver:
              enabled: false

        # Service account
        serviceAccount:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jqPathExpressions:
        - .status
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .status
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        # istiod owns this webhook at runtime (caBundle injection,
        # failurePolicy flip, field-manager rewrites under SSA); the chart
        # only creates the skeleton. Ignore the whole array per upstream
        # guidance — partial ignores kept leaving a permanent diff that
        # stalled kargo-infra promotions.
        - .webhooks
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
