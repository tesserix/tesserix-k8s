apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-istiod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.29.1
    helm:
      releaseName: istiod
      values: |
        # Istiod (Pilot) configuration
        pilot:
          # Enable status port for health checks
          enabled: true

          # Enable Ambient mesh mode
          env:
            PILOT_ENABLE_AMBIENT: "true"

          # Resource configuration
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi

          # Auto-scaling
          autoscaleEnabled: true
          autoscaleMin: 1
          autoscaleMax: 5

          # Pod disruption budget
          # Use maxUnavailable instead of minAvailable to allow node drains with single replica
          podDisruptionBudget:
            maxUnavailable: 1

          # Enable tracing
          traceSampling: 100.0

        # Global mesh configuration
        global:
          # Default proxy settings (used by waypoint proxies in ambient mode)
          proxy:
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 256Mi
            accessLogFile: /dev/stdout
            accessLogEncoding: JSON

          # Logging configuration
          logging:
            level: "default:info"

          # Enable tracing
          tracer:
            zipkin:
              address: ""

        # Mesh configuration
        meshConfig:
          # Enable access logging
          accessLogFile: /dev/stdout
          accessLogEncoding: JSON

          # Enable distributed tracing
          enableTracing: true

          # Default proxy configuration
          defaultConfig:
            # Enable Envoy metrics
            proxyMetadata:
              ISTIO_META_DNS_AUTO_ALLOCATE: "true"
              ISTIO_META_DNS_CAPTURE: "true"

            # Hold application start until proxy is ready
            holdApplicationUntilProxyStarts: true

            # Tracing configuration
            tracing:
              sampling: 100.0
              zipkin:
                address: ""

          # Enable auto mTLS
          enableAutoMtls: true

          # Trust domain
          trustDomain: cluster.local

          # Outbound traffic policy (ALLOW_ANY or REGISTRY_ONLY)
          outboundTrafficPolicy:
            mode: ALLOW_ANY

          # Enable protocol sniffing
          enablePrometheusMerge: true

        # Telemetry configuration
        telemetry:
          enabled: true
          v2:
            enabled: true
            prometheus:
              enabled: true
            stackdriver:
              enabled: false

        # Service account
        serviceAccount:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
