apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    kargo.akuity.io/authorized-stage: kargo-infra:istio-prod
    argocd.argoproj.io/sync-wave: '-1'
spec:
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /status/terminatingReplicas
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: main
    path: charts/thirdparty/istio-ingress-gateway
    helm:
      valuesObject:
        name: istio-ingressgateway
        revision: ''
        service:
          type: ClusterIP
          trafficDistribution: PreferSameZone
          ports:
          - name: status-port
            port: 15021
            protocol: TCP
            targetPort: 15021
          - name: http2
            port: 80
            protocol: TCP
            targetPort: 80
          - name: https
            port: 443
            protocol: TCP
            targetPort: 443
          - name: tcp
            port: 31400
            protocol: TCP
            targetPort: 31400
          - name: tls
            port: 15443
            protocol: TCP
            targetPort: 15443
          annotations: {}
        resources:
          requests:
            cpu: null
            memory: 128Mi
          limits:
            cpu: null
            memory: 512Mi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetMemoryUtilizationPercentage: 80
        podDisruptionBudget:
          maxUnavailable: 1
        serviceAccount:
          create: true
          name: istio-ingressgateway
          annotations:
            iam.gke.io/gcp-service-account: istio-gw-cr-invoker-sa@tesseracthub-480811.iam.gserviceaccount.com
        podAnnotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '15020'
          prometheus.io/path: /stats/prometheus
          tesserix.com/force-restart: 2026-05-14T01-15-00Z
          proxy.istio.io/config: "proxyMetadata:\n  ISTIO_DELTA_XDS: \"false\"\n"
          istioUpgradeVersion: 1.31.4
        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        labels:
          app: istio-ingressgateway
          istio: ingressgateway
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: istio-ingressgateway
      releaseName: istio-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
