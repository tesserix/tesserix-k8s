apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ax-foundation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: ax
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod/apps/ax/foundation
  destination:
    server: https://kubernetes.default.svc
    namespace: ax-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
