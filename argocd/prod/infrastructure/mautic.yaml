apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mautic
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: marketing
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/mautic
    targetRevision: HEAD
    helm:
      releaseName: mautic
      values: |
        # Mautic - scaled down, not in use
        replicaCount: 0

        image:
          repository: mautic/mautic
          tag: "5-apache"
          pullPolicy: IfNotPresent

        # Mautic configuration
        mautic:
          siteUrl: "https://mautic.mark8ly.com"
          # Secret key from sealed secret
          existingSecretSecretKey: "mautic-credentials"
          existingSecretSecretKeyField: "secret-key"
          # Disable setup wizard (installation already completed)
          runSetup: false
          adminUsername: "admin"
          adminEmail: "admin@mark8ly.com"
          existingSecret: "mautic-credentials"
          existingSecretAdminPasswordKey: "admin-password"
          # SMTP via Postal
          mailer:
            transport: "smtp"
            host: "postal-smtp.email.svc.cluster.local"
            port: 25
            encryption: ""
            authMode: ""
            existingSecret: "postal-smtp-credentials"
            existingSecretUsernameKey: "username"
            existingSecretPasswordKey: "password"
            fromEmail: "noreply@mail.mark8ly.com"
            fromName: "Tesseract Hub"

        # Database (MySQL in email namespace)
        database:
          host: "mysql.email.svc.cluster.local"
          port: "3306"
          name: "mautic"
          user: "mautic"
          existingSecret: "mysql-credentials"
          existingSecretPasswordKey: "mautic-password"

        # Service
        service:
          type: ClusterIP
          port: 80

        # Resources for devtest
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi

        # Persistence
        persistence:
          enabled: true
          storageClass: "standard-rwo"
          size: 5Gi

        # Cron job disabled - uses built-in MAUTIC_RUN_CRON_JOBS=true instead
        # CronJob can't attach to ReadWriteOnce PVC while main pod is running
        cron:
          enabled: false

        # Health probes - use TCP since Mautic redirects during setup
        livenessProbe:
          enabled: true
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6

        readinessProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

  destination:
    server: https://kubernetes.default.svc
    namespace: email
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
