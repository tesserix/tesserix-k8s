apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-stockpilot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: stock-analysis
    app.kubernetes.io/component: cache
    target-namespace: stockpilot
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: data
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/redis
    targetRevision: HEAD
    helm:
      releaseName: redis
      values: |
        auth:
          enabled: true
          existingSecret: "redis-password"
          existingSecretKey: "password"

        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi

        persistence:
          enabled: true
          storageClass: standard-rwo-retain
          size: 4Gi

        service:
          type: ClusterIP
          port: 6379

  destination:
    server: https://kubernetes.default.svc
    namespace: redis-stockpilot
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
