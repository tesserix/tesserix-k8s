apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel-ingress-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: zitadel
    app.kubernetes.io/component: infrastructure
  annotations:
    kargo.akuity.io/authorized-stage: kargo-infra:istio-prod
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: infrastructure
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.8
    helm:
      skipSchemaValidation: true
      valuesObject:
        name: zitadel-ingressgateway
        revision: ''
        service:
          type: ClusterIP
          ports:
          - name: status-port
            port: 15021
            protocol: TCP
            targetPort: 15021
          - name: http2
            port: 80
            protocol: TCP
            targetPort: 80
          - name: https
            port: 443
            protocol: TCP
            targetPort: 443
        resources:
          requests:
            cpu: null
            memory: 256Mi
          limits:
            cpu: null
            memory: 1Gi
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 6
          targetCPUUtilizationPercentage: null
          targetMemoryUtilizationPercentage: 80
        podDisruptionBudget:
          maxUnavailable: 1
        serviceAccount:
          create: true
          name: zitadel-ingressgateway
        podAnnotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '15020'
          prometheus.io/path: /stats/prometheus
          istioUpgradeVersion: 1.30.8
        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true
          fsGroup: 1337
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1337
        labels:
          app: zitadel-ingressgateway
          istio: zitadel-ingressgateway
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: zitadel-ingressgateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: zitadel-ingressgateway
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zitadel-ingressgateway
                topologyKey: kubernetes.io/hostname
      releaseName: zitadel-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
