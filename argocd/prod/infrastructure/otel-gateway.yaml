apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: observability
  annotations:
    # Wave 1 — the estate's OTLP endpoint, last so that anything it accepts has
    # somewhere to go. Even if it starts first, its on-disk queue spools until
    # the brokers are ready, so nothing is dropped.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/otel-gateway
    targetRevision: HEAD
    helm:
      releaseName: otel-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
