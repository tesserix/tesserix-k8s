apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-fanzone
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesseract-fanzone
    app.kubernetes.io/component: cache
    target-namespace: fanzone
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: data
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/redis
    targetRevision: HEAD
    helm:
      releaseName: redis
      values: |
        # parked — product scaled down; PVC (if any) is kept
        replicaCount: 0
        # Redis for FanZone
        auth:
          enabled: true
          password: "password"

        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi

        persistence:
          enabled: true
          storageClass: standard-rwo-retain
          size: 8Gi

        service:
          type: ClusterIP
          port: 6379

        # Internal LoadBalancer for Cloud Run VPC connector access
        ilb:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: redis-fanzone
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
