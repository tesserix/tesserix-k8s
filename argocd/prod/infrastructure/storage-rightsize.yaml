apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-rightsize
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/infrastructure/storage-rightsize
    helm:
      valueFiles:
        - values.yaml
        - economy-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homechef
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: true
