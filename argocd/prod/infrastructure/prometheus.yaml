apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:observability-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 25.30.2
    helm:
      parameters:
        - name: server.image.repository
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/quay-remote/prometheus/prometheus
        - name: configmapReload.prometheus.image.repository
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/quay-remote/prometheus-operator/prometheus-config-reloader
        - name: alertmanager.image.repository
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/quay-remote/prometheus/alertmanager
        - name: prometheus-node-exporter.image.repository
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/quay-remote/prometheus/node-exporter
        - name: prometheus-pushgateway.image.repository
          value: asia-south1-docker.pkg.dev/tesseracthub-480811/quay-remote/prometheus/pushgateway
        - name: kube-state-metrics.image.registry
          value: asia-south1-docker.pkg.dev
        - name: kube-state-metrics.image.repository
          value: tesseracthub-480811/k8s-remote/kube-state-metrics/kube-state-metrics
      releaseName: prometheus
      values: |
        # Prometheus server configuration
        server:
          # Persistent storage (standard HDD — existing PVC, migrate to premium-rwo SSD later)
          persistentVolume:
            enabled: true
            size: 20Gi
            storageClass: standard

          # No memory limits — Prometheus self-regulates and needs uncapped
          # memory during WAL replay (500+ segments from prior 15d retention)
          resources:
            requests:
              memory: 2Gi

          # Retention — 7d reduces WAL/block volume significantly
          retention: "7d"
          retentionSize: "15GB"

          # WAL compression — reduces WAL size by ~50%, much faster replay
          extraFlags:
            - web.enable-lifecycle
            - storage.tsdb.wal-compression
            - storage.tsdb.min-block-duration=2h
            - storage.tsdb.max-block-duration=6h

          # Startup probe — give Prometheus up to 60 min for WAL replay
          # without being killed by liveness probe
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 240
            timeoutSeconds: 15

          # Global scrape configuration — 30s reduces WAL volume by 50% vs 15s
          # while still providing sufficient resolution for cost monitoring
          global:
            scrape_interval: 30s
            evaluation_interval: 30s

          # Ingress for Prometheus UI
          ingress:
            enabled: true
            ingressClassName: kong
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              konghq.com/protocols: "https"
            hosts:
              - prometheus.mark8ly.com
            path: /
            pathType: Prefix
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.mark8ly.com

          # Pod security context (fsGroup at pod level)
          podSecurityContext:
            fsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # Container security context (without fsGroup)
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

        # Alertmanager configuration
        alertmanager:
          enabled: true

          persistentVolume:
            enabled: true
            size: 10Gi

          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi

          # Pod security context (fsGroup at pod level)
          podSecurityContext:
            fsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # Container security context (without fsGroup)
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # Ingress for Alertmanager
          ingress:
            enabled: true
            className: kong
            ingressClassName: kong
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              konghq.com/protocols: "https"
            hosts:
              - host: alertmanager.mark8ly.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.mark8ly.com

        # Pushgateway
        pushgateway:
          enabled: true
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        # Node exporter for node metrics
        nodeExporter:
          enabled: true
          service:
            annotations:
              service.kubernetes.io/topology-aware-hints: auto
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        # Kube state metrics
        kubeStateMetrics:
          enabled: true

        # Additional scrape configs for Istio
        extraScrapeConfigs: |
          # Istio sidecar metrics from all pods (for istio_requests_total, etc.)
          # 60s interval — Istio sidecars produce high cardinality, this reduces WAL volume
          - job_name: 'istio-proxy'
            scrape_interval: 60s
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Only scrape pods with istio-proxy sidecar
              - source_labels: [__meta_kubernetes_pod_container_name]
                action: keep
                regex: 'istio-proxy'
              # Use port 15090 for Istio metrics
              - source_labels: [__address__]
                action: replace
                regex: ([^:]+)(?::\d+)?
                replacement: ${1}:15090
                target_label: __address__
              # Add pod name label
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              # Add namespace label
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              # Add service name from pod labels
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: app
              # Add workload label
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                target_label: workload

          # Istiod control plane metrics
          - job_name: 'istiod'
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - istio-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                action: keep
                regex: istiod;http-monitoring

          # Istio ingress gateway metrics
          - job_name: 'istio-ingressgateway'
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - istio-ingress
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: 'istio-ingressgateway'
              - source_labels: [__address__]
                action: replace
                regex: ([^:]+)(?::\d+)?
                replacement: ${1}:15090
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace

          # Istio egress gateway metrics
          - job_name: 'istio-egressgateway'
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - istio-egress
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: 'istio-egressgateway'
              - source_labels: [__address__]
                action: replace
                regex: ([^:]+)(?::\d+)?
                replacement: ${1}:15090
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace

        # Service account
        serviceAccounts:
          server:
            create: true
          alertmanager:
            create: true
          pushgateway:
            create: true
          nodeExporter:
            create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # Ignore empty resources field added by Helm for configmap-reload sidecars
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/resources
      jqPathExpressions:
        - .status.terminatingReplicas
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/spec/containers/0/resources
    # Ignore volumeClaimTemplates apiVersion/kind which are stripped at runtime
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
