apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:observability-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 25.30.2
    helm:
      releaseName: prometheus
      values: |
        # Prometheus server configuration
        server:
          # REVIVED 2026-09-03 (was PARKED 2026-08-01 at 0 for cost; see
          # docs/observability-park.md). Everything below is unchanged from
          # the park, which is what made revival a single 0 → 1.
          #
          # Revived because the park's stated blocker no longer applies. The
          # doc says parked pods pend forever on the `workload=observability`
          # taint until that node pool is recreated — but no node carries any
          # taint now, and this deployment has `nodeSelector: {}` and
          # `tolerations: []`, so it schedules on the one remaining pool
          # (optimized-v2, 6x e2-standard-8 at 24-63% memory). The 2Gi request
          # fits existing headroom: no node pool, no new VM, and with
          # persistentVolume disabled below, no new disk either.
          #
          # Only `server` is revived. alertmanager, pushgateway,
          # kube-state-metrics, node-exporter and grafana stay at 0 — each
          # adds pods without serving the reason for this change, and each is
          # its own cost decision.
          replicaCount: 1

          # Storage dropped 2026-08-30 (TSDB disk snapshotted as
          # orphan-cleanup-*); revival starts with an empty TSDB on emptyDir
          # until persistence is deliberately re-enabled.
          persistentVolume:
            enabled: false

          # No memory limits — Prometheus self-regulates and needs uncapped
          # memory during WAL replay (500+ segments from prior 15d retention)
          resources:
            requests:
              memory: 2Gi

          # Retention — 7d reduces WAL/block volume significantly
          retention: "7d"
          retentionSize: "15GB"

          # WAL compression — reduces WAL size by ~50%, much faster replay
          extraFlags:
            - web.enable-lifecycle
            - storage.tsdb.wal-compression
            - storage.tsdb.min-block-duration=2h
            - storage.tsdb.max-block-duration=6h

          # Startup probe — give Prometheus up to 60 min for WAL replay
          # without being killed by liveness probe
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 240
            timeoutSeconds: 15

          # Global scrape configuration — 30s reduces WAL volume by 50% vs 15s
          # while still providing sufficient resolution for cost monitoring
          global:
            scrape_interval: 30s
            evaluation_interval: 30s

          # Ingress for Prometheus UI
          # Kong ingress DISABLED 2026-07-26. Kong is decommissioned: there are zero
          # Kong pods and no IngressClass resources in the cluster, so nothing ever
          # populated status.loadBalancer and ArgoCD reported the app Progressing
          # forever. Routing is Istio VirtualService + the shared gateway, the same
          # way observability.tesserix.app works.

          ingress:
            enabled: false
            ingressClassName: kong
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              konghq.com/protocols: "https"
            hosts:
              - prometheus.mark8ly.com
            path: /
            pathType: Prefix
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.mark8ly.com

          # Pod security context (fsGroup at pod level)
          podSecurityContext:
            fsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # Container security context (without fsGroup)
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

        # Alertmanager configuration
        alertmanager:
          # enabled stays true so the StatefulSet, config and PVC survive in
          # the cluster; PARKED 2026-08-01 by replicaCount instead. Alert rules
          # still render, but nothing evaluates or delivers them while parked.
          enabled: true
          replicaCount: 0

          # Storage dropped 2026-08-30 with the parked stack; alertmanager
          # holds only silences/notification state.
          persistentVolume:
            enabled: false

          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi

          # Pod security context (fsGroup at pod level)
          podSecurityContext:
            fsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # Container security context (without fsGroup)
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          # Ingress for Alertmanager
          # Kong ingress DISABLED 2026-07-26. Kong is decommissioned: there are zero
          # Kong pods and no IngressClass resources in the cluster, so nothing ever
          # populated status.loadBalancer and ArgoCD reported the app Progressing
          # forever. Routing is Istio VirtualService + the shared gateway, the same
          # way observability.tesserix.app works.

          ingress:
            enabled: false
            className: kong
            ingressClassName: kong
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              konghq.com/protocols: "https"
            hosts:
              - host: alertmanager.mark8ly.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.mark8ly.com

        # Pushgateway
        pushgateway:
          enabled: true
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        # Node exporter for node metrics
        nodeExporter:
          enabled: true
          service:
            annotations:
              service.kubernetes.io/topology-aware-hints: auto
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi

        # Kube state metrics
        kubeStateMetrics:
          enabled: true

        # PARKED 2026-08-01. The three blocks above use pre-19.x key names that
        # chart 25.x ignores entirely — the subcharts run on their own defaults,
        # so parking them has to happen under the real subchart keys below.
        # Left `enabled: true` deliberately: enabled:false would let ArgoCD's
        # prune delete the workloads outright, and nothing here is being removed.
        prometheus-pushgateway:
          replicaCount: 0

        kube-state-metrics:
          replicas: 0

        # A DaemonSet has no replica count, so the park is an unsatisfiable
        # selector — no node carries this label. Empty it out to revive.
        prometheus-node-exporter:
          nodeSelector:
            tesserix.io/node-exporter: "enabled"

        # Additional scrape configs for Istio
        extraScrapeConfigs: |
          # Istio sidecar metrics from all pods (for istio_requests_total, etc.)
          # 60s interval — Istio sidecars produce high cardinality, this reduces WAL volume
          - job_name: 'istio-proxy'
            scrape_interval: 60s
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Only scrape pods with istio-proxy sidecar
              - source_labels: [__meta_kubernetes_pod_container_name]
                action: keep
                regex: 'istio-proxy'
              # Use port 15090 for Istio metrics
              - source_labels: [__address__]
                action: replace
                regex: ([^:]+)(?::\d+)?
                replacement: ${1}:15090
                target_label: __address__
              # Add pod name label
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              # Add namespace label
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              # Add service name from pod labels
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: app
              # Add workload label
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                target_label: workload

          # Istiod control plane metrics
          - job_name: 'istiod'
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - istio-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                action: keep
                regex: istiod;http-monitoring

          # Istio ingress gateway metrics
          - job_name: 'istio-ingressgateway'
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - istio-ingress
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: 'istio-ingressgateway'
              - source_labels: [__address__]
                action: replace
                regex: ([^:]+)(?::\d+)?
                replacement: ${1}:15090
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace

          # Istio egress gateway metrics
          - job_name: 'istio-egressgateway'
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - istio-egress
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: 'istio-egressgateway'
              - source_labels: [__address__]
                action: replace
                regex: ([^:]+)(?::\d+)?
                replacement: ${1}:15090
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace

        # Service account
        serviceAccounts:
          server:
            create: true
          alertmanager:
            create: true
          pushgateway:
            create: true
          nodeExporter:
            create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # Ignore empty resources field added by Helm for configmap-reload sidecars
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/resources
      jqPathExpressions:
        - .status.terminatingReplicas
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/spec/containers/0/resources
    # Ignore volumeClaimTemplates apiVersion/kind which are stripped at runtime
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
  syncPolicy:
    automated:
      # prune: true is required for this app to ever converge. With only
      # selfHeal, a resource deleted from the chart stays in the cluster
      # forever and the app is pinned OutOfSync -- which is what kept the
      # decommissioned Kong Ingress alive and the app amber.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
