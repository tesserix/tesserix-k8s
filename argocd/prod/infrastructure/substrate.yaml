# Agent Substrate controller/runtime (ate-system). The controller is a normal pod
# (no gVisor) — only the WorkerPool's worker needs the sandbox node. Lands after the
# CRDs (-6) and before kagent enables substrate (-3). devai/docs/agentic/SUBSTRATE-SETUP.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-substrate
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/substrate/helm
    chart: substrate
    # 0.0.8 uses system roots for external OIDC issuers. This is required on
    # GKE because its public container.googleapis.com issuer is not signed by
    # the in-cluster Kubernetes service-account CA.
    targetRevision: 0.0.8
    helm:
      releaseName: substrate
      values: |
        auth:
          jwt:
            # GKE mints SA tokens with the cluster's OIDC issuer, NOT the
            # in-cluster default (kubernetes.default.svc.cluster.local). Without
            # this the ate-api rejects the kagent controller's token
            # ("Unauthenticated: unexpected issuer …") and SandboxAgents stay
            # ActorTemplateNotReady. Value = this cluster's issuer
            # (kubectl get --raw /.well-known/openid-configuration).
            issuer: https://container.googleapis.com/v1/projects/tesseracthub-480811/locations/asia-south1/clusters/tesseract-prod-in-gke
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  # Helm generates these values on first install. Preserve the live TLS and
  # actor/session signing material across chart upgrades rather than rotating
  # credentials when Argo renders the new chart version.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: ateapi-ca
      namespace: ate-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: ateapi-tls
      namespace: ate-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: session-id-ca-pool
      namespace: ate-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: session-id-jwt-pool
      namespace: ate-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
