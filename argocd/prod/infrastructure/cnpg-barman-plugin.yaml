apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-plugin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: database-backup
  annotations:
    # After the CNPG operator (-40) and cert-manager, before any Cluster that
    # declares the plugin. Without it an ObjectStore is an unknown kind and the
    # owning app fails to sync entirely.
    argocd.argoproj.io/sync-wave: "-35"
spec:
  project: default
  source:
    repoURL: ghcr.io/cloudnative-pg/charts
    chart: plugin-barman-cloud
    targetRevision: 0.7.1
    helm:
      releaseName: barman-cloud
      valuesObject:
        image:
          registry: asia-south1-docker.pkg.dev
          repository: tesseracthub-480811/ghcr-remote/cloudnative-pg/plugin-barman-cloud
          tag: v0.14.0@sha256:823a8893690980ba5830bbbb11196a35f695b0488db7d846abc33baebf32417c
        sidecarImage:
          registry: asia-south1-docker.pkg.dev
          repository: tesseracthub-480811/ghcr-remote/cloudnative-pg/plugin-barman-cloud-sidecar
          tag: v0.14.0@sha256:9880817c285c7afa4d195da2145064d21907405489ed6ec39abe59b1feb558a4
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
