apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: observability
  annotations:
    # Wave 3 — last. It only reads, so it depends on the whole pipeline above
    # having produced something. It will start and report unready (its /readyz
    # pings ClickHouse) until storage is serving, which is the correct
    # behaviour rather than a failure.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/obs-api
    targetRevision: HEAD
    helm:
      releaseName: obs-api
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
