apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-otel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
  annotations:
    # Wave 0 — the storage backend behind the OTel collector's clickhouseexporter.
    # Brought up alongside the collector; the exporter retries/queues until this
    # ClickHouse is reachable, so there's no hard ordering requirement.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/clickhouse-otel
    targetRevision: HEAD
    helm:
      releaseName: clickhouse-otel
      # Inline values override chart defaults (the redis-global pattern). Prod
      # sizing only — the server/DB/volume wiring lives in the chart. The
      # password Secret (clickhouse-otel-secrets) is provisioned by an
      # ExternalSecret from GCP SM, so createPlaceholderSecret stays false.
      values: |
        replicaCount: 1
        persistence:
          size: 20Gi
          storageClassName: standard-rwo
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 4Gi
        auth:
          existingSecret: clickhouse-otel-secrets
          createPlaceholderSecret: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
