apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/external-secrets
    helm:
      releaseName: external-secrets
      valueFiles:
        - values.yaml
      values: |
        # Override for prod environment
        gcp:
          projectId: "tesseracthub-480811"
          serviceAccount:
            name: "external-secrets"
            gcpServiceAccount: "app-secrets-ext-secrets-prod@tesseracthub-480811.iam.gserviceaccount.com"
        environment: "prod"
        # Scrape ESO and alert on ExternalSecrets that stop syncing
        # (tesserix-k8s#1032). HERE, not in the chart's values-prod.yaml:
        # `valueFiles` above is values.yaml ONLY, so that file is loaded by
        # nothing and a setting placed there renders nothing while ArgoCD
        # still reports Synced/Healthy — which is exactly what happened on the
        # first attempt at this change.
        monitoring:
          enabled: true
        # Fix SA annotation for Workload Identity (must match GCP SA with WI binding)
        external-secrets:
          serviceAccount:
            annotations:
              iam.gke.io/gcp-service-account: "app-secrets-ext-secrets-prod@tesseracthub-480811.iam.gserviceaccount.com"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
