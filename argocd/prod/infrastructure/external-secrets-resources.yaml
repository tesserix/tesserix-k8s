apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: external-secrets/prod
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
  # The installed CRD omits this controller-defaulted field from its schema,
  # which otherwise makes Argo's structured merge diff fail for healthy resources.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers: [/spec/refreshPolicy]
  syncPolicy:
    automated:
      # Every ExternalSecret ever deleted from git stayed live and tracked, so
      # the app read OutOfSync/Degraded off manifests no longer in tree. Every
      # target sets deletionPolicy: Retain — pruning drops the ExternalSecret
      # and leaves its Secret behind.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
