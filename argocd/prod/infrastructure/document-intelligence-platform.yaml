apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: document-intelligence-platform
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: document-intelligence
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: k8s/platform/document-intelligence
  destination:
    server: https://kubernetes.default.svc
    namespace: document-intelligence
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    managedNamespaceMetadata:
      labels: {istio.io/dataplane-mode: ambient}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
