apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-ui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: observability
  annotations:
    # Kargo bumps image.tag in charts/apps/obs-ui/values.yaml and then syncs
    # this Application. Without this annotation it refuses to touch it.
    kargo.akuity.io/authorized-stage: "kargo-infra:observability-apps-prod"
    # Wave 3 — alongside obs-api. It holds no credentials and reads no
    # database; if obs-api is not up yet it simply renders the sign-in screen.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/apps/obs-ui
    targetRevision: HEAD
    helm:
      releaseName: obs-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
