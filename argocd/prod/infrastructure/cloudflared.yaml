apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    # Deploy after external-secrets is ready
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/infrastructure/cloudflared
    helm:
      releaseName: cloudflared
      valueFiles:
        - values.yaml
      values: |
        # Production environment overrides
        #
        # NO `image.tag` HERE, DELIBERATELY. It used to pin "2026.2.0", and
        # these inline values OVERRIDE the chart — so when the chart's
        # values.yaml was bumped to "2026.3.0" (with a comment explaining
        # that 2026.2.0 logged "Your version is outdated" and had stuck
        # "Incoming request ended abruptly: context canceled" episodes),
        # that bump was a silent no-op. Production still ran 2026.2.0,
        # while ArgoCD reported Synced and Healthy, and git read as though
        # the fix had shipped. Verified on the cluster 2026-09-21.
        #
        # The tag now lives in the chart's values.yaml and nowhere else, so
        # the file you edit is the file that takes effect. Do not reintroduce
        # a tag override here without deleting the chart's.

        # Tunnel configuration
        tunnel:
          existingSecret: "cloudflare-tunnel-token"
          existingSecretKey: "token"
          # Pin to HTTP/2 (TCP) instead of QUIC (UDP). GKE Container-Optimized OS
          # ships net.core.rmem_max far below the 7 MiB QUIC wants; the buffer
          # warning at cloudflared startup ("failed to sufficiently increase
          # receive buffer size") leads to silent QUIC connection degradation
          # over ~24h, manifesting as ~50% request failures from Cloudflare
          # edge to the tunnel. HTTP/2 is TCP and unaffected.
          protocol: "http2"

        # ExternalSecrets configuration
        externalSecrets:
          enabled: true
          refreshInterval: "1h"
          # Namespaced store rendered by the openbao chart from its
          # namespaceWhitelist; ESO authenticates as the cloudflared SA.
          secretStore: "openbao-cloudflared"
          secretStoreKind: SecretStore
          remoteKey: "cloudflared/cloudflared/tunnel"
          remoteProperty: "token"

        # Resources - production sizing
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi

        # Autoscaling - production setup
        #
        # minReplicas is the ONLY knob that actually sets tunnel capacity
        # here, so it is set deliberately and not left at the chart default.
        #
        # Each cloudflared replica registers 4 HA connections to the edge
        # (cloudflared_tunnel_ha_connections == 4 per pod), and every
        # hostname on this tunnel shares them: mark8ly.com, tesserix.app and
        # api.dwellm8.com, ~64k requests per pod per 18h. At 2 replicas that
        # is 8 connections for the whole estate. Because `protocol: http2`
        # above pins the transport to TCP, all streams on a connection share
        # one congestion window, so a single stalled connection blocks every
        # request multiplexed onto it.
        #
        # Measured on 2026-09-24 against auth.tesserix.app, from outside:
        # serial requests were 0.35s apart from one 27s outlier, but 8
        # concurrent requests for the same asset returned in 0.37s x5, then
        # 5.5s, 65s and 73s -- while Istio reported
        # x-envoy-upstream-service-time of 6-17ms for those same requests.
        # The origin was answering in milliseconds; the time was spent in the
        # tunnel. Cloudflare served intermittent 520s throughout. The Zitadel
        # login UI pulls 28 assets, so this rendered as a blank page with a
        # spinner for tens of seconds, and looked like "Zitadel is down" when
        # blog.tesserix.app was degraded identically.
        #
        # 2 -> 4 doubles the edge connections to 16.
        #
        # The HPA CANNOT do this on its own and never has -- zero scaling
        # events in 231 days. It targets memory at 80% and cloudflared sits
        # at 24% (~31Mi of a 128Mi request) while saturating its connections,
        # because a network proxy runs out of sockets, not heap. Memory is
        # nonetheless the only usable target: the chart sets no cpu request
        # (estate-wide rule for memory-only resources), and an HPA cannot
        # compute cpu utilisation without one. So treat maxReplicas as a
        # ceiling that will not be reached and set the floor by hand.
        autoscaling:
          enabled: true
          minReplicas: 4
          maxReplicas: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Client-side apply: ArgoCD's bundled OpenAPI lags behind the cluster's
      # K8s 1.33+ schema (e.g. Deployment.status.terminatingReplicas), which
      # breaks the structured merge diff under ServerSideApply. Client-side
      # apply diffs textually and is unaffected.
      - ServerSideApply=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
