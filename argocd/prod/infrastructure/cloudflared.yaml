apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    # Deploy after external-secrets is ready
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/infrastructure/cloudflared
    helm:
      releaseName: cloudflared
      valueFiles:
        - values.yaml
      values: |
        # Production environment overrides
        #
        # NO `image.tag` HERE, DELIBERATELY. It used to pin "2026.2.0", and
        # these inline values OVERRIDE the chart — so when the chart's
        # values.yaml was bumped to "2026.3.0" (with a comment explaining
        # that 2026.2.0 logged "Your version is outdated" and had stuck
        # "Incoming request ended abruptly: context canceled" episodes),
        # that bump was a silent no-op. Production still ran 2026.2.0,
        # while ArgoCD reported Synced and Healthy, and git read as though
        # the fix had shipped. Verified on the cluster 2026-09-21.
        #
        # The tag now lives in the chart's values.yaml and nowhere else, so
        # the file you edit is the file that takes effect. Do not reintroduce
        # a tag override here without deleting the chart's.

        # Tunnel configuration
        tunnel:
          existingSecret: "cloudflare-tunnel-token"
          existingSecretKey: "token"
          # Pin to HTTP/2 (TCP) instead of QUIC (UDP). GKE Container-Optimized OS
          # ships net.core.rmem_max far below the 7 MiB QUIC wants; the buffer
          # warning at cloudflared startup ("failed to sufficiently increase
          # receive buffer size") leads to silent QUIC connection degradation
          # over ~24h, manifesting as ~50% request failures from Cloudflare
          # edge to the tunnel. HTTP/2 is TCP and unaffected.
          protocol: "http2"

        # ExternalSecrets configuration
        externalSecrets:
          enabled: true
          refreshInterval: "1h"
          # Namespaced store rendered by the openbao chart from its
          # namespaceWhitelist; ESO authenticates as the cloudflared SA.
          secretStore: "openbao-cloudflared"
          secretStoreKind: SecretStore
          remoteKey: "cloudflared/cloudflared/tunnel"
          remoteProperty: "token"

        # Resources - production sizing
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi

        # Autoscaling - production setup
        #
        # minReplicas was raised 2 -> 4 on 2026-09-24 (#1101) and reverted the
        # same day (#1106). Recorded so nobody spends the afternoon again:
        # MORE CONNECTORS DO NOT FIX A SLOW TUNNEL. Each replica registers 4
        # edge connections, so this took the estate from 8 to 16, and changed
        # nothing measurable. Restarting every connector changed nothing
        # either.
        #
        # The symptom was auth.tesserix.app serving the Zitadel login UI as a
        # blank page, 10-90s stalls and intermittent 520/525. What it actually
        # turned out to be: the SAME tunnel answers in 130ms when the request
        # enters at Cloudflare's Mumbai edge (verified from inside the cluster,
        # cf-ray ...-BOM, cf-cache-status DYNAMIC, 8/8) and fails 6-of-8 from
        # Sydney. Origin was answering in 6-17ms throughout
        # (x-envoy-upstream-service-time), cluster egress was clean (20/20 new
        # TLS conns to Cloudflare, 5-13ms connect), and the GKE LB was rock
        # steady at 0.70s when addressed directly.
        #
        # CONFIRMED CAUSE: Cloudflare's own status page carried an active
        # incident, "Network Performance Degradation - Asia-Pacific" (Network,
        # Identified), on 2026-09-24. Both ends were healthy; the fault was
        # inside Cloudflare's APAC network and nothing in this repo could fix
        # it. The tell was that the failure tracked the ENTRY EDGE rather than
        # anything about the request: identical URL, tunnel and origin, fast
        # from BOM, broken from SYD. Check status.cloudflare.com before
        # changing infrastructure next time -- it would have cost one minute
        # and saved two wrong root causes (connector capacity, then Cloud NAT).
        #
        # Ruled out along the way, so they need not be re-tested: connector
        # count, connector restarts, cloudflared 2026.3.0 (homechef and
        # helivanta had run it 25 days and degraded identically), Cloud NAT
        # (OUT_OF_RESOURCES drops are real and chronic but egress proved
        # healthy, and they were far worse earlier in the week while the estate
        # was fine), and a geo rule (tesserix.app's only country rule is a
        # `skip` that INCLUDES AU, unchanged since 2026-03-26; 60 days of
        # Cloudflare audit log show no country change on either zone).
        #
        # Still unverified, because no available API token can read them:
        # account-level rulesets, mark8ly.com's custom rules, and Regional
        # Services / Data Localization. Check those in the dashboard first if
        # this recurs.
        autoscaling:
          enabled: true
          # Two connectors = 8 edge connections, which measurement showed is
          # not the constraint. Raise this only for connector REDUNDANCY, never
          # to chase latency.
          minReplicas: 2
          maxReplicas: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Client-side apply: ArgoCD's bundled OpenAPI lags behind the cluster's
      # K8s 1.33+ schema (e.g. Deployment.status.terminatingReplicas), which
      # breaks the structured merge diff under ServerSideApply. Client-side
      # apply diffs textually and is unaffected.
      - ServerSideApply=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
