apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.0
    helm:
      releaseName: kps
      values: |
        # PHASE 1 of docs/2026-09-04-alerting-restoration-design.md.
        #
        # WHY THIS EXISTS: the estate has 16 PrometheusRule CRs authored for
        # prometheus-operator, and no operator was ever installed — only the
        # CRD chart. The community `prometheus` release cannot read CRs, so
        # those rules have never been evaluated by anything. See mark8ly#644.
        #
        # This release runs ALONGSIDE the community `prometheus` release
        # during phases 1-2. It is named `kps` precisely so nothing collides
        # with the `prometheus-*` resources that release owns. The old one
        # keeps serving until parity is proven (phase 2), because it is
        # currently the ONLY thing scraping marketplace-api and we have no
        # alerting that would tell us if that stopped.

        # ── CRDs are already installed by the prometheus-operator-crds app ──
        crds:
          enabled: false

        # ── PHASE 2.5: components GKE manages and does not expose ──
        # Verified on this cluster after phase 1: up{job="kube-controller-manager"},
        # up{job="kube-scheduler"} and up{job="kube-proxy"} all return ZERO
        # series. GKE runs those in the managed control plane, so there is
        # nothing to scrape and the chart's default alerts for them can never
        # be satisfied — KubeControllerManagerDown, KubeSchedulerDown and
        # KubeProxyDown were all pending at CRITICAL severity within minutes
        # of phase 1.
        #
        # Left in, phase 3's critical-only routing would deliver three alerts
        # that can never clear, on day one. That is the fastest way to teach
        # everyone to ignore the channel, and it would discredit the alerts
        # underneath them that are real.
        #
        # etcd is disabled for the same reason: managed, unexposed.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        defaultRules:
          rules:
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
            etcd: false

        # ── Out of scope for this work ──
        # A parked Grafana already exists in this namespace; dashboards are a
        # separate decision (design doc, "Out of scope").
        grafana:
          enabled: false

        # Both are currently PARKED at 0 in the community release. Left off
        # here too rather than switched on speculatively — phase 2 surfaces
        # any rule that needs their series by showing it never evaluating,
        # and then they get enabled deliberately.
        nodeExporter:
          enabled: false

        # ── PHASE 4b: kube-state-metrics ──
        # Enabled for one reason that nothing else can serve: a failed Kargo
        # promotion is invisible to metrics without it.
        #
        # Kargo v1.11.1 exports ONLY controller-runtime metrics — verified
        # against the live /metrics after phase 4a. And crucially
        # `controller_runtime_reconcile_errors_total{controller="promotion"}`
        # reads 0 while SEVEN Promotions sit in phase `Errored`: the
        # controller reconciles a promotion into the error phase
        # SUCCESSFULLY, so the failure is domain-level and invisible to
        # controller metrics. An alert on reconcile errors would never fire
        # for the case this exists to catch.
        #
        # The ground truth is the Promotion CR's status.phase, which only
        # kube-state-metrics can turn into a series.
        #
        # Side effect, deliberate: 45 of 259 alerting rules reference kube_*
        # series and are dormant today (36 chart, 9 the estate wrote). They
        # start evaluating. That is contained by design — routing is
        # mark8ly-only and critical-only, so newly-live rules become visible
        # in Prometheus without paging anyone.
        kubeStateMetrics:
          enabled: true

        kube-state-metrics:
          resources:
            requests:
              memory: 128Mi
          # Teach KSM about Kargo Promotions. Emits
          # kube_customresource_kargo_promotion_phase{phase=...} = 1 for the
          # phase each Promotion is currently in.
          #
          # No extraArgs: the chart passes the config file itself when
          # customResourceState.enabled is set, and a hand-added flag that
          # duplicates or contradicts it would crashloop the exporter.
          rbac:
            extraRules:
              - apiGroups: ["kargo.akuity.io"]
                resources: ["promotions"]
                verbs: ["list", "watch"]
          customResourceState:
            enabled: true
            config:
              spec:
                resources:
                  - groupVersionKind:
                      group: kargo.akuity.io
                      version: v1alpha1
                      kind: Promotion
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      promotion: [metadata, name]
                      stage: [spec, stage]
                    metrics:
                      - name: kargo_promotion_phase
                        help: "Current phase of a Kargo Promotion"
                        each:
                          type: StateSet
                          stateSet:
                            labelName: phase
                            path: [status, phase]
                            list:
                              - Pending
                              - Running
                              - Succeeded
                              - Failed
                              - Errored
                              - Aborted

                      # Promotion CRs are RETAINED after they finish, so
                      # phase="Errored" is not an event — it is permanent
                      # history. Measured on the live series: 91 errored
                      # Promotions estate-wide, 7 of them in kargo-mark8ly,
                      # some months old. An alert on the phase alone would
                      # fire 7 times the instant it was deployed, for
                      # failures nobody can act on any more, and would then
                      # never clear.
                      #
                      # This gauge is what makes the alert about NOW.
                      - name: kargo_promotion_created
                        help: "Unix creation timestamp of a Kargo Promotion"
                        each:
                          type: Gauge
                          gauge:
                            path: [metadata, creationTimestamp]

        # ── PHASE 4c: the Kargo promotion alert ──
        # Carried in this Application rather than a standalone
        # PrometheusRule: k8s/cluster/prometheus/rules/ is NOT deployed
        # (its `subscription-observability` Application is absent from
        # argocd/prod/infrastructure/kustomization.yaml), so a rule added
        # there would sit in git and never evaluate. Rules here ship with
        # the release and are matched by `ruleSelector: {}`.
        additionalPrometheusRulesMap:
          kargo-promotions:
            groups:
              - name: kargo-promotions
                rules:
                  # The alert this whole effort was for: a promotion fails,
                  # the image tag silently stops advancing, and prod keeps
                  # serving the old build while main looks green.
                  #
                  # Deliberately NOT written on
                  # controller_runtime_reconcile_errors_total: that reads 0
                  # while 7 Promotions sit Errored, because Kargo reconciles
                  # a promotion INTO the error phase successfully.
                  - alert: KargoPromotionFailed
                    expr: |
                      (
                        kube_customresource_kargo_promotion_phase{namespace="kargo-mark8ly", phase=~"Errored|Failed"} == 1
                      )
                      and on (namespace, promotion)
                      (
                        time() - kube_customresource_kargo_promotion_created < 7200
                      )
                    for: 10m
                    labels:
                      severity: critical
                      product: mark8ly
                    annotations:
                      summary: "Kargo promotion to {{ $labels.stage }} is {{ $labels.phase }}"
                      description: >-
                        Promotion {{ $labels.promotion }} to stage {{ $labels.stage }}
                        ({{ $labels.namespace }}) ended in phase {{ $labels.phase }}.
                        The deployed image tag will NOT advance until this is
                        resolved — prod keeps serving the previous build while
                        main appears green. Check: kubectl -n {{ $labels.namespace }}
                        get promotion {{ $labels.promotion }} -o yaml

                  # ── Two self-checks ──
                  # KargoPromotionFailed depends on a join between two
                  # metrics. If either side stops existing, the join yields
                  # nothing and the alert goes quiet — indistinguishable
                  # from healthy, and precisely the failure mode this work
                  # has been removing. These make that loud instead.
                  #
                  # They carry an explicit namespace label because absent()
                  # returns a bare series with no labels of its own, so
                  # without it they would fire in Prometheus and match no
                  # Alertmanager route.
                  - alert: KargoPromotionMetricsMissing
                    expr: absent(kube_customresource_kargo_promotion_phase)
                    for: 30m
                    labels:
                      severity: critical
                      namespace: kargo-mark8ly
                      product: mark8ly
                    annotations:
                      summary: "Kargo promotion metrics have disappeared"
                      description: >-
                        kube-state-metrics is no longer exporting Kargo
                        Promotion phases, so KargoPromotionFailed cannot fire.
                        Promotion failures are currently UNMONITORED. Check the
                        kube-state-metrics pod and its customResourceState config.

                  - alert: KargoPromotionCreatedMetricMissing
                    expr: absent(kube_customresource_kargo_promotion_created)
                    for: 30m
                    labels:
                      severity: critical
                      namespace: kargo-mark8ly
                      product: mark8ly
                    annotations:
                      summary: "Kargo promotion creation timestamps are missing"
                      description: >-
                        The creation-timestamp gauge is absent, so the recency
                        join in KargoPromotionFailed matches nothing and that
                        alert can never fire. Promotion failures are currently
                        UNMONITORED.

        prometheus:
          prometheusSpec:
            # Evaluate every PrometheusRule in the cluster, not just ones
            # labelled for this release. The 16 existing CRs carry no
            # release label — they were written for an operator that was
            # never installed — so a selector would match none of them and
            # this whole exercise would change nothing.
            ruleSelectorNilUsesHelmValues: false
            ruleNamespaceSelector: {}
            ruleSelector: {}

            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            # An unset namespace selector means "my own namespace only", so a
            # ServiceMonitor in `kargo` (phase 4) would exist, look correct,
            # and never be read. Empty selectors mean ALL namespaces — which
            # is also what the estate's rules already assume, since their
            # PrometheusRule CRs live in each product's own namespace.
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}

            # Match the community release so a comparison in phase 2 is
            # like-for-like, and so retention cost does not change.
            retention: 7d
            retentionSize: "15GB"

            # Same reasoning as the community release: Prometheus needs
            # uncapped memory during WAL replay. It is currently using
            # ~3.4Gi against a 2Gi request.
            resources:
              requests:
                memory: 2Gi

            # emptyDir, matching the community release after its TSDB disk
            # was dropped in the August park. History dies on restart;
            # re-enabling persistence is a separate ~$5/month decision.
            storageSpec: {}

            # ── SCRAPE PARITY: the whole risk of this migration ──
            # kube-prometheus-stack discovers targets through ServiceMonitor
            # and PodMonitor CRs. It does NOT scrape prometheus.io/*
            # annotations. That annotation job is currently the only thing
            # scraping marketplace-api — http_requests_total,
            # carriersecrets_events_total and the rest restored in
            # mark8ly#625/#635. Carrying it forward verbatim is what stops
            # this migration silently deleting the observability it exists
            # to build on.
            additionalScrapeConfigs:
              - job_name: kubernetes-pods
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - action: keep
                    regex: true
                    source_labels:
                      - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                  - action: drop
                    regex: true
                    source_labels:
                      - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
                  - action: replace
                    regex: (https?)
                    source_labels:
                      - __meta_kubernetes_pod_annotation_prometheus_io_scheme
                    target_label: __scheme__
                  - action: replace
                    regex: (.+)
                    source_labels:
                      - __meta_kubernetes_pod_annotation_prometheus_io_path
                    target_label: __metrics_path__
                  - action: replace
                    regex: (\d+);((([0-9]+?)(\.|$)){4})
                    replacement: $2:$1
                    source_labels:
                      - __meta_kubernetes_pod_annotation_prometheus_io_port
                      - __meta_kubernetes_pod_ip
                    target_label: __address__
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - action: replace
                    source_labels:
                      - __meta_kubernetes_namespace
                    target_label: namespace
                  - action: replace
                    source_labels:
                      - __meta_kubernetes_pod_name
                    target_label: pod

              # The four Istio jobs, carried verbatim from the community
              # release's extraScrapeConfigs. Needed for parity in phase 2 —
              # and eight ScaledObjects across the estate query
              # istio_requests_total, so losing these would break autoscaling
              # inputs as well as dashboards.
              - job_name: istio-proxy
                scrape_interval: 60s
                metrics_path: /stats/prometheus
                kubernetes_sd_configs:
                - role: pod
                relabel_configs:
                - source_labels:
                  - __meta_kubernetes_pod_container_name
                  action: keep
                  regex: istio-proxy
                - source_labels:
                  - __address__
                  action: replace
                  regex: ([^:]+)(?::\d+)?
                  replacement: ${1}:15090
                  target_label: __address__
                - source_labels:
                  - __meta_kubernetes_pod_name
                  target_label: pod
                - source_labels:
                  - __meta_kubernetes_namespace
                  target_label: namespace
                - source_labels:
                  - __meta_kubernetes_pod_label_app
                  target_label: app
                - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_name
                  target_label: workload
              - job_name: istiod
                kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names:
                    - istio-system
                relabel_configs:
                - source_labels:
                  - __meta_kubernetes_service_name
                  - __meta_kubernetes_endpoint_port_name
                  action: keep
                  regex: istiod;http-monitoring
              - job_name: istio-ingressgateway
                metrics_path: /stats/prometheus
                kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                    - istio-ingress
                relabel_configs:
                - source_labels:
                  - __meta_kubernetes_pod_label_app
                  action: keep
                  regex: istio-ingressgateway
                - source_labels:
                  - __address__
                  action: replace
                  regex: ([^:]+)(?::\d+)?
                  replacement: ${1}:15090
                  target_label: __address__
                - source_labels:
                  - __meta_kubernetes_pod_name
                  target_label: pod
                - source_labels:
                  - __meta_kubernetes_namespace
                  target_label: namespace
              - job_name: istio-egressgateway
                metrics_path: /stats/prometheus
                kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                    - istio-egress
                relabel_configs:
                - source_labels:
                  - __meta_kubernetes_pod_label_app
                  action: keep
                  regex: istio-egressgateway
                - source_labels:
                  - __address__
                  action: replace
                  regex: ([^:]+)(?::\d+)?
                  replacement: ${1}:15090
                  target_label: __address__
                - source_labels:
                  - __meta_kubernetes_pod_name
                  target_label: pod
                - source_labels:
                  - __meta_kubernetes_namespace
                  target_label: namespace

        alertmanager:
          enabled: true
          alertmanagerSpec:
            resources:
              requests:
                memory: 128Mi
            # Mounts the ExternalSecret at
            # /etc/alertmanager/secrets/alertmanager-slack-webhook/ so the
            # webhook URL is read from a file and never appears in this
            # manifest, in `helm template`, or in ArgoCD's rendered diff.
            secrets:
              - alertmanager-slack-webhook
          config:
            # PHASE 3 — narrow, deliberate routing. Default stays "null":
            # everything not explicitly matched below is evaluated and
            # visible in Prometheus, and delivered nowhere.
            route:
              group_by: ["alertname", "cluster", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: "null"
              routes:
                # ── Heartbeat ──
                # Watchdog fires permanently by design; it is the chart's
                # dead-man's switch. It is routed because mark8ly currently
                # has ZERO firing criticals, so without it a silent channel
                # would be indistinguishable from a broken pipeline — the
                # failure mode this whole effort exists to remove. One
                # message a day is cheap proof that delivery works.
                - matchers:
                    - alertname = "Watchdog"
                  receiver: slack-alerts
                  group_wait: 0s
                  group_interval: 24h
                  repeat_interval: 24h

                # ── mark8ly criticals only ──
                # Scoped to one product on purpose. The other six have 132
                # rules nobody has tuned, and five criticals firing right now
                # that belong to other owners — paging them from here would
                # be presumptuous and noisy.
                #
                # kargo-mark8ly is included because the Kargo promotion
                # metrics carry namespace="kargo-mark8ly" (the CR's own
                # namespace) — VERIFIED on the live series. With a bare
                # namespace="mark8ly" matcher, KargoPromotionFailed would
                # fire in Prometheus and reach nobody.
                #
                # namespace="mark8ly" is VERIFIED to match: mark8ly's rules
                # define only cluster+severity, but alerts inherit the series
                # labels, and cnpg_* series carry namespace="mark8ly"
                # (job="mark8ly/mark8ly-postgres"). A matcher that silently
                # matched nothing would give exactly the false confidence
                # this is meant to prevent.
                - matchers:
                    - namespace =~ "mark8ly|kargo-mark8ly"
                    - severity = "critical"
                  receiver: slack-alerts
            receivers:
              - name: "null"
              - name: slack-alerts
                slack_configs:
                  # No `channel:` — an incoming webhook is bound to its own
                  # channel (falco-events), and setting it here would imply a
                  # control this integration does not have.
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/SLACK_WEBHOOKURL
                    send_resolved: true
                    # Severity is omitted when it is "none": Slack renders
                    # title and text adjacently, so the first heartbeat read
                    # "Watchdog (firing)none — An alert that should always be
                    # firing". Real alerts carry a meaningful severity and are
                    # unaffected.
                    #
                    # NOTE: Alertmanager templates are Go stdlib text/template
                    # plus a small helper set (toUpper, toLower, title, join,
                    # match, reReplaceAll, safeHtml, stringSlice). They are NOT
                    # Sprig — `default` does not exist here, even though it is
                    # everywhere in Helm values. Using it made every send fail
                    # with `function "default" not defined`, which is invisible
                    # to config validation and to `amtool config routes test`
                    # (that checks routing, not templates). Only the Watchdog
                    # heartbeat surfaced it.
                    title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonLabels.alertname }} ({{ .Status }})'
                    text: >-
                      {{ range .Alerts }}{{ if ne .Labels.severity "none" }}*{{ .Labels.severity }}* — {{ end }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else if .Annotations.description }}{{ .Annotations.description }}{{ else }}no summary{{ end }}
                      {{ if .Labels.namespace }}ns=`{{ .Labels.namespace }}` {{ end }}{{ if .Labels.cluster }}cluster=`{{ .Labels.cluster }}` {{ end }}{{ if .Labels.pod }}pod=`{{ .Labels.pod }}`{{ end }}
                      {{ end }}

        # ── PHASE 5: prometheus-server stays resolvable ──
        # `prometheus-server.monitoring.svc` is hard-coded in 155 files —
        # Grafana and Kiali datasources, KEDA ScaledObjects, the volume
        # autoscaler, devai-sre. Retiring the community release deletes the
        # Service of that name, so without this alias every one of them
        # breaks, and most fail SILENTLY (a KEDA trigger that cannot reach
        # Prometheus just stops scaling).
        #
        # Rewriting 155 files would be a large, risky diff for no benefit.
        # One alias Service keeps every consumer working and makes the name
        # mean what callers already assume it means.
        #
        # Only one live consumer needed checking: the fingpt-inference
        # ScaledObject in `stockpilot`. Its query returns NO DATA on BOTH
        # instances today, so there is nothing to regress. Grafana is at
        # replicas=0 and Kiali has no pods; devai-sre is running and keeps
        # working through this alias.
        #
        # The selector pins the kps pod specifically: the retired community
        # pod also carried app.kubernetes.io/name=prometheus, so that label
        # alone would have been ambiguous while both existed.
        extraManifests:
          - apiVersion: v1
            kind: Service
            metadata:
              name: prometheus-server
              namespace: monitoring
              labels:
                app.kubernetes.io/name: prometheus
                app.kubernetes.io/component: server
                tesserix.io/alias-for: kps-kube-prometheus-stack-prometheus
              annotations:
                tesserix.io/note: >-
                  Compatibility alias. Points the long-standing
                  prometheus-server name at kube-prometheus-stack after the
                  community release was retired (phase 5, 2026-09-04).
            spec:
              type: ClusterIP
              ports:
                - name: http
                  port: 80
                  protocol: TCP
                  targetPort: 9090
              selector:
                app.kubernetes.io/name: prometheus
                prometheus: kps-kube-prometheus-stack-prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
