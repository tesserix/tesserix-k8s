---
# Adopts the existing `sealed-secrets` helm release (same release name).
# targetRevision is Kargo-managed at runtime (platform-tools warehouse).
# The sealing keypair lives in a Secret the chart never touches, so
# upgrades cannot lose decryption capability.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: infrastructure
spec:
  project: default
  source:
    # Chart repo moved — the old bitnami-labs.github.io pages site 404s
    # since June 2026, which also froze platform-tools freight discovery.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.1
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 64Mi
        secretName: sealed-secrets-key
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
