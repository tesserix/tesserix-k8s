apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-crds
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
    # CRDs land before the gateway itself.
    argocd.argoproj.io/sync-wave: "-6"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-data-plane
spec:
  project: default
  source:
    repoURL: cr.agentgateway.dev/charts
    chart: agentgateway-crds
    targetRevision: 1.4.1
    helm:
      releaseName: agentgateway-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      # prune intentionally OMITTED (it defaults to false) — never prune CRDs.
      # Declaring `prune: false` explicitly makes the app permanently
      # OutOfSync: false is the zero value, so the API server drops the
      # key and the app-of-apps diffs git (present) vs live (absent).
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
