apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-scale-set
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: ci
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.13.1
    helm:
      releaseName: tesserix-runner
      values: |
        githubConfigUrl: "https://github.com/tesserix"
        githubConfigSecret: "github-app-secret"
        minRunners: 0
        maxRunners: 0
        runnerGroup: "default"

        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-systems

        template:
          spec:
            restartPolicy: Never
            imagePullSecrets:
              - name: ghcr-pull-secret
            initContainers:
              - name: init-dind-externals
                image: "ghcr.io/tesserix/arc-runner:latest"
                command: ["cp"]
                args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - name: dind
                image: docker:dind
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command:
                      - docker
                      - info
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - name: runner
                image: "ghcr.io/tesserix/arc-runner:latest"
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  limits:
                    memory: "8Gi"
                  requests:
                    memory: "512Mi"
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
              - name: work
                emptyDir: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      # prune must be false: ARC creates EphemeralRunnerSets, Roles, RoleBindings,
      # and runner pods dynamically in this namespace. ArgoCD prune deletes them,
      # breaking runner scale-up. selfHeal still ensures the AutoscalingRunnerSet stays in sync.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
