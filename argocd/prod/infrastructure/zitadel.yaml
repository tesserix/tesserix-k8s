apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: identity
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/zitadel
    helm:
      releaseName: zitadel
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  ignoreDifferences:
    # Kubernetes 1.31+ added .status.terminatingReplicas, which the ArgoCD
    # structured-merge OpenAPI schema does not know about; without this every
    # diff fails with 'field not declared in schema' and the app sticks.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
