apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: serverless
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/infrastructure/knative-operator
    helm:
      releaseName: knative-operator
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # The operator-webhook-certs Secret is shipped EMPTY by the chart and filled
  # in by Knative's WebhookCertificates controller (ca-cert.pem,
  # server-cert.pem, server-key.pem), which also rotates it. Without this
  # exception selfHeal would diff the populated secret against the empty one in
  # git and blank the certificates on every sync, breaking the webhook it just
  # fixed.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: operator-webhook-certs
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
