apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
  # These were two separate `annotations:` blocks. YAML keeps only the last
  # occurrence of a duplicate key, so the Kargo authorization was being parsed
  # away entirely and kargo-infra:observability-prod could not promote to this
  # app. Merged into one block; no behaviour is intentionally changed here
  # beyond the Kargo annotation now actually existing.
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:observability-prod"
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 8.15.0
    helm:
      releaseName: grafana
      values: |
        # PARKED 2026-08-01 at 0 for cost — restore to 1 to revive. Dashboards,
        # datasources and the 10Gi PVC are untouched; see docs/observability-park.md.
        replicas: 0

        # Stakater Reloader auto-rolls Grafana whenever a referenced Secret/
        # ConfigMap changes — so a GitHub-OAuth credential rotation in
        # grafana-github-oauth (or a grafana.ini edit) takes effect without a
        # manual restart.
        annotations:
          reloader.stakater.com/auto: "true"
        # One-time declarative restart so the running pod (which started before
        # the grafana-github-oauth secret existed) injects GF_AUTH_GITHUB_*.
        # Bump the date to force a future redeploy if ever needed.
        podAnnotations:
          devai.io/oauth-rollout: "2026-06-13"

        # Resource configuration (required for AKS Azure Policy)
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi

        # Persistence on GKE Standard SSD
        persistence:
          enabled: true
          size: 10Gi
          storageClassName: standard-rwo-retain

        # Admin credentials (use sealed secret in production)
        adminUser: admin
        # adminPassword will be auto-generated if not set

        # Ingress configuration
          # Kong ingress DISABLED 2026-07-26. Kong is decommissioned: there are zero
          # Kong pods and no IngressClass resources in the cluster, so nothing ever
          # populated status.loadBalancer and ArgoCD reported the app Progressing
          # forever. Routing is Istio VirtualService + the shared gateway, the same
          # way observability.tesserix.app works.
        ingress:
          enabled: false
          ingressClassName: kong
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
            konghq.com/protocols: "https"
          hosts:
            - grafana.mark8ly.com
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.mark8ly.com

        # Datasources
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              # Prometheus datasource
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server.monitoring.svc.cluster.local:80
                access: proxy
                isDefault: true
                editable: true

              # DECOMMISSIONED 2026-07-26 — Tempo and Elasticsearch datasources
              # removed with their backends.
              #
              # Traces now live in the replicated ClickHouse and are queried
              # through obs-ui at observability.tesserix.app, which renders the
              # waterfall directly. Logs were never in Elasticsearch at all:
              # fluent-bit had been at zero replicas for weeks, so that
              # datasource pointed at an empty index.
              #
              # Grafana keeps Prometheus and remains the metrics and alerting
              # surface. It is deliberately NOT given a ClickHouse datasource —
              # obs-ui is the query surface for logs, traces and events.

              # Loki datasource (optional, for log aggregation)
              # - name: Loki
              #   type: loki
              #   url: http://loki.logging.svc.cluster.local:3100
              #   access: proxy
              #   editable: true

        # Dashboard providers
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              # Downloaded dashboards from grafana.com
              - name: 'default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                allowUiUpdates: true
                options:
                  path: /var/lib/grafana/dashboards/default
              - name: 'istio'
                orgId: 1
                folder: 'Istio'
                type: file
                disableDeletion: false
                editable: true
                allowUiUpdates: true
                options:
                  path: /var/lib/grafana/dashboards/istio
              - name: 'kubernetes'
                orgId: 1
                folder: 'Kubernetes'
                type: file
                disableDeletion: false
                editable: true
                allowUiUpdates: true
                options:
                  path: /var/lib/grafana/dashboards/kubernetes
              # NOTE: the ConfigMap dashboards (/tmp/dashboards) are handled by
              # the chart's auto sidecarProvider (sidecar.dashboards below). A
              # second manual provider on the SAME path provisioned every
              # dashboard TWICE under one UID ("the same UID is used more than
              # once"), which corrupted permissions and caused "Access denied
              # to this dashboard". Removed — one provider per path.

        # Download dashboards from Grafana.com
        # These will be downloaded and provisioned automatically
        dashboards:
          default:
            # Node Exporter Full - comprehensive node metrics
            node-exporter:
              gnetId: 1860
              revision: 37
              datasource: Prometheus

            # Kubernetes Cluster Monitoring (via Prometheus)
            kubernetes-cluster:
              gnetId: 315
              revision: 3
              datasource: Prometheus

            # Kubernetes cluster monitoring (via Prometheus)
            k8s-views-global:
              gnetId: 15757
              revision: 37
              datasource: Prometheus

            # Kubernetes Views - Pods
            k8s-views-pods:
              gnetId: 15760
              revision: 28
              datasource: Prometheus

            # Kubernetes Views - Namespaces
            k8s-views-namespaces:
              gnetId: 15758
              revision: 34
              datasource: Prometheus

            # Kubernetes Views - Nodes
            k8s-views-nodes:
              gnetId: 15759
              revision: 29
              datasource: Prometheus

            # CoreDNS
            coredns:
              gnetId: 5926
              revision: 1
              datasource: Prometheus

          istio:
            # Istio Mesh Dashboard
            istio-mesh:
              gnetId: 7639
              revision: 194
              datasource: Prometheus

            # Istio Service Dashboard
            istio-service:
              gnetId: 7636
              revision: 194
              datasource: Prometheus

            # Istio Workload Dashboard
            istio-workload:
              gnetId: 7630
              revision: 194
              datasource: Prometheus

            # Istio Control Plane
            istio-control-plane:
              gnetId: 7645
              revision: 194
              datasource: Prometheus

          kubernetes:
            # Kubernetes API Server
            k8s-api-server:
              gnetId: 15761
              revision: 17
              datasource: Prometheus

            # Kubernetes / Compute Resources / Cluster
            k8s-resources-cluster:
              gnetId: 7249
              revision: 1
              datasource: Prometheus

            # Kubernetes / Compute Resources / Namespace (Pods)
            k8s-resources-namespace:
              gnetId: 6879
              revision: 1
              datasource: Prometheus

            # Kubernetes / Compute Resources / Pod
            k8s-resources-pod:
              gnetId: 6781
              revision: 1
              datasource: Prometheus

            # Kubernetes / Networking / Cluster
            k8s-networking-cluster:
              gnetId: 12124
              revision: 1
              datasource: Prometheus

            # NGINX Ingress Controller
            nginx-ingress:
              gnetId: 9614
              revision: 1
              datasource: Prometheus

        # Grafana configuration
        grafana.ini:
          server:
            # Canonical host is grafana.tesserix.app (served via the Istio
            # tesseract-gateway + grafana-vs VirtualService, auth-whitelisted
            # in istio-auth-policies). root_url drives every absolute URL
            # Grafana generates — redirects, OAuth callbacks, share links — so
            # it must match the host users actually reach, not mark8ly.
            domain: grafana.tesserix.app
            root_url: "https://grafana.tesserix.app"
          auth:
            # GitHub SSO only — hide the username/password login form so the
            # sole way in is "Sign in with GitHub" (tesserix org members).
            # The admin account still exists for the API/grafana-cli and the
            # provisioning sidecar (basic auth at the API level is unaffected);
            # only the interactive password login is removed.
            disable_login_form: true
          auth.anonymous:
            enabled: false
          # GitHub OAuth — client_id/secret come from the grafana-github-oauth
          # secret (GF_AUTH_GITHUB_CLIENT_ID/SECRET), synced from GCP Secret
          # Manager by external-secrets/prod/monitoring/grafana-github-oauth.yaml.
          # The callback URL (https://grafana.tesserix.app/login/github) is
          # derived from server.root_url above; it must be registered on the
          # GitHub OAuth App. read:org scope is what lets allowed_organizations
          # verify membership.
          auth.github:
            enabled: true
            allow_sign_up: true
            auto_login: false
            scopes: user:email,read:org
            auth_url: https://github.com/login/oauth/authorize
            token_url: https://github.com/login/oauth/access_token
            api_url: https://api.github.com/user
            # Only tesserix org members may sign in.
            allowed_organizations: tesserix
          security:
            admin_user: admin
          users:
            allow_sign_up: true
          log:
            mode: console
            level: info
          analytics:
            check_for_updates: false
            reporting_enabled: false

        # Environment variables for GitHub OAuth (from secret)
        # Note: Create a sealed secret with GH_AUTH_GITHUB_CLIENT_ID and GH_AUTH_GITHUB_CLIENT_SECRET
        envFromSecrets:
          - name: grafana-github-oauth
            optional: true

        # Sidecar for dashboard provisioning from ConfigMaps
        sidecar:
          # Resources for all sidecar containers
          resources:
            limits:
              memory: 100Mi
            requests:
              memory: 50Mi
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            # Use /tmp/dashboards to avoid shadowing downloaded dashboards
            folder: /tmp/dashboards
            searchNamespace: ALL
            # The single provider for all ConfigMap dashboards. A named folder
            # groups DevAI/mark8ly/fe3dr together so they're easy to find;
            # default org permissions on the folder let any logged-in user
            # (Viewer) open them.
            provider:
              folder: "Tesserix Apps"
              allowUiUpdates: true
          datasources:
            enabled: true
            label: grafana_datasource
            labelValue: "1"
            searchNamespace: ALL

        # Init container resources (required by AKS Azure Policy)
        initChownData:
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 32Mi

        # Download dashboards init container resources
        downloadDashboardsImage:
          pullPolicy: IfNotPresent
        downloadDashboards:
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi

        # Service account
        serviceAccount:
          create: true
          name: grafana

        # Pod security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          runAsGroup: 472
          fsGroup: 472

        # Container security context
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false

        # Plugins to install (removed deprecated angular plugins)
        plugins:
          - grafana-clock-panel
          - grafana-polystat-panel
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # The grafana PVC predates GitOps adoption; PVC spec fields are
  # immutable, so the rendered diff can never converge. Ignore it.
  ignoreDifferences:
    - kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
  syncPolicy:
    automated:
      # prune: true is required for this app to ever converge. With only
      # selfHeal, a resource deleted from the chart stays in the cluster
      # forever and the app is pinned OutOfSync -- which is what kept the
      # decommissioned Kong Ingress alive and the app amber.
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
