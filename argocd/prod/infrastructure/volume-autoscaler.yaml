apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volume-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tesserix-prod
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: main
    path: charts/apps/volume-autoscaler
  destination:
    server: https://kubernetes.default.svc
    namespace: volume-autoscaler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
