---
# ArgoCD self-management — operator-managed (migrated 2026-07-21).
#
# This Application NO LONGER installs the argo-helm `argo-cd` chart. Argo CD
# now runs under the argoproj-labs **argocd-operator v0.18.0** (Argo CD
# v3.3.10), configured by the `ArgoCD` CR in `charts/argocd-operator/`. This
# app GitOps-manages that CR only, so Argo CD is self-managed. The operator
# itself is bootstrapped manually (kustomize) — see:
#   docs/superpowers/plans/2026-07-21-argocd-operator-migration.md
#
# prune stays false: ArgoCD must never delete parts of itself mid-sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/argocd-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The operator owns/reconciles all rendered workloads; Argo only ensures
  # the CR matches Git. Ignore operator-injected spec defaults so the app
  # stays Synced rather than flapping on fields the operator fills in.
  ignoreDifferences:
    - group: argoproj.io
      kind: ArgoCD
      name: argocd
      jsonPointers:
        - /spec/controller/resources
        - /spec/repo/resources
        - /spec/server/resources
        - /spec/redis/resources
        - /spec/ha/resources
  syncPolicy:
    automated:
      prune: false
      selfHeal: false  # manual: self-referential app, avoid auto-sync fighting the operator
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
