# =============================================================================
# subscription-observability — ArgoCD Application
# =============================================================================
# Deploys the PrometheusRule, AlertmanagerConfig, and Grafana dashboard
# ConfigMap that make up the P17 observability slice for mark8ly
# marketplace-api.
#
# Source layout (tesserix-k8s):
#   k8s/cluster/prometheus/rules/          — PrometheusRule CR + kustomization
#   k8s/cluster/alertmanager/              — AlertmanagerConfig + kustomization
#   k8s/cluster/grafana/dashboards/        — kustomization using configMapGenerator
#   grafana/dashboards/*.json              — the dashboards themselves
#
# This Application points at a parent kustomization that aggregates all three.
# Requires monitoring.coreos.com CRDs (installed by prometheus-operator-crds,
# sync-wave -1). AlertmanagerConfig/PrometheusRule CRDs come from the same
# chart.
#
# NOTE: prod prometheus/grafana Helm apps are currently commented out in
# argocd/prod/infrastructure/kustomization.yaml. This manifest is still
# checked in so the CRs are GitOps-ready for when the stack is re-enabled.
# To activate, add `- subscription-observability.yaml` to that kustomization.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: subscription-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
    product: mark8ly
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: k8s/cluster/observability
    kustomize:
      # This bundle no longer includes the Grafana dashboards, so it needs no
      # loosened load restriction and builds under the default restrictor.
      commonAnnotations:
        mark8ly/observability-slice: "p17"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # NOTE: `LoadRestrictionsNone=true` used to sit here. It never did
      # anything — ArgoCD's syncOptions has no such option, and the kustomize
      # load restrictor comes from `kustomize.buildOptions` in `argocd-cm`,
      # which is empty on this cluster. The first sync after this Application
      # was actually listed failed with a ComparisonError proving it
      # (2026-09-04). The path it was meant to enable is no longer part of
      # this bundle; see k8s/cluster/observability/kustomization.yaml.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
