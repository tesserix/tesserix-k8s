apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentregistry
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-catalog
  annotations:
    # First in the agentic control-plane sync chain. agentgateway and
    # kagent both read from this catalog.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    # Upstream OCI Helm chart from the agentregistry-dev maintainers.
    # Replaces the hand-rolled wrapper that lived at
    # charts/thirdparty/agentregistry/ — the upstream chart knows the
    # binary's config-file format, vector-store init, and entrypoint.
    repoURL: ghcr.io/agentregistry-dev/agentregistry/charts
    chart: agentregistry
    targetRevision: "0.3.3"
    helm:
      releaseName: agentregistry
      values: |
        namespaceOverride: agentregistry-system
        # JWT signing key — points the chart at our existing
        # aregistry-jwt Secret (mirrored from GCP SM via
        # external-secrets/prod/agentregistry-system/). Value must be
        # hex-encoded (chart parses with encoding/hex).
        #
        # enableAnonymousAuth: catalog writers (devai-registry-bootstrap
        # Job and the DevAI Python registry client) live entirely
        # in-cluster and are already gated by NetworkPolicies +
        # Istio AuthorizationPolicies (devai NS only). The aregistry
        # signed-token flow (POST /v0/auth/{http,github-at,github-oidc})
        # is heavyweight for a private single-tenant deployment.
        # Anonymous auth lets us POST seeds + GET catalogue items
        # without minting a registry-format JWT, and the mesh policies
        # still deny anyone outside the allowed namespaces.
        # Pin the server image to the chart's appVersion. Upstream
        # chart 0.3.3 ships with image.tag defaulted to "0.2.1" in
        # values.yaml even though appVersion is "0.3.3" — we override
        # explicitly so the running binary matches the chart version
        # and benefits from the latest bug fixes / API additions.
        # See https://github.com/agentregistry-dev/agentregistry/releases/tag/v0.3.3
        image:
          tag: "0.3.3"
        config:
          existingSecret: aregistry-jwt
          enableAnonymousAuth: "true"
        # Postgres backend — schema migration 001 runs
        # `CREATE EXTENSION vector`, so the bundled DB MUST be a
        # pgvector-capable image. Default postgres:18 (without
        # pgvector) fails with "extension vector is not available".
        # Swap to the pgvector/pgvector image which is postgres + the
        # extension pre-installed.
        database:
          postgres:
            vectorEnabled: true
            bundled:
              enabled: true
              image:
                registry: docker.io
                repository: pgvector
                name: pgvector
                tag: "pg18"
  destination:
    server: https://kubernetes.default.svc
    namespace: agentregistry-system
  ignoreDifferences:
    # K8s 1.36+ surfaces .status.terminatingReplicas which ArgoCD's
    # structured-merge-diff doesn't yet recognize.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true   # purge stale resources from the previous wrapper chart
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
