apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-blog-backup
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    app.kubernetes.io/component: backup
    target-namespace: db-backup-and-restore
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: data
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/mongodb-backup
    targetRevision: HEAD
    helm:
      releaseName: mongodb-blog-backup
      values: |
        backup:
          enabled: true
          staged:
            enabled: true
            dumpImage: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/mongo@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
            uploadImage: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/global-services/db-backup-tools@sha256:40e590e08155b0b73da591d45d06d3628557073a2e583d5ecb52850bc625af4d
            scratchSize: 2Gi
          # Twice daily: 00:00 and 12:00 UTC
          schedule: "0 0,12 * * *"

          # Database connection
          database:
            host: mongodb-blog.mongodb-blog.svc.cluster.local
            port: 27017
            authDatabase: admin
            user: admin
            authEnabled: true
            passwordSecretName: mongodb-blog-password
            passwordSecretKey: mongodb-password

          # Backup settings - backup ALL databases
          settings:
            allDatabases: true
            excludeDatabases:
              - admin
              - local
              - config

          # GCS Configuration
          gcs:
            bucket: tesseract-database-backups
            prefix: prod/mongodb-blog

        # Network Policy - disabled
        networkPolicy:
          enabled: false

        # Istio - disable mTLS since backup pods don't have sidecars
        istio:
          disableMtls: true

        # Restore the existing Workload Identity principal for backup jobs.
        serviceAccount:
          create: true
          name: postgres-backup
          annotations:
            iam.gke.io/gcp-service-account: postgres-backup-sa@tesseracthub-480811.iam.gserviceaccount.com

        # Resources for backup job
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: db-backup-and-restore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
