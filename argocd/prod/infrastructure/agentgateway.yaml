apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-data-plane
  annotations:
    # Lands after aregistry (-5) so the gateway's first catalog poll
    # finds a healthy backend.
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    # Upstream OCI Helm chart. Track the latest STABLE tag (not
    # *-alpha / *-beta) — alphas land breaking xDS schema changes and
    # we want a predictable rolling-deploy story.
    # NOTE: v1.2.1 was never published to this OCI registry — the only stable
    # tag is v1.0.1 (everything else is 0.0.0-alpha.*). Pinning to the
    # non-existent v1.2.1 left this Application stuck in Unknown/ComparisonError
    # with the data plane frozen. Verify before bumping:
    #   helm show chart oci://ghcr.io/agentgateway/agentgateway/charts/agentgateway --version <tag>
    # https://github.com/agentgateway/agentgateway/releases
    repoURL: ghcr.io/agentgateway/agentgateway/charts
    chart: agentgateway
    targetRevision: v1.0.1
    helm:
      releaseName: agentgateway
      values: |
        namespaceOverride: agentgateway-system
        replicaCount: 1
        # DevAI dispatches LLM calls through its own adapter family
        # (src/devai/adapters/llm/), so provider backend routing is
        # off here. Leave the gateway running for MCP / A2A; enable
        # provider backends via upstream values later if we want them
        # on the path.
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true   # purge stale resources from the previous wrapper chart
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
