apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
    # Lands after aregistry (-5) so the gateway's first catalog poll
    # finds a healthy backend.
    argocd.argoproj.io/sync-wave: "-4"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-data-plane
spec:
  project: default
  source:
    # Stable v1.4.1 chart published by the Agent Gateway project. The registry
    # moved from GHCR to cr.agentgateway.dev after v1.0.1.
    repoURL: cr.agentgateway.dev/charts
    chart: agentgateway
    targetRevision: 1.4.1
    helm:
      releaseName: agentgateway
      values: |
        resources:
          requests:
            # The upstream chart renders null as an invalid resource quantity;
            # zero clears its 100m default without imposing a CPU request.
            cpu: 0
            memory: 128Mi
          limits:
            memory: 512Mi
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        controller:
          replicaCount: 2
          # Ambient mTLS encrypts xDS; application TLS is misclassified by the waypoint.
          xds:
            mode: plaintext
          podDisruptionBudget:
            minAvailable: 1
        monitoring:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true   # purge stale resources from the previous wrapper chart
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
