apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-fanzone
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesseract-fanzone
    app.kubernetes.io/component: database
    target-namespace: fanzone
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: data
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/postgresql
    targetRevision: HEAD
    helm:
      releaseName: postgresql
      values: |
        # PostgreSQL for FanZone
        postgresql:
          database: fanzone_db
          username: postgres
          existingSecret: "postgresql-password"
          existingSecretKey: "postgresql-password"

        architecture: standalone

        # Storage - 60Gi (downsized from 650Gi — only ~133 MB actual data)
        # StorageClass standard-rwo supports online volume expansion
        persistence:
          enabled: true
          storageClass: "standard-rwo-retain"
          size: 60Gi

        # Resources
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 4Gi

        # Tuning
        config:
          maxConnections: "1000"
          sharedBuffers: "512MB"
          effectiveCacheSize: "2GB"
          maintenanceWorkMem: "256MB"
          walBuffers: "16MB"

        service:
          type: ClusterIP
          port: 5432

        # Internal LoadBalancer for Cloud Run VPC connector access
        ilb:
          enabled: true

        metrics:
          enabled: true
          serviceMonitor:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql-fanzone
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
