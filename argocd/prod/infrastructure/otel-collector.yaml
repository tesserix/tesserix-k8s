apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: monitoring
  annotations:
    # Wave 0 — alongside Prometheus. The collector exports to Prometheus, but
    # there's no hard ordering dependency: Prometheus discovers the collector
    # pod via the kubernetes-pods annotation job whenever it comes up.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/otel-collector
    targetRevision: HEAD
    helm:
      releaseName: otel-collector
      # Inline values override chart defaults (the redis-global pattern). Prod
      # sizing only — the OTLP/Prometheus wiring lives in the chart.
      values: |
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
