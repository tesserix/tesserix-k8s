apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: typesense
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: search
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/typesense
    targetRevision: HEAD
    helm:
      releaseName: typesense
      values: |
        # Typesense configuration for production environment
        replicaCount: 1

        image:
          repository: typesense/typesense
          tag: "27.1"
          pullPolicy: IfNotPresent

        # Service configuration
        service:
          type: ClusterIP
          port: 8108

        # Resource configuration for devtest
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi

        # Liveness probe relaxed: typesense intermittently stops answering
        # /health under load/compaction and was liveness-killed every few
        # minutes (1097 restarts in ~3 days). Give it more grace before restart.
        healthCheck:
          enabled: true
          path: /health
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6

        # Typesense configuration
        config:
          dataDir: /data
          apiPort: 8108
          peeringPort: 8107
          enableCors: true
          corsDomains: "https://admin.mark8ly.com,https://marketplace.mark8ly.com,https://api.mark8ly.com"
          logLevel: 3

        # Secret reference
        secrets:
          apiKeySecretName: "typesense-secrets"
          apiKeySecretKey: "api-key"

        # Persistence
        persistence:
          enabled: true
          size: 10Gi
          # MUST match the live PVC's class. storageClassName is immutable
          # after creation, so declaring standard-rwo-retain against an
          # existing standard-rwo volume made ArgoCD retry a forbidden
          # replace on a loop:
          #   PersistentVolumeClaim "typesense-data" is invalid: spec:
          #   Forbidden: spec is immutable after creation except
          #   resources.requests
          # The retain INTENT is preserved by setting the reclaim policy on
          # the bound PV instead, which is mutable. Changing this value can
          # only take effect by deleting and recreating the volume.
          storageClassName: standard-rwo

  destination:
    server: https://kubernetes.default.svc
    namespace: typesense
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
