apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: ci
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.13.1
    helm:
      releaseName: arc
      values: |
        replicaCount: 0
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      # prune must be false: ARC controller creates dynamic resources (listener pods,
      # config secrets, ServiceAccounts) in this namespace. ArgoCD prune deletes them,
      # causing listener crash-loops. selfHeal still ensures Helm-managed resources stay in sync.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
