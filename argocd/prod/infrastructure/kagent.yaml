apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-controller
  annotations:
    # Lands after aregistry (-5) and agentgateway (-4) — kagent reconciles
    # Agent CRs via the catalog and dispatches via the gateway.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    # Upstream OCI Helm chart. Bundles its own Postgres StatefulSet
    # (kagent-postgresql) for schema migrations + vector store — which
    # is why the hand-rolled controller-only Deployment crash-looped
    # on missing DB.
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: 0.9.12
    helm:
      releaseName: kagent
      values: |
        namespaceOverride: kagent-system
        controller:
          replicas: 1
          # Bump memory limit — first-boot migrations + vector store
          # init OOM at 512Mi (controller exits with 137). The chart's
          # startupProbe (periodSeconds 15, initialDelaySeconds 15) is
          # hardcoded in templates/controller-deployment.yaml and isn't
          # overridable via values; making sure the container has
          # enough memory to finish initialization within that window
          # is the only knob we have here.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          # Agent Substrate (gVisor WorkerPool + Actor) — agents labelled for
          # Substrate run as gVisor Actors in the shared WorkerPool, not a
          # Deployment per agent. Endpoints match the ate-system services
          # (api:443, atenet-router:80). Needs the sandbox-gvisor node pool.
          substrate:
            enabled: true
            defaultWorkerPool:
              namespace: kagent-system
              name: kagent-default
            ateApiEndpoint: "dns:///api.ate-system.svc:443"
            ateApiInsecure: true
            atenetRouterURL: "http://atenet-router.ate-system.svc:80"
            ateApiTokenFile: "/var/run/secrets/tokens/ate-api/token"
        # The shared WorkerPool the controller schedules Actors onto. One gVisor
        # worker (replicas: 1) multiplexes all Actors — not a node per agent. Its
        # pod runs under runtimeClassName=gvisor → lands on sandbox-gvisor (which
        # autoscales 0->1 on demand).
        substrateWorkerPool:
          create: true
          name: kagent-default
          replicas: 1
          ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.6
        # The bundled Postgres provisions a PVC for the vector store.
        # standard-rwo is the default storage class on this GKE cluster.
        postgresql:
          enabled: true
          persistence:
            enabled: true
            size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent-system
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
