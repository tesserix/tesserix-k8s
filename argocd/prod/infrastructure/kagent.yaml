apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-controller
  annotations:
    # Last in the agentic control-plane chain. Comes up only after
    # aregistry (-5) and agentgateway (-4) are healthy, since every
    # Agent CR it reconciles ultimately calls the gateway.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/thirdparty/kagent
    helm:
      releaseName: kagent
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent-system  ignoreDifferences:
    # K8s 1.36+ surfaces .status.terminatingReplicas which ArgoCD's
    # structured-merge-diff doesn't yet recognize. Ignoring it on
    # Deployments unblocks sync without losing any real coverage.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
