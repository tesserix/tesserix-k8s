apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agent-controller
  annotations:
    # Lands after aregistry (-5) and agentgateway (-4) — kagent reconciles
    # Agent CRs via the catalog and dispatches via the gateway.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    # Upstream OCI Helm chart. Bundles its own Postgres StatefulSet
    # (kagent-postgresql) for schema migrations + vector store — which
    # is why the hand-rolled controller-only Deployment crash-looped
    # on missing DB.
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: "0.9.4"
    helm:
      releaseName: kagent
      values: |
        namespaceOverride: kagent-system
        controller:
          replicas: 1
          # First-boot DB migrations against the bundled Postgres take
          # longer than the upstream default startup probe (30s).
          # Without this override, K8s SIGKILLs the pod mid-migration
          # (exit 137 in container status).
          startupProbe:
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 5
            failureThreshold: 60   # 60 * 5s = 5min for migrations
          resources:
            requests:
              memory: 256Mi
            limits:
              # 512Mi was too tight — migrations + vector init OOMKilled.
              memory: 1Gi
        # The bundled Postgres provisions a PVC for the vector store.
        # standard-rwo is the default storage class on this GKE cluster.
        postgresql:
          enabled: true
          persistence:
            enabled: true
            size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent-system
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
