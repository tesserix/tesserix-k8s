apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    # Ahead of the chart: the masterkey, the DB password and the login client
    # keypair are all mounted by the chart's PreSync Jobs, which run before
    # any wave inside that Application.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: identity
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: external-secrets/prod/zitadel
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
