apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocr-public-sandbox
  namespace: argocd
  labels: {app.kubernetes.io/part-of: document-intelligence, environment: prod}
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/ocr-public-sandbox
    helm:
      releaseName: ocr-public-sandbox
  destination: {server: https://kubernetes.default.svc, namespace: document-intelligence}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 8, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
