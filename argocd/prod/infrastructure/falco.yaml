apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: runtime-security
  annotations:
    # After external-secrets-resources (wave 0) — falcosidekick reads its
    # Slack webhook from the ESO-managed `falcosidekick-secrets` Secret.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0
    helm:
      releaseName: falco
      values: |
        # CO-RE eBPF probe — the only driver that works on COS node kernels;
        # no module build or download at pod start.
        driver:
          kind: modern_ebpf

        # DaemonSet on every node; memory-only resources (cluster rule).
        # 256Mi request: the optimize-utilization scheduler packs nodes too
        # tightly for 512Mi headroom on every node, and DaemonSet pods
        # cannot trigger node scale-up. Typical modern_ebpf RSS is well
        # under this; the 1Gi limit still bounds it.
        resources:
          requests:
            cpu: null
            memory: 256Mi
          limits:
            cpu: null
            memory: 1Gi

        # The small-support nodes run ~99% memory-requested (one is also out
        # of pod slots), and DaemonSet pods cannot trigger node scale-up — two
        # falco pods sat Pending for hours. This class (900000) lets the
        # scheduler preempt a priority-0 workload pod, which then reschedules
        # or scales a node up itself. Runtime security must cover every node.
        podPriorityClassName: tesserix-platform-critical

        # Rule exceptions for known-legitimate workload behaviour.
        customRules:
          tesserix-exceptions.yaml: |-
            # Postiz boots by running Prisma's schema/query engines that pnpm
            # dlx unpacks into the writable layer — upstream image behaviour
            # (v2.21.x), not an intrusion. Fired Critical on every pod start.
            - rule: Drop and execute new binary in container
              exceptions:
                - name: postiz_prisma_engines
                  fields: [k8s.ns.name, proc.exepath]
                  comps: ["=", contains]
                  values:
                    - [postiz, "@prisma/engines"]
              override:
                exceptions: append

        # Event fan-out to Slack. Slack webhook comes from the ESO-managed
        # Secret (SLACK_WEBHOOKURL key) — never a value in this file.
        falcosidekick:
          enabled: true
          replicaCount: 2
          # No `cpu: null` here — the subchart default is `resources: {}`, so a
          # literal null would render into the manifest instead of cancelling.
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
          config:
            existingSecret: falcosidekick-secrets
            slack:
              # warning+ only — notice-level rules (e.g. Contact K8S API
              # Server From Container) fire for every legitimate controller
              # and flooded the channel; they remain in the pod logs.
              minimumpriority: warning
            # warning+ in the events UI too — same reasoning as slack. The
            # chart has no config.webui.minimumpriority key (it wires the
            # webui output itself), so this reaches the binary as env.
            extraEnv:
              - name: WEBUI_MINIMUMPRIORITY
                value: warning

          # Events UI at falco.tesserix.app — auth is enforced by the
          # oauth2-proxy in front (falco-ui-gateway chart, Zitadel OIDC),
          # so the UI's own basic auth is off. Redis is the bundled
          # redis-stack (RediSearch required — Valkey won't do); no PVC,
          # Slack + logs are the durable record.
          webui:
            enabled: true
            disableauth: true
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 128Mi
            redis:
              enabled: true
              storageEnabled: false
              resources:
                requests:
                  memory: 128Mi
                limits:
                  memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
