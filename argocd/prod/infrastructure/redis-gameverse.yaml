apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-gameverse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesseract-gameverse
    app.kubernetes.io/component: cache
    target-namespace: gameverse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: data
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/redis
    targetRevision: HEAD
    helm:
      releaseName: redis
      values: |
        # Redis for GameVerse
        auth:
          enabled: true
          password: "password"

        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 1Gi

        persistence:
          enabled: true
          storageClass: standard-rwo-retain
          size: 4Gi

        service:
          type: ClusterIP
          port: 6379

  destination:
    server: https://kubernetes.default.svc
    namespace: redis-gameverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
