apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: growthbook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: feature-flags
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/growthbook
    targetRevision: HEAD
    helm:
      releaseName: growthbook
      values: |
        replicaCount: 1
        image:
          repository: growthbook/growthbook
          tag: latest
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          appPort: 3000
          apiPort: 3100
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        config:
          nodeEnv: production
          appOrigin: https://growthbook.mark8ly.com
          apiHost: https://growthbook.mark8ly.com:443
          uploadMethod: local
          disableTelemetry: true
          enableOpenFeature: true
        secrets:
          jwtSecretName: growthbook-secrets
          jwtSecretKey: jwt-secret
          encryptionKeySecretName: growthbook-secrets
          encryptionKeyKey: encryption-key
        mongodb:
          enabled: true
          image:
            repository: mongo
            tag: '7.0'
          auth:
            enabled: false
          persistence:
            enabled: true
            size: 20Gi
            storageClassName: economy-rwo-retain
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        persistence:
          enabled: true
          size: 10Gi
          storageClassName: economy-rwo
        extraEnv:
        - name: ALLOW_SELF_ORG_CREATION
          value: 'true'
        - name: IS_MULTI_ORG
          value: 'false'
        - name: IS_CLOUD
          value: 'false'
        - name: AUTH_TYPE
          value: local
        - name: ALLOW_UNAUTHENTICATED_API
          value: 'true'
        featureSeeding:
          enabled: true
          environment: prod
          organizationName: Tesserix
          sdkConnectionName: Tesserix Platform
          sdkEnvironment: production
          adminEmail: admin@mark8ly.com
          adminName: Tesserix Admin
          createAdminSecret: false
          adminPasswordSecret:
            name: growthbook-admin-secret
            key: password
          image:
            repository: curlimages/curl
            tag: 8.5.0
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
        storageMigrationPhase: ''

  destination:
    server: https://kubernetes.default.svc
    namespace: growthbook
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
