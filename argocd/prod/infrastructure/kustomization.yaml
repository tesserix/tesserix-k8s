apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production Infrastructure - Full production environment
# All components enabled with production-grade configuration
resources:
  # Storage Classes (Retain policy for stateful workloads)
  - infra-postgres.yaml
  - storage-classes.yaml

  # Namespace Protection (prevent deletion of database/cache/messaging namespaces)
  - namespace-protection.yaml

  # Certificate Management
  - cert-manager.yaml
  - cert-manager-issuers.yaml

  # External Secrets Operator - Syncs secrets from GCP Secret Manager
  - argocd.yaml
  - external-secrets.yaml
  - atlantis.yaml
  # External Secrets Resources - Creates all secrets from GCP Secret Manager
  - external-secrets-resources.yaml
  - temporal-platform-resources.yaml
  - temporal-platform.yaml
  # Reloader - restarts Deployments when their Secrets/ConfigMaps change.
  # Closes the gap where external-secrets rotates a Secret in place (e.g.
  # the aregistry JWT key from GCP SM) but Pods consuming it via env vars
  # keep using the stale value until something else recycles them.
  - reloader.yaml

  # DNS Management
  - external-dns.yaml
  - external-dns-agentregistry-publisher.yaml

  # Cloudflare Tunnel (for secure ingress)
  - cloudflared.yaml
  # Cloudflare Tunnel for FanZone (separate CF account/domain)
  # DECOMMISSIONED 2026-07-23 — file retained, uncomment to redeploy.
  # - cloudflared-fanzone.yaml
  # Cloudflare Tunnel for HomeChef (fe3dr.com)
  - cloudflared-homechef.yaml
  # Cloudflare Tunnel for Helivanta (helivanta.app)
  - cloudflared-helivanta.yaml
  # Cloudflare Tunnel for GameVerse (stayandplays.com)

  # Service Mesh (Istio)
  - istio-base.yaml
  - istio-cni.yaml
  - istio-ztunnel.yaml
  - istio-istiod.yaml
  # External gateway (public IP for custom domains)
  - istio-ingress-gateway.yaml
  # Custom domain dedicated gateway
  - custom-ingress-gateway.yaml
  - custom-domain-config.yaml
  # HomeChef dedicated gateway — isolates fe3dr.com from the shared
  # istio-ingressgateway so the legacy RequestAuthentication
  # policies (still required by Fanzone) don't reject GIP-issued
  # mobile session tokens.
  - homechef-ingress-gateway.yaml
  # Zitadel dedicated gateway — the same RequestAuthentication policies reject
  # Zitadel's opaque console tokens and PATs before they reach the API.
  - zitadel-ingress-gateway.yaml
  # Internal gateway (private IP for Cloudflare Tunnel - mark8ly.com)
  - istio-ingress-gateway-internal.yaml
  - istio-egress-gateway.yaml
  - istio-config.yaml
  - istio-auth-policies.yaml
  - kiali.yaml

  # Barman Cloud plugin — CNPG 1.30 moved backups out of the operator and into
  # this plugin, which owns the ObjectStore CRD every new cluster references.
  - cnpg-barman-plugin.yaml

  # Database — All products use CloudNativePG (CNPG) clusters deployed via
  # per-product app-of-apps (e.g., homechef-postgres in homechef app-of-apps).
  # Legacy standalone postgresql-* StatefulSets and backup CronJobs removed.
  # See docs/cnpg-migration-guide.md for details.

  # Database Backups - Automated MongoDB backups to GCS (db-backup-and-restore namespace)
  - mongodb-blog-backup.yaml
  # DECOMMISSIONED 2026-07-23 — file retained, uncomment to redeploy.
  # - mongodb-fanzone-backup.yaml


  # Zitadel — identity platform evaluation. Runs
  # alongside both realms until every product has moved; see docs/zitadel.md.
  - zitadel-secrets.yaml
  - zitadel-postgres.yaml
  - zitadel.yaml
  # Reconciles branding, login policy and the admin list from git — these were
  # console-only settings and drifted silently. See docs/zitadel.md.
  - zitadel-bootstrap.yaml
  - zitadel-operator.yaml
  - analytics-onboarding-operator.yaml
  - evals-onboarding-operator.yaml
  - document-intelligence-platform.yaml

  # MongoDB - FanZone chat message persistence
  # DECOMMISSIONED 2026-07-23 — file retained, uncomment to redeploy.
  # - mongodb-fanzone.yaml

  # Caching now lives in argocd/prod/apps/global — the per-namespace Redis
  # instances were removed 2026-08-15 once every consumer was on
  # global-valkey-cache.

  # Messaging (NATS)
  - nats.yaml

  # Monitoring Stack (disabled - using GCP native monitoring or re-enable when needed)
  - prometheus-operator-crds.yaml
  - prometheus.yaml
  - grafana.yaml

  # otel-collector (single-node) — DECOMMISSIONED 2026-07-26. Superseded by
  # the otel-gateway -> Redpanda -> otel-ingest pipeline. All 11 app charts
  # were cut over first and this collector received nothing for hours before
  # removal.

  # clickhouse-otel (single-node, 20Gi) — DECOMMISSIONED 2026-07-26.
  # It had been 100% full since 2026-06-30, silently dropping every trace and
  # metric write with 'Cannot reserve 1.00 MiB, not enough space' for 26 days.
  # Replaced by the replicated clickhouse-ha (100Gi x 2) with TTL retention.
  # Its PVC is on a Retain class, so the PV must be deleted by hand.

  # Grafana Tempo — DECOMMISSIONED 2026-07-26. Manifest deleted; restore from
  # git history if it is ever needed. An orphaned-but-retained file trips the
  # ArgoCD validator, which is right to flag it: an unregistered manifest is
  # indistinguishable from one someone forgot to register.
  #
  # ClickHouse is now the single trace store, queried through obs-ui. Unwired
  # in two places at the same time, both of which matter:
  #   - charts/thirdparty/otel-collector/values.yaml  tempo.enabled=false,
  #     otlp/tempo dropped from tracesExporters. Left enabled, the collector
  #     would retry every span against a dead endpoint and eventually push
  #     backpressure onto its receivers.
  #   - argocd/prod/infrastructure/grafana.yaml       Tempo datasource removed.
  #
  # Its PVC (observability/storage-tempo-0, 10Gi) is on a Retain storage class,
  # so the PV survives as Released and must be deleted by hand to actually
  # reclaim the disk. That is deliberate: the trace history outlives the app
  # until someone confirms it is not needed.

  # --- Observability platform -------------------------------------------
  # Replicated telemetry pipeline replacing the single-node otel-collector +
  # clickhouse-otel pair above. Everything below runs on the tainted Spot node
  # pool (workload=observability) EXCEPT clickhouse-keeper, which stays on
  # on-demand nodes so a preemption can never cost the Raft quorum.
  #
  # Flow: apps → otel-gateway → Redpanda → otel-ingest → ClickHouse
  # Sync waves order it storage-first: keeper (-2), storage+buffer (-1),
  # consumer (0), then the public OTLP endpoint (1).
  #
  # These are ADDITIVE. Applications keep pointing at the old otel-collector
  # until they are cut over one at a time, so this can be rolled back by
  # removing these six lines.
  - clickhouse-keeper.yaml
  - clickhouse-ha.yaml
  - redpanda.yaml
  - otel-ingest.yaml
  - otel-gateway.yaml
  # Creates the otel database, the read-only user obs-api authenticates as, and
  # reconciles retention on tables the exporter has already created.
  - observability-db-schema-bootstrap.yaml
  # Collection tier. otel-agent is a DaemonSet on EVERY node (blanket taint
  # toleration) tailing /var/log/pods — this is what makes logs exist at all;
  # otel_logs has held zero rows since fluent-bit was scaled to zero.
  # otel-cluster is a singleton for Kubernetes events (90d, vs the ~1h etcd
  # keeps them) and Prometheus metrics scraped at 60s for long-term history.
  - otel-agent.yaml
  - otel-cluster.yaml
  # Query API behind Google sign-in, restricted to an explicit three-address
  # allowlist. Connects to ClickHouse as the read-only `observer` user.
  # Needs a manual OAuth client first — docs/observability-oauth-setup.md.
  - obs-api.yaml
  # The explorer UI, and the routing that splits observability.tesserix.app
  # between them: / to the UI, /api and /auth straight to obs-api. The split
  # happens at the gateway rather than through a Next.js rewrite because a
  # rewrite buffers SSE and freezes the live log tail.
  - obs-ui.yaml
  - observability-istio.yaml
  # Trace detail only; DevAI Analytics remains the global quality UI.
  - langfuse.yaml

  # Grafana dashboard ConfigMaps — DevAI, mark8ly, fe3dr (HomeChef) and the
  # mark8ly subscription set, loaded by the Grafana sidecar.
  - grafana-dashboards.yaml

  # Cost Monitoring (OpenCost + OAuth2 Proxy with Google SSO)
  - opencost.yaml

  # Autoscaling (KEDA)
  - keda.yaml

  # Runtime security (Falco + Falcosidekick → Slack)
  - falco.yaml
  - falco-ui-gateway.yaml

  # Serverless (Knative) — DECOMMISSIONED 2026-08-15. Manifests and charts
  # deleted; zero Knative Services, Brokers or Triggers existed cluster-wide.

  # Logging stack — DECOMMISSIONED 2026-07-26. Manifests deleted; restore from
  # git history if ever needed.
  #
  # All three had been at zero replicas for months and their PVCs were already
  # reclaimed, so nothing was collecting logs anywhere in the cluster — which
  # is why otel_logs held zero rows. Log collection is now the otel-agent
  # DaemonSet writing to ClickHouse.
  #
  # The Elasticsearch datasource has been removed from grafana.yaml; it pointed
  # at an empty index.

  # Feature Flags (GrowthBook)
  - growthbook.yaml

  # Web Analytics (OpenPanel) — registered so the hand-applied Application that
  # kept running through the 2026-08-01 "removal" is finally owned by GitOps.
  - openpanel.yaml

  # Search Engine (Typesense)
  - typesense.yaml

  # OSRM (Open Source Routing Machine) — removed with marketplace
  # - osrm.yaml

  # Translation Infrastructure (LibreTranslate)
  - libretranslate.yaml

  # Release / Promotion Tooling (Kargo control plane)
  # GitHub SSO via built-in Dex; admin allowlist managed inline in kargo.yaml.
  - kargo.yaml

  # GitHub Actions Runner Controller (ARC) — DECOMMISSIONED 2026-08-15. The
  # runner scale set went on 2026-07-26 and the controller had nothing left to
  # reconcile; every workflow runs on GitHub-hosted runners.

  # API Documentation (disabled in prod for security)
  # - swagger-ui.yaml

  # Agentic control planes — sourced from upstream OCI Helm charts.
  # Order:
  #   Gateway API (-7), project CRDs (-6) ── kagent + agentgateway CRDs
  #   agentgateway (wave -4) ── data plane; reads the catalog
  #   kagent (wave -3)      ── runtime; reconciles Agent CRs into Deployments
  #
  # The agent catalog (aregistry, wave -5) is no longer the third-party
  # agentregistry-dev deployment — it is now our own agentic-registry, synced
  # from argocd/prod/apps/ai-apps/agentic-registry.yaml into the same
  # agentregistry-system namespace (Service agentregistry:12121). The former
  # `agentregistry.yaml` infra app has been removed so ArgoCD prunes the
  # upstream Deployment + its bundled Postgres.
  - gateway-api-crds.yaml
  - kagent-crds.yaml
  - agentgateway-crds.yaml
  - agentgateway.yaml
  - kagent.yaml
  # Agent Substrate (gVisor WorkerPool + Actor model). CRDs (-6) before the
  # controller (-5) before kagent enables substrate (-3). Needs the sandbox-gvisor
  # node pool. See devai/docs/agentic/SUBSTRATE-SETUP.md.
  - substrate-crds.yaml
  - substrate.yaml
  - substrate-ops.yaml
  - volume-autoscaler.yaml

  # Identity governance — Kyverno engine (wave -1) + TIG claims/policies from
  # the tesserix-governance repo (wave 1). See tesserix-governance/README.md.
  - kyverno.yaml
  - tesserix-governance.yaml
  # NOTE: The standalone oauth2-proxy-{kagent,aregistry} apps are
  # decommissioned. Both UIs are now routed through devai-auth-bff
  # (GIP-backed) which lives in the devai namespace and reverse-proxies
  # to the upstream services after session check. See
  # manifests/agentic-istio/ for the VirtualServices.
