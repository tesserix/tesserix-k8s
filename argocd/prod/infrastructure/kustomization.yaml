apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production Infrastructure - Full production environment
# All components enabled with production-grade configuration
resources:
  # Storage Classes (Retain policy for stateful workloads)
  - storage-classes.yaml

  # Namespace Protection (prevent deletion of database/cache/messaging namespaces)
  - namespace-protection.yaml

  # Certificate Management
  - cert-manager.yaml
  - cert-manager-issuers.yaml

  # External Secrets Operator - Syncs secrets from GCP Secret Manager
  - argocd.yaml
  - sealed-secrets.yaml
  - external-secrets.yaml
  # External Secrets Resources - Creates all secrets from GCP Secret Manager
  - external-secrets-resources.yaml
  # Reloader - restarts Deployments when their Secrets/ConfigMaps change.
  # Closes the gap where external-secrets rotates a Secret in place (e.g.
  # the aregistry JWT key from GCP SM) but Pods consuming it via env vars
  # keep using the stale value until something else recycles them.
  - reloader.yaml

  # DNS Management
  - external-dns.yaml

  # Cloudflare Tunnel (for secure ingress)
  - cloudflared.yaml
  # Cloudflare Tunnel for FanZone (separate CF account/domain)
  - cloudflared-fanzone.yaml
  # Cloudflare Tunnel for HomeChef (fe3dr.com)
  - cloudflared-homechef.yaml
  # Cloudflare Tunnel for GameVerse (stayandplays.com)

  # Service Mesh (Istio)
  - istio-base.yaml
  - istio-cni.yaml
  - istio-ztunnel.yaml
  - istio-istiod.yaml
  # External gateway (public IP for custom domains)
  - istio-ingress-gateway.yaml
  # Custom domain dedicated gateway
  - custom-ingress-gateway.yaml
  - custom-domain-config.yaml
  # HomeChef dedicated gateway — isolates fe3dr.com from the shared
  # istio-ingressgateway so the legacy Keycloak RequestAuthentication
  # policies (still required by Fanzone) don't reject GIP-issued
  # mobile session tokens.
  - homechef-ingress-gateway.yaml
  # Internal gateway (private IP for Cloudflare Tunnel - mark8ly.com)
  - istio-ingress-gateway-internal.yaml
  - istio-egress-gateway.yaml
  - istio-config.yaml
  - istio-auth-policies.yaml
  - kiali.yaml

  # Database — All products use CloudNativePG (CNPG) clusters deployed via
  # per-product app-of-apps (e.g., homechef-postgres in homechef app-of-apps).
  # Legacy standalone postgresql-* StatefulSets and backup CronJobs removed.
  # See docs/cnpg-migration-guide.md for details.

  # Database Backups - Automated MongoDB backups to GCS (db-backup-and-restore namespace)
  - mongodb-blog-backup.yaml
  - mongodb-fanzone-backup.yaml

  # Identity Platform (Customer + Internal Keycloak)
  - identity-customer.yaml
  - identity-internal.yaml

  # MongoDB - FanZone chat message persistence
  - mongodb-fanzone.yaml

  # Caching - Per-namespace Redis instances (all enabled for prod)
  - redis-global.yaml
  - redis-marketplace.yaml
  - redis-fanzone.yaml
  - redis-homechef.yaml
  - redis-stockpilot.yaml
  - redis-devai.yaml

  # Messaging (NATS)
  - nats.yaml

  # Monitoring Stack (disabled - using GCP native monitoring or re-enable when needed)
  - prometheus-operator-crds.yaml
  - prometheus.yaml
  - grafana.yaml

  # OpenTelemetry Collector — OTLP ingestion for app telemetry (DevAI today).
  # Receives OTLP/gRPC+HTTP and exposes a Prometheus scrape endpoint (:8889).
  # Works standalone (traces/logs → debug); when prometheus.yaml above is
  # re-enabled its kubernetes-pods job auto-scrapes the collector via the pod's
  # prometheus.io/scrape annotation — no scrape-config edit needed.
  - otel-collector.yaml

  # Grafana Tempo — trace backend behind the collector's traces pipeline. Makes
  # the DevAI agent → stage → llm-call spans queryable in Grafana (Tempo
  # datasource registered in grafana.yaml).
  - tempo.yaml

  # Grafana dashboard ConfigMaps — DevAI, mark8ly, fe3dr (HomeChef) and the
  # mark8ly subscription set, loaded by the Grafana sidecar.
  - grafana-dashboards.yaml

  # Cost Monitoring (OpenCost + OAuth2 Proxy with Google SSO)
  - opencost.yaml

  # Autoscaling (KEDA)
  - keda.yaml

  # Serverless (Knative) - Operator + Serving (Istio networking) + Eventing
  - knative-operator.yaml
  - knative-serving.yaml
  - knative-eventing.yaml

  # Logging Stack (removed — unused, all components were scaled to 0)
  - elasticsearch.yaml
  - kibana.yaml
  - fluent-bit.yaml

  # Feature Flags (GrowthBook)
  - growthbook.yaml

  # Web Analytics (OpenPanel) — removed to save ~3.5 vCPU / 7 Gi / 75 Gi disk
  # - openpanel.yaml

  # Search Engine (Typesense)
  - typesense.yaml

  # OSRM (Open Source Routing Machine) — removed with marketplace
  # - osrm.yaml

  # Email Infrastructure (Postal) - disabled to reduce pod count
  # - mysql.yaml
  # - rabbitmq.yaml
  # - postal.yaml

  # Translation Infrastructure (LibreTranslate)
  - libretranslate.yaml

  # Release / Promotion Tooling (Kargo control plane)
  # GitHub SSO via built-in Dex; admin allowlist managed inline in kargo.yaml.
  - kargo.yaml

  # GitHub Actions Runner Controller (ARC) - Self-hosted CI runners (disabled — not needed atm)
  # - arc-external-secret.yaml
  # - arc-ghcr-pull-secret.yaml
  - arc-controller.yaml
  - arc-runner-scale-set.yaml

  # API Documentation (disabled in prod for security)
  # - swagger-ui.yaml

  # Agentic control planes — sourced from upstream OCI Helm charts.
  # Order:
  #   CRDs (wave -6)        ── kagent-crds + agentgateway-crds
  #   agentgateway (wave -4) ── data plane; reads the catalog
  #   kagent (wave -3)      ── runtime; reconciles Agent CRs into Deployments
  #
  # The agent catalog (aregistry, wave -5) is no longer the third-party
  # agentregistry-dev deployment — it is now our own agentic-registry, synced
  # from argocd/prod/apps/ai-apps/agentic-registry.yaml into the same
  # agentregistry-system namespace (Service agentregistry:12121). The former
  # `agentregistry.yaml` infra app has been removed so ArgoCD prunes the
  # upstream Deployment + its bundled Postgres.
  - kagent-crds.yaml
  - agentgateway-crds.yaml
  - agentgateway.yaml
  - kagent.yaml
  # NOTE: The standalone oauth2-proxy-{kagent,aregistry} apps are
  # decommissioned. Both UIs are now routed through devai-auth-bff
  # (GIP-backed) which lives in the devai namespace and reverse-proxies
  # to the upstream services after session check. See
  # manifests/agentic-istio/ for the VirtualServices.
