apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: messaging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/nats
    targetRevision: HEAD
    helm:
      releaseName: nats
      values: |
        # Use latest alpine image
        image:
          repository: nats
          tag: alpine
          pullPolicy: Always

        # 3-replica StatefulSet for JetStream HA
        replicaCount: 3

        # Cluster mode enabled for high availability
        cluster:
          enabled: true

        # JetStream for persistent messaging (requires StatefulSet)
        jetstream:
          enabled: true
          memoryStore:
            enabled: true
            maxSize: 1Gi
          fileStore:
            enabled: true
            size: 12Gi
            storageClassName: standard-rwo-retain

        # Production resource configuration
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi

        # Persistence for GKE - 12GB for JetStream data
        persistence:
          enabled: true
          storageClassName: standard-rwo-retain
          size: 12Gi

        # Service configuration
        service:
          type: ClusterIP
          port: 4222
          clusterPort: 6222
          monitorPort: 8222

        # Pod Disruption Budget for HA
        podDisruptionBudget:
          enabled: true
          minAvailable: 2

        # Liveness and readiness probes
        livenessProbe:
          enabled: true
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          enabled: true
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Internal Load Balancer for Cloud Run VPC connector access
        ilb:
          enabled: true

        # Spread NATS replicas across zones for HA
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - nats
                  topologyKey: topology.kubernetes.io/zone

  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
