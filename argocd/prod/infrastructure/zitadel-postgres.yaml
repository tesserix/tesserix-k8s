apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel-postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: identity
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/zitadel-postgres
    helm:
      releaseName: zitadel-postgres
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    # No prune: an accidental removal of the Cluster manifest would take the
    # PVCs with it.
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
