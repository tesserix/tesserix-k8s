apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:platform-tools-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: release
  annotations:
    # Sync after cert-manager / external-secrets / istio.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: release
  source:
    # Upstream Akuity Kargo OCI Helm chart.
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.11.1
    helm:
      releaseName: kargo
      values: |
        # ---------------------------------------------------------------
        # Kargo control plane — production
        # ---------------------------------------------------------------
        # External URL — fronted by Cloudflare Tunnel + Istio ingress.
        # Cloudflare terminates TLS, Istio routes HTTP to the kargo-api
        # service in this namespace. See VirtualService in
        # charts/thirdparty/istio-config/templates/virtual-services.yaml.
        api:
          host: kargo.tesserix.app

          # Cloudflare terminates TLS on the public edge; we hand off
          # plain HTTP to istio-ingress, then to the kargo-api Service.
          # Disable in-pod TLS, but tell Kargo TLS is terminated upstream
          # so it builds https:// callback URLs for OIDC.
          tls:
            enabled: false
            terminatedUpstream: true

          # Use a Service of type ClusterIP — Istio handles ingress.
          service:
            type: ClusterIP

          # Helm-chart-managed Ingress is disabled; we use a dedicated
          # Istio VirtualService for kargo.tesserix.app.
          ingress:
            enabled: false

          replicas: 2

          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi

          # Restart when cert-manager renews the Dex serving cert; the API
          # trusts it as a self-signed root, so a stale pod 500s on /projects.
          annotations:
            secret.reloader.stakater.com/reload: kargo-dex-server-cert

          podAnnotations:
            # Allow the Cloudflare Tunnel + Istio mesh to reach the API
            # without sidecar wonkiness on the OIDC discovery endpoint.
            sidecar.istio.io/inject: "true"

          # ------------------------------------------------------------
          # Local admin account is DISABLED — GitHub SSO only.
          # passwordHash + tokenSigningKey still need to exist in the
          # api Secret because the Helm chart references them; we sync
          # them from GCP Secret Manager via ExternalSecrets so they
          # stay rotatable.
          # ------------------------------------------------------------
          adminAccount:
            enabled: false

          # The chart will read ADMIN_ACCOUNT_PASSWORD_HASH and
          # ADMIN_ACCOUNT_TOKEN_SIGNING_KEY out of this Secret instead
          # of generating values.
          secret:
            name: kargo-api-secret

          # ------------------------------------------------------------
          # OIDC — Dex (built-in) with a GitHub connector.
          # Email-based admin allowlist is the access gate: anyone
          # outside the list lands in an empty UI with no projects.
          # ------------------------------------------------------------
          oidc:
            enabled: true
            usernameClaim: email
            additionalScopes:
              - email
              - profile
              - groups
              # offline_access makes Dex issue a refresh token. The 1.10 UI
              # renews its session shortly after login; without a refresh
              # token the renewal fails and the UI silently drops its token
              # ("no token provided" toast on a logged-in shell).
              - offline_access
            admins:
              claims:
                email:
                  - samyak.rout@gmail.com
                  - mahesh.sangawar@gmail.com
            dex:
              enabled: true
              # Dex loads its serving cert once at startup; without this it
              # keeps serving the pre-renewal cert after cert-manager rotates.
              annotations:
                secret.reloader.stakater.com/reload: kargo-dex-server-cert
              image:
                repository: ghcr.io/dexidp/dex
                tag: v2.44.0
                pullPolicy: IfNotPresent
              skipApprovalScreen: true
              # GitHub OAuth client ID/secret are provided as env from
              # the kargo-github-oauth Secret (synced from GCP Secret
              # Manager — see external-secrets/prod/kargo/).
              env:
                - name: GITHUB_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: kargo-github-oauth
                      key: client-id
                - name: GITHUB_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: kargo-github-oauth
                      key: client-secret
              connectors:
                - id: github
                  name: GitHub
                  type: github
                  config:
                    clientID: $GITHUB_CLIENT_ID
                    clientSecret: $GITHUB_CLIENT_SECRET
                    redirectURI: https://kargo.tesserix.app/dex/callback
                    # NOTE: org-membership filter (`orgs: [tesserix]`)
                    # was tried but blocked all logins with 401 because
                    # the underlying GitHub App ("Tesserix Platform SSO")
                    # doesn't have the "Members: Read" account permission.
                    # Without that permission, GitHub's /user/orgs
                    # endpoint returns nothing for user-to-server tokens
                    # so Dex's orgs check fails. Re-add the filter only
                    # AFTER the App permission is granted and every user
                    # has re-authorized to pick up the new scope.
                    # Until then: Kargo's email allowlist on the
                    # kargo-admin SA is the access gate (anyone else
                    # gets an empty UI with no role).
                    loadAllGroups: false
                    useLoginAsID: false
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 128Mi

        # ---------------------------------------------------------------
        # Kargo controller (reconciles Projects, Warehouses, Stages,
        # Promotions and talks to ArgoCD).
        # ---------------------------------------------------------------
        controller:
          enabled: true
          logLevel: INFO
          # Expose the controller's Prometheus metrics (mark8ly#644 phase 4).
          #
          # Kargo exports nothing scraped today: no metrics port, no metrics
          # Service, no annotations. A failed promotion is therefore invisible
          # to monitoring — which is how, on 2026-09-03, a sigstore TUF 403
          # broke image signing on main, no Freight formed, and migration
          # 000129 sat undeployed until it was noticed by hand.
          #
          # A ServiceMonitor rather than prometheus.io/* annotations: the
          # scrape job carried over from the community release uses
          # `role: pod` and reads POD annotations, so annotations on the
          # metrics Service would be ignored. The operator consumes
          # ServiceMonitors natively, which is what it is for.
          #
          # This phase only makes the metrics exist and be scraped. The alert
          # rule follows, written against metric names read from the live
          # output — a rule referencing a metric nothing exports would be one
          # more thing that looks wired and reaches nothing.
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 30s
          argocd:
            # In-cluster ArgoCD; Kargo will create AppProject-scoped
            # service tokens itself when it needs to mutate Argo CD
            # Applications during a Promotion.
            namespace: argocd
          # Bind the controller's K8s SA to a GCP SA via Workload
          # Identity so the controller can read the ghcr-remote GAR
          # mirror without needing a registry password Secret. GAR
          # is in-region (Private Google Access) so tag listing has
          # zero NAT cost and the controller no longer hits the
          # GHCR upstream directly.
          serviceAccount:
            annotations:
              iam.gke.io/gcp-service-account: kargo-controller@tesseracthub-480811.iam.gserviceaccount.com
          # Workaround for an HTTP/2 connection-reuse interaction
          # between go-containerregistry and Cloud NAT keepalives that
          # was causing image-descriptor fetches to time out before we
          # switched to GAR. Harmless to keep — disables HTTP/2 in
          # Go's std http client.
          env:
            - name: GODEBUG
              value: "http2client=0"
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi

        # ---------------------------------------------------------------
        # Webhooks server — validating/mutating admission for Kargo CRDs.
        # ---------------------------------------------------------------
        webhooksServer:
          enabled: true
          replicas: 2
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

        # ---------------------------------------------------------------
        # Garbage collector — clean up old Promotions / Freight.
        # ---------------------------------------------------------------
        garbageCollector:
          enabled: true
          schedule: "0 * * * *"
          maxRetainedPromotions: 50
          minPromotionDeletionAge: 336h
          maxRetainedFreight: 50
          minFreightDeletionAge: 336h
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi

        # ---------------------------------------------------------------
        # Management controller — provisions per-Project namespaces and
        # default RBAC inside them.
        # ---------------------------------------------------------------
        managementController:
          enabled: true
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

        # ---------------------------------------------------------------
        # Install CRDs through the chart (Kargo manages its own).
        # ---------------------------------------------------------------
        crds:
          install: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  ignoreDifferences:
    # Webhook caBundle is filled in by cert-manager's CA Injector.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    # Workaround: ArgoCD's vendored OpenAPI schema doesn't know about
    # Deployment.status.terminatingReplicas (Kubernetes 1.31+). Without
    # this exception, ArgoCD's structured-merge diff fails with
    # "field not declared in schema" and the sync gets stuck in
    # ComparisonError. Strip status entirely from the diff — controllers
    # own status anyway.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
