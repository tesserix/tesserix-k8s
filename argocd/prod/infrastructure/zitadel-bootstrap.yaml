apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
  annotations:
    # After zitadel (wave 1): the CronJob authenticates against the API and
    # would fail its first run against a namespace that has no instance yet.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: identity
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: charts/apps/zitadel-bootstrap
    helm:
      releaseName: zitadel-bootstrap
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
