apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-auth-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: security
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/infrastructure/istio-auth-policies
    targetRevision: HEAD
    helm:
      releaseName: istio-auth-policies
      valueFiles:
        - values.yaml
        - values-prod.yaml
      values: |
        # Production environment configuration
        environment: prod

        # Istio Ingress Gateway
        ingressGateway:
          namespace: istio-ingress
          selector:
            istio: ingressgateway

        # Application namespaces
        appNamespaces:
          global: global
          marketplace: marketplace
          # fanzone removed — decommissioned namespace; this key generated an
          # allow-mesh-internal policy into it, the second object that failed.
          # Agentic control planes (DevAI consumers): aregistry, agentgateway,
          # kagent. Each needs allow-mesh-internal so istio-proxy can dial
          # istiod for CSR signing and DevAI's pods can reach the catalog.
          agentregistry: agentregistry-system
          agentgateway: agentgateway-system
          kagent: kagent-system

        # Keycloak IDP Configuration - Production (customer-idp only)
        keycloak:
          customer:
            issuer: "https://identity.fanzonebattleground.com/realms/tesserix-customer"
            jwksUri: "https://identity.fanzonebattleground.com/realms/tesserix-customer/protocol/openid-connect/certs"
            audiences:
              - "tesserix-api"
              - "mobile-app"
              - "web-storefront"
              - "admin-dashboard"
              - "marketplace-dashboard"
              - "account"
          # Internal IDP disabled - using customer-idp only
          internal:
            enabled: false

        # Service mesh principals for internal communication
        meshPrincipals:
          - "cluster.local/ns/global/sa/*"
          - "cluster.local/ns/marketplace/sa/*"
          - "cluster.local/ns/tesserix/sa/*"
          - "cluster.local/ns/fanzone/sa/*"
          - "cluster.local/ns/homechef/sa/*"
          - "cluster.local/ns/devai/sa/*"
          - "cluster.local/ns/istio-ingress/sa/*"
          - "cluster.local/ns/istio-system/sa/*"
          - "cluster.local/ns/monitoring/sa/*"
          # Agentic control planes — added with DevAI rollout.
          - "cluster.local/ns/agentregistry-system/sa/*"
          - "cluster.local/ns/agentgateway-system/sa/*"
          - "cluster.local/ns/kagent-system/sa/*"

        # mTLS mode - STRICT in production
        mtls:
          mode: STRICT

        # Frontend apps - these need to be accessible without authentication
        # for initial page load (login page, static assets, etc.)
        frontendApps:
          - name: storefront
            label: storefront
            namespace: marketplace
            hosts:
              # Wildcard matches all subdomains for tenant storefronts
              - "*.mark8ly.com"
          - name: admin
            label: admin
            namespace: marketplace
            hosts:
              - "admin.mark8ly.com"
          - name: tenant-onboarding
            label: tenant-onboarding
            namespace: marketplace
            hosts:
              # Apex domain for tenant onboarding signup
              - "mark8ly.com"
          - name: company
            label: company
            namespace: tesserix
            hosts:
              - "tesserix.app"
              - "www.tesserix.app"
          # console — the operator console (Deployment/console, tesserix ns).
          # NOTE for anyone adding a host later: this inline `helm.values` block
          # OVERRIDES charts/infrastructure/istio-auth-policies/values*.yaml
          # entirely. An entry added to those files renders locally, syncs
          # green, and still 403s in the cluster, because this list is what the
          # chart actually receives. Add hosts HERE.
          - name: console
            label: console
            namespace: tesserix
            hosts:
              - "console.tesserix.app"
          # tesserix-blog MUST stay listed here. The frontendApps list drives
          # both the per-app ALLOW policy (attached to the pods) AND the
          # gateway-level aggregate ALLOW (allow-frontend-apps-public). Once
          # any ALLOW policy targets the ingress gateway, Istio default-denies
          # traffic that doesn't match an ALLOW rule. Dropping the entry
          # removed blog.tesserix.app from the gateway ALLOW host list, so
          # every request started getting "RBAC: access denied" (403) at the
          # edge. The drain churn this used to cause is now handled at a
          # higher layer: istio-auth-policies syncs via client-side apply
          # (unchanged content does not re-apply) and the blog VS retries on
          # reset/connect-failure/5xx so the residual drains are invisible.
          - name: tesserix-blog
            label: tesserix-blog
            namespace: tesserix
            hosts:
              - "blog.tesserix.app"
              - "identity-blog.tesserix.app"
          - name: tesserix-docs
            label: tesserix-docs
            namespace: tesserix
            hosts:
              - "docs.tesserix.app"
          - name: tesserix-storybook
            label: tesserix-storybook
            namespace: tesserix
            hosts:
              - "ui.tesserix.app"
          # postiz — self-hosted social scheduler (charts/apps/postiz).
          # Public UI; Postiz enforces its own JWT auth. NOTE: this inline
          # helm.values block overrides values-prod.yaml — postiz must be
          # listed HERE for the gateway host-allow to render.
          - name: postiz
            label: postiz
            namespace: postiz
            hosts:
              - "postiz.tesserix.app"
          - name: yes-hospital
            label: yes-hospital
            namespace: yes-hospital
            hosts:
              - "yes-hospital.tesserix.app"
          - name: keycloak
            label: keycloak
            namespace: identity-customer
            hosts:
              - "identity.fanzonebattleground.com"
              - "identity.fe3dr.com"
              - "identity.fanzonebattleground.com"
          - name: kibana
            label: kibana
            hosts:
              - "kibana.tesserix.app"
          - name: grafana
            label: grafana
            hosts:
              - "grafana.tesserix.app"
          - name: prometheus
            label: prometheus
            hosts:
              - "prometheus.tesserix.app"
          - name: alertmanager
            label: alertmanager
            hosts:
              - "alertmanager.tesserix.app"
          - name: openpanel
            label: openpanel
            hosts:
              - "analytics.tesserix.app"
          # fanzone — DECOMMISSIONED. The namespace is gone, so this entry's
          # namespace-scoped policy failed to apply with `namespaces "fanzone"
          # not found`. ArgoCD applies a sync atomically, so that one dead
          # object wedged the WHOLE app OutOfSync and every later host edit
          # here silently never reached the cluster.
          # observability — telemetry explorer (obs-ui) + query API (obs-api),
          # split by path on one host. This entry is what puts the domain in
          # the gateway ALLOW list; without it the gateway returns 403
          # "RBAC: access denied" before any route is consulted. Public at the
          # gateway on purpose: obs-api enforces Google sign-in itself, and the
          # sign-in page must be reachable unauthenticated.
          - name: observability
            label: obs-ui
            namespace: observability
            hosts:
              - "observability.tesserix.app"
          # dwellm8-api — the Dwellm8 mobile apps' API, api.dwellm8.com
          # (Cloudflare-proxied). Public at the gateway on purpose: the API
          # authenticates every request itself (GIP bearer per surface,
          # ADR-0027). No namespace: dwellm8 is unmeshed, so there is no
          # per-pod policy to place — NetworkPolicy guards the namespace.
          - name: dwellm8-api
            label: dwellm8-api
            hosts:
              - "api.dwellm8.com"
          - name: homechef-web
            label: homechef-web
            hosts:
              - "fe3dr.com"
              - "www.fe3dr.com"
              - "vendors.fe3dr.com"
              - "admin.fe3dr.com"
              - "delivery.fe3dr.com"
              - "api.fe3dr.com"
              - "identity.fe3dr.com"
              - "internal-identity.fe3dr.com"
              - "auth.fe3dr.com"
          - name: gameverse
            label: gameverse
            hosts:
              - "stayandplays.com"
              - "www.stayandplays.com"
              - "identity.stayandplays.com"
          - name: keycloak-internal
            label: keycloak-internal
            hosts:
              - "internal-idp.mark8ly.com"
              - "internal-identity.fe3dr.com"
              - "internal-identity.fanzonebattleground.com"
              - "internal-identity.tesserix.app"
              - "identity-social.tesserix.app"
              - "identity-stock.tesserix.app"
              # identity-devai.tesserix.app + identity-sre.tesserix.app
              # removed when DevAI migrated off Keycloak to GIP.
          # secret-service — the OpenBao admin console. No `namespace`: the
          # console is two workloads (UI + API) and this template's per-app
          # policy selects a single label, so the pod-level ALLOWs live in
          # charts/apps/secret-service instead. Unauthenticated at the edge so
          # the OIDC redirect is reachable; the API enforces the two-address
          # allowlist on every request.
          - name: secret-service
            label: secret-service-web
            hosts:
              - "secret-service.tesserix.app"
          - name: opencost
            label: opencost
            hosts:
              - "costestimator.tesserix.app"
              - "kubecost.tesserix.app"
          - name: stockpilot-web
            label: stockpilot-web
            namespace: stockpilot
            hosts:
              - "stockpilot.tesserix.app"
          - name: stockpilot-api
            label: stockpilot-api
            namespace: stockpilot
            hosts:
              - "stockpilot.tesserix.app"
          # scrapper — DECOMMISSIONED 2026-07-26. Removed WITH the namespace, not
          # after it: a frontendApps entry whose namespace does not exist fails to
          # apply, and ArgoCD syncs atomically, so it would wedge this entire chart
          # OutOfSync — the exact failure fanzone caused, which silently blocked
          # every host edit here for weeks.
          - name: devai-platform
            label: devai-platform
            namespace: devai
            hosts:
              - "devai.tesserix.app"
          - name: devai-sre-platform
            label: devai-sre-platform
            namespace: devai
            hosts:
              - "sre.tesserix.app"
          # Agentic admin UIs — gateway only talks to oauth2-proxy in
          # each namespace; the proxy reverse-proxies to the actual UI
          # once the Keycloak (devai realm) login succeeds.
          - name: kagent-ui
            label: oauth2-proxy
            namespace: kagent-system
            hosts:
              - "kagent.tesserix.app"
          - name: aregistry-ui
            label: oauth2-proxy
            namespace: agentregistry-system
            hosts:
              - "aregistry.tesserix.app"
          # social / horoscope namespaces are not currently deployed. Keep
          # the gateway host-allow but omit `namespace:` so no per-app pod
          # policy is attempted in a missing namespace (which fails the whole
          # app sync). Re-add `namespace:` when the product is redeployed.
          - name: social-web
            label: social-web
            hosts:
              - "social.tesserix.app"
          - name: horoscope-web
            label: horoscope-web
            hosts:
              - "astronomy.tesserix.app"
          - name: horoscope-api
            label: horoscope-api
            hosts:
              - "astronomy.tesserix.app"
          - name: argocd
            label: argocd-server
            hosts:
              - "argocd.tesserix.app"
          - name: kargo
            label: kargo-api
            hosts:
              - "kargo.tesserix.app"
          # No `namespace:` — the zitadel chart ships its own pod-level policies
          # for the API and the login UI, which share this host.
          - name: zitadel
            label: zitadel
            hosts:
              - "auth.tesserix.app"

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      selfHeal: true
      # Prune, because a policy removed from values is a policy that must
      # leave the cluster: without this the two scrapper AuthorizationPolicies
      # decommissioned on 2026-07-26 sat as permanent orphans, held the app
      # OutOfSync, and quietly blocked every later host edit from applying —
      # fanzone's failure mode, a second time.
      prune: true
    syncOptions:
      - CreateNamespace=false
      # Client-side apply. With ServerSideApply, every sync touches
      # managedFields on each AuthorizationPolicy (even when spec/content is
      # unchanged), bumping resourceVersion and triggering an xds push.
      # ztunnel responds to every xds push by draining and rebuilding the
      # per-pod proxy on every workload selected by any policy in this chart,
      # producing brief 503 'connection termination' windows at the edge every
      # ~3min reconcile. Client-side apply compares the
      # last-applied-configuration annotation textually and skips the apply
      # entirely when content matches, so unchanged policies stop churning.
      - ServerSideApply=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
