# Kyverno policy engine — admission backstop for the TIG identity guardrails
# (tesserix-governance repo). Installed before the governance app (wave -1 vs 1)
# so ClusterPolicy CRDs exist when TIG syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: policy
  annotations:
    # No ServerSideDiff here: it makes ArgoCD patch the ~1MB kyverno CRDs
    # client-side, which dies on the 256KB annotation limit. The cost is a
    # cosmetic OutOfSync on CRDs the API server defaults fields into.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infrastructure
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      releaseName: kyverno
      values: |
        # Admission reports off: the TIG wildcard policies generated 60k+
        # per-resource PolicyReports in 10h (pure etcd churn — all skips).
        # Break-glass auditing uses GKE audit logs instead.
        features:
          admissionReports:
            enabled: false
        # 2 replicas: webhook availability without HA (3) cost. Policies fail
        # open (webhookFailurePolicy: Ignore in TIG), so a full outage never
        # blocks the cluster.
        admissionController:
          replicas: 2
          # Invalidate REST discovery when a CRD is installed. Without this,
          # Kyverno rejects the new kind until its admission pods restart.
          crdWatcher: true
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          container:
            resources:
              limits:
                cpu: null
                memory: 512Mi
              requests:
                cpu: null
                memory: 128Mi
          initContainer:
            resources:
              limits:
                cpu: null
                memory: 128Mi
              requests:
                cpu: null
                memory: 64Mi
        backgroundController:
          resources:
            limits:
              cpu: null
              memory: 256Mi
            requests:
              cpu: null
              memory: 64Mi
        cleanupController:
          resources:
            limits:
              cpu: null
              memory: 256Mi
            requests:
              cpu: null
              memory: 64Mi
        # Off: TIG policies are admission-only (background: false) and
        # admission reports are disabled, so this controller has no job —
        # it only OOMed trying to watch every resource the wildcard
        # policies name. Re-enable if background policies are ever added.
        reportsController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # API server defaults spec.conversion on CRDs the chart omits it from;
  # jsonPointer (not a list path), so the SSA strip gotcha does not apply.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No RespectIgnoreDifferences: it switches the ignoreDifferences-matched
    # CRDs to a client-side patch that dies on the 256KB annotation limit
    # (the two kyverno policy CRDs are ~1MB). SSA never sends /spec/conversion,
    # so the ignored field is safe without it.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
