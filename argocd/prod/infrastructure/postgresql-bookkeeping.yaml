apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-bookkeeping
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesseract-bookkeeping
    app.kubernetes.io/component: database
    target-namespace: bookkeeping
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: data
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/postgresql
    targetRevision: HEAD
    helm:
      releaseName: postgresql
      values: |
        # PostgreSQL for Bookkeeping
        postgresql:
          database: bookkeeping_db
          username: postgres
          existingSecret: "postgresql-password"
          existingSecretKey: "postgresql-password"

        architecture: standalone

        persistence:
          enabled: true
          storageClass: "standard-rwo-retain"
          size: 30Gi

        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi

        service:
          type: ClusterIP
          port: 5432

        metrics:
          enabled: true
          serviceMonitor:
            enabled: false

        # SSL/TLS Configuration - Uses K8s secret: postgresql-ssl-certs
        ssl:
          enabled: true
          existingSecret: "postgresql-ssl-certs"


        # Note: Database creation is handled by db-schema-bootstrap CronJob
        # See: charts/apps/db-schema-bootstrap/
  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql-bookkeeping
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
