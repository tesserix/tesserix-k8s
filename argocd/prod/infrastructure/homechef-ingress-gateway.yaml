apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homechef-ingress-gateway
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:istio-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: infrastructure
  annotations:
    # Provision the gateway pods before any VirtualService starts targeting them.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infrastructure
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.29.6
    helm:
      # The ArgoCD 3.4 repo-server's helm applies the gateway chart's
      # values schema $defs to the root document and rejects every root
      # key (including the chart's own _internal_defaults_do_not_set).
      # Local helm 3/4 validate the identical chart+values fine. Skip
      # schema validation until upstream ships a compatible schema.
      skipSchemaValidation: true
      releaseName: homechef-ingress
      values: |
        # =================================================================
        # HOMECHEF DEDICATED INGRESS GATEWAY
        # =================================================================
        # Isolates fe3dr.com traffic from the shared istio-ingressgateway
        # workload so the legacy Keycloak RequestAuthentication policies
        # (jwt-auth-customer / jwt-auth-internal — still required by
        # Fanzone and other workloads) do NOT apply to HomeChef requests.
        #
        # HomeChef is fully on Google Identity Platform. The auth-bff mints
        # an AES-GCM-encrypted session blob and ships it to mobile clients,
        # which return it as `Authorization: Bearer`. The shared gateway's
        # Istio JWT filter rejects anything that isn't a Keycloak JWT, which
        # broke mobile login end-to-end.
        #
        # Routing: Cloudflare Zero Trust tunnel `homechef-prod` →
        # http://homechef-ingressgateway.istio-ingress.svc.cluster.local:80
        # → this gateway → homechef VirtualServices.
        # =================================================================

        name: homechef-ingressgateway

        revision: ""

        # ClusterIP — the cloudflared tunnel sidecar connects via in-cluster
        # DNS, so no public LoadBalancer is needed. TLS terminates at the
        # Cloudflare edge; HTTP-only between cloudflared and the gateway.
        service:
          type: ClusterIP
          ports:
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            - name: http2
              port: 80
              protocol: TCP
              targetPort: 80
            - name: https
              port: 443
              protocol: TCP
              targetPort: 443

        # Sized to match the shared gateway's per-replica footprint.
        resources:
          requests:
            cpu: null
            memory: 256Mi
          limits:
            cpu: null
            memory: 1Gi

        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 10
          # CPU target nulled: the chart defaults it to 80, and with no cpu
          # request the metric reads <unknown> so the HPA never scales.
          targetCPUUtilizationPercentage: null
          targetMemoryUtilizationPercentage: 80

        podDisruptionBudget:
          maxUnavailable: 1

        serviceAccount:
          create: true
          name: homechef-ingressgateway

        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "15020"
          prometheus.io/path: "/stats/prometheus"

        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true
          fsGroup: 1337

        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1337

        # Labels — the `istio` value is the selector key that RequestAuthentication
        # uses. This deliberately does NOT match `istio: ingressgateway` or
        # `istio: custom-ingressgateway`, so the legacy Keycloak policies in
        # istio-ingress namespace do not bind to these pods.
        labels:
          app: homechef-ingressgateway
          istio: homechef-ingressgateway

        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: homechef-ingressgateway
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: homechef-ingressgateway

        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app: homechef-ingressgateway
                  topologyKey: kubernetes.io/hostname

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
