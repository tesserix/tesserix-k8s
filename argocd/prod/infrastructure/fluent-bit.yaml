apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  annotations:
    kargo.akuity.io/authorized-stage: "kargo-infra:observability-prod"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: logging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.57.9
    helm:
      releaseName: fluent-bit
      values: |
        # Kind of DaemonSet
        kind: DaemonSet

        # Replicas (only for Deployment kind)
        replicaCount: 1

        # Image
        image:
          repository: fluent/fluent-bit
          tag: ""
          pullPolicy: Always

        # Resource configuration (required for AKS Azure Policy)
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi

        # Service account
        serviceAccount:
          create: true
          annotations: {}
          name: fluent-bit

        # RBAC
        rbac:
          create: true
          nodeAccess: true
          eventsAccess: true

        # Security context
        podSecurityContext:
          runAsUser: 0
          runAsGroup: 0

        securityContext:
          privileged: false
          runAsNonRoot: false
          capabilities:
            add:
              - DAC_OVERRIDE
            drop:
              - ALL
          readOnlyRootFilesystem: true

        # Node selector to disable scheduling (scaled down to free node resources)
        nodeSelector:
          logging-enabled: "true"

        # Tolerations to run on all nodes
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
          - operator: Exists
            effect: NoExecute
          - operator: Exists
            effect: NoSchedule

        # Disable Istio sidecar - DaemonSet with hostPath mounts
        podAnnotations:
          sidecar.istio.io/inject: "false"

        # Host paths for log collection
        hostNetwork: false
        dnsPolicy: ClusterFirst

        # Environment variables - ES credentials from ExternalSecrets (GCP Secret Manager)
        env:
          - name: ELASTICSEARCH_HOST
            value: "elasticsearch-master.logging.svc.cluster.local"
          - name: ELASTICSEARCH_PORT
            value: "9200"
          - name: ES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: elastic-credentials
                key: password

        # Fluent Bit configuration
        config:
          # Service configuration
          service: |
            [SERVICE]
                Daemon Off
                Flush 5
                Log_Level info
                Parsers_File /fluent-bit/etc/parsers.conf
                Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
                HTTP_Server On
                HTTP_Listen 0.0.0.0
                HTTP_Port 2020
                Health_Check On
                storage.path /var/log/flb-storage/
                storage.sync normal
                storage.checksum off
                storage.backlog.mem_limit 5M

          # Input configuration
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                multiline.parser docker, cri
                Tag kube.*
                Mem_Buf_Limit 50MB
                Skip_Long_Lines On
                Refresh_Interval 10
                DB /var/log/flb_kube.db
                DB.Sync Normal

            [INPUT]
                Name systemd
                Tag host.*
                Systemd_Filter _SYSTEMD_UNIT=kubelet.service
                Read_From_Tail On
                Strip_Underscores On

            [INPUT]
                Name tail
                Path /var/log/syslog
                Tag host.syslog
                Parser syslog-rfc3164
                Mem_Buf_Limit 5MB

          # Filters
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On
                Labels On
                Annotations Off
                Buffer_Size 512k

            [FILTER]
                Name modify
                Match kube.*
                Add cluster tesserix-prod
                Add environment prod

            [FILTER]
                Name nest
                Match kube.*
                Operation lift
                Nested_under kubernetes
                Add_prefix kubernetes_

            [FILTER]
                Name grep
                Match kube.*
                Exclude kubernetes_namespace_name ^(kube-system|kube-public|kube-node-lease|default|argocd|cert-manager|external-secrets|external-dns|istio-system|istio-ingress|istio-egress|keda|cloudflared|db-backup-and-restore|monitoring|logging)$

          # Output configuration - ES auth via ExternalSecrets
          outputs: |
            [OUTPUT]
                Name es
                Match kube.*
                Host ${ELASTICSEARCH_HOST}
                Port ${ELASTICSEARCH_PORT}
                HTTP_User elastic
                HTTP_Passwd ${ES_PASSWORD}
                Logstash_Format On
                Logstash_Prefix fluentbit-kube
                Logstash_DateFormat %Y.%m.%d
                Retry_Limit 5
                Replace_Dots On
                Suppress_Type_Name On
                Buffer_Size 512KB
                tls On
                tls.verify Off
                Trace_Error On

            [OUTPUT]
                Name es
                Match host.*
                Host ${ELASTICSEARCH_HOST}
                Port ${ELASTICSEARCH_PORT}
                HTTP_User elastic
                HTTP_Passwd ${ES_PASSWORD}
                Logstash_Format On
                Logstash_Prefix fluentbit-host
                Logstash_DateFormat %Y.%m.%d
                Retry_Limit 5
                Suppress_Type_Name On
                tls On
                tls.verify Off

            # Stdout for debugging (can be disabled in production)
            # [OUTPUT]
            #     Name stdout
            #     Match *
            #     Format json_lines

          # Custom parsers
          customParsers: |
            [PARSER]
                Name docker_no_time
                Format json
                Time_Keep Off
                Time_Key time
                Time_Format %Y-%m-%dT%H:%M:%S.%L

            [PARSER]
                Name json_parser
                Format json
                Time_Key time
                Time_Format %Y-%m-%dT%H:%M:%S.%LZ
                Time_Keep On

            [PARSER]
                Name syslog-rfc3164
                Format regex
                Regex ^<(?<pri>[0-9]+)>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
                Time_Key time
                Time_Format %b %d %H:%M:%S

        # Volume mounts for log collection
        volumeMounts:
          - name: varlog
            mountPath: /var/log
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true
          - name: etcmachineid
            mountPath: /etc/machine-id
            readOnly: true
          - name: flb-storage
            mountPath: /var/log/flb-storage

        # Volumes
        volumes:
          - name: varlog
            hostPath:
              path: /var/log
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
          - name: etcmachineid
            hostPath:
              path: /etc/machine-id
              type: File
          - name: flb-storage
            emptyDir: {}

        # Service for metrics
        service:
          type: ClusterIP
          port: 2020
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "2020"
            prometheus.io/path: "/api/v1/metrics/prometheus"

        # Service monitor for Prometheus
        serviceMonitor:
          enabled: true
          namespace: monitoring
          interval: 30s
          scrapeTimeout: 10s
          selector:
            release: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
