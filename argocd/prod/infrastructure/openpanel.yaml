apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openpanel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    path: charts/thirdparty/openpanel
    targetRevision: HEAD
    helm:
      releaseName: openpanel
      values: |
        # OpenPanel configuration for production environment

        # PARKED 2026-08-01 for cost. ClickHouse held 0 rows in every table --
        # this stack never ingested a single event. Services, config and all
        # three PVCs are retained; restore the replicaCounts to revive.

        api:
          replicaCount: 0
          image:
            repository: lindesvard/openpanel-api
            tag: "2.0.1-rc"
            pullPolicy: IfNotPresent
          port: 3333
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi

        dashboard:
          replicaCount: 0
          image:
            repository: lindesvard/openpanel-dashboard
            tag: "2.0.1-rc"
            pullPolicy: IfNotPresent
          port: 3000
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi

        worker:
          replicaCount: 0
          image:
            repository: lindesvard/openpanel-worker
            tag: "2.0.1-rc"
            pullPolicy: IfNotPresent
          port: 9999
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi

        postgresql:
          enabled: true
          replicaCount: 0
          image:
            repository: postgres
            tag: "14-alpine"
          persistence:
            enabled: true
            size: 20Gi
            storageClassName: standard-rwo-retain
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi

        clickhouse:
          enabled: true
          replicaCount: 0
          image:
            repository: clickhouse/clickhouse-server
            tag: "25.10.2.65"
          persistence:
            enabled: true
            size: 50Gi
            storageClassName: standard-rwo-retain
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 4Gi

        redis:
          enabled: true
          replicaCount: 0
          image:
            repository: redis
            tag: "7.2.5-alpine"
          persistence:
            enabled: true
            size: 5Gi
            storageClassName: standard-rwo-retain
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi

        config:
          dashboardUrl: "https://analytics.tesserix.app"
          apiUrl: "https://analytics.tesserix.app"
          nodeEnv: "production"
          selfHosted: true
          allowRegistration: false
          batchSize: 5000
          batchInterval: 10000
          concurrency: 10

        secrets:
          name: openpanel-secrets
          cookieSecretKey: cookie-secret
          postgresqlPasswordKey: postgresql-password

        # Project Init Job — bootstraps projects and writes client IDs to K8s Secret
        projectInit:
          # Cannot run while the API is parked.
          enabled: false
          targetNamespace: "marketplace"
          secretName: "openpanel-client-ids"
          adminUser:
            enabled: true
          organization:
            id: "tesserix-analytics"
            name: "Prod"
          apps:
            admin:
              projectName: "Tesserix Admin (prod)"
              domain: "https://admin.mark8ly.com"
            storefront:
              projectName: "Tesserix Storefront (prod)"
              domain: "https://marketplace.mark8ly.com"
              cors: "https://marketplace.mark8ly.com,https://*.mark8ly.com"
            tenant-onboarding:
              projectName: "Tesserix Tenant Onboarding (prod)"
              domain: "https://onboard-your-store.mark8ly.com"

  destination:
    server: https://kubernetes.default.svc
    namespace: openpanel
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
