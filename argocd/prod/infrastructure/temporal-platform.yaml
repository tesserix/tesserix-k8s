apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: workflow-engine
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/temporalio/helm-charts
    targetRevision: 9f4d328c31c77c323d272d0c5f615cf02bd46dab
    path: charts/temporal
    helm:
      releaseName: temporal
      values: |
        serviceAccount:
          create: false
          name: temporal-platform

        server:
          replicaCount: 3
          image:
            repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/third-party/temporal-server
            tag: "1.31.2"
            pullPolicy: IfNotPresent
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          terminationGracePeriodSeconds: 90
          additionalVolumes:
            - name: tmp
              emptyDir: {}
          additionalVolumeMounts:
            - name: tmp
              mountPath: /tmp
          metrics:
            annotations:
              enabled: true
            serviceMonitor:
              enabled: true
              interval: 30s
              additionalLabels:
                release: kube-prometheus-stack
          config:
            numHistoryShards: 512
            persistence:
              defaultStore: default
              visibilityStore: visibility
              datastores:
                default:
                  sql:
                    pluginName: postgres12
                    driverName: postgres12
                    databaseName: temporal_platform
                    connectAddr: infra-postgres-rw.infra.svc.cluster.local:5432
                    connectProtocol: tcp
                    user: temporal
                    existingSecret: temporal-db-credentials
                    secretKey: password
                    createDatabase: false
                    manageSchema: true
                    maxConns: 30
                    maxIdleConns: 5
                    tls:
                      enabled: true
                      enableHostVerification: false
                visibility:
                  sql:
                    pluginName: postgres12
                    driverName: postgres12
                    databaseName: temporal_platform_visibility
                    connectAddr: infra-postgres-rw.infra.svc.cluster.local:5432
                    connectProtocol: tcp
                    user: temporal
                    existingSecret: temporal-db-credentials
                    secretKey: password
                    createDatabase: false
                    manageSchema: true
                    maxConns: 15
                    maxIdleConns: 3
                    tls:
                      enabled: true
                      enableHostVerification: false
            namespaces:
              create: true
              namespace:
                - name: devai
                  retention: 7d
                - name: mark8ly
                  retention: 7d
                - name: homechef
                  retention: 7d
                - name: dwellm8
                  retention: 30d
                - name: postiz
                  retention: 7d
                - name: kora
                  retention: 7d
                - name: agentic-registry
                  retention: 7d
          frontend:
            replicaCount: 3
            service:
              annotations:
                istio.io/use-waypoint: none
              type: ClusterIP
              port: 7233
              appProtocol: grpc
            containerSecurityContext: &serverSecurityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop: ["ALL"]
            podDisruptionBudget: &serverPdb
              minAvailable: 2
            topologySpreadConstraints: &serverTopology
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: frontend
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: frontend
          history:
            replicaCount: 3
            containerSecurityContext: *serverSecurityContext
            podDisruptionBudget: *serverPdb
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: history
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: history
          matching:
            replicaCount: 3
            containerSecurityContext: *serverSecurityContext
            podDisruptionBudget: *serverPdb
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: matching
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: matching
          worker:
            replicaCount: 3
            containerSecurityContext: *serverSecurityContext
            podDisruptionBudget: *serverPdb
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: worker
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: temporal
                    app.kubernetes.io/instance: temporal
                    app.kubernetes.io/component: worker

        admintools:
          enabled: false
          image:
            repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/third-party/temporal-admin-tools
            tag: "1.31.2"
            pullPolicy: IfNotPresent

        web:
          enabled: false

        schema:
          useHelmHooks: true
          backoffLimit: 15
          activeDeadlineSeconds: 900
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          containerSecurityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]

        shims:
          dockerize: false
          elasticsearchTool: false
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
