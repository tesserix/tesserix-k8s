apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-egress-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: infrastructure
  annotations:
    kargo.akuity.io/authorized-stage: kargo-infra:istio-prod
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: infrastructure
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.8
    helm:
      valuesObject:
        name: istio-egressgateway
        service:
          type: ClusterIP
          annotations:
            service.kubernetes.io/topology-aware-hints: auto
          ports:
          - name: status-port
            port: 15021
            protocol: TCP
            targetPort: 15021
          - name: http2
            port: 80
            protocol: TCP
            targetPort: 80
          - name: https
            port: 443
            protocol: TCP
            targetPort: 443
          - name: tls
            port: 15443
            protocol: TCP
            targetPort: 15443
        resources:
          requests:
            cpu: null
            memory: 64Mi
          limits:
            cpu: null
            memory: 256Mi
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 0
          targetMemoryUtilizationPercentage: 80
        podDisruptionBudget:
          maxUnavailable: 1
        serviceAccount:
          create: true
          name: istio-egressgateway
        podAnnotations:
          prometheus.io/scrape: 'true'
          prometheus.io/port: '15020'
          prometheus.io/path: /stats/prometheus
          istioUpgradeVersion: 1.30.8
        securityContext:
          runAsUser: 1337
          runAsGroup: 1337
          runAsNonRoot: true
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        labels:
          app: istio-egressgateway
          istio: egressgateway
      releaseName: istio-egress
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-egress
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
