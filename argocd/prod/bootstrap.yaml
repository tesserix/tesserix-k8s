---
# Production Environment Bootstrap Application
# This is deployed by Terraform to kickstart the GitOps process
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tesseract-platform
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/tesserix/tesserix-k8s.git
    targetRevision: HEAD
    path: argocd/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
