apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment - manages apps and infrastructure via App-of-Apps pattern
resources:
  # AppProjects (deployed first, sync-wave -10)
  - projects/
  # Infrastructure App-of-Apps (deployed second)
  - infrastructure-app.yaml
  # Applications App-of-Apps (deployed after infrastructure)
  - apps-app.yaml
