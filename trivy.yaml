# Trivy configuration for the "Security Scan" job in
# .github/workflows/pr-validation.yaml (aquasecurity/trivy-action, scan-type:
# config). Loaded automatically by Trivy (default filename) and also passed
# explicitly via the action's `trivy-config` input.
#
# Purpose: extend the KSV0125 ("Restrict container images to trusted
# registries") check's trusted-registry list with the organisation's GAR
# pull-through mirror, without disabling or weakening the check itself. See
# .trivy/data/trusted-registries.yaml for the registry list and rationale.
rego:
  data:
    - .trivy/data
