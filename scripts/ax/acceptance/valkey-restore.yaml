apiVersion: batch/v1
kind: Job
metadata:
  name: ax-valkey-restore-acceptance
  namespace: ax-system
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: ax-restore-test
    spec:
      serviceAccountName: ax-restore
      restartPolicy: Never
      volumes:
      - name: backup
        emptyDir:
          sizeLimit: 1Gi
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
      initContainers:
      - name: download
        image: google/cloud-sdk:slim@sha256:7c2dbc4eeba1e500b788be19cae33599cefe3294949a62c034bd1c2002329f69
        command:
        - sh
        - -ec
        - gcloud storage cp "$AX_RDB_SOURCE" /backup/dump.rdb --quiet
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
            cpu: '1'
        volumeMounts:
        - name: backup
          mountPath: /backup
          readOnly: false
        - name: runtime-tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
        env:
        - name: CLOUDSDK_CONFIG
          value: /tmp/gcloud
        - name: AX_RDB_SOURCE
          value: gs://tesseracthub-480811-ax-backups/valkey/20261002T084508Z.rdb
      containers:
      - name: verify
        image: valkey/valkey:9.1.1-alpine@sha256:15568b9cb7eb67f4aed4de018c23f13d344e0e6437b31fe8fb8823dc81ebb3a9
        command:
        - sh
        - -ec
        - "valkey-server --bind 127.0.0.1 --port 6379 --dir /backup --dbfilename dump.rdb\
          \ --appendonly no --save \"\" > /tmp/restore.log 2>&1 &\npid=$!\ntrap 'kill\
          \ \"$pid\" 2>/dev/null || true' EXIT\nfor attempt in $(seq 1 60); do\n \
          \ valkey-cli ping 2>/dev/null | grep -q PONG && break\n  sleep 1\ndone\n\
          test \"$(valkey-cli --raw get ax:acceptance:replication)\" = AX_REPLICATION_OK\n\
          count=$(valkey-cli dbsize)\ntest \"$count\" -gt 0\nprintf 'AX_VALKEY_RESTORE_OK\
          \ keys=%s\\n' \"$count\"\n"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
            cpu: '1'
        volumeMounts:
        - name: backup
          mountPath: /backup
        - name: runtime-tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
  ttlSecondsAfterFinished: 3600
