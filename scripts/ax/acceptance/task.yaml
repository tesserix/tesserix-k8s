apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: ax-runtime-acceptance
  atespace: ax-system
spec:
  debug: true
  command:
    - /bin/sh
    - -ec
    - |
      test -e /workspace/ax-acceptance-marker || printf 'AX_EXECUTION_OK\n' > /workspace/ax-acceptance-marker
      while :; do sleep 60; done
