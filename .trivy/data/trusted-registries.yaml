# Trivy custom check data (KSV0125): registries treated as trusted in addition
# to Trivy's built-in default list (Docker Hub library images, GCR, ECR, ACR).
#
# asia-south1-docker.pkg.dev is the organisation's standard Google Artifact
# Registry pull-through mirror (repo tesseracthub-480811/docker-remote), used
# by essentially every chart in this repository to pull third-party images
# (see `grep -rl asia-south1-docker.pkg.dev charts/`). It is not on Trivy's
# default trusted-registry list because that list only ships the well-known
# public cloud registries (gcr.io, ecr.*.amazonaws.com, azurecr.io) and has
# no way to know about a private organisation-owned mirror.
#
# This does NOT disable KSV0125 - untrusted registries are still flagged.
# cr.agentgateway.dev is solo.io's official agentgateway distribution registry.
# Three deployments in agentgateway-system already run its images; it is not on
# Trivy's default list because that list carries only the public cloud
# registries.
ksv0125:
  trusted_registries:
    - "asia-south1-docker.pkg.dev"
    - "cr.agentgateway.dev"
