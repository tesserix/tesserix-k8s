# Default values for secret-provisioner
replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/global-services/secret-provisioner
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  # Exclude PostgreSQL port from Istio sidecar for connection stability
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Health check configuration
healthCheck:
  livenessPath: /health
  readinessPath: /ready
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Environment variables (non-sensitive)
env:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Database configuration
database:
  host: "global-postgres-rw.global.svc.cluster.local"
  port: "5432"
  name: "secret_provisioner_db"
  user: "postgres"
  sslmode: "require"

# GCP configuration
gcp:
  # Project ID - set in environment-specific values or via ArgoCD
  projectId: "tesseracthub-480811"
  workloadIdentity:
    # GCP Service Account for Workload Identity
    # This SA has roles/secretmanager.admin for full secret management
    gcpServiceAccount: "secret-provisioner-sa@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    # Environment prefix for secret names: devtest, staging, prod
    secretPrefix: "devtest"

# Authorized services that can call the Secret Provisioner API
authorizedServices:
  - admin-bff
  - payment-service
  - shipping-service
  - tenant-onboarding

# KEDA autoscaling
keda:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Pod Disruption Budget
pdb:
  enabled: true
  maxUnavailable: 1

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "512Mi"
  excludeIstioProxy: true
