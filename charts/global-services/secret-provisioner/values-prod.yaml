# Production values for secret-provisioner
replicaCount: 3

image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Production resource limits
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

# Production database
database:
  host: "global-postgres-rw.global.svc.cluster.local"
  port: "5432"
  name: "secret_provisioner_db"
  user: "global"
  sslmode: "require"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    # GCP Service Account with roles/secretmanager.admin
    gcpServiceAccount: "secret-provisioner-sa@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# Environment variables
env:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Production authorized services
authorizedServices:
  - admin-bff
  - payment-service
  - shipping-service
  - tenant-onboarding
  - vendor-service

# Production KEDA autoscaling
keda:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  pollingInterval: 15
  cooldownPeriod: 180
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"

# Production PDB - maintain high availability
pdb:
  enabled: true
  maxUnavailable: 1

# Production VPA
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "128Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true
