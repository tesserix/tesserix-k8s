{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secret-provisioner.fullname" . }}
  labels:
    {{- include "secret-provisioner.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "secret-provisioner.selectorLabels" . | nindent 6 }}
{{- end }}
