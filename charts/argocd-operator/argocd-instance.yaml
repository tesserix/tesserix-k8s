# ArgoCD instance managed by argocd-operator v0.18.0 (Argo CD v3.3.10).
# Prod-ready HA: redis-ha (3+3 haproxy), controller sharding replicas=3
# (consistent-hashing), repo replicas=3, server replicas=2. Memory-only
# resources (no CPU limits/requests). SSO = Dex/GitHub + local admin fallback.
# resourceTrackingMethod=annotation (matches the 217 existing Applications).
# This file is the canonical desired state, GitOps-managed self-referentially
# via argocd/prod/infrastructure/argocd.yaml. Fields include operator-
# materialized CRD defaults so the self-managing app stays Synced.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  applicationInstanceLabelKey: argocd.argoproj.io/instance
  applicationSet:
    enabled: true
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  controller:
    env:
    - name: ARGOCD_CONTROLLER_SHARDING_ALGORITHM
      value: consistent-hashing
    - name: ARGOCD_APPLICATION_CONTROLLER_REPO_SERVER_TIMEOUT_SECONDS
      value: '120'
    parallelismLimit: 25
    processors:
      operation: 25
      status: 50
    resources:
      limits:
        memory: 3Gi
      requests:
        memory: 1Gi
    sharding:
      enabled: true
      replicas: 3
  disableAdmin: false
  extraConfig:
    admin.enabled: 'true'
    application.sync.impersonation.enabled: 'false'
    exec.enabled: 'false'
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: "jsonPointers:\n  -\
      \ /spec/target/deletionPolicy\n  - /spec/target/template/mergePolicy\n  - /spec/target/template/engineVersion\n\
      jqPathExpressions:\n  - '.spec.data[]?.remoteRef.conversionStrategy'\n  - '.spec.data[]?.remoteRef.decodingStrategy'\n\
      \  - '.spec.data[]?.remoteRef.metadataPolicy'\n"
    resource.customizations.ignoreDifferences.kargo.akuity.io_ClusterPromotionTask: "managedFieldsManagers:\n\
      \  - kargo\n"
    resource.customizations.ignoreDifferences.kargo.akuity.io_PromotionTask: "managedFieldsManagers:\n\
      \  - kargo\n"
    resource.customizations.ignoreDifferences.kargo.akuity.io_Stage: "managedFieldsManagers:\n  - kargo\n\
      jqPathExpressions:\n  - '.spec.promotionTemplate.spec.steps[]?.retry.timeout'\n"
    resource.customizations.ignoreDifferences.kargo.akuity.io_Warehouse: "managedFieldsManagers:\n  -\
      \ kargo\njqPathExpressions:\n  - '.spec.interval'\n  - '.spec.subscriptions[]?.git.strictSemvers'\n\
      \  - '.spec.subscriptions[]?.git.discoveryLimit'\n  - '.spec.subscriptions[]?.git.commitSelectionStrategy'\n\
      \  - '.spec.subscriptions[]?.image.strictSemvers'\n  - '.spec.subscriptions[]?.image.discoveryLimit'\n\
      \  - '.spec.subscriptions[]?.chart.strictSemvers'\n  - '.spec.subscriptions[]?.chart.discoveryLimit'\n"
    resource.customizations.ignoreDifferences.postgresql.cnpg.io_Cluster: "jsonPointers:\n  - /spec/affinity\n\
      \  - /spec/inheritedMetadata\n  - /spec/enablePDB\n  - /spec/logLevel\n  - /spec/maxSyncReplicas\n\
      \  - /spec/minSyncReplicas\n  - /spec/postgresGID\n  - /spec/postgresUID\n  - /spec/replicationSlots\n\
      \  - /spec/smartShutdownTimeout\n  - /spec/startDelay\n  - /spec/stopDelay\n  - /spec/monitoring/customQueriesConfigMap\n\
      jqPathExpressions:\n  - '.spec.postgresql.parameters | keys[] | select(. == \"archive_mode\" or\
      \ . == \"archive_timeout\")'\n  - '.spec.bootstrap.initdb.encoding'\n  - '.spec.backup.barmanObjectStore.data'\n\
      \  - '.spec.managed.roles[]?.connectionLimit'\n  - '.spec.managed.roles[]?.inherit'\n\n"
    resource.customizations.ignoreResourceUpdates.all: "jsonPointers:\n  - /status\n"
    resource.customizations.ignoreResourceUpdates.argoproj.io_Application: "jqPathExpressions:\n  - '.metadata.annotations.\"\
      notified.notifications.argoproj.io\"'\n  - '.metadata.annotations.\"argocd.argoproj.io/refresh\"\
      '\n  - '.operation'\n"
    timeout.reconciliation: 180s
    url: https://argocd.tesserix.app
  grafana:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  ha:
    enabled: true
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
  image: quay.io/argoproj/argocd
  imageUpdater:
    enabled: false
  initialSSHKnownHosts: {}
  monitoring:
    enabled: false
  networkPolicy: {}
  notifications:
    enabled: true
    replicas: 1
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 128Mi
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  rbac:
    defaultPolicy: ''
    policy: 'g, samyak.rout@gmail.com, role:admin

      g, unidevidp@gmail.com, role:admin

      g, mahesh.sangawar@gmail.com, role:admin

      p, role:admin, applications, *, */*, allow

      p, role:admin, clusters, *, *, allow

      p, role:admin, repositories, *, *, allow

      p, role:admin, projects, *, *, allow

      p, role:admin, logs, get, */*, allow

      p, role:admin, exec, create, */*, allow

      p, role:operator, applications, get, */*, allow

      p, role:operator, applications, sync, */*, allow

      p, role:operator, logs, get, */*, allow

      p, role:operator, projects, get, *, allow

      g, claude-agent@tesseracthub-480811.iam.gserviceaccount.com, role:operator

      '
    policyMatcherMode: glob
    scopes: '[email]'
  redis:
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
  repo:
    env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: 300s
    replicas: 3
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 640Mi
  resourceExclusions: "- apiGroups: [\"\", \"discovery.k8s.io\"]\n  kinds: [\"Endpoints\", \"EndpointSlice\"\
    ]\n- apiGroups: [\"coordination.k8s.io\"]\n  kinds: [\"Lease\"]\n"
  resourceHealthChecks:
  - check: "hs = {}\nif obj.status ~= nil and obj.status.phase ~= nil then\n  if obj.status.phase == \"\
      Available\" then\n    hs.status = \"Healthy\"\n    hs.message = \"ArgoCD phase: Available\"\n  \
      \  return hs\n  end\n  hs.status = \"Progressing\"\n  hs.message = \"ArgoCD phase: \" .. obj.status.phase\n\
      \  return hs\nend\nhs.status = \"Progressing\"\nhs.message = \"Waiting for ArgoCD status\"\nreturn\
      \ hs\n"
    group: argoproj.io
    kind: ArgoCD
  resourceTrackingMethod: annotation
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    insecure: true
    replicas: 2
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
    route:
      enabled: false
    service:
      type: ClusterIP
  sso:
    dex:
      config: "connectors:\n  - type: github\n    id: github\n    name: GitHub\n    config:\n      clientID:\
        \ Iv23liR8HRPwZbCwTeCD\n      clientSecret: $argocd-github-oauth:client-secret\n      orgs: []\n\
        \      loadAllGroups: false\n      useLoginAsID: false\n"
    provider: dex
  tls:
    ca: {}
  version: v3.3.10
