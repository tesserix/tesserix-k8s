apiVersion: operator.knative.dev/v1beta1
kind: KnativeEventing
metadata:
  name: knative-eventing
  namespace: knative-eventing
spec:
  version: {{ .Values.version | quote }}

  # High availability
  high-availability:
    replicas: {{ .Values.highAvailability.replicas }}

  config:
    # Default broker configuration
    br-defaults:
      default-br-config: |
        clusterDefault:
          brokerClass: {{ .Values.defaultBrokerClass }}
          apiVersion: v1
          kind: ConfigMap
          name: config-br-default-channel
          namespace: knative-eventing

    # Default channel template
    default-ch-webhook:
      default-ch-config: |
        clusterDefault:
          apiVersion: {{ .Values.defaultChannelTemplate.apiVersion }}
          kind: {{ .Values.defaultChannelTemplate.kind }}

    # Logging
    logging:
      loglevel.controller: info
      loglevel.webhook: info

    # Observability
    observability:
      metrics.backend-destination: prometheus
