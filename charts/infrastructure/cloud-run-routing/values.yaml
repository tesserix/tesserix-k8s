# Cloud Run Routing — Istio ServiceEntry + DestinationRule
# Registers Cloud Run services in the Istio mesh so VirtualServices
# can route traffic to them.
#
# Each entry creates:
#   1. ServiceEntry  (MESH_EXTERNAL, DNS resolution, port 443 TLS)
#   2. DestinationRule (TLS SIMPLE origination with SNI)

# Namespace where ServiceEntry/DestinationRule are created
namespace: marketplace

# Cloud Run services to register in the mesh
# Key format: {product}-{service} (must match Cloud Run service name)
services:
  # =========================================================================
  # Global Services
  # =========================================================================
  global-analytics-service:
    host: global-analytics-service-un6tyb5opq-el.a.run.app
