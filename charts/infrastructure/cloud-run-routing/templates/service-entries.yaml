{{- range $name, $svc := .Values.services }}
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: cr-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: cloud-run-routing
    app.kubernetes.io/component: service-entry
spec:
  hosts:
    - {{ $svc.host }}
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: https
      protocol: TLS
  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: cr-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: cloud-run-routing
    app.kubernetes.io/component: destination-rule
spec:
  host: {{ $svc.host }}
  trafficPolicy:
    tls:
      mode: SIMPLE
      sni: {{ $svc.host }}
{{- end }}
