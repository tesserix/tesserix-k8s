# Production overrides for libretranslate
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation (ML models need more resources)
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 384Mi

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1
