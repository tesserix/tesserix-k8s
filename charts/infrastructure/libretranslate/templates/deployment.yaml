apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "libretranslate.fullname" . }}
  labels:
    {{- include "libretranslate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "libretranslate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "libretranslate.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "libretranslate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: LT_THREADS
              value: {{ .Values.config.threads | quote }}
            - name: LT_CHAR_LIMIT
              value: {{ .Values.config.charLimit | quote }}
            - name: LT_REQ_LIMIT
              value: {{ .Values.config.reqLimit | quote }}
            - name: LT_REQ_LIMIT_STORAGE
              value: "memory://"
            - name: LT_BATCH_LIMIT
              value: {{ .Values.config.batchLimit | quote }}
            - name: LT_FRONTEND_LANGUAGE_SOURCE
              value: {{ .Values.config.frontendSourceLang | quote }}
            - name: LT_FRONTEND_LANGUAGE_TARGET
              value: {{ .Values.config.frontendTargetLang | quote }}
            - name: LT_FRONTEND_TIMEOUT
              value: {{ .Values.config.frontendTimeout | quote }}
            - name: LT_LOAD_ONLY
              value: {{ .Values.config.loadOnly | quote }}
            - name: LT_SUGGESTIONS
              value: {{ .Values.config.suggestions | quote }}
            - name: LT_DISABLE_WEB_UI
              value: {{ .Values.config.disableWebUI | quote }}
            - name: LT_UPDATE_MODELS
              value: {{ .Values.config.updateModels | quote }}
            {{- if .Values.config.apiKeys }}
            - name: LT_API_KEYS
              value: {{ .Values.config.apiKeys | quote }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: models-storage
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: {{ include "libretranslate.fullname" . }}-models
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
