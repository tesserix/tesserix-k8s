{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tunnel.existingSecret }}
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.tunnel.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.tunnel.existingSecretKey }}
      remoteRef:
        key: {{ required "externalSecrets.remoteKey is required" .Values.externalSecrets.remoteKey }}
        {{- with .Values.externalSecrets.remoteProperty }}
        property: {{ . }}
        {{- end }}
{{- end }}
