# FanZone Cloudflared Tunnel - separate CF account
fullnameOverride: "cloudflared-fanzone"

replicaCount: 2

tunnel:
  existingSecret: "cloudflare-fanzone-tunnel-token"
  existingSecretKey: "token"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStore: "gcp-secret-store"
  gcpSecretKey: "prod-fanzone-cloudflare-tunnel-token"
