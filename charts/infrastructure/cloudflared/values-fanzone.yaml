# FanZone Cloudflared Tunnel - separate CF account
fullnameOverride: "cloudflared-fanzone"

replicaCount: 0  # parked — fanzone scaled to zero; flip back to 2 to revive public traffic

tunnel:
  existingSecret: "cloudflare-fanzone-tunnel-token"
  existingSecretKey: "token"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStore: "gcp-secret-store"
  remoteKey: "prod-fanzone-cloudflare-tunnel-token"
