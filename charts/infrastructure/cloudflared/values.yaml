# =============================================================================
# Cloudflare Zero Trust Tunnel Configuration
# =============================================================================
# This chart deploys cloudflared to establish a secure tunnel from the cluster
# to Cloudflare's edge, eliminating the need for a public IP on the ingress.
# =============================================================================

# Deployment configuration
replicaCount: 2

# Replace before surging (mark8ly-platform-api#709, and the same remedy as
# temporal #538 and devai #600).
#
# This chart had NO strategy block, so it inherited Kubernetes' 25%/25%
# default — which at 2 replicas rounds to maxSurge=1, maxUnavailable=0: the
# new pod must SCHEDULE BEFORE an old one dies. On a cluster whose memory
# requests sit near 100% the new pod pends forever and the rollout deadlocks,
# with the Deployment still reporting Available=True because the old pods keep
# serving. That left seven mark8ly deployments stuck on 2026-08-30 with
# nothing alerting.
#
# For cloudflared specifically that failure mode is worse than for an app: a
# deadlocked rollout means the tunnel silently stays on the old image, which
# is exactly how 2026.2.0 survived a bump to 2026.3.0 in git. And there is no
# downtime cost here — at 2+ replicas one connector keeps serving while the
# other is replaced, and the PDB (minAvailable: 1) enforces that independently.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/cloudflare/cloudflared
  # 2026.2.0 logged "Your version is outdated" since 07:37 UTC and
  # had several stuck "Incoming request ended abruptly: context
  # canceled" episodes. Bump to the upstream-recommended release.
  #
  # THIS IS NOW THE ONLY PLACE THE TAG IS SET. Until 2026-09-21 the prod
  # ArgoCD Application carried inline `image.tag: "2026.2.0"`, which
  # overrides this file — so the bump above sat in git looking shipped
  # while production ran 2026.2.0 and ArgoCD reported Synced. That
  # override is gone; see argocd/prod/infrastructure/cloudflared.yaml.
  #
  # NOT on 2026.9.1, which cloudflared itself recommends, and that is a
  # deliberate hold rather than an oversight: 2026.8.0 strips trailing
  # slashes from requests to HTTP origins and 2026.8.1 normalizes paths,
  # both of which reach this tunnel's origin (istio-ingressgateway, plain
  # HTTP) and both of which broke real applications upstream. 2026.8.2+
  # resolved them, but moving there wants a deliberate check of path and
  # trailing-slash handling against the Next.js apps, not a same-day jump
  # during an incident. Tracked separately.
  tag: "2026.3.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Tunnel configuration
tunnel:
  # The tunnel token is provided via a Kubernetes secret
  # This secret should be created via ExternalSecrets from GCP Secret Manager
  existingSecret: "cloudflare-tunnel-token"
  existingSecretKey: "token"

  # Tunnel metrics port (for Prometheus scraping)
  metricsPort: 2000

  # Protocol preference (auto, http2, quic)
  protocol: "auto"

  # Grace period for tunnel shutdown
  gracePeriod: "30s"

  # Retries for tunnel connection
  retries: 5

  # Edge IP version preference (auto, 4, 6)
  edgeIpVersion: "auto"

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2000"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Resource limits and requests
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  # requests, and an HPA cannot compute CPU utilisation without a request
  # to divide by -- the metric reads <unknown> and the HPA never scales on
  # it. Memory is the only usable signal here.
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity - prefer spreading across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloudflared
          topologyKey: kubernetes.io/hostname

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Health check service (internal)
healthService:
  enabled: true
  port: 2000
  type: ClusterIP

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /ready
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ExternalSecrets configuration
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStore: "gcp-secret-store"
  # ClusterSecretStore for gcp-secret-store; SecretStore for the namespaced
  # `openbao-<app>` store the openbao chart renders per whitelisted app.
  secretStoreKind: ClusterSecretStore
  remoteKey: "devtest-cloudflare-tunnel-token"
  # OpenBao only: which field of the KV entry holds the token.
  remoteProperty: ""
