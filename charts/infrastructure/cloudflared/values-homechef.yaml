# HomeChef Cloudflared Tunnel - fe3dr.com
fullnameOverride: "cloudflared-homechef"

replicaCount: 2

tunnel:
  existingSecret: "cloudflare-homechef-tunnel-token"
  existingSecretKey: "token"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStore: "gcp-secret-store"
  gcpSecretKey: "prod-homechef-cloudflare-tunnel-token"
