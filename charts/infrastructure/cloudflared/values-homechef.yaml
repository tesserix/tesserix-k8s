# HomeChef Cloudflared Tunnel - fe3dr.com
fullnameOverride: "cloudflared-homechef"

replicaCount: 2

tunnel:
  existingSecret: "cloudflare-homechef-tunnel-token"
  existingSecretKey: "token"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  # Namespaced store rendered by the openbao chart from its namespaceWhitelist;
  # ESO authenticates as the cloudflared-homechef SA.
  secretStore: "openbao-cloudflared-homechef"
  secretStoreKind: SecretStore
  remoteKey: "cloudflared/cloudflared-homechef/tunnel"
  remoteProperty: "token"
