# GameVerse Cloudflared Tunnel - stayandplays.com
fullnameOverride: "cloudflared-gameverse"

replicaCount: 2

tunnel:
  existingSecret: "cloudflare-gameverse-tunnel-token"
  existingSecretKey: "token"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStore: "gcp-secret-store"
  remoteKey: "prod-gameverse-cloudflare-tunnel-token"
