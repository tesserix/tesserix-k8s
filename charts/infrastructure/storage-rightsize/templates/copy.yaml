{{- if eq .namespace "openpanel" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .target }}-v3
  namespace: {{ .namespace }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: storage-rightsize
