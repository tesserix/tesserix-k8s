    spec:
      serviceAccountName: storage-rightsize
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: {{ $.Values.image }}
          command: [python, -u, /scripts/copy.py]
          env:
            - name: SOURCE_CLAIM
              value: {{ .name }}
            - name: SOURCE_UID
              value: {{ .sourceUID }}
            - name: TARGET_CLAIM
              value: {{ .target }}
            - name: TARGET_UID
