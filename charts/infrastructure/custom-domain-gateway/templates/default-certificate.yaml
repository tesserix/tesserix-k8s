# ClusterIssuer for custom domain certificates using DNS-01 with CNAME delegation.
# Customers add: _acme-challenge.<domain> CNAME _acme-challenge.<domain>.acme.mark8ly.com
# cert-manager follows the CNAME chain to our Cloudflare zone and solves the challenge.
# This works without the customer pointing their domain to our infrastructure first.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-custom-domain
  labels:
    app.kubernetes.io/name: letsencrypt-custom-domain
    app.kubernetes.io/component: certificate
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email | default "admin@tesserix.app" }}
    privateKeySecretRef:
      name: letsencrypt-custom-domain-account-key
    solvers:
      # DNS-01 with CNAME delegation — works for any custom domain
      # Customer adds _acme-challenge CNAME pointing to our zone
      # cert-manager follows the CNAME and creates TXT record via Cloudflare API
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
          cnameStrategy: Follow
---
# Self-Signed Issuer for fallback certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: custom-domain-selfsigned
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/name: custom-domain-selfsigned
    app.kubernetes.io/component: certificate
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selfSigned: {}
---
# Default Certificate for Custom Domain Gateway
# This is a self-signed fallback certificate for the gateway.
# Actual tenant certificates are created by tenant-router-service via cert-manager with Let's Encrypt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: custom-domain-default-tls
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/name: custom-domain-default-tls
    app.kubernetes.io/component: certificate
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  secretName: custom-domain-default-tls
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    # Placeholder - this cert is only used if no tenant cert matches
    - "fallback.custom-domain.internal"
  issuerRef:
    name: custom-domain-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# PeerAuthentication for mTLS within the mesh
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: custom-ingress-mtls
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/name: custom-ingress-mtls
    app.kubernetes.io/component: security
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.gateway.selector | nindent 6 }}
  mtls:
    mode: STRICT
  portLevelMtls:
    # Allow plaintext on port 80 (HTTP redirect) and 443 (TLS termination)
    80:
      mode: DISABLE
    443:
      mode: DISABLE
