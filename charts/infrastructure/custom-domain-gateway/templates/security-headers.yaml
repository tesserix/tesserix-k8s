{{- if .Values.securityHeaders.enabled }}
{{- /*
Security Headers EnvoyFilter
Adds security headers to all responses from custom domain gateway
*/ -}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: custom-domain-security-headers
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/name: custom-domain-security-headers
    app.kubernetes.io/component: security
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  workloadSelector:
    labels:
      {{- toYaml .Values.gateway.selector | nindent 6 }}
  configPatches:
    # =================================================================
    # Add Security Headers to All Responses
    # =================================================================
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_response(response_handle)
                local h = response_handle:headers()

                -- SET ONLY IF THE UPSTREAM DID NOT. Envoy's Lua `add` APPENDS,
                -- so calling it on a header the app already sent emits it twice
                -- and browser behaviour on conflicting values is undefined
                -- (tesserix/mark8ly#596). `replace` would stop the duplication
                -- but would also overwrite an app that chose something stricter
                -- than this baseline. The gateway is a floor, not a ceiling.
                local function default(name, value)
                  if h:get(name) == nil then
                    h:add(name, value)
                  end
                end

                {{- if .Values.securityHeaders.hsts.enabled }}
                -- Strict-Transport-Security
                local hsts_value = "max-age={{ .Values.securityHeaders.hsts.maxAge }}"
                {{- if .Values.securityHeaders.hsts.includeSubDomains }}
                hsts_value = hsts_value .. "; includeSubDomains"
                {{- end }}
                {{- if .Values.securityHeaders.hsts.preload }}
                hsts_value = hsts_value .. "; preload"
                {{- end }}
                h:replace("Strict-Transport-Security", hsts_value)
                {{- end }}

                {{- if .Values.securityHeaders.xFrameOptions.enabled }}
                -- X-Frame-Options
                default("X-Frame-Options", "{{ .Values.securityHeaders.xFrameOptions.value }}")
                {{- end }}

                {{- if .Values.securityHeaders.xContentTypeOptions.enabled }}
                -- X-Content-Type-Options
                default("X-Content-Type-Options", "{{ .Values.securityHeaders.xContentTypeOptions.value }}")
                {{- end }}

                {{- if .Values.securityHeaders.xXssProtection.enabled }}
                -- X-XSS-Protection
                default("X-XSS-Protection", "{{ .Values.securityHeaders.xXssProtection.value }}")
                {{- end }}

                {{- if .Values.securityHeaders.referrerPolicy.enabled }}
                -- Referrer-Policy
                default("Referrer-Policy", "{{ .Values.securityHeaders.referrerPolicy.value }}")
                {{- end }}

                {{- if .Values.securityHeaders.permissionsPolicy.enabled }}
                -- Permissions-Policy
                default("Permissions-Policy", "{{ .Values.securityHeaders.permissionsPolicy.value }}")
                {{- end }}

                -- Remove server identification headers
                h:remove("Server")
                h:remove("X-Powered-By")
              end
{{- end }}
