# =================================================================
# Custom Domain Gateway Configuration
# =================================================================
# This chart configures Istio Gateway and security policies for
# custom domain ingress (non-Cloudflare traffic)
# =================================================================

# Cert-manager configuration for automatic certificate issuance
certManager:
  # Email for Let's Encrypt account registration
  email: "admin@tesserix.app"
  # ClusterIssuer name for custom domains (created by this chart)
  clusterIssuer: letsencrypt-custom-domain

# Gateway configuration
gateway:
  name: custom-domain-gateway
  namespace: istio-ingress

  # Selector must match the custom-ingressgateway labels
  selector:
    istio: custom-ingressgateway

  # TLS configuration
  tls:
    # Minimum TLS version (TLSV1_2 recommended)
    minProtocolVersion: TLSV1_2
    # Strong cipher suites only
    cipherSuites:
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256

# Security headers configuration
securityHeaders:
  enabled: true

  # Strict-Transport-Security
  hsts:
    enabled: true
    maxAge: 31536000  # 1 year
    includeSubDomains: true
    preload: true

  # Content-Security-Policy
  csp:
    enabled: true
    # Default restrictive policy - customize per tenant if needed
    policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'"

  # X-Frame-Options
  xFrameOptions:
    enabled: true
    value: "DENY"

  # X-Content-Type-Options
  xContentTypeOptions:
    enabled: true
    value: "nosniff"

  # X-XSS-Protection
  xXssProtection:
    enabled: true
    value: "1; mode=block"

  # Referrer-Policy
  referrerPolicy:
    enabled: true
    value: "strict-origin-when-cross-origin"

  # Permissions-Policy (formerly Feature-Policy)
  permissionsPolicy:
    enabled: true
    value: "accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()"

# Rate limiting configuration
rateLimiting:
  enabled: true

  # Global rate limit (requests per second per IP)
  global:
    requestsPerSecond: 100
    burstSize: 200

  # Per-path rate limits (more restrictive for sensitive endpoints)
  paths:
    # Login/auth endpoints
    - path: "/api/v1/auth"
      requestsPerSecond: 10
      burstSize: 20
    # Password reset
    - path: "/api/v1/password"
      requestsPerSecond: 3
      burstSize: 5
    # Checkout/payment
    - path: "/api/v1/checkout"
      requestsPerSecond: 20
      burstSize: 40

# Connection limits
connectionLimits:
  enabled: true
  maxConnections: 10000
  maxPendingRequests: 1000
  maxRequests: 10000
  maxRetries: 3

# Request size limits
requestLimits:
  enabled: true
  # Maximum request body size (in bytes)
  maxRequestBytes: 10485760  # 10MB

# Timeout configuration
timeouts:
  # Connection timeout
  connectTimeout: 10s
  # Request timeout
  requestTimeout: 60s
  # Idle timeout
  idleTimeout: 300s

# CORS configuration (can be overridden per VirtualService)
cors:
  enabled: false  # Usually handled at VirtualService level
  allowOrigins: []
  allowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowHeaders:
    - Authorization
    - Content-Type
    - X-Requested-With
  exposeHeaders: []
  maxAge: 86400
  allowCredentials: true

# Logging configuration
logging:
  # Access log format
  accessLog:
    enabled: true
    format: JSON
  # Include request/response headers in logs (be careful with sensitive data)
  includeRequestHeaders: false
  includeResponseHeaders: false
