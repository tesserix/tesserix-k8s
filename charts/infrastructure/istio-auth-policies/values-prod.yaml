# Production overrides for istio-auth-policies
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production authentication policies
authorizationPolicies:
  enabled: true
  strictMtls: true

# Production frontend apps with mark8ly.com domain
#
# INERT IN PROD. argocd/prod/infrastructure/istio-auth-policies.yaml re-declares
# frontendApps inline, and an inline `values:` block beats every valueFile — so
# a host added here alone is never served and the gateway keeps returning 403.
# Add it there.
frontendApps:
  - name: storefront
    label: storefront
    hosts:
      - "*.mark8ly.com"  # Wildcard for tenant subdomains
  - name: growthbook
    label: growthbook
    namespace: growthbook
    hosts:
      - "growthbook.mark8ly.com"
  - name: kibana
    label: kibana
    hosts:
      - "kibana.tesserix.app"
  - name: grafana
    label: grafana
    hosts:
      - "grafana.tesserix.app"
  - name: openpanel
    label: openpanel
    hosts:
      - "analytics.tesserix.app"
  # fanzone — DECOMMISSIONED. The namespace no longer exists, so the
  # namespace-scoped policy this entry generated failed to apply with
  # `namespaces "fanzone" not found`. ArgoCD applies a sync atomically, so that
  # one dead object wedged the ENTIRE chart OutOfSync: every later edit to any
  # host in this file silently never reached the cluster. Removed rather than
  # left to rot. Restore from git history alongside the namespace if fanzone
  # ever comes back.
  # The Dwellm8 API host, homechef-api's pattern: the gateway admits the host
  # unauthenticated because the API authenticates every request itself
  # (GIP bearer per surface, ADR-0027) — the gateway's JWT layer would be a
  # second copy of that rule, checking a different issuer.
  - name: dwellm8-api
    label: dwellm8-api
    hosts:
      - "api.dwellm8.com"
  - name: homechef-web
    label: homechef-web
    hosts:
      - "fe3dr.com"
      - "www.fe3dr.com"
      - "vendors.fe3dr.com"
      - "delivery.fe3dr.com"
      - "api.fe3dr.com"
      - "auth.fe3dr.com"
      - "identity.fe3dr.com"
      - "internal-identity.fe3dr.com"
  - name: tesserix-company
    label: company
    namespace: tesserix
    hosts:
      - "tesserix.app"
      - "www.tesserix.app"
  # tesserix-console — the operator console (Deployment/console, same namespace
  # as company). Without an entry here the gateway denies the host outright and
  # the browser sees Envoy's "RBAC: access denied" 403 — the app itself is
  # healthy and never sees the request. The console does its own session check
  # in middleware and redirects anonymous visitors to the login on tesserix.app,
  # so the gateway ALLOW is not what protects it.
  - name: tesserix-console
    label: console
    namespace: tesserix
    hosts:
      - "console.tesserix.app"
  # yes-hospital — Next.js marketing site. Drives the gateway-level ALLOW
  # for the host AND the per-app allow-yes-hospital-public policy in the
  # yes-hospital namespace (which is in the default-ambient deny-all mesh).
  - name: yes-hospital
    label: yes-hospital
    namespace: yes-hospital
    hosts:
      - "yes-hospital.tesserix.app"
  # tesserix-blog MUST stay listed here. The frontendApps list drives both
  # the per-app ALLOW policy AND the gateway-level aggregate ALLOW
  # (allow-frontend-apps-public). Dropping the entry removed blog.tesserix.app
  # from the gateway ALLOW hosts list, which made the ingress gateway return
  # 403 "RBAC: access denied" on every request. Drain churn is now mitigated
  # at higher layers (ArgoCD client-side apply + VS retries + preStop drain).
  - name: tesserix-blog
    label: tesserix-blog
    namespace: tesserix
    hosts:
      - "blog.tesserix.app"
      - "identity-blog.tesserix.app"
  - name: tesserix-docs
    label: tesserix-docs
    namespace: tesserix
    hosts:
      - "docs.tesserix.app"
  - name: tesserix-storybook
    label: tesserix-storybook
    namespace: tesserix
    hosts:
      - "ui.tesserix.app"
  # postiz — self-hosted social scheduler (charts/apps/postiz). Public UI;
  # Postiz enforces its own JWT auth. Entry drives the gateway-level ALLOW
  # host (without it the ingress gateway returns 403 "RBAC: access denied").
  - name: postiz
    label: postiz
    namespace: postiz
    hosts:
      - "postiz.tesserix.app"
  # observability — the telemetry explorer (obs-ui) and its query API
  # (obs-api), split by path on one host by the observability VirtualService.
  #
  # This entry is what puts observability.tesserix.app in the gateway's ALLOW
  # host list. Without it the ingress gateway returns 403 "RBAC: access denied"
  # before any route is consulted — the same failure recorded above for
  # blog.tesserix.app. DNS and the tunnel already reach the cluster via the
  # *.tesserix.app wildcard, so this policy is the only thing standing between
  # the domain and a working page.
  #
  # Public at the gateway on purpose: obs-api enforces Google sign-in against a
  # three-address allowlist itself, and the sign-in page has to be reachable
  # unauthenticated for that to be possible.
  - name: observability
    label: obs-ui
    namespace: observability
    hosts:
      - "observability.tesserix.app"
  - name: opencost
    label: opencost
    hosts:
      - "costestimator.tesserix.app"
      - "kubecost.tesserix.app"
  # falco — gateway host ALLOW only; the oauth2-proxy in the falco namespace
  # (falco-ui-gateway chart) enforces Zitadel OIDC + an email allowlist, and
  # its sign-in redirect must be reachable unauthenticated. No `namespace`:
  # the falco namespace is not in the mesh.
  - name: falco
    label: falco-ui-oauth2-proxy
    hosts:
      - "falco.tesserix.app"
  # onboarding — gateway host ALLOW only; the chart ships pod-level ALLOWs for
  # both api and web. Public here on purpose, like observability above: the API
  # gates the console on Google sign-in against console.adminEmails, and the
  # sign-in page must be reachable unauthenticated for that to work.
  - name: onboarding
    label: onboarding-web
    hosts:
      - "onboard.tesserix.app"
  # planning-poker — gateway host ALLOW only. No `namespace`: the chart
  # already ships pod-level ALLOWs for both web and api.
  - name: planning-poker
    label: planning-poker-web
    hosts:
      - "planningpoker.tesserix.app"
  - name: stockpilot-web
    label: stockpilot-web
    namespace: stockpilot
    hosts:
      - "stockpilot.tesserix.app"
  - name: stockpilot-api
    label: stockpilot-api
    namespace: stockpilot
    hosts:
      - "stockpilot.tesserix.app"
  - name: internal-identity-tesserix
    label: internal-identity-tesserix
    hosts:
      - "internal-identity.tesserix.app"
  - name: identity-stock-tesserix
    label: identity-stock-tesserix
    hosts:
      - "identity-stock.tesserix.app"
  - name: identity-sre-tesserix
    label: identity-sre-tesserix
    hosts:
      - "identity-sre.tesserix.app"
  # scrapper — DECOMMISSIONED 2026-07-26. Removed WITH the namespace, not
  # after it: a frontendApps entry whose namespace does not exist fails to
  # apply, and ArgoCD syncs atomically, so it would wedge this entire chart
  # OutOfSync — the exact failure fanzone caused, which silently blocked
  # every host edit here for weeks.
  # social / horoscope namespaces are not currently deployed. Keep their
  # gateway host-allow entries but omit `namespace:` so the per-app pod
  # policy isn't attempted in a missing namespace (which fails the whole
  # app sync with "namespaces ... not found"). Re-add `namespace:` when
  # the product is redeployed.
  - name: social-web
    label: social-web
    hosts:
      - "social.tesserix.app"
  - name: horoscope-web
    label: horoscope-web
    hosts:
      - "astronomy.tesserix.app"
  - name: horoscope-api
    label: horoscope-api
    hosts:
      - "astronomy.tesserix.app"

  # DEAD ENTRY — kept only as a signpost. See the warning below.
  #
  # Helivanta (#824 slice 1b). The ingress gateway default-denies, so a host
  # absent from this list gets Envoy's "RBAC: access denied" — a 403 with no
  # hint that an allowlist is the reason. helivanta.app reached exactly that
  # state once its tunnel connector came up: routing, VirtualService and pods
  # all correct, and still 403.
  #
  # Only the apex. *.helivanta.app is deliberately NOT added: nothing serves a
  # subdomain yet, and the per-zone subdomain decision is still open (#890).
  # Widening an ingress allowlist ahead of a use is how a host becomes
  # reachable before anyone has decided it should be.
  - name: helivanta
    label: helivanta
    hosts:
      - "helivanta.app"

# ============================================================================
# WARNING: the frontendApps list ABOVE HAS NO EFFECT in production.
#
# argocd/prod/infrastructure/istio-auth-policies.yaml passes BOTH an inline
# `helm.values` block and `valueFiles: [values.yaml, values-prod.yaml]`, and
# inline values take precedence — so the inline frontendApps replaces this one
# wholesale rather than merging with it.
#
# Adding a host here therefore renders correctly with `helm template` locally,
# merges, syncs green, and changes nothing in the cluster. That happened: #423
# added helivanta.app here, ArgoCD reported Synced at that exact commit, and
# the live policy never gained the host. #424 fixed it by editing the inline
# list instead.
#
# Add hosts to the INLINE list in the Application, not here.
# ============================================================================

# =============================================================================
# Production Google Identity Platform Configuration
#
# Required by mobile-admin (and any future native client), which authenticates
# with a GIP Bearer id_token. Without this rule Envoy rejects every GIP token at
# the gateway with 401 "Jwt issuer is not configured" — the request never
# reaches marketplace-api. Verified 2026-07-15 against prod with a real token.
#
# Additive: Istio merges jwtRules across policies on the same workload, so this
# adding one does not disturb the others.
# =============================================================================
gip:
  enabled: true
  issuer: "https://securetoken.google.com/tesseracthub-480811"
  jwksUri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
  audiences:
    - "tesseracthub-480811"

# =============================================================================
# Additional GIP projects (see extraGip in values.yaml for the contract)
#
# Kora has its own Firebase project, kora-app-e6d38 — the shared tesseracthub
# project has zero apps registered, so no Kora client could ever obtain a token
# it would accept. kora-api validates kora-app-e6d38 (charts/apps/kora-api
# values.yaml FIREBASE_PROJECT_ID), but the gateway rejected those tokens with
# 401 first, which is why kora_db held 0 users and 0 food_logs: nobody had ever
# successfully authenticated.
#
# The Kora rule in allow-public-api-endpoints already lets /v1/* through
# unauthenticated because the Go backend verifies Firebase tokens itself. That
# covers AUTHORIZATION; this covers AUTHENTICATION, which is enforced
# separately and is what was rejecting the token.
# =============================================================================
extraGip:
  - name: "-kora"
    issuer: "https://securetoken.google.com/kora-app-e6d38"
    jwksUri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
    audiences:
      - "kora-app-e6d38"
    restrictToHosts:
      - "kora-api.tesserix.app"

# =============================================================================
# Google OIDC — Cloud Pub/Sub push authentication
#
# Pub/Sub push subscriptions (e.g. mp-merchant-push-delivery → marketplace-api
# /pubsub/merchant-push) present a Google-signed OIDC token issued by
# accounts.google.com. Without this rule the gateway rejects it with 401 "Jwt
# issuer is not configured" before it reaches the service. Additive — merges
# with the gip rules; the service still enforces audience + SA.
# =============================================================================
googleOidc:
  enabled: true
  issuer: "https://accounts.google.com"
  jwksUri: "https://www.googleapis.com/oauth2/v3/certs"

# Production app namespaces
appNamespaces:
  global: global
  # fanzone removed — the namespace is decommissioned, and this key generated
  # an allow-mesh-internal policy INTO it, which is the object that failed to
  # apply and wedged the whole chart.

# Production mesh principals (service accounts trusted for internal communication)
meshPrincipals:
  - "cluster.local/ns/global/sa/*"
  - "cluster.local/ns/tesserix/sa/*"
  - "cluster.local/ns/fanzone/sa/*"
  - "cluster.local/ns/homechef/sa/*"
  - "cluster.local/ns/horoscope/sa/*"
  - "cluster.local/ns/istio-ingress/sa/*"
  - "cluster.local/ns/istio-system/sa/*"
  - "cluster.local/ns/monitoring/sa/*"
