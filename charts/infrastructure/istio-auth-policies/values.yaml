# =============================================================================
# Istio Auth Policies Configuration
# JWT authentication and authorization for GIP-protected services
# =============================================================================

# Environment name (devtest, pilot, prod)
environment: devtest

# Istio Ingress Gateway configuration
# JWT validation happens at the gateway level before routing to services
# Since Istio WorkloadSelector only supports matchLabels (not matchExpressions),
# we define each gateway separately and create policies for each
ingressGateways:
  # Main gateway - uses Cloudflare tunnel for *.tesserix.app
  - name: ""                    # Empty string = no suffix in policy names (main gateway)
    labelKey: istio
    labelValue: ingressgateway
    namespace: istio-ingress

  # Custom domain gateway - public LoadBalancer for custom domains
  - name: "-custom"             # Suffix for policy names
    labelKey: istio
    labelValue: custom-ingressgateway
    namespace: istio-ingress

# Application namespaces where authorization policies are applied
appNamespaces:
  global: devtest
  marketplace: devtest
  # Add other namespaces as needed

# =============================================================================
# Google Identity Platform (GIP) Configuration
#
# Every product is on GIP.
# Only native mobile clients present a Bearer JWT at the ingress — the web apps
# use session cookies + HeaderTrustAuth — so this rule exists solely to stop
# Envoy rejecting GIP tokens with "Jwt issuer is not configured".
#
# Disabled by default; enable per-environment (see values-prod.yaml).
# =============================================================================
gip:
  enabled: false
  # issuer/aud are both the GCP project id for GIP-issued id_tokens,
  # regardless of which GIP tenant the user signed into.
  issuer: ""
  jwksUri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
  audiences: []

# =============================================================================
# Additional GIP projects
#
# `gip:` above is the SHARED tesseracthub project. A product with its own
# Firebase/GIP project gets an entry here instead: each renders its own
# RequestAuthentication, so the shared one stays byte-identical and products
# cannot perturb each other.
#
# A missing entry is not a partial failure — the gateway rejects an unlisted
# issuer with 401 before the service is reached, so that product's users can
# never authenticate at all.
#
# restrictToHosts (optional, RECOMMENDED): renders a paired DENY policy so a
# token from this issuer cannot clear gateway authorization on any OTHER
# product's host. Omit only if the issuer is deliberately gateway-wide.
#
#   - name: "-example"                 # suffix for the policy names
#     issuer: "https://securetoken.google.com/example-project"
#     jwksUri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
#     audiences:
#       - "example-project"
#     restrictToHosts:
#       - "example-api.tesserix.app"
extraGip: []

# =============================================================================
# Frontend apps configuration
# These apps serve static content and don't require JWT validation
# =============================================================================
frontendApps:
  - name: storefront
    label: storefront
    hosts:
      - "*.tesserix.app"  # Wildcard for tenant subdomains
  - name: admin
    label: admin
  - name: tenant-onboarding
    label: tenant-onboarding
  - name: growthbook
    label: growthbook
# =============================================================================
# Service mesh configuration
# =============================================================================

# Principals allowed for internal service-to-service communication
meshPrincipals:
  - "cluster.local/ns/devtest/sa/*"
  - "cluster.local/ns/istio-ingress/sa/*"
  - "cluster.local/ns/istio-system/sa/*"
  - "cluster.local/ns/monitoring/sa/*"

# mTLS mode for service-to-service communication
# STRICT: All traffic must be mTLS encrypted (PCI-DSS compliant)
# PERMISSIVE: Accept both plaintext and mTLS (migration mode only)
mtls:
  mode: STRICT

# =============================================================================
# Header contract
# These headers are set by Istio after JWT validation
# Backend services should trust these headers (no re-validation needed)
# =============================================================================
# Headers output by Istio:
#   x-jwt-claim-sub          - User ID (GIP subject)
#   x-jwt-claim-email        - User email
#   x-jwt-claim-tenant-id    - Tenant UUID
#   x-jwt-claim-tenant-slug  - Tenant slug
#   x-jwt-claim-staff-id     - Staff ID (internal users)
#   x-jwt-claim-customer-id  - Customer ID (B2C users)
#   x-jwt-claim-vendor-id    - Vendor ID (vendor users)
#   x-jwt-claim-roles        - Realm roles (JSON array)
#   x-jwt-claim-platform-owner - Platform owner flag (cross-tenant access)

# =============================================================================
# Operational endpoint deny (templates/ops-endpoints-deny.yaml)
# =============================================================================
# Every gateway that terminates public traffic must be listed here. This is a
# SEPARATE list from `ingressGateways` on purpose — see the comment at the top
# of ops-endpoints-deny.yaml for why reusing that list would be dangerous.
opsEndpointDeny:
  gateways:
    - name: main
      istioLabel: ingressgateway
      namespace: istio-ingress
    - name: custom
      istioLabel: custom-ingressgateway
      namespace: istio-ingress
    - name: homechef
      istioLabel: homechef-ingressgateway
      namespace: istio-ingress
    - name: zitadel
      istioLabel: zitadel-ingressgateway
      namespace: istio-ingress
    - name: internal
      istioLabel: ingressgateway-internal
      namespace: istio-ingress

# =============================================================================
# Admin surface deny (templates/admin-surface-deny.yaml)
# =============================================================================
# Withdraws operator-only admin APIs from the public internet at the gateway.
# Each entry is HOST-SCOPED, so listing a gateway here cannot affect any host
# other than the ones named. Same separate-list reasoning as opsEndpointDeny
# above; see the comment at the top of admin-surface-deny.yaml.
adminSurfaceDeny:
  # Attached to the two gateways that terminate *.tesserix.app traffic. The
  # homechef and internal gateways are omitted: they never terminate
  # kora-api.tesserix.app, and a host-scoped rule there would be inert noise.
  gateways:
    - name: main
      istioLabel: ingressgateway
      namespace: istio-ingress
    - name: custom
      istioLabel: custom-ingressgateway
      namespace: istio-ingress
  surfaces:
    # kora-api's admin API. HMAC-signed (KORA_BFF_HMAC_KEY), NOT Firebase-gated,
    # and as of food-data admin slice 2 it can create, edit and retire foods.
    # Reached in-cluster by tesserix-home over the ClusterIP, so denying it at
    # the edge costs nothing operationally.
    - hosts:
        - "kora-api.tesserix.app"
      paths:
        # Both forms: "/v1/admin/*" does NOT match the bare "/v1/admin".
        - "/v1/admin"
        - "/v1/admin/*"
