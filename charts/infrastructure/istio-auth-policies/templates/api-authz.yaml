# =============================================================================
# API GATEWAY AUTHORIZATION POLICIES
# Granular access control for API endpoints at the istio-ingressgateway
# Creates policies for each gateway defined in ingressGateways
# =============================================================================

{{- range .Values.ingressGateways }}
---
# Allow public API endpoints (no authentication required)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-public-api-endpoints{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/component: api-authorization
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  action: ALLOW
  rules:
    # Health checks (required for load balancers, monitoring)
    - to:
        - operation:
            paths:
              - "/health"
              - "/health/*"
              - "/api/health"
              - "/api/health/*"
              - "/ready"
              - "/live"

    # API Documentation
    - to:
        - operation:
            paths:
              - "/api/docs"
              - "/api/docs/*"
              - "/swagger/*"

    # Authentication endpoints (API-level)
    - to:
        - operation:
            paths:
              - "/api/v1/auth/login"
              - "/api/v1/auth/register"
              - "/api/v1/auth/forgot-password"
              - "/api/v1/auth/reset-password"
              - "/api/v1/auth/verify-email"
              - "/api/v1/auth/resend-verification"
              - "/api/v1/auth/oauth/*"
              - "/api/v1/auth/sso/*"
            methods:
              - "POST"
              - "GET"

    # Auth BFF endpoints (cookie-based session auth, no JWT)
    # These are used by the admin app's direct login flow on custom domains.
    # The BFF uses HttpOnly session cookies for auth, not JWTs, so these must
    # be accessible without a JWT token at the gateway level.
    - to:
        - operation:
            paths:
              - "/auth/session"
              - "/auth/direct/*"
              - "/auth/logout"
              - "/auth/refresh"
              - "/auth/ws-ticket"
              - "/auth/csrf"
            methods:
              - "GET"
              - "POST"

    # FanZone auth endpoints (uses app-issued JWT in X-FZ-Auth).
    # Covers login, OAuth, profile, avatars, and all auth service routes.
    # Istio RequestAuthentication only validates Authorization: Bearer tokens
    # from configured issuers, so all FanZone /auth/* routes must
    # be explicitly allowed here.
    - to:
        - operation:
            hosts:
              - "fanzonebattleground.com"
              - "www.fanzonebattleground.com"
              - "auth.fanzonebattleground.com"
            paths:
              - "/auth/*"
              - "/avatars/*"
            methods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"

    # FanZone WebSocket endpoint (uses ticket-based auth, not JWT)
    - to:
        - operation:
            hosts:
              - "fanzonebattleground.com"
              - "www.fanzonebattleground.com"
              - "ws.fanzonebattleground.com"
            paths:
              - "/ws"
              - "/ws/*"
            methods:
              - "GET"

    # FanZone sports data endpoints (public, no auth required)
    # The sports-data service has no auth middleware -- data is freely accessible
    - to:
        - operation:
            paths:
              - "/api/v1/cricket"
              - "/api/v1/cricket/*"
              - "/api/v1/sports"
              - "/api/v1/sports/*"
            methods:
              - "GET"

    # FanZone BFF auth endpoints (app-level cookie/token auth, not a bearer JWT)
    # Path arrives as /bff/* at the gateway; VirtualService rewrites to / at the BFF.
    # AuthorizationPolicy evaluates the original path before rewrite.
    # PUT/DELETE needed for profile updates, username claims, logout, etc.
    - to:
        - operation:
            paths:
              - "/bff/*"
              - "/bff/"
            methods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"

    # FanZone API endpoints that use X-FZ-Auth header for auth.
    # These are authenticated by the FanZone API service, not by Istio.
    # Must be allowed at gateway level since no bearer JWT is present.
    - to:
        - operation:
            hosts:
              - "fanzonebattleground.com"
              - "www.fanzonebattleground.com"
            paths:
              - "/api/*"
            methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"

    # HomeChef API endpoints (uses app-issued JWT in the Go backend).
    # All API traffic to fe3dr.com is authenticated by the HomeChef API service.
    - to:
        - operation:
            hosts:
              - "fe3dr.com"
              - "www.fe3dr.com"
              - "vendors.fe3dr.com"
              - "delivery.fe3dr.com"
            paths:
              - "/api/*"
            methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"

    # HomeChef WebSocket endpoint (uses ticket-based auth, not JWT)
    - to:
        - operation:
            hosts:
              - "fe3dr.com"
              - "www.fe3dr.com"
              - "vendors.fe3dr.com"
              - "delivery.fe3dr.com"
            paths:
              - "/ws"
              - "/ws/*"
            methods:
              - "GET"

    # Kora API endpoints (nutrition / food memory). The Go backend does its
    # own GIP (Firebase) JWT verification on the /v1/* group — auth.Middleware
    # returns 401 for a missing/invalid token — so the gateway lets all /v1/*
    # traffic through to the app, same model as HomeChef's fe3dr.com /api/*.
    # Host-scoped to kora-api.tesserix.app; affects no other host. Without this
    # the gateway deny-all rejected unauthenticated /v1/* as 403 at the edge
    # (only /health,/ready slipped through the generic health rule above).
    - to:
        - operation:
            hosts:
              - "kora-api.tesserix.app"
            paths:
              - "/v1/*"
            methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"
              - "OPTIONS"

    # NOTE: kora-api's Cashfree webhook rule was removed with the gateway
    # itself (kora#479). It is not replaced: with no gateway configured the
    # route is not mounted, so an allow rule would open a path that answers
    # 404 anyway. A future rail needs its OWN rule here — outside the /v1/*
    # group above, because a gateway callback carries no Firebase token and
    # would otherwise be denied 403 before kora-api ever saw it, leaving paid
    # orders ungranted.

    # Atlantis verifies GitHub's HMAC signature before processing a webhook.
    # Host, exact path, and method scoping keep every other surface private.
    - to:
        - operation:
            hosts:
              - "atlantis.tesserix.app"
            paths:
              - "/events"
            methods:
              - "POST"

    # Staff invitation and activation endpoints (public - no JWT required)
    # Users need to access these before they have an account
    - to:
        - operation:
            paths:
              - "/api/v1/auth/invitation/*"
              - "/api/v1/auth/activate"
            methods:
              - "GET"
              - "POST"

    # Public product catalog
    - to:
        - operation:
            paths:
              - "/api/v1/products"
              - "/api/v1/products/*"
              - "/api/v1/categories"
              - "/api/v1/categories/*"
              - "/api/v1/reviews"
              - "/api/v1/reviews/*"
            methods:
              - "GET"

    # Storefront reviews (anonymous + authenticated customers)
    - to:
        - operation:
            paths:
              - "/api/v1/storefront/reviews"
              - "/api/v1/storefront/reviews/*"
            methods:
              - "GET"
              - "POST"

    # Storefront resolution and settings
    - to:
        - operation:
            paths:
              - "/api/v1/storefronts/*"
              - "/api/v1/vendors/*"
            methods:
              - "GET"

    # Tenant validation and public info
    - to:
        - operation:
            paths:
              - "/api/v1/tenants/validate/*"
              - "/api/v1/tenants/check-slug"
              - "/api/v1/tenants/public/*"
            methods:
              - "GET"

    # Public settings
    - to:
        - operation:
            paths:
              - "/api/v1/settings/public"
              - "/api/v1/settings/public/*"
              - "/api/v1/settings/storefront/*"
            methods:
              - "GET"

    # Onboarding APIs (both v1 and non-versioned paths)
    - to:
        - operation:
            paths:
              - "/api/v1/onboarding/*"
              - "/api/onboarding/*"
              - "/api/onboarding"
            methods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"

    # Search
    - to:
        - operation:
            paths:
              - "/api/v1/search/*"
            methods:
              - "GET"
              - "POST"

    # Guest order management (token-based auth, no JWT)
    - to:
        - operation:
            paths:
              - "/api/v1/public/orders/lookup"
              - "/api/v1/public/orders/cancel"
            methods:
              - "GET"
              - "POST"

    # Public cancellation settings for storefront
    - to:
        - operation:
            paths:
              - "/api/v1/public/settings/cancellation"
            methods:
              - "GET"

    # Shipping rates
    - to:
        - operation:
            paths:
              - "/api/v1/shipping/rates"
              - "/api/v1/shipping/methods"
            methods:
              - "GET"
              - "POST"

    # Tax calculations
    - to:
        - operation:
            paths:
              - "/api/v1/tax/calculate"
            methods:
              - "POST"

    # Location service - all location-related endpoints
    - to:
        - operation:
            paths:
              - "/api/v1/location/*"
              - "/api/v1/location"
              - "/api/v1/countries"
              - "/api/v1/countries/*"
              - "/api/v1/states"
              - "/api/v1/states/*"
              - "/api/v1/currencies"
              - "/api/v1/currencies/*"
              - "/api/v1/timezones"
              - "/api/v1/timezones/*"
              - "/api/v1/address/*"
              - "/api/v1/address"
              - "/api/v1/geotag/*"
              - "/api/v1/geocode"
              - "/api/v1/geocode/*"
            methods:
              - "GET"
              - "POST"

    # Feature flags
    - to:
        - operation:
            paths:
              - "/api/v1/features/*"
            methods:
              - "GET"
              - "POST"

    # Translation service
    - to:
        - operation:
            paths:
              - "/api/v1/translate/*"
              - "/api/v1/translations/*"
            methods:
              - "GET"
              - "POST"

    # =============================================================================
    # Notification Hub WebSocket and SSE endpoints
    # These use ticket-based authentication (validated by auth-bff at /auth/ws-ticket)
    # rather than JWT headers. The notification-hub validates the ticket internally.
    # WebSocket upgrade requests cannot include Authorization headers the same way
    # as regular HTTP requests, so these must be allowed without JWT at gateway level.
    # =============================================================================
    - to:
        - operation:
            paths:
              - "/api/v1/notifications/ws"
              - "/api/v1/notifications/stream"
            methods:
              - "GET"

---
# Allow authenticated API access (requires valid JWT)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-authenticated-api{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/component: api-authorization
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  action: ALLOW
  rules:
    # Allow any authenticated user (customer or staff)
    - from:
        - source:
            requestPrincipals:
              - "*"

---
# Deny unauthenticated access to sensitive customer endpoints
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-customer-auth{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/component: api-authorization
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals:
              - "*"
      to:
        - operation:
            # Exclude FanZone hosts - they handle auth at the application level via X-FZ-Auth
            # Exclude HomeChef hosts - they handle auth at the application level (Go JWT)
            # Exclude monitoring hosts - Grafana has its own auth, Prometheus/Alertmanager are internal tools
            notHosts:
              - "fanzonebattleground.com"
              - "www.fanzonebattleground.com"
              - "fe3dr.com"
              - "www.fe3dr.com"
              - "vendors.fe3dr.com"
              - "delivery.fe3dr.com"
              - "prometheus.tesserix.app"
              - "alertmanager.tesserix.app"
            paths:
              - "/api/v1/auth/me"
              - "/api/v1/auth/logout"
              - "/api/v1/auth/refresh"
              - "/api/v1/customers/me"
              - "/api/v1/customers/me/*"
              - "/api/v1/orders"
              - "/api/v1/orders/*"
              - "/api/v1/cart"
              - "/api/v1/cart/*"
              - "/api/v1/payments"
              - "/api/v1/payments/*"
              # NOTE: /api/v1/notifications/ws and /api/v1/notifications/stream
              # are excluded - they use ticket-based auth (see public endpoints above)
              - "/api/v1/notifications"
              - "/api/v1/notifications/unread-count"
              - "/api/v1/notifications/mark-all-read"
              - "/api/v1/notifications/delete-all"
              - "/api/v1/wishlist"
              - "/api/v1/wishlist/*"
              - "/api/v1/addresses"
              - "/api/v1/addresses/*"
              # Storefront customer endpoints (require customer JWT)
              - "/api/v1/storefront/customers/*"
              # Staff/Admin protected endpoints
              - "/api/v1/staff/*"
              - "/api/v1/admin/*"
              - "/api/v1/tenants/*/settings"
              - "/api/v1/tenants/*/branding"
              - "/api/v1/analytics/*"
              - "/api/v1/reports/*"
---
# =============================================================================
# PCI-DSS COMPLIANCE: Payment Webhook Endpoints
# Allow payment gateway webhooks (Cashfree, Stripe, etc.)
# These are called by external payment providers to notify of payment events
# =============================================================================
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-payment-webhooks{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/component: pci-compliance
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  action: ALLOW
  rules:
    # Payment gateway webhooks - POST only
    # Each provider has its own signature validation at service level
    - to:
        - operation:
            paths:
              - "/api/v1/payments/webhooks/*"
              - "/api/v1/payments/webhook/*"
              - "/api/webhooks/stripe"
              - "/api/webhooks/cashfree"
              - "/api/webhooks/paypal"
              - "/api/webhooks/afterpay"
              - "/api/webhooks/phonepe"
            methods:
              - "POST"

---
# =============================================================================
# PCI-DSS COMPLIANCE: Public Payment Method Listing
# Allow customers to see available payment methods before authentication
# No cardholder data is transmitted
# =============================================================================
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-payment-methods-public{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/component: pci-compliance
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  action: ALLOW
  rules:
    # GET only - list available payment methods (no sensitive data)
    - to:
        - operation:
            paths:
              - "/api/v1/payments/methods"
              - "/api/v1/payments/enabled-methods"
              - "/api/v1/payments/gateways/public"
            methods:
              - "GET"
{{- end }}

{{- range $extra := .Values.extraGip | default list }}
{{- if $extra.restrictToHosts }}
{{- range $gw := $.Values.ingressGateways }}
---
# =============================================================================
# PER-ISSUER HOST ISOLATION for {{ $extra.issuer }}
#
# RequestAuthentication selects WORKLOADS, not hosts, so listing a product's
# own GIP project on the shared gateway (see extraGip in jwt-auth.yaml) makes
# its tokens valid for the WHOLE gateway. allow-authenticated-api above ALLOWs
# `requestPrincipals: ["*"]`, so without this rule a token from this project
# would clear gateway authorization on every other product's host.
#
# Defence in depth, not the only defence: the backends re-verify (these tokens
# set no x-jwt-claim-* headers, so HeaderTrustAuth services see no identity,
# and GIPBearerAuth services check their own project id). This closes the hole
# at the edge instead of relying on every service to keep closing it.
#
# DENY is evaluated before ALLOW and needs no coordination with the rules above.
# It matches only requests that carry a VALIDATED principal from this issuer;
# tokenless traffic and every other issuer are untouched.
# =============================================================================
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-foreign-hosts-gip{{ $extra.name }}{{ $gw.name }}
  namespace: {{ $gw.namespace }}
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/component: issuer-host-isolation
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ $gw.labelKey }}: {{ $gw.labelValue }}
  action: DENY
  rules:
    - from:
        - source:
            requestPrincipals:
              - {{ printf "%s/*" $extra.issuer | quote }}
      to:
        - operation:
            ports:
              - "80"
              - "443"
            notHosts:
              {{- range $extra.restrictToHosts }}
              - {{ . | quote }}
              {{- end }}
{{- end }}
{{- end }}
{{- end }}
