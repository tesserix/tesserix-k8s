# =============================================================================
# JWT AUTHENTICATION POLICIES
# Applied at istio-ingressgateway to validate tokens at the edge
# Claims are extracted and forwarded as headers to backend services
# Creates a policy for each gateway defined in ingressGateways
# =============================================================================

{{- if .Values.keycloak.customer.enabled | default true }}
{{- range .Values.ingressGateways }}
---
# =============================================================================
# JWT AUTHENTICATION - Customer IDP for {{ .labelValue }}
# Validates tokens from mobile apps, web storefronts, and admin dashboard
# =============================================================================
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth-customer{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: jwt-auth
    app.kubernetes.io/component: request-authentication
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  jwtRules:
    # Customer realm - for regular app users (mobile, web, admin dashboard)
    - issuer: {{ $.Values.keycloak.customer.issuer | quote }}
      jwksUri: {{ $.Values.keycloak.customer.jwksUri | quote }}
      audiences:
        {{- range $.Values.keycloak.customer.audiences }}
        - {{ . | quote }}
        {{- end }}
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
      outputClaimToHeaders:
        - header: x-jwt-claim-sub
          claim: sub
        - header: x-jwt-claim-email
          claim: email
        # User identity claims for audit logging
        - header: x-jwt-claim-preferred-username
          claim: preferred_username
        - header: x-jwt-claim-name
          claim: name
        - header: x-jwt-claim-tenant-id
          claim: tenant_id
        - header: x-jwt-claim-tenant-slug
          claim: tenant_slug
        # Staff/vendor claims (present for admin users)
        - header: x-jwt-claim-staff-id
          claim: staff_id
        - header: x-jwt-claim-vendor-id
          claim: vendor_id
        - header: x-jwt-claim-customer-id
          claim: customer_id
        - header: x-jwt-claim-roles
          claim: realm_access.roles
        # Platform owner flag for cross-tenant access
        - header: x-jwt-claim-platform-owner
          claim: platform_owner
    {{- if $.Values.keycloak.master.enabled | default false }}
    # Master realm - for Keycloak admin console access
    - issuer: {{ $.Values.keycloak.master.issuer | quote }}
      jwksUri: {{ $.Values.keycloak.master.jwksUri | quote }}
      {{- if gt (len $.Values.keycloak.master.audiences) 0 }}
      audiences:
        {{- range $.Values.keycloak.master.audiences }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
    {{- end }}
{{- end }}
{{- end }}

{{- if .Values.keycloak.internal.enabled | default false }}
{{- range .Values.ingressGateways }}
---
# =============================================================================
# JWT AUTHENTICATION - Internal IDP for {{ .labelValue }}
# Validates tokens from admin dashboard and internal staff
# Only enabled when internal IDP is deployed
# =============================================================================
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth-internal{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: jwt-auth
    app.kubernetes.io/component: request-authentication
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  jwtRules:
    - issuer: {{ $.Values.keycloak.internal.issuer | quote }}
      jwksUri: {{ $.Values.keycloak.internal.jwksUri | quote }}
      audiences:
        {{- range $.Values.keycloak.internal.audiences }}
        - {{ . | quote }}
        {{- end }}
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
      outputClaimToHeaders:
        - header: x-jwt-claim-sub
          claim: sub
        - header: x-jwt-claim-email
          claim: email
        # User identity claims for audit logging
        - header: x-jwt-claim-preferred-username
          claim: preferred_username
        - header: x-jwt-claim-name
          claim: name
        - header: x-jwt-claim-tenant-id
          claim: tenant_id
        - header: x-jwt-claim-tenant-slug
          claim: tenant_slug
        - header: x-jwt-claim-staff-id
          claim: staff_id
        - header: x-jwt-claim-vendor-id
          claim: vendor_id
        - header: x-jwt-claim-roles
          claim: realm_access.roles
        # Platform owner flag for cross-tenant access
        - header: x-jwt-claim-platform-owner
          claim: platform_owner
{{- end }}
{{- end }}

