# =============================================================================
# JWT AUTHENTICATION POLICIES
# Applied at istio-ingressgateway to validate tokens at the edge
# Claims are extracted and forwarded as headers to backend services
# Creates a policy for each gateway defined in ingressGateways
#
# Istio MERGES jwtRules across every RequestAuthentication selecting the same
# workload, so the GIP projects below coexist — adding one does not disturb
# the others.
#
# A request carrying a JWT whose issuer matches NO rule here is rejected at the
# mesh with 401 "Jwt issuer is not configured", before it ever reaches the
# service. A request with no JWT passes through untouched. That asymmetry is
# why a missing issuer looks like "auth is broken for exactly one client".
# =============================================================================

{{- if .Values.gip.enabled | default false }}
{{- range .Values.ingressGateways }}
---
# =============================================================================
# JWT AUTHENTICATION - Google Identity Platform for {{ .labelValue }}
# Validates GIP id_tokens from native mobile clients (mobile-admin), which are
# the only clients that present a Bearer JWT to the ingress — the web apps use
# session cookies + HeaderTrustAuth and never trip this filter.
#
# No outputClaimToHeaders: these routes authenticate with GIPBearerAuth in the
# service itself (see marketplace-api mobile_routes.go — "Uses GIPBearerAuth
# instead of HeaderTrustAuth"), so the service re-verifies the forwarded token
# and reads its own claims. forwardOriginalToken is therefore REQUIRED: without
# it Envoy strips the Authorization header and the service sees nothing.
# =============================================================================
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth-gip{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: jwt-auth
    app.kubernetes.io/component: request-authentication
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  jwtRules:
    - issuer: {{ $.Values.gip.issuer | quote }}
      jwksUri: {{ $.Values.gip.jwksUri | quote }}
      audiences:
        {{- range $.Values.gip.audiences }}
        - {{ . | quote }}
        {{- end }}
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
{{- end }}
{{- end }}

{{- range $extra := .Values.extraGip | default list }}
{{- range $gw := $.Values.ingressGateways }}
---
# =============================================================================
# JWT AUTHENTICATION - additional GIP project "{{ $extra.issuer }}" for {{ $gw.labelValue }}
#
# Products with their OWN Firebase/GIP project (rather than the shared
# tesseracthub project in `gip:` above) each get a RequestAuthentication here.
# Istio MERGES jwtRules across every RequestAuthentication selecting the same
# workload, so this is exactly equivalent to appending a rule to jwt-auth-gip —
# but it leaves that shared resource byte-identical, so adding or removing one
# product cannot perturb the others.
#
# This exists because the gateway rejects a JWT whose issuer matches NO rule
# with 401 "Jwt issuer is not configured", BEFORE the service sees it. A product
# whose backend does its own verification still needs its issuer listed here,
# or its users can never authenticate at all.
#
# forwardOriginalToken is REQUIRED: the backend re-verifies the token itself.
# No outputClaimToHeaders — these tokens must NOT populate the x-jwt-claim-*
# headers that HeaderTrustAuth services trust.
#
# See the paired deny-foreign-hosts policy in api-authz.yaml: validating here
# makes the token a request principal, which allow-authenticated-api would
# otherwise honour on EVERY host on this gateway.
# =============================================================================
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth-gip{{ $extra.name }}{{ $gw.name }}
  namespace: {{ $gw.namespace }}
  labels:
    app.kubernetes.io/name: jwt-auth
    app.kubernetes.io/component: request-authentication
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ $gw.labelKey }}: {{ $gw.labelValue }}
  jwtRules:
    - issuer: {{ $extra.issuer | quote }}
      jwksUri: {{ $extra.jwksUri | quote }}
      audiences:
        {{- range $extra.audiences }}
        - {{ . | quote }}
        {{- end }}
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
{{- end }}
{{- end }}

{{- if and .Values.googleOidc .Values.googleOidc.enabled }}
{{- range .Values.ingressGateways }}
---
# =============================================================================
# JWT AUTHENTICATION - Google OIDC (Cloud Pub/Sub push) for {{ .labelValue }}
# Pub/Sub push subscriptions authenticate with a Google-signed OIDC token whose
# issuer is https://accounts.google.com. Without this rule Envoy rejects them at
# the gateway with 401 "Jwt issuer is not configured" before they reach the
# /pubsub/* delivery endpoints (e.g. marketplace-api /pubsub/merchant-push).
#
# No audience is pinned and no claims are extracted here: the receiving service
# re-verifies the token's audience + service-account email, so this rule only
# needs to stop the gateway from rejecting the token. forwardOriginalToken is
# therefore REQUIRED — without it Envoy strips the Authorization header and the
# service sees nothing.
# =============================================================================
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth-google-oidc{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: jwt-auth
    app.kubernetes.io/component: request-authentication
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  selector:
    matchLabels:
      {{ .labelKey }}: {{ .labelValue }}
  jwtRules:
    - issuer: {{ $.Values.googleOidc.issuer | quote }}
      jwksUri: {{ $.Values.googleOidc.jwksUri | quote }}
      forwardOriginalToken: true
      fromHeaders:
        - name: Authorization
          prefix: "Bearer "
{{- end }}
{{- end }}
