# =============================================================================
# PEER AUTHENTICATION (mTLS Settings)
# Allows both mTLS and plaintext for external traffic during migration
# Applied to the main app namespace
# =============================================================================
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default-mtls-permissive
  namespace: {{ .Values.appNamespaces.global }}
  labels:
    app.kubernetes.io/name: peer-auth
    app.kubernetes.io/component: mtls
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  mtls:
    mode: {{ .Values.mtls.mode }}
  portLevelMtls:
    8000:
      mode: PERMISSIVE
