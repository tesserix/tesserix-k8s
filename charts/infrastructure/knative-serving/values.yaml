version: "1.17.0"

# Istio integration
ingress:
  class: istio.ingress.networking.knative.dev
  gateway: knative-serving/knative-ingress-gateway
  localGateway: knative-serving/knative-local-gateway

# Domain configuration
domain:
  # Default domain for Knative services
  default: "knative.mark8ly.com"

# Autoscaler configuration (KPA - Knative Pod Autoscaler)
autoscaler:
  containerConcurrencyTargetDefault: "100"
  containerConcurrencyTargetPercentage: "0.7"
  enableScaleToZero: "true"
  maxScaleUpRate: "1000"
  maxScaleDownRate: "2"
  panicWindowPercentage: "10.0"
  panicThresholdPercentage: "200.0"
  scaleToZeroGracePeriod: "30s"
  scaleToZeroPodRetentionPeriod: "0s"
  stableWindow: "60s"
  tickInterval: "2s"
  targetBurstCapacity: "200"

# Network configuration
network:
  ingressClass: istio.ingress.networking.knative.dev
  autoTLS: "Disabled"
  httpProtocol: "Redirected"
  domainTemplate: "{{.Name}}.{{.Namespace}}.{{.Domain}}"
  tagTemplate: "{{.Tag}}-{{.Name}}"

# Default container settings
defaults:
  revisionTimeoutSeconds: "300"
  maxRevisionTimeoutSeconds: "3600"
  containerConcurrency: "0"
  enableServiceLinks: "false"

# Garbage collection — clean up old revisions after 30 minutes
gc:
  retainSinceCreateTime: "30m"
  retainSinceLastActiveTime: "30m"
  minNonActiveRevisions: "0"
  maxNonActiveRevisions: "1"

# High availability
highAvailability:
  replicas: 2
