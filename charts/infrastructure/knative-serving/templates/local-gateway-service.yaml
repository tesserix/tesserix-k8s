# Knative local gateway service in istio-ingress namespace
# Routes cluster-local Knative traffic through the internal Istio gateway
# The default operator-created service in istio-system has 0 endpoints
# because the gateway pods live in istio-ingress, not istio-system.
apiVersion: v1
kind: Service
metadata:
  name: knative-local-gateway
  namespace: istio-ingress
  labels:
    app.kubernetes.io/component: net-istio
    app.kubernetes.io/name: knative-serving
spec:
  type: ClusterIP
  selector:
    istio: ingressgateway-internal
  ports:
    - name: http2
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
