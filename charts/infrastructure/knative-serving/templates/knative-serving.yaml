apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
spec:
  version: {{ .Values.version | quote }}

  # Istio networking layer
  ingress:
    istio:
      enabled: true

  # High availability
  high-availability:
    replicas: {{ .Values.highAvailability.replicas }}

  # ConfigMap overrides for production tuning
  config:
    # Istio integration — point local gateway to istio-ingress namespace
    # (default istio-system has 0 endpoints because gateway pods are in istio-ingress)
    config-istio:
      local-gateways: |
        - name: knative-local-gateway
          namespace: knative-serving
          service: knative-local-gateway.istio-ingress.svc.cluster.local

    # Autoscaler configuration
    autoscaler:
      container-concurrency-target-default: {{ .Values.autoscaler.containerConcurrencyTargetDefault | quote }}
      container-concurrency-target-percentage: {{ .Values.autoscaler.containerConcurrencyTargetPercentage | quote }}
      enable-scale-to-zero: {{ .Values.autoscaler.enableScaleToZero | quote }}
      max-scale-up-rate: {{ .Values.autoscaler.maxScaleUpRate | quote }}
      max-scale-down-rate: {{ .Values.autoscaler.maxScaleDownRate | quote }}
      panic-window-percentage: {{ .Values.autoscaler.panicWindowPercentage | quote }}
      panic-threshold-percentage: {{ .Values.autoscaler.panicThresholdPercentage | quote }}
      scale-to-zero-grace-period: {{ .Values.autoscaler.scaleToZeroGracePeriod | quote }}
      scale-to-zero-pod-retention-period: {{ .Values.autoscaler.scaleToZeroPodRetentionPeriod | quote }}
      stable-window: {{ .Values.autoscaler.stableWindow | quote }}
      tick-interval: {{ .Values.autoscaler.tickInterval | quote }}
      target-burst-capacity: {{ .Values.autoscaler.targetBurstCapacity | quote }}

    # Domain configuration
    domain:
      {{ .Values.domain.default }}: ""

    # Network configuration
    network:
      ingress-class: {{ .Values.network.ingressClass | quote }}
      auto-tls: {{ .Values.network.autoTLS | quote }}
      http-protocol: {{ .Values.network.httpProtocol | quote }}
      domain-template: {{ .Values.network.domainTemplate | quote }}
      tag-template: {{ .Values.network.tagTemplate | quote }}

    # Default settings
    defaults:
      revision-timeout-seconds: {{ .Values.defaults.revisionTimeoutSeconds | quote }}
      max-revision-timeout-seconds: {{ .Values.defaults.maxRevisionTimeoutSeconds | quote }}
      container-concurrency: {{ .Values.defaults.containerConcurrency | quote }}
      enable-service-links: {{ .Values.defaults.enableServiceLinks | quote }}

    # Garbage collection for old revisions
    gc:
      retain-since-create-time: {{ .Values.gc.retainSinceCreateTime | quote }}
      retain-since-last-active-time: {{ .Values.gc.retainSinceLastActiveTime | quote }}
      min-non-active-revisions: {{ .Values.gc.minNonActiveRevisions | quote }}
      max-non-active-revisions: {{ .Values.gc.maxNonActiveRevisions | quote }}

    # Observability - integrate with existing Prometheus
    observability:
      metrics.backend-destination: prometheus

    # Logging
    logging:
      loglevel.controller: info
      loglevel.autoscaler: info
      loglevel.webhook: info

    # Tracing - integrate with existing Istio tracing
    tracing:
      backend: none

