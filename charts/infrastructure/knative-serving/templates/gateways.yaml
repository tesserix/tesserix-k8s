# Knative Ingress Gateway - routes external traffic via existing Istio ingress
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: knative-ingress-gateway
  namespace: knative-serving
spec:
  selector:
    istio: ingressgateway-internal
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.knative.mark8ly.com"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*.knative.mark8ly.com"
      tls:
        mode: PASSTHROUGH
---
# Knative Local Gateway - for cluster-internal traffic
# NOTE: The Knative operator also manages this Gateway via ownerReference.
# The EnsureExists annotation tells the operator to only create (not overwrite)
# so our custom selector/port config is preserved.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: knative-local-gateway
  namespace: knative-serving
  annotations:
    operator.knative.dev/mode: EnsureExists
spec:
  selector:
    istio: ingressgateway-internal
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
