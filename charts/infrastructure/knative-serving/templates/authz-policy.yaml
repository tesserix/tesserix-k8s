# Allow Knative local gateway traffic through the internal ingress gateway
# Traffic flow: ingress gateway → local gateway (internal) → Knative revision pods
# Without this, the root-namespace deny-all-default blocks all traffic to the
# internal gateway because no ALLOW policies exist for it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-knative-local-gateway
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway-internal
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["80"]
