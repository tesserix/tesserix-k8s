# =============================================================================
# Email (Postal) Access Rules
# Only global namespace can access email services
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-global-to-email
  namespace: email
  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.globalNamespace }}
      ports:
        # SMTP
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
        # HTTP API
        - protocol: TCP
          port: 5000

---
# Egress from global to email
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-email
  namespace: {{ .Values.globalNamespace }}
  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: email
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 5000
