{{/*
Infrastructure Services NetworkPolicies
Allow app namespaces to access shared infrastructure
*/}}

# =============================================================================
# NATS Access Rules
# All app namespaces can access NATS
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-nats
  namespace: nats
  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.namespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ . }}
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6222
        - protocol: TCP
          port: 8222
    {{- end }}

{{- range .Values.namespaces }}
---
# Egress from {{ . }} to NATS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-nats
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: nats
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6222
{{- end }}

