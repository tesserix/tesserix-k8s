{{- range .Values.namespaces }}
---
# Allow traffic from pods in the same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
