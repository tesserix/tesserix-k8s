{{- range .Values.namespaces }}
---
# Allow traffic from Istio ingress gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingress
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: network-policies
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-ingress
        - namespaceSelector:
            matchLabels:
              name: istio-system
{{- end }}
