{{/*
Bootstrap secret for the operator-webhook's TLS material.

Knative's WebhookCertificates controller POPULATES this secret; it does not
create it. With the secret absent, that controller acquires its lease, finds
nothing to reconcile and goes quiet, while the ConversionWebhook controller
fails every reconcile forever with:

  ConversionWebhook: Error fetching secret
  error: secret "operator-webhook-certs" not found

Observed in prod from 2026-07-22 until it was seeded by hand on 2026-07-26.
The pod stayed 1/1 Running with zero restarts throughout, which is why it never
surfaced as a failing workload -- it was only visible in its logs.

Shipping it empty is the whole point: the controller fills in ca-cert.pem,
server-cert.pem and server-key.pem within seconds of it existing, and rotates
them on its own schedule thereafter. The ArgoCD app must therefore ignore
differences on /data, or selfHeal would blank the generated certificates on
every sync -- see argocd/prod/infrastructure/knative-operator.yaml.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: operator-webhook-certs
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app.kubernetes.io/name: knative-operator
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: tesserix
  annotations:
    # Never prune or overwrite: the contents are controller-generated. If this
    # object is deleted the webhook error loop returns immediately.
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
