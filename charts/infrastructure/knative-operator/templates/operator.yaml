{{- $version := .Values.version }}
# Knative Operator CRDs and core components
# This installs the operator which then manages KnativeServing/KnativeEventing CRs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knative-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: knative-operator
rules:
  - apiGroups: ["operator.knative.dev"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["serving.knative.dev", "eventing.knative.dev", "sources.knative.dev", "flows.knative.dev", "messaging.knative.dev"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["autoscaling.internal.knative.dev", "networking.internal.knative.dev", "caching.internal.knative.dev"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "namespaces", "serviceaccounts", "configmaps", "secrets", "events", "pods"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
  - apiGroups: ["networking.istio.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["security.istio.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["authentication.istio.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["cert-manager.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: knative-operator
subjects:
  - kind: ServiceAccount
    name: knative-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: knative-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knative-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: knative-operator
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knative-operator
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      serviceAccountName: knative-operator
      containers:
        - name: knative-operator
          image: gcr.io/knative-releases/knative.dev/operator/cmd/operator:v{{ $version }}
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_DOMAIN
              value: knative.dev/operator
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: operator-webhook
    app.kubernetes.io/version: {{ $version | quote }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: operator-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator-webhook
        app.kubernetes.io/version: {{ $version | quote }}
    spec:
      serviceAccountName: knative-operator
      containers:
        - name: operator-webhook
          image: gcr.io/knative-releases/knative.dev/operator/cmd/webhook:v{{ $version }}
          ports:
            - containerPort: 9090
              name: metrics
            - containerPort: 8443
              name: https-webhook
            - containerPort: 8008
              name: profiling
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_DOMAIN
              value: knative.dev/operator
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
            - name: WEBHOOK_NAME
              value: operator-webhook
            - name: WEBHOOK_PORT
              value: "8443"
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: operator-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: operator-webhook
spec:
  ports:
    - name: https-webhook
      port: 443
      targetPort: 8443
  selector:
    app.kubernetes.io/name: operator-webhook
