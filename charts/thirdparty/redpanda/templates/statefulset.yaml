apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redpanda.name" . }}
  labels:
    {{- include "redpanda.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redpanda.headless" . }}
  replicas: {{ .Values.replicaCount }}
  # Brokers discover each other through seed_servers, so they can start
  # together; serialising them only delays quorum after a node loss.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "redpanda.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # The Kafka protocol is not HTTP; keep the mesh out of the hot path.
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "redpanda.selectorLabels" . | nindent 8 }}
        {{- include "redpanda.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          # One broker per node. Two brokers on one Spot node means a single
          # preemption costs the Raft majority.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "redpanda.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for a clean leadership handoff and segment flush on drain.
      terminationGracePeriodSeconds: 60
      initContainers:
        {{/*
        Substitutes the two per-pod values into redpanda.yaml. node_id is the
        pod ordinal, which is stable because the StatefulSet pairs each ordinal
        with the same PVC — a rescheduled broker keeps its identity and its log.
        */}}
        - name: config-gen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            # Only writes the rendered config into the mounted emptyDir, so it
            # needs no writable root of its own.
            readOnlyRootFilesystem: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              ORDINAL="${HOSTNAME##*-}"
              FQDN="${HOSTNAME}.{{ include "redpanda.headless" . }}.{{ .Release.Namespace }}.svc.cluster.local"
              sed -e "s/__NODE_ID__/${ORDINAL}/" \
                  -e "s/__POD_FQDN__/${FQDN}/g" \
                  /config-src/redpanda-base.yaml > /config-out/redpanda.yaml
              echo "rendered redpanda.yaml for node_id=${ORDINAL} advertised=${FQDN}"
          volumeMounts:
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config
              mountPath: /config-out
      containers:
        - name: redpanda
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - /usr/bin/rpk
            - redpanda
            - start
            - --config=/etc/redpanda/redpanda.yaml
          ports:
            - name: kafka
              containerPort: {{ .Values.ports.kafka }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.ports.admin }}
              protocol: TCP
            - name: rpc
              containerPort: {{ .Values.ports.rpc }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
            - name: config
              mountPath: /etc/redpanda
          # /v1/status/ready on the admin API reports whether this broker has
          # joined the cluster, which is stricter (and more useful) than a TCP
          # check on the Kafka port.
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Recovering a large log after a preemption can take minutes.
          startupProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            periodSeconds: 10
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-src
          configMap:
            name: {{ include "redpanda.name" . }}-config
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "redpanda.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
