apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-cluster.name" . }}-config
  labels:
    {{- include "otel-cluster.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.ports.health }}

    receivers:
      {{- if .Values.events.enabled }}
      # Kubernetes events, streamed as logs. This is the signal that explains
      # WHY a pod died -- OOMKilled, FailedScheduling, ImagePullBackOff,
      # Unhealthy -- and etcd throws it away after about an hour.
      k8sobjects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
            group: {{ .Values.events.group }}
            exclude_watch_type:
              {{- range .Values.events.excludeWatchType }}
              - {{ . }}
              {{- end }}
            {{- with .Values.events.namespaces }}
            # Scoped to the same allowlist the agent collects container logs
            # for; see events.namespaces in values.yaml.
            namespaces:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
      {{- end }}

      {{- if .Values.metrics.enabled }}
      # Scrapes the same prometheus.io/scrape-annotated pods the existing
      # Prometheus server does, so no application needs to change to be
      # included. Prometheus keeps high-resolution recent data and owns
      # alerting; this copy is the long-term history.
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: {{ .Values.metrics.scrapeInterval }}
              scrape_timeout: {{ .Values.metrics.scrapeTimeout }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # Opt-in only, via the annotation the estate already uses.
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                # $$ rather than $ — the collector expands $-prefixed tokens as
                # environment variables, so a bare $1 would be eaten before
                # Prometheus ever sees the replacement.
                - source_labels:
                    - __address__
                    - __meta_kubernetes_pod_annotation_prometheus_io_port
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
                # Named to match the k8s.* resource attributes the rest of the
                # pipeline uses, so a metric can be joined to a log or a trace.
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: k8s_namespace_name
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: k8s_pod_name
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: replace
                  target_label: k8s_node_name
      {{- end }}

    processors:
      memory_limiter:
        check_interval: {{ .Values.processors.memoryLimiter.checkInterval }}
        limit_percentage: {{ .Values.processors.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.processors.memoryLimiter.spikeLimitPercentage }}

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name

      batch:
        send_batch_size: {{ .Values.processors.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.processors.batch.sendBatchMaxSize }}
        timeout: {{ .Values.processors.batch.timeout }}

    exporters:
      otlp:
        endpoint: {{ .Values.gateway.endpoint | quote }}
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          max_elapsed_time: 0

    service:
      extensions:
        - health_check
      pipelines:
        {{- if .Values.events.enabled }}
        # Events travel as logs: they are discrete timestamped records with a
        # message, which is exactly the log data model.
        logs:
          receivers: [k8sobjects]
          processors: [memory_limiter, batch]
          exporters: [otlp]
        {{- end }}
        {{- if .Values.metrics.enabled }}
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp]
        {{- end }}
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.ports.metrics }}
