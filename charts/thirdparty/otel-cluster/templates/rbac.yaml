apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-cluster.name" . }}
  labels:
    {{- include "otel-cluster.labels" . | nindent 4 }}
{{- if .Values.rbac.create }}
---
{{/*
Broader than the agent's, because this tier discovers scrape targets across the
whole cluster and watches the cluster-wide event stream. Still read-only
throughout — no create, update, patch or delete on anything.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-cluster.name" . }}
  labels:
    {{- include "otel-cluster.labels" . | nindent 4 }}
rules:
  # Prometheus service discovery (role: pod) plus k8sattributes enrichment.
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
      - nodes/metrics
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  # Kubernetes events. Both API groups: core/v1 still carries events emitted by
  # older components, events.k8s.io carries the modern ones.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Required by Prometheus service discovery to reach pod metrics endpoints.
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-cluster.name" . }}
  labels:
    {{- include "otel-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-cluster.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-cluster.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
