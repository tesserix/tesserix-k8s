# OTel Collector cluster tier — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/otel-cluster.yaml (the redis-global pattern).
#
# NOTE: this must stay a singleton — see Chart.yaml. replicaCount accepts only
# 1 (running) or 0 (parked); anything higher double-stores every metric.
# PARKED 2026-08-01 at 0 for cost — restore to 1 to revive; see docs/observability-park.md
replicaCount: 0

image:
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  # On a Spot pool every preemption re-pulls this image, so keeping the pull
  # inside asia-south1 removes both the egress cost and a slow cold start.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  # IfNotPresent, deliberately. This is a third-party image on a pinned tag, so
  # the content behind that tag never changes and re-pulling gains nothing.
  # It matters here because the stack runs on a Spot pool: Always would re-pull
  # from GAR on every pod restart, and preemptions make restarts routine.
  # Our own images (obs-api, obs-ui) use Always instead, because they track a
  # moving `main` tag that genuinely does change.
  pullPolicy: IfNotPresent

ports:
  metrics: 8888
  health: 13133

gateway:
  endpoint: otel-gateway.observability.svc.cluster.local:4317

events:
  enabled: true
  # events.k8s.io is the modern API group. `watch` streams changes rather than
  # re-listing, so a busy cluster does not hammer the API server.
  group: events.k8s.io
  # DELETED fires when an event ages out of etcd, which is not a real
  # occurrence and would double-count every event.
  excludeWatchType:
    - DELETED
  # Watch events only in the namespaces whose container logs we keep. Events
  # are logs in this pipeline, so leaving this cluster-wide would put
  # kube-system and argocd back into otel_logs through the side door after the
  # agent stopped collecting their container output.
  #
  # This is not a loss of pod-failure signal: an event is namespaced to the
  # object it is about, so an OOMKill or FailedScheduling on a homechef pod
  # raises an event in `homechef`, not in kube-system. What is dropped is
  # events about the excluded namespaces' own workloads.
  #
  # MUST match filelog.namespaces in charts/thirdparty/otel-agent/values.yaml.
  # Two charts, two collectors, one policy — if they drift, a namespace ends up
  # contributing events but no container logs, which reads as a service that
  # only ever speaks up when it crashes.
  namespaces:
    - homechef
    - mark8ly
    - tesserix
    - support-platform
    - stockpilot
    - openpanel
    - nats
    - marketplace
    - agentregistry-system
    - agentgateway-system
    - devai
    - devai-previews
    - translation
    - identity-customer
    - identity-internal
    - growthbook
    - mongodb-blog
    - istio-system
    - istio-ingress
    - istio-egress

metrics:
  enabled: true
  # 60s, against Prometheus's 15s. This store is for history, not alerting.
  scrapeInterval: 60s
  scrapeTimeout: 30s

processors:
  memoryLimiter:
    checkInterval: 5s
    limitPercentage: 80
    spikeLimitPercentage: 25
  batch:
    sendBatchSize: 4096
    sendBatchMaxSize: 8192
    timeout: 10s

# Memory-only per platform policy: no CPU requests or limits anywhere.
# Scraping several hundred pods holds a lot of series in memory between flushes.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations:
  # Self-monitoring. This tier scrapes annotated pods and so will also scrape
  # itself, which is intentional: scraping /metrics emits no telemetry, so
  # there is no feedback loop, and its own queue depth and refused-sample
  # counters are the first place to look when ingestion stalls.
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

rbac:
  create: true

nodeSelector:
  workload: observability

tolerations:
  - key: workload
    operator: Equal
    value: observability
    effect: NoSchedule
