apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otel-gateway.name" . }}
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}
{{- if .Values.rbac.create }}
---
{{/*
k8sattributes resolves a sender's IP to its pod, then reads that pod's owner
chain. That lookup is cluster-wide and read-only.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otel-gateway.name" . }}
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otel-gateway.name" . }}
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otel-gateway.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otel-gateway.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
