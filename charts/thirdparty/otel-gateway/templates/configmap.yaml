apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-gateway.name" . }}-config
  labels:
    {{- include "otel-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      {{- if .Values.queue.enabled }}
      # Backs the exporter's sending queue with the PVC. Without this the queue
      # is memory-only and a restart drops whatever it was holding.
      file_storage/queue:
        directory: {{ .Values.queue.directory }}
        timeout: 10s
        fsync: {{ .Values.queue.fsync }}
      {{- end }}
      health_check:
        endpoint: 0.0.0.0:{{ .Values.ports.health }}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.ports.otlpGrpc }}
            # Applications send large trace batches; the 4MiB default rejects
            # them with a confusing RESOURCE_EXHAUSTED.
            max_recv_msg_size_mib: 16
          http:
            endpoint: 0.0.0.0:{{ .Values.ports.otlpHttp }}

    processors:
      # MUST be first in every pipeline. It sheds load by refusing new data
      # when memory climbs, which turns an OOM kill into retryable backpressure.
      memory_limiter:
        check_interval: {{ .Values.processors.memoryLimiter.checkInterval }}
        limit_percentage: {{ .Values.processors.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.processors.memoryLimiter.spikeLimitPercentage }}

      # Turns the sender's pod IP into k8s.* attributes, so telemetry is
      # attributable to a workload without every service having to set them.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.node.name
            - k8s.container.name
            # Image identity, so a SPAN can be traced back to the commit that
            # produced it and not just a log line.
            #
            # The agent stamps these onto scraped container logs, but traces
            # arrive over OTLP straight from the SDK and never pass through
            # that pipeline — so logs resolved to a build while traces resolved
            # to nothing, which reads as the feature being broken rather than
            # absent.
            #
            # These are CONTAINER-level attributes: k8sattributes can only
            # resolve them when k8s.container.name is already on the resource.
            # A service whose SDK does not report its container name therefore
            # stays unresolved, which surfaces as a build-level gap rather than
            # a wrong answer.
            - container.image.name
            - container.image.tag
            - container.image.repo_digests
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
              from: pod
            - tag_name: component
              key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      # Drop anything that is not an AI trace before it touches the buffer.
      # Agents stamp the marker on their resource (ai-agents agent_telemetry).
      filter/ai:
        error_mode: ignore
        traces:
          span:
            - resource.attributes[{{ .Values.aiFilter.attribute | quote }}] != {{ .Values.aiFilter.value | quote }}

      # Agents set service.namespace to their product, which is what the ingest
      # tier routes on. Anything that arrives without one is grouped under its
      # Kubernetes namespace so it can still be found, never silently lost.
      transform/product:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - set(attributes["service.namespace"], attributes["k8s.namespace.name"]) where attributes["service.namespace"] == nil and attributes["k8s.namespace.name"] != nil

      batch:
        send_batch_size: {{ .Values.processors.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.processors.batch.sendBatchMaxSize }}
        timeout: {{ .Values.processors.batch.timeout }}

    exporters:
      # One exporter serves all three signals; the per-signal blocks below pick
      # the topic. (Pre-0.150 this needed one exporter alias per signal.)
      kafka:
        brokers:
          {{- range .Values.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        client_id: otel-gateway
        traces:
          topic: {{ .Values.kafka.topics.traces | quote }}
          encoding: otlp_proto
        producer:
          required_acks: {{ .Values.kafka.requiredAcks }}
          compression: {{ .Values.kafka.compression }}
          max_message_bytes: {{ .Values.kafka.maxMessageBytes }}
        sending_queue:
          enabled: {{ .Values.queue.enabled }}
          {{- if .Values.queue.enabled }}
          storage: file_storage/queue
          {{- end }}
          queue_size: {{ .Values.queue.size }}
          num_consumers: {{ .Values.queue.numConsumers }}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          # 0 = retry forever. Combined with the on-disk queue this is the
          # "nothing is lost" guarantee: data is only dropped if the queue
          # itself fills, which surfaces as an alertable metric.
          max_elapsed_time: 0

    service:
      extensions:
        {{- if .Values.queue.enabled }}
        - file_storage/queue
        {{- end }}
        - health_check
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/ai, k8sattributes, transform/product, batch]
          exporters: [kafka]
      telemetry:
        metrics:
          # The `readers` form; the older `address:` field is removed in 0.156.
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.ports.metrics }}
