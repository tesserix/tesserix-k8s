{{- if .Values.letsencryptProd.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      {{- if .Values.cloudflare.enabled }}
      # DNS-01 challenge using Cloudflare (primary account)
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflare.apiTokenSecretName }}
              key: {{ .Values.cloudflare.apiTokenSecretKey }}
        selector:
          dnsZones:
            - {{ .Values.cloudflare.domain }}
            {{- range .Values.cloudflare.additionalDomains }}
            - {{ . }}
            {{- end }}
      {{- end }}
      {{- range .Values.additionalCloudflareAccounts }}
      # DNS-01 challenge using Cloudflare ({{ .name }})
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .apiTokenSecretName }}
              key: {{ .apiTokenSecretKey }}
        selector:
          dnsZones:
            {{- range .domains }}
            - {{ . }}
            {{- end }}
      {{- end }}
      {{- if and (not .Values.cloudflare.enabled) (not .Values.additionalCloudflareAccounts) }}
      # HTTP-01 challenge fallback
      - http01:
          ingress:
            ingressClassName: kong
      {{- end }}
{{- end }}

