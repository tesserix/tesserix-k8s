# Production overrides for cert-manager-issuers
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production uses letsencrypt-prod issuer
clusterIssuers:
  - name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@tesserix.app
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
