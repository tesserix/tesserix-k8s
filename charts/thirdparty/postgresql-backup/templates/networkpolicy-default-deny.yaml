{{- if .Values.networkPolicy.enabled }}
# Default deny all ingress and egress for the namespace
# Individual pods must have their own network policies to allow traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgresql-backup.fullname" . }}-default-deny
  labels:
    {{- include "postgresql-backup.labels" . | nindent 4 }}
spec:
  # Apply to all pods in the namespace
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Empty rules = deny all
  ingress: []
  egress: []
{{- end }}
