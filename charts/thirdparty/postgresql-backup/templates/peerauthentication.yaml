{{- if .Values.istio.disableMtls }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "postgresql-backup.fullname" . }}-mtls
  labels:
    {{- include "postgresql-backup.labels" . | nindent 4 }}
spec:
  # Disable mTLS for backup pods since they don't have Istio sidecar
  mtls:
    mode: DISABLE
{{- end }}
