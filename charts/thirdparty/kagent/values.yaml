# kagent controller — defaults
#
# ───────────────────────────────────────────────────────────────────────
# IMPORTANT: verify the image reference against the upstream release:
#   https://github.com/kagent-dev/kagent
# ───────────────────────────────────────────────────────────────────────

image:
  # Verified against https://github.com/kagent-dev/kagent releases
  # (v0.9.4 latest as of 2026-05-14). The controller container lives at
  # ghcr.io/kagent-dev/kagent/controller — the bare /kagent path does
  # not exist (returns 403).
  repository: ghcr.io/kagent-dev/kagent/controller
  # Upstream publishes container tags without the `v` prefix even
  # though the GitHub release is tagged v0.9.4.
  tag: "0.9.4"
  pullPolicy: IfNotPresent

# Scaled to 0 until we install kagent's own bundled Helm chart
# (oci://ghcr.io/kagent-dev/kagent/helm/kagent) which provisions
# the kagent-postgresql StatefulSet the controller requires. Our
# hand-rolled controller-only Deployment can't migrate the schema
# because the upstream binary expects a Postgres at
# kagent-postgresql.kagent.svc.cluster.local that doesn't exist.
replicaCount: 0

namespace:
  create: true
  name: kagent-system
  istioInjection: enabled

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

aregistry:
  # Our agentic-registry Service exposes the HTTP API on 12121 (targetPort
  # 8080); the old :8080 pointed at a non-existent service port.
  endpoint: http://agentregistry.agentregistry-system.svc.cluster.local:12121
  jwtSecret:
    name: aregistry-jwt
    key: jwt-secret

# Default values applied to every Agent CR the controller reconciles
# (each spec can override). Kept tight by default; long-lived agents
# scale up via HPA when needed.
agentDefaults:
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi
  replicas: 1

# Watch scope. Default is "all namespaces". Lock down later by setting
# `--namespaces=devai,fanzone,...` once tenants are real.
watch:
  allNamespaces: true

metrics:
  enabled: true
  port: 9090
