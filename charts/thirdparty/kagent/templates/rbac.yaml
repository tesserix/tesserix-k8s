apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-controller
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-controller
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  # Reconciliation targets — kagent creates Deployments + Services from Agent CRs
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "events", "pods", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Agent CR (registered in aregistry-system, but the CRD itself is cluster-scoped)
  - apiGroups: ["solo.io"]
    resources: ["agents", "agents/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-controller
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kagent-controller
    namespace: {{ .Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagent-controller
