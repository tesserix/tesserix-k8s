apiVersion: v2
name: kagent
description: >-
  kagent — the Kubernetes-native long-lived agent runtime. Reconciles
  `Agent` CRs (defined in aregistry) into Deployments, so specs like
  staff_reviewer and release_manager that need persistent process
  identity have a real pod backing them.

  Ephemeral per-task agents stay as K8s Jobs (created directly by
  DevAI). kagent only manages the always-on specialists.

type: application
version: 0.1.0
appVersion: "0.6.0"
keywords:
  - kagent
  - agent-runtime
  - controller
maintainers:
  - name: tesserix-platform
