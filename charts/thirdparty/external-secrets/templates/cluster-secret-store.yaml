{{- if .Values.clusterSecretStore.enabled }}
# =============================================================================
# ClusterSecretStore for GCP Secret Manager
# =============================================================================
# Provides cluster-wide access to GCP Secret Manager
# Uses GKE Workload Identity for authentication (no credentials required)
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name | default "gcp-secret-store" }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: secret-store
spec:
  provider:
    gcpsm:
      # GCP Project ID containing the secrets
      projectID: {{ .Values.gcp.projectId | quote }}
      # Use Workload Identity - no explicit credentials needed
      # The External Secrets controller's service account has the annotation:
      #   iam.gke.io/gcp-service-account: external-secrets-sa@{project}.iam.gserviceaccount.com
      # This GSA needs roles/secretmanager.secretAccessor on the secrets
{{- end }}
