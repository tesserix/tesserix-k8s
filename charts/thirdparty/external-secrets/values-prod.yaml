# ⚠️  THIS FILE IS NOT LOADED BY ANYTHING. ⚠️
#
# The prod Application (argocd/prod/infrastructure/external-secrets.yaml) sets
# `helm.valueFiles: ["values.yaml"]` and carries its prod overrides INLINE in
# `helm.values`. Nothing anywhere references this file — verified by grepping
# argocd/ for it.
#
# It reads as authoritative and is not, which cost real time: a
# `monitoring.enabled: true` added here for tesserix-k8s#1032 rendered nothing,
# and ArgoCD correctly reported `Synced`/`Healthy` because there was genuinely
# nothing to create. Put prod settings in the Application's inline `values`.
#
# It is also STALE: the serviceAccount annotation below names
# `...@tesserix.iam.gserviceaccount.com`, while the live workload uses
# `app-secrets-ext-secrets-prod@tesseracthub-480811.iam.gserviceaccount.com`.
# Kept rather than deleted only so this warning has something to attach to;
# deleting it outright is the better end state.
#
# Original header follows.
#
# Production overrides for external-secrets
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production GCP project
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "app-secrets-external-secrets@tesserix.iam.gserviceaccount.com"

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1
