# Production overrides for external-secrets
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production GCP project
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "app-secrets-external-secrets@tesserix.iam.gserviceaccount.com"

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# The kps Prometheus Operator runs here, so the ServiceMonitor and
# PrometheusRule from templates/ are appliable and wanted. See
# templates/prometheusrule.yaml for why an unscraped ESO went unnoticed for
# six months.
monitoring:
  enabled: true
