# Production overrides for growthbook
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# One replica: the uploads PVC is ReadWriteOnce, so a second pod scheduled to
# another node sits in ContainerCreating forever.
replicaCount: 1

# Production resource allocation
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

# Production ingress
ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: growthbook.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: growthbook-tls
      hosts:
        - growthbook.tesserix.app
