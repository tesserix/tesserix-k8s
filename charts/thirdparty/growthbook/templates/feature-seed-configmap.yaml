  seed.sh: |
    #!/bin/sh
    set -e

    echo "=============================================="
    echo "  GrowthBook Initialization Script"
    echo "  Environment: {{ .Values.featureSeeding.environment | default "devtest" }}"
    echo "=============================================="

    # Configuration
    GB_HOST="${GROWTHBOOK_HOST:-http://{{ include "growthbook.fullname" . }}:{{ .Values.service.apiPort }}}"
    ADMIN_EMAIL="${ADMIN_EMAIL:-{{ .Values.featureSeeding.adminEmail }}}"
    ADMIN_PASSWORD="${ADMIN_PASSWORD}"
    ADMIN_NAME="${ADMIN_NAME:-{{ .Values.featureSeeding.adminName | default "Admin" }}}"
    ORG_NAME="${ORG_NAME:-{{ .Values.featureSeeding.organizationName | default "Tesserix" }}}"
    SDK_NAME="${SDK_NAME:-{{ .Values.featureSeeding.sdkConnectionName | default "Tesserix Platform" }}}"
    SDK_ENV="${SDK_ENV:-{{ .Values.featureSeeding.sdkEnvironment | default "production" }}}"
    MAX_RETRIES=60
    RETRY_INTERVAL=5

    # Check required variables
    if [ -z "$ADMIN_PASSWORD" ]; then
      echo "ERROR: ADMIN_PASSWORD environment variable is required"
      exit 1
    fi

    # Wait for GrowthBook to be healthy
    echo "[INFO] Waiting for GrowthBook at $GB_HOST..."
    retry_count=0
    until curl -sf "${GB_HOST}/healthcheck" > /dev/null 2>&1; do
      retry_count=$((retry_count + 1))
      if [ $retry_count -ge $MAX_RETRIES ]; then
        echo "ERROR: GrowthBook not ready after ${MAX_RETRIES} retries"
        exit 1
      fi
      echo "  Waiting... (attempt $retry_count/$MAX_RETRIES)"
      sleep $RETRY_INTERVAL
    done
    echo "[SUCCESS] GrowthBook is healthy!"

    # Step 1: Register admin user (may fail if exists - that's OK)
    echo ""
    echo "[INFO] Step 1: Registering admin user: $ADMIN_EMAIL"
    REGISTER_RESULT=$(curl -s -X POST "${GB_HOST}/auth/register" \
      -H "Content-Type: application/json" \
      -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\",\"name\":\"${ADMIN_NAME}\"}" 2>&1) || true

    if echo "$REGISTER_RESULT" | grep -q '"token"'; then
      echo "[SUCCESS] Admin user registered successfully"
    elif echo "$REGISTER_RESULT" | grep -q "already registered\|duplicate"; then
      echo "[INFO] Admin user already exists"
    else
      echo "[INFO] Registration response: $REGISTER_RESULT"
    fi

    # Step 2: Login to get token
    echo ""
    echo "[INFO] Step 2: Logging in as $ADMIN_EMAIL..."
    LOGIN_RESULT=$(curl -s -X POST "${GB_HOST}/auth/login" \
      -H "Content-Type: application/json" \
      -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}")

    TOKEN=$(echo "$LOGIN_RESULT" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
    if [ -z "$TOKEN" ]; then
      echo "ERROR: Failed to get authentication token"
      echo "Login result: $LOGIN_RESULT"
      exit 1
    fi
    echo "[SUCCESS] Successfully authenticated!"

    # Step 3: Get or create organization
    echo ""
    echo "[INFO] Step 3: Getting/creating organization: $ORG_NAME"
    USER_INFO=$(curl -s "${GB_HOST}/user" \
      -H "Authorization: Bearer ${TOKEN}")

    ORG_ID=$(echo "$USER_INFO" | sed -n 's/.*"organizations":\[{"id":"\([^"]*\)".*/\1/p')

    if [ -z "$ORG_ID" ]; then
      echo "[INFO] No organization found, creating one..."
      CREATE_ORG_RESULT=$(curl -s -X POST "${GB_HOST}/organization" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"company\":\"${ORG_NAME}\"}")

      ORG_ID=$(echo "$CREATE_ORG_RESULT" | sed -n 's/.*"orgId":"\([^"]*\)".*/\1/p')
      echo "[SUCCESS] Created organization: $ORG_ID"
    else
      echo "[INFO] Organization already exists: $ORG_ID"
    fi

    if [ -z "$ORG_ID" ]; then
      echo "ERROR: Failed to get or create organization"
      exit 1
    fi

    # Step 4: Create SDK connection
    echo ""
    echo "[INFO] Step 4: Creating SDK connection: $SDK_NAME"
    SDK_CONNECTIONS=$(curl -s "${GB_HOST}/sdk-connections" \
      -H "Authorization: Bearer ${TOKEN}" \
      -H "x-organization: ${ORG_ID}")

    SDK_KEY=$(echo "$SDK_CONNECTIONS" | sed -n 's/.*"key":"\(sdk-[^"]*\)".*/\1/p' | head -1)

    if [ -z "$SDK_KEY" ]; then
      SDK_RESULT=$(curl -s -X POST "${GB_HOST}/sdk-connections" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "x-organization: ${ORG_ID}" \
        -H "Content-Type: application/json" \
        -d "{\"name\":\"${SDK_NAME}\",\"languages\":[\"javascript\",\"nocode-other\"],\"environment\":\"${SDK_ENV}\",\"projects\":[],\"encryptPayload\":false}")

      SDK_KEY=$(echo "$SDK_RESULT" | sed -n 's/.*"key":"\(sdk-[^"]*\)".*/\1/p')
      echo "[SUCCESS] Created SDK connection with key: $SDK_KEY"
    else
      echo "[INFO] SDK connection already exists with key: $SDK_KEY"
    fi

    # Step 5: Create feature flags
    echo ""
    echo "[INFO] Step 5: Creating feature flags..."

    FEATURES=$(cat /config/features.json)
    CREATED=0
    SKIPPED=0

    # Get existing features
    EXISTING_FEATURES=$(curl -s "${GB_HOST}/feature" \
      -H "Authorization: Bearer ${TOKEN}" \
      -H "x-organization: ${ORG_ID}")

    # Parse features from JSON and create each one
    echo "$FEATURES" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | while read FEATURE_ID; do
      if [ -z "$FEATURE_ID" ]; then continue; fi

      # Check if feature exists
      if echo "$EXISTING_FEATURES" | grep -q "\"id\":\"${FEATURE_ID}\""; then
        echo "  [SKIP] $FEATURE_ID (already exists)"
        continue
      fi

      # Get feature details
      DESCRIPTION=$(echo "$FEATURES" | grep "\"id\":\"${FEATURE_ID}\"" | sed -n 's/.*"description":"\([^"]*\)".*/\1/p')
      DEFAULT_VALUE=$(echo "$FEATURES" | grep "\"id\":\"${FEATURE_ID}\"" | sed -n 's/.*"defaultValue":"\([^"]*\)".*/\1/p')
      TAGS=$(echo "$FEATURES" | grep "\"id\":\"${FEATURE_ID}\"" | sed -n 's/.*"tags":\(\[[^]]*\]\).*/\1/p')

      if [ -z "$TAGS" ]; then TAGS='["general"]'; fi
      if [ -z "$DEFAULT_VALUE" ]; then DEFAULT_VALUE="false"; fi

      # Convert defaultValue string to boolean for JSON
      if [ "$DEFAULT_VALUE" = "true" ]; then
        DEFAULT_BOOL="true"
      else
        DEFAULT_BOOL="false"
      fi

      # Create feature with environmentSettings (required by GrowthBook API)
      RESULT=$(curl -s -X POST "${GB_HOST}/feature" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "x-organization: ${ORG_ID}" \
        -H "Content-Type: application/json" \
        -d "{
          \"id\": \"${FEATURE_ID}\",
          \"description\": \"${DESCRIPTION}\",
          \"valueType\": \"boolean\",
          \"defaultValue\": ${DEFAULT_BOOL},
          \"tags\": ${TAGS},
          \"environmentSettings\": {\"production\": {\"enabled\": true, \"rules\": []}}
        }" 2>&1) || true

      if echo "$RESULT" | grep -q '"id"'; then
        echo "  [CREATED] $FEATURE_ID (default: $DEFAULT_BOOL)"
      elif echo "$RESULT" | grep -q "already exists"; then
        echo "  [SKIP] $FEATURE_ID (already exists)"
      else
        echo "  [WARN] $FEATURE_ID - $(echo $RESULT | head -c 80)"
      fi
    done

    # Summary
    echo ""
    echo "=============================================="
    echo "  GrowthBook Initialization Complete!"
    echo "=============================================="
    echo ""
    echo "Organization:    $ORG_NAME ($ORG_ID)"
    echo "Admin Email:     $ADMIN_EMAIL"
    echo "SDK Key:         $SDK_KEY"
    echo ""
    echo "Next Steps:"
    echo "  1. Store SDK key in feature-flags-service config"
    echo "  2. Configure admin panel with:"
    echo "     NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY=$SDK_KEY"
    echo ""

    # Output SDK key to a shared location for other init containers
    if [ -d "/shared" ]; then
      echo "$SDK_KEY" > /shared/sdk-key
      echo "$ORG_ID" > /shared/org-id
    fi

    # Step 6: Create Kubernetes secret with SDK key (if enabled)
    if [ "$CREATE_SDK_SECRET" = "true" ] && [ -n "$SDK_KEY" ]; then
      echo ""
      echo "[INFO] Step 6: Creating Kubernetes secret with SDK key..."

      # Get Kubernetes API server details from mounted service account
      K8S_API="https://kubernetes.default.svc"
      TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

      # Base64 encode the SDK key
      SDK_KEY_B64=$(echo -n "$SDK_KEY" | base64 | tr -d '\n')

      # Create or update the secret
      SECRET_JSON="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"${SDK_SECRET_NAME}\",\"namespace\":\"${SDK_SECRET_NAMESPACE}\"},\"type\":\"Opaque\",\"data\":{\"sdk-client-key\":\"${SDK_KEY_B64}\"}}"

      # Try to create the secret, if it exists, patch it
      CREATE_RESULT=$(curl -s -X POST "${K8S_API}/api/v1/namespaces/${SDK_SECRET_NAMESPACE}/secrets" \
        --cacert "$CACERT" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "$SECRET_JSON" 2>&1)

      if echo "$CREATE_RESULT" | grep -q '"kind":"Secret"'; then
        echo "[SUCCESS] Created secret ${SDK_SECRET_NAME} in namespace ${SDK_SECRET_NAMESPACE}"
      elif echo "$CREATE_RESULT" | grep -q "already exists"; then
        # Secret exists, try to patch it
        PATCH_RESULT=$(curl -s -X PATCH "${K8S_API}/api/v1/namespaces/${SDK_SECRET_NAMESPACE}/secrets/${SDK_SECRET_NAME}" \
          --cacert "$CACERT" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/strategic-merge-patch+json" \
          -d "{\"data\":{\"sdk-client-key\":\"${SDK_KEY_B64}\"}}" 2>&1)

        if echo "$PATCH_RESULT" | grep -q '"kind":"Secret"'; then
          echo "[SUCCESS] Updated secret ${SDK_SECRET_NAME} in namespace ${SDK_SECRET_NAMESPACE}"
        else
          echo "[WARN] Failed to update secret: $(echo $PATCH_RESULT | head -c 100)"
        fi
      else
        echo "[WARN] Failed to create secret: $(echo $CREATE_RESULT | head -c 100)"
      fi
    fi

    echo "[SUCCESS] GrowthBook is ready to use!"
{{- end }}
