{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if .Values.helivantaDedicated.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  {{- end }}
  name: {{ include "growthbook.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "growthbook.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
