{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "growthbook.fullname" . }}-mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "growthbook.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: {{ include "growthbook.name" . }}-mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
