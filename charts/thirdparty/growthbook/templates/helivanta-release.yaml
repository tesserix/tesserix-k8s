{{- if .Values.helivantaRelease.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helivanta-growthbook-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: growthbook-helivanta-release
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  namespace: {{ .Release.Namespace }}
data:
  helivanta-release.mjs: |
{{ .Files.Get "files/helivanta-release.mjs" | indent 4 }}
  helivanta-management.mjs: |
{{ .Files.Get "files/helivanta-management.mjs" | indent 4 }}
  helivanta-release.json: |
{{ $config := .Files.Get "files/helivanta-release.json" | fromJson }}
{{ $_ := set $config "consoleManaged" .Values.helivantaRelease.consoleManaged }}
{{ $config | toPrettyJson | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: growthbook-helivanta-release
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helivanta-growthbook-seed
        app.kubernetes.io/part-of: helivanta
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: helivanta-growthbook-seed
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: {{ include "growthbook.image" . | quote }}
          command: [node, /config/helivanta-release.mjs, --run]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: admin, mountPath: /var/run/growthbook-admin, readOnly: true}
            - {name: bao, mountPath: /var/run/bao, readOnly: true}
      volumes:
        - name: config
          configMap: {name: growthbook-helivanta-release}
        - name: admin
          secret:
            secretName: {{ .Values.featureSeeding.adminPasswordSecret.name }}
            defaultMode: 0440
        - name: bao
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
{{- end }}
