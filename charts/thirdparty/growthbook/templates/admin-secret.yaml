{{- if and .Values.featureSeeding.enabled .Values.featureSeeding.createAdminSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.featureSeeding.adminPasswordSecret.name | default "growthbook-admin-secret" }}
  labels:
    {{- include "growthbook.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.featureSeeding.adminPassword | b64enc | quote }}
{{- end }}
---
{{- if and .Values.featureSeeding.enabled .Values.featureSeeding.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.featureSeeding.adminPasswordSecret.name | default "growthbook-admin-secret" }}
  labels:
    {{- include "growthbook.labels" . | nindent 4 }}
spec:
  encryptedData:
    password: {{ .Values.featureSeeding.sealedSecret.encryptedPassword | quote }}
  template:
    metadata:
      name: {{ .Values.featureSeeding.adminPasswordSecret.name | default "growthbook-admin-secret" }}
      labels:
        {{- include "growthbook.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
