apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocketchat-production-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-rocketchat-production
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-rocketchat-production
          serviceAccountRef: {name: rocketchat-production-reader}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rocketchat-runtime
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: openbao-rocketchat-production}
  target: {name: rocketchat-runtime, creationPolicy: Owner}
  data:
    - secretKey: mongodb-uri
      remoteRef: {key: rocketchat/prod/app/rocketchat-mongodb-uri, property: value}
    - secretKey: zitadel-client-id
      remoteRef: {key: rocketchat/prod/app/rocketchat-zitadel-client-id, property: value}
    - secretKey: zitadel-client-secret
      remoteRef: {key: rocketchat/prod/app/rocketchat-zitadel-client-secret, property: value}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rocketchat-database
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: openbao-rocketchat-production}
  target: {name: rocketchat-database, creationPolicy: Owner}
  data:
    - secretKey: root-password
      remoteRef: {key: rocketchat/prod/app/rocketchat-mongodb-root-password, property: value}
    - secretKey: password
      remoteRef: {key: rocketchat/prod/app/rocketchat-mongodb-password, property: value}
    - secretKey: keyfile
      remoteRef: {key: rocketchat/prod/app/rocketchat-mongodb-keyfile, property: value}
