apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-mongodb-bootstrap
data:
  bootstrap.js: |
{{ .Files.Get "files/mongodb-bootstrap.js" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rocketchat-mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: rocketchat-mongodb}
  ports: [{name: mongodb, port: 27017, targetPort: mongodb}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketchat-mongodb
spec:
  replicas: 3
  serviceName: rocketchat-mongodb
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app: rocketchat-mongodb}
  template:
    metadata:
      labels: {app: rocketchat-mongodb}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: rocketchat-mongodb}}
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: rocketchat-mongodb}}
      initContainers:
        - name: keyfile
          image: {{ .Values.mongodb.image | quote }}
          command: [sh, -ec, 'cp /secret/keyfile /key/keyfile; chmod 400 /key/keyfile']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {memory: 32Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: secret, mountPath: /secret, readOnly: true}
            - {name: key, mountPath: /key}
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image | quote }}
          command: [mongod]
          args: [--replSet, rs0, --bind_ip_all, --auth, --keyFile, /key/keyfile, --wiredTigerCacheSizeGB, "0.5"]
          ports: [{name: mongodb, containerPort: 27017}]
          env:
            - {name: HOME, value: /tmp}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: MONGODB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: rocketchat-database, key: root-password}}
            - name: MONGODB_PASSWORD
              valueFrom: {secretKeyRef: {name: rocketchat-database, key: password}}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -ec
                  - |
                    [ "${HOSTNAME##*-}" = 0 ] || exit 0
                    for attempt in $(seq 1 60); do
                      mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break
                      sleep 2
                    done
                    mongosh --quiet /bootstrap/bootstrap.js >/tmp/bootstrap.log 2>&1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toJson .Values.mongodb.resources }}
          startupProbe:
            tcpSocket: {port: mongodb}
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, 'const h = db.hello(); quit(h.isWritablePrimary || h.secondary ? 0 : 1)']
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: {port: mongodb}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: configdb, mountPath: /data/configdb}
            - {name: tmp, mountPath: /tmp}
            - {name: key, mountPath: /key, readOnly: true}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
      volumes:
        - {name: key, emptyDir: {medium: Memory}}
        - {name: tmp, emptyDir: {}}
        - {name: configdb, emptyDir: {}}
        - name: secret
          secret: {secretName: rocketchat-database, items: [{key: keyfile, path: keyfile}]}
        - name: bootstrap
          configMap: {name: rocketchat-mongodb-bootstrap}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.mongodb.storageClass }}
        resources:
          requests: {storage: {{ .Values.mongodb.storage }}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rocketchat-mongodb
spec:
  minAvailable: 2
  selector: {matchLabels: {app: rocketchat-mongodb}}
