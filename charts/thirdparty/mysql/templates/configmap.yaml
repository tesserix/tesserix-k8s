apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
data:
  my.cnf: |
    [mysqld]
    max_connections = {{ .Values.config.maxConnections }}
    character-set-server = {{ .Values.config.characterSetServer }}
    collation-server = {{ .Values.config.collationServer }}

    # Performance tuning
    innodb_buffer_pool_size = 256M
    innodb_log_file_size = 64M
    innodb_flush_log_at_trx_commit = 2

    # Enable slow query log
    slow_query_log = 1
    slow_query_log_file = /var/log/mysql/slow.log
    long_query_time = 2

    [client]
    default-character-set = {{ .Values.config.characterSetServer }}

  init-databases.sh: |
    #!/bin/bash
    set -e

    echo "Starting database initialization..."

    # Create databases
    {{- range .Values.databases }}
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS {{ . }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    echo "Created database: {{ . }}"
    {{- end }}

    # Create users with passwords from environment variables
    {{- range .Values.users }}
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "DROP USER IF EXISTS '{{ .name }}'@'%';"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE USER '{{ .name }}'@'%' IDENTIFIED BY '$MYSQL_PASSWORD_{{ .name | upper }}';"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON {{ .database }}.* TO '{{ .name }}'@'%';"
    {{- if .extraPrivileges }}
    {{- range .extraPrivileges }}
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e '{{ . }};'
    {{- end }}
    {{- end }}
    echo "Created user: {{ .name }} with grants on {{ .database }}"
    {{- end }}

    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "FLUSH PRIVILEGES;"

    echo "Database initialization completed successfully."
