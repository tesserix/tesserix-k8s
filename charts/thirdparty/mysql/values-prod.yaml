# Production overrides for mysql
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production resource allocation
primary:
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 1Gi
  persistence:
    size: 50Gi

# Enable replication for production HA
replication:
  enabled: true
  readReplicas: 2

# Production configuration
configuration: |
  [mysqld]
  max_connections=200
  innodb_buffer_pool_size=2G
