apiVersion: v1
kind: Service
metadata:
  name: falco-ui-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falco-ui-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "falco-ui-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
