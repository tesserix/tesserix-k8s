{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: falco-ui-oauth2-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falco-ui-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: falco-ui-oauth2-secrets
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ .Values.externalSecret.secrets.clientId }}
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.externalSecret.secrets.clientSecret }}
    - secretKey: cookie-secret
      remoteRef:
        key: {{ .Values.externalSecret.secrets.cookieSecret }}
{{- end }}
