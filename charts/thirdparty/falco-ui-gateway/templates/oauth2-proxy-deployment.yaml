apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-ui-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falco-ui-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.oauth2Proxy.replicas }}
  selector:
    matchLabels:
      {{- include "falco-ui-gateway.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "falco-ui-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          args:
            - --provider={{ .Values.oauth2Proxy.provider }}
            - --oidc-issuer-url={{ .Values.oauth2Proxy.oidcIssuerUrl }}
            - --scope={{ .Values.oauth2Proxy.scope }}
            - --code-challenge-method=S256
            - --http-address=0.0.0.0:4180
            - --upstream={{ .Values.oauth2Proxy.upstream }}
            - --redirect-url={{ .Values.oauth2Proxy.redirectUrl }}
            - --cookie-name={{ .Values.oauth2Proxy.cookie.name }}
            - --cookie-secure={{ .Values.oauth2Proxy.cookie.secure }}
            - --cookie-expire={{ .Values.oauth2Proxy.cookie.expire }}
            - --cookie-refresh={{ .Values.oauth2Proxy.cookie.refresh }}
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --email-domain=*
            - --authenticated-emails-file=/etc/oauth2-proxy/authenticated-emails.txt
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: falco-ui-oauth2-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: falco-ui-oauth2-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: falco-ui-oauth2-secrets
                  key: cookie-secret
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: authenticated-emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: authenticated-emails
          configMap:
            name: falco-ui-oauth2-emails
