{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-blog-secret
  labels:
    app: mongodb-blog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: mongodb-blog-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGO_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}-blog-mongodb-root-password
{{- end }}
