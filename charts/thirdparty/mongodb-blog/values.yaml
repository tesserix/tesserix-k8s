# MongoDB for Tesserix Blog
# Namespace: mongodb-blog

image:
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

storage:
  size: 120Gi
  storageClassName: standard-rwo-retain

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

service:
  port: 27017

# External secret for root password
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"
  secretPrefix: "prod"
