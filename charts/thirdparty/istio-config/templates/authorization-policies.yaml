kind: AuthorizationPolicy
metadata:
  name: allow-mesh-internal-homechef
  namespace: {{ .Values.appNamespaces.homechef }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - {}

# deny-cross-product-to-homechef removed 2026-07-23 — its only denied source
# was fanzone (decommissioned); no other cross-product source was listed.

# =============================================================================
# Kora Namespace Policies
# Nutrition/food-memory API. Ambient-enrolled (waypoint), so ztunnel enforces
# authz. The generated public-endpoints-kora policy is L7 (paths/methods) which
# ztunnel cannot enforce — it strips the HTTP rules, leaving an ALLOW policy
# with no valid rule = deny-all, which is what kept kora-api unreachable (503
# even from inside the mesh; kubectl described the ZtunnelAccepted "HTTP
# attributes omitted" warning). These L4 namespace-level policies are what
# ztunnel CAN enforce, mirroring the working homechef set. App-layer GIP auth
# still gates real endpoints (e.g. /v1/dashboard → 401 without a token).
# =============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-kora
  namespace: {{ .Values.appNamespaces.kora }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-internal-kora
  namespace: {{ .Values.appNamespaces.kora }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Values.appNamespaces.kora }}
    - from:
        - source:
            namespaces:
              - {{ .Values.appNamespaces.global }}
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system
    # tesserix-home admin portal -> kora-api. This grant is namespace-level
    # at L4 (source namespace only, no `to:` path/method restriction) because
    # this policy carries no targetRefs — it binds to ztunnel, which is L4-only.
    # Enforcing L7 path/method rules in ambient mode requires attaching the
    # policy to the waypoint Gateway via targetRefs. Adding `to:`/`paths:` here
    # would leave an ALLOW policy with no valid rule, which evaluates as
    # deny-all (see the Kora Namespace Policies note above; that's what kept
    # kora-api 503ing even from inside the mesh). Confining the caller to
    # /v1/admin/* is done at the app layer (KORA_BFF_HMAC_KEY / bffauth), not
    # here. Recorded explicitly rather than relying on
    # allow-mesh-internal-kora's catch-all `- {}` rule, so tightening that
    # policy later does not silently break the admin surface.
    - from:
        - source:
            namespaces:
              - {{ .Values.appNamespaces.tesserix }}

---
# Allow mesh-internal traffic — the L4 allow-all that ztunnel enforces so the
# mesh-wide deny-all-default does not reset intra-namespace and gateway traffic.
# Same shape as allow-mesh-internal-homechef / -stockpilot / -scrapper.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-internal-kora
  namespace: {{ .Values.appNamespaces.kora }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - {}

