{{/*
AuthorizationPolicies - Defines access control policies for multi-namespace architecture
Implements product isolation with shared global services

DISABLED when .Values.features.authorizationPolicies.enabled is false
*/}}

{{- if .Values.features.authorizationPolicies.enabled }}

# =============================================================================
# Mesh-Wide Default Policy
# =============================================================================
---
# Default deny all - requires explicit allow rules
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all-default
  namespace: istio-system
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  # Empty spec means deny all by default when combined with specific allow rules
  {}

# =============================================================================
# Global Namespace Policies
# Shared services accessible by all app namespaces
# =============================================================================
---
# Allow ingress gateway to reach global services
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-global
  namespace: {{ .Values.appNamespaces.global }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress

---
# Allow all app namespaces to access global services
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-apps-to-global
  namespace: {{ .Values.appNamespaces.global }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    {{- range $key, $ns := .Values.appNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ $ns }}
    {{- end }}
    # Namespaces with their own restrictive egress policy still require an
    # explicit destination-side mesh authorization path to shared services.
    {{- range $ns := .Values.globalIngressExtraNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ $ns }}
    {{- end }}
    # Allow infrastructure namespaces that connect to global DB
    {{- range $key, $ns := .Values.infrastructureNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ $ns }}
    {{- end }}
    # Also allow from system namespaces
    - from:
        - source:
            namespaces:
              - istio-system
              - monitoring
              - kube-system

