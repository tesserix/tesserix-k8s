# =============================================================================
# OpenPanel Namespace Policies (web analytics)
# Was missing an allow-mesh-internal policy, so the mesh-wide deny-all reset
# intra-namespace traffic (openpanel-api/worker -> openpanel-redis, ECONNRESET),
# crashlooping the api/worker. Allow mesh-internal traffic like other namespaces.
# =============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-internal-openpanel
  namespace: {{ .Values.infrastructureNamespaces.openpanel }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - {}

# =============================================================================
# Database Access Policies
# Each app namespace can only access its own database namespace
# =============================================================================
{{- range $key, $dbNs := .Values.databaseNamespaces }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-{{ $key }}-db-access
  namespace: {{ $dbNs }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Only allow from corresponding app namespace
    - from:
        - source:
            namespaces:
              - {{ index $.Values.appNamespaces $key }}
        - source:
            principals:
              - "cluster.local/ns/{{ index $.Values.appNamespaces $key }}/sa/*"
{{- end }}

# =============================================================================
# Infrastructure Service Policies
# NATS, Typesense, Email accessible by all app namespaces
# =============================================================================
---
# NATS access policy
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-apps-to-nats
  namespace: nats
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    {{- range $key, $ns := .Values.appNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ $ns }}
    {{- end }}
    # otto queue events — support-platform is intentionally not in
    # appNamespaces (self-managed mesh); mirror of the NetworkPolicy rule.
    - from:
        - source:
            namespaces:
              - support-platform

---
# Typesense access policy
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-apps-to-typesense
  namespace: typesense
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    {{- range $key, $ns := .Values.appNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ $ns }}
    {{- end }}

# =============================================================================
# Infrastructure Service Policies
# Translation, Identity, GrowthBook, Photon
# =============================================================================
---
# Translation namespace access policy
# LibreTranslate, Bergamot, HuggingFace accessible by marketplace and global
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-apps-to-translation
  namespace: {{ .Values.infrastructureNamespaces.translation }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Allow marketplace (translation-service calls providers)
    - from:
        - source:
            namespaces:
              - {{ .Values.appNamespaces.global }}
    # Allow ingress for external testing
    - from:
        - source:
            namespaces:
              - istio-ingress
    # Allow monitoring
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system


---
# GrowthBook access policy
# All app namespaces need feature flags
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-apps-to-growthbook
  namespace: {{ .Values.infrastructureNamespaces.growthbook }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Allow from ingress gateway (admin access)
    - from:
        - source:
            namespaces:
              - istio-ingress
    # Allow all app namespaces (feature flag checks)
    {{- range $key, $ns := .Values.appNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ $ns }}
    {{- end }}
    # Allow monitoring
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system
    # Allow internal traffic: this ALLOW policy attaches to ztunnel for every
    # workload in the namespace, so without it growthbook cannot reach its mongodb.
    - from:
        - source:
            namespaces:
              - {{ .Values.infrastructureNamespaces.growthbook }}

---
# OpenPanel access policy
# Ingress gateway needs to reach dashboard and API
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-openpanel
  namespace: {{ .Values.infrastructureNamespaces.openpanel }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Allow from ingress gateway (dashboard + API access)
    - from:
        - source:
            namespaces:
              - istio-ingress
    # Allow internal namespace traffic (data stores)
    - from:
        - source:
            namespaces:
              - {{ .Values.infrastructureNamespaces.openpanel }}
    # Allow monitoring
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system
    # Allow the analytics onboarding control plane
    - from:
        - source:
            namespaces:
              - {{ .Values.infrastructureNamespaces.analyticsOperator }}

{{- if .Values.infrastructureNamespaces.photon }}
---
# Photon (geocoding) access policy
# Only location-service in marketplace needs this
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-marketplace-to-photon
  namespace: {{ .Values.infrastructureNamespaces.photon }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Allow marketplace namespace (location-service)
    - from:
        - source:
            namespaces:
    # Allow ingress for external API access
    - from:
        - source:
            namespaces:
              - istio-ingress
    # Allow monitoring
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system
{{- end }}

# =============================================================================
# Public Endpoints Policy
# Allow unauthenticated access to health checks, login, etc.
# =============================================================================
{{- $skipAuthPolicy := $.Values.skipAuthPolicyNamespaces | default list }}
{{- range $key, $ns := .Values.appNamespaces }}
{{- if not (has $key $skipAuthPolicy) }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: public-endpoints-{{ $key }}
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Health check endpoints
    - to:
        - operation:
            paths:
              - "/health"
              - "/healthz"
              - "/ready"
              - "/metrics"
    # CORS preflight
    - to:
        - operation:
            methods: ["OPTIONS"]
{{- end }}
{{- end }}

{{- end }}
