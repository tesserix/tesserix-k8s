  name: allow-ingress-to-homechef
  namespace: {{ .Values.appNamespaces.homechef }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-internal-homechef
  namespace: {{ .Values.appNamespaces.homechef }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Values.appNamespaces.homechef }}
    - from:
        - source:
            namespaces:
              - {{ .Values.appNamespaces.global }}
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system

---
# Allow mesh-internal traffic (routes that arrive without an mTLS identity)
