---
# ===========================================
# GrowthBook Feature Flags - Virtual Service
# Open-source feature flagging platform with OpenFeature SDK support
#
# Architecture:
#   - Port 3000: Next.js Frontend (Dashboard UI)
#   - Port 3100: Express Backend API
#
# Routing Strategy (Production-Ready):
#   1. SDK endpoints (/api/features) → Backend (public API for SDKs)
#   2. Health check → Backend
#   3. Mutation methods (POST/PUT/DELETE/PATCH) → Backend
#   4. API calls with Accept: application/json header → Backend (XHR/Fetch)
#   5. Dashboard pages (regex: plural paths) → Frontend (browser navigation)
#   6. REST API (/api/v1/*) → Backend
#   7. Internal API endpoints (regex) → Backend
#   8. Default (static assets, etc.) → Frontend
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: growthbook-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: feature-flags
spec:
  hosts:
    - "{{ .Values.subdomains.growthbook }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # 1. SDK API - Public feature flag endpoint
    # ===========================================
    - match:
        - uri:
            prefix: /api/features
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3100
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    # ===========================================
    # 2. Health Check
    # ===========================================
    - match:
        - uri:
            exact: /healthcheck
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3100
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # 3. All Mutation Methods → Backend API
    # POST, PUT, DELETE, PATCH always go to backend
    # ===========================================
    - match:
        - method:
            regex: POST|PUT|DELETE|PATCH
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3100
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # 4. API Calls with x-organization header → Backend
    # XHR/Fetch requests from GrowthBook frontend include x-organization header
    # This routes API calls to Express backend while page navigation goes to frontend
    # ===========================================
    - match:
        - headers:
            x-organization:
              regex: ".*"
          uri:
            regex: ^/(features|projects|experiments|environments|segments|dimensions|sdk-connections|saved-groups|settings|integrations|datasources|metrics|ideas|presentations|reports|archetypes|attributes|fact-tables|namespaces|teams|tags)(/.*)?$
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3100
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # 5. Dashboard Pages → Frontend (Next.js)
    # Browser navigation (HTML requests) to UI pages
    # Pattern: /features, /projects, /experiments, etc.
    # ===========================================
    - match:
        - uri:
            regex: ^/(features|projects|experiments|environments|segments|dimensions|sdk-connections|saved-groups|settings|getstarted|integrations|dashboard|datasources|metrics|ideas|presentations|reports|archetypes|attributes|fact-tables|namespaces|teams|tags)(/.*)?$
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3000
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # 6. REST API (api/v1/*) → Backend (Express)
    # All REST API endpoints go to backend
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3100
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # 7. Backend API Routes → Backend (Express)
    # Regex matches internal API endpoint paths
    # ===========================================
    - match:
        - uri:
            regex: ^/(auth|organization|user|invite|config|feature|project|experiment|environment|sdk-connection|metric|segment|dimension|tag|attribute|saved-group|activity|upload|search|scim|team|datasource|report|fact-table|event-webhook|visual-changeset|url-redirect|discussion|archetype|idea|presentation|license|admin|slack-integration|github-integration|vercel-integration|custom-fields|custom-hooks|safe-rollout|holdout|decision-criteria|past-experiments|import|demo|queries|query|sql|pipeline|bandits|saved-queries|watcher|data-export|oauth|watching|recent-experiments|events|launch-checklist|member|members)(/.*)?$
      route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3100
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # 8. Handle /_next/data/ prefetch requests
    # Return 200 with valid Next.js SSG data format
    # GrowthBook uses static export so these routes don't exist
    # ===========================================
    - match:
        - uri:
            regex: ^/_next/data/.*\.json$
      directResponse:
        status: 200
        body:
          string: '{"pageProps":{},"__N_SSG":true}'

    # ===========================================
    # 9. Default → Frontend (Next.js)
    # Static assets, root page, _next, etc.
    # ===========================================
    - route:
        - destination:
            host: growthbook.growthbook.svc.cluster.local
            port:
              number: 3000
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          - exact: "https://{{ .Values.subdomains.growthbook }}.{{ .Values.domain }}"
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

