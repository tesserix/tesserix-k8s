      timeout: 30s

    # ===========================================
    # Analytics Service
    # ===========================================
    - name: analytics-routes
      match:
        - uri:
            prefix: /api/v1/analytics
      route:
        - destination:
            host: analytics-service.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 60s

    # ===========================================
    # Feature Flags Service (GrowthBook SDK Proxy)
    # Public SDK endpoint for mobile/web clients
    # Strips /feature-flags prefix and routes to service
    # ===========================================
    - name: feature-flags-routes
      match:
        - uri:
            prefix: /feature-flags
      rewrite:
        uriRegexRewrite:
          match: "^/feature-flags(/.*)?$"
          rewrite: "\\1"
      route:
        - destination:
            host: feature-flags-service.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: connect-failure,refused-stream,unavailable,cancelled

---
# ===========================================
# API Documentation VirtualService - Multi-Tenant Swagger UI
# Hosts: dev-api-docs.tesserix.app
# Provides:
# - Interactive API documentation with Swagger UI
# - Tenant-aware API exploration (via X-Tenant-ID header)
# - JWT-based authorization testing
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-docs-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: api-documentation
spec:
  hosts:
    - "{{ .Values.subdomains.apiDocs }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Swagger UI - Interactive API Documentation
    # Tenant context is provided via:
    # 1. JWT token (contains tenant_id claim)
    # 2. X-Tenant-ID header for API calls
    # ===========================================
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: swagger-ui.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          - exact: "https://{{ .Values.subdomains.apiDocs }}.{{ .Values.domain }}"
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

---
# ===========================================
# Typesense Search Engine - Virtual Service
# Fast, typo-tolerant search engine
# API endpoint for global search functionality
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: typesense-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: search
spec:
  hosts:
    - "{{ .Values.subdomains.typesense }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Health Check Endpoint
    # ===========================================
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: typesense.typesense.svc.cluster.local
            port:
              number: 8108
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Search API - All Routes
    # Requires X-TYPESENSE-API-KEY header for authentication
    # ===========================================
    - route:
        - destination:
            host: typesense.typesense.svc.cluster.local
            port:
              number: 8108
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          - exact: "https://{{ .Values.subdomains.typesense }}.{{ .Values.domain }}"
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
          - x-typesense-api-key
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

---
# ===========================================
# Customer IDP (Keycloak) - Virtual Service
# Identity provider for customer authentication
# Routes all Keycloak traffic for OIDC/OAuth flows
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: customer-idp-vs
  namespace: identity-customer
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
spec:
  hosts:
    - "{{ .Values.subdomains.customerIdp }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Health Check Endpoint
    # ===========================================
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Keycloak Admin Console
    # /admin/* routes to the Keycloak admin interface
    # ===========================================
    - match:
        - uri:
            prefix: /admin
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Keycloak Realms - OIDC/OAuth endpoints
    # /realms/* handles authentication flows
    # NOTE: No retry policy here - OAuth authorization codes are single-use.
    # Retrying causes "code already used" errors from Facebook/Instagram/Google.
    # CRITICAL: X-Forwarded-Proto/Port must be set so Keycloak constructs
    # https:// redirect URIs for IDP (Google/Facebook) OAuth callbacks.
    # ===========================================
    - match:
        - uri:
            prefix: /realms
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Keycloak Resources - JS/CSS/Images
    # /resources/* serves static assets
    # ===========================================
    - match:
        - uri:
            prefix: /resources
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Keycloak JavaScript API
    # /js/* serves Keycloak JavaScript adapters
    # ===========================================
    - match:
        - uri:
            prefix: /js
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # robots.txt - SEO/crawling control
    # ===========================================
    - match:
        - uri:
            exact: /robots.txt
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Default Route - All other Keycloak paths
    # Catches any remaining paths
    # ===========================================
    - headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          - exact: "https://{{ .Values.subdomains.customerIdp }}.{{ .Values.domain }}"
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

