      timeout: 30s

    # ===========================================
    # Tax Service
    # ===========================================
    - name: tax-routes
      match:
        - uri:
            prefix: /api/v1/tax
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
