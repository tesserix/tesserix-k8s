            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    - match:
        - uri:
            exact: /robots.txt
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    # NOTE: No catch-all route here — product-specific VirtualServices (e.g. in
    # homechef namespace) handle non-Keycloak paths like /auth/* for the Auth BFF.
    # Istio merges VirtualServices for the same host/gateway; without a catch-all,
    # unmatched paths fall through to the product's own routing rules.
{{- end }}

