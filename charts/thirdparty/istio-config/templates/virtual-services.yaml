    - match:
        - uri:
            prefix: /api/v1/invoices
      rewrite:
        uri: /invoices
      route:
        - destination:
            host: hms-billing-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/payments
      rewrite:
        uri: /payments
      route:
        - destination:
            host: hms-billing-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Service prices - strip /api/v1/services prefix
    - match:
        - uri:
