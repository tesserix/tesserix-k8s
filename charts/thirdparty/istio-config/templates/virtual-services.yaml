# Accessed via Cloudflare tunnel for internal-only access
# DevTest: kibana-dev.tesserix.app | Prod: kibana.tesserix.app
# =============================================================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kibana-vs
  namespace: logging
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: logging
spec:
  hosts:
    {{- if .Values.kibanaHost }}
    - "{{ .Values.kibanaHost }}"
    {{- else }}
    - "{{ .Values.subdomains.kibana }}.{{ .Values.domain }}"
    {{- end }}
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Health Check Endpoint
    # ===========================================
    - match:
        - uri:
            exact: /api/status
      route:
        - destination:
            host: kibana-kibana.logging.svc.cluster.local
            port:
              number: 5601
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Kibana API Routes
    # ===========================================
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: kibana-kibana.logging.svc.cluster.local
            port:
              number: 5601
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    # ===========================================
    # Default Route - Kibana Dashboard UI
    # ===========================================
    - route:
        - destination:
            host: kibana-kibana.logging.svc.cluster.local
            port:
              number: 5601
      timeout: {{ .Values.timeout.default }}

---
# ===========================================
# OpenPanel Web Analytics - Virtual Service
# Open-source web analytics platform with event tracking
#
# Architecture:
#   - Port 3333: Fastify API (event ingestion, data queries)
#   - Port 3000: Next.js Dashboard (analytics UI)
#   - Port 9999: Worker (background processing, internal only)
#
# Routing Strategy:
#   1. /api/* paths → API (3333)
#   2. Mutation methods (POST/PUT/DELETE/PATCH) → API (3333)
#   3. Default (dashboard pages, static assets) → Dashboard (3000)
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: openpanel-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: analytics
spec:
  hosts:
    {{- if .Values.analyticsHost }}
    - "{{ .Values.analyticsHost }}"
    {{- else }}
    - "{{ .Values.subdomains.analytics }}.{{ .Values.domain }}"
    {{- end }}
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # 1. tRPC + API Routes → API Backend (Fastify)
    # tRPC queries/mutations, event ingestion, healthcheck
    # ===========================================
    - match:
        - uri:
            prefix: /trpc/
      route:
        - destination:
            host: openpanel-api.openpanel.svc.cluster.local
            port:
              number: 3333
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: openpanel-api.openpanel.svc.cluster.local
            port:
              number: 3333
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    # ===========================================
    # 2. Health Check
    # ===========================================
    - match:
        - uri:
            exact: /healthcheck
      route:
        - destination:
            host: openpanel-api.openpanel.svc.cluster.local
            port:
              number: 3333
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # 3. All Mutation Methods → API Backend
    # POST, PUT, DELETE, PATCH always go to API
    # ===========================================
    - match:
        - method:
            regex: POST|PUT|DELETE|PATCH
      route:
        - destination:
            host: openpanel-api.openpanel.svc.cluster.local
            port:
              number: 3333
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # 4. Default → Dashboard (Next.js)
    # Static assets, dashboard pages, root
    # ===========================================
    - route:
        - destination:
            host: openpanel-dashboard.openpanel.svc.cluster.local
            port:
              number: 3000
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          {{- if .Values.analyticsHost }}
          - exact: "https://{{ .Values.analyticsHost }}"
          {{- else }}
          - exact: "https://{{ .Values.subdomains.analytics }}.{{ .Values.domain }}"
          {{- end }}
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}
