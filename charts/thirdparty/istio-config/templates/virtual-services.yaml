              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Coupons Service
    # ===========================================
    - name: coupons-routes
      match:
        - uri:
            prefix: /api/v1/coupons
      route:
        - destination:
            host: mp-coupons.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Reviews Service
    # ===========================================
    - name: reviews-routes
      match:
        - uri:
            prefix: /api/v1/reviews
      route:
        - destination:
            host: mp-reviews.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Settings Service
    # ===========================================
    - name: settings-routes
      match:
        - uri:
            prefix: /api/v1/settings
      route:
        - destination:
            host: subscription-service.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # User's Tenant Memberships - for tenant switcher
    # IMPORTANT: Must come before /api/v1/tenants as it's more specific
    # ===========================================
    - name: user-tenants-route
      match:
        - uri:
            prefix: /api/v1/users/me/tenants
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Tenant Service
    # ===========================================
    - name: tenants-routes
      match:
        - uri:
            prefix: /api/v1/tenants
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Notification Hub (WebSocket, SSE, REST)
    # ===========================================
    - name: notifications-ws-routes
      match:
        - uri:
            prefix: /api/v1/notifications/ws
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 86400s

    - name: notifications-stream-routes
      match:
        - uri:
            prefix: /api/v1/notifications/stream
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 86400s

    - name: notifications-routes
      match:
        - uri:
            prefix: /api/v1/notifications
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Location Service
    # ===========================================
    - name: location-routes
      match:
        - uri:
            prefix: /api/v1/location
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
