      rewrite:
        uri: /templates
      route:
        - destination:
            host: hms-billing-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # CRM - exact match for base path
    - match:
        - uri:
            exact: /api/v1/crm
      rewrite:
        uri: /
      route:
        - destination:
            host: hms-crm-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # CRM - strip /api/v1/crm/ prefix for subpaths
    - match:
        - uri:
            prefix: /api/v1/crm/
      rewrite:
        uri: /
      route:
        - destination:
