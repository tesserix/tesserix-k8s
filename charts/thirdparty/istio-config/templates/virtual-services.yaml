{{/*
VirtualServices - Defines routing rules for traffic within the mesh
All routes are consolidated per host (admin, storefront, onboarding, fanzone)

Multi-Tenant Routing Strategy:
- Subdomain-based tenant routing: {slug}-admin.tesserix.app
- JWT contains tenant_id claim for authorization
- Backend services extract tenant from JWT/header
- Wildcard SSL certificate (*.tesserix.app) handles all subdomains
- Next.js middleware extracts tenant slug from subdomain
*/}}
---
# Direct ClusterIP Services for Knative frontends
# These bypass Knative's ExternalName → knative-local-gateway chain
# which has mTLS compatibility issues with the Istio ingress gateway.
apiVersion: v1
kind: Service
metadata:
  name: marketplace-onboarding-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8012
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: marketplace-onboarding
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-admin-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8012
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: marketplace-admin
---
apiVersion: v1
kind: Service
metadata:
  name: mp-storefront-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8012
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: mp-storefront
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: verification-service
---
apiVersion: v1
kind: Service
metadata:
  name: mp-vendors-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: mp-vendors
---
apiVersion: v1
kind: Service
metadata:
  name: mp-staff-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: mp-staff
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: tenant-service
---
apiVersion: v1
kind: Service
metadata:
  name: location-service-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: location-service
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-router-service-direct
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8089
      targetPort: 8089
      protocol: TCP
      name: http
  selector:
    serving.knative.dev/service: tenant-router-service
---
# =============================================================================
# Multi-Tenant Wildcard VirtualServices
# Route {slug}.mark8ly.com → mp-storefront (customer-facing store)
# Route {slug}-admin.mark8ly.com → marketplace-admin (vendor admin dashboard)
# =============================================================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: storefront-wildcard-vs
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "*.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # Resolve tenant from subdomain slug via public endpoint (no auth required)
    - match:
        - uri:
            prefix: /api/v1/storefronts/resolve
      rewrite:
        uri: /api/v1/public/storefronts/resolve/by-slug
      route:
        - destination:
            host: mp-vendors-direct.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}
    - match:
        - uri:
            prefix: /api/v1/public/storefronts
      route:
        - destination:
            host: mp-vendors-direct.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}
    # Default route — serve storefront Next.js app
    - route:
        - destination:
            host: mp-storefront-direct.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: admin-wildcard-vs
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "*-admin.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: marketplace-admin-direct.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}
---
# Admin VirtualService - Main admin dashboard (admin.mark8ly.com)
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: admin-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "{{ .Values.subdomains.admin }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Auth BFF Routes - OIDC Authentication
    # Handles login, logout, callback, session management
    # ===========================================
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: auth-bff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # API Routes - Backend Services
    # These routes are tenant-aware via JWT claims
    # The X-Tenant-ID header is set by auth middleware
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/products
      route:
        - destination:
            host: mp-products.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    - match:
        - uri:
            prefix: /api/v1/categories
      route:
        - destination:
            host: mp-categories.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/orders
      route:
        - destination:
            host: mp-orders.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/coupons
      route:
        - destination:
            host: mp-coupons.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/settings
      route:
        - destination:
            host: subscription-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/staff
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # NOTE: /api/v1/rbac route REMOVED - causes 401 errors
    # Frontend uses Next.js proxy (/api/staff/me/permissions)
    # Services use internal endpoint (/api/v1/internal/rbac/...)
    # Direct calls to /api/v1/rbac lack JWT headers from Istio

    # Staff RBAC routes - roles, departments, teams, permissions
    - match:
        - uri:
            prefix: /api/v1/roles
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/departments
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/teams
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/permissions
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/invitations
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/audit
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Search Service - Typesense-powered global search
    - match:
        - uri:
            prefix: /api/v1/search
      route:
        - destination:
            host: search-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Search Service - Index management endpoints
    - match:
        - uri:
            prefix: /api/v1/index
      route:
        - destination:
            host: search-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/reviews
      route:
        - destination:
            host: mp-reviews.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tickets
      route:
        - destination:
            host: tickets-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/storefronts
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/vendors
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tenants
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # User's tenant memberships - for tenant switcher
    - match:
        - uri:
            prefix: /api/v1/users/me/tenants
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/location
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/documents
      route:
        - destination:
            host: document-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/users
      route:
        - destination:
            host: mp-staff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/verification
      route:
        - destination:
            host: verification-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Tax Service Routes - Tax Calculation and Management
    # Handles tax rates, jurisdictions, exemptions, and tax calculation
    # Supports India GST, EU VAT, and global tax systems
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/tax
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tax-rates
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tax-jurisdictions
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tax-exemptions
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tax-nexus
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Payment Service Routes - Multi-Gateway Payment Processing
    # Handles payment gateway configs, transactions, refunds, and webhooks
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/payments
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/gateways
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/gateway-configs
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/payment-methods
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/platform-fees
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/refunds
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Payment Gateway Webhooks - No auth required, signature-verified by service
    - match:
        - uri:
            prefix: /webhooks/stripe
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/razorpay
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/paypal
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/phonepe
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/afterpay
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/zip
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Notification Hub Routes - Real-time Notifications
    # WebSocket, SSE, and REST API for in-app notifications
    # ===========================================
    # WebSocket route for real-time notifications (must be before REST route)
    # Note: Removed header match - Istio handles WebSocket upgrades automatically
    # when the client sends Connection: Upgrade and Upgrade: websocket headers
    - match:
        - uri:
            prefix: /api/v1/notifications/ws
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: 86400s  # 24h for long-lived WebSocket connections

    # SSE route for server-sent events (long-lived connections)
    - match:
        - uri:
            prefix: /api/v1/notifications/stream
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: 86400s  # 24h for long-lived SSE streams

    # REST API routes for notifications
    - match:
        - uri:
            prefix: /api/v1/notifications
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # MFE Hub Routes - Module Federation Remote Entries
    # ===========================================
    - match:
        - uri:
            prefix: /mfe/products
      rewrite:
        uri: /
      route:
        - destination:
            host: products-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/categories
      rewrite:
        uri: /
      route:
        - destination:
            host: categories-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/orders
      rewrite:
        uri: /
      route:
        - destination:
            host: orders-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/staff
      rewrite:
        uri: /
      route:
        - destination:
            host: staff-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/coupons
      rewrite:
        uri: /
      route:
        - destination:
            host: coupons-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/vendor
      rewrite:
        uri: /
      route:
        - destination:
            host: vendor-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/reviews
      rewrite:
        uri: /
      route:
        - destination:
            host: reviews-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/tickets
      rewrite:
        uri: /
      route:
        - destination:
            host: tickets-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    - match:
        - uri:
            prefix: /mfe/customers
      rewrite:
        uri: /
      route:
        - destination:
            host: customers-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Default route to admin frontend
    # ===========================================
    - route:
        - destination:
            host: marketplace-admin.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

---
# Storefront VirtualService - Customer-facing store
# Supports multi-tenant routing:
# - Path-based: /store/{slug}/... or /{slug}/...
# - Subdomain: {slug}.tesserix.app
# - Custom domains: shop.example.com (resolved via vendor-service)
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: storefront-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "{{ .Values.subdomains.store }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Vendor/Storefront Resolution Routes
    # Used by middleware to resolve tenant from slug/domain
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/storefronts/resolve
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/storefronts
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/vendors
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # API routes for storefront
    - match:
        - uri:
            prefix: /api/v1/products
      route:
        - destination:
            host: mp-products.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/categories
      route:
        - destination:
            host: mp-categories.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/orders
      route:
        - destination:
            host: mp-orders.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/reviews
      route:
        - destination:
            host: mp-reviews.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Search Service - Product search for storefront
    - match:
        - uri:
            prefix: /api/v1/search
      route:
        - destination:
            host: search-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/coupons
      route:
        - destination:
            host: mp-coupons.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Storefront customer endpoints (public-facing, customer JWT auth)
    # Must be before /api/v1/customers to ensure proper routing
    - match:
        - uri:
            prefix: /api/v1/storefront/customers
      route:
        - destination:
            host: mp-customers.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/customers
      route:
        - destination:
            host: mp-customers.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/shipping
      route:
        - destination:
            host: mp-shipping.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/settings
      route:
        - destination:
            host: subscription-service.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/tenants
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Tax Service Routes - Storefront Tax Calculation
    # Calculates taxes for checkout based on shipping address
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/tax
      route:
        - destination:
            host: mp-tax.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Payment Service Routes - Storefront Checkout
    # Handles payment processing, payment methods, and webhooks
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/payments
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/gateways
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/payment-methods
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Payment Gateway Webhooks - No auth required, signature-verified by service
    - match:
        - uri:
            prefix: /webhooks/stripe
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/razorpay
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/paypal
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/phonepe
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/afterpay
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /webhooks/zip
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Notification Hub Routes - Real-time Notifications
    # WebSocket, SSE, and REST API for in-app notifications
    # ===========================================
    # WebSocket route for real-time notifications (must be before REST route)
    # Note: Removed header match - Istio handles WebSocket upgrades automatically
    # when the client sends Connection: Upgrade and Upgrade: websocket headers
    - match:
        - uri:
            prefix: /api/v1/notifications/ws
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: 86400s  # 24h for long-lived WebSocket connections

    # SSE route for server-sent events (long-lived connections)
    - match:
        - uri:
            prefix: /api/v1/notifications/stream
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: 86400s  # 24h for long-lived SSE streams

    # REST API routes for notifications
    - match:
        - uri:
            prefix: /api/v1/notifications
      route:
        - destination:
            host: notification-hub.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Default route to storefront frontend
    - route:
        - destination:
            host: mp-storefront.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

---
# Tenant Onboarding VirtualService
# Uses apex domain (mark8ly.com) in prod, subdomain in devtest
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: tenant-onboarding-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    {{- if .Values.subdomains.onboarding }}
    - "{{ .Values.subdomains.onboarding }}.{{ .Values.domain }}"
    {{- else }}
    - "{{ .Values.domain }}"
    {{- end }}
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # API routes
    - match:
        - uri:
            prefix: /api/v1/onboarding
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/location
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/verification
      route:
        - destination:
            host: verification-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # SSE events endpoint - route directly to backend with long timeout (bypass Next.js proxy)
    - match:
        - uri:
            regex: /api/onboarding/[^/]+/events
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: 3600s
      retries:
        attempts: 0

    # Non-versioned onboarding API routes - routed to Next.js frontend which proxies to tenant-service
    - match:
        - uri:
            prefix: /api/onboarding
      route:
        - destination:
            host: marketplace-onboarding-direct.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Location service routes (countries, states, address, etc.)
    - match:
        - uri:
            prefix: /api/v1/countries
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/states
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/address
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/currencies
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/timezones
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    - match:
        - uri:
            prefix: /api/v1/geotag
      route:
        - destination:
            host: location-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Auth BFF routes - enables OAuth flows (e.g., Google login) on the onboarding domain
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: auth-bff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # Default route to tenant-onboarding frontend
    # Uses direct ClusterIP service to bypass Knative ExternalName routing
    - route:
        - destination:
            host: marketplace-onboarding-direct.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

{{- if .Values.companyHost }}
---
# ===========================================
# Company Website VirtualService (tesserix.app)
# Routes to tesserix-home Knative service in tesserix namespace
# ===========================================
{{- if .Values.companyHost }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: company-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "{{ .Values.companyHost }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # Auth error page — served by Next.js frontend (must be before /auth prefix)
    # Host header rewriting handled by envoy-filter-company-host-rewrite (auto_host_rewrite)
    - match:
        - uri:
            prefix: /auth/error
      route:
        - destination:
            host: tesserix-home.tesserix.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}

    # Auth routes (for admin portal login)
    # X-Auth-Context: admin tells auth-bff to use tesserix-internal realm
    - match:
        - uri:
            prefix: /auth
      headers:
        request:
          set:
            X-Auth-Context: admin
      route:
        - destination:
            host: auth-bff.tesserix.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: "connect-failure,refused-stream,unavailable,cancelled"

    # Default route to company frontend
    - route:
        - destination:
            host: tesserix-home.tesserix.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}
{{- end }}
{{- end }}

