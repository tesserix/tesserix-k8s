spec:
  hosts:
    - {{ .host | quote }}
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    - match:
        - uri:
            prefix: /admin
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.api }}

    # No retry policy — OAuth authorization codes are single-use
    # X-Forwarded-Proto/Port required so Keycloak constructs https:// IDP redirect URIs
    - match:
        - uri:
            prefix: /realms
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.api }}

    - match:
        - uri:
            prefix: /resources
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    - match:
        - uri:
            prefix: /js
      route:
        - destination:
