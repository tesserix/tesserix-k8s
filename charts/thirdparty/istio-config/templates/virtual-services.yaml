{{/*
VirtualServices - Defines routing rules for traffic within the mesh
All routes are consolidated per host (admin, storefront, onboarding, fanzone)

Multi-Tenant Routing Strategy:
- Subdomain-based tenant routing: {slug}-admin.tesserix.app
- JWT contains tenant_id claim for authorization
- Backend services extract tenant from JWT/header
- Wildcard SSL certificate (*.tesserix.app) handles all subdomains
- Next.js middleware extracts tenant slug from subdomain
*/}}
# ===========================================
# Customer IDP (Keycloak) - Virtual Service
# Identity provider for customer authentication
# Routes all Keycloak traffic for OIDC/OAuth flows
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: customer-idp-vs
  namespace: identity-customer
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
spec:
  hosts:
    - "{{ .Values.subdomains.customerIdp }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Health Check Endpoint
    # ===========================================
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Keycloak Admin Console
    # /admin/* routes to the Keycloak admin interface
    # ===========================================
    - match:
        - uri:
            prefix: /admin
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Keycloak Realms - OIDC/OAuth endpoints
    # /realms/* handles authentication flows
    # NOTE: No retry policy here - OAuth authorization codes are single-use.
    # Retrying causes "code already used" errors from Facebook/Instagram/Google.
    # CRITICAL: X-Forwarded-Proto/Port must be set so Keycloak constructs
    # https:// redirect URIs for IDP (Google/Facebook) OAuth callbacks.
    # ===========================================
    - match:
        - uri:
            prefix: /realms
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Keycloak Resources - JS/CSS/Images
    # /resources/* serves static assets
    # ===========================================
    - match:
        - uri:
            prefix: /resources
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Keycloak JavaScript API
    # /js/* serves Keycloak JavaScript adapters
    # ===========================================
    - match:
        - uri:
            prefix: /js
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # robots.txt - SEO/crawling control
    # ===========================================
    - match:
        - uri:
            exact: /robots.txt
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Default Route - All other Keycloak paths
    # Catches any remaining paths
    # ===========================================
    - headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          - exact: "https://{{ .Values.subdomains.customerIdp }}.{{ .Values.domain }}"
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

{{- range .Values.identityAliases }}
---
# ===========================================
# Identity Alias VirtualService — {{ .host }}
# Routes to the same Keycloak identity-customer service
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .name }}
  namespace: identity-customer
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: identity
spec:
  hosts:
    - {{ .host | quote }}
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    - match:
        - uri:
            prefix: /admin
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.api }}

    # No retry policy — OAuth authorization codes are single-use
    # X-Forwarded-Proto/Port required so Keycloak constructs https:// IDP redirect URIs
    - match:
        - uri:
            prefix: /realms
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.api }}

    - match:
        - uri:
            prefix: /resources
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    - match:
        - uri:
            prefix: /js
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    - match:
        - uri:
            exact: /robots.txt
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: {{ $.Values.timeout.default }}

    # NOTE: No catch-all route here — product-specific VirtualServices (e.g. in
    # homechef namespace) handle non-Keycloak paths like /auth/* for the Auth BFF.
    # Istio merges VirtualServices for the same host/gateway; without a catch-all,
    # unmatched paths fall through to the product's own routing rules.
{{- end }}

