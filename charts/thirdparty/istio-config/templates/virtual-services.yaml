{{/*
VirtualServices - Defines routing rules for traffic within the mesh
All routes are consolidated per host (admin, storefront, onboarding, fanzone)

Multi-Tenant Routing Strategy:
- Subdomain-based tenant routing: {slug}-admin.tesserix.app
- JWT contains tenant_id claim for authorization
- Backend services extract tenant from JWT/header
- Wildcard SSL certificate (*.tesserix.app) handles all subdomains
- Next.js middleware extracts tenant slug from subdomain
*/}}
---
# =============================================================================
# Kibana VirtualService - Log visualization dashboard
# Accessed via Cloudflare tunnel for internal-only access
# DevTest: kibana-dev.tesserix.app | Prod: kibana.tesserix.app
# =============================================================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kibana-vs
  namespace: logging
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: logging
spec:
  hosts:
    {{- if .Values.kibanaHost }}
    - "{{ .Values.kibanaHost }}"
    {{- else }}
    - "{{ .Values.subdomains.kibana }}.{{ .Values.domain }}"
    {{- end }}
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # Health Check Endpoint
    # ===========================================
    - match:
        - uri:
            exact: /api/status
      route:
        - destination:
            host: kibana-kibana.logging.svc.cluster.local
            port:
              number: 5601
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Kibana API Routes
    # ===========================================
    - match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: kibana-kibana.logging.svc.cluster.local
            port:
              number: 5601
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    # ===========================================
    # Default Route - Kibana Dashboard UI
    # ===========================================
    - route:
        - destination:
            host: kibana-kibana.logging.svc.cluster.local
            port:
              number: 5601
      timeout: {{ .Values.timeout.default }}

---
# =============================================================================
# Monitoring VirtualServices
# Route grafana/prometheus/alertmanager.tesserix.app to monitoring namespace
# Traffic flow: Cloudflare Tunnel → Istio Gateway (port 80) → VirtualService → Service
# =============================================================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana-vs
  namespace: monitoring
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "grafana.tesserix.app"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: grafana.monitoring.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: prometheus-vs
  namespace: monitoring
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "prometheus.tesserix.app"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: prometheus-server.monitoring.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: alertmanager-vs
  namespace: monitoring
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  hosts:
    - "alertmanager.tesserix.app"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: prometheus-alertmanager.monitoring.svc.cluster.local
            port:
              number: 9093
---
# ===========================================
# ArgoCD UI - VirtualService
# argocd.tesserix.app fronts argocd-server (insecure mode: TLS
# terminated at Cloudflare edge, plain HTTP to argocd-server:80).
# Cloudflare Tunnel (prod) ingresses *.tesserix.app to istio-ingress;
# this VS picks the host out and forwards to argocd-server.argocd.svc.
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd-vs
  namespace: argocd
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: gitops
spec:
  hosts:
    - "argocd.tesserix.app"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 80
      timeout: 60s
---
# ===========================================
# Kargo - VirtualService
# Release / promotion control plane (GH SSO via Dex GitHub connector).
# Routes kargo.tesserix.app to the kargo-api Service in the kargo
# namespace. Cloudflare Tunnel terminates TLS at the edge, so we listen
# on plain HTTP inside the mesh; api.tls.terminatedUpstream is set in
# the Kargo Helm values so OIDC redirects use https://.
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kargo-vs
  namespace: kargo
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: release
spec:
  hosts:
    - "kargo.tesserix.app"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: kargo-api.kargo.svc.cluster.local
            port:
              number: 80
      timeout: 60s
