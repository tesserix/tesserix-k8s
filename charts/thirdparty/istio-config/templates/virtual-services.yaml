---
# ===========================================
# API VirtualService Template - Per-Tenant Mobile API Access
# This is used by tenant-router-service to create tenant-specific API VSes
# e.g., demo-store-api-vs for demo-store-api.tesserix.app
#
# Pattern: Each tenant gets their own API endpoint:
#   - Tenant slug: awesome-store
#   - API host: awesome-store-api.tesserix.app
#   - VirtualService: awesome-store-api-vs
#
# The placeholder host (dev-api-template.tesserix.app) won't receive traffic.
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: api-template
  annotations:
    description: "Template VirtualService for mobile/external API access per tenant"
spec:
  hosts:
    - "dev-api-template.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # API Documentation (Swagger UI)
    # ===========================================
    - name: swagger-docs
      match:
        - uri:
            prefix: /api/docs
      route:
        - destination:
            host: swagger-ui.marketplace.svc.cluster.local
            port:
              number: 8080
      corsPolicy: &mobile-cors
        allowOrigins:
          - regex: ".*"  # Mobile apps don't send Origin header
        allowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - Accept-Language
          - X-Tenant-ID
          - X-Tenant-Slug
          - X-Request-ID
          - X-Device-Type
          - X-Device-ID
          - X-App-Version
          - X-User-ID
          - X-Vendor-ID
          - X-Storefront-ID
          - X-Guest-Session-ID
        exposeHeaders:
          - X-Request-ID
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
          - X-RateLimit-Reset
        maxAge: "86400s"
        allowCredentials: true
      timeout: 30s

    # ===========================================
    # Health Check
    # ===========================================
    - name: health-check
      match:
        - uri:
            exact: /health
        - uri:
            exact: /api/health
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: 10s

    # ===========================================
    # Products Service
    # ===========================================
    - name: products-routes
      match:
        - uri:
            prefix: /api/v1/products
      route:
        - destination:
            host: mp-products.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: connect-failure,refused-stream,unavailable,cancelled

    # ===========================================
    # Search Service - Typesense-powered search
    # ===========================================
    - name: search-routes
      match:
        - uri:
            prefix: /api/v1/search
      route:
        - destination:
            host: search-service.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: connect-failure,refused-stream,unavailable,cancelled

    # ===========================================
    # Search Index Service - Index management
    # ===========================================
    - name: index-routes
      match:
        - uri:
            prefix: /api/v1/index
      route:
        - destination:
            host: search-service.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 60s
      retries:
        attempts: 2
        perTryTimeout: 30s
        retryOn: connect-failure,refused-stream,unavailable

    # ===========================================
    # Categories Service
    # ===========================================
    - name: categories-routes
      match:
        - uri:
            prefix: /api/v1/categories
      route:
        - destination:
            host: mp-categories.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Orders Service
    # ===========================================
    - name: orders-routes
      match:
        - uri:
            prefix: /api/v1/orders
        - uri:
            prefix: /api/v1/cart
      route:
        - destination:
            host: mp-orders.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 60s

    # ===========================================
    # Customers Service - Storefront (public-facing)
    # ===========================================
    - name: storefront-customers-routes
      match:
        - uri:
            prefix: /api/v1/storefront/customers
      route:
        - destination:
            host: mp-customers.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Customers Service
    # ===========================================
    - name: customers-routes
      match:
        - uri:
            prefix: /api/v1/customers
      route:
        - destination:
            host: mp-customers.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Vendor Service - Storefronts
    # ===========================================
    - name: storefronts-resolve-routes
      match:
        - uri:
            prefix: /api/v1/storefronts/resolve
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    - name: storefronts-routes
      match:
        - uri:
            prefix: /api/v1/storefronts
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    - name: vendors-routes
      match:
        - uri:
            prefix: /api/v1/vendors
      route:
        - destination:
            host: mp-vendors.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Payment Service
    # ===========================================
    - name: payments-routes
      match:
        - uri:
            prefix: /api/v1/payments
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 120s
      retries:
        attempts: 1  # NO retries for payments

    - name: gateways-routes
      match:
        - uri:
            prefix: /api/v1/gateways
        - uri:
            prefix: /api/v1/payment-methods
      route:
        - destination:
            host: mp-payments.marketplace.svc.cluster.local
            port:
              number: 80
      corsPolicy: *mobile-cors
      timeout: 30s

    # ===========================================
    # Shipping Service
    # ===========================================
    - name: shipping-routes
      match:
        - uri:
