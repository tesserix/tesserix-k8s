---
# ===========================================
# API Gateway VirtualService - Unified API Entry Point
# Hosts: dev-api.tesserix.app (devtest), pilot-api.tesserix.app, api.tesserix.app
# Provides:
# - API Documentation (Swagger UI) at /api/docs
# - Unified API access for mobile/external clients
# ===========================================
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: api-gateway
spec:
  hosts:
    - "{{ .Values.subdomains.api }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # API Documentation - Swagger UI
    # Serves interactive API documentation
    # No rewrite - Swagger UI is configured with BASE_URL=/api/docs
    # ===========================================
    - match:
        - uri:
            prefix: /api/docs
      route:
        - destination:
            host: swagger-ui.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Health Check Endpoint
    # Routed to tenant-service for API gateway health verification
    # ===========================================
    - match:
        - uri:
            exact: /api/health
        - uri:
            exact: /health
      route:
        - destination:
            host: tenant-service-direct.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.default }}

    # ===========================================
    # Authentication Service - Mobile/API Auth
    # Handles login, register, token refresh for mobile apps
    # Rewrites /api/v1/auth/* to /auth/direct/* for auth-bff
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/auth
      rewrite:
        uri: /auth/direct
      route:
        - destination:
            host: auth-bff.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Products Service
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/products
      route:
        - destination:
            host: mp-products.marketplace.svc.cluster.local
            port:
              number: 80
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # Search Service - Typesense-powered search
    # ===========================================
    - match:
        - uri:
            prefix: /api/v1/search
