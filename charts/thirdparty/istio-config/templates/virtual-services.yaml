            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      {{- else }}
      route:
        - destination:
            host: fanzone-ws.fanzone.svc.cluster.local
            port:
              number: 80
      {{- end }}
      timeout: 3600s

    # Default route to fanzone-web frontend
    - {{- if $.Values.fanzoneKnative }}
      headers:
        request:
          set:
            Host: fanzone-web.fanzone.svc.cluster.local
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      {{- else }}
      route:
        - destination:
            host: fanzone-web.fanzone.svc.cluster.local
            port:
              number: 80
      {{- end }}
      timeout: {{ .Values.timeout.default }}
      {{- if .Values.cors.enabled }}
      corsPolicy:
        allowOrigins:
          {{- range .Values.cors.allowOrigins }}
          - exact: {{ . }}
          {{- end }}
          - exact: "https://{{ .Values.subdomains.fanzone }}.{{ .Values.domain }}"
        allowMethods:
          {{- range .Values.cors.allowMethods }}
          - {{ . }}
          {{- end }}
        allowHeaders:
          {{- range .Values.cors.allowHeaders }}
          - {{ . }}
          {{- end }}
        exposeHeaders:
          {{- range .Values.cors.exposeHeaders }}
          - {{ . }}
          {{- end }}
        maxAge: {{ .Values.cors.maxAge }}
        allowCredentials: {{ .Values.cors.allowCredentials }}
      {{- end }}

---
# ===========================================
# Hospital Management System - Virtual Services
# ===========================================

# HMS Staff Portal VirtualService - Hospital staff dashboard
# Supports multi-tenant path-based routing: /{hospital-slug}/dashboard
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hms-staff-portal-vs
  namespace: marketplace
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: hospital-management
spec:
  hosts:
    - "{{ .Values.subdomains.hmsStaff }}.{{ .Values.domain }}"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # ===========================================
    # API Routes - HMS Backend Services
    # These routes are tenant-aware via JWT claims
    # The X-Tenant-ID header is set by auth middleware
    # ===========================================

    # Authentication service - forward with original path
    # The auth service handles both /login and /api/v1/auth/login paths
    - match:
        - uri:
            prefix: /api/v1/auth
      route:
        - destination:
            host: hms-auth-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}
      {{- if .Values.retryPolicy.enabled }}
      retries:
        attempts: {{ .Values.retryPolicy.attempts }}
        perTryTimeout: {{ .Values.retryPolicy.perTryTimeout }}
        retryOn: {{ .Values.retryPolicy.retryOn }}
      {{- end }}

    # Patient management - exact match for base path
    # Rewrites to / since patient-service routes are at root (GET /, POST /, etc)
    - match:
        - uri:
            exact: /api/v1/patients
      rewrite:
        uri: /
      route:
        - destination:
            host: hms-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Patient management - strip /api/v1/patients/ prefix for subpaths
    # /api/v1/patients/123 -> /123, /api/v1/patients/lookup -> /lookup
    - match:
        - uri:
            prefix: /api/v1/patients/
      rewrite:
        uri: /
      route:
        - destination:
            host: hms-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Document management - strip /api/v1/documents prefix
    - match:
        - uri:
            prefix: /api/v1/documents
      rewrite:
        uri: /documents
      route:
        - destination:
            host: hms-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Verification endpoints - strip /api/v1/verifications prefix
    - match:
        - uri:
            prefix: /api/v1/verifications
      rewrite:
        uri: /verifications
      route:
        - destination:
            host: hms-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Format validation endpoints - strip /api/v1/validate prefix
    - match:
        - uri:
            prefix: /api/v1/validate
      rewrite:
        uri: /validate
      route:
        - destination:
            host: hms-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Patient Portal Auth - forward to patient service
    - match:
        - uri:
            prefix: /api/v1/patient-portal
      rewrite:
        uri: /patient-portal
      route:
        - destination:
            host: hms-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # ===========================================
    # International Patient Service Routes
    # Manages international/medical tourism patients
    # ===========================================

    # International patients list endpoint
    - match:
        - uri:
            exact: /api/v1/international-patients
      route:
        - destination:
            host: hms-international-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # International patients CRUD - per-patient international details
    # Matches /api/v1/patients/{id}/international-details
    - match:
        - uri:
            regex: /api/v1/patients/[^/]+/international-details.*
      route:
        - destination:
            host: hms-international-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Medical tourism packages
    - match:
        - uri:
            prefix: /api/v1/medical-tourism
      rewrite:
        uri: /medical-tourism
      route:
        - destination:
            host: hms-international-patient-service.marketplace.svc.cluster.local
            port:
              number: 8080
      timeout: {{ .Values.timeout.api }}

    # Visa assistance services
    - match:
        - uri:
            prefix: /api/v1/visa-assistance
      rewrite:
        uri: /visa-assistance
      route:
        - destination:
            host: hms-international-patient-service.marketplace.svc.cluster.local
            port:
