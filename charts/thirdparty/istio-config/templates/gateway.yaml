{{/*
Gateway - Defines the entry points for traffic into the mesh
*/}}
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: tesseract-gateway
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    # HTTP server for all traffic (platform + custom domains)
    # Cloudflare Tunnel terminates TLS, so NO redirect here
    # VirtualServices handle routing based on Host header
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      # NO httpsRedirect - all traffic arrives via Cloudflare Tunnel (TLS already terminated)

    # HTTPS server for admin
    - port:
        number: 443
        name: https-admin
        protocol: HTTPS
      hosts:
        - "{{ .Values.subdomains.admin }}.{{ .Values.domain }}"
      tls:
        mode: SIMPLE
        credentialName: admin-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for storefront
    - port:
        number: 443
        name: https-store
        protocol: HTTPS
      hosts:
        - "{{ .Values.subdomains.store }}.{{ .Values.domain }}"
      tls:
        mode: SIMPLE
        credentialName: storefront-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for onboarding (apex domain in prod, subdomain in devtest)
    - port:
        number: 443
        name: https-onboarding
        protocol: HTTPS
      hosts:
        {{- if .Values.subdomains.onboarding }}
        - "{{ .Values.subdomains.onboarding }}.{{ .Values.domain }}"
        {{- else }}
        - "{{ .Values.domain }}"
        {{- end }}
      tls:
        mode: SIMPLE
        {{- if .Values.subdomains.onboarding }}
        credentialName: tenant-onboarding-tls
        {{- else }}
        credentialName: apex-domain-tls
        {{- end }}
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for API gateway
    - port:
        number: 443
        name: https-api
        protocol: HTTPS
      hosts:
        - "{{ .Values.subdomains.api }}.{{ .Values.domain }}"
      tls:
        mode: SIMPLE
        credentialName: api-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for fanzone removed 2026-07-23 — FanZone decommissioned.

    # HTTPS server for GrowthBook Feature Flags
    - port:
        number: 443
        name: https-growthbook
        protocol: HTTPS
      hosts:
        - "{{ .Values.subdomains.growthbook }}.{{ .Values.domain }}"
      tls:
        mode: SIMPLE
        credentialName: growthbook-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for OpenPanel Web Analytics
    - port:
        number: 443
        name: https-analytics
        protocol: HTTPS
      hosts:
        {{- if .Values.analyticsHost }}
        - "{{ .Values.analyticsHost }}"
        {{- else }}
        - "{{ .Values.subdomains.analytics }}.{{ .Values.domain }}"
        {{- end }}
      tls:
        mode: SIMPLE
        credentialName: analytics-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for API Documentation (Swagger UI)
    - port:
        number: 443
        name: https-api-docs
        protocol: HTTPS
      hosts:
        - "{{ .Values.subdomains.apiDocs }}.{{ .Values.domain }}"
      tls:
        mode: SIMPLE
        credentialName: api-docs-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    # HTTPS server for wildcard storefronts (<slug>.tesserix.app)
    # This enables multi-tenant subdomain-based storefront routing
    - port:
        number: 443
        name: https-storefront-wildcard
        protocol: HTTPS
      hosts:
        - "*.{{ .Values.domain }}"
      tls:
        mode: SIMPLE
        credentialName: storefront-wildcard-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}

    {{- if .Values.companyHost }}
    # HTTPS server for company website (tesserix.app)
    # Cloud Run only — no GKE deployment, routed via ILB + Istio ServiceEntry
    - port:
        number: 443
        name: https-company
        protocol: HTTPS
      hosts:
        - "{{ .Values.companyHost }}"
      tls:
        mode: SIMPLE
        credentialName: company-tls
        minProtocolVersion: {{ .Values.tls.minProtocolVersion }}
        cipherSuites:
          {{- range .Values.tls.cipherSuites }}
          - {{ . }}
          {{- end }}
    {{- end }}
