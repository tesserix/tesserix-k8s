{{/*
Waypoint proxies for Istio Ambient mesh
Waypoints provide L7 processing (VirtualService, AuthorizationPolicy,
DestinationRule, EnvoyFilter) for namespaces enrolled in ambient mode.
Only deployed for namespaces that need L7 features.
*/}}
{{- range .Values.ambient.waypointNamespaces }}
{{- $parked := hasKey ($.Values.ambient.parkedWaypoints | default dict) . }}
{{- if $parked }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-parked
  namespace: {{ . }}
data:
  deployment: |
    spec:
      replicas: 0
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: {{ . }}
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  {{- if or $parked $.Values.ambient.waypointTrafficDistribution }}
  infrastructure:
    {{- if $parked }}
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-parked
    {{- end }}
    {{- with $.Values.ambient.waypointTrafficDistribution }}
    annotations:
      networking.istio.io/traffic-distribution: {{ . | quote }}
    {{- end }}
  {{- end }}
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
