# =============================================================================
# Scrapper Namespace Policies
# =============================================================================
{{- if .Values.appNamespaces.scrapper }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrapper-ingress
  namespace: {{ .Values.appNamespaces.scrapper }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespaces.scrapper }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # Allow from cnpg-system (CloudNativePG operator status checks)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Allow from support-platform — slm-router calls scrapper-mcp on port 8765
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: support-platform
    {{- if .Values.appNamespaces.homechef }}
    # Allow from homechef — the shared Temporal frontend (temporal.scrapper.svc:7233)
    # lives here; the homechef API, worker, and namespace-register Job reach it for
    # durable execution (#116). Ambient mesh tunnels this over HBONE (port 15008),
    # which default-deny-ingress blocks unless the source namespace is allowlisted.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespaces.homechef }}
    {{- end }}
    # Allow from postiz — same shared Temporal frontend dependency as homechef.
    # The postiz namespace is chart-owned (charts/apps/postiz), not registered
    # in appNamespaces; only this scrapper-side allowance lives here.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postiz
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

