              kubernetes.io/metadata.name: {{ .Values.infrastructureNamespaces.nats }}
      ports:
        - protocol: TCP
          port: 4222   # Client connections
        - protocol: TCP
          port: 6222   # Cluster routing
        - protocol: TCP
          port: 8222   # HTTP monitoring
    # Allow monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8222

