# =============================================================================
# Istio System Namespace Policy
# Allow webhook traffic from kube-system (API server) to istiod
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-to-istiod
  namespace: istio-system
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: istiod
  policyTypes:
    - Ingress
  ingress:
    # Allow webhook calls from kube-system (API server)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 15017
    # Allow from all app namespaces (for xDS, telemetry)
    {{- range $key, $ns := .Values.appNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
    {{- end }}
    # Allow from all infrastructure namespaces (for xDS, telemetry)
    {{- range $key, $ns := .Values.infrastructureNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
    {{- end }}
    # Every ambient waypoint needs xDS and workload certificates from istiod.
    {{- range $ns := .Values.ambient.waypointNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: waypoint
    {{- end }}
    # Allow from istio-ingress and istio-egress gateways
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-egress
    # Allow from support-platform — its ambient waypoint needs istiod XDS/CA on
    # 15012; support-platform manages its own netpols/authz so it is not in the
    # appNamespaces/infrastructureNamespaces ranges above (was the cause of the
    # waypoint crashloop: "failed to sign CSR ... istiod:15012 i/o timeout").
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: support-platform
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow internal istio-system traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system

