        - protocol: TCP
          port: 53
{{- end }}

# =============================================================================
# Agentic Control Plane Namespace Policies
# Mirror the devai pattern — allow intra-namespace + istio-ingress +
# monitoring + cnpg-system + DNS. These are agentregistry-system,
# agentgateway-system, and kagent-system from .Values.appNamespaces.
# =============================================================================
{{- range $name := list "agentregistry" "agentgateway" "kagent" }}
{{- $ns := index $.Values.appNamespaces $name | default "" }}
{{- if $ns }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $name }}-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
    # Intra-namespace traffic (e.g. agentregistry → its bundled postgres)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Cross-namespace agentic traffic (kagent → aregistry, gateway → aregistry, …)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentregistry-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent-system
    # Product namespaces that consume the control plane. Kora was added
    # after its registry lookups timed out for a day: egress was allowed on
    # the kora side, but a missing entry here dropped every packet, which
    # looks identical to an unreachable service.
{{- range $consumer := $.Values.agenticConsumerNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $consumer }}
{{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}

# =============================================================================
# Database Namespace Policies (STRICT MULTI-TENANT ISOLATION)
# Each product can ONLY access its own database namespace
# Cross-product access is DENIED
# Infrastructure services (e.g. GrowthBook) have explicit database mappings
# =============================================================================
{{- range $key, $dbNs := .Values.databaseNamespaces }}
---
# Strict database access for {{ $key }} - only {{ index $.Values.appNamespaces $key }} can access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strict-{{ $key }}-db-access
  namespace: {{ $dbNs }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
    security.tesserix.app/isolation: "product-boundary"
    security.tesserix.app/product: "{{ $key }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # ONLY allow from the corresponding app namespace - NO OTHER PRODUCTS
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ index $.Values.appNamespaces $key }}
      ports:
        - protocol: TCP
          port: 5432
    # Allow internal database replication
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $dbNs }}
      ports:
        - protocol: TCP
          port: 5432
    # Allow infrastructure namespaces that use this database
    {{- if $.Values.infrastructureDatabaseMapping }}
    {{- range $infraKey, $infraDbNs := $.Values.infrastructureDatabaseMapping }}
    {{- if eq $infraDbNs $dbNs }}
    {{- $infraNs := index $.Values.infrastructureNamespaces $infraKey }}
    {{- if $infraNs }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $infraNs }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    # Allow cross-product database access (for shared services)
    {{- if $.Values.crossProductDatabaseAccess }}
    {{- range $appKey, $allowedDbs := $.Values.crossProductDatabaseAccess }}
    {{- range $allowedDb := $allowedDbs }}
    {{- if eq $allowedDb $dbNs }}
    {{- $appNs := index $.Values.appNamespaces $appKey }}
    {{- if $appNs }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $appNs }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    # Allow backup namespaces to access ALL database namespaces
    {{- if $.Values.backupNamespaces }}
    {{- range $backupNs := $.Values.backupNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $backupNs }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    # Allow monitoring (for metrics only)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187  # postgres-exporter metrics only
    {{- if $.Values.databaseExternalAccess }}
    {{- if index $.Values.databaseExternalAccess $key }}
    # Allow external access via ILB (Cloud Run VPC connector)
    - from:
      {{- range index $.Values.databaseExternalAccess $key }}
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
{{- end }}

# =============================================================================
# MongoDB Namespace Policies (STRICT MULTI-TENANT ISOLATION)
# Each product can ONLY access its own MongoDB namespace
# =============================================================================
{{- range $key, $mongoNs := .Values.mongoNamespaces }}
---
# Strict MongoDB access for {{ $key }} - only {{ index $.Values.appNamespaces $key }} can access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strict-{{ $key }}-mongo-access
  namespace: {{ $mongoNs }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
    security.tesserix.app/isolation: "product-boundary"
    security.tesserix.app/product: "{{ $key }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # ONLY allow from the corresponding app namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ index $.Values.appNamespaces $key }}
      ports:
        - protocol: TCP
          port: 27017
    # Allow internal MongoDB replication
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $mongoNs }}
      ports:
        - protocol: TCP
          port: 27017
    # Allow backup namespace (db-backup-and-restore) for mongodump
    {{- if $.Values.infrastructureNamespaces.dbBackup }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.infrastructureNamespaces.dbBackup }}
      ports:
        - protocol: TCP
          port: 27017
    {{- end }}
    # Allow monitoring (for metrics only)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9216  # mongodb-exporter metrics only
    {{- if index $.Values.mongoExternalAccess $key }}
    # Allow external access via ILB (Cloud Run VPC connector)
    - from:
      {{- range index $.Values.mongoExternalAccess $key }}
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 27017
    {{- end }}
{{- end }}

