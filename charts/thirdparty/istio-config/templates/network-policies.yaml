{{/*
NetworkPolicies - Kubernetes native network isolation
Provides defense in depth alongside Istio AuthorizationPolicies
Works even for pods without Istio sidecars

DISABLED when .Values.features.networkPolicies.enabled is false
*/}}

{{- if .Values.features.networkPolicies.enabled }}

# =============================================================================
# Default Deny Policies
# Each namespace gets a default deny ingress to prevent unexpected traffic
# =============================================================================
{{- range $key, $ns := .Values.appNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}

# =============================================================================
# Global Namespace Policies
# Allow traffic from all app namespaces and ingress
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-global-ingress
  namespace: {{ .Values.appNamespaces.global }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow from Istio ingress gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
    # Allow from all app namespaces
    {{- range $key, $ns := .Values.appNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
    {{- end }}
    # Namespaces that hold a database on global-postgres but ship their own
    # mesh policies, so they are deliberately not in appNamespaces.
    {{- range .Values.globalIngressExtraNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow from istio-system (for telemetry)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # Allow from cnpg-system (CloudNativePG operator status checks)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Allow DNS resolution (both UDP and TCP)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# =============================================================================
# Marketplace Namespace Policies
# Allow from ingress, global, monitoring - deny cross-product
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-marketplace-ingress
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow from Istio ingress gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
    # Allow internal marketplace traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespaces.marketplace }}
    # Allow from global namespace (webhooks, callbacks)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespaces.global }}
    # Allow from tesserix namespace (company website SSR calls)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesserix
    # Allow from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow from istio-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # Allow DNS (both UDP and TCP)
    # Allow from cnpg-system (CloudNativePG operator status checks)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Allow from mark8ly — mark8ly-mcp (support platform tool layer)
    # calls mp-orders.marketplace.svc to fetch real order data.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mark8ly
    # Allow from support-platform — slm-router calls mark8ly-mcp on
    # 8765, which then proxies to marketplace services.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: support-platform
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

