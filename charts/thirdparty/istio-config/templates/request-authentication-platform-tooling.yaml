{{/*
RequestAuthentication for platform tooling Dex issuers (Kargo).

Why this exists:
The shared istio-auth-policies chart creates a RequestAuthentication on
the ingressgateway that only knows about the GIP issuers.
Envoy's JWT filter merges all RequestAuthentication rules selected by the
same workload — so any inbound JWT whose `iss` doesn't match one of those
configured issuers gets rejected at the gateway with
`Jwt issuer is not configured` (HTTP 401), BEFORE reaching the upstream.

Kargo (and Kargo CLI) DO send `Authorization: Bearer <id_token>` issued by
their bundled Dex, so we register that issuer here so the JWT filter accepts
it. Verified 2026-07-15: https://kargo.tesserix.app/dex/keys returns 200.

Each rule is additive — non-matching JWTs from these issuers don't fail,
they just don't set requestPrincipals. AuthorizationPolicies upstream
make their own decisions.

The ArgoCD Dex rule that used to live here was REMOVED on 2026-07-15. It was
never needed — ArgoCD's UI uses HttpOnly session cookies, not bearer JWTs — and
its jwksUri (https://argocd.tesserix.app/api/dex/keys) returns 404, so istiod
could never resolve it. That matters because istiod inlines JWKS into the
listener: every LDS build calls the JWKS resolver, and unreachable issuers wedge
it (goroutines blocked on `chan send` in GetPublicKey), so istiod stops answering
LDS requests and NEW ingressgateway pods can never become ready. Do not add an
issuer here whose jwksUri istiod cannot actually reach.
*/}}
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: jwt-auth-kargo-dex
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: release
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: https://kargo.tesserix.app/dex
      jwksUri: https://kargo.tesserix.app/dex/keys
      forwardOriginalToken: true
