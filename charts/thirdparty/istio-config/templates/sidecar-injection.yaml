{{/*
Namespace labels for Istio Ambient mesh
Ambient mode uses ztunnel (per-node L4 proxy) instead of sidecar injection.
Label namespaces with istio.io/dataplane-mode: ambient to enroll them.
*/}}
{{- $dbAccessNamespaces := .Values.sidecarInjection.databaseAccessNamespaces | default list }}
{{- range .Values.sidecarInjection.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    # Disable legacy sidecar injection (must be explicit to override existing label)
    istio-injection: disabled
    # Istio Ambient mesh enrollment (replaces sidecar injection)
    istio.io/dataplane-mode: ambient
    # K8s built-in namespace name label
    kubernetes.io/metadata.name: {{ . }}
    # Custom name label for NetworkPolicy namespaceSelector matching
    name: {{ . }}
    {{- if has . $dbAccessNamespaces }}
    # Allow database access through NetworkPolicy
    database-access: "allowed"
    {{- end }}
{{- end }}

{{/*
Namespaces excluded from Istio mesh (Redis, NATS, MongoDB)
In ambient mode, these namespaces are simply not labeled — ztunnel
does not intercept traffic for unlabeled namespaces.
*/}}
{{- range .Values.sidecarInjection.disabledNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    # K8s built-in namespace name label
    kubernetes.io/metadata.name: {{ . }}
    # Custom name label for NetworkPolicy namespaceSelector matching
    name: {{ . }}
    {{- if has . $dbAccessNamespaces }}
    # Allow database access through NetworkPolicy
    database-access: "allowed"
    {{- end }}
{{- end }}
