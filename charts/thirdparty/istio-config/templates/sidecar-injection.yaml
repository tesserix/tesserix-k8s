{{/*
Namespace labels for Istio Ambient mesh
Ambient mode uses ztunnel (per-node L4 proxy) instead of sidecar injection.
Label namespaces with istio.io/dataplane-mode: ambient to enroll them.

For namespaces that also have a waypoint proxy (see waypoint-proxies.yaml),
apply `istio.io/use-waypoint: waypoint` so ztunnel routes traffic through
the waypoint. Without this label the Gateway is created but never sees
traffic — and L7 AuthorizationPolicies (method / path / headers) are
silently degraded to L4-only by ztunnel.
*/}}
{{- $dbAccessNamespaces := .Values.sidecarInjection.databaseAccessNamespaces | default list }}
{{- $ambientExcluded := .Values.sidecarInjection.ambientExcluded | default list }}
{{- $waypointNamespaces := .Values.ambient.waypointNamespaces | default list }}
{{- $protectedTiers := .Values.sidecarInjection.protectedTiers | default dict }}
{{- range .Values.sidecarInjection.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    # Disable legacy sidecar injection (must be explicit to override existing label)
    istio-injection: disabled
    {{- if not (has . $ambientExcluded) }}
    # Istio Ambient mesh enrollment (replaces sidecar injection)
    istio.io/dataplane-mode: ambient
    {{- end }}
    {{- if has . $waypointNamespaces }}
    # Route all traffic to this namespace's services through the waypoint
    # proxy. Required for L7 AuthorizationPolicy enforcement under ambient.
    istio.io/use-waypoint: waypoint
    {{- end }}
    # K8s built-in namespace name label
    kubernetes.io/metadata.name: {{ . }}
    # Custom name label for NetworkPolicy namespaceSelector matching
    name: {{ . }}
    {{- if has . $dbAccessNamespaces }}
    # Allow database access through NetworkPolicy
    database-access: "allowed"
    {{- end }}
    {{- if hasKey $protectedTiers . }}
    # TIG deletion guard — VAP lives in k8s/cluster/namespace-protection.yaml
    tesserix.io/protected: "true"
    tesserix.io/tier: {{ index $protectedTiers . }}
    {{- end }}
{{- end }}

{{/*
Namespaces excluded from Istio mesh (NATS, MongoDB)
In ambient mode, these namespaces are simply not labeled — ztunnel
does not intercept traffic for unlabeled namespaces.
*/}}
{{- range .Values.sidecarInjection.disabledNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    # K8s built-in namespace name label
    kubernetes.io/metadata.name: {{ . }}
    # Custom name label for NetworkPolicy namespaceSelector matching
    name: {{ . }}
    {{- if has . $dbAccessNamespaces }}
    # Allow database access through NetworkPolicy
    database-access: "allowed"
    {{- end }}
    {{- if hasKey $protectedTiers . }}
    # TIG deletion guard — VAP lives in k8s/cluster/namespace-protection.yaml
    tesserix.io/protected: "true"
    tesserix.io/tier: {{ index $protectedTiers . }}
    {{- end }}
{{- end }}
