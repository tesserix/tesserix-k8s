spec:
  host: "*.{{ index $.Values.infrastructureNamespaces "identity-internal" }}.svc.cluster.local"
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: {{ if eq $.Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 10s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 500
{{- end }}

---
# {{ $ns }} -> growthbook namespace
# NOTE: h2UpgradePolicy is DO_NOT_UPGRADE because GrowthBook only supports HTTP/1.1
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $ns }}-to-growthbook-dr
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: "*.{{ $.Values.infrastructureNamespaces.growthbook }}.svc.cluster.local"
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: {{ if eq $.Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 20
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        http1MaxPendingRequests: 20
        http2MaxRequests: 100

---
# {{ $ns }} -> openpanel namespace
# NOTE: h2UpgradePolicy is DO_NOT_UPGRADE because OpenPanel only supports HTTP/1.1
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $ns }}-to-openpanel-dr
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: "*.{{ $.Values.infrastructureNamespaces.openpanel }}.svc.cluster.local"
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: {{ if eq $.Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 20
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        http1MaxPendingRequests: 20
        http2MaxRequests: 100
{{- end }}

{{- end }}
