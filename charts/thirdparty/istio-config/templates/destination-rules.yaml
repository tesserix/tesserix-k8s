# =============================================================================
# Tesserix Namespace DestinationRules
# Company website + blog (ambient dataplane, no sidecars)
# No explicit tls.mode — auto-mTLS handles ambient correctly. Forcing
# ISTIO_MUTUAL makes the ingress gateway wrap traffic in mTLS direct to the
# pod port, which serves plaintext under ambient → TLS WRONG_VERSION_NUMBER.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: tesserix-services-dr
  namespace: {{ .Values.appNamespaces.tesserix }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: "*.{{ .Values.appNamespaces.tesserix }}.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        http1MaxPendingRequests: 50
        http2MaxRequests: 500
        maxRequestsPerConnection: 10
        maxRetries: 3
        # Close idle upstream pool connections before Node's keepAliveTimeout
        # (70s, set via server-prelude.js in tesserix-blog). Prevents the
        # Envoy↔Node keep-alive race that surfaces as "upstream connect error
        # or disconnect/reset before headers … connection termination".
        idleTimeout: 60s
    {{- if .Values.circuitBreaker.enabled }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.circuitBreaker.maxEjectionPercent }}
    {{- end }}

# =============================================================================
# Cross-Namespace Communication Rules
# Allow app namespaces to communicate with global services
# =============================================================================
{{- $globalNs := .Values.appNamespaces.global }}
{{- range $key, $ns := .Values.appNamespaces }}
{{- if ne $ns $globalNs }}
---
# {{ $ns }} -> global namespace communication
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $ns }}-to-global-dr
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: "*.{{ $globalNs }}.svc.cluster.local"
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: {{ if eq $.Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 30s
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 50
        http2MaxRequests: 500
{{- end }}
{{- end }}

# =============================================================================
# Database DestinationRules
# DISABLE mTLS for databases (use native PostgreSQL SSL)
# =============================================================================
{{- range $key, $dbNs := .Values.databaseNamespaces }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $key }}-postgresql-dr
  namespace: {{ $dbNs }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: postgresql.{{ $dbNs }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
{{- end }}

# =============================================================================
# CNPG Postgres DestinationRules (in-namespace)
# DISABLE mTLS for CNPG postgres services — apps use native PostgreSQL SSL
# (sslmode=require) and the ztunnel/sidecar mTLS causes double-TLS failures
# =============================================================================
{{- range $key, $ns := .Values.appNamespaces }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $key }}-cnpg-postgres-dr
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: "{{ $key }}-postgres-rw.{{ $ns }}.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $key }}-cnpg-postgres-ro-dr
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: "{{ $key }}-postgres-ro.{{ $ns }}.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
{{- end }}

# =============================================================================
# App Namespace to Database DestinationRules
# CRITICAL: Apps need DestinationRules in their OWN namespace to access databases
# =============================================================================
{{- range $key, $ns := .Values.appNamespaces }}
{{- $dbNs := index $.Values.databaseNamespaces $key }}
{{- if $dbNs }}
---
# {{ $ns }} -> database (postgresql) namespace - DISABLE mTLS
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $key }}-to-postgresql-dr
  namespace: {{ $ns }}
  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: postgresql.{{ $dbNs }}.svc.cluster.local
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
{{- end }}
{{- end }}

# =============================================================================
# Infrastructure Namespace to Database DestinationRules
# CRITICAL: Infrastructure services (Keycloak, GrowthBook) need access to databases
# =============================================================================
{{- if .Values.infrastructureDatabaseMapping }}
{{- range $key, $dbNs := .Values.infrastructureDatabaseMapping }}
{{- $infraNs := index $.Values.infrastructureNamespaces $key }}
{{- if $infraNs }}
---
# {{ $infraNs }} -> database ({{ $dbNs }}) namespace - DISABLE mTLS
