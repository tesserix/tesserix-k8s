---
# =============================================================================
# PCI-DSS COMPLIANT: Payment service - enhanced security
# Handles sensitive payment data, requires stricter security controls
# =============================================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service-dr
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    pci-compliance: required
spec:
  host: payment-service.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
  trafficPolicy:
    # ALWAYS use mTLS for payment service (PCI-DSS requirement)
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 10s
      http:
        h2UpgradePolicy: UPGRADE
        # Lower limits for payment service to prevent overload attacks
        http1MaxPendingRequests: 25
        http2MaxRequests: 100
        maxRequestsPerConnection: 5
        maxRetries: 2
    # Stricter circuit breaker for payment service
    outlierDetection:
      consecutive5xxErrors: 2
      interval: 10s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
      minHealthPercent: 50

