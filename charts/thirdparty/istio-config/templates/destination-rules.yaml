# Notification hub - WebSocket + SSE support
# CRITICAL: Must use DO_NOT_UPGRADE because WebSocket requires HTTP/1.1 upgrade semantics
# h2UpgradePolicy: UPGRADE strips Connection/Upgrade headers, breaking WebSocket handshake
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: notification-hub-dr
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: notification-hub.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: {{ if eq .Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 0
        maxRetries: 3
    {{- if .Values.circuitBreaker.enabled }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.circuitBreaker.maxEjectionPercent }}
    {{- end }}

