# =============================================================================
# Knative Frontend ExternalName Service DestinationRules
# CRITICAL: Knative creates ExternalName services that point to knative-local-gateway.
# The wildcard marketplace DR applies ISTIO_MUTUAL, but the ExternalName service
# resolves to knative-local-gateway which doesn't accept mTLS inbound.
# These specific DRs override the wildcard to disable TLS for ExternalName services.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: marketplace-onboarding-dr
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: marketplace-onboarding.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: marketplace-admin-dr
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: marketplace-admin.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mp-storefront-dr
  namespace: {{ .Values.appNamespaces.marketplace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: mp-storefront.{{ .Values.appNamespaces.marketplace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE

# =============================================================================
# Knative Local Gateway DestinationRule
# CRITICAL: Uses useClientProtocol to mirror the downstream HTTP version.
# The knative-local-gateway K8s service port is named "http2", causing Istio
# to force HTTP/2 for all upstream connections. WebSocket upgrade requires
# HTTP/1.1 — useClientProtocol lets HTTP/1.1 WS handshakes pass through
# while keeping HTTP/2 for regular API calls.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: knative-local-gateway-dr
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: knative-local-gateway.istio-ingress.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        useClientProtocol: true
        http1MaxPendingRequests: 200
        http2MaxRequests: 2000
        maxRequestsPerConnection: 0

# =============================================================================
# FanZone Namespace DestinationRules
# Sports/gaming platform services
# Uses auto-mTLS (no explicit tls.mode) so Knative services work correctly.
# Knative revision services route to the activator (knative-serving ns, no
# sidecar), and ISTIO_MUTUAL would force TLS to a non-TLS endpoint.
# Auto-mTLS uses mTLS when sidecars are present, plaintext when absent.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: fanzone-services-dr
  namespace: {{ .Values.appNamespaces.fanzone }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
