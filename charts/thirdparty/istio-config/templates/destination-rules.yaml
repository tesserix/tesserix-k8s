  labels:
    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: postgresql.{{ $dbNs }}.svc.cluster.local
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
{{- end }}
{{- $redisNs := index $.Values.redisNamespaces $key }}
{{- if $redisNs }}
---
# {{ $ns }} -> redis namespace - DISABLE mTLS
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $key }}-to-redis-dr
  namespace: {{ $ns }}
