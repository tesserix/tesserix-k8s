{{/*
DestinationRules - Defines traffic policies and load balancing for services
Multi-namespace architecture with product isolation

DISABLED when .Values.features.destinationRules.enabled is false
*/}}

{{- if .Values.features.destinationRules.enabled }}

# =============================================================================
# Global Namespace DestinationRules
# Services: auth, tenant, notification, verification, settings, etc.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: global-services-dr
  namespace: {{ .Values.appNamespaces.global }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: "*.{{ .Values.appNamespaces.global }}.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: {{ if eq .Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    {{- if .Values.circuitBreaker.enabled }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.circuitBreaker.maxEjectionPercent }}
    {{- end }}

---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: hms-services-dr
  namespace: {{ .Values.appNamespaces.hms }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: "*.{{ .Values.appNamespaces.hms }}.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: {{ if eq .Values.mtls.mode "STRICT" }}ISTIO_MUTUAL{{ else }}DISABLE{{ end }}
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    {{- if .Values.circuitBreaker.enabled }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.circuitBreaker.maxEjectionPercent }}
    {{- end }}

# =============================================================================
# Knative Frontend ExternalName Service DestinationRules
# CRITICAL: Knative creates ExternalName services that point to knative-local-gateway.
# A wildcard DR can apply ISTIO_MUTUAL, but the ExternalName service
# resolves to knative-local-gateway which doesn't accept mTLS inbound.
# These specific DRs override the wildcard to disable TLS for ExternalName services.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: knative-local-gateway-dr
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: knative-local-gateway.istio-ingress.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        useClientProtocol: true
        http1MaxPendingRequests: 200
        http2MaxRequests: 2000
        maxRequestsPerConnection: 0

# =============================================================================
# FanZone Namespace DestinationRules
# Sports/gaming platform services
# Uses auto-mTLS (no explicit tls.mode) so Knative services work correctly.
# Knative revision services route to the activator (knative-serving ns, no
# sidecar), and ISTIO_MUTUAL would force TLS to a non-TLS endpoint.
# Auto-mTLS uses mTLS when sidecars are present, plaintext when absent.
# =============================================================================
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: fanzone-services-dr
  namespace: {{ .Values.appNamespaces.fanzone }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: "*.{{ .Values.appNamespaces.fanzone }}.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
    {{- if .Values.circuitBreaker.enabled }}
    outlierDetection:
      consecutive5xxErrors: {{ .Values.circuitBreaker.consecutive5xxErrors }}
      interval: {{ .Values.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.circuitBreaker.maxEjectionPercent }}
    {{- end }}

