    {{- include "istio-config.labels" $ | nindent 4 }}
spec:
  host: postgresql.{{ $dbNs }}.svc.cluster.local
  exportTo:
    - "."
  trafficPolicy:
    tls:
      mode: DISABLE
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
{{- end }}
{{- end }}
{{- end }}

