{{- if .Values.features.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helivanta-documents-to-istiod
  namespace: istio-system
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: istiod
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: helivanta
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [helivanta-api, helivanta-document-worker, helivanta-clamav]
      ports:
        - {protocol: TCP, port: 15012}
{{- end }}
