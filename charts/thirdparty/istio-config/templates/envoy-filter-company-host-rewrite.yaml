{{/*
EnvoyFilter to rewrite Host header for company website (tesserix.app) routes.
Cloud Run requires the Host header to match its *.run.app hostname.
Istio VirtualService headers.request.set.authority adds a custom header
named "authority" but does NOT rewrite the actual Host/:authority pseudo-header.
This EnvoyFilter uses Envoy's auto_host_rewrite to correctly set the Host
header to the upstream Cloud Run hostname.
*/}}
{{- if .Values.companyHost }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: company-host-rewrite
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    # Rewrite Host header on port 80 routes (Cloudflare Tunnel traffic)
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: "{{ .Values.companyHost }}:80"
      patch:
        operation: MERGE
        value:
          route:
            auto_host_rewrite: true
    # Rewrite Host header on port 443 routes (direct HTTPS traffic)
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: "{{ .Values.companyHost }}:443"
      patch:
        operation: MERGE
        value:
          route:
            auto_host_rewrite: true
{{- end }}
