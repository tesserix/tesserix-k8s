apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helivanta-api-to-growthbook
  namespace: {{ .Values.infrastructureNamespaces.growthbook }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: growthbook
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: helivanta
          podSelector:
            matchLabels:
              app.kubernetes.io/name: helivanta-api
              app.kubernetes.io/component: api
      ports:
        - {protocol: TCP, port: 3100}
