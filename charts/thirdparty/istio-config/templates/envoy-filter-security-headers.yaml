{{/*
EnvoyFilter to add PCI-DSS compliant security headers
These headers protect against common web vulnerabilities and are required for PCI compliance
*/}}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: security-headers
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: pci-compliance
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_response(response_handle)
                local h = response_handle:headers()

                -- SET ONLY IF THE UPSTREAM DID NOT.
                --
                -- Envoy's Lua `add` APPENDS. Calling it unconditionally on a
                -- header the application already sent emits the header twice,
                -- and browser behaviour on conflicting values is undefined —
                -- some take the most restrictive, some take the last. That is
                -- how mark8ly ended up serving `X-Frame-Options: DENY` and
                -- `SAMEORIGIN` together, with nobody able to say which was in
                -- force (tesserix/mark8ly#596).
                --
                -- `replace` would stop the duplication, but it would also
                -- overwrite an app that deliberately chose something stricter
                -- than this baseline — mark8ly's marketing site wants DENY and
                -- `geolocation=()`, both tighter than the gateway default. So
                -- the gateway supplies a floor for services that set nothing,
                -- and gets out of the way of services that have an opinion.
                local function default(name, value)
                  if h:get(name) == nil then
                    h:add(name, value)
                  end
                end

                -- HSTS is the exception, and is deliberately `replace`.
                -- Transport security belongs to the edge, not to an app, and
                -- this value carries `preload` where the app-set ones do not —
                -- deferring to the upstream here would silently drop us toward
                -- removal from the preload list.
                h:replace("Strict-Transport-Security", "max-age=31536000; includeSubDomains; preload")

                default("X-Content-Type-Options", "nosniff")

                -- Clickjacking. SAMEORIGIN is the floor; an app may choose DENY.
                default("X-Frame-Options", "SAMEORIGIN")

                -- XSS Protection (legacy browsers)
                default("X-XSS-Protection", "1; mode=block")

                -- Referrer Policy: don't leak referrer to cross-origin requests
                default("Referrer-Policy", "strict-origin-when-cross-origin")

                -- Permissions Policy. This default allows geolocation and
                -- microphone because onboarding/commentary need them; an app
                -- that needs neither should send its own tighter value and
                -- this will step aside.
                default("Permissions-Policy", "geolocation=(self), microphone=(self), camera=()")

                -- Remove server identification headers
                h:remove("Server")
                h:remove("X-Powered-By")
              end
---
# Security headers for custom domain gateway
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: security-headers-custom
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    app.kubernetes.io/component: pci-compliance
spec:
  workloadSelector:
    labels:
      istio: custom-ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
