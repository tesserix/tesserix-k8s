---
# Wildcard certificate for multi-tenant storefronts
# Enables <slug>.tesserix.app subdomain routing
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: storefront-wildcard-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  secretName: storefront-wildcard-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - "*.{{ .Values.domain }}"
{{- if .Values.companyHost }}
---
# Company website certificate (tesserix.app)
# Cloud Run only — routed via ILB + Istio ServiceEntry
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: company-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
