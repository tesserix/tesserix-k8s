{{/*
Certificates for Istio Gateway TLS termination
These certificates must be in the istio-ingress namespace for the Gateway to use them
*/}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  secretName: admin-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - "{{ .Values.subdomains.admin }}.{{ .Values.domain }}"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: storefront-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  secretName: storefront-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - "{{ .Values.subdomains.store }}.{{ .Values.domain }}"
---
{{- if .Values.subdomains.onboarding }}
# Certificate for tenant onboarding subdomain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tenant-onboarding-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  secretName: tenant-onboarding-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - "{{ .Values.subdomains.onboarding }}.{{ .Values.domain }}"
{{- else }}
# Certificate for apex domain (tenant onboarding uses apex in prod)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apex-domain-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  secretName: apex-domain-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - "{{ .Values.domain }}"
{{- end }}
