# Web Analytics certificate (OpenPanel)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: analytics-tls
  namespace: istio-ingress
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  secretName: analytics-tls
  issuerRef:
    name: {{ .Values.tls.clusterIssuer }}
