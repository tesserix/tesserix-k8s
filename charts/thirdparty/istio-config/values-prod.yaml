# Production overrides for istio-config
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Cloud Run routing DISABLED — all services migrated to GKE Knative
cloudRun:
  enabled: false

# FanZone services migrated to GKE Knative — route through Knative local gateway
fanzoneKnative: false   # DECOMMISSIONED 2026-07-23

# Cloud Run IAM auth — DISABLED: all services migrated to GKE Knative
cloudRunAuth:
  enabled: false
  audience: ""

# Production uses mark8ly.com as the main domain
domain: mark8ly.com

# Company website on tesserix.app — DISABLED: migrated to tesserix/tesserix-k8s repo
companyHost: ""

# Cloud Run Host header rewrite DISABLED — all services on GKE Knative
cloudRunHostRewrite: []

# Cloudflare Tunnel configuration for custom domains
# Tunnel: PROD_MARKETLY
# Customers CNAME their domains to this tunnel endpoint
customDomains:
  enabled: true
  cloudflareTunnelId: "2b78323c-aa85-4b96-b703-c831357e7d33"

# Production subdomain configuration (without dev- prefix)
# Use empty string for apex domain (e.g., mark8ly.com instead of subdomain.mark8ly.com)
subdomains:
  admin: admin
  store: store
  onboarding: ""  # Empty = use apex domain mark8ly.com
  api: api
  # fanzone: fanzone   # DECOMMISSIONED 2026-07-23
  growthbook: growthbook
  apiDocs: api-docs
  typesense: search
  # Logging Stack (Kibana) - uses tesserix.app domain, not mark8ly.com
  kibana: kibana
  # Web Analytics (OpenPanel)
  analytics: analytics


# Production CORS configuration
# Kibana host override - uses tesserix.app in prod (not mark8ly.com)
kibanaHost: "kibana.tesserix.app"

# Analytics host override - uses tesserix.app in prod (not mark8ly.com)
analyticsHost: "analytics.tesserix.app"

cors:
  allowOrigins:
    - "https://kibana.tesserix.app"
    - "https://mark8ly.com"
    - "https://tesserix.app"
    - "https://admin.mark8ly.com"
    - "https://store.mark8ly.com"
    - "https://growthbook.mark8ly.com"
    - "https://api-docs.mark8ly.com"
    - "https://search.mark8ly.com"
    # fanzonebattleground.com — DECOMMISSIONED 2026-07-23
    - "https://analytics.tesserix.app"
    - "https://costestimator.tesserix.app"
    - "https://kubecost.tesserix.app"
    - "https://fe3dr.com"
    - "https://www.fe3dr.com"
    - "https://vendors.fe3dr.com"

# Production mesh configuration
meshConfig:
  accessLogFile: "/dev/stdout"
  enableAutoMtls: true
  defaultConfig:
    tracing:
      sampling: 10  # 10% sampling in production
