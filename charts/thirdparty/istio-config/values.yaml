# Istio configuration values

# Cloud Run routing — when enabled, VirtualService routes to Cloud Run
# instead of K8s services. Override in values-prod.yaml.
cloudRun:
  enabled: false

# Cloud Run IAM auth token injection — when enabled, the Istio gateway fetches
# GCP identity tokens via Workload Identity and injects X-Serverless-Authorization
# header. Required when Cloud Run services have allow_unauthenticated = false.
cloudRunAuth:
  enabled: false
  audience: ""

# Domain configuration
domain: tesserix.app
# Additional domains for tenant wildcard routing
additionalDomains: []

# Company website host (tesserix.app) — when set, creates a dedicated
# gateway server, certificate, and VirtualService for the company site.
# Empty in devtest (company chart handles its own routing).
companyHost: ""

# Cloud Run Host header rewrite — list of hostnames whose routes go to
# Cloud Run services and need auto_host_rewrite. Cloud Run rejects
# requests where the Host header doesn't match *.run.app.
# Only list hosts with Cloud Run destinations — K8s-only hosts (e.g.,
# customer-idp, growthbook, postal, mautic) must NOT be included.
# NOTE: Per-tenant dynamic subdomains (e.g., hello-store.mark8ly.com)
# currently route to K8s services and don't need this. When they migrate
# to Cloud Run, add "*.mark8ly.com" to this list.
cloudRunHostRewrite: []

# =============================================================================
# Custom Domains Configuration (via Cloudflare Tunnel)
# =============================================================================
# When enabled, the Gateway accepts HTTP traffic for ANY domain
# This is used for customer custom domains where:
# 1. Customer CNAMEs their domain to <tunnel-id>.cfargotunnel.com
# 2. Cloudflare Tunnel terminates TLS and forwards HTTP to Istio
# 3. VirtualServices route based on Host header to correct tenant
customDomains:
  enabled: true
  # Cloudflare Tunnel ID - customers CNAME to this
  cloudflareTunnelId: "30a5a0e4-f621-4082-9dde-34f1eed8e8ab"
subdomains:
  admin: dev-admin
  store: dev-store
  onboarding: dev-onboarding
  api: dev-api
  fanzone: dev-fanzone
  # Feature Flags
  growthbook: dev-growthbook
  # API Documentation (Swagger UI) - Multi-tenant
  apiDocs: dev-api-docs
  # Search Engine (Typesense)
  typesense: dev-search
  # Logging Stack (Kibana)
  kibana: kibana-dev
  # Web Analytics (OpenPanel)
  analytics: dev-analytics


# Kibana host override - when set, overrides subdomains.kibana + domain
# Used in prod where Kibana uses tesserix.app instead of mark8ly.com
kibanaHost: ""

# Analytics host override - when set, overrides subdomains.analytics + domain
# Used in prod where OpenPanel uses tesserix.app instead of mark8ly.com
analyticsHost: ""

# =============================================================================
# Feature Flags - Enable/Disable Istio Features
# =============================================================================
# Production hardening: all security features enabled
features:
  # Authorization policies (access control)
  # SECURITY NOTE: Authorization policies MUST be enabled for PCI-DSS compliance.
  # Implements zero-trust access control between services.
  authorizationPolicies:
    enabled: true  # ENABLED - Required for PCI-DSS and SOC2 compliance
  # Destination rules (traffic policies, TLS, circuit breakers)
  destinationRules:
    enabled: true  # ENABLED for production security
  # Peer authentication (mTLS)
  peerAuthentication:
    enabled: true  # ENABLED for production security
  # Network policies (Kubernetes native, defense in depth)
  networkPolicies:
    enabled: true  # ENABLED for production security

# mTLS configuration
mtls:
  # Mode: STRICT, PERMISSIVE, or DISABLE
  # STRICT: All traffic must be mTLS encrypted (production recommended)
  # PERMISSIVE: Accept both plaintext and mTLS (migration mode only)
  mode: STRICT

# =============================================================================
# Namespace Architecture (Multi-Product Multi-Tenant)
# =============================================================================
# Application namespaces - each product has its own namespace
appNamespaces:
  global: global           # Shared platform services (auth, tenant, notification)
  marketplace: marketplace # E-commerce platform (Tesseract Hub)
  tesserix: tesserix       # Company website (tesserix-home, no database/redis)
  # fanzone: fanzone       # Sports/gaming platform — DECOMMISSIONED 2026-07-23
  homechef: homechef      # Food platform
  gameverse: gameverse     # Board games platform (stayandplays.com)
  stockpilot: stockpilot   # AI stock analysis platform
  scrapper: scrapper       # Social media scrapper platform
  devai: devai             # AI-powered ALM + SRE platform
  # Kora — food memory / nutrition logging. DB lives on the shared
  # global-postgres cluster (kora_db), not a dedicated cluster — being
  # listed here is what grants allow-kora-egress → global:5432 (default
  # egress-to-global rule below) and lets allow-global-ingress accept
  # from kora (global's ingress loops over every appNamespaces entry).
  kora: kora               # Food memory / nutrition logging
  # NOTE: support-platform is intentionally NOT listed here. It manages its own
  # mesh/NetworkPolicies via the dedicated `support-platform-namespace` ArgoCD
  # app (allow-egress-broad, support-platform-to-*-dr, etc.). The old camelCase
  # `supportPlatform` key here only generated invalid RFC-1123 resource names
  # (allow-supportPlatform-egress, supportPlatform-cnpg-*, ...) that wedged the
  # entire istio-config sync ("must consist of lower case alphanumeric..."),
  # blocking every other namespace's mesh updates. Removed.
  # Agentic control planes (DevAI consumers). Each needs ingress allowance
  # to istio-system so istio-proxy can dial istiod for CSR signing.
  agentregistry: agentregistry-system
  agentgateway: agentgateway-system
  kagent: kagent-system

# Extra ingress sources for allow-global-ingress, for namespaces whose database
# lives on global-postgres but which ship their own NetworkPolicies — listing
# them in appNamespaces above would generate a second, conflicting set.
globalIngressExtraNamespaces:
  - postiz # BullMQ on global-valkey-queue; ambient HBONE (15008) must reach the waypoint
  - onboarding

# Product namespaces allowed to reach the agentic control plane
# (agentregistry-system, agentgateway-system, kagent-system). Their
# allow-<name>-ingress policies deny by default, so a consumer missing here
# gets a silent packet drop rather than a refusal.
agenticConsumerNamespaces:
  - devai
  - kora

# Namespaces to skip restrictive public-endpoints AuthorizationPolicy
# These namespaces manage their own auth or need full access from the gateway
skipAuthPolicyNamespaces:
  - devai

# Infrastructure service namespaces
# NOTE: keys must be lowercase with hyphens only (RFC 1123 compliant)
infrastructureNamespaces:
  translation: translation           # Translation services (LibreTranslate, Bergamot, HuggingFace)
  growthbook: growthbook             # Feature flags (GrowthBook)
  # photon: photon                   # DISABLED: High network cost for planet data download
  typesense: typesense               # Search engine
  nats: nats                         # Messaging
  logging: logging                   # Logging stack (Elasticsearch, Kibana, Fluent Bit)
  openpanel: openpanel               # Web analytics (OpenPanel)
  analyticsOperator: analytics-operator # OpenPanel project onboarding control plane
  postiz: postiz                     # Social scheduling — BullMQ on global-valkey-queue
  dbBackup: db-backup-and-restore    # Database backup/restore jobs

# Shared vector store (Qdrant). Every app namespace gets egress to it on
# 6333/6334; who may actually connect is decided by ai-database's own
# NetworkPolicy and AuthorizationPolicy allow-lists.
vectorStoreNamespace: ai-database

# Private Service Connect endpoints for Google APIs, reachable on 443.
#
# The `vertex-aiplatform` private DNS zone points aiplatform.googleapis.com at
# the PSC endpoint 10.255.0.2, so a pod dialling Vertex targets an RFC1918
# address. The catch-all 0.0.0.0/0 egress rule in allow-<ns>-egress excepts
# 10.0.0.0/8, and nothing else in that policy covers 10.255.0.0/24 — so every
# app namespace silently lost Vertex (kora#209). The drop is invisible from
# inside an ambient pod: `nc -z 10.255.0.2 443` still succeeds, because that
# connects to ztunnel's local redirect socket, not to the endpoint. ztunnel's
# own upstream dial is what Calico drops, which surfaces 10s later as a TLS
# reset and reads as "the PSC endpoint rejects pod TLS". It does not.
#
# Same class of bug as the crossProductNamespaceAccess note above: an in-cluster
# destination hidden behind the 10.0.0.0/8 except.
privateServiceConnectCIDRs:
  - 10.255.0.2/32

# MongoDB namespaces that the backup namespace can access
backupMongoNamespaces:
  - mongodb-blog
  # - mongodb-fanzone   # DECOMMISSIONED 2026-07-23

# Infrastructure namespace to database namespace mapping
# Maps infrastructure services to their database backends
# NOTE: keys must be lowercase with hyphens only (RFC 1123 compliant)
infrastructureDatabaseMapping:
  # CNPG clusters run in app namespaces — identity connects to global namespace directly
  growthbook: global

# Cross-product database access
# CNPG clusters run in app namespaces, so cross-product access targets the app namespace
crossProductDatabaseAccess:
  marketplace:
    - global

# Cross-product full-namespace egress (any port).
# Use sparingly — opens egress from {key} namespace to listed namespaces on
# all ports. Intended for cases where one product reuses several services
# (DB + AuthZ + APIs) of another.
# tesserix-auth-bff (super-admin gateway for tesserix.app) reuses
# mark8ly-postgres:5432, mark8ly-openfga:8080, mark8ly-marketplace-api-admin:8080.
crossProductNamespaceAccess:
  # Agentic Registry delegates tenant and machine-credential lifecycle to the
  # onboarding identity control plane. Its bearer token remains the application
  # authorization boundary; this entry only admits the ambient-mesh network hop.
  agentregistry:
    - onboarding
  tesserix:
    - mark8ly
    # tesserix-home (company chart) reaches homechef-postgres:5432 as the
    # homechef_platform_admin role for super-admin CRUD (Home Chef 5B). The
    # role + ExternalSecret + company HOMECHEF_DB_* env land WITH the GCP/DB
    # provisioning — see Home-Chef-App/docs/ops/CUTOVER-RUNBOOK.md.
    - homechef
    # The admin console proxies /api/otto and /api/admin/otto (staff
    # live-chat inbox + queue WebSocket) to the shared Otto.
    - support-platform
    # tesserix-home (company chart) signs requests to kora-api's
    # /v1/admin/* as a trusted BFF (KORA_BFF_HMAC_KEY). kora-api's pod IP
    # is in-cluster (10.0.0.0/8, which the catch-all 0.0.0.0/0 egress rule
    # excepts) and it listens on 8080, not the catch-all's 443, so without
    # this entry the per-product allow-tesserix-egress NetworkPolicy drops
    # the outbound dial and the portal request times out.
    - kora
  # Every product storefront proxies /api/otto/* to the shared Otto chat in
  # support-platform. Without these entries, the per-product
  # allow-<ns>-egress NetworkPolicy blocks the outbound dial.
  mark8ly:
    - support-platform
  # fanzone decommissioned 2026-07-23
  marketplace:
    - support-platform
  gameverse:
    - support-platform
  stockpilot:
    - support-platform
  kora:
    - support-platform
    - temporal-system
  scrapper:
    - support-platform
  homechef:
    - support-platform
    # Temporal worker + namespace-register Job dial the shared Temporal frontend
    # (temporal.scrapper.svc:7233) for durable execution (#116). Ambient mesh
    # tunnels this over HBONE (15008); full-namespace egress covers both. The
    # scrapper-side ingress allowance already exists in allow-scrapper-ingress.
    - scrapper
    - temporal-system
  # devai-auth-bff reverse-proxies kagent.tesserix.app and
  # aregistry.tesserix.app from the devai namespace to the upstream UI
  # services in kagent-system and agentregistry-system.
  # devai-api also dials ai-gateway in agentgateway-system for LLM calls.
  devai:
    - kagent-system
    - agentregistry-system
    - agentgateway-system
    # devai-api-worker dials temporal-frontend:7233 in temporal-system. The
    # frontend's own ingress policy already names devai; without the matching
    # egress the gRPC dial fails as an opaque transport error.
    - temporal-system

# Backup namespace configuration
# Backup namespaces need access to ALL database namespaces for backup/restore operations
backupNamespaces:
  - db-backup-and-restore            # Automated database backup/restore jobs

# Database namespaces — CNPG clusters run in the app namespace itself,
# so dedicated postgresql-* namespaces are no longer needed.
# This map is kept empty; egress to own namespace is already allowed.
databaseNamespaces: {}

# MongoDB namespaces - product-specific document stores
mongoNamespaces: {}   # fanzone (mongodb-fanzone) — DECOMMISSIONED 2026-07-23

# External CIDR blocks allowed to access databases via ILB (e.g., Cloud Run VPC connector)
# Key must match the corresponding namespace key; value is a list of CIDRs
databaseExternalAccess:
  # fanzone — DECOMMISSIONED 2026-07-23
  marketplace:
    - 10.10.16.16/28  # Cloud Run VPC connector (mp-prod-vpc-connector)
    - 10.10.0.0/20    # GKE node subnet (SNAT source from ILB)
  global:
    - 10.10.16.32/28  # Cloud Run VPC connector (gl-prod-vpc-connector)
    - 10.10.16.16/28  # Cloud Run VPC connector (mp-prod-vpc-connector) — marketplace services access global DB
    - 10.10.0.0/20    # GKE node subnet (SNAT source from ILB)

mongoExternalAccess: {}   # fanzone — DECOMMISSIONED 2026-07-23

# Ambient mesh — waypoint proxies for namespaces needing L7 features
# (AuthorizationPolicies, DestinationRules, EnvoyFilters)
#
# mark8ly is intentionally absent — the namespace runs with
# `istio-injection: disabled` and no ambient enrollment (managed by the
# mark8ly-namespace chart). The ambient bootstrap blocked the waypoint
# from getting a workload cert (chicken-and-egg: waypoint → istiod call
# rejected for having no SPIFFE identity), which took the entire public
# ingress offline on 2026-04-11 while the v0.1 prod deploy was landing.
# Re-enroll when the cluster-wide strict-mTLS bootstrap story is fixed.
ambient:
  waypointNamespaces:
    - global
    - marketplace
    # - fanzone   # DECOMMISSIONED 2026-07-23
    - homechef
    # kora (Nutrition API) had the same gap as agentregistry/kagent:
    # no waypoint → public-endpoints-kora L7-stripped in ztunnel + EDS 404 at
    # the gateway. Onboarded 2026-07-29. APPLY IN A WATCHED WINDOW — ambient
    # enrollment has taken the shared ingress offline before (mark8ly 04-11,
    # gameverse 05-03); roll back via `ambientExcluded` if the chain wobbles.
    - kora
    - devai
    - ai-agents
    - stockpilot
    - scrapper
    # support-platform hosts Otto + slm-router + mcp-gateway. The
    # istio-ingressgateway (sidecar-mode) needs the waypoint to land
    # WebSocket / REST traffic on the ambient Otto pod, otherwise the
    # EDS endpoint for support-platform-otto resolves to None:None at
    # the gateway and every request 404s. The fanzone storefront's
    # /api/v1/storefront/otto/* route depends on this.
    - support-platform
    # Agentic control plane — these three are ambient-enrolled but had
    # no waypoint, so the AuthorizationPolicies that gate /v0/* paths
    # (agentregistry-authz, kagent-ui-authz) were silently L7-stripped
    # in ztunnel and degraded to L4-only. Adding waypoints here gives
    # the policies real teeth: path/method rules now enforce.
    - agentregistry-system
    - agentgateway-system
    - kagent-system
    # gameverse intentionally absent — see the mark8ly note above.
    # The ambient enrollment took stayandplays.com offline (504s via
    # cloudflared tunnel → istio-ingressgateway) on 2026-05-03.
    # Re-enroll when the cluster-wide strict-mTLS bootstrap story is fixed.

# Namespaces to enroll in Ambient mesh (replaces sidecar injection)
#
# mark8ly is intentionally absent — see the note on `ambient.waypointNamespaces`
# above. The mark8ly-namespace chart declares the namespace with only
# `istio-injection: disabled` and no ambient label, which is the mode the
# service topology was originally deployed with.
#
# `ambientExcluded` keeps a namespace declared here (so it still gets the
# istio-injection=disabled, name, and database-access labels) but skips the
# ambient dataplane-mode label. Use this when ambient enrollment breaks the
# ingress chain — same failure mode mark8ly hit on 2026-04-11.
sidecarInjection:
  namespaces:
    # Application namespaces
    - global
    - marketplace
    - tesserix
    # - fanzone   # DECOMMISSIONED 2026-07-23
    - homechef
    - kora
    - stockpilot
    - scrapper
    - devai
    - ai-agents
    - gameverse
    # Agentic control plane — added so the sidecar-injection.yaml
    # template stamps the istio.io/use-waypoint label on these
    # namespaces (their waypoint Gateways are created by
    # ambient.waypointNamespaces). Without the label, ambient ztunnel
    # routes around the waypoint and L7 AuthorizationPolicies (path /
    # method rules) are silently degraded to L4-only.
    - agentregistry-system
    - agentgateway-system
    - kagent-system
    # Infrastructure namespaces
    - translation
    - growthbook
    - openpanel
    # - photon  # DISABLED: High network cost for planet data download
    # - nats           # DISABLED: NATS handles its own TLS and doesn't need Istio sidecar
    - typesense
    # Database namespaces removed — CNPG runs in app namespaces (already listed above)
  # Namespaces that need database access (adds database-access=allowed label for NetworkPolicy)
  databaseAccessNamespaces:
    - marketplace
    - global
    # - fanzone   # DECOMMISSIONED 2026-07-23
    - homechef
    - growthbook
    - openpanel
    - db-backup-and-restore
    - monitoring
    - devai
    - stockpilot
    - scrapper
  # TIG protection labels for namespaces this chart owns. Single source of
  # truth: a namespace listed here must NOT also appear as a Namespace object
  # in k8s/cluster/namespace-protection.yaml, or the two apps SSA-stomp each
  # other's labels and flap ambient enrollment (prod outage 2026-08-02).
  protectedTiers:
    global: application
    marketplace: application
    tesserix: application
    homechef: application
    growthbook: infrastructure
    openpanel: infrastructure
    translation: infrastructure
    typesense: infrastructure
    nats: messaging
    db-backup-and-restore: backup
    # CNPG clusters live in the app namespace, so deleting it takes the database
    devai: application
    ai-agents: application
    stockpilot: application
    kora: application
    scrapper: application
    agentregistry-system: infrastructure
  # Namespaces where sidecar injection should be explicitly disabled
  disabledNamespaces:
    - nats
    # - mongodb-fanzone   # DECOMMISSIONED 2026-07-23
    - db-backup-and-restore        # Backup jobs don't need sidecar
  # Namespaces in `namespaces` but NOT enrolled in Ambient mesh.
  # Keeps istio-injection=disabled + name labels but skips dataplane-mode=ambient.
  # Use when ambient enrollment breaks ingress (504s through cloudflared).
  ambientExcluded:
    - gameverse
    # tesserix added: ztunnel was draining the per-pod proxy on EVERY ArgoCD
    # reconcile of the namespace-wide AuthorizationPolicies
    # (allow-ingress-to-tesserix, public-endpoints-tesserix). Drain windows
    # hit all three blog pods simultaneously, leaving the gateway with no
    # healthy retry target and producing 15-30s "connection termination" 503
    # bursts at the edge every couple of minutes. The blog has no
    # mesh-internal authZ requirement (auth and author whitelist are
    # enforced in-app) so opting the namespace out of ambient is a clean fix.
    - tesserix

# Rate limiting configuration
rateLimiting:
  enabled: true
  requestsPerSecond: 100
  burstSize: 200

# Circuit breaker configuration
circuitBreaker:
  enabled: true
  consecutive5xxErrors: 5
  interval: 30s
  baseEjectionTime: 30s
  maxEjectionPercent: 50

# Retry policy
retryPolicy:
  enabled: true
  attempts: 3
  perTryTimeout: 2s
  retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-4xx,reset"

# Timeout configuration
timeout:
  default: 30s
  api: 60s

# CORS configuration
cors:
  enabled: true
  allowOrigins:
    - "https://kibana-dev.tesserix.app"
    - "https://dev-admin.tesserix.app"
    - "https://dev-store.tesserix.app"
    - "https://dev-onboarding.tesserix.app"
    - "https://company.tesserix.app"
    - "https://dev-growthbook.tesserix.app"
    - "https://dev-api-docs.tesserix.app"
    - "https://dev-search.tesserix.app"
    - "https://dev-analytics.tesserix.app"
  allowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowHeaders:
    - authorization
    - content-type
    - x-request-id
    - x-tenant-id
    - x-tenant-slug
    - x-user-id
    - x-vendor-id
    - x-storefront-id
    - x-guest-session-id
  exposeHeaders:
    - x-request-id
    - x-tenant-id
    - x-tenant-slug
    - x-vendor-id
    - x-storefront-id
  maxAge: 86400s
  allowCredentials: true

# TLS configuration
tls:
  # Cert-manager cluster issuer
  clusterIssuer: letsencrypt-prod
  # Minimum TLS version
  minProtocolVersion: TLSV1_2
  # Cipher suites
  cipherSuites:
    - ECDHE-RSA-AES256-GCM-SHA384
    - ECDHE-RSA-AES128-GCM-SHA256

# Observability
observability:
  # Access logging
  accessLogging:
    enabled: true
  # Metrics
  metrics:
    enabled: true
  # Tracing
  tracing:
    enabled: true
    samplingRate: 100

# =============================================================================
# JWT Authentication
# =============================================================================
# NOTE: JWT authentication is now handled by the istio-auth-policies chart
# which configures the GIP RequestAuthentication policies.
# See: charts/infrastructure/istio-auth-policies/
# =============================================================================
