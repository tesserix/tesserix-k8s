# Default values for Postal SMTP
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/postalserver/postal
  tag: "latest"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

# Postal configuration
postal:
  # Main domain for Postal (must match the Virtual Service hostname)
  webHostname: "dev-postal.tesserix.app"
  # SMTP hostname
  smtpHostname: "smtp.tesserix.app"
  # Additional hosts allowed for API access (cluster-internal hostnames)
  # These are automatically added: postal-web.email.svc.cluster.local, 127.0.0.1, localhost
  additionalHosts: []
  # Secret key for encryption
  secretKey: ""
  # Signing key path
  signingKeyPath: "/opt/postal/config/signing.key"
  # Default DKIM selector
  dkimSelector: "postal"

# Database configuration (MySQL required)
database:
  host: "mysql.email.svc.cluster.local"
  port: "3306"
  database: "postal"
  username: "postal"
  existingSecret: "mysql-credentials"
  existingSecretPasswordKey: "postal-password"
  poolSize: 5

# Message database (separate from main DB)
messageDatabase:
  host: "mysql.email.svc.cluster.local"
  port: "3306"
  # Postal automatically appends -server-{id} to create database name: postal-server-1
  prefix: "postal"
  username: "postal"
  existingSecret: "mysql-credentials"
  existingSecretPasswordKey: "postal-password"

# RabbitMQ configuration
rabbitmq:
  host: "rabbitmq.email.svc.cluster.local"
  port: "5672"
  vhost: "postal"
  username: "postal"
  existingSecret: "rabbitmq-credentials"
  existingSecretPasswordKey: "password"

# SMTP server configuration
smtp:
  enabled: true
  port: 25
  tlsPort: 465
  submissionPort: 587
  # TLS certificate
  tlsEnabled: false
  existingTlsSecret: ""

# DNS configuration
dns:
  # MX record hostname
  mxRecords:
    - "smtp.tesserix.app"
  # SPF record
  spfInclude: "spf.postal.tesserix.app"
  # Return path domain
  returnPathDomain: "rp.postal.tesserix.app"
  # Route domain
  routeDomain: "routes.postal.tesserix.app"
  # Tracking domain
  trackDomain: "track.postal.tesserix.app"

# SMTP relay settings (for outbound email delivery)
# GCP blocks outbound port 25, so we relay through AWS SES SMTP or SendGrid
# Provider options: "ses" (AWS SES) or "sendgrid"
relay:
  enabled: true
  # Default provider - can be overridden in environment-specific config
  provider: "sendgrid"  # "ses" or "sendgrid"

  # AWS SES SMTP Configuration (Mumbai region - ap-south-1)
  ses:
    host: "email-smtp.ap-south-1.amazonaws.com"
    port: 587
    # SMTP credentials are different from IAM credentials
    # Generated in AWS SES Console > SMTP Settings > Create SMTP credentials
    username: "AKIAQ4IPRTELV4NVSHVT"
    existingSecret: "ses-smtp-credentials"
    existingSecretPasswordKey: "SES_SMTP_PASSWORD"
    sealedSecret:
      enabled: true
      # kubeseal encrypted SES SMTP password for email namespace
      # Generate with: echo -n "PASSWORD" | kubeseal --raw --namespace email --name ses-smtp-credentials --controller-name sealed-secrets-controller --controller-namespace sealed-secrets --from-file=/dev/stdin
      encryptedData:
        SES_SMTP_PASSWORD: ""

  # SendGrid SMTP Configuration (fallback)
  sendgrid:
    host: "smtp.sendgrid.net"
    port: 587
    username: "apikey"
    existingSecret: "sendgrid-credentials"
    existingSecretPasswordKey: "SENDGRID_API_KEY"
    sealedSecret:
      enabled: true
      encryptedData:
        SENDGRID_API_KEY: 

# Web interface service
web:
  service:
    type: ClusterIP
    port: 5000

# SMTP service
smtpService:
  type: ClusterIP
  port: 25

# Credentials sealed secret
credentials:
  existingSecret: "postal-credentials"
  # Keys in the secret
  secretKeySecretKey: "secret-key"
  signingKeySecretKey: "signing-key"

# Sealed secret configuration
sealedSecret:
  enabled: false
  secretKey: ""
  signingKey: ""

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

persistence:
  enabled: true
  storageClass: "standard-rwo"
  size: 5Gi
  accessModes:
    - ReadWriteOnce

livenessProbe:
  enabled: true
  # Use TCP probe since Postal returns 403 until initialized
  tcpSocket:
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  # Use TCP probe since Postal returns 403 until initialized
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

podAnnotations:
  # Istio sidecar configuration
  sidecar.istio.io/inject: "true"
  # Exclude MySQL and RabbitMQ ports from Istio sidecar
  traffic.sidecar.istio.io/excludeOutboundPorts: "3306,5672"
  # Exclude GCP metadata server for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}

# Init container for database setup
initContainers:
  enabled: true

# Worker configuration
worker:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi

# Cron job configuration
cron:
  enabled: true

# Init setup job configuration
# Automatically creates admin user, organization, server, and API credential
initSetup:
  enabled: true
  admin:
    email: "admin@tesserix.app"
    firstName: "Admin"
    lastName: "User"
    # Password is loaded from existing secret
    existingSecret: "postal-admin-credentials"
    existingSecretPasswordKey: "password"
    # Sealed secret configuration (generate with kubeseal)
    sealedSecret:
      enabled: true
      # Generate with: echo -n "YourPassword" | kubeseal --raw --namespace email --name postal-admin-credentials
      encryptedPassword: ""
  organization:
    name: "Tesserix"
    permalink: "tesserix"
  server:
    name: "Notifications"
    permalink: "notifications"
  credential:
    name: "notification-service"
    secretName: "postal-api-credential"
  # Sender domains to configure automatically
  # These domains will be added to the mail server and can be used as FROM addresses
  domains:
    - name: "tesserix.app"
      # Auto-verify the domain (skip DNS verification)
      # In production, you should set up proper DNS records
      autoVerify: true
