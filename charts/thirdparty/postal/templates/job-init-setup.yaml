{{- if .Values.initSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postal.fullname" . }}-init-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "postal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init-setup
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "postal.fullname" . }}-init
      containers:
        - name: init-setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== Postal Init Setup ==="

              # Wait for Postal web to be ready
              echo "Waiting for Postal web to be ready..."
              for i in $(seq 1 60); do
                if curl -s -o /dev/null -w "%{http_code}" http://{{ include "postal.fullname" . }}-web:5000/health 2>/dev/null | grep -q "200\|403"; then
                  echo "Postal web is ready!"
                  break
                fi
                echo "Attempt $i: Postal not ready yet, waiting..."
                sleep 5
              done

              cd /opt/postal/app

              # Create admin user if not exists
              echo "Creating admin user..."
              bundle exec rails runner "
              begin
                user = User.find_by(email_address: '{{ .Values.initSetup.admin.email }}')
                if user.nil?
                  admin_password = ENV['ADMIN_PASSWORD'] || 'changeme'
                  user = User.new(
                    email_address: '{{ .Values.initSetup.admin.email }}',
                    first_name: '{{ .Values.initSetup.admin.firstName }}',
                    last_name: '{{ .Values.initSetup.admin.lastName }}',
                    password: admin_password,
                    admin: true
                  )
                  user.save!
                  puts 'CREATED: Admin user created'
                else
                  puts 'EXISTS: Admin user already exists'
                end
              rescue => e
                puts \"ERROR: #{e.message}\"
                exit 1
              end
              "

              # Create organization, server, and API credential
              echo "Creating organization and API credential..."
              bundle exec rails runner "
              begin
                user = User.find_by(email_address: '{{ .Values.initSetup.admin.email }}')

                # Find or create organization
                org = Organization.find_by(permalink: '{{ .Values.initSetup.organization.permalink }}')
                if org.nil?
                  org = Organization.new(
                    name: '{{ .Values.initSetup.organization.name }}',
                    permalink: '{{ .Values.initSetup.organization.permalink }}',
                    owner: user
                  )
                  org.save!
                  puts 'CREATED: Organization created'
                else
                  puts 'EXISTS: Organization already exists'
                end

                # Find or create server
                server = org.servers.find_by(permalink: '{{ .Values.initSetup.server.permalink }}')
                if server.nil?
                  server = org.servers.new(
                    name: '{{ .Values.initSetup.server.name }}',
                    permalink: '{{ .Values.initSetup.server.permalink }}',
                    mode: 'Live'
                  )
                  server.save!
                  puts 'CREATED: Mail server created'
                else
                  puts 'EXISTS: Mail server already exists'
                end

                # Enable allow_sender to allow sending from configured domains
                unless server.allow_sender
                  server.allow_sender = true
                  server.save!
                  puts 'UPDATED: Enabled allow_sender on server'
                end

                {{- if .Values.initSetup.domains }}
                # Configure sender domains
                {{- range .Values.initSetup.domains }}
                domain = server.domains.find_or_initialize_by(name: '{{ .name }}')
                if domain.new_record?
                  {{- if .autoVerify }}
                  domain.verified_at = Time.now
                  domain.verification_method = 'DNS'
                  domain.dns_checked_at = Time.now
                  {{- end }}
                  domain.save!
                  puts 'CREATED: Domain {{ .name }} added{{ if .autoVerify }} (auto-verified){{ end }}'
                else
                  puts 'EXISTS: Domain {{ .name }} already exists'
                  {{- if .autoVerify }}
                  # Ensure domain is verified if autoVerify is enabled
                  unless domain.verified_at
                    domain.verified_at = Time.now
                    domain.verification_method = 'DNS'
                    domain.dns_checked_at = Time.now
                    domain.save!
                    puts 'UPDATED: Domain {{ .name }} auto-verified'
                  end
                  {{- end }}
                end
                {{- end }}
                {{- end }}

                # Find or create API credential
                cred = server.credentials.find_by(name: '{{ .Values.initSetup.credential.name }}')
                if cred.nil?
                  cred = server.credentials.create!(
                    type: 'API',
                    name: '{{ .Values.initSetup.credential.name }}',
                    key: SecureRandom.alphanumeric(24)
                  )
                  puts 'CREATED: API credential created'
                  puts \"API_KEY=#{cred.key}\"

                  # Write API key to file for external pickup
                  File.write('/tmp/postal-api-key', cred.key)
                else
                  puts 'EXISTS: API credential already exists'
                  puts \"API_KEY=#{cred.key}\"
                  File.write('/tmp/postal-api-key', cred.key)
                end
              rescue => e
                puts \"ERROR: #{e.message}\"
                exit 1
              end
              "

              # Store API key in Kubernetes secret
              API_KEY=$(cat /tmp/postal-api-key)
              echo "Storing API key in Kubernetes secret..."
              cat <<EOFYAML | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ .Values.initSetup.credential.secretName }}
                namespace: {{ .Release.Namespace }}
                labels:
                  app.kubernetes.io/managed-by: postal-init-setup
              type: Opaque
              stringData:
                api-key: "${API_KEY}"
              EOFYAML

              echo "=== Postal Init Setup Complete ==="
              echo "Admin Email: {{ .Values.initSetup.admin.email }}"
              echo "Organization: {{ .Values.initSetup.organization.name }}"
              echo "Server: {{ .Values.initSetup.server.name }}"
              echo "API Key Secret: {{ .Values.initSetup.credential.secretName }}"
              {{- if .Values.initSetup.domains }}
              echo "Configured Domains:"
              {{- range .Values.initSetup.domains }}
              echo "  - {{ .name }}{{ if .autoVerify }} (auto-verified){{ end }}"
              {{- end }}
              {{- end }}
              echo "Allow Sender: enabled"
          envFrom:
            - configMapRef:
                name: {{ include "postal.fullname" . }}-env
          env:
            - name: MAIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            - name: MESSAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.messageDatabase.existingSecret }}
                  key: {{ .Values.messageDatabase.existingSecretPasswordKey }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.existingSecretPasswordKey }}
            - name: POSTAL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.secretKeySecretKey }}
            - name: POSTAL__MAIN_DB__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            - name: POSTAL__MESSAGE_DB__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.messageDatabase.existingSecret }}
                  key: {{ .Values.messageDatabase.existingSecretPasswordKey }}
            - name: POSTAL__RABBITMQ__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.existingSecretPasswordKey }}
            # Admin password from secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.initSetup.admin.existingSecret }}
                  key: {{ .Values.initSetup.admin.existingSecretPasswordKey }}
          volumeMounts:
            - name: config
              mountPath: /config/postal.yml
              subPath: postal.yml
            - name: signing-key
              mountPath: /config/signing.key
              subPath: signing.key
      volumes:
        - name: config
          secret:
            secretName: {{ include "postal.fullname" . }}-config
        - name: signing-key
          secret:
            secretName: {{ .Values.credentials.existingSecret }}
            items:
              - key: {{ .Values.credentials.signingKeySecretKey }}
                path: signing.key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postal.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "postal.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "postal.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "postal.fullname" . }}-init
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "postal.fullname" . }}-init
  apiGroup: rbac.authorization.k8s.io
{{- end }}
