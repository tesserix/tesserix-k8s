apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postal.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
data:
  # Main Database (legacy env vars)
  MAIN_DB_HOST: {{ .Values.database.host | quote }}
  MAIN_DB_PORT: {{ .Values.database.port | quote }}
  MAIN_DB_DATABASE: {{ .Values.database.database | quote }}
  MAIN_DB_USERNAME: {{ .Values.database.username | quote }}
  MAIN_DB_POOL_SIZE: {{ .Values.database.poolSize | quote }}
  # Postal v2 environment variables for main database
  POSTAL__MAIN_DB__HOST: {{ .Values.database.host | quote }}
  POSTAL__MAIN_DB__PORT: {{ .Values.database.port | quote }}
  POSTAL__MAIN_DB__DATABASE: {{ .Values.database.database | quote }}
  POSTAL__MAIN_DB__USERNAME: {{ .Values.database.username | quote }}
  POSTAL__MAIN_DB__POOL_SIZE: {{ .Values.database.poolSize | quote }}
  # Message Database (legacy env vars)
  MESSAGE_DB_HOST: {{ .Values.messageDatabase.host | quote }}
  MESSAGE_DB_PORT: {{ .Values.messageDatabase.port | quote }}
  MESSAGE_DB_PREFIX: {{ .Values.messageDatabase.prefix | quote }}
  MESSAGE_DB_USERNAME: {{ .Values.messageDatabase.username | quote }}
  # Postal v2 environment variables for message database
  POSTAL__MESSAGE_DB__HOST: {{ .Values.messageDatabase.host | quote }}
  POSTAL__MESSAGE_DB__PORT: {{ .Values.messageDatabase.port | quote }}
  POSTAL__MESSAGE_DB__PREFIX: {{ .Values.messageDatabase.prefix | quote }}
  POSTAL__MESSAGE_DB__USERNAME: {{ .Values.messageDatabase.username | quote }}
  # RabbitMQ (legacy env vars)
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | quote }}
  RABBITMQ_USERNAME: {{ .Values.rabbitmq.username | quote }}
  # Postal v2 environment variables for RabbitMQ
  POSTAL__RABBITMQ__HOST: {{ .Values.rabbitmq.host | quote }}
  POSTAL__RABBITMQ__PORT: {{ .Values.rabbitmq.port | quote }}
  POSTAL__RABBITMQ__VHOST: {{ .Values.rabbitmq.vhost | quote }}
  POSTAL__RABBITMQ__USERNAME: {{ .Values.rabbitmq.username | quote }}
  # Postal Settings (legacy)
  POSTAL_WEB_HOSTNAME: {{ .Values.postal.webHostname | quote }}
  POSTAL_SMTP_HOSTNAME: {{ .Values.postal.smtpHostname | quote }}
  # Postal v2 environment variables for postal settings
  POSTAL__POSTAL__WEB_HOSTNAME: {{ .Values.postal.webHostname | quote }}
  POSTAL__POSTAL__SMTP_HOSTNAME: {{ .Values.postal.smtpHostname | quote }}
