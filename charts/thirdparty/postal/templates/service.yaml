# Web service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postal.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "postal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
# SMTP service
{{- if .Values.smtp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postal.fullname" . }}-smtp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
    app.kubernetes.io/component: smtp
spec:
  type: {{ .Values.smtpService.type }}
  ports:
    - port: {{ .Values.smtpService.port }}
      targetPort: smtp
      protocol: TCP
      name: smtp
  selector:
    {{- include "postal.smtpSelectorLabels" . | nindent 4 }}
{{- end }}
