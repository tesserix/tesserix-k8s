apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postal.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Rails initializer to add additional allowed hosts for API access
  # This allows internal cluster services to call the Postal API
  additional_hosts.rb: |
    # frozen_string_literal: true
    # Add internal cluster hostnames to Rails allowed hosts
    # This is needed for the notification-service to call Postal API
    Rails.application.config.hosts << "postal-web.email.svc.cluster.local"
    Rails.application.config.hosts << "postal-web.email.svc.cluster.local:5000"
    Rails.application.config.hosts << "127.0.0.1"
    Rails.application.config.hosts << "127.0.0.1:5000"
    Rails.application.config.hosts << "localhost"
    Rails.application.config.hosts << "localhost:5000"
    {{- range .Values.postal.additionalHosts }}
    Rails.application.config.hosts << {{ . | quote }}
    {{- end }}
  # Rails initializer to patch SMTPClient::Server to use system resolver
  # This allows smtp_relays hostnames to be resolved via /etc/hosts (hostAliases)
  {{- if .Values.relay.enabled }}
  smtp_relay_resolver.rb: |
    # frozen_string_literal: true
    #
    # Patch SMTPClient::Server to use system resolver (Socket.getaddrinfo) instead of
    # DNS-only resolution (Resolv::DNS) for smtp_relays.
    #
    # Why this is needed:
    # - Postal's DNSResolver uses Resolv::DNS which only queries DNS servers
    # - /etc/hosts entries (from Kubernetes hostAliases) are not visible to Resolv::DNS
    # - The smtp-relay hostname is defined via hostAliases to point to 127.0.0.1
    # - Socket.getaddrinfo reads both /etc/hosts and DNS, so it works correctly
    #
    Rails.application.config.after_initialize do
      module SMTPClient
        class Server
          # Override endpoints to use system resolver for hostnames
          def endpoints
            endpoints = []

            # For smtp_relays (local hostnames like smtp-relay), use system resolver
            # which reads /etc/hosts via hostAliases
            begin
              # Try system resolver first (reads /etc/hosts)
              results = Socket.getaddrinfo(hostname, nil)
              results.each do |result|
                family, _, _, ip, _, _, _ = result
                # Add both IPv4 and IPv6 addresses
                endpoints << Endpoint.new(self, ip)
              end
            rescue SocketError => e
              Rails.logger.warn "SMTPClient::Server system resolver failed for #{hostname}: #{e.message}"
              # Fall back to DNS resolver if system resolver fails
              DNSResolver.local.aaaa(hostname).each { |ip| endpoints << Endpoint.new(self, ip) }
              DNSResolver.local.a(hostname).each { |ip| endpoints << Endpoint.new(self, ip) }
            end

            # Deduplicate by IP address
            endpoints.uniq { |ep| ep.ip_address }
          end
        end
      end
      Rails.logger.info "SMTPClient::Server patched to use system resolver for /etc/hosts support"
    end
  {{- end }}
  postal.yml: |
    # Postal v2 configuration file
    # See https://docs.postalserver.io/config-v2
    version: 2

    postal:
      web_hostname: {{ .Values.postal.webHostname | quote }}
      smtp_hostname: {{ .Values.postal.smtpHostname | quote }}
      use_ip_pools: false
      {{- if .Values.relay.enabled }}
      # SMTP relay chain: Postal -> Postfix sidecar -> {{ if eq .Values.relay.provider "ses" }}AWS SES SMTP{{ else }}SendGrid SMTP{{ end }}
      #
      # Why we need a Postfix sidecar:
      # 1. GCP blocks outbound port 25 for direct SMTP delivery
      # 2. Postal's smtp_relays doesn't support authenticated SMTP
      # 3. Postfix handles SMTP authentication to {{ if eq .Values.relay.provider "ses" }}SES ({{ .Values.relay.ses.host }}:{{ .Values.relay.ses.port }}){{ else }}SendGrid{{ end }}
      #
      # Technical note: We use 'smtp-relay' hostname instead of 'localhost' because
      # Postal's DNS resolver uses Resolv::DNS which doesn't read /etc/hosts.
      # The hostname is resolved via Kubernetes hostAliases to 127.0.0.1.
      smtp_relays:
        - "smtp://smtp-relay:25"
      {{- end }}

    web_server:
      bind_address: 0.0.0.0
      port: 5000
      max_threads: 5

    main_db:
      host: {{ .Values.database.host | quote }}
      port: {{ .Values.database.port }}
      database: {{ .Values.database.database | quote }}
      username: {{ .Values.database.username | quote }}
      pool_size: {{ .Values.database.poolSize }}

    message_db:
      host: {{ .Values.messageDatabase.host | quote }}
      port: {{ .Values.messageDatabase.port }}
      prefix: {{ .Values.messageDatabase.prefix | quote }}
      username: {{ .Values.messageDatabase.username | quote }}

    logging:
      rails_log: true

    smtp_server:
      bind_address: 0.0.0.0
      port: {{ .Values.smtp.port }}

    rabbitmq:
      host: {{ .Values.rabbitmq.host | quote }}
      port: {{ .Values.rabbitmq.port }}
      vhost: {{ .Values.rabbitmq.vhost | quote }}
      username: {{ .Values.rabbitmq.username | quote }}

    dns:
      mx_records:
        {{- range .Values.dns.mxRecords }}
        - {{ . | quote }}
        {{- end }}
      spf_include: {{ .Values.dns.spfInclude | quote }}
      return_path_domain: {{ .Values.dns.returnPathDomain | quote }}
      route_domain: {{ .Values.dns.routeDomain | quote }}
      track_domain: {{ .Values.dns.trackDomain | quote }}

