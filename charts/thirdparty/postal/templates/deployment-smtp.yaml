{{- if .Values.smtp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postal.fullname" . }}-smtp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postal.labels" . | nindent 4 }}
    app.kubernetes.io/component: smtp
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "postal.smtpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postal.smtpSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
        # Istio sidecar configuration
        sidecar.istio.io/inject: "true"
        # Exclude MySQL and RabbitMQ ports from Istio sidecar
        traffic.sidecar.istio.io/excludeOutboundPorts: "3306,5672"
        # Exclude GCP metadata server for Workload Identity
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: smtp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["postal", "smtp-server"]
          ports:
            - name: smtp
              containerPort: {{ .Values.smtp.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "postal.fullname" . }}-env
          env:
            # Legacy env vars
            - name: MAIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            - name: MESSAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.messageDatabase.existingSecret }}
                  key: {{ .Values.messageDatabase.existingSecretPasswordKey }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.existingSecretPasswordKey }}
            - name: POSTAL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.secretKeySecretKey }}
            # Postal v3 env vars for passwords
            - name: POSTAL__MAIN_DB__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            - name: POSTAL__MESSAGE_DB__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.messageDatabase.existingSecret }}
                  key: {{ .Values.messageDatabase.existingSecretPasswordKey }}
            - name: POSTAL__RABBITMQ__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.existingSecretPasswordKey }}
            {{- if .Values.relay.enabled }}
            {{- if eq .Values.relay.provider "ses" }}
            # AWS SES SMTP relay credentials
            - name: SMTP_RELAY_HOST
              value: {{ .Values.relay.ses.host | quote }}
            - name: SMTP_RELAY_PORT
              value: {{ .Values.relay.ses.port | quote }}
            - name: SMTP_RELAY_USERNAME
              value: {{ .Values.relay.ses.username | quote }}
            - name: SMTP_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.relay.ses.existingSecret }}
                  key: {{ .Values.relay.ses.existingSecretPasswordKey }}
            {{- else }}
            # SendGrid SMTP relay credentials
            - name: SMTP_RELAY_HOST
              value: {{ .Values.relay.sendgrid.host | quote }}
            - name: SMTP_RELAY_PORT
              value: {{ .Values.relay.sendgrid.port | quote }}
            - name: SMTP_RELAY_USERNAME
              value: {{ .Values.relay.sendgrid.username | quote }}
            - name: SMTP_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.relay.sendgrid.existingSecret }}
                  key: {{ .Values.relay.sendgrid.existingSecretPasswordKey }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config/postal.yml
              subPath: postal.yml
            - name: signing-key
              mountPath: /config/signing.key
              subPath: signing.key
      volumes:
        - name: config
          secret:
            secretName: {{ include "postal.fullname" . }}-config
        - name: signing-key
          secret:
            secretName: {{ .Values.credentials.existingSecret }}
            items:
              - key: {{ .Values.credentials.signingKeySecretKey }}
                path: signing.key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
