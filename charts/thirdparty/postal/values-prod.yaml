# Production overrides for postal
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

# Production ingress
ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: postal.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: postal-tls
      hosts:
        - postal.tesserix.app

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1
