{{- if .Values.kubecost.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-oauth2-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubecost-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecost-oauth2-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: kubecost-oauth2-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          args:
            - --provider={{ .Values.oauth2Proxy.provider }}
            - --http-address=0.0.0.0:4180
            - --upstream=http://kubecost.{{ .Values.namespace }}.svc.cluster.local:9090
            - --redirect-url=https://{{ .Values.kubecost.virtualService.host }}/oauth2/callback
            - --cookie-name=_kubecost_oauth2
            - --cookie-secure={{ .Values.oauth2Proxy.cookie.secure }}
            - --cookie-expire={{ .Values.oauth2Proxy.cookie.expire }}
            - --cookie-refresh={{ .Values.oauth2Proxy.cookie.refresh }}
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            {{- range .Values.oauth2Proxy.emailDomains }}
            - --email-domain={{ . }}
            {{- end }}
            {{- if .Values.oauth2Proxy.allowedEmails }}
            - --authenticated-emails-file=/etc/oauth2-proxy/authenticated-emails.txt
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: opencost-oauth2-secrets
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencost-oauth2-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: opencost-oauth2-secrets
                  key: cookie-secret
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.oauth2Proxy.allowedEmails }}
            - name: authenticated-emails
              mountPath: /etc/oauth2-proxy
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.oauth2Proxy.allowedEmails }}
        - name: authenticated-emails
          configMap:
            name: oauth2-proxy-emails
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-oauth2-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubecost-auth
spec:
  type: ClusterIP
  selector:
    app: kubecost-oauth2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
---
# VirtualService for Kubecost
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kubecost-vs
  namespace: istio-ingress
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubecost
spec:
  hosts:
    - {{ .Values.kubecost.virtualService.host | quote }}
  gateways:
    - {{ .Values.virtualService.gateway }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: kubecost-oauth2-proxy.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: 4180
      timeout: 30s
{{- end }}
