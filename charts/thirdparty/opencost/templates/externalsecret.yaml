{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opencost-oauth2-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: opencost-oauth2-secrets
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ .Values.externalSecret.secrets.googleClientId }}
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.externalSecret.secrets.googleClientSecret }}
    - secretKey: cookie-secret
      remoteRef:
        key: {{ .Values.externalSecret.secrets.cookieSecret }}
    - secretKey: gcp-pricing-api-key
      remoteRef:
        key: {{ .Values.externalSecret.secrets.gcpPricingApiKey }}
{{- end }}
