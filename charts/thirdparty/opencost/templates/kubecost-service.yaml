{{- if .Values.kubecost.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kubecost
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubecost
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app: kubecost
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http-ui
      port: 9090
      targetPort: http
      protocol: TCP
    - name: http-api
      port: 9003
      targetPort: api
      protocol: TCP
{{- end }}
