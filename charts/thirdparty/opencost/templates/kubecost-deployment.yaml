{{- if .Values.kubecost.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubecost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecost
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kubecost
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: 1000
      containers:
        # Kubecost Cost Analyzer — combined frontend + backend
        - name: cost-analyzer
          image: "{{ .Values.kubecost.image.repository }}:{{ .Values.kubecost.image.tag }}"
          imagePullPolicy: {{ .Values.kubecost.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: {{ .Values.opencost.prometheus.serverEndpoint | quote }}
            - name: CLOUD_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencost-oauth2-secrets
                  key: gcp-pricing-api-key
            - name: CLUSTER_ID
              value: "tesseract-prod-in-gke"
            - name: CLOUD_PROVIDER
              value: "GCP"
            - name: KUBECOST_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: RELEASE_NAME
              value: "kubecost"
            - name: KUBECOST_TOKEN
              value: ""
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kubecost.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: configs
              mountPath: /var/configs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: configs
          emptyDir: {}
{{- end }}
