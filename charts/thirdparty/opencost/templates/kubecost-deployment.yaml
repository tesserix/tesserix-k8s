{{- if .Values.kubecost.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecost-nginx-conf
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
data:
  nginx.conf: |
    upstream api {
        server localhost:9003;
    }
    upstream model {
        server localhost:9003;
    }
    server {
        server_name _;
        root /var/www;
        index index.html;
        add_header Cache-Control "max-age=300";
        listen 9090;

        # Stub endpoints for Kubecost frontend license/config checks
        location = /model/getProductKey {
            default_type application/json;
            return 200 '{"success":true,"productKey":{"key":"free-tier","plan":"free"}}';
        }
        # Tell frontend to use relative /model path (not localhost:9090)
        location = /model/config/env {
            default_type application/json;
            return 200 '{"apiUrl":"/model","modelUrl":"/model"}';
        }
        location = /model/getConfigs {
            proxy_pass http://model/getConfigs;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /model/getClusterInfo {
            proxy_pass http://model/clusterInfo;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/ {
            proxy_pass http://api/;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /model/ {
            proxy_pass http://model/;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /allocation {
            proxy_pass http://model/allocation;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /assets {
            proxy_pass http://model/assets;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /savings {
            proxy_pass http://api/savings;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        # Clear stale localStorage on page load and inject correct API URL
        location = /override.js {
            default_type application/javascript;
            return 200 'localStorage.removeItem("container");';
        }
        # Inject override script into index.html
        sub_filter '</head>' '<script src="/override.js"></script></head>';
        sub_filter_once on;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubecost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecost
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kubecost
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: 1000
      containers:
        # Kubecost Cost Model (API backend on port 9003)
        - name: cost-model
          image: "{{ .Values.kubecost.costModel.image.repository }}:{{ .Values.kubecost.costModel.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 9003
              protocol: TCP
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: {{ .Values.opencost.prometheus.serverEndpoint | quote }}
            - name: CLOUD_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencost-oauth2-secrets
                  key: gcp-pricing-api-key
            - name: CLUSTER_ID
              value: "tesseract-prod-in-gke"
            - name: CLOUD_PROVIDER
              value: "GCP"
            - name: KUBECOST_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: CONFIG_PATH
              value: "/var/configs/"
          startupProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          resources:
            {{- toYaml .Values.kubecost.costModel.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: configs
              mountPath: /var/configs

        # Kubecost Frontend (nginx serves UI on port 9090, proxies API to cost-model)
        - name: frontend
          image: "{{ .Values.kubecost.frontend.image.repository }}:{{ .Values.kubecost.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 20
          resources:
            {{- toYaml .Values.kubecost.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir: {}
        - name: configs
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: kubecost-nginx-conf
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
{{- end }}
