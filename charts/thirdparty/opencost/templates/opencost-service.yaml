apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "opencost.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-ui
      port: 9090
      targetPort: ui
      protocol: TCP
    - name: http-api
      port: 9003
      targetPort: api
      protocol: TCP
