apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "opencost.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: ClusterIP
  selector:
    {{- include "oauth2-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
