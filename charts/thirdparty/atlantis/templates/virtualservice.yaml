apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: atlantis
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ .Values.virtualService.host }}
  gateways:
    - {{ .Values.virtualService.gateway }}
  exportTo:
    - "."
    - istio-ingress
  http:
    - name: block-api
      match:
        - uri:
            prefix: /api
        - uri:
            exact: /status
      directResponse:
        status: 404
    # GitHub cannot complete an OIDC flow, so the webhook is routed to Atlantis
    # directly and stays authenticated by its HMAC signature. Keep this above
    # the catch-all: ordering is what keeps the webhook out of the login redirect.
    - name: github-webhook
      match:
        - uri:
            prefix: /events
      route:
        - destination:
            host: atlantis.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
      timeout: 30s
    - name: web-ui
      match:
        - uri:
            prefix: /
      route:
{{- if .Values.oauth2Proxy.enabled }}
        - destination:
            host: {{ .Values.oauth2Proxy.name }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 4180
{{- else }}
        - destination:
            host: atlantis.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
{{- end }}
      timeout: 30s
