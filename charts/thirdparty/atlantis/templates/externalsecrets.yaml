apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-vcs
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: atlantis-vcs
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: {{ .Values.externalSecrets.vcs.githubAppId }}
    - secretKey: github_app_installation_id
      remoteRef:
        key: {{ .Values.externalSecrets.vcs.githubAppInstallationId }}
    - secretKey: key.pem
      remoteRef:
        key: {{ .Values.externalSecrets.vcs.githubAppPrivateKey }}
    - secretKey: github_secret
      remoteRef:
        key: {{ .Values.externalSecrets.vcs.webhookSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-basic-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: atlantis-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.basicAuth.username }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.basicAuth.password }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-terraform-vars
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: atlantis-terraform-vars
    creationPolicy: Owner
  data:
    {{- range $environmentVariable, $remoteSecret := .Values.externalSecrets.terraformVariables }}
    - secretKey: {{ $environmentVariable }}
      remoteRef:
        key: {{ $remoteSecret }}
    {{- end }}
