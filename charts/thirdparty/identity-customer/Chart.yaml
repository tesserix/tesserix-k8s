apiVersion: v2
name: identity-customer
description: Customer Identity Platform - Keycloak with PostgreSQL and Redis
type: application
version: 1.0.0
appVersion: "24.0"

keywords:
  - keycloak
  - identity
  - authentication
  - oauth
  - oidc

maintainers:
  - name: Tesseract Hub
    email: platform@tesserix.app

dependencies:
  # PostgreSQL for Keycloak data storage (latest stable)
  - name: postgresql
    version: "16.5.x"
    repository: "https://charts.bitnami.com/bitnami"
    alias: keycloak-db
    condition: keycloak-db.enabled

  # Redis for session caching (latest stable)
  - name: redis
    version: "20.x"
    repository: "https://charts.bitnami.com/bitnami"
    alias: keycloak-redis
    condition: keycloak-redis.enabled
