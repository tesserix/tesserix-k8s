{{- if .Values.adminSSO.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-admin-sso-setup-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-sso-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-admin-sso-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache curl jq bash
              bash /scripts/setup-admin-sso.sh
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.keycloak.service.port | default 8080 }}"
            - name: KEYCLOAK_MGMT_URL
              value: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:9000"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.googleCredentialsSecret | default "keycloak-google-sso" }}
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.googleCredentialsSecret | default "keycloak-google-sso" }}
                  key: client-secret
            {{- if .Values.adminSSO.appleCredentialsSecret }}
            - name: APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.appleCredentialsSecret }}
                  key: team-id
            - name: APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.appleCredentialsSecret }}
                  key: key-id
            - name: APPLE_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.appleCredentialsSecret }}
                  key: service-id
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.appleCredentialsSecret }}
                  key: private-key
            {{- end }}
            {{- if .Values.adminSSO.facebookCredentialsSecret }}
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.facebookCredentialsSecret }}
                  key: app-id
            - name: FACEBOOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.facebookCredentialsSecret }}
                  key: app-secret
            {{- end }}
            {{- if .Values.adminSSO.twitterCredentialsSecret }}
            - name: TWITTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.twitterCredentialsSecret }}
                  key: api-key
            - name: TWITTER_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.twitterCredentialsSecret }}
                  key: api-secret
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: keycloak-admin-sso-config
            defaultMode: 0755
{{- end }}
