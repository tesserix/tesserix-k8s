{{- if .Values.keycloak.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-import-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: keycloak-realm-import
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-customer
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      containers:
        - name: realm-import
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Keycloak to be ready..."

              KEYCLOAK_URL="http://keycloak:8080"
              MAX_RETRIES=60
              RETRY_COUNT=0

              # Wait for Keycloak to be ready by trying to get admin token
              echo "Waiting for Keycloak to be ready..."
              TOKEN=""
              while [ -z "$TOKEN" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" \
                  -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                if [ -z "$TOKEN" ]; then
                  echo "Waiting for Keycloak... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                fi
              done

              if [ -z "$TOKEN" ]; then
                echo "Failed to get admin token after $MAX_RETRIES attempts"
                exit 1
              fi

              echo "Got admin token, checking if realm exists..."

              # Check if realm exists (don't use -f flag to capture status code)
              REALM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/tesserix-customer")

              if [ "$REALM_STATUS" = "200" ]; then
                echo "Realm tesserix-customer already exists, updating clients..."

                # Extract and update/create clients from realm config using jq-less approach
                # Read the realm config and process clients
                REALM_CONFIG="/realm-config/tesserix-customer-realm.json"

                # Get list of client IDs from the realm config (using grep/sed)
                CLIENT_IDS=$(grep -o '"clientId"[[:space:]]*:[[:space:]]*"[^"]*"' "$REALM_CONFIG" | sed 's/.*"clientId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')

                for CLIENT_ID in $CLIENT_IDS; do
                  echo "Checking client: $CLIENT_ID"

                  # Check if client exists
                  CLIENT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                    -H "Authorization: Bearer $TOKEN" \
                    "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients?clientId=$CLIENT_ID")

                  if [ "$CLIENT_STATUS" = "200" ]; then
                    # Get the internal UUID of the existing client
                    CLIENT_UUID=$(curl -s \
                      -H "Authorization: Bearer $TOKEN" \
                      "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients?clientId=$CLIENT_ID" | \
                      sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                    if [ -n "$CLIENT_UUID" ] && [ "$CLIENT_UUID" != "[]" ]; then
                      echo "Client $CLIENT_ID exists with UUID $CLIENT_UUID, skipping update (use Admin UI for changes)"
                    else
                      echo "Client $CLIENT_ID not found, will be created via partial import"
                    fi
                  fi
                done

                # Use Keycloak's partial import to add missing clients (SKIP existing ones)
                echo "Running partial import to add any missing clients..."
                IMPORT_RESULT=$(curl -s -w "\n%{http_code}" -X POST \
                  "$KEYCLOAK_URL/admin/realms/tesserix-customer/partialImport?ifResourceExists=SKIP" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @"$REALM_CONFIG")

                IMPORT_STATUS=$(echo "$IMPORT_RESULT" | tail -1)
                IMPORT_BODY=$(echo "$IMPORT_RESULT" | head -n -1)

                if [ "$IMPORT_STATUS" = "200" ] || [ "$IMPORT_STATUS" = "204" ]; then
                  echo "Partial import completed successfully!"
                  echo "Result: $IMPORT_BODY"
                else
                  echo "Partial import returned status $IMPORT_STATUS"
                  echo "Response: $IMPORT_BODY"
                  # Don't fail - partial import may skip existing resources
                fi

                # FIX-P0: Ensure protocol mappers for staff_id, tenant_id, vendor_id exist on marketplace-dashboard
                # The partial import with ifResourceExists=SKIP won't add these mappers to existing clients
                echo "Ensuring protocol mappers exist on marketplace-dashboard client..."
                DASHBOARD_CLIENT_UUID=$(curl -s \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients?clientId=marketplace-dashboard" | \
                  sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                if [ -n "$DASHBOARD_CLIENT_UUID" ]; then
                  echo "Found marketplace-dashboard client: $DASHBOARD_CLIENT_UUID"

                  # Get existing mappers
                  EXISTING_MAPPERS=$(curl -s \
                    -H "Authorization: Bearer $TOKEN" \
                    "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients/$DASHBOARD_CLIENT_UUID/protocol-mappers/models")

                  # Function to add mapper if missing
                  add_mapper_if_missing() {
                    local mapper_name=$1
                    local user_attr=$2

                    if ! echo "$EXISTING_MAPPERS" | grep -q "\"name\":\"$mapper_name\""; then
                      echo "Adding $mapper_name protocol mapper..."
                      MAPPER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                        "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients/$DASHBOARD_CLIENT_UUID/protocol-mappers/models" \
                        -H "Authorization: Bearer $TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "{\"name\":\"$mapper_name\",\"protocol\":\"openid-connect\",\"protocolMapper\":\"oidc-usermodel-attribute-mapper\",\"config\":{\"claim.name\":\"$mapper_name\",\"user.attribute\":\"$user_attr\",\"jsonType.label\":\"String\",\"id.token.claim\":\"true\",\"access.token.claim\":\"true\",\"userinfo.token.claim\":\"true\"}}")

                      if [ "$MAPPER_STATUS" = "201" ] || [ "$MAPPER_STATUS" = "204" ]; then
                        echo " - $mapper_name mapper added successfully (HTTP $MAPPER_STATUS)"
                      else
                        echo " - WARNING: Failed to add $mapper_name mapper (HTTP $MAPPER_STATUS)"
                      fi
                    else
                      echo "$mapper_name mapper already exists"
                    fi
                  }

                  # Add required protocol mappers
                  add_mapper_if_missing "staff_id" "staff_id"
                  add_mapper_if_missing "tenant_id" "tenant_id"
                  add_mapper_if_missing "vendor_id" "vendor_id"
                  add_mapper_if_missing "tenant_slug" "tenant_slug"

                  # Verify mappers were added by re-fetching
                  echo "Verifying protocol mappers..."
                  FINAL_MAPPERS=$(curl -s \
                    -H "Authorization: Bearer $TOKEN" \
                    "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients/$DASHBOARD_CLIENT_UUID/protocol-mappers/models")

                  for mapper in staff_id tenant_id vendor_id tenant_slug; do
                    if echo "$FINAL_MAPPERS" | grep -q "\"name\":\"$mapper\""; then
                      echo " ✓ $mapper mapper verified"
                    else
                      echo " ✗ WARNING: $mapper mapper NOT found after creation attempt"
                    fi
                  done

                  echo "Protocol mapper check completed for marketplace-dashboard"
                else
                  echo "Warning: marketplace-dashboard client not found"
                fi

                # Ensure store_owner realm role exists
                echo "Ensuring store_owner realm role exists..."
                STORE_OWNER_CHECK=$(curl -s -o /dev/null -w "%{http_code}" \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/tesserix-customer/roles/store_owner")

                if [ "$STORE_OWNER_CHECK" = "404" ]; then
                  echo "Creating store_owner role..."
                  CREATE_ROLE_RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                    "$KEYCLOAK_URL/admin/realms/tesserix-customer/roles" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{"name":"store_owner","description":"Store owner role for marketplace tenant administrators"}')

                  if [ "$CREATE_ROLE_RESULT" = "201" ] || [ "$CREATE_ROLE_RESULT" = "204" ]; then
                    echo "store_owner role created successfully!"
                  else
                    echo "Failed to create store_owner role (status: $CREATE_ROLE_RESULT)"
                  fi
                else
                  echo "store_owner role already exists"
                fi

                # Ensure service account roles are assigned for marketplace-onboarding-admin
                echo "Ensuring service account roles for marketplace-onboarding-admin..."

                # Get realm-management client UUID
                REALM_MGMT_UUID=$(curl -s \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients?clientId=realm-management" | \
                  sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                if [ -n "$REALM_MGMT_UUID" ]; then
                  echo "Found realm-management client: $REALM_MGMT_UUID"

                  # Get the marketplace-onboarding-admin client UUID
                  ONBOARDING_CLIENT_UUID=$(curl -s \
                    -H "Authorization: Bearer $TOKEN" \
                    "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients?clientId=marketplace-onboarding-admin" | \
                    sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                  if [ -n "$ONBOARDING_CLIENT_UUID" ]; then
                    echo "Found marketplace-onboarding-admin client: $ONBOARDING_CLIENT_UUID"

                    # Get service account user ID
                    SERVICE_ACCOUNT_ID=$(curl -s \
                      -H "Authorization: Bearer $TOKEN" \
                      "$KEYCLOAK_URL/admin/realms/tesserix-customer/clients/$ONBOARDING_CLIENT_UUID/service-account-user" | \
                      sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                    if [ -n "$SERVICE_ACCOUNT_ID" ]; then
                      echo "Found service account user: $SERVICE_ACCOUNT_ID"

                      # Get available roles from realm-management
                      AVAILABLE_ROLES=$(curl -s \
                        -H "Authorization: Bearer $TOKEN" \
                        "$KEYCLOAK_URL/admin/realms/tesserix-customer/users/$SERVICE_ACCOUNT_ID/role-mappings/clients/$REALM_MGMT_UUID/available")

                      # Build roles JSON for manage-users, query-users, view-users, view-realm
                      ROLES_TO_ADD="["
                      FIRST=true
                      for ROLE_NAME in manage-users query-users view-users view-realm; do
                        ROLE_ID=$(echo "$AVAILABLE_ROLES" | grep -o "{[^}]*\"name\":\"$ROLE_NAME\"[^}]*}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
                        if [ -n "$ROLE_ID" ]; then
                          if [ "$FIRST" = true ]; then
                            FIRST=false
                          else
                            ROLES_TO_ADD="$ROLES_TO_ADD,"
                          fi
                          ROLES_TO_ADD="$ROLES_TO_ADD{\"id\":\"$ROLE_ID\",\"name\":\"$ROLE_NAME\"}"
                          echo "Will assign role: $ROLE_NAME ($ROLE_ID)"
                        fi
                      done
                      ROLES_TO_ADD="$ROLES_TO_ADD]"

                      if [ "$ROLES_TO_ADD" != "[]" ]; then
                        # Assign roles to service account
                        ASSIGN_RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                          "$KEYCLOAK_URL/admin/realms/tesserix-customer/users/$SERVICE_ACCOUNT_ID/role-mappings/clients/$REALM_MGMT_UUID" \
                          -H "Authorization: Bearer $TOKEN" \
                          -H "Content-Type: application/json" \
                          -d "$ROLES_TO_ADD")

                        if [ "$ASSIGN_RESULT" = "204" ] || [ "$ASSIGN_RESULT" = "200" ]; then
                          echo "Service account roles assigned successfully!"
                        else
                          echo "Role assignment returned status $ASSIGN_RESULT (may already be assigned)"
                        fi
                      else
                        echo "No roles to assign (may already be assigned)"
                      fi
                    else
                      echo "Warning: Could not find service account user"
                    fi
                  else
                    echo "Warning: marketplace-onboarding-admin client not found"
                  fi
                else
                  echo "Warning: realm-management client not found"
                fi

                # Configure user profile to allow custom attributes (staff_id, tenant_id, etc.)
                echo "Configuring user profile for custom attributes..."
                USER_PROFILE_CONFIG='{
                  "attributes": [
                    {"name": "username", "displayName": "${username}", "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {}, "up-username-not-idn-homograph": {}}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                    {"name": "email", "displayName": "${email}", "validations": {"email": {}, "length": {"max": 255}}, "required": {"roles": ["user"]}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                    {"name": "firstName", "displayName": "${firstName}", "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}}, "required": {"roles": ["user"]}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                    {"name": "lastName", "displayName": "${lastName}", "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}}, "required": {"roles": ["user"]}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false},
                    {"name": "staff_id", "displayName": "Staff ID", "permissions": {"view": ["admin"], "edit": ["admin"]}, "multivalued": false},
                    {"name": "tenant_id", "displayName": "Tenant ID", "permissions": {"view": ["admin"], "edit": ["admin"]}, "multivalued": true},
                    {"name": "vendor_id", "displayName": "Vendor ID", "permissions": {"view": ["admin"], "edit": ["admin"]}, "multivalued": false},
                    {"name": "tenant_slug", "displayName": "Tenant Slug", "permissions": {"view": ["admin"], "edit": ["admin"]}, "multivalued": true},
                    {"name": "tenants", "displayName": "Tenants", "permissions": {"view": ["admin"], "edit": ["admin"]}, "multivalued": true},
                    {"name": "customer_id", "displayName": "Customer ID", "permissions": {"view": ["admin"], "edit": ["admin"]}, "multivalued": false}
                  ],
                  "groups": [{"name": "user-metadata", "displayHeader": "User metadata", "displayDescription": "Attributes, which refer to user metadata"}],
                  "unmanagedAttributePolicy": "ENABLED"
                }'

                PROFILE_RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                  "$KEYCLOAK_URL/admin/realms/tesserix-customer/users/profile" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$USER_PROFILE_CONFIG")

                if [ "$PROFILE_RESULT" = "200" ] || [ "$PROFILE_RESULT" = "204" ]; then
                  echo "User profile configured successfully!"
                else
                  echo "User profile configuration returned status $PROFILE_RESULT"
                fi

                exit 0
              fi

              echo "Importing realm configuration..."

              # Import realm (new realm)
              curl -sf -X POST "$KEYCLOAK_URL/admin/realms" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d @/realm-config/tesserix-customer-realm.json

              if [ $? -eq 0 ]; then
                echo "Realm tesserix-customer imported successfully!"
              else
                echo "Failed to import tesserix-customer realm"
                exit 1
              fi

              {{- if .Values.fanzoneRealm.enabled }}
              # =========================================================================
              # Import FanZone realm
              # =========================================================================
              echo "Checking FanZone realm..."
              FANZONE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/fanzone")

              if [ "$FANZONE_STATUS" = "200" ]; then
                echo "FanZone realm already exists, running partial import..."
                FANZONE_IMPORT=$(curl -s -w "\n%{http_code}" -X POST \
                  "$KEYCLOAK_URL/admin/realms/fanzone/partialImport?ifResourceExists=SKIP" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/realm-config/fanzone-realm.json)
                echo "FanZone partial import result: $(echo "$FANZONE_IMPORT" | tail -1)"

                # Ensure fanzone-bff client has correct post_logout_redirect_uris
                # (partial import with SKIP won't update existing clients)
                echo "Ensuring fanzone-bff post_logout_redirect_uris..."
                BFF_UUID=$(curl -s \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/fanzone/clients?clientId=fanzone-bff" | \
                  sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                if [ -n "$BFF_UUID" ]; then
                  EXPECTED_URIS="https://{{ .Values.fanzoneRealm.domain }}/*##{{ .Values.fanzoneRealm.mobileScheme }}://auth/logout##http://localhost:3000/*"
                  CURRENT_URIS=$(curl -s \
                    -H "Authorization: Bearer $TOKEN" \
                    "$KEYCLOAK_URL/admin/realms/fanzone/clients/$BFF_UUID" | \
                    sed -n 's/.*"post.logout.redirect.uris":"\([^"]*\)".*/\1/p')

                  if [ "$CURRENT_URIS" != "$EXPECTED_URIS" ]; then
                    echo "Updating fanzone-bff post_logout_redirect_uris..."
                    UPDATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                      "$KEYCLOAK_URL/admin/realms/fanzone/clients/$BFF_UUID" \
                      -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"id\":\"$BFF_UUID\",\"clientId\":\"fanzone-bff\",\"attributes\":{\"post.logout.redirect.uris\":\"$EXPECTED_URIS\",\"pkce.code.challenge.method\":\"S256\",\"backchannel.logout.session.required\":\"true\",\"backchannel.logout.revoke.offline.tokens\":\"false\"}}")
                    echo "fanzone-bff update result: HTTP $UPDATE_STATUS"
                  else
                    echo "fanzone-bff post_logout_redirect_uris already correct"
                  fi
                else
                  echo "Warning: fanzone-bff client not found in fanzone realm"
                fi
              else
                echo "Creating FanZone realm..."
                curl -sf -X POST "$KEYCLOAK_URL/admin/realms" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/realm-config/fanzone-realm.json
                if [ $? -eq 0 ]; then
                  echo "FanZone realm imported successfully!"
                else
                  echo "Failed to import FanZone realm"
                fi
              fi
              {{- end }}

              {{- if .Values.homechefRealm.enabled }}
              # =========================================================================
              # Import HomeChef realm
              # =========================================================================
              echo "Checking HomeChef realm..."
              HOMECHEF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/homechef")

              if [ "$HOMECHEF_STATUS" = "200" ]; then
                echo "HomeChef realm already exists, running partial import..."
                HOMECHEF_IMPORT=$(curl -s -w "\n%{http_code}" -X POST \
                  "$KEYCLOAK_URL/admin/realms/homechef/partialImport?ifResourceExists=SKIP" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/realm-config/homechef-realm.json)
                echo "HomeChef partial import result: $(echo "$HOMECHEF_IMPORT" | tail -1)"

                # Ensure homechef-bff client has correct post_logout_redirect_uris
                echo "Ensuring homechef-bff post_logout_redirect_uris..."
                HC_BFF_UUID=$(curl -s \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/homechef/clients?clientId=homechef-bff" | \
                  sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                if [ -n "$HC_BFF_UUID" ]; then
                  HC_EXPECTED_URIS="https://{{ .Values.homechefRealm.domain }}/*##{{ .Values.homechefRealm.mobileScheme }}://auth/logout##http://localhost:5173/*"
                  HC_CURRENT_URIS=$(curl -s \
                    -H "Authorization: Bearer $TOKEN" \
                    "$KEYCLOAK_URL/admin/realms/homechef/clients/$HC_BFF_UUID" | \
                    sed -n 's/.*"post.logout.redirect.uris":"\([^"]*\)".*/\1/p')

                  if [ "$HC_CURRENT_URIS" != "$HC_EXPECTED_URIS" ]; then
                    echo "Updating homechef-bff post_logout_redirect_uris..."
                    HC_UPDATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                      "$KEYCLOAK_URL/admin/realms/homechef/clients/$HC_BFF_UUID" \
                      -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"id\":\"$HC_BFF_UUID\",\"clientId\":\"homechef-bff\",\"attributes\":{\"post.logout.redirect.uris\":\"$HC_EXPECTED_URIS\",\"pkce.code.challenge.method\":\"S256\",\"backchannel.logout.session.required\":\"true\",\"backchannel.logout.revoke.offline.tokens\":\"false\"}}")
                    echo "homechef-bff update result: HTTP $HC_UPDATE_STATUS"
                  else
                    echo "homechef-bff post_logout_redirect_uris already correct"
                  fi
                else
                  echo "Warning: homechef-bff client not found in homechef realm"
                fi
              else
                echo "Creating HomeChef realm..."
                curl -sf -X POST "$KEYCLOAK_URL/admin/realms" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/realm-config/homechef-realm.json
                if [ $? -eq 0 ]; then
                  echo "HomeChef realm imported successfully!"
                else
                  echo "Failed to import HomeChef realm"
                fi
              fi
              {{- end }}
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
          volumeMounts:
            - name: realm-config
              mountPath: /realm-config
              readOnly: true
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
{{- end }}
