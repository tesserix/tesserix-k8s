{{- if and .Values.keycloak.enabled .Values.keycloak.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-customer
    app.kubernetes.io/component: keycloak
spec:
  {{- if .Values.keycloak.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.keycloak.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.keycloak.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
