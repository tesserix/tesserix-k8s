{{- if .Values.keycloak.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-customer
    app.kubernetes.io/component: keycloak
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: identity-customer
        app.kubernetes.io/component: keycloak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        # Istio sidecar configuration - wait for proxy before starting app
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        # Exclude PostgreSQL port from Istio (use native TCP connection)
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        # Exclude GCP metadata server for Workload Identity
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
    spec:
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      securityContext:
        {{- toYaml .Values.keycloak.podSecurityContext | nindent 8 }}
      # Init container to wait for database to be ready
      initContainers:
        - name: wait-for-db
          image: docker.io/bitnami/postgresql:latest
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h {{ .Values.keycloak.database.host }} -p {{ .Values.keycloak.database.port }} -U {{ .Values.keycloak.database.username }}; do
                echo "PostgreSQL at {{ .Values.keycloak.database.host }}:{{ .Values.keycloak.database.port }} is unavailable - sleeping 5s"
                sleep 5
              done
              echo "PostgreSQL is ready!"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          {{- if .Values.keycloak.command }}
          command:
            {{- toYaml .Values.keycloak.command | nindent 12 }}
          {{- end }}
          {{- if .Values.keycloak.args }}
          args:
            {{- toYaml .Values.keycloak.args | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.keycloak.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
            - name: jgroups
              containerPort: 7600
              protocol: TCP
          env:
            # ============================================
            # KEYCLOAK 26.x ENVIRONMENT VARIABLES
            # ============================================
            # Admin credentials
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            # Database configuration (KC_* format for Keycloak 26.x)
            - name: KC_DB_URL_HOST
              value: {{ .Values.keycloak.database.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.keycloak.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.keycloak.database.database | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.database.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.database.existingSecret }}
                  key: {{ .Values.keycloak.database.passwordKey }}
            # Hostname configuration for Keycloak 26 v2 hostname SPI
            # When hostname is empty, Keycloak derives issuer from request Host header.
            # This allows product-specific identity domains (identity.fe3dr.com, etc.)
            # to return correct issuer URLs in OIDC metadata and tokens.
            {{- if .Values.keycloak.hostname }}
            - name: KC_HOSTNAME
              {{- $hostname := .Values.keycloak.hostname }}
              {{- if hasPrefix "https://" $hostname }}
              value: {{ $hostname | quote }}
              {{- else }}
              value: {{ printf "https://%s" $hostname | quote }}
              {{- end }}
            # Only enable backchannel dynamic when a fixed hostname is set
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            {{- end }}
            # JVM heap settings — must leave headroom for non-heap (Metaspace, threads, GC)
            {{- if .Values.keycloak.javaOpts }}
            - name: JAVA_OPTS
              value: {{ .Values.keycloak.javaOpts | quote }}
            {{- end }}
            # Features
            {{- if .Values.keycloak.features }}
            - name: KC_FEATURES
              value: {{ .Values.keycloak.features | join "," | quote }}
            {{- end }}
            # Additional environment variables
            {{- if .Values.keycloak.extraEnvVars }}
            {{- toYaml .Values.keycloak.extraEnvVars | nindent 12 }}
            {{- end }}
          {{- if .Values.keycloak.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.keycloak.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.keycloak.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.keycloak.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.keycloak.startupProbe }}
          startupProbe:
            {{- toYaml .Values.keycloak.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.homechefRealm }}
            {{- if .Values.homechefRealm.enabled }}
            - name: fe3dr-theme-login
              mountPath: /opt/keycloak/themes/fe3dr/login
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        {{- if .Values.homechefRealm }}
        {{- if .Values.homechefRealm.enabled }}
        - name: fe3dr-theme-login
          configMap:
            name: keycloak-fe3dr-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: template.ftl
                path: template.ftl
              - key: login.ftl
                path: login.ftl
              - key: register.ftl
                path: register.ftl
              - key: error.ftl
                path: error.ftl
              - key: info.ftl
                path: info.ftl
              - key: login-reset-password.ftl
                path: login-reset-password.ftl
              - key: fe3dr.css
                path: resources/css/fe3dr.css
        {{- end }}
        {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: keycloak
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
