{{- if and .Values.keycloak.enabled .Values.homechefRealm.enabled }}
# =============================================================================
# HomeChef Realm Bootstrap Job (customer Keycloak)
# =============================================================================
# Idempotently provisions the social-login pieces of the homechef realm:
#   - 'auto-link-by-email' authentication flow + executions
#   - 'google' identity provider with credentials from k8s secret
#   - identity provider mappers (email, firstName, lastName, picture)
#   - assigns the auto-link-by-email flow as firstBrokerLoginFlowAlias on
#     the google IdP
#
# Why this exists:
#   The realm-import-job runs partial import with ifResourceExists=SKIP, so
#   anything added to homechef-realm.json after the original import will not
#   reach the live realm. The realm-configmap.yaml uses ${GOOGLE_CLIENT_ID}
#   placeholders that are not substituted by the import job (no env vars
#   wired). This bootstrap job closes both gaps via the Keycloak admin API
#   for the homechef realm only, leaving the other realms (tesserix-customer,
#   fanzone, blog) untouched. Re-running is a no-op when everything is in
#   place.
#
# Read tesserix-k8s/docs/internal-keycloak-admin-bff-fix.md for the sibling
# pattern on the internal Keycloak — same idempotency strategy.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: homechef-realm-bootstrap-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: homechef-realm-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-customer
  annotations:
    # Use ArgoCD-native hook annotations (matching admin-sso-job in this same
    # chart) so we get a deterministic sync-wave instead of relying on the
    # helm.sh/hook-weight → argocd sync-wave conversion. Sync-wave -1 puts
    # this job BEFORE the admin-sso-job (default wave 0), so a failing
    # admin-sso-job in this realm cannot block the homechef IdP setup.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homechef-realm-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      containers:
        - name: bootstrap
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              KEYCLOAK_URL="http://keycloak:8080"
              REALM="homechef"
              MAX_RETRIES=60

              echo "Bootstrapping homechef realm social login..."

              # =================================================================
              # Step 1: Wait for Keycloak admin API and obtain access token
              # =================================================================
              TOKEN=""
              RETRY_COUNT=0
              while [ -z "$TOKEN" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" \
                  -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                if [ -z "$TOKEN" ]; then
                  echo "Waiting for Keycloak admin API... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                fi
              done

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to authenticate to Keycloak after $MAX_RETRIES attempts"
                exit 1
              fi
              echo "Authenticated to Keycloak admin API"

              # =================================================================
              # Step 2: Verify the homechef realm exists
              # =================================================================
              # Retry on 401 for a few attempts — Keycloak admin credentials
              # are rotated by ESO and there is a small window where the token
              # we just minted is valid but admin permissions are not yet
              # propagated. Treat any non-2xx after retries as fatal so we
              # never silently no-op on a real auth failure.
              REALM_LOOKUP_RETRIES=10
              for i in $(seq 1 $REALM_LOOKUP_RETRIES); do
                REALM_STATUS=$(curl -s -o /tmp/realm-resp -w "%{http_code}" \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/$REALM")
                if [ "$REALM_STATUS" = "200" ]; then
                  break
                fi
                if [ "$REALM_STATUS" = "404" ]; then
                  echo "Realm $REALM does not exist (404) — realm-import job will create it; nothing to do."
                  exit 0
                fi
                echo "GET /admin/realms/$REALM returned $REALM_STATUS, retry $i/$REALM_LOOKUP_RETRIES..."
                # Re-mint token in case the previous one is no longer valid
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" \
                  -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                sleep 5
              done
              if [ "$REALM_STATUS" != "200" ]; then
                echo "ERROR: Could not read realm $REALM after $REALM_LOOKUP_RETRIES attempts (last status $REALM_STATUS): $(cat /tmp/realm-resp)"
                exit 1
              fi
              echo "Realm $REALM exists"

              # =================================================================
              # Step 3: Validate Google credentials are present
              # =================================================================
              if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
                echo "ERROR: GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET not set. Aborting."
                exit 1
              fi

              # =================================================================
              # Step 4: Upsert the auto-link-by-email authentication flow
              # =================================================================
              # Keycloak's default 'first broker login' flow asks the user to
              # confirm linking when an existing email matches. The
              # auto-link-by-email flow links automatically as long as the IdP
              # provided a verified email (trustEmail is true on the IdP).
              FLOW_ALIAS="auto-link-by-email"
              echo "Checking authentication flow $FLOW_ALIAS..."

              FLOW_LOOKUP=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows" \
                -H "Authorization: Bearer $TOKEN")

              if echo "$FLOW_LOOKUP" | grep -q "\"alias\":\"$FLOW_ALIAS\""; then
                echo "Flow $FLOW_ALIAS already exists"
              else
                echo "Creating flow $FLOW_ALIAS..."
                CF_STATUS=$(curl -s -o /tmp/flow-resp -w "%{http_code}" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"alias\":\"$FLOW_ALIAS\",\"description\":\"Auto-link IdP accounts to existing users by verified email\",\"providerId\":\"basic-flow\",\"topLevel\":true,\"builtIn\":false}")
                if [ "$CF_STATUS" != "201" ] && [ "$CF_STATUS" != "409" ]; then
                  echo "ERROR: Failed to create flow (status $CF_STATUS): $(cat /tmp/flow-resp)"
                  exit 1
                fi
              fi

              # Always verify and fix executions, even if the flow already existed.
              # partialImport with ifResourceExists=SKIP can create a flow WITHOUT
              # its executions, leaving a broken flow that Keycloak falls back from.
              # Re-mint token because the flow creation may have taken time.
              TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                -d "grant_type=password" -d "client_id=admin-cli" 2>/dev/null \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

              EXECS=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows/$FLOW_ALIAS/executions" \
                -H "Authorization: Bearer $TOKEN" 2>/dev/null || echo "[]")

              # Add idp-create-user-if-unique if missing
              if ! echo "$EXECS" | grep -q "idp-create-user-if-unique"; then
                echo "  adding idp-create-user-if-unique..."
                curl -s -o /dev/null -w "status %{http_code}\n" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows/$FLOW_ALIAS/executions/execution" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -d '{"provider":"idp-create-user-if-unique"}'
              fi
              # Add idp-auto-link if missing
              if ! echo "$EXECS" | grep -q "idp-auto-link"; then
                echo "  adding idp-auto-link..."
                curl -s -o /dev/null -w "status %{http_code}\n" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows/$FLOW_ALIAS/executions/execution" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -d '{"provider":"idp-auto-link"}'
              fi

              # Ensure both are ALTERNATIVE (not DISABLED or REQUIRED)
              TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                -d "grant_type=password" -d "client_id=admin-cli" 2>/dev/null \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              EXECS=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows/$FLOW_ALIAS/executions" \
                -H "Authorization: Bearer $TOKEN" 2>/dev/null || echo "[]")
              echo "$EXECS" | tr ',' '\n' | grep -E '"(id|providerId|requirement)":' \
                | sed 's/.*"\(id\|providerId\|requirement\)":"\([^"]*\)".*/\1=\2/' > /tmp/execs.list || true
              CUR_ID="" CUR_PROV=""
              while IFS= read -r line; do
                case "$line" in
                  id=*) CUR_ID="${line#id=}" ;;
                  providerId=*) CUR_PROV="${line#providerId=}" ;;
                  requirement=*)
                    CUR_REQ="${line#requirement=}"
                    if [ "$CUR_PROV" = "idp-create-user-if-unique" ] || [ "$CUR_PROV" = "idp-auto-link" ]; then
                      if [ "$CUR_REQ" != "ALTERNATIVE" ]; then
                        echo "  setting $CUR_PROV -> ALTERNATIVE (was $CUR_REQ)..."
                        curl -s -o /dev/null -w "status %{http_code}\n" \
                          -X PUT "$KEYCLOAK_URL/admin/realms/$REALM/authentication/flows/$FLOW_ALIAS/executions" \
                          -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                          -d "{\"id\":\"$CUR_ID\",\"requirement\":\"ALTERNATIVE\"}"
                      fi
                    fi
                    ;;
                esac
              done < /tmp/execs.list
              echo "Flow $FLOW_ALIAS verified with correct executions"

              # =================================================================
              # Step 5: Upsert the google identity provider with real credentials
              # =================================================================
              # PUT replaces the IdP if it already exists; we always send the
              # full config so credential rotation is picked up automatically
              # on the next bootstrap run.
              IDP_ALIAS="google"
              echo "Ensuring identity provider $IDP_ALIAS..."

              cat > /tmp/idp.json <<EOF
              {
                "alias": "$IDP_ALIAS",
                "providerId": "google",
                "enabled": true,
                "trustEmail": true,
                "storeToken": false,
                "addReadTokenRoleOnCreate": false,
                "linkOnly": false,
                "firstBrokerLoginFlowAlias": "$FLOW_ALIAS",
                "config": {
                  "clientId": "$GOOGLE_CLIENT_ID",
                  "clientSecret": "$GOOGLE_CLIENT_SECRET",
                  "defaultScope": "openid email profile",
                  "syncMode": "FORCE",
                  "guiOrder": "1"
                }
              }
              EOF

              IDP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/$IDP_ALIAS")

              if [ "$IDP_STATUS" = "200" ]; then
                echo "Updating existing $IDP_ALIAS IdP..."
                UP=$(curl -s -o /tmp/idp-resp -w "%{http_code}" \
                  -X PUT "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/$IDP_ALIAS" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/idp.json)
                if [ "$UP" != "204" ] && [ "$UP" != "200" ]; then
                  echo "ERROR: PUT IdP returned $UP: $(cat /tmp/idp-resp)"
                  exit 1
                fi
              else
                echo "Creating $IDP_ALIAS IdP..."
                CR=$(curl -s -o /tmp/idp-resp -w "%{http_code}" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/idp.json)
                if [ "$CR" != "201" ] && [ "$CR" != "409" ]; then
                  echo "ERROR: POST IdP returned $CR: $(cat /tmp/idp-resp)"
                  exit 1
                fi
              fi
              echo "$IDP_ALIAS IdP ensured"

              # =================================================================
              # Step 6: Upsert identity provider mappers
              # =================================================================
              # Maps the Google ID-token claims into Keycloak user attributes so
              # firstName/lastName/picture are populated on first login. The
              # email mapper is the one that drives auto-link-by-email.
              MAPPERS_LIST=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/$IDP_ALIAS/mappers" \
                -H "Authorization: Bearer $TOKEN")

              add_or_update_mapper() {
                local NAME="$1"
                local CLAIM="$2"
                local USER_ATTR="$3"
                local SYNC_MODE="$4"

                if echo "$MAPPERS_LIST" | grep -q "\"name\":\"$NAME\""; then
                  echo "  mapper $NAME already present"
                  return 0
                fi
                echo "  adding mapper $NAME..."
                cat > /tmp/mapper.json <<MAPPER
              {
                "name": "$NAME",
                "identityProviderAlias": "$IDP_ALIAS",
                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                "config": {
                  "syncMode": "$SYNC_MODE",
                  "claim": "$CLAIM",
                  "user.attribute": "$USER_ATTR"
                }
              }
              MAPPER
                MS=$(curl -s -o /tmp/mapper-resp -w "%{http_code}" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/$IDP_ALIAS/mappers" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/mapper.json)
                if [ "$MS" != "201" ] && [ "$MS" != "409" ]; then
                  echo "ERROR: failed to add mapper $NAME (status $MS): $(cat /tmp/mapper-resp)"
                  exit 1
                fi
              }

              add_or_update_mapper "google-email"      "email"       "email"     "INHERIT"
              add_or_update_mapper "google-first-name" "given_name"  "firstName" "INHERIT"
              add_or_update_mapper "google-last-name"  "family_name" "lastName"  "INHERIT"
              add_or_update_mapper "google-picture"    "picture"     "picture"   "FORCE"

              # =================================================================
              # Step 7: Upsert Facebook identity provider
              # =================================================================
              if [ -n "$FACEBOOK_APP_ID" ] && [ -n "$FACEBOOK_APP_SECRET" ]; then
                echo "Ensuring Facebook IdP..."
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" -d "client_id=admin-cli" 2>/dev/null \
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

                cat > /tmp/fb-idp.json <<FBEOF
              {
                "alias": "facebook",
                "providerId": "facebook",
                "enabled": true,
                "trustEmail": true,
                "storeToken": false,
                "addReadTokenRoleOnCreate": false,
                "linkOnly": false,
                "firstBrokerLoginFlowAlias": "$FLOW_ALIAS",
                "config": {
                  "clientId": "$FACEBOOK_APP_ID",
                  "clientSecret": "$FACEBOOK_APP_SECRET",
                  "defaultScope": "email,public_profile",
                  "syncMode": "FORCE",
                  "guiOrder": "2"
                }
              }
              FBEOF

                FB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                  -H "Authorization: Bearer $TOKEN" \
                  "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/facebook")

                if [ "$FB_STATUS" = "200" ]; then
                  UP=$(curl -s -o /tmp/fb-resp -w "%{http_code}" \
                    -X PUT "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/facebook" \
                    -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                    -d @/tmp/fb-idp.json)
                  echo "  updated facebook IdP: $UP"
                else
                  CR=$(curl -s -o /tmp/fb-resp -w "%{http_code}" \
                    -X POST "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances" \
                    -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                    -d @/tmp/fb-idp.json)
                  echo "  created facebook IdP: $CR"
                fi

                # Facebook mappers (use facebook-user-attribute-mapper, not oidc)
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" -d "client_id=admin-cli" 2>/dev/null \
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

                FB_MAPPERS=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/facebook/mappers" \
                  -H "Authorization: Bearer $TOKEN" 2>/dev/null || echo "[]")

                add_fb_mapper() {
                  local NAME="$1" FIELD="$2" ATTR="$3" SYNC="$4"
                  if echo "$FB_MAPPERS" | grep -q "\"name\":\"$NAME\""; then
                    echo "  fb mapper $NAME exists"; return 0
                  fi
                  TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                    -H "Content-Type: application/x-www-form-urlencoded" \
                    -d "username=$KEYCLOAK_ADMIN" -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                    -d "grant_type=password" -d "client_id=admin-cli" 2>/dev/null \
                    | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  MS=$(curl -s -o /dev/null -w "%{http_code}" \
                    -X POST "$KEYCLOAK_URL/admin/realms/$REALM/identity-provider/instances/facebook/mappers" \
                    -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                    -d "{\"name\":\"$NAME\",\"identityProviderAlias\":\"facebook\",\"identityProviderMapper\":\"facebook-user-attribute-mapper\",\"config\":{\"syncMode\":\"$SYNC\",\"jsonField\":\"$FIELD\",\"user.attribute\":\"$ATTR\"}}")
                  echo "  added fb mapper $NAME: $MS"
                }
                add_fb_mapper "fb-email"      "email"            "email"     "INHERIT"
                add_fb_mapper "fb-first-name" "first_name"       "firstName" "INHERIT"
                add_fb_mapper "fb-last-name"  "last_name"        "lastName"  "INHERIT"
                add_fb_mapper "fb-picture"    "picture.data.url" "picture"   "FORCE"
                echo "Facebook IdP ensured"
              else
                echo "Skipping Facebook IdP — FACEBOOK_APP_ID/SECRET not set"
              fi

              echo "homechef realm bootstrap complete"
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-google-sso
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-google-sso
                  key: client-secret
            - name: FACEBOOK_APP_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-facebook-sso
                  key: app-id
            - name: FACEBOOK_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-facebook-sso
                  key: app-secret
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
