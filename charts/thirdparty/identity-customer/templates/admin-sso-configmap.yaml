{{- if .Values.adminSSO.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-admin-sso-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-sso
data:
  setup-admin-sso.sh: |
    #!/bin/bash
    # =============================================================================
    # Keycloak Admin SSO Setup Script (In-Cluster Version)
    # =============================================================================
    set -e

    # Configuration from environment
    KEYCLOAK_URL="${KEYCLOAK_URL}"
    KEYCLOAK_MGMT_URL="${KEYCLOAK_MGMT_URL:-http://keycloak:9000}"
    ADMIN_USER="${KEYCLOAK_ADMIN}"
    ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}"
    GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
    GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"

    # Super Admin emails
    SUPER_ADMINS=(
    {{- range .Values.adminSSO.superAdmins }}
        "{{ . }}"
    {{- end }}
    )

    log_info() { echo "[INFO] $1"; }
    log_success() { echo "[SUCCESS] $1"; }
    log_error() { echo "[ERROR] $1"; }

    # Wait for Keycloak to be ready (check via realms endpoint)
    log_info "Waiting for Keycloak to be ready..."
    until curl -sf "${KEYCLOAK_URL}/realms/master" > /dev/null 2>&1; do
        echo "  Waiting..."
        sleep 5
    done
    log_success "Keycloak is ready"

    # Get admin token
    log_info "Getting admin access token..."
    TOKEN_RESPONSE=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${ADMIN_USER}" \
        -d "password=${ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli")

    ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

    if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
        log_error "Failed to get admin token"
        exit 1
    fi
    log_success "Got admin access token"

    # Setup Google IDP
    log_info "Setting up Google Identity Provider..."
    IDP_CONFIG='{
        "alias": "google",
        "displayName": "Sign in with Google",
        "providerId": "google",
        "enabled": true,
        "updateProfileFirstLoginMode": "on",
        "trustEmail": true,
        "storeToken": false,
        "addReadTokenRoleOnCreate": false,
        "authenticateByDefault": false,
        "linkOnly": false,
        "firstBrokerLoginFlowAlias": "first broker login",
        "config": {
            "clientId": "'"${GOOGLE_CLIENT_ID}"'",
            "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
        }
    }'

    # Check if IDP exists
    EXISTING=$(curl -s -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")

    if [ "$EXISTING" == "200" ]; then
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances/google" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$IDP_CONFIG"
        log_info "  Updated existing Google IDP"
    else
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$IDP_CONFIG"
        log_info "  Created Google IDP"
    fi
    log_success "Google IDP configured for master realm"

    # =========================================================================
    # Setup Google IDP for tesserix-customer realm (Customer Portal Login)
    # =========================================================================
    log_info "Setting up Google Identity Provider for tesserix-customer realm..."

    CUSTOMER_IDP_CONFIG='{
        "alias": "google",
        "displayName": "Sign in with Google",
        "providerId": "google",
        "enabled": true,
        "updateProfileFirstLoginMode": "on",
        "trustEmail": true,
        "storeToken": false,
        "addReadTokenRoleOnCreate": false,
        "authenticateByDefault": false,
        "linkOnly": false,
        "firstBrokerLoginFlowAlias": "first broker login",
        "config": {
            "clientId": "'"${GOOGLE_CLIENT_ID}"'",
            "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
        }
    }'

    # Check if IDP exists in customer realm
    CUSTOMER_IDP_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")

    if [ "$CUSTOMER_IDP_EXISTS" == "200" ]; then
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/google" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$CUSTOMER_IDP_CONFIG"
        log_info "  Updated existing Google IDP in customer realm"
    else
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$CUSTOMER_IDP_CONFIG"
        log_info "  Created Google IDP in customer realm"
    fi

    # Setup IDP mappers for customer realm
    log_info "Setting up IDP mappers for customer realm..."
    for MAPPER in "email:email:email" "first_name:given_name:firstName" "last_name:family_name:lastName"; do
        IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
        MAPPER_JSON='{
            "name": "'"$NAME"'",
            "identityProviderAlias": "google",
            "identityProviderMapper": "oidc-user-attribute-idp-mapper",
            "config": {
                "syncMode": "INHERIT",
                "claim": "'"$CLAIM"'",
                "user.attribute": "'"$ATTR"'"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/google/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$MAPPER_JSON" 2>/dev/null || true
    done

    # Add google_linked hardcoded attribute mapper
    # This sets google_linked=true on the user whenever they log in via Google
    GOOGLE_LINKED_MAPPER='{
        "name": "google_linked",
        "identityProviderAlias": "google",
        "identityProviderMapper": "hardcoded-attribute-idp-mapper",
        "config": {
            "syncMode": "FORCE",
            "attribute": "google_linked",
            "attribute.value": "true"
        }
    }'
    curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/google/mappers" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "$GOOGLE_LINKED_MAPPER" 2>/dev/null || true

    log_success "Google IDP configured for tesserix-customer realm"

    # =========================================================================
    # Add protocol mapper for google_linked claim in access tokens
    # =========================================================================
    log_info "Adding google_linked protocol mapper to client scopes..."

    # Get the realm's default client scope "profile" and add mapper there
    PROFILE_SCOPE_ID=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/client-scopes" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r '.[] | select(.name == "profile") | .id')

    if [ -n "$PROFILE_SCOPE_ID" ] && [ "$PROFILE_SCOPE_ID" != "null" ]; then
        PROTOCOL_MAPPER='{
            "name": "google_linked",
            "protocol": "openid-connect",
            "protocolMapper": "oidc-usermodel-attribute-mapper",
            "config": {
                "user.attribute": "google_linked",
                "claim.name": "google_linked",
                "jsonType.label": "boolean",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "multivalued": "false",
                "aggregate.attrs": "false"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/client-scopes/${PROFILE_SCOPE_ID}/protocol-mappers/models" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PROTOCOL_MAPPER" 2>/dev/null || true
        log_info "  Added google_linked protocol mapper to profile scope"
    else
        log_error "  Could not find profile client scope"
    fi

    # =========================================================================
    # Create "Customer Auto Create-or-Link First Broker Login" Flow
    # =========================================================================
    # Flow structure:
    #   Customer Auto Create-or-Link First Broker Login (top-level)
    #   ├── idp-create-user-if-unique           (ALTERNATIVE) ← new Google customers
    #   └── Customer Auto-Link Existing Account  (ALTERNATIVE, sub-flow)
    #       ├── idp-detect-existing-broker-user  (REQUIRED)
    #       └── idp-auto-link                    (REQUIRED)   ← existing customers
    # =========================================================================
    FLOW_ALIAS="Customer Auto Create-or-Link First Broker Login"
    FLOW_ENCODED="Customer%20Auto%20Create-or-Link%20First%20Broker%20Login"
    SUBFLOW_ALIAS="Customer Auto-Link Existing Account"
    SUBFLOW_ENCODED="Customer%20Auto-Link%20Existing%20Account"

    log_info "Creating authentication flow: ${FLOW_ALIAS}..."

    # Delete old broken flow if it exists (flat "Auto Link First Broker Login")
    OLD_FLOW_ID=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r '.[] | select(.alias == "Auto Link First Broker Login") | .id')
    if [ -n "$OLD_FLOW_ID" ]; then
        log_info "  Deleting old broken flow 'Auto Link First Broker Login' (id: ${OLD_FLOW_ID})..."
        curl -s -X DELETE "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${OLD_FLOW_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" 2>/dev/null || true
        log_info "  Old flow deleted"
    fi

    # Check if new flow already exists
    FLOW_EXISTS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r --arg alias "$FLOW_ALIAS" '.[] | select(.alias == $alias) | .id')

    if [ -z "$FLOW_EXISTS" ]; then
        # Create top-level flow
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "'"${FLOW_ALIAS}"'",
                "providerId": "basic-flow",
                "topLevel": true,
                "builtIn": false,
                "description": "Creates new customers OR auto-links existing customers during storefront login via Google/Apple/Facebook SSO"
            }'
        log_info "  Created top-level flow"

        # Add idp-create-user-if-unique execution
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-create-user-if-unique"}'
        log_info "  Added idp-create-user-if-unique"

        # Set idp-create-user-if-unique to ALTERNATIVE
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        CREATE_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-create-user-if-unique") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${CREATE_EXEC_ID}\",\"requirement\":\"ALTERNATIVE\"}"
        log_info "  Set idp-create-user-if-unique to ALTERNATIVE"

        # Create sub-flow: "Customer Auto-Link Existing Account"
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions/flow" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "'"${SUBFLOW_ALIAS}"'",
                "description": "Detects and auto-links existing customers during storefront Google login",
                "provider": "basic-flow",
                "type": "basic-flow"
            }'
        log_info "  Created sub-flow: ${SUBFLOW_ALIAS}"

        # Set sub-flow to ALTERNATIVE
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        SUBFLOW_EXEC_ID=$(echo "$EXECUTIONS" | jq -r --arg name "$SUBFLOW_ALIAS" '.[] | select(.displayName == $name) | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${SUBFLOW_EXEC_ID}\",\"requirement\":\"ALTERNATIVE\",\"authenticationFlow\":true}"
        log_info "  Set sub-flow to ALTERNATIVE"

        # Add idp-detect-existing-broker-user to sub-flow (REQUIRED)
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${SUBFLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-detect-existing-broker-user"}'
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        DETECT_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-detect-existing-broker-user") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${DETECT_EXEC_ID}\",\"requirement\":\"REQUIRED\"}"
        log_info "  Added idp-detect-existing-broker-user (REQUIRED)"

        # Add idp-auto-link to sub-flow (REQUIRED)
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${SUBFLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-auto-link"}'
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        AUTOLINK_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-auto-link") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/authentication/flows/${FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${AUTOLINK_EXEC_ID}\",\"requirement\":\"REQUIRED\"}"
        log_info "  Added idp-auto-link (REQUIRED)"

        log_success "Authentication flow created with correct sub-flow structure"
    else
        log_info "  Flow '${FLOW_ALIAS}' already exists (id: ${FLOW_EXISTS})"
    fi

    # Update Google IDP to use new flow
    log_info "Updating Google IDP to use ${FLOW_ALIAS}..."
    curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{
            "alias": "google",
            "displayName": "Sign in with Google",
            "providerId": "google",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${GOOGLE_CLIENT_ID}"'",
                "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
                "defaultScope": "openid profile email",
                "syncMode": "IMPORT",
                "guiOrder": "1"
            }
        }'
    log_success "Google IDP configured with ${FLOW_ALIAS}"

    # =========================================================================
    # Setup Apple IDP for tesserix-customer realm
    # =========================================================================
    if [ -n "${APPLE_SERVICE_ID}" ]; then
        log_info "Setting up Apple Identity Provider for tesserix-customer realm..."

        APPLE_IDP_CONFIG='{
            "alias": "apple",
            "displayName": "Sign in with Apple",
            "providerId": "apple",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${APPLE_SERVICE_ID}"'",
                "teamId": "'"${APPLE_TEAM_ID}"'",
                "keyId": "'"${APPLE_KEY_ID}"'",
                "privateKey": "'"${APPLE_PRIVATE_KEY}"'",
                "defaultScope": "name email",
                "syncMode": "IMPORT",
                "guiOrder": "2"
            }
        }'

        APPLE_IDP_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/apple" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

        if [ "$APPLE_IDP_EXISTS" == "200" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/apple" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$APPLE_IDP_CONFIG"
            log_info "  Updated existing Apple IDP in customer realm"
        else
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$APPLE_IDP_CONFIG"
            log_info "  Created Apple IDP in customer realm"
        fi

        # Setup IDP mappers for Apple
        log_info "Setting up Apple IDP mappers..."
        for MAPPER in "email:email:email" "firstName:firstName:firstName" "lastName:lastName:lastName"; do
            IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
            MAPPER_JSON='{
                "name": "'"$NAME"'",
                "identityProviderAlias": "apple",
                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                "config": {
                    "syncMode": "INHERIT",
                    "claim": "'"$CLAIM"'",
                    "user.attribute": "'"$ATTR"'"
                }
            }'
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/apple/mappers" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$MAPPER_JSON" 2>/dev/null || true
        done

        # Add apple_linked hardcoded attribute mapper
        APPLE_LINKED_MAPPER='{
            "name": "apple_linked",
            "identityProviderAlias": "apple",
            "identityProviderMapper": "hardcoded-attribute-idp-mapper",
            "config": {
                "syncMode": "FORCE",
                "attribute": "apple_linked",
                "attribute.value": "true"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/apple/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$APPLE_LINKED_MAPPER" 2>/dev/null || true

        log_success "Apple IDP configured for tesserix-customer realm"
    else
        log_info "Skipping Apple IDP setup (APPLE_SERVICE_ID not set)"
    fi

    # =========================================================================
    # Setup Facebook IDP for tesserix-customer realm
    # =========================================================================
    if [ -n "${FACEBOOK_APP_ID}" ]; then
        log_info "Setting up Facebook Identity Provider for tesserix-customer realm..."

        FACEBOOK_IDP_CONFIG='{
            "alias": "facebook",
            "displayName": "Sign in with Facebook",
            "providerId": "facebook",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${FACEBOOK_APP_ID}"'",
                "clientSecret": "'"${FACEBOOK_APP_SECRET}"'",
                "defaultScope": "email public_profile",
                "syncMode": "IMPORT",
                "guiOrder": "3"
            }
        }'

        FACEBOOK_IDP_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/facebook" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

        if [ "$FACEBOOK_IDP_EXISTS" == "200" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/facebook" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FACEBOOK_IDP_CONFIG"
            log_info "  Updated existing Facebook IDP in customer realm"
        else
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FACEBOOK_IDP_CONFIG"
            log_info "  Created Facebook IDP in customer realm"
        fi

        # Setup IDP mappers for Facebook
        log_info "Setting up Facebook IDP mappers..."
        for MAPPER in "email:email:email" "first_name:first_name:firstName" "last_name:last_name:lastName"; do
            IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
            MAPPER_JSON='{
                "name": "'"$NAME"'",
                "identityProviderAlias": "facebook",
                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                "config": {
                    "syncMode": "INHERIT",
                    "claim": "'"$CLAIM"'",
                    "user.attribute": "'"$ATTR"'"
                }
            }'
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/facebook/mappers" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$MAPPER_JSON" 2>/dev/null || true
        done

        # Add facebook_linked hardcoded attribute mapper
        FACEBOOK_LINKED_MAPPER='{
            "name": "facebook_linked",
            "identityProviderAlias": "facebook",
            "identityProviderMapper": "hardcoded-attribute-idp-mapper",
            "config": {
                "syncMode": "FORCE",
                "attribute": "facebook_linked",
                "attribute.value": "true"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-customer/identity-provider/instances/facebook/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$FACEBOOK_LINKED_MAPPER" 2>/dev/null || true

        log_success "Facebook IDP configured for tesserix-customer realm"
    else
        log_info "Skipping Facebook IDP setup (FACEBOOK_APP_ID not set)"
    fi

    # Setup IDP mappers
    log_info "Setting up IDP mappers..."
    for MAPPER in "email:email:email" "first_name:given_name:firstName" "last_name:family_name:lastName"; do
        IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
        MAPPER_JSON='{
            "name": "'"$NAME"'",
            "identityProviderAlias": "google",
            "identityProviderMapper": "oidc-user-attribute-idp-mapper",
            "config": {
                "syncMode": "INHERIT",
                "claim": "'"$CLAIM"'",
                "user.attribute": "'"$ATTR"'"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances/google/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$MAPPER_JSON" 2>/dev/null || true
    done
    log_success "IDP mappers configured"

    # Get admin role
    log_info "Getting admin role..."
    ADMIN_ROLE=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/roles/admin" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    ADMIN_ROLE_ID=$(echo "$ADMIN_ROLE" | jq -r '.id')

    # Create super admin users
    log_info "Creating super admin users..."
    for EMAIL in "${SUPER_ADMINS[@]}"; do
        log_info "  Processing: $EMAIL"

        # Check if user exists
        EXISTING_USER=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/users?email=${EMAIL}&exact=true" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        USER_ID=$(echo "$EXISTING_USER" | jq -r '.[0].id // empty')

        if [ -z "$USER_ID" ]; then
            # Create user
            USER_DATA='{
                "username": "'"${EMAIL}"'",
                "email": "'"${EMAIL}"'",
                "enabled": true,
                "emailVerified": true,
                "attributes": {"super_admin": ["true"]}
            }'
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/users" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$USER_DATA"

            # Get new user ID
            EXISTING_USER=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/users?email=${EMAIL}&exact=true" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}")
            USER_ID=$(echo "$EXISTING_USER" | jq -r '.[0].id // empty')
            log_info "    Created user"
        else
            log_info "    User exists"
        fi

        # Assign admin role
        if [ -n "$USER_ID" ]; then
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/users/${USER_ID}/role-mappings/realm" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '[{"id": "'"${ADMIN_ROLE_ID}"'", "name": "admin"}]' 2>/dev/null || true
            log_info "    Assigned admin role"
        fi
    done
    log_success "Super admin users configured"

    # Disable default admin password (optional - controlled by flag)
    {{- if .Values.adminSSO.disablePasswordLogin }}
    log_info "Disabling password login for admin user..."
    # Get admin user
    ADMIN_USERS=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/users?username=${ADMIN_USER}&exact=true" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    ADMIN_USER_ID=$(echo "$ADMIN_USERS" | jq -r '.[0].id // empty')

    if [ -n "$ADMIN_USER_ID" ]; then
        # Disable the admin user (break-glass - can be re-enabled manually)
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/master/users/${ADMIN_USER_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled": false, "attributes": {"break_glass": ["true"]}}'
        log_info "  Admin password user disabled (break-glass mode)"
    fi
    {{- else }}
    log_info "Password login kept enabled (break-glass available)"
    {{- end }}

    # =========================================================================
    # Enable registrationEmailAsUsername on customer realm
    # =========================================================================
    # Ensures Keycloak always populates the email field when creating users
    # via IDP. Without this, users may have email=null which breaks
    # idp-detect-existing-broker-user (it matches by email, not username).
    log_info "Checking registrationEmailAsUsername on tesserix-customer realm..."
    REALM_CONFIG=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    REG_EMAIL=$(echo "$REALM_CONFIG" | jq -r '.registrationEmailAsUsername // false')

    if [ "$REG_EMAIL" != "true" ]; then
        log_info "  Setting registrationEmailAsUsername=true..."
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-customer" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"registrationEmailAsUsername": true}'
        log_success "registrationEmailAsUsername enabled on customer realm"
    else
        log_info "  registrationEmailAsUsername already enabled"
    fi

    # =========================================================================
    # Repair users with null/empty email in customer realm
    # =========================================================================
    # Fixes users created by tenant-service before registrationEmailAsUsername
    # was enabled — copies username (email) into the email field.
    log_info "Scanning for users with null/empty email in customer realm..."
    CUSTOMER_USERS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-customer/users?first=0&max=500" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    CUSTOMER_TOTAL=$(echo "$CUSTOMER_USERS" | jq 'length')
    log_info "  Found $CUSTOMER_TOTAL users in customer realm"

    NULL_EMAIL_USERS=$(echo "$CUSTOMER_USERS" | jq -r '.[] | select(.email == null or .email == "") | "\(.id)|\(.username)"')
    if [ -z "$NULL_EMAIL_USERS" ]; then
        log_success "All customer realm users have email set"
    else
        echo "$NULL_EMAIL_USERS" | while IFS='|' read -r UID UNAME; do
            log_info "  Repairing user: $UNAME (id: $UID) → setting email=$UNAME"
            REPAIR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                "${KEYCLOAK_URL}/admin/realms/tesserix-customer/users/${UID}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"email\": \"${UNAME}\", \"emailVerified\": true}")
            if [ "$REPAIR_STATUS" = "204" ]; then
                log_success "  Fixed: $UNAME"
            else
                log_error "  Failed to fix $UNAME (HTTP $REPAIR_STATUS)"
            fi
        done
        log_success "Null email repair complete"
    fi

    {{- if .Values.fanzoneRealm.enabled }}
    # =========================================================================
    # Create "FanZone Auto Create-or-Link First Broker Login" Flow
    # =========================================================================
    # Flow structure (matches working tesserix-customer pattern):
    #   FanZone Auto Create-or-Link First Broker Login (top-level)
    #   ├── idp-create-user-if-unique           (ALTERNATIVE) ← new users
    #   └── FanZone Auto-Link Existing Account   (ALTERNATIVE, sub-flow)
    #       └── idp-auto-link                    (REQUIRED)   ← existing users (same email)
    # =========================================================================
    FZ_FLOW_ALIAS="FanZone Auto Create-or-Link First Broker Login"
    FZ_FLOW_ENCODED="FanZone%20Auto%20Create-or-Link%20First%20Broker%20Login"
    FZ_SUBFLOW_ALIAS="FanZone Auto-Link Existing Account"
    FZ_SUBFLOW_ENCODED="FanZone%20Auto-Link%20Existing%20Account"

    log_info "Creating authentication flow: ${FZ_FLOW_ALIAS}..."

    FZ_FLOW_EXISTS=$(curl -s "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r --arg alias "$FZ_FLOW_ALIAS" '.[] | select(.alias == $alias) | .id')

    if [ -z "$FZ_FLOW_EXISTS" ]; then
        # Create top-level flow
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "'"${FZ_FLOW_ALIAS}"'",
                "providerId": "basic-flow",
                "topLevel": true,
                "builtIn": false,
                "description": "Creates new users OR auto-links existing users during social login via Google/Facebook/Instagram"
            }'
        log_info "  Created top-level flow"

        # Add idp-create-user-if-unique execution
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-create-user-if-unique"}'
        log_info "  Added idp-create-user-if-unique"

        # Set idp-create-user-if-unique to ALTERNATIVE
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        CREATE_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-create-user-if-unique") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${CREATE_EXEC_ID}\",\"requirement\":\"ALTERNATIVE\"}"
        log_info "  Set idp-create-user-if-unique to ALTERNATIVE"

        # Create sub-flow: "FanZone Auto-Link Existing Account"
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions/flow" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "'"${FZ_SUBFLOW_ALIAS}"'",
                "description": "Detects and auto-links existing users during social login",
                "provider": "basic-flow",
                "type": "basic-flow"
            }'
        log_info "  Created sub-flow: ${FZ_SUBFLOW_ALIAS}"

        # Set sub-flow to ALTERNATIVE
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        SUBFLOW_EXEC_ID=$(echo "$EXECUTIONS" | jq -r --arg name "$FZ_SUBFLOW_ALIAS" '.[] | select(.displayName == $name) | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${SUBFLOW_EXEC_ID}\",\"requirement\":\"ALTERNATIVE\",\"authenticationFlow\":true}"
        log_info "  Set sub-flow to ALTERNATIVE"

        # Add idp-auto-link to sub-flow (REQUIRED)
        # NOTE: idp-create-user-if-unique already detects the existing user and
        # stores info in the auth session note. idp-auto-link picks it up directly.
        # Do NOT add idp-detect-existing-broker-user here - it causes
        # "invalid_user_credentials" errors when linking social accounts.
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_SUBFLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-auto-link"}'
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        AUTOLINK_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-auto-link") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/authentication/flows/${FZ_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${AUTOLINK_EXEC_ID}\",\"requirement\":\"REQUIRED\"}"
        log_info "  Added idp-auto-link (REQUIRED)"

        log_success "FanZone auto-link authentication flow created"
    else
        log_info "  Flow '${FZ_FLOW_ALIAS}' already exists (id: ${FZ_FLOW_EXISTS})"
    fi

    # =========================================================================
    # Setup Google IDP for FanZone realm
    # =========================================================================
    log_info "Setting up Google IDP for fanzone realm..."

    FANZONE_GOOGLE_IDP='{
        "alias": "google",
        "displayName": "Sign in with Google",
        "providerId": "google",
        "enabled": true,
        "updateProfileFirstLoginMode": "on",
        "trustEmail": true,
        "storeToken": false,
        "addReadTokenRoleOnCreate": false,
        "authenticateByDefault": false,
        "linkOnly": false,
        "firstBrokerLoginFlowAlias": "'"${FZ_FLOW_ALIAS}"'",
        "config": {
            "clientId": "'"${GOOGLE_CLIENT_ID}"'",
            "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
        }
    }'

    FANZONE_GOOGLE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")

    if [ "$FANZONE_GOOGLE_EXISTS" == "200" ]; then
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/google" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$FANZONE_GOOGLE_IDP"
        log_info "  Updated Google IDP in fanzone realm"
    else
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$FANZONE_GOOGLE_IDP"
        log_info "  Created Google IDP in fanzone realm"
    fi

    # Setup Google IDP mappers for fanzone realm
    for MAPPER in "email:email:email" "first_name:given_name:firstName" "last_name:family_name:lastName"; do
        IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/google/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"'"$NAME"'","identityProviderAlias":"google","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"syncMode":"INHERIT","claim":"'"$CLAIM"'","user.attribute":"'"$ATTR"'"}}' 2>/dev/null || true
    done
    log_success "Google IDP configured for fanzone realm"

    # =========================================================================
    # Setup Facebook IDP for FanZone realm
    # =========================================================================
    if [ -n "${FACEBOOK_APP_ID}" ]; then
        log_info "Setting up Facebook IDP for fanzone realm..."

        FANZONE_FB_IDP='{
            "alias": "facebook",
            "displayName": "Sign in with Facebook",
            "providerId": "facebook",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${FZ_FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${FACEBOOK_APP_ID}"'",
                "clientSecret": "'"${FACEBOOK_APP_SECRET}"'",
                "defaultScope": "email public_profile",
                "syncMode": "IMPORT",
                "guiOrder": "3"
            }
        }'

        FANZONE_FB_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/facebook" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

        if [ "$FANZONE_FB_EXISTS" == "200" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/facebook" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FANZONE_FB_IDP"
            log_info "  Updated Facebook IDP in fanzone realm"
        else
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FANZONE_FB_IDP"
            log_info "  Created Facebook IDP in fanzone realm"
        fi

        # Setup Facebook IDP mappers for fanzone realm
        for MAPPER in "email:email:email" "first_name:first_name:firstName" "last_name:last_name:lastName"; do
            IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/facebook/mappers" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"name":"'"$NAME"'","identityProviderAlias":"facebook","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"syncMode":"INHERIT","claim":"'"$CLAIM"'","user.attribute":"'"$ATTR"'"}}' 2>/dev/null || true
        done
        log_success "Facebook IDP configured for fanzone realm"
    fi

    # =========================================================================
    # Setup Instagram IDP for FanZone realm (uses Facebook OAuth under the hood)
    # =========================================================================
    if [ -n "${FACEBOOK_APP_ID}" ]; then
        log_info "Setting up Instagram IDP for fanzone realm..."

        FANZONE_IG_IDP='{
            "alias": "instagram",
            "displayName": "Sign in with Instagram",
            "providerId": "facebook",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${FZ_FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${FACEBOOK_APP_ID}"'",
                "clientSecret": "'"${FACEBOOK_APP_SECRET}"'",
                "defaultScope": "email public_profile",
                "syncMode": "IMPORT",
                "guiOrder": "4"
            }
        }'

        FANZONE_IG_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/instagram" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

        if [ "$FANZONE_IG_EXISTS" == "200" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/instagram" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FANZONE_IG_IDP"
            log_info "  Updated Instagram IDP in fanzone realm"
        else
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FANZONE_IG_IDP"
            log_info "  Created Instagram IDP in fanzone realm"
        fi

        # Setup Instagram IDP mappers for fanzone realm
        for MAPPER in "email:email:email" "first_name:first_name:firstName" "last_name:last_name:lastName"; do
            IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/instagram/mappers" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"name":"'"$NAME"'","identityProviderAlias":"instagram","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"syncMode":"INHERIT","claim":"'"$CLAIM"'","user.attribute":"'"$ATTR"'"}}' 2>/dev/null || true
        done
        log_success "Instagram IDP configured for fanzone realm"
    fi

    # =========================================================================
    # Setup Twitter/X IDP for FanZone realm
    # Uses OIDC provider type with Twitter's OAuth 2.0 endpoints.
    # Twitter's built-in OAuth 1.0a provider fails on Free tier (v1.1 API restricted).
    # =========================================================================
    if [ -n "${TWITTER_API_KEY}" ]; then
        log_info "Setting up Twitter/X IDP for fanzone realm (OAuth 2.0 via OIDC)..."

        FANZONE_TW_IDP='{
            "alias": "twitter",
            "displayName": "Sign in with X",
            "providerId": "oidc",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": false,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${FZ_FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${TWITTER_API_KEY}"'",
                "clientSecret": "'"${TWITTER_API_SECRET}"'",
                "authorizationUrl": "https://twitter.com/i/oauth2/authorize",
                "tokenUrl": "https://api.twitter.com/2/oauth2/token",
                "userInfoUrl": "https://api.twitter.com/2/users/me?user.fields=id,name,username,profile_image_url,description",
                "defaultScope": "tweet.read users.read offline.access",
                "clientAuthMethod": "client_secret_basic",
                "syncMode": "IMPORT",
                "guiOrder": "5",
                "pkceEnabled": "true",
                "pkceMethod": "S256",
                "disableUserInfo": "false",
                "validateSignature": "false",
                "useJwksUrl": "false"
            }
        }'

        FANZONE_TW_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/twitter" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

        if [ "$FANZONE_TW_EXISTS" == "200" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances/twitter" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FANZONE_TW_IDP"
            log_info "  Updated Twitter IDP in fanzone realm"
        else
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/fanzone/identity-provider/instances" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$FANZONE_TW_IDP"
            log_info "  Created Twitter IDP in fanzone realm"
        fi

        log_success "Twitter/X IDP configured for fanzone realm"
    fi

    # Enable registrationEmailAsUsername on fanzone realm
    log_info "Ensuring registrationEmailAsUsername on fanzone realm..."
    curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/fanzone" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"registrationEmailAsUsername": true}'
    log_success "FanZone realm configured"
    {{- end }}

    {{- if .Values.homechefRealm.enabled }}
    # =========================================================================
    # Create "HomeChef Auto Create-or-Link First Broker Login" Flow
    # =========================================================================
    HC_FLOW_ALIAS="HomeChef Auto Create-or-Link First Broker Login"
    HC_FLOW_ENCODED="HomeChef%20Auto%20Create-or-Link%20First%20Broker%20Login"
    HC_SUBFLOW_ALIAS="HomeChef Auto-Link Existing Account"
    HC_SUBFLOW_ENCODED="HomeChef%20Auto-Link%20Existing%20Account"

    log_info "Creating authentication flow: ${HC_FLOW_ALIAS}..."

    HC_FLOW_EXISTS=$(curl -s "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r --arg alias "$HC_FLOW_ALIAS" '.[] | select(.alias == $alias) | .id')

    if [ -z "$HC_FLOW_EXISTS" ]; then
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "'"${HC_FLOW_ALIAS}"'",
                "providerId": "basic-flow",
                "topLevel": true,
                "builtIn": false,
                "description": "Creates new users OR auto-links existing users during social login via Google/Facebook"
            }'
        log_info "  Created top-level flow"

        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-create-user-if-unique"}'
        log_info "  Added idp-create-user-if-unique"

        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        CREATE_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-create-user-if-unique") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${CREATE_EXEC_ID}\",\"requirement\":\"ALTERNATIVE\"}"
        log_info "  Set idp-create-user-if-unique to ALTERNATIVE"

        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions/flow" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "'"${HC_SUBFLOW_ALIAS}"'",
                "description": "Detects and auto-links existing users during social login",
                "provider": "basic-flow",
                "type": "basic-flow"
            }'
        log_info "  Created sub-flow: ${HC_SUBFLOW_ALIAS}"

        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        SUBFLOW_EXEC_ID=$(echo "$EXECUTIONS" | jq -r --arg name "$HC_SUBFLOW_ALIAS" '.[] | select(.displayName == $name) | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${SUBFLOW_EXEC_ID}\",\"requirement\":\"ALTERNATIVE\",\"authenticationFlow\":true}"
        log_info "  Set sub-flow to ALTERNATIVE"

        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_SUBFLOW_ENCODED}/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-auto-link"}'
        EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        AUTOLINK_EXEC_ID=$(echo "$EXECUTIONS" | jq -r '.[] | select(.providerId == "idp-auto-link") | .id')
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/homechef/authentication/flows/${HC_FLOW_ENCODED}/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${AUTOLINK_EXEC_ID}\",\"requirement\":\"REQUIRED\"}"
        log_info "  Added idp-auto-link (REQUIRED)"

        log_success "HomeChef auto-link authentication flow created"
    else
        log_info "  Flow '${HC_FLOW_ALIAS}' already exists (id: ${HC_FLOW_EXISTS})"
    fi

    # =========================================================================
    # Setup Google IDP for HomeChef realm
    # =========================================================================
    log_info "Setting up Google IDP for homechef realm..."

    HOMECHEF_GOOGLE_IDP='{
        "alias": "google",
        "displayName": "Sign in with Google",
        "providerId": "google",
        "enabled": true,
        "updateProfileFirstLoginMode": "on",
        "trustEmail": true,
        "storeToken": false,
        "addReadTokenRoleOnCreate": false,
        "authenticateByDefault": false,
        "linkOnly": false,
        "firstBrokerLoginFlowAlias": "'"${HC_FLOW_ALIAS}"'",
        "config": {
            "clientId": "'"${GOOGLE_CLIENT_ID}"'",
            "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
        }
    }'

    HOMECHEF_GOOGLE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")

    if [ "$HOMECHEF_GOOGLE_EXISTS" == "200" ]; then
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances/google" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$HOMECHEF_GOOGLE_IDP"
        log_info "  Updated Google IDP in homechef realm"
    else
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$HOMECHEF_GOOGLE_IDP"
        log_info "  Created Google IDP in homechef realm"
    fi

    for MAPPER in "email:email:email" "first_name:given_name:firstName" "last_name:family_name:lastName"; do
        IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances/google/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"'"$NAME"'","identityProviderAlias":"google","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"syncMode":"INHERIT","claim":"'"$CLAIM"'","user.attribute":"'"$ATTR"'"}}' 2>/dev/null || true
    done
    log_success "Google IDP configured for homechef realm"

    # =========================================================================
    # Setup Facebook IDP for HomeChef realm (optional)
    # =========================================================================
    if [ -n "${FACEBOOK_APP_ID}" ]; then
        log_info "Setting up Facebook IDP for homechef realm..."

        HOMECHEF_FB_IDP='{
            "alias": "facebook",
            "displayName": "Sign in with Facebook",
            "providerId": "facebook",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "'"${HC_FLOW_ALIAS}"'",
            "config": {
                "clientId": "'"${FACEBOOK_APP_ID}"'",
                "clientSecret": "'"${FACEBOOK_APP_SECRET}"'",
                "defaultScope": "email public_profile",
                "syncMode": "IMPORT",
                "guiOrder": "3"
            }
        }'

        HOMECHEF_FB_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances/facebook" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

        if [ "$HOMECHEF_FB_EXISTS" == "200" ]; then
            curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances/facebook" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$HOMECHEF_FB_IDP"
            log_info "  Updated Facebook IDP in homechef realm"
        else
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$HOMECHEF_FB_IDP"
            log_info "  Created Facebook IDP in homechef realm"
        fi

        for MAPPER in "email:email:email" "first_name:first_name:firstName" "last_name:last_name:lastName"; do
            IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/homechef/identity-provider/instances/facebook/mappers" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"name":"'"$NAME"'","identityProviderAlias":"facebook","identityProviderMapper":"oidc-user-attribute-idp-mapper","config":{"syncMode":"INHERIT","claim":"'"$CLAIM"'","user.attribute":"'"$ATTR"'"}}' 2>/dev/null || true
        done
        log_success "Facebook IDP configured for homechef realm"
    fi

    # Enable registrationEmailAsUsername on homechef realm
    log_info "Ensuring registrationEmailAsUsername on homechef realm..."
    curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/homechef" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{"registrationEmailAsUsername": true}'
    log_success "HomeChef realm configured"
    {{- end }}

    log_success "Keycloak Admin SSO setup complete!"
    echo ""
    echo "=== Configuration Summary ==="
    echo "Google SSO: Enabled"
    echo "Customer Realm Flow: ${FLOW_ALIAS}"
    echo "  - idp-create-user-if-unique (ALTERNATIVE)"
    echo "  - ${SUBFLOW_ALIAS} (ALTERNATIVE, sub-flow)"
    echo "    - idp-detect-existing-broker-user (REQUIRED)"
    echo "    - idp-auto-link (REQUIRED)"
    echo "registrationEmailAsUsername: true"
    echo "Super Admins:"
    for EMAIL in "${SUPER_ADMINS[@]}"; do
        echo "  - $EMAIL"
    done
    echo "Password Login: {{ if .Values.adminSSO.disablePasswordLogin }}Disabled (break-glass){{ else }}Enabled{{ end }}"
    echo ""
    echo "OAuth Redirect URIs:"
    echo "  Google: ${KEYCLOAK_URL}/realms/master/broker/google/endpoint"
    echo "  Google (customer): ${KEYCLOAK_URL}/realms/tesserix-customer/broker/google/endpoint"
    if [ -n "${APPLE_SERVICE_ID}" ]; then
        echo "  Apple: ${KEYCLOAK_URL}/realms/tesserix-customer/broker/apple/endpoint"
    fi
    if [ -n "${FACEBOOK_APP_ID}" ]; then
        echo "  Facebook: ${KEYCLOAK_URL}/realms/tesserix-customer/broker/facebook/endpoint"
    fi
{{- end }}
