{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-customer
data:
  tesserix-customer-realm.json: |
    {
      "realm": "tesserix-customer",
      "enabled": true,
      "organizationsEnabled": true,
      "displayName": "Tesseract Customer Portal",
      "displayNameHtml": "<strong>Tesseract</strong> Customer Portal",
      "registrationAllowed": true,
      "registrationEmailAsUsername": true,
      "rememberMe": true,
      "verifyEmail": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "passwordPolicy": "{{ .Values.passwordPolicy }}",
      "sslRequired": "external",
      "accessTokenLifespan": 300,
      "accessTokenLifespanForImplicitFlow": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "offlineSessionIdleTimeout": 2592000,
      "accessCodeLifespan": 60,
      "accessCodeLifespanUserAction": 300,
      "accessCodeLifespanLogin": 1800,
      "actionTokenGeneratedByAdminLifespan": 43200,
      "actionTokenGeneratedByUserLifespan": 300,
      "internationalizationEnabled": true,
      "supportedLocales": ["en", "de", "fr", "es"],
      "defaultLocale": "en",
      "eventsEnabled": true,
      "eventsListeners": ["jboss-logging"],
      "enabledEventTypes": ["LOGIN", "LOGIN_ERROR", "LOGOUT", "REGISTER", "REGISTER_ERROR"],
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "attributes": {
        "userProfileEnabled": "true"
      },
      "roles": {
        "realm": [
          {
            "name": "customer",
            "description": "Default customer role"
          },
          {
            "name": "premium_customer",
            "description": "Premium customer with additional features"
          },
          {
            "name": "store_owner",
            "description": "Store owner role for marketplace tenant administrators"
          }
        ]
      },
      "defaultRoles": ["customer"],
      "clients": [
        {
          "clientId": "storefront-web",
          "name": "Tesseract Storefront",
          "description": "Customer-facing web application",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "rootUrl": "https://{{ .Values.baseDomain }}",
          "baseUrl": "https://{{ .Values.baseDomain }}",
          "redirectUris": [
            "https://*.{{ .Values.baseDomain }}/*",
            "http://localhost:3000/*",
            "http://localhost:4200/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://*.{{ .Values.baseDomain }}/*##http://localhost:3000/*"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["address", "phone", "offline_access"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "storefront-mobile",
          "name": "Tesseract Mobile App",
          "description": "Mobile application for customers - supports ROPC for native login",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "protocol": "openid-connect",
          "redirectUris": [
            "tesserix://auth/callback",
            "tesserix://callback",
            "com.tesseract.mobile://callback",
            "com.tesseract.mobile://auth/callback",
            "exp://localhost:19000/--/auth/callback",
            "exp://localhost:8081/--/auth/callback",
            "exp://192.168.*:8081/--/auth/callback"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "tesserix://auth/logout##com.tesseract.mobile://logout"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles", "offline_access"],
          "optionalClientScopes": ["address", "phone"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "marketplace-dashboard",
          "name": "Marketplace Admin Dashboard",
          "description": "Admin dashboard for marketplace tenants - supports direct login and token exchange",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "secret": "{{ .Values.keycloak.marketplaceDashboard.clientSecret | default "change-me-in-production" }}",
          "rootUrl": "https://*-admin.{{ .Values.baseDomain }}",
          "redirectUris": [
            "https://*-admin.{{ .Values.baseDomain }}/*",
            "https://*.{{ .Values.baseDomain }}/*",
            "https://localhost:3000/*",
            "http://localhost:3000/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://*-admin.{{ .Values.baseDomain }}/*##http://localhost:3000/*",
            "oauth2.device.authorization.grant.enabled": "false",
            "oidc.ciba.grant.enabled": "false"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles", "offline_access"],
          "optionalClientScopes": ["address", "phone"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenants",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenants",
                "user.attribute": "tenants",
                "jsonType.label": "JSON",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "multivalued": "true"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "config": {
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "staff_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "staff_id",
                "user.attribute": "staff_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "vendor_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "vendor_id",
                "user.attribute": "vendor_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "marketplace-onboarding-admin",
          "name": "Marketplace Onboarding Admin",
          "description": "Service account for tenant onboarding - user management and realm admin",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "secret": "{{ .Values.keycloak.onboardingAdmin.clientSecret | default "change-me-in-production" }}",
          "defaultClientScopes": ["openid", "email", "profile"],
          "optionalClientScopes": []
        }
      ],
      "users": [
        {
          "username": "service-account-marketplace-onboarding-admin",
          "enabled": true,
          "serviceAccountClientId": "marketplace-onboarding-admin",
          "clientRoles": {
            "realm-management": [
              "manage-users",
              "query-users",
              "view-users",
              "view-realm",
              "query-realm",
              "manage-realm"
            ]
          }
        }
      ]
    }
{{- if .Values.fanzoneRealm.enabled }}
  fanzone-realm.json: |
    {
      "realm": "fanzone",
      "enabled": true,
      "displayName": "FanZone Battle Ground",
      "displayNameHtml": "<strong>FanZone</strong> Battle Ground",
      "registrationAllowed": true,
      "registrationEmailAsUsername": true,
      "rememberMe": true,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "passwordPolicy": "length(8) and lowerCase(1) and upperCase(1) and digits(1)",
      "sslRequired": "external",
      "accessTokenLifespan": 900,
      "accessTokenLifespanForImplicitFlow": 900,
      "ssoSessionIdleTimeout": 3600,
      "ssoSessionMaxLifespan": 86400,
      "offlineSessionIdleTimeout": 2592000,
      "accessCodeLifespan": 60,
      "accessCodeLifespanUserAction": 300,
      "accessCodeLifespanLogin": 1800,
      "internationalizationEnabled": false,
      "eventsEnabled": true,
      "eventsListeners": ["jboss-logging"],
      "enabledEventTypes": ["LOGIN", "LOGIN_ERROR", "LOGOUT", "REGISTER", "REGISTER_ERROR"],
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "attributes": {
        "userProfileEnabled": "true"
      },
      "roles": {
        "realm": [
          {
            "name": "fan",
            "description": "Default fan role"
          },
          {
            "name": "moderator",
            "description": "Chat moderator role"
          },
          {
            "name": "admin",
            "description": "FanZone admin role"
          }
        ]
      },
      "defaultRoles": ["fan"],
      "clients": [
        {
          "clientId": "fanzone-web",
          "name": "FanZone Web App",
          "description": "FanZone Battle Ground web application",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "rootUrl": "https://{{ .Values.fanzoneRealm.domain }}",
          "baseUrl": "https://{{ .Values.fanzoneRealm.domain }}",
          "redirectUris": [
            "https://{{ .Values.fanzoneRealm.domain }}/*",
            "https://www.{{ .Values.fanzoneRealm.domain }}/*",
            "http://localhost:3000/*",
            "http://localhost:8080/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://{{ .Values.fanzoneRealm.domain }}/*##http://localhost:3000/*"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access"]
        },
        {
          "clientId": "fanzone-bff",
          "name": "FanZone Auth BFF",
          "description": "FanZone Backend-For-Frontend handling OIDC token exchange",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "https://{{ .Values.fanzoneRealm.domain }}/auth/callback",
            "https://{{ .Values.fanzoneRealm.domain }}/*",
            "{{ .Values.fanzoneRealm.mobileScheme }}://auth/callback",
            "http://localhost:3000/auth/callback",
            "http://localhost:8090/auth/callback"
          ],
          "webOrigins": [
            "https://{{ .Values.fanzoneRealm.domain }}",
            "{{ .Values.fanzoneRealm.mobileScheme }}://"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://{{ .Values.fanzoneRealm.domain }}/*##{{ .Values.fanzoneRealm.mobileScheme }}://auth/logout##http://localhost:3000/*",
            "backchannel.logout.session.required": "true",
            "backchannel.logout.revoke.offline.tokens": "false"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access", "phone"]
        },
        {
          "clientId": "fanzone-mobile",
          "name": "FanZone Mobile App",
          "description": "FanZone Battle Ground mobile application",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "{{ .Values.fanzoneRealm.mobileScheme }}://auth/callback",
            "{{ .Values.fanzoneRealm.mobileScheme }}://callback",
            "exp://localhost:19000/--/auth/callback",
            "exp://localhost:8081/--/auth/callback",
            "exp://192.168.*:8081/--/auth/callback"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "{{ .Values.fanzoneRealm.mobileScheme }}://auth/logout"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles", "offline_access"],
          "optionalClientScopes": []
        }
      ]
    }
{{- end }}
