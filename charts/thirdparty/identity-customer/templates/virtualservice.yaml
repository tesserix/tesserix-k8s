{{- if and .Values.keycloak.enabled .Values.keycloak.hostname }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-customer
spec:
  hosts:
    {{- $hostname := .Values.keycloak.hostname }}
    {{- $hostname = trimPrefix "https://" $hostname }}
    {{- $hostname = trimPrefix "http://" $hostname }}
    - {{ $hostname | quote }}
  gateways:
    - istio-ingress/tesseract-gateway
  exportTo:
    - "."
    - "istio-ingress"
  http:
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.keycloak.service.port | default 8080 }}
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 20s
        retryOn: gateway-error,connect-failure,refused-stream
{{- end }}
