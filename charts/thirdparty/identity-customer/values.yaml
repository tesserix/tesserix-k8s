# =============================================================================
# IDENTITY-CUSTOMER: Customer Identity Platform
# =============================================================================
# Production-grade Keycloak setup for customer authentication
# Handles: Google, Meta, Apple, Phone/SMS, WhatsApp, Email/Password
# URL: https://devtest-customer-idp.tesserix.app
# =============================================================================

# -----------------------------------------------------------------------------
# REALM PASSWORD POLICY
# -----------------------------------------------------------------------------
# Keycloak password policy string applied to the tesserix-customer realm.
# Format: "length(N) and lowerCase(N) and upperCase(N) and digits(N) and specialChars(N)"
passwordPolicy: "length(8) and lowerCase(1) and upperCase(1) and digits(1) and specialChars(1)"

# Base domain for tenant storefronts and admin dashboards.
# Used in realm client redirect URIs and post-logout redirect URIs.
# Override per environment: devtest=tesserix.app, prod=mark8ly.com
baseDomain: "tesserix.app"

# -----------------------------------------------------------------------------
# KEYCLOAK CONFIGURATION
# -----------------------------------------------------------------------------
keycloak:
  enabled: true
  replicaCount: 2

  # Client credentials for marketplace integration (realm-configmap.yaml uses these)
  # Secrets should be stored in GCP Secret Manager and synced via External Secrets
  marketplaceDashboard:
    # Client secret for marketplace-dashboard (token exchange for direct login)
    clientSecret: ""  # Set via External Secret or override in environment values
  onboardingAdmin:
    # Client secret for marketplace-onboarding-admin (service account for user management)
    clientSecret: ""  # Set via External Secret or override in environment values

  # Identity Providers (Social Login)
  identityProviders:
    google:
      enabled: true
      # Client ID from Google Cloud Console OAuth 2.0 credentials
      clientId: ""  # Set via External Secret or override in environment values
      # Client Secret from Google Cloud Console OAuth 2.0 credentials
      clientSecret: ""  # Set via External Secret or override in environment values

  image:
    # Official Keycloak image from quay.io
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent

  # Use 'start' (not 'start --optimized') to load PostgreSQL driver dynamically
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--db=postgres"
    - "--hostname-strict=false"
    - "--http-enabled=true"
    - "--proxy-headers=xforwarded"

  # External hostname (templates will add https:// for KC_HOSTNAME automatically)
  hostname: "devtest-customer-idp.tesserix.app"

  # Admin credentials (from sealed secret)
  admin:
    existingSecret: "keycloak-admin-credentials"
    usernameKey: "username"
    passwordKey: "password"

  # Database connection - Using shared PostgreSQL in postgresql-global namespace
  database:
    vendor: postgres
    host: "global-postgres-rw.global.svc.cluster.local"  # Shared PostgreSQL in global namespace
    port: 5432
    database: keycloak_customer  # Dedicated database for customer IDP
    username: global  # CNPG cluster owner user
    existingSecret: "keycloak-db-credentials"
    passwordKey: "password"

  # Redis/Infinispan cache configuration
  cache:
    enabled: true
    stack: "ispn"
    configFile: "cache-ispn.xml"

  # Features (Keycloak 26.0 compatible)
  features:
    - "token-exchange"
    - "admin-fine-grained-authz"
    - "organization"  # Multi-tenant identity isolation

  # Java options
  # IMPORTANT: -Xmx must be ~60% of container memory limit to leave room for
  # non-heap memory (Metaspace ~256MB, thread stacks, GC overhead, native memory)
  javaOpts: "-Xms512m -Xmx1280m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxMetaspaceSize=256m"

  # Resource limits
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi

  # Health probes - Keycloak 26.x uses management port 9000 for health endpoints
  livenessProbe:
    httpGet:
      path: /health/live
      port: 9000
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 9000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health/started
      port: 9000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  # Pod disruption budget
  # Use maxUnavailable instead of minAvailable to allow node drains with single replica
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  # Autoscaling (KEDA)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetMemoryUtilizationPercentage: 75

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # Ingress via Istio
  ingress:
    enabled: true
    className: ""
    annotations:
      kubernetes.io/ingress.class: istio
    hosts:
      - host: devtest-customer-idp.tesserix.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: customer-idp-tls
        hosts:
          - devtest-customer-idp.tesserix.app

  # Security context
  podSecurityContext:
    fsGroup: 1000

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  # Service account
  serviceAccount:
    create: true
    name: "keycloak"

  # Pod labels
  podLabels:
    app.kubernetes.io/part-of: identity-customer
    app.kubernetes.io/component: keycloak

  # Environment variables
  extraEnvVars:
    - name: KC_CACHE
      value: "ispn"
    - name: KC_CACHE_STACK
      value: "kubernetes"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KC_LOG_LEVEL
      value: "INFO"
    # Proxy configuration for running behind Istio/Kong
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    - name: KC_HTTP_ENABLED
      value: "true"
    # NOTE: KC_HOSTNAME_BACKCHANNEL_DYNAMIC is handled in deployment.yaml template
    # (only set to "true" when a fixed KC_HOSTNAME is configured)
    # Database connection pool settings - increase timeouts for startup
    - name: KC_DB_POOL_INITIAL_SIZE
      value: "1"
    - name: KC_DB_POOL_MIN_SIZE
      value: "1"
    - name: KC_DB_POOL_MAX_SIZE
      value: "10"
    # JDBC URL properties — tcpKeepAlive=true asks the OS to send TCP
    # keepalive probes on the DB socket so GKE Dataplane V2 / Cilium
    # conntrack doesn't evict the flow after ~5 min idle. socketTimeout
    # caps any single query at 60s so a half-dead socket is detected
    # instead of blocking an executor thread forever.
    - name: KC_DB_URL_PROPERTIES
      value: "?tcpKeepAlive=true&socketTimeout=60&tcpNoDelay=true"
    # Agroal pool tuning: recycle pooled connections every 4 minutes
    # (below the ~5 min conntrack idle window) and validate them in
    # the background every 30s so broken connections are discarded
    # before a real request picks them up. acquisition-timeout=60 is
    # kept from the original config so pod startup is tolerant of
    # Postgres being briefly unready.
    - name: JAVA_OPTS_APPEND
      value: "-Djgroups.dns.query=keycloak-headless.identity-customer.svc.cluster.local -Dquarkus.datasource.jdbc.acquisition-timeout=60 -Dquarkus.datasource.jdbc.max-lifetime=PT4M -Dquarkus.datasource.jdbc.background-validation-interval=PT30S -Dquarkus.datasource.jdbc.idle-removal-interval=PT1M"

# -----------------------------------------------------------------------------
# POSTGRESQL CONFIGURATION (Bitnami)
# -----------------------------------------------------------------------------
# DISABLED: Using shared PostgreSQL in postgresql-global namespace instead
keycloak-db:
  enabled: false

  # Use latest image (chart default may not exist)
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest

  # Architecture: standalone or replication
  architecture: replication

  # Authentication
  auth:
    database: keycloak
    username: keycloak
    existingSecret: "keycloak-db-credentials"
    secretKeys:
      userPasswordKey: "password"
      replicationPasswordKey: "replication-password"

  # Primary configuration
  primary:
    name: primary
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 50Gi
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 4Gi
    podLabels:
      app.kubernetes.io/part-of: identity-customer
      app.kubernetes.io/component: postgresql

  # Read replicas
  readReplicas:
    name: read
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 50Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 2Gi
    podLabels:
      app.kubernetes.io/part-of: identity-customer
      app.kubernetes.io/component: postgresql

  # Metrics
  metrics:
    enabled: true
    # Memory-only: without this the bitnami resourcesPreset default
    # supplies the exporter with cpu requests/limits.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      namespace: identity-customer

  # Network policy
  networkPolicy:
    enabled: true
    allowExternal: false

# -----------------------------------------------------------------------------
# REDIS CONFIGURATION (Bitnami)
# -----------------------------------------------------------------------------
keycloak-redis:
  enabled: true

  # Use latest image (chart default may not exist)
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest

  # Architecture: standalone or replication
  architecture: replication

  # Authentication
  auth:
    enabled: true
    existingSecret: "keycloak-redis-credentials"
    existingSecretPasswordKey: "password"

  # Master configuration
  master:
    count: 1
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 5Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 2Gi
    podLabels:
      app.kubernetes.io/part-of: identity-customer
      app.kubernetes.io/component: redis

  # Replica configuration
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    podLabels:
      app.kubernetes.io/part-of: identity-customer
      app.kubernetes.io/component: redis

  # Sentinel (for HA)
  sentinel:
    enabled: true
    masterSet: keycloak-master
    quorum: 2
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi

  # Metrics
  metrics:
    enabled: true
    # Memory-only: without this the bitnami resourcesPreset default
    # supplies the exporter with cpu requests/limits.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      namespace: identity-customer

  # Network policy
  networkPolicy:
    enabled: true
    allowExternal: false

# -----------------------------------------------------------------------------
# NETWORK POLICY
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true

# -----------------------------------------------------------------------------
# SERVICE MONITOR (Prometheus)
# -----------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  namespace: identity-customer
  interval: 30s
  scrapeTimeout: 10s

# -----------------------------------------------------------------------------
# ADMIN SSO CONFIGURATION
# -----------------------------------------------------------------------------
# Configures Google SSO for Keycloak admin console access
# Only specified super admins can access the admin console
adminSSO:
  enabled: false  # Set to true to enable admin SSO setup

  # Google OAuth credentials secret name
  # Must contain: client-id, client-secret
  googleCredentialsSecret: "keycloak-google-sso"

  # Apple Sign In credentials secret name (customer realm only)
  # Must contain: team-id, key-id, service-id, private-key
  # Leave empty ("") to skip Apple IDP setup. Set in ArgoCD app values when ready.
  appleCredentialsSecret: ""

  # Facebook/Meta OAuth credentials secret name (customer realm only)
  # Must contain: app-id, app-secret
  # Leave empty ("") to skip Facebook IDP setup. Set in ArgoCD app values when ready.
  facebookCredentialsSecret: ""

  # Twitter/X OAuth credentials secret name (fanzone realm only)
  # Must contain: api-key, api-secret
  # Leave empty ("") to skip Twitter IDP setup. Set in ArgoCD app values when ready.
  twitterCredentialsSecret: ""

  # Super admin email addresses (full access to Keycloak admin)
  superAdmins:
    - "unidevidp@gmail.com"
    - "mahesh.sangawar@gmail.com"
    - "samyak.rout@gmail.com"

  # Disable password login for default admin (keep as break-glass)
  # When true: admin user is disabled, must be manually re-enabled for emergencies
  # When false: password login remains available alongside SSO
  disablePasswordLogin: false

# -----------------------------------------------------------------------------
# FANZONE REALM CONFIGURATION
# -----------------------------------------------------------------------------
# Separate realm for FanZone Battle Ground cricket platform
# Uses same Google/Facebook OAuth credentials as tesserix-customer realm
fanzoneRealm:
  enabled: false  # Enable in ArgoCD prod app values
  domain: "fanzonebattleground.com"
  mobileScheme: "fanzone"

# -----------------------------------------------------------------------------
# HOMECHEF REALM CONFIGURATION
# -----------------------------------------------------------------------------
# Separate realm for HomeChef / Fe3dr home-cook tiffin platform
# Uses same Google/Facebook OAuth credentials as tesserix-customer realm
homechefRealm:
  enabled: false  # Enable in ArgoCD prod app values
  domain: "fe3dr.com"
  mobileScheme: "fe3dr"

# -----------------------------------------------------------------------------
# BLOG REALM CONFIGURATION
# -----------------------------------------------------------------------------
# Separate realm for Tesserix Engineering Blog
# Public users login via Google/Meta to comment, like, and review posts.
# Blog post authoring restricted to allowed emails in the blog app itself.
blogRealm:
  enabled: true
  domain: "blog.tesserix.app"
  identityDomain: "identity-blog.tesserix.app"
