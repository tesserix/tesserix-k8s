{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: photon
  labels:
    {{- include "photon.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: photon
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | default "InPlaceOrRecreate" }}
  resourcePolicy:
    containerPolicies:
      - containerName: photon
        minAllowed:
          memory: {{ .Values.vpa.minAllowed.memory | default "1Gi" }}
        maxAllowed:
          memory: {{ .Values.vpa.maxAllowed.memory | default "16Gi" }}
        controlledResources: ["memory"]
        controlledValues: RequestsAndLimits
      {{- if .Values.vpa.excludeIstioProxy }}
      - containerName: istio-proxy
        mode: "Off"
      {{- end }}
{{- end }}
