apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photon
  labels:
    {{- include "photon.labels" . | nindent 4 }}
spec:
  serviceName: photon
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "photon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "photon.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "photon.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: photon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            # rtuszik/photon-docker uses these env vars:
            # REGION - country/region code (e.g., australia-oceania, asia, planet)
            # BASE_URL - download URL for photon data
            {{- if .Values.config.countryCode }}
            - name: REGION
              value: "{{ .Values.config.countryCode }}"
            {{- end }}
            {{- if .Values.config.downloadUrl }}
            - name: BASE_URL
              value: "{{ .Values.config.downloadUrl }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.healthCheck.enabled }}
          {{- if .Values.startupProbe }}
          # Startup probe - allows time for initial data download (~118GB)
          # Liveness/readiness probes won't run until startup probe succeeds
          startupProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | default 60 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 240 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
