# Production overrides for photon
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation (geocoding needs memory)
resources:
  limits:
    memory: 8Gi
  requests:
    memory: 4Gi

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1
