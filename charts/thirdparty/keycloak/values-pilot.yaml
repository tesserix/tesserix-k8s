# Keycloak Pilot Environment Values
# This file contains overrides specific to the pilot environment

replicaCount: 2

keycloak:
  hostname: "pilot-auth.tesserix.app"
  proxy: "edge"
  logLevel: "INFO"
  javaOpts: "-Xms1024m -Xmx2048m"

  admin:
    username: admin
    existingSecret: "keycloak-admin-password"
    existingSecretKey: "admin-password"

  # Distributed cache for HA
  cache:
    stack: "kubernetes"

  features:
    - "token-exchange"
    - "admin-fine-grained-authz"
    - "preview"
    - "organization"  # Multi-tenant identity isolation

database:
  vendor: "postgres"
  host: "postgresql.database.svc.cluster.local"
  port: "5432"
  database: "keycloak"
  username: "keycloak"
  existingSecret: "keycloak-db-password"
  existingSecretKey: "password"
  poolInitialSize: "10"
  poolMinSize: "10"
  poolMaxSize: "50"

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: "pilot-auth.tesserix.app"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls
      hosts:
        - "pilot-auth.tesserix.app"

resources:
  requests:
    memory: 2Gi
  limits:
    memory: 4Gi

# Enable autoscaling for pilot
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

# Enable PDB for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Pod anti-affinity for HA
podAntiAffinity:
  enabled: true
  type: "soft"

networkPolicy:
  enabled: true
