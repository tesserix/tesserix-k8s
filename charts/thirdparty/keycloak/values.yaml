# Keycloak - Central Identity Provider for Tesseract Hub
# This chart deploys Keycloak as the unified IDP for all environments

# Number of replicas (1 for devtest, 2+ for production)
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "24.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations (e.g., for Istio, Prometheus)
podAnnotations:
  # Istio sidecar configuration
  sidecar.istio.io/inject: "true"
  # Exclude PostgreSQL and Redis ports from Istio sidecar
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"
  # Exclude GCP metadata server for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false  # Keycloak needs to write temp files

# Keycloak configuration
keycloak:
  # Admin user configuration
  admin:
    username: admin
    # Use existingSecret for production
    password: ""
    existingSecret: ""
    existingSecretKey: "admin-password"

  # Hostname configuration (environment-specific)
  hostname: ""  # e.g., dev-keycloak.tesserix.app
  hostnameStrict: false
  hostnameStrictHttps: true

  # Proxy configuration (for running behind Kong/Istio)
  proxy: edge
  httpEnabled: true
  httpPort: 8080
  httpsPort: 8443

  # Health and metrics
  healthEnabled: true
  metricsEnabled: true

  # Features
  features:
    - token-exchange
    - admin-fine-grained-authz
    - preview
    - organization  # Multi-tenant identity isolation

  # Logging
  logLevel: INFO
  logFormat: json

  # Cache configuration
  cache:
    # Use ispn for clustered mode, local for single instance
    stack: local
    # Redis configuration for distributed session storage
    redis:
      enabled: false
      host: "redis.redis.svc.cluster.local"
      port: 6379
      # Use existingSecret for password
      existingSecret: "keycloak-redis-password"
      existingSecretKey: "redis-password"
      # Connection settings
      socketTimeout: 10000
      connectionTimeout: 10000

  # Additional Java options
  javaOpts: "-Xms512m -Xmx1024m"

# Database configuration
database:
  vendor: postgres
  host: postgresql.database.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  # Use existingSecret for production
  password: ""
  existingSecret: ""
  existingSecretKey: "password"
  # Connection pool
  poolInitialSize: 5
  poolMinSize: 5
  poolMaxSize: 20

# Service configuration
service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: kong
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    konghq.com/strip-path: "false"
  hosts:
    - host: ""  # Set per environment: dev-keycloak.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls
      hosts: []  # Set per environment

# Resource limits
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

# Autoscaling (for production)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget (for production)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Node selection
nodeSelector: {}

tolerations: []

affinity: {}

# Pod anti-affinity for HA (automatically enabled when replicaCount > 1)
podAntiAffinity:
  enabled: true
  type: soft  # soft or hard

# Health probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# Network policy
networkPolicy:
  enabled: true
  # Allow ingress from these namespaces
  allowedNamespaces:
    - devtest
    - istio-system
    - kong
  # Allow ingress from pods with these labels
  allowedPodLabels: {}

# Extra environment variables
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# Extra environment variables from secrets/configmaps
extraEnvFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap

# Additional volumes
extraVolumes: []

# Additional volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# ============================================
# IDENTITY PROVIDERS CONFIGURATION
# ============================================

# Social Identity Providers (consumer-facing)
identityProviders:
  # Google OAuth2
  google:
    enabled: false
    clientId: ""
    # Use existingSecret for production
    existingSecret: "keycloak-idp-google"
    existingSecretKey: "client-secret"
    defaultScopes: "openid email profile"

  # Meta (Facebook) OAuth2
  meta:
    enabled: false
    clientId: ""
    existingSecret: "keycloak-idp-meta"
    existingSecretKey: "client-secret"
    defaultScopes: "email public_profile"

  # X (Twitter) OAuth2
  twitter:
    enabled: false
    clientId: ""
    existingSecret: "keycloak-idp-twitter"
    existingSecretKey: "client-secret"

  # Instagram OAuth2
  instagram:
    enabled: false
    clientId: ""
    existingSecret: "keycloak-idp-instagram"
    existingSecretKey: "client-secret"

  # WhatsApp (via Meta Business API)
  whatsapp:
    enabled: false
    # WhatsApp uses Meta Business API for authentication
    businessApiUrl: ""
    existingSecret: "keycloak-idp-whatsapp"
    existingSecretKey: "api-token"

  # Phone/SMS Authentication (via external provider like Twilio)
  phone:
    enabled: false
    provider: "twilio"  # twilio, vonage, aws-sns
    existingSecret: "keycloak-idp-phone"
    # Secret should contain: account-sid, auth-token, from-number

# Enterprise Identity Providers (B2B)
enterpriseIdp:
  # Microsoft Entra ID (Azure AD) - for hospitals/organizations
  azureAd:
    enabled: false
    # Template for tenant-specific configuration
    # Each tenant will have their own Azure AD app registration
    tenantId: ""  # Set per organization
    clientId: ""
    existingSecret: "keycloak-idp-azure"
    existingSecretKey: "client-secret"
    defaultScopes: "openid email profile User.Read"
    # Allow any Azure AD tenant (multi-tenant)
    multiTenant: true

  # Generic SAML 2.0 (for hospitals with custom SAML IDPs)
  saml:
    enabled: false
    # Placeholder for SAML metadata URL or XML
    metadataUrl: ""
    entityId: ""
    ssoServiceUrl: ""
    existingSecret: "keycloak-idp-saml"
    existingSecretKey: "signing-certificate"

  # Generic OIDC (for custom OpenID Connect providers)
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    existingSecret: "keycloak-idp-oidc"
    existingSecretKey: "client-secret"
    defaultScopes: "openid email profile"

# ============================================
# REALM CONFIGURATION (for automated setup)
# ============================================

# Realm import configuration
# Set realmImport.enabled to true and provide realm JSON
realmImport:
  enabled: false
  # Realm configurations will be mounted as JSON files
  realms: []
  # - name: tesseract-hub
  #   json: |
  #     {
  #       "realm": "tesseract-hub",
  #       "enabled": true,
  #       ...
  #     }

# ============================================
# ENVIRONMENT-SPECIFIC DEFAULTS
# ============================================

# DevTest environment defaults (override in ArgoCD Application)
# hostname: dev-keycloak.tesserix.app
# replicaCount: 1
# autoscaling.enabled: false
# podDisruptionBudget.enabled: false
# resources.requests.memory: 512Mi

# Pilot environment defaults
# hostname: pilot-keycloak.tesserix.app
# replicaCount: 2
# autoscaling.enabled: true
# autoscaling.minReplicas: 2
# autoscaling.maxReplicas: 3
# podDisruptionBudget.enabled: true
# resources.requests.memory: 1Gi

# Production environment defaults
# hostname: keycloak.tesserix.app
# replicaCount: 3
# autoscaling.enabled: true
# autoscaling.minReplicas: 3
# autoscaling.maxReplicas: 10
# podDisruptionBudget.enabled: true
# podDisruptionBudget.minAvailable: 2
# resources.requests.memory: 2Gi
# keycloak.cache.stack: ispn  # For clustering
