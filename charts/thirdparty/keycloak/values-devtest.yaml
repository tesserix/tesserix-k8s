# Keycloak DevTest Environment Values
# This file contains overrides specific to the devtest environment

replicaCount: 1

keycloak:
  hostname: "dev-auth.tesserix.app"
  proxy: "edge"
  logLevel: "INFO"
  javaOpts: "-Xms512m -Xmx1024m"

  admin:
    username: admin
    existingSecret: "keycloak-admin-password"
    existingSecretKey: "admin-password"

  cache:
    stack: "local"

  features:
    - "token-exchange"
    - "admin-fine-grained-authz"
    - "preview"
    - "organization"  # Multi-tenant identity isolation

database:
  vendor: "postgres"
  host: "postgresql.database.svc.cluster.local"
  port: "5432"
  database: "keycloak"
  username: "keycloak"
  existingSecret: "keycloak-db-password"
  existingSecretKey: "password"
  poolInitialSize: "5"
  poolMinSize: "5"
  poolMaxSize: "20"

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: "dev-auth.tesserix.app"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls
      hosts:
        - "dev-auth.tesserix.app"

resources:
  requests:
    memory: 1Gi
  limits:
    memory: 2Gi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false
