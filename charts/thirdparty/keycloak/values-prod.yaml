# Keycloak Production Environment Values
# This file contains overrides specific to the production environment

replicaCount: 3

keycloak:
  hostname: "auth.tesserix.app"
  proxy: "edge"
  logLevel: "WARN"
  javaOpts: "-Xms2048m -Xmx4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"

  admin:
    username: admin
    existingSecret: "keycloak-admin-password"
    existingSecretKey: "admin-password"

  # Distributed cache for HA
  cache:
    stack: "kubernetes"

  features:
    - "token-exchange"
    - "admin-fine-grained-authz"
    - "preview"
    - "organization"  # Multi-tenant identity isolation

database:
  vendor: "postgres"
  host: "postgresql.database.svc.cluster.local"
  port: "5432"
  database: "keycloak"
  username: "keycloak"
  existingSecret: "keycloak-db-password"
  existingSecretKey: "password"
  poolInitialSize: "20"
  poolMinSize: "20"
  poolMaxSize: "100"

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    # Rate limiting for production
    konghq.com/plugins: "rate-limiting-keycloak"
  hosts:
    - host: "auth.tesserix.app"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls
      hosts:
        - "auth.tesserix.app"

resources:
  requests:
    memory: 4Gi
  limits:
    memory: 8Gi

# Enable autoscaling for production
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max

# Enable PDB for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Hard pod anti-affinity for production
podAntiAffinity:
  enabled: true
  type: "hard"

networkPolicy:
  enabled: true

# Health probes - more lenient for production
livenessProbe:
  enabled: true
  initialDelaySeconds: 180
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5
  successThreshold: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60
  successThreshold: 1
