{{- if and .Values.keycloak.cache .Values.keycloak.cache.redis .Values.keycloak.cache.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-cache-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  cache-ispn.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <infinispan
        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="urn:infinispan:config:14.0 https://infinispan.org/schemas/infinispan-config-14.0.xsd"
        xmlns="urn:infinispan:config:14.0">

        <!-- Custom JGroups stack for Kubernetes -->
        <jgroups>
            <stack name="kubernetes" extends="tcp">
                <TCP bind_addr="${env.KC_CACHE_STACK_KUBERNETES_BIND_ADDR:SITE_LOCAL}"
                     bind_port="${env.KC_CACHE_STACK_KUBERNETES_BIND_PORT:7800}" />
                {{- if gt (int .Values.replicaCount) 1 }}
                <kubernetes.KUBE_PING />
                {{- else }}
                <MPING />
                {{- end }}
            </stack>
        </jgroups>

        <cache-container name="keycloak">
            <!-- Transport for clustering -->
            {{- if gt (int .Values.replicaCount) 1 }}
            <transport lock-timeout="60000" stack="kubernetes" />
            {{- end }}

            <!-- Local caches (not distributed) -->
            <local-cache name="realms">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <memory max-count="10000"/>
            </local-cache>

            <local-cache name="users">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <memory max-count="10000"/>
            </local-cache>

            <local-cache name="keys">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration max-idle="3600000"/>
                <memory max-count="1000"/>
            </local-cache>

            <local-cache name="authorization">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <memory max-count="10000"/>
            </local-cache>

            <!-- Distributed caches with Redis persistence -->
            <distributed-cache name="sessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <distributed-cache name="authenticationSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <distributed-cache name="offlineSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <distributed-cache name="clientSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <distributed-cache name="offlineClientSessions" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <distributed-cache name="loginFailures" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <distributed-cache name="actionTokens" owners="2">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration max-idle="-1" lifespan="-1" interval="300000"/>
                <persistence passivation="false">
                    <redis-store xmlns="urn:infinispan:config:store:redis:14.0"
                                 topology="CLUSTER"
                                 socket-timeout="${env.KC_CACHE_REDIS_SOCKET_TIMEOUT:10000}"
                                 connection-timeout="${env.KC_CACHE_REDIS_CONNECTION_TIMEOUT:10000}">
                        <redis-server host="${env.KC_CACHE_REDIS_HOST}" port="${env.KC_CACHE_REDIS_PORT:6379}"/>
                        <security>
                            <authentication username="${env.KC_CACHE_REDIS_USERNAME:default}" password="${env.KC_CACHE_REDIS_PASSWORD}"/>
                        </security>
                    </redis-store>
                </persistence>
            </distributed-cache>

            <!-- Work cache for cluster-wide invalidation -->
            <replicated-cache name="work">
                <encoding>
                    <key media-type="application/x-java-object"/>
                    <value media-type="application/x-java-object"/>
                </encoding>
                <expiration lifespan="-1"/>
            </replicated-cache>

        </cache-container>
    </infinispan>
{{- end }}
