apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start
            {{- if include "keycloak.hostname" . }}
            - --hostname={{ include "keycloak.hostname" . }}
            {{- end }}
            {{- if and .Values.keycloak.cache .Values.keycloak.cache.redis .Values.keycloak.cache.redis.enabled }}
            - --cache-config-file=/opt/keycloak/conf/cache-ispn.xml
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "keycloak.fullname" . }}-config
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Admin credentials
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.admin.username | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.adminSecretName" . }}
                  key: {{ .Values.keycloak.admin.existingSecretKey | default "admin-password" }}
            # Database password
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretKey | default "password" }}
            {{- if and .Values.keycloak.cache .Values.keycloak.cache.redis .Values.keycloak.cache.redis.enabled }}
            # Redis cache configuration
            - name: KC_CACHE_REDIS_HOST
              value: {{ .Values.keycloak.cache.redis.host | quote }}
            - name: KC_CACHE_REDIS_PORT
              value: {{ .Values.keycloak.cache.redis.port | quote }}
            - name: KC_CACHE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.cache.redis.existingSecret }}
                  key: {{ .Values.keycloak.cache.redis.existingSecretKey | default "redis-password" }}
            - name: KC_CACHE_REDIS_SOCKET_TIMEOUT
              value: {{ .Values.keycloak.cache.redis.socketTimeout | quote }}
            - name: KC_CACHE_REDIS_CONNECTION_TIMEOUT
              value: {{ .Values.keycloak.cache.redis.connectionTimeout | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.httpPort }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.keycloak.httpsPort }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # IDP Configuration mount (always available for reference)
            - name: idp-config
              mountPath: /opt/keycloak/data/import/idp
              readOnly: true
            {{- if and .Values.keycloak.cache .Values.keycloak.cache.redis .Values.keycloak.cache.redis.enabled }}
            # Custom cache configuration for Redis
            - name: cache-config
              mountPath: /opt/keycloak/conf/cache-ispn.xml
              subPath: cache-ispn.xml
              readOnly: true
            {{- end }}
            {{- if .Values.realmImport.enabled }}
            # Realm import mount
            - name: realm-config
              mountPath: /opt/keycloak/data/import/realms
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        # IDP Configuration ConfigMap
        - name: idp-config
          configMap:
            name: {{ include "keycloak.fullname" . }}-idp-config
        {{- if and .Values.keycloak.cache .Values.keycloak.cache.redis .Values.keycloak.cache.redis.enabled }}
        # Custom cache configuration for Redis
        - name: cache-config
          configMap:
            name: {{ include "keycloak.fullname" . }}-cache-config
        {{- end }}
        {{- if .Values.realmImport.enabled }}
        # Realm Configuration ConfigMap
        - name: realm-config
          configMap:
            name: {{ include "keycloak.fullname" . }}-realm
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.podAntiAffinity.enabled (gt (int .Values.replicaCount) 1) }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity.type "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "keycloak.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "keycloak.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
