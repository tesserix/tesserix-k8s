apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  # Keycloak configuration
  KC_PROXY: {{ .Values.keycloak.proxy | quote }}
  KC_HTTP_ENABLED: {{ .Values.keycloak.httpEnabled | quote }}
  KC_HTTP_PORT: {{ .Values.keycloak.httpPort | quote }}
  KC_HTTPS_PORT: {{ .Values.keycloak.httpsPort | quote }}
  KC_HOSTNAME_STRICT: {{ .Values.keycloak.hostnameStrict | quote }}
  KC_HOSTNAME_STRICT_HTTPS: {{ .Values.keycloak.hostnameStrictHttps | quote }}
  KC_HEALTH_ENABLED: {{ .Values.keycloak.healthEnabled | quote }}
  KC_METRICS_ENABLED: {{ .Values.keycloak.metricsEnabled | quote }}
  KC_LOG: "console"
  KC_LOG_LEVEL: {{ .Values.keycloak.logLevel | quote }}
  KC_LOG_CONSOLE_FORMAT: {{ .Values.keycloak.logFormat | quote }}
  KC_CACHE: {{ .Values.keycloak.cache.stack | quote }}

  # Database configuration
  KC_DB: {{ .Values.database.vendor | quote }}
  KC_DB_URL_HOST: {{ .Values.database.host | quote }}
  KC_DB_URL_PORT: {{ .Values.database.port | quote }}
  KC_DB_URL_DATABASE: {{ .Values.database.database | quote }}
  KC_DB_USERNAME: {{ .Values.database.username | quote }}
  KC_DB_POOL_INITIAL_SIZE: {{ .Values.database.poolInitialSize | quote }}
  KC_DB_POOL_MIN_SIZE: {{ .Values.database.poolMinSize | quote }}
  KC_DB_POOL_MAX_SIZE: {{ .Values.database.poolMaxSize | quote }}

  {{- if .Values.keycloak.features }}
  # Features
  KC_FEATURES: {{ join "," .Values.keycloak.features | quote }}
  {{- end }}

  # Java options
  JAVA_OPTS_APPEND: {{ .Values.keycloak.javaOpts | quote }}
