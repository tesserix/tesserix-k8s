{{- if .Values.realmImport.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  {{- range .Values.realmImport.realms }}
  {{ .name }}.json: |
    {{ .json | nindent 4 }}
  {{- end }}
{{- end }}
---
# IDP Configuration ConfigMap (always created for reference)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-idp-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  # Social Identity Providers Configuration
  # These can be imported via Keycloak Admin API or manually configured

  idp-google.json: |
    {
      "alias": "google",
      "providerId": "google",
      "enabled": {{ .Values.identityProviders.google.enabled }},
      "trustEmail": true,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "clientId": "{{ .Values.identityProviders.google.clientId }}",
        "defaultScope": "{{ .Values.identityProviders.google.defaultScopes }}",
        "syncMode": "IMPORT",
        "useJwksUrl": "true"
      }
    }

  idp-meta.json: |
    {
      "alias": "facebook",
      "providerId": "facebook",
      "enabled": {{ .Values.identityProviders.meta.enabled }},
      "trustEmail": true,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "clientId": "{{ .Values.identityProviders.meta.clientId }}",
        "defaultScope": "{{ .Values.identityProviders.meta.defaultScopes }}",
        "syncMode": "IMPORT"
      }
    }

  idp-twitter.json: |
    {
      "alias": "twitter",
      "providerId": "twitter",
      "enabled": {{ .Values.identityProviders.twitter.enabled }},
      "trustEmail": false,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "clientId": "{{ .Values.identityProviders.twitter.clientId }}",
        "syncMode": "IMPORT"
      }
    }

  idp-instagram.json: |
    {
      "alias": "instagram",
      "providerId": "instagram",
      "enabled": {{ .Values.identityProviders.instagram.enabled }},
      "trustEmail": false,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "clientId": "{{ .Values.identityProviders.instagram.clientId }}",
        "syncMode": "IMPORT"
      }
    }

  # Enterprise Identity Providers Configuration

  idp-azure-ad.json: |
    {
      "alias": "microsoft",
      "providerId": "oidc",
      "enabled": {{ .Values.enterpriseIdp.azureAd.enabled }},
      "trustEmail": true,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "clientId": "{{ .Values.enterpriseIdp.azureAd.clientId }}",
        {{- if .Values.enterpriseIdp.azureAd.multiTenant }}
        "tokenUrl": "https://login.microsoftonline.com/common/oauth2/v2.0/token",
        "authorizationUrl": "https://login.microsoftonline.com/common/oauth2/v2.0/authorize",
        "logoutUrl": "https://login.microsoftonline.com/common/oauth2/v2.0/logout",
        {{- else }}
        "tokenUrl": "https://login.microsoftonline.com/{{ .Values.enterpriseIdp.azureAd.tenantId }}/oauth2/v2.0/token",
        "authorizationUrl": "https://login.microsoftonline.com/{{ .Values.enterpriseIdp.azureAd.tenantId }}/oauth2/v2.0/authorize",
        "logoutUrl": "https://login.microsoftonline.com/{{ .Values.enterpriseIdp.azureAd.tenantId }}/oauth2/v2.0/logout",
        {{- end }}
        "userInfoUrl": "https://graph.microsoft.com/oidc/userinfo",
        "jwksUrl": "https://login.microsoftonline.com/common/discovery/v2.0/keys",
        "issuer": "https://login.microsoftonline.com/{tenantid}/v2.0",
        "defaultScope": "{{ .Values.enterpriseIdp.azureAd.defaultScopes }}",
        "syncMode": "IMPORT",
        "useJwksUrl": "true",
        "validateSignature": "true",
        "clientAuthMethod": "client_secret_post"
      }
    }

  idp-saml-template.json: |
    {
      "alias": "saml-enterprise",
      "providerId": "saml",
      "enabled": {{ .Values.enterpriseIdp.saml.enabled }},
      "trustEmail": true,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "entityId": "{{ .Values.enterpriseIdp.saml.entityId }}",
        "singleSignOnServiceUrl": "{{ .Values.enterpriseIdp.saml.ssoServiceUrl }}",
        "validateSignature": "true",
        "signingCertificate": "",
        "nameIDPolicyFormat": "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress",
        "principalType": "ATTRIBUTE",
        "principalAttribute": "email",
        "syncMode": "IMPORT"
      }
    }

  idp-oidc-template.json: |
    {
      "alias": "oidc-enterprise",
      "providerId": "oidc",
      "enabled": {{ .Values.enterpriseIdp.oidc.enabled }},
      "trustEmail": true,
      "storeToken": false,
      "addReadTokenRoleOnCreate": false,
      "authenticateByDefault": false,
      "linkOnly": false,
      "firstBrokerLoginFlowAlias": "first broker login",
      "config": {
        "clientId": "{{ .Values.enterpriseIdp.oidc.clientId }}",
        "issuer": "{{ .Values.enterpriseIdp.oidc.issuerUrl }}",
        "defaultScope": "{{ .Values.enterpriseIdp.oidc.defaultScopes }}",
        "syncMode": "IMPORT",
        "useJwksUrl": "true",
        "validateSignature": "true"
      }
    }

  # Phone/SMS Authentication Provider Configuration (Twilio)
  phone-auth-config.json: |
    {
      "providerId": "phone-auth",
      "provider": "{{ .Values.identityProviders.phone.provider }}",
      "enabled": {{ .Values.identityProviders.phone.enabled }},
      "config": {
        "provider": "{{ .Values.identityProviders.phone.provider }}",
        "countryCode": "+1",
        "messageTemplate": "Your verification code is: {code}",
        "codeLength": 6,
        "codeValiditySeconds": 300
      }
    }

  # Default Realm Configuration Template
  tesseract-hub-realm.json: |
    {
      "realm": "tesseract-hub",
      "enabled": true,
      "displayName": "Tesseract Hub",
      "displayNameHtml": "<div class=\"kc-logo-text\"><span>Tesseract Hub</span></div>",
      "registrationAllowed": true,
      "registrationEmailAsUsername": true,
      "rememberMe": true,
      "verifyEmail": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "sslRequired": "external",
      "defaultSignatureAlgorithm": "RS256",
      "accessTokenLifespan": 300,
      "accessTokenLifespanForImplicitFlow": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "offlineSessionIdleTimeout": 2592000,
      "offlineSessionMaxLifespanEnabled": false,
      "accessCodeLifespan": 60,
      "accessCodeLifespanLogin": 1800,
      "accessCodeLifespanUserAction": 300,
      "actionTokenGeneratedByAdminLifespan": 43200,
      "actionTokenGeneratedByUserLifespan": 300,
      "smtpServer": {},
      "loginTheme": "keycloak",
      "accountTheme": "keycloak.v3",
      "adminTheme": "keycloak",
      "emailTheme": "keycloak",
      "internationalizationEnabled": true,
      "supportedLocales": ["en", "es", "fr", "de", "pt-BR"],
      "defaultLocale": "en",
      "browserSecurityHeaders": {
        "contentSecurityPolicyReportOnly": "",
        "xContentTypeOptions": "nosniff",
        "referrerPolicy": "no-referrer",
        "xRobotsTag": "none",
        "xFrameOptions": "SAMEORIGIN",
        "contentSecurityPolicy": "frame-src 'self'; frame-ancestors 'self'; object-src 'none';",
        "xXSSProtection": "1; mode=block",
        "strictTransportSecurity": "max-age=31536000; includeSubDomains"
      },
      "passwordPolicy": "length(8) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)",
      "requiredActions": [
        "TERMS_AND_CONDITIONS",
        "UPDATE_PASSWORD",
        "VERIFY_EMAIL"
      ],
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Platform administrator"
          },
          {
            "name": "tenant-admin",
            "description": "Tenant administrator"
          },
          {
            "name": "staff",
            "description": "Staff member"
          },
          {
            "name": "user",
            "description": "Regular user"
          }
        ]
      },
      "groups": [
        {
          "name": "Administrators",
          "path": "/Administrators",
          "realmRoles": ["admin"]
        },
        {
          "name": "Tenants",
          "path": "/Tenants"
        }
      ],
      "scopeMappings": [],
      "clientScopes": [
        {
          "name": "tenant",
          "description": "Tenant-specific scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "defaultDefaultClientScopes": ["profile", "email", "roles", "web-origins"],
      "defaultOptionalClientScopes": ["offline_access", "tenant"]
    }
