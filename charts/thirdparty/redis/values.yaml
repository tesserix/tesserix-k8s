# Redis image configuration
image:
  repository: redis
  tag: "8.0-alpine"
  pullPolicy: IfNotPresent

# Number of replicas (1 for standalone)
replicaCount: 1

# Authentication settings
auth:
  # Enable password authentication
  enabled: true
  # Password - if empty, a random password will be generated
  password: ""
  # Use existing secret (secret must have 'redis-password' key)
  existingSecret: ""

# Resource limits and requests
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

# Persistence configuration
persistence:
  enabled: true
  storageClass: "standard-rwo"  # GKE Standard SSD
  accessMode: ReadWriteOnce
  size: 8Gi

# Service configuration
service:
  type: ClusterIP
  port: 6379

# Internal LoadBalancer for Cloud Run VPC connector access
ilb:
  enabled: false

# Security context
podSecurityContext:
  fsGroup: 999
  runAsUser: 999
  runAsGroup: 999
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
