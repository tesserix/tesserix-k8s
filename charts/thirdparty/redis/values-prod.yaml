# Production overrides for redis
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production cluster mode
architecture: replication

# Production resource allocation
master:
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 512Mi
  persistence:
    size: 10Gi

replica:
  replicaCount: 2
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 512Mi
  persistence:
    size: 10Gi

# High availability settings
sentinel:
  enabled: true

# Internal LoadBalancer for Cloud Run VPC connector access
ilb:
  enabled: false
