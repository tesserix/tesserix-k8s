{{- if .Values.ilb.enabled }}
# Internal LoadBalancer for Cloud Run VPC connector access
# Provides a stable VPC IP that Cloud Run services can reach via VPC connector
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}-ilb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  ports:
    - port: {{ .Values.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "redis.selectorLabels" . | nindent 4 }}
{{- end }}
