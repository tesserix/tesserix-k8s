apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}-config
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    # Redis configuration
    bind 0.0.0.0
    port 6379
    dir /data
    appendonly yes
    appendfsync everysec
    maxmemory 3gb
    maxmemory-policy allkeys-lru
