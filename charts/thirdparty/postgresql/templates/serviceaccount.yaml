apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  {{- if and .Values.ssl.enabled (and .Values.ssl.gcp .Values.ssl.gcp.projectId) }}
  annotations:
    # Workload Identity for GCP Secret Manager access
    iam.gke.io/gcp-service-account: postgresql-ssl@{{ .Values.ssl.gcp.projectId }}.iam.gserviceaccount.com
  {{- end }}
