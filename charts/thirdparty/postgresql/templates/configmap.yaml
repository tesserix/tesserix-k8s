apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-config
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = {{ .Values.config.maxConnections }}
    shared_buffers = {{ .Values.config.sharedBuffers }}
    effective_cache_size = {{ .Values.config.effectiveCacheSize }}
    maintenance_work_mem = {{ .Values.config.maintenanceWorkMem }}
    wal_buffers = {{ .Values.config.walBuffers }}
    checkpoint_completion_target = {{ .Values.config.checkpointCompletionTarget }}
    random_page_cost = {{ .Values.config.randomPageCost }}
    effective_io_concurrency = {{ .Values.config.effectiveIOConcurrency }}
    log_timezone = 'UTC'
    datestyle = 'iso, mdy'
    timezone = 'UTC'
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'
    default_text_search_config = 'pg_catalog.english'
    {{- if .Values.ssl.enabled }}
    # SSL Configuration
    ssl = on
    ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
    ssl_key_file = '/var/lib/postgresql/ssl/server.key'
    ssl_ca_file = '/var/lib/postgresql/ssl/ca.crt'
    ssl_min_protocol_version = 'TLSv1.2'
    ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
    {{- end }}

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    # Localhost - includes Istio sidecar (127.0.0.6)
    host    all             all             127.0.0.0/8             md5
    host    all             all             ::1/128                 md5
    {{- if .Values.ssl.enabled }}
    # SSL required for remote connections (pod network)
    hostssl all             all             10.0.0.0/8              md5
    hostssl all             all             172.16.0.0/12           md5
    hostssl all             all             192.168.0.0/16          md5
    hostssl all             all             0.0.0.0/0               md5
    {{- else }}
    # Allow connections from within the cluster (pod network)
    host    all             all             10.0.0.0/8              md5
    host    all             all             172.16.0.0/12           md5
    host    all             all             192.168.0.0/16          md5
    host    all             all             0.0.0.0/0               md5
    {{- end }}
