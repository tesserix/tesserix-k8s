apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgresql.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Disable Istio sidecar for PostgreSQL - not needed since we exclude port 5432
        # and it simplifies init container networking
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "postgresql.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.ssl.enabled }}
      initContainers:
        - name: prepare-ssl-certs
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -ex
              echo "Preparing SSL certificates..."

              # Copy from secret to emptyDir with correct permissions
              cp /ssl-secret/server.crt /ssl-certs/server.crt
              cp /ssl-secret/server.key /ssl-certs/server.key
              cp /ssl-secret/ca.crt /ssl-certs/ca.crt

              # PostgreSQL requires key to be readable only by owner
              chmod 600 /ssl-certs/server.key
              chmod 644 /ssl-certs/server.crt /ssl-certs/ca.crt
              chown -R 999:999 /ssl-certs

              echo "SSL certificates ready!"
              ls -la /ssl-certs/
          volumeMounts:
            - name: ssl-secret
              mountPath: /ssl-secret
              readOnly: true
            - name: ssl-certs
              mountPath: /ssl-certs
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              memory: 8Mi
            limits:
              memory: 16Mi
      {{- end }}
      containers:
        - name: postgresql
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: tcp-postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U {{ .Values.postgresql.username | quote }} -d {{ .Values.postgresql.database | quote }} -h 127.0.0.1 -p 5432
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U {{ .Values.postgresql.username | quote }} -d {{ .Values.postgresql.database | quote }} -h 127.0.0.1 -p 5432
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
            {{- if .Values.ssl.enabled }}
            - name: ssl-certs
              mountPath: /var/lib/postgresql/ssl
              readOnly: true
            {{- end }}
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
      volumes:
        - name: config
          configMap:
            name: {{ include "postgresql.fullname" . }}-config
        {{- if .Values.ssl.enabled }}
        - name: ssl-secret
          secret:
            secretName: {{ .Values.ssl.existingSecret | default "postgresql-ssl-certs" }}
        - name: ssl-certs
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
