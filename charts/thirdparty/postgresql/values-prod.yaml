# Production overrides for postgresql
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production resource allocation
primary:
  resources:
    limits:
      memory: 8Gi
    requests:
      memory: 2Gi
  persistence:
    size: 60Gi

# Enable replication for production HA
replication:
  enabled: true
  readReplicas: 2

# Production configuration
postgresqlMaxConnections: 500

# Internal LoadBalancer for Cloud Run VPC connector access
ilb:
  enabled: true
