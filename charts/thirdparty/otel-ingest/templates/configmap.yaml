apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-ingest.name" . }}-config
  labels:
    {{- include "otel-ingest.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.ports.health }}

    receivers:
      kafka/observability:
        brokers:
          {{- range .Values.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        client_id: otel-ingest-clickhouse
        group_id: {{ .Values.kafka.observabilityGroupID | quote }}
        initial_offset: {{ .Values.kafka.initialOffset }}
        logs:
          topics: [{{ .Values.kafka.topics.logs | quote }}]
          encoding: otlp_proto
        traces:
          topics: [{{ .Values.kafka.topics.traces | quote }}]
          encoding: otlp_proto
        metrics:
          topics: [{{ .Values.kafka.topics.metrics | quote }}]
          encoding: otlp_proto
        message_marking:
          after: true
          on_error: false

      kafka/ai:
        brokers:
          {{- range .Values.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        client_id: otel-ingest-langfuse
        group_id: {{ .Values.kafka.aiGroupID | quote }}
        initial_offset: {{ .Values.kafka.initialOffset }}
        traces:
          topics: [{{ .Values.kafka.topics.aiTraces | quote }}]
          encoding: otlp_proto
        message_marking:
          # Commit only AFTER the batch was handed to the exporters, so a crash
          # replays instead of loses.
          after: true
          on_error: false

    processors:
      memory_limiter:
        check_interval: {{ .Values.processors.memoryLimiter.checkInterval }}
        limit_percentage: {{ .Values.processors.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.processors.memoryLimiter.spikeLimitPercentage }}

      batch:
        send_batch_size: {{ .Values.processors.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.processors.batch.sendBatchMaxSize }}
        timeout: {{ .Values.processors.batch.timeout }}

    connectors:
      # Both attributes are required. A missing or unknown environment is
      # dropped instead of falling through to another project's credentials.
      routing:
        default_pipelines: [traces/unrouted]
        error_mode: ignore
        table:
          {{- range .Values.routes }}
          {{- if .enabled }}
          - context: resource
            condition: attributes["service.namespace"] == {{ .product | quote }} and attributes["deployment.environment.name"] == {{ .environment | quote }}
            pipelines: [traces/{{ .name }}]
          {{- end }}
          {{- end }}

    exporters:
      clickhouse:
        endpoint: {{ .Values.clickhouse.endpoint | quote }}
        database: {{ .Values.clickhouse.database | quote }}
        username: {{ .Values.clickhouse.username | quote }}
        password: ${env:CLICKHOUSE_PASSWORD}
        cluster_name: {{ .Values.clickhouse.clusterName | quote }}
        table_engine:
          name: {{ .Values.clickhouse.tableEngine | quote }}
        create_schema: {{ .Values.clickhouse.createSchema }}
        ttl: {{ .Values.clickhouse.ttl }}
        async_insert: {{ .Values.clickhouse.asyncInsert }}
        compress: {{ .Values.clickhouse.compress }}
        sending_queue:
          enabled: true
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          max_elapsed_time: 0

      {{- range .Values.routes }}
      {{- if .enabled }}
      otlphttp/{{ .name }}:
        traces_endpoint: {{ $.Values.langfuse.endpoint | quote }}
        headers:
          # Basic pk:sk, base64-encoded by the ExternalSecret template.
          Authorization: "Basic ${env:LANGFUSE_{{ .name | upper | replace "-" "_" }}_AUTH}"
        timeout: {{ $.Values.exporter.timeout }}
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: {{ $.Values.exporter.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: {{ $.Values.exporter.retry.initialInterval }}
          max_interval: {{ $.Values.exporter.retry.maxInterval }}
          max_elapsed_time: {{ $.Values.exporter.retry.maxElapsedTime }}
      {{- end }}
      {{- end }}
      nop: {}

    service:
      extensions:
        - health_check
      pipelines:
        traces/observability:
          receivers: [kafka/observability]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        logs:
          receivers: [kafka/observability]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [kafka/observability]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        traces/ai:
          receivers: [kafka/ai]
          processors: [memory_limiter]
          exporters: [routing]
        {{- range .Values.routes }}
        {{- if .enabled }}
        traces/{{ .name }}:
          receivers: [routing]
          processors: [batch]
          exporters: [otlphttp/{{ .name }}]
        {{- end }}
        {{- end }}
        traces/unrouted:
          receivers: [routing]
          processors: []
          exporters: [nop]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.ports.metrics }}
