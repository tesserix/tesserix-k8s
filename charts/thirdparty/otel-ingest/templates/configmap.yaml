apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-ingest.name" . }}-config
  labels:
    {{- include "otel-ingest.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.ports.health }}

    receivers:
      kafka:
        brokers:
          {{- range .Values.kafka.brokers }}
          - {{ . | quote }}
          {{- end }}
        client_id: otel-ingest
        group_id: {{ .Values.kafka.groupID | quote }}
        initial_offset: {{ .Values.kafka.initialOffset }}
        traces:
          topics: [{{ .Values.kafka.topics.traces | quote }}]
          encoding: otlp_proto
        message_marking:
          # Commit only AFTER the batch was handed to the exporters, so a crash
          # replays instead of loses.
          after: true
          on_error: false

    processors:
      memory_limiter:
        check_interval: {{ .Values.processors.memoryLimiter.checkInterval }}
        limit_percentage: {{ .Values.processors.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.processors.memoryLimiter.spikeLimitPercentage }}

      batch:
        send_batch_size: {{ .Values.processors.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.processors.batch.sendBatchMaxSize }}
        timeout: {{ .Values.processors.batch.timeout }}

    connectors:
      # Each product's spans go to that product's Langfuse project. Anything
      # without a known product is counted and dropped, never mixed in.
      routing:
        default_pipelines: [traces/unrouted]
        error_mode: ignore
        table:
          {{- range .Values.routes }}
          - context: resource
            condition: attributes["service.namespace"] == {{ .product | quote }}
            pipelines: [traces/{{ .product }}]
          {{- end }}

    exporters:
      {{- range .Values.routes }}
      otlphttp/{{ .product }}:
        traces_endpoint: {{ $.Values.langfuse.endpoint | quote }}
        headers:
          # Basic pk:sk, base64-encoded by the ExternalSecret template.
          Authorization: "Basic ${env:LANGFUSE_{{ .product | upper }}_AUTH}"
        timeout: {{ $.Values.exporter.timeout }}
        compression: gzip
        sending_queue:
          enabled: true
          queue_size: {{ $.Values.exporter.queueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: {{ $.Values.exporter.retry.initialInterval }}
          max_interval: {{ $.Values.exporter.retry.maxInterval }}
          max_elapsed_time: {{ $.Values.exporter.retry.maxElapsedTime }}
      {{- end }}
      nop: {}

    service:
      extensions:
        - health_check
      pipelines:
        traces/in:
          receivers: [kafka]
          processors: [memory_limiter]
          exporters: [routing]
        {{- range .Values.routes }}
        traces/{{ .product }}:
          receivers: [routing]
          processors: [batch]
          exporters: [otlphttp/{{ .product }}]
        {{- end }}
        traces/unrouted:
          receivers: [routing]
          processors: []
          exporters: [nop]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.ports.metrics }}
