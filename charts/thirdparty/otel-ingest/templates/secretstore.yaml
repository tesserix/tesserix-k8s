apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.langfuse.externalSecret.serviceAccount.name }}
  labels:
    {{- include "otel-ingest.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.langfuse.externalSecret.serviceAccount.gcpServiceAccount | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.langfuse.externalSecret.dedicatedStoreName }}
  labels:
    {{- include "otel-ingest.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.langfuse.externalSecret.projectID | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.langfuse.externalSecret.workloadIdentity.clusterLocation | quote }}
          clusterName: {{ .Values.langfuse.externalSecret.workloadIdentity.clusterName | quote }}
          clusterProjectID: {{ .Values.langfuse.externalSecret.workloadIdentity.clusterProjectID | quote }}
          serviceAccountRef:
            name: {{ .Values.langfuse.externalSecret.serviceAccount.name }}
