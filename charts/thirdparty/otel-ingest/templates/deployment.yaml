{{/*
A Deployment, not a StatefulSet: this tier holds no local state. Its position
in the stream is the committed Kafka offset, which lives in Redpanda, so any
replica can take over any partition after a preemption.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-ingest.name" . }}
  labels:
    {{- include "otel-ingest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "otel-ingest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "otel-ingest.selectorLabels" . | nindent 8 }}
        {{- include "otel-ingest.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "otel-ingest.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Time to finish the in-flight batch and commit its offset, so a restart
      # replays as little as possible.
      terminationGracePeriodSeconds: 60
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - --config=/conf/config.yaml
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.env.secretName }}
                  key: {{ .Values.clickhouse.env.secretKey }}
            {{- range .Values.routes }}
            # Optional: a product whose key pair is not mirrored yet must not
            # keep the other products' traces from flowing.
            - name: LANGFUSE_{{ .product | upper }}_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "otel-ingest.name" $ }}-langfuse-{{ .product }}
                  key: auth
                  optional: true
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.ports.health }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-ingest.name" . }}-config
