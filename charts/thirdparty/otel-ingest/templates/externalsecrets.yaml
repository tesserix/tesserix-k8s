{{/*
One Secret per product route holding the ready-made Basic auth value, so the
collector config never sees a raw key and needs no shell to encode one.
*/}}
{{- range .Values.routes }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "otel-ingest.name" $ }}-langfuse-{{ .name }}
  labels:
    {{- include "otel-ingest.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.langfuse.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .secretStoreKind | default $.Values.langfuse.externalSecret.storeKind }}
    name: {{ .secretStoreName | default $.Values.langfuse.externalSecret.storeName }}
  target:
    name: {{ include "otel-ingest.name" $ }}-langfuse-{{ .name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth: '{{ "{{" }} printf "%s:%s" .publicKey .secretKey | b64enc {{ "}}" }}'
  data:
    - secretKey: publicKey
      remoteRef:
        key: {{ .publicKeySecret }}
    - secretKey: secretKey
      remoteRef:
        key: {{ .secretKeySecret }}
{{- end }}
