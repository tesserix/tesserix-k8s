apiVersion: v2
name: otel-ingest
description: |
  OpenTelemetry Collector — ingest tier. Consumes the ai.traces Redpanda topic
  and routes each product's spans to its own Langfuse project over OTLP/HTTP.

  This is the consumer side of the buffer and the only component that talks to
  Langfuse. A Langfuse outage stalls this tier, the backlog accumulates in
  Redpanda, and agents never notice.

  Offsets are committed only AFTER a batch reaches the exporters
  (message_marking.after), so a crash mid-batch replays rather than loses.
  Delivery is at-least-once; span ids are derived from the ADK run id, so a
  replay upserts in Langfuse rather than duplicating.

  Config schema targets collector v0.156.0.
type: application
version: 2.0.1
appVersion: "0.156.0"
