# OTel Collector ingest tier — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/otel-ingest.yaml (the redis-global pattern).

# Consumers in one Kafka consumer group. Scaling up to the partition count (6)
# increases parallelism; beyond that the extra pods idle.
# Consumes the general observability stream into ClickHouse and independently
# routes the AI trace stream into per-product Langfuse projects.
replicaCount: 2

image:
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  # Pinned third-party tag: re-pulling gains nothing.
  pullPolicy: IfNotPresent

ports:
  metrics: 8888
  health: 13133

kafka:
  brokers:
    - redpanda.observability.svc.cluster.local:9092
  # protocol_version is deliberately NOT set: it is a MINIMUM and every value
  # tried exceeded what this Redpanda offers for JoinGroup, so the group never
  # formed. Empty lets franz-go negotiate.
  observabilityGroupID: otel-ingest-clickhouse
  aiGroupID: otel-ingest-langfuse
  # First start with no committed offset reads the whole retained backlog.
  initialOffset: earliest
  topics:
    logs: otel.logs
    traces: otel.traces
    metrics: otel.metrics
    aiTraces: ai.traces

clickhouse:
  endpoint: "tcp://clickhouse.observability.svc.cluster.local:9000?dial_timeout=10s"
  database: otel
  username: default
  clusterName: otel
  tableEngine: ReplicatedMergeTree
  createSchema: true
  ttl: 720h
  asyncInsert: true
  compress: lz4
  env:
    secretName: clickhouse-secrets
    secretKey: clickhouse-password

langfuse:
  # In-cluster Langfuse OTLP endpoint; the exporter appends nothing.
  endpoint: http://langfuse-web.observability.svc.cluster.local:3000/api/public/otel/v1/traces
  externalSecret:
    storeName: gcp-secret-store
    storeKind: ClusterSecretStore
    dedicatedStoreName: otel-ingest-gcp
    refreshInterval: 1h
    projectID: tesseracthub-480811
    serviceAccount:
      name: otel-ingest-secrets
      gcpServiceAccount: otel-ingest-secrets@tesseracthub-480811.iam.gserviceaccount.com
    workloadIdentity:
      clusterLocation: asia-south1
      clusterName: tesseract-prod-in-gke
      clusterProjectID: tesseracthub-480811

# Each route requires a product and deployment environment match. This keeps
# sandbox/evaluation traces in the product's development project and prevents
# a product-only match from crossing the dev/prod boundary. Unknown pairs are
# dropped by the routing connector's default pipeline.
routes:
  - name: kora-dev
    enabled: true
    product: kora
    environment: dev
    publicKeySecret: dev-kora-langfuse-public-key
    secretKeySecret: dev-kora-langfuse-secret-key
    secretStoreKind: SecretStore
    secretStoreName: otel-ingest-gcp
  - name: kora-prod
    enabled: true
    product: kora
    environment: prod
    publicKeySecret: prod-kora-langfuse-public-key
    secretKeySecret: prod-kora-langfuse-secret-key
    secretStoreKind: SecretStore
    secretStoreName: otel-ingest-gcp
  - name: sre-prod
    enabled: false
    product: sre
    environment: prod
    publicKeySecret: prod-sre-langfuse-public-key
    secretKeySecret: prod-sre-langfuse-secret-key
  - name: devai-prod
    enabled: true
    product: devai
    environment: prod
    publicKeySecret: prod-devai-langfuse-public-key
    secretKeySecret: prod-devai-langfuse-secret-key
  - name: australis-prod
    enabled: false
    product: australis
    environment: prod
    publicKeySecret: prod-australis-langfuse-public-key
    secretKeySecret: prod-australis-langfuse-secret-key
  - name: ocr-prod
    enabled: false
    product: ocr
    environment: prod
    publicKeySecret: prod-ocr-langfuse-public-key
    secretKeySecret: prod-ocr-langfuse-secret-key

processors:
  memoryLimiter:
    checkInterval: 5s
    limitPercentage: 80
    spikeLimitPercentage: 25
  batch:
    sendBatchSize: 512
    sendBatchMaxSize: 1024
    timeout: 5s

exporter:
  timeout: 15s
  # Memory-only queue: the durable copy is Redpanda and offsets commit only
  # after export, so a restart re-consumes rather than loses.
  queueSize: 5000
  retry:
    initialInterval: 5s
    maxInterval: 60s
    # Give up after this long so one product's outage never wedges the
    # consumer group for the others; the batch stays in Redpanda for replay.
    maxElapsedTime: 900s

# Memory-only per platform policy: no CPU requests or limits anywhere.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  workload: infrastructure

tolerations: []
