# OTel Collector ingest tier — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/otel-ingest.yaml (the redis-global pattern).

# Consumers in one Kafka consumer group. Scaling up to the partition count (6)
# increases parallelism; beyond that the extra pods idle.
# Revived 2026-09-03 as the Kafka -> Langfuse router (docs/ai-trace-pipeline.md).
replicaCount: 2

image:
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  # Pinned third-party tag: re-pulling gains nothing.
  pullPolicy: IfNotPresent

ports:
  metrics: 8888
  health: 13133

kafka:
  brokers:
    - redpanda.observability.svc.cluster.local:9092
  # protocol_version is deliberately NOT set: it is a MINIMUM and every value
  # tried exceeded what this Redpanda offers for JoinGroup, so the group never
  # formed. Empty lets franz-go negotiate.
  groupID: otel-ingest
  # First start with no committed offset reads the whole retained backlog.
  initialOffset: earliest
  topics:
    traces: ai.traces

langfuse:
  # In-cluster Langfuse OTLP endpoint; the exporter appends nothing.
  endpoint: http://langfuse-web.observability.svc.cluster.local:3000/api/public/otel/v1/traces
  externalSecret:
    storeName: gcp-secret-store
    refreshInterval: 1h

# One route per product: spans whose resource service.namespace matches
# `product` go to that product's Langfuse project with its own key pair. The
# evals-onboarding operator mirrors each pair to prod-<product>-langfuse-*;
# until a pair exists the route's auth header is empty and Langfuse rejects it,
# which shows up as otelcol_exporter_send_failed_spans{exporter="otlphttp/<product>"}.
routes:
  - product: kora
  - product: sre
  - product: devai
  - product: australis
  - product: ocr

processors:
  memoryLimiter:
    checkInterval: 5s
    limitPercentage: 80
    spikeLimitPercentage: 25
  batch:
    sendBatchSize: 512
    sendBatchMaxSize: 1024
    timeout: 5s

exporter:
  timeout: 15s
  # Memory-only queue: the durable copy is Redpanda and offsets commit only
  # after export, so a restart re-consumes rather than loses.
  queueSize: 5000
  retry:
    initialInterval: 5s
    maxInterval: 60s
    # Give up after this long so one product's outage never wedges the
    # consumer group for the others; the batch stays in Redpanda for replay.
    maxElapsedTime: 900s

# Memory-only per platform policy: no CPU requests or limits anywhere.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  workload: infrastructure

tolerations: []
