# OTel Collector ingest tier — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/otel-ingest.yaml (the redis-global pattern).

# Consumers in one Kafka consumer group. Scaling this up to the partition count
# (6) increases ingest parallelism; beyond that the extra pods idle.
# PARKED 2026-08-01 at 0 for cost — restore to 2 to revive; see docs/observability-park.md
replicaCount: 0

image:
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  # On a Spot pool every preemption re-pulls this image, so keeping the pull
  # inside asia-south1 removes both the egress cost and a slow cold start.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  # IfNotPresent, deliberately. This is a third-party image on a pinned tag, so
  # the content behind that tag never changes and re-pulling gains nothing.
  # It matters here because the stack runs on a Spot pool: Always would re-pull
  # from GAR on every pod restart, and preemptions make restarts routine.
  # Our own images (obs-api, obs-ui) use Always instead, because they track a
  # moving `main` tag that genuinely does change.
  pullPolicy: IfNotPresent

ports:
  metrics: 8888
  health: 13133

kafka:
  brokers:
    - redpanda.observability.svc.cluster.local:9092
  # protocol_version is deliberately NOT set. It declares the MINIMUM
  # API versions the client demands, and every value we tried was above
  # what this Redpanda offers for JoinGroup (key 11): 2.8.0 and 2.5.0
  # both map to v7, the broker caps at v6, and the consumer group could
  # never form -- it sat Dead with 0 members while topics filled up.
  # The collector default is empty, which makes franz-go negotiate the
  # highest version the broker actually supports. Do not pin it again
  # without checking the broker's advertised API versions first.
  # One group across all replicas: Redpanda then assigns partitions between
  # them and rebalances automatically when a Spot node is preempted.
  groupID: otel-ingest
  # On a first start with no committed offset, read the whole retained backlog
  # rather than only new messages — otherwise a rebuild silently skips data.
  initialOffset: earliest
  topics:
    logs: otel.logs
    traces: otel.traces
    metrics: otel.metrics

clickhouse:
  endpoint: "tcp://clickhouse.observability.svc.cluster.local:9000?dial_timeout=10s"
  database: otel
  username: default
  # MUST match clickhouse-ha's clusterName. If it does not, the exporter
  # silently creates plain MergeTree tables and replication does nothing.
  clusterName: otel
  # ReplicatedMergeTree with no explicit parameters: ClickHouse fills them from
  # its default_replica_path/default_replica_name settings, which resolve
  # through the {shard} and {replica} macros the clickhouse-ha init container
  # generates per pod.
  tableEngine: ReplicatedMergeTree
  createSchema: true
  # Retention. TTL is applied to tables the exporter creates; changing it later
  # requires an ALTER TABLE ... MODIFY TTL on the existing tables.
  ttl: 720h
  # Batches rows server-side, which suits many small inserts from several
  # consumers far better than one synchronous insert per batch.
  asyncInsert: true
  compress: lz4
  env:
    secretName: clickhouse-secrets
    secretKey: clickhouse-password

processors:
  memoryLimiter:
    checkInterval: 5s
    limitPercentage: 80
    spikeLimitPercentage: 25
  batch:
    sendBatchSize: 8192
    sendBatchMaxSize: 16384
    timeout: 10s

# Memory-only per platform policy: no CPU requests or limits anywhere.
resources:
  requests:
    memory: 1Gi
  limits:
    memory: 1536Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  workload: observability

tolerations:
  - key: workload
    operator: Equal
    value: observability
    effect: NoSchedule
