apiVersion: v2
name: otel-collector
description: |
  OpenTelemetry Collector (OTLP in → Prometheus out). Receives OTLP/gRPC + HTTP
  from in-cluster apps (DevAI today) and exposes a Prometheus scrape endpoint so
  the existing Prometheus picks up app telemetry. Traces currently go to the
  debug exporter (collector logs); add a Tempo/Jaeger OTLP exporter to fan them
  out later with no app change.
type: application
version: 1.0.0
appVersion: "0.116.0"
