apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.name" . }}-config
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      # Serves liveness/readiness on :13133 (the deployment probes hit it).
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.ports.otlpGrpc }}
          http:
            endpoint: 0.0.0.0:{{ .Values.ports.otlpHttp }}

    processors:
      memory_limiter:
        check_interval: {{ .Values.memoryLimiter.checkInterval }}
        limit_percentage: {{ .Values.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.memoryLimiter.spikeLimitPercentage }}
      batch: {}

    exporters:
      # Pull-based: Prometheus scrapes this endpoint (pod annotations point here).
      prometheus:
        endpoint: 0.0.0.0:{{ .Values.ports.prometheus }}
        resource_to_telemetry_conversion:
          enabled: true
      # Traces → Grafana Tempo over OTLP/gRPC. Tempo (tempo.yaml ArgoCD app)
      # is the queryable backend behind the agent → stage → llm-call spans the
      # DevAI telemetry adapter emits. tls.insecure: in-cluster, mTLS handled
      # by the mesh, not the app.
      {{- if .Values.tempo.enabled }}
      otlp/tempo:
        endpoint: {{ .Values.tempo.endpoint | quote }}
        tls:
          insecure: true
      {{- end }}
      # Traces, metrics and logs → ClickHouse via the collector-contrib
      # clickhouseexporter (contrib-only). create_schema bootstraps the otel
      # tables on first run. Password is injected via the CLICKHOUSE_PASSWORD
      # env var (deployment), resolved by the collector's ${env:...} expansion.
      clickhouse:
        endpoint: {{ .Values.clickhouse.endpoint | quote }}
        database: {{ .Values.clickhouse.database | quote }}
        username: {{ .Values.clickhouse.username | quote }}
        password: ${env:CLICKHOUSE_PASSWORD}
        create_schema: {{ .Values.clickhouse.createSchema }}
      # Always available — span/log debug dump to the collector's own logs.
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          address: 0.0.0.0:{{ .Values.ports.metrics }}
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, clickhouse, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ join ", " .Values.tracesExporters }}]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]
