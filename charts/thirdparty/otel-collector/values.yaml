# OpenTelemetry Collector — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/otel-collector.yaml (the redis-global pattern).

replicaCount: 1

image:
  # contrib distribution — the `prometheus` exporter (OTLP→scrape) lives there.
  # NOT 0.116.0: that release shipped a dynamically-linked binary in a scratch
  # rootfs (no /lib64 loader) → "exec /otelcol-contrib: no such file or
  # directory" crashloop. 0.116.1 restored the static build.
  repository: otel/opentelemetry-collector-contrib
  tag: "0.116.1"
  pullPolicy: IfNotPresent

# Conservative for a single collector at ~19% cluster memory utilization.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP

# OTLP receiver + Prometheus exporter + collector self-metrics ports.
ports:
  otlpGrpc: 4317
  otlpHttp: 4318
  prometheus: 8889 # app metrics rendered for Prometheus scrape
  metrics: 8888 # the collector's own metrics

# The existing Prometheus (community chart) keeps its default kubernetes-pods
# job, which scrapes pods carrying these annotations — so app telemetry lands
# in Prometheus with no scrape-config edit.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8889"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Memory limiter keeps the collector inside its limit under bursty load.
memoryLimiter:
  checkInterval: 5s
  limitPercentage: 80
  spikeLimitPercentage: 25

# Grafana Tempo trace backend (tempo.yaml ArgoCD app). When enabled the
# collector fans the traces pipeline to Tempo over OTLP/gRPC so the DevAI
# agent spans are queryable in Grafana; disable to fall back to debug-only.
tempo:
  enabled: true
  endpoint: "tempo.observability.svc.cluster.local:4317"

# Traces pipeline exporters. otlp/tempo is the queryable backend; debug keeps
# a log trail. Referenced exporters must exist in the configmap exporters block
# (otlp/tempo is rendered only when tempo.enabled).
tracesExporters:
  - otlp/tempo
  - clickhouse
  - debug

# ClickHouse trace/metric/log backend via the collector-contrib
# clickhouseexporter (contrib-only). createSchema bootstraps the otel tables on
# first run. The password is NOT stored here — it's injected into the collector
# pod as the CLICKHOUSE_PASSWORD env var (see deployment.yaml / clickhouse.env*)
# and resolved by the collector's ${env:...} config expansion.
clickhouse:
  endpoint: "tcp://clickhouse-otel.observability.svc.cluster.local:9000?dial_timeout=10s"
  database: "otel"
  username: "default"
  createSchema: true
  # Retention TTL applied to newly-created otel tables (traces/metrics/logs)
  # so the DB stays bounded under the 20Gi PVC. 720h = 30 days. Raise this (and
  # scale the PVC) as trace volume grows.
  ttl: "720h"
  # Source of the CLICKHOUSE_PASSWORD env var. Must match the secret the
  # clickhouse-otel chart's StatefulSet reads (auth.existingSecret /
  # auth.secretKey) so the collector authenticates with the SAME password
  # the ClickHouse server was started with. Provisioned by the ExternalSecret
  # in external-secrets/prod/observability (GCP SM prod-clickhouse-otel-password).
  env:
    secretName: clickhouse-otel-secrets
    secretKey: clickhouse-password
