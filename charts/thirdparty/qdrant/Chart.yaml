apiVersion: v2
name: qdrant
description: >-
  Qdrant vector database for the AI agent platform — a 3-node distributed
  cluster plus the snapshot-to-GCS backup CronJob the upstream chart has no
  equivalent for. Wraps the official qdrant/qdrant chart; see
  docs/qdrant-vector-db.md for why there is no operator.
type: application
version: 0.1.0
appVersion: "v1.19.0"
keywords:
  - vector-database
  - embeddings
  - rag
maintainers:
  - name: tesserix-platform
dependencies:
  - name: qdrant
    version: "1.18.2"
    repository: "https://qdrant.github.io/qdrant-helm"
