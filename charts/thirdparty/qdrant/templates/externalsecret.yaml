# Ships with the chart rather than from external-secrets/prod: that directory
# is one Kustomize app, so an ExternalSecret targeting a namespace that does
# not exist yet fails the sync for every other namespace's secrets too.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.apiKeySecret.name }}
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: ai-database
  annotations:
    # Before the StatefulSet — the pods mount these keys as env vars.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-qdrant-production
    kind: SecretStore
  target:
    name: {{ .Values.apiKeySecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.apiKeySecret.key }}
      remoteRef:
        key: qdrant/app/qdrant-api-key
        property: value
    - secretKey: {{ .Values.apiKeySecret.readOnlyKey }}
      remoteRef:
        key: qdrant/app/qdrant-read-only-api-key
        property: value
