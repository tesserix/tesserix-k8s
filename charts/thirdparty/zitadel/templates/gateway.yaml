{{- if .Values.istio.enabled }}
{{- if .Values.istio.dedicatedGateway.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: zitadel-gateway
  namespace: {{ .Values.namespace }}
spec:
  selector:
    istio: {{ .Values.istio.dedicatedGateway.istioLabel }}
  servers:
    # Cloudflare terminates TLS, so the tunnel reaches the gateway over plain HTTP.
    - hosts:
        - {{ .Values.host }}
      port:
        name: http
        number: 80
        protocol: HTTP
---
# istio-system/deny-all-default denies mesh-wide, so a new gateway workload
# serves nothing until an ALLOW names it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-zitadel-ingressgateway-public
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: {{ .Values.istio.dedicatedGateway.istioLabel }}
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.host | quote }}
{{- end }}
{{- end }}
