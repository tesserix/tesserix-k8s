# Production overrides for nats
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Internal Load Balancer for Cloud Run access
ilb:
  enabled: true

# Production cluster configuration
cluster:
  enabled: true
  replicas: 3

# Production resource allocation
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# JetStream for persistence
jetstream:
  enabled: true
  storage: 20Gi

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 2
