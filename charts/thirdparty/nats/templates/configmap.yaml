apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  nats.conf: |
    # NATS Server Configuration
    port: 4222
    http_port: 8222

    # Max payload size (1MB)
    max_payload: {{ .Values.config.maxPayload | int }}

    # Max connections
    max_connections: {{ .Values.config.maxConnections | int }}

    # Slow-consumer protection: disconnect a client whose outbound buffer
    # cannot be flushed within this deadline (prevents server-side back-pressure).
    {{- if .Values.config.writeDeadline }}
    write_deadline: "{{ .Values.config.writeDeadline }}"
    {{- end }}

    # Graceful shutdown (lame duck mode) for zero-downtime rolling restarts.
    {{- if .Values.config.lameDuckGracePeriod }}
    lame_duck_grace_period: "{{ .Values.config.lameDuckGracePeriod }}"
    {{- end }}
    {{- if .Values.config.lameDuckDuration }}
    lame_duck_duration: "{{ .Values.config.lameDuckDuration }}"
    {{- end }}

    # Debug/Trace
    debug: {{ .Values.config.debug }}
    trace: {{ .Values.config.trace }}

    # Server name (unique per pod via env var)
    server_name: $SERVER_NAME
    {{- if .Values.auth.enabled }}
    {{- if not .Values.auth.operatorJWT }}
    {{- fail "auth.enabled=true requires auth.operatorJWT, auth.systemAccountId and auth.accountJWTs — run the nsc bootstrap in docs/nats-auth-rollout.md before enabling." }}
    {{- end }}

    # ---- Operator / JWT authentication (decentralized, MEMORY resolver) ----
    # Multi-tenant isolation: each product is a NATS account; a user in one
    # account cannot see another account's subjects or streams. The operator and
    # account JWTs are non-secret signed claims (safe in git); per-user creds and
    # signing seeds live in GCP Secret Manager -> ESO. Generated by nsc — see
    # docs/nats-auth-rollout.md.
    operator: {{ .Values.auth.operatorJWT | quote }}
    system_account: {{ .Values.auth.systemAccountId | quote }}

    resolver: MEMORY
    resolver_preload: {
      {{- range $pub, $jwt := .Values.auth.accountJWTs }}
      {{ $pub }}: {{ $jwt | quote }}
      {{- end }}
    }
    {{- end }}

    {{- if .Values.jetstream.enabled }}
    # JetStream Configuration
    jetstream {
      store_dir: /data/jetstream
      {{- if .Values.jetstream.memoryStore.enabled }}
      max_mem_store: {{ .Values.jetstream.memoryStore.maxSize }}
      {{- end }}
      {{- if .Values.jetstream.fileStore.enabled }}
      max_file_store: {{ .Values.jetstream.fileStore.size }}
      {{- end }}
    }
    {{- end }}

    {{- if and .Values.cluster.enabled (gt (int .Values.replicaCount) 1) }}
    # Cluster Configuration for HA
    cluster {
      name: nats-cluster
      listen: 0.0.0.0:6222
      {{- if .Values.config.clusterConnectRetries }}
      connect_retries: {{ .Values.config.clusterConnectRetries | int }}
      {{- end }}

      routes = [
        {{- $releaseName := .Release.Name }}
        {{- $namespace := .Release.Namespace }}
        {{- range $i := until (int .Values.replicaCount) }}
        nats-route://{{ $releaseName }}-{{ $i }}.{{ $releaseName }}.{{ $namespace }}.svc.cluster.local:6222
        {{- end }}
      ]
    }
    {{- end }}
