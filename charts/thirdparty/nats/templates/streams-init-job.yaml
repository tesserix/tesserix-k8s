{{- if and .Values.jetstream.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-streams-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nats-streams-init
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-streams-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-nats
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for NATS cluster to be ready..."
              for i in $(seq 1 60); do
                if wget -q -O- http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:8222/healthz 2>/dev/null | grep -q "ok"; then
                  echo "NATS is ready"
                  exit 0
                fi
                echo "Waiting... ($i/60)"
                sleep 5
              done
              echo "Timeout waiting for NATS"
              exit 1
      containers:
        - name: configure-streams
          image: natsio/nats-box:latest
          command:
            - sh
            - -c
            - |
              #!/bin/sh
              set -e

              NATS_URL="nats://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:4222"
              REPLICAS={{ .Values.replicaCount }}

              echo "Configuring NATS JetStream streams with $REPLICAS replicas..."

              # List of all event streams used by the marketplace
              STREAMS="
              ORDER_EVENTS:order.>
              PAYMENT_EVENTS:payment.>
              CUSTOMER_EVENTS:customer.>
              AUTH_EVENTS:auth.>
              INVENTORY_EVENTS:inventory.>
              PRODUCT_EVENTS:product.>
              RETURN_EVENTS:return.>
              REVIEW_EVENTS:review.>
              COUPON_EVENTS:coupon.>
              VENDOR_EVENTS:vendor.>
              GIFT_CARD_EVENTS:giftcard.>
              TICKET_EVENTS:ticket.>
              STAFF_EVENTS:staff.>
              TENANT_EVENTS:tenant.>
              APPROVAL_EVENTS:approval.>
              CATEGORY_EVENTS:category.>
              SHIPPING_EVENTS:shipping.>
              AUDIT_EVENTS:audit.>
              NOTIFICATION_EVENTS:notification.>
              "

              for entry in $STREAMS; do
                STREAM_NAME=$(echo $entry | cut -d: -f1)
                SUBJECT=$(echo $entry | cut -d: -f2)

                echo "Checking stream: $STREAM_NAME"

                # Check if stream exists
                if nats stream info "$STREAM_NAME" --server="$NATS_URL" >/dev/null 2>&1; then
                  CURRENT_REPLICAS=$(nats stream info "$STREAM_NAME" --server="$NATS_URL" --json 2>/dev/null | grep -o '"num_replicas":[0-9]*' | cut -d: -f2)

                  if [ "$CURRENT_REPLICAS" != "$REPLICAS" ]; then
                    echo "Updating $STREAM_NAME replicas from $CURRENT_REPLICAS to $REPLICAS"
                    nats stream edit "$STREAM_NAME" --replicas=$REPLICAS --server="$NATS_URL" -f 2>/dev/null || echo "Failed to update $STREAM_NAME (may need manual intervention)"
                  else
                    echo "$STREAM_NAME already has $REPLICAS replicas"
                  fi
                else
                  echo "Creating stream: $STREAM_NAME with $REPLICAS replicas"
                  nats stream add "$STREAM_NAME" \
                    --subjects="$SUBJECT" \
                    --storage=file \
                    --retention=limits \
                    --max-age=7d \
                    --max-bytes=100MB \
                    --replicas=$REPLICAS \
                    --server="$NATS_URL" 2>/dev/null || echo "Stream $STREAM_NAME may already exist"
                fi
              done

              echo "Stream configuration complete!"
              echo "Current streams:"
              nats stream ls --server="$NATS_URL"
{{- end }}
