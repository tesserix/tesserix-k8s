ingressController:
  installCRDs: false
  ingressClass: nginx
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 128Mi

proxy:
  type: LoadBalancer

admin:
  enabled: false

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

deployment:
  initContainers:
    - name: clear-stale-pid
      resources:
        limits:
          memory: 128Mi
        requests:
          memory: 64Mi
