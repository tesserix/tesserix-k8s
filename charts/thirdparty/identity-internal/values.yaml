# =============================================================================
# IDENTITY-INTERNAL: Internal Identity Platform
# =============================================================================
# Production-grade Keycloak setup for staff/admin authentication
# Handles: Azure AD, SAML, OIDC, LDAP, Email/Password
# URL: https://devtest-internal-idp.tesserix.app
# =============================================================================

# -----------------------------------------------------------------------------
# REALM PASSWORD POLICY
# -----------------------------------------------------------------------------
# Keycloak password policy string applied to the tesserix-internal realm.
# Format: "length(N) and lowerCase(N) and upperCase(N) and digits(N) and specialChars(N) and notUsername"
passwordPolicy: "length(10) and lowerCase(1) and upperCase(1) and digits(1) and specialChars(1) and notUsername"

# -----------------------------------------------------------------------------
# KEYCLOAK CONFIGURATION
# -----------------------------------------------------------------------------
keycloak:
  enabled: true
  replicaCount: 2

  image:
    # Official Keycloak image from quay.io
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent

  # Use 'start' (not 'start --optimized') to load PostgreSQL driver dynamically
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--db=postgres"
    - "--hostname-strict=false"
    - "--http-enabled=true"
    - "--proxy-headers=xforwarded"

  # External hostname
  hostname: "devtest-internal-idp.tesserix.app"

  # Admin credentials (from sealed secret)
  admin:
    existingSecret: "keycloak-admin-credentials"
    usernameKey: "username"
    passwordKey: "password"

  # Database connection - Using shared PostgreSQL in postgresql-global namespace
  database:
    vendor: postgres
    host: "global-postgres-rw.global.svc.cluster.local"  # Shared PostgreSQL in global namespace
    port: 5432
    database: keycloak_internal  # Dedicated database for internal IDP
    username: global  # CNPG cluster owner user
    existingSecret: "keycloak-db-credentials"
    passwordKey: "password"

  # Redis/Infinispan cache configuration
  cache:
    enabled: true
    stack: "ispn"
    configFile: "cache-ispn.xml"

  # Features (Keycloak 26.0 compatible)
  features:
    - "token-exchange"
    - "admin-fine-grained-authz"

  # Marketplace Dashboard Client Configuration
  # Confidential client for store admin dashboards
  marketplaceDashboard:
    # Client secret - set via External Secret or override in environment values
    clientSecret: ""

  # Marketplace Onboarding Admin Configuration
  # Service account for user management during tenant onboarding
  onboardingAdmin:
    # Client secret - set via External Secret or override in environment values
    clientSecret: ""

  # Admin BFF Client Configuration
  # Confidential client for the admin backend-for-frontend server
  adminBff:
    # Client secret - ONLY used if externalSecrets.enabled is false
    # In production, use GCP Secret Manager via External Secrets Operator
    clientSecret: "admin-bff-secret-change-me"

  # Token Exchange Configuration
  # Used for multi-tenant credential isolation - allows BFF to exchange
  # service account token for user token after local credential validation
  tokenExchange:
    enabled: true
    # Client secret - ONLY used if externalSecrets.enabled is false
    # In production, use GCP Secret Manager via External Secrets Operator
    clientSecret: "token-exchange-secret-change-me"

  # External Secrets Configuration
  # Syncs secrets from GCP Secret Manager to Kubernetes secrets
  # Requires External Secrets Operator and a ClusterSecretStore to be configured
  externalSecrets:
    enabled: true  # Set to false to use values directly (dev/test only)
    refreshInterval: "1h"
    # Reference to ClusterSecretStore configured for GCP
    secretStore: "gcp-secret-store"
    # GCP Secret Manager secret names
    # Naming convention: {environment}-keycloak-{secret-name}
    # These secrets are created by Terraform (modules/app-secrets)
    secrets:
      # GCP Secret: devtest-keycloak-admin-bff-client-secret
      adminBffClientSecret: "devtest-keycloak-admin-bff-client-secret"
      # GCP Secret: devtest-keycloak-token-exchange-client-secret
      tokenExchangeClientSecret: "devtest-keycloak-token-exchange-client-secret"
      # GCP Secret: devtest-keycloak-internal-admin-client-secret (for tenant-service user management)
      adminClientSecret: "devtest-keycloak-internal-admin-client-secret"
      # GCP Secret: devtest-keycloak-internal-dashboard-client-secret (for marketplace-dashboard)
      dashboardClientSecret: "devtest-keycloak-internal-dashboard-client-secret"
      # GCP Secret: devtest-homechef-internal-keycloak-client-secret (for homechef-admin-bff)
      # Shared with the homechef-auth-bff chart so the BFF and Keycloak agree on the secret.
      homechefAdminBffClientSecret: "devtest-homechef-internal-keycloak-client-secret"

  # Java options (smaller heap for internal)
  # IMPORTANT: -Xmx must be ~60% of container memory limit to leave room for
  # non-heap memory (Metaspace ~256MB, thread stacks, GC overhead, native memory)
  javaOpts: "-Xms384m -Xmx896m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxMetaspaceSize=256m"

  # Resource limits (smaller for internal)
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 1536Mi

  # Health probes - Keycloak 26.x uses management port 9000 for health endpoints
  livenessProbe:
    httpGet:
      path: /health/live
      port: 9000
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 9000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health/started
      port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  # Pod disruption budget
  # Use maxUnavailable instead of minAvailable to allow node drains with single replica
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  # Autoscaling (disabled for internal - fixed replicas)
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetMemoryUtilizationPercentage: 75

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # Ingress via Istio
  ingress:
    enabled: true
    className: ""
    annotations:
      kubernetes.io/ingress.class: istio
    hosts:
      - host: devtest-internal-idp.tesserix.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: internal-idp-tls
        hosts:
          - devtest-internal-idp.tesserix.app

  # Security context
  podSecurityContext:
    fsGroup: 1000

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  # Service account
  serviceAccount:
    create: true
    name: "keycloak"

  # Pod labels
  podLabels:
    app.kubernetes.io/part-of: identity-internal
    app.kubernetes.io/component: keycloak

  # Environment variables
  extraEnvVars:
    - name: KC_CACHE
      value: "ispn"
    - name: KC_CACHE_STACK
      value: "kubernetes"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KC_LOG_LEVEL
      value: "INFO"
    # Database connection pool settings - increase timeouts for startup
    - name: KC_DB_POOL_INITIAL_SIZE
      value: "1"
    - name: KC_DB_POOL_MIN_SIZE
      value: "1"
    - name: KC_DB_POOL_MAX_SIZE
      value: "10"
    # JDBC URL properties — tcpKeepAlive=true asks the OS to send TCP
    # keepalive probes on the DB socket so GKE Dataplane V2 / Cilium
    # conntrack doesn't evict the flow after ~5 min idle. socketTimeout
    # caps any single query at 60s so a half-dead socket is detected
    # instead of blocking an executor thread forever.
    - name: KC_DB_URL_PROPERTIES
      value: "?tcpKeepAlive=true&socketTimeout=60&tcpNoDelay=true"
    # Agroal pool tuning: recycle pooled connections every 4 minutes
    # (below the ~5 min conntrack idle window) and validate them in
    # the background every 30s so broken connections are discarded
    # before a real request picks them up. acquisition-timeout=60 is
    # kept from the original config so pod startup is tolerant of
    # Postgres being briefly unready.
    - name: JAVA_OPTS_APPEND
      value: "-Djgroups.dns.query=keycloak-headless.identity-internal.svc.cluster.local -Dquarkus.datasource.jdbc.acquisition-timeout=60 -Dquarkus.datasource.jdbc.max-lifetime=PT4M -Dquarkus.datasource.jdbc.background-validation-interval=PT30S -Dquarkus.datasource.jdbc.idle-removal-interval=PT1M"

# -----------------------------------------------------------------------------
# POSTGRESQL CONFIGURATION (Bitnami) - Smaller for internal
# -----------------------------------------------------------------------------
# DISABLED: Using shared PostgreSQL in postgresql-global namespace instead
keycloak-db:
  enabled: false

  # Use latest image (chart default may not exist)
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: latest

  # Architecture: standalone or replication
  architecture: replication

  # Authentication
  auth:
    database: keycloak
    username: keycloak
    existingSecret: "keycloak-db-credentials"
    secretKeys:
      userPasswordKey: "password"
      replicationPasswordKey: "replication-password"

  # Primary configuration
  primary:
    name: primary
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 20Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 2Gi
    podLabels:
      app.kubernetes.io/part-of: identity-internal
      app.kubernetes.io/component: postgresql

  # Read replicas
  readReplicas:
    name: read
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 20Gi
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    podLabels:
      app.kubernetes.io/part-of: identity-internal
      app.kubernetes.io/component: postgresql

  # Metrics
  metrics:
    enabled: true
    # Memory-only: without this the bitnami resourcesPreset default
    # supplies the exporter with cpu requests/limits.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      namespace: identity-internal

  # Network policy
  networkPolicy:
    enabled: true
    allowExternal: false

# -----------------------------------------------------------------------------
# REDIS CONFIGURATION (Bitnami) - Smaller for internal
# -----------------------------------------------------------------------------
keycloak-redis:
  enabled: true

  # Use latest image (chart default may not exist)
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest

  # Architecture: standalone or replication
  architecture: replication

  # Authentication
  auth:
    enabled: true
    existingSecret: "keycloak-redis-credentials"
    existingSecretPasswordKey: "password"

  # Master configuration
  master:
    count: 1
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 2Gi
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    podLabels:
      app.kubernetes.io/part-of: identity-internal
      app.kubernetes.io/component: redis

  # Replica configuration
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      size: 2Gi
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    podLabels:
      app.kubernetes.io/part-of: identity-internal
      app.kubernetes.io/component: redis

  # Sentinel (for HA)
  sentinel:
    enabled: true
    masterSet: keycloak-master
    quorum: 2
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi

  # Metrics
  metrics:
    enabled: true
    # Memory-only: without this the bitnami resourcesPreset default
    # supplies the exporter with cpu requests/limits.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
      namespace: identity-internal

  # Network policy
  networkPolicy:
    enabled: true
    allowExternal: false

# -----------------------------------------------------------------------------
# NETWORK POLICY (Stricter for internal)
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true

# -----------------------------------------------------------------------------
# SERVICE MONITOR (Prometheus)
# -----------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  namespace: identity-internal
  interval: 30s
  scrapeTimeout: 10s

# -----------------------------------------------------------------------------
# ADMIN SSO CONFIGURATION
# -----------------------------------------------------------------------------
# Configures Google SSO for Keycloak admin console access
# Only specified super admins can access the admin console
adminSSO:
  enabled: false  # Set to true to enable admin SSO setup

  # Google OAuth credentials secret name
  # Must contain: client-id, client-secret
  googleCredentialsSecret: "keycloak-google-sso"

  # Super admin email addresses (full access to Keycloak admin)
  superAdmins:
    - "unidevidp@gmail.com"
    - "mahesh.sangawar@gmail.com"
    - "samyak.rout@gmail.com"

  # Disable password login for default admin (keep as break-glass)
  # When true: admin user is disabled, must be manually re-enabled for emergencies
  # When false: password login remains available alongside SSO
  disablePasswordLogin: false

# -----------------------------------------------------------------------------
# DEVAI REALM CONFIGURATION
# -----------------------------------------------------------------------------
# DevAI platform realms hosted on this Keycloak instance
# Routing: identity-devai.tesserix.app and identity-sre.tesserix.app
# Managed via istio-config chart (internalIdentityAliases)
devaiRealms:
  # ALM Platform realm
  devai:
    realm: "devai"
    displayName: "DevAI Platform"
    clientId: "devai-bff"
    redirectUris:
      - "https://devai.tesserix.app/bff/*"
      - "https://devai.tesserix.app/auth/*"
    webOrigins:
      - "https://devai.tesserix.app"
  # SRE Platform realm
  devaiSre:
    realm: "devai-sre"
    displayName: "DevAI SRE Platform"
    clientId: "devai-sre-bff"
    redirectUris:
      - "https://sre.tesserix.app/bff/*"
      - "https://sre.tesserix.app/auth/*"
    webOrigins:
      - "https://sre.tesserix.app"
  # Allowed users — only these emails can access DevAI dashboards
  # Google SSO is enabled but restricted to existing users only
  # (firstBrokerLoginFlow = restricted-first-broker-login)
  allowedUsers:
    - "samyak.rout@gmail.com"
    - "mahesh.sangawar@gmail.com"
