{{- if .Values.adminSSO.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-admin-sso-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-sso
data:
  setup-admin-sso.sh: |
    #!/bin/bash
    # =============================================================================
    # Keycloak Admin SSO Setup Script (In-Cluster Version)
    # =============================================================================
    set -e

    # Configuration from environment
    KEYCLOAK_URL="${KEYCLOAK_URL}"
    KEYCLOAK_MGMT_URL="${KEYCLOAK_MGMT_URL:-http://keycloak:9000}"
    ADMIN_USER="${KEYCLOAK_ADMIN}"
    ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}"
    GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
    GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"

    # Super Admin emails
    SUPER_ADMINS=(
    {{- range .Values.adminSSO.superAdmins }}
        "{{ . }}"
    {{- end }}
    )

    log_info() { echo "[INFO] $1"; }
    log_success() { echo "[SUCCESS] $1"; }
    log_error() { echo "[ERROR] $1"; }

    # Wait for Keycloak to be ready (check via realms endpoint)
    log_info "Waiting for Keycloak to be ready..."
    until curl -sf "${KEYCLOAK_URL}/realms/master" > /dev/null 2>&1; do
        echo "  Waiting..."
        sleep 5
    done
    log_success "Keycloak is ready"

    # Get admin token
    log_info "Getting admin access token..."
    TOKEN_RESPONSE=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${ADMIN_USER}" \
        -d "password=${ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli")

    ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

    if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
        log_error "Failed to get admin token"
        exit 1
    fi
    log_success "Got admin access token"

    # Setup Google IDP
    log_info "Setting up Google Identity Provider..."
    IDP_CONFIG='{
        "alias": "google",
        "displayName": "Sign in with Google",
        "providerId": "google",
        "enabled": true,
        "updateProfileFirstLoginMode": "on",
        "trustEmail": true,
        "storeToken": false,
        "addReadTokenRoleOnCreate": false,
        "authenticateByDefault": false,
        "linkOnly": false,
        "firstBrokerLoginFlowAlias": "first broker login",
        "config": {
            "clientId": "'"${GOOGLE_CLIENT_ID}"'",
            "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
        }
    }'

    # Check if IDP exists
    EXISTING=$(curl -s -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")

    if [ "$EXISTING" == "200" ]; then
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances/google" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$IDP_CONFIG"
        log_info "  Updated existing Google IDP"
    else
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$IDP_CONFIG"
        log_info "  Created Google IDP"
    fi
    log_success "Google IDP configured for master realm"

    # Setup IDP mappers for master realm
    log_info "Setting up IDP mappers for master realm..."
    for MAPPER in "email:email:email" "first_name:given_name:firstName" "last_name:family_name:lastName"; do
        IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
        MAPPER_JSON='{
            "name": "'"$NAME"'",
            "identityProviderAlias": "google",
            "identityProviderMapper": "oidc-user-attribute-idp-mapper",
            "config": {
                "syncMode": "INHERIT",
                "claim": "'"$CLAIM"'",
                "user.attribute": "'"$ATTR"'"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/identity-provider/instances/google/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$MAPPER_JSON" 2>/dev/null || true
    done
    log_success "IDP mappers configured for master realm"

    # =========================================================================
    # Setup Google IDP for tesserix-internal realm (Admin Portal Login)
    # =========================================================================
    log_info "Setting up Google Identity Provider for tesserix-internal realm..."

    INTERNAL_IDP_CONFIG='{
        "alias": "google",
        "displayName": "Sign in with Google",
        "providerId": "google",
        "enabled": true,
        "updateProfileFirstLoginMode": "on",
        "trustEmail": true,
        "storeToken": false,
        "addReadTokenRoleOnCreate": false,
        "authenticateByDefault": false,
        "linkOnly": false,
        "firstBrokerLoginFlowAlias": "first broker login",
        "config": {
            "clientId": "'"${GOOGLE_CLIENT_ID}"'",
            "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
        }
    }'

    # Check if IDP exists in internal realm
    INTERNAL_IDP_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
        "${KEYCLOAK_URL}/admin/realms/tesserix-internal/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")

    if [ "$INTERNAL_IDP_EXISTS" == "200" ]; then
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-internal/identity-provider/instances/google" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$INTERNAL_IDP_CONFIG"
        log_info "  Updated existing Google IDP in internal realm"
    else
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-internal/identity-provider/instances" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$INTERNAL_IDP_CONFIG"
        log_info "  Created Google IDP in internal realm"
    fi

    # Setup IDP mappers for internal realm
    log_info "Setting up IDP mappers for internal realm..."
    for MAPPER in "email:email:email" "first_name:given_name:firstName" "last_name:family_name:lastName"; do
        IFS=':' read -r NAME CLAIM ATTR <<< "$MAPPER"
        MAPPER_JSON='{
            "name": "'"$NAME"'",
            "identityProviderAlias": "google",
            "identityProviderMapper": "oidc-user-attribute-idp-mapper",
            "config": {
                "syncMode": "INHERIT",
                "claim": "'"$CLAIM"'",
                "user.attribute": "'"$ATTR"'"
            }
        }'
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-internal/identity-provider/instances/google/mappers" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$MAPPER_JSON" 2>/dev/null || true
    done

    # Add google_linked hardcoded attribute mapper for internal realm
    GOOGLE_LINKED_MAPPER='{
        "name": "google_linked",
        "identityProviderAlias": "google",
        "identityProviderMapper": "hardcoded-attribute-idp-mapper",
        "config": {
            "syncMode": "FORCE",
            "attribute": "google_linked",
            "attribute.value": "true"
        }
    }'
    curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-internal/identity-provider/instances/google/mappers" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "$GOOGLE_LINKED_MAPPER" 2>/dev/null || true

    log_success "Google IDP configured for tesserix-internal realm"

    # =========================================================================
    # Create Auto-Link First Broker Login Flow for Internal Realm
    # =========================================================================
    log_info "Creating Auto Link First Broker Login flow for internal realm..."

    AUTO_LINK_FLOW_EXISTS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-internal/authentication/flows" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r '.[] | select(.alias == "Auto Link First Broker Login") | .id')

    if [ -z "$AUTO_LINK_FLOW_EXISTS" ]; then
        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-internal/authentication/flows" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
                "alias": "Auto Link First Broker Login",
                "providerId": "basic-flow",
                "topLevel": true,
                "builtIn": false,
                "description": "Automatically links accounts by email"
            }'

        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-internal/authentication/flows/Auto%20Link%20First%20Broker%20Login/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-create-user-if-unique"}'

        curl -s -X POST "${KEYCLOAK_URL}/admin/realms/tesserix-internal/authentication/flows/Auto%20Link%20First%20Broker%20Login/executions/execution" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"provider": "idp-auto-link"}'

        log_info "  Created Auto Link First Broker Login flow"
    else
        log_info "  Auto Link flow already exists"
    fi

    # Set execution requirements to ALTERNATIVE
    log_info "Setting Auto Link flow execution requirements for internal realm..."
    EXECUTIONS=$(curl -s "${KEYCLOAK_URL}/admin/realms/tesserix-internal/authentication/flows/Auto%20Link%20First%20Broker%20Login/executions" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    for EXEC_ID in $(echo "$EXECUTIONS" | jq -r '.[] | .id'); do
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-internal/authentication/flows/Auto%20Link%20First%20Broker%20Login/executions" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"${EXEC_ID}\",\"requirement\":\"ALTERNATIVE\"}"
    done
    log_info "  Execution requirements set to ALTERNATIVE"

    # Update Google IDP to use Auto Link flow
    log_info "Updating Google IDP to use Auto Link flow in internal realm..."
    curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/tesserix-internal/identity-provider/instances/google" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{
            "alias": "google",
            "displayName": "Sign in with Google",
            "providerId": "google",
            "enabled": true,
            "updateProfileFirstLoginMode": "on",
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "authenticateByDefault": false,
            "linkOnly": false,
            "firstBrokerLoginFlowAlias": "Auto Link First Broker Login",
            "config": {
                "clientId": "'"${GOOGLE_CLIENT_ID}"'",
                "clientSecret": "'"${GOOGLE_CLIENT_SECRET}"'",
                "defaultScope": "openid profile email",
                "syncMode": "IMPORT",
                "guiOrder": "1"
            }
        }'
    log_success "Auto-link flow configured for Google IDP in internal realm"

    # Get admin role
    log_info "Getting admin role..."
    ADMIN_ROLE=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/roles/admin" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    ADMIN_ROLE_ID=$(echo "$ADMIN_ROLE" | jq -r '.id')

    # Create super admin users
    log_info "Creating super admin users..."
    for EMAIL in "${SUPER_ADMINS[@]}"; do
        log_info "  Processing: $EMAIL"

        # Check if user exists
        EXISTING_USER=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/users?email=${EMAIL}&exact=true" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")
        USER_ID=$(echo "$EXISTING_USER" | jq -r '.[0].id // empty')

        if [ -z "$USER_ID" ]; then
            # Create user
            USER_DATA='{
                "username": "'"${EMAIL}"'",
                "email": "'"${EMAIL}"'",
                "enabled": true,
                "emailVerified": true,
                "attributes": {"super_admin": ["true"]}
            }'
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/users" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$USER_DATA"

            # Get new user ID
            EXISTING_USER=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/users?email=${EMAIL}&exact=true" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}")
            USER_ID=$(echo "$EXISTING_USER" | jq -r '.[0].id // empty')
            log_info "    Created user"
        else
            log_info "    User exists"
        fi

        # Assign admin role
        if [ -n "$USER_ID" ]; then
            curl -s -X POST "${KEYCLOAK_URL}/admin/realms/master/users/${USER_ID}/role-mappings/realm" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '[{"id": "'"${ADMIN_ROLE_ID}"'", "name": "admin"}]' 2>/dev/null || true
            log_info "    Assigned admin role"
        fi
    done
    log_success "Super admin users configured"

    # Disable default admin password (optional - controlled by flag)
    {{- if .Values.adminSSO.disablePasswordLogin }}
    log_info "Disabling password login for admin user..."
    # Get admin user
    ADMIN_USERS=$(curl -s "${KEYCLOAK_URL}/admin/realms/master/users?username=${ADMIN_USER}&exact=true" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}")
    ADMIN_USER_ID=$(echo "$ADMIN_USERS" | jq -r '.[0].id // empty')

    if [ -n "$ADMIN_USER_ID" ]; then
        # Disable the admin user (break-glass - can be re-enabled manually)
        curl -s -X PUT "${KEYCLOAK_URL}/admin/realms/master/users/${ADMIN_USER_ID}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled": false, "attributes": {"break_glass": ["true"]}}'
        log_info "  Admin password user disabled (break-glass mode)"
    fi
    {{- else }}
    log_info "Password login kept enabled (break-glass available)"
    {{- end }}

    log_success "Keycloak Admin SSO setup complete!"
    echo ""
    echo "=== Configuration Summary ==="
    echo "Google SSO: Enabled (master + tesserix-internal)"
    echo "Super Admins:"
    for EMAIL in "${SUPER_ADMINS[@]}"; do
        echo "  - $EMAIL"
    done
    echo "Password Login: {{ if .Values.adminSSO.disablePasswordLogin }}Disabled (break-glass){{ else }}Enabled{{ end }}"
    echo ""
    echo "Google OAuth Redirect URIs:"
    echo "  ${KEYCLOAK_URL}/realms/master/broker/google/endpoint"
    echo "  ${KEYCLOAK_URL}/realms/tesserix-internal/broker/google/endpoint"
{{- end }}
