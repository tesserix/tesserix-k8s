{{- if .Values.keycloak.enabled }}
# Upserts the `secret-service` OIDC client (OpenBao admin console) into the
# tesserix-internal realm. The realm-import job is one-shot, so a client added
# after the original import only reaches live Keycloak through a job like this.
# Unlike homechef-clients-bootstrap this PUTs on every run, so redirect URI and
# secret changes converge instead of being frozen at first creation.
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-service-client-bootstrap-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: secret-service-client-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # After realm-import (5) and the homechef clients (6).
    helm.sh/hook-weight: "7"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-service-client-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      containers:
        - name: bootstrap
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              KEYCLOAK_URL="http://keycloak:8080"
              REALM="tesserix-internal"
              CLIENT_ID="secret-service"
              CONSOLE_URL="{{ .Values.secretService.consoleUrl }}"
              MAX_RETRIES=60

              TOKEN=""
              RETRY_COUNT=0
              while [ -z "$TOKEN" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" \
                  -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                if [ -z "$TOKEN" ]; then
                  echo "Waiting for Keycloak admin API... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                fi
              done

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to authenticate to Keycloak after $MAX_RETRIES attempts"
                exit 1
              fi

              REALM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/$REALM")
              if [ "$REALM_STATUS" != "200" ]; then
                echo "Realm $REALM does not exist (status $REALM_STATUS) — nothing to do."
                exit 0
              fi

              if [ -z "$SECRET_SERVICE_CLIENT_SECRET" ] || \
                 [ "$SECRET_SERVICE_CLIENT_SECRET" = "change-me-secret-service-client" ]; then
                echo "ERROR: SECRET_SERVICE_CLIENT_SECRET is not set or still default. Aborting."
                exit 1
              fi

              cat > /tmp/client.json <<EOF
              {
                "clientId": "$CLIENT_ID",
                "name": "Secret Service Console",
                "description": "Confidential client for the OpenBao admin console",
                "enabled": true,
                "publicClient": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "${SECRET_SERVICE_CLIENT_SECRET}",
                "standardFlowEnabled": true,
                "implicitFlowEnabled": false,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": false,
                "protocol": "openid-connect",
                "redirectUris": ["${CONSOLE_URL}/api/auth/callback"],
                "webOrigins": ["${CONSOLE_URL}"],
                "attributes": {
                  "pkce.code.challenge.method": "S256",
                  "post.logout.redirect.uris": "${CONSOLE_URL}/*",
                  "backchannel.logout.session.required": "true"
                },
                "defaultClientScopes": ["openid", "email", "profile", "roles"],
                "optionalClientScopes": []
              }
              EOF

              CLIENT_UUID=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
                -H "Authorization: Bearer $TOKEN" \
                | sed -n 's/^[^"]*"id":"\([^"]*\)".*/\1/p' | head -1)

              if [ -z "$CLIENT_UUID" ]; then
                echo "Creating client $CLIENT_ID..."
                CREATE_STATUS=$(curl -s -o /tmp/resp -w "%{http_code}" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/clients" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/client.json)
                if [ "$CREATE_STATUS" != "201" ]; then
                  echo "ERROR: Failed to create client $CLIENT_ID (status $CREATE_STATUS): $(cat /tmp/resp)"
                  exit 1
                fi
                echo "Client $CLIENT_ID created"
              else
                echo "Updating client $CLIENT_ID ($CLIENT_UUID)..."
                UPDATE_STATUS=$(curl -s -o /tmp/resp -w "%{http_code}" \
                  -X PUT "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/client.json)
                if [ "$UPDATE_STATUS" != "204" ] && [ "$UPDATE_STATUS" != "200" ]; then
                  echo "ERROR: Failed to update client $CLIENT_ID (status $UPDATE_STATUS): $(cat /tmp/resp)"
                  exit 1
                fi
                echo "Client $CLIENT_ID updated"
              fi

              echo "secret-service client bootstrap complete"
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            {{- if .Values.keycloak.externalSecrets.enabled }}
            - name: SECRET_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: secret-service-client-secret
            {{- else }}
            - name: SECRET_SERVICE_CLIENT_SECRET
              value: "change-me-secret-service-client"
            {{- end }}
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
