      "users": [
        {
          "username": "service-account-marketplace-onboarding-admin",
          "enabled": true,
          "serviceAccountClientId": "marketplace-onboarding-admin",
          "clientRoles": {
            "realm-management": [
              "manage-users",
              "view-users",
              "query-users",
              "manage-clients",
              "view-clients",
              "query-clients",
              "view-realm",
              "manage-realm",
              "manage-authorization"
            ]
          }
        }
      ],
      "identityProviders": [
        {
          "alias": "google",
          "displayName": "Sign in with Google",
          "providerId": "google",
          "enabled": true,
          "updateProfileFirstLoginMode": "on",
          "trustEmail": true,
          "storeToken": false,
          "addReadTokenRoleOnCreate": false,
          "authenticateByDefault": false,
          "linkOnly": false,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "%%GOOGLE_CLIENT_ID%%",
            "clientSecret": "%%GOOGLE_CLIENT_SECRET%%",
            "defaultScope": "openid profile email",
            "syncMode": "IMPORT",
            "guiOrder": "1"
          }
        }
      ],
      "identityProviderMappers": [
        {
          "name": "email",
          "identityProviderAlias": "google",
          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
          "config": {
            "syncMode": "INHERIT",
            "claim": "email",
            "user.attribute": "email"
          }
        },
        {
          "name": "first_name",
          "identityProviderAlias": "google",
          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
          "config": {
            "syncMode": "INHERIT",
            "claim": "given_name",
            "user.attribute": "firstName"
          }
        },
        {
          "name": "last_name",
          "identityProviderAlias": "google",
          "identityProviderMapper": "oidc-user-attribute-idp-mapper",
          "config": {
            "syncMode": "INHERIT",
            "claim": "family_name",
            "user.attribute": "lastName"
          }
        },
        {
          "name": "google_linked",
          "identityProviderAlias": "google",
          "identityProviderMapper": "hardcoded-attribute-idp-mapper",
          "config": {
            "syncMode": "FORCE",
            "attribute": "google_linked",
            "attribute.value": "true"
          }
        }
      ]
    }
