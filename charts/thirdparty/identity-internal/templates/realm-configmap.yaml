{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
data:
  tesserix-internal-realm.json: |
    {
      "realm": "tesserix-internal",
      "enabled": true,
      "displayName": "Tesserix Admin Portal",
      "displayNameHtml": "<strong>Tesserix</strong> Admin Portal",
      "attributes": {
        "frontendUrl": "https://internal-identity.fe3dr.com"
      },
      "registrationAllowed": false,
      "rememberMe": true,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": true,
      "maxFailureWaitSeconds": 3600,
      "minimumQuickLoginWaitSeconds": 120,
      "waitIncrementSeconds": 120,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 86400,
      "failureFactor": 3,
      "sslRequired": "external",
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 900,
      "ssoSessionMaxLifespan": 14400,
      "offlineSessionIdleTimeout": 1209600,
      "accessCodeLifespan": 60,
      "accessCodeLifespanUserAction": 300,
      "accessCodeLifespanLogin": 1800,
      "internationalizationEnabled": true,
      "supportedLocales": ["en"],
      "defaultLocale": "en",
      "eventsEnabled": true,
      "eventsListeners": ["jboss-logging"],
      "enabledEventTypes": ["LOGIN", "LOGIN_ERROR", "LOGOUT", "REGISTER", "REGISTER_ERROR", "CODE_TO_TOKEN", "CODE_TO_TOKEN_ERROR"],
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "roles": {
        "realm": [
          {
            "name": "super_admin",
            "description": "Super administrator with full access to all tenants and features"
          },
          {
            "name": "tenant_admin",
            "description": "Tenant administrator with full access within their tenant"
          },
          {
            "name": "admin",
            "description": "Administrator with management capabilities"
          },
          {
            "name": "staff",
            "description": "Staff member with standard access"
          },
          {
            "name": "employee",
            "description": "Employee with basic access"
          },
          {
            "name": "readonly",
            "description": "Read-only access for viewing data"
          },
          {
            "name": "store_owner",
            "description": "Store owner role for tenant administrators created during onboarding"
          }
        ]
      },
      "defaultRoles": ["staff"],
      "clients": [
        {
          "clientId": "admin-web",
          "name": "Tesserix Admin Dashboard",
          "description": "Admin dashboard web application",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "rootUrl": "https://admin-devtest.tesserix.app",
          "baseUrl": "https://admin-devtest.tesserix.app",
          "redirectUris": [
            "https://admin-devtest.tesserix.app/*",
            "http://localhost:3001/*",
            "http://localhost:4201/*"
          ],
          "webOrigins": [
            "https://admin-devtest.tesserix.app",
            "http://localhost:3001",
            "http://localhost:4201"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://admin-devtest.tesserix.app/*##http://localhost:3001/*"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "staff_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "staff_id",
                "user.attribute": "staff_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "vendor_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "vendor_id",
                "user.attribute": "vendor_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm_roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "admin-bff",
          "name": "Admin Backend-for-Frontend",
          "description": "Confidential client for admin BFF server with token exchange capability",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "%%ADMIN_BFF_CLIENT_SECRET%%",
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "authorizationServicesEnabled": false,
          "protocol": "openid-connect",
          "redirectUris": [
            "https://admin-devtest.tesserix.app/api/auth/callback/*",
            "https://admin-devtest.tesserix.app/auth/callback",
            "https://*-admin.tesserix.app/auth/callback",
            "https://*-admin.tesserix.app/*",
            "http://localhost:3001/api/auth/callback/*",
            "http://localhost:3000/auth/callback"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "use.refresh.tokens": "true",
            "client.session.idle.timeout": "1800",
            "client.session.max.lifespan": "36000",
            "post.logout.redirect.uris": "https://admin-devtest.tesserix.app/*##https://*-admin.tesserix.app/*##http://localhost:3001/*##http://localhost:3000/*"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "staff_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "staff_id",
                "user.attribute": "staff_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "vendor_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "vendor_id",
                "user.attribute": "vendor_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm_roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "token-exchange-target",
          "name": "Token Exchange Target",
          "description": "Target client for token exchange - issues tokens for users after credential validation",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "%%TOKEN_EXCHANGE_CLIENT_SECRET%%",
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": true,
          "protocol": "openid-connect",
          "bearerOnly": false,
          "consentRequired": false,
          "fullScopeAllowed": true,
          "attributes": {
            "access.token.lifespan": "300"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm_roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ],
          "authorizationSettings": {
            "allowRemoteResourceManagement": false,
            "policyEnforcementMode": "ENFORCING",
            "decisionStrategy": "UNANIMOUS",
            "resources": [
              {
                "name": "token-exchange-resource",
                "type": "urn:token-exchange-target:resources:token-exchange",
                "ownerManagedAccess": false,
                "displayName": "Token Exchange Resource",
                "scopes": [
                  {"name": "token-exchange"}
                ]
              }
            ],
            "policies": [
              {
                "name": "admin-bff-token-exchange-policy",
                "description": "Policy allowing admin-bff service account to perform token exchange",
                "type": "client",
                "logic": "POSITIVE",
                "decisionStrategy": "UNANIMOUS",
                "config": {
                  "clients": "[\"admin-bff\"]"
                }
              },
              {
                "name": "token-exchange-permission",
                "description": "Permission to exchange tokens",
                "type": "scope",
                "logic": "POSITIVE",
                "decisionStrategy": "UNANIMOUS",
                "config": {
                  "resources": "[\"token-exchange-resource\"]",
                  "scopes": "[\"token-exchange\"]",
                  "applyPolicies": "[\"admin-bff-token-exchange-policy\"]"
                }
              }
            ],
            "scopes": [
              {
                "name": "token-exchange",
                "displayName": "Token Exchange Scope"
              }
            ]
          }
        },
        {
          "clientId": "marketplace-dashboard",
          "name": "Marketplace Admin Dashboard",
          "description": "Admin dashboard for marketplace tenants - supports direct login and token exchange",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "%%DASHBOARD_CLIENT_SECRET%%",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "rootUrl": "https://*-admin.tesserix.app",
          "redirectUris": [
            "https://*-admin.tesserix.app/*",
            "https://*.tesserix.app/*",
            "https://test-store-admin.tesserix.app/*",
            "https://demo-store-1-admin.tesserix.app/*",
            "https://awesome-store-admin.tesserix.app/*",
            "https://test-app-admin.tesserix.app/*",
            "http://localhost:3000/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://*-admin.tesserix.app/*##http://localhost:3000/*",
            "oauth2.device.authorization.grant.enabled": "false",
            "oidc.ciba.grant.enabled": "false"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles", "offline_access"],
          "optionalClientScopes": ["address", "phone"],
          "protocolMappers": [
            {
              "name": "tenant_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_id",
                "user.attribute": "tenant_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant_slug",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenant_slug",
                "user.attribute": "tenant_slug",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenants",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "tenants",
                "user.attribute": "tenants",
                "jsonType.label": "JSON",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "multivalued": "true"
              }
            },
            {
              "name": "staff_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "staff_id",
                "user.attribute": "staff_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "vendor_id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "claim.name": "vendor_id",
                "user.attribute": "vendor_id",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm_roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "config": {
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "marketplace-onboarding-admin",
          "name": "Marketplace Onboarding Admin",
          "description": "Service account for tenant onboarding - user management and realm admin",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "%%ADMIN_CLIENT_SECRET%%",
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "defaultClientScopes": ["openid", "email", "profile", "offline_access"],
          "optionalClientScopes": [],
          "protocolMappers": [
            {
              "name": "marketplace-dashboard-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "marketplace-dashboard",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "lightweight.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "homechef-admin-bff",
          "name": "HomeChef Admin BFF",
          "description": "Confidential client for HomeChef auth BFF admin context",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "%%HOMECHEF_ADMIN_BFF_CLIENT_SECRET%%",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "redirectUris": [
            "https://fe3dr.com/bff/callback",
            "https://fe3dr.com/*",
            "https://admin.fe3dr.com/bff/callback",
            "https://admin.fe3dr.com/*",
            "https://delivery.fe3dr.com/bff/callback",
            "https://delivery.fe3dr.com/*",
            "http://localhost:5173/bff/callback",
            "http://localhost:5175/bff/callback",
            "http://localhost:8090/bff/callback"
          ],
          "webOrigins": [
            "https://fe3dr.com",
            "https://www.fe3dr.com",
            "https://admin.fe3dr.com",
            "https://delivery.fe3dr.com"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://fe3dr.com/*##https://admin.fe3dr.com/*##https://delivery.fe3dr.com/*##http://localhost:5173/*##http://localhost:5175/*",
            "backchannel.logout.session.required": "true"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access"]
        },
        {
          "clientId": "homechef-admin-web",
          "name": "HomeChef Admin Dashboard",
          "description": "Public client for HomeChef admin dashboard (React SPA)",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "protocol": "openid-connect",
          "rootUrl": "https://fe3dr.com",
          "baseUrl": "https://fe3dr.com",
          "redirectUris": [
            "https://fe3dr.com/*",
            "https://www.fe3dr.com/*",
            "http://localhost:5173/*"
          ],
          "webOrigins": ["+"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://fe3dr.com/*##http://localhost:5173/*"
          },
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "optionalClientScopes": ["offline_access"]
