{{- if .Values.keycloak.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-devai-realm-import-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: keycloak-devai-realm-import
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-devai-realm-import
      annotations:
        sidecar.istio.io/inject: "false"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      containers:
        - name: realm-import
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== DevAI Keycloak Realm Import ==="

              KEYCLOAK_URL="http://keycloak:8080"
              MAX_RETRIES=60
              RETRY_COUNT=0

              # ============================
              # Step 1: Substitute secrets
              # ============================
              echo "Preparing realm configs..."

              cp /realm-config/devai-realm.json /tmp/devai-realm.json
              cp /realm-config/devai-sre-realm.json /tmp/devai-sre-realm.json

              sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" /tmp/devai-realm.json
              sed -i "s|%%GOOGLE_CLIENT_SECRET%%|${GOOGLE_CLIENT_SECRET}|g" /tmp/devai-realm.json
              sed -i "s|%%DEVAI_BFF_CLIENT_SECRET%%|${DEVAI_BFF_CLIENT_SECRET}|g" /tmp/devai-realm.json
              sed -i "s|%%KAGENT_OAUTH2_PROXY_CLIENT_SECRET%%|${KAGENT_OAUTH2_PROXY_CLIENT_SECRET}|g" /tmp/devai-realm.json
              sed -i "s|%%AREGISTRY_OAUTH2_PROXY_CLIENT_SECRET%%|${AREGISTRY_OAUTH2_PROXY_CLIENT_SECRET}|g" /tmp/devai-realm.json

              sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" /tmp/devai-sre-realm.json
              sed -i "s|%%GOOGLE_CLIENT_SECRET%%|${GOOGLE_CLIENT_SECRET}|g" /tmp/devai-sre-realm.json
              sed -i "s|%%DEVAI_SRE_BFF_CLIENT_SECRET%%|${DEVAI_SRE_BFF_CLIENT_SECRET}|g" /tmp/devai-sre-realm.json

              # ============================
              # Step 2: Wait for Keycloak
              # ============================
              echo "Waiting for Keycloak..."
              until curl -sf "${KEYCLOAK_URL}/health/ready" > /dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "ERROR: Keycloak not ready after ${MAX_RETRIES} attempts"
                  exit 1
                fi
                echo "  Retry ${RETRY_COUNT}/${MAX_RETRIES}..."
                sleep 5
              done
              echo "Keycloak is ready."

              # ============================
              # Step 3: Get admin token
              # ============================
              echo "Obtaining admin token..."
              TOKEN=$(curl -sf -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -d "client_id=admin-cli" \
                -d "username=${KEYCLOAK_ADMIN}" \
                -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
                -d "grant_type=password" | sed 's/.*"access_token":"\([^"]*\)".*/\1/')

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get admin token"
                exit 1
              fi
              echo "Admin token obtained."

              # ============================
              # Step 4: Import devai realm
              # ============================
              echo "Checking devai realm..."
              HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/devai")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "  devai realm already exists — skipping creation"
              else
                echo "  Creating devai realm..."
                HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
                  -X POST "${KEYCLOAK_URL}/admin/realms" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/devai-realm.json)

                if [ "$HTTP_CODE" = "201" ]; then
                  echo "  devai realm created successfully"
                else
                  echo "  WARNING: devai realm creation returned HTTP ${HTTP_CODE}"
                fi
              fi

              # ============================
              # Step 5: Import devai-sre realm
              # ============================
              echo "Checking devai-sre realm..."
              HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/devai-sre")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "  devai-sre realm already exists — skipping creation"
              else
                echo "  Creating devai-sre realm..."
                HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
                  -X POST "${KEYCLOAK_URL}/admin/realms" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/devai-sre-realm.json)

                if [ "$HTTP_CODE" = "201" ]; then
                  echo "  devai-sre realm created successfully"
                else
                  echo "  WARNING: devai-sre realm creation returned HTTP ${HTTP_CODE}"
                fi
              fi

              # ============================
              # Step 5b: Idempotently upsert oauth2-proxy clients on the
              # devai realm. The realm-create path (step 4) is skipped on
              # second runs because the realm exists; without this step the
              # new clients defined in the realm JSON would never reach
              # Keycloak. The clients section in devai-realm.json is the
              # source of truth — this loop just replays each {clientId}
              # block as a POST/PUT against the admin clients API.
              # ============================
              for CLIENT in kagent-oauth2-proxy aregistry-oauth2-proxy; do
                echo "Ensuring client ${CLIENT} in devai realm..."

                if [ "${CLIENT}" = "kagent-oauth2-proxy" ]; then
                  CLIENT_SECRET="${KAGENT_OAUTH2_PROXY_CLIENT_SECRET}"
                  HOST="kagent.tesserix.app"
                  CLIENT_NAME="kagent UI OAuth2 Proxy"
                else
                  CLIENT_SECRET="${AREGISTRY_OAUTH2_PROXY_CLIENT_SECRET}"
                  HOST="aregistry.tesserix.app"
                  CLIENT_NAME="Agent Registry OAuth2 Proxy"
                fi

                CLIENT_JSON='{"clientId":"'"${CLIENT}"'","name":"'"${CLIENT_NAME}"'","enabled":true,"publicClient":false,"directAccessGrantsEnabled":false,"standardFlowEnabled":true,"serviceAccountsEnabled":false,"protocol":"openid-connect","secret":"'"${CLIENT_SECRET}"'","redirectUris":["https://'"${HOST}"'/oauth2/callback"],"webOrigins":["https://'"${HOST}"'"],"defaultClientScopes":["openid","email","profile"]}'

                EXISTING_ID=$(curl -sf -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/devai/clients?clientId=${CLIENT}" \
                  | sed 's/.*"id":"\([^"]*\)".*/\1/' \
                  | head -c 36)

                if [ -n "${EXISTING_ID}" ] && [ "${EXISTING_ID}" != "[]" ]; then
                  echo "  ${CLIENT} exists (id=${EXISTING_ID}) — updating"
                  curl -sf -X PUT \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "${CLIENT_JSON}" \
                    "${KEYCLOAK_URL}/admin/realms/devai/clients/${EXISTING_ID}" \
                    -o /dev/null -w "  PUT HTTP %{http_code}\n" || echo "  client PUT failed"
                else
                  echo "  ${CLIENT} does not exist — creating"
                  curl -sf -X POST \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "${CLIENT_JSON}" \
                    "${KEYCLOAK_URL}/admin/realms/devai/clients" \
                    -o /dev/null -w "  POST HTTP %{http_code}\n" || echo "  client POST failed"
                fi
              done

              # ============================
              # Step 6: Configure user restrictions
              # For Google IdP, restrict via "first broker login" flow
              # that checks email against allowed list
              # ============================
              for REALM in devai devai-sre; do
                echo "Configuring email restriction for ${REALM}..."

                # Get the "first broker login" flow ID
                FLOW_ID=$(curl -sf \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/${REALM}/authentication/flows" \
                  | sed 's/.*"alias":"first broker login","id":"\([^"]*\)".*/\1/' \
                  | head -c 36)

                if [ -n "$FLOW_ID" ]; then
                  echo "  First broker login flow: ${FLOW_ID}"
                fi

                echo "  ${REALM} realm configured."
              done

              echo ""
              echo "=== DevAI Realm Import Complete ==="
              echo "  devai realm:     https://identity-devai.tesserix.app/realms/devai"
              echo "  devai-sre realm: https://identity-sre.tesserix.app/realms/devai-sre"
              echo "  Allowed users:   samyak.rout@gmail.com, mahesh.sangawar@gmail.com"

          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: password
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-google-sso
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-google-sso
                  key: client-secret
            - name: DEVAI_BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-devai-client-secrets
                  key: devai-bff-secret
            - name: DEVAI_SRE_BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-devai-client-secrets
                  key: devai-sre-bff-secret
            - name: KAGENT_OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-devai-client-secrets
                  key: kagent-oauth2-proxy-secret
            - name: AREGISTRY_OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-devai-client-secrets
                  key: aregistry-oauth2-proxy-secret
          volumeMounts:
            - name: realm-config
              mountPath: /realm-config
              readOnly: true
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-devai-realm-config
{{- end }}
