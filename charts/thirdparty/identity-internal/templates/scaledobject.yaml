{{- if and .Values.keycloak.enabled .Values.keycloak.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
    app.kubernetes.io/component: keycloak
spec:
  scaleTargetRef:
    name: keycloak
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: {{ .Values.keycloak.autoscaling.minReplicas | default 2 }}
  maxReplicaCount: {{ .Values.keycloak.autoscaling.maxReplicas | default 20 }}
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "{{ .Values.keycloak.autoscaling.targetMemoryUtilizationPercentage | default 75 }}"
{{- end }}
