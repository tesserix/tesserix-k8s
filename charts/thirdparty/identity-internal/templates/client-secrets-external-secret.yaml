{{- if and .Values.keycloak.enabled .Values.keycloak.externalSecrets.enabled }}
# =============================================================================
# External Secret for Keycloak Client Secrets
# Syncs client secrets from GCP Secret Manager to Kubernetes Secret
# =============================================================================
# GCP Secret Naming Convention: {environment}-{secret-name}
# Example: devtest-keycloak-admin-bff-client-secret
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-client-secrets
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
    app.kubernetes.io/component: secrets
spec:
  # How often to sync secrets from GCP (default: 1h)
  refreshInterval: {{ .Values.keycloak.externalSecrets.refreshInterval | default "1h" }}

  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: {{ .Values.keycloak.externalSecrets.secretStore | default "gcp-secret-store" }}
    kind: ClusterSecretStore

  # Target Kubernetes secret configuration
  target:
    name: keycloak-client-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: keycloak
          app.kubernetes.io/part-of: identity-internal

  # Map GCP secrets to Kubernetes secret keys
  # GCP secret names follow Terraform convention: {env}-keycloak-{name}
  data:
    # Admin BFF client secret
    # GCP Secret: devtest-keycloak-admin-bff-client-secret (or per environment)
    - secretKey: admin-bff-client-secret
      remoteRef:
        key: {{ .Values.keycloak.externalSecrets.secrets.adminBffClientSecret }}
        version: latest

    # Token exchange target client secret
    # GCP Secret: devtest-keycloak-token-exchange-client-secret (or per environment)
    - secretKey: token-exchange-client-secret
      remoteRef:
        key: {{ .Values.keycloak.externalSecrets.secrets.tokenExchangeClientSecret }}
        version: latest

    # Admin CLI client secret (for tenant-service user management)
    # GCP Secret: devtest-keycloak-internal-admin-client-secret
    {{- if .Values.keycloak.externalSecrets.secrets.adminClientSecret }}
    - secretKey: admin-client-secret
      remoteRef:
        key: {{ .Values.keycloak.externalSecrets.secrets.adminClientSecret }}
        version: latest
    {{- end }}

    # Marketplace Dashboard client secret (for auth-bff)
    # GCP Secret: devtest-keycloak-internal-dashboard-client-secret
    {{- if .Values.keycloak.externalSecrets.secrets.dashboardClientSecret }}
    - secretKey: dashboard-client-secret
      remoteRef:
        key: {{ .Values.keycloak.externalSecrets.secrets.dashboardClientSecret }}
        version: latest
    {{- end }}

    # HomeChef Admin BFF client secret (for homechef-auth-bff in admin context)
    # GCP Secret: prod-homechef-internal-keycloak-client-secret
    # Shared with charts/apps/homechef-auth-bff/templates/externalsecret.yaml
    # so the BFF and Keycloak realm import use the same value.
    {{- if .Values.keycloak.externalSecrets.secrets.homechefAdminBffClientSecret }}
    - secretKey: homechef-admin-bff-client-secret
      remoteRef:
        key: {{ .Values.keycloak.externalSecrets.secrets.homechefAdminBffClientSecret }}
        version: latest
    {{- end }}
{{- end }}
