{{- if .Values.keycloak.enabled }}
# Istio Authorization Policy for Keycloak
# Allows public access to Keycloak endpoints (login, token, OIDC discovery)
# The deny-all-default mesh policy requires explicit ALLOW rules
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-keycloak-internal
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend-access
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  action: ALLOW
  rules:
    # Allow all traffic to Keycloak - authentication is handled by Keycloak itself
    - {}
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
---
# Allow apps to access identity-internal from specific namespaces
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-apps-to-identity-internal
  labels:
    app.kubernetes.io/name: authz-policy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: istio-auth-policies
spec:
  action: ALLOW
  rules:
    # Allow from istio-ingress (external traffic)
    - from:
        - source:
            namespaces:
              - istio-ingress
    # Allow from devtest namespace (BFF and services)
    - from:
        - source:
            namespaces:
              - devtest
    # Allow from marketplace namespace
    - from:
        - source:
            namespaces:
              - marketplace
    # Allow from global namespace (shared services)
    - from:
        - source:
            namespaces:
              - global
    # Allow from monitoring namespace (Prometheus scraping)
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system
    # Allow internal namespace traffic (realm import job, redis, etc.)
    - from:
        - source:
            namespaces:
              - identity-internal
{{- end }}
