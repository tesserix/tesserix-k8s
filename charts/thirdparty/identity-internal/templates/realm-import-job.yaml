{{- if .Values.keycloak.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-import-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: keycloak-realm-import
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      containers:
        - name: realm-import
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting Keycloak realm import..."

              KEYCLOAK_URL="http://keycloak:8080"
              MAX_RETRIES=60
              RETRY_COUNT=0

              # =================================================================
              # Step 1: Substitute secrets in realm configuration
              # =================================================================
              echo "Preparing realm configuration with secrets..."

              # Copy realm configs to writable location and substitute secrets
              cp /realm-config/tesserix-internal-realm.json /tmp/realm.json
              cp /realm-config/stockpilot-realm.json /tmp/stockpilot-realm.json

              # Substitute client secrets from environment variables
              sed -i "s|%%ADMIN_BFF_CLIENT_SECRET%%|${ADMIN_BFF_CLIENT_SECRET}|g" /tmp/realm.json
              sed -i "s|%%TOKEN_EXCHANGE_CLIENT_SECRET%%|${TOKEN_EXCHANGE_CLIENT_SECRET}|g" /tmp/realm.json
              sed -i "s|%%ADMIN_CLIENT_SECRET%%|${ADMIN_CLIENT_SECRET}|g" /tmp/realm.json
              sed -i "s|%%DASHBOARD_CLIENT_SECRET%%|${DASHBOARD_CLIENT_SECRET}|g" /tmp/realm.json
              sed -i "s|%%HOMECHEF_ADMIN_BFF_CLIENT_SECRET%%|${HOMECHEF_ADMIN_BFF_CLIENT_SECRET}|g" /tmp/realm.json
              sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" /tmp/realm.json
              sed -i "s|%%GOOGLE_CLIENT_SECRET%%|${GOOGLE_CLIENT_SECRET}|g" /tmp/realm.json

              # Substitute secrets in stockpilot realm
              sed -i "s|%%STOCKPILOT_WEB_CLIENT_SECRET%%|${STOCKPILOT_WEB_CLIENT_SECRET}|g" /tmp/stockpilot-realm.json
              sed -i "s|%%GOOGLE_CLIENT_ID%%|${GOOGLE_CLIENT_ID}|g" /tmp/stockpilot-realm.json
              sed -i "s|%%GOOGLE_CLIENT_SECRET%%|${GOOGLE_CLIENT_SECRET}|g" /tmp/stockpilot-realm.json

              echo "Realm configuration prepared with secrets"

              # =================================================================
              # Step 2: Wait for Keycloak to be ready
              # =================================================================
              echo "Waiting for Keycloak to be ready..."
              TOKEN=""
              while [ -z "$TOKEN" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" \
                  -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                if [ -z "$TOKEN" ]; then
                  echo "Waiting for Keycloak... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                fi
              done

              if [ -z "$TOKEN" ]; then
                echo "Failed to get admin token after $MAX_RETRIES attempts"
                exit 1
              fi

              echo "Got admin token, checking if realm exists..."

              # =================================================================
              # Step 3: Check if realm exists
              # =================================================================
              # Note: Using -s (silent) without -f (fail) to capture HTTP status code
              # -f would cause curl to exit with error 22 on 404, preventing status capture
              REALM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/tesserix-internal")

              echo "Realm check returned status: $REALM_STATUS"

              if [ "$REALM_STATUS" = "200" ]; then
                echo "Realm tesserix-internal already exists, skipping import"
                exit 0
              fi

              if [ "$REALM_STATUS" != "404" ]; then
                echo "Unexpected status checking realm: $REALM_STATUS"
                exit 1
              fi

              echo "Realm does not exist, proceeding with import..."

              # =================================================================
              # Step 4: Import realm with substituted secrets
              # =================================================================
              echo "Importing realm configuration..."

              # Capture both response body and HTTP status code for debugging
              IMPORT_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$KEYCLOAK_URL/admin/realms" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d @/tmp/realm.json)

              # Extract HTTP status code (last line)
              IMPORT_STATUS=$(echo "$IMPORT_RESPONSE" | tail -n1)
              # Extract response body (all but last line)
              IMPORT_BODY=$(echo "$IMPORT_RESPONSE" | sed '$d')

              echo "Import returned status: $IMPORT_STATUS"

              if [ "$IMPORT_STATUS" = "201" ] || [ "$IMPORT_STATUS" = "204" ]; then
                echo "Realm imported successfully!"
              else
                echo "Failed to import realm. Response: $IMPORT_BODY"
                exit 1
              fi

              # =================================================================
              # Step 4b: Import stockpilot realm
              # =================================================================
              echo "Checking stockpilot realm..."

              SP_REALM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/stockpilot")

              if [ "$SP_REALM_STATUS" = "200" ]; then
                echo "Realm stockpilot already exists, skipping import"
              elif [ "$SP_REALM_STATUS" = "404" ]; then
                echo "Importing stockpilot realm..."
                SP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$KEYCLOAK_URL/admin/realms" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/stockpilot-realm.json)
                SP_STATUS=$(echo "$SP_RESPONSE" | tail -n1)
                if [ "$SP_STATUS" = "201" ] || [ "$SP_STATUS" = "204" ]; then
                  echo "StockPilot realm imported successfully!"
                else
                  echo "Warning: Failed to import stockpilot realm (status: $SP_STATUS)"
                fi
              fi

              # =================================================================
              # Step 5: Configure Password Policy
              # =================================================================
              # Password policy is applied separately to avoid conflicts with
              # client secret validation during realm import
              echo "Configuring password policy..."

              PASSWORD_POLICY="{{ .Values.passwordPolicy }}"
              POLICY_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "$KEYCLOAK_URL/admin/realms/tesserix-internal" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"passwordPolicy\": \"$PASSWORD_POLICY\"}")

              POLICY_STATUS=$(echo "$POLICY_RESPONSE" | tail -n1)
              if [ "$POLICY_STATUS" = "204" ]; then
                echo "Password policy configured successfully!"
              else
                echo "Warning: Could not configure password policy (status: $POLICY_STATUS)"
              fi

              # Configure Token Exchange Permissions
              echo "Configuring token exchange permissions..."

              # Get a fresh admin token
              TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=$KEYCLOAK_ADMIN" \
                -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

              if [ -z "$TOKEN" ]; then
                echo "Warning: Could not get admin token for token exchange setup"
                exit 0
              fi

              # Get the admin-bff client ID
              ADMIN_BFF_ID=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients?clientId=admin-bff" \
                -H "Authorization: Bearer $TOKEN" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

              if [ -z "$ADMIN_BFF_ID" ]; then
                echo "Warning: Could not find admin-bff client"
                exit 0
              fi

              echo "Found admin-bff client: $ADMIN_BFF_ID"

              # Get service account user for admin-bff
              SERVICE_ACCOUNT=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$ADMIN_BFF_ID/service-account-user" \
                -H "Authorization: Bearer $TOKEN")

              SERVICE_ACCOUNT_ID=$(echo "$SERVICE_ACCOUNT" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')

              if [ -z "$SERVICE_ACCOUNT_ID" ]; then
                echo "Warning: Could not find service account for admin-bff"
                exit 0
              fi

              echo "Found service account: $SERVICE_ACCOUNT_ID"

              # Get realm-management client for impersonation roles
              REALM_MGMT_ID=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients?clientId=realm-management" \
                -H "Authorization: Bearer $TOKEN" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

              if [ -n "$REALM_MGMT_ID" ]; then
                echo "Found realm-management client: $REALM_MGMT_ID"

                # Get impersonation role
                IMPERSONATION_ROLE=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$REALM_MGMT_ID/roles/impersonation" \
                  -H "Authorization: Bearer $TOKEN")

                if [ -n "$IMPERSONATION_ROLE" ]; then
                  echo "Assigning impersonation role to admin-bff service account..."

                  # Assign impersonation role to service account
                  curl -sf -X POST "$KEYCLOAK_URL/admin/realms/tesserix-internal/users/$SERVICE_ACCOUNT_ID/role-mappings/clients/$REALM_MGMT_ID" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "[$IMPERSONATION_ROLE]"

                  echo "Impersonation role assigned successfully!"
                fi
              fi

              # Enable token exchange feature if not already enabled (Keycloak 24+)
              echo "Checking/enabling token exchange feature..."

              # Get token-exchange-target client ID
              TARGET_CLIENT_ID=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients?clientId=token-exchange-target" \
                -H "Authorization: Bearer $TOKEN" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

              if [ -n "$TARGET_CLIENT_ID" ]; then
                echo "Found token-exchange-target client: $TARGET_CLIENT_ID"

                # Verify authorization settings are enabled
                CLIENT_INFO=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$TARGET_CLIENT_ID" \
                  -H "Authorization: Bearer $TOKEN")

                echo "Token exchange target client configured"
              fi

              echo "Token exchange configuration completed!"

              # =================================================================
              # Step 6: Configure token exchange for marketplace-onboarding-admin
              # =================================================================
              # This allows tenant-service to issue tokens for users via token exchange
              # (used for passkey/WebAuthn authentication and Google OAuth login)
              echo "Configuring marketplace-dashboard token exchange for onboarding admin..."

              # Get marketplace-dashboard client UUID
              DASHBOARD_ID=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients?clientId=marketplace-dashboard" \
                -H "Authorization: Bearer $TOKEN" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

              if [ -z "$DASHBOARD_ID" ]; then
                echo "Warning: Could not find marketplace-dashboard client"
              else
                echo "Found marketplace-dashboard client: $DASHBOARD_ID"

                # Enable management permissions on marketplace-dashboard
                MGMT_PERMS=$(curl -sf -X PUT "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$DASHBOARD_ID/management/permissions" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"enabled": true}')

                TOKEN_EXCHANGE_PERM_ID=$(echo "$MGMT_PERMS" | sed -n 's/.*"token-exchange":"\([^"]*\)".*/\1/p')
                echo "Token exchange permission ID: $TOKEN_EXCHANGE_PERM_ID"

                # Get marketplace-onboarding-admin client UUID
                ONBOARDING_ADMIN_ID=$(curl -sf "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients?clientId=marketplace-onboarding-admin" \
                  -H "Authorization: Bearer $TOKEN" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                if [ -n "$ONBOARDING_ADMIN_ID" ] && [ -n "$REALM_MGMT_ID" ] && [ -n "$TOKEN_EXCHANGE_PERM_ID" ]; then
                  echo "Creating token exchange policy for marketplace-onboarding-admin..."

                  # Create client policy allowing marketplace-onboarding-admin
                  POLICY_RESULT=$(curl -sf -X POST "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$REALM_MGMT_ID/authz/resource-server/policy/client" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"name\":\"onboarding-admin-token-exchange-policy\",\"description\":\"Allow marketplace-onboarding-admin to perform token exchange for passkey auth\",\"logic\":\"POSITIVE\",\"clients\":[\"$ONBOARDING_ADMIN_ID\"]}")

                  POLICY_ID=$(echo "$POLICY_RESULT" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)

                  if [ -n "$POLICY_ID" ]; then
                    echo "Policy created: $POLICY_ID"

                    # Associate policy with token-exchange permission
                    curl -sf -X PUT "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$REALM_MGMT_ID/authz/resource-server/permission/scope/$TOKEN_EXCHANGE_PERM_ID" \
                      -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"id\":\"$TOKEN_EXCHANGE_PERM_ID\",\"name\":\"token-exchange.permission.client.$DASHBOARD_ID\",\"type\":\"scope\",\"logic\":\"POSITIVE\",\"decisionStrategy\":\"AFFIRMATIVE\",\"policies\":[\"$POLICY_ID\"]}"

                    echo "Token exchange permission configured for marketplace-onboarding-admin"
                  fi
                fi

                # Enable users management permissions (for impersonation during token exchange)
                echo "Enabling users management permissions..."
                USERS_PERMS=$(curl -sf -X PUT "$KEYCLOAK_URL/admin/realms/tesserix-internal/users-management-permissions" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"enabled": true}')

                IMPERSONATE_PERM_ID=$(echo "$USERS_PERMS" | sed -n 's/.*"impersonate":"\([^"]*\)".*/\1/p')

                if [ -n "$IMPERSONATE_PERM_ID" ] && [ -n "$POLICY_ID" ]; then
                  echo "Configuring impersonation permission..."
                  curl -sf -X PUT "$KEYCLOAK_URL/admin/realms/tesserix-internal/clients/$REALM_MGMT_ID/authz/resource-server/permission/scope/$IMPERSONATE_PERM_ID" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"id\":\"$IMPERSONATE_PERM_ID\",\"name\":\"admin-impersonation.permission.users\",\"type\":\"scope\",\"logic\":\"POSITIVE\",\"decisionStrategy\":\"AFFIRMATIVE\",\"policies\":[\"$POLICY_ID\"]}"

                  echo "Impersonation permission configured!"
                fi
              fi

              echo "All Keycloak configuration completed!"
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            # Client secrets - loaded from GCP Secret Manager via External Secrets
            {{- if .Values.keycloak.externalSecrets.enabled }}
            - name: ADMIN_BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: admin-bff-client-secret
            - name: TOKEN_EXCHANGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: token-exchange-client-secret
            - name: ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: admin-client-secret
            - name: DASHBOARD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: dashboard-client-secret
            - name: HOMECHEF_ADMIN_BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: homechef-admin-bff-client-secret
            - name: STOCKPILOT_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: stockpilot-web-client-secret
            # Google OAuth credentials for Google Sign-In IDP
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.googleCredentialsSecret | default "keycloak-google-sso" }}
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminSSO.googleCredentialsSecret | default "keycloak-google-sso" }}
                  key: client-secret
            {{- else }}
            # Fallback to values.yaml (dev/test only - NOT for production)
            - name: ADMIN_BFF_CLIENT_SECRET
              value: {{ .Values.keycloak.adminBff.clientSecret | quote }}
            - name: TOKEN_EXCHANGE_CLIENT_SECRET
              value: {{ .Values.keycloak.tokenExchange.clientSecret | quote }}
            - name: ADMIN_CLIENT_SECRET
              value: "change-me-admin-client"
            - name: DASHBOARD_CLIENT_SECRET
              value: "change-me-dashboard-client"
            - name: HOMECHEF_ADMIN_BFF_CLIENT_SECRET
              value: "change-me-homechef-admin-bff-client"
            - name: STOCKPILOT_WEB_CLIENT_SECRET
              value: "change-me-stockpilot-web-secret"
            - name: GOOGLE_CLIENT_ID
              value: "change-me-google-client-id"
            - name: GOOGLE_CLIENT_SECRET
              value: "change-me-google-client-secret"
            {{- end }}
          volumeMounts:
            - name: realm-config
              mountPath: /realm-config
              readOnly: true
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
{{- end }}
