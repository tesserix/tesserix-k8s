{{- if .Values.keycloak.enabled }}
# =============================================================================
# HomeChef Admin Clients Bootstrap Job
# =============================================================================
# Adds the homechef-admin-bff client to the tesserix-internal realm if it
# does not already exist. Runs on every Helm install/upgrade as a post-hook
# and is fully idempotent — re-running is a no-op when the client is present.
#
# Why this exists:
#   The realm-import-job is one-shot (skips if the realm already exists), so
#   any client added to realm-configmap.yaml after the original import never
#   reaches live Keycloak. This job closes that gap for the homechef-admin-bff
#   client without requiring a destructive realm reimport.
#
# When this can be removed:
#   Once realm-import-job.yaml is refactored to upsert clients into existing
#   realms, this bootstrap job becomes redundant.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: homechef-clients-bootstrap-{{ now | date "20060102150405" }}
  labels:
    app.kubernetes.io/name: homechef-clients-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 6 puts this job AFTER realm-import (weight 5) but BEFORE the
    # devai realm import (weight 10) which is currently flapping. We do not
    # want a devai-side bug to block the homechef admin login from working.
    helm.sh/hook-weight: "6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homechef-clients-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.keycloak.serviceAccount.name | default "keycloak" }}
      containers:
        - name: bootstrap
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e

              KEYCLOAK_URL="http://keycloak:8080"
              REALM="tesserix-internal"
              MAX_RETRIES=60

              echo "Bootstrapping HomeChef admin clients in realm $REALM..."

              # =================================================================
              # Step 1: Wait for Keycloak admin API and obtain access token
              # =================================================================
              TOKEN=""
              RETRY_COUNT=0
              while [ -z "$TOKEN" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                TOKEN=$(curl -sf -X POST "$KEYCLOAK_URL/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=$KEYCLOAK_ADMIN" \
                  -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                if [ -z "$TOKEN" ]; then
                  echo "Waiting for Keycloak admin API... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                fi
              done

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to authenticate to Keycloak after $MAX_RETRIES attempts"
                exit 1
              fi
              echo "Authenticated to Keycloak admin API"

              # =================================================================
              # Step 2: Verify the realm exists
              # =================================================================
              REALM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/$REALM")

              if [ "$REALM_STATUS" != "200" ]; then
                echo "Realm $REALM does not exist (status $REALM_STATUS) — realm-import job will create it; nothing to do."
                exit 0
              fi
              echo "Realm $REALM exists"

              # =================================================================
              # Step 3: Validate required client secret is present
              # =================================================================
              if [ -z "$HOMECHEF_ADMIN_BFF_CLIENT_SECRET" ] || \
                 [ "$HOMECHEF_ADMIN_BFF_CLIENT_SECRET" = "change-me-homechef-admin-bff-client" ]; then
                echo "ERROR: HOMECHEF_ADMIN_BFF_CLIENT_SECRET is not set or still default. Aborting."
                exit 1
              fi

              # =================================================================
              # Step 4: Upsert homechef-admin-bff client (confidential)
              # =================================================================
              # Client config mirrors realm-configmap.yaml exactly. If you change
              # the client config there, update this block too.
              CLIENT_ID="homechef-admin-bff"
              echo "Checking client $CLIENT_ID..."

              CLIENT_LOOKUP=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
                -H "Authorization: Bearer $TOKEN")

              if echo "$CLIENT_LOOKUP" | grep -q "\"clientId\":\"$CLIENT_ID\""; then
                echo "Client $CLIENT_ID already exists — no action"
              else
                echo "Creating client $CLIENT_ID..."
                cat > /tmp/homechef-admin-bff.json <<EOF
              {
                "clientId": "homechef-admin-bff",
                "name": "HomeChef Admin BFF",
                "description": "Confidential client for HomeChef auth BFF admin context",
                "enabled": true,
                "publicClient": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "${HOMECHEF_ADMIN_BFF_CLIENT_SECRET}",
                "standardFlowEnabled": true,
                "implicitFlowEnabled": false,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": true,
                "protocol": "openid-connect",
                "redirectUris": [
                  "https://fe3dr.com/bff/callback",
                  "https://fe3dr.com/*",
                  "https://admin.fe3dr.com/bff/callback",
                  "https://admin.fe3dr.com/*",
                  "https://delivery.fe3dr.com/bff/callback",
                  "https://delivery.fe3dr.com/*",
                  "http://localhost:5173/bff/callback",
                  "http://localhost:5175/bff/callback",
                  "http://localhost:8090/bff/callback"
                ],
                "webOrigins": [
                  "https://fe3dr.com",
                  "https://www.fe3dr.com",
                  "https://admin.fe3dr.com",
                  "https://delivery.fe3dr.com"
                ],
                "attributes": {
                  "pkce.code.challenge.method": "S256",
                  "post.logout.redirect.uris": "https://fe3dr.com/*##https://admin.fe3dr.com/*##https://delivery.fe3dr.com/*##http://localhost:5173/*##http://localhost:5175/*",
                  "backchannel.logout.session.required": "true"
                },
                "defaultClientScopes": ["openid", "email", "profile", "roles"],
                "optionalClientScopes": ["offline_access"]
              }
              EOF

                CREATE_STATUS=$(curl -s -o /tmp/create-resp -w "%{http_code}" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/clients" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/homechef-admin-bff.json)

                if [ "$CREATE_STATUS" = "201" ]; then
                  echo "Client $CLIENT_ID created"
                else
                  echo "ERROR: Failed to create client $CLIENT_ID (status $CREATE_STATUS): $(cat /tmp/create-resp)"
                  exit 1
                fi
              fi

              # =================================================================
              # Step 5: Ensure realm frontendUrl is set to the public URL
              # =================================================================
              # The internal Keycloak runs with --hostname-strict=false so the
              # discovery document URLs are derived from the request Host header.
              # Without an explicit frontendUrl attribute, the homechef-auth-bff
              # (which does discovery via the in-cluster service URL) gets back
              # http://keycloak.identity-internal.svc.cluster.local/... endpoints
              # and ends up sending browsers to a non-routable hostname. Setting
              # the realm-level frontendUrl pins discovery to the public URL for
              # this realm only, leaving devai/marketplace realms unaffected.
              FRONTEND_URL="https://internal-identity.fe3dr.com"
              echo "Ensuring realm $REALM frontendUrl is $FRONTEND_URL..."
              FU_STATUS=$(curl -s -o /tmp/fu-resp -w "%{http_code}" \
                -X PUT "$KEYCLOAK_URL/admin/realms/$REALM" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"realm\":\"$REALM\",\"attributes\":{\"frontendUrl\":\"$FRONTEND_URL\"}}")

              if [ "$FU_STATUS" = "204" ] || [ "$FU_STATUS" = "200" ]; then
                echo "Realm frontendUrl ensured"
              else
                echo "ERROR: Failed to set realm frontendUrl (status $FU_STATUS): $(cat /tmp/fu-resp)"
                exit 1
              fi

              # =================================================================
              # Step 6: Ensure realm role 'admin' exists
              # =================================================================
              # The homechef-auth-bff inspects the user's roles claim to decide
              # whether to grant admin access. Without an 'admin' realm role
              # the BFF falls back to a tenant-service lookup that is not
              # configured for HomeChef and the login bounces back.
              ROLE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                "$KEYCLOAK_URL/admin/realms/$REALM/roles/admin")

              if [ "$ROLE_STATUS" = "200" ]; then
                echo "Realm role 'admin' already exists"
              else
                echo "Creating realm role 'admin'..."
                CR_STATUS=$(curl -s -o /tmp/role-resp -w "%{http_code}" \
                  -X POST "$KEYCLOAK_URL/admin/realms/$REALM/roles" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"name":"admin","description":"HomeChef platform administrator"}')
                if [ "$CR_STATUS" = "201" ] || [ "$CR_STATUS" = "409" ]; then
                  echo "Realm role 'admin' ensured"
                else
                  echo "ERROR: Failed to create admin role (status $CR_STATUS): $(cat /tmp/role-resp)"
                  exit 1
                fi
              fi

              # =================================================================
              # Step 7: Add realm-roles protocol mapper to homechef-admin-bff
              # =================================================================
              # The mapper puts the user's realm roles into the 'roles' claim
              # of the access token, id token, and userinfo response. The BFF
              # reads this claim to decide admin access without calling out to
              # an external tenant-service.
              CLIENT_UUID=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
                -H "Authorization: Bearer $TOKEN" \
                | sed -n 's/.*"id":"\([^"]*\)".*"clientId":"homechef-admin-bff".*/\1/p' \
                | head -1)
              if [ -z "$CLIENT_UUID" ]; then
                CLIENT_UUID=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
                  -H "Authorization: Bearer $TOKEN" \
                  | sed -n 's/^[^"]*"id":"\([^"]*\)".*/\1/p' | head -1)
              fi
              echo "Client UUID for $CLIENT_ID: $CLIENT_UUID"

              if [ -n "$CLIENT_UUID" ]; then
                MAPPERS=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID/protocol-mappers/models" \
                  -H "Authorization: Bearer $TOKEN")
                if echo "$MAPPERS" | grep -q '"name":"realm-roles"'; then
                  echo "realm-roles mapper already present on $CLIENT_ID"
                else
                  echo "Adding realm-roles mapper to $CLIENT_ID..."
                  cat > /tmp/mapper.json <<'MAPPER'
              {
                "name": "realm-roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "config": {
                  "claim.name": "roles",
                  "jsonType.label": "String",
                  "multivalued": "true",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "userinfo.token.claim": "true"
                }
              }
              MAPPER
                  MS=$(curl -s -o /tmp/mapper-resp -w "%{http_code}" \
                    -X POST "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID/protocol-mappers/models" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d @/tmp/mapper.json)
                  if [ "$MS" = "201" ] || [ "$MS" = "409" ]; then
                    echo "realm-roles mapper ensured on $CLIENT_ID"
                  else
                    echo "ERROR: failed to add mapper (status $MS): $(cat /tmp/mapper-resp)"
                    exit 1
                  fi
                fi
              fi

              # =================================================================
              # Step 8: Ensure HomeChef admin users exist with the admin role
              # =================================================================
              # Pre-creating these users (matched by email) lets Keycloak's
              # Google IdP first-broker-login flow link the Google account to
              # the existing user record on first sign-in, so the resulting
              # session inherits the admin realm role immediately.
              ADMIN_EMAILS="samyak.rout@gmail.com mahesh.sangawar@gmail.com unidevidp@gmail.com"

              # Look up the admin role representation once for role mappings
              ADMIN_ROLE_JSON=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/roles/admin" \
                -H "Authorization: Bearer $TOKEN")
              ADMIN_ROLE_ID=$(echo "$ADMIN_ROLE_JSON" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)
              echo "admin role id: $ADMIN_ROLE_ID"

              for EMAIL in $ADMIN_EMAILS; do
                echo "--- Ensuring user $EMAIL ---"
                # Check existence
                LOOKUP=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/users?email=$EMAIL&exact=true" \
                  -H "Authorization: Bearer $TOKEN")
                USER_UUID=$(echo "$LOOKUP" | sed -n 's/^[^"]*"id":"\([^"]*\)".*/\1/p' | head -1)

                if [ -z "$USER_UUID" ]; then
                  echo "Creating user $EMAIL..."
                  cat > /tmp/user.json <<EOF
              {
                "username": "$EMAIL",
                "email": "$EMAIL",
                "emailVerified": true,
                "enabled": true
              }
              EOF
                  US=$(curl -s -o /tmp/user-resp -w "%{http_code}" \
                    -X POST "$KEYCLOAK_URL/admin/realms/$REALM/users" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d @/tmp/user.json)
                  if [ "$US" != "201" ] && [ "$US" != "409" ]; then
                    echo "ERROR: Failed to create $EMAIL (status $US): $(cat /tmp/user-resp)"
                    exit 1
                  fi
                  # Re-fetch to get the UUID
                  LOOKUP=$(curl -sf "$KEYCLOAK_URL/admin/realms/$REALM/users?email=$EMAIL&exact=true" \
                    -H "Authorization: Bearer $TOKEN")
                  USER_UUID=$(echo "$LOOKUP" | sed -n 's/^[^"]*"id":"\([^"]*\)".*/\1/p' | head -1)
                fi
                echo "user uuid for $EMAIL: $USER_UUID"

                if [ -n "$USER_UUID" ] && [ -n "$ADMIN_ROLE_ID" ]; then
                  # Idempotent assignment — Keycloak returns 204 on success or
                  # 204 again if role is already mapped, no harm in re-posting.
                  RM_BODY="[{\"id\":\"$ADMIN_ROLE_ID\",\"name\":\"admin\"}]"
                  RM=$(curl -s -o /tmp/rm-resp -w "%{http_code}" \
                    -X POST "$KEYCLOAK_URL/admin/realms/$REALM/users/$USER_UUID/role-mappings/realm" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "$RM_BODY")
                  if [ "$RM" = "204" ] || [ "$RM" = "200" ]; then
                    echo "admin role assigned to $EMAIL"
                  else
                    echo "WARN: role assignment to $EMAIL returned $RM: $(cat /tmp/rm-resp)"
                  fi
                fi
              done

              echo "HomeChef admin clients bootstrap complete"
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.usernameKey }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.admin.existingSecret }}
                  key: {{ .Values.keycloak.admin.passwordKey }}
            {{- if .Values.keycloak.externalSecrets.enabled }}
            - name: HOMECHEF_ADMIN_BFF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: homechef-admin-bff-client-secret
            {{- else }}
            - name: HOMECHEF_ADMIN_BFF_CLIENT_SECRET
              value: "change-me-homechef-admin-bff-client"
            {{- end }}
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
