{{- if .Values.keycloak.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
spec:
  hosts:
    - {{ .Values.keycloak.hostname | quote }}
    {{- range .Values.keycloak.additionalHosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - istio-ingress/tesseract-gateway
  exportTo:
    - "."
    - "istio-ingress"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: keycloak.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.keycloak.service.port | default 8080 }}
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 20s
        retryOn: gateway-error,connect-failure,refused-stream
{{- end }}
