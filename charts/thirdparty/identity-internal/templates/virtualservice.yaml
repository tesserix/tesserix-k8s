{{- /*
  Only render this VirtualService when an explicit hostname is configured.
  In prod, routing for internal-identity.fe3dr.com is provided by the
  istio-config chart (internal-identity-fe3dr-vs) and this chart's hostname
  is intentionally left empty to avoid a duplicate / empty-host VS.
*/ -}}
{{- if and .Values.keycloak.enabled .Values.keycloak.hostname }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
spec:
  hosts:
    - {{ .Values.keycloak.hostname | quote }}
  gateways:
    - istio-ingress/tesseract-gateway
  exportTo:
    - "."
    - "istio-ingress"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: keycloak.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.keycloak.service.port | default 8080 }}
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 20s
        retryOn: gateway-error,connect-failure,refused-stream
{{- end }}
