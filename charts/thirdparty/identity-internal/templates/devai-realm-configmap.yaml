{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-devai-realm-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
data:
  devai-realm.json: |
    {
      "realm": "devai",
      "enabled": true,
      "displayName": "DevAI ALM Platform",
      "displayNameHtml": "<strong>DevAI</strong> ALM Platform",
      "registrationAllowed": false,
      "rememberMe": true,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": true,
      "maxFailureWaitSeconds": 3600,
      "minimumQuickLoginWaitSeconds": 120,
      "waitIncrementSeconds": 120,
      "maxDeltaTimeSeconds": 86400,
      "failureFactor": 3,
      "sslRequired": "external",
      "ssoSessionIdleTimeout": 900,
      "ssoSessionMaxLifespan": 28800,
      "accessTokenLifespan": 300,
      "accessCodeLifespan": 60,
      "accessCodeLifespanUserAction": 300,
      "roles": {
        "realm": [
          { "name": "admin", "description": "Full platform access" },
          { "name": "viewer", "description": "Read-only dashboard access" }
        ]
      },
      "defaultRoles": ["viewer"],
      "identityProviders": [
        {
          "alias": "google",
          "providerId": "google",
          "enabled": true,
          "trustEmail": true,
          "storeToken": false,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "%%GOOGLE_CLIENT_ID%%",
            "clientSecret": "%%GOOGLE_CLIENT_SECRET%%",
            "useJwksUrl": "true",
            "syncMode": "IMPORT",
            "defaultScope": "openid email profile"
          }
        }
      ],
      "identityProviderMappers": [
        {
          "name": "email-to-username",
          "identityProviderAlias": "google",
          "identityProviderMapper": "hardcoded-attribute-idp-mapper",
          "config": {
            "syncMode": "INHERIT",
            "attribute": "emailVerified",
            "attribute.value": "true"
          }
        }
      ],
      "clients": [
        {
          "clientId": "devai-dashboard",
          "name": "DevAI Dashboard",
          "enabled": true,
          "publicClient": true,
          "directAccessGrantsEnabled": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "protocol": "openid-connect",
          "rootUrl": "https://devai.tesserix.app",
          "baseUrl": "/",
          "redirectUris": [
            "https://devai.tesserix.app/*",
            "http://localhost:3100/*"
          ],
          "webOrigins": [
            "https://devai.tesserix.app",
            "http://localhost:3100"
          ],
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "devai-bff",
          "name": "DevAI Auth BFF",
          "enabled": true,
          "publicClient": false,
          "directAccessGrantsEnabled": false,
          "standardFlowEnabled": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "secret": "%%DEVAI_BFF_CLIENT_SECRET%%",
          "redirectUris": [
            "https://devai.tesserix.app/*",
            "http://localhost:3100/*"
          ],
          "webOrigins": [
            "https://devai.tesserix.app"
          ],
          "defaultClientScopes": ["openid", "email", "profile", "roles"]
        }
      ],
      "users": [
        {
          "username": "samyak.rout@gmail.com",
          "email": "samyak.rout@gmail.com",
          "emailVerified": true,
          "enabled": true,
          "firstName": "Samyak",
          "lastName": "Rout",
          "realmRoles": ["admin"]
        },
        {
          "username": "mahesh.sangawar@gmail.com",
          "email": "mahesh.sangawar@gmail.com",
          "emailVerified": true,
          "enabled": true,
          "firstName": "Mahesh",
          "lastName": "Sangawar",
          "realmRoles": ["admin"]
        }
      ],
      "authenticationFlows": [
        {
          "alias": "devai-browser",
          "description": "DevAI browser flow - Google only for allowed users",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "identity-provider-redirector",
              "authenticatorConfig": "google-redirector",
              "requirement": "ALTERNATIVE",
              "priority": 10
            }
          ]
        }
      ],
      "authenticatorConfig": [
        {
          "alias": "google-redirector",
          "config": {
            "defaultProvider": "google"
          }
        }
      ]
    }
  devai-sre-realm.json: |
    {
      "realm": "devai-sre",
      "enabled": true,
      "displayName": "DevAI SRE Platform",
      "displayNameHtml": "<strong>DevAI</strong> SRE Monitoring",
      "registrationAllowed": false,
      "rememberMe": true,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": true,
      "maxFailureWaitSeconds": 3600,
      "failureFactor": 3,
      "sslRequired": "external",
      "ssoSessionIdleTimeout": 900,
      "ssoSessionMaxLifespan": 28800,
      "accessTokenLifespan": 300,
      "roles": {
        "realm": [
          { "name": "admin", "description": "Full SRE access" },
          { "name": "viewer", "description": "Read-only monitoring" }
        ]
      },
      "defaultRoles": ["viewer"],
      "identityProviders": [
        {
          "alias": "google",
          "providerId": "google",
          "enabled": true,
          "trustEmail": true,
          "storeToken": false,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "%%GOOGLE_CLIENT_ID%%",
            "clientSecret": "%%GOOGLE_CLIENT_SECRET%%",
            "useJwksUrl": "true",
            "syncMode": "IMPORT",
            "defaultScope": "openid email profile"
          }
        }
      ],
      "clients": [
        {
          "clientId": "devai-sre-dashboard",
          "name": "DevAI SRE Dashboard",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "protocol": "openid-connect",
          "rootUrl": "https://sre.tesserix.app",
          "baseUrl": "/",
          "redirectUris": [
            "https://sre.tesserix.app/*",
            "http://localhost:3200/*"
          ],
          "webOrigins": [
            "https://sre.tesserix.app",
            "http://localhost:3200"
          ],
          "defaultClientScopes": ["openid", "email", "profile", "roles"],
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "devai-sre-bff",
          "name": "DevAI SRE Auth BFF",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect",
          "secret": "%%DEVAI_SRE_BFF_CLIENT_SECRET%%",
          "redirectUris": [
            "https://sre.tesserix.app/*",
            "http://localhost:3200/*"
          ],
          "webOrigins": [
            "https://sre.tesserix.app"
          ],
          "defaultClientScopes": ["openid", "email", "profile", "roles"]
        }
      ],
      "users": [
        {
          "username": "samyak.rout@gmail.com",
          "email": "samyak.rout@gmail.com",
          "emailVerified": true,
          "enabled": true,
          "firstName": "Samyak",
          "lastName": "Rout",
          "realmRoles": ["admin"]
        },
        {
          "username": "mahesh.sangawar@gmail.com",
          "email": "mahesh.sangawar@gmail.com",
          "emailVerified": true,
          "enabled": true,
          "firstName": "Mahesh",
          "lastName": "Sangawar",
          "realmRoles": ["admin"]
        }
      ]
    }
{{- end }}
