{{- if .Values.keycloak.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-devai-client-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: identity-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: keycloak-devai-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: devai-bff-secret
      remoteRef:
        key: prod-keycloak-devai-bff-client-secret
    - secretKey: devai-sre-bff-secret
      remoteRef:
        key: prod-keycloak-devai-sre-bff-client-secret
    - secretKey: kagent-oauth2-proxy-secret
      remoteRef:
        key: prod-keycloak-kagent-oauth2-proxy-client-secret
    - secretKey: aregistry-oauth2-proxy-secret
      remoteRef:
        key: prod-keycloak-aregistry-oauth2-proxy-client-secret
{{- end }}
