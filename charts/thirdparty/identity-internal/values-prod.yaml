# Production overrides for identity-internal (Keycloak)
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 3

# Production hostname
hostname: "prod-internal-idp.tesserix.app"

# Production resource allocation
resources:
  limits:
    memory: 4Gi
  requests:
    memory: 2Gi

# Production ingress
ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: prod-internal-idp.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: identity-internal-tls
      hosts:
        - prod-internal-idp.tesserix.app

# High availability settings
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 2
