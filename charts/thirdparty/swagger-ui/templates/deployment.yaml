apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swagger-ui.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "swagger-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "swagger-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "swagger-ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "swagger-ui.serviceAccountName" . }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
      initContainers:
        # Copy OpenAPI spec to writable location
        - name: copy-spec
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /config/openapi.yaml /swagger-data/openapi.yaml
              echo "OpenAPI spec copied successfully"
          volumeMounts:
            - name: openapi-spec
              mountPath: /config
            - name: swagger-data
              mountPath: /swagger-data
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: swagger-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Use environment variables instead of config file
            - name: BASE_URL
              value: "{{ .Values.config.basePath }}"
            - name: SWAGGER_JSON
              value: "/swagger-data/openapi.yaml"
            - name: PAGE_TITLE
              value: "{{ .Values.config.title }}"
            - name: DEEP_LINKING
              value: "{{ .Values.config.deepLinking }}"
            - name: PERSIST_AUTHORIZATION
              value: "{{ .Values.config.persistAuthorization }}"
            - name: DISPLAY_REQUEST_DURATION
              value: "{{ .Values.config.displayRequestDuration }}"
            - name: TRY_IT_OUT_ENABLED
              value: "{{ .Values.config.tryItOutEnabled }}"
            {{- if eq .Values.config.validatorUrl "none" }}
            - name: VALIDATOR_URL
              value: ""
            {{- else if .Values.config.validatorUrl }}
            - name: VALIDATOR_URL
              value: "{{ .Values.config.validatorUrl }}"
            {{- end }}
          volumeMounts:
            - name: swagger-data
              mountPath: /swagger-data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
      volumes:
        - name: openapi-spec
          configMap:
            name: {{ include "swagger-ui.fullname" . }}-spec
        - name: swagger-data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
