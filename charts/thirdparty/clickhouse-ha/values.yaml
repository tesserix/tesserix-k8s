# Replicated ClickHouse — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/clickhouse-ha.yaml (the redis-global pattern).

# One shard, two replicas. Raising this adds REPLICAS, not shards — the shard
# count is fixed at 1 in the remote_servers template. At this data volume
# (~1.2GiB/day compressed) a single shard is correct; sharding adds a
# distributed-query hop for no benefit until the data outgrows one node's disk.
# PARKED 2026-08-01 at 0 for cost — restore to 2 to revive; the two 100Gi data
# PVCs are retained, so telemetry and table metadata survive the park.
replicaCount: 0

image:
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  # On a Spot pool every preemption re-pulls this image, so keeping the pull
  # inside asia-south1 removes both the egress cost and a slow cold start.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/clickhouse/clickhouse-server
  tag: "25.10.2.65"
  # IfNotPresent, deliberately. This is a third-party image on a pinned tag, so
  # the content behind that tag never changes and re-pulling gains nothing.
  # It matters here because the stack runs on a Spot pool: Always would re-pull
  # from GAR on every pod restart, and preemptions make restarts routine.
  # Our own images (obs-api, obs-ui) use Always instead, because they track a
  # moving `main` tag that genuinely does change.
  pullPolicy: IfNotPresent

# Logical cluster name. MUST match the `cluster_name` set on the otel-ingest
# collector's clickhouseexporter, otherwise the exporter creates plain
# (unreplicated) MergeTree tables and replication silently does nothing.
clusterName: otel

# Database the exporter targets.
database: otel

ports:
  http: 8123
  native: 9000
  # Replica-to-replica part transfer. Never exposed outside the namespace.
  interserver: 9009
  prometheus: 9363

keeper:
  # Client service of the clickhouse-keeper chart. Individual pods are listed
  # rather than the load-balanced service so the client can fail over between
  # quorum members itself.
  headless: clickhouse-keeper-headless
  service: clickhouse-keeper
  replicaCount: 3
  port: 9181
  sessionTimeoutMs: 30000
  operationTimeoutMs: 10000

auth:
  user: default
  existingSecret: clickhouse-secrets
  secretKey: clickhouse-password
  # Least-privilege user for obs-api. Read-only: it can run SELECTs against the
  # otel database and nothing else, so a compromised API cannot drop telemetry.
  readonly:
    enabled: true
    user: observer
    secretKey: observer-password
  # Dev-only self-contained Secret. MUST stay false in prod, where the Secret
  # named by existingSecret comes from an ExternalSecret.
  createPlaceholderSecret: false
  placeholderPassword: "changeme"

# Server tuning. Memory ratios are relative to the container limit, so they
# track `resources.limits.memory` automatically.
server:
  # Leave headroom under the cgroup limit so a query spike gets an out-of-memory
  # ERROR (retryable) instead of the kernel OOM-killing the whole server.
  maxServerMemoryUsageToRamRatio: 0.8
  maxConcurrentQueries: 100
  # MUST satisfy: backgroundPoolSize * background_merges_mutations_concurrency_ratio
  #               >= number_of_free_entries_in_pool_to_execute_mutation
  # With the ClickHouse defaults (ratio 2, mutation entries 20) anything below
  # 10 fails the startup sanity check outright. 8 was chosen here to cap merge
  # memory and the server refused to boot with:
  #   "The value of 'number_of_free_entries_in_pool_to_execute_mutation'
  #    setting (20) is greater than 'background_pool_size' *
  #    'background_merges_mutations_concurrency_ratio' (16)"
  # 16 is the upstream default and leaves margin above the threshold. Merge
  # memory is bounded by max_server_memory_usage_to_ram_ratio instead, which is
  # the correct lever for it.
  backgroundPoolSize: 16
  backgroundSchedulePoolSize: 16
  maxPartitionSizeToDrop: 0
  maxTableSizeToDrop: 0

persistence:
  # Measured: ~11.7GiB/day raw logs across the estate, ~1.2GiB/day after
  # ClickHouse compression. 30 days ≈ 40GiB; 100Gi is ~2.5x that, leaving room
  # for merge scratch space (a merge can transiently need 2x the part size).
  # The storage class allows expansion, so grow this rather than over-buying.
  size: 100Gi
  # Retain: a chart deletion must never destroy telemetry history.
  storageClassName: standard-rwo-retain

# Memory-only per platform policy: no CPU requests or limits anywhere.
resources:
  requests:
    memory: 6Gi
  limits:
    memory: 9Gi

service:
  type: ClusterIP

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9363"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  # uid/gid 101 is the `clickhouse` user in the official image.
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  # readOnlyRootFilesystem is deliberately NOT set on the clickhouse
  # container. Trivy flags it (KSV-0014) and is right in principle, but the
  # official entrypoint prepares directories outside the mounted paths on
  # first boot, so an immutable root turns a working deploy into a crash
  # loop. The init container above does run read-only. Revisit by testing in
  # a scratch namespace, not by flipping it here untested.
  capabilities:
    drop:
      - ALL

podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  # With 2 replicas, allow at most one down at a time.
  maxUnavailable: 1

# The Spot observability pool.
nodeSelector:
  workload: observability

tolerations:
  - key: workload
    operator: Equal
    value: observability
    effect: NoSchedule
