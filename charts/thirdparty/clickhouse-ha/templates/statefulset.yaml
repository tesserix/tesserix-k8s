apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse-ha.name" . }}
  labels:
    {{- include "clickhouse-ha.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickhouse-ha.headless" . }}
  replicas: {{ .Values.replicaCount }}
  # Replicas are independent once Keeper is up; bringing them up together
  # halves the time to a healthy pair after a node loss.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "clickhouse-ha.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # ClickHouse's native and interserver protocols are not HTTP; keeping
        # them off the mesh avoids sidecar-ordering races on replica recovery.
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "clickhouse-ha.selectorLabels" . | nindent 8 }}
        {{- include "clickhouse-ha.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          # Required, not preferred: two replicas sharing a node is not a
          # replica pair, and on a Spot pool that node can vanish at any time.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "clickhouse-ha.selectorLabels" . | nindent 18 }}
              topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # ClickHouse flushes in-memory parts on SIGTERM. Spot gives 30s notice, so
      # this mostly matters for planned drains; unflushed data is recovered from
      # the replica either way.
      terminationGracePeriodSeconds: 90
      initContainers:
        {{/*
        Assembles /etc/clickhouse-server/config.d into an emptyDir: the static
        fragments are copied from the ConfigMap, then the per-pod macros.xml is
        generated from the pod ordinal. macros cannot come from the ConfigMap
        because one ConfigMap is shared by every replica, and `replica` must
        differ per pod — it is the identity ReplicatedMergeTree registers in
        Keeper.
        */}}
        - name: config-gen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              cp /config-src/*.xml /config-out/
              ORDINAL="${HOSTNAME##*-}"
              FQDN="${HOSTNAME}.{{ include "clickhouse-ha.headless" . }}.{{ .Release.Namespace }}.svc.cluster.local"
              cat > /config-out/macros.xml <<EOF
              <clickhouse>
                <macros>
                  <cluster>{{ .Values.clusterName }}</cluster>
                  <shard>01</shard>
                  <replica>${HOSTNAME}</replica>
                </macros>
                <!-- How the peer replica reaches this pod to fetch parts. -->
                <interserver_http_host>${FQDN}</interserver_http_host>
              </clickhouse>
              EOF
              echo "generated macros for replica=${HOSTNAME} (ordinal ${ORDINAL}), interserver host ${FQDN}"
          volumeMounts:
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config
              mountPath: /config-out
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.auth.user | quote }}
            # Applied to the default user by the official entrypoint on first
            # boot, and read back by cluster.xml via from_env so replicas can
            # authenticate to each other.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: CLICKHOUSE_DB
              value: {{ .Values.database | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.ports.native }}
              protocol: TCP
            - name: interserver
              containerPort: {{ .Values.ports.interserver }}
              protocol: TCP
            - name: prometheus
              containerPort: {{ .Values.ports.prometheus }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d
            - name: users
              mountPath: /etc/clickhouse-server/users.d/users.xml
              subPath: users.xml
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # A replica rejoining after a preemption replays its Keeper log before
          # it answers /ping; 10 minutes of grace avoids a restart loop that
          # would never let it finish.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-src
          configMap:
            name: {{ include "clickhouse-ha.name" . }}-config
        - name: config
          emptyDir: {}
        - name: users
          configMap:
            name: {{ include "clickhouse-ha.name" . }}-users
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "clickhouse-ha.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
