{{- if .Values.auth.createPlaceholderSecret }}
{{/*
Dev convenience only, so the chart is self-contained outside the cluster. In
prod this Secret is owned by the ExternalSecret in
external-secrets/prod/observability and createPlaceholderSecret MUST be false —
otherwise Helm and External Secrets fight over the same object.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.existingSecret }}
  labels:
    {{- include "clickhouse-ha.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.placeholderPassword | quote }}
  {{- if .Values.auth.readonly.enabled }}
  {{ .Values.auth.readonly.secretKey }}: {{ .Values.auth.placeholderPassword | quote }}
  {{- end }}
{{- end }}
