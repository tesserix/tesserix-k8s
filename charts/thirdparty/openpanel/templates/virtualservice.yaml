{{/*
Ingress route for the dashboard and the event-ingestion API.
Host is derived from config.dashboardUrl so it stays correct across environments.
*/}}
{{- if .Values.ingress.enabled }}
{{- $host := .Values.config.dashboardUrl | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "openpanel.fullname" . }}
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ $host | quote }}
  gateways:
    - {{ .Values.ingress.gateway | quote }}
  http:
{{- if .Values.oauth2Proxy.enabled }}
    # Auth surface. ALLOW_REGISTRATION gates sign-in and sign-up with one flag
    # upstream, so these must not bypass the proxy or anyone could self-register.
    # Istio strips /api here; oauth2-proxy maps the remainder back to the API.
    {{- range $prefix := list "trpc" "oauth" }}
    - match:
        - uri:
            prefix: /api/{{ $prefix }}/
      rewrite:
        uri: /{{ $prefix }}/
      route:
        - destination:
            host: {{ include "openpanel.fullname" $ }}-oauth2-proxy.{{ $.Release.Namespace }}.svc.cluster.local
            port:
              number: 4180
      timeout: 60s
    {{- end }}
{{- end }}
    # The tracking script every instrumented site loads. It carries no data, so
    # it must skip the auth proxy — behind it, visitors get a Google sign-in
    # redirect instead of JavaScript and nothing is ever tracked.
    - match:
        - uri:
            exact: /op1.js
      route:
        - destination:
            host: {{ include "openpanel.fullname" . }}-dashboard.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.dashboard.port }}
      timeout: 30s
    # The API serves its routes at the root, so /api is stripped before proxying.
    - match:
        - uri:
            prefix: /api/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "openpanel.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.api.port }}
      timeout: 30s
    - match:
        - uri:
            exact: /api
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "openpanel.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.api.port }}
      timeout: 30s
    # Everything else, /oauth2/* included, goes through the auth proxy, which
    # forwards to the dashboard only once the caller is on the allow-list.
{{- if .Values.oauth2Proxy.enabled }}
    - route:
        - destination:
            host: {{ include "openpanel.fullname" . }}-oauth2-proxy.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 4180
      timeout: 60s
{{- else }}
    - route:
        - destination:
            host: {{ include "openpanel.fullname" . }}-dashboard.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.dashboard.port }}
      timeout: 60s
{{- end }}
{{- end }}
