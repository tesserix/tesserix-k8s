{{/*
ClickHouse - Analytics database for OpenPanel
*/}}
{{- if .Values.clickhouse.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openpanel.fullname" . }}-clickhouse-init
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    echo "=== OpenPanel ClickHouse Schema Init ==="

    CH="clickhouse-client --multiquery"

    echo "[1/4] Creating database..."
    $CH --query "CREATE DATABASE IF NOT EXISTS {{ .Values.clickhouse.database }}"

    echo "[2/4] Creating tables..."
    $CH <<'EOSQL'
    CREATE TABLE IF NOT EXISTS events (
      `id` UUID DEFAULT generateUUIDv4(),
      `name` LowCardinality(String),
      `sdk_name` LowCardinality(String),
      `sdk_version` LowCardinality(String),
      `device_id` String CODEC(ZSTD(3)),
      `profile_id` String CODEC(ZSTD(3)),
      `project_id` String CODEC(ZSTD(3)),
      `session_id` String CODEC(LZ4),
      `path` String CODEC(ZSTD(3)),
      `origin` String CODEC(ZSTD(3)),
      `referrer` String CODEC(ZSTD(3)),
      `referrer_name` String CODEC(ZSTD(3)),
      `referrer_type` LowCardinality(String),
      `revenue` UInt64,
      `duration` UInt64 CODEC(Delta(4), LZ4),
      `properties` Map(String, String) CODEC(ZSTD(3)),
      `created_at` DateTime64(3) CODEC(DoubleDelta, ZSTD(3)),
      `country` LowCardinality(FixedString(2)),
      `city` String,
      `region` LowCardinality(String),
      `longitude` Nullable(Float32) CODEC(Gorilla, LZ4),
      `latitude` Nullable(Float32) CODEC(Gorilla, LZ4),
      `os` LowCardinality(String),
      `os_version` LowCardinality(String),
      `browser` LowCardinality(String),
      `browser_version` LowCardinality(String),
      `device` LowCardinality(String),
      `brand` LowCardinality(String),
      `model` LowCardinality(String),
      `imported_at` Nullable(DateTime) CODEC(Delta(4), LZ4),
      INDEX idx_name name TYPE bloom_filter GRANULARITY 1,
      INDEX idx_properties_bounce properties['__bounce'] TYPE set(3) GRANULARITY 1,
      INDEX idx_origin origin TYPE bloom_filter(0.05) GRANULARITY 1,
      INDEX idx_path path TYPE bloom_filter(0.01) GRANULARITY 1
    )
    ENGINE = MergeTree()
    PARTITION BY toYYYYMM(created_at)
    ORDER BY (project_id, toDate(created_at), created_at, name)
    SETTINGS index_granularity = 8192;

    CREATE TABLE IF NOT EXISTS sessions (
      `id` String,
      `project_id` String CODEC(ZSTD(3)),
      `profile_id` String CODEC(ZSTD(3)),
      `device_id` String CODEC(ZSTD(3)),
      `created_at` DateTime64(3) CODEC(DoubleDelta, ZSTD(3)),
      `ended_at` DateTime64(3) CODEC(DoubleDelta, ZSTD(3)),
      `is_bounce` Bool,
      `entry_origin` LowCardinality(String),
      `entry_path` String CODEC(ZSTD(3)),
      `exit_origin` LowCardinality(String),
      `exit_path` String CODEC(ZSTD(3)),
      `screen_view_count` Int32,
      `revenue` Float64,
      `event_count` Int32,
      `duration` UInt32,
      `country` LowCardinality(FixedString(2)),
      `region` LowCardinality(String),
      `city` String,
      `longitude` Nullable(Float32) CODEC(Gorilla, LZ4),
      `latitude` Nullable(Float32) CODEC(Gorilla, LZ4),
      `device` LowCardinality(String),
      `brand` LowCardinality(String),
      `model` LowCardinality(String),
      `browser` LowCardinality(String),
      `browser_version` LowCardinality(String),
      `os` LowCardinality(String),
      `os_version` LowCardinality(String),
      `utm_medium` String CODEC(ZSTD(3)),
      `utm_source` String CODEC(ZSTD(3)),
      `utm_campaign` String CODEC(ZSTD(3)),
      `utm_content` String CODEC(ZSTD(3)),
      `utm_term` String CODEC(ZSTD(3)),
      `referrer` String CODEC(ZSTD(3)),
      `referrer_name` String CODEC(ZSTD(3)),
      `referrer_type` LowCardinality(String),
      `sign` Int8,
      `version` UInt64
    )
    ENGINE = VersionedCollapsingMergeTree(sign, version)
    PARTITION BY toYYYYMM(created_at)
    ORDER BY (project_id, toDate(created_at), created_at)
    SETTINGS index_granularity = 8192;

    CREATE TABLE IF NOT EXISTS events_bots (
      `id` UUID DEFAULT generateUUIDv4(),
      `project_id` String,
      `name` String,
      `type` String,
      `path` String,
      `created_at` DateTime64(3)
    )
    ENGINE = MergeTree()
    ORDER BY (project_id, created_at)
    SETTINGS index_granularity = 8192;

    CREATE TABLE IF NOT EXISTS profiles (
      `id` String CODEC(ZSTD(3)),
      `is_external` Bool,
      `first_name` String CODEC(ZSTD(3)),
      `last_name` String CODEC(ZSTD(3)),
      `email` String CODEC(ZSTD(3)),
      `avatar` String CODEC(ZSTD(3)),
      `properties` Map(String, String) CODEC(ZSTD(3)),
      `project_id` String CODEC(ZSTD(3)),
      `created_at` DateTime64(3) CODEC(Delta(4), LZ4),
      INDEX idx_first_name first_name TYPE bloom_filter GRANULARITY 1,
      INDEX idx_last_name last_name TYPE bloom_filter GRANULARITY 1,
      INDEX idx_email email TYPE bloom_filter GRANULARITY 1
    )
    ENGINE = ReplacingMergeTree(created_at)
    PARTITION BY toYYYYMM(created_at)
    ORDER BY (project_id, id)
    SETTINGS index_granularity = 8192;

    CREATE TABLE IF NOT EXISTS profile_aliases (
      `project_id` String,
      `profile_id` String,
      `alias` String,
      `created_at` DateTime
    )
    ENGINE = MergeTree()
    ORDER BY (project_id, profile_id, alias, created_at)
    SETTINGS index_granularity = 8192;

    CREATE TABLE IF NOT EXISTS self_hosting (
      `created_at` Date,
      `domain` String,
      `count` UInt64
    )
    ENGINE = MergeTree()
    PARTITION BY toYYYYMM(created_at)
    ORDER BY (domain, created_at);

    CREATE TABLE IF NOT EXISTS events_imports (
      `id` UUID DEFAULT generateUUIDv4(),
      `name` LowCardinality(String),
      `sdk_name` LowCardinality(String),
      `sdk_version` LowCardinality(String),
      `device_id` String CODEC(ZSTD(3)),
      `profile_id` String CODEC(ZSTD(3)),
      `project_id` String CODEC(ZSTD(3)),
      `session_id` String CODEC(LZ4),
      `path` String CODEC(ZSTD(3)),
      `origin` String CODEC(ZSTD(3)),
      `referrer` String CODEC(ZSTD(3)),
      `referrer_name` String CODEC(ZSTD(3)),
      `referrer_type` LowCardinality(String),
      `duration` UInt64 CODEC(Delta(4), LZ4),
      `properties` Map(String, String) CODEC(ZSTD(3)),
      `created_at` DateTime64(3) CODEC(DoubleDelta, ZSTD(3)),
      `country` LowCardinality(FixedString(2)),
      `city` String,
      `region` LowCardinality(String),
      `longitude` Nullable(Float32) CODEC(Gorilla, LZ4),
      `latitude` Nullable(Float32) CODEC(Gorilla, LZ4),
      `os` LowCardinality(String),
      `os_version` LowCardinality(String),
      `browser` LowCardinality(String),
      `browser_version` LowCardinality(String),
      `device` LowCardinality(String),
      `brand` LowCardinality(String),
      `model` LowCardinality(String),
      `imported_at` Nullable(DateTime) CODEC(Delta(4), LZ4),
      `import_id` String CODEC(ZSTD(3)),
      `import_status` LowCardinality(String) DEFAULT 'pending',
      `imported_at_meta` DateTime DEFAULT now()
    )
    ENGINE = MergeTree()
    PARTITION BY toYYYYMM(imported_at_meta)
    ORDER BY (import_id, created_at)
    TTL imported_at_meta + INTERVAL 7 DAY
    SETTINGS index_granularity = 8192;
    EOSQL

    echo "[3/4] Creating materialized views..."
    $CH <<'EOSQL'
    CREATE MATERIALIZED VIEW IF NOT EXISTS dau_mv
    ENGINE = AggregatingMergeTree()
    PARTITION BY toYYYYMMDD(date)
    ORDER BY (project_id, date)
    AS SELECT
      toDate(created_at) as date,
      uniqState(profile_id) as profile_id,
      project_id
    FROM events
    GROUP BY date, project_id;

    CREATE MATERIALIZED VIEW IF NOT EXISTS cohort_events_mv
    ENGINE = AggregatingMergeTree()
    ORDER BY (project_id, name, created_at, profile_id)
    AS SELECT
      project_id,
      name,
      toDate(created_at) AS created_at,
      profile_id,
      COUNT() AS event_count
    FROM events
    WHERE profile_id != device_id
    GROUP BY project_id, name, created_at, profile_id;

    CREATE MATERIALIZED VIEW IF NOT EXISTS distinct_event_names_mv
    ENGINE = AggregatingMergeTree()
    ORDER BY (project_id, name, created_at)
    AS SELECT
      project_id,
      name,
      max(created_at) AS created_at,
      count() AS event_count
    FROM events
    GROUP BY project_id, name;

    CREATE MATERIALIZED VIEW IF NOT EXISTS event_property_values_mv
    ENGINE = AggregatingMergeTree()
    ORDER BY (project_id, name, property_key, property_value)
    AS SELECT
      project_id,
      name,
      key_value.keys as property_key,
      key_value.values as property_value,
      created_at
    FROM (
      SELECT
        project_id,
        name,
        untuple(arrayJoin(properties)) as key_value,
        max(created_at) as created_at
      FROM events
      GROUP BY project_id, name, key_value
    )
    WHERE property_value != ''
      AND property_key != ''
      AND property_key NOT IN ('__duration_from', '__properties_from')
    GROUP BY project_id, name, property_key, property_value, created_at;
    EOSQL

    echo "[4/4] Verifying..."
    TABLE_COUNT=$(clickhouse-client --query "SELECT count() FROM system.tables WHERE database = 'default' AND name NOT LIKE '.inner%'")
    echo "  Tables in default database: $TABLE_COUNT"
    echo "=== ClickHouse Schema Init Complete ==="
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openpanel.fullname" . }}-clickhouse-users
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  allow-remote.xml: |
    <clickhouse>
      <users>
        <default>
          <password></password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </default>
      </users>
      {{- if .Values.clickhouse.systemLogs.disableQueryProfiler }}
      <profiles>
        <default>
          <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
          <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
          <memory_profiler_step>0</memory_profiler_step>
          <trace_profile_events>0</trace_profile_events>
        </default>
      </profiles>
      {{- end }}
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openpanel.fullname" . }}-clickhouse-config
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  # Retention for system.* diagnostics only; analytics tables are untouched.
  system-logs.xml: |
    {{- $ttl := printf "event_date + INTERVAL %d DAY DELETE" (int .Values.clickhouse.systemLogs.ttlDays) }}
    <clickhouse>
      {{- range $t := list "trace_log" "metric_log" "asynchronous_metric_log" "query_log" "query_views_log" "part_log" "processors_profile_log" "query_metric_log" "error_log" }}
      <{{ $t }}>
        <ttl>{{ $ttl }}</ttl>
      </{{ $t }}>
      {{- end }}
      <text_log>
        <ttl>{{ $ttl }}</ttl>
        <level>{{ .Values.clickhouse.systemLogs.textLogLevel }}</level>
      </text_log>
    </clickhouse>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openpanel.fullname" . }}-clickhouse
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.clickhouse.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.clickhouse.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpanel.fullname" . }}-clickhouse
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  replicas: {{ .Values.clickhouse.replicaCount | int }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openpanel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      annotations:
        checksum/server-config: {{ .Values.clickhouse.systemLogs | toYaml | sha256sum }}
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/excludeInboundPorts: "{{ .Values.clickhouse.httpPort }},{{ .Values.clickhouse.nativePort }}"
        # Ambient equivalent. These namespaces run ambient with sidecar
        # injection disabled, so the sidecar annotation above is inert:
        # ztunnel captures the port and kubelet's health probes are
        # refused, which kills the container in a restart loop.
        traffic.istio.io/excludeInboundPorts: "{{ .Values.clickhouse.httpPort }},{{ .Values.clickhouse.nativePort }}"
        traffic.sidecar.istio.io/excludeOutboundPorts: "{{ .Values.clickhouse.httpPort }},{{ .Values.clickhouse.nativePort }}"
      labels:
        {{- include "openpanel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.httpPort }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.clickhouse.nativePort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: users-config
              mountPath: /etc/clickhouse-server/users.d/allow-remote.xml
              subPath: allow-remote.xml
            - name: server-config
              mountPath: /etc/clickhouse-server/config.d/system-logs.xml
              subPath: system-logs.xml
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openpanel.fullname" . }}-clickhouse
        - name: init-scripts
          configMap:
            name: {{ include "openpanel.fullname" . }}-clickhouse-init
            defaultMode: 0755
        - name: users-config
          configMap:
            name: {{ include "openpanel.fullname" . }}-clickhouse-users
        - name: server-config
          configMap:
            name: {{ include "openpanel.fullname" . }}-clickhouse-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpanel.fullname" . }}-clickhouse
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.clickhouse.httpPort }}
      targetPort: {{ .Values.clickhouse.httpPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.clickhouse.nativePort }}
      targetPort: {{ .Values.clickhouse.nativePort }}
      protocol: TCP
      name: native
  selector:
    {{- include "openpanel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
{{- end }}
