{{/*
ClusterIP Services for OpenPanel components
*/}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpanel.fullname" . }}-api
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "openpanel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpanel.fullname" . }}-dashboard
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "openpanel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpanel.fullname" . }}-worker
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.port }}
      targetPort: {{ .Values.worker.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "openpanel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
