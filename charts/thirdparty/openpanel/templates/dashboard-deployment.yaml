{{/*
Dashboard Deployment - Next.js frontend (port 3000)
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpanel.fullname" . }}-dashboard
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "openpanel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "openpanel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "openpanel.serviceAccountName" . }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: API_URL
              value: {{ .Values.config.apiUrl | quote }}
            # Server-side rendering skips the public hostname and stays in-cluster.
            - name: API_URL_SSR
              value: "http://{{ include "openpanel.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }}"
            - name: DASHBOARD_URL
              value: {{ .Values.config.dashboardUrl | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.config.apiUrl | quote }}
            - name: NEXT_PUBLIC_DASHBOARD_URL
              value: {{ .Values.config.dashboardUrl | quote }}
            - name: VITE_SELF_HOSTED
              value: "true"
            - name: SELF_HOSTED
              value: "true"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
