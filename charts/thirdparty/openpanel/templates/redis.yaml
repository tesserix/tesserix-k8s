{{/*
Redis - Cache and pub/sub for OpenPanel
*/}}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openpanel.fullname" . }}-redis
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.redis.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpanel.fullname" . }}-redis
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: {{ .Values.redis.replicaCount | int }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openpanel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/excludeInboundPorts: "{{ .Values.redis.port }}"
        # Ambient equivalent. These namespaces run ambient with sidecar
        # injection disabled, so the sidecar annotation above is inert:
        # ztunnel captures the port and kubelet's health probes are
        # refused, which kills the container in a restart loop.
        traffic.istio.io/excludeInboundPorts: "{{ .Values.redis.port }}"
        traffic.sidecar.istio.io/excludeOutboundPorts: "{{ .Values.redis.port }}"
      labels:
        {{- include "openpanel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - redis-server
            - --notify-keyspace-events
            - Kx
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openpanel.fullname" . }}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpanel.fullname" . }}-redis
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      protocol: TCP
      name: redis
  selector:
    {{- include "openpanel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
