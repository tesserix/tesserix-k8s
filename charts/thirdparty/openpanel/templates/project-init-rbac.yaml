{{- if .Values.projectInit.enabled }}
{{- $root := . }}
# The hook ServiceAccount exists in the OpenPanel namespace. Its only
# permissions are provided by namespace-scoped RoleBindings below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openpanel.fullname" $root }}-project-init
  labels:
    {{- include "openpanel.labels" $root | nindent 4 }}
    app.kubernetes.io/component: project-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
{{- $default := .Values.projectInit.targetNamespace }}
{{- $namespaces := dict }}
{{- range $app, $config := .Values.projectInit.apps }}
{{-   $namespace := default $default $config.namespace }}
{{-   $_ := set $namespaces $namespace true }}
{{- end }}
{{- range $namespace, $_ := $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openpanel.fullname" $root }}-project-init
  namespace: {{ $namespace }}
  labels:
    {{- include "openpanel.labels" $root | nindent 4 }}
    app.kubernetes.io/component: project-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openpanel.fullname" $root }}-project-init
  namespace: {{ $namespace }}
  labels:
    {{- include "openpanel.labels" $root | nindent 4 }}
    app.kubernetes.io/component: project-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openpanel.fullname" $root }}-project-init
subjects:
  - kind: ServiceAccount
    name: {{ include "openpanel.fullname" $root }}-project-init
    namespace: {{ $root.Release.Namespace }}
---
{{- end }}
{{- end }}
