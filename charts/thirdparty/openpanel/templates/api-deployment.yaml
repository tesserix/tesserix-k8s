{{/*
API Deployment - Fastify backend (port 3333)
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpanel.fullname" . }}-api
  labels:
    {{- include "openpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if .Values.googleAuth.enabled }}
  annotations:
    # Roll the API when the Google credentials rotate, same as the proxy.
    secret.reloader.stakater.com/reload: {{ .Values.googleAuth.secretName }}
  {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "openpanel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,8123,9000,6379"
      labels:
        {{- include "openpanel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "openpanel.serviceAccountName" . }}
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z {{ include "openpanel.fullname" . }}-postgresql {{ .Values.postgresql.port }}; do sleep 2; done
              echo "Waiting for ClickHouse..."
              until nc -z {{ include "openpanel.fullname" . }}-clickhouse {{ .Values.clickhouse.httpPort }}; do sleep 2; done
              echo "Waiting for Redis..."
              until nc -z {{ include "openpanel.fullname" . }}-redis {{ .Values.redis.port }}; do sleep 2; done
              echo "All dependencies ready"
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: DASHBOARD_URL
              value: {{ .Values.config.dashboardUrl | quote }}
            - name: API_URL
              value: {{ .Values.config.apiUrl | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.config.apiUrl | quote }}
            - name: VITE_SELF_HOSTED
              value: "true"
            - name: SELF_HOSTED
              value: "true"
            - name: ALLOW_REGISTRATION
              value: {{ .Values.config.allowRegistration | quote }}
            - name: ALLOW_INVITATION
              value: {{ .Values.config.allowInvitation | quote }}
            - name: BATCH_SIZE
              value: {{ .Values.config.batchSize | quote }}
            - name: BATCH_INTERVAL
              value: {{ .Values.config.batchInterval | quote }}
            - name: CONCURRENCY
              value: {{ .Values.config.concurrency | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.postgresqlPasswordKey }}
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "openpanel.fullname" . }}-postgresql:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
            - name: DATABASE_URL_DIRECT
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "openpanel.fullname" . }}-postgresql:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
            - name: CLICKHOUSE_URL
              value: "http://{{ include "openpanel.fullname" . }}-clickhouse:{{ .Values.clickhouse.httpPort }}"
            - name: REDIS_URL
              value: "redis://{{ include "openpanel.fullname" . }}-redis:{{ .Values.redis.port }}"
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.cookieSecretKey }}
            {{- if .Values.googleAuth.enabled }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.googleAuth.secretName }}
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.googleAuth.secretName }}
                  key: client-secret
            # Must be registered on the Google client verbatim; /api is stripped
            # by the VirtualService, so the API sees /oauth/google/callback.
            - name: GOOGLE_REDIRECT_URI
              value: "{{ .Values.config.apiUrl }}/oauth/google/callback"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
