# Production overrides for OpenPanel
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

api:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

dashboard:
  replicaCount: 2
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

worker:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

postgresql:
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

clickhouse:
  persistence:
    size: 50Gi
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 2Gi

redis:
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

config:
  dashboardUrl: "https://analytics.tesserix.app"
  apiUrl: "https://analytics.tesserix.app"
