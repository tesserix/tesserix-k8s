# Production overrides for OpenPanel
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

api:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

dashboard:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    # Next.js SSR sits at ~400Mi steady state; 512Mi would OOMKill under load.
    limits:
      memory: 1Gi

worker:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

postgresql:
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

clickhouse:
  persistence:
    size: 240Gi
  resources:
    requests:
      memory: 768Mi
    # 4Gi is what it actually ran on; a merge can spike well past 2Gi.
    limits:
      memory: 4Gi

redis:
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

config:
  dashboardUrl: "https://analytics.tesserix.app"
  apiUrl: "https://analytics.tesserix.app/api"

projectInit:
  enabled: true
  # Fallback only — every app below names the namespace its Deployment runs in.
  targetNamespace: "mark8ly"
  secretName: "openpanel-client-ids"
  adminUser:
    enabled: true
  organization:
    id: "tesserix-analytics"
    name: "Prod"
  apps:
    admin:
      namespace: "mark8ly"
      projectName: "Tesserix Admin (prod)"
      # Merchants sign in at {slug}-admin.mark8ly.com; the canonical host 404s
      # anonymous traffic by design, so the wildcard is what actually collects.
      domain: "https://admin.mark8ly.com"
      cors: "https://admin.mark8ly.com,https://*.mark8ly.com"
    storefront:
      namespace: "mark8ly"
      projectName: "Tesserix Storefront (prod)"
      domain: "https://marketplace.mark8ly.com"
      cors: "https://marketplace.mark8ly.com,https://*.mark8ly.com"
    tenant-onboarding:
      namespace: "mark8ly"
      projectName: "Tesserix Tenant Onboarding (prod)"
      # onboard-your-store.mark8ly.com is retired; the apex serves onboarding.
      domain: "https://mark8ly.com"
      cors: "https://mark8ly.com,https://www.mark8ly.com"
    tesserix-home:
      namespace: "tesserix"
      projectName: "Tesserix Home (prod)"
      domain: "https://tesserix.app"
      cors: "https://tesserix.app,https://www.tesserix.app"
    tesserix-blog:
      namespace: "tesserix"
      projectName: "Tesserix Blog (prod)"
      domain: "https://blog.tesserix.app"
    homechef:
      namespace: "homechef"
      projectName: "HomeChef fe3dr (prod)"
      domain: "https://fe3dr.com"
      cors: "https://fe3dr.com,https://www.fe3dr.com,https://vendors.fe3dr.com"
