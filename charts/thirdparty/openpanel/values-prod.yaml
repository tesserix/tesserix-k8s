# Production overrides for OpenPanel
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

api:
  replicaCount: 2
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi

dashboard:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

worker:
  replicaCount: 2
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi

postgresql:
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

clickhouse:
  persistence:
    size: 50Gi
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 4Gi

redis:
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

config:
  dashboardUrl: "https://analytics.tesserix.app"
  apiUrl: "https://analytics.tesserix.app"
