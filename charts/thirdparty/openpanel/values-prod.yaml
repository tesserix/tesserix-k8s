# Production overrides for OpenPanel
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

api:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

dashboard:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    # Next.js SSR sits at ~400Mi steady state; 512Mi would OOMKill under load.
    limits:
      memory: 1Gi

worker:
  replicaCount: 2
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1536Mi

postgresql:
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

clickhouse:
  persistence:
    size: 50Gi
  resources:
    requests:
      memory: 768Mi
    # 4Gi is what it actually ran on; a merge can spike well past 2Gi on 50Gi.
    limits:
      memory: 4Gi

redis:
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

config:
  dashboardUrl: "https://analytics.tesserix.app"
  apiUrl: "https://analytics.tesserix.app/api"

projectInit:
  enabled: true
  targetNamespace: "marketplace"
  secretName: "openpanel-client-ids"
  adminUser:
    enabled: true
  organization:
    id: "tesserix-analytics"
    name: "Prod"
  apps:
    admin:
      projectName: "Tesserix Admin (prod)"
      domain: "https://admin.mark8ly.com"
    storefront:
      projectName: "Tesserix Storefront (prod)"
      domain: "https://marketplace.mark8ly.com"
      cors: "https://marketplace.mark8ly.com,https://*.mark8ly.com"
    tenant-onboarding:
      projectName: "Tesserix Tenant Onboarding (prod)"
      domain: "https://onboard-your-store.mark8ly.com"
    tesserix-home:
      projectName: "Tesserix Home (prod)"
      domain: "https://tesserix.app"
      cors: "https://tesserix.app,https://www.tesserix.app"
    tesserix-blog:
      projectName: "Tesserix Blog (prod)"
      domain: "https://blog.tesserix.app"
    homechef:
      projectName: "HomeChef fe3dr (prod)"
      domain: "https://fe3dr.com"
      cors: "https://fe3dr.com,https://www.fe3dr.com,https://vendors.fe3dr.com"
