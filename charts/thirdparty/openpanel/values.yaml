# OpenPanel configuration values (devtest defaults)

# API service (Fastify)
api:
  replicaCount: 1
  image:
    repository: lindesvard/openpanel-api
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  port: 3333
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

# Dashboard service (Next.js)
dashboard:
  replicaCount: 1
  image:
    repository: lindesvard/openpanel-dashboard
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

# Worker service
worker:
  replicaCount: 1
  image:
    repository: lindesvard/openpanel-worker
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  port: 9999
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi

# PostgreSQL
postgresql:
  enabled: true
  # 0 parks the component while keeping its Service and PVC.
  replicaCount: 1
  image:
    repository: postgres
    tag: "14-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  database: openpanel
  username: postgres
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: standard-rwo
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

# ClickHouse
clickhouse:
  enabled: true
  # 0 parks the component while keeping its Service and PVC.
  replicaCount: 1
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.10.2.65"
    pullPolicy: IfNotPresent
  httpPort: 8123
  nativePort: 9000
  database: openpanel
  persistence:
    enabled: true
    size: 240Gi
    storageClassName: standard-rwo
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 2Gi
  # system.* log tables, not analytics data. Unbounded trace_log filled the
  # 50Gi volume and stalled all event inserts with NOT_ENOUGH_SPACE.
  systemLogs:
    ttlDays: 7
    # The query profiler is what makes trace_log grow by billions of rows.
    disableQueryProfiler: true
    textLogLevel: warning
  # Last-resort watchdog: truncates system logs when the volume fills anyway.
  diskGuard:
    enabled: true
    schedule: "*/15 * * * *"
    thresholdPercent: 90

# Redis
redis:
  enabled: true
  # 0 parks the component while keeping its Service and PVC.
  replicaCount: 1
  image:
    repository: redis
    tag: "7.2.5-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: standard-rwo
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi

# Application configuration
config:
  dashboardUrl: "https://dev-analytics.tesserix.app"
  # SDKs post here; the /api prefix is required and is stripped at the VirtualService.
  apiUrl: "https://dev-analytics.tesserix.app/api"
  nodeEnv: "production"
  selfHosted: true
  # Upstream gates OAuth sign-in and sign-up with this single flag, so it has to
  # be true for the two pre-provisioned admins to use Google at all. Safe only
  # because /api/trpc and /api/oauth are routed through oauth2-proxy.
  allowRegistration: true
  allowInvitation: false
  batchSize: 5000
  batchInterval: 10000
  concurrency: 10

# OpenPanel's own Google sign-in, sharing the oauth2-proxy client so there is a
# single Google app and the inner login is one click rather than a password.
# It is not an access control: upstream handleNewUser registers any Google
# address it sees, so oauth2Proxy stays in front as the allow-list.
googleAuth:
  enabled: true
  secretName: openpanel-oauth2-secrets

# Istio ingress — host is derived from config.dashboardUrl
ingress:
  enabled: true
  gateway: "istio-ingress/tesseract-gateway"

# Google sign-in gate in front of the dashboard. OpenPanel itself has no OIDC
# and no per-user allow-list, so this is the only thing keeping the dashboard
# private. /api is deliberately not routed through it — SDK ingestion is public.
oauth2Proxy:
  enabled: true
  replicaCount: 1
  provider: google
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.7.1
    pullPolicy: IfNotPresent
  secretName: openpanel-oauth2-secrets
  # Exhaustive list of who may sign in. Adding a line grants full admin.
  allowedEmails:
    - samyak.rout@gmail.com
    - mahesh.sangawar@gmail.com
  cookie:
    name: _openpanel_auth
    expire: 168h
    refresh: 1h
  externalSecret:
    enabled: true
    # Short interval so a corrected Google client ID reaches the proxy in
    # minutes; reloader then rolls the pod.
    refreshInterval: 10m
    secretStore: gcp-secret-store
    secrets:
      googleClientId: prod-openpanel-oauth2-client-id
      googleClientSecret: prod-openpanel-oauth2-client-secret
      cookieSecret: prod-openpanel-oauth2-cookie-secret
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Secrets (created by ExternalSecrets)
secrets:
  name: openpanel-secrets
  cookieSecretKey: cookie-secret
  postgresqlPasswordKey: postgresql-password

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod annotations
podAnnotations:
  sidecar.istio.io/inject: "true"

# =============================================================================
# Project Init Job
# Automatically bootstraps OpenPanel projects for frontend apps
# and writes client IDs to a K8s Secret in the target namespace.
# =============================================================================
# Reconciles verified merchant custom domains into a project's cors list. No
# wildcard can cover a merchant's own domain, so without this a merchant stops
# collecting the moment their custom domain takes over from the platform one.
corsSync:
  enabled: false
  app: storefront
  schedule: "*/10 * * * *"
  marketplaceApiUrl: ""
  internalAuthKey: marketplace-internal-auth

projectInit:
  enabled: true
  image:
    repository: ghcr.io/tesserix/openpanel-project-init
    tag: "main-638fd72"
  # Namespace where frontend apps run (Secret is created here)
  targetNamespace: "marketplace"
  # K8s Secret name that holds the client IDs
  secretName: "openpanel-client-ids"
  # Organization to create in OpenPanel
  organization:
    id: "tesserix-analytics"
    name: "DevTest"
  # Admin user for dashboard login (credentials from openpanel-secrets)
  adminUser:
    enabled: true
  # Frontend apps — each gets a project + write client
  # cors: optional comma-separated list of allowed origins (defaults to domain)
  apps:
    admin:
      projectName: "Tesserix Admin"
      domain: "https://dev-admin.tesserix.app"
    storefront:
      projectName: "Tesserix Storefront"
      domain: "https://dev-store.tesserix.app"
      cors: "https://dev-store.tesserix.app,https://*.tesserix.app"
    tenant-onboarding:
      projectName: "Tesserix Tenant Onboarding"
      domain: "https://dev-onboarding.tesserix.app"
