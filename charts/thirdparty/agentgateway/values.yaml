# agentgateway/agentgateway — verified defaults
#
# Real upstream: https://github.com/agentgateway/agentgateway
# Latest stable: v1.2.1 (2026-05-15).

image:
  repository: ghcr.io/agentgateway/agentgateway
  tag: v1.2.1
  pullPolicy: IfNotPresent

replicaCount: 2

namespace:
  create: true
  name: agentgateway-system
  istioInjection: enabled

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080

# Connection back to the catalog. agentgateway reads agents, MCP servers,
# and policies from aregistry on a 30-second poll.
aregistry:
  endpoint: http://agentregistry.agentregistry-system.svc.cluster.local:8080
  # JWT minted from the aregistry-jwt secret (same one aregistry signs
  # with). Mirrored across namespaces by Reflector.
  jwtSecret:
    name: aregistry-jwt
    key: jwt-secret

# LLM backends. DevAI dispatches through its own provider adapter family
# today (claude / openai / groq / gemini / nemoclaw / codex are called
# directly by the API service). The Solo.io fiber-secrets / Zendesk
# Bedrock single-URL topology is a demo path we don't use yet — leaving
# disabled so the gateway pod doesn't require the fiber-secrets Secret.
#
# Re-enable when we route Anthropic traffic through the gateway instead
# of direct Claude API calls.
backends:
  anthropic:
    enabled: false
    # upstreamUrl: https://ai-gateway.zende.sk/bedrock
    # authSecret:
    #   name: fiber-secrets
    #   key: zdai-token
  openai:
    enabled: false
  groq:
    enabled: false

# Per-role traffic policies. Empty list = permissive; add per-role gates
# as we lock the surface down (defense in depth on top of the prompt-
# level allowed_tools list in each specialization YAML).
policies: []

metrics:
  enabled: true
  port: 9090
