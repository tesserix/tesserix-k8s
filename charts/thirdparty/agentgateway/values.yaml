# agentgateway/agentgateway — verified defaults
#
# Real upstream: https://github.com/agentgateway/agentgateway
# Latest stable: v1.2.1 (2026-05-15).

image:
  repository: ghcr.io/agentgateway/agentgateway
  tag: v1.2.1
  pullPolicy: IfNotPresent

# Scaled to 0 until we adopt the upstream Helm chart at
# oci://ghcr.io/agentgateway/agentgateway/charts/agentgateway. The
# hand-rolled wrapper is missing config the binary requires (port
# layout, ConfigMap with backend routes). DevAI's adapters.llm
# family does direct provider calls today and doesn't need the
# gateway to be functional.
replicaCount: 0

namespace:
  create: true
  name: agentgateway-system
  istioInjection: enabled

serviceAccount:
  # Workload Identity: lets the gateway call Vertex AI with ADC (no API keys).
  # The GSA has roles/aiplatform.user; the WI binding to
  # agentgateway-system/agentgateway is managed in terraform-new/stacks/12-vertex.
  annotations:
    iam.gke.io/gcp-service-account: agentgateway-llm@tesseracthub-480811.iam.gserviceaccount.com

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080

# Connection back to the catalog. agentgateway reads agents, MCP servers,
# and policies from aregistry on a 30-second poll. Our agentic-registry
# Service exposes the HTTP API on port 12121 (targetPort 8080); the old
# :8080 here pointed at a non-existent service port.
aregistry:
  endpoint: http://agentregistry.agentregistry-system.svc.cluster.local:12121
  # JWT minted from the aregistry-jwt secret (same one aregistry signs
  # with). Mirrored across namespaces by Reflector.
  jwtSecret:
    name: aregistry-jwt
    key: jwt-secret

# LLM backends. DevAI dispatches through its own LLM adapter family
# today (see src/devai/adapters/llm/ in the devai repo) — the
# agentgateway upstream proxying is off by default.
#
# To route a provider's traffic through the gateway, enable that block
# and fill in the provider's upstream URL + the Secret that holds the
# authentication token (the Secret must already exist in the
# agentgateway-system namespace).
backends:
  anthropic:
    enabled: false
    # upstreamUrl: https://api.anthropic.com
    # authSecret:
    #   name: anthropic-api-key
    #   key: api-key
  openai:
    enabled: false
    # upstreamUrl: https://api.openai.com
    # authSecret:
    #   name: openai-api-key
    #   key: api-key
  groq:
    enabled: false
    # upstreamUrl: https://api.groq.com
    # authSecret:
    #   name: groq-api-key
    #   key: api-key

# Per-role traffic policies. Empty list = permissive; add per-role gates
# as we lock the surface down (defense in depth on top of the prompt-
# level allowed_tools list in each specialization YAML).
policies: []

metrics:
  enabled: true
  port: 9090
