apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentgateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: agentgateway
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Let the image's ENTRYPOINT run as-is; agentgateway has
          # subcommands but no `serve`. Listen address + catalog URL
          # are configured via env vars below (AREGISTRY_URL etc.).
          env:
            - name: AREGISTRY_URL
              value: {{ .Values.aregistry.endpoint | quote }}
            - name: AREGISTRY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aregistry.jwtSecret.name }}
                  key: {{ .Values.aregistry.jwtSecret.key }}
            # Per-provider backend env vars are NOT injected here.
            # agentgateway reads provider routes + auth secrets from
            # aregistry (via AgentgatewayBackend / TrafficPolicy CRDs)
            # at runtime — env-var injection would create two sources
            # of truth. Configure backends in values.yaml only as
            # documentation for what's expected; the actual wiring
            # happens through CRDs once aregistry is healthy.
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
