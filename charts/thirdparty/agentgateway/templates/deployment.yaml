apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentgateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentgateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: agentgateway
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr=0.0.0.0:{{ .Values.service.port }}
            {{- if .Values.metrics.enabled }}
            - --metrics-addr=0.0.0.0:{{ .Values.metrics.port }}
            {{- end }}
            - --aregistry-url=$(AREGISTRY_URL)
          env:
            - name: AREGISTRY_URL
              value: {{ .Values.aregistry.endpoint | quote }}
            - name: AREGISTRY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aregistry.jwtSecret.name }}
                  key: {{ .Values.aregistry.jwtSecret.key }}
            {{- if .Values.backends.anthropic.enabled }}
            - name: ANTHROPIC_UPSTREAM_URL
              value: {{ .Values.backends.anthropic.upstreamUrl | quote }}
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backends.anthropic.authSecret.name }}
                  key: {{ .Values.backends.anthropic.authSecret.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
