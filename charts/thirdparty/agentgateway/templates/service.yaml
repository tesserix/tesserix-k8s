apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentgateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
---
# Convenience alias — agents POST to ai-gateway.agentgateway-system... per the
# single-URL topology in PLATFORM.md §13.
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentgateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
