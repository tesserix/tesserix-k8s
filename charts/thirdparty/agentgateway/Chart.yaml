apiVersion: v2
name: agentgateway
description: >-
  agentgateway — the data plane for every LLM / MCP / A2A call that
  agents make. Routes provider traffic to configured upstreams,
  authenticates against the agentregistry catalog, and enforces
  per-role traffic policies.

  Wrapper chart owned by tesserix. Templates render Namespace,
  Deployment, Service, and stubs for HTTPRoute attachments. Per-
  provider upstream + auth injection is configured via values.yaml
  (see backends.* section).

type: application
version: 0.1.0
appVersion: "1.2.1"
keywords:
  - agentgateway
  - data-plane
  - llm-proxy
maintainers:
  - name: tesserix-platform
