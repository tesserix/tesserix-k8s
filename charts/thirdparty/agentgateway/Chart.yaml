apiVersion: v2
name: agentgateway
description: >-
  Solo.io agentgateway — the data plane for every LLM / MCP / A2A call
  that agents make. Routes /anthropic/* → /bedrock/*, injects auth from
  the fiber-secrets Secret, enforces per-role policy.

  Wrapper chart owned by tesserix. Templates render Namespace,
  Deployment, Service, AgentgatewayBackend CR for the Anthropic /
  Bedrock single-URL topology, and stubs for HTTPRoute attachments.

type: application
version: 0.1.0
appVersion: "1.1.0"
keywords:
  - solo.io
  - agentgateway
  - data-plane
  - llm-proxy
maintainers:
  - name: tesserix-platform
