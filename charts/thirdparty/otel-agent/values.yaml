# OTel Collector node agent — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/otel-agent.yaml (the redis-global pattern).

image:
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  # On a Spot pool every preemption re-pulls this image, so keeping the pull
  # inside asia-south1 removes both the egress cost and a slow cold start.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/otel/opentelemetry-collector-contrib
  tag: "0.156.0"
  # IfNotPresent, deliberately. This is a third-party image on a pinned tag, so
  # the content behind that tag never changes and re-pulling gains nothing.
  # It matters here because the stack runs on a Spot pool: Always would re-pull
  # from GAR on every pod restart, and preemptions make restarts routine.
  # Our own images (obs-api, obs-ui) use Always instead, because they track a
  # moving `main` tag that genuinely does change.
  pullPolicy: IfNotPresent

ports:
  metrics: 8888
  health: 13133

gateway:
  # Agents do not produce to Kafka directly. Funnelling through the gateway
  # keeps one producer tier, so the disk-backed Kafka queue and the broker
  # connection pool exist in exactly one place.
  endpoint: otel-gateway.observability.svc.cluster.local:4317

filelog:
  # Namespaces whose container logs are collected. Everything else is not
  # merely dropped later — it is never read.
  #
  # This is enforced in the filelog `include` globs rather than a downstream
  # filter processor on purpose. A file that no glob matches is one the agent
  # never opens, never parses, never assigns a severity to and never
  # checkpoints, so the saving is the whole cost of collection. A filter
  # processor would pay all of that and then throw the record away at the end.
  # Measured before this list existed: 1.17M lines/hour, of which 43% came from
  # namespaces nobody looks at — kube-system alone was 289k lines (58 MiB) an
  # hour, more than any actual product.
  #
  # On-disk layout is /var/log/pods/<namespace>_<pod>_<uid>/<container>/N.log,
  # so "<ns>_*" is anchored on the underscore that separates namespace from pod
  # name. A namespace cannot therefore capture a longer one that merely shares
  # its prefix: "devai_*" does not match devai-previews, and "tesserix_*" does
  # not match redis-tesserix.
  #
  # TRADE-OFF, read before adding a product: a namespace that is not on this
  # list produces NO logs at all, silently. That is the deliberate direction of
  # failure — collecting everything by default is the state this list exists to
  # fix — but a new product is invisible until someone adds it here.
  namespaces:
    # Products.
    - homechef
    - mark8ly
    - tesserix
    - support-platform
    - stockpilot
    - openpanel
    - nats
    - marketplace
    - agentregistry-system
    - agentgateway-system
    - devai
    - devai-previews
    - translation
    - growthbook
    - mongodb-blog
    # Service mesh. istiod, ztunnel and istio-cni live here; the per-pod
    # istio-proxy sidecars do not — they are inside the product namespaces
    # above and are already collected with them.
    - istio-system
    - istio-ingress
    - istio-egress
  exclude:
    # Without this the agent's own logs become input, and any error it logs
    # while failing to ship produces another log line. Feedback loop.
    #
    # Redundant while `observability` is off the allowlist above, and kept
    # precisely because that could change: the day someone adds observability
    # back to collect obs-api logs, they will want obs-api — not the agent
    # reporting on itself reporting on itself.
    - /var/log/pods/observability_otel-agent-*/*/*.log
  # `end` on first start so rolling this out does not replay every historical
  # log file at once. Checkpoints take over from the second start onwards.
  startAt: end
  pollInterval: 500ms
  # A single log line larger than this is truncated. Stack traces can be big.
  maxLogSize: 2MiB
  # GKE nodes are COS with containerd. The `container` operator handles the
  # CRI log format and, with add_metadata_from_filepath, recovers pod,
  # namespace and container name from the file path.
  format: containerd
  maxConcurrentFiles: 512

checkpoints:
  # hostPath rather than a PVC: a DaemonSet pod cannot own a per-node
  # PersistentVolume, and the checkpoint is only meaningful on the node whose
  # files it describes.
  hostPath: /var/lib/otelcol-agent

processors:
  memoryLimiter:
    checkInterval: 5s
    limitPercentage: 80
    spikeLimitPercentage: 25
  batch:
    sendBatchSize: 4096
    sendBatchMaxSize: 8192
    timeout: 5s

queue:
  # Small on-disk queue so a brief gateway outage does not drop lines. The
  # real buffer is Redpanda, one tier downstream.
  size: 1000

# Memory-only per platform policy: no CPU requests or limits anywhere.
# This runs on every node including production ones, so it is kept small.
resources:
  requests:
    memory: 192Mi
  limits:
    memory: 384Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"

# Container log files on GKE are root-owned and not world-readable, so the
# agent runs as root. It is otherwise locked down: no privilege escalation, all
# capabilities dropped, immutable root filesystem, and /var/log mounted
# read-only.
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

rbac:
  create: true

# Run everywhere. A node whose logs are not collected is an invisible node, so
# this tolerates every taint in the cluster: the Spot observability pool, the
# gVisor sandbox pool, the GPU pool and any control-plane taints.
tolerations:
  - operator: Exists

# PARKED 2026-08-01: a DaemonSet has no replica count, so the park is an
# unsatisfiable selector — no node carries this label, so desired drops to 0
# while the DaemonSet itself stays in Git. Empty it out to revive.
nodeSelector:
  tesserix.io/otel-agent: "enabled"

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
