# Production overrides for osrm
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation (OSRM needs memory for routing data)
resources:
  limits:
    memory: 8Gi
  requests:
    memory: 4Gi

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 1
