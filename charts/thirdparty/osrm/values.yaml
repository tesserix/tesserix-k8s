replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/project-osrm/osrm-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: osrm.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    memory: 2Gi
  requests:
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  storageClass: "standard"
  accessMode: ReadWriteOnce

# OSRM Configuration
osrm:
  algorithm: "mld" # or "ch"
  mapDataUrl: "https://download.geofabrik.de/europe/monaco-latest.osm.pbf"
  mapName: "map"

networking:
  # Disabled - routes are now managed centrally in istio-config chart
  # for HMS Patient Portal and Staff Portal VirtualServices
  enabled: false
  gateway: "istio-ingress/tesseract-gateway"
  # Hosts where this service should be available (Patient Portal, Staff Portal, etc.)
  hosts:
    - "dev-hms-patient.tesserix.app"
    - "dev-hms-staff.tesserix.app"
  # The path prefix exposed to the internet
  prefix: "/api/v1/routing"
