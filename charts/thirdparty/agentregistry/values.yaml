# agentregistry-dev/agentregistry — verified defaults
#
# Real upstream: https://github.com/agentregistry-dev/agentregistry
# Latest release: v0.3.3 (2026-04-02). Container image lives at
# ghcr.io/agentregistry-dev/agentregistry/server — the bare /agentregistry
# path is the parent and isn't pullable.

image:
  repository: ghcr.io/agentregistry-dev/agentregistry/server
  tag: v0.3.3
  pullPolicy: IfNotPresent

# Scaled to 0 while we migrate to the upstream Helm chart published
# at oci://ghcr.io/agentregistry-dev/agentregistry/helm/agentregistry.
# This hand-rolled wrapper omits config the upstream binary requires
# (proper ENTRYPOINT, full config file, vector-store init). DevAI's
# LLM dispatch path doesn't depend on aregistry today — re-enable
# when the upstream chart is in place.
replicaCount: 0

namespace:
  create: true
  name: agentregistry-system
  istioInjection: enabled

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080

# Auth — JWT/HMAC token issued by aregistry's bootstrap secret.
auth:
  enabled: true
  # The bootstrap secret is provisioned by an ExternalSecret (synced
  # from GCP SM key `prod-aregistry-jwt-secret`).
  existingSecret: aregistry-jwt
  secretKey: jwt-secret

# CNPG cluster for the registry's pgvector store.
# Requires the cloudnative-pg operator (already installed cluster-wide
# at sync-wave -40).
postgres:
  enabled: true
  cluster:
    name: aregistry-pg
    instances: 1
    storage:
      size: 20Gi
      storageClass: standard-rwo
    bootstrap:
      initdb:
        database: agentregistry
        owner: agentregistry
        # The postgres password is rendered from an ExternalSecret in
        # external-secrets/prod/agentregistry-system/ (see runbook).
        secret:
          name: aregistry-pg-credentials
    postgresql:
      parameters:
        # pgvector extension required for semantic search
        shared_preload_libraries: vector

# Bootstrap content — registry seeds are NOT applied via this chart.
# A separate ArgoCD app (`devai-registry-bootstrap`) runs a Job that
# applies architecture/registry-seeds/*.yaml against the aregistry API
# once it's healthy. See docs/deploy/CONTROL-PLANES.md.
seeds:
  enabled: false  # use the bootstrap app instead

# Metrics scraping
metrics:
  enabled: true
  port: 9090
  path: /metrics
  serviceMonitor:
    enabled: false  # enable once Prometheus Operator is wired up
