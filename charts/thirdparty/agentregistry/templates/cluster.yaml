{{- if .Values.postgres.enabled -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cluster.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agentregistry.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.cluster.instances }}
  storage:
    size: {{ .Values.postgres.cluster.storage.size }}
    storageClass: {{ .Values.postgres.cluster.storage.storageClass }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.cluster.bootstrap.initdb.database }}
      owner: {{ .Values.postgres.cluster.bootstrap.initdb.owner }}
      secret:
        name: {{ .Values.postgres.cluster.bootstrap.initdb.secret.name }}
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  postgresql:
    parameters:
      {{- range $key, $val := .Values.postgres.cluster.postgresql.parameters }}
      {{ $key }}: {{ $val | quote }}
      {{- end }}
  # Standard tesserix monitoring + backup hooks would slot in here once
  # the global cnpg backup config lands (see charts/apps/db-schema-bootstrap
  # for the pattern).
{{- end -}}
