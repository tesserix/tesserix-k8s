{{- if .Values.namespace.create -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "agentregistry.labels" . | nindent 4 }}
    {{- if .Values.namespace.istioInjection }}
    istio-injection: {{ .Values.namespace.istioInjection }}
    {{- end }}
  annotations:
    # Source of truth: tesserix-k8s/charts/thirdparty/agentregistry
    fiber.io/managed-by: registry
{{- end -}}
