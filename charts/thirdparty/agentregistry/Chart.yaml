apiVersion: v2
name: agentregistry
description: >-
  Solo.io agentregistry (aregistry) — the catalog of every Skill,
  MCPServer, Agent, and Prompt available to the cluster. CNPG-backed
  pgvector for semantic lookups. Source of truth for capabilities;
  kagent and agentgateway are downstream consumers.

  Wrapper chart owned by tesserix. Templates render a Namespace, a CNPG
  Cluster (depends on the cnpg-system operator which is installed at
  wave -40), and the aregistry Deployment + Service.

type: application
version: 0.1.0
appVersion: "0.3.3"
keywords:
  - solo.io
  - agentregistry
  - aregistry
  - catalog
maintainers:
  - name: tesserix-platform
