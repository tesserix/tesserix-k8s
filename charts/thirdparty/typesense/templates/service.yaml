apiVersion: v1
kind: Service
metadata:
  name: typesense
  labels:
    app.kubernetes.io/name: typesense
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: search
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: typesense
    app.kubernetes.io/instance: {{ .Release.Name }}
