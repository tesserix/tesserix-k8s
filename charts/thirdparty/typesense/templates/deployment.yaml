apiVersion: apps/v1
kind: Deployment
metadata:
  name: typesense
  labels:
    app.kubernetes.io/name: typesense
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: typesense
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: typesense
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "typesense.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: typesense
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.apiPort }}
              protocol: TCP
            - name: peering
              containerPort: {{ .Values.config.peeringPort }}
              protocol: TCP
          env:
            - name: TYPESENSE_DATA_DIR
              value: "{{ .Values.config.dataDir }}"
            - name: TYPESENSE_API_PORT
              value: "{{ .Values.config.apiPort }}"
            - name: TYPESENSE_PEERING_PORT
              value: "{{ .Values.config.peeringPort }}"
            - name: TYPESENSE_ENABLE_CORS
              value: "{{ .Values.config.enableCors }}"
            {{- if .Values.config.enableCors }}
            - name: TYPESENSE_CORS_DOMAINS
              value: "{{ .Values.config.corsDomains }}"
            {{- end }}
            - name: TYPESENSE_LOG_LEVEL
              value: "{{ .Values.config.logLevel }}"
            {{- if gt (int .Values.config.threadPoolSize) 0 }}
            - name: TYPESENSE_THREAD_POOL_SIZE
              value: "{{ .Values.config.threadPoolSize }}"
            {{- end }}
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiKeySecretName }}
                  key: {{ .Values.secrets.apiKeySecretKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: typesense-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
