# Production overrides for typesense
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production cluster configuration
replicaCount: 3

# Production resource allocation
resources:
  limits:
    memory: 4Gi
  requests:
    memory: 1Gi

# Production persistence
persistence:
  size: 50Gi

# High availability settings
podDisruptionBudget:
  enabled: true
  minAvailable: 2
