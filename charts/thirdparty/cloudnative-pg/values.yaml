cloudnative-pg:
  image:
    repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/cloudnative-pg/cloudnative-pg
    tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
  # Operator runs cluster-wide in its own namespace (cnpg-system).
  # Each PG cluster it manages lives in its tenant namespace (e.g. mark8ly).
  replicaCount: 1
  monitoring:
    podMonitorEnabled: false
    grafanaDashboard:
      create: false
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  config:
    data:
      # Nine of the fifteen clusters this operator owns run a single instance,
      # so the default upgrade path — roll every pod to pick up the new
      # instance manager — is nine short outages per operator bump. In-place
      # copies the binary into the running pods instead.
      ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
