# Default values for Mautic
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/mautic/mautic
  tag: "5-apache"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Mautic configuration
mautic:
  # Site URL (must match your ingress hostname)
  siteUrl: "https://dev-mautic.tesserix.app"
  # Secret key for encryption — loaded from existingSecret
  # Generate with: openssl rand -hex 32
  existingSecretKeyField: "secret-key"
  # Set to true only for FIRST installation, then disable
  # Once installation is complete via web wizard, set to false
  runSetup: false
  # Admin credentials
  adminUsername: "admin"
  adminEmail: "admin@tesserix.app"
  # Existing secret for admin password
  existingSecret: "mautic-credentials"
  existingSecretAdminPasswordKey: "admin-password"
  # Mailer settings (SMTP via Postal)
  # Postal SMTP → Postfix sidecar → SendGrid (failover chain)
  mailer:
    transport: "smtp"
    host: "postal-smtp.email.svc.cluster.local"
    port: 25
    encryption: ""
    authMode: "login"
    user: "devtest-tesseract"
    # Password from sealed secret
    existingSecret: "postal-smtp-credentials"
    existingSecretPasswordKey: "password"
    fromEmail: "noreply@tesserix.app"
    fromName: "Tesseract Hub"

# Database configuration
database:
  host: "mysql.email.svc.cluster.local"
  port: "3306"
  name: "mautic"
  user: "mautic"
  existingSecret: "mysql-credentials"
  existingSecretPasswordKey: "mautic-password"

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Resources
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

# Persistence for Mautic data
persistence:
  enabled: true
  storageClass: "standard-rwo"
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# Liveness probe - use TCP since Mautic redirects during setup
livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6

# Readiness probe - use TCP since Mautic redirects during setup
readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# Cron job for scheduled tasks
# NOTE: Disabled because ReadWriteOnce PVC can't be attached to multiple pods
# Cron runs inside the main container via Mautic's built-in cron support
cron:
  enabled: false
  schedule: "*/15 * * * *"
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi

podAnnotations:
  # Istio sidecar configuration
  sidecar.istio.io/inject: "true"
  # Exclude MySQL port from Istio sidecar
  traffic.sidecar.istio.io/excludeOutboundPorts: "3306"
  # Exclude GCP metadata server for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"

podSecurityContext:
  fsGroup: 33

securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Sealed secret configuration
sealedSecret:
  enabled: true
  # Postal SMTP password (sealed)
  postalSmtpPassword: 
