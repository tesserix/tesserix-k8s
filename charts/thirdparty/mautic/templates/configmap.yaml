apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mautic.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
data:
  MAUTIC_DB_HOST: {{ .Values.database.host | quote }}
  MAUTIC_DB_PORT: {{ .Values.database.port | quote }}
  MAUTIC_DB_NAME: {{ .Values.database.name | quote }}
  MAUTIC_DB_DATABASE: {{ .Values.database.name | quote }}
  MAUTIC_DB_USER: {{ .Values.database.user | quote }}
  MAUTIC_URL: {{ .Values.mautic.siteUrl | quote }}
  # Set to true only for initial installation, then disable
  {{- if .Values.mautic.runSetup }}
  MAUTIC_RUN_SETUP: "true"
  {{- end }}
  MAUTIC_ADMIN_USERNAME: {{ .Values.mautic.adminUsername | quote }}
  MAUTIC_ADMIN_EMAIL: {{ .Values.mautic.adminEmail | quote }}
  # Mailer configuration
  MAUTIC_MAILER_TRANSPORT: {{ .Values.mautic.mailer.transport | quote }}
  MAUTIC_MAILER_HOST: {{ .Values.mautic.mailer.host | quote }}
  MAUTIC_MAILER_PORT: {{ .Values.mautic.mailer.port | quote }}
  MAUTIC_MAILER_FROM_EMAIL: {{ .Values.mautic.mailer.fromEmail | quote }}
  MAUTIC_MAILER_FROM_NAME: {{ .Values.mautic.mailer.fromName | quote }}
  {{- if .Values.mautic.mailer.encryption }}
  MAUTIC_MAILER_ENCRYPTION: {{ .Values.mautic.mailer.encryption | quote }}
  {{- end }}
  {{- if .Values.mautic.mailer.authMode }}
  MAUTIC_MAILER_AUTH_MODE: {{ .Values.mautic.mailer.authMode | quote }}
  {{- end }}
  {{- if .Values.mautic.mailer.user }}
  MAUTIC_MAILER_USER: {{ .Values.mautic.mailer.user | quote }}
  {{- end }}
