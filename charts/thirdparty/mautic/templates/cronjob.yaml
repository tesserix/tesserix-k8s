{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mautic.fullname" . }}-cron
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mautic.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "mautic.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: OnFailure
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: mautic-cron
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  php /var/www/html/bin/console mautic:segments:update
                  php /var/www/html/bin/console mautic:campaigns:trigger
                  php /var/www/html/bin/console mautic:campaigns:execute
                  php /var/www/html/bin/console mautic:messages:send
                  php /var/www/html/bin/console mautic:broadcasts:send
              envFrom:
                - configMapRef:
                    name: {{ include "mautic.fullname" . }}-config
              env:
                - name: MAUTIC_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret }}
                      key: {{ .Values.database.existingSecretPasswordKey }}
              resources:
                {{- toYaml .Values.cron.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
          volumes:
            - name: data
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "mautic.fullname" . }}-data
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}
