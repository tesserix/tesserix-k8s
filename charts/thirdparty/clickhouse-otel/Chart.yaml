apiVersion: v2
name: clickhouse-otel
description: |
  Dedicated single-node ClickHouse for OpenTelemetry. The OTel Collector's
  clickhouseexporter writes traces/logs/metrics here over the native protocol
  (:9000); the HTTP interface (:8123) is exposed for ad-hoc queries. This chart
  only provisions the server, a 20Gi data volume and the `otel` database — the
  exporter auto-creates its own tables/MVs when `create_schema: true`, so no
  schema init job ships here (unlike the OpenPanel ClickHouse).

  Credentials: a placeholder Secret is rendered only when
  `auth.createPlaceholderSecret=true` (dev convenience). In prod the Secret
  named by `auth.existingSecret` is provisioned by an ExternalSecret from GCP
  Secret Manager — keep createPlaceholderSecret=false there.
type: application
version: 1.0.0
appVersion: "25.10.2.65"
