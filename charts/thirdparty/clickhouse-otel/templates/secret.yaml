{{/*
Placeholder Secret — DEV ONLY.

In production the Secret named by `.Values.auth.existingSecret` is provisioned by
an ExternalSecret synced from GCP Secret Manager, so this template renders
nothing (auth.createPlaceholderSecret stays false). It exists purely so the
chart can stand up locally without an ExternalSecret in the cluster.

Reference ExternalSecret (lives under external-secrets/prod/observability/, NOT
in this chart — schemas/secrets are managed outside app/infra charts):

  apiVersion: external-secrets.io/v1beta1
  kind: ExternalSecret
  metadata:
    name: clickhouse-otel-secrets
    namespace: observability
  spec:
    refreshInterval: 1h
    secretStoreRef:
      name: gcp-secret-store
      kind: ClusterSecretStore
    target:
      name: clickhouse-otel-secrets   # == .Values.auth.existingSecret
      creationPolicy: Owner
    data:
      - secretKey: clickhouse-password  # == .Values.auth.secretKey
        remoteRef:
          key: prod-clickhouse-otel-password
*/}}
{{- if .Values.auth.createPlaceholderSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.existingSecret }}
  labels:
    {{- include "clickhouse-otel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.placeholderPassword | quote }}
{{- end }}
