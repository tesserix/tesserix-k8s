apiVersion: v1
kind: Service
metadata:
  # In-cluster DNS: clickhouse-otel.observability.svc.cluster.local
  #   HTTP   8123 — ad-hoc queries / health
  #   native 9000 — OTel clickhouseexporter writes
  name: {{ include "clickhouse-otel.name" . }}
  labels:
    {{- include "clickhouse-otel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.nativePort }}
      targetPort: native
      protocol: TCP
      name: native
  selector:
    {{- include "clickhouse-otel.selectorLabels" . | nindent 4 }}
