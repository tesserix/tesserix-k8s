{{- if .Values.ttl.enabled }}
# Retention guard — applies a TTL to the exporter-created otel tables so the
# DB stays bounded under the PVC. Runs as an ArgoCD PostSync hook on every
# sync; ALTER ... MODIFY TTL is idempotent, so re-running is a no-op once the
# tables already carry the TTL. Covers the EXISTING tables (the exporter's
# create_schema only sets a TTL on tables it creates fresh).
apiVersion: batch/v1
kind: Job
metadata:
  # Name carries the day count: a NORMAL tracked resource (not a hook), so
  # ArgoCD applies it on the sync that introduces it and runs it once. Changing
  # ttl.days yields a new name → fresh run, and prune removes the stale Job.
  name: {{ include "clickhouse-otel.name" . }}-ttl-{{ .Values.ttl.days }}d
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse-otel.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "clickhouse-otel.selectorLabels" . | nindent 8 }}
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
        - name: apply-ttl
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CH_PW
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              HOST={{ include "clickhouse-otel.name" . }}
              PORT={{ .Values.nativePort }}
              DB={{ .Values.database }}
              DAYS={{ .Values.ttl.days }}
              CH() { clickhouse-client --host "$HOST" --port "$PORT" --user {{ .Values.auth.user }} --password "$CH_PW" --query "$1"; }
              # Wait for the server to accept queries.
              for i in $(seq 1 40); do CH "SELECT 1" >/dev/null 2>&1 && break; echo "waiting for clickhouse ($i)"; sleep 5; done
              echo "Applying ${DAYS}-day TTL to ${DB} base tables..."
              TABLES=$(CH "SELECT name FROM system.tables WHERE database='${DB}' AND engine LIKE '%MergeTree%' AND engine NOT LIKE '%Materialized%' FORMAT TSV")
              for t in $TABLES; do
                col=$(CH "SELECT name FROM system.columns WHERE database='${DB}' AND table='${t}' AND name IN ('Timestamp','TimeUnix','Start','TimestampTime') ORDER BY position LIMIT 1 FORMAT TSV")
                if [ -z "$col" ]; then echo "  ${t}: no time column, skip"; continue; fi
                CH "ALTER TABLE ${DB}.\`${t}\` MODIFY TTL toDateTime(${col}) + INTERVAL ${DAYS} DAY"
                echo "  ${t}: TTL on ${col} = ${DAYS}d"
              done
              echo "TTL applied."
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
{{- end }}
