apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse-otel.name" . }}
  labels:
    {{- include "clickhouse-otel.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickhouse-otel.name" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "clickhouse-otel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/excludeInboundPorts: "{{ .Values.httpPort }},{{ .Values.nativePort }}"
        traffic.sidecar.istio.io/excludeOutboundPorts: "{{ .Values.httpPort }},{{ .Values.nativePort }}"
      labels:
        {{- include "clickhouse-otel.selectorLabels" . | nindent 8 }}
        {{- include "clickhouse-otel.labels" . | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The official entrypoint applies these to the default user on first
            # boot. CLICKHOUSE_PASSWORD comes from the Secret (ExternalSecret in
            # prod, in-chart placeholder in dev).
            - name: CLICKHOUSE_USER
              value: {{ .Values.auth.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.nativePort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: users-config
              mountPath: /etc/clickhouse-server/users.d/allow-remote.xml
              subPath: allow-remote.xml
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "clickhouse-otel.name" . }}-init
            defaultMode: 0755
        - name: users-config
          configMap:
            name: {{ include "clickhouse-otel.name" . }}-users
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "clickhouse-otel.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
