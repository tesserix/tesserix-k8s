{{/*
init-db.sh runs from /docker-entrypoint-initdb.d on first boot (empty data dir)
and guarantees the `otel` database exists. The OTel clickhouseexporter creates
its own tables/materialized views inside this DB at runtime when
`create_schema: true`, so no table DDL ships here.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse-otel.name" . }}-init
  labels:
    {{- include "clickhouse-otel.labels" . | nindent 4 }}
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    echo "=== clickhouse-otel: ensuring database '{{ .Values.database }}' ==="
    clickhouse-client --query "CREATE DATABASE IF NOT EXISTS {{ .Values.database }}"
    echo "=== clickhouse-otel: database ready ==="
---
{{/*
Allow remote (in-cluster) connections for the default user and require the
password sourced from the env var the entrypoint sets from the Secret.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse-otel.name" . }}-users
  labels:
    {{- include "clickhouse-otel.labels" . | nindent 4 }}
data:
  allow-remote.xml: |
    <clickhouse>
      <users>
        <{{ .Values.auth.user }}>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
          <access_management>1</access_management>
        </{{ .Values.auth.user }}>
      </users>
    </clickhouse>
