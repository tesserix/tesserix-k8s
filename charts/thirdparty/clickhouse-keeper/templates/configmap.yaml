{{/*
keeper_config.xml — the full Keeper server config.

server_id is NOT templated per-pod: a StatefulSet renders one ConfigMap shared
by every replica, so the id is resolved at runtime from the pod ordinal and
injected via the KEEPER_SERVER_ID env var (see statefulset.yaml). ClickHouse's
`from_env` attribute reads it back here. Raft ids are 1-based, pod ordinals are
0-based, hence the +1.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse-keeper.name" . }}-config
  labels:
    {{- include "clickhouse-keeper.labels" . | nindent 4 }}
data:
  keeper_config.xml: |
    <clickhouse>
      <logger>
        <level>information</level>
        <console>true</console>
      </logger>

      <listen_host>0.0.0.0</listen_host>
      <max_connections>4096</max_connections>

      <keeper_server>
        <tcp_port>{{ .Values.ports.client }}</tcp_port>
        <server_id from_env="KEEPER_SERVER_ID"></server_id>

        <log_storage_path>/var/lib/clickhouse-keeper/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/coordination/snapshots</snapshot_storage_path>

        <coordination_settings>
          <operation_timeout_ms>{{ .Values.coordination.operationTimeoutMs }}</operation_timeout_ms>
          <session_timeout_ms>{{ .Values.coordination.sessionTimeoutMs }}</session_timeout_ms>
          <snapshot_distance>{{ .Values.coordination.snapshotDistance }}</snapshot_distance>
          <raft_logs_level>{{ .Values.coordination.raftLogsLevel }}</raft_logs_level>
        </coordination_settings>

        {{/*
        Every member is listed on every member — Raft needs the full peer set.
        Addressed through the headless service so each pod keeps a stable DNS
        name across rescheduling.
        */}}
        <raft_configuration>
        {{- range $i := until (int .Values.replicaCount) }}
          <server>
            <id>{{ add $i 1 }}</id>
            <hostname>{{ include "clickhouse-keeper.name" $ }}-{{ $i }}.{{ include "clickhouse-keeper.headless" $ }}.{{ $.Release.Namespace }}.svc.cluster.local</hostname>
            <port>{{ $.Values.ports.raft }}</port>
          </server>
        {{- end }}
        </raft_configuration>
      </keeper_server>

      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>{{ .Values.ports.prometheus }}</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
    </clickhouse>
