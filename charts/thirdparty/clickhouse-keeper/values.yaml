# ClickHouse Keeper — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/clickhouse-keeper.yaml (the redis-global pattern).

# Raft quorum size. MUST be odd. 3 tolerates the loss of one member.
replicaCount: 3

image:
  # Standalone Keeper image — same release train as the ClickHouse servers in
  # charts/thirdparty/clickhouse-ha. Keep the two tags in lockstep on upgrade;
  # a Keeper older than its servers is supported, the reverse is not.
  # Pulled through the GAR docker.io mirror rather than docker.io directly.
  # On a Spot pool every preemption re-pulls this image, so keeping the pull
  # inside asia-south1 removes both the egress cost and a slow cold start.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/clickhouse/clickhouse-keeper
  tag: "25.10.2.65"
  pullPolicy: IfNotPresent

ports:
  # Client port the ClickHouse servers connect to.
  client: 9181
  # Raft peer-to-peer port, headless-service addressed.
  raft: 9234
  # Built-in Prometheus endpoint, scraped via podAnnotations below.
  prometheus: 9363

coordination:
  operationTimeoutMs: 10000
  sessionTimeoutMs: 30000
  raftLogsLevel: warning
  # Keeper compacts its Raft log into snapshots every N committed entries.
  # 100k keeps recovery fast without excessive snapshot churn.
  snapshotDistance: 100000

persistence:
  # Coordination log + snapshots only — small and slow-growing. Retain so an
  # accidental chart deletion cannot destroy the replication metadata.
  size: 10Gi
  storageClassName: standard-rwo-retain

# Memory-only per platform policy: no CPU requests or limits anywhere.
resources:
  requests:
    memory: 384Mi
  limits:
    memory: 768Mi

# Scraped by the existing Prometheus kubernetes-pods job.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9363"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  # uid/gid 101 is the `clickhouse` user baked into the official image.
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Spread the quorum across nodes so a single node loss can never take two
# members. Required, not preferred — a co-located quorum defeats the purpose.
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# Keeps voluntary disruptions (node drains, upgrades) from breaking quorum.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# NOTE: intentionally no tolerations. Keeper must NOT schedule onto the tainted
# Spot observability pool — see the rationale in Chart.yaml.
tolerations: []
nodeSelector: {}
