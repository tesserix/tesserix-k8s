# =============================================================================
# Raft snapshots to GCS
# =============================================================================
# Alert rules only. There is no receiver wired up yet, so these fire into
# Prometheus and nowhere else until Alertmanager has a Slack route.
alerts:
  enabled: true
  volumeUsedRatio: 0.8
  # 26h: a daily schedule that missed one run, with an hour of slack.
  snapshotStaleSeconds: 93600
backup:
  enabled: true
  suspend: true
  schedule: "0 3 * * *"
  retentionDays: 30
  # Floor a real snapshot clears easily; below it the run failed and the job
  # must not prune the previous day's backup behind it.
  minSnapshotBytes: 4096
  gcs:
    bucket: tesseract-prod-backups-in
    prefix: openbao
  # Kubernetes auth role the job logs in under — must match a bootstrap role
  # below whose only capability is read on sys/storage/raft/snapshot.
  baoRole: snapshot
  image:
    repository: google/cloud-sdk
    tag: "slim"
    pullPolicy: IfNotPresent
  serviceAccount:
    name: openbao-snapshot
    annotations:
      iam.gke.io/gcp-service-account: openbao-snapshot@tesseracthub-480811.iam.gserviceaccount.com
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi
  cronJob:
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    startingDeadlineSeconds: 3600
    activeDeadlineSeconds: 3600
    backoffLimit: 2
# =============================================================================
# ESO integration
# =============================================================================
# The ClusterSecretStore below is deliberately limited: it authenticates as
# ESO's own ServiceAccount and can only read `kv/data/platform/*`. Per-app
# secrets use a namespaced SecretStore that authenticates as the app's
# ServiceAccount — see docs/openbao-secrets.md.
clusterSecretStore:
  enabled: true
  name: openbao-secret-store
  role: read-platform
  path: kv
  serviceAccount:
    name: external-secrets
    namespace: external-secrets
# The whitelist. One entry per app that may read from OpenBao, and the single
# place that fact is written down: it renders that app's SecretStore and gates
# which namespaces the ClusterSecretStore will serve at all. The secret-service
# console proposes changes here as a pull request — it never edits the cluster.
#
# The bootstrap Job persists each app policy and role from this list, so
# rebuilding OpenBao restores the grants referenced by these SecretStores.
#
# A new namespace also needs a `destinations` entry in
# argocd/prod/projects/security.yaml, or ArgoCD refuses to render its store.
namespaceWhitelist:
  - namespace: homechef
    apps:
      - name: homechef-api
        serviceAccount: homechef-api
      - name: homechef-auth-bff
        serviceAccount: homechef-auth-bff
  - namespace: ai-database
    apps:
      - name: qdrant
        serviceAccount: qdrant
  - namespace: cloudflared
    apps:
      - name: cloudflared
        serviceAccount: cloudflared
      - name: cloudflared-homechef
        serviceAccount: cloudflared-homechef
      # Connector for the dashboard-managed PROD_HELIVANTA tunnel (helivanta.app).
      - name: cloudflared-helivanta
        serviceAccount: cloudflared-helivanta
  # Helivanta (tesserix/hms#45, renamed in #863). Boot secrets only for now — the session signing
  # key and the Zitadel login-client PAT, under kv/data/hms/api/*. HMS is not
  # deployed yet (tesserix/hms#824 owns the image and chart); the namespace
  # and ServiceAccount exist ahead of it so the grant can be proven before
  # anything depends on it.
  - namespace: helivanta
    apps:
      - name: helivanta-api
        serviceAccount: helivanta-api
      # `scope-probe` was REMOVED 2026-09-04. It was verification
      # scaffolding for the OpenBao rollout — a dummy path round-tripped
      # to prove a namespace grant worked. Its ServiceAccount was deleted
      # once that was shown, but this entry stayed, so the generated
      # SecretStore helivanta/openbao-scope-probe sat in
      # InvalidProviderConfig ("unable to create client") for 15 days and
      # held the whole openbao Application at Degraded — which means a
      # REAL degradation there would have looked identical (mark8ly#651
      # is the same failure mode on a different app).
      #
      # Checked before removing: 0 of 245 ExternalSecrets referenced it.

# Dedicated bucket/IAM is provisioned by the storage stack.
recovery:
  enabled: true
  schedule: "0 3,15 * * *"
  project: tesseracthub-480811
  bucket: tesseracthub-480811-openbao-recovery-prod
  kmsKey: projects/tesseracthub-480811/locations/asia-south1/keyRings/tesseract-prod-in-keyring/cryptoKeys/openbao-backup-key
  backupServiceAccount: openbao-recovery-backup@tesseracthub-480811.iam.gserviceaccount.com
  restoreServiceAccount: openbao-recovery-test@tesseracthub-480811.iam.gserviceaccount.com
  baoImage: quay.io/openbao/openbao@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
  runnerImage: docker.io/google/cloud-sdk@sha256:cfca8415b7ce1abccf4c7a1a9c78b4da2c3718ac668806480a4471cb052e1ca9
