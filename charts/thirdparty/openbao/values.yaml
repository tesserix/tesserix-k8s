        path "kv/data/console/app/console-zitadel-entitlements-reader-client-id" { capabilities = ["read"] }
        path "kv/data/console/app/console-zitadel-entitlements-reader-client-secret" { capabilities = ["read"] }
        path "kv/data/console/app/console-stripe-restricted-read-key-test" { capabilities = ["read"] }
        path "kv/data/console/app/console-stripe-restricted-read-key-live" { capabilities = ["read"] }
        path "kv/data/console/app/console-stripe-write-key-live" { capabilities = ["read"] }
        path "kv/data/console/app/console-stripe-write-key-test" { capabilities = ["read"] }
    - name: read-tesserix-tesserix-production
