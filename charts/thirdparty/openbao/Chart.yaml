apiVersion: v2
name: openbao
description: >-
  OpenBao — the cluster's secret store. A 3-node raft cluster with GCP KMS
  auto-unseal, plus the bootstrap Job that initialises it and applies policies
  and Kubernetes auth roles declaratively. Wraps the official openbao/openbao
  chart; see docs/openbao-secrets.md.
type: application
version: 0.1.10
# No `v` prefix: quay.io/openbao/openbao publishes bare semver, and the Kargo
# stage writes the discovered image tag straight into this field.
appVersion: 2.6.1
keywords:
  - secrets
  - vault
maintainers:
  - name: tesserix-platform
dependencies:
  - name: openbao
    version: "0.29.1"
    repository: "https://openbao.github.io/openbao-helm"
