{{/* One SecretStore per whitelisted app. ESO authenticates as that app's own
     ServiceAccount, so the secrets it can reach are decided by the OpenBao
     policy bound to it — this object only says where to ask. */}}
{{- range $ns := .Values.namespaceWhitelist }}
{{- range $app := $ns.apps }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-{{ $app.name }}
  namespace: {{ $ns.namespace }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: secret-store
  annotations:
    # After the bootstrap Job — the auth method it references does not exist
    # until then.
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    vault:
      server: "http://openbao.{{ $.Release.Namespace }}.svc:8200"
      path: {{ $.Values.bootstrap.kvMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app-{{ $ns.namespace }}_{{ $app.name }}
          # No namespace: a namespaced SecretStore may only reference a
          # ServiceAccount in its own, and ESO's webhook rejects the field.
          serviceAccountRef:
            name: {{ $app.serviceAccount }}
{{- end }}
{{- end }}
