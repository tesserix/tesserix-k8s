{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.bootstrap.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
{{ toYaml .Values.bootstrap.serviceAccount.annotations | indent 4 }}
---
# A plain resource in the same wave as the StatefulSet, not a hook. A hook in
# wave N only runs once wave N's resources are healthy, and this StatefulSet is
# healthy only when all three replicas are — so a preempted or unschedulable
# replica blocks the bootstrap, and on a fresh cluster nothing is ever ready
# because nothing has initialised it. Plain resources in a wave are applied
# together with no such gate; the script polls openbao-0 for five minutes,
# which covers the pods starting.
#
# The name carries a hash of the script, so editing it produces a new Job and
# the change actually runs — a Job's spec is immutable and re-applying one
# under the same name is a no-op. The script is idempotent either way.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap-{{ include (print $.Template.BasePath "/bootstrap-configmap.yaml") . | sha256sum | trunc 8 }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/component: bootstrap
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.bootstrap.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          command: ["/bin/bash", "/config/bootstrap.sh"]
          env:
            # gcloud writes its config here and the root filesystem is read-only.
            - name: CLOUDSDK_CONFIG
              value: /tmp/gcloud
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.bootstrap.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-bootstrap
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
{{- end }}
