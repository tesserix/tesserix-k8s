{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.bootstrap.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
{{ toYaml .Values.bootstrap.serviceAccount.annotations | indent 4 }}
---
# Runs after every sync so a policy or role added to values.yaml lands without
# anyone touching the cluster. The script is idempotent; re-running is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/component: bootstrap
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.bootstrap.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          command: ["/bin/bash", "/config/bootstrap.sh"]
          env:
            # gcloud writes its config here and the root filesystem is read-only.
            - name: CLOUDSDK_CONFIG
              value: /tmp/gcloud
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.bootstrap.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: openbao-bootstrap
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
{{- end }}
