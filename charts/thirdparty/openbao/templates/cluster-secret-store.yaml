{{- if .Values.clusterSecretStore.enabled }}
# Cluster-wide store for shared platform credentials only. ESO authenticates
# here as its own ServiceAccount, so anything it can read, every namespace can
# request — which is why the backing policy stops at `kv/data/platform/*`.
# Application secrets use a namespaced SecretStore that authenticates as the
# consuming app's ServiceAccount; see docs/openbao-secrets.md.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: secret-store
  annotations:
    # After the bootstrap Job — the role it references does not exist until then.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Second gate, on top of the read-platform policy: a namespace that is not on
  # the whitelist cannot reference this store at all, whatever it asks for.
  conditions:
    - namespaces:
        {{- range .Values.namespaceWhitelist }}
        - {{ .namespace }}
        {{- end }}
  provider:
    vault:
      # OpenBao speaks the same HTTP API; ESO has no separate provider for it.
      server: "http://openbao.{{ .Release.Namespace }}.svc:8200"
      path: {{ .Values.clusterSecretStore.path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.clusterSecretStore.role | quote }}
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore.serviceAccount.name }}
            namespace: {{ .Values.clusterSecretStore.serviceAccount.namespace }}
{{- end }}
