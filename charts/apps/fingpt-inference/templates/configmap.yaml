# Modelfiles for creating FinGPT custom models in Ollama
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fingpt.fullname" . }}-modelfiles
  labels:
    {{- include "fingpt.labels" . | nindent 4 }}
data:
  Modelfile.sentiment: |
    {{- .Values.model.fingptSentimentModelfile | nindent 4 }}
  Modelfile.forecaster: |
    {{- .Values.model.fingptForecasterModelfile | nindent 4 }}
  setup.sh: |
    #!/bin/sh
    set -e
    echo "[FinGPT] Waiting for Ollama to start..."
    until ollama list > /dev/null 2>&1; do
      sleep 3
    done
    echo "[FinGPT] Ollama is ready. Pulling base model..."

    # Pull base model if not already present
    ollama pull {{ .Values.model.name }} 2>&1 || true

    echo "[FinGPT] Creating fingpt-sentiment model..."
    ollama create fingpt-sentiment -f /modelfiles/Modelfile.sentiment 2>&1 || true

    echo "[FinGPT] Creating fingpt-forecaster model..."
    ollama create fingpt-forecaster -f /modelfiles/Modelfile.forecaster 2>&1 || true

    echo "[FinGPT] Models ready:"
    ollama list
    echo "[FinGPT] Setup complete. Sleeping forever to keep sidecar alive."
    sleep infinity
