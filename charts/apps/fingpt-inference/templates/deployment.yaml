apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fingpt.fullname" . }}
  labels:
    {{- include "fingpt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate  # PVC can only mount to one pod
  selector:
    matchLabels:
      {{- include "fingpt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fingpt.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: "/models"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: modelfiles
              mountPath: /modelfiles
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        # Sidecar: pulls base model and creates FinGPT custom models
        - name: model-setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "/modelfiles/setup.sh"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: modelfiles
              mountPath: /modelfiles
          env:
            - name: OLLAMA_HOST
              value: "localhost:11434"
            - name: OLLAMA_MODELS
              value: "/models"
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: models
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fingpt.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: modelfiles
          configMap:
            name: {{ include "fingpt.fullname" . }}-modelfiles
            defaultMode: 0755
