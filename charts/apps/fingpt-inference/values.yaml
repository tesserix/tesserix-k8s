# FinGPT Inference — Ollama with NVIDIA L4 GPU
# Runs quantized financial LLM for sentiment analysis and stock prediction.
# GPU mode: <2s latency. Scales to zero when idle via KEDA.

replicaCount: 1

image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  tag: "0.6.2"

nameOverride: ""
fullnameOverride: "fingpt-inference"

service:
  type: ClusterIP
  port: 11434
  targetPort: 11434

# Ollama model to pull on startup — small quantized model for CPU
# phi3:mini (3.8B Q4) is fast on CPU, good at classification tasks
model:
  name: "phi3:mini"
  # Custom Modelfile for FinGPT financial sentiment (created via init container)
  fingptSentimentModelfile: |
    FROM phi3:mini
    PARAMETER temperature 0.1
    PARAMETER top_p 0.9
    PARAMETER num_predict 20
    SYSTEM You are FinGPT, a financial sentiment classifier. Given a financial news headline, classify its sentiment as exactly one word: positive, negative, or neutral. Do not explain. Respond with only one word.

  fingptForecasterModelfile: |
    FROM phi3:mini
    PARAMETER temperature 0.2
    PARAMETER top_p 0.9
    PARAMETER num_predict 100
    SYSTEM You are FinGPT Forecaster, a financial AI that predicts stock price movements. Given stock information including recent prices, news headlines, and technical indicators, predict whether the stock will go UP or DOWN on the next trading day. Start your response with either 'up' or 'down', then provide a brief rationale.

resources:
  requests:
    memory: 4Gi
    cpu: 1000m
    nvidia.com/gpu: "1"
  limits:
    memory: 8Gi
    cpu: 3000m
    nvidia.com/gpu: "1"

# GPU node scheduling
nodeSelector:
  gpu: l4

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"

# KEDA autoscaling — scale to zero when no inference traffic
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 600       # 10 min idle before scale-down
  minReplicaCount: 0        # Scale to zero
  maxReplicaCount: 1        # Single GPU node, max 1 replica
  # Scale based on stockpilot-api traffic (fingpt has no Istio sidecar)
  prometheus:
    enabled: true
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    requestRateQuery: 'sum(rate(istio_requests_total{destination_canonical_service="stockpilot-api",reporter="destination"}[5m]))'
    requestRateThreshold: "0.1"

# Persistent volume for model storage (don't re-download on restart)
persistence:
  enabled: true
  size: 10Gi
  storageClass: "standard-rwo"

podAnnotations:
  sidecar.istio.io/inject: "false"  # No Istio needed for internal inference

podLabels: {}
