apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}

  # =========================================================================
  # Bootstrap — first-time cluster initialization
  # =========================================================================
  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.database }}
      owner: {{ .Values.bootstrap.owner }}
      encoding: UTF8
      localeCType: C
      localeCollate: C
      {{- if .Values.bootstrap.postInitApplicationSQL }}
      # postInitApplicationSQL, NOT postInitSQL. CNPG runs postInitSQL against
      # the `postgres` database; only postInitApplicationSQL runs against the
      # application database. Getting this wrong created the extensions in the
      # wrong database and left kora_db with nothing but plpgsql — which would
      # have failed the migration restore at `food_items.embedding vector(768)`
      # mid-cutover, with the app already scaled to zero.
      postInitApplicationSQL:
        {{- range .Values.bootstrap.postInitApplicationSQL }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
  # No secret.name set — CNPG auto-generates the app credentials secret
  # (kora-postgres-app), consumed directly by Task 4.

  # =========================================================================
  # Storage — separate data and WAL volumes for I/O isolation
  # =========================================================================
  storage:
    size: {{ .Values.storageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  walStorage:
    size: {{ .Values.walStorageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  # =========================================================================
  # Resources
  # =========================================================================
  resources:
{{ toYaml .Values.resources | indent 4 }}

  # =========================================================================
  # PostgreSQL configuration
  # =========================================================================
  postgresql:
    parameters:
      {{- range $key, $value := .Values.postgresql }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}

  # =========================================================================
  # HA Replication Slots — survive failover without WAL accumulation
  # =========================================================================
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: "_cnpg_"
    updateInterval: 30

  # =========================================================================
  # TLS — auto-managed by CNPG (self-signed CA, auto-rotation)
  # No manual cert management needed. CNPG generates:
  #   - Server TLS cert (auto-rotated before expiry)
  #   - Client CA for mTLS (optional, for future app cert auth)
  #   - Replication TLS between primary and replicas
  # =========================================================================
  enableSuperuserAccess: false

  # =========================================================================
  # CNPG-managed roles — reconciled continuously (not bootstrap-only), so
  # this provisions roles on the already-running cluster. Same pattern as
  # global-postgres, plus inRoles for membership-based grants.
  # =========================================================================
  {{- if .Values.managedRoles }}
  managed:
    roles:
      {{- range .Values.managedRoles }}
      - name: {{ .name }}
        ensure: present
        login: true
        {{- with .inRoles }}
        inRoles:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .comment }}
        comment: {{ . | quote }}
        {{- end }}
        passwordSecret:
          name: {{ .passwordSecret }}
      {{- end }}
  {{- end }}

  # =========================================================================
  # Backup — continuous WAL archiving + base backups to GCS via Barman Cloud
  #
  # Gated so the chart still renders for a cluster that has no bucket or
  # service account yet. But note what "disabled" means here: a single-instance
  # cluster with no WAL archiving and no base backup is UNRECOVERABLE. There is
  # no replica to fail over to and no point in time to restore from.
  #
  # Requires the GCS service account named in .Values.backup.serviceAccount to
  # exist and hold roles/storage.objectAdmin on the destination bucket, bound to
  # this namespace via Workload Identity. googleCredentials.gkeEnvironment: true
  # tells Barman to use the pod's Workload Identity rather than a key file.
  # =========================================================================
  {{- if .Values.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      googleCredentials:
        gkeEnvironment: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: true
        jobs: 2
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}

  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ .Values.backup.serviceAccount }}
  {{- end }}

  # =========================================================================
  # Monitoring — built-in Prometheus exporter
  # =========================================================================
  monitoring:
    enablePodMonitor: true
    disableDefaultQueries: false

  # =========================================================================
  # Inherited metadata — propagated to all pods and PVCs
  # =========================================================================
  inheritedMetadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      traffic.sidecar.istio.io/excludeInboundPorts: "5432,8000"
      traffic.istio.io/excludeInboundPorts: "5432,8000"

  # =========================================================================
  # Affinity — spread replicas across different nodes
  # =========================================================================
  affinity:
    podAntiAffinityType: preferred

  # =========================================================================
  # Failover
  # =========================================================================
  primaryUpdateStrategy: unsupervised
  failoverDelay: 0
  switchoverDelay: 3600

  # =========================================================================
  # PDB — maintain quorum during node drains
  # =========================================================================
  enablePDB: true
