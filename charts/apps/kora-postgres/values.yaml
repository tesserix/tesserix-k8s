namespace: kora
clusterName: kora-postgres

instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

storageSize: 20Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

bootstrap:
  database: kora_db
  owner: kora
  # First-init only. CNPG runs these once, when the cluster is created.
  # vector    — migration 000004: food_items.embedding vector(768) + HNSW index
  # pgcrypto  — migration 000001
  # pg_trgm   — migration 000021: trigram scoring on food names
  postInitApplicationSQL:
    - "CREATE EXTENSION IF NOT EXISTS vector"
    - "CREATE EXTENSION IF NOT EXISTS pgcrypto"
    - "CREATE EXTENSION IF NOT EXISTS pg_trgm"

# =========================================================================
# Backup — continuous WAL archiving + 6-hourly base backups to GCS
#
# Kora is single-instance on a Spot-only node pool holding ~7,900 food-index
# rows plus the admin audit trail (kora_admin_events). Without this block there
# is no replica to fail over to AND no point in time to restore from — a lost
# volume is a lost product.
#
# PREREQUISITE, and this will fail at runtime without it: the service account
# below must exist and hold roles/storage.objectAdmin on
# tesseract-prod-backups-in, bound to the `kora` namespace via Workload
# Identity. Verify before merging; the chart renders either way.
backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/kora-postgres"
  retentionPolicy: "30d"
  # The bucket's lifecycle is Standard -> Nearline@7d -> Delete@37d. The 37/30
  # gap is a deliberate orphan backstop, not drift.
  schedule: "0 0 */6 * * *"
  serviceAccount: "app-secrets-kora-prod@tesseracthub-480811.iam.gserviceaccount.com"

postgresql:
  max_connections: "100"
  shared_buffers: "512MB"
  effective_cache_size: "1536MB"
  work_mem: "16MB"
  maintenance_work_mem: "256MB"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
