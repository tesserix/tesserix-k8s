{{- if .Values.istio.enabled }}
{{/* The mesh-wide deny-all default reaches an ambient namespace too, so both
     workloads need an explicit ALLOW or the gateway gets "RBAC: access denied".
     ztunnel is L4-only — room and team token checks are enforced by the API
     itself, not here. */}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: planning-poker-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "planning-poker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "planning-poker.selectorLabels" (dict "component" "planning-poker-api" "release" .Release.Name) | nindent 6 }}
  action: ALLOW
  rules:
    - {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: planning-poker-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "planning-poker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "planning-poker.selectorLabels" (dict "component" "planning-poker-web" "release" .Release.Name) | nindent 6 }}
  action: ALLOW
  rules:
    - {}
{{- end }}
