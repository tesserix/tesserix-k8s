{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: planning-poker-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "planning-poker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: planning-poker-api
    creationPolicy: Owner
  data:
    # HMAC key for participant and team tokens. Rotating it invalidates every
    # issued token, which logs participants out of live rooms.
    - secretKey: TOKEN_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.tokenSecret }}
    {{- if .Values.slack.clientID }}
    {{/* Only pulled once a Slack app is registered. ESO fails the WHOLE
         ExternalSecret on one missing remote key, so asking for these before
         the GCP keys exist would take the token secret down with them. */}}
    - secretKey: SLACK_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.slackClientSecret }}
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.slackBotTokenSecret }}
    {{- end }}
{{- end }}
