# Hospital Management System - Gateway Service
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/hospital-management/gateway
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  # Exclude NATS port from Istio sidecar to fix JetStream timeout issues
  # Exclude GCP metadata server from Istio for Workload Identity
  # Prometheus metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

autoscaling:
  # Workload Identity is always enabled
  minReplicas: 0
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  HMS_SERVER_PORT: "8080"
  HMS_SERVER_ENVIRONMENT: "devtest"
  HMS_LOGGER_LEVEL: "info"
  # Service URLs
  HMS_AUTH_SERVICE_URL: "http://hms-auth-service:8080"
  HMS_PATIENT_SERVICE_URL: "http://hms-patient-service:8080"
  HMS_APPOINTMENT_SERVICE_URL: "http://hms-appointment-service:8080"
  HMS_BILLING_SERVICE_URL: "http://hms-billing-service:8080"
  HMS_CRM_SERVICE_URL: "http://hms-crm-service:8080"
  HMS_TENANT_SERVICE_URL: "http://hms-tenant-service:8080"
  # Redis (for rate limiting, caching)
  HMS_REDIS_HOST: "redis.redis.svc.cluster.local"
  HMS_REDIS_PORT: "6379"
  HMS_REDIS_DB: "0"
  # NATS (for inter-service messaging)
  HMS_NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  HMS_NATS_CLUSTER_ID: "hospital-cluster"
  HMS_NATS_CLIENT_ID: "gateway"

# Sealed secrets references
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "hms"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
