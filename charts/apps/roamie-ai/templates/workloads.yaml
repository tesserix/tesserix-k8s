{{- if .Values.enabled }}
{{- if and (not .Values.validationOnly) (not .Values.profileBoundaryVerified) }}
{{- fail "authenticated profile boundary must be verified before enabling Roamie AI" }}
{{- end }}
{{- if and (not .Values.validationOnly) (not .Values.registryRoutesVerified) }}
{{- fail "registry-generated routes must be verified before enabling Roamie AI" }}
{{- end }}
{{- range $name, $workload := .Values.workloads }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $workload.digest) }}
{{- fail (printf "%s needs a built immutable image digest" $name) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
  data:
    {{- range $key, $remote := $workload.secrets }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: roamie
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: roamie
        istio.io/use-waypoint: waypoint
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 70
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      containers:
        - name: {{ $name }}
          image: "{{ $workload.repository }}@{{ $workload.digest }}"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- range $key, $value := $workload.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $name }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $name }}
          livenessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $name }}
          startupProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ $name }}
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    istio.io/use-waypoint: waypoint
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ $name }}
  {{- if and $.Values.validationOnly (eq $name "roamie-trip-manager") }}
  action: DENY
  rules: [{}]
  {{- else }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [{{ $workload.callerPrincipal | quote }}]
      to:
        - operation:
            ports: ["8080"]
  {{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}-waypoint-transport
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/roamie/sa/waypoint"]
    to:
    - operation:
        ports: ["8080"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: waypoint
        {{- if eq $name "roamie-trip-manager" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: roamie-api
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
