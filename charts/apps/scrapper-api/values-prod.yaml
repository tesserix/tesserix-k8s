# Production overrides for scrapper-api

replicaCount: 1

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

env:
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "warning"
  ALLOWED_EMAILS: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"
  CORS_ORIGINS: "https://social-scrapper.tesserix.app"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"

database:
  host: "postgresql.postgresql-scrapper.svc.cluster.local"
  port: "5432"
  user: "scrapper"
  name: "scrapper_db"
  sslmode: "require"

redis:
  host: "redis.redis-scrapper.svc.cluster.local"
  port: "6379"
