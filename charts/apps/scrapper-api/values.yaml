# Default values for scrapper-api

replicaCount: 1

image:
  repository: ghcr.io/tesserix/social-media-scrapper/scrapper-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  PYTHONUNBUFFERED: "1"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  RATE_LIMIT_REQUESTS: "30"

database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "scrapper"
  name: "scrapper_db"
  sslmode: "require"

redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80

podAnnotations:
  sidecar.istio.io/inject: "true"
  proxy.istio.io/config: |
    holdApplicationUntilProxyStarts: true
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"

podLabels: {}
