# Default values for scrapper-api

replicaCount: 1

image:
  # Always via the GAR mirror (org policy). Use `:latest`; the CI workflow's
  # rollout-restart step combined with imagePullPolicy:Always pulls the freshly
  # pushed image on every deploy.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-media-scrapper/scrapper-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  PYTHONUNBUFFERED: "1"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  RATE_LIMIT_REQUESTS: "30"

database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "scrapper"
  name: "scrapper_db"
  sslmode: "require"

redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80

podAnnotations:
    holdApplicationUntilProxyStarts: "true"

podLabels: {}
