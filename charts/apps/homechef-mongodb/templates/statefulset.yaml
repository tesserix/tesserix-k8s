apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homechef-mongodb.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "homechef-mongodb.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "homechef-mongodb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: homechef
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --replSet rs0 promotes this standalone Mongo to a single-node
          # replica set, which unlocks the Change Streams API (used later for
          # real-time message delivery without polling) and is required for
          # multi-document transactions. --bind_ip_all lets the set reach its
          # own pod DNS for the initiate() handshake.
          args:
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Ready only once the replica set is PRIMARY/SECONDARY, so the API
          # doesn't connect before rs.initiate() runs on first boot.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - |
                  try {
                    const s = rs.status();
                    if (s.myState === 1 || s.myState === 2) { quit(0); }
                    quit(1);
                  } catch (e) {
                    quit(1);
                  }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # First boot: initiate the single-node replica set once. Safe to
          # retry — short-circuits when rs.status() already reports a member.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                      sleep 1
                    done
                    if mongosh --quiet --eval "rs.status().ok" 2>/dev/null | grep -q '^1$'; then
                      exit 0
                    fi
                    mongosh --quiet --eval '
                      rs.initiate({
                        _id: "rs0",
                        members: [{ _id: 0, host: "{{ .Values.name }}-0.{{ .Values.name }}.{{ .Values.namespace }}.svc.cluster.local:27017" }]
                      });
                    ' || true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
