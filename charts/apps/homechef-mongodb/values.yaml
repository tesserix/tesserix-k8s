namespace: homechef
name: homechef-mongodb

image:
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

# v1: no auth. Only homechef-api (same namespace) connects, and the namespace is
# network-policy gated inside the mesh — nothing outside homechef should reach
# this Mongo. Flip to true and add a root-password ExternalSecret before opening
# cross-namespace access. Mirrors support-platform-mongo.
auth:
  enabled: false

resources:
  requests:
    # Memory-only requests/limits per the tesserix k8s convention (no CPU).
    memory: 512Mi
  limits:
    memory: 2Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 20Gi

service:
  type: ClusterIP
  port: 27017
