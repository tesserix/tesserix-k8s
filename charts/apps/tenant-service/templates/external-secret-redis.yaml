{{- if .Values.redis.enabled }}
# ExternalSecret to copy redis password from redis-marketplace namespace
# This creates a secret 'redis' in the current namespace with the redis password
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-service.labels" . | nindent 4 }}
type: Opaque
data:
  # Redis password - base64 encoded
  # This is a placeholder - the actual password should be managed via SealedSecret or ExternalSecrets
  {{ .Values.redis.existingSecretKey }}: {{ .Values.redis.password | default "cGFzc3dvcmQ=" | quote }}
{{- end }}
