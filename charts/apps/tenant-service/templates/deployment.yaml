{{- if not .Values.knative.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-service.fullname" . }}
  labels:
    {{- include "tenant-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tenant-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tenant-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tenant-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default .Values.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # GCP Secret Manager Configuration (required)
            {{- if .Values.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcp.projectId | quote }}
            {{- end }}
            - name: GCP_SECRET_PREFIX
              value: {{ .Values.gcp.secretManager.secretPrefix | quote }}
            - name: USE_GCP_SECRET_MANAGER
              value: "true"
                        # Database connection settings
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslmode | quote }}

            # Database password from GCP Secret Manager
            - name: DB_PASSWORD_SECRET_NAME
              value: {{ printf "%s-%s-postgresql-password" .Values.gcp.secretManager.secretPrefix (.Values.gcp.namespace | default .Release.Namespace) | quote }}
            # JWT secret from GCP Secret Manager (legacy auth)
            - name: JWT_SECRET_NAME
              value: {{ printf "%s-jwt-secret" .Values.gcp.secretManager.secretPrefix | quote }}
            {{- if .Values.redis.enabled }}
            # Redis password from Kubernetes secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret | quote }}
                  key: {{ .Values.redis.existingSecretKey | quote }}
            {{- end }}
            # ============================================================================
            # DUAL-REALM KEYCLOAK SECRETS (GCP Secret Manager via Workload Identity)
            # ============================================================================
            # INTERNAL realm admin client secret (for staff/owner user management)
            - name: KEYCLOAK_INTERNAL_ADMIN_CLIENT_SECRET_NAME
              value: {{ printf "%s-keycloak-internal-admin-client-secret" .Values.gcp.secretManager.secretPrefix | quote }}
            # CUSTOMER realm admin client secret (for Organization management)
            - name: KEYCLOAK_CUSTOMER_ADMIN_CLIENT_SECRET_NAME
              value: {{ printf "%s-keycloak-customer-admin-client-secret" .Values.gcp.secretManager.secretPrefix | quote }}
            # Dashboard client secret (for auto-login / password grant)
            - name: KEYCLOAK_CLIENT_SECRET_NAME
              value: {{ printf "%s-keycloak-internal-dashboard-client-secret" .Values.gcp.secretManager.secretPrefix | quote }}
            # Legacy aliases (for backward compat)
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET_NAME
              value: {{ printf "%s-keycloak-internal-admin-client-secret" .Values.gcp.secretManager.secretPrefix | quote }}
            # Verification API key from ExternalSecret (for service-to-service auth)
            {{- if .Values.externalSecrets.enabled }}
            - name: VERIFICATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tenant-service.fullname" . }}-secrets
                  key: VERIFICATION_API_KEY
            {{- end }}
          {{- if .Values.livenessProbe }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path | default "/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
