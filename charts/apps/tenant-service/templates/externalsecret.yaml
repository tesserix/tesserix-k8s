{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "tenant-service.fullname" . }}-secrets
  labels:
    {{- include "tenant-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "tenant-service.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tenants-db-password
    - secretKey: OPENFGA_API_KEY
      remoteRef:
        key: {{ printf "%s-mp-openfga-preshared-key" (.Values.gcp.secretManager.secretPrefix | default "prod") }}
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: {{ printf "%s-mp-shared-internal-service-key" (.Values.gcp.secretManager.secretPrefix | default "prod") }}
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: {{ printf "%s-gip-web-api-key" (.Values.gcp.secretManager.secretPrefix | default "prod") }}
    - secretKey: VERIFICATION_API_KEY
      remoteRef:
        key: {{ printf "%s-mp-shared-internal-service-key" (.Values.gcp.secretManager.secretPrefix | default "prod") }}
{{- end }}
