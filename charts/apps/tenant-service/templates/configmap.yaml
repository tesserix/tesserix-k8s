{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-service.fullname" . }}-config
  labels:
    {{- include "tenant-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | default "5432" | quote }}
  DB_NAME: {{ .Values.database.name | default "tenants_db" | quote }}
  DB_USER: {{ .Values.database.user | default "postgres" | quote }}
  DB_SSLMODE: {{ .Values.database.sslmode | default "require" | quote }}
  DB_SSL_MODE: {{ .Values.database.sslmode | default "require" | quote }}
  PORT: "8080"
  OPENFGA_URL: {{ .Values.env.OPENFGA_URL | default "http://openfga.marketplace.svc.cluster.local" | quote }}
  OPENFGA_AUTH_MODE: {{ .Values.env.OPENFGA_AUTH_MODE | default "mesh" | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | default "redis://redis.redis-marketplace.svc.cluster.local:6379" | quote }}
  {{- range $key, $val := .Values.env }}
  {{- if and (ne $key "OPENFGA_URL") (ne $key "OPENFGA_AUTH_MODE") (ne $key "REDIS_URL") }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
