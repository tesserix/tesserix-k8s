knative:
  enabled: false

# Critical path service — must always be warm for onboarding completion
# Production overrides for tenant-service

image:
  repository: ghcr.io/tesserix/mark8ly-tenant-service
  tag: "20260331-fix-idp-resolve"

# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 1

# Workload Identity — GCP SA for Firebase/GIP, Secret Manager, Pub/Sub
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

# Production resource allocation - critical for multi-tenancy
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

# Database - use global PostgreSQL
database:
  host: "postgresql.postgresql-global.svc.cluster.local"
  name: "tenants_db"
  sslmode: "require"

# Production environment
env:
  SERVICE_AUTH_MODE: "mesh"
  NOTIFICATION_SERVICE_URL: "http://notification-service.marketplace.svc.cluster.local:8080"
  VERIFICATION_SERVICE_URL: "http://verification-service.marketplace.svc.cluster.local:8080"
  STAFF_SERVICE_URL: "http://mp-staff.marketplace.svc.cluster.local:8080"
  VENDOR_SERVICE_URL: "http://mp-vendors.marketplace.svc.cluster.local:8080"
  TENANT_ROUTER_SERVICE_URL: "http://tenant-router-service.marketplace.svc.cluster.local:8080"
  # Production Keycloak configuration
  # Internal realm (staff/owner authentication)
  KEYCLOAK_INTERNAL_ISSUER_URL: "https://internal-idp.mark8ly.com/realms/tesserix-internal"
  # Customer realm (customer authentication + Organizations)
  KEYCLOAK_CUSTOMER_ISSUER_URL: "https://identity.fanzonebattleground.com/realms/tesserix-customer"
  # Legacy alias
  KEYCLOAK_ISSUER_URL: "https://identity.fanzonebattleground.com/realms/tesserix-customer"
  GIN_MODE: "release"
  BASE_DOMAIN: "mark8ly.com"
  ONBOARDING_DOMAIN: "onboarding.mark8ly.com"
  SUPPORT_EMAIL: "support@mark8ly.com"

  # Production onboarding URL for email verification links
  ONBOARDING_APP_URL: "https://mark8ly.com"

  # Google Identity Platform (GIP) — user account creation during onboarding
  # Must match auth-bff products.yaml admin app gipTenantId (MP-Internal pool)
  GIP_TENANT_ID: "MP-Internal-e986p"

  # Custom Domain Gateway IP is fetched from Redis (populated by tenant-router-service)
  # OpenFGA authorization
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local:8080"
  OPENFGA_AUTH_MODE: "preshared"
  OPENFGA_MARKETPLACE_STORE_ID: "01KMS970NNJPJP97MR7XNZSVD3"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  namespace: "global"
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"tenant-service\"}[2m]))"
    requestRateThreshold: "50"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
