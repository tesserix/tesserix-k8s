{{- if not .Values.hibernate }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}

  # Single database / single role. The super-admin owns leads + apps
  # registry locally; everything else is read live cross-namespace from
  # each product's own DB (mark8ly-postgres, fanzone-postgres, …).
  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.primaryDatabase }}
      owner: {{ .Values.bootstrap.primaryOwner }}
      secret:
        name: {{ .Values.bootstrap.primarySecret }}

  storage:
    size: {{ .Values.storageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  walStorage:
    size: {{ .Values.walStorageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  resources:
{{ toYaml .Values.resources | indent 4 }}

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      wal_level: "logical"
      ssl_min_protocol_version: "TLSv1.3"
      ssl_max_protocol_version: "TLSv1.3"
      # Query safety nets — kill anything obviously runaway.
      idle_in_transaction_session_timeout: "300000"
      statement_timeout: "120000"
      # SSD-optimized planner (GKE PD).
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      # Slow query logging (queries > 1s). Tiny workload, so any slow
      # query is interesting.
      log_min_duration_statement: "1000"
      # WAL safety cap — single-instance, no replicas, so this only
      # bounds growth when archiving stalls. Keep small (2GB) so we
      # don't pre-reserve a chunk of the volume that's never used in
      # the steady state. Live WAL files take whatever they need on top
      # of this; the disk has 15Gi total (post 2026-05-04 bump).
      max_slot_wal_keep_size: "2GB"
      # Performance monitoring (CNPG auto-loads extension).
      pg_stat_statements.track: "all"
      pg_stat_statements.max: "10000"
      # Single instance — sync replication is inert. Leaving this here
      # to mirror the mark8ly cluster's posture so the parameter set is
      # consistent if we ever scale to instances=2.
      synchronous_commit: "local"

  {{- if .Values.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      googleCredentials:
        gkeEnvironment: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: true
        jobs: 2
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  {{- end }}

  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ .Values.backup.serviceAccount }}

  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
    disableDefaultQueries: false

  enableSuperuserAccess: false

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  failoverDelay: 0
  switchoverDelay: 3600
{{- end }}
