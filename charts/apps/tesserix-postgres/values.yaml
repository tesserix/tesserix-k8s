hibernate: false

namespace: tesserix
clusterName: tesserix-postgres

# Single instance — this DB only holds the super-admin's own data
# (apps registry + leads). Volume is < 1 GiB at scale; HA isn't worth
# 2x the storage cost. RPO ≤ 5 min via continuous WAL archiving to GCS;
# RTO is ~10 min via barman restore. Acceptable for an ops tool.
instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Bumped 2026-05-04 after WAL volume filled up and CNPG instance-manager
# refused to start (low-disk condition). Original sizing (10Gi data + 5Gi
# WAL) was too tight: max_slot_wal_keep_size=5GB on a 5Gi WAL volume left
# no headroom for live writes, and WAL archiving lag pushed the volume
# over the CNPG threshold. Bumped again 2026-05-07 after the same low-
# disk condition recurred at 15Gi WAL — instance manager has been
# CrashLoopBackOff for 10h+ and has logged 130+ restarts. 30Gi gives
# meaningful headroom; the underlying WAL-archive path will be checked
# separately once the instance is back up.
# resizeInUseVolumes: true (set in the chart template) makes CNPG do
# the GCE PD expansion online — no pod restart on data side, and the
# WAL volume mount picks up the new size on the next restart.
storageSize: 15Gi
storageClass: standard-rwo-retain
walStorageSize: 30Gi

# Tiny workload (admin tool, low QPS). 100m/256Mi covers normal traffic;
# 500m/512Mi limit handles occasional dashboard analytics queries.
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

# Single database. tesserix-home (and the future tesserix-admin-api Go
# service) connect as the tesserix_admin role.
bootstrap:
  primaryDatabase: tesserix_admin
  primaryOwner: tesserix_admin
  # Secret created by ExternalSecret (external-secrets/prod/tesserix/externalsecret.yaml).
  primarySecret: tesserix-postgres-tesserix-admin

# WAL archive → GCS via Workload Identity. Reuses the existing
# tesseract-prod-backups-in bucket with a per-cluster prefix to avoid
# provisioning a new bucket. Backup GSA lives in IAM and is bound to
# the CNPG-managed KSA via Workload Identity.
backup:
  enabled: true
  schedule: "0 20 2 * * *"
  destinationPath: "gs://tesseract-prod-backups-in/tesserix-postgres"
  retentionPolicy: "3d"
  serviceAccount: "app-secrets-tesserix-prod@tesseracthub-480811.iam.gserviceaccount.com"

# Pod-level metrics (CNPG exporter on 9187) — opt-in once monitoring
# stack subscribes. Cheap to keep enabled.
monitoring:
  enablePodMonitor: true
