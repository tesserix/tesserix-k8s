{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-auth-bff-secrets
  labels:
    app.kubernetes.io/name: devai-auth-bff
    app.kubernetes.io/part-of: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: devai-auth-bff-secrets
    creationPolicy: Owner
  data:
    # GIP tenant IDs — pinned to live tenants in tesseracthub-480811.
    # If a tenant is recreated (and gets a new random suffix), update the
    # GCP SM secret rather than the chart.
    - secretKey: DEVAI_BFF_ALM_TENANT_ID
      remoteRef:
        key: prod-devai-gip-alm-tenant-id
    - secretKey: DEVAI_BFF_SRE_TENANT_ID
      remoteRef:
        key: prod-devai-gip-sre-tenant-id
    # Session cookie AES-GCM key (must be 16/24/32 raw bytes).
    - secretKey: DEVAI_BFF_SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-devai-session-encrypt-key
    # Comma-separated list of allow-listed admin emails. Only these
    # addresses can mint a session even after a valid GIP token.
    - secretKey: DEVAI_BFF_ADMIN_ALLOWED_EMAILS
      remoteRef:
        key: prod-devai-admin-allowed-emails
    # Firebase Web API key (project identifier). Served back to the
    # dashboards via /auth/config so it never ships in a JS bundle.
    - secretKey: DEVAI_BFF_GIP_WEB_API_KEY
      remoteRef:
        key: prod-devai-gip-web-api-key
{{- end }}
