apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-auth-bff-secrets
  labels:
    app.kubernetes.io/name: devai-auth-bff
    app.kubernetes.io/part-of: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-auth-bff-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_DEVAI_CLIENT_SECRET
      remoteRef:
        key: prod-keycloak-devai-bff-client-secret
    - secretKey: KEYCLOAK_SRE_CLIENT_SECRET
      remoteRef:
        key: prod-keycloak-devai-sre-bff-client-secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: prod-encryption-key
    - secretKey: CSRF_SECRET
      remoteRef:
        key: prod-jwt-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: prod-devai-redis-password
