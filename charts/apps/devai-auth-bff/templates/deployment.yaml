apiVersion: apps/v1
kind: Deployment
metadata:
  name: devai-auth-bff
  labels:
    app.kubernetes.io/name: devai-auth-bff
    app.kubernetes.io/part-of: devai
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-auth-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devai-auth-bff
        app.kubernetes.io/part-of: devai
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod hardening — this is the auth boundary and had NO securityContext.
      # Run non-root (65532 = distroless nonroot) with RuntimeDefault seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container hardening — drop all caps, no privilege escalation,
          # read-only root fs (the Go binary writes nothing outside /tmp,
          # which is an emptyDir mount below).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Static configuration from values.yaml
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # GIP tenant IDs + secrets — synced from GCP Secret Manager
            # via the devai-auth-bff-secrets ExternalSecret.
            - name: DEVAI_BFF_ALM_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: DEVAI_BFF_ALM_TENANT_ID
            - name: DEVAI_BFF_SRE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: DEVAI_BFF_SRE_TENANT_ID
            - name: DEVAI_BFF_SESSION_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: DEVAI_BFF_SESSION_ENCRYPT_KEY
            - name: DEVAI_BFF_ADMIN_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: DEVAI_BFF_ADMIN_ALLOWED_EMAILS
            # Firebase Web API key served to dashboards by /auth/config.
            # Not strictly secret per Firebase's threat model, but routed
            # through GCP SM so it rotates with every other credential.
            - name: DEVAI_BFF_GIP_WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: DEVAI_BFF_GIP_WEB_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Writable scratch for the read-only root filesystem.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devai-auth-bff
  labels:
    app.kubernetes.io/name: devai-auth-bff
    app.kubernetes.io/part-of: devai
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: devai-auth-bff
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: devai-auth-bff
{{- end }}
