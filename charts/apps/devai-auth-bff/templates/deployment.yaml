apiVersion: apps/v1
kind: Deployment
metadata:
  name: devai-auth-bff
  labels:
    app.kubernetes.io/name: devai-auth-bff
    app.kubernetes.io/part-of: devai
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-auth-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devai-auth-bff
        app.kubernetes.io/part-of: devai
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: auth-bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # Keycloak - Customer/ALM realm (devai.tesserix.app)
            - name: KEYCLOAK_CUSTOMER_URL
              value: {{ .Values.keycloak.customer.url | quote }}
            {{- if .Values.keycloak.customer.internalUrl }}
            - name: KEYCLOAK_CUSTOMER_INTERNAL_URL
              value: {{ .Values.keycloak.customer.internalUrl | quote }}
            {{- end }}
            - name: KEYCLOAK_CUSTOMER_REALM
              value: {{ .Values.keycloak.customer.realm | quote }}
            - name: KEYCLOAK_CUSTOMER_CLIENT_ID
              value: {{ .Values.keycloak.customer.clientId | quote }}
            # Keycloak - Internal/SRE realm (sre.tesserix.app)
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ .Values.keycloak.internal.url | quote }}
            {{- if .Values.keycloak.internal.internalUrl }}
            - name: KEYCLOAK_INTERNAL_INTERNAL_URL
              value: {{ .Values.keycloak.internal.internalUrl | quote }}
            {{- end }}
            - name: KEYCLOAK_INTERNAL_REALM
              value: {{ .Values.keycloak.internal.realm | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_ID
              value: {{ .Values.keycloak.internal.clientId | quote }}
            # Redis — password must be defined before URL for $(VAR) expansion
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            # Keycloak client secrets
            - name: KEYCLOAK_CUSTOMER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: KEYCLOAK_CUSTOMER_CLIENT_SECRET
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: KEYCLOAK_INTERNAL_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: SESSION_SECRET
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: CSRF_SECRET
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: devai-auth-bff
  labels:
    app.kubernetes.io/name: devai-auth-bff
    app.kubernetes.io/part-of: devai
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: devai-auth-bff
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: devai-auth-bff
{{- end }}
