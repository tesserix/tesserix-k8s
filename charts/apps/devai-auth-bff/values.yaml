replicaCount: 1

image:
  repository: ghcr.io/tesseract-nexus/global-services/auth-bff
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

serviceAccount:
  create: true
  name: devai-auth-bff

# General config
env:
  PORT: "8090"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"
  SESSION_MAX_AGE: "86400"
  SESSION_COOKIE_NAME: "devai_session"
  SESSION_COOKIE_DOMAIN: ""
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "lax"
  BASE_DOMAIN: "tesserix.app"
  ALLOWED_ORIGINS: "https://devai.tesserix.app,https://sre.tesserix.app,https://*.tesserix.app"

# DUAL-REALM KEYCLOAK CONFIGURATION
# - Customer realm (devai): ALM dashboard authentication
# - Internal realm (devai-sre): SRE dashboard authentication
# Both realms live on the identity-internal Keycloak instance
keycloak:
  customer:
    url: "https://identity-devai.tesserix.app"
    internalUrl: "http://keycloak.identity-internal.svc.cluster.local:8080"
    realm: "devai"
    clientId: "devai-bff"
  internal:
    url: "https://identity-sre.tesserix.app"
    internalUrl: "http://keycloak.identity-internal.svc.cluster.local:8080"
    realm: "devai-sre"
    clientId: "devai-sre-bff"

# Redis for sessions
redis:
  host: "redis-master.redis-devai.svc.cluster.local"
  port: "6379"

# External Secrets
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

podAnnotations:
  sidecar.istio.io/inject: "true"
