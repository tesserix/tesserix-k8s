# DevAI auth-bff — Go service backed by Google Identity Platform.
#
# Replaces the previous NestJS image. The Go binary ships
# in tesserix/devai/devai-auth-bff:latest (built from devai/services/auth-bff/).
# Architecture:
#   * Mints AES-GCM encrypted session cookies (devai_session, .tesserix.app)
#   * Verifies GIP ID tokens against Google's public JWKS — no Firebase
#     Admin SDK, no ADC. Strict tenant-pool match on each verify.
#   * Reverse-proxies kagent.tesserix.app and aregistry.tesserix.app to
#     their respective upstream services after session check.
#   * Admin allow-list comes from prod-devai-admin-allowed-emails in GCP
#     Secret Manager (comma-separated).

replicaCount: 1

image:
  # In-region GAR pull-through (mirrors GHCR on demand) — NEVER ghcr.io directly,
  # so pods don't incur GHCR egress. Matches every other devai chart.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/global/devai-auth-bff
  pullPolicy: Always
  # CHART-7: pin the auth boundary to a concrete main-<sha> instead of a
  # floating :latest that selfHeal would reconcile to. Kargo overwrites this
  # via the ArgoCD app's helm parameter on each promotion.
  tag: "public-signup"

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

serviceAccount:
  create: true
  name: devai-auth-bff

# Static env. Secrets come via ExternalSecret → devai-auth-bff-secrets.
env:
  DEVAI_BFF_HTTP_PORT: ":8090"
  DEVAI_BFF_GCP_PROJECT_ID: "tesseracthub-480811"
  DEVAI_BFF_GIP_AUTH_DOMAIN: "tesseracthub-480811.firebaseapp.com"
  DEVAI_BFF_SESSION_COOKIE_NAME: "devai_session"
  DEVAI_BFF_SESSION_DOMAIN: ".tesserix.app"
  DEVAI_BFF_SESSION_SECURE: "true"
  DEVAI_BFF_SESSION_MAX_AGE_SECONDS: "86400"
  # Allow verified Google users to self-onboard; admin privileges remain allow-list based.
  DEVAI_BFF_PUBLIC_SIGNUP: "true"
  DEVAI_BFF_ALM_HOST: "devai.tesserix.app"
  DEVAI_BFF_SRE_HOST: "sre.tesserix.app"
  DEVAI_BFF_KAGENT_UPSTREAM_URL: "http://kagent-ui.kagent-system.svc.cluster.local:8080"
  DEVAI_BFF_AREGISTRY_UPSTREAM_URL: "http://agentregistry.agentregistry-system.svc.cluster.local:12121"
  DEVAI_BFF_KAGENT_HOST: "kagent.tesserix.app"
  DEVAI_BFF_AREGISTRY_HOST: "aregistry.tesserix.app"
  # Live preview proxy — the BFF reverse-proxies preview-<id>.tesserix.app /
  # api-<id>.tesserix.app (single-level, covered by the *.tesserix.app cert)
  # to the per-session Service of the same name in the previews namespace,
  # after the devai_session check. WebSocket/HMR upgrades pass through.
  DEVAI_BFF_PREVIEW_DOMAIN: "tesserix.app"
  DEVAI_BFF_PREVIEW_NAMESPACE: "devai-previews"

externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations:
  # WAVE-2: bump to roll the pod so it picks up DEVAI_AUTH_BFF_SHARED_SECRET and
  # starts stamping X-Auth-Bff-Secret on proxied requests (CODE-5).
  deployedAt: "wave2-shared-secret"
