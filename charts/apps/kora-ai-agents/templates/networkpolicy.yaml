apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kora-ai-agents
  labels:
    {{- include "kora-ai-agents.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kora-ai-agents.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.workloadNamespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.networkPolicy.waypointName }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        - port: 15008
          protocol: TCP
    # AgentGateway owns its Istio certificate and originates HBONE directly;
    # its generated data-plane pods are intentionally not ztunnel-captured.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.networkPolicy.gatewayName }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        - port: 15008
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.networkPolicy.gatewayName }}
      ports:
        - port: 8080
          protocol: TCP
        - port: 15008
          protocol: TCP
    # AI traces to the OTel gateway; the observability namespace is outside the
    # mesh, so this is plain OTLP/HTTP with no HBONE port.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.telemetry.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
      ports:
        - port: {{ .Values.telemetry.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kora-ai-agents-waypoint-ingress
  labels:
    {{- include "kora-ai-agents.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.networkPolicy.waypointName }}
  policyTypes: [Ingress]
  ingress:
    # Ambient evaluates the gateway-to-waypoint HBONE flow before L7 policy;
    # mTLS and the service AuthorizationPolicy restrict identity and paths.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
