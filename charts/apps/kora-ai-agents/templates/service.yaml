apiVersion: v1
kind: Service
metadata:
  name: kora-ai-agents
  labels:
    {{- include "kora-ai-agents.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kora-ai-agents.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

