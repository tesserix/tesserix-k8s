apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kora-ai-agents
  labels:
    {{- include "kora-ai-agents.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kora-ai-agents
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ .Values.authorizationPolicy.clientPrincipal | quote }}
            requestPrincipals:
              - {{ printf "%s/*" .Values.endUserAuthentication.issuer | quote }}
      to:
        - operation:
            methods: ["POST"]
            paths: ["/a2a/v1/*"]
