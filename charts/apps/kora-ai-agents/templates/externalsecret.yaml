apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-ai-agents
  labels:
    {{- include "kora-ai-agents.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: kora-ai-agents
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.serviceApiKey) }}
        key: {{ default (.Values.externalSecret.serviceApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}
          kind: SecretStore
{{- end }}
    - secretKey: GATEWAY_API_KEY
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.gatewayApiKey) }}
        key: {{ default (.Values.externalSecret.gatewayApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}
          kind: SecretStore
{{- end }}

