replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/global/kora-ai-agents
  tag: "agents-bf35e62"
  digest: sha256:9fac4fa7d0eef048e9194bfa036ba134716a3476e0836cac4dce78ed71613582
  pullPolicy: IfNotPresent

service:
  port: 8080

serviceAccount:
  name: kora-ai-agents

config:
  tenantId: kora
  gatewayBaseUrl: http://kora-ai.agentgateway-system.svc.cluster.local:8080/v1
  gatewayModel: kora-auto
  maxPromptChars: "12000"
  requestTimeoutSeconds: "45"

externalSecret:
  storeName: gcp-secret-store
  refreshInterval: 1h
  serviceApiKey: prod-kora-ai-agents-api-key
  gatewayApiKey: prod-kora-ai-gateway-api-key

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

networkPolicy:
  gatewayNamespace: agentgateway-system
  gatewayName: kora-ai
  workloadNamespace: kora
  waypointName: waypoint

authorizationPolicy:
  clientPrincipal: cluster.local/ns/agentgateway-system/sa/kora-ai

endUserAuthentication:
  issuer: https://securetoken.google.com/kora-app-e6d38
  audience: kora-app-e6d38
  jwksUri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
  header: X-Kora-Delegated-End-User-Token

telemetry:
  # Empty disables tracing in the service; the pipeline drops anything not marked as AI.
  endpoint: http://otel-gateway.observability.svc.cluster.local:4318/v1/traces
  product: kora
  serviceName: kora-ai-agents
  environment: prod
  namespace: observability
  port: 4318
