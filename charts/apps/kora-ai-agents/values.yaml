replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/ai-agents
  tag: main
  digest: sha256:2ef8305840ec62705c34ace1a61c554ef16bb9e2157d4bb5cf66233c1593a0b3
  pullPolicy: IfNotPresent

service:
  port: 8080

serviceAccount:
  name: kora-ai-agents

config:
  tenantId: kora
  gatewayBaseUrl: http://kora-ai.agentgateway-system.svc.cluster.local:8080/v1
  gatewayModel: kora-auto
  maxPromptChars: "12000"
  requestTimeoutSeconds: "45"

externalSecret:
  storeName: gcp-secret-store
  refreshInterval: 1h
  serviceApiKey: prod-kora-ai-agents-api-key
  gatewayApiKey: prod-kora-ai-gateway-api-key

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

networkPolicy:
  gatewayNamespace: agentgateway-system
  gatewayName: kora-ai
  workloadNamespace: kora
  waypointName: waypoint

authorizationPolicy:
  clientPrincipal: cluster.local/ns/agentgateway-system/sa/kora-ai

endUserAuthentication:
  issuer: https://securetoken.google.com/kora-app-e6d38
  audience: kora-app-e6d38
  jwksUri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
  header: X-Kora-Delegated-End-User-Token
