replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/ai-agents
  tag: main
  digest: sha256:edc3ec82dfffde813092e39d6adde5bf5589287010257c663094b15486987cca
  pullPolicy: IfNotPresent

service:
  port: 8080

serviceAccount:
  name: kora-ai-agents

config:
  tenantId: kora
  gatewayBaseUrl: http://kora-ai.agentgateway-system.svc.cluster.local:8080/v1
  gatewayModel: kora-auto
  maxPromptChars: "12000"
  requestTimeoutSeconds: "45"

externalSecret:
  storeName: gcp-secret-store
  refreshInterval: 1h
  serviceApiKey: prod-kora-ai-agents-api-key
  gatewayApiKey: prod-kora-ai-gateway-api-key

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

networkPolicy:
  gatewayNamespace: agentgateway-system
  gatewayName: kora-ai
  workloadNamespace: kora
  waypointName: waypoint

authorizationPolicy:
  clientPrincipal: cluster.local/ns/agentgateway-system/sa/kora-ai
