podAnnotations:
  homechef.fe3dr.com/redeploy-at: "2026-04-19T13:00:00Z"

# Production overrides for homechef-delivery-portal
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# Production environment
env:
  NODE_ENV: "production"

# KEDA drives autoscaling (request-rate + memory). HPA stays off: the platform
# runs memory-only resources with no CPU requests, so a CPU-target HPA cannot work.
autoscaling:
  enabled: false

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 10

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# Phase 1: Knative stays live and serving; the new Deployment/Service come up
# alongside it. Phase 2 moves traffic; phase 3 deletes this block and the ksvc.
knative:
  enabled: true
  minScale: 1
  maxScale: 10
  scaleDownDelay: "60s"

# Migration phase 1: publish alongside the still-live Knative service.
# Phase 2 points the VirtualService here; phase 3 removes the ksvc and this
# override is dropped so the canonical name is reclaimed.
service:
  nameOverride: "homechef-delivery-portal-direct"
