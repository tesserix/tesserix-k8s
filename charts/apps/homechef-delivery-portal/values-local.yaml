# LOCAL / kind overlay for homechef-delivery-portal. Use with:
#   helm upgrade --install homechef-delivery-portal charts/apps/homechef-delivery-portal \
#     -n homechef -f charts/apps/homechef-delivery-portal/values-local.yaml
#
# Build + load the image into kind first (no registry push):
#   docker build -t homechef-delivery-portal:local -f apps/delivery-portal/Dockerfile .
#   kind load docker-image homechef-delivery-portal:local
# Reach the SPA via:
#   kubectl -n homechef port-forward svc/homechef-delivery-portal 8080:80
#
# Note: VITE_* values are baked into the SPA at BUILD time (set as build args).
image:
  repository: homechef-delivery-portal
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

env:
  VITE_API_URL: "http://localhost:8080/api/v1"
  VITE_WS_URL: "ws://localhost:8080/ws"
  VITE_APP_NAME: "HomeChef Delivery Portal (local)"
  VITE_APP_ENV: "local"

gcp:
  projectId: ""
  secretManager:
    secretPrefix: "local"

keda:
  enabled: false
autoscaling:
  enabled: false
vpa:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: false

