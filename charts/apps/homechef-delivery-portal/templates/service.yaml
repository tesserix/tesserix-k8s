apiVersion: v1
kind: Service
metadata:
  {{- /*
    During the Knative migration the canonical name `homechef-delivery-portal`
    is still held by the Knative Route's ExternalName Service, so this Service
    is published under `service.nameOverride` (e.g. -direct) and the
    VirtualService is cut over to it. Once the ksvc is gone the override is
    dropped and the canonical name is reclaimed.
  */}}
  name: {{ .Values.service.nameOverride | default (include "homechef-delivery-portal.fullname" .) }}
  labels:
    {{- include "homechef-delivery-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "homechef-delivery-portal.selectorLabels" . | nindent 4 }}
    homechef.tesserix.io/stack: deployment
