{{- if not .Values.knative.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homechef-delivery-portal.fullname" . }}
  labels:
    {{- include "homechef-delivery-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "homechef-delivery-portal.selectorLabels" . | nindent 4 }}
{{- end }}
