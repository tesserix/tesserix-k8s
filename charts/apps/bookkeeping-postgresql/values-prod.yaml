# Production overrides for bookkeeping-postgresql
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Scaled down - not in use
primary:
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 1Gi
  persistence:
    size: 50Gi
  replicaCount: 0

# Disable replication
replication:
  enabled: false
  readReplicas: 0

# Higher connection limits for production
postgresqlMaxConnections: 200

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"
