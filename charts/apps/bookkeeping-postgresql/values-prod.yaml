# Production overrides for bookkeeping-postgresql
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Production resource allocation for PostgreSQL
primary:
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 1Gi
  persistence:
    size: 50Gi

# Enable replication for production
replication:
  enabled: true
  readReplicas: 2

# Higher connection limits for production
postgresqlMaxConnections: 200

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"
