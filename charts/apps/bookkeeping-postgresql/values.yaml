# PostgreSQL configuration for Bookkeeping application
# Uses Bitnami PostgreSQL chart as dependency

  enabled: true
  name: "bookkeeping-postgresql-password"
  # Generate encrypted data using: echo -n 'password' | kubeseal --raw --namespace bookkeeping --name bookkeeping-postgresql-password
  encryptedData: {}
    # postgresql-password: "AgBY..."

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "bookkeeping"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
