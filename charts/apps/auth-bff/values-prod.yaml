# Production overrides for auth-bff

image:
  repository: ghcr.io/tesserix/auth-bff
  tag: "1.3.6"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  GIN_MODE: "release"
  BASE_DOMAIN: "mark8ly.com"
  ALLOWED_ORIGINS: "https://*.mark8ly.com,https://*"

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

# Production Keycloak configuration
keycloak:
  internal:
    url: "https://internal-idp.mark8ly.com"
    realm: "tesserix-internal"
  customer:
    url: "https://identity.fanzonebattleground.com"
    realm: "tesserix-customer"

# KEDA autoscaling - enabled for production
keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1
