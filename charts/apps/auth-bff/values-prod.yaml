# Production overrides for auth-bff

image:
  repository: ghcr.io/tesserix/auth-bff
  tag: "20260328-marketplace-stability"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  GIN_MODE: "release"
  ENVIRONMENT: "production"
  APP_ENV: "production"
  BASE_DOMAIN: "mark8ly.com"
  ALLOWED_ORIGINS: "https://*.mark8ly.com,https://*"
  TENANT_SERVICE_URL: "http://tenant-service-direct.marketplace.svc.cluster.local:8080"
  VERIFICATION_SERVICE_URL: "http://verification-service-direct.marketplace.svc.cluster.local:8080"
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local"
  OPENFGA_AUTH_MODE: "mesh"
  SESSION_MAX_AGE: "172800"
  RATE_LIMIT_RPM: "300"
  WEBAUTHN_RP_ID: "mark8ly.com"
  WEBAUTHN_RP_NAME: "Mark8ly"

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

# Production Keycloak configuration
keycloak:
  internal:
    url: "https://internal-idp.mark8ly.com"
    realm: "tesserix-internal"
  customer:
    url: "https://identity.fanzonebattleground.com"
    realm: "tesserix-customer"

# KEDA autoscaling - enabled for production
keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1
