{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "auth-bff.fullname" . }}-secrets
  labels:
    {{- include "auth-bff.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "auth-bff.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_INTERNAL_CLIENT_SECRET
      remoteRef:
        key: {{ printf "%s-keycloak-internal-dashboard-client-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: KEYCLOAK_CUSTOMER_CLIENT_SECRET
      remoteRef:
        key: {{ printf "%s-keycloak-customer-dashboard-client-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ printf "%s-encryption-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: CSRF_SECRET
      remoteRef:
        key: {{ printf "%s-jwt-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ printf "%s-marketplace-redis-password" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: TOTP_ENCRYPTION_KEY
      remoteRef:
        key: {{ printf "%s-totp-encryption-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: {{ printf "%s-internal-service-key" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
