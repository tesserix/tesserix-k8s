name: vehicle-rental-admin
namespace: vehicle-rental
partOf: vehicle-rental-app

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/vehicle-rental-admin
  tag: "main-c4145fa"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 3000

# infrastructure.md: admin runs flat at 2. Counter staff load is bounded by how
# many people are behind the desk, not by public traffic.
replicas: 2

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

pdb:
  enabled: true
  minAvailable: 1

# Routed by vehicle-rental-storefront's wildcard VirtualService on the
# <shop>-admin.tesserix.app authority regex — no VirtualService of its own, or
# Istio would merge two objects on the same host.
platformHostSuffix: tesserix.app

# The UI holds no database credential. Postgres is reached only by the Go API,
# which is what enforces the tenant scope the RLS policies read.
api:
  baseUrl: http://vehicle-rental-api.vehicle-rental.svc.cluster.local:8080

auth:
  issuer: https://auth.tesserix.app
  clientId: vehicle-rental-admin

gcp:
  secretManager:
    enabled: true
    refreshInterval: 1h
    secretStore: gcp-secret-store
  secrets:
    sessionKey: prod-vehicle-rental-session-encrypt-key
