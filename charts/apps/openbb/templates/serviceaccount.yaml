{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openbb.serviceAccountName" . }}
  labels:
    {{- include "openbb.labels" . | nindent 4 }}
  {{- if and .Values.gcp.workloadIdentity.enabled .Values.gcp.workloadIdentity.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcp.workloadIdentity.gcpServiceAccount }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
