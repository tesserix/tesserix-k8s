apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbb-api-keys
  labels:
    {{- include "openbb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: openbb-api-keys
    creationPolicy: Owner
  data:
    - secretKey: FMP_API_KEY
      remoteRef:
        key: prod-stockpilot-fmp-api-key
    - secretKey: FINNHUB_API_KEY
      remoteRef:
        key: prod-stockpilot-finnhub-api-key
