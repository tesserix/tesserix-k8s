# Default values for notification-hub
replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly/notification-hub
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  # Exclude NATS and PostgreSQL ports from Istio sidecar
  # - 4222: NATS JetStream timeout issues
  # - 5432: PostgreSQL connection EOF issues with mTLS
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# KEDA ScaledObject configuration
keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  # Prometheus trigger for traffic-based scaling (Istio metrics)
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    # Scale based on requests per second to this service
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="notification-hub",reporter="destination"}[2m]))
    requestRateThreshold: "50"  # Scale up when RPS > 50 per pod
  # Fallback CPU/Memory triggers
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  SERVER_PORT: "8080"
  GIN_MODE: "release"

  # Database (DB_HOST set via database.host to avoid duplicates)

  # NATS
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  NATS_CONSUMER_NAME: "notification-hub"
  NATS_MAX_RECONNECTS: "10"
  NATS_RECONNECT_WAIT: "2s"

  # WebSocket
  WS_PING_INTERVAL: "30s"
  WS_PONG_WAIT: "60s"
  WS_WRITE_WAIT: "10s"
  WS_MAX_MESSAGE_SIZE: "524288"

  # App
  APP_ENV: "production"
  LOG_LEVEL: "info"

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration - centralized for easy modification
# ArgoCD can override database.host to change the PostgreSQL server
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "notification_db"
  user: "postgres"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 300

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
