# Production overrides for notification-hub

image:
  repository: ghcr.io/tesserix/mark8ly-notification-hub
  tag: "20260330-fix-migration"

# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 1

# Istio sidecar configuration for NATS connectivity
podAnnotations:
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"

# Production resource allocation - handles WebSocket connections
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

# Production database configuration
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  name: "notification_db"
  sslmode: "require"

# Production environment
env:
  GIN_MODE: "release"
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local:8080"
  OPENFGA_AUTH_MODE: "preshared"
  OPENFGA_MARKETPLACE_STORE_ID: "01KMS970NNJPJP97MR7XNZSVD3"
  SERVICE_AUTH_MODE: "mesh"

# Production service account with Workload Identity
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"notification-hub\"}[2m]))"
    requestRateThreshold: "50"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: false
  minAvailable: 0

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store

knative:
  enabled: false
