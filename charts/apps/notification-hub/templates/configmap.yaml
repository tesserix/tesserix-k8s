{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-hub.fullname" . }}-config
  labels:
    {{- include "notification-hub.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: "postgresql.postgresql-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "notifications_db"
  DB_USER: "postgres"
  DB_SSLMODE: "require"
  PORT: "8080"
  PUBSUB_ENABLED: "true"
  WEBSOCKET_ENABLED: "true"
  SSE_ENABLED: "true"
{{- end }}
