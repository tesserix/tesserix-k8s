# Production overrides for horoscope-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml
#
# The base values.yaml is already prod-shaped (Knative on, image pulls
# from public GHCR, GSA email pinned). This file is reserved for the small
# delta we want to be able to tweak without editing values.yaml: a
# redeploy timestamp to break the :latest manifest cache, and any future
# prod-only resource bumps.

# Bump this timestamp when you need to force Knative to create a new
# Revision (re-pulls :latest fresh). The ghcr-remote pull-through cache
# can hold a stale :latest manifest; a spec change is the cheapest way
# to break it out.
podAnnotations:
  horoscope.tesserix.app/redeploy-at: "2026-05-09T10:00:00Z"
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

# Reading lens defaults to "all" (combined Western/Mian Xiang/Vedic).
env:
  HOROSCOPE_ENV: "production"
  GIN_MODE: "release"
  HOROSCOPE_VISION_MODEL: "claude-opus-4-7"
