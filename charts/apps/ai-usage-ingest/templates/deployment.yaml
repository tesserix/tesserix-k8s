apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ai-usage-ingest.labels" . | nindent 4 }}
  # No sidecar annotations: `tesserix` is ambient-excluded and carries
  # istio-injection: disabled (charts/thirdparty/istio-config/values.yaml), so
  # the NetworkPolicy beside this file is the enforced control, not an
  # AuthorizationPolicy.
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        {{- include "ai-usage-ingest.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        # Numeric, not the image's `nonroot` username: the kubelet cannot verify
        # a name against runAsNonRoot and refuses to start the container.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toYaml .Values.image.command | nindent 12 }}
          ports:
            - name: otlp
              containerPort: {{ .Values.service.port }}
          env:
            - name: AI_USAGE_INGEST_ADDR
              value: ":{{ .Values.service.port }}"
            - name: AI_USAGE_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: TESSERIX_DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: TESSERIX_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: TESSERIX_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: TESSERIX_DB_SSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: TESSERIX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: username
            - name: TESSERIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: password
          # Liveness only. There is no readiness gate on the stream: a NATS blip
          # must not take the export endpoint out of the Service, or the gateway
          # would lose the spend that blip caused — which is the outage this
          # buffer exists to survive.
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
