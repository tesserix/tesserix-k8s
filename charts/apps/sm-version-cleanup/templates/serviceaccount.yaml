{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sm-version-cleanup.serviceAccountName" . }}
  namespace: {{ include "sm-version-cleanup.namespace" . }}
  labels:
    {{- include "sm-version-cleanup.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
{{- end }}
