registryOwnership:
  # Registry owns the AgentGateway CRs after the production handoff. Set false
  # only to exercise or execute the Helm rollback path.
  enabled: true

gateway:
  name: kora-ai
  className: agentgateway
  port: 8080
  replicas: 2
  serviceAccount:
    gcpServiceAccount: agentgateway-llm@tesseracthub-480811.iam.gserviceaccount.com
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

providers:
  vertex:
    projectId: tesseracthub-480811
    region: global
    generationModel: gemini-3.5-flash
    embeddingModel: gemini-embedding-001
  anthropic:
    model: claude-sonnet-4-5
  xai:
    # Enable only after a real credential exists in Secret Manager.
    enabled: false
    host: api.x.ai
    model: grok-4

externalSecrets:
  storeName: gcp-secret-store
  refreshInterval: 1h
  clientSecretName: kora-ai-gateway-client-credentials
  providerSecretName: kora-ai-gateway-provider-credentials
  agentSecretName: kora-ai-gateway-agent-credentials
  remoteRefs:
    clientApiKey: prod-kora-ai-gateway-api-key
    vertexApiKey: prod-kora-vertex-api-key
    anthropicApiKey: prod-devai-anthropic-api-key
    xaiApiKey: prod-kora-xai-api-key
    agentApiKey: prod-kora-ai-agents-api-key

a2a:
  host: kora-ai-agents.kora.svc.cluster.local
  port: 8080
  pathPrefix: /a2a/v1/
  # Longer than Kora API's 60s A2A deadline; shorter than the mobile 90s
  # deadline and the external 100s Istio route.
  requestTimeout: 70s

# Where this gateway exports its LLM spans. The AI usage ingest turns them into
# the console's cost and token ledger; a ReferenceGrant in that namespace is what
# permits this cross-namespace reference.
tracing:
  serviceName: ai-usage-ingest
  namespace: tesserix
  port: 4318

optimizer:
  serviceName: token-optimizer
  grpcPort: 18080

limits:
  requestsPerMinute: 120
  requestBurst: 20
  tokensPerHour: 1000000
  # ext_proc buffers the request body; the 2mb default rejected coach requests.
  maxBufferSize: 16Mi

networkPolicy:
  enabled: true
  koraNamespace: kora
  koraPodSelector:
    app.kubernetes.io/name: kora-api
  agentPodSelector:
    app.kubernetes.io/name: kora-ai-agents
  monitoringNamespace: monitoring

authorizationPolicy:
  enabled: true
  koraPrincipal: cluster.local/ns/kora/sa/kora-api
  agentPrincipal: cluster.local/ns/kora/sa/kora-ai-agents
  gatewayPort: "8080"

endUserAuthentication:
  enabled: true
  issuer: https://securetoken.google.com/kora-app-e6d38
  audience: kora-app-e6d38
  jwksUri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
  jwksHost: www.googleapis.com
  jwksPath: /service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
  jwksCacheDuration: 5m
  header: X-Kora-End-User-Token
