apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kora-ai
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - matches:
        - headers:
            - name: x-kora-ai-context-kind
              type: Exact
              value: conversation
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kora-conversation-providers
    - matches:
        - headers:
            - name: x-kora-ai-context-kind
              type: Exact
              value: json_api
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kora-structured-providers
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kora-structured-providers

