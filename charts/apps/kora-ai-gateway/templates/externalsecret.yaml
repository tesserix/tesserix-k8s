apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.clientSecretName }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.clientSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: kora-api
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.remoteRefs.clientApiKey) }}
        key: {{ default (.Values.externalSecrets.remoteRefs.clientApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-{{ if hasPrefix "devai/" $bao }}devai-production{{ else }}kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}{{ end }}
          kind: SecretStore
{{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.providerSecretName }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.providerSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: vertex-api-key
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.remoteRefs.vertexApiKey) }}
        key: {{ default (.Values.externalSecrets.remoteRefs.vertexApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-{{ if hasPrefix "devai/" $bao }}devai-production{{ else }}kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}{{ end }}
          kind: SecretStore
{{- end }}
    - secretKey: anthropic
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.remoteRefs.anthropicApiKey) }}
        key: {{ default (.Values.externalSecrets.remoteRefs.anthropicApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-{{ if hasPrefix "devai/" $bao }}devai-production{{ else }}kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}{{ end }}
          kind: SecretStore
{{- end }}
    {{- if .Values.providers.xai.enabled }}
    - secretKey: xai
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.remoteRefs.xaiApiKey) }}
        key: {{ default (.Values.externalSecrets.remoteRefs.xaiApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-{{ if hasPrefix "devai/" $bao }}devai-production{{ else }}kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}{{ end }}
          kind: SecretStore
{{- end }}
    {{- end }}
---
