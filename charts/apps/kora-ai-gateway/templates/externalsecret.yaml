apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.clientSecretName }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.clientSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: kora-api
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.clientApiKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.providerSecretName }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.providerSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: anthropic
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.anthropicApiKey }}
    {{- if .Values.providers.xai.enabled }}
    - secretKey: xai
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.xaiApiKey }}
    {{- end }}
