{{- if .Values.endUserAuthentication.enabled }}
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: {{ .Values.gateway.name }}-user
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.gateway.name }}
  jwtRules:
    - issuer: {{ .Values.endUserAuthentication.issuer | quote }}
      audiences:
        - {{ .Values.endUserAuthentication.audience | quote }}
      jwksUri: {{ .Values.endUserAuthentication.jwksUri | quote }}
      forwardOriginalToken: true
      fromHeaders:
        - name: {{ .Values.endUserAuthentication.header | quote }}
          prefix: "Bearer "
{{- end }}
