apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kora-a2a-agents
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  a2a:
    host: {{ .Values.a2a.host | quote }}
    port: {{ .Values.a2a.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kora-a2a
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.pathPrefix | quote }}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kora-a2a-agents
          weight: 1
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kora-a2a-traffic
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kora-a2a
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ .Values.externalSecrets.clientSecretName }}
    rateLimit:
      local:
        - requests: {{ .Values.limits.requestsPerMinute }}
          unit: Minutes
          burst: {{ .Values.limits.requestBurst }}
    timeouts:
      request: {{ .Values.a2a.requestTimeout }}
  backend:
    auth:
      secretRef:
        name: {{ .Values.externalSecrets.agentSecretName }}
        key: API_KEY
      location:
        header:
          name: Authorization
          prefix: "Bearer "
