apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  logging:
    format: json
    level: info
  resources:
    {{- toYaml .Values.gateway.resources | nindent 4 }}
  shutdown:
    min: 5
    max: 30
  istio:
    enabled: true
  deployment:
    spec:
      replicas: {{ .Values.gateway.replicas }}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      template:
        spec:
          containers:
            - name: agentgateway
              env:
                - name: GCE_METADATA_HOST
                  value: "169.254.169.254"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
  service:
    metadata:
      labels:
        # AgentGateway owns native Istio transport; user JWT is enforced by
        # AgentgatewayPolicy. See ADR 0003.
        istio.io/use-waypoint: "none"
    spec:
      type: ClusterIP
  serviceAccount:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ .Values.gateway.serviceAccount.gcpServiceAccount | quote }}
  podDisruptionBudget:
    spec:
      minAvailable: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ .Values.gateway.name }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
