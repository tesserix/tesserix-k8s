{{- if not .Values.registryOwnership.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kora-structured-providers
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  policies:
    ai:
      routes:
        {{- include "kora-ai-gateway.aiRoutes" . | nindent 8 }}
  ai:
    groups:
      {{- include "kora-ai-gateway.vertexGroup" (dict "root" . "model" .Values.providers.vertex.generationModel) | nindent 6 }}
      {{- include "kora-ai-gateway.anthropicGroup" . | nindent 6 }}
      {{- if .Values.providers.xai.enabled }}
      {{- include "kora-ai-gateway.xaiGroup" . | nindent 6 }}
      {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kora-conversation-providers
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  policies:
    ai:
      routes:
        {{- include "kora-ai-gateway.aiRoutes" . | nindent 8 }}
  ai:
    groups:
      {{- include "kora-ai-gateway.vertexGroup" (dict "root" . "model" .Values.providers.vertex.generationModel) | nindent 6 }}
      {{- include "kora-ai-gateway.anthropicGroup" . | nindent 6 }}
      {{- if .Values.providers.xai.enabled }}
      {{- include "kora-ai-gateway.xaiGroup" . | nindent 6 }}
      {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kora-embedding-providers
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  policies:
    ai:
      routes:
        {{- include "kora-ai-gateway.aiRoutes" . | nindent 8 }}
  ai:
    groups:
      {{- include "kora-ai-gateway.vertexGroup" (dict "root" . "model" .Values.providers.vertex.embeddingModel) | nindent 6 }}
{{- end }}
