{{- if .Values.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "kora-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.gateway.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ .Values.authorizationPolicy.koraPrincipal | quote }}
            requestPrincipals:
              - {{ printf "%s/*" .Values.endUserAuthentication.issuer | quote }}
      to:
        - operation:
            ports:
              - {{ .Values.authorizationPolicy.gatewayPort | quote }}
    - from:
        - source:
            principals:
              - {{ .Values.authorizationPolicy.agentPrincipal | quote }}
            requestPrincipals:
              - {{ printf "%s/*" .Values.endUserAuthentication.issuer | quote }}
      to:
        - operation:
            ports:
              - {{ .Values.authorizationPolicy.gatewayPort | quote }}
    # Bulk food-index embeddings are machine work rather than an app-user
    # action. Keep this exception path-specific; every generative and A2A call
    # above requires both the workload SPIFFE principal and a verified user.
    - from:
        - source:
            principals:
              - {{ .Values.authorizationPolicy.koraPrincipal | quote }}
      to:
        - operation:
            methods: ["POST"]
            paths: ["/v1/embeddings"]
            ports:
              - {{ .Values.authorizationPolicy.gatewayPort | quote }}
    - to:
        - operation:
            notPorts:
              - {{ .Values.authorizationPolicy.gatewayPort | quote }}
{{- end }}
