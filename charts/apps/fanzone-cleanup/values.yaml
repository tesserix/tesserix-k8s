# =============================================================================
# FanZone Match Cleanup Service
# Periodically purges transient match data (chat, predictions, bot data)
# Single instance only (should not run in parallel)
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-cleanup
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude PostgreSQL and MongoDB from Istio sidecar
  # Exclude GCP metadata server from Istio for Workload Identity
  # Istio sidecar configuration
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8089

# Lightweight service — minimal compute needed
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3


# No autoscaling — single instance
autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

# Graceful shutdown
terminationGracePeriodSeconds: 30

# Environment configuration
env:
  GO_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

  # Server config
  SERVER_PORT: "8089"

  # Cleanup scheduling
  CLEANUP_INTERVAL: "30m"
  CLEANUP_DELAY_HOURS: "6"
  BATCH_SIZE: "10"

# PostgreSQL configuration — fanzone database
database:
  host: "fanzone-postgres-rw.fanzone.svc.cluster.local"
  port: "5432"
  user: "fanzone"
  name: "fanzone"
  sslmode: "require"
  passwordSecretName: "fanzone-postgres-app-credentials"
  passwordSecretKey: "password"

# PostgreSQL configuration — fanzone_auth database (same host, different DB)
authDatabase:
  host: "fanzone-postgres-rw.fanzone.svc.cluster.local"
  port: "5432"
  user: "fanzone"
  name: "fanzone_auth"
  sslmode: "require"
  passwordSecretName: "fanzone-postgres-app-credentials"
  passwordSecretKey: "password"

# MongoDB configuration
mongodb:
  url: "mongodb://mongodb.mongodb-fanzone.svc.cluster.local:27017/fanzone"

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
