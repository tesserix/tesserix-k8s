apiVersion: v2
name: obs-api
description: |
  obs-api — the query API for the Tesserix Observability platform.

  The only component that reads from ClickHouse, and it connects as the
  read-only `observer` user created by the bootstrap SQL, so a compromise here
  cannot alter or delete telemetry.

  Authentication is Google OAuth with a hard email allowlist. Three startup
  checks fail closed rather than degrade: missing secrets, a SESSION_SECRET
  shorter than 32 bytes, and an empty allowlist. The last one matters most — an
  empty allowlist would authenticate anyone with a Google account.

  Source: https://github.com/tesserix/observability
type: application
version: 1.0.1
appVersion: "1.0.0"
