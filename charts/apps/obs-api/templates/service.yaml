apiVersion: v1
kind: ServiceAccount
metadata:
  name: obs-api
  {{- if .Values.traceability.enabled }}
  annotations:
    # Workload Identity. trace-to-code reads image manifests and config blobs
    # from Artifact Registry to recover the OCI revision label, which is the
    # only authoritative link from a running image back to its commit — a tag
    # is a mutable pointer, and `:latest`/`:main` identify no build at all.
    #
    # The cluster has Workload Identity enabled, so without this binding the
    # metadata server hands out no usable token and every registry read fails.
    # The GSA holds roles/artifactregistry.reader and nothing else.
    iam.gke.io/gcp-service-account: {{ .Values.traceability.gcpServiceAccount | quote }}
  {{- end }}
  labels:
    app.kubernetes.io/name: obs-api
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: tesserix
---
apiVersion: v1
kind: Service
metadata:
  name: obs-api
  labels:
    app.kubernetes.io/name: obs-api
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: tesserix
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: obs-api
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: obs-api
  labels:
    app.kubernetes.io/name: obs-api
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: tesserix
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-api
{{- end }}
