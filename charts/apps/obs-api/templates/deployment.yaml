apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-api
  labels:
    app.kubernetes.io/name: obs-api
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: tesserix
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-api
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # ClickHouse's native protocol on 9000 is not HTTP; excluding it keeps
        # the sidecar from trying to parse it as one.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9000"
      labels:
        app.kubernetes.io/name: obs-api
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: tesserix
    spec:
      serviceAccountName: obs-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: obs-api
                topologyKey: kubernetes.io/hostname
      # Long enough for open live-tail SSE streams to close cleanly on a
      # rolling update instead of being cut mid-session.
      terminationGracePeriodSeconds: 45
      containers:
        - name: obs-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: OBS_API_ADDR
              value: ":{{ .Values.port }}"
            - name: OBS_API_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: CLICKHOUSE_ADDR
              value: {{ .Values.clickhouse.addr | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USERNAME
              value: {{ .Values.clickhouse.username | quote }}
            - name: CLICKHOUSE_CLUSTER
              value: {{ .Values.clickhouse.cluster | quote }}
            - name: SESSION_TTL
              value: {{ .Values.session.ttl | quote }}
            - name: QUERY_TIMEOUT
              value: {{ .Values.query.timeout | quote }}
            - name: MAX_QUERY_LIMIT
              value: {{ .Values.query.maxLimit | quote }}
            # The authorisation model, in full. obs-api refuses to start if
            # this resolves to empty.
            - name: ALLOWED_EMAILS
              value: {{ join "," .Values.allowedEmails | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clickhouse.name }}
                  key: {{ .Values.secrets.clickhouse.key }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: {{ .Values.secrets.obsApi.sessionSecretKey }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: {{ .Values.secrets.obsApi.googleClientIDKey }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: {{ .Values.secrets.obsApi.googleClientSecretKey }}
            {{- if .Values.incidents.enabled }}
            # Incident recording writes to the `sre` database under its own
            # identity. observer cannot be reused: its readonly profile forbids
            # INSERT outright, and that profile is what guarantees obs-api
            # cannot alter telemetry.
            - name: SRE_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clickhouse.name }}
                  key: {{ .Values.incidents.writerSecretKey }}
            - name: SRE_DATABASE
              value: {{ .Values.incidents.database | quote }}
            {{- end }}
            {{- if .Values.traceability.enabled }}
            # Trace-to-code: walks a log record back to the commit that
            # produced it. obs-api treats these as optional and starts normally
            # without them, reporting the feature as unavailable rather than
            # failing — showing logs must not depend on a secondary feature's
            # credentials.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: github-app-id
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: github-installation-id
            # A file, not an env var: a multi-line PEM through the environment
            # is a dependable source of mangled-newline bugs that surface as an
            # unparseable key at startup.
            - name: GITHUB_APP_KEY_PATH
              value: {{ .Values.traceability.keyMountPath }}/github-app-key.pem
            {{- end }}
          {{- if .Values.traceability.enabled }}
          volumeMounts:
            - name: github-app-key
              mountPath: {{ .Values.traceability.keyMountPath }}
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # /readyz checks ClickHouse reachability, so a pod that cannot query
          # is pulled from the Service rather than serving 500s.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.traceability.enabled }}
      volumes:
        - name: github-app-key
          secret:
            secretName: {{ .Values.secrets.obsApi.name }}
            items:
              - key: github-app-key.pem
                path: github-app-key.pem
            # 0440, not 0400. Kubernetes owns secret files as root:fsGroup,
            # and this pod runs as uid 65532 — with owner-only permissions the
            # process cannot read its own key and traceability silently
            # disables itself at startup. Group read is the tightest mode that
            # actually works here; world read is still withheld.
            defaultMode: 0440
      {{- end }}
