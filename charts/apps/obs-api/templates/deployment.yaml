apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-api
  labels:
    app.kubernetes.io/name: obs-api
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: tesserix
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-api
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # ClickHouse's native protocol on 9000 is not HTTP; excluding it keeps
        # the sidecar from trying to parse it as one.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9000"
      labels:
        app.kubernetes.io/name: obs-api
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: tesserix
    spec:
      serviceAccountName: obs-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: obs-api
                topologyKey: kubernetes.io/hostname
      # Long enough for open live-tail SSE streams to close cleanly on a
      # rolling update instead of being cut mid-session.
      terminationGracePeriodSeconds: 45
      containers:
        - name: obs-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: OBS_API_ADDR
              value: ":{{ .Values.port }}"
            - name: OBS_API_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: CLICKHOUSE_ADDR
              value: {{ .Values.clickhouse.addr | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USERNAME
              value: {{ .Values.clickhouse.username | quote }}
            - name: CLICKHOUSE_CLUSTER
              value: {{ .Values.clickhouse.cluster | quote }}
            - name: SESSION_TTL
              value: {{ .Values.session.ttl | quote }}
            - name: QUERY_TIMEOUT
              value: {{ .Values.query.timeout | quote }}
            - name: MAX_QUERY_LIMIT
              value: {{ .Values.query.maxLimit | quote }}
            # The authorisation model, in full. obs-api refuses to start if
            # this resolves to empty.
            - name: ALLOWED_EMAILS
              value: {{ join "," .Values.allowedEmails | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clickhouse.name }}
                  key: {{ .Values.secrets.clickhouse.key }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: {{ .Values.secrets.obsApi.sessionSecretKey }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: {{ .Values.secrets.obsApi.googleClientIDKey }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.obsApi.name }}
                  key: {{ .Values.secrets.obsApi.googleClientSecretKey }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # /readyz checks ClickHouse reachability, so a pod that cannot query
          # is pulled from the Service rather than serving 500s.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
