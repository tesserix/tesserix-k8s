# obs-api — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/obs-api.yaml.

# Revived 2026-09-03 to serve observability.tesserix.app.
replicaCount: 2

image:
  # The GAR pull-through mirror, NOT ghcr.io directly.
  #
  # CI pushes to ghcr.io; ghcr-remote lazily mirrors it into asia-south1. Pods
  # pull from inside the region, so image pulls cost no cross-region egress —
  # which matters on a Spot pool, where every preemption re-pulls.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/observability/obs-api
  # MANAGED BY KARGO — observability-apps-prod rewrites this line on every
  # promotion. Edit the warehouse, not this value.
  #
  # Immutable, never the moving `main`. GAR's pull-through cache only
  # re-resolves a tag roughly every 30 minutes, so `:main` could serve the
  # previous digest long after CI went green — with nothing to indicate the
  # rollout had not actually happened.
  tag: main-a7a5a2d
  # Belt-and-braces. The tag is immutable now, so this costs one manifest
  # HEAD per container start and protects nothing important — but it also
  # cannot hurt, and it keeps behaviour identical if anyone repins to `main`.
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

port: 8080

# Externally reachable base URL. The OAuth redirect URI is derived from this,
# so it MUST match both the browser's origin and the URI registered on the
# Google OAuth client, or sign-in fails with redirect_uri_mismatch.
publicURL: https://observability.tesserix.app

clickhouse:
  addr: clickhouse.observability.svc.cluster.local:9000
  database: otel
  # Read-only user created by the bootstrap SQL, NOT `default`. obs-api has no
  # reason to be able to write.
  username: observer
  cluster: otel

# The complete set of accounts permitted to sign in. There is no domain rule
# to fall back on -- these are personal Gmail accounts -- so this list is the
# entire authorisation model. Adding someone means editing this and syncing.
allowedEmails:
  - samyak.rout@gmail.com
  - unidevidp@gmail.com
  - mahesh.sangawar@gmail.com

session:
  ttl: 12h

query:
  timeout: 30s
  maxLimit: 5000

secrets:
  # Provisioned by the ExternalSecret in external-secrets/prod/observability.
  clickhouse:
    name: clickhouse-secrets
    key: observer-password
  obsApi:
    name: obs-api-secrets
    sessionSecretKey: session-secret
    googleClientIDKey: google-client-id
    googleClientSecretKey: google-client-secret

# Memory-only per platform policy: no CPU requests or limits anywhere.
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 384Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  # Nothing is written to disk; the distroless-static image has no shell or
  # package manager to need one either.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations:
  prometheus.io/scrape: "false"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  workload: infrastructure

tolerations: []

# Trace-to-code: resolves a log line back to the commit that produced it, by
# walking image digest -> OCI revision label -> repo + commit -> file:line ->
# git blame.
#
# obs-api treats this as strictly optional. With it disabled (or with the
# credentials absent) the process starts normally and /api/trace-to-code
# reports the feature as unavailable — an observability tool must not refuse
# to show logs because a secondary feature lacks credentials.
traceability:
  enabled: true
  # Needs roles/artifactregistry.reader and a workloadIdentityUser binding for
  # the observability/obs-api KSA. Nothing else: it reads image metadata and
  # never writes.
  gcpServiceAccount: obs-api-prod@tesseracthub-480811.iam.gserviceaccount.com
  # Where the GitHub App private key is mounted. A file rather than an env var
  # because a multi-line PEM through the environment reliably arrives with
  # mangled newlines and fails to parse at startup.
  keyMountPath: /var/run/secrets/github

# SRE incident recording: keeps a durable record of traced errors, with an
# append-only audit trail. The log itself ages out after 30 days, so without
# this the link between "this failed" and "this commit caused it" is lost
# exactly when a pattern would start to become visible.
#
# Optional, like traceability: with it disabled obs-api starts normally and the
# incident endpoints report the feature as unavailable.
incidents:
  enabled: true
  database: sre
  # Key in the clickhouse-secrets Secret. A separate identity from observer,
  # which is readonly and therefore cannot INSERT.
  writerSecretKey: sre-writer-password
