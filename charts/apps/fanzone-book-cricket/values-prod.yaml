# Production overrides for fanzone-book-cricket
# Knative Serving — scale-to-zero enabled (request-driven mini-game)

image:
  pullPolicy: IfNotPresent

knative:
  enabled: true
  minScale: 0
  maxScale: 10
  scaleDownDelay: "60s"

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Workload Identity annotation for GCP SA binding
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
