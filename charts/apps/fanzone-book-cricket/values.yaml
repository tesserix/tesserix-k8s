replicaCount: 1

image:
  repository: ghcr.io/tesserix/FanZone-Battle-Ground/fanzone-book-cricket
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432,6379,27017,443"
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8089

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

env:
  GO_ENV: "production"
  LOG_LEVEL: "warn"
  LOG_FORMAT: "json"
  REDIS_HOST: "redis.redis-fanzone.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "4"
  NATS_STREAM_NAME: "FANZONE_BOOK_CRICKET"
  DRAFT_TIMER_SECONDS: "12"
  DELIVERY_TIMER_SECONDS: "20"
  GAME_FEE_POINTS: "15"
  # NATS_URL and MONGO_URL come from ESO secrets

# Knative Serving configuration
knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"
