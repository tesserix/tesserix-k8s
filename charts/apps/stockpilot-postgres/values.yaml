hibernate: false

namespace: stockpilot
clusterName: stockpilot-postgres

instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

storageSize: 10Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi
# NOTE: storage was bumped to 100Gi/20Gi briefly but the GKE PD-CSI
# resizer hit DeadlineExceeded, leaving the PVC half-resized and the
# cluster pod stuck. Reverting size to current PVC status.capacity so
# CNPG stops waiting on the resize. Re-do storage growth incrementally
# (e.g. 10 -> 20 -> 50 -> 100) and only when the cluster is idle so
# any retry deadline doesn't catch us mid-debate.

resources:
  requests:
    memory: 1Gi
    cpu: 250m
  limits:
    memory: 4Gi
    cpu: 2000m

bootstrap:
  database: stockpilot
  owner: stockpilot
  secret: stockpilot-postgres-app-credentials
  gcpSecretName: prod-stockpilot-postgresql-password
  # First-init bootstrap. CNPG runs these once when the cluster is created.
  # vector       — pgvector for LLM embedding storage (analyst memory,
  #                situation-similarity retrieval over agent_decision_memory).
  # uuid-ossp    — uuid_generate_v4 / v7 helpers for SQL-side id generation.
  # pg_stat_statements is auto-loaded via shared_preload_libraries; the
  # CREATE EXTENSION is just for safety on rare images that miss the auto-load.
  postInitSQL:
    - "CREATE EXTENSION IF NOT EXISTS vector"
    - "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\""
    - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"

postgresql:
  max_connections: "200"
  # Tuned for the 4Gi memory limit so pgvector workloads have headroom for
  # HNSW / IVFFLAT index builds and large k-NN scans.
  shared_buffers: "1GB"
  effective_cache_size: "3GB"
  work_mem: "16MB"
  maintenance_work_mem: "512MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots
  max_slot_wal_keep_size: "10GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/stockpilot-postgres"
  retentionPolicy: "30d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-stockpilot-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 1
  maxClientConn: "1000"
  defaultPoolSize: "20"

monitoring:
  enablePodMonitor: true

affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 0
  maxSyncReplicas: 0
