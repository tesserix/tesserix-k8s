{{- /*
The namespace lock. Dwellm8 holds tenant PAN numbers, owner bank details and a
rent ledger, and until now every pod in the cluster could reach it.

This chart does NOT own the Namespace object. The namespace is created by the
other Dwellm8 Applications with CreateNamespace=true, and giving it an owner
here would mean a prune of this app deletes the namespace and its PVCs — the
ledger's database included.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # No rules: nothing may reach these pods except what the policies below add.
  # NetworkPolicies are additive, so this is the floor rather than an override.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-in-namespace-and-sources
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.allowedSources }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- if .Values.publicIngress.enabled }}
        # Edge traffic. Off until Dwellm8 has a Gateway to be reached through.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.publicIngress.namespace }}
        {{- end }}
        # The CNPG operator probes both Postgres clusters on 8000. Without this
        # the operator reports the clusters unhealthy and starts failing over a
        # primary that was fine.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        # ESO writes the Secret objects the API and Temporal read their
        # credentials from.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
{{- if .Values.hbone.enabled }}
---
{{/*
Ambient HBONE. dwellm8 carries no istio.io/dataplane-mode label today, so this
allows traffic that currently does not exist. It ships anyway because its
absence is invisible: the day somebody labels the namespace ambient, every call
in it starts timing out with no error anywhere, which is exactly how the
2026-04-12 auth outage presented.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone-15008
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
      from:
        - ipBlock:
            cidr: {{ .Values.podCIDR }}
  egress:
    - ports:
        - protocol: TCP
          port: 15008
      to:
        - ipBlock:
            cidr: {{ .Values.podCIDR }}
{{- end }}
