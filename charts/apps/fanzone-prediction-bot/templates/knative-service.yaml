{{- if .Values.knative.enabled }}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "fanzone-prediction-bot.fullname" . }}
  labels:
    {{- include "fanzone-prediction-bot.labels" . | nindent 4 }}
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/disableAutoTLS: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | default "0" | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | default "5" | quote }}
        autoscaling.knative.dev/target: {{ .Values.knative.concurrencyTarget | default "100" | quote }}
        {{- if .Values.knative.scaleDownDelay }}
        autoscaling.knative.dev/scale-down-delay: {{ .Values.knative.scaleDownDelay | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fanzone-prediction-bot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containerConcurrency: {{ .Values.knative.containerConcurrency | default 0 }}
      timeoutSeconds: {{ .Values.knative.timeoutSeconds | default 300 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fanzone-prediction-bot.serviceAccountName" . }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8088 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: PGSSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName | default "postgresql-fanzone-password" }}
                  key: {{ .Values.database.passwordSecretKey | default "password" }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropic.secretName | default "anthropic-api-key" }}
                  key: {{ .Values.anthropic.secretKey | default "api-key" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.secretName | default "fanzone-jwt-secret" }}
                  key: {{ .Values.jwt.secretKey | default "jwt-secret" }}
            - name: MATCH_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sportsApiKey.secretName | default "fanzone-sports-api-key" }}
                  key: {{ .Values.sportsApiKey.secretKey | default "api-key" }}
            # GCP Secret Manager Configuration
            {{- if .Values.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcp.projectId | quote }}
            {{- end }}
            - name: GCP_SECRET_PREFIX
              value: {{ .Values.gcp.secretManager.secretPrefix | quote }}
            - name: USE_GCP_SECRET_MANAGER
              value: "true"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
{{- end }}
