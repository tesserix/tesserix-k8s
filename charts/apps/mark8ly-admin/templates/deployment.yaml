apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- if .Values.openpanel.enabled }}
            # Written into this namespace by the openpanel project-init job;
            # optional so a first deploy doesn't block on the job finishing.
            - name: OPENPANEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openpanel.secretName }}
                  key: {{ .Values.openpanel.clientIdKey }}
                  optional: true
            - name: OPENPANEL_API_URL
              value: {{ .Values.openpanel.apiUrl | quote }}
            # Without this the SDK loads its script from openpanel.dev's CDN.
            - name: OPENPANEL_SCRIPT_URL
              value: {{ .Values.openpanel.scriptUrl | quote }}
            {{- end }}
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            # Forwarded as X-Internal-Auth on every server-side fetch
            # into platform-api/internal/*. lib/api/server/platformInternal.ts
            # trims trailing whitespace before sending so a GSM-stored
            # newline doesn't poison the constant-time compare on the
            # other side. Optional during the rollout window — empty
            # value disables the header (matches platform-api's
            # permissive-empty middleware).
            - name: PLATFORM_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformInternalAuthSecret.secretName }}
                  key: {{ .Values.platformInternalAuthSecret.secretKey }}
                  optional: true
            - name: AUTH_BFF_URL
              value: {{ .Values.authBffUrl | quote }}
            - name: MARKETPLACE_API_URL
              value: {{ .Values.marketplaceApiUrl | quote }}
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplaceInternalAuthSecret.secretName }}
                  key: {{ .Values.marketplaceInternalAuthSecret.secretKey }}
            - name: NEXT_PUBLIC_GIP_PROJECT_ID
              value: {{ .Values.public.gipProjectId | quote }}
            - name: NEXT_PUBLIC_GIP_TENANT_ID
              value: {{ .Values.public.gipTenantId | quote }}
            - name: NEXT_PUBLIC_GIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gip }}
                  key: GIP_WEB_API_KEY
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              value: {{ .Values.public.googleClientId | quote }}
            # Otto support-chat: server-side proxy target + shared secret.
            # The admin /api/admin/otto/* routes forward staff requests to
            # otto with the X-Internal-Auth header. MUST point at the SHARED
            # support-platform-otto (where the storefront widget + slm-router
            # write) — not the legacy mark8ly-otto, or the staff inbox reads
            # a different, empty otto and never sees customer conversations.
            - name: OTTO_URL
              value: "http://support-platform-otto.support-platform.svc.cluster.local:8089"
            - name: OTTO_INTERNAL_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.otto }}
                  key: INTERNAL_AUTH_SECRET
                  optional: true
            # Cross-TLD admin handoff: HMAC-signs the short-lived
            # handoff JWT used to bridge the canonical .mark8ly.com
            # session to a custom admin domain (admin.<merchant-tld>).
            # Same secret as auth-bff, storefront, onboarding —
            # verifying the handoff requires both sides hold the key.
            - name: SESSION_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.session }}
                  key: SESSION_ENCRYPT_KEY
            {{- if .Values.tesserixInternal.enabled }}
            # tesserix-home internal API integration — shared bearer token
            # for filing platform support tickets and reading active
            # announcements. Secret is provisioned by templates/externalsecret.yaml
            # in this chart, sourced from GSM key {{ .Values.tesserixInternal.gsmKey }}.
            - name: TESSERIX_INTERNAL_URL
              value: {{ .Values.tesserixInternal.url | quote }}
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tesserixInternal.secretName }}
                  key: INTERNAL_API_TOKEN
            {{- end }}
          # Probes hit a static API health route, not /. Hitting /
          # forces the auth middleware to redirect unauthenticated probe
          # traffic to /login, which kubelet logs as
          # "Probe terminated redirects" every period.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/admin/.next/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
