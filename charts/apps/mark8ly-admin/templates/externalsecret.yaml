{{- if .Values.tesserixInternal.enabled }}
# Pulls the shared bearer token used to call tesserix-home internal
# endpoints (platform-tickets, platform-announcements) into a K8s
# Secret in the mark8ly namespace. The same GSM key feeds the
# tesserix-home (company chart) ExternalSecret — both must rotate
# together.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tesserixInternal.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.tesserixInternal.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.tesserixInternal.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: {{ .Values.tesserixInternal.gsmKey | quote }}
{{- end }}
