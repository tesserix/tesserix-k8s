namespace: mark8ly
name: mark8ly-admin
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-admin
  tag: "sha-90190298026e" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4202
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger — without it the HPA
    # reports FailedGetResourceMetric and never scales.
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
authBffUrl: "http://mark8ly-auth-bff:8087"
marketplaceApiUrl: "http://mark8ly-marketplace-api-admin:8080"
marketplaceInternalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

# Tesserix-home cross-namespace integration. The merchant admin calls
# tesserix.app /api/internal/platform-tickets to file platform support
# tickets and /api/internal/platform-announcements to render the active
# announcement banner. Both sides hold the same bearer token, sourced
# from a single GSM secret.
tesserixInternal:
  enabled: true
  # Public URL is used to keep the egress path identical in dev/prod and
  # to avoid taking a hard dependency on the tesserix namespace's Istio
  # AuthorizationPolicy. Switch to the in-cluster URL
  # ("http://company.tesserix.svc.cluster.local") only after adding
  # `mark8ly` to the company AuthorizationPolicy allowed sources.
  url: "https://tesserix.app"
  secretName: tesserix-internal-api-token
  secretStoreRef: gcp-secret-store
  gsmKey: prod-tesserix-internal-api-token
public:
  gipProjectId: "tesseracthub-480811"
  gipTenantId: "MP-Internal-e986p"
  googleClientId: "849928263410-5djgu3n40c5tpr86votuptkitqveegor.apps.googleusercontent.com" # public OAuth client id — same client used by mark8ly.com trampoline + admin
