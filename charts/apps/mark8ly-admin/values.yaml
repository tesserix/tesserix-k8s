namespace: mark8ly
name: mark8ly-admin
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-admin
  tag: "sha-493c3652c68d" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4202
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger — without it the HPA
    # reports FailedGetResourceMetric and never scales.
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
authBffUrl: "http://mark8ly-auth-bff:8087"
marketplaceApiUrl: "http://mark8ly-marketplace-api-admin:8080"
marketplaceInternalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Shared secret forwarded as X-Internal-Auth on every server-side fetch
# from this app into platform-api/internal/*. Same value the
# mark8ly-platform-api deployment mounts as INTERNAL_AUTH_SECRET — the
# constant-time compare on platform-api's RequireInternalAuth middleware
# only passes when both sides hold the same secret.
platformInternalAuthSecret:
  secretName: mark8ly-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Tesserix-home cross-namespace integration. The merchant admin calls
# tesserix.app /api/internal/platform-tickets to file platform support
# tickets and /api/internal/platform-announcements to render the active
# announcement banner. Both sides hold the same bearer token, sourced
# from a single GSM secret.
tesserixInternal:
  enabled: true
  # Public URL is used to keep the egress path identical in dev/prod and
  # to avoid taking a hard dependency on the tesserix namespace's Istio
  # AuthorizationPolicy. Switch to the in-cluster URL
  # ("http://company.tesserix.svc.cluster.local") only after adding
  # `mark8ly` to the company AuthorizationPolicy allowed sources.
  url: "https://tesserix.app"
  secretName: tesserix-internal-api-token
  secretStoreRef: gcp-secret-store
  gsmKey: prod-tesserix-internal-api-token
public:
  gipProjectId: "tesseracthub-480811"
  gipTenantId: "MP-Internal-e986p"
  googleClientId: "849928263410-5djgu3n40c5tpr86votuptkitqveegor.apps.googleusercontent.com" # public OAuth client id — same client used by mark8ly.com trampoline + admin

# Secret resource names — overridden in values-uat.yaml so the UAT
# overlay can swap to `mark8ly-uat-*` Secrets without retemplating.
secrets:
  gip: mark8ly-gip
  otto: mark8ly-otto
  session: mark8ly-session

# Page-view analytics via the self-hosted OpenPanel at analytics.tesserix.app.
# The client ID is a public write key, so it lives in a Secret only because the
# project-init job is what mints it — nothing here is confidential.
openpanel:
  enabled: true
  secretName: openpanel-client-ids
  clientIdKey: admin-client-id
  apiUrl: https://analytics.tesserix.app/api
  scriptUrl: https://analytics.tesserix.app/op1.js

# Replace before surging, so a rollout frees a pod's memory before it
# needs the replacement's (#709).
#
# The default is 25%/25%, which on a single-replica Deployment rounds to
# maxSurge=1, maxUnavailable=0: the new pod must SCHEDULE BEFORE the old
# one dies, so a roll needs double the pod's memory at once. On a cluster
# whose memory requests sit near 100% (while actual usage is around half
# that) the new pod pends forever and the rollout deadlocks — with the
# Deployment still reporting Available=True, because the old pod keeps
# serving. On 2026-08-30 that left seven mark8ly deployments stuck and
# production a day behind main, with nothing alerting.
#
# The cost is honest and accepted: on a single-replica service this is a
# brief 503 during each rollout, where surge-first gave none. Deploys that
# always complete are worth more than a few seconds of downtime on an
# operator-timed rollout. Same remedy as temporal (#538) and devai (#600).
#
# At 2+ replicas there is no downtime at all: one pod stays up while the
# other is replaced.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# The tesserix-home platform API, which serves this app's platform SUPPORT
# TICKETS (tesserix-home#152). Announcements still come from apps/web's
# internal channel above, and will until an announcements module exists.
#
# Set HERE rather than in a values-prod.yaml because this chart has none — its
# ArgoCD Application loads values.yaml alone. Mirrors consoleCatalog in
# mark8ly-marketplace-api-admin, which is configured the same way.
# NAMED tesserixPlatformApi, not platformApi, because `platformApiUrl` above
# is mark8ly's OWN platform-api and the two are different services. The near
# miss is real: a Helm path of `.Values.platformApi` is a PREFIX of
# `.Values.platformApiUrl`, so a careless edit touches both.
tesserixPlatformApi:
  # The in-cluster Service in the tesserix namespace. NOT tesserix.app: the
  # platform API has no public path and no VirtualService, and the public
  # ingress would reject the Bearer token anyway (its RequestAuthentication
  # policy is what forced the X-Internal-Token workaround on the old channel).
  url: http://platform-api.tesserix.svc.cluster.local
  issuer: https://auth.tesserix.app
  # The Platform Console project — both the audience the token must carry and
  # the project whose roles it asserts.
  projectId: "386377618200461939"
  # THE SAME identity marketplace-api-admin uses for the plan and promo
  # catalogs. mark8ly-catalog-reader now also holds product-support, so one
  # machine user serves both — which means rotating this secret rotates two
  # consumers, and both must be redeployed.
  secretName: mark8ly-console-catalog
  clientIdKey: CONSOLE_CATALOG_CLIENT_ID
  clientSecretKey: CONSOLE_CATALOG_CLIENT_SECRET
