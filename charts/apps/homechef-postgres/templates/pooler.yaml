{{- if and .Values.pooler.enabled (not .Values.hibernate) }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusterName }}-pooler-rw
  namespace: {{ .Values.namespace }}
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: rw
  template:
    metadata:
      annotations:
        # The homechef namespace runs Istio ambient (istio.io/dataplane-mode:
        # ambient, injection disabled), so ztunnel captures inbound 5432 and
        # kubelet's TCP readiness probe is refused:
        #   Readiness probe failed: dial tcp <pod-ip>:5432: connect: connection refused
        # which also cut pgbouncer's own watch of the Pooler API off
        # ("Error calling Watch ... dial tcp 10.30.0.1:443: connection refused").
        # The Cluster already excludes 5432 via inheritedMetadata, but that does
        # not propagate to Pooler pods — they need their own annotation.
        # Both forms are set to match the other datastore charts; the sidecar one
        # is inert under ambient but harmless if the namespace ever flips back.
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
        traffic.istio.io/excludeInboundPorts: "5432"
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
      min_pool_size: "0"
      reserve_pool_size: "5"
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_lifetime: "3600"
      query_wait_timeout: "60"
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusterName }}-pooler-ro
  namespace: {{ .Values.namespace }}
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: ro
  template:
    metadata:
      annotations:
        # The homechef namespace runs Istio ambient (istio.io/dataplane-mode:
        # ambient, injection disabled), so ztunnel captures inbound 5432 and
        # kubelet's TCP readiness probe is refused:
        #   Readiness probe failed: dial tcp <pod-ip>:5432: connect: connection refused
        # which also cut pgbouncer's own watch of the Pooler API off
        # ("Error calling Watch ... dial tcp 10.30.0.1:443: connection refused").
        # The Cluster already excludes 5432 via inheritedMetadata, but that does
        # not propagate to Pooler pods — they need their own annotation.
        # Both forms are set to match the other datastore charts; the sidecar one
        # is inert under ambient but harmless if the namespace ever flips back.
        traffic.sidecar.istio.io/excludeInboundPorts: "5432"
        traffic.istio.io/excludeInboundPorts: "5432"
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
      min_pool_size: "0"
      reserve_pool_size: "5"
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_lifetime: "3600"
      query_wait_timeout: "60"
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
{{- end }}
