{{- /* CNPG requires a basic-auth secret with 'username' and 'password' keys */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.bootstrap.secret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.bootstrap.secret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.bootstrap.owner | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-homechef-postgresql-password
        version: latest
