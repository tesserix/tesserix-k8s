hibernate: false

namespace: homechef
clusterName: homechef-postgres

# 3 instances: 1 primary + 2 sync replicas for production HA.
# Automatic failover is handled by the CNPG operator.
instances: 3
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Storage — separate WAL volume for I/O isolation
# WAL volume is sized 3× max_slot_wal_keep_size so a stuck replication slot
# can never fill the volume and trip CNPG's low-disk-space preflight.
storageSize: 100Gi
storageClass: standard-rwo-retain
walStorageSize: 30Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

# Bootstrap — primary database for the HomeChef Go API
bootstrap:
  database: homechef_db
  owner: homechef
  # Secret must contain 'username' and 'password' keys (CNPG basic-auth format).
  # Created by ExternalSecret from GCP Secret Manager.
  secret: homechef-postgres-app-credentials
  gcpSecretName: prod-homechef-postgresql-password
  # Post-init SQL runs once after the cluster is created (idempotent).
  # Keycloak previously used its own PG (now in postgresql-global); if you
  # need additional databases, add CREATE DATABASE statements here.
  postInitSQL: []

# PostgreSQL tuning
postgresql:
  max_connections: "300"
  shared_buffers: "512MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots.
  # Kept comfortably below walStorageSize (30Gi) so a single stuck slot
  # cannot exhaust the WAL volume.
  max_slot_wal_keep_size: "8GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/homechef-postgres"
  # 30-day recovery window. CNPG/Barman is the chain-aware pruner (deletes whole
  # base backups + their WAL together so PITR never breaks).
  #
  # The bucket's lifecycle Delete rule MUST stay strictly longer than this (it
  # is set to 37d) — if GCS removed an object the Barman catalogue still
  # referenced, PITR would fail at restore time with no prior warning. Barman
  # prunes first; the bucket rule is only a backstop for orphans.
  # See docs/cnpg-backup-restore.md.
  retentionPolicy: "30d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling — the API's only route to Postgres.
# Server-connection ceiling is instances × defaultPoolSize per pool, so rw and
# ro together can reach 200 of max_connections (300), leaving headroom for
# replication, CNPG itself and the admin app's direct connections.
pooler:
  enabled: true
  instances: 2
  maxClientConn: "1000"
  defaultPoolSize: "50"

# Monitoring — CNPG built-in Prometheus exporter on port 9187
monitoring:
  enablePodMonitor: true

# Self-healing — automatically rebuild a wedged replica with no human action.
# A CronJob detects a NON-primary instance that has been stuck (CrashLoopBackOff
# or not-Ready) beyond stuckMinutes while the primary is healthy, then destroys
# it (pod + its data/WAL PVCs) so the operator re-bootstraps a fresh replica
# from the primary. This is the automated form of `kubectl cnpg destroy` and
# recovers from the "Not enough disk space" / lost-replication-slot deadlock
# (see docs/incident-homechef-postgres-disk-full.md) without intervention.
# The primary is NEVER touched, and it only acts when a healthy rebuild source
# exists — so it can never cause data loss.
autoheal:
  enabled: true
  schedule: "*/10 * * * *"
  # A replica must be continuously not-Ready for this long before it is rebuilt.
  # Comfortably longer than a normal rolling restart so upgrades aren't disrupted.
  stuckMinutes: 15
  image: bitnamilegacy/kubectl:1.31.0

# Replication
affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 1
  maxSyncReplicas: 1
