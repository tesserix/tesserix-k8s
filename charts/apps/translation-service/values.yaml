# Default values for translation-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/global-services/translation-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  # Istio sidecar injection
  sidecar.istio.io/inject: "true"
  # Istio sidecar configuration - wait for proxy before starting app
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  # Workload Identity is always enabled
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# KEDA ScaledObject configuration
keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  # Prometheus trigger for traffic-based scaling (Istio metrics)
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    # Scale based on requests per second to this service
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="translation-service",reporter="destination"}[2m]))
    requestRateThreshold: "100"  # Scale up when RPS > 100 per pod
  # Fallback CPU/Memory triggers
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  # Server config
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"

  # App config
  APP_NAME: "translation-service"
  APP_ENV: "production"
  LOG_LEVEL: "info"

  # Database (DB_HOST set via database.host to avoid duplicates)

  # Redis for caching
  REDIS_HOST: "redis.redis-marketplace.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # LibreTranslate service (primary provider) - in translation namespace
  LIBRETRANSLATE_URL: "http://libretranslate.translation.svc.cluster.local:5000"

  # Bergamot service (first fallback - Mozilla's fast translation) - in translation namespace
  BERGAMOT_URL: "http://bergamot-service.translation.svc.cluster.local:8080"

  # Hugging Face MT service (second fallback - Helsinki-NLP models, self-hosted) - in translation namespace
  HUGGINGFACE_URL: "http://huggingface-mt-service.translation.svc.cluster.local:8080"

  # Translation config
  CACHE_ENABLED: "true"
  # Set cache TTL to 10 years (87600h) for permanent database storage
  # Database cache stores translations permanently for cost reduction
  CACHE_TTL: "87600h"
  # Redis TTL for fast access (Redis is ephemeral, database is persistent)
  REDIS_CACHE_TTL: "168h"
  RATE_LIMIT: "100"
  RATE_LIMIT_WINDOW: "1m"
  MAX_BATCH_SIZE: "50"
  BATCH_TIMEOUT: "30s"
  DEFAULT_SOURCE_LANG: "en"
  DEFAULT_TARGET_LANG: "hi"

# Redis password (secret must exist in deployment namespace)
redis:
  enabled: true
  existingSecret: "redis-password"
  existingSecretKey: "redis-password"

# Hugging Face MT (third fallback - self-hosted Helsinki-NLP models)
# Uses self-hosted huggingface-mt-service for translation
# Priority 3: After LibreTranslate and Bergamot, before Google
# Note: For self-hosted mode, no API key is required
huggingFace:
  enabled: true  # Self-hosted, no API key needed
  existingSecret: ""
  existingSecretKey: ""

# Google Translate API (final fallback - paid, most language support)
# Supports: Marathi (mr), Tamil (ta), Telugu (te), Gujarati (gu), Kannada (kn), etc.
# Priority 4: Last resort to minimize costs
googleTranslate:
  enabled: true
  existingSecret: "google-translate-api-key"
  existingSecretKey: "GOOGLE_TRANSLATE_API_KEY"

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration - centralized for easy modification
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "translation_db"
  user: "postgres"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
