# Which product's schemas to deploy (marketplace, hms, fanzone, etc.)
app: marketplace

# CronJob configuration
schedule: "*/30 * * * *"

# Whether to replay the .sql snapshots over databases that ALREADY exist.
#
# Default false, deliberately. The snapshots are frozen pg_dumps; the running
# applications also manage these schemas (GORM AutoMigrate + post-migration DDL).
# Replaying a snapshot over a live database resurrects objects the application
# has deliberately dropped — this job provisions, the application evolves.
#
# Set true ONLY for a one-off repair of a database known to have drifted, and
# expect it to fight the application until you set it back.
applySchemaToExistingDatabases: false
concurrencyPolicy: Forbid
ttlSecondsAfterFinished: 600
backoffLimit: 3
activeDeadlineSeconds: 300

# PostgreSQL targets — each maps to a StatefulSet in a namespace.
# A target may set `reapplyExistingSchemas` to database names whose SQL files
# are explicitly idempotent and remain the upgrade source of truth. This is a
# narrow alternative to replaying every snapshot with the global
# `applySchemaToExistingDatabases` switch.
targets:
  - name: global
    host: global-postgres-rw.global.svc.cluster.local
    port: 5432
    user: global
    secretName: global-postgres-app-credentials
    secretKey: password
  - name: marketplace
    host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
    port: 5432
    user: mark8ly
    secretName: mark8ly-postgres-app-credentials
    secretKey: password

# GCP Secret Manager (alternative to K8s secrets)
gcp:
  enabled: false
  project: ""
  secrets: {}
  #  global: "projects/PROJECT/secrets/postgresql-global-password/versions/latest"
  #  marketplace: "projects/PROJECT/secrets/postgresql-marketplace-password/versions/latest"

# Images
image:
  postgres: postgres:16-alpine
  gcloud: google/cloud-sdk:alpine
  # The server image, not a separate client image — it ships clickhouse-client
  # and is already pulled onto the observability nodes, so no extra image layer.
  clickhouse: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/clickhouse/clickhouse-server:25.10.2.65

# Service account for GCP Workload Identity
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Namespace override
namespaceOverride: ""

# ClickHouse bootstrap — a separate code path from the PostgreSQL `targets`
# above, because ClickHouse needs a different client and connection flags.
#
# Disabled by default: every existing per-product release renders exactly as it
# did before. Only the observability release turns this on.
#
# Schemas are read from schemas/<app>/clickhouse/*.sql, the same
# schemas/<project>/<database>/ layout the PostgreSQL targets use.
clickhouse:
  enabled: false
  # Third-party image on a pinned tag: cache it on the node. This CronJob runs
  # every 30 minutes, so Always would re-pull a ~500MB image 48 times a day per
  # node for no benefit.
  imagePullPolicy: IfNotPresent
  # Falls back to the shared `schedule` when unset.
  schedule: ""
  host: clickhouse.observability.svc.cluster.local
  port: 9000
  user: default
  secretName: clickhouse-secrets
  secretKey: clickhouse-password
  # Substituted into __OBSERVER_PASSWORD__ in the SQL. Leave empty if the
  # schemas do not create a read-only user.
  observerSecretKey: observer-password
  # Incident-writer identity for the sre database. Separate from
  # observer, which is readonly and therefore cannot INSERT.
  sreWriterSecretKey: sre-writer-password
  # The bootstrap job must be able to reach ClickHouse, which lives on the
  # tainted Spot observability pool.
  nodeSelector: {}
  tolerations: []
