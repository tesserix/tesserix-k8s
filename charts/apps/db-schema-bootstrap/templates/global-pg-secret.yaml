{{- if eq .Values.app "global" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-password
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-global-postgres-production
    kind: SecretStore
  target:
    name: postgresql-password
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: global-postgres/app/global-postgres-password
        property: value
{{- end }}
