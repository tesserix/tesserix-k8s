{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "bookkeeping-web.fullname" . }}
  labels:
    {{- include "bookkeeping-web.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bookkeeping-web.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | default "InPlaceOrRecreate" | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Chart.Name }}
        {{- if eq .Values.vpa.updateMode "Off" }}
        mode: "Off"
        {{- else }}
        mode: "Auto"
        {{- end }}
        minAllowed:
          memory: {{ .Values.vpa.minAllowed.memory | default "64Mi" | quote }}
        maxAllowed:
          memory: {{ .Values.vpa.maxAllowed.memory | default "2Gi" | quote }}
        controlledResources: ["cpu", "memory"]
        {{- if .Values.vpa.controlledValues }}
        controlledValues: {{ .Values.vpa.controlledValues | quote }}
        {{- end }}
      {{- if .Values.vpa.excludeIstioProxy }}
      # Exclude istio-proxy from VPA management
      - containerName: istio-proxy
        mode: "Off"
      {{- end }}
{{- end }}
