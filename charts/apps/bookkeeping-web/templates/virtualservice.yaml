{{- if .Values.ingress.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "bookkeeping-web.fullname" . }}
  labels:
    {{- include "bookkeeping-web.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  gateways:
    - {{ .Values.ingress.gateway | default "istio-ingress/tesseract-gateway" }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "bookkeeping-web.fullname" . }}
            port:
              number: {{ .Values.service.port }}
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
{{- end }}
