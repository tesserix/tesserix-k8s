# Default values for bookkeeping-web
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/bookkeeping-app/web
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  # Exclude GCP metadata server from Istio for Workload Identity
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15

# Vertical Pod Autoscaler
vpa:
  # Workload Identity is always enabled
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  controlledValues: "RequestsAndLimits"
  excludeIstioProxy: true

# KEDA - Event-driven autoscaling
keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 15
  idleReplicaCount: 0
  restoreToOriginalReplicaCount: false
  fallback:
    failureThreshold: 3
    replicas: 2
  scaleDown:
    stabilizationWindowSeconds: 300
    percentValue: 50
    periodSeconds: 60
  scaleUp:
    stabilizationWindowSeconds: 0
    percentValue: 100
    podsValue: 4
    periodSeconds: 15
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="bookkeeping-web",reporter="destination"}[2m]))
    requestRateThreshold: "200"
    latencyEnabled: false
    latencyQuery: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{destination_canonical_service="bookkeeping-web",reporter="destination"}[2m])) by (le))
    latencyThreshold: "500"
  cpu:
    enabled: true
    threshold: "75"
  memory:
    enabled: true
    threshold: "80"
  triggers: []

# PodDisruptionBudget
pdb:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: IfHealthyBudget

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration - Public (exposed to browser)
env:
  # Node environment
  NODE_ENV: "production"
  PORT: "3000"

  # Public environment variables (available in browser)
  NEXT_PUBLIC_APP_NAME: "Bookkeeping"
  NEXT_PUBLIC_APP_URL: "https://bookkeeping.example.com"
  NEXT_PUBLIC_API_URL: "/api"

# Server-side environment configuration (BFF - internal service URLs)
serverEnv:
  # Internal Kubernetes service URLs (private, only accessible from within cluster)
  AUTH_SERVICE_URL: "http://bka-auth-service-bookkeeping-auth-service.marketplace.svc.cluster.local:8080"
  CORE_SERVICE_URL: "http://bka-core-service-bookkeeping-core-service.marketplace.svc.cluster.local:8080"
  INVOICE_SERVICE_URL: "http://bka-invoice-service-bookkeeping-invoice-service.marketplace.svc.cluster.local:8080"
  CUSTOMER_SERVICE_URL: "http://bka-customer-service-bookkeeping-customer-service.marketplace.svc.cluster.local:8080"
  TAX_SERVICE_URL: "http://bka-tax-service-bookkeeping-tax-service.marketplace.svc.cluster.local:8080"
  REPORT_SERVICE_URL: "http://bka-report-service-bookkeeping-report-service.marketplace.svc.cluster.local:8080"

  # Redis for session management
  REDIS_HOST: "redis.redis-marketplace.svc.cluster.local"
  REDIS_PORT: "6379"

# Redis password (for server-side session management)
redis:
  enabled: true
  existingSecret: "redis-password"
  existingSecretKey: "redis-password"

# Ingress configuration (for public access)
ingress:
  enabled: true
  className: "istio"
  gateway: "istio-ingress/tesseract-gateway"
  annotations: {}
  hosts:
    - host: dev-bookkeeping.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bookkeeping-tls
      hosts:
        - dev-bookkeeping.tesserix.app

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "bookkeeping"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
