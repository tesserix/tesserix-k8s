# =============================================================================
# Petstore API - Production Overrides
# High-availability configuration for production environment
# =============================================================================

replicaCount: 3

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/test-repo/petstore-api
  tag: "latest"

# Production resource limits
resources:
  limits:
    memory: 2Gi
    cpu: 1000m
  requests:
    memory: 1Gi
    cpu: 500m

# Higher scaling for production
autoscaling:
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# KEDA production scaling
keda:
  minReplicaCount: 3
  maxReplicaCount: 20
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"

# Production hosts
virtualService:
  hosts:
    - "api.petstore.tesserix.app"

# Production environment variables
env:
  LOG_LEVEL: "info"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "3600"
  CORS_ORIGINS: "https://petstore.tesserix.app,https://admin.petstore.tesserix.app"

# Production VPA settings
vpa:
  updateMode: "Auto"
  minAllowed:
    memory: "512Mi"
    cpu: "250m"
  maxAllowed:
    memory: "4Gi"
    cpu: "2000m"

# Production monitoring
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/metrics"
  
# GCP production settings
gcp:
  secretManager:
    secretPrefix: "prod"