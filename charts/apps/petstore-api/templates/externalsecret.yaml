{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "petstore-api.fullname" . }}
  labels:
    {{- include "petstore-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: {{ include "petstore-api.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Database credentials
        {{- if .Values.database.enabled }}
        DB_USERNAME: "{{ `{{ .DB_USERNAME }}` }}"
        DB_SECRET: "{{ `{{ .DB_SECRET }}` }}"
        DATABASE_URL: "postgresql://{{ `{{ .DB_USERNAME }}` }}:{{ `{{ .DB_SECRET }}` }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}{{ if .Values.database.ssl }}?sslmode=require{{ end }}"
        {{- end }}
        
        # Redis credentials
        {{- if and .Values.redis.enabled .Values.redis.auth }}
        REDIS_SECRET: "{{ `{{ .REDIS_SECRET }}` }}"
        REDIS_URL: "redis{{ if .Values.redis.tls }}s{{ end }}://:{{ `{{ .REDIS_SECRET }}` }}@{{ .Values.redis.host }}:{{ .Values.redis.port }}/{{ .Values.redis.db }}"
        {{- else if .Values.redis.enabled }}
        REDIS_URL: "redis{{ if .Values.redis.tls }}s{{ end }}://{{ .Values.redis.host }}:{{ .Values.redis.port }}/{{ .Values.redis.db }}"
        {{- end }}
        
        # JWT signing secret
        JWT_SECRET: "{{ `{{ .JWT_SECRET }}` }}"
        
        # Session secret
        SESSION_SECRET: "{{ `{{ .SESSION_SECRET }}` }}"
        
        # Stripe API keys
        STRIPE_SECRET_KEY: "{{ `{{ .STRIPE_SECRET_KEY }}` }}"
        STRIPE_PUBLISHABLE_KEY: "{{ `{{ .STRIPE_PUBLISHABLE_KEY }}` }}"
        STRIPE_WEBHOOK_SECRET: "{{ `{{ .STRIPE_WEBHOOK_SECRET }}` }}"
        
        # SMTP credentials
        {{- if .Values.smtp.enabled }}
        SMTP_USER: "{{ `{{ .SMTP_USER }}` }}"
        SMTP_SECRET: "{{ `{{ .SMTP_SECRET }}` }}"
        {{- end }}
        
        # Email service API key
        {{- if .Values.app.emailServiceUrl }}
        EMAIL_SERVICE_API_KEY: "{{ `{{ .EMAIL_SERVICE_API_KEY }}` }}"
        {{- end }}
        
        # Additional secrets
        {{- range $key := .Values.externalSecrets.additionalSecrets }}
        {{ $key }}: "{{ `{{ .` }}{{ $key }}{{ ` }}` }}"
        {{- end }}
  data:
    # Database credentials
    {{- if .Values.database.enabled }}
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/database
        property: username
    - secretKey: DB_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/database
        property: secret
    {{- end }}
    
    # Redis credentials
    {{- if and .Values.redis.enabled .Values.redis.auth }}
    - secretKey: REDIS_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/redis
        property: secret
    {{- end }}
    
    # JWT signing secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/jwt
        property: secret
    
    # Session secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/session
        property: secret
    
    # Stripe API keys
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/stripe
        property: secret_key
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/stripe
        property: publishable_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/stripe
        property: webhook_secret
    
    # SMTP credentials
    {{- if .Values.smtp.enabled }}
    - secretKey: SMTP_USER
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/smtp
        property: username
    - secretKey: SMTP_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/smtp
        property: secret
    {{- end }}
    
    # Email service API key
    {{- if .Values.app.emailServiceUrl }}
    - secretKey: EMAIL_SERVICE_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.secretPrefix }}/email-service
        property: api_key
    {{- end }}
    
    # Additional secrets
    {{- range $secret := .Values.externalSecrets.additionalSecretRefs }}
    - secretKey: {{ $secret.key }}
      remoteRef:
        key: {{ $.Values.externalSecrets.secretPrefix }}/{{ $secret.remoteKey }}
        property: {{ $secret.property }}
    {{- end }}
{{- end }}