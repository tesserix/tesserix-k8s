{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "petstore-api.fullname" . }}
  labels:
    {{- include "petstore-api.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.virtualService.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    {{- range .Values.virtualService.gateways }}
    - {{ . | quote }}
    {{- end }}
  http:
    {{- range .Values.virtualService.http }}
    - match:
        {{- range .match }}
        - uri:
            {{- if .uri.prefix }}
            prefix: {{ .uri.prefix | quote }}
            {{- end }}
            {{- if .uri.exact }}
            exact: {{ .uri.exact | quote }}
            {{- end }}
            {{- if .uri.regex }}
            regex: {{ .uri.regex | quote }}
            {{- end }}
        {{- end }}
      route:
        {{- range .route }}
        - destination:
            host: {{ .destination.host | quote }}
            port:
              number: {{ .destination.port.number }}
        {{- end }}
      {{- if .timeout }}
      timeout: {{ .timeout }}
      {{- end }}
      {{- if .retries }}
      retries:
        {{- toYaml .retries | nindent 8 }}
      {{- end }}
      {{- if .corsPolicy }}
      corsPolicy:
        {{- if .corsPolicy.allowOrigins }}
        allowOrigins:
          {{- range .corsPolicy.allowOrigins }}
          {{- if .exact }}
          - exact: {{ .exact | quote }}
          {{- end }}
          {{- if .prefix }}
          - prefix: {{ .prefix | quote }}
          {{- end }}
          {{- if .regex }}
          - regex: {{ .regex | quote }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if .corsPolicy.allowMethods }}
        allowMethods:
          {{- range .corsPolicy.allowMethods }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if .corsPolicy.allowHeaders }}
        allowHeaders:
          {{- range .corsPolicy.allowHeaders }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if .corsPolicy.allowCredentials }}
        allowCredentials: {{ .corsPolicy.allowCredentials }}
        {{- end }}
        {{- if .corsPolicy.maxAge }}
        maxAge: {{ .corsPolicy.maxAge }}
        {{- end }}
      {{- end }}
      {{- if .headers }}
      headers:
        {{- if .headers.response }}
        response:
          {{- if .headers.response.add }}
          add:
            {{- range $key, $value := .headers.response.add }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}