{{- if .Values.verticalPodAutoscaler.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "petstore-api.fullname" . }}
  labels:
    {{- include "petstore-api.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "petstore-api.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.verticalPodAutoscaler.updateMode }}
    {{- if eq .Values.verticalPodAutoscaler.updateMode "Auto" }}
    minReplicas: {{ .Values.verticalPodAutoscaler.minReplicas }}
    {{- end }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Chart.Name }}
        {{- if .Values.verticalPodAutoscaler.controlledResources }}
        controlledResources:
          {{- range .Values.verticalPodAutoscaler.controlledResources }}
          - {{ . }}
          {{- end }}
        {{- end }}
        {{- if .Values.verticalPodAutoscaler.controlledValues }}
        controlledValues: {{ .Values.verticalPodAutoscaler.controlledValues }}
        {{- end }}
        minAllowed:
          {{- if .Values.verticalPodAutoscaler.minAllowed.cpu }}
          cpu: {{ .Values.verticalPodAutoscaler.minAllowed.cpu }}
          {{- end }}
          {{- if .Values.verticalPodAutoscaler.minAllowed.memory }}
          memory: {{ .Values.verticalPodAutoscaler.minAllowed.memory }}
          {{- end }}
        maxAllowed:
          {{- if .Values.verticalPodAutoscaler.maxAllowed.cpu }}
          cpu: {{ .Values.verticalPodAutoscaler.maxAllowed.cpu }}
          {{- end }}
          {{- if .Values.verticalPodAutoscaler.maxAllowed.memory }}
          memory: {{ .Values.verticalPodAutoscaler.maxAllowed.memory }}
          {{- end }}
        mode: {{ .Values.verticalPodAutoscaler.containerPolicy.mode }}
{{- end }}