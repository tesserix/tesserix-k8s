apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "petstore-api.fullname" . }}-config
  labels:
    {{- include "petstore-api.labels" . | nindent 4 }}
data:
  # Application Configuration
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  API_VERSION: {{ .Values.env.API_VERSION | quote }}
  
  # Database Configuration
  POSTGRES_HOST: {{ .Values.env.POSTGRES_HOST | quote }}
  POSTGRES_PORT: {{ .Values.env.POSTGRES_PORT | quote }}
  POSTGRES_DB: {{ .Values.env.POSTGRES_DB | quote }}
  POSTGRES_SSL: {{ .Values.env.POSTGRES_SSL | quote }}
  
  # Redis Configuration  
  REDIS_HOST: {{ .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
  REDIS_DB: {{ .Values.env.REDIS_DB | quote }}
  REDIS_TTL: {{ .Values.env.REDIS_TTL | quote }}
  
  # API Configuration
  API_RATE_LIMIT: {{ .Values.env.API_RATE_LIMIT | quote }}
  API_TIMEOUT: {{ .Values.env.API_TIMEOUT | quote }}
  JWT_EXPIRES_IN: {{ .Values.env.JWT_EXPIRES_IN | quote }}
  
  # Logging Configuration
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  LOG_FORMAT: {{ .Values.env.LOG_FORMAT | quote }}
  
  # CORS Configuration
  CORS_ORIGIN: {{ .Values.env.CORS_ORIGIN | quote }}
  CORS_CREDENTIALS: {{ .Values.env.CORS_CREDENTIALS | quote }}
  
  # File Upload Configuration
  UPLOAD_MAX_SIZE: {{ .Values.env.UPLOAD_MAX_SIZE | quote }}
  UPLOAD_ALLOWED_TYPES: {{ .Values.env.UPLOAD_ALLOWED_TYPES | quote }}
  
  # Payment Configuration (Non-sensitive)
  STRIPE_API_VERSION: {{ .Values.env.STRIPE_API_VERSION | quote }}
  
  # Email Configuration (Non-sensitive)
  SMTP_HOST: {{ .Values.env.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.env.SMTP_PORT | quote }}
  SMTP_SECURE: {{ .Values.env.SMTP_SECURE | quote }}
  EMAIL_FROM_NAME: {{ .Values.env.EMAIL_FROM_NAME | quote }}
  EMAIL_FROM_ADDRESS: {{ .Values.env.EMAIL_FROM_ADDRESS | quote }}
  
  # Feature Flags
  FEATURE_WISHLIST_ENABLED: {{ .Values.env.FEATURE_WISHLIST_ENABLED | quote }}
  FEATURE_REVIEWS_ENABLED: {{ .Values.env.FEATURE_REVIEWS_ENABLED | quote }}
  FEATURE_INVENTORY_TRACKING: {{ .Values.env.FEATURE_INVENTORY_TRACKING | quote }}
  FEATURE_ANALYTICS_ENABLED: {{ .Values.env.FEATURE_ANALYTICS_ENABLED | quote }}
  FEATURE_RECOMMENDATIONS_ENABLED: {{ .Values.env.FEATURE_RECOMMENDATIONS_ENABLED | quote }}
  
  # Search Configuration
  SEARCH_INDEX_NAME: {{ .Values.env.SEARCH_INDEX_NAME | quote }}
  SEARCH_RESULTS_LIMIT: {{ .Values.env.SEARCH_RESULTS_LIMIT | quote }}
  
  # Cache Configuration
  CACHE_DEFAULT_TTL: {{ .Values.env.CACHE_DEFAULT_TTL | quote }}
  CACHE_USER_SESSION_TTL: {{ .Values.env.CACHE_USER_SESSION_TTL | quote }}
  CACHE_PRODUCT_TTL: {{ .Values.env.CACHE_PRODUCT_TTL | quote }}