# =============================================================================
# Petstore API - Next.js API Backend
# Production-ready Helm values for e-commerce API service
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/test-repo/petstore-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: 
    iam.gke.io/gcp-service-account: petstore-api@tesseracthub-480811.iam.gserviceaccount.com
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/health"
  
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false

# Istio VirtualService configuration
virtualService:
  enabled: true
  gateway: "istio-ingress/tesseract-gateway"
  hosts:
    - "petstore.tesserix.app"
  apiPrefix: "/api"

resources:
  limits:
    memory: 1Gi
    cpu: 500m
  requests:
    memory: 512Mi
    cpu: 250m

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

nodeSelector: {}
tolerations: []

# Pod anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - petstore-api
          topologyKey: kubernetes.io/hostname

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Graceful shutdown
terminationGracePeriodSeconds: 30

# Environment configuration
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  
  # Database configuration
  POSTGRES_HOST: "petstore-postgres.petstore.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "petstore"
  POSTGRES_USER: "petstore"
  
  # Redis configuration
  REDIS_HOST: "redis-petstore.petstore.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # Application settings
  API_BASE_URL: "https://petstore.tesserix.app/api"
  CORS_ORIGINS: "https://petstore.tesserix.app,https://admin.petstore.tesserix.app"

# Secret-backed env vars
envFromSecrets:
  - name: POSTGRES_PASSWORD
    secret: petstore-postgres
    key: postgres-password
  - name: JWT_SECRET
    secret: petstore-api-secrets
    key: jwt-secret
  - name: STRIPE_SECRET_KEY
    secret: petstore-api-secrets
    key: stripe-secret-key
    optional: true

# PostgreSQL dependency
postgresql:
  enabled: true
  existingSecret: "petstore-postgres"
  existingSecretKey: "postgres-password"

# Redis for caching and sessions
redis:
  enabled: true
  existingSecret: "petstore-redis"
  existingSecretKey: "redis-password"

# ConfigMap for additional configuration
configMap:
  data:
    FEATURE_INVENTORY_TRACKING: "true"
    FEATURE_REVIEWS: "true"
    FEATURE_WISHLIST: "true"
    MAX_UPLOAD_SIZE: "10485760"  # 10MB
    CACHE_TTL: "300"             # 5 minutes

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "Auto"
  minAllowed:
    memory: "128Mi"
    cpu: "100m"
  maxAllowed:
    memory: "2Gi"
    cpu: "1000m"
  excludeIstioProxy: true

# External Secrets configuration
externalSecrets:
  enabled: true
  secretStore:
    name: "gcpsm-secret-store"
    kind: "SecretStore"
  secrets:
    - name: "petstore-api-secrets"
      refreshInterval: "1h"
      data:
        - secretKey: "jwt-secret"
          remoteRef:
            key: "petstore-jwt-secret"
        - secretKey: "stripe-secret-key"
          remoteRef:
            key: "petstore-stripe-secret"
            
# GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  namespace: "petstore"
  workloadIdentity:
    gcpServiceAccount: "petstore-api@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"