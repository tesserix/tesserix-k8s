# Default values for petstore-api

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/petstore/petstore-api
  pullPolicy: Always
  # Concrete main-<sha> seed tag; Kargo will overwrite this via the ArgoCD app's helm parameter
  # on every promotion, with ignoreDifferences keeping selfHeal from reverting it.
  tag: "main-initial"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  NODE_ENV: "production"
  PORT: "3000"
  PETSTORE_LOG_LEVEL: "info"
  # Database configuration - secrets will be injected via External Secrets
  DATABASE_URL: ""  # Will be set via externalsecret
  # Redis configuration for sessions and caching
  REDIS_URL: "redis://redis.redis.svc.cluster.local:6379"
  # Next.js specific
  NEXT_PUBLIC_API_URL: "https://api.petstore.tesserix.app"
  NEXTAUTH_URL: "https://api.petstore.tesserix.app"
  # Payment configuration (Stripe) - secrets will be injected
  STRIPE_PUBLISHABLE_KEY: ""  # Will be set via externalsecret
  # Email configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  FROM_EMAIL: "noreply@petstore.tesserix.app"
  # File upload configuration
  UPLOAD_MAX_SIZE: "10485760" # 10MB
  # CORS configuration
  CORS_ORIGINS: "https://petstore.tesserix.app,https://admin.petstore.tesserix.app"

database:
  host: "petstore-postgres.petstore.svc.cluster.local"
  port: "5432"
  user: "petstore_user"
  name: "petstore_db"

redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "petstore-api-sa@tesseracthub-480811.iam.gserviceaccount.com"

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

keda:
  enabled: false

podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-06-12T05:26:00Z"
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

podLabels: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Vertical Pod Autoscaler
vpa:
  enabled: false
  updateMode: "Auto"
  minAllowed:
    memory: 128Mi
    cpu: 50m
  maxAllowed:
    memory: 2Gi
    cpu: 1000m

# Health check configuration
healthcheck:
  enabled: true
  path: "/api/health"
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Ingress configuration
ingress:
  enabled: true
  className: "istio"
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
  hosts:
    - host: api.petstore.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: petstore-api-tls
      hosts:
        - api.petstore.tesserix.app

# Istio VirtualService
virtualService:
  enabled: true
  hosts:
    - api.petstore.tesserix.app
  gateways:
    - istio-system/default-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: petstore-api.petstore.svc.cluster.local
            port:
              number: 3000

# External Secrets for sensitive configuration
externalSecrets:
  enabled: true
  secretStore: gcp-secret-manager
  secrets:
    - name: petstore-api-secrets
      data:
        - secretKey: database-url
          remoteRef:
            key: petstore-database-url
        - secretKey: nextauth-secret
          remoteRef:
            key: petstore-nextauth-secret
        - secretKey: stripe-publishable-key
          remoteRef:
            key: petstore-stripe-publishable-key
        - secretKey: stripe-secret-key
          remoteRef:
            key: petstore-stripe-secret-key
        - secretKey: stripe-webhook-secret
          remoteRef:
            key: petstore-stripe-webhook-secret
        - secretKey: smtp-user
          remoteRef:
            key: petstore-smtp-user
        - secretKey: smtp-password
          remoteRef:
            key: petstore-smtp-password
        - secretKey: jwt-secret
          remoteRef:
            key: petstore-jwt-secret