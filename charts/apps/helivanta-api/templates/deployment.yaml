{{- if and .Values.documents.acceptUploads (not .Values.documents.enabled) }}
{{- fail "upload acceptance requires document processing" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helivanta-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helivanta-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    # Replace in place: a surge pod needs quota headroom helivanta-compute does not keep.
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      annotations:
        {{- if .Values.meshRegistryRevision }}
        tesserix.app/registry-mirror-revision: {{ .Values.meshRegistryRevision | quote }}
        {{- end }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- if include "helivanta-api.meshed" . }}
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 250m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 128Mi
        {{- end }}
      labels:
        {{- if include "helivanta-api.meshed" . }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- include "helivanta-api.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helivanta-api.serviceAccountName" . }}
      {{- if .Values.clinicalConsent.enabled }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for the process to stop being ready, let one readiness
      # probe interval pass, finish requests already accepted, and exceed
      # cmd/api's own hard 10s Shutdown timeout — see values.yaml's comment
      # on this key for the exact arithmetic.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HOSPITAL_PROVISIONING_ENABLED
              value: {{ .Values.hospitalProvisioning.enabled | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # hms_app — the application role. See values.yaml's
            # database.appSecretName comment on why getting this and
            # ADMIN_DATABASE_URL below backwards is a silent privilege error,
            # not just a wrong string.
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.appSecretName }}
                  key: username
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.appSecretName }}
                  key: password
            - name: APP_DATABASE_URL
              value: "postgres://$(APP_DB_USER):$(APP_DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            # helivanta — the owner role. tenantdb.Open's admin pool; the API
            # itself uses this for RLS-lint-adjacent boot operations, never
            # for serving a request (see values.yaml).
            - name: ADMIN_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminSecretName }}
                  key: username
            - name: ADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.adminSecretName }}
                  key: password
            - name: ADMIN_DATABASE_URL
              value: "postgres://$(ADMIN_DB_USER):$(ADMIN_DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            # helivanta_system — the ONLY role that may cross tenants (#894).
            #
            # This is a third DSN differing from the two above only by
            # username, which makes mixing them up easy and the consequences
            # asymmetric: SYSTEM_DATABASE_URL in APP_DATABASE_URL's place
            # disables tenant isolation for every request. tenantdb refuses
            # both directions at boot — assertNoRLSBypass rejects an app pool
            # that CAN bypass, assertRLSBypass rejects a system pool that
            # CANNOT — so a swap is a failed rollout, not a data leak.
            - name: SYSTEM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.systemSecretName }}
                  key: username
            - name: SYSTEM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.systemSecretName }}
                  key: password
            - name: SYSTEM_DATABASE_URL
              value: "postgres://$(SYSTEM_DB_USER):$(SYSTEM_DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            {{- /* global enforces STRICT mTLS, so without a sidecar every call fails; unset keeps the in-memory limiter. */}}
            {{- if and .Values.valkey.url (include "helivanta-api.meshed" .) }}
            - name: VALKEY_URL
              value: {{ .Values.valkey.url | quote }}
            - name: VALKEY_TIMEOUT
              value: {{ .Values.valkey.timeout | quote }}
            {{- end }}
            {{- /* OpenBao admits only this pod's mTLS principal; unmeshed, identifier writes and reveals fail closed with 503. */}}
            {{- if and .Values.openbao.addr (include "helivanta-api.meshed" .) }}
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.addr | quote }}
            - name: OPENBAO_TRANSIT_MOUNT
              value: {{ required "openbao.transitMount is required" .Values.openbao.transitMount | quote }}
            - name: OPENBAO_AUTH_ROLE
              value: {{ required "openbao.authRole is required" .Values.openbao.authRole | quote }}
            - name: OPENBAO_TOKEN_PATH
              value: /var/run/secrets/openbao/token
            {{- end }}
            {{- if .Values.clinicalConsent.enabled }}
            - name: MEDICONNECT_CLAIM_VERIFICATION_ENABLED
              value: "true"
            - name: MEDICONNECT_CLAIM_CALLER
              value: "system:serviceaccount:{{ .Release.Namespace }}:{{ include "helivanta-api.serviceAccountName" . }}"
            - name: MEDICONNECT_CLAIM_ORIGIN
              value: "http://{{ include "helivanta-api.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
            - name: MEDICONNECT_CLAIM_TRANSPORT
              value: istio-mtls
            - name: MEDICONNECT_CLAIM_TOKEN_FILE
              value: /var/run/secrets/mediconnect-claim/token
            {{- end }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- if and .Values.documents.enabled .Values.documents.acceptUploads }}
            - name: DOCUMENT_QUARANTINE_BUCKET
              value: {{ required "documents.quarantineBucket is required" .Values.documents.quarantineBucket | quote }}
            - name: DOCUMENT_RELEASED_BUCKET
              value: {{ required "documents.releasedBucket is required" .Values.documents.releasedBucket | quote }}
            {{- end }}
            - name: PRIVACY_DEADLINES_ENABLED
              value: {{ .Values.privacyDeadlines.enabled | quote }}
            {{- if .Values.privacyDeadlines.enabled }}
            {{- range $other := list .Values.documents .Values.emergencyDispatch }}
            {{- if and $other.enabled (or (ne $other.temporalAddress $.Values.privacyDeadlines.temporalAddress) (ne $other.temporalNamespace $.Values.privacyDeadlines.temporalNamespace)) }}
            {{- fail "API privacy and other enabled workflows must use the same Temporal namespace/address" }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: EMERGENCY_WORKFLOWS_ENABLED
              value: {{ .Values.emergencyDispatch.enabled | quote }}
            - name: EMERGENCY_DISPATCH_ENABLED
              value: {{ and .Values.emergencyDispatch.enabled .Values.emergencyDispatch.acceptNew | quote }}
            {{- if and .Values.documents.enabled .Values.emergencyDispatch.enabled }}
            {{- if or (ne .Values.documents.temporalAddress .Values.emergencyDispatch.temporalAddress) (ne .Values.documents.temporalNamespace .Values.emergencyDispatch.temporalNamespace) }}
            {{- fail "API dispatch and document workflows must use the same configured Temporal namespace/address" }}
            {{- end }}
            {{- end }}
            {{- if .Values.emergencyDispatch.enabled }}
            - name: TEMPORAL_ADDRESS
              value: {{ required "emergencyDispatch.temporalAddress required" .Values.emergencyDispatch.temporalAddress | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ required "emergencyDispatch.temporalNamespace required" .Values.emergencyDispatch.temporalNamespace | quote }}
            {{- else if .Values.documents.enabled }}
            - name: TEMPORAL_ADDRESS
              value: {{ required "documents.temporalAddress required" .Values.documents.temporalAddress | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ required "documents.temporalNamespace required" .Values.documents.temporalNamespace | quote }}
            {{- else if .Values.privacyDeadlines.enabled }}
            - name: TEMPORAL_ADDRESS
              value: {{ required "privacyDeadlines.temporalAddress required" .Values.privacyDeadlines.temporalAddress | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ required "privacyDeadlines.temporalNamespace required" .Values.privacyDeadlines.temporalNamespace | quote }}
            {{- end }}
            - name: OPENFGA_URL
              value: {{ .Values.openfga.url | quote }}
            - name: OPENFGA_STORE
              value: {{ .Values.openfga.store | quote }}
            - name: ZITADEL_ISSUER_URL
              value: {{ .Values.zitadel.issuerUrl | quote }}
            - name: ZITADEL_CLIENT_ID
              value: {{ .Values.zitadel.clientId | quote }}
            - name: ZITADEL_HOSTED_LOGIN_URL
              value: {{ .Values.zitadel.hostedLoginUrl | quote }}
            - name: HELIVANTA_WEB_ORIGIN
              value: {{ .Values.webOrigin | quote }}
            # The `iss` claim Helivanta stamps on its OWN session tokens and
            # the Verifier checks back (config.go's SessionIssuer). Unset, it
            # defaults to https://helivanta.local — which the first production
            # pod duly logged. Harmless as a label, wrong as a fact, and
            # changing it later invalidates every session already minted
            # under the old value.
            - name: SESSION_ISSUER
              value: {{ .Values.sessionIssuer | quote }}
            # THE PLACEHOLDER GUESS — see values.yaml's trustedProxyCIDRs
            # comment. Not yet confirmed against a live request; Task 9
            # confirms or corrects it.
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.trustedProxyCIDRs | quote }}
            # The two boot secrets templates/externalsecret.yaml projects.
            # Neither exists in OpenBao yet (human prerequisite) — until it
            # does, these keys are absent from the Secret entirely (ESO only
            # writes what it successfully synced), so this pod refuses to
            # boot (RequireSessionSigningKeySeed /
            # RequireZitadelLoginClientToken) rather than starting with an
            # empty credential. That is deliberate; do not add a fallback
            # default here.
            #
            # `optional: true` on both refs below is load-bearing, not
            # decorative: with `creationPolicy: Owner`, ESO never creates the
            # target Secret object at all until its first successful sync,
            # so without `optional: true` kubelet fails the pod at
            # CreateContainerConfigError — the container never starts, and
            # the Go boot-refusal message (naming SESSION_SIGNING_KEY /
            # ZITADEL_LOGIN_CLIENT_TOKEN) never gets a chance to print. With
            # it, the env var is simply absent, the container starts, and
            # config.RequireSessionSigningKeySeed /
            # RequireZitadelLoginClientToken produce the intended,
            # diagnosable refusal.
            - name: SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: helivanta-api-session-signing-key
                  key: SESSION_SIGNING_KEY
                  optional: true
            - name: ZITADEL_LOGIN_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: helivanta-api-zitadel-login-client-token
                  key: ZITADEL_LOGIN_CLIENT_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything that writes needs a
            # mount.
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.openbao.addr (include "helivanta-api.meshed" .) }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- end }}
            {{- if .Values.clinicalConsent.enabled }}
            - name: mediconnect-claim
              mountPath: /var/run/secrets/mediconnect-claim
              readOnly: true
            - name: kubernetes-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.clinicalConsent.enabled }}
        - name: mediconnect-claim
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: helivanta-mediconnect-claim
                  expirationSeconds: 600
                  path: token
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  expirationSeconds: 600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- /* The SA disables automount; this short-lived token is only for the Transit login. */}}
        {{- if and .Values.openbao.addr (include "helivanta-api.meshed" .) }}
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
