{{- if .Values.supplyEvidence.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: helivanta-supply-evidence-processing
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: helivanta
    release: kube-prometheus-stack
spec:
  groups:
    - name: helivanta.supply-evidence-processing
      rules:
        - alert: HelivantaSupplyEvidenceWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="helivanta-supply-evidence-worker"} < 1
          for: 5m
          labels: {severity: critical, owner: helivanta}
          annotations:
            summary: No Supply evidence worker is ready; private uploads cannot complete processing
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/helivanta-supply-evidence.md
        - alert: HelivantaSupplyEvidenceWorkerRestarting
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="worker",pod=~"helivanta-supply-evidence-worker-.*"}[15m])) > 3
          for: 5m
          labels: {severity: warning, owner: helivanta}
          annotations:
            summary: Supply evidence worker restarts require dependency and workflow recovery checks
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/helivanta-supply-evidence.md
{{- end }}
