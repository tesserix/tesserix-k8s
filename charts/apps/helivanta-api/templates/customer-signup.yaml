{{- if .Values.hospitalProvisioning.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helivanta-api-customer-signup
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "helivanta-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: onboarding
          podSelector:
            matchLabels:
              app.kubernetes.io/name: onboarding-api
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
