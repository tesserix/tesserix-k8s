{{- /*
The registry pull secret for this namespace.

helivanta-api is the FIRST private image pulled into the helivanta
namespace: everything slice 1a deployed (nats, openfga, cloudnative-pg)
comes from the docker-remote mirror or a public ghcr path and needs no
credential, so the namespace has never carried one. Without this the pod
ImagePullBackOffs on a tag that exists and is signed, which reads as a
broken image rather than a missing credential.

Deliberately NOT the namespaced openbao-helivanta-api SecretStore the two
boot secrets use. The GHCR credential is fleet-wide, not Helivanta's: every
other namespace (postiz, fanzone, dwellm8, homechef, ...) projects the same
prod-ghcr-username / prod-ghcr-token pair from GCP Secret Manager via the
gcp-secret-store ClusterSecretStore, and copying it into Helivanta's OpenBao
path would fork one credential into two places that then rotate
independently. Same keys, same store, same shape as every sibling — see
charts/apps/postiz/templates/ghcr-externalsecret.yaml.

v1beta1, not v1: external-secrets.io/v1 is not served on this cluster.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-api.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ "{{" }} printf "%s:%s" .ghcr_username .ghcr_token | b64enc {{ "}}" }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
