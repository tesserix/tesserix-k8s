{{- if .Values.emergencyRetention.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "helivanta-api.fullname" . }}-emergency-retention
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: emergency-retention
spec:
  schedule: {{ .Values.emergencyRetention.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ .Values.emergencyRetention.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 330
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: helivanta-emergency-retention
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: helivanta
            app.kubernetes.io/component: emergency-retention
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "helivanta-api.serviceAccountName" . }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
            seccompProfile: {type: RuntimeDefault}
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: emergency-retention
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/emergency-retention"]
              args: ["-batch-size=200", "-max-batches=10"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.emergencyRetention.resources | nindent 16 }}
              env:
                - {name: HELIVANTA_ENV, value: {{ .Values.env.HELIVANTA_ENV | quote }}}
                - {name: LOG_LEVEL, value: {{ .Values.env.LOG_LEVEL | quote }}}
                {{- range $pool, $secret := dict "APP" .Values.database.appSecretName "SYSTEM" .Values.database.systemSecretName }}
                - name: {{ $pool }}_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: username
                - name: {{ $pool }}_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: password
                - name: {{ $pool }}_DATABASE_URL
                  value: "postgres://$({{ $pool }}_DB_USER):$({{ $pool }}_DB_PASSWORD)@{{ $.Values.database.host }}:{{ $.Values.database.port }}/{{ $.Values.database.name }}?sslmode={{ $.Values.database.sslMode }}"
                {{- end }}
{{- end }}
