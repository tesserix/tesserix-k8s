{{- /*
The two boot secrets that do not yet exist in OpenBao (human prerequisite,
see this task's brief). Same shape as helivanta-postgres's ExternalSecrets
(Task 2/#864's known-working precedent) with the store swapped in an
identical way: `kind: SecretStore` (namespaced, not ClusterSecretStore),
`v1beta1` (v1 is NOT served on this cluster), no `version: latest` (that
field is GCP Secret Manager's, not OpenBao's Vault KV v2 provider), and no
`gcpSecretName`-equivalent key anywhere.

`remoteRef.property` is REQUIRED on both entries below, not decorative.
Each OpenBao path holds a single-key KV v2 payload
(`{"session_signing_key": "..."}` / `{"zitadel_login_client_token": "..."}`).
Without `property`, ESO's Vault provider returns the WHOLE payload as the
secretKey's value — a non-empty JSON blob, not an error — so the
ExternalSecret still reports SecretSynced and the Secret still gets a
non-empty key, and only the API's own boot-time validation
(ed25519 seed decode for the signing key; a raw PAT string for the Zitadel
token) would ever surface the mistake, at the worst possible moment. This
exact bug was caught in slice 1a's helivanta-postgres ExternalSecrets.

Until the human prerequisite lands, both of these fail SecretSyncedError
against OpenBao (the paths do not exist) and the API pod refuses to boot
(RequireSessionSigningKeySeed / RequireZitadelLoginClientToken) — that is
the correct, deliberate behaviour this task must not work around.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: helivanta-api-session-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-api.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-helivanta-api
    kind: SecretStore
  target:
    name: helivanta-api-session-signing-key
    creationPolicy: Owner
    template:
      data:
        SESSION_SIGNING_KEY: "{{ "{{" }} .sessionSigningKey {{ "}}" }}"
  data:
    - secretKey: sessionSigningKey
      remoteRef:
        key: {{ .Release.Namespace }}/helivanta-api/session-signing-key
        property: session_signing_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: helivanta-api-zitadel-login-client-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-api.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-helivanta-api
    kind: SecretStore
  target:
    name: helivanta-api-zitadel-login-client-token
    creationPolicy: Owner
    template:
      data:
        ZITADEL_LOGIN_CLIENT_TOKEN: "{{ "{{" }} .zitadelLoginClientToken {{ "}}" }}"
  data:
    - secretKey: zitadelLoginClientToken
      remoteRef:
        key: {{ .Release.Namespace }}/helivanta-api/zitadel-login-client-token
        property: zitadel_login_client_token
