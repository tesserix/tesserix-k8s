# Default values for tesserix-blog
# Environment: dev
replicaCount: 3

# =============================================================================
# Deployment Target
# =============================================================================
cloudRun:
  enabled: false

# =============================================================================
# Domain Configuration
# =============================================================================
domains:
  primary: blog.tesserix.app

# =============================================================================
# Container Image
# =============================================================================
image:
  repository: ghcr.io/tesserix/tesserix-blog
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# =============================================================================
# Ingress (GKE mode)
# =============================================================================
ingress:
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: blog.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: blog-tls
      hosts:
        - blog.tesserix.app
  backendServices: []

# =============================================================================
# Resources
# CPU request is required — KEDA's cpu trigger below cannot compute utilisation
# without a request, and HPA silently falls back to "<unknown>" (autoscaling off).
# Limit leaves burst headroom for cold Next.js SSR renders.
# =============================================================================
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# =============================================================================
# Rolling update strategy
# maxSurge:1 + maxUnavailable:0 means a new pod must be Ready before an old one
# is terminated — eliminates the brief 502 window users see during rollouts
# when Istio endpoint discovery lags the pod lifecycle.
# =============================================================================
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# =============================================================================
# Health Probes
# =============================================================================
# Startup probe gates liveness/readiness — gives Next.js + Istio sidecar time to boot
startupProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12   # 12 × 5s = 60s max startup time

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 0  # startup probe handles the delay
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 0  # startup probe handles the delay
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 8
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# =============================================================================
# Pod Disruption Budget
# Guarantees at least 2 replicas stay serving traffic during any voluntary
# disruption (node drain, rollout, eviction).
# =============================================================================
pdb:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# Environment Variables
# =============================================================================
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Blog URL
  NEXT_PUBLIC_BLOG_URL: "https://blog.tesserix.app"
  NEXT_PUBLIC_BLOG_NAME: "Tesserix Blog"

  # MongoDB URI and Keycloak client secret are injected from External Secrets
  # See: templates/externalsecret.yaml → GCP Secret Manager (prod-blog-*)

  # Keycloak (via Identity Customer - blog realm)
  KEYCLOAK_ISSUER: "https://identity-blog.tesserix.app/realms/blog"
  KEYCLOAK_INTERNAL_URL: "http://keycloak.identity-customer.svc.cluster.local:8080/realms/blog"
  KEYCLOAK_CLIENT_ID: "blog-bff"

  # Allowed authors
  ALLOWED_AUTHORS: "unidevidp@gmail.com,samyak.rout@gmail.com,mahesh.sangawar@gmail.com"

  # GCS public bucket for blog images (10yr+ retention)
  GCS_BLOG_BUCKET: "tesserix-blog-assets"
  GCP_PROJECT_ID: "tesseracthub-480811"

  # SendGrid email notifications (API key from External Secrets)
  SENDGRID_FROM_EMAIL: "noreply@tesserix.app"

  # Trust K8s cluster CA
  NODE_EXTRA_CA_CERTS: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

# =============================================================================
# External Secrets (GCP Secret Manager -> K8s Secrets)
# =============================================================================
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# ConfigMap
configMap:
  data: {}

# =============================================================================
# VPA
# =============================================================================
vpa:
  enabled: false

# =============================================================================
# GCP Configuration
# =============================================================================
gcp:
  projectId: ""
  namespace: "tesserix"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "prod"
