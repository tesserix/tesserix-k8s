# Default values for tesserix-blog
# Environment: dev
replicaCount: 1

# =============================================================================
# Deployment Target
# =============================================================================
cloudRun:
  enabled: false

# =============================================================================
# Domain Configuration
# =============================================================================
domains:
  primary: blog.tesserix.app

# =============================================================================
# Container Image
# =============================================================================
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-blog
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# =============================================================================
# Ingress
# =============================================================================
# Intentionally unset. blog.tesserix.app is served via the Cloudflare Tunnel
# (cloudflared namespace) → custom-ingressgateway → custom-domain-gateway →
# the tesserix-blog VirtualService in templates/virtualservice.yaml. A Kong
# Ingress used to exist here, but Kong crash-looped and produced intermittent
# "upstream connect error … connection termination" at the edge.
ingress: null

# =============================================================================
# Resources — memory only. CPU requests/limits intentionally omitted across all
# tesserix-k8s charts; workloads burst freely on shared spot nodes.
# =============================================================================
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

# =============================================================================
# Rolling update strategy
# maxSurge:1 + maxUnavailable:0 means a new pod must be Ready before an old one
# is terminated — eliminates the brief 502 window users see during rollouts
# when Istio endpoint discovery lags the pod lifecycle.
# =============================================================================
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# =============================================================================
# Graceful shutdown
# When a pod is marked Terminating, kubelet sends SIGTERM immediately. Next.js
# closes its HTTP server on SIGTERM, but kube-proxy + Istio ingress Envoy take
# ~1-3s to propagate the EndpointSlice removal — in-flight or just-routed
# connections RST during that window, surfacing as Envoy "connection
# termination" 503s and Cloudflare 504s at the edge.
#
# preStop sleep keeps the pod serving traffic for 10s AFTER it's removed from
# Endpoints, so consumers drain cleanly before Node receives SIGTERM. Total
# grace = preStop (10s) + SIGTERM drain budget (20s) = 30s.
# =============================================================================
terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    sleep:
      seconds: 10

# =============================================================================
# Health Probes
# =============================================================================
# Startup probe gates liveness/readiness — gives Next.js + Istio sidecar time to boot
startupProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12   # 12 × 5s = 60s max startup time

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 0  # startup probe handles the delay
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 0  # startup probe handles the delay
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 2
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# =============================================================================
# Pod Disruption Budget
# Guarantees at least 2 replicas stay serving traffic during any voluntary
# disruption (node drain, rollout, eviction).
# =============================================================================
# No minAvailable — falls back to maxUnavailable: 1 in the template, which
# stays evictable at every replica count (minAvailable: 2 deadlocked the PDB
# whenever KEDA scaled to a single replica).
pdb:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# Environment Variables
# =============================================================================
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Blog URL
  NEXT_PUBLIC_BLOG_URL: "https://blog.tesserix.app"
  NEXT_PUBLIC_BLOG_NAME: "Tesserix Blog"

  # MongoDB URI and session secret are injected from External Secrets
  # See: templates/externalsecret.yaml → GCP Secret Manager (prod-blog-*)


  # Full admin (create/edit posts). Everyone else who signs in is a reader:
  # they can comment, react and subscribe. See lib/config/authors.ts.
  ALLOWED_AUTHORS: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"

  # GCS public bucket for blog images (10yr+ retention)
  GCS_BLOG_BUCKET: "tesserix-blog-assets"
  GCP_PROJECT_ID: "tesseracthub-480811"

  # SendGrid email notifications (API key from External Secrets)
  SENDGRID_FROM_EMAIL: "noreply@tesserix.app"

  # Trust K8s cluster CA
  NODE_EXTRA_CA_CERTS: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

# =============================================================================
# External Secrets (GCP Secret Manager -> K8s Secrets)
# =============================================================================
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# Zitadel project 386314488103568012, application tesserix-blog-web. Redirect
# URI registered there is https://blog.tesserix.app/api/auth/callback exactly.
# This file is the one prod reads: the Argo app loads values.yaml +
# ../global-config.yaml and never values-prod.yaml.
auth:
  zitadel:
    issuer: "https://auth.tesserix.app"
    clientId: "386314489043092108"
    # Zitadel Google IdP id, sent as an idp-hint scope. The v2 login UI ignores
    # the hint today and still shows its loginname form with a Google button.
    idpId: "386336249998213772"

# ConfigMap
configMap:
  data: {}

# =============================================================================
# VPA
# =============================================================================
vpa:
  enabled: false

# =============================================================================
# GCP Configuration
# =============================================================================
gcp:
  projectId: ""
  namespace: "tesserix"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "prod"
