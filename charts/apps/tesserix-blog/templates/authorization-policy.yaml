# Allow all traffic to the blog - it's a public-facing site
# Authentication/authorization is handled by the app itself (Keycloak OIDC + email whitelist)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-allow-all
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    # Allow all sources - blog is public
    - {}
