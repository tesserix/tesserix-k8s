{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    # MongoDB connection string
    - secretKey: MONGODB_URI
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-mongodb-uri

    # Session encryption secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-session-secret

    # SendGrid API key for email notifications
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-sendgrid-api-key

    # Resend API key — always-on fallback email provider behind SendGrid.
    # prod-resend-api-key is the platform-wide shared key (not product-prefixed).
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: prod-resend-api-key
{{- if .Values.auth.zitadel.clientId }}
---
# Zitadel OIDC client secret. Separate object on purpose: a missing remoteRef
# fails the whole ExternalSecret, and folding this in would stop MONGODB_URI
# syncing too. See docs/zitadel-onboarding.md Part 1 Step 2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-oidc-secrets
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # Shorter than the hour used elsewhere: this is the credential that rotates
  # when the app moves org, and Reloader restarts the pod as soon as it lands.
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-oidc-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-oidc-client-secret
{{- end }}
{{- end }}
