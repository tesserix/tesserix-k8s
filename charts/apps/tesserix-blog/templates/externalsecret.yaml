{{- $openbao := eq (.Values.externalSecrets.provider | default "gcp") "openbao" }}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    fe3dr.com/secret-source-revision: openbao-shared-v1
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ ternary "SecretStore" "ClusterSecretStore" $openbao }}
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    # MongoDB connection string
    - secretKey: MONGODB_URI
      remoteRef:
{{- if $openbao }}
        key: blog/app/blog-mongodb-uri
        property: value
{{- else }}
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-mongodb-uri
{{- end }}

    # Session encryption secret
    - secretKey: SESSION_SECRET
      remoteRef:
{{- if $openbao }}
        key: blog/app/blog-session-secret
        property: value
{{- else }}
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-session-secret
{{- end }}

    # Resend API key — the only email provider (#1014). SendGrid's account was
    # closed; syncing a dead key would leave a credential that reads as a
    # working fallback.
    # prod-resend-api-key is the platform-wide shared key (not product-prefixed).
    - secretKey: RESEND_API_KEY
      sourceRef:
        storeRef:
          kind: SecretStore
          name: openbao-fe3dr-appdeps
      remoteRef:
        key: homechef/homechef-api/fe3dr-resend-api-key
        property: value
{{- if .Values.auth.zitadel.clientId }}
---
# Zitadel OIDC client secret. Separate object on purpose: a missing remoteRef
# fails the whole ExternalSecret, and folding this in would stop MONGODB_URI
# syncing too. See docs/zitadel-onboarding.md Part 1 Step 2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-oidc-secrets
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  # Shorter than the hour used elsewhere: this is the credential that rotates
  # when the app moves org, and Reloader restarts the pod as soon as it lands.
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ ternary "SecretStore" "ClusterSecretStore" $openbao }}
  target:
    name: {{ .Release.Name }}-oidc-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
{{- if $openbao }}
        key: blog/app/blog-oidc-client-secret
        property: value
{{- else }}
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-oidc-client-secret
{{- end }}
{{- end }}
{{- end }}
