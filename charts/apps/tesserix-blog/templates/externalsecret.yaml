{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    # MongoDB connection string
    - secretKey: MONGODB_URI
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-mongodb-uri

    # Session encryption secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-blog-session-secret

    # SendGrid API key for email notifications
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix }}-sendgrid-api-key

    # Resend API key — always-on fallback email provider behind SendGrid.
    # prod-resend-api-key is the platform-wide shared key (not product-prefixed).
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: prod-resend-api-key
{{- end }}
