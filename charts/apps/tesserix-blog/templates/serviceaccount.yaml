{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: blog-assets-writer@tesseracthub-480811.iam.gserviceaccount.com
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.serviceAccount.automount }}
automountServiceAccountToken: true
  {{- end }}
{{- end }}
