{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.gcp .Values.gcp.workloadIdentity .Values.gcp.workloadIdentity.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.gcp.workloadIdentity.gcpServiceAccount }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.serviceAccount.automount }}
automountServiceAccountToken: true
  {{- end }}
{{- end }}
