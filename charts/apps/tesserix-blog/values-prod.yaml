# Production overrides for tesserix-blog

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-blog
  tag: "0.1.0"

replicaCount: 1

# =============================================================================
# Domain Configuration
# =============================================================================
domains:
  primary: blog.tesserix.app

# =============================================================================
# Resources — memory only. CPU requests/limits intentionally omitted across all
# tesserix-k8s charts; workloads burst freely on shared spot nodes.
# =============================================================================
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

# =============================================================================
# Rolling update strategy
# maxSurge: 1 + maxUnavailable: 0 means a new pod MUST be ready before an old
# one is killed — eliminates the brief 502 window that users see when CI runs
# `kubectl rollout restart` and Istio endpoint discovery lags pod termination.
# =============================================================================
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# =============================================================================
# Graceful shutdown — see values.yaml for full rationale. preStop sleep bridges
# the endpoint-propagation lag between kube-proxy/Istio and pod termination,
# eliminating the 503 "connection termination" + Cloudflare 504 burst that hits
# users on every rollout.
# =============================================================================
terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    sleep:
      seconds: 10

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# =============================================================================
# Environment Variables
# =============================================================================
env:
  NODE_ENV: "production"
  NEXT_PUBLIC_BLOG_URL: "https://blog.tesserix.app"
  NEXT_PUBLIC_BLOG_NAME: "Tesserix Blog"

  # MongoDB (prod - from GCP Secret Manager)
  # MONGODB_URI injected from external secret


  # Full admin (create/edit posts). Everyone else who signs in is a reader.
  ALLOWED_AUTHORS: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"

  # SendGrid email notifications (API key from External Secrets: prod-sendgrid-api-key)
  SENDGRID_FROM_EMAIL: "noreply@tesserix.app"

# =============================================================================
# GCP
# =============================================================================
gcp:
  secretManager:
    secretPrefix: "prod"

# =============================================================================
# KEDA Autoscaling
# =============================================================================
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# =============================================================================
# Pod Disruption Budget
# No minAvailable: with KEDA minReplicaCount: 1 the blog routinely runs a
# single replica, and minAvailable: 2 made that pod permanently un-evictable
# (disruptionsAllowed pinned at 0 — blocked every node drain/scale-down).
# The template falls back to maxUnavailable: 1, which still limits voluntary
# disruptions to one pod at a time at any replica count.
# =============================================================================
pdb:
  enabled: true
