# Production overrides for tesserix-blog

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-blog
  tag: "0.1.0"

replicaCount: 3

# =============================================================================
# Domain Configuration
# =============================================================================
domains:
  primary: blog.tesserix.app

# =============================================================================
# Resources
# CPU request/limit are required — KEDA's cpu trigger is configured on the
# scaledobject, and without requests the HPA shows cpu:<unknown> and autoscaling
# silently breaks. Request is sized for steady-state Next.js SSR; limit leaves
# burst headroom so we aren't throttled during cold renders.
# =============================================================================
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

# =============================================================================
# Rolling update strategy
# maxSurge: 1 + maxUnavailable: 0 means a new pod MUST be ready before an old
# one is killed — eliminates the brief 502 window that users see when CI runs
# `kubectl rollout restart` and Istio endpoint discovery lags pod termination.
# =============================================================================
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# =============================================================================
# Environment Variables
# =============================================================================
env:
  NODE_ENV: "production"
  NEXT_PUBLIC_BLOG_URL: "https://blog.tesserix.app"
  NEXT_PUBLIC_BLOG_NAME: "Tesserix Blog"

  # MongoDB (prod - from GCP Secret Manager)
  # MONGODB_URI injected from external secret

  # Keycloak (prod)
  KEYCLOAK_ISSUER: "https://auth.tesserix.app/realms/tesserix"
  KEYCLOAK_CLIENT_ID: "tesserix-blog"

  # Allowed authors
  ALLOWED_AUTHORS: "unidevidp@gmail.com,samyak.rout@gmail.com,mahesh.sangawar@gmail.com"

  # SendGrid email notifications (API key from External Secrets: prod-sendgrid-api-key)
  SENDGRID_FROM_EMAIL: "noreply@tesserix.app"

# =============================================================================
# GCP
# =============================================================================
gcp:
  secretManager:
    secretPrefix: "prod"

# =============================================================================
# KEDA Autoscaling
# =============================================================================
keda:
  enabled: true
  minReplicaCount: 3
  maxReplicaCount: 8
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# =============================================================================
# Pod Disruption Budget
# minAvailable: 2 — at least two replicas must stay serving traffic during any
# voluntary disruption (node drain, rollout, eviction). With minReplicaCount: 3
# and maxUnavailable: 0 above, this gives us a full N-1 survival guarantee.
# =============================================================================
pdb:
  enabled: true
  minAvailable: 2
