environment: sandbox
temporal:
  namespace: document-intelligence-sandbox
  taskQueue: document-intelligence-kora-sandbox
buckets:
  quarantine: kora-dev-doc-quarantine-in
  source: kora-dev-doc-accepted-in
  pages: kora-dev-doc-derived-in
  results: kora-dev-doc-results-in
serviceAccounts:
  upload: kora-dev-doc-signer
  jobs: kora-dev-doc-result-api
  dispatch: kora-dev-doc-scanner
  execution: kora-dev-doc-worker
database:
  secretName: document-intelligence-sandbox-db
  secretManagerKey: dev-document-intelligence-db-password
  user: document_intelligence_sandbox
  name: document_intelligence_sandbox_db
identity:
  secretName: document-intelligence-sandbox-api-identity
  secretManagerKey: dev-kora-ocr-workload-identity-keys
apiClientNamespaces: [devai]
apiClientPrincipals: ["cluster.local/ns/devai/sa/devai-api"]
