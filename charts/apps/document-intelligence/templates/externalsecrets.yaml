apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .Values.database.user }}:{{ "{{ .password }}" }}@global-postgres-rw.global.svc.cluster.local:5432/{{ .Values.database.name }}?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: {{ .Values.database.secretManagerKey }}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.identity.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target: {name: {{ .Values.identity.secretName }}, creationPolicy: Owner}
  data:
    - secretKey: OCR_WORKLOAD_IDENTITY_KEYS
      remoteRef: {key: {{ .Values.identity.secretManagerKey }}}
