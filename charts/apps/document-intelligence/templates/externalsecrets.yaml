{{- $c := include "document-intelligence.config" . | fromYaml }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $c.database.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target:
    name: {{ $c.database.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ $c.database.user }}:{{ "{{ .password }}" }}@global-postgres-rw.global.svc.cluster.local:5432/{{ $c.database.name }}?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: {{ $c.database.secretManagerKey }}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $c.identity.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target:
    name: {{ $c.identity.secretName }}
    creationPolicy: Owner
    {{- if .Values.clients }}
    # Every client key is bound to this release's product; a caller cannot claim another product.
    template:
      engineVersion: v2
      data:
        OCR_WORKLOAD_IDENTITY_KEYS: '{{ range $i, $k := .Values.clients }}{{ if $i }},{{ end }}{{ $k.keyId }}={{ $.Values.product }}:{{ printf "{{ .client_%d | trim }}" $i }}{{ end }}'
  data:
    {{- range $i, $k := .Values.clients }}
    - secretKey: client_{{ $i }}
      remoteRef: {key: {{ $k.secretManagerKey }}}
    {{- end }}
    {{- else }}
    {{- with $c.identity.extraKeys }}
    # Each client product's key lives in its own Secret Manager entry; joined here so no one handles the others.
    template:
      engineVersion: v2
      data:
        OCR_WORKLOAD_IDENTITY_KEYS: '{{ "{{ .base | trim }}" }}{{ range $i, $k := . }},{{ $k.keyId }}={{ $.Values.product }}:{{ printf "{{ .extra_%d | trim }}" $i }}{{ end }}'
    {{- end }}
  data:
    - secretKey: {{ if $c.identity.extraKeys }}base{{ else }}OCR_WORKLOAD_IDENTITY_KEYS{{ end }}
      remoteRef: {key: {{ $c.identity.secretManagerKey }}}
    {{- range $i, $k := $c.identity.extraKeys }}
    - secretKey: extra_{{ $i }}
      remoteRef: {key: {{ $k.secretManagerKey }}}
    {{- end }}
    {{- end }}
