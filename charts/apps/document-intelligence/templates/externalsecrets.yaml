apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .Values.database.user }}:{{ "{{ .password }}" }}@global-postgres-rw.global.svc.cluster.local:5432/{{ .Values.database.name }}?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: {{ .Values.database.secretManagerKey }}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.identity.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target:
    name: {{ .Values.identity.secretName }}
    creationPolicy: Owner
    {{- with .Values.identity.extraKeys }}
    # Each client product's key lives in its own Secret Manager entry; joined here so no one handles the others.
    template:
      engineVersion: v2
      data:
        OCR_WORKLOAD_IDENTITY_KEYS: '{{ "{{ .base | trim }}" }}{{ range $i, $k := . }},{{ $k.keyId }}={{ $.Values.product }}:{{ printf "{{ .extra_%d | trim }}" $i }}{{ end }}'
    {{- end }}
  data:
    - secretKey: {{ if .Values.identity.extraKeys }}base{{ else }}OCR_WORKLOAD_IDENTITY_KEYS{{ end }}
      remoteRef: {key: {{ .Values.identity.secretManagerKey }}}
    {{- range $i, $k := .Values.identity.extraKeys }}
    - secretKey: extra_{{ $i }}
      remoteRef: {key: {{ $k.secretManagerKey }}}
    {{- end }}
