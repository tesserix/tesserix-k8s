{{- if .Values.secretSeed.enabled }}
{{- $c := include "document-intelligence.config" . | fromYaml }}
{{- $name := printf "%s-secret-seed" $c.fullname }}
{{- $keys := list (required "secretSeed needs an OpenBao database key" $c.database.openbaoKey) }}
{{- range .Values.clients }}
{{- $keys = append $keys (required "secretSeed needs an OpenBao key for every client" .openbaoKey) }}
{{- end }}
# Creates this release's credentials in OpenBao when absent; never overwrites one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels: {{ include "document-intelligence.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels: {{ include "document-intelligence.labels" . | nindent 4 }}
data:
  seed.py: |
{{ .Files.Get "files/secret-seed.py" | indent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels: {{ include "document-intelligence.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.30.0.10/32}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openbao}}, podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}}]
      ports: [{port: 8200, protocol: TCP}, {port: 15008, protocol: TCP}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels: {{ include "document-intelligence.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      # No instance label: the release's runtime policies must not select this pod.
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: seed
          image: {{ .Values.secretSeed.image }}
          command: [python, -B, /scripts/seed.py]
          env:
            - {name: OPENBAO_ROLE, value: {{ printf "seed-%s-document-intelligence-%s" .Values.product (ternary "production" (ternary "development" .Values.environment (eq .Values.environment "dev")) (eq .Values.environment "prod")) | quote }}}
            - {name: SEED_KEYS, value: {{ join "," $keys | quote }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/openbao, readOnly: true}
      volumes:
        - name: script
          configMap: {name: {{ $name }}}
        - name: token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
{{- end }}
