apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "document-intelligence.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  policyTypes: [Ingress, Egress]
  {{- if .Values.apiClientNamespaces }}
  ingress:
    {{- range .Values.apiClientNamespaces }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ . | quote }}}}
      ports: [{port: 8080, protocol: TCP}, {port: 15008, protocol: TCP}]
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.30.0.10/32}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports: [{port: 80, protocol: TCP}]
    - to: [{ipBlock: {cidr: 169.254.169.252/32}}]
      ports: [{port: 988, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: global}}
      ports: [{port: 5432, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: temporal-system}}
      ports: [{port: 7233, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.20.0.0/16}}]
      ports: [{port: 15008, protocol: TCP}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{port: 443, protocol: TCP}]
---
{{- range $name := list "upload-api" "job-api" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "document-intelligence.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/component: {{ $name | quote }}}}
{{- end }}
