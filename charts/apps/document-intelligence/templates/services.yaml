{{- range $name := list "upload-api" "job-api" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "document-intelligence.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{ include "document-intelligence.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/component: {{ $name | quote }}, app.kubernetes.io/instance: {{ $.Release.Name | quote }}}
  ports: [{name: http, port: 8080, targetPort: http, protocol: TCP}]
{{- end }}
