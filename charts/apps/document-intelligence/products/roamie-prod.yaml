# One file per product release. Adding a file here creates the release (ApplicationSet
# document-intelligence-products) and its GCP resources (stack 15-document-intelligence-products).
product: roamie
secretBackend: openbao
database:
  openbaoKey: roamie/app/roamie-document-intelligence-db-password
  openbaoStore: openbao-roamie-production
identity:
  openbaoStore: openbao-roamie-production
environment: prod
# First sync only; Kargo owns image.tag after that.
image: {tag: d29a4f9b5ed329d36c34c4d2af960e379034ba37}
# Sign photos are transient; keep uploads and derived pages briefly.
retentionDays: {quarantine: 1, source: 7, pages: 1, results: 7}
clients:
  - {namespace: roamie, serviceAccount: roamie-api, keyId: roamie-v1, openbaoKey: roamie/app/roamie-api-ocr-key, openbaoStore: openbao-roamie-production}
