# Lint defaults only; every release sets both (values-*.yaml or products/<product>-<env>.yaml).
product: example
environment: dev

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/document-intelligence/ocr-service
  tag: main
  pullPolicy: IfNotPresent

clamav:
  image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/clamav/clamav@sha256:629a3050df6a706aedb31859fbb8139e9aaf8f56b0ffefbf251b8358a7c9e76c

temporal:
  target: http://temporal-frontend.temporal-system.svc.cluster.local:7233
documentAi:
  projectId: tesseracthub-480811
  location: asia-south1
  processorId: 395d58b2596d5031
identity:
  clockSkewSeconds: "60"
# Releases for products onboarded through products/*.yaml own their Kubernetes
# service accounts; the legacy kora releases use k8s/platform ones.
createServiceAccounts: true
telemetry:
  endpoint: http://otel-gateway.observability.svc.cluster.local:4318/v1/traces
  serviceName: document-intelligence
workers:
  execution:
    replicas: 2
    pageBatchSize: 4
    pageConcurrency: 2
    finalizationConcurrency: 2
resources:
  api:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  worker:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  clamd:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 2Gi}
