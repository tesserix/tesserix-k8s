replicaCount: 1
image:
  repository: ghcr.io/tesserix/mark8ly/mp-staff
  tag: "latest"

# Critical path service — must always be warm for owner bootstrap during onboarding
knative:
  enabled: false
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com
gcp:
  projectId: tesseracthub-480811
  secretManager:
    secretPrefix: "prod"
db:
  name: staff_db
  user: postgres

openfga:
  storeId: "01KMS970NNJPJP97MR7XNZSVD3"

env:
  SERVICE_AUTH_MODE: "mesh"
  BASE_DOMAIN: "mark8ly.com"
  GIN_MODE: "release"
