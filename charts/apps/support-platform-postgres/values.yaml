namespace: support-platform
clusterName: support-platform-postgres

# Pgvector image — CNPG operator publishes an image with the vector
# extension preinstalled. Pin a recent tag we know works with CNPG 1.24.
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# 1 instance to start. Scale to 2 when read traffic from slm-router
# warrants a read replica (the retriever can fan out to -ro).
instances: 1

storageSize: 20Gi
walStorageSize: 5Gi
storageClass: standard-rwo-retain

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

bootstrap:
  database: support_platform
  owner: support_platform
  ownerSecret: support-platform-postgres-app

backup:
  enabled: false  # Enable once Barman bucket is provisioned for support-platform
  destinationPath: ""
  retentionPolicy: "3d"
  serviceAccount: ""

monitoring:
  enablePodMonitor: false  # Enable after Prometheus operator is confirmed scraping support-platform

hibernate: false
