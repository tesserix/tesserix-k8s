# Allow the cnpg-system operator + in-namespace clients to reach the
# database pods. cnpg-system MUST be in the ingress list — without it
# the operator can't run probes on port 8000 and replicas never come
# up (per the CNPG NetworkPolicy memory).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: support-platform-postgres-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: support-platform
