apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/component: auth
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 2
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: homechef
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENV
              value: "prod"
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: LOG_LEVEL
              value: "info"
            # homechef-products.yaml is baked into the image by the Dockerfile
            # (COPY homechef-products.yaml /etc/auth-bff/homechef-products.yaml).
            - name: PRODUCTS_CONFIG_PATH
              value: {{ .Values.productsConfigPath | quote }}
            - name: GIP_PROJECT_ID
              value: {{ .Values.gip.projectId | quote }}
            - name: GIP_PROJECT_NUMBER
              value: {{ .Values.gip.projectNumber | quote }}
            # GIP browser-exposed key (used server-side for password sign-in
            # via the Identity Toolkit REST API, surfaced to the client for
            # phone/social flows).
            - name: GIP_WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: GIP_WEB_API_KEY
            # Per-app OAuth client secrets. Names match the
            # `clientSecretEnv` fields in homechef-products.yaml — the
            # productregistry resolver looks them up via os.Getenv at
            # request time.
            - name: HOMECHEF_CUSTOMER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: HOMECHEF_CUSTOMER_CLIENT_SECRET
            - name: HOMECHEF_BUSINESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: HOMECHEF_BUSINESS_CLIENT_SECRET
            - name: HOMECHEF_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: HOMECHEF_INTERNAL_CLIENT_SECRET
            # Session — encrypted cookie shared across *.fe3dr.com.
            - name: SESSION_COOKIE_DOMAIN
              value: {{ .Values.session.cookieDomain | quote }}
            - name: SESSION_MAX_AGE_HOURS
              value: {{ .Values.session.maxAgeHours | quote }}
            - name: SESSION_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: SESSION_ENCRYPT_KEY
            # HMAC key for the internal BFF→API trust header. The Go API
            # surfaces the same key as BFF_INTERNAL_HMAC_KEY and rejects
            # any request whose signature doesn't match. MUST be kept in
            # sync — see external-secrets/prod/homechef/externalsecret.yaml.
            - name: BFF_INTERNAL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: BFF_INTERNAL_HMAC_KEY
            - name: API_BASE_URL
              value: {{ .Values.apiBaseURL | quote }}
            - name: AUDIT_ENDPOINT
              value: {{ .Values.auditEndpoint | quote }}
            # Admin allow-list for the internal portal (admin.fe3dr.com).
            # Resolved by productregistry from the `allowedEmailsEnv` field
            # in homechef-products.yaml.
            - name: HOMECHEF_ADMIN_ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authBff }}
                  key: HOMECHEF_ADMIN_ALLOWED_EMAILS
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
