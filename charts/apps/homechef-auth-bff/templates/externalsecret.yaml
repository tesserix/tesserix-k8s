{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
  labels:
    {{- include "homechef-auth-bff.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "homechef-auth-bff.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_CUSTOMER_CLIENT_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-keycloak-client-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: KEYCLOAK_INTERNAL_CLIENT_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-internal-keycloak-client-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-bff-session-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ printf "%s-homechef-redis-password" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: CSRF_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-bff-csrf-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: TOTP_ENCRYPTION_KEY
      remoteRef:
        key: {{ printf "%s-homechef-bff-totp-encryption-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: BACKUP_CODE_HMAC_KEY
      remoteRef:
        key: {{ printf "%s-homechef-bff-backup-code-hmac-key" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
