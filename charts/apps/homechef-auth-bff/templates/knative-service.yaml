{{- if .Values.knative.enabled }}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "homechef-auth-bff.fullname" . }}
  labels:
    {{- include "homechef-auth-bff.labels" . | nindent 4 }}
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/disableAutoTLS: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | int | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | default "10" | quote }}
        autoscaling.knative.dev/target: {{ .Values.knative.concurrencyTarget | default "100" | quote }}
        {{- if .Values.knative.scaleDownDelay }}
        autoscaling.knative.dev/scale-down-delay: {{ .Values.knative.scaleDownDelay | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "homechef-auth-bff.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containerConcurrency: {{ .Values.knative.containerConcurrency | default 0 }}
      timeoutSeconds: {{ .Values.knative.timeoutSeconds | default 300 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homechef-auth-bff.serviceAccountName" . }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8090 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            {{- if ne $key "PORT" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            # Keycloak - Customer IDP
            - name: KEYCLOAK_CUSTOMER_URL
              value: {{ .Values.keycloak.customer.url | quote }}
            {{- if .Values.keycloak.customer.internalUrl }}
            - name: KEYCLOAK_CUSTOMER_INTERNAL_URL
              value: {{ .Values.keycloak.customer.internalUrl | quote }}
            {{- end }}
            - name: KEYCLOAK_CUSTOMER_REALM
              value: {{ .Values.keycloak.customer.realm | quote }}
            - name: KEYCLOAK_CUSTOMER_CLIENT_ID
              value: {{ .Values.keycloak.customer.clientId | quote }}
            # Keycloak - Internal IDP
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ .Values.keycloak.internal.url | quote }}
            {{- if .Values.keycloak.internal.internalUrl }}
            - name: KEYCLOAK_INTERNAL_INTERNAL_URL
              value: {{ .Values.keycloak.internal.internalUrl | quote }}
            {{- end }}
            - name: KEYCLOAK_INTERNAL_REALM
              value: {{ .Values.keycloak.internal.realm | quote }}
            - name: KEYCLOAK_INTERNAL_CLIENT_ID
              value: {{ .Values.keycloak.internal.clientId | quote }}
            # Redis configuration (use HOST/PORT/PASSWORD, not URL, so password is applied)
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: REDIS_PASSWORD
            # Secrets from ExternalSecret
            - name: KEYCLOAK_CUSTOMER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: KEYCLOAK_CUSTOMER_CLIENT_SECRET
            - name: KEYCLOAK_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: KEYCLOAK_INTERNAL_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: SESSION_SECRET
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: CSRF_SECRET
            - name: TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: TOTP_ENCRYPTION_KEY
            - name: BACKUP_CODE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-auth-bff.fullname" . }}-secrets
                  key: BACKUP_CODE_HMAC_KEY
            # API Gateway URL for proxy
            - name: API_GATEWAY_URL
              value: {{ .Values.env.HOMECHEF_API_URL | default "http://homechef-api.homechef.svc.cluster.local:80" | quote }}
            {{- if .Values.nats }}
            # NATS
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
{{- end }}
