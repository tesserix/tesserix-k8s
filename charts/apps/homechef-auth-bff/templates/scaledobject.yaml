{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  # Declared so ArgoCD OWNS this label map. Without it the chart shipped no
  # labels at all, while the live object still carried an
  # `argocd.argoproj.io/instance` label left over from label-based resource
  # tracking (the cluster moved to annotation tracking). That label sat in
  # last-applied-configuration and in nothing git declared, so every reconcile
  # computed a removal that never stuck: the app reported OutOfSync forever
  # while each sync logged "configured" and succeeded. The four sibling
  # ScaledObjects carry labels and are Synced.
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/component: auth
spec:
  scaleTargetRef:
    name: {{ .Values.name }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  triggers:
    {{- if .Values.keda.triggers }}
    {{- toYaml .Values.keda.triggers | nindent 4 }}
    {{- else }}
    # A `cpu` trigger is only valid while the container declares a CPU request —
    # the KEDA admission webhook rejects it otherwise, which once froze every
    # auth-bff sync on a stale image. Keep values.yaml's resources and triggers
    # in step.
    #
    # The istio request-rate (prometheus) trigger was removed (#906): the
    # monitoring namespace is scaled to zero, so prometheus-server has no
    # endpoints, the HPA could not compute the external metric, and the
    # resulting Degraded ScaledObject failed Kargo's health gate — silently
    # blocking every production promotion while CI stayed green. Restore it
    # here if monitoring comes back.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
    {{- end }}
{{- end }}
