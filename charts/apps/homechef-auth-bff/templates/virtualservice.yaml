{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "homechef-auth-bff.fullname" . }}
  labels:
    {{- include "homechef-auth-bff.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.virtualService.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - {{ .Values.virtualService.gateway | default "istio-ingress/tesseract-gateway" }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "homechef-auth-bff.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: 60s
      # NOTE: No retry policy — auth callbacks consume state on first read (non-idempotent).
      # Retrying causes invalid_state errors because the state is deleted after retrieval.
      corsPolicy:
        allowOrigins:
          {{- range .Values.virtualService.allowedOrigins }}
          - exact: {{ . | quote }}
          {{- end }}
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
        allowCredentials: true
        maxAge: "86400s"
{{- end }}
