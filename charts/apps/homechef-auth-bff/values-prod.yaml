# Production overrides for homechef-auth-bff

# Knative Serving - always-on for session management
knative:
  enabled: true
  minScale: 1
  maxScale: 10
  scaleDownDelay: "60s"

replicaCount: 2

# Production environment
env:
  LOG_LEVEL: "warn"
  BASE_DOMAIN: "fe3dr.com"
  FORCE_PROTOCOL: "https"
  ALLOWED_ORIGINS: "fe3dr://,https://fe3dr.com,https://www.fe3dr.com,https://vendors.fe3dr.com,https://admin.fe3dr.com,https://delivery.fe3dr.com,https://analytics.fe3dr.com"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# Production Keycloak configuration
keycloak:
  customer:
    url: "https://identity.fe3dr.com"
    internalUrl: "http://keycloak.identity-customer.svc.cluster.local:8080"
    realm: "homechef"
  internal:
    url: "https://internal-identity.fe3dr.com"
    # In-cluster URL for fast back-channel calls. Safe because the
    # tesserix-internal realm has attributes.frontendUrl set to the public URL
    # (applied by templates/homechef-clients-bootstrap-job.yaml), so Keycloak
    # returns public URLs in the OIDC discovery document even when reached via
    # cluster DNS. Browser redirects therefore stay on internal-identity.fe3dr.com.
    internalUrl: "http://keycloak.identity-internal.svc.cluster.local:8080"
    realm: "tesserix-internal"

# Disable HPA and KEDA — Knative handles autoscaling
autoscaling:
  enabled: false

keda:
  enabled: false

# Production Redis
redis:
  host: "redis.redis-homechef.svc.cluster.local"
  port: "6379"

# Production NATS
nats:
  url: "nats://nats-ilb.nats.svc.cluster.local:4222"

# Istio VirtualService for auth/identity domains
# Note: identity.fe3dr.com is routed via manifests/homechef-istio/virtualservice.yaml
virtualService:
  enabled: true
  gateway: "istio-ingress/tesseract-gateway"
  hosts:
    - "auth.fe3dr.com"
  allowedOrigins:
    - "https://fe3dr.com"
    - "https://www.fe3dr.com"
    - "https://vendors.fe3dr.com"
    - "https://admin.fe3dr.com"
    - "https://delivery.fe3dr.com"
    - "https://analytics.fe3dr.com"
