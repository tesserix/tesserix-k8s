# =============================================================================
# HomeChef Auth BFF - Dual Keycloak OIDC Backend-For-Frontend
# Node.js service handling session management, OIDC flows, and token exchange
# Supports both customer (homechef realm) and internal (admin) authentication
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-nexus-remote/tesseract-nexus/global-services/auth-bff
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

knative:
  enabled: false
  minScale: 1
  maxScale: 10
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 12
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8090"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"

  # Session configuration
  SESSION_MAX_AGE: "604800"
  SESSION_COOKIE_NAME: "homechef_bff_session"
  SESSION_COOKIE_DOMAIN: ""
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "lax"

  # Base domain for hostname matching
  BASE_DOMAIN: "tesserix.app"

  # Allowed CORS origins
  ALLOWED_ORIGINS: "fe3dr://,https://dev-homechef.tesserix.app,https://*.tesserix.app"

  # HomeChef API URL (internal cluster DNS)
  HOMECHEF_API_URL: "http://homechef-api.homechef.svc.cluster.local:80"

# ============================================================================
# DUAL-REALM KEYCLOAK CONFIGURATION
# - Customer realm (homechef): Customer/chef/delivery partner authentication
# - Internal realm (tesserix-internal): Admin team authentication
# ============================================================================
keycloak:
  customer:
    url: "https://devtest-customer-idp.tesserix.app"
    internalUrl: "http://keycloak.identity-customer.svc.cluster.local:8080"
    realm: "homechef"
    clientId: "homechef-bff"
  internal:
    url: "https://devtest-internal-idp.tesserix.app"
    internalUrl: "http://keycloak.identity-internal.svc.cluster.local:8080"
    realm: "tesserix-internal"
    clientId: "homechef-admin-bff"

# Redis configuration (for session store)
redis:
  host: "redis.redis-homechef.svc.cluster.local"
  port: "6379"

# GCP Secret Manager Configuration
gcp:
  projectId: ""
  namespace: "homechef"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# Istio VirtualService configuration
virtualService:
  enabled: false
  gateway: "istio-ingress/tesseract-gateway"
  hosts: []
  allowedOrigins: []
