namespace: homechef
name: homechef-auth-bff
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-auth-bff
  tag: "main-placeholder" # overridden per-release by CI bump job (Kargo)
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
# KEDA autoscaling — Deployment + KEDA (no Knative). Everything here is
# values-driven, so scaling up later is a one-line change:
#   • raise maxReplicaCount to allow more pods,
#   • raise minReplicaCount for a bigger always-on floor,
#   • lower the prometheus threshold to add pods sooner under traffic.
# KEDA scales to the MAX of all triggers. No CPU triggers (platform is
# memory-only); traffic is the primary signal, memory the safety net.
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1   # always at least 1 pod
  maxReplicaCount: 7   # ceiling — bump to scale higher
  triggers:
    # Traffic: Istio requests/sec to this service (Prometheus). threshold is
    # the target req/s PER replica, so replicas ≈ total_rps / threshold.
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
        threshold: "50"
        query: 'sum(rate(istio_requests_total{destination_service_name="homechef-auth-bff",destination_service_namespace="homechef",reporter="source"}[2m]))'
    # Memory safety net (utilization %). Adds pods if memory climbs.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi
pdb:
  enabled: true
  minAvailable: 1

# Google Identity Platform — homechef product tenants. The OAuth client is
# shared across all four apps; per-app client SECRETS live in different env
# vars (HOMECHEF_*_CLIENT_SECRET) resolved by productregistry from
# homechef-products.yaml (baked into the image at /etc/auth-bff/).
gip:
  projectId: "tesseracthub-480811"
  projectNumber: "849928263410"

# Session cookie scope. `.fe3dr.com` lets the cookie ride across
# www / vendors / delivery / admin subdomains.
session:
  cookieDomain: ".fe3dr.com"
  maxAgeHours: 168

# Path to the products registry YAML inside the container. The Dockerfile
# COPYs homechef-products.yaml to this exact path.
productsConfigPath: "/etc/auth-bff/homechef-products.yaml"

# In-cluster URL of the Go API the BFF proxies to after authenticating.
apiBaseURL: "http://homechef-api.homechef.svc.cluster.local"

# Optional — audit endpoint is empty/unwired in slice 1. The auth-bff
# audit client treats empty as no-op.
auditEndpoint: ""

# Workload Identity GSA — bound to the homechef-auth-bff KSA in this
# namespace by the create-homechef-auth-bff-gsa.sh script (or Terraform
# once the team migrates the GSA lifecycle there).
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "homechef-auth-bff@tesseracthub-480811.iam.gserviceaccount.com"

# Secret resource names — produced by external-secrets/prod/homechef/externalsecret.yaml.
secrets:
  authBff: homechef-auth-bff-secrets
