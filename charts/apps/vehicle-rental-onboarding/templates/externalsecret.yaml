{{- if .Values.gcp.secretManager.enabled }}
{{/*
The UI's only secret is the key it seals its own session cookie with. It holds
no database credential — the Go API owns Postgres, so a compromised storefront
pod yields a session key and no data.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-session
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore }}
  target:
    name: {{ .Values.name }}-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: {{ .Values.gcp.secrets.sessionKey }}
{{- end }}
