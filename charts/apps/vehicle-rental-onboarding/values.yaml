name: vehicle-rental-onboarding
namespace: vehicle-rental
partOf: vehicle-rental-app

image:
  repository: ghcr.io/tesserix/vehicle-rental-onboarding
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 3000

replicas: 2

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

pdb:
  enabled: true
  minAvailable: 1

# Routed by vehicle-rental-storefront's wildcard VirtualService on the exact
# rentme.tesserix.app authority.
platformHostSuffix: tesserix.app

# The UI holds no database credential. Postgres is reached only by the Go API,
# which is what enforces the tenant scope the RLS policies read.
api:
  baseUrl: http://vehicle-rental-api.vehicle-rental.svc.cluster.local:8080

auth:
  issuer: https://auth.tesserix.app
  clientId: vehicle-rental-onboarding

gcp:
  secretManager:
    enabled: true
    refreshInterval: 1h
    secretStore: gcp-secret-store
  secrets:
    sessionKey: prod-vehicle-rental-session-encrypt-key
