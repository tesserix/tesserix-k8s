{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fanzone-auth-bff.fullname" . }}-secrets
  labels:
    {{- include "fanzone-auth-bff.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "fanzone-auth-bff.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # GIP cutover (2026-05-12): the legacy OIDC client secret is gone.
    # The BFF verifies Firebase ID tokens via the Admin SDK using
    # Workload Identity — no static IdP secret in cluster.
    - secretKey: SESSION_SECRET
      remoteRef:
        key: {{ printf "%s-fanzone-bff-session-secret" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
