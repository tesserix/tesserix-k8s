# Production overrides for fanzone-auth-bff
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

image:
  pullPolicy: IfNotPresent


# Autoscaling handled outside KEDA/HPA
keda:
  enabled: false

autoscaling:
  enabled: false

# Production environment
env:
  LOG_LEVEL: "warn"
  BASE_DOMAIN: "fanzonebattleground.com"
  ALLOWED_ORIGINS: "fanzone://,https://fanzonebattleground.com,https://www.fanzonebattleground.com"
  # fanzone-auth Go service (in-cluster)
  FANZONE_BASE_URL: "http://fanzone-auth.fanzone.svc.cluster.local"

# Production GCP configuration. The KSA is bound (via WI) to a GSA
# that holds firebaseauth.admin + identitytoolkit.admin so the BFF can
# verify Firebase ID tokens via the Admin SDK without a static key.
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    # app-secrets-marketplace-prod already holds firebaseauth.admin +
    # identitytoolkit.admin and is reused here for the GIP cutover.
    # The KSA -> GSA WI binding is added in the same commit.
    gcpServiceAccount: "app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# Production GIP tenant for FanZone customers.
gip:
  projectId: "tesseracthub-480811"
  tenantId: "Fanzone-ut25f"

# Istio VirtualService for auth.fanzonebattleground.com
virtualService:
  enabled: true
  gateway: "istio-ingress/tesseract-gateway"
  hosts:
    - "auth.fanzonebattleground.com"
  allowedOrigins:
    - "https://fanzonebattleground.com"
    - "https://www.fanzonebattleground.com"
