# =============================================================================
# FanZone Auth BFF - Keycloak OIDC Backend-For-Frontend
# Node.js service handling session management, OIDC flows, and token exchange
# =============================================================================

replicaCount: 1

image:
  repository: ghcr.io/tesserix/FanZone-Battle-Ground/fanzone-auth-bff
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  traffic.sidecar.istio.io/excludeOutboundPorts: "6379,8080"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 12
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="fanzone-auth-bff",reporter="destination"}[2m]))
    requestRateThreshold: "50"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8090"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"

  # Session configuration
  SESSION_MAX_AGE: "86400"
  SESSION_COOKIE_NAME: "fanzone_bff_session"
  SESSION_COOKIE_DOMAIN: ""
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "lax"

  # Base domain for hostname matching
  BASE_DOMAIN: "tesserix.app"

  # Allowed CORS origins - fanzone:// scheme for mobile, plus web domains
  ALLOWED_ORIGINS: "fanzone://,https://dev-fanzone.tesserix.app,https://*.tesserix.app"

  # FanZone Auth Go service — auth-bff routes all /auth/* calls here
  FANZONE_BASE_URL: "http://fanzone-auth.fanzone.svc.cluster.local"

  # Internal API key for token exchange with Go auth service
  INTERNAL_API_KEY: "fz-internal-k8s-exchange-key-2026"

  # Twilio configuration (for SMS/OTP verification)
  TWILIO_VERIFY_SERVICE_SID: ""

# ============================================================================
# KEYCLOAK OIDC CONFIGURATION
# FanZone realm for mobile/web authentication
# ============================================================================
keycloak:
  url: "https://devtest-customer-idp.tesserix.app"
  internalUrl: "http://keycloak.identity-customer.svc.cluster.local:8080"
  realm: "fanzone"
  clientId: "fanzone-bff"

# Redis configuration (for session store)
redis:
  host: "redis.redis-fanzone.svc.cluster.local"
  port: "6379"

# GCP Secret Manager Configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# Istio VirtualService configuration
virtualService:
  enabled: false
  gateway: "istio-ingress/tesseract-gateway"
  hosts: []
  allowedOrigins: []
