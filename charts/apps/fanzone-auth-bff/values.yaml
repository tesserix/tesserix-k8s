# =============================================================================
# FanZone Auth BFF - GIP Backend-For-Frontend
# Node.js service handling session management, OIDC flows, and token exchange
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-auth-bff
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude GCP metadata server from Istio for Workload Identity
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3


autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetMemoryUtilizationPercentage: 75

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 12
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="fanzone-auth-bff",reporter="destination"}[2m]))
    requestRateThreshold: "50"
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8090"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"

  # Session configuration
  SESSION_MAX_AGE: "86400"
  SESSION_COOKIE_NAME: "fanzone_bff_session"
  SESSION_COOKIE_DOMAIN: ""
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "lax"

  # Base domain for hostname matching
  BASE_DOMAIN: "tesserix.app"

  # Allowed CORS origins - fanzone:// scheme for mobile, plus web domains
  ALLOWED_ORIGINS: "fanzone://,https://dev-fanzone.tesserix.app,https://*.tesserix.app"

  # FanZone Auth Go service — auth-bff routes all /auth/* calls here
  FANZONE_BASE_URL: "http://fanzone-auth.fanzone.svc.cluster.local"

  # Internal API key for token exchange with Go auth service
  INTERNAL_API_KEY: "fz-internal-k8s-exchange-key-2026"

  # Twilio configuration (for SMS/OTP verification)
  TWILIO_VERIFY_SERVICE_SID: ""

# ============================================================================
# GIP (Google Identity Platform) CONFIGURATION
# Replaces the previous Keycloak OIDC flow. The BFF verifies Firebase
# ID tokens minted client-side by the Web SDK against this tenant.
# ============================================================================
gip:
  projectId: "tesseracthub-480811"
  tenantId: "Fanzone-ut25f"
  # Comma-separated additional tenants the BFF may verify tokens from
  # (rare — leave blank for single-tenant deployments).
  additionalTenantIds: ""

# Redis configuration (for session store)
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"

# GCP Secret Manager Configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# Istio VirtualService configuration
virtualService:
  enabled: false
  gateway: "istio-ingress/tesseract-gateway"
  hosts: []
  allowedOrigins: []
