namespace: mark8ly
name: mark8ly-storefront
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-storefront
  tag: "sha-493c3652c68d" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4203
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger — without it the HPA
    # reports FailedGetResourceMetric and never scales.
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
marketplaceApiUrl: "http://mark8ly-marketplace-api-storefront:8080"
# Shared secret for platform-api's /internal/* surface (RequireInternalAuth).
# Same secret admin pulls in. Marked optional so a missing secret no-ops
# the header for local dev — production must populate it.
platformInternalAuthSecret:
  secretName: mark8ly-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Internal URL for server-side auth-bff calls (server actions mint the
# session via /auth/auto-login). The browser never sees this — the
# storefront's own /sign-in page handles the client-side GIP flow.
authBffUrl: "http://mark8ly-auth-bff:8087"
# GIP config for customer sign-in (mp-customer tenant pool).
gipProjectId: "tesseracthub-480811"
gipCustomerTenantId: "MP-Customer-39opy"
# Peer service used by the wildcard VirtualService for the -admin split.
adminServiceName: mark8ly-admin
adminServicePort: 4202
# auth-bff service used by the wildcard VS for auth.mark8ly.com routing.
authBffServiceName: mark8ly-auth-bff
authBffServicePort: 8087
# Otto support-chat service — when enabled, the wildcard VS routes
# /api/v1/{storefront,admin}/otto/* directly to mp-otto for WebSocket
# support. Disabled by default so installs without otto stay clean.
ottoEnabled: true
# Cutover 2026-05-12: mark8ly now consumes the SHARED Otto in the
# support-platform namespace (per docs/08-otto-integration.md). The
# previous mark8ly-otto deployment is being retired; AI replies and
# multi-tenant routing live in support-platform.
ottoServiceName: support-platform-otto
ottoServiceNamespace: support-platform
ottoServicePort: 8089

# api.mark8ly.com → marketplace-api (mobile BFF gateway). Native apps
# call api.mark8ly.com directly; this routes the REST API to the Go
# engines (otto WS/REST is peeled off earlier by the otto path rules).
# Without this, api.mark8ly.com falls through to the storefront catch-all.
apiHost:
  enabled: true
  storefrontServiceName: mark8ly-marketplace-api-storefront
  adminServiceName: mark8ly-marketplace-api-admin
  servicePort: 8080

# UAT routing inside the prod wildcard VS.
#
# *.mark8ly.com Istio VS hosts can only be claimed by ONE VS at a time
# (cross-namespace conflicts are order-of-creation), so the prod
# wildcard has to know about UAT slugs too — otherwise per-tenant UAT
# subdomains like {slug}-admin-uat.mark8ly.com fall through to the
# prod storefront catch-all and 404. Toggle off if a separate cluster
# hosts UAT.
uatRoutes:
  enabled: true
  adminServiceName: mark8ly-uat-admin
  adminServiceNamespace: mark8ly-uat
  adminServicePort: 4202
  storefrontServiceName: mark8ly-uat-storefront
  storefrontServiceNamespace: mark8ly-uat
  storefrontServicePort: 4203

# Secret resource names — overridden in values-uat.yaml so the UAT
# overlay can swap to `mark8ly-uat-*` Secrets without retemplating.
secrets:
  gip: mark8ly-gip
  session: mark8ly-session
  otto: mark8ly-otto

# marketplace-api internal auth (used for X-Internal-Auth on server-
# side calls into marketplace-api-admin). Override in UAT.
marketplaceInternalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

# Storefront key — shared secret with marketplace-api storefront engine.
storefrontKey:
  secretName: mark8ly-marketplace-api-storefront-key
  secretKey: STOREFRONT_KEY

# Page-view analytics via the self-hosted OpenPanel at analytics.tesserix.app.
# The client ID is a public write key, so it lives in a Secret only because the
# project-init job is what mints it — nothing here is confidential.
openpanel:
  enabled: true
  secretName: openpanel-client-ids
  clientIdKey: storefront-client-id
  apiUrl: https://analytics.tesserix.app/api
