namespace: mark8ly
name: mark8ly-storefront
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-storefront
  tag: "sha-3da451ed2a02" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4203
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger — without it the HPA
    # reports FailedGetResourceMetric and never scales.
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
marketplaceApiUrl: "http://mark8ly-marketplace-api-storefront:8080"
# Internal URL for server-side auth-bff calls (server actions mint the
# session via /auth/auto-login). The browser never sees this — the
# storefront's own /sign-in page handles the client-side GIP flow.
authBffUrl: "http://mark8ly-auth-bff:8087"
# GIP config for customer sign-in (mp-customer tenant pool).
gipProjectId: "tesseracthub-480811"
gipCustomerTenantId: "MP-Customer-39opy"
# Peer service used by the wildcard VirtualService for the -admin split.
adminServiceName: mark8ly-admin
adminServicePort: 4202
# auth-bff service used by the wildcard VS for auth.mark8ly.com routing.
authBffServiceName: mark8ly-auth-bff
authBffServicePort: 8087
# Otto support-chat service — when enabled, the wildcard VS routes
# /api/v1/{storefront,admin}/otto/* directly to mp-otto for WebSocket
# support. Disabled by default so installs without otto stay clean.
ottoEnabled: true
ottoServiceName: mark8ly-otto
ottoServicePort: 8089
