namespace: mark8ly
name: mark8ly-storefront
image:
  repository: ghcr.io/tesserix/mark8ly-storefront
  tag: "sha-0f218b688f58" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4203
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
marketplaceApiUrl: "http://mark8ly-marketplace-api-storefront:8080"
# Peer service used by the wildcard VirtualService for the -admin split.
adminServiceName: mark8ly-admin
adminServicePort: 4202
