namespace: mark8ly
name: mark8ly-storefront
image:
  repository: ghcr.io/tesserix/mark8ly-storefront
  tag: "sha-00df558ea9a7"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4203
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
pdb:
  enabled: true
  minAvailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
# Peer service used by the wildcard VirtualService for the -admin split.
adminServiceName: mark8ly-admin
adminServicePort: 4202
