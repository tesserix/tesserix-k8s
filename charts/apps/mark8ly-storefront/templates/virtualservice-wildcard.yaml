# Single VirtualService for the *.mark8ly.com wildcard. Istio merges VSes for
# the same host poorly — to avoid that, admin and storefront both live in this
# one VS and are split by an authority-header regex match. The admin rule must
# come first so its regex wins before the catch-all route.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mark8ly-wildcard
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - "*.mark8ly.com"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # admin.mark8ly.com → admin (canonical sign-in host; this is the
    # single host registered with Google OAuth as an Authorized JS
    # Origin, so the sign-in popup works from exactly one place and
    # the session cookie — scoped to .mark8ly.com — carries across to
    # every per-tenant subdomain automatically).
    - match:
        - authority:
            exact: "admin.mark8ly.com"
      route:
        - destination:
            host: {{ .Values.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.adminServicePort }}
      timeout: 30s
    # {slug}-admin.mark8ly.com → admin
    - match:
        - authority:
            regex: "^[^.]+-admin\\.mark8ly\\.com$"
      route:
        - destination:
            host: {{ .Values.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.adminServicePort }}
      timeout: 30s
    # auth.mark8ly.com → auth-bff (customer sign-in/sign-out OAuth
    # flow). The storefront's lib/auth.ts builds login/logout URLs
    # that point here; the browser visits auth-bff directly, and the
    # session cookie (.mark8ly.com scope) carries back to the
    # storefront on the next request.
    - match:
        - authority:
            exact: "auth.mark8ly.com"
      route:
        - destination:
            host: {{ .Values.authBffServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.authBffServicePort }}
      timeout: 30s
    # Everything else under *.mark8ly.com → storefront
    - route:
        - destination:
            host: {{ .Values.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: 30s
