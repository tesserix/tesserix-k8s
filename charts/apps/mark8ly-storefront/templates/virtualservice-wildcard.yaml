# Single VirtualService for the *.mark8ly.com wildcard. Istio merges VSes for
# the same host poorly — to avoid that, admin and storefront both live in this
# one VS and are split by an authority-header regex match. The admin rule must
# come first so its regex wins before the catch-all route.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mark8ly-wildcard
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - "*.mark8ly.com"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    # Otto support-chat service — matched by path BEFORE the authority
    # matches so WebSocket upgrades and REST calls bypass the Next.js
    # apps. Upstream timeout is long to accommodate long-lived WS
    # sessions; Istio doesn't disconnect idle WebSockets within this
    # window. The path split keeps customer and staff traffic isolated
    # at the mesh level — mp-otto enforces the same split internally.
    {{- if .Values.ottoEnabled }}
    - match:
        - uri:
            prefix: /api/v1/storefront/otto/
      route:
        - destination:
            host: {{ .Values.ottoServiceName }}.{{ .Values.ottoServiceNamespace | default .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.ottoServicePort }}
      timeout: 3600s
    - match:
        - uri:
            prefix: /api/v1/admin/otto/
      route:
        - destination:
            host: {{ .Values.ottoServiceName }}.{{ .Values.ottoServiceNamespace | default .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.ottoServicePort }}
      timeout: 3600s
    {{- end }}
    # admin.mark8ly.com → admin (canonical sign-in host; this is the
    # single host registered with Google OAuth as an Authorized JS
    # Origin, so the sign-in popup works from exactly one place and
    # the session cookie — scoped to .mark8ly.com — carries across to
    # every per-tenant subdomain automatically).
    - match:
        - authority:
            exact: "admin.mark8ly.com"
      route:
        - destination:
            host: {{ .Values.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.adminServicePort }}
      timeout: 30s
    # {slug}-admin.mark8ly.com → admin
    - match:
        - authority:
            regex: "^[^.]+-admin\\.mark8ly\\.com$"
      route:
        - destination:
            host: {{ .Values.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.adminServicePort }}
      timeout: 30s
    # auth.mark8ly.com → auth-bff (customer sign-in/sign-out OAuth
    # flow). The storefront's lib/auth.ts builds login/logout URLs
    # that point here; the browser visits auth-bff directly, and the
    # session cookie (.mark8ly.com scope) carries back to the
    # storefront on the next request.
    - match:
        - authority:
            exact: "auth.mark8ly.com"
      route:
        - destination:
            host: {{ .Values.authBffServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.authBffServicePort }}
      timeout: 30s
    {{- if and .Values.apiHost .Values.apiHost.enabled }}
    # api.mark8ly.com → marketplace-api (mobile BFF gateway). The otto
    # path rules at the top of this VS already peel off the WebSocket +
    # otto REST for every host, so only the mobile REST API reaches here:
    # /api/v1/mobile/admin/* goes to the admin engine, everything else
    # (mobile storefront incl. the support chat) to the storefront engine.
    - match:
        - authority:
            exact: "api.mark8ly.com"
          uri:
            prefix: /api/v1/mobile/admin/
      route:
        - destination:
            host: {{ .Values.apiHost.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.apiHost.servicePort }}
      timeout: 30s
    # Pub/Sub push delivery for merchant device notifications. Must reach the
    # ADMIN engine (where the handler + push-token store live), so it needs an
    # explicit route BEFORE the storefront fallthrough. The endpoint is
    # OIDC-verified in-handler, so exposing just this one path is safe;
    # /internal/* stays unrouted (private).
    - match:
        - authority:
            exact: "api.mark8ly.com"
          uri:
            prefix: /pubsub/merchant-push
      route:
        - destination:
            host: {{ .Values.apiHost.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.apiHost.servicePort }}
      timeout: 30s
    # Resend delivery-event webhook (mark8ly#348B). Must reach the ADMIN
    # engine, where the email_sends rows and the applier live, so it needs an
    # explicit route BEFORE the storefront fallthrough — same reasoning as
    # the Pub/Sub push route above.
    #
    # The caller is Resend and holds no session, no Firebase token and no
    # internal secret: it authenticates with an HMAC signature verified
    # in-handler over the raw body, with a five-minute freshness bound. That
    # is why this is its own path rather than living under /api/v1/platform/*,
    # which is HMAC-signed by the CONSOLE under a different scheme — one
    # prefix carrying two auth models is how a future reader wires the wrong
    # one.
    #
    # /internal/* stays unrouted (private), exactly as the comment above says.
    - match:
        - authority:
            exact: "api.mark8ly.com"
          uri:
            prefix: /webhooks/resend
      route:
        - destination:
            host: {{ .Values.apiHost.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.apiHost.servicePort }}
      timeout: 30s
    # Stripe billing webhook (mark8ly#696). Same shape and same reason as the
    # Resend route above: the handler is mounted on the ADMIN engine — only
    # that Deployment carries STRIPE_BILLING_SECRET_KEY and
    # STRIPE_BILLING_WEBHOOK_SECRET, and `main.go` mounts the route only when
    # the webhook secret is set — so it needs an explicit rule BEFORE the
    # storefront fallthrough.
    #
    # WITHOUT THIS RULE THE PATH 404s. `api.mark8ly.com/webhooks/stripe-billing`
    # matched no rule and fell through to the catch-all at the bottom, which
    # sends `/` to the STOREFRONT service. The storefront has no Stripe env, so
    # the handler is nil there and the route is never registered. Verified
    # 2026-09-05 by POSTing the live URL: `404 page not found`.
    #
    # That had gone unnoticed because no Stripe webhook endpoint had ever been
    # configured to call it, so no delivery had ever failed. Nothing was
    # broken-looking; the path simply had no traffic.
    #
    # Like Resend, the caller holds no session and no internal secret: Stripe
    # authenticates with an HMAC signature over the raw body, verified
    # in-handler against STRIPE_BILLING_WEBHOOK_SECRET. Hence its own path
    # rather than /api/v1/platform/*, which is HMAC-signed by the CONSOLE under
    # a different scheme.
    - match:
        - authority:
            exact: "api.mark8ly.com"
          uri:
            prefix: /webhooks/stripe-billing
      route:
        - destination:
            host: {{ .Values.apiHost.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.apiHost.servicePort }}
      timeout: 30s
    # Tesserix platform console admin surface (mark8ly#274/#275/#276).
    # The console's endpoints live under /api/v1/platform/admin/* — their own
    # prefix, deliberately NOT the /api/v1/admin/* the merchant admin API uses.
    #
    # That separation is load-bearing for two reasons, and this rule is why
    # mark8ly mounts the surface on a distinct prefix at all:
    #
    #   1. The merchant admin API runs on this same engine and is intentionally
    #      NOT internet-reachable — the admin Next.js app proxies to it
    #      in-cluster and NEXT_PUBLIC_MARKETPLACE_API_URL is unset in prod. A
    #      rule broad enough to cover /api/v1/admin/ would publish the entire
    #      merchant admin surface (products, orders, stores, SSO config) as a
    #      side effect of exposing the console's endpoints.
    #
    #   2. The two surfaces collide inside gin. The platform's
    #      /admin/tenants/{id}/suspend (mark8ly#287) and the merchant's
    #      /admin/tenants/:tenantId/sso are two different wildcard names in the
    #      same path position, which panics at router build time — the service
    #      would fail to start.
    #
    # One prefix covers every endpoint in the series (#276-#289), so this rule
    # should not need touching again as they land.
    #
    # Safe to expose: the surface fails closed, answering 503 not_configured
    # until MARKETPLACE_PLATFORM_ADMIN_SECRET is populated, and every request
    # must carry a valid HMAC signature, a fresh single-use nonce and a
    # timestamp inside a 5-minute window.
    - match:
        - authority:
            exact: "api.mark8ly.com"
          uri:
            prefix: /api/v1/platform/
      route:
        - destination:
            host: {{ .Values.apiHost.adminServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.apiHost.servicePort }}
      timeout: 30s
    - match:
        - authority:
            exact: "api.mark8ly.com"
      route:
        - destination:
            host: {{ .Values.apiHost.storefrontServiceName }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.apiHost.servicePort }}
      timeout: 30s
    {{- end }}
    {{- if and .Values.uatRoutes .Values.uatRoutes.enabled }}
    # {slug}-admin-uat.mark8ly.com → UAT admin (cross-namespace).
    # Per-tenant UAT admin subdomains fall through this wildcard VS
    # because only EXACT host VSes (admin-uat.mark8ly.com) live in
    # the mark8ly-uat namespace.
    - match:
        - authority:
            regex: "^[^.]+-admin-uat\\.mark8ly\\.com$"
      route:
        - destination:
            host: {{ .Values.uatRoutes.adminServiceName }}.{{ .Values.uatRoutes.adminServiceNamespace }}.svc.cluster.local
            port:
              number: {{ .Values.uatRoutes.adminServicePort }}
      timeout: 30s
    # {slug}-uat.mark8ly.com → UAT storefront (cross-namespace).
    # The exact-host hits (uat.mark8ly.com, admin-uat.mark8ly.com,
    # onboarding-uat.mark8ly.com, uat-landing.mark8ly.com) all have
    # their own VSes in mark8ly-uat that win on host-priority, so
    # this regex only catches per-slug storefront URLs.
    - match:
        - authority:
            regex: "^[^.]+-uat\\.mark8ly\\.com$"
      route:
        - destination:
            host: {{ .Values.uatRoutes.storefrontServiceName }}.{{ .Values.uatRoutes.storefrontServiceNamespace }}.svc.cluster.local
            port:
              number: {{ .Values.uatRoutes.storefrontServicePort }}
      timeout: 30s
    {{- end }}
    # Everything else under *.mark8ly.com → storefront
    - route:
        - destination:
            host: {{ .Values.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: 30s
