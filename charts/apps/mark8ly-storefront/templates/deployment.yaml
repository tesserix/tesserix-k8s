apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- if .Values.openpanel.enabled }}
            # Written into this namespace by the openpanel project-init job;
            # optional so a first deploy doesn't block on the job finishing.
            - name: OPENPANEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openpanel.secretName }}
                  key: {{ .Values.openpanel.clientIdKey }}
                  optional: true
            - name: OPENPANEL_API_URL
              value: {{ .Values.openpanel.apiUrl | quote }}
            {{- end }}
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            - name: MARKETPLACE_API_URL
              value: {{ .Values.marketplaceApiUrl | quote }}
            - name: AUTH_BFF_URL
              value: {{ .Values.authBffUrl | quote }}
            - name: GIP_PROJECT_ID
              value: {{ .Values.gipProjectId | quote }}
            - name: GIP_CUSTOMER_TENANT_ID
              value: {{ .Values.gipCustomerTenantId | quote }}
            - name: GIP_WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gip }}
                  key: GIP_WEB_API_KEY
            - name: SESSION_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.session }}
                  key: SESSION_ENCRYPT_KEY
            # Otto support-chat: server-side proxy target + shared-secret
            # header the Next.js /api/otto/* routes forward to mp-otto.
            # Optional — when the secret isn't provisioned, the /api/otto/*
            # routes still reach otto but without the extra trust header
            # (otto treats the check as permissive when its own env is
            # unset too).
            - name: OTTO_URL
              value: "http://{{ .Values.ottoServiceName }}.{{ .Values.ottoServiceNamespace | default .Values.namespace }}.svc.cluster.local:{{ .Values.ottoServicePort }}"
            - name: OTTO_INTERNAL_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.otto }}
                  key: INTERNAL_AUTH_SECRET
                  optional: true
            - name: OTTO_SESSION_COOKIE
              value: "otto_session"
            # Shared secret with platform-api's /internal/* surface.
            # Storefront server actions resolve {slug} → tenant_id/store_id
            # via /internal/stores/by-slug; without this header platform-api
            # 401's the call and customer sign-in (Google + email/password)
            # bounces back to /sign-in?error=store_not_found. Same secret
            # the admin pod mounts on its caller side.
            - name: PLATFORM_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformInternalAuthSecret.secretName }}
                  key: {{ .Values.platformInternalAuthSecret.secretKey }}
                  optional: true
            # Shared secret with marketplace-api (same as the admin
            # pod). Gates the storefront's /api/internal/orders/:id/{invoice,receipt}
            # routes so marketplace-api can fetch rendered PDFs to
            # attach to order emails without needing a customer
            # session cookie.
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplaceInternalAuthSecret.secretName }}
                  key: INTERNAL_AUTH_SECRET
            # Storefront-key gate. marketplace-api's storefront engine
            # checks `X-Storefront-Key` on every /api/v1/storefront/...
            # call. Without this env, the proxy in apps/storefront/app/api
            # silently strips the header and every authenticated request
            # (account, orders, addresses, gift-cards, …) gets blanket
            # 404'd by RequireStorefrontKey. Same secret marketplace-api-storefront
            # mounts on its receiving side.
            - name: MARKETPLACE_STOREFRONT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storefrontKey.secretName }}
                  key: STOREFRONT_KEY
          # Probes hit a static API health route, not /. SSR'ing the
          # homepage was timing out under cold-start at the default 1s
          # probe timeout and triggering false-positive restarts.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/storefront/.next/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
