# UAT overlay for mark8ly-storefront.
namespace: mark8ly-uat
name: mark8ly-uat-storefront

keda:
  minReplicaCount: 1
  maxReplicaCount: 2
pdb:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 96Mi

platformApiUrl: "http://mark8ly-uat-platform-api:8086"
marketplaceApiUrl: "http://mark8ly-uat-marketplace-api-storefront:8080"
platformInternalAuthSecret:
  secretName: mark8ly-uat-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

authBffUrl: "http://mark8ly-uat-auth-bff:8087"

# NOTE: this MUST match what's baked into the storefront's client JS
# bundle (NEXT_PUBLIC_GIP_CUSTOMER_TENANT_ID, set at CI-build time).
# CI bakes the prod tenant ID, so UAT runtime has to use the prod
# tenant too — otherwise the browser-side Firebase call goes to the
# prod tenant but the server-side id_token verify expects the UAT
# tenant, the verify rejects with a tenant-mismatch, and the
# customer flow loops on /sign-in.
#
# The proper fix is to lift NEXT_PUBLIC_GIP_* out of the build bundle
# (server-side resolve from the request host, then pass to client
# via props/data attribute) so prod and UAT can use distinct tenants.
# Tracked as Phase 7 GIP-isolation refactor in the runbook.
gipProjectId: "tesseracthub-480811"
gipCustomerTenantId: "MP-Customer-39opy"

# Wildcard VS peers — UAT siblings only.
adminServiceName: mark8ly-uat-admin
adminServicePort: 4202
authBffServiceName: mark8ly-uat-auth-bff
authBffServicePort: 8087
ottoEnabled: true
ottoServiceName: mark8ly-uat-otto
ottoServicePort: 8089

# Override secret names to the UAT-side ExternalSecret targets.
secrets:
  gip: mark8ly-uat-gip
  session: mark8ly-uat-session
  otto: mark8ly-uat-otto

marketplaceInternalAuthSecret:
  secretName: mark8ly-uat-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

storefrontKey:
  secretName: mark8ly-uat-marketplace-api-storefront-key
  secretKey: STOREFRONT_KEY
