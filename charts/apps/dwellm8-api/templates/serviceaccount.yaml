{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dwellm8-api.serviceAccountName" . }}
  labels:
    {{- include "dwellm8-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    # Workload Identity: the pod's ambient credential, used by the blob store
    # to impersonate the GCS signer SA. No exported key anywhere.
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
