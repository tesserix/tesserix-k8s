apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dwellm8-api.fullname" . }}
  labels:
    {{- include "dwellm8-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dwellm8-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "dwellm8-api.selectorLabels" . | nindent 8 }}
        {{- include "dwellm8-api.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dwellm8-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for the process to stop being ready, let one probe interval
      # pass, and then finish the requests it already accepted.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            # The platform role, for the one path that needs it: the webhook
            # inbox, written before anybody knows whose money a delivery is
            # about. A wider connection than a request handler should ever hold,
            # so it is confined to that path and named separately here rather
            # than being what DATABASE_URL happens to be.
            - name: PLATFORM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.platformSecretName }}
                  key: username
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.platformSecretName }}
                  key: password
            - name: PLATFORM_DATABASE_URL
              value: "postgres://$(PLATFORM_DB_USER):$(PLATFORM_DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
            {{- if .Values.events.natsURL }}
            # ADR-0002. The relay drains the outbox from inside this process; a
            # broker that is unreachable accumulates rows rather than failing a
            # request, so this is not a startup dependency.
            - name: NATS_URL
              value: {{ .Values.events.natsURL | quote }}
            - name: EVENTS_RELAY_ENABLED
              value: {{ .Values.events.relayEnabled | quote }}
            {{- end }}
            {{- if .Values.workflow.hostPort }}
            # ADR-0015. Present so the API can start a durable operation; the
            # worker that runs them is its own deployment.
            - name: TEMPORAL_HOSTPORT
              value: {{ .Values.workflow.hostPort | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.workflow.namespace | quote }}
            {{- end }}
            {{- if .Values.gcp.secretManager.enabled }}
            # ADR-0027. Not a secret: verifying a GIP token needs Google's public
            # certificates and the project id. The API refuses to start without
            # it outside dev, because a server that cannot verify a token and
            # starts anyway is a server that will eventually trust one.
            - name: GIP_PROJECT_ID
              value: {{ .Values.identity.projectId | quote }}
            - name: PAYMENT_PROVIDERS
              value: {{ .Values.payments.providers | quote }}
            - name: CASHFREE_BASE_URL
              value: {{ .Values.payments.cashfree.baseUrl | quote }}
            - name: CASHFREE_API_VERSION
              value: {{ .Values.payments.cashfree.apiVersion | quote }}
            {{- if .Values.payments.cashfree.allowSandboxInProd }}
            - name: CASHFREE_ALLOW_SANDBOX_IN_PROD
              value: "true"
            {{- end }}
            - name: CASHFREE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "dwellm8-api.fullname" . }}-payments
                  key: CASHFREE_CLIENT_ID
            - name: CASHFREE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dwellm8-api.fullname" . }}-payments
                  key: CASHFREE_CLIENT_SECRET
            - name: CASHFREE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dwellm8-api.fullname" . }}-payments
                  key: CASHFREE_WEBHOOK_SECRET
            - name: PAYOUT_FP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dwellm8-api.fullname" . }}-payments
                  key: PAYOUT_FP_KEY
            {{- if .Values.esign.docUrlKeySecret }}
            - name: DOCURL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dwellm8-api.fullname" . }}-payments
                  key: DOCURL_KEY
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything that writes needs a mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
