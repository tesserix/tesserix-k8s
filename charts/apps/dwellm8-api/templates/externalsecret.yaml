{{- if .Values.gcp.secretManager.enabled }}
# Aggregator credentials, reconciled from GCP Secret Manager. Nothing sensitive
# is in this chart or in any values file — the names below are pointers.
#
# They point at the Cashfree *sandbox* pair while Dwellm8's own merchant account
# is being opened, and the secrets they name belong to HomeChef. That is a
# deliberate, temporary arrangement and it is safe only because the credentials
# are test ones: no real money can move through them, and a shared merchant
# account for real collections would settle Dwellm8's rent into HomeChef's bank.
# The switch is these two names, and nothing else in the chart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dwellm8-api.fullname" . }}-payments
  labels:
    {{- include "dwellm8-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "dwellm8-api.fullname" . }}-payments
    creationPolicy: Owner
  data:
    - secretKey: CASHFREE_CLIENT_ID
      remoteRef:
        key: {{ .Values.payments.cashfree.clientIdSecret }}
    - secretKey: CASHFREE_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.payments.cashfree.clientSecretSecret }}
    # Cashfree signs webhooks with the merchant secret key, so this is the same
    # value as the client secret today. It is a separate entry because that is a
    # fact about their current scheme, and the day it stops being true should be
    # a one-line change here rather than an outage.
    - secretKey: CASHFREE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.payments.cashfree.webhookSecretSecret | default .Values.payments.cashfree.clientSecretSecret }}
    # The payout-account fingerprint key (dwellm8#227). The Secret Manager value
    # is development-grade until rotated per USER_REQUIREMENT.md item 2 —
    # rotation orphans existing fingerprints, so it is a decision, not a chore.
    - secretKey: PAYOUT_FP_KEY
      remoteRef:
        key: {{ .Values.payouts.fingerprintKeySecret }}
    # The eSign docUrl signing key (dwellm8#212). Rotation kills every URL in
    # flight, which is at worst one signing window — safe to rotate, unlike the
    # fingerprint key above. Conditional so a missing Secret Manager entry
    # cannot wedge the whole -payments secret and every rollout behind it.
    {{- if .Values.esign.docUrlKeySecret }}
    - secretKey: DOCURL_KEY
      remoteRef:
        key: {{ .Values.esign.docUrlKeySecret }}
    {{- end }}
{{- end }}
