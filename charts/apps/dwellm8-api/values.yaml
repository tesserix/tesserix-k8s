# The Dwellm8 API.
#
# One deployable per ADR-0001: eight modules, one database, one transaction
# boundary. Everything below is sized for a service that has not yet taken a
# paying customer — raise it deliberately, with a number to justify it.

replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/dwellm8/dwellm8-api
  pullPolicy: IfNotPresent
  # Kargo will own this once the Warehouse is wired; pinned by digest-bearing
  # tag until then, because "latest" is not a version.
  tag: "main-c972395ebbd1221fd9faa820be1d1f81a0b884fd"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

# Memory only. The platform sets no CPU requests or limits anywhere.
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 768Mi

# Scaling on memory, not CPU: a ScaledObject with a CPU trigger fails admission
# on this platform, because there are no CPU requests to scale against.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetMemoryUtilizationPercentage: 75

env:
  APP_ENV: prod
  LOG_LEVEL: info
  PORT: "8080"
  SHUTDOWN_GRACE_SECONDS: "20"

# Payments. ADR-0011 chain and ADR-0022's adapter configuration.
#
# The chain is data: Cashfree first, offline last. Offline is appended by the
# process whether or not it is named here, because a deployment that loses its
# aggregator and cannot record a cash payment cannot take rent at all.
payments:
  providers: "cashfree,offline"
  cashfree:
    # Sandbox while Dwellm8's own merchant account is opened. Switching to live
    # is this URL, the two secret names below, and dropping allowSandboxInProd.
    baseUrl: "https://sandbox.cashfree.com/pg"
    # Pinned. Cashfree versions its API by date in a header, so an unpinned
    # client changes behaviour on their release day rather than on ours.
    apiVersion: "2023-08-01"

    # Secret Manager names, not values. These are HomeChef's Cashfree *test*
    # credentials, borrowed while Dwellm8's merchant account is opened — safe
    # only because they are test credentials. Note that prod-homechef-cashfree-
    # app-id (no -test-) also holds a TEST credential today, so the unprefixed
    # name is not a live one and must not be treated as the switch to live.
    clientIdSecret: "prod-homechef-cashfree-test-app-id"
    clientSecretSecret: "prod-homechef-cashfree-test-secret-key"
    # Defaults to clientSecretSecret — Cashfree signs with the merchant secret.
    webhookSecretSecret: ""

    # The API refuses to start as APP_ENV=prod against sandbox credentials
    # unless this says the arrangement is deliberate. It reads the credential
    # rather than this flag to decide what "sandbox" means, so the flag can only
    # acknowledge the situation, never disguise it. Remove it with the switch to
    # a live merchant account.
    allowSandboxInProd: true

gcp:
  secretManager:
    enabled: true
    secretStore: gcp-secret-store
    refreshInterval: 1h

# The API connects as dwellm8_api — ADR-0003 §3's request role. Never as the
# owner: the owner is the one role FORCE row level security exists to contain,
# and it holds CREATEROLE for the schema bootstrap. The secret is reconciled by
# CNPG from Secret Manager (see dwellm8-postgres applicationRoles).
database:
  secretName: dwellm8-postgres-api-credentials
  # ADR-0011 §5. The inbox is a platform-role path, because the webhook handler
  # runs before it knows whose money the delivery concerns.
  platformSecretName: dwellm8-postgres-platform-credentials
  host: dwellm8-postgres-rw.dwellm8.svc.cluster.local
  port: 5432
  name: dwellm8
  sslMode: require

# Probes match the process: liveness ignores dependencies, readiness does not,
# and the pod drains for one probe interval before it stops accepting.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 3
    failureThreshold: 2

terminationGracePeriodSeconds: 40

pdb:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
