{{- if .Values.monitoring.enablePodMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.clusterName }}-alerts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: database
    role: alert-rules
spec:
  groups:
    - name: {{ .Values.clusterName }}.rules
      rules:
        # Instance down
        - alert: CNPGInstanceDown
          expr: cnpg_collector_up{cluster={{ .Values.clusterName | quote }}} == 0
          for: 5m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "CNPG instance {{ "{{" }} $labels.pod {{ "}}" }} is down"
            description: "PostgreSQL instance {{ "{{" }} $labels.pod {{ "}}" }} in cluster {{ .Values.clusterName }} has been down for more than 5 minutes."

        # Replication lag (standby is behind primary)
        - alert: CNPGReplicationLag
          expr: cnpg_pg_replication_lag{cluster={{ .Values.clusterName | quote }}} > 30
          for: 5m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Replication lag on {{ "{{" }} $labels.pod {{ "}}" }}"
            description: "Replica {{ "{{" }} $labels.pod {{ "}}" }} is {{ "{{" }} $value {{ "}}" }}s behind primary in cluster {{ .Values.clusterName }}."

        # Replication lag critical
        - alert: CNPGReplicationLagCritical
          expr: cnpg_pg_replication_lag{cluster={{ .Values.clusterName | quote }}} > 300
          for: 5m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Critical replication lag on {{ "{{" }} $labels.pod {{ "}}" }}"
            description: "Replica {{ "{{" }} $labels.pod {{ "}}" }} is {{ "{{" }} $value {{ "}}" }}s behind primary in cluster {{ .Values.clusterName }}."

        # WAL archiving failing
        - alert: CNPGWALArchiveFailing
          expr: cnpg_collector_pg_wal_archive_status{cluster={{ .Values.clusterName | quote }},value="failed"} > 0
          for: 10m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "WAL archiving failing for {{ .Values.clusterName }}"
            description: "WAL archiving has been failing for more than 10 minutes. Backups and PITR are at risk."

        # WAL accumulation (>1GB of WAL files)
        - alert: CNPGWALAccumulation
          expr: cnpg_collector_pg_wal{cluster={{ .Values.clusterName | quote }},value="size"} > 1073741824
          for: 15m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "WAL accumulation on {{ .Values.clusterName }}"
            description: "WAL files have grown to {{ "{{" }} $value | humanize1024 {{ "}}" }}. Check archiving and replication slots."

        # Sync replica mismatch
        - alert: CNPGSyncReplicaMismatch
          expr: cnpg_collector_sync_replicas{cluster={{ .Values.clusterName | quote }},value="observed"} < cnpg_collector_sync_replicas{cluster={{ .Values.clusterName | quote }},value="expected"}
          for: 10m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Sync replica count mismatch for {{ .Values.clusterName }}"
            description: "Expected {{ "{{" }} $labels.expected {{ "}}" }} sync replicas but only {{ "{{" }} $value {{ "}}" }} are available. Data durability is degraded."

        # High connection usage (>80% of max_connections)
        - alert: CNPGHighConnectionUsage
          expr: cnpg_collector_pg_stat_activity{cluster={{ .Values.clusterName | quote }},state="active"} > ({{ .Values.postgresql.max_connections | default "200" }} * 0.8)
          for: 5m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "High connection usage on {{ .Values.clusterName }}"
            description: "Active connections are above 80% of max_connections."

        # Long-running transactions (>10 minutes)
        - alert: CNPGLongRunningTransaction
          expr: cnpg_collector_pg_long_running_transactions{cluster={{ .Values.clusterName | quote }}} > 600
          for: 5m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Long-running transaction on {{ .Values.clusterName }}"
            description: "A transaction has been running for more than {{ "{{" }} $value {{ "}}" }}s."
{{- end }}
