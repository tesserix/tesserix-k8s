hibernate: false

namespace: gameverse
clusterName: gameverse-postgres

instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Storage — separate WAL volume for I/O isolation
# Actual data ~8MB (single database), but 10Gi for growth headroom.
storageSize: 10Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

# Bootstrap — primary database for the GameVerse namespace
bootstrap:
  database: gameverse
  owner: gameverse
  # Secret must contain 'username' and 'password' keys (CNPG basic-auth format).
  # Created by ExternalSecret from GCP Secret Manager.
  secret: gameverse-postgres-app-credentials
  gcpSecretName: prod-gameverse-postgresql-password
  # No additional databases needed — single DB.
  postInitSQL: []

# PostgreSQL tuning
postgresql:
  max_connections: "200"
  shared_buffers: "256MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots
  max_slot_wal_keep_size: "10GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  schedule: "0 40 3 * * *"
  destinationPath: "gs://tesseract-prod-backups-in/gameverse-postgres"
  retentionPolicy: "3d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-gameverse-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 1
  maxClientConn: "1000"
  defaultPoolSize: "20"

# Monitoring — CNPG built-in Prometheus exporter on port 9187
monitoring:
  enablePodMonitor: true

# Replication
affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 0
  maxSyncReplicas: 0
