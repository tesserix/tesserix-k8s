# beautyandcruor.com
#
# NOTE ON WHICH FILE PROD READS: the ArgoCD Application loads values.yaml plus
# ../global-config.yaml and never values-prod.yaml — the same wiring the blog
# chart carries a warning about. So THIS file is production. There is
# deliberately no values-prod.yaml; a second file here would look authoritative
# and be ignored.
#
# This is a fully static site: a Next.js `output: 'export'` build served by
# nginx-unprivileged. No Node process at runtime, no database, no session, no
# auth. Consequences that differ from every other Next.js chart in this repo:
#   - port 8080, not 3000 (nginx-unprivileged binds above 1024 so it can run
#     as uid 101 under a read-only root filesystem)
#   - health path /healthz, not /api/health — see nginx.conf in the app repo
#   - no ExternalSecret: the app holds no credentials at all
#   - only /tmp needs to be writable; there is no .next/cache to mount

replicaCount: 1

cloudRun:
  enabled: false

# =============================================================================
# Domain
# =============================================================================
# STAGING HOST, not the real domain yet.
#
# beautyandcruor.com still resolves to the old WordPress site at Hostinger and
# will until the rebuild is finished and a cutover is planned. Serving from a
# tesserix.app subdomain in the meantime means the new site is publicly
# reachable without touching a client's live DNS.
#
# When the cutover happens: set primary to beautyandcruor.com, add
# www.beautyandcruor.com as an alias, flip tls.enabled to true (which brings
# back this chart's own Gateway and Certificate) and empty `gateways`.
domains:
  primary: beautyandcruor.tesserix.app
  aliases: []

# Gateways the VirtualService binds to when this chart is NOT carrying its own.
#
# *.tesserix.app arrives through the Cloudflare Tunnel in the cloudflared
# namespace, which terminates TLS at Cloudflare's edge and forwards plain HTTP
# to the ingress gateway. That is why blog.tesserix.app has no Certificate in
# the cluster and neither does this — asking cert-manager for one would leave
# it stuck pending forever, since the challenge could never be answered.
gateways:
  - istio-ingress/tesseract-gateway
  - istio-ingress/custom-domain-gateway

# =============================================================================
# Container image
# =============================================================================
image:
  # In-region Artifact Registry mirror of ghcr.io, as per the other charts.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/beautyandcruor
  pullPolicy: Always
  # PINNED to the build tag, not "latest".
  #
  # "latest" is currently unresolvable through the mirror: kubelet requested it
  # for 22 minutes before CI had pushed anything, and Artifact Registry
  # negative-cached the 404. A fresh tag resolves immediately — main-a282da0
  # returns 200 through the same mirror while latest still returns
  # MANIFEST_UNKNOWN. Pinning sidesteps the stale cache entirely.
  #
  # It is also the house pattern: the blog pins main-<sha7> and lets Kargo
  # rewrite it on promotion. Until this app has a Kargo Project, bump this by
  # hand when deploying a new build.
  tag: "main-adf9f69"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Service account
# No Workload Identity binding: the running site never talks to GCP. Assets are
# uploaded to GCS by CI, not by the pod — so there is no gcp-service-account
# annotation here, unlike the blog which writes uploads at runtime.
# =============================================================================
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# =============================================================================
# Pod
# =============================================================================
podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsNonRoot: true
  runAsUser: 101      # nginx-unprivileged
  runAsGroup: 101
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Intentionally unset, matching the blog: traffic arrives via the Istio
# ingress gateway, not Kong. Kong crash-looped at the edge here.
ingress: null

# =============================================================================
# Resources — memory only. CPU requests/limits are omitted across every chart
# in this repo; workloads burst freely on shared spot nodes. nginx serving
# ~2 MB of static files needs very little.
# =============================================================================
resources:
  limits:
    memory: 128Mi
  requests:
    memory: 64Mi

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# preStop bridges the gap between endpoint removal and SIGTERM, same rationale
# as the blog: Istio endpoint discovery lags pod termination and in-flight
# requests RST during that window.
terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    sleep:
      seconds: 10

# =============================================================================
# Probes — /healthz is a literal `return 200` in nginx.conf, no filesystem hit.
# nginx starts in well under a second, so the startup probe is generous only to
# cover the Istio sidecar coming up alongside it.
# =============================================================================
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 10

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# =============================================================================
# Autoscaling — off. This is a brochure site for a single artist; one pod
# serving static files is ample, and KEDA on memory would never fire.
# =============================================================================
autoscaling:
  enabled: false
keda:
  enabled: false

# No minAvailable — the template falls back to maxUnavailable: 1, which stays
# evictable at one replica. minAvailable: 2 would pin disruptionsAllowed at 0
# and block every node drain, which is what bit the blog.
pdb:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# TLS — a dedicated Gateway and Certificate for this external domain.
#
# Named SANs, NOT a wildcard. beautyandcruor.com's CAA records at Cloudflare
# historically restricted `issuewild` to pki.goog and globalsign.com, which
# would have left a wildcard Certificate stuck un-Ready with the cause in DNS
# rather than the cluster. `0 issuewild "letsencrypt.org"` is present as of
# 2026-09-23 so a wildcard would work today, but this site only needs two
# hosts and named SANs cannot regress if that record is ever removed.
# =============================================================================
# OFF while the app serves from tesserix.app — see `domains` above.
#
# Leaving this on would create a Gateway and a Certificate for
# beautyandcruor.com, and cert-manager would retry an HTTP-01 challenge that
# cannot succeed: the domain still points at Hostinger, so Let's Encrypt would
# reach the old WordPress site instead of this cluster. A permanently pending
# Certificate in production is noise that teaches people to ignore alerts.
#
# Flip to true as part of the domain cutover, not before.
tls:
  enabled: false
  issuer: letsencrypt-prod
  secretName: beautyandcruor-com-tls
  gatewayNamespace: istio-ingress

# =============================================================================
# Environment
# The asset CDN base URL is deliberately ABSENT here. It is baked into the HTML
# at build time (static export), so it belongs to the Docker build as
# NEXT_PUBLIC_ASSET_BASE_URL and setting it at runtime would change nothing.
# Putting it here would imply a control this chart does not have.
# =============================================================================
env: {}

externalSecrets:
  enabled: false

vpa:
  enabled: false

gcp:
  projectId: ""
  namespace: "tesserix"

# ---------------------------------------------------------------------------
# Enquiry sidecar
#
# The site is a static export, so the browser cannot hold the Resend key and
# nginx cannot build Resend's payload on its own. This runs the smallest
# process that can, on loopback beside nginx. See enquiry/main.go in the app
# repo for the spam handling and why the recipient is not an input.
# ---------------------------------------------------------------------------
enquiry:
  enabled: true
  port: 8081

  image:
    repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/beautyandcruor-enquiry
    pullPolicy: Always
    # PINNED for the same reason the site image is — see the note above it.
    tag: "main-adf9f69"

  # Her own inbox, which is the address that actually receives.
  #
  # This closes OPEN-QUESTIONS #5, and neither published address survived it.
  # beautycruor.com carries NO MX record at all, so info@beautycruor.com could
  # never receive mail. beautyandcruor.com does have MX (Titan) and valid SPF,
  # so the domain is live — but info@ on it does not exist.
  #
  # Worth saying plainly somewhere: the contact address printed on the current
  # site reaches nobody. Any enquiry sent to it since the domain was set up is
  # gone. That is a finding about the old site, not a decision about this one.
  #
  # A mailbox on her own domain would read better on a site that is otherwise
  # hers throughout; this is the address that works today.
  to: "parimiti03@gmail.com"

  # MUST be a domain verified in the Resend account the key belongs to, or
  # every send is refused.
  #
  # tesserix.app is verified today — the blog sends from noreply@tesserix.app
  # on the same key — and beautyandcruor.com is not. That costs nothing here:
  # this mail goes to HER inbox to tell her an enquiry arrived, and reply_to
  # carries the producer's address, so the From domain is seen only by her and
  # replying still reaches the right person.
  #
  # Verify beautyandcruor.com and switch this only if the site ever mails the
  # enquirer — a confirmation, say — where the sender is customer-facing. That
  # is a new domain on the Resend account, and on the free tier a second
  # domain means a second account and therefore a second key below.
  from: "Beauty & Cruor <noreply@tesserix.app>"

  secretName: beautyandcruor-enquiry
  secretKey: RESEND_API_KEY

  externalSecret:
    enabled: true
    secretStoreRef: gcp-secret-store
    # Platform-wide shared key, not product-prefixed — the same remote the blog
    # reads (#1014).
    #
    # Point this at a product-specific secret if beautyandcruor ever gets its
    # own Resend account: only this value changes, not the template.
    remoteKey: prod-resend-api-key

  # It wakes up for a form post and is otherwise idle.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi
