{{- if .Values.tls.enabled }}
# NAMED SANs, NOT A WILDCARD — deliberate, see values.yaml.
#
# beautyandcruor.com's CAA records restricted `issuewild` to pki.goog and
# globalsign.com for most of this project's life, which makes a Let's Encrypt
# wildcard fail in a quietly confusing way: the Certificate simply never goes
# Ready and the cause is in DNS, not the cluster. `0 issuewild
# "letsencrypt.org"` is present as of 2026-09-23, so a wildcard would issue
# today — but this site needs exactly two hosts, and named SANs are immune if
# that record is ever changed back.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls
  namespace: {{ .Values.tls.gatewayNamespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.tls.issuer }}
  dnsNames:
    - {{ .Values.domains.primary | quote }}
    {{- range .Values.domains.aliases }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
