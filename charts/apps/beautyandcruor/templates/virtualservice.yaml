apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.domains.primary | quote }}
    {{- range .Values.domains.aliases }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    {{- if .Values.tls.enabled }}
    # This chart's own Gateway, for the real domain with its own certificate.
    - {{ .Values.tls.gatewayNamespace }}/{{ .Release.Name }}-gateway
    {{- else }}
    # Shared gateways: TLS is terminated by Cloudflare at the edge and the
    # tunnel forwards plain HTTP, so there is nothing for this chart to certify.
    {{- toYaml .Values.gateways | nindent 4 }}
    {{- end }}
  http:
    # Health check — no redirect, no auth, cheapest possible path.
    - match:
        - uri:
            prefix: /healthz
      route:
        - destination:
            host: {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}

    # Everything else is static HTML from nginx. Retries are safe here because
    # every route is a GET of an immutable file — there is nothing to replay.
    - route:
        - destination:
            host: {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
