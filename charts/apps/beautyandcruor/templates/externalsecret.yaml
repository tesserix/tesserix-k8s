{{- if and .Values.enquiry.enabled .Values.enquiry.externalSecret.enabled }}
# The Resend key, synced from GCP Secret Manager exactly as tesserix-blog does
# it. prod-resend-api-key is the platform-wide shared key, not a per-product
# one, so it is referenced by that name rather than behind a secret prefix.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.enquiry.secretName }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.enquiry.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.enquiry.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.enquiry.secretKey }}
      remoteRef:
        key: {{ .Values.enquiry.externalSecret.remoteKey }}
{{- end }}

{{- if and .Values.enquiry.enabled .Values.enquiry.admin.enabled }}
---
# The credits editor's three secrets.
#
# A SEPARATE ExternalSecret, not three more keys on the one above, and the
# separation is the point. An ExternalSecret is all-or-nothing: one unreadable
# remoteRef fails the whole object and the Kubernetes Secret it owns stops
# being written. Folded together, a typo in an admin secret name would take
# RESEND_API_KEY with it and the pod would lose the contact form — the
# launch-blocking half of this service — because of a mistake in the half that
# is a convenience.
#
# Same failure this platform has already produced once: a Kargo Warehouse
# reported Ready with zero Freight because a single unreadable subscription
# failed all of them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.enquiry.admin.secretName }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.enquiry.admin.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.enquiry.admin.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: password-hash
      remoteRef:
        key: {{ .Values.enquiry.admin.externalSecret.keys.passwordHash }}
    - secretKey: session-key
      remoteRef:
        key: {{ .Values.enquiry.admin.externalSecret.keys.sessionKey }}
    - secretKey: github-token
      remoteRef:
        key: {{ .Values.enquiry.admin.externalSecret.keys.githubToken }}
{{- end }}
