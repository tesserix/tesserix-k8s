{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations (and .Values.enquiry.enabled .Values.enquiry.admin.uploads.enabled) }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.enquiry.enabled .Values.enquiry.admin.uploads.enabled }}
    iam.gke.io/gcp-service-account: {{ .Values.enquiry.admin.uploads.gcpServiceAccount }}
    {{- end }}
  {{- end }}
# The site container calls no Google API and never did. The annotation and the
# mounted token appear only when image upload is on, because the enquiry
# sidecar then needs a Workload Identity token to write an original to its
# private bucket. Off, this is the same no-token ServiceAccount as before.
automountServiceAccountToken: {{ if and .Values.enquiry.enabled .Values.enquiry.admin.uploads.enabled }}true{{ else }}{{ .Values.serviceAccount.automount }}{{ end }}
{{- end }}
