{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Workload Identity annotation and no mounted token: a static nginx pod
# calls no Google API. CI writes the assets to GCS, not this pod.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
