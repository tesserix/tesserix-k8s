apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "common.podAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "common.serviceAccount" . }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.securityContext.readOnlyRootFilesystem }}
          # nginx.conf points every temp path at /tmp precisely so the root
          # filesystem can stay read-only. There is no .next/cache here —
          # nothing renders at runtime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
        {{- if .Values.enquiry.enabled }}
        # The enquiry sidecar. Listens on loopback only — nginx proxies
        # /api/enquiry to it — so it is never routable from outside the pod
        # and needs no Service of its own. It exists because the site is a
        # static export: nothing in the browser can hold the Resend key.
        - name: enquiry
          image: "{{ .Values.enquiry.image.repository }}:{{ .Values.enquiry.image.tag }}"
          imagePullPolicy: {{ .Values.enquiry.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ENQUIRY_ADDR
              value: "127.0.0.1:{{ .Values.enquiry.port }}"
            - name: ENQUIRY_TO
              value: {{ .Values.enquiry.to | quote }}
            - name: ENQUIRY_FROM
              value: {{ .Values.enquiry.from | quote }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enquiry.secretName }}
                  key: {{ .Values.enquiry.secretKey }}
            {{- if .Values.enquiry.admin.enabled }}
            # The credits and running-order editor. All of this is gated: the
            # binary leaves /admin unrouted when ADMIN_PASSWORD_HASH is unset,
            # so the enquiry form comes up either way, but a secretKeyRef to a
            # Secret that does not exist yet would stop the pod starting at
            # all. Turning it on is therefore two steps in order — create the
            # secrets, then flip this — rather than one that half-works.
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enquiry.admin.secretName }}
                  key: password-hash
            - name: ADMIN_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enquiry.admin.secretName }}
                  key: session-key
            - name: ADMIN_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enquiry.admin.secretName }}
                  key: github-token
            - name: ADMIN_GITHUB_REPO
              value: {{ .Values.enquiry.admin.githubRepo | quote }}
            - name: ADMIN_GITHUB_BRANCH
              value: {{ .Values.enquiry.admin.githubBranch | quote }}
            {{- with .Values.enquiry.admin.assetBaseUrl }}
            # Must match the site image's ASSET_BASE_URL build arg: the
            # running-order pickers load thumbnails from the bucket, because
            # public/img is excluded from the site image and there is nothing
            # same-origin to point at. Left unset, the binary defaults to the
            # same bucket the Dockerfile does.
            - name: ADMIN_ASSET_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          # Deliberately no probe.
          #
          # An httpGet probe is run by the kubelet, from the node — it cannot
          # see this listener, which binds to loopback inside the pod so that
          # nothing outside can reach it. Pointing the probe at 127.0.0.1 made
          # the kubelet dial its own loopback and fail; dropping `host` would
          # make it dial the pod IP, where nothing is bound either. Binding
          # wider to satisfy a probe would trade away the isolation that is the
          # whole reason this runs as a sidecar. An exec probe is out too: the
          # binary sits on scratch with no shell.
          #
          # And readiness here would be wrong even if it worked. A container's
          # readiness gates the whole pod, so an unhealthy enquiry service
          # would pull the entire site out of rotation. The site is a portfolio
          # first: if this process is down the form returns 502 and every page
          # still serves, which is the behaviour to want.
          resources:
            {{- toYaml .Values.enquiry.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.securityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
