{{- if .Values.priorityClass.create }}
# Every node is Spot, so eviction order decides whether raft keeps quorum.
# A custom class, not system-cluster-critical: the cluster ResourceQuota
# reserves the system-* classes for system namespaces and rejects the pod
# outright — see charts/thirdparty/otel-agent/templates/daemonset.yaml.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
# The API server's default, stated rather than defaulted: left implicit, ArgoCD
# reads it back as drift and the app never reaches Synced.
preemptionPolicy: PreemptLowerPriority
description: >-
  Platform storage that other workloads depend on to start. Evicted after
  application pods, before anything in kube-system.
{{- end }}
