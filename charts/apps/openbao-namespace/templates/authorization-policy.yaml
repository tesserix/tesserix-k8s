# Mesh allow-list, layered on the NetworkPolicy: identity here, addresses
# there. A caller needs to pass both. Rules are L4 only — this namespace is
# ambient with no waypoint, so ztunnel enforces them and cannot evaluate an
# `operation.paths` condition; an ALLOW policy whose only rule is L7 has no
# valid rule and evaluates as deny-all.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-known-sources
  namespace: {{ .Values.namespace }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
{{- range .Values.allowedSources }}
              - {{ . | quote }}
{{- end }}
              # Metrics scraping. OpenBao's own token auth guards the rest of
              # the API on the same port.
              - monitoring
              # Raft peers, and the bootstrap and snapshot Jobs.
              - {{ .Values.namespace | quote }}
{{- if .Values.allowNonMeshSources }}
    # ztunnel derives `source.namespaces` from the caller's mTLS identity, so a
    # plaintext caller matches no namespace rule however it is labelled: ESO is
    # not ambient-enrolled and every login was reset with "allow policies exist,
    # but none allowed". Address-based allow on the API port only; the
    # NetworkPolicy still pins ingress to external-secrets and monitoring, and
    # OpenBao's own Kubernetes auth decides what the caller may read. Drop this
    # once ESO joins the mesh and `allowedPrincipals` can carry the rule.
    - from:
        - source:
            ipBlocks:
              - {{ .Values.podCIDR | quote }}
      to:
        - operation:
            ports: ["8200"]
{{- end }}
{{- if .Values.allowedPrincipals }}
    - from:
        - source:
            principals:
{{- range .Values.allowedPrincipals }}
              - "cluster.local/ns/{{ . | replace "/" "/sa/" }}"
{{- end }}
{{- end }}
---
# Zero-trust default: anything not matched by an ALLOW rule above is denied.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
spec:
  {}
