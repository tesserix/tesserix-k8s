namespace: openbao

# Namespaces whose workloads may reach the OpenBao API (8200). Nothing else
# gets past L3, whatever token it holds. Adding a namespace here is only half
# the grant — it still needs a Kubernetes auth role in the openbao chart's
# `bootstrap.kubernetesRoles`.
allowedSources:
  # ESO is the only intended reader: apps get Kubernetes Secrets, not tokens.
  - external-secrets
  # The admin console is the only intended *writer*, and the only caller that
  # creates policies and roles rather than reading secrets.
  - secret-service

allowedPodSources:
  - namespace: devai
    podLabels:
      app.kubernetes.io/name: devai-api
  - namespace: devai
    podLabels:
      app.kubernetes.io/name: devai-api-worker
  # mark8ly marketplace-api (mark8ly#319). Two deployments, two pod labels.
  #
  # NOTE for whoever adds the CronJobs in phase 4: a CronJob's pods carry a
  # DIFFERENT app.kubernetes.io/name (e.g.
  # mark8ly-marketplace-api-admin-refund-sweep) even though they run under the
  # admin ServiceAccount. The OpenBao role already covers them; this list does
  # not. That mismatch is what broke mark8ly#587 — same identity, different
  # label, silent timeout.
  - namespace: mark8ly
    podLabels:
      app.kubernetes.io/name: mark8ly-marketplace-api-admin
  - namespace: mark8ly
    podLabels:
      app.kubernetes.io/name: mark8ly-marketplace-api-storefront

# Istio principals allowed to call the API, on top of the NetworkPolicy.
# Format: <namespace>/<serviceaccount>. Only mesh-enrolled callers have one —
# see `allowedSources` for the rest.
#
# mark8ly is deliberately absent: the namespace is not mesh-enrolled
# (istio-injection: disabled, no istio.io/dataplane-mode), so its pods have no
# SPIFFE identity to match. They are admitted by allowNonMeshSources + the
# NetworkPolicy above. If mark8ly is ever ambient-enrolled, add
# mark8ly/mark8ly-marketplace-api-admin and .../-storefront here at the same time.
allowedPrincipals:
  - devai/devai-api

# Allow plaintext callers from the pod CIDR to reach 8200. `allowedSources`
# alone cannot admit ESO: ztunnel matches a namespace rule against the caller's
# mTLS identity, which a non-mesh caller does not have. Retire this with
# `peerAuthenticationMode` when ESO is ambient-enrolled.
allowNonMeshSources: true

# PERMISSIVE, not STRICT: `external-secrets` is not enrolled in the mesh (no
# `istio.io/dataplane-mode` label), so ESO dials OpenBao in plaintext with no
# SPIFFE identity. STRICT would reject it outright and nothing could ever read
# a secret. The NetworkPolicy above is the hard boundary; OpenBao's own
# Kubernetes auth is what authorises the caller. Move this to STRICT once ESO
# is ambient-enrolled, and put it back in `allowedPrincipals` at the same time.
peerAuthenticationMode: PERMISSIVE

# Cluster pod CIDR for the ambient HBONE NetworkPolicy. A wrong value silently
# kills all east-west traffic for the namespace.
podCIDR: 10.20.0.0/16

# kube-dns service IP. NodeLocal DNSCache answers locally, so a kube-system
# namespaceSelector never matches on its own.
dnsServiceIP: 10.30.0.10

# GKE control plane. Needed for `service_registration "kubernetes"` and for
# the TokenReview behind Kubernetes auth — and it sits inside the RFC1918
# range the general HTTPS egress rule excludes, so it needs its own allow.
apiServerCIDR: 172.16.0.0/28

# ClusterIP of the `kubernetes` service. Pods reach the API through this, not
# the master CIDR, and it sits in the 10.0.0.0/8 the general HTTPS egress rule
# excludes — so it needs its own allow too.
apiServerServiceIP: 10.30.0.1

# Scheduling priority for the OpenBao pods. Referenced by name from the
# openbao chart's `server.priorityClassName`.
priorityClass:
  create: true
  name: tesserix-platform-critical
  value: 900000
