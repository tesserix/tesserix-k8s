# Default values for settings-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/settings-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  # Istio sidecar configuration - wait for proxy before starting app
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  # Prometheus scraping annotations
  prometheus.io/scrape: "true"
  prometheus.io/port: "8085"
  prometheus.io/path: "/metrics"
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8085
  targetPort: 8085

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# KEDA ScaledObject configuration
# Disabled by default for devtest - enable via values-prod.yaml for production
keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  # Prometheus trigger for traffic-based scaling (Istio metrics)
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    # Scale based on requests per second to this service
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="settings-service",reporter="destination"}[2m]))
    requestRateThreshold: "50"  # Scale up when RPS > 50 per pod
  # Fallback CPU/Memory triggers
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
    - type: memory
      metricType: Utilization
      metadata:
        value: "85"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8085"
  GIN_MODE: "release"

  # Database (DB_HOST set via database.host to avoid duplicates)

  # NATS for event publishing
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # Keycloak configuration (for token validation)
  # Auth validator type: "keycloak" (RS256 only), "hybrid" (both RS256 and HS256), "legacy" (HS256 only)
  # Staff service for RBAC lookups (required for staff_id resolution)
  STAFF_SERVICE_URL: "http://staff-service.marketplace.svc.cluster.local:8080"
  AUTH_VALIDATOR_TYPE: "keycloak"
  KEYCLOAK_ISSUER_URL: "https://devtest-customer-idp.tesserix.app/realms/tesserix-customer"

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration - centralized for easy modification
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "settings_db"
  user: "postgres"
  sslmode: "require"

# Redis configuration
# PERFORMANCE: Redis caching for distributed rate limiting and currency cache
redis:
  enabled: true
  host: "redis.redis-marketplace.svc.cluster.local"
  port: "6379"
  db: "0"
  existingSecret: "redis"           # K8s secret name in marketplace namespace
  existingSecretKey: "redis-password"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
