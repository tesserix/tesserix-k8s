{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "audit-service.fullname" . }}-config
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: "postgresql.postgresql-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "audit_logs"
  DB_USER: "postgres"
  DB_SSLMODE: "require"
  DB_SSL_MODE: "require"
  PGSSLMODE: "require"
  PORT: "8080"
  TENANT_REGISTRY_URL: "http://tenant-service.marketplace.svc.cluster.local"
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local"
  OPENFGA_AUTH_MODE: "mesh"
  OPENFGA_PLATFORM_STORE_ID: "01KKTK8C6EDRT12ENHAS9PJQN9"
{{- end }}
