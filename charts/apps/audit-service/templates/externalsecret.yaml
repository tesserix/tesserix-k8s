{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "audit-service.fullname" . }}-secrets
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "audit-service.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: audit-db-password
    - secretKey: OPENFGA_API_KEY
      remoteRef:
        key: openfga-preshared-key
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: shared-internal-service-key
{{- end }}
