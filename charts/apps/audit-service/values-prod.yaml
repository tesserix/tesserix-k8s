knative:
  enabled: true
  minScale: 1
  scaleToZeroDelay: "120s"
  stableWindow: "300s"

# Production overrides for audit-service

image:
  repository: ghcr.io/tesserix/audit-service

# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 3

# Production resource allocation
resources:
  limits:
    memory: 1536Mi
  requests:
    memory: 384Mi

# Production environment
env:
  GIN_MODE: "release"
  APP_ENV: "production"
  LOG_LEVEL: "info"
  # Production Keycloak
  KEYCLOAK_ISSUER_URL: "https://identity.fanzonebattleground.com/realms/tesserix-customer"
  CORS_ALLOWED_ORIGINS: "https://*.mark8ly.com"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: true
  minReplicaCount: 3
  maxReplicaCount: 25
  pollingInterval: 15
  cooldownPeriod: 300
  prometheus:
    enabled: true
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    requestRateQuery: "sum(rate(istio_requests_total{destination_canonical_service=\"audit-service\",reporter=\"destination\"}[2m]))"
    requestRateThreshold: "100"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  maxUnavailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
