# Default values for audit-service
# This is a multi-tenant global audit service that dynamically connects to tenant databases

replicaCount: 3  # Minimum 3 replicas for production stability

image:
  repository: ghcr.io/tesserix/mark8ly/audit-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  # Exclude NATS port from Istio sidecar to fix JetStream timeout issues
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Higher resources for audit service as it handles high write throughput and multiple DB connections
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 5  # More tolerance before restart

readinessProbe:
  enabled: false
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Startup probe for slow starts (e.g., DB connection establishment)
startupProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30  # Allow up to 150 seconds for startup

autoscaling:
  enabled: true
  minReplicas: 3  # Match replicaCount for consistency
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# KEDA ScaledObject configuration for advanced scaling
keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 20
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="audit-service",reporter="destination"}[2m]))
    requestRateThreshold: "100"  # Higher threshold for audit service
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Pod Disruption Budget for high availability
pdb:
  enabled: true
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity:
  # Prefer spreading across nodes for availability
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - audit-service
          topologyKey: kubernetes.io/hostname

# Environment configuration
env:
  # Server configuration
  SERVER_PORT: "8080"
  GIN_MODE: "release"
  APP_ENV: "production"
  LOG_LEVEL: "info"

  # Tenant Registry configuration (settings-service provides tenant DB configs)
  # CRITICAL: Must use devtest namespace - settings-service is deployed there
  TENANT_REGISTRY_URL: "http://settings-service.marketplace.svc.cluster.local:8085"
  TENANT_CACHE_TTL: "600"  # 10 minutes - reduce settings-service calls

  # Redis configuration for distributed caching
  REDIS_MAX_RETRIES: "5"
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "10"
  REDIS_DIAL_TIMEOUT: "5"
  REDIS_READ_TIMEOUT: "3"
  REDIS_WRITE_TIMEOUT: "3"

  # Connection Pool configuration
  MAX_DB_POOLS: "100"            # Maximum number of tenant DB pools
  POOL_CLEANUP_INTERVAL: "300"   # Clean up idle pools every 5 minutes
  POOL_HEALTH_INTERVAL: "30"     # Health check every 30 seconds
  POOL_IDLE_TIMEOUT: "600"       # Close idle connections after 10 minutes

  # Audit-specific configuration
  AUDIT_RETENTION_DAYS: "180"    # Default: Keep audit logs for 6 months (min 90, max 365)
  AUDIT_BATCH_SIZE: "100"        # Batch size for bulk inserts
  AUDIT_CLEANUP_ENABLED: "true"
  AUDIT_CLEANUP_SCHEDULE: "0 2 * * *"  # Run cleanup at 2 AM daily
  AUDIT_MIN_RETENTION_DAYS: "90"       # Minimum retention: 3 months
  AUDIT_MAX_RETENTION_DAYS: "365"      # Maximum retention: 1 year

  # OpenTelemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "audit-service"

  # Keycloak configuration (for token validation)
  # Auth validator type: "keycloak" (RS256 only), "hybrid" (both RS256 and HS256), "legacy" (HS256 only)
  AUTH_VALIDATOR_TYPE: "keycloak"
  KEYCLOAK_ISSUER_URL: "https://devtest-customer-idp.tesserix.app/realms/tesserix-customer"

  # Fallback Database configuration (used when tenant-specific config isn't available)
  FALLBACK_DB_ENABLED: "true"
  FALLBACK_DB_HOST: "postgresql.database.svc.cluster.local"
  FALLBACK_DB_PORT: "5432"
  FALLBACK_DB_NAME: "audit_logs"
  FALLBACK_DB_USER: "postgres"
  FALLBACK_DB_SSL_MODE: "disable"
  FALLBACK_DB_MAX_OPEN_CONNS: "25"
  FALLBACK_DB_MAX_IDLE_CONNS: "10"

  # NATS configuration for real-time event streaming
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  NATS_ENABLED: "true"
  NATS_MAX_RECONNECTS: "-1"  # Unlimited reconnects for production stability
  NATS_RECONNECT_WAIT: "1"   # 1 second initial wait
  NATS_RECONNECT_JITTER: "500"  # 500ms jitter to prevent thundering herd
  NATS_PING_INTERVAL: "30"   # 30 second ping interval
  NATS_MAX_PINGS_OUT: "3"    # Allow 3 missed pings before reconnect
  NATS_DRAIN_TIMEOUT: "30"   # 30 second drain timeout for graceful shutdown

# Redis configuration
redis:
  enabled: true
  # Use existing Redis instance in redis-marketplace namespace
  existingRedis: true
  host: "redis.redis-marketplace.svc.cluster.local"
  port: "6379"
  # Redis password secret (must exist in same namespace as deployment)
  # Copy from redis namespace: kubectl get secret redis -n redis -o yaml | sed 's/namespace: redis/namespace: marketplace/' | kubectl apply -f -
  existingSecret: "redis-password"
  existingSecretKey: "redis-password"

# Credential Encryption Key (for decrypting tenant DB credentials)
# This is provided via a sealed secret
credentialEncryption:
  enabled: true
  existingSecret: "audit-service-encryption"
  existingSecretKey: "encryption-key"
  # Encrypted key generated via kubeseal (base64-encoded 32-byte AES-256 key)
  # Generated with: openssl rand -base64 32 | kubeseal --raw --namespace devtest --name audit-service-encryption
  encryptedKey: ""

# Fallback/Default PostgreSQL configuration (for tenants without specific config)
# This allows audit logs to work immediately without requiring settings-service integration
# Note: Requires postgresql-password secret copied from database namespace
  # Connection pool settings for fallback DB
  maxOpenConns: 25
  maxIdleConns: 10
  maxLifetime: 300  # 5 minutes

# Migration job configuration (disabled for multi-tenant - migrations run per-tenant)
migration:
  # Workload Identity is always enabled
  image:
    repository: ghcr.io/tesserix/mark8ly/audit-service
    tag: "latest"
  command: ["./audit-service", "--migrate-only"]

# Metrics and monitoring
metrics:
  enabled: true
  path: /metrics
  port: 8080
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    namespace: monitoring
    labels:
      release: prometheus

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
