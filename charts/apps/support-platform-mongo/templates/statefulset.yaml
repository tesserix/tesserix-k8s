apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-platform-mongo.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "support-platform-mongo.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "support-platform-mongo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: support-platform
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --replSet rs0 promotes this standalone Mongo to a single-node
          # replica set. That unlocks the MongoDB Change Streams API which
          # slm-router needs to react to new customer messages without
          # polling; without it the router gets "Location40573" errors
          # on every reconnect and never delivers an AI reply.
          # --bind_ip_all required so the replica set can talk to its
          # own pod DNS for the initiate() handshake.
          args:
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data/db
          # Liveness checks the daemon is up (not the replica set);
          # readiness is gated on the replica set actually being PRIMARY
          # so slm-router doesn't connect before rs.initiate() runs.
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - |
                  try {
                    const s = rs.status();
                    if (s.myState === 1 || s.myState === 2) { quit(0); }
                    quit(1);
                  } catch (e) {
                    // Replica set not yet initiated — init container does it
                    // on first boot; until then we're not ready.
                    quit(1);
                  }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # On first boot the replica set has never been initiated, so we
          # run rs.initiate() once. The script is safe to retry — it
          # short-circuits when `rs.status()` already reports a member.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                      sleep 1
                    done
                    if mongosh --quiet --eval "rs.status().ok" 2>/dev/null | grep -q '^1$'; then
                      exit 0
                    fi
                    # Register the replica-set member using the regular
                    # service hostname (NOT the per-pod headless DNS) so
                    # clients don't need a headless Service. The
                    # ClusterIP service has one endpoint (the only pod)
                    # and routes there deterministically, so the
                    # advertised hostname always resolves to mongod
                    # itself. When we scale to 3 replicas, switch to a
                    # headless service + pod DNS.
                    mongosh --quiet --eval '
                      rs.initiate({
                        _id: "rs0",
                        members: [{ _id: 0, host: "{{ .Values.name }}-0.{{ .Values.name }}.{{ .Values.namespace }}.svc.cluster.local:27017" }]
                      });
                    ' || true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
