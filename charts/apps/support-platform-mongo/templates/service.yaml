# Mongo needs a HEADLESS service so each pod gets its own stable DNS
# (<pod>-N.<svc>.<ns>.svc.cluster.local). The replica-set config
# registers that pod-DNS as the member host, and clients connect via
# the same name with directConnection=true so the driver doesn't try
# to do topology discovery (which would fail against the headless
# round-robin).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-platform-mongo.labels" . | nindent 4 }}
spec:
  # `clusterIP: None` makes this a headless Service. DNS queries
  # return the pod IP directly, so the IP mongod sees on a
  # `socket.gethostbyname` matches the IP in rs.config.
  clusterIP: None
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: 27017
      protocol: TCP
  selector:
    {{- include "support-platform-mongo.selectorLabels" . | nindent 4 }}
