{{- if .Values.onboardingSeed.enabled }}
{{- $access := dict "apiVersion" "v1" "kind" "List" "items" (list (fromYaml (tpl (.Files.Get "files/onboarding/access.yaml") .))) | toPrettyJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-onboarding-registry-resources
  namespace: {{ .Values.namespace }}
data:
  access.json: |
    {{- $access | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: operator-onboarding-registry-seed
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    checksum/registry: {{ .Files.Get "files/onboarding/registry.yaml" | sha256sum }}
    checksum/access: {{ $access | sha256sum }}
spec:
  ttlSecondsAfterFinished: {{ .Values.registryPlatformSeed.ttlSecondsAfterFinished }}
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "agentgateway-route-sync.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: "{{ .Values.images.curl.repository }}@{{ .Values.images.curl.digest }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              status="$(curl --silent --show-error --fail --max-time 30 \
                --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${REGISTRY_DEPLOY_KEY}" \
                --header 'Content-Type: application/json' \
                --data-binary @/seed/access.json \
                '{{ .Values.registry.endpoint }}/v0/agentgateway/import')" || {
                  echo "Gateway policy publication failed (HTTP ${status:-unavailable})"
                  exit 1
                }
              echo "Gateway policy publication HTTP $status"
              test "$status" = 200
          env:
            - name: REGISTRY_DEPLOY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.authSecret.name }}
                  key: {{ .Values.registry.authSecret.key }}
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: seed
          configMap:
            name: operator-onboarding-registry-resources
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: operator-onboarding-registry-catalog
  namespace: devai
data:
  registry.yaml: |
    {{- .Files.Get "files/onboarding/registry.yaml" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: operator-onboarding-registry-publish
  namespace: devai
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    checksum/catalog: {{ .Files.Get "files/onboarding/registry.yaml" | sha256sum }}
spec:
  ttlSecondsAfterFinished: {{ .Values.registryPlatformSeed.ttlSecondsAfterFinished }}
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devai-registry-bootstrap
        app.kubernetes.io/component: onboarding-registry-publisher
    spec:
      serviceAccountName: devai-registry-bootstrap
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publish
          image: "{{ .Values.images.curl.repository }}@{{ .Values.images.curl.digest }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              status="$(curl --silent --show-error --fail --max-time 30 \
                --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${REGISTRY_DEPLOY_KEY}" \
                --header 'Content-Type: application/yaml' \
                --data-binary @/seed/registry.yaml \
                '{{ .Values.registry.endpoint }}/v0/apply')" || {
                  echo "Catalog publication failed (HTTP ${status:-unavailable})"
                  exit 1
                }
              echo "Catalog publication HTTP $status"
              test "$status" = 200
          env:
            - name: REGISTRY_DEPLOY_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-registry-deploy-key
                  key: API_KEY
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: seed
          configMap:
            name: operator-onboarding-registry-catalog
{{- end }}
