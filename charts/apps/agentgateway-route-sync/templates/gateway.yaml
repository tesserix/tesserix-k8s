# The parameters force the generated data plane behind the authenticated Istio
# edge. The controller/xDS Service remains a separate private ClusterIP.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
spec:
  logging:
    format: json
    level: info
  resources:
    {{- toYaml .Values.gateway.resources | nindent 4 }}
  shutdown:
    min: 5
    max: 30
  # The namespace provides Ambient capture and workload identity. Omitting the
  # native Istio block is required: AgentGateway otherwise opts this pod out of
  # ztunnel with istio.io/dataplane-mode=none.
  deployment:
    spec:
      replicas: {{ .Values.gateway.replicas }}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
  service:
    spec:
      type: ClusterIP
  podDisruptionBudget:
    spec:
      minAvailable: 1
---
# The agentgateway data-plane Gateway. The agentgateway controller
# (gatewayClassName: agentgateway) reconciles this into a proxy Deployment +
# Service that serves the HTTPRoutes the route-sync CronJob renders. Without
# this, the cluster has only the agentgateway control plane (xDS) and no port
# serving /mcp/<name> traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ .Values.gateway.name }}
  listeners:
    - name: mcp
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom }}
    - name: public
      protocol: HTTP
      port: {{ .Values.gateway.publicPort }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom }}
    - name: runtime
      protocol: HTTP
      port: {{ .Values.gateway.runtimePort }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.allowedRoutesFrom }}
