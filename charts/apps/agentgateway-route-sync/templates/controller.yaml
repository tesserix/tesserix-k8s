{{- if .Values.controller.enabled }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.controller.image.digest) }}
{{- fail "controller.image.digest must be an immutable sha256 digest" }}
{{- end }}
{{- $sourceNamespaces := join "," .Values.registry.sourceNamespaces -}}
{{- $registryURL := printf "%s/v0/export/agentgateway?namespace=%s&targetNamespace=%s&gateway=%s&legacyFlatPath=%t&requireServerScope=%t&scopeClaim=%s" .Values.registry.endpoint $sourceNamespaces .Values.namespace .Values.gateway.name .Values.registry.legacyFlatPath .Values.registry.requireServerScope (.Values.registry.scopeClaim | urlquery) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-route-sync-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
    app.kubernetes.io/instance: agentgateway-route-sync-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-route-sync
      app.kubernetes.io/instance: agentgateway-route-sync-controller
  template:
    metadata:
      labels:
        {{- include "agentgateway-route-sync.labels" . | nindent 8 }}
        app.kubernetes.io/instance: agentgateway-route-sync-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.controller.httpPort | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway-route-sync
              app.kubernetes.io/instance: agentgateway-route-sync-controller
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway-route-sync
              app.kubernetes.io/instance: agentgateway-route-sync-controller
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}@{{ .Values.controller.image.digest }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: ["/app/agentgateway-sync"]
          ports:
            - name: http
              containerPort: {{ .Values.controller.httpPort }}
              protocol: TCP
          env:
            - name: REGISTRY_URL
              value: {{ $registryURL | quote }}
            - name: REGISTRY_TOKEN_FILE
              value: /var/run/secrets/registry/{{ .Values.registry.authSecret.key }}
            - name: TARGET_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RECONCILIATION_MODE
              value: {{ .Values.controller.mode | quote }}
            - name: PRUNE
              value: {{ .Values.registry.prune | quote }}
            - name: MIN_RESOURCES
              value: {{ .Values.registry.minDesiredResourceCount | quote }}
            - name: MAX_BODY_BYTES
              value: {{ .Values.controller.maxBodyBytes | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.controller.pollInterval | quote }}
            - name: SAFETY_INTERVAL
              value: {{ .Values.controller.safetyInterval | quote }}
            - name: WATCH_RESYNC_INTERVAL
              value: {{ .Values.controller.watchResyncInterval | quote }}
            - name: ACCEPTANCE_TIMEOUT
              value: {{ .Values.controller.acceptanceTimeout | quote }}
            - name: ACCEPTANCE_POLL_INTERVAL
              value: {{ .Values.controller.acceptancePollInterval | quote }}
            - name: REGISTRY_REQUEST_TIMEOUT
              value: {{ .Values.controller.registryRequestTimeout | quote }}
            - name: HTTP_ADDRESS
              value: ":{{ .Values.controller.httpPort }}"
            - name: FIELD_MANAGER
              value: {{ .Values.controller.fieldManager | quote }}
            - name: LEASE_NAME
              value: {{ .Values.controller.lease.name | quote }}
            - name: LEASE_DURATION
              value: {{ .Values.controller.lease.duration | quote }}
            - name: LEASE_RENEW_DEADLINE
              value: {{ .Values.controller.lease.renewDeadline | quote }}
            - name: LEASE_RETRY_PERIOD
              value: {{ .Values.controller.lease.retryPeriod | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: registry-token
              mountPath: /var/run/secrets/registry
              readOnly: true
      volumes:
        - name: registry-token
          secret:
            secretName: {{ .Values.registry.authSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.registry.authSecret.key }}
                path: {{ .Values.registry.authSecret.key }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgateway-route-sync-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
    app.kubernetes.io/instance: agentgateway-route-sync-controller
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-route-sync
      app.kubernetes.io/instance: agentgateway-route-sync-controller
{{- if .Values.controller.monitoring.enabled }}
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: agentgateway-route-sync-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
    app.kubernetes.io/instance: agentgateway-route-sync-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-route-sync
      app.kubernetes.io/instance: agentgateway-route-sync-controller
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.controller.monitoring.interval }}
---
apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: agentgateway-route-sync-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
    app.kubernetes.io/instance: agentgateway-route-sync-controller
spec:
  groups:
    - name: agentgateway-route-sync
      interval: 1m
      rules:
        - alert: AgentGatewaySyncRegistryStale
          expr: >-
            max(agentgateway_sync_last_registry_success_timestamp_seconds{namespace="{{ .Values.namespace }}"}) == 0
            or time() - max(agentgateway_sync_last_registry_success_timestamp_seconds{namespace="{{ .Values.namespace }}"}) > 120
          for: 2m
          labels:
            {{- toYaml .Values.controller.monitoring.alertLabels | nindent 12 }}
          annotations:
            summary: AgentGateway sync has not fetched Registry successfully for two minutes
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/agentgateway-route-sync.md
        - alert: AgentGatewaySyncReconcileStale
          expr: >-
            max(agentgateway_sync_last_success_timestamp_seconds{namespace="{{ .Values.namespace }}"}) == 0
            or time() - max(agentgateway_sync_last_success_timestamp_seconds{namespace="{{ .Values.namespace }}"}) > 600
          for: 2m
          labels:
            {{- toYaml .Values.controller.monitoring.alertLabels | nindent 12 }}
          annotations:
            summary: AgentGateway sync has not reconciled successfully for ten minutes
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/agentgateway-route-sync.md
        - alert: AgentGatewaySyncDrift
          expr: max(agentgateway_sync_drift_resources{namespace="{{ .Values.namespace }}"}) > 0
          for: 2m
          labels:
            {{- toYaml .Values.controller.monitoring.alertLabels | nindent 12 }}
          annotations:
            summary: Registry and AgentGateway desired state are drifting
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/agentgateway-route-sync.md
        - alert: AgentGatewaySyncLeaderUnavailable
          expr: absent(agentgateway_sync_leader{namespace="{{ .Values.namespace }}"}) or sum(agentgateway_sync_leader{namespace="{{ .Values.namespace }}"}) != 1
          for: 1m
          labels:
            {{- toYaml .Values.controller.monitoring.alertLabels | nindent 12 }}
          annotations:
            summary: AgentGateway sync does not have exactly one elected leader
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/agentgateway-route-sync.md
{{- end }}
{{- end }}
