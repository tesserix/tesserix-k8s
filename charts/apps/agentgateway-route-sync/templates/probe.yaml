{{- if .Values.probe.enabled }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.probe.image.digest) }}
{{- fail "probe.image.digest must be an immutable sha256 digest" }}
{{- end }}
# Capability prober — dials every routed MCP server through the mesh-only
# listener and records what it actually served on the registry artifact's
# status. Its dedicated service account is admitted only to that listener.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.probe.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- if .Values.probe.oauth.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.probe.externalSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStore }}
  target:
    name: {{ .Values.probe.externalSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: {{ .Values.probe.externalSecret.clientId }}
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: {{ .Values.probe.externalSecret.clientSecret }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.probe.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.probe.schedule | quote }}
  concurrencyPolicy: {{ .Values.probe.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.probe.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.probe.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.probe.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.probe.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.probe.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.probe.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "agentgateway-route-sync.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.probe.name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: "{{ .Values.probe.image.repository }}@{{ .Values.probe.image.digest }}"
              imagePullPolicy: {{ .Values.probe.image.pullPolicy }}
              command: ["/app/agentic-probe"]
              env:
                - name: REGISTRY_ENDPOINT
                  value: {{ .Values.registry.endpoint | quote }}
                - name: GATEWAY_URL
                  value: {{ .Values.probe.gatewayUrl | quote }}
                - name: TENANT_NAMESPACES
                  value: {{ join "," .Values.registry.sourceNamespaces | quote }}
                - name: PROBE_TIMEOUT
                  value: {{ .Values.probe.timeout | quote }}
                - name: REGISTRY_DEPLOY_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.registry.authSecret.name }}
                      key: {{ .Values.registry.authSecret.key }}
                {{- if .Values.probe.oauth.enabled }}
                - name: MCP_TOKEN_URL
                  value: {{ .Values.probe.oauth.tokenUrl | quote }}
                - name: MCP_SCOPE
                  value: {{ .Values.probe.oauth.scope | quote }}
                - name: MCP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.probe.externalSecret.name }}
                      key: CLIENT_ID
                - name: MCP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.probe.externalSecret.name }}
                      key: CLIENT_SECRET
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
