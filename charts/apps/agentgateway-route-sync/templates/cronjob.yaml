# Route-sync: pull the registry's MCP servers as ready-to-apply agentgateway
# routing YAML (rendered server-side by /v0/export/agentgateway, which reuses
# the registry's tested adapter), then apply it. Idempotent — server-side apply
# on stable resource names. Runs in agentgateway-system, whose SA the registry
# authz already allows to GET /v0/*; the consumer-egress NetworkPolicy already
# permits the :12121 hop, so no extra wiring is needed.
{{- if not (has .Values.controller.mode (list "active" "shadow" "disabled")) }}
{{- fail "controller.mode must be active, shadow, or disabled" }}
{{- end }}
{{- $controllerActive := and .Values.controller.enabled (eq .Values.controller.mode "active") -}}
{{- if ne $controllerActive .Values.cron.suspend }}
{{- fail "exactly one sync writer is required: active controller requires cron.suspend=true" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentgateway-route-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-route-sync.labels" . | nindent 4 }}
spec:
  suspend: {{ .Values.cron.suspend }}
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: {{ .Values.cron.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.cron.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cron.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.cron.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.cron.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "agentgateway-route-sync.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Render: fetch the agentgateway routing YAML for every MCP server
            # in the source namespace, parented to our data-plane Gateway.
            - name: render
              image: "{{ .Values.images.curl.repository }}@{{ .Values.images.curl.digest }}"
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  URL="{{ .Values.registry.endpoint }}/v0/export/agentgateway"
                  URL="${URL}?namespace={{ join "," .Values.registry.sourceNamespaces }}"
                  URL="${URL}&targetNamespace={{ .Values.namespace }}"
                  URL="${URL}&gateway={{ .Values.gateway.name }}"
                  URL="${URL}&legacyFlatPath={{ .Values.registry.legacyFlatPath }}"
                  URL="${URL}&requireServerScope={{ .Values.registry.requireServerScope }}"
                  URL="${URL}&scopeClaim={{ urlquery .Values.registry.scopeClaim }}"
                  echo "GET ${URL}"
                  curl -sS --fail-with-body --max-time 30 \
                    --header "Authorization: Bearer ${REGISTRY_DEPLOY_KEY}" \
                    --dump-header /work/export.headers \
                    "${URL}" -o /work/routes.yaml
                  expected_count="$(awk -F ': ' 'tolower($1) == "x-agentgateway-resource-count" {gsub("\\r", "", $2); print $2}' /work/export.headers)"
                  expected_digest="$(awk -F ': ' 'tolower($1) == "x-agentgateway-resource-digest" {gsub("\\r", "", $2); print $2}' /work/export.headers)"
                  actual_count="$(grep -c '^kind:' /work/routes.yaml || true)"
                  actual_digest="sha256:$(sha256sum /work/routes.yaml | awk '{print $1}')"
                  test -n "${expected_count}"
                  test -n "${expected_digest}"
                  test "${expected_count}" -ge "{{ .Values.registry.minDesiredResourceCount }}"
                  test "${actual_count}" = "${expected_count}"
                  test "${actual_digest}" = "${expected_digest}"
                  touch /work/export.verified
                  echo "verified ${actual_count} desired AgentGateway resources"
              env:
                - name: REGISTRY_DEPLOY_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.registry.authSecret.name }}
                      key: {{ .Values.registry.authSecret.key }}
              volumeMounts:
                - name: work
                  mountPath: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          containers:
            # Apply the digest-verified desired state, then prune only objects
            # bearing the Registry ownership label and absent from that export.
            # The minimum-count guard above prevents an empty/partial export
            # from becoming a broad deletion event.
            - name: apply
              image: "{{ .Values.images.kubectl.repository }}:{{ .Values.images.kubectl.tag }}"
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  test -f /work/export.verified
                  if [ -s /work/routes.yaml ] && grep -q '^kind:' /work/routes.yaml; then
                    kubectl apply --server-side --force-conflicts -f /work/routes.yaml
                  else
                    echo "desired AgentGateway state is empty"
                  fi
                  {{- if .Values.registry.prune }}
                  kubectl apply --dry-run=client -f /work/routes.yaml -o name \
                    | sort -u > /tmp/desired-resources
                  for resource in \
                    agentgatewaybackends.agentgateway.dev \
                    httproutes.gateway.networking.k8s.io \
                    agentgatewaypolicies.agentgateway.dev; do
                    kubectl get "${resource}" \
                      --selector app.kubernetes.io/managed-by=agentic-registry \
                      --output name | while read -r object; do
                        if ! grep -Fxq "${object}" /tmp/desired-resources; then
                          kubectl delete "${object}" --wait=false
                        fi
                      done
                  done
                  {{- end }}
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
