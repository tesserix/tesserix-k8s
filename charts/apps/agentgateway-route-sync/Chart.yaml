apiVersion: v2
name: agentgateway-route-sync
description: >-
  Stands up an agentgateway data-plane Gateway, seeds the approved platform
  providers, routes, and policies into Registry, and continuously reconciles
  verified Registry desired state into AgentGateway resources so each
  registered MCP server is reachable at {gateway}/mcp/<tenant>/<name>.
type: application
version: 0.4.7
appVersion: "1.4.1"
