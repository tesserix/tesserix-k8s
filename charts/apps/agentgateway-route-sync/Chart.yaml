apiVersion: v2
name: agentgateway-route-sync
description: >-
  Stands up an agentgateway data-plane Gateway, seeds the approved platform
  providers, routes, and policies into Registry, and runs a CronJob that renders
  Registry desired state into AgentGateway resources so each registered MCP
  server is reachable at {gateway}/mcp/<tenant>/<name>. Workstream G1.
type: application
version: 0.3.8
appVersion: "1.4.1"
