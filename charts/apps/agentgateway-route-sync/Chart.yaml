apiVersion: v2
name: agentgateway-route-sync
description: >-
  Stands up an agentgateway data-plane Gateway and a CronJob that renders the
  registry's MCP servers into AgentgatewayBackend + HTTPRoute objects (via the
  registry's /v0/export/agentgateway endpoint) so each registered MCP server is
  reachable at {gateway}/mcp/<tenant>/<name>, plus a capability prober that
  records what each routed server actually serves. Workstream G1.
type: application
version: 0.3.1
appVersion: "1.4.1"
