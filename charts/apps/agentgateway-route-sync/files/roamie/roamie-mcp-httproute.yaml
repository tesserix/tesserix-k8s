apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roamie-roamie-travel-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-mcp
    sectionName: runtime
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp/roamie/roamie-travel-mcp
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: roamie-roamie-travel-mcp
