apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: roamie-roamie-travel-mcp
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: roamie-travel-mcp
      static:
        host: roamie-travel-mcp.roamie.svc.cluster.local
        port: 8080
        path: /mcp
        protocol: StreamableHTTP
        policies:
          auth:
            passthrough: {}
            credentials:
            - secretRef:
                name: product-mcp-upstream-keys
                key: ROAMIE_TRAVEL_MCP_KEY
              location:
                header:
                  name: X-MCP-Key
