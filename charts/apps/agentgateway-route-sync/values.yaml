# agentgateway-route-sync — defaults
#
# Three pieces:
#   1. A Gateway (gatewayClassName: agentgateway) whose listener the
#      agentgateway controller reconciles into a data-plane proxy — this is
#      what actually serves /mcp/<name> traffic (the agentgateway Service in
#      this cluster is control-plane-only: 9978 xDS / 9093 / 9092).
#   2. An HA Lease-elected controller that verifies and reconciles Registry
#      desired state, watches Kubernetes drift, and retains last-known-good.
#   3. The original CronJob retained as the tested rollback path.

namespace: agentgateway-system

# Registry owns the three platform security CRs after the production handoff.
# Set false only for the rollback path that restores Helm rendering.
registryOwnership:
  enabled: true

# The data-plane Gateway the HTTPRoutes attach to.
gateway:
  name: agentgateway-mcp
  className: agentgateway
  # HTTP listener the proxy serves /mcp/<name> on.
  port: 8080
  publicPort: 8081
  runtimePort: 8082
  # Which namespaces' HTTPRoutes may attach. The route-sync writes routes into
  # this same namespace, so "Same" is sufficient and tightest.
  allowedRoutesFrom: Same
  replicas: 2
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

oauth:
  issuer: https://auth.tesserix.app
  audience: "387190457387450503"
  jwks:
    host: auth.tesserix.app
    path: /oauth/v2/keys
    cacheDuration: 15m
  humanEmails:
    - samyak.rout@gmail.com
    - mahesh.sangawar@gmail.com
  roleClaim: "urn:zitadel:iam:org:project:387190457387450503:roles"
  machineRole: agentgateway.mcp

globalAdkRuntime:
  host: adk-runtime.devai.svc.cluster.local
  port: 8080
  pathPrefix: /a2a/v1/
  agentCardPath: /.well-known/agent-card.json
  requestTimeout: 15m
  machineRole: agentgateway.runtime
  limits:
    # One surviving gateway replica can absorb the accepted 20 starts/s peak
    # with 50% headroom, plus short Agent Card discovery bursts.
    requestsPerMinutePerReplica: 1800
    requestBurst: 200
  upstreamSecret:
    name: global-adk-runtime-upstream
    key: token
    remoteRef: prod-global-adk-runtime-upstream-token

ui:
  upstream: http://agentregistry.agentregistry-system.svc.cluster.local:12121
  oauth2Proxy:
    name: mcp-gateway-ui-oauth2-proxy
    replicas: 2
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      digest: sha256:f6a4aa83a27e316114bf79664302b1ffb2cc8ce697fb479273af4feb3fb16fe3
    issuerUrl: https://auth.tesserix.app
    scope: "openid profile email urn:zitadel:iam:org:project:id:387190457387450503:aud urn:zitadel:iam:org:projects:roles"
    redirectUrl: https://mcp.tesserix.app/oauth2/callback
    cookieName: _tesserix_mcp_gateway
    allowedEmails:
      - samyak.rout@gmail.com
      - mahesh.sangawar@gmail.com
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    externalSecret:
      secretStore: gcp-secret-store
      refreshInterval: 1h
      clientId: prod-agentgateway-mcp-ui-client-id
      clientSecret: prod-agentgateway-mcp-ui-client-secret
      cookieSecret: prod-agentgateway-mcp-ui-cookie-secret

rateLimit:
  backend: agentgateway-ratelimit
  port: 8081
  domain: agentgateway-public

# Registry connection — the export endpoint returns ready-to-apply YAML. Both
# import and export use the existing DevAI deploy key and remain mesh-gated to
# the route-sync service account.
registry:
  endpoint: http://agentregistry.agentregistry-system.svc.cluster.local:12121
  authSecret:
    name: agentgateway-route-sync-registry-key
    key: API_KEY
  # Registry namespaces to pull MCP servers from. Each namespace is a tenant:
  # its servers are exported at /mcp/<tenant>/<server> and require the scope
  # mcp:<tenant>:<server>. The first entry owns servers that declare no tenant.
  # Add a namespace here when a tenant publishes its own MCP servers; a server
  # may also claim a tenant with the mcp.tesserix.app/tenant label instead.
  sourceNamespaces:
    - devai
  # Also serve the pre-tenancy /mcp/<server> path so already-configured agents
  # keep working. Retire this only once every client uses the tenant path.
  legacyFlatPath: true
  # Render an AgentgatewayPolicy per route demanding mcp:<tenant>:<server>.
  # Two-step enablement: grant the roles in Zitadel FIRST, then flip this — the
  # gateway denies any caller that has not been granted its server's scope.
  requireServerScope: false
  # The JWT claim the per-server scope is read from. Must match the claim the
  # gateway's JWT policy authorizes on.
  scopeClaim: "urn:zitadel:iam:org:project:387190457387450503:roles"
  prune: true
  # Never prune if a valid, digest-verified export drops below the permanent
  # 27-resource platform baseline (24 handed off plus Kora's three user-auth
  # resources).
  minDesiredResourceCount: 27

# Keep the Registry-owned platform providers, routes, and policies aligned
# with the reviewed Helm rollback definitions. The import is idempotent and
# updates the 24 handoff artifacts plus Kora's three user-auth resources.
registryPlatformSeed:
  enabled: true
  expectedCount: 27
  activeDeadlineSeconds: 180
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600

# The phase-one import is complete. Keep the exact-count guard for a tested
# rollback/replay path, but do not render the importer in steady state.
migrationImport:
  enabled: false
  expectedCount: 24

# One-time phase-two metadata handoff. The Job waits until every migrated
# object is Registry-managed, then removes only stale Argo/Helm tracking data.
ownershipHandoff:
  enabled: true
  expectedCount: 24

# Capability prober: observes what each routed MCP server actually serves and
# records it on the registry artifact's status. Reachability in the catalog is
# what the probe measured, never what a row asserts.
probe:
  # Probe the mesh-only listener with this pod's dedicated service-account
  # identity. The job needs no broad OAuth client; public JWT enforcement is
  # independently owned by the listener policy and covered by gateway smokes.
  enabled: true
  name: agentic-probe
  gatewayUrl: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080
  timeout: 30s
  image:
    repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/agentic-registry
    # Same verified image as the controller; it includes /app/agentic-probe.
    digest: sha256:40973ac1806bdf9d030aa0d0eb57d4aca432a052d9358e5e961bdfd233316fda
    pullPolicy: IfNotPresent
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  activeDeadlineSeconds: 600
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  # The prober authenticates to the gateway as a machine client, exactly like
  # any other agent — it holds no privileged bypass.
  oauth:
    enabled: false
    tokenUrl: https://auth.tesserix.app/oauth/v2/token
    scope: "openid urn:zitadel:iam:org:project:id:387190457387450503:aud urn:zitadel:iam:org:projects:roles"
  externalSecret:
    name: agentic-probe-oauth
    clientId: prod-agentgateway-mcp-probe-client-id
    clientSecret: prod-agentgateway-mcp-probe-client-secret

externalSecret:
  secretStore: gcp-secret-store
  refreshInterval: 1h
  registryDeployKey: prod-agentic-registry-devai-deploy-key

# HA Registry-to-AgentGateway controller. Shadow is deliberately the rollout
# default: the CronJob remains the sole writer until live parity is proven.
controller:
  enabled: true
  mode: shadow
  replicas: 2
  image:
    repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/agentic-registry
    # main-59a9827; the manifest passed the blocking Trivy gate in
    # agentic-registry Actions run 33303178621.
    digest: sha256:40973ac1806bdf9d030aa0d0eb57d4aca432a052d9358e5e961bdfd233316fda
    pullPolicy: IfNotPresent
  httpPort: 9090
  pollInterval: 30s
  safetyInterval: 5m
  watchResyncInterval: 5m
  acceptanceTimeout: 20s
  acceptancePollInterval: 500ms
  registryRequestTimeout: 30s
  maxBodyBytes: "5242880"
  fieldManager: agentgateway-registry-sync
  lease:
    name: agentgateway-route-sync
    duration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi
  monitoring:
    enabled: true
    interval: 30s
    alertLabels:
      severity: warning
      owner: platform

# CronJob cadence + safety.
cron:
  # Shadow rollout leaves this false. Active cutover sets true in the same
  # GitOps change; rollback reverts that commit and resumes the tested path.
  suspend: false
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  activeDeadlineSeconds: 180
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600

images:
  curl:
    repository: curlimages/curl
    tag: "8.11.1"
    digest: sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
  kubectl:
    # DEP-5: docker.io/bitnami/kubectl:1.31 was removed in the Bitnami catalog
    # migration (ImagePullBackOff). Use bitnamilegacy/* — the published home for
    # legacy Bitnami images and a drop-in (minideb base WITH /bin/sh). NOTE: the
    # job runs a shell script, so a distroless kubectl image (registry.k8s.io/
    # kubectl) does NOT work — it has no /bin/sh (exec error, exit 128).
    repository: docker.io/bitnamilegacy/kubectl
    tag: "1.31"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 32Mi
  limits:
    memory: 128Mi

serviceAccount:
  create: true
  name: agentgateway-route-sync
