replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-prediction-agent
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

env:
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: info
  SERVER_PORT: "8080"

  # LLM config
  PRIMARY_LLM: anthropic
  ANTHROPIC_MODEL: "claude-sonnet-4-5-20250929"
  OPENAI_MODEL: "gpt-4o-mini"
  GEMINI_MODEL: "gemini-2.0-flash"
  LLM_TEMPERATURE: "0.7"
  LLM_MAX_TOKENS: "4096"

  # Prediction service (internal mesh)
  PREDICTION_SERVICE_URL: "http://fanzone-prediction.fanzone.svc.cluster.local"

  # Scheduler
  GENERATION_INTERVAL_MINUTES: "15"
  RESOLUTION_INTERVAL_MINUTES: "10"

  # Prediction config
  DEFAULT_TTL_HOURS: "6"
  MAX_PREDICTIONS_PER_CYCLE: "5"
  MIN_PREDICTIONS_PER_CYCLE: "2"
  DEFAULT_MIN_BET: "25"
  DEFAULT_MAX_BET_PER_USER: "500"
  BOT_ADMIN_USER_ID: "00000000-0000-0000-0000-000000000002"

  # Token budget
  MAX_TOKENS_PER_DAY: "500000"

# PostgreSQL (fanzone_auth database)
database:
  host: "fanzone-postgres-rw.fanzone.svc.cluster.local"
  port: "5432"
  user: "fanzone"
  name: "fanzone_auth"
  sslmode: "require"
  passwordSecretName: "fanzone-postgres-app-credentials"
  passwordSecretKey: "password"

# LLM API Key secrets
anthropic:
  secretName: "fanzone-anthropic-api-key"
  secretKey: "api-key"

openai:
  secretName: "fanzone-openai-api-key"
  secretKey: "api-key"

gemini:
  secretName: "fanzone-gemini-api-key"
  secretKey: "api-key"

# JWT Secret
jwt:
  secretName: "fanzone-jwt-secret"
  secretKey: "jwt-secret"

# Knative
knative:
  enabled: false
  minScale: 0
  maxScale: 3
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

# GCP Secret Manager
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
