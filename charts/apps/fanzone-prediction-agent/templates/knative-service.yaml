{{- if .Values.knative.enabled }}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "fanzone-prediction-agent.fullname" . }}
  labels:
    {{- include "fanzone-prediction-agent.labels" . | nindent 4 }}
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/disableAutoTLS: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | default "0" | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | default "3" | quote }}
        autoscaling.knative.dev/target: {{ .Values.knative.concurrencyTarget | default "100" | quote }}
        {{- if .Values.knative.scaleDownDelay }}
        autoscaling.knative.dev/scale-down-delay: {{ .Values.knative.scaleDownDelay | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fanzone-prediction-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containerConcurrency: {{ .Values.knative.containerConcurrency | default 0 }}
      timeoutSeconds: {{ .Values.knative.timeoutSeconds | default 300 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fanzone-prediction-agent.serviceAccountName" . }}
      {{- if .Values.waitForPostgres.enabled }}
      # DEP-6: wait for Postgres to be reachable through the ambient mesh before
      # starting the app, avoiding the ztunnel-redirection startup race that
      # failed Knative revision 00006 (ConnectionRefused -> ExitCode3).
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitForPostgres.image | quote }}
          command:
            - sh
            - -c
            - |
              end=$(( $(date +%s) + {{ .Values.waitForPostgres.timeoutSeconds }} ))
              until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do
                if [ "$(date +%s)" -ge "$end" ]; then
                  echo "timed out waiting for {{ .Values.database.host }}:{{ .Values.database.port }}" >&2
                  exit 1
                fi
                echo "waiting for {{ .Values.database.host }}:{{ .Values.database.port }}..."
                sleep {{ .Values.waitForPostgres.intervalSeconds }}
              done
              echo "postgres reachable"
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName | default "postgresql-fanzone-password" }}
                  key: {{ .Values.database.passwordSecretKey | default "password" }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropic.secretName | default "fanzone-anthropic-api-key" }}
                  key: {{ .Values.anthropic.secretKey | default "api-key" }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.secretName | default "fanzone-openai-api-key" }}
                  key: {{ .Values.openai.secretKey | default "api-key" }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gemini.secretName | default "fanzone-gemini-api-key" }}
                  key: {{ .Values.gemini.secretKey | default "api-key" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.secretName | default "fanzone-jwt-secret" }}
                  key: {{ .Values.jwt.secretKey | default "jwt-secret" }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
