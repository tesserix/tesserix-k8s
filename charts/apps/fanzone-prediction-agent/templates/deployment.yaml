apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fanzone-prediction-agent.fullname" . }}
  labels:
    {{- include "fanzone-prediction-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fanzone-prediction-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fanzone-prediction-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fanzone-prediction-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.waitForPostgres.enabled }}
      # DEP-6: wait for Postgres reachability through the ambient mesh before the
      # app starts (avoids the ztunnel-redirection startup race).
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitForPostgres.image | quote }}
          command:
            - sh
            - -c
            - |
              end=$(( $(date +%s) + {{ .Values.waitForPostgres.timeoutSeconds }} ))
              until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do
                if [ "$(date +%s)" -ge "$end" ]; then
                  echo "timed out waiting for {{ .Values.database.host }}:{{ .Values.database.port }}" >&2
                  exit 1
                fi
                echo "waiting for {{ .Values.database.host }}:{{ .Values.database.port }}..."
                sleep {{ .Values.waitForPostgres.intervalSeconds }}
              done
              echo "postgres reachable"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretName | default "postgresql-fanzone-password" }}
                  key: {{ .Values.database.passwordSecretKey | default "password" }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropic.secretName | default "fanzone-anthropic-api-key" }}
                  key: {{ .Values.anthropic.secretKey | default "api-key" }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.secretName | default "fanzone-openai-api-key" }}
                  key: {{ .Values.openai.secretKey | default "api-key" }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gemini.secretName | default "fanzone-gemini-api-key" }}
                  key: {{ .Values.gemini.secretKey | default "api-key" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.secretName | default "fanzone-jwt-secret" }}
                  key: {{ .Values.jwt.secretKey | default "jwt-secret" }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if .Values.livenessProbe }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
