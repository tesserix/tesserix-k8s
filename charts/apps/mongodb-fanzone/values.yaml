# MongoDB for FanZone Battle Ground
# Stores chat messages, user activity, and real-time data

image:
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

auth:
  enabled: false

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 20Gi

service:
  type: ClusterIP
  port: 27017

# Internal LoadBalancer (for Cloud Run / external VPC access). Disabled —
# in-cluster traffic uses the ClusterIP DNS name above.
ilb:
  enabled: false
