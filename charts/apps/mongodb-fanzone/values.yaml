# Pod count — the park override in argocd/prod/infrastructure/mongodb-fanzone.yaml
# sets this to 0 (PVC persists). `default` cannot be used in the template:
# Helm treats 0 as falsy and would silently restore 1 replica.
replicaCount: 1
# MongoDB for FanZone Battle Ground
# Stores chat messages, user activity, and real-time data

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

auth:
  enabled: false

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 20Gi

service:
  type: ClusterIP
  port: 27017

# Internal LoadBalancer (for Cloud Run / external VPC access). Disabled —
# in-cluster traffic uses the ClusterIP DNS name above.
ilb:
  enabled: false
