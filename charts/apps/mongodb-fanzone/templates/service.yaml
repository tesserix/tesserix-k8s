apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-fanzone.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-fanzone.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    {{- include "mongodb-fanzone.selectorLabels" . | nindent 4 }}
