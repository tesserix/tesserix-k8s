apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-fanzone.fullname" . }}-ilb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-fanzone.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  ports:
    - port: 27017
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    {{- include "mongodb-fanzone.selectorLabels" . | nindent 4 }}
