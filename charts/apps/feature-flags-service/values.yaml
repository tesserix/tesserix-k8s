# Default values for feature-flags-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly/feature-flags-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8096

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8096"
  GIN_MODE: "release"
  ENVIRONMENT: "production"

  # Growthbook Configuration
  # Note: SDK features endpoint (/api/features/<key>) and healthcheck are on port 3100 (backend)
  GROWTHBOOK_API_HOST: "growthbook.growthbook.svc.cluster.local"
  GROWTHBOOK_API_PORT: "3100"

  # Cache Settings
  CACHE_TTL_SECONDS: "60"
  ENABLE_CACHE: "true"

# Growthbook Admin API Key (optional)
growthbook:
  # Workload Identity is always enabled
  existingSecret: ""
  existingSecretKey: "admin-api-key"

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration (used by deployment template)
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "feature_flags_db"
  user: "postgres"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30
