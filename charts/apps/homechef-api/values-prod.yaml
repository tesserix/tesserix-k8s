# Production overrides for homechef-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Bump this timestamp when you need to force Knative to create a new
# Revision (pulls :latest fresh). The ghcr-remote pull-through cache in
# Artifact Registry can hold a stale :latest manifest; a spec change is
# the cheapest way to break it out.
podAnnotations:
  homechef.fe3dr.com/redeploy-at: "2026-04-19T13:30:00Z"

replicaCount: 2

# Production resource allocation. A CPU *request* is what makes the KEDA cpu
# trigger below admissible; there is deliberately no CPU limit, because a
# throttled pod under a login burst fails readiness and takes itself out of
# rotation exactly when capacity is scarcest.
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 192Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"
  # ---------------------------------------------------------------------------
  # Sign in with Apple — token revocation on account deletion (App Review 5.1.1(v))
  # ---------------------------------------------------------------------------
  # Deleting the Identity Platform user is not enough: Apple keeps its own grant,
  # so the app stays listed under Settings > Apple ID > Sign in with Apple. A
  # reviewer who deletes the test account and looks there will see it, and that
  # is a rejection.
  #
  # These three are NOT secret — a team id and two bundle ids, all of which ship
  # inside the shipped binaries anyway. The actual secret (the .p8) plus its key
  # id arrive via the ExternalSecret, gated on appleSignIn.revocationEnabled.
  #
  # Two apps, two client ids: a native authorization code is bound to the App ID
  # that issued it, so Apple's /auth/revoke rejects a Customer-app code presented
  # with the Vendor client_id and vice versa. The API picks per request from the
  # user's role (services/apple_signin.go), never from a client-supplied header.
  #
  # Safe to set before the key exists: config.warnIfAppleSignInIncomplete logs
  # exactly what is missing and revocation silently no-ops. It never fails
  # account deletion.
  APPLE_TEAM_ID: "2CRHRRYBPL"
  APPLE_SERVICES_CLIENT_ID: "com.tesserix.homechef.customer"
  APPLE_SERVICES_CLIENT_ID_VENDOR: "com.tesserix.homechef.vendor"
  # The Go API reads ENVIRONMENT (config/config.go) for its log/trace "env"
  # label and as the Sentry environment fallback. Base values.yaml never sets
  # it, so prod was defaulting to "development" — tagging all prod logs, Cloud
  # Trace spans, and Sentry events as dev. Set it explicitly here.
  ENVIRONMENT: "production"
  SENTRY_ENVIRONMENT: "production"
  # HOMECHEF_ENV is not read by the Go env label, but base values.yaml sets it
  # to "development"; override for consistency in prod (matches values-local's "local").
  HOMECHEF_ENV: "production"
  # ---------------------------------------------------------------------------
  # PII column encryption (#710) — PHASE 1 of 4
  # ---------------------------------------------------------------------------
  # Turns apps/api/piicrypto from a pass-through into real AES-256-GCM under a
  # KMS-wrapped DEK, and starts populating the *_enc / *_bidx companion columns
  # with ciphertext and blind indexes.
  #
  # READ THIS BEFORE ASSUMING THE DATA IS PROTECTED: this is dual-write only.
  # Per models/pii_dualwrite.go, reads still come from the PLAINTEXT columns and
  # those columns remain populated. Phase 1 alone does NOT reduce exposure to an
  # attacker with database access — it is the prerequisite for phases 2-4
  # (backfill -> read from _enc -> drop plaintext columns).
  #
  # STARTUP HAZARD: main.go:150 is log.Fatalf — if Secret Manager or KMS is
  # unreachable, or the unwrapped DEK is not exactly 32 bytes, the process exits
  # on boot. Verified prerequisites before enabling:
  #   - KMS key homechef-pii/pii-dek (asia-south1) exists
  #   - secrets prod-homechef-pii-dek-wrapped + prod-homechef-pii-bidx-key exist
  #   - the pod SA holds roles/cloudkms.cryptoKeyDecrypter + secretAccessor
  #   - GCS_PROJECT_ID is set (piicrypto.Init takes the project from it)
  # The rollout is safe regardless: replicas=2 with maxUnavailable 25% floors to
  # 0, so a crash-looping new pod never becomes Ready and the old pods keep
  # serving — the rollout stalls instead of causing an outage. To revert, set
  # this back to "false"; decryption is backward-compatible because ciphertext
  # is prefix-tagged ("enc:v1:") and untagged plaintext passes straight through.
  PII_ENCRYPTION_ENABLED: "true"
  # Browser origins allowed by the API's CORS middleware (gin-contrib/cors).
  #
  # This MUST live in a values file, not in the ArgoCD Application's
  # helm.parameters: Kargo replaces spec.source.helm.parameters wholesale on
  # every promotion, and the app-of-apps sets ignoreDifferences on that path,
  # so any parameter declared there is silently dropped and never restored
  # from git. That is exactly what happened — the API was left running
  # values.yaml's dev defaults (dev-homechef.tesserix.app), so gin-contrib/cors
  # answered a bare 403 to every request carrying Origin: https://fe3dr.com.
  # Same-origin GETs send no Origin header and so kept working, which hid it
  # until the first POST (placing an order).
  CORS_ORIGINS: "https://fe3dr.com,https://www.fe3dr.com,https://vendors.fe3dr.com,https://admin.fe3dr.com,https://delivery.fe3dr.com,https://analytics.fe3dr.com"
  # Enables the Bearer-token fallback in middleware.BFFAuth so mobile/SPA
  # clients holding a BFF-minted session_token directly (rather than routing
  # every call through the BFF's HMAC-signing proxy) can authenticate.
  # Points at the auth-bff Service's in-cluster DNS.
  BFF_SESSION_URL: "http://homechef-auth-bff.homechef.svc.cluster.local:8080/auth/session"
  # Client connections to PgBouncer, which multiplexes them onto ~25 Postgres
  # backends. 20 pods × 20 stays well under the pooler's 1000 max_client_conn.
  DB_MAX_OPEN_CONNS: "20"
  DB_MAX_IDLE_CONNS: "5"
  # Public WebSocket origin the mobile app dials directly for real-time chat.
  # Matches the storefront-otto WS route on the fe3dr.com VirtualService.
  OTTO_WS_PUBLIC_BASE: "wss://fe3dr.com"

# KEDA drives autoscaling. HPA stays off — two controllers scaling one
# Deployment fight each other.
autoscaling:
  enabled: false
# Sign in with Apple token revocation (App Review 5.1.1(v)). Enabled 2026-08-09:
# both GCP secrets now exist and were verified before flipping —
#   prod-homechef-apple-key-id                 = 3FHUQD8FPV
#   prod-homechef-apple-signin-private-key-b64 = 257-byte PKCS#8 prime256v1 key
# (decoded and parsed with openssl; a line-wrapped or truncated payload would
# otherwise fail silently at request time rather than at boot).
#
# NOTE: key 3FHUQD8FPV is configured in the Apple portal with primary App ID
# com.tesserix.homechef.customer ONLY. Until com.tesserix.homechef.vendor is
# grouped under that primary, Apple rejects vendor client secrets and vendor
# revocation stays a no-op — customer revocation works from now on.
appleSignIn:
  revocationEnabled: true

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    enabled: true
    secretPrefix: "prod"

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 20
  # Memory alone scaled far too late: Go holds a flat heap while CPU saturates,
  # so a login/order burst queued on a pinned pod instead of adding one. The
  # prometheus request-rate trigger stays out (#906) — monitoring is scaled to
  # zero and a Degraded ScaledObject fails Kargo's health gate.
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Email configuration (SendGrid primary, Resend fallback).
# From-address lives on tesserix.app — the one domain verified with both
# providers (Resend domain + SendGrid domain auth). fe3dr.com is NOT
# verified in Resend, so sending from it would 403 the Resend leg.
#
# fromName is what recipients actually see, so it carries the brand while the
# envelope domain stays on the verified sender. "HomeChef" is the internal
# name — it must never appear in a customer's inbox.
email:
  fromEmail: "noreply@tesserix.app"
  fromName: "Fe3dr"

# GCS storage buckets
gcs:
  projectId: "tesseracthub-480811"
  publicBucket: "homechef-prod-assets-in"
  privateBucket: "homechef-prod-docs-in"

# Production database — through the PgBouncer pooler, not the primary directly.
# Connecting direct meant maxReplicaCount pods × DB_MAX_OPEN_CONNS could exceed
# the cluster's max_connections (300) and start refusing connections outright.
# The API forces pgx's exec query mode so transaction pooling is safe.
database:
  host: "homechef-postgres-pooler-rw.homechef.svc.cluster.local"
  port: "5432"
  user: "homechef"
  name: "homechef_db"
  sslmode: "require"

# Shared Valkey. The Service is HAProxy, which only routes to the node
# reporting role:master, so a Sentinel failover needs no client awareness.
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  user: "homechef"

# Canonical Service name for the Deployment. Kept as <svc>-direct: the bare
# name was owned by the Knative Route and is not reclaimed.
service:
  nameOverride: "homechef-api-direct"

# No Kong in this cluster — `kubectl get ingressclass` returns nothing, so these
# Ingress objects have sat with an empty status.loadBalancer since creation.
# ArgoCD blocks on their health, which stalled the sync that prunes the Knative
# Services. HomeChef serves through the Istio Gateway + VirtualServices in
# manifests/homechef-istio, not through an Ingress controller.
ingress:
  enabled: false
