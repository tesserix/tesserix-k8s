# Production overrides for homechef-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Bump this timestamp when you need to force Knative to create a new
# Revision (pulls :latest fresh). The ghcr-remote pull-through cache in
# Artifact Registry can hold a stale :latest manifest; a spec change is
# the cheapest way to break it out.
podAnnotations:
  homechef.fe3dr.com/redeploy-at: "2026-04-19T13:30:00Z"

# Knative disabled — migrated to a plain Deployment + KEDA: always >=1 pod
# (no scale-to-zero, no Knative references). Scaling config lives under keda:.
knative:
  enabled: false

# Baseline replicas; KEDA's ScaledObject owns the live count (min 1, max 7).
replicaCount: 1

# Production resource allocation — memory only (no CPU, per platform policy),
# request + limit. Bump these if the API gets memory-pressured.
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"
  # The Go API reads ENVIRONMENT (config/config.go) for its log/trace "env"
  # label and as the Sentry environment fallback. Base values.yaml never sets
  # it, so prod was defaulting to "development" — tagging all prod logs, Cloud
  # Trace spans, and Sentry events as dev. Set it explicitly here.
  ENVIRONMENT: "production"
  SENTRY_ENVIRONMENT: "production"
  # HOMECHEF_ENV is not read by the Go env label, but base values.yaml sets it
  # to "development"; override for consistency in prod (matches values-local's "local").
  HOMECHEF_ENV: "production"
  # Enables the Bearer-token fallback in middleware.BFFAuth so mobile/SPA
  # clients holding a BFF-minted session_token directly (rather than routing
  # every call through the BFF's HMAC-signing proxy) can authenticate.
  # Points at the auth-bff Service's in-cluster DNS.
  BFF_SESSION_URL: "http://homechef-auth-bff.homechef.svc.cluster.local:8080/auth/session"

# The chart's own HPA stays off — KEDA's ScaledObject owns autoscaling.
autoscaling:
  enabled: false

# No VerticalPodAutoscaler — it would fight KEDA's memory trigger and override
# the explicit memory request/limit. KEDA owns replica scaling; resources are
# fixed and memory-only.
vpa:
  enabled: false

# Prod ingress is the Istio VirtualService (manifests/homechef-istio), not a
# k8s Ingress. The chart's Ingress is a dev-host artifact — keep it off in prod.
ingress:
  enabled: false
# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    enabled: true
    secretPrefix: "prod"

# KEDA autoscaling — replaces Knative. Everything here is values-driven, so
# scaling up later is a one-line change:
#   • raise maxReplicaCount to allow more pods,
#   • raise minReplicaCount for a bigger always-on floor,
#   • lower the prometheus threshold to add pods sooner under traffic.
# KEDA scales to the MAX of all triggers. No CPU triggers (platform is
# memory-only); traffic is the primary signal, memory the safety net.
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1   # always at least 1 pod
  maxReplicaCount: 7   # ceiling — bump to scale higher
  triggers:
    # Traffic: Istio requests/sec to this service (Prometheus). threshold is
    # the target req/s PER replica, so replicas ≈ total_rps / threshold.
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
        threshold: "50"
        query: 'sum(rate(istio_requests_total{destination_service_name="homechef-api",destination_service_namespace="homechef",reporter="source"}[2m]))'
    # Memory safety net (utilization %). Adds pods if memory climbs.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Email configuration (SendGrid primary, Resend fallback).
# From-address lives on tesserix.app — the one domain verified with both
# providers (Resend domain + SendGrid domain auth). fe3dr.com is NOT
# verified in Resend, so sending from it would 403 the Resend leg.
email:
  fromEmail: "noreply@tesserix.app"
  fromName: "Fe3dr HomeChef"

# GCS storage buckets
gcs:
  projectId: "tesseracthub-480811"
  publicBucket: "homechef-prod-assets-in"
  privateBucket: "homechef-prod-docs-in"

# Production database
database:
  host: "homechef-postgres-rw.homechef.svc.cluster.local"
  port: "5432"
  user: "homechef"
  name: "homechef_db"
  sslmode: "require"

# Production Redis
redis:
  host: "redis.redis-homechef.svc.cluster.local"
  port: "6379"
