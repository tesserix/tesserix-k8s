# Production overrides for homechef-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Bump this timestamp when you need to force Knative to create a new
# Revision (pulls :latest fresh). The ghcr-remote pull-through cache in
# Artifact Registry can hold a stale :latest manifest; a spec change is
# the cheapest way to break it out.
podAnnotations:
  homechef.fe3dr.com/redeploy-at: "2026-04-19T13:30:00Z"

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"
  # The Go API reads ENVIRONMENT (config/config.go) for its log/trace "env"
  # label and as the Sentry environment fallback. Base values.yaml never sets
  # it, so prod was defaulting to "development" — tagging all prod logs, Cloud
  # Trace spans, and Sentry events as dev. Set it explicitly here.
  ENVIRONMENT: "production"
  SENTRY_ENVIRONMENT: "production"
  # HOMECHEF_ENV is not read by the Go env label, but base values.yaml sets it
  # to "development"; override for consistency in prod (matches values-local's "local").
  HOMECHEF_ENV: "production"
  # Enables the Bearer-token fallback in middleware.BFFAuth so mobile/SPA
  # clients holding a BFF-minted session_token directly (rather than routing
  # every call through the BFF's HMAC-signing proxy) can authenticate.
  # Points at the auth-bff Service's in-cluster DNS.
  BFF_SESSION_URL: "http://homechef-auth-bff.homechef.svc.cluster.local:8080/auth/session"

# KEDA drives autoscaling (request-rate + memory). HPA stays off: the platform
# runs memory-only resources with no CPU requests, so a CPU-target HPA cannot work.
autoscaling:
  enabled: false
# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    enabled: true
    secretPrefix: "prod"

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 10

# Email configuration (SendGrid primary, Resend fallback).
# From-address lives on tesserix.app — the one domain verified with both
# providers (Resend domain + SendGrid domain auth). fe3dr.com is NOT
# verified in Resend, so sending from it would 403 the Resend leg.
email:
  fromEmail: "noreply@tesserix.app"
  fromName: "Fe3dr HomeChef"

# GCS storage buckets
gcs:
  projectId: "tesseracthub-480811"
  publicBucket: "homechef-prod-assets-in"
  privateBucket: "homechef-prod-docs-in"

# Production database
database:
  host: "homechef-postgres-rw.homechef.svc.cluster.local"
  port: "5432"
  user: "homechef"
  name: "homechef_db"
  sslmode: "require"

# Production Redis
redis:
  host: "redis.redis-homechef.svc.cluster.local"
  port: "6379"

# Canonical Service name for the Deployment. Kept as <svc>-direct: the bare
# name was owned by the Knative Route and is not reclaimed.
service:
  nameOverride: "homechef-api-direct"

# No Kong in this cluster — `kubectl get ingressclass` returns nothing, so these
# Ingress objects have sat with an empty status.loadBalancer since creation.
# ArgoCD blocks on their health, which stalled the sync that prunes the Knative
# Services. HomeChef serves through the Istio Gateway + VirtualServices in
# manifests/homechef-istio, not through an Ingress controller.
ingress:
  enabled: false
