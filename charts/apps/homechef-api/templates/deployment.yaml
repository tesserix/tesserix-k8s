apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homechef-api.fullname" . }}
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
  annotations:
    # Restart the pods when a referenced Secret/ConfigMap actually changes.
    #
    # Env vars sourced via secretKeyRef are read once, at pod start — rotating a
    # secret does nothing to running pods. That is how SUPER_ADMIN_EMAILS was
    # added to this deployment and to the ExternalSecret, synced correctly into
    # the Secret, and still had no effect: the pods predated the key and quietly
    # fell back to the list hardcoded in models/staff.go.
    #
    # stakater/reloader has been running in this cluster for 60 days with NOTHING
    # annotated to use it. `auto` only triggers on resources this Deployment
    # actually references, and ExternalSecrets rewrite the Secret only when the
    # upstream value changes, so this does not cause routine restarts.
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "homechef-api.selectorLabels" . | nindent 6 }}
      # Legacy revision pods carried the same app.kubernetes.io/{name,instance}
      # labels, so this extra label keeps the Deployment's Service and PDB from
      # also selecting them while both stacks run side by side.
      homechef.tesserix.io/stack: deployment
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homechef-api.labels" . | nindent 8 }}
        homechef.tesserix.io/stack: deployment
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homechef-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default .Values.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            {{- /*
              Use the SAME helper the legacy Service used. The previous inline
              list here was stale and omitted 25 vars the running API depends on
              (JWT_SECRET, DB_PASSWORD, CASHFREE_*, MONGODB_*, REDIS_*, GCS_*,
              SENDGRID/RESEND, MAPPLS_*, BFF_INTERNAL_HMAC_KEY ...), which would
              have broken auth, payments, chat and DB access on cutover.
            */}}
            {{- include "homechef-api.containerEnv" . | nindent 12 }}
          {{- if .Values.startupProbe }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path | default "/health" }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 30 }}
          {{- end }}
          {{- end }}
            {{- if .Values.nats.auth.enabled }}
            # NATS account credentials (Home-Chef-App#758). Only set when the
            # cluster enforces operator/JWT auth; the app connects anonymously
            # while empty, so this stays inert until the global cutover.
            - name: NATS_CREDS
              value: /etc/nats-creds/nats.creds
            {{- end }}
          {{- if .Values.livenessProbe }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path | default "/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.local.enabled .Values.nats.auth.enabled }}
          # readOnlyRootFilesystem ⇒ writable scratch via emptyDir locally
          # (kind has no provisioner for the prod uploads PVC). Prod path is
          # unchanged (local.enabled defaults to false).
          volumeMounts:
            {{- if .Values.local.enabled }}
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: {{ (index .Values.env "UPLOAD_DIR") | default "/app/uploads" | quote }}
            {{- end }}
            {{- if .Values.nats.auth.enabled }}
            - name: nats-creds
              mountPath: /etc/nats-creds
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.local.enabled .Values.nats.auth.enabled }}
      volumes:
        {{- if .Values.local.enabled }}
        - name: tmp
          emptyDir: {}
        - name: uploads
          emptyDir: {}
        {{- end }}
        {{- if .Values.nats.auth.enabled }}
        # Projects the NATS_CREDS_FILE key from the ESO-synced secret as a file.
        - name: nats-creds
          secret:
            secretName: {{ include "homechef-api.fullname" . }}-secrets
            items:
              - key: NATS_CREDS_FILE
                path: nats.creds
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
