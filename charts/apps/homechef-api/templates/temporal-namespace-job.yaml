{{- if .Values.temporal.enabled }}
# Registers the `homechef` Temporal namespace on the SHARED cluster (in the
# scrapper namespace). Idempotent: describe first, register only if missing.
# Runs as an ArgoCD PostSync hook so it re-runs on each sync and is recreated
# cleanly. Sidecar injection is disabled so the Job can actually complete (an
# Istio sidecar would keep the pod Running). See epic #116 / #119.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "homechef-api.fullname" . }}-temporal-namespace
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-namespace
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "homechef-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-namespace
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: {{ .Values.temporal.adminToolsImage | quote }}
          env:
            - name: TEMPORAL_CLI_ADDRESS
              value: {{ .Values.temporal.hostPort | quote }}
            - name: NS
              value: {{ .Values.temporal.namespace | quote }}
            - name: RETENTION
              value: {{ .Values.temporal.retention | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if tctl --namespace "$NS" namespace describe >/dev/null 2>&1; then
                echo "Temporal namespace '$NS' already exists"
              else
                echo "registering Temporal namespace '$NS'"
                tctl --namespace "$NS" namespace register \
                  --retention "$RETENTION" \
                  --description "HomeChef workflows (epic #116)"
              fi
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
