{{- if .Values.temporal.enabled }}
# Registers the `homechef` Temporal namespace on HomeChef's dedicated Temporal.
# Idempotent: describe first, register only if missing.
#
# PreSync (not PostSync): the worker Deployment FATALs on startup if its Temporal
# namespace doesn't exist ("Namespace homechef is not found") and CrashLoops. On
# a first cutover to a fresh Temporal the namespace isn't there yet, so it must
# be registered BEFORE the worker/API pods roll — a PostSync hook never gets to
# run because the sync never goes healthy (chicken-and-egg). PreSync breaks that.
# Sidecar injection is disabled so the Job can actually complete (an Istio
# sidecar would keep the pod Running). See epic #116 / #119.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "homechef-api.fullname" . }}-temporal-namespace
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-namespace
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
# Deliberately NO ttlSecondsAfterFinished: a TTL deleting this Job while ArgoCD is still
# watching it leaves the PreSync hook unresolvable, wedging the whole app sync (it did,
# 2026-08-02). BeforeHookCreation already bounds it to one Job and keeps its logs.
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "homechef-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-namespace
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: {{ .Values.temporal.adminToolsImage | quote }}
          env:
            - name: TEMPORAL_CLI_ADDRESS
              value: {{ .Values.temporal.hostPort | quote }}
            - name: NS
              value: {{ .Values.temporal.namespace | quote }}
            - name: RETENTION
              value: {{ .Values.temporal.retention | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if tctl --namespace "$NS" namespace describe >/dev/null 2>&1; then
                echo "Temporal namespace '$NS' already exists"
              else
                echo "registering Temporal namespace '$NS'"
                tctl --namespace "$NS" namespace register \
                  --retention "$RETENTION" \
                  --description "HomeChef workflows (epic #116)"
              fi
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
