{{- if .Values.knative.enabled }}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "homechef-api.fullname" . }}
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/disableAutoTLS: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | default "0" | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | default "10" | quote }}
        autoscaling.knative.dev/target: {{ .Values.knative.concurrencyTarget | default "100" | quote }}
        {{- if .Values.knative.scaleDownDelay }}
        autoscaling.knative.dev/scale-down-delay: {{ .Values.knative.scaleDownDelay | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "homechef-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containerConcurrency: {{ .Values.knative.containerConcurrency | default 0 }}
      timeoutSeconds: {{ .Values.knative.timeoutSeconds | default 300 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homechef-api.serviceAccountName" . }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            {{- if ne $key "PORT" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            # Database connection settings
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslmode | quote }}
            # Database password from ExternalSecret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: DB_PASSWORD
            # Redis URL (app reads REDIS_URL, not separate host/port)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            # JWT secrets from ExternalSecret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: JWT_REFRESH_SECRET
            # Exchange rates API keys from ExternalSecret
            - name: OPENEXCHANGERATES_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: OPENEXCHANGERATES_APP_ID
                  optional: true
            - name: EXCHANGERATES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: EXCHANGERATES_API_KEY
                  optional: true
            # Razorpay payment secrets from ExternalSecret
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: RAZORPAY_KEY_ID
                  optional: true
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: RAZORPAY_KEY_SECRET
                  optional: true
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: RAZORPAY_WEBHOOK_SECRET
                  optional: true
            # SendGrid email configuration
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: SENDGRID_API_KEY
                  optional: true
            # Shared HMAC key for the internal BFF→API trust header. The
            # auth-bff signs every internal call with this key; the Go
            # API verifies and rejects unsigned/mismatched requests.
            # Sourced from prod-homechef-bff-internal-hmac-key in GCP
            # Secret Manager — same key the homechef-auth-bff pod reads.
            - name: BFF_INTERNAL_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "homechef-api.fullname" . }}-secrets
                  key: BFF_INTERNAL_HMAC_KEY
            {{- if .Values.email }}
            - name: FROM_EMAIL
              value: {{ .Values.email.fromEmail | quote }}
            - name: FROM_NAME
              value: {{ .Values.email.fromName | quote }}
            {{- end }}
            # GCS storage configuration
            {{- if .Values.gcs }}
            - name: GCS_PROJECT_ID
              value: {{ .Values.gcs.projectId | quote }}
            - name: GCS_PUBLIC_BUCKET
              value: {{ .Values.gcs.publicBucket | quote }}
            - name: GCS_PRIVATE_BUCKET
              value: {{ .Values.gcs.privateBucket | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
{{- end }}
