{{- if .Values.gcp.secretManager.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "homechef-api.fullname" . }}-secrets
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "homechef-api.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ printf "%s-homechef-postgresql-password" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-jwt-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-jwt-refresh-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: OPENEXCHANGERATES_APP_ID
      remoteRef:
        key: {{ printf "%s-homechef-openexchangerates-app-id" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: EXCHANGERATES_API_KEY
      remoteRef:
        key: {{ printf "%s-homechef-exchangerates-api-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: {{ printf "%s-sendgrid-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Resend — always-on fallback email provider behind SendGrid. Same
    # platform-wide shared key as SendGrid (not product-prefixed).
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ printf "%s-resend-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Shared HMAC key for the internal BFF→API trust header. Must match
    # the value homechef-auth-bff reads from its own ExternalSecret
    # (external-secrets/prod/homechef/externalsecret.yaml → BFF_INTERNAL_HMAC_KEY).
    # Sourced from the same GCP Secret Manager entry so the two pods stay in sync.
    - secretKey: BFF_INTERNAL_HMAC_KEY
      remoteRef:
        key: {{ printf "%s-homechef-bff-internal-hmac-key" .Values.gcp.secretManager.secretPrefix }}
    # Google Routes API key (#701) — real road distance for self-delivery pricing.
    # Routes-restricted key; the API only reads it to call routes.googleapis.com.
    # Optional: if the secret is absent the API falls back to the haversine
    # winding-factor estimate, so this never blocks startup.
    - secretKey: GOOGLE_MAPS_API_KEY
      remoteRef:
        key: {{ printf "%s-homechef-google-maps-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Google Weather API key (#706) — weather surge in the self-delivery estimate.
    # Separate, Weather-restricted key. Optional: absent ⇒ weather factor neutral.
    - secretKey: GOOGLE_WEATHER_API_KEY
      remoteRef:
        key: {{ printf "%s-homechef-google-weather-api-key" .Values.gcp.secretManager.secretPrefix }}
    # HMAC key signing the quoted delivery surge (#704-706). Self-generated, like
    # BFF_INTERNAL_HMAC_KEY — no vendor. It binds a quoted multiplier to a chef +
    # drop so CreateOrder charges the conditions the customer actually saw rather
    # than re-reading traffic/weather that may have moved since.
    # MUST be identical across replicas and stable across restarts: a pin signed by
    # one pod and rejected by another silently falls back to live pricing.
    # Absent ⇒ surge is display-only, whatever DELIVERY_SURGE_CHARGE_ENABLED says.
    # Re-rendered: argocd's repo-server caches manifests per commit SHA, and the
    # render for the commit that introduced this key was cached without it.
    - secretKey: DELIVERY_SURGE_PIN_KEY
      remoteRef:
        key: {{ printf "%s-homechef-delivery-surge-pin-key" .Values.gcp.secretManager.secretPrefix }}
    # Mappls (MapmyIndia) OAuth2 credentials (#address-search) — primary address
    # geocoder: India-native, flat-level accuracy with precise coordinates so the
    # delivery-fee distance is priced on a real drop point. Optional: if either is
    # absent the API falls back to the Photon (OSM) geocoder, so this never blocks
    # startup.
    - secretKey: MAPPLS_CLIENT_ID
      remoteRef:
        key: {{ printf "%s-homechef-mappls-client-id" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: MAPPLS_CLIENT_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-mappls-client-secret" .Values.gcp.secretManager.secretPrefix }}
    # Comma-separated super-admin allowlist, replacing the addresses hardcoded
    # in apps/api/models/staff.go. See the SUPER_ADMIN_EMAILS block in
    # _helpers.tpl for why it is mounted optional.
    - secretKey: SUPER_ADMIN_EMAILS
      remoteRef:
        key: {{ printf "%s-homechef-admin-allowed-emails" .Values.gcp.secretManager.secretPrefix }}
    # In-app feedback and ideas open labelled issues on the app's own repo.
    # Deliberately unprefixed: the PAT is granted across repos so every app can
    # file against its own, and one rotation surface beats five.
    - secretKey: GITHUB_FEEDBACK_TOKEN
      remoteRef:
        key: prod-github-feedback-token
    {{- if .Values.appleSignIn.revocationEnabled }}
    # Sign in with Apple revocation (App Review 5.1.1(v)). Gated because ESO
    # fails the WHOLE ExternalSecret when any remoteRef is missing — enabling
    # this before the GCP secrets exist would take DB_PASSWORD, JWT_SECRET and
    # everything else down with it. Create both secrets first, then flip
    # appleSignIn.revocationEnabled in values-prod.yaml.
    #   prod-homechef-apple-key-id             — the .p8's Key ID
    #   prod-homechef-apple-signin-private-key-b64 — base64 of the .p8 contents
    - secretKey: APPLE_KEY_ID
      remoteRef:
        key: {{ printf "%s-homechef-apple-key-id" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: APPLE_SIGNIN_PRIVATE_KEY_B64
      remoteRef:
        key: {{ printf "%s-homechef-apple-signin-private-key-b64" .Values.gcp.secretManager.secretPrefix }}
    {{- end }}
    {{- if .Values.nats.auth.enabled }}
    # NATS HOMECHEF-account credentials (.creds file) for operator/JWT auth
    # (Home-Chef-App#758). Mounted as a file; the API reads it via NATS_CREDS.
    - secretKey: NATS_CREDS_FILE
      remoteRef:
        key: {{ printf "%s-nats-creds-homechef" .Values.gcp.secretManager.secretPrefix }}
    {{- end }}
{{- end }}
