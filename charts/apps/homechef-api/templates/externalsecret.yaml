{{- if .Values.gcp.secretManager.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "homechef-api.fullname" . }}-secrets
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "homechef-api.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ printf "%s-homechef-postgresql-password" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ printf "%s-homechef-redis-password" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-jwt-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-jwt-refresh-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: OPENEXCHANGERATES_APP_ID
      remoteRef:
        key: {{ printf "%s-homechef-openexchangerates-app-id" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: EXCHANGERATES_API_KEY
      remoteRef:
        key: {{ printf "%s-homechef-exchangerates-api-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: {{ printf "%s-razorpay-key-id" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: {{ printf "%s-razorpay-key-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: {{ printf "%s-razorpay-webhook-secret" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: {{ printf "%s-sendgrid-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Resend — always-on fallback email provider behind SendGrid. Same
    # platform-wide shared key as SendGrid (not product-prefixed).
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ printf "%s-resend-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Shared HMAC key for the internal BFF→API trust header. Must match
    # the value homechef-auth-bff reads from its own ExternalSecret
    # (external-secrets/prod/homechef/externalsecret.yaml → BFF_INTERNAL_HMAC_KEY).
    # Sourced from the same GCP Secret Manager entry so the two pods stay in sync.
    - secretKey: BFF_INTERNAL_HMAC_KEY
      remoteRef:
        key: {{ printf "%s-homechef-bff-internal-hmac-key" .Values.gcp.secretManager.secretPrefix }}
    # Google Routes API key (#701) — real road distance for self-delivery pricing.
    # Routes-restricted key; the API only reads it to call routes.googleapis.com.
    # Optional: if the secret is absent the API falls back to the haversine
    # winding-factor estimate, so this never blocks startup.
    - secretKey: GOOGLE_MAPS_API_KEY
      remoteRef:
        key: {{ printf "%s-homechef-google-maps-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Google Weather API key (#706) — weather surge in the self-delivery estimate.
    # Separate, Weather-restricted key. Optional: absent ⇒ weather factor neutral.
    - secretKey: GOOGLE_WEATHER_API_KEY
      remoteRef:
        key: {{ printf "%s-homechef-google-weather-api-key" .Values.gcp.secretManager.secretPrefix }}
    # Mappls (MapmyIndia) OAuth2 credentials (#address-search) — primary address
    # geocoder: India-native, flat-level accuracy with precise coordinates so the
    # delivery-fee distance is priced on a real drop point. Optional: if either is
    # absent the API falls back to the Photon (OSM) geocoder, so this never blocks
    # startup.
    - secretKey: MAPPLS_CLIENT_ID
      remoteRef:
        key: {{ printf "%s-homechef-mappls-client-id" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: MAPPLS_CLIENT_SECRET
      remoteRef:
        key: {{ printf "%s-homechef-mappls-client-secret" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
