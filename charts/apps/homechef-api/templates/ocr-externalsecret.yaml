{{- if .Values.ocr.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homechef-ocr-client
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-homechef-production
    kind: SecretStore
  target:
    name: homechef-ocr-client
    creationPolicy: Owner
  data:
    - secretKey: OCR_KEY_SECRET
      remoteRef:
        key: homechef/app/homechef-api-ocr-key
        property: value
{{- end }}
