{{- if and .Values.temporal.enabled .Values.temporal.worker.enabled }}
# HomeChef Temporal worker (#116). Runs the same image as the API with a command
# override (/usr/local/bin/worker), connected to the SHARED Temporal cluster in
# the scrapper namespace on the `homechef` namespace. Shares the API's exact env
# (homechef-api.containerEnv helper) so DB/Redis/mailer/Cashfree/Temporal config
# matches the API. A plain Deployment (not Knative) — workers are long-running,
# not request-driven.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homechef-api.fullname" . }}-temporal-worker
  labels:
    {{- include "homechef-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: {{ .Values.temporal.worker.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "homechef-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-worker
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homechef-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: temporal-worker
    spec:
      serviceAccountName: {{ include "homechef-api.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/worker"]
          env:
            {{- include "homechef-api.containerEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.temporal.worker.resources | nindent 12 }}
{{- end }}
