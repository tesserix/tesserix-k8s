# Default values for homechef-api
replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"
  # Exclude NATS port from Istio sidecar to fix JetStream timeout issues
  # Exclude GCP metadata server from Istio for Workload Identity
  # Prometheus metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: dev-homechef.tesserix.app
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: homechef-api-tls
      hosts:
        - dev-homechef.tesserix.app

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

knative:
  enabled: false
  minScale: 0
  maxScale: 10
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - homechef-api
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  PORT: "8080"
  GIN_MODE: "release"
  HOMECHEF_ENV: "development"
  # Database
  DATABASE_HOST: "postgresql.postgresql.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "homechef"
  DATABASE_SSLMODE: "require"
  # Redis
  REDIS_HOST: "redis.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  # NATS
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  # Temporal (durable execution, #116). Commented until a Temporal cluster is
  # actually deployed — setting TEMPORAL_HOSTPORT makes the API dial Temporal on
  # boot (it falls back gracefully on failure, but there's no point dialing a
  # cluster that doesn't exist yet). Uncomment together with temporal.enabled once
  # the cluster is live.
  # TEMPORAL_HOSTPORT: "temporal.scrapper.svc.cluster.local:7233"
  # TEMPORAL_NAMESPACE: "homechef"
  # JWT
  JWT_EXPIRY: "24h"
  REFRESH_TOKEN_EXPIRY: "168h"
  # CORS
  CORS_ORIGINS: "https://dev-homechef.tesserix.app,https://dev-vendors-homechef.tesserix.app"
  # Uploads
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE: "10485760"

# Persistence configuration for uploads.
# economy-rwo (pd-standard) — user uploads, infrequent IO.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: "economy-rwo"
  mountPath: /app/uploads

# ConfigMap for additional configuration
configMap:
  # Workload Identity is always enabled
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database connection settings (used by deployment template for explicit DB_* env vars)
database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "homechef"
  name: "homechef"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "homechef"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    enabled: false
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

# Redis connection settings
redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

# LOCAL / kind mode. OFF by default — prod behavior is completely unchanged.
# When enabled (see values-local.yaml), the API stops using GCP Secret Manager
# (USE_GCP_SECRET_MANAGER=false) and reads DB_PASSWORD / REDIS_PASSWORD (and any
# extraSecretKeys) directly from a plain Secret, plus mounts emptyDir scratch
# for the readOnlyRootFilesystem.
local:
  enabled: false
  secretName: homechef-local-secrets
  # Extra keys to surface from the local Secret as env vars (optional).
  extraSecretKeys:
    - JWT_SECRET
    - JWT_REFRESH_SECRET
    - BFF_INTERNAL_HMAC_KEY

# Temporal durable-execution wiring (#116).
# GATED OFF: no Temporal cluster is actually deployed yet — the charts/apps/temporal
# app-def is dormant (not referenced by any ArgoCD kustomization; no temporal pods
# exist in any namespace). Enabling the worker/namespace-Job without a live cluster
# crashloops the worker. Flip enabled -> true AFTER deploying the Temporal cluster
# (add ai-apps/temporal.yaml to the ai-apps kustomization, or deploy
# temporal-platform.yaml). The API stays graceful regardless (logs a warning and
# uses inline fallbacks when it can't reach Temporal).
temporal:
  enabled: false
  hostPort: "temporal.scrapper.svc.cluster.local:7233"
  namespace: "homechef"
  retention: "168h"
  adminToolsImage: "asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/third-party/temporal-admin-tools:1.28.1"
  # Worker Deployment — runs the homechef workflows/activities (same image as the
  # API, command override /usr/local/bin/worker). Memory-only per platform policy.
  #
  # GATED OFF until Kargo promotes an image built from a commit that includes the
  # worker binary (Dockerfile `go build ./cmd/worker`). Deploying it against an
  # older image would crashloop (no /usr/local/bin/worker). Flip to true once a
  # current image is promoted to the homechef prod stage.
  worker:
    enabled: true
    replicas: 1
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 768Mi
