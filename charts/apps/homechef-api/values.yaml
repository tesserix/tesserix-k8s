# Default values for homechef-api
replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"
  # Exclude NATS (4222) from the Istio sidecar — JetStream's long-lived control
  # streams (stream/consumer create, PubAck, pull fetch) time out when routed
  # through the proxy. Restored after the value was lost (only the comment
  # remained); now that the API publishes/consumes via JetStream this is load-
  # bearing, not cosmetic.
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222"
  # Exclude the GCP metadata server from Istio for Workload Identity.
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  # Prometheus metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  # Set during the Knative migration only (the canonical name is still owned by
  # the Knative Route). Cleared once the ksvc is removed.
  nameOverride: ""
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: dev-homechef.tesserix.app
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: homechef-api-tls
      hosts:
        - dev-homechef.tesserix.app

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - homechef-api
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  PORT: "8080"
  GIN_MODE: "release"
  HOMECHEF_ENV: "development"
  # Database
  DATABASE_HOST: "postgresql.postgresql.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "homechef"
  DATABASE_SSLMODE: "require"
  # Redis
  REDIS_HOST: "redis.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  # MongoDB — in-app chat + document uploads (#53). MONGODB_URI is assembled in
  # _helpers.tpl from the Percona-operator credentials secret (it interpolates
  # $(MONGODB_USER)/$(MONGODB_PASSWORD), so it must come after those env vars and
  # can't live in this plain map). Only the DB name is a plain value here.
  MONGODB_DB: "homechef_chat"
  # NATS
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  # JetStream stream replica factor — 3 to match the 3-node JetStream HA cluster
  # so stream data survives a node loss (local/dev defaults to 1).
  NATS_STREAM_REPLICAS: "3"
  # Temporal (durable execution, #116). Commented until a Temporal cluster is
  # actually deployed — setting TEMPORAL_HOSTPORT makes the API dial Temporal on
  # boot (it falls back gracefully on failure, but there's no point dialing a
  # cluster that doesn't exist yet). Uncomment together with temporal.enabled once
  # the cluster is live.
  TEMPORAL_HOSTPORT: "temporal.scrapper.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "homechef"
  # JWT
  JWT_EXPIRY: "24h"
  REFRESH_TOKEN_EXPIRY: "168h"
  # CORS
  CORS_ORIGINS: "https://dev-homechef.tesserix.app,https://dev-vendors-homechef.tesserix.app"
  # Uploads
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE: "10485760"
  # OpenTelemetry — OTLP gRPC endpoint for the in-cluster collector (traces +
  # metrics). The API no-ops telemetry export when this is empty.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  # Feature flags (read at startup by apps/api/config/config.go). Group/office
  # ("corporate") orders — enabled so it can be tested. The API also reads a
  # runtime override from the platform_policy PlatformSettings (env OR policy
  # enables it), so prod can toggle without a redeploy.
  GROUP_ORDERS_ENABLED: "true"
  # Tiffin meal-plan escrow money flow: customer pays the full plan (food + GST +
  # delivery) upfront into the platform account, chef payouts are held per-day and
  # released as each day is served, unserved days refund. Hardened + money-conserving
  # (Home-Chef-App #384/#385/#386). Enabled to test the paid flow end-to-end.
  MEAL_PLAN_ESCROW_ENABLED: "true"

# Persistence configuration for uploads.
# DISABLED: prod uploads go to GCS, and the deployment only mounts a local
# uploads volume when local.enabled (kind/dev). With persistence.enabled=true
# the PVC was created but never mounted -> stuck Pending (WaitForFirstConsumer)
# forever, keeping the app perpetually Progressing. Re-enable only if a real
# consumer mounts it.
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: "economy-rwo"
  mountPath: /app/uploads

# ConfigMap for additional configuration
configMap:
  # Workload Identity is always enabled
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database connection settings (used by deployment template for explicit DB_* env vars)
database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "homechef"
  name: "homechef"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "homechef"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    enabled: false
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

# Redis connection settings
redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

# LOCAL / kind mode. OFF by default — prod behavior is completely unchanged.
# When enabled (see values-local.yaml), the API stops using GCP Secret Manager
# (USE_GCP_SECRET_MANAGER=false) and reads DB_PASSWORD / REDIS_PASSWORD (and any
# extraSecretKeys) directly from a plain Secret, plus mounts emptyDir scratch
# for the readOnlyRootFilesystem.
local:
  enabled: false
  secretName: homechef-local-secrets
  # Extra keys to surface from the local Secret as env vars (optional).
  extraSecretKeys:
    - JWT_SECRET
    - JWT_REFRESH_SECRET
    - BFF_INTERNAL_HMAC_KEY

# Temporal durable-execution wiring (#116).
# Cluster is LIVE: charts/apps/temporal (single-node auto-setup) runs in the
# `scrapper` namespace, reachable at temporal.scrapper.svc.cluster.local:7233.
# The API dials it on boot and stays graceful regardless (logs a warning and
# uses inline fallbacks when it can't reach Temporal).
temporal:
  enabled: true
  hostPort: "temporal.scrapper.svc.cluster.local:7233"
  namespace: "homechef"
  retention: "168h"
  adminToolsImage: "asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/third-party/temporal-admin-tools:1.28"
  # Worker Deployment — runs the homechef workflows/activities (same image as the
  # API, command override /usr/local/bin/worker). Memory-only per platform policy.
  #
  # Prod stage is now on >= main-8573387 (worker binary present at /usr/local/bin/worker)
  # and homechef->scrapper:7233 connectivity is verified (the API logs "Temporal
  # connected"). The worker shares the API image with a /usr/local/bin/worker command
  # override and runs the homechef workflows/activities. Memory-only per platform policy.
  worker:
    enabled: true
    replicas: 1
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 768Mi

# NATS operator/JWT auth (Home-Chef-App#758). Inert until the cluster enforces
# auth AND prod-nats-creds-homechef exists in GCP Secret Manager. When enabled:
# the HOMECHEF-account .creds file is synced via ESO, mounted at
# /etc/nats-creds/nats.creds, and passed to the API via NATS_CREDS.
nats:
  auth:
    enabled: false
