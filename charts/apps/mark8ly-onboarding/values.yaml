namespace: mark8ly
name: mark8ly-onboarding
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-onboarding
  tag: "sha-c79ce8e6eda6" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4201
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger.
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
authBffUrl: "http://mark8ly-auth-bff:8087"
public:
  gipProjectId: "tesseracthub-480811"
  gipTenantId: "MP-Internal-e986p"
  # GIP tenant pool for marketplace customer (storefront) users.
  # Used only by the /auth/google trampoline page that bounces
  # customer sign-ins from per-tenant subdomains.
  gipCustomerTenantId: "MP-Customer-39opy"
  gipApiKey: "" # fetched at runtime from mark8ly-gip secret
  googleClientId: "849928263410-5djgu3n40c5tpr86votuptkitqveegor.apps.googleusercontent.com" # public OAuth client id — same client used by mark8ly.com trampoline + admin
