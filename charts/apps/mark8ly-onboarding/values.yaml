namespace: mark8ly
name: mark8ly-onboarding
image:
  repository: ghcr.io/tesserix/mark8ly-onboarding
  tag: "sha-be2965d753cb" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4201
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
authBffUrl: "http://mark8ly-auth-bff:8087"
public:
  gipProjectId: "tesseracthub-480811"
  gipTenantId: "MP-Internal-e986p"
  gipApiKey: "" # fetched at runtime from mark8ly-gip secret
  googleClientId: "" # public OAuth client id — safe to inline in values-prod later
