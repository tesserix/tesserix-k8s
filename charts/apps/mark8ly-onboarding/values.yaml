namespace: mark8ly
name: mark8ly-onboarding

# Prod owns the bare apex (mark8ly.com) — UAT has to disable the
# in-chart VS or it would hijack the prod host from a different
# namespace. UAT routing is handled by mark8ly-uat-istio instead.
virtualService:
  enabled: true
  host: "mark8ly.com"
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-onboarding
  tag: "sha-493c3652c68d" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 4201
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger.
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
platformApiUrl: "http://mark8ly-platform-api:8086"
authBffUrl: "http://mark8ly-auth-bff:8087"
public:
  gipProjectId: "tesseracthub-480811"
  gipTenantId: "MP-Internal-e986p"
  # GIP tenant pool for marketplace customer (storefront) users.
  # Used only by the /auth/google trampoline page that bounces
  # customer sign-ins from per-tenant subdomains.
  gipCustomerTenantId: "MP-Customer-39opy"
  gipApiKey: "" # fetched at runtime from mark8ly-gip secret
  googleClientId: "849928263410-5djgu3n40c5tpr86votuptkitqveegor.apps.googleusercontent.com" # public OAuth client id — same client used by mark8ly.com trampoline + admin

# Secret resource names — overridden in values-uat.yaml so the UAT
# overlay can swap to `mark8ly-uat-*` Secrets without retemplating.
secrets:
  session: mark8ly-session
  gip: mark8ly-gip

# Page-view analytics via the self-hosted OpenPanel at analytics.tesserix.app.
# The client ID is a public write key, so it lives in a Secret only because the
# project-init job is what mints it — nothing here is confidential.
openpanel:
  enabled: true
  secretName: openpanel-client-ids
  clientIdKey: tenant-onboarding-client-id
  apiUrl: https://analytics.tesserix.app/api
  scriptUrl: https://analytics.tesserix.app/op1.js

# Replace before surging, so a rollout frees a pod's memory before it
# needs the replacement's (#709).
#
# The default is 25%/25%, which on a single-replica Deployment rounds to
# maxSurge=1, maxUnavailable=0: the new pod must SCHEDULE BEFORE the old
# one dies, so a roll needs double the pod's memory at once. On a cluster
# whose memory requests sit near 100% (while actual usage is around half
# that) the new pod pends forever and the rollout deadlocks — with the
# Deployment still reporting Available=True, because the old pod keeps
# serving. On 2026-08-30 that left seven mark8ly deployments stuck and
# production a day behind main, with nothing alerting.
#
# The cost is honest and accepted: on a single-replica service this is a
# brief 503 during each rollout, where surge-first gave none. Deploys that
# always complete are worth more than a few seconds of downtime on an
# operator-timed rollout. Same remedy as temporal (#538) and devai (#600).
#
# At 2+ replicas there is no downtime at all: one pod stays up while the
# other is replaced.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
