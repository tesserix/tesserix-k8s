# UAT overlay for mark8ly-onboarding.
namespace: mark8ly-uat
name: mark8ly-uat-onboarding

# Routing for onboarding-uat.mark8ly.com is owned by mark8ly-uat-istio
# (charts/apps/mark8ly-uat-istio). Leaving the in-chart VS enabled would
# create a second VS in this namespace claiming the bare mark8ly.com
# host and cross-namespace-collide with the prod onboarding VS.
virtualService:
  enabled: false

keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 1
  # Scale-to-zero in UAT via istio request-rate. Cold start: first request
  # returns 503, prometheus picks it up within pollingInterval (30s), KEDA
  # scales the deployment 0->1. Subsequent requests succeed once pod ready.
  prometheus:
    enabled: true
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    threshold: "0.01"
    query: 'sum(rate(istio_requests_total{destination_service_name="mark8ly-uat-onboarding",reporter="source"}[1m]))'
pdb:
  enabled: false
resources:
  requests:
    memory: 96Mi

platformApiUrl: "http://mark8ly-uat-platform-api:8086"
authBffUrl: "http://mark8ly-uat-auth-bff:8087"

# Tenant IDs MUST match what CI bakes into the onboarding client
# bundle (NEXT_PUBLIC_GIP_*_TENANT_ID) — currently the prod tenants.
# If runtime + bundle disagree, server-side verify rejects the GIP
# tokens minted against the bundle's tenant. Tracked as the Phase 7
# GIP-isolation refactor: lift NEXT_PUBLIC_GIP_* out of the bundle
# (server resolve from request host) so envs can diverge.
public:
  gipProjectId: "tesseracthub-480811"
  gipTenantId: "MP-Internal-e986p"
  gipCustomerTenantId: "MP-Customer-39opy"
  gipApiKey: ""  # fetched at runtime from mark8ly-uat-gip secret
  googleClientId: "849928263410-5djgu3n40c5tpr86votuptkitqveegor.apps.googleusercontent.com"

# Override secret names to the UAT-side ExternalSecret targets.
secrets:
  session: mark8ly-uat-session
  gip: mark8ly-uat-gip
