apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - "mark8ly.com"
  gateways:
    - istio-ingress/tesseract-gateway
  http:
    - route:
        - destination:
            host: {{ .Values.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: 30s
