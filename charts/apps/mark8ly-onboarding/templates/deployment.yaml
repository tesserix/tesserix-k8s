apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- if .Values.openpanel.enabled }}
            # Written into this namespace by the openpanel project-init job;
            # optional so a first deploy doesn't block on the job finishing.
            - name: OPENPANEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openpanel.secretName }}
                  key: {{ .Values.openpanel.clientIdKey }}
                  optional: true
            - name: OPENPANEL_API_URL
              value: {{ .Values.openpanel.apiUrl | quote }}
            # Without this the SDK loads its script from openpanel.dev's CDN.
            - name: OPENPANEL_SCRIPT_URL
              value: {{ .Values.openpanel.scriptUrl | quote }}
            {{- end }}
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            - name: AUTH_BFF_URL
              value: {{ .Values.authBffUrl | quote }}
            - name: NEXT_PUBLIC_GIP_PROJECT_ID
              value: {{ .Values.public.gipProjectId | quote }}
            - name: NEXT_PUBLIC_GIP_TENANT_ID
              value: {{ .Values.public.gipTenantId | quote }}
            - name: NEXT_PUBLIC_GIP_CUSTOMER_TENANT_ID
              value: {{ .Values.public.gipCustomerTenantId | quote }}
            # Server-side HMAC key for /auth/google trampoline mint of
            # the cross-host exchange code. MUST match the storefront's
            # SESSION_ENCRYPT_KEY so the storefront's /auth/google/finish
            # route can verify codes minted here.
            - name: SESSION_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.session }}
                  key: SESSION_ENCRYPT_KEY
            - name: NEXT_PUBLIC_GIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gip }}
                  key: GIP_WEB_API_KEY
            - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
              value: {{ .Values.public.googleClientId | quote }}
          # Probes hit a static API health route to keep them cheap and
          # decoupled from the SSR'd marketing pages.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.resources | indent 12 }}
          # Standalone Next.js writes to /tmp for font/image optimization.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/{{ trimPrefix "mark8ly-" .Values.name }}/.next/cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
