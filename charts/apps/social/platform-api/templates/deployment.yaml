apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: tesserix-social
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: tesserix-social
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: migrate
          image: "{{ .Values.image.migrateTarget }}:{{ .Values.image.tag }}"
          command: ["/migrate", "up"]
          env:
{{ include "social-platform-api.dbEnv" . | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENV
              value: {{ .Values.env | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
{{ include "social-platform-api.dbEnv" . | indent 12 }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalJwtSecretName }}
                  key: INTERNAL_JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
