# Values for social-platform-api (single-env: prod).

namespace: social
name: social-platform-api

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-platform-api
  migrateTarget: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-platform-api
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8081

env: prod

resources:
  requests:
    memory: 192Mi
  limits:
    memory: 384Mi

database:
  host: social-postgres-rw.social.svc.cluster.local
  port: 5432
  name: social_platform_api
  secretName: social-postgres-platform-api
  sslmode: require

# Service-to-service JWT verification — minted by auth-bff, verified here.
internalJwtSecretName: social-internal-jwt

# AES-256-GCM key (32 bytes hex) for at-rest encryption of BYO LLM keys
# and channel OAuth tokens. Provisioned via ExternalSecret.
encryptionSecretName: social-platform-api-encryption

# Scheduler queue — the queue instance, not the cache: a scheduled post must
# not be evicted under memory pressure.
redis:
  url: "redis://global-valkey-queue.global.svc.cluster.local:6379"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5

pdb:
  enabled: true
  maxUnavailable: 1
