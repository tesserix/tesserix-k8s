# Production overrides for social-auth-bff.

env: prod

image:
  tag: "latest" # Bumped per release by CI

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

gip:
  projectId: "tesseracthub-480811"
  tenantId: "social-prod-PLACEHOLDER"

session:
  cookieName: "social_session"
  cookieDomain: ".tesserix.app"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 300

pdb:
  enabled: true
  maxUnavailable: 1
