# Values for social-auth-bff (single-env: prod).

namespace: social
name: social-auth-bff

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-auth-bff
  migrateTarget: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-auth-bff
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8080

env: prod

resources:
  requests:
    memory: 192Mi
  limits:
    memory: 384Mi

# Database — CNPG cluster created by social-postgres chart.
database:
  host: social-postgres-rw.social.svc.cluster.local
  port: 5432
  name: social_auth_bff
  secretName: social-postgres-auth-bff
  sslmode: require

# GIP — non-secret values live here; web API key + OAuth client secret
# come from the social-gip Secret (via ExternalSecret).
gip:
  projectId: "tesseracthub-480811"
  tenantId: "Social-tuhg7"

oauth:
  # OAuth 2.0 Web client created in the GCP project.
  clientId: "849928263410-jemqn4sn0id1cvisa726r7nhubukp0qe.apps.googleusercontent.com"

session:
  cookieName: "social_session"
  cookieDomain: ".tesserix.app"

# Where platform-api lives in cluster (auth-bff reverse-proxies /api/v1/*).
platformApiUrl: "http://social-platform-api.social.svc.cluster.local:8081"

# Public origin used to build the OAuth redirect_uri returned to Google.
appBaseUrl: "https://social.tesserix.app"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 300

pdb:
  enabled: true
  maxUnavailable: 1
