# Values for social-postgres (single-env: prod).
#
# Starts at instances=1; bump to 3 (1 primary + 1 sync replica + 1 async)
# once the workload justifies HA. Backup is disabled by default —
# enable when you have the GCS bucket + IAM in place (see backup section).

hibernate: false

namespace: social
clusterName: social-postgres

instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

storageSize: 50Gi
walStorageSize: 10Gi
storageClass: standard-rwo-retain

resources:
  requests:
    memory: 2Gi
  limits:
    memory: 4Gi

# Two logical databases: auth_bff (sessions, OIDC state) + platform_api
# (posts, oauth_tokens, post_metrics, reports). One Postgres cluster, two
# separate roles + databases.
bootstrap:
  primaryDatabase: social_platform_api
  primaryOwner: platform_api
  primarySecret: social-postgres-platform-api
  secondaryDatabase: social_auth_bff
  secondaryOwner: auth_bff
  secondarySecret: social-postgres-auth-bff

# WAL archive + scheduled backups. Enable only after confirming
# `gs://tesseract-prod-backups-in/social-postgres` exists and the CNPG
# cluster's ServiceAccount has roles/storage.objectAdmin on it.
backup:
  enabled: false
  destinationPath: "gs://tesseract-prod-backups-in/social-postgres"
  retentionPolicy: "3d"

networkPolicy:
  enabled: true
  cnpgSystemNamespace: cnpg-system
