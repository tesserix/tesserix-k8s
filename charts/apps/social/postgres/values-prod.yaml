# Production overrides for social-postgres.
#
# Bumps to HA (1 primary + 1 sync replica + 1 async replica) and enables
# WAL archiving to the shared tesseract prod backup bucket.

instances: 3

storageSize: 50Gi
walStorageSize: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "1"
    memory: 4Gi

backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/social-postgres"
  retentionPolicy: "30d"
