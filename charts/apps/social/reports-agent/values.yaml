# Values for social-reports-agent (single-env: prod).

namespace: social
name: social-reports-agent

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-reports-agent
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8090

env: prod

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 1Gi

# LLM provider — switchable via env. The corresponding API key is read
# from the social-llm Secret (created by ExternalSecret).
llm:
  provider: anthropic
  model: claude-opus-4-7

# Where to fetch analytics from.
platformApiUrl: "http://social-platform-api.social.svc.cluster.local:8081"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 3

pdb:
  enabled: true
  maxUnavailable: 1
