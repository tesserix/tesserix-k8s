apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "export.labels" . | nindent 4 }}
  annotations:
    # Workload Identity link to the GSA holding storage.objectAdmin on
    # the export bucket. The bucket + GSA + IAM binding are managed in
    # terraform-new (mirror the fanzone / homechef export pattern).
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.workloadIdentityGSA }}
