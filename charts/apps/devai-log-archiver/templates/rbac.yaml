apiVersion: v1
kind: ServiceAccount
metadata:
  name: devai-log-archiver
  namespace: devai
  labels:
    app.kubernetes.io/name: devai-log-archiver
    app.kubernetes.io/part-of: devai
  annotations:
    # Workload Identity → GSA with storage.objectAdmin on the logs bucket.
    iam.gke.io/gcp-service-account: {{ .Values.gcp.serviceAccount }}
{{- range .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devai-log-archiver-read-logs
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: devai-log-archiver
    app.kubernetes.io/part-of: devai
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devai-log-archiver-read-logs
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: devai-log-archiver
    app.kubernetes.io/part-of: devai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devai-log-archiver-read-logs
subjects:
  - kind: ServiceAccount
    name: devai-log-archiver
    namespace: devai
{{- end }}
