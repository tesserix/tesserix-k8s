{{- if .Values.knative.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "subscription-service.fullname" . }}-direct
  labels:
    {{- include "subscription-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    serving.knative.dev/service: {{ include "subscription-service.fullname" . }}
{{- end }}
