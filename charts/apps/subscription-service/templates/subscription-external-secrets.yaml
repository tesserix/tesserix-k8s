{{- if .Values.externalSecrets.enabled }}
# =============================================================================
# External Secrets for Subscription Service (Stripe)
# Syncs Stripe credentials from GCP Secret Manager to Kubernetes Secrets
# =============================================================================

{{- if .Values.externalSecrets.stripe.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: subscription-stripe-credentials
  labels:
    {{- include "subscription-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: subscription-stripe-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.stripe.secretKey }}
        version: latest
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.stripe.webhookSecret }}
        version: latest
{{- end }}
{{- end }}
