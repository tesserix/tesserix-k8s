{{- if and .Values.keda.enabled (gt (int .Values.keda.minReplicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "subscription-service.fullname" . }}
  labels:
    {{- include "subscription-service.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "subscription-service.selectorLabels" . | nindent 6 }}
{{- end }}
