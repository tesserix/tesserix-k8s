{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: {{ .Values.name }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  triggers:
    # cpu trigger removed: no cpu requests are set on this platform, so the
    # HPA reported FailedGetResourceMetric and held the ScaledObject
    # Degraded. The memory trigger below is the effective one.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
{{- end }}
