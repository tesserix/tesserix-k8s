# auth-bff is the front door for the Next.js apps. Ingress gateway, the
# tesserix.app super-admin (`company`), and (legacy) mark8ly Next.js apps
# may call it; nothing else.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-auth-bff-callers
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-system"]
    - from:
        - source:
            principals:
              # `company` is the super-admin Next.js app on tesserix.app.
              # Its middleware proxies cookie validation to /auth/session,
              # so this principal must be in the allowlist or every page
              # request 401s.
              - "cluster.local/ns/{{ .Values.namespace }}/sa/company"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-onboarding"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-admin"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-storefront"
