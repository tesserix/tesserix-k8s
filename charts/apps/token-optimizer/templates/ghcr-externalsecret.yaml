apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: token-optimizer-ghcr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-optimizer.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: token-optimizer-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ "{{" }} printf "%s:%s" .ghcr_username .ghcr_token | b64enc {{ "}}" }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
