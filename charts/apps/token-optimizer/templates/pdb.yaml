apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "token-optimizer.fullname" . }}
  labels:
    {{- include "token-optimizer.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "token-optimizer.selectorLabels" . | nindent 6 }}

