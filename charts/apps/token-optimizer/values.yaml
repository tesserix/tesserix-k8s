replicaCount: 2
image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/global/token-optimizer
  digest: sha256:fd76ced977d24ac35c685c9ca41e01c35ce17979b06da8749836cd16be9dfc56
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: ""
service:
  grpcPort: 18080
  httpPort: 8080
optimizer:
  enabledCapabilities: identify_text,decompose,coach
  softTokenLimit: 1500
  hardTokenLimit: 8000
  targetRate: "0.65"
  minimumSavings: 128
  keepRecentMessages: 2
  maxRequestBytes: "16777216"   # 8 MiB image plus base64 and gRPC overhead
  compressionTimeoutSeconds: "0.75"
  maxConcurrentCompressions: 1
  otlpEndpoint: otel-gateway.observability.svc.cluster.local:4317
  otlpInsecure: "true"
resources:
  requests:
    memory: 2Gi
  limits:
    memory: 3Gi
podDisruptionBudget:
  minAvailable: 1
networkPolicy:
  enabled: true
  gatewayName: kora-ai
  observabilityNamespace: observability
