replicaCount: 2

image:
  # In-region pull-through mirror of ghcr.io/tesserix/token-optimizer.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/token-optimizer
  # Release gate: replace this syntactically valid placeholder with the digest
  # produced by the token-optimizer release workflow before syncing the app.
  digest: sha256:8991783841b991c6cd09537009dd10849f1ed87dc844b1b9caed92f72d6bda6d
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  grpcPort: 18080
  httpPort: 8080

optimizer:
  enabledCapabilities: identify_text,decompose,coach
  softTokenLimit: 1500
  hardTokenLimit: 8000
  targetRate: "0.65"
  minimumSavings: 128
  keepRecentMessages: 2
  maxRequestBytes: 262144
  compressionTimeoutSeconds: "0.75"
  maxConcurrentCompressions: 1
  otlpEndpoint: otel-gateway.observability.svc.cluster.local:4317
  otlpInsecure: "true"

resources:
  requests:
    memory: 2Gi
  limits:
    memory: 3Gi

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
  gatewayName: kora-ai
  observabilityNamespace: observability
