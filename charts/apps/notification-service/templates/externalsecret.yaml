{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "notification-service.fullname" . }}-secrets
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "notification-service.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: notifications-db-password
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: sendgrid-api-key
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: shared-internal-service-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vapid-keys
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: vapid-keys
    creationPolicy: Owner
  data:
    - secretKey: VAPID_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.gcp.secretManager.secretPrefix | default "prod" }}-vapid-private-key
{{- end }}
