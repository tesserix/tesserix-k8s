{{- if .Values.knative.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notification-service.fullname" . }}-direct
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      protocol: TCP
      targetPort: 8090
  selector:
    serving.knative.dev/service: {{ include "notification-service.fullname" . }}
{{- end }}
