{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | default "5432" | quote }}
  DB_NAME: {{ .Values.database.name | default "notifications_db" | quote }}
  DB_USER: {{ .Values.database.user | default "postgres" | quote }}
  DB_SSL_MODE: {{ .Values.database.sslmode | default "require" | quote }}
  PORT: "8090"
  SKIP_MIGRATIONS: "true"
  PUBSUB_ENABLED: "true"
  PUBSUB_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
