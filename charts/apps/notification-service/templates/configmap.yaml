{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: "postgresql.postgresql-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "notifications_db"
  DB_USER: "postgres"
  DB_SSL_MODE: "require"
  PORT: "8090"
  SENDGRID_FROM: "noreply@mark8ly.com"
  SENDGRID_FROM_NAME: "Mark8ly"
  ADMIN_EMAIL: "admin@mark8ly.com"
  SUPPORT_EMAIL: "support@mark8ly.com"
  PUBSUB_ENABLED: "true"
  PUBSUB_PROJECT_ID: "tesseracthub-480811"
  SKIP_MIGRATIONS: "true"
{{- end }}
