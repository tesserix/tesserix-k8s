# Default values for notification-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/notification-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  # Exclude NATS and PostgreSQL ports from Istio sidecar
  # - 4222: NATS JetStream timeout issues
  # - 5432: PostgreSQL connection EOF issues with mTLS
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8090

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Health check configuration
healthCheck:
  livenessPath: /livez
  readinessPath: /readyz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Environment variables (non-sensitive)
env:
  SERVER_PORT: "8090"
  ENVIRONMENT: "production"

  # Database (DB_HOST set via database.host to avoid duplicates)

  # NATS for event-driven notifications
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # App settings - optimized for high throughput
  MAX_RETRY_ATTEMPTS: "3"
  WORKER_CONCURRENCY: "50"
  # Admin emails for alerts and notifications
  ADMIN_EMAIL: "admin@mark8ly.com"
  SUPPORT_EMAIL: "support@mark8ly.com"

  # NATS sportsbook stream settings
  NATS_SPORTSBOOK_STREAM_NAME: "fanzone-sportsbook"
  NATS_SPORTSBOOK_CONSUMER_NAME: "notification-sportsbook"

  # NATS connection settings for reliability
  NATS_MAX_RECONNECTS: "10"
  NATS_RECONNECT_WAIT_SECONDS: "5"

  # AWS Configuration (Mumbai, India region)
  AWS_REGION: "ap-south-1"
  AWS_SES_FROM: "noreply@mark8ly.com"
  AWS_SES_FROM_NAME: "mark8ly"

  # Email failover: SES (primary) -> Postal (fallback) -> SendGrid
  EMAIL_FAILOVER_ENABLED: "true"

  # SMS failover: SNS -> Twilio
  SMS_FAILOVER_ENABLED: "true"

  # Postal HTTP API settings (fallback email provider)
  POSTAL_API_URL: "http://postal-web.email.svc.cluster.local:5000"
  POSTAL_FROM: "noreply@mark8ly.com"
  POSTAL_FROM_NAME: "mark8ly"

  # SendGrid settings (fallback email provider)
  SENDGRID_FROM: "noreply@mark8ly.com"

  # Web Push (VAPID) settings
  # VAPID_PRIVATE_KEY injected via secretKeyRef (GCP Secret Manager)
  VAPID_PUBLIC_KEY: "BBA_rhEyoKti1DVWS011T6JxvX63_h5RtKnHgGY9YY1W_J0Xf516tMeNpCKTz13vyQ-rtjm3ilLQ-rHjkiD9RqM"
  VAPID_SUBJECT: "mailto:push@mark8ly.com"

  # Twilio Verify settings
  TWILIO_DEVTEST_ENABLED: "true"
  TWILIO_TEST_PHONE: "+17744896582"
  TWILIO_OTP_EXPIRY_MINUTES: "10"
  TWILIO_OTP_LENGTH: "6"

# Sealed secrets for sensitive data
# These are environment-specific and should be overridden in ArgoCD app
sealedSecrets:
  # Database credentials
  database:
    enabled: true
    existingSecret: "postgresql-password"
    # Keys in the existing secret (userSecretKey empty means use env value for DB_USER)
    userSecretKey: ""
    passwordSecretKey: "postgresql-password"

  # AWS credentials (SES email + SNS SMS) - primary provider
  aws:
    # Workload Identity is always enabled  # Enable in environment-specific config
    existingSecret: "notification-secrets"
    accessKeyIdSecretKey: "aws-access-key-id"
    secretAccessKeySecretKey: "aws-secret-access-key"
    sesFromSecretKey: "aws-ses-from"

  # Postal API credentials
  postal:
    enabled: true
    # If using sealed secret (preferred)
    sealedSecret:
      POSTAL_API_KEY: ""
    # If using existing secret
    existingSecret: ""
    apiKeySecretKey: "POSTAL_API_KEY"

  # SendGrid API credentials
  sendgrid:
    enabled: true
    sealedSecret:
      SENDGRID_API_KEY: ""
    existingSecret: ""
    apiKeySecretKey: "SENDGRID_API_KEY"

  # Twilio Verify credentials
  twilioVerify:
    enabled: true
    sealedSecret:
      TWILIO_VERIFY_SERVICE_SID: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_API_KEY_SID: ""
      TWILIO_API_KEY_SECRET: ""
    existingSecret: ""

# KEDA autoscaling - optimized for notification bursts
keda:
  enabled: true
  # Workload Identity is always enabled
  minReplicas: 1
  maxReplicas: 20
  pollingInterval: 15
  cooldownPeriod: 180
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"

# Pod Disruption Budget
pdb:
  enabled: true
  maxUnavailable: 1

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration - centralized for easy modification
# ArgoCD can override database.host to change the PostgreSQL server
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "notification_db"
  user: "postgres"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
