knative:
  enabled: true
  minScale: 0
  scaleToZeroDelay: "120s"
  stableWindow: "300s"

# Production overrides for notification-service

image:
  repository: ghcr.io/tesserix/notification-service
  tag: "20260329-fga-preshared"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Istio sidecar configuration for NATS connectivity
podAnnotations:
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"

# Production resource allocation
resources:
  limits:
    memory: 2Gi
  requests:
    memory: 512Mi

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

# In prod, secrets come from GCP Secret Manager (ExternalSecrets), not sealed secrets
sealedSecrets:
  database:
    enabled: true
    existingSecret: "postgresql-password"
    userSecretKey: ""
    passwordSecretKey: "postgresql-password"
  aws:
    enabled: false
  postal:
    enabled: false
  sendgrid:
    enabled: false
  twilioVerify:
    enabled: false

# Database - use marketplace PostgreSQL (where notification templates are seeded)
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  name: "notifications_db"

# Production environment settings
env:
  SERVICE_AUTH_MODE: "mesh"
  ENVIRONMENT: "prod"
  # Higher worker concurrency for production throughput
  WORKER_CONCURRENCY: "100"
  # Disable devtest mode for Twilio
  TWILIO_DEVTEST_ENABLED: "false"
  # Production email addresses
  ADMIN_EMAIL: "admin@mark8ly.com"
  SUPPORT_EMAIL: "support@mark8ly.com"
  BASE_DOMAIN: "mark8ly.com"
  POSTAL_FROM: "noreply@mark8ly.com"
  POSTAL_FROM_NAME: "Mark8ly"
  SENDGRID_FROM: "noreply@mark8ly.com"
  SENDGRID_FROM_EMAIL: "noreply@mark8ly.com"
  SENDGRID_FROM_NAME: "Mark8ly"
  AWS_SES_FROM: "noreply@mark8ly.com"
  AWS_SES_FROM_NAME: "Mark8ly"
  # NATS sportsbook stream settings
  NATS_SPORTSBOOK_STREAM_NAME: "fanzone-sportsbook"
  NATS_SPORTSBOOK_CONSUMER_NAME: "notification-sportsbook"
  # Web Push (VAPID) — private key injected via K8s secret
  VAPID_PUBLIC_KEY: "BP1aAkZAX6U-_C5YfgdwNeEEFmJujJf5aLCm6f57fuADu23VvPn48vaHs_g8owHyIOtC3Iu21WkRqv2gT00LPR8"
  VAPID_SUBJECT: "mailto:push@mark8ly.com"

# KEDA autoscaling - enabled for production
keda:
  enabled: false
  minReplicas: 0
  maxReplicas: 0
  pollingInterval: 15
  cooldownPeriod: 180
  # Prometheus-based scaling (optional - requires Istio metrics)
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"notification-service\"}[2m]))"
    requestRateThreshold: "100"
  # CPU and Memory triggers
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "70"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
