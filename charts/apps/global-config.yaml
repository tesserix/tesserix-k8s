# Global Configuration for Tesseract Platform
# This file contains centralized configuration values that are shared across all services.
# Change values here to update all services at once.

# GCP Configuration
# ================
# This is the only place you need to update when changing GCP project.
gcp:
  # GCP Project ID - used by all services for Secret Manager
  projectId: "tesseracthub-480811"

  # Secret Manager settings
  secretManager:
    enabled: true
    # Environment prefix for secrets (devtest, staging, prod)
    secretPrefix: "devtest"

  # Workload Identity settings
  workloadIdentity:
    enabled: true
    # Default GCP service account pattern - override per namespace in ArgoCD apps
    # Available: app-secrets-marketplace, app-secrets-marketplace, app-secrets-hms,
    #            app-secrets-fanzone, app-secrets-bookkeeping, app-secrets-homechef
    gcpServiceAccount: "app-secrets-marketplace@tesseracthub-480811.iam.gserviceaccount.com"

# Environment Configuration
# ========================
environment: devtest

# Database defaults
# =================
postgresql:
  enabled: true

# Redis defaults
# ==============
redis:
  enabled: true
