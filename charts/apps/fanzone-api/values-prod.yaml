# Production overrides for fanzone-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

image:
  pullPolicy: IfNotPresent


# Autoscaling handled outside KEDA/HPA
keda:
  enabled: false

autoscaling:
  enabled: false

# Production resource allocation - handles game/sports API traffic
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
