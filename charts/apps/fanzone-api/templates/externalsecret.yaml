{{- if .Values.docsApiKey }}
{{- if .Values.docsApiKey.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fanzone-api.fullname" . }}-docs-key
  labels:
    {{- include "fanzone-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.docsApiKey.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.docsApiKey.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "fanzone-api.fullname" . }}-docs-key
    creationPolicy: Owner
  data:
    - secretKey: api-docs-key
      remoteRef:
        key: {{ .Values.docsApiKey.gcpSecretKey }}
{{- end }}
{{- end }}
