replicaCount: 1
image:
  repository: ghcr.io/tesserix/analytics-service
  pullPolicy: Always
  tag: "latest"
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8091
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi
knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30
externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
gcp:
  projectId: "tesseracthub-480811"
podAnnotations:
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  traffic.sidecar.istio.io/excludeOutboundPorts: "5432,4222,6379"
serviceAccount:
  create: true
  annotations: {}
  name: ""
nameOverride: ""
fullnameOverride: ""
