{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "analytics-service.fullname" . }}-config
  labels:
    {{- include "analytics-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: "postgresql.postgresql-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "analytics_db"
  DB_USER: "postgres"
  DB_SSL_MODE: "disable"
  PORT: "8091"
  FDW_ENABLED: "true"
  FDW_SERVER_HOST: "postgresql.postgresql-global.svc.cluster.local"
  FDW_PRODUCTS_DB: "products_db"
  FDW_ORDERS_DB: "orders_db"
  FDW_CUSTOMERS_DB: "customers_db"
{{- end }}
