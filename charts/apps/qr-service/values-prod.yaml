knative:
  enabled: true
  minScale: 0
  scaleToZeroDelay: "120s"

# Production overrides for qr-service

image:
  repository: ghcr.io/tesserix/qr-service
  tag: "1.3.3"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

podAnnotations:
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

env:
  GIN_MODE: "release"
  LOG_LEVEL: "info"

gcs:
  enabled: true
  existingSecret: "gcs-credentials"
  existingSecretKey: "credentials.json"
  bucketName: "tesseract-qr-codes-prod"
  basePath: "qr-codes"
  publicUrl: "https://storage.googleapis.com"

encryption:
  enabled: true
  existingSecret: "qr-service-encryption"
  existingSecretKey: "encryption-key"

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"qr-service\"}[2m]))"
    requestRateThreshold: "100"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

pdb:
  enabled: true
  minAvailable: 1
