replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/roamie-api
  digest: "sha256:a770f699a388fa711cb988e5056a5dc1beb6328a2e106a4c1319e97651e4abec"
  # Kargo sets this to main-<sha7> on promotion.
  tag: "main-19b6209"

podAnnotations: {}

gcp:
  serviceAccount: roamie-api-prod@tesseracthub-480811.iam.gserviceaccount.com

env:
  AUTH_ENABLED: "true"
  ZITADEL_ISSUER: https://auth.tesserix.app
  ZITADEL_ORG_ID: "386377229942128837"
  ZITADEL_PROJECT_ID: "392328861469115174"
  ZITADEL_IOS_CLIENT_ID: "392328865646707494"
  ZITADEL_ANDROID_CLIENT_ID: "392328864774226726"
  ZITADEL_GOOGLE_IDP_ID: "386381087862948767"
  ZITADEL_APPLE_IDP_ID: "389173155337339395"
  RUST_LOG: info
  GCP_PROJECT: tesseracthub-480811
  VERTEX_LOCATION: global
  GEMINI_MODEL: gemini-2.5-flash
  OCR_UPLOAD_URL: http://document-intelligence-roamie-prod-upload-api.document-intelligence.svc.cluster.local:8080
  OCR_JOB_URL: http://document-intelligence-roamie-prod-job-api.document-intelligence.svc.cluster.local:8080
  # Must match the roamie-v1 client in charts/apps/document-intelligence/products/roamie-prod.yaml.
  OCR_KEY_ID: roamie-v1
  OCR_TENANT: ten_roamie_public

secretEnv:
  TRAVEL_MCP_API_KEY: travel_mcp_api_key
  OCR_KEY_SECRET: ocr_key_secret
  PLACES_API_KEY: places_api_key

# Secret Manager names synced into <fullname>-secrets.
secrets:
  travel_mcp_api_key: prod-roamie-mcp-api-token
  ocr_key_secret: prod-roamie-api-ocr-key
  places_api_key: prod-roamie-api-places-key

# Up to two ffmpeg memory renders run beside the API.
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 1Gi

tmpSizeLimit: 512Mi

database:
  enabled: true
  host: roamie-postgres-rw.roamie.svc.cluster.local
  name: roamie
  runtimeSecret: roamie-postgres-runtime
  ownerSecret: roamie-postgres-app
  caSecret: roamie-postgres-ca

# Activate only with a verified manager deployment and scoped gateway identity.
tripManager:
  enabled: true
  customerEnabled: false
  origin: http://roamie-trip-manager.roamie.svc.cluster.local:8080
  secretName: roamie-trip-manager-bridge
