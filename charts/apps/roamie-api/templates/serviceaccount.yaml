  labels:
    {{- include "roamie-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    iam.gke.io/gcp-service-account: {{ .Values.gcp.serviceAccount }}
automountServiceAccountToken: false
