apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roamie-api.fullname" . }}
  labels:
    {{- include "roamie-api.labels" . | nindent 4 }}
  annotations:
    # Env is read once at boot, so roll pods when the synced Secret changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "roamie-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roamie-api.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "roamie-api.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "roamie-api.selectorLabels" . | nindent 14 }}
      volumes:
        {{- if .Values.database.enabled }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.database.caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        # Memory-video frames and ffmpeg output; the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
      containers:
        - name: roamie-api
          image: {{ include "roamie-api.image" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.tripManager.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.tripManager.secretName }}
          {{- end }}
          env:
            {{- if .Values.tripManager.enabled }}
            - name: TRIP_MANAGER_CUSTOMER_ENABLED
              value: {{ .Values.tripManager.customerEnabled | quote }}
            - name: TRIP_MANAGER_ORIGIN
              value: {{ .Values.tripManager.origin | quote }}
            {{- end }}
            - name: PORT
              value: "8080"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $key := .Values.secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "roamie-api.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
            {{- if .Values.database.enabled }}
            {{- include "roamie-api.databaseEnv" (dict "values" .Values "secret" .Values.database.runtimeSecret) | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.database.enabled }}
            - name: postgres-ca
              mountPath: /etc/postgres
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: {{ ternary "/readyz" "/healthz" .Values.database.enabled }}
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
