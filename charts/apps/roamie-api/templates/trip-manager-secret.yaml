{{- if .Values.tripManager.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tripManager.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.tripManager.secretName }}
  data:
    - secretKey: TRIP_MANAGER_API_KEY
      remoteRef:
        key: prod-roamie-manager-api-key
    - secretKey: TRIP_MANAGER_SIGNING_KEY
      remoteRef:
        key: prod-roamie-profile-signing-key
    - secretKey: TRIP_MANAGER_IDENTITY_KEY
      remoteRef:
        key: prod-roamie-manager-identity-key
    - secretKey: TRIP_MANAGER_GATEWAY_TOKEN
      remoteRef:
        key: prod-roamie-mcp-delegated-token
    - secretKey: TRAVEL_MCP_API_KEY
      remoteRef:
        key: prod-roamie-mcp-api-token
{{- end }}
