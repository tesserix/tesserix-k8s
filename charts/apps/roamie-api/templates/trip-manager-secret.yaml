{{- if .Values.tripManager.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tripManager.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-roamie-production
    kind: SecretStore
  target:
    name: {{ .Values.tripManager.secretName }}
  data:
    - secretKey: TRIP_MANAGER_API_KEY
      remoteRef:
        key: roamie/app/roamie-manager-api-key
        property: value
    - secretKey: TRIP_MANAGER_SIGNING_KEY
      remoteRef:
        key: roamie/app/roamie-profile-signing-key
        property: value
    - secretKey: TRIP_MANAGER_IDENTITY_KEY
      remoteRef:
        key: roamie/app/roamie-manager-identity-key
        property: value
    - secretKey: TRIP_MANAGER_GATEWAY_TOKEN
      remoteRef:
        key: roamie/app/roamie-mcp-delegated-token
        property: value
{{- end }}
