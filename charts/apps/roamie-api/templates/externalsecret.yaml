apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "roamie-api.fullname" . }}-secrets
  labels:
    {{- include "roamie-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ include "roamie-api.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range $key, $remote := .Values.secrets }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
