apiVersion: v2
name: mcp-stub
description: |
  Minimal MCP server stub. Responds to the MCP Streamable-HTTP transport
  with an empty tool list so the slm-router can complete its tool-handshake
  and proceed to answer with system-prompt + RAG only.

  This chart exists so the per-product MCP endpoints the slm-router config
  references — fanzone-mcp.fanzone.svc, homechef-mcp.homechef.svc, …
  resolve to a healthy pod. Each product replaces this stub with a real
  MCP server (FastMCP / mcp-typescript) that exposes domain tools
  (get_order, get_match, get_chart, …) when it's ready.

  Pattern reference: tesserix/social-media-scrapper src/mcp/* is the
  canonical full MCP implementation.
type: application
version: 0.1.0
appVersion: "0.1.0"
