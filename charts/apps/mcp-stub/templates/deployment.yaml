apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-stub.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-stub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-stub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-stub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: support-platform
        mcp.tesserix.app/tenant: {{ .Values.tenant }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8765
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx writes its pid + temp files; emptyDir keeps the
            # root filesystem read-only.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "mcp-stub.name" . }}-config
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
