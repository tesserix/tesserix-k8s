apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-stub.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-stub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mcp-stub.selectorLabels" . | nindent 4 }}
