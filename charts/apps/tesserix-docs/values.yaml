replicaCount: 2
image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-docs
  pullPolicy: IfNotPresent
  tag: "sha-4a8656e438ad" # CI rewrites this on every push to design-system/main
imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  # Static web apps with no K8s API access — drop the auto-mounted SA token
  # to shrink blast radius if a container is compromised.
  automount: false
  annotations: {}
  name: ""
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
ingress:
  enabled: true
  gateway: istio-ingress/tesseract-gateway
  hosts:
    - host: docs.tesserix.app
      paths:
        - path: /
          pathType: Prefix
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
volumes:
  tmp:
    enabled: true
    mountPath: /tmp
  cache:
    enabled: true
    mountPath: /app/apps/docs/.next/cache
pdb:
  enabled: false
