# UAT overlay for mark8ly-mongodb. Smaller PVC (Otto chat history is
# scratchable in UAT). Same image, no auth (matches prod for v1).
# The chart's StatefulSet name is hard-coded to `mark8ly-mongodb` today
# — UAT runs in a separate namespace (mark8ly-uat) so the same name is
# OK without collision.
persistence:
  size: 10Gi

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
