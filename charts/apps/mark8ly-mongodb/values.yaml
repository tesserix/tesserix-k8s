# MongoDB for mark8ly — backs the Otto support-chat service.
# A single StatefulSet with a PVC is enough for v1 since the service
# is low-throughput (real-time chat messages, not analytics).

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

# v1: no auth (inside the mesh, network-policy gated). Flip to true and
# add a root password ExternalSecret before exposing outside the cluster.
auth:
  enabled: false

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 20Gi

service:
  type: ClusterIP
  port: 27017
