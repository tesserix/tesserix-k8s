# kagent-agent-sync — defaults
#
# A CronJob that curls the registry's server-side kagent export and applies the
# rendered kagent.dev Agent + RemoteMCPServer CRs. Only agents carrying the
# long-lived label (registry.labelSelector) are synced — ephemeral agents stay
# Job-dispatched. The reconcile is idempotent and prunes stale managed objects.

namespace: kagent-system

registry:
  endpoint: http://agentregistry.agentregistry-system.svc.cluster.local:12121
  # Registry namespace to read agents from.
  sourceNamespace: devai
  # Only sync agents marked long-lived. Authoring sets this label on agents the
  # operator wants controller-managed rather than Job-dispatched.
  labelSelector: "devai.io/runtime=kagent"
  # Namespace the rendered kagent CRs are created in (the controller watches it).
  targetNamespace: kagent-system
  # The agents now render one variant per entry in `kagentModels` (below); the
  # export `variants` param is derived from it, so there's no single modelConfig
  # here anymore.
  # Private AgentGateway base URL every rendered RemoteMCPServer uses. Direct
  # provider/MCP egress is not allowed for user-authored Substrate agents.
  gatewayUrl: http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080
  # Render SandboxAgent resources pinned to the production gVisor WorkerPool.
  # Empty keeps the classic Agent renderer for clusters without Substrate.
  workerPool: kagent-default

# All kagent LLM calls use the same AgentGateway data plane as DevAI Jobs.
# ModelConfigs retain apiKeyPassthrough so no user key is stored in-cluster.
llmGatewayBaseUrl: http://ai-gateway.agentgateway-system.svc.cluster.local:8080

# A keyless, GitOps-owned canary proves SandboxAgent -> ActorTemplate -> gVisor
# reconciliation without enabling user traffic or invoking an LLM.
substrateCanary:
  enabled: true
  name: devai-substrate-canary
  workerPool: kagent-default
  modelConfig: kagent-mc-openai

# DevAI — source of truth for WHICH variants to provision (dynamic, UI-driven).
# The render step curls DevAI for the union of every user's Settings-enabled
# kagent models, so a variant's Agent (and its pod) exists exactly when ≥1 user
# enabled that model — enable it in Settings and the pod appears next cycle;
# the last user disabling it makes the pod go away. The ModelConfigs below stay
# provisioned for the WHOLE catalog (cheap CRs, no pods), so dispatch never races
# a missing ModelConfig.
devai:
  # In-cluster devai-api base URL (the active-variants endpoint lives here).
  endpoint: http://devai-api.devai.svc.cluster.local:8080
  # Secret (this namespace) holding the shared service bearer devai-api accepts
  # (identity._principal_from_service_bearer — the SAME token the MCP Hub
  # presents). Synced from GCP SM by external-secrets/prod/kagent-system.
  serviceTokenSecret: kagent-agent-sync-devai-token
  serviceTokenKey: DEVAI_MCP_HUB_SERVICE_TOKEN

# Per-provider passthrough ModelConfig catalog — the SUPPORTED menu the operator
# curates. Each entry renders a ModelConfig `kagent-mc-<suffix>` (apiKeyPassthrough);
# the Agent variant `<agent>-<suffix>` that references it is provisioned on demand
# (see `devai` above), not statically. DevAI dispatches a user to the variant
# matching their Settings (provider, model) and forwards their OWN key as the A2A
# Bearer. `model` must be a DIRECT-provider-valid id (not a DevAI gateway alias).
# Anthropic + OpenAI use static API keys (clean passthrough); Vertex/Gemini use
# GCP OAuth tokens and need separate handling — added later.
modelConfig:
  enabled: true
kagentModels:
  - suffix: anthropic
    provider: Anthropic
    model: claude-sonnet-4-5-20250929
  - suffix: anthropic-sonnet-4-6
    provider: Anthropic
    model: claude-sonnet-4-6
  - suffix: anthropic-opus
    provider: Anthropic
    model: claude-opus-4-8
  - suffix: openai
    provider: OpenAI
    model: gpt-4.1
  - suffix: openai-gpt-5-4
    provider: OpenAI
    model: gpt-5.4
  - suffix: openai-gpt-5-5
    provider: OpenAI
    model: gpt-5.5
  - suffix: openai-gpt-4o
    provider: OpenAI
    model: gpt-4o
  - suffix: openai-o3
    provider: OpenAI
    model: o3
  - suffix: openai-o4-mini
    provider: OpenAI
    model: o4-mini
  - suffix: openai-o3-mini
    provider: OpenAI
    model: o3-mini
  - suffix: openai-gpt-4-1-mini
    provider: OpenAI
    model: gpt-4.1-mini

cron:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  activeDeadlineSeconds: 180
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600

images:
  curl:
    repository: curlimages/curl
    tag: "8.11.1"
  kubectl:
    # DEP-5: docker.io/bitnami/kubectl:1.31 was removed in the Bitnami catalog
    # migration. Use bitnamilegacy/* — the published home for legacy Bitnami
    # images and a drop-in (minideb base WITH /bin/sh). A distroless kubectl
    # image (registry.k8s.io/kubectl) does NOT work here — the job runs a shell
    # script and that image has no /bin/sh.
    repository: docker.io/bitnamilegacy/kubectl
    tag: "1.31"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 64Mi
  # Client-side kubectl apply parses the cluster OpenAPI schema, which spikes
  # well past 128Mi on a CRD-heavy cluster (OOMKilled, exit 137). 256Mi covers
  # it; the apply also runs --validate=false to skip most of that parse.
  limits:
    memory: 256Mi

serviceAccount:
  create: true
  name: kagent-agent-sync
