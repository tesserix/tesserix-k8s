apiVersion: v2
name: kagent-agent-sync
description: >-
  A CronJob that renders long-lived (labelled) registry Agents into kagent.dev
  Agent + ToolServer CRs (via the registry's /v0/export/kagent endpoint) and
  applies them, so the kagent controller reconciles them into managed
  Deployments. Workstream G2.
type: application
version: 0.1.0
appVersion: "0.1.0"
