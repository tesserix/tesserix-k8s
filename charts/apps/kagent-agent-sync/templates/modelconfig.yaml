# One passthrough ModelConfig per catalog entry (kagentModels). apiKeyPassthrough
# =true → no shared API key; the agent forwards the Bearer token from each A2A
# request to the provider as the key. DevAI sets that Bearer to the TRIGGERING
# USER's own key, so a single shared agent runs on each user's own credentials.
{{- if .Values.modelConfig.enabled }}
{{- range .Values.kagentModels }}
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: kagent-mc-{{ .suffix }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "kagent-agent-sync.labels" $ | nindent 4 }}
  annotations:
    # The Agent + ModelConfig CRDs are multi-version (v1alpha1 served +
    # v1alpha2 storage). ArgoCD server-side apply mis-negotiates the schema for
    # v1alpha2 (rejects spec.* as "field not declared in schema"), so replace
    # this object rather than SSA it — same reason the agent-sync uses
    # client-side apply.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  provider: {{ .provider | quote }}
  model: {{ .model | quote }}
  apiKeyPassthrough: true
  {{- if eq .provider "Anthropic" }}
  anthropic:
    baseUrl: {{ printf "%s/anthropic" $.Values.llmGatewayBaseUrl | quote }}
  {{- else if eq .provider "OpenAI" }}
  openAI:
    baseUrl: {{ printf "%s/openai/v1" $.Values.llmGatewayBaseUrl | quote }}
  {{- end }}
{{- end }}
{{- end }}
