# Agent-sync: pull long-lived (labelled) agents from the registry as ready-to-
# apply kagent.dev Agent + ToolServer YAML (rendered server-side by
# /v0/export/kagent, reusing the registry's tested adapter), then apply them so
# the kagent controller reconciles managed Deployments. Idempotent. Runs in
# kagent-system, whose SA the registry authz already allows to GET /v0/*; the
# consumer-egress NetworkPolicy already permits the :12121 hop.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kagent-agent-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kagent-agent-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: {{ .Values.cron.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.cron.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cron.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.cron.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.cron.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "kagent-agent-sync.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: render
              image: "{{ .Values.images.curl.repository }}:{{ .Values.images.curl.tag }}"
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # 1. Ask DevAI which model variants are wanted RIGHT NOW — the
                  #    union of every user's Settings-enabled kagent models (∩ the
                  #    supported catalog). DevAI is the source of truth; enabling a
                  #    model in Settings makes its variant appear next cycle, and the
                  #    last user disabling it makes the variant (and its pod) go away.
                  #    Gated by a shared service bearer devai-api accepts via
                  #    identity._principal_from_service_bearer (the SAME token the MCP
                  #    Hub presents — one key, one rotation).
                  ACTIVE="{{ .Values.devai.endpoint }}/api/settings/kagent/active-variants"
                  echo "GET ${ACTIVE}"
                  if ! curl -sS --fail-with-body --max-time 20 \
                        -H "Authorization: Bearer ${DEVAI_SERVICE_TOKEN}" \
                        "${ACTIVE}" -o /work/active.json; then
                    echo "active-variants fetch failed (DevAI unreachable / token"
                    echo "missing) — KEEP the last-applied variant set this cycle"
                    echo "(init fails -> job fails -> apply never runs -> no prune)."
                    exit 1
                  fi
                  # {"variants":[...],"param":"anthropic:kagent-mc-anthropic,..."}
                  VARIANTS=$(sed -n 's/.*"param"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /work/active.json)
                  echo "active variants: [${VARIANTS}]"
                  if [ -z "${VARIANTS}" ]; then
                    # Nobody has any model enabled -> no Agent variant should exist.
                    # Tell the apply step to reap every managed variant. The
                    # ModelConfigs (cheap, no pods) stay provisioned regardless.
                    echo reap > /work/mode
                    : > /work/agents.yaml
                    echo "no models enabled by any user — will reap all variants"
                    exit 0
                  fi
                  echo apply > /work/mode
                  # 2. Render exactly those variants from the registry (same tested
                  #    adapter as before — one Agent CR per (agent, variant)).
                  URL="{{ .Values.registry.endpoint }}/v0/export/kagent"
                  URL="${URL}?namespace={{ .Values.registry.sourceNamespace }}"
                  URL="${URL}&targetNamespace={{ .Values.registry.targetNamespace }}"
                  URL="${URL}&variants=${VARIANTS}"
                  {{- if .Values.registry.workerPool }}
                  URL="${URL}&workerPool={{ .Values.registry.workerPool | urlquery }}"
                  {{- end }}
                  {{- if .Values.registry.gatewayUrl }}
                  URL="${URL}&gatewayUrl={{ .Values.registry.gatewayUrl | urlquery }}"
                  {{- end }}
                  {{- if .Values.registry.labelSelector }}
                  URL="${URL}&labelSelector={{ .Values.registry.labelSelector | urlquery }}"
                  {{- end }}
                  echo "GET ${URL}"
                  curl -sS --fail-with-body --max-time 30 "${URL}" -o /work/agents.yaml
                  COUNT=$(grep -c '^kind:' /work/agents.yaml || echo 0)
                  echo "rendered ${COUNT} object(s)"
                  if [ "${COUNT}" = "0" ]; then
                    # Variants were wanted, but NO labelled agent renders them —
                    # the definitive "nothing should stand" state (e.g. every
                    # agent unlabelled / kagent decommissioned). The export curl
                    # already succeeded (--fail-with-body), so this empty render
                    # is real, not a registry blip — REAP rather than keep-last,
                    # else the last variants orphan forever.
                    echo reap > /work/mode
                    echo "no labelled agents render the wanted variants — will reap"
                  fi
              env:
                - name: DEVAI_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.devai.serviceTokenSecret }}
                      key: {{ .Values.devai.serviceTokenKey }}
                      # optional: the pod still starts if the ExternalSecret hasn't
                      # synced yet; the fetch then 401s and we keep the last set.
                      optional: true
              volumeMounts:
                - name: work
                  mountPath: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          containers:
            - name: apply
              image: "{{ .Values.images.kubectl.repository }}:{{ .Values.images.kubectl.tag }}"
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  MODE=$(cat /work/mode 2>/dev/null || echo "")
                  if [ "${MODE}" = "reap" ]; then
                    # No user has any model enabled — delete every registry-managed
                    # Agent variant (and its ToolServers). The ModelConfigs are owned
                    # by ArgoCD/Helm, not this job, so they stay.
                    echo "reaping all registry-managed Agent variants (none enabled)"
                    kubectl delete agents.kagent.dev,sandboxagents.kagent.dev,toolservers.kagent.dev \
                      -n {{ .Values.registry.targetNamespace }} \
                      -l app.kubernetes.io/managed-by=agentic-registry \
                      --ignore-not-found
                  elif [ -s /work/agents.yaml ] && grep -q '^kind:' /work/agents.yaml; then
                    # Client-side apply (NOT --server-side): the kagent Agent CRD
                    # serves v1alpha1 + v1alpha2 (storage), and kubectl's
                    # server-side apply mis-negotiates the schema for the v1alpha2
                    # object — it rejects spec.type/spec.declarative with
                    # ".spec.type: field not declared in schema". Client-side apply
                    # validates against the object's own version and succeeds.
                    # --validate=false skips the cluster OpenAPI download/parse
                    # that otherwise OOMs the container (the API server still
                    # validates the object on apply).
                    #
                    # --prune (scoped to the registry-managed label) self-heals:
                    # any Agent/ToolServer the registry no longer renders — an
                    # unlabelled/removed agent, a stale provider/model variant —
                    # is deleted, instead of orphaning. Safe because the guard
                    # above only runs apply on a non-empty render, so a transient
                    # empty export never prunes everything.
                    kubectl apply --validate=false --prune \
                      --prune-allowlist=kagent.dev/v1alpha2/Agent \
                      --prune-allowlist=kagent.dev/v1alpha2/SandboxAgent \
                      --prune-allowlist=kagent.dev/v1alpha1/ToolServer \
                      -l app.kubernetes.io/managed-by=agentic-registry \
                      -f /work/agents.yaml
                  else
                    # apply mode but an empty/garbled render — keep the last set.
                    echo "render empty in apply mode — nothing to apply (keeping last)"
                  fi
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: work
              emptyDir: {}
