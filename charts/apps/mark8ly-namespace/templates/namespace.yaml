apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    istio-injection: disabled
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
    # TIG deletion guard — VAP lives in k8s/cluster/namespace-protection.yaml
    tesserix.io/protected: "true"
    tesserix.io/tier: application
