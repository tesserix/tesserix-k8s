apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    # Envoy sidecar is enabled per-pod via sidecar.istio.io/inject annotation,
    # keeping parity with the rest of the tesserix-k8s conventions.
    istio-injection: disabled
    # TIG deletion guard — VAP lives in k8s/cluster/namespace-protection.yaml
    tesserix.io/protected: "true"
    tesserix.io/tier: application
