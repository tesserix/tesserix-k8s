namespace: mark8ly
# Namespaces whose workloads are allowed to initiate traffic into mark8ly.
# Ingress comes through istio-system (gateway). Intra-namespace traffic is also allowed.
# tesserix is the super-admin / company namespace whose auth-bff and Next.js
# apps reuse mark8ly-postgres, mark8ly-openfga, and the marketplace APIs
# cross-namespace. Service-specific AuthorizationPolicies on those workloads
# narrow this further by principal where appropriate.
allowedSources:
  - istio-system
  - mark8ly
  - tesserix
