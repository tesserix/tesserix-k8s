serviceType: go
port: 8080
healthPath: /health
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly-approval
  tag: "latest"

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

probes:
  startup:
    failureThreshold: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 15

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

db:
  enabled: true
  host: postgresql.postgresql-marketplace.svc.cluster.local
  port: "5432"
  name: approval_db
  user: postgres
  sslmode: require
  secretKey: mp-approvals-db-password

openfga:
  enabled: true
  url: http://openfga.marketplace.svc.cluster.local:8080
  authMode: preshared
  apiKeySecret: true
  storeId: "01KMS970NNJPJP97MR7XNZSVD3"

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  refreshInterval: 15m

extraSecrets: []

env:
  STAFF_SERVICE_URL: http://mp-staff.marketplace.svc.cluster.local

gcp:
  projectId: tesseracthub-480811
  secretManager:
    secretPrefix: "prod"
