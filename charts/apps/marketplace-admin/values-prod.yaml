serviceType: nextjs
port: 3000
servicePort: 80
healthPath: /api/health
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly/mark8ly-admin
  tag: "latest"

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  concurrencyTarget: 50
  containerConcurrency: 50
  timeoutSeconds: 60

probes:
  startup:
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 768Mi

db:
  enabled: false
  host: ""
  port: ""
  name: ""
  user: ""
  sslmode: ""
  secretKey: ""

openfga:
  enabled: false
  url: ""
  authMode: ""
  apiKeySecret: false
  storeId: "01KMS970NNJPJP97MR7XNZSVD3"

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  refreshInterval: 15m

# CSRF secret for admin panel
extraSecrets:
  - secretKey: CSRF_SECRET
    remoteKey: prod-mp-admin-csrf-secret

env:
  INTERNAL_SERVICE_KEY: "placeholder-overridden-by-secret"
  BASE_DOMAIN: "mark8ly.com"
  NEXT_PUBLIC_BASE_DOMAIN: "mark8ly.com"
  AUTH_BFF_URL: "http://auth-bff.marketplace.svc.cluster.local:8080"
  AUTH_BFF_INTERNAL_URL: "http://auth-bff.marketplace.svc.cluster.local:8080"
  TENANT_ROUTER_SERVICE_URL: "http://tenant-router-service.marketplace.svc.cluster.local:8080"
  TENANT_SERVICE_URL: "http://tenant-service.marketplace.svc.cluster.local:8080"
  PRODUCTS_SERVICE_URL: "http://mp-products.marketplace.svc.cluster.local:8080/api/v1"
  CATEGORIES_SERVICE_URL: "http://mp-categories.marketplace.svc.cluster.local:8080/api/v1"
  ORDERS_SERVICE_URL: "http://mp-orders.marketplace.svc.cluster.local:8080/api/v1"
  CUSTOMERS_SERVICE_URL: "http://mp-customers.marketplace.svc.cluster.local:8080/api/v1"
  COUPONS_SERVICE_URL: "http://mp-coupons.marketplace.svc.cluster.local:8080/api/v1"
  REVIEWS_SERVICE_URL: "http://mp-reviews.marketplace.svc.cluster.local:8080/api/v1"
  VENDORS_SERVICE_URL: "http://mp-vendors.marketplace.svc.cluster.local:8080/api/v1"
  NOTIFICATION_SERVICE_URL: "http://notification-service.marketplace.svc.cluster.local:8080/api/v1"
  NOTIFICATION_HUB_URL: "http://notification-hub.marketplace.svc.cluster.local:8080"
  SETTINGS_SERVICE_URL: "http://settings-service.marketplace.svc.cluster.local:8080/api/v1"
  DOCUMENT_SERVICE_URL: "http://document-service.marketplace.svc.cluster.local:8080"
  LOCATION_SERVICE_URL: "http://location-service.marketplace.svc.cluster.local:8080/api/v1"
  FEATURE_FLAGS_SERVICE_URL: "http://feature-flags-service.marketplace.svc.cluster.local:8080/api/v1"
  STAFF_SERVICE_URL: "http://mp-staff.marketplace.svc.cluster.local:8080/api/v1"
  PAYMENT_SERVICE_URL: "http://mp-payments.marketplace.svc.cluster.local:8080/api/v1"
  SHIPPING_SERVICE_URL: "http://mp-shipping.marketplace.svc.cluster.local:8080/api"
  INVENTORY_SERVICE_URL: "http://mp-inventory.marketplace.svc.cluster.local:8080/api/v1"
  ANALYTICS_SERVICE_URL: "http://analytics-service.marketplace.svc.cluster.local:8080/api/v1"
  MARKETING_SERVICE_URL: "http://mp-marketing.marketplace.svc.cluster.local:8080/api/v1"
  SUBSCRIPTION_SERVICE_URL: "http://subscription-service.marketplace.svc.cluster.local:8080/api/v1"
  GIFT_CARDS_SERVICE_URL: "http://mp-gift-cards.marketplace.svc.cluster.local:8080/api/v1"
  TICKETS_SERVICE_URL: "http://tickets-service.marketplace.svc.cluster.local:8080/api/v1"
  TAX_SERVICE_URL: "http://mp-tax.marketplace.svc.cluster.local:8080/api/v1"
  QR_SERVICE_URL: "http://qr-service.marketplace.svc.cluster.local:8080/api/v1"
  AUDIT_SERVICE_URL: "http://audit-service.marketplace.svc.cluster.local:8080/api/v1"
  APPROVAL_SERVICE_URL: "http://mp-approvals.marketplace.svc.cluster.local:8080/api/v1"
  GIN_MODE: "release"
  GCP_SECRET_PREFIX: "prod"
  USE_GCP_SECRET_MANAGER: "true"

gcp:
  projectId: tesseracthub-480811
  secretManager:
    secretPrefix: "prod"
directServicePort: 80
