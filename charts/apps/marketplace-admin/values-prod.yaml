image:
  tag: "latest"

knative:
  minScale: 1
  scaleToZeroDelay: "120s"
  enabled: true

probes:
  startup:
    failureThreshold: 30

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 768Mi

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

gcp:
  projectId: tesseracthub-480811
  secretManager:
    secretPrefix: "prod"

env:
  INTERNAL_SERVICE_KEY: "placeholder-overridden-by-secret"
  BASE_DOMAIN: "mark8ly.com"
  NEXT_PUBLIC_BASE_DOMAIN: "mark8ly.com"
  AUTH_BFF_URL: "http://auth-bff.marketplace.svc.cluster.local:8080"
  AUTH_BFF_INTERNAL_URL: "http://auth-bff.marketplace.svc.cluster.local:8080"
  TENANT_ROUTER_SERVICE_URL: "http://tenant-router-service-direct.marketplace.svc.cluster.local:8089"
  TENANT_SERVICE_URL: "http://tenant-service-direct.marketplace.svc.cluster.local:8080"
  PRODUCTS_SERVICE_URL: "http://mp-products-direct.marketplace.svc.cluster.local:8080/api/v1"
  CATEGORIES_SERVICE_URL: "http://mp-categories-direct.marketplace.svc.cluster.local:8080/api/v1"
  ORDERS_SERVICE_URL: "http://mp-orders-direct.marketplace.svc.cluster.local:8080/api/v1"
  CUSTOMERS_SERVICE_URL: "http://mp-customers-direct.marketplace.svc.cluster.local:8080/api/v1"
  COUPONS_SERVICE_URL: "http://mp-coupons-direct.marketplace.svc.cluster.local:8080/api/v1"
  REVIEWS_SERVICE_URL: "http://mp-reviews-direct.marketplace.svc.cluster.local:8080/api/v1"
  VENDORS_SERVICE_URL: "http://mp-vendors-direct.marketplace.svc.cluster.local:8080/api/v1"
  NOTIFICATION_SERVICE_URL: "http://notification-service-direct.marketplace.svc.cluster.local:8090/api/v1"
  NOTIFICATION_HUB_URL: "http://notification-hub-direct.marketplace.svc.cluster.local:8080"
  SETTINGS_SERVICE_URL: "http://settings-service-direct.marketplace.svc.cluster.local:8080/api/v1"
  DOCUMENT_SERVICE_URL: "http://document-service-direct.marketplace.svc.cluster.local:8080"
  LOCATION_SERVICE_URL: "http://location-service-direct.marketplace.svc.cluster.local:8080/api/v1"
  FEATURE_FLAGS_SERVICE_URL: "http://feature-flags-service-direct.marketplace.svc.cluster.local:8080/api/v1"
  STAFF_SERVICE_URL: "http://mp-staff-direct.marketplace.svc.cluster.local:8080/api/v1"
  PAYMENT_SERVICE_URL: "http://mp-payments-direct.marketplace.svc.cluster.local:8080/api/v1"
  SHIPPING_SERVICE_URL: "http://mp-shipping-direct.marketplace.svc.cluster.local:8080/api"
  INVENTORY_SERVICE_URL: "http://mp-inventory-direct.marketplace.svc.cluster.local:8080/api/v1"
  ANALYTICS_SERVICE_URL: "http://analytics-service-direct.marketplace.svc.cluster.local:8080/api/v1"
  MARKETING_SERVICE_URL: "http://mp-marketing-direct.marketplace.svc.cluster.local:8080/api/v1"
  SUBSCRIPTION_SERVICE_URL: "http://subscription-service-direct.marketplace.svc.cluster.local:8080/api/v1"
  GIFT_CARDS_SERVICE_URL: "http://mp-gift-cards-direct.marketplace.svc.cluster.local:8080/api/v1"
  TICKETS_SERVICE_URL: "http://tickets-service-direct.marketplace.svc.cluster.local:8080/api/v1"
