  GCP_SECRET_PREFIX: "prod"
  USE_GCP_SECRET_MANAGER: "true"

# CSRF secret for admin panel
extraSecrets:
  - secretKey: CSRF_SECRET
    remoteKey: prod-mp-admin-csrf-secret
