serviceType: nextjs
port: 3000
healthPath: /api/health
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/tesserix/marketplace-admin
  tag: latest

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  concurrencyTarget: 50
  containerConcurrency: 50
  timeoutSeconds: 60

probes:
  startup:
    failureThreshold: 15
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

serviceAccount:
  create: true
  annotations: {}

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi

db:
  enabled: false
  host: ""
  port: ""
  name: ""
  user: ""
  sslmode: ""
  secretKey: ""

openfga:
  enabled: false
  url: ""
  authMode: ""
  apiKeySecret: false
  storeId: "01KMS970NNJPJP97MR7XNZSVD3"

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  refreshInterval: 15m

extraSecrets: []

env:
  AUTH_BFF_URL: http://auth-bff.marketplace.svc.cluster.local
  AUTH_BFF_INTERNAL_URL: http://auth-bff.marketplace.svc.cluster.local
  TENANT_SERVICE_URL: http://tenant-service.marketplace.svc.cluster.local
  TENANT_ROUTER_SERVICE_URL: http://tenant-router-service.marketplace.svc.cluster.local
  PRODUCTS_SERVICE_URL: http://mp-products.marketplace.svc.cluster.local
  ORDERS_SERVICE_URL: http://mp-orders.marketplace.svc.cluster.local
  VENDORS_SERVICE_URL: http://mp-vendors.marketplace.svc.cluster.local
  CUSTOMERS_SERVICE_URL: http://mp-customers.marketplace.svc.cluster.local
  CATEGORIES_SERVICE_URL: http://mp-categories.marketplace.svc.cluster.local
  COUPONS_SERVICE_URL: http://mp-coupons.marketplace.svc.cluster.local
  REVIEWS_SERVICE_URL: http://mp-reviews.marketplace.svc.cluster.local
  SHIPPING_SERVICE_URL: http://mp-shipping.marketplace.svc.cluster.local
  SETTINGS_SERVICE_URL: http://settings-service.marketplace.svc.cluster.local
  SUBSCRIPTION_SERVICE_URL: http://subscription-service.marketplace.svc.cluster.local
  TICKETS_SERVICE_URL: http://tickets-service.marketplace.svc.cluster.local
  NOTIFICATION_SERVICE_URL: http://notification-service.marketplace.svc.cluster.local
  NOTIFICATION_HUB_URL: http://notification-hub.marketplace.svc.cluster.local
  FEATURE_FLAGS_SERVICE_URL: http://feature-flags-service.marketplace.svc.cluster.local
  DOCUMENT_SERVICE_URL: http://document-service.marketplace.svc.cluster.local
  LOCATION_SERVICE_URL: http://location-service.marketplace.svc.cluster.local

gcp:
  projectId: ""
directServicePort: 80
