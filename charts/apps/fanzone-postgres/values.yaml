hibernate: false
# Data-preserving park: cnpg.io/hibernation annotation — pods to zero, PVCs kept.
hibernation: true

namespace: fanzone
clusterName: fanzone-postgres

instances: 2
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Storage — separate WAL volume for I/O isolation
# Actual data ~33MB, but 10Gi for growth headroom.
storageSize: 10Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

# Bootstrap — primary database for the Fanzone namespace
bootstrap:
  database: fanzone
  owner: fanzone
  # Secret must contain 'username' and 'password' keys (CNPG basic-auth format).
  # Created by ExternalSecret from GCP Secret Manager.
  secret: fanzone-postgres-app-credentials
  gcpSecretName: prod-fanzone-postgresql-password
  # Post-init SQL runs once after the cluster is created (idempotent).
  # Fanzone uses 3 databases: fanzone (bootstrap) + 2 additional below.
  postInitSQL:
    - "CREATE DATABASE fanzone_auth OWNER fanzone"
    - "CREATE DATABASE fanzone_db OWNER fanzone"

# PostgreSQL tuning
postgresql:
  max_connections: "1000"
  shared_buffers: "512MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots
  max_slot_wal_keep_size: "10GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  schedule: "0 30 3 * * *"
  destinationPath: "gs://tesseract-prod-backups-in/fanzone-postgres"
  retentionPolicy: "3d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 0  # parked — pgbouncer to zero while the cluster hibernates
  maxClientConn: "1000"
  defaultPoolSize: "25"

# Monitoring — CNPG built-in Prometheus exporter on port 9187
monitoring:
  enablePodMonitor: true

# Replication
affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 1
  maxSyncReplicas: 1

# Self-healing — auto-rebuild a wedged replica (acts only on multi-instance
# clusters; never touches the primary). See docs/cnpg-backup-restore.md and
# docs/incident-homechef-postgres-disk-full.md.
autoheal:
  enabled: true
  schedule: "*/10 * * * *"
  stuckMinutes: 15
  image: bitnamilegacy/kubectl:1.31.0
