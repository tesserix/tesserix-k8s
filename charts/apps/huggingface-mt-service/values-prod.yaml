# Production overrides for huggingface-mt-service

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-nexus-remote/tesseract-nexus/marketplace-services/huggingface-mt-service
  tag: "1.3.2"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation (ML model requires more resources)
resources:
  limits:
    memory: 8Gi
  requests:
    memory: 4Gi

# KEDA autoscaling - enabled for production
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 6
  pollingInterval: 30
  cooldownPeriod: 600  # Longer cooldown for ML models
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"
