# Default values for devai-sre-dashboard

replicaCount: 1

image:
  repository: ghcr.io/tesserix/devai/devai-sre-dashboard
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3200
  targetPort: 3200

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  NODE_ENV: "production"
  HOSTNAME: "0.0.0.0"
  NEXT_PUBLIC_API_URL: "http://devai-sre:8090"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false

podAnnotations:
  sidecar.istio.io/inject: "true"
  proxy.istio.io/config: |
    holdApplicationUntilProxyStarts: true
  traffic.sidecar.istio.io/excludeInboundPorts: "3200"

podLabels: {}
