apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockpilot-web.fullname" . }}
  labels:
    {{- include "stockpilot-web.labels" . | nindent 4 }}
  annotations:
    # Secrets are injected optional, so a pod predating an ExternalSecret sync
    # runs with them unset and fails auth silently. See tesserix-blog.
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stockpilot-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stockpilot-web.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stockpilot-web.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.api.publicUrl | quote }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ .Values.api.publicWsUrl | quote }}
            - name: API_INTERNAL_URL
              value: {{ .Values.api.internalUrl | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.auth.nextauthUrl | default "http://localhost:3000" | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: ALLOWED_EMAILS
              value: {{ .Values.auth.allowedEmails | default "" | quote }}
            {{- if .Values.auth.zitadel.clientId }}
            - name: AUTH_ZITADEL_ISSUER
              value: {{ .Values.auth.zitadel.issuer | quote }}
            - name: AUTH_ZITADEL_ID
              value: {{ .Values.auth.zitadel.clientId | quote }}
            - name: AUTH_ZITADEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockpilot-oidc-secrets
                  key: ZITADEL_CLIENT_SECRET
                  optional: true
            {{- end }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockpilot-auth-secrets
                  key: NEXTAUTH_SECRET
                  optional: true
            # Shared with the FastAPI backend; the Next.js BFF proxy at
            # /api/auth/proxy/* sends X-Internal-Secret with this value
            # so the backend trusts the paired X-User-Email header.
            # Without this, every browser API call 401s.
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockpilot-auth-secrets
                  key: INTERNAL_AUTH_SECRET
                  optional: true
            # Cluster-internal backend hostname for the BFF proxy. Defaults
            # to the in-cluster service so browser→Next.js→FastAPI stays on
            # the cluster network and bypasses the Istio ingress JWT filter.
            - name: BACKEND_API_URL
              value: {{ .Values.backendApiUrl | default "http://stockpilot-api.stockpilot.svc.cluster.local:8000" | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
