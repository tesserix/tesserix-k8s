# Default values for stockpilot-web

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/stock-analysis/stockpilot-web
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# The web app talks to the API service within the same namespace
api:
  internalUrl: "http://stockpilot-api:8000"
  publicUrl: "http://localhost:8000"
  publicWsUrl: "ws://localhost:8000"

env:
  NODE_ENV: "development"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

podAnnotations:
  holdApplicationUntilProxyStarts: "true"

podLabels: {}

# Auth defaults (override per environment)
auth:
  nextauthUrl: "http://localhost:3000"
  # Zitadel OIDC. Every env var below is gated on clientId, so the chart stays
  # renderable until the Zitadel application actually exists.
  zitadel:
    issuer: "https://auth.tesserix.app"
    clientId: ""
