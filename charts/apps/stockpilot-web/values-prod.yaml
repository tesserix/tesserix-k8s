# Production overrides for stockpilot-web

replicaCount: 1
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
env:
  NODE_ENV: "production"
api:
  internalUrl: "http://stockpilot-api:8000"
  publicUrl: "https://stockpilot.tesserix.app"
  publicWsUrl: "wss://stockpilot.tesserix.app"
auth:
  nextauthUrl: "https://stockpilot.tesserix.app"
  keycloakInternalUrl: "http://keycloak.identity-internal.svc.cluster.local:8080"
  keycloakPublicUrl: "https://identity-stock.tesserix.app"
  keycloakRealm: "stockpilot"
  keycloakClientId: "stockpilot-web"
  # Open signup: empty allowlist permits any Keycloak-authenticated user
  # (frontend/src/lib/auth.ts short-circuits to allow when the list is empty).
  allowedEmails: ""
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 80
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
image:
  tag: main-ddeda44
