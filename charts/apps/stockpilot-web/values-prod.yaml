# Production overrides for stockpilot-web

replicaCount: 1

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

env:
  NODE_ENV: "production"

api:
  internalUrl: "http://stockpilot-api:8000"
  publicUrl: "https://stockpilot.tesserix.app/api"
  publicWsUrl: "wss://stockpilot.tesserix.app/api/ws"

auth:
  nextauthUrl: "https://stockpilot.tesserix.app"
  keycloakIssuer: "https://internal-identity.tesserix.app/realms/stockpilot"
  keycloakClientId: "stockpilot-web"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 80

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
