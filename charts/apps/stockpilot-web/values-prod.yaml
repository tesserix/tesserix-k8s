# Production overrides for stockpilot-web

replicaCount: 0  # parked — product scaled down
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
env:
  NODE_ENV: "production"
api:
  internalUrl: "http://stockpilot-api:8000"
  publicUrl: "https://stockpilot.tesserix.app"
  publicWsUrl: "wss://stockpilot.tesserix.app"
auth:
  nextauthUrl: "https://stockpilot.tesserix.app"
  # Open signup: empty allowlist permits any authenticated user
  # (frontend/src/lib/auth.ts short-circuits to allow when the list is empty).
  allowedEmails: ""
  # Zitadel project 386314490855031436, application stockpilot-web-web. The
  # registered redirect URI is https://stockpilot.tesserix.app/api/auth/callback/zitadel
  # exactly — Zitadel matches literally, a trailing slash breaks sign-in.
  zitadel:
    issuer: "https://auth.tesserix.app"
    clientId: "386314491761066636"
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 80
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
image:
  tag: main-63e1bc0
