apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-platform-embedder.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "support-platform-embedder.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "support-platform-embedder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: support-platform
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # TEI's hf-hub 0.3.2 has a "relative URL without a base" bug when
      # downloading the main config.json (after the pool/st configs
      # succeed). Bypass it: pre-populate the HF cache with an init
      # container using huggingface_hub directly. TEI then finds the
      # snapshot already on disk and skips its broken downloader.
      initContainers:
        - name: model-prefetch
          image: python:3.11-slim
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -e
              MODEL="{{ .Values.model.id }}"
              CACHE=/data
              echo "checking $CACHE for $MODEL"
              # If we see ANY snapshot for this model, assume we're cached.
              if find "$CACHE/models--$(echo $MODEL | tr / -)/snapshots" -type d -mindepth 1 -maxdepth 1 2>/dev/null | head -1 | grep -q .; then
                echo "  cache hit, skipping prefetch"
                exit 0
              fi
              pip install --no-cache-dir --quiet huggingface_hub==0.27.1
              python - <<EOF
              from huggingface_hub import snapshot_download
              snapshot_download(repo_id="$MODEL", cache_dir="$CACHE")
              EOF
              echo "  downloaded; cache size:" $(du -sh $CACHE | cut -f1)
          volumeMounts:
            - name: cache
              mountPath: /data
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--model-id"
            - "{{ .Values.model.id }}"
            - "--port"
            - "80"
            - "--max-concurrent-requests"
            - "{{ .Values.model.maxConcurrentRequests }}"
            - "--max-batch-tokens"
            - "{{ .Values.model.maxBatchTokens }}"
            - "--huggingface-hub-cache"
            - "/data"
          ports:
            - name: http
              containerPort: 80
          env:
            # TEI's hf-hub crate fails with "relative URL without a base"
            # on model download unless HF_ENDPOINT is explicit. Hard-pin.
            - name: HF_ENDPOINT
              value: "https://huggingface.co"
            - name: HUGGINGFACE_HUB_URL
              value: "https://huggingface.co"
            {{- if .Values.huggingfaceTokenSecret.enabled }}
            # TEI fails with "relative URL without a base" when HF_TOKEN
            # is set to any non-empty string but the model is public.
            # Only inject the env var when a real token is configured;
            # bge-small-en + bge-reranker-base are both anonymous-pull.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.huggingfaceTokenSecret.name }}
                  key: {{ .Values.huggingfaceTokenSecret.key }}
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-cache
          {{- else }}
          emptyDir:
            sizeLimit: 3Gi
          {{- end }}
