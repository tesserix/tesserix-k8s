namespace: support-platform
name: support-platform-embedder

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: "cpu-1.8"  # CPU-only build of TEI
  pullPolicy: IfNotPresent

model:
  id: BAAI/bge-small-en-v1.5
  maxConcurrentRequests: 32
  maxBatchTokens: 8192

service:
  type: ClusterIP
  port: 8001

# PARKED 2026-08-01 for cost. support-platform-slm-router has had ZERO Service
# endpoints since 2026-07-29 (its binary dies on an otel semconv conflict), so
# nothing could reach this tier. Restore to 1 together with the router fix.
replicaCount: 1

resources:
  requests:
    memory: 1Gi
  limits:
    memory: 2Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 5Gi

keda:
  # Disabled while parked: a memory trigger cannot scale to zero, and it
  # scaled the reranker to 2 on idle baseline memory alone.
  enabled: false
  # KEDA's admission webhook rejects minReplicaCount=0 on a cpu/memory-
  # only ScaledObject (scale-to-zero needs an event-driven trigger).
  # Keep one pod warm — embedder is on the hot path for every AI reply.
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300

huggingfaceTokenSecret:
  name: support-platform-hf-token
  key: HF_TOKEN
