# The ONE shared credential for all local datastores. Reflector (bundled with
# sandboxctl) auto-copies it into every product namespace, so a product's
# values-local can reference `local-infra-creds` without any manual copying.
apiVersion: v1
kind: Secret
metadata:
  name: local-infra-creds
  namespace: {{ .Values.namespace }}
  labels: {{- include "local-infra.labels" . | nindent 4 }}
  annotations:
    # emberstack/reflector — mirror this Secret into the product namespaces.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "{{ join "," .Values.reflectNamespaces }}"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "{{ join "," .Values.reflectNamespaces }}"
type: Opaque
stringData:
  # All three share one throwaway local password. Products reference whichever
  # key matches their chart (POSTGRES_PASSWORD / password / REDIS_PASSWORD / …).
  POSTGRES_PASSWORD: {{ .Values.sharedPassword | quote }}
  password: {{ .Values.sharedPassword | quote }}
  REDIS_PASSWORD: {{ .Values.sharedPassword | quote }}
  MONGO_PASSWORD: {{ .Values.sharedPassword | quote }}
  MONGO_ROOT_USER: {{ .Values.mongodb.rootUser | quote }}
  # Convenience host hints (non-secret, handy for DSN assembly in values-local).
  PG_HOST: {{ include "local-infra.pgHost" . | quote }}
  REDIS_HOST: "redis.{{ .Values.namespace }}.svc.cluster.local"
  NATS_URL: "nats://nats.{{ .Values.namespace }}.svc.cluster.local:4222"
  MONGO_HOST: "mongodb.{{ .Values.namespace }}.svc.cluster.local"
