{{- if .Values.nats.enabled -}}
{{- if eq .Values.persistence "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
  labels: {{- include "local-infra.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.nats.storage }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
  labels: {{- include "local-infra.labels" . | nindent 4 }}
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
  labels: {{- include "local-infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nats } }
  template:
    metadata:
      labels: { app: nats }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          # JetStream on, file store under /data, HTTP monitor on 8222.
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          {{- if eq .Values.persistence "pvc" }}
          persistentVolumeClaim: { claimName: nats }
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
