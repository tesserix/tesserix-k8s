apiVersion: v2
name: mark8ly-uat-e2e-tests
description: |
  Kubernetes Job that runs the mark8ly Playwright e2e suite against the
  UAT URLs (https://tesserix-store-admin-uat.mark8ly.com /
  https://tesserix-store-uat.mark8ly.com). Created fresh on every Argo CD
  sync via the `argocd.argoproj.io/hook: Sync` annotation, so Kargo's
  smoke stage can re-run it by triggering a sync of the hosting App.

  Credentials never live in source — env vars come from the
  mark8ly-uat-playwright-creds Kubernetes Secret which ESO syncs from
  the `prod-mark8ly-uat-playwright-creds` GCP Secret Manager entry.
type: application
version: 0.1.0
appVersion: latest
