namespace: mark8ly-uat
name: mark8ly-uat-e2e-tests

image:
  repository: ghcr.io/tesserix/mark8ly-uat-e2e
  tag: "latest"            # bumped per-build by CI / Kargo
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

# UAT URL targets driven by the suite's TARGET_ENV/TARGET_SLUG env switch.
# tesserix-store is the seed tenant we onboarded in the UAT env. To run
# against a different slug, override here.
target:
  env: uat
  slug: tesserix-store

# Credentials come from the K8s Secret that ESO syncs from
# prod-mark8ly-uat-playwright-creds in GCP Secret Manager. Email +
# password are projected into the Pod via envFrom — never written to
# values.yaml or any other Git-tracked location.
credentialsSecret:
  name: mark8ly-uat-playwright-creds

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 2Gi

# Looser retry budget: 2 reruns (3 total attempts) so a single transient
# storefront blip / Cloudflare hiccup doesn't immediately Errored the
# smoke Stage. Real test failures still bubble up — after the 3rd
# attempt the Job's status.failed exceeds backoffLimit and the Job
# condition flips to type=Failed, which Argo CD propagates as
# hookPhase=Failed → App OperationPhase=Failed → Kargo argocd-update
# step Errored → smoke Stage Errored → prod cascade gated.
backoffLimit: 2

# The Job is created on every sync (sync-hook), so we don't keep history
# beyond the most recent run — Kargo / Argo CD UI is the audit trail.
ttlSecondsAfterFinished: 600
