# Kubernetes Job — runs the Playwright e2e suite against UAT.
#
# `argocd.argoproj.io/hook: Sync` makes Argo CD recreate the Job on every
# sync of the hosting Application. The Kargo smoke Stage triggers that
# sync via its argocd-update step, so each smoke promotion gets a fresh
# test run with a fresh Job log.
#
# Credentials (MARK8LY_ADMIN_EMAIL / MARK8LY_ADMIN_PASSWORD) are pulled
# from the K8s Secret `{{ .Values.credentialsSecret.name }}` which ESO
# syncs from `prod-mark8ly-uat-playwright-creds` in GCP Secret Manager.
# The suite's mark8ly/config.ts requires both vars at startup; if the
# secret is missing the Job fails fast.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: e2e-tests
    environment: uat
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
      annotations:
        # The suite calls out to public mark8ly.com endpoints — no Istio
        # mTLS path involved. Disable sidecar injection so the Job
        # reaches Completed instead of hanging on a never-shutdown Envoy.
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: playwright
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TARGET_ENV
              value: {{ .Values.target.env | quote }}
            - name: TARGET_SLUG
              value: {{ .Values.target.slug | quote }}
            # CI flag tells Playwright to fail-fast on test.only and
            # use the retry policy from playwright.config.ts.
            - name: CI
              value: "true"
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecret.name }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
