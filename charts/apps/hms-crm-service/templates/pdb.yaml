{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hms-crm-service.fullname" . }}
  labels:
    {{- include "hms-crm-service.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "hms-crm-service.selectorLabels" . | nindent 6 }}
{{- end }}
