{{- if and .Values.pooler.enabled (not .Values.hibernate) }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusterName }}-pooler-rw
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
      max_db_connections: {{ .Values.pooler.maxDbConnections | quote }}
      min_pool_size: "0"
      reserve_pool_size: {{ .Values.pooler.reservePoolSize | quote }}
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_lifetime: "3600"
      query_wait_timeout: "60"
      # sqlx names every statement it prepares even with its own cache off, so
      # in transaction mode the name lands on a server connection that already
      # has it. PgBouncer 1.21+ tracks them per client, which is the only way
      # this driver survives a transaction pool (api /readyz 503, 2026-08-17).
      max_prepared_statements: "200"
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusterName }}-pooler-ro
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
      max_db_connections: {{ .Values.pooler.maxDbConnections | quote }}
      min_pool_size: "0"
      reserve_pool_size: {{ .Values.pooler.reservePoolSize | quote }}
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_lifetime: "3600"
      query_wait_timeout: "60"
      # sqlx names every statement it prepares even with its own cache off, so
      # in transaction mode the name lands on a server connection that already
      # has it. PgBouncer 1.21+ tracks them per client, which is the only way
      # this driver survives a transaction pool (api /readyz 503, 2026-08-17).
      max_prepared_statements: "200"
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
{{- end }}
