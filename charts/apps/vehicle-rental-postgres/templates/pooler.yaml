{{- if and .Values.pooler.enabled (not .Values.hibernate) }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusterName }}-pooler-rw
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
      min_pool_size: "0"
      reserve_pool_size: "5"
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_lifetime: "3600"
      query_wait_timeout: "60"
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusterName }}-pooler-ro
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: database
spec:
  cluster:
    name: {{ .Values.clusterName }}
  instances: {{ .Values.pooler.instances }}
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.pooler.defaultPoolSize | quote }}
      min_pool_size: "0"
      reserve_pool_size: "5"
      server_idle_timeout: "600"
      client_idle_timeout: "0"
      server_lifetime: "3600"
      query_wait_timeout: "60"
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
{{- end }}
