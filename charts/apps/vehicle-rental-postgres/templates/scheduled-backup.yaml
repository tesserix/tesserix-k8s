{{- if and .Values.backup.enabled (not .Values.hibernate) }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.clusterName }}-scheduled-backup
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: database
spec:
  # Continuous WAL archiving is what bounds RPO to minutes; the base backup
  # bounds RTO by shortening replay.
  schedule: {{ .Values.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ .Values.clusterName }}
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
