{{- /* CNPG requires a basic-auth secret with 'username' and 'password' keys */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.bootstrap.secret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.bootstrap.secret }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.bootstrap.owner | quote }}
        password: "{{ "{{" }} .password | trim {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.bootstrap.gcpSecretName }}
        version: latest

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.application.secret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.application.secret }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.application.username | quote }}
        password: "{{ "{{" }} .password | trim {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.application.gcpSecretName }}
        version: latest
