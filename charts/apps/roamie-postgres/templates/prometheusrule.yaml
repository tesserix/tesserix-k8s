{{- if and .Values.monitoring.enablePodMonitor (not .Values.hibernate) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.clusterName }}-alerts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: database
    role: alert-rules
spec:
  groups:
    - name: {{ .Values.clusterName }}.rules
      rules:
        - alert: CNPGInstanceDown
          expr: cnpg_collector_up{cluster={{ .Values.clusterName | quote }}} == 0
          for: 5m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "CNPG instance {{ "{{" }} $labels.pod {{ "}}" }} is down"
            description: "PostgreSQL instance {{ "{{" }} $labels.pod {{ "}}" }} in cluster {{ .Values.clusterName }} has been down for more than 5 minutes."

        - alert: CNPGClusterNotReady
          expr: absent(cnpg_collector_up{cluster={{ .Values.clusterName | quote }}}) == 1 or max(cnpg_collector_up{cluster={{ .Values.clusterName | quote }}}) == 0
          for: 5m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "CNPG cluster {{ .Values.clusterName }} is not Ready"
            description: "No healthy instance is reporting for cluster {{ .Values.clusterName }}. The database is likely fully down even if ArgoCD shows the app Healthy. Check the Cluster CR status, WAL volume usage, and continuous archiving."

        - alert: CNPGReplicationLag
          expr: cnpg_pg_replication_lag{cluster={{ .Values.clusterName | quote }}} > 30
          for: 5m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Replication lag on {{ "{{" }} $labels.pod {{ "}}" }}"
            description: "Replica {{ "{{" }} $labels.pod {{ "}}" }} is {{ "{{" }} $value {{ "}}" }}s behind primary in cluster {{ .Values.clusterName }}."

        - alert: CNPGReplicationLagCritical
          expr: cnpg_pg_replication_lag{cluster={{ .Values.clusterName | quote }}} > 300
          for: 5m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Critical replication lag on {{ "{{" }} $labels.pod {{ "}}" }}"
            description: "Replica {{ "{{" }} $labels.pod {{ "}}" }} is {{ "{{" }} $value {{ "}}" }}s behind primary in cluster {{ .Values.clusterName }}."

        - alert: CNPGWALArchiveFailing
          expr: cnpg_collector_pg_wal_archive_status{cluster={{ .Values.clusterName | quote }},value="failed"} > 0
          for: 10m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "WAL archiving failing for {{ .Values.clusterName }}"
            description: "WAL archiving has been failing for more than 10 minutes. Backups and PITR are at risk."

        - alert: CNPGWALAccumulation
          expr: cnpg_collector_pg_wal{cluster={{ .Values.clusterName | quote }},value="size"} > 1073741824
          for: 15m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "WAL accumulation on {{ .Values.clusterName }}"
            description: "WAL files have grown to {{ "{{" }} $value | humanize1024 {{ "}}" }}. Check archiving and replication slots."

        - alert: CNPGSyncReplicaMismatch
          expr: cnpg_collector_sync_replicas{cluster={{ .Values.clusterName | quote }},value="observed"} < cnpg_collector_sync_replicas{cluster={{ .Values.clusterName | quote }},value="expected"}
          for: 10m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Sync replica count mismatch for {{ .Values.clusterName }}"
            description: "Expected {{ "{{" }} $labels.expected {{ "}}" }} sync replicas but only {{ "{{" }} $value {{ "}}" }} are available. Data durability is degraded."

        - alert: CNPGHighConnectionUsage
          expr: cnpg_collector_pg_stat_activity{cluster={{ .Values.clusterName | quote }},state="active"} > ({{ .Values.postgresql.max_connections | default "200" }} * 0.8)
          for: 5m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "High connection usage on {{ .Values.clusterName }}"
            description: "Active connections are above 80% of max_connections."

        - alert: CNPGLongRunningTransaction
          expr: cnpg_collector_pg_long_running_transactions{cluster={{ .Values.clusterName | quote }}} > 600
          for: 5m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Long-running transaction on {{ .Values.clusterName }}"
            description: "A transaction has been running for more than {{ "{{" }} $value {{ "}}" }}s."

        - alert: CNPGClusterInstancesNotReady
          expr: count(cnpg_collector_up{cluster={{ .Values.clusterName | quote }}} == 1) < {{ .Values.instances }}
          for: 15m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "{{ .Values.clusterName }} has fewer than {{ .Values.instances }} ready instances"
            description: "Only {{ "{{" }} $value {{ "}}" }} of {{ .Values.instances }} instances are healthy. HA/failover is degraded — a wedged or crashlooping replica may be pinning the cluster."

        - alert: CNPGVolumeSpaceCritical
          expr: |
            min by (persistentvolumeclaim) (
              kubelet_volume_stats_available_bytes{namespace={{ .Values.namespace | quote }},persistentvolumeclaim=~"{{ .Values.clusterName }}.*"}
              / kubelet_volume_stats_capacity_bytes{namespace={{ .Values.namespace | quote }},persistentvolumeclaim=~"{{ .Values.clusterName }}.*"}
            ) * 100 < 10
          for: 5m
          labels:
            severity: critical
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Volume {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} below 10% free"
            description: "PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} has {{ "{{" }} $value {{ "}}" }}% space left. A full WAL/data volume stops PostgreSQL and can deadlock the cluster — expand the PVC (resizeInUseVolumes is enabled)."

        - alert: CNPGVolumeSpaceLow
          expr: |
            min by (persistentvolumeclaim) (
              kubelet_volume_stats_available_bytes{namespace={{ .Values.namespace | quote }},persistentvolumeclaim=~"{{ .Values.clusterName }}.*"}
              / kubelet_volume_stats_capacity_bytes{namespace={{ .Values.namespace | quote }},persistentvolumeclaim=~"{{ .Values.clusterName }}.*"}
            ) * 100 < 25
          for: 15m
          labels:
            severity: warning
            cluster: {{ .Values.clusterName }}
          annotations:
            summary: "Volume {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} below 25% free"
            description: "PVC {{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} has {{ "{{" }} $value {{ "}}" }}% space left. Check WAL growth / inactive replication slots and plan a volume expansion."
{{- end }}
