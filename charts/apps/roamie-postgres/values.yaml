hibernate: false
namespace: roamie
clusterName: roamie-postgres
inheritedLabels:
  istio.io/use-waypoint: none
instances: 2
imageName: ghcr.io/cloudnative-pg/postgresql:16.13
storageSize: 10Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi
bootstrap:
  database: roamie
  owner: roamie
  secret: roamie-postgres-app
  gcpSecretName: prod-roamie-postgresql-password
  postInitSQL: []
application:
  username: roamie_app
  secret: roamie-postgres-runtime
  gcpSecretName: prod-roamie-postgresql-runtime-password
postgresql:
  max_connections: '100'
  shared_buffers: 256MB
  effective_cache_size: 1536MB
  work_mem: 4MB
  maintenance_work_mem: 128MB
  wal_level: logical
  max_replication_slots: '10'
  max_wal_senders: '10'
  ssl_min_protocol_version: TLSv1.3
  ssl_max_protocol_version: TLSv1.3
  idle_in_transaction_session_timeout: '300000'
  statement_timeout: '120000'
  random_page_cost: '1.1'
  effective_io_concurrency: '200'
  log_min_duration_statement: '1000'
  hot_standby_feedback: 'on'
  max_slot_wal_keep_size: 2GB
  pg_stat_statements.track: all
  pg_stat_statements.max: '10000'
  archive_timeout: 300s
backup:
  enabled: true
  schedule: 0 0 3 * * *
  destinationPath: gs://tesseracthub-480811-roamie-db-backups-prod
  serverName: roamie-postgres-v1
  retentionPolicy: 7d
  serviceAccount: roamie-db-backup-prod@tesseracthub-480811.iam.gserviceaccount.com
pooler:
  enabled: false
  instances: 1
  maxClientConn: '1000'
  defaultPoolSize: '20'
monitoring:
  enablePodMonitor: true
affinity:
  podAntiAffinityType: required
replication:
  minSyncReplicas: 1
  maxSyncReplicas: 1
