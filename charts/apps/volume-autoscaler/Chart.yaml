apiVersion: v2
name: volume-autoscaler
description: >-
  Watches PVC utilisation across the cluster and grows volumes before they fill.
  CNPG clusters are grown GitOps-natively (the new size is committed back to
  this repo's values.yaml so ArgoCD self-heal cannot revert it); StatefulSet and
  standalone PVCs are patched in place because volumeClaimTemplates are
  immutable.
type: application
version: 0.1.1
appVersion: "0.1.0"
keywords:
  - storage
  - autoscaling
  - cnpg
