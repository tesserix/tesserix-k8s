{{- if .Values.externalSecrets.enabled }}
# GitHub token used ONLY to commit storage-size changes back to this repo.
# Scope it to `contents: write` on tesserix-k8s and nothing else: this token is
# mounted into a CronJob that runs unattended, so its blast radius should stop
# at one repository.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.git.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: volume-autoscaler
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.git.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.git.secretKey }}
      remoteRef:
        key: {{ .Values.git.gcpSecretName }}
{{- end }}
