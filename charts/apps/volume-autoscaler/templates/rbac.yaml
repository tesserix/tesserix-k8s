apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-autoscaler
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: volume-autoscaler
    app.kubernetes.io/component: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volume-autoscaler
  labels:
    app.kubernetes.io/name: volume-autoscaler
rules:
  # Enumerate nodes, then read each kubelet's stats/summary for per-PVC
  # used/capacity bytes. This is the only source of volume UTILISATION in a
  # cluster without Prometheus — the PVC object itself only reports the
  # requested size, never how full it is.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  # Read every PVC (to size them) and patch the non-CNPG ones in place.
  # StatefulSet volumeClaimTemplates are immutable, so an in-place patch is the
  # only way to grow an existing StatefulSet volume.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]
  # CNPG clusters are read to discover which PVCs belong to a database (those
  # are grown via git, never patched). Read-only on purpose: the autoscaler
  # must not be able to mutate a Cluster spec directly.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volume-autoscaler
  labels:
    app.kubernetes.io/name: volume-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volume-autoscaler
subjects:
  - kind: ServiceAccount
    name: volume-autoscaler
    namespace: {{ .Values.namespace }}
