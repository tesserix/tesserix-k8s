# Postiz app secrets from GCP SM.
#
# ONLY keys with real, accessible SM versions belong here: Secret Manager
# rejects empty payloads, and a single missing/purged remoteRef fails the
# WHOLE ExternalSecret. The deployment mounts every per-platform credential
# with `optional: true`, so absent keys simply hide that provider in the UI.
#
# To enable a social platform:
#   1. Register the developer app (callback URL on publicUrl) and store BOTH
#      id + secret:  gcloud secrets create prod-postiz-<name> ... (or
#      `versions add` if the purged secret shell already exists — see the
#      prod-postiz-* shells left from the earlier deployment)
#   2. Uncomment / add its pair below; ESO refreshes within 1h (or delete the
#      postiz-secrets K8s secret to force an immediate re-sync).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postiz-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postiz-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: prod-postiz-jwt-secret }

    # - secretKey: OPENAI_API_KEY
    #   remoteRef: { key: prod-postiz-openai-api-key }

    # X / Twitter
    # - secretKey: X_API_KEY
    #   remoteRef: { key: prod-postiz-x-api-key }
    # - secretKey: X_API_SECRET
    #   remoteRef: { key: prod-postiz-x-api-secret }

    # LinkedIn
    # - secretKey: LINKEDIN_CLIENT_ID
    #   remoteRef: { key: prod-postiz-linkedin-client-id }
    # - secretKey: LINKEDIN_CLIENT_SECRET
    #   remoteRef: { key: prod-postiz-linkedin-client-secret }

    # Facebook
    # - secretKey: FACEBOOK_APP_ID
    #   remoteRef: { key: prod-postiz-facebook-app-id }
    # - secretKey: FACEBOOK_APP_SECRET
    #   remoteRef: { key: prod-postiz-facebook-app-secret }

    # Threads
    # - secretKey: THREADS_APP_ID
    #   remoteRef: { key: prod-postiz-threads-app-id }
    # - secretKey: THREADS_APP_SECRET
    #   remoteRef: { key: prod-postiz-threads-app-secret }

    # YouTube — doubles as the Google sign-in client (Postiz's GOOGLE auth
    # provider reads YOUTUBE_CLIENT_ID/SECRET). Redirect URI on the client:
    # https://postiz.tesserix.app/integrations/social/youtube
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef: { key: prod-postiz-youtube-client-id }
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef: { key: prod-postiz-youtube-client-secret }

    # TikTok
    # - secretKey: TIKTOK_CLIENT_ID
    #   remoteRef: { key: prod-postiz-tiktok-client-id }
    # - secretKey: TIKTOK_CLIENT_SECRET
    #   remoteRef: { key: prod-postiz-tiktok-client-secret }

    # Pinterest
    # - secretKey: PINTEREST_CLIENT_ID
    #   remoteRef: { key: prod-postiz-pinterest-client-id }
    # - secretKey: PINTEREST_CLIENT_SECRET
    #   remoteRef: { key: prod-postiz-pinterest-client-secret }

    # Reddit
    # - secretKey: REDDIT_CLIENT_ID
    #   remoteRef: { key: prod-postiz-reddit-client-id }
    # - secretKey: REDDIT_CLIENT_SECRET
    #   remoteRef: { key: prod-postiz-reddit-client-secret }

    # Discord
    # - secretKey: DISCORD_CLIENT_ID
    #   remoteRef: { key: prod-postiz-discord-client-id }
    # - secretKey: DISCORD_CLIENT_SECRET
    #   remoteRef: { key: prod-postiz-discord-client-secret }
    # - secretKey: DISCORD_BOT_TOKEN_ID
    #   remoteRef: { key: prod-postiz-discord-bot-token }

    # Slack
    # - secretKey: SLACK_ID
    #   remoteRef: { key: prod-postiz-slack-id }
    # - secretKey: SLACK_SECRET
    #   remoteRef: { key: prod-postiz-slack-secret }
    # - secretKey: SLACK_SIGNING_SECRET
    #   remoteRef: { key: prod-postiz-slack-signing-secret }

    # Mastodon
    # - secretKey: MASTODON_CLIENT_ID
    #   remoteRef: { key: prod-postiz-mastodon-client-id }
    # - secretKey: MASTODON_CLIENT_SECRET
    #   remoteRef: { key: prod-postiz-mastodon-client-secret }
