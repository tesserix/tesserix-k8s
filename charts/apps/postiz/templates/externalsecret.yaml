# Application credentials use the namespaced OpenBao reader.
# Enable optional providers only after populating their product-prefixed paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postiz-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-postiz-production
    kind: SecretStore
  target:
    name: postiz-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: postiz/app/postiz-jwt-secret, property: value }

    # Cloudflare R2 uploads storage (STORAGE_PROVIDER=cloudflare) — R2 API
    # token scoped Object Read & Write on the postiz-uploads bucket.
    - secretKey: CLOUDFLARE_ACCESS_KEY
      remoteRef: { key: postiz/app/postiz-cf-access-key, property: value }
    - secretKey: CLOUDFLARE_SECRET_ACCESS_KEY
      remoteRef: { key: postiz/app/postiz-cf-secret-access-key, property: value }

    # - secretKey: OPENAI_API_KEY
    #   remoteRef: { key: postiz/app/postiz-openai-api-key, property: value }

    # X / Twitter — dev app under @tesserix_app (free tier, 500 posts/mo).
    # Callback: https://postiz.tesserix.app/integrations/social/x
    - secretKey: X_API_KEY
      remoteRef: { key: postiz/app/postiz-x-api-key, property: value }
    - secretKey: X_API_SECRET
      remoteRef: { key: postiz/app/postiz-x-api-secret, property: value }

    # LinkedIn — these creds are the app "postiz-app" (client 86ir816wqoygbq,
    # LinkedIn app id 257410029). Three products must stay on it: Sign In with
    # LinkedIn using OpenID Connect, Share on LinkedIn, and Advertising API
    # (Development Tier, approved 2026-10-01). Remove any one and connect breaks.
    #
    # Why that combination and not Community Management API: Postiz asks for all
    # seven scopes in a single authorization request (openid, profile,
    # w_member_social, r_basicprofile, rw_organization_admin,
    # w_organization_social, r_organization_social) and fails the whole request
    # if any is refused. CM API grants the four organization scopes but LinkedIn
    # forces it to be the ONLY product on its app, which excludes OpenID Connect
    # sign-in and therefore openid/profile. Advertising API carries the same
    # organization scopes without that exclusivity rule, so it can sit alongside
    # OIDC. Our CM-only app "Tesserix Postiz CM" (86yslcf9mrwrxv) is a dead end
    # kept only as evidence — do NOT point these paths at it.
    #
    # Re-test without a browser by replaying the generated auth URL from the pod
    # (fetch with redirect:"manual"): 303 to /uas/login means the scope set is
    # accepted, HTTP 200 containing "Bummer, something went wrong" means refused.
    # A rejection is indistinguishable between a missing scope and an
    # unregistered redirect_uri, so pin the redirect with a known-good scope set
    # first. When it fails LinkedIn rejects the authorization request itself, so
    # there is NOTHING in the backend log and no row in Integration.
    #
    # Both providers (personal + page) use these same creds. Callbacks, both
    # registered: /integrations/social/linkedin and /integrations/social/linkedin-page
    - secretKey: LINKEDIN_CLIENT_ID
      remoteRef: { key: postiz/app/postiz-linkedin-client-id, property: value }
    - secretKey: LINKEDIN_CLIENT_SECRET
      remoteRef: { key: postiz/app/postiz-linkedin-client-secret, property: value }

    # Facebook — Meta app "Tesserix Postiz" (1683041546092184). Also drives the
    # Instagram (business, via FB Page) provider — INSTAGRAM_APP_* is only for
    # the standalone Instagram provider, which we don't use.
    - secretKey: FACEBOOK_APP_ID
      remoteRef: { key: postiz/app/postiz-facebook-app-id, property: value }
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef: { key: postiz/app/postiz-facebook-app-secret, property: value }

    # Threads — Threads-specific creds from the "Access the Threads API" use
    # case (third credential pair on the Meta app, distinct from FB + IG).
    # Callback: https://postiz.tesserix.app/integrations/social/threads
    - secretKey: THREADS_APP_ID
      remoteRef: { key: postiz/app/postiz-threads-app-id, property: value }
    - secretKey: THREADS_APP_SECRET
      remoteRef: { key: postiz/app/postiz-threads-app-secret, property: value }

    # YouTube — doubles as the Google sign-in client (Postiz's GOOGLE auth
    # provider reads YOUTUBE_CLIENT_ID/SECRET). Redirect URI on the client:
    # https://postiz.tesserix.app/integrations/social/youtube
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef: { key: postiz/app/postiz-youtube-client-id, property: value }
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef: { key: postiz/app/postiz-youtube-client-secret, property: value }

    # TikTok
    # - secretKey: TIKTOK_CLIENT_ID
    #   remoteRef: { key: postiz/app/postiz-tiktok-client-id, property: value }
    # - secretKey: TIKTOK_CLIENT_SECRET
    #   remoteRef: { key: postiz/app/postiz-tiktok-client-secret, property: value }

    # Pinterest
    # - secretKey: PINTEREST_CLIENT_ID
    #   remoteRef: { key: postiz/app/postiz-pinterest-client-id, property: value }
    # - secretKey: PINTEREST_CLIENT_SECRET
    #   remoteRef: { key: postiz/app/postiz-pinterest-client-secret, property: value }

    # Reddit
    # - secretKey: REDDIT_CLIENT_ID
    #   remoteRef: { key: postiz/app/postiz-reddit-client-id, property: value }
    # - secretKey: REDDIT_CLIENT_SECRET
    #   remoteRef: { key: postiz/app/postiz-reddit-client-secret, property: value }

    # Discord
    # - secretKey: DISCORD_CLIENT_ID
    #   remoteRef: { key: postiz/app/postiz-discord-client-id, property: value }
    # - secretKey: DISCORD_CLIENT_SECRET
    #   remoteRef: { key: postiz/app/postiz-discord-client-secret, property: value }
    # - secretKey: DISCORD_BOT_TOKEN_ID
    #   remoteRef: { key: postiz/app/postiz-discord-bot-token, property: value }

    # Slack
    # - secretKey: SLACK_ID
    #   remoteRef: { key: postiz/app/postiz-slack-id, property: value }
    # - secretKey: SLACK_SECRET
    #   remoteRef: { key: postiz/app/postiz-slack-secret, property: value }
    # - secretKey: SLACK_SIGNING_SECRET
    #   remoteRef: { key: postiz/app/postiz-slack-signing-secret, property: value }

    # Mastodon
    # - secretKey: MASTODON_CLIENT_ID
    #   remoteRef: { key: postiz/app/postiz-mastodon-client-id, property: value }
    # - secretKey: MASTODON_CLIENT_SECRET
    #   remoteRef: { key: postiz/app/postiz-mastodon-client-secret, property: value }

    # Instagram (Standalone) — Instagram-Login API creds from the
    # "Manage messaging & content on Instagram" use case (NOT the FB app id).
    # Redirect URI: https://postiz.tesserix.app/integrations/social/instagram-standalone
    - secretKey: INSTAGRAM_APP_ID
      remoteRef: { key: postiz/app/postiz-instagram-app-id, property: value }
    - secretKey: INSTAGRAM_APP_SECRET
      remoteRef: { key: postiz/app/postiz-instagram-app-secret, property: value }
