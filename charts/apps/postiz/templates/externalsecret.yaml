# Single ExternalSecret bundles every Postiz "secret" env value:
#   - JWT_SECRET                       (Postiz cookie/JWT signing key)
#   - POSTIZ_OAUTH_CLIENT_SECRET       (Keycloak client secret for the `postiz` client)
#   - OPENAI_API_KEY                   (used for Postiz built-in copilot/dall-e — optional)
#   - per-platform OAuth client secrets (X_API_SECRET, LINKEDIN_CLIENT_SECRET, ...)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postiz-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postiz-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod-postiz-jwt-secret
    - secretKey: POSTIZ_OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-keycloak-client-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prod-postiz-openai-api-key
    - secretKey: X_API_SECRET
      remoteRef:
        key: prod-postiz-x-api-secret
    - secretKey: LINKEDIN_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-linkedin-client-secret
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: prod-postiz-facebook-app-secret
    - secretKey: THREADS_APP_SECRET
      remoteRef:
        key: prod-postiz-threads-app-secret
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-youtube-client-secret
    - secretKey: TIKTOK_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-tiktok-client-secret
    - secretKey: PINTEREST_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-pinterest-client-secret
    - secretKey: REDDIT_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-reddit-client-secret
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-discord-client-secret
    - secretKey: DISCORD_BOT_TOKEN_ID
      remoteRef:
        key: prod-postiz-discord-bot-token
    - secretKey: SLACK_SECRET
      remoteRef:
        key: prod-postiz-slack-secret
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: prod-postiz-slack-signing-secret
    - secretKey: MASTODON_CLIENT_SECRET
      remoteRef:
        key: prod-postiz-mastodon-client-secret
