apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postiz.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "postiz.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate   # PVC-backed uploads volume is RWO — single pod at a time
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "postiz.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "postiz.serviceAccountName" . }}
      containers:
        - name: postiz
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # ─── URLs ─────────────────────────────────────────────────────
            - name: MAIN_URL
              value: {{ .Values.publicUrl | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.publicUrl | quote }}
            - name: NEXT_PUBLIC_BACKEND_URL
              value: {{ printf "%s/api" .Values.publicUrl | quote }}
            - name: BACKEND_INTERNAL_URL
              value: "http://localhost:3000"

            # ─── Database ────────────────────────────────────────────────
            # POSTIZ_DB_PASSWORD is interpolated into DATABASE_URL via $(VAR)
            # at container start. The CNPG-issued ExternalSecret holds it.
            - name: POSTIZ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name }}
                  key: {{ .Values.database.passwordSecret.key }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(POSTIZ_DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.database }}"

            # ─── Redis ───────────────────────────────────────────────────
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.passwordSecret.name }}
                  key: {{ .Values.redis.passwordSecret.key }}

            # ─── Temporal ────────────────────────────────────────────────
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}

            # ─── App secrets (ExternalSecret-mounted) ────────────────────
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postiz-secrets
                  key: JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postiz-secrets
                  key: OPENAI_API_KEY

            # ─── Per-platform OAuth (id from values, secret from secret) ──
            {{- range $key, $value := .Values.platformOauth }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name := list "X_API_SECRET" "LINKEDIN_CLIENT_SECRET" "FACEBOOK_APP_SECRET" "THREADS_APP_SECRET" "YOUTUBE_CLIENT_SECRET" "TIKTOK_CLIENT_SECRET" "PINTEREST_CLIENT_SECRET" "REDDIT_CLIENT_SECRET" "DISCORD_CLIENT_SECRET" "DISCORD_BOT_TOKEN_ID" "SLACK_SECRET" "SLACK_SIGNING_SECRET" "MASTODON_CLIENT_SECRET" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: postiz-secrets
                  key: {{ $name }}
                  optional: true
            {{- end }}

            # ─── Generic OAuth (Keycloak SSO) ─────────────────────────────
            {{- if .Values.keycloak.enabled }}
            - name: POSTIZ_GENERIC_OAUTH
              value: "true"
            - name: POSTIZ_OAUTH_URL
              value: {{ .Values.keycloak.realmIssuer | quote }}
            - name: POSTIZ_OAUTH_AUTH_URL
              value: {{ .Values.keycloak.authUrl | quote }}
            - name: POSTIZ_OAUTH_TOKEN_URL
              value: {{ .Values.keycloak.tokenUrl | quote }}
            - name: POSTIZ_OAUTH_USERINFO_URL
              value: {{ .Values.keycloak.userInfoUrl | quote }}
            - name: POSTIZ_OAUTH_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: POSTIZ_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postiz-secrets
                  key: POSTIZ_OAUTH_CLIENT_SECRET
            - name: POSTIZ_OAUTH_SCOPE
              value: {{ .Values.keycloak.scope | quote }}
            - name: NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME
              value: {{ .Values.keycloak.displayName | quote }}
            {{- end }}

            # ─── Misc tunables (ULTIMATE tier auto-resolves with Stripe absent) ──
            - name: IS_GENERAL
              value: {{ .Values.flags.isGeneral | quote }}
            - name: NOT_SECURED
              value: {{ .Values.flags.notSecured | quote }}
            - name: DISABLE_REGISTRATION
              value: {{ .Values.flags.disableRegistration | quote }}
            - name: API_LIMIT
              value: {{ .Values.flags.apiLimit | quote }}
            - name: STORAGE_PROVIDER
              value: {{ .Values.flags.storageProvider | quote }}
            - name: UPLOAD_DIRECTORY
              value: "/uploads"
            - name: NEXT_PUBLIC_UPLOAD_DIRECTORY
              value: "/uploads"
            - name: NX_ADD_PLUGINS
              value: "false"
            # Empty Stripe envs → Postiz auto-resolves tier=ULTIMATE, totalChannels=10000
            - name: STRIPE_PUBLISHABLE_KEY
              value: ""
            - name: STRIPE_SECRET_KEY
              value: ""

          volumeMounts:
            - name: uploads
              mountPath: /uploads

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: postiz-uploads
