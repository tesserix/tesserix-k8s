# Namespace-wide permissive ALLOW (support-platform precedent): ambient mesh
# with no waypoint means plaintext callers (cnpg-system probes, ESO controller)
# present no SPIFFE identity, so a source-namespace allowlist would reset their
# connections. NetworkPolicy (default-deny + allowlist) gates L3/L4 access;
# tighten this per-workload once a waypoint exists.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-namespace-wide
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - {}
