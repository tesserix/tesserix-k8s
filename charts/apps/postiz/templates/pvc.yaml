apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-uploads
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.uploads.pvc.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.uploads.pvc.storageClass }}
  resources:
    requests:
      storage: {{ .Values.uploads.pvc.size }}
