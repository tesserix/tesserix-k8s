# Legacy local-uploads PVC — kept while uploads.pvc.enabled=true even though
# the pod no longer mounts it (STORAGE_PROVIDER=cloudflare), so ArgoCD's
# automated prune doesn't delete the old data's claim. Flip enabled=false to
# prune (the PV is Retain, so data survives even then).
{{- if .Values.uploads.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-uploads
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.uploads.pvc.accessMode | default "ReadWriteOnce" }}
  storageClassName: {{ .Values.uploads.pvc.storageClass }}
  resources:
    requests:
      storage: {{ .Values.uploads.pvc.size }}
{{- end }}
