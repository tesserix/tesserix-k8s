# Namespace managed by this chart (support-platform-namespace precedent) so
# ambient-mesh labels land declaratively — CreateNamespace=true alone would
# leave the namespace unlabeled. Intentionally NOT registered in istio-config's
# appNamespaces; postiz manages its own mesh/network policies below.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: postiz
    # Ambient mode (NOT sidecar) — matches scrapper/support-platform.
    istio.io/dataplane-mode: ambient
    # TIG deletion guard — VAP lives in k8s/cluster/namespace-protection.yaml
    tesserix.io/protected: "true"
    tesserix.io/tier: application
