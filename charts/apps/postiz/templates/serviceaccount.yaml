{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postiz.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount | default true }}
{{- end }}
