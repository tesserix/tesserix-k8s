# marketplace-api-admin accepts traffic only from auth-bff and the
# merchant-facing Next.js apps. Storefront traffic goes to
# marketplace-api-storefront, which has its own AuthorizationPolicy.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-marketplace-api-admin-callers
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-auth-bff"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-admin"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-platform-api"
              # tracking-sync CronJob (defined in this same chart) self-calls
              # /api/v1/internal/shipments/tracking/sync. Its pod runs as the
              # same SA as the marketplace-api-admin Deployment so this
              # principal admits both — see tracking-sync-cronjob.yaml.
              - "cluster.local/ns/{{ .Values.namespace }}/sa/{{ .Values.name }}"
              # tesserix-auth-bff is the cross-namespace super-admin gateway
              # for tesserix.app and proxies admin API calls on behalf of
              # logged-in platform owners.
              - "cluster.local/ns/tesserix/sa/tesserix-auth-bff"
              # tesserix-home (super-admin) — needed for /internal/templates/refresh
              # and /internal/templates/:key/test calls when an operator saves a
              # marketplace-api template (orderdoc / giftcard / shipment) or
              # fires a test-send via the admin UI.
              - "cluster.local/ns/tesserix/sa/company"
              # openpanel's cors-sync CronJob reads /internal/active-domains to
              # keep merchant custom domains in the storefront project's CORS.
              - "cluster.local/ns/openpanel/sa/openpanel"
              # platform-api's federation client calls /api/v1/platform/admin/*
              # on behalf of a console operator (tesserix-home#334). This is
              # the successor to the `company` principal above: the same calls
              # used to leave apps/web, and are moving to the Go service.
              #
              # Without this entry the call is refused HERE, by the sidecar,
              # with an Istio RBAC 403 — before mark8ly's own HMAC check ever
              # runs. That failure looks nothing like the 401 the signing
              # scheme produces, and it leaves no trace in marketplace-api's
              # logs, so it is worth knowing this line is what admits the
              # caller at all.
              - "cluster.local/ns/tesserix/sa/platform-api"
