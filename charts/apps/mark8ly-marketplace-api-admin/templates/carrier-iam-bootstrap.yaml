{{- /*
Auto-provisions the GCP IAM binding the marketplace-api service
account needs to create/read/delete per-tenant carrier secrets in GCP
Secret Manager. Runs as a Helm post-install / post-upgrade Job.

Design notes:
  * `secretmanager.admin` is granted UNCONDITIONALLY at the project
    level. IAM conditions of the form `resource.name.startsWith(...)`
    CANNOT gate `secretmanager.secrets.create`: at CREATE time there
    is no resource yet, and `resource.name` evaluates to the parent
    project — the prefix match always returns false. The security
    boundary is therefore:
      1. A dedicated SA, bound only to marketplace-api pods via
         Workload Identity.
      2. Application-layer naming — the Go code only ever writes
         secrets under the `mark8ly-{env}-*` prefix by construction
         (see internal/carriersecrets/refs.go).
  * `gcloud add-iam-policy-binding` is idempotent — replaying this
    job is safe. The `--condition=None` flag is required when the
    policy already has any conditional binding for the same
    (member, role) pair, so we always pass it.
  * Runs under a dedicated in-cluster SA that has access to gcloud
    via Workload Identity. We reuse the same GCP SA marketplace-api
    itself uses, since it already has `iam.serviceAccountTokenCreator`
    on itself — which is the minimum to self-bind. If that's ever
    revoked, the job fails loudly and the operator rotates via
    `gcloud projects add-iam-policy-binding` directly.
*/ -}}
{{- if .Values.carrierIamBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-carrier-iam-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: iam-bootstrap
  # Use ArgoCD Sync phases — ArgoCD ignores Helm's post-install /
  # post-upgrade hooks because it renders the chart and applies the
  # manifests directly rather than running `helm install`. The Argo
  # equivalent is argocd.argoproj.io/hook=PostSync, which runs the
  # Job after the main Sync wave completes. The Job is recreated on
  # every Sync so it reruns on every ArgoCD sync — exactly the same
  # semantics as helm post-install/post-upgrade.
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-carrier-iam-bootstrap
        app.kubernetes.io/part-of: mark8ly
      annotations:
        # Exclude GCP metadata server from Istio so Workload Identity
        # token fetch reaches 169.254.169.254.
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ .Values.name }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: bootstrap
          image: {{ .Values.carrierIamBootstrap.image | default "google/cloud-sdk:slim" | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              echo "carrier-iam-bootstrap: binding roles/secretmanager.admin to ${GCP_SA}"
              gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
                --member="serviceAccount:${GCP_SA}" \
                --role="roles/secretmanager.admin" \
                --condition=None \
                --quiet
              echo "carrier-iam-bootstrap: done"
          env:
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcpProjectId | quote }}
            - name: GCP_SA
              value: {{ .Values.gcpServiceAccount | quote }}
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gcloud-config
              mountPath: /.config/gcloud
      volumes:
        - name: tmp
          emptyDir: {}
        - name: gcloud-config
          emptyDir: {}
{{- end }}
