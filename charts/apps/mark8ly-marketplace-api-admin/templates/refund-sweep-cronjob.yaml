{{- if .Values.refundSweepCron.enabled }}
# Stuck-refund sweeper — every 5 minutes, re-drives refund_transactions
# rows stuck in 'pending' (the never-lost guarantee). A row goes stuck when
# the gateway refund call succeeded but the process crashed (or the DB
# blipped) before the finalize transaction committed. The sweeper re-calls
# the gateway with the SAME idempotency key (a provider no-op if the money
# already moved) and completes the DB finalize + bookkeeping.
#
# Unlike tracking-sync (a curl job that pokes an in-cluster HTTP endpoint),
# this runs the marketplace-api Go IMAGE directly with the bundled
# refund-sweep-cron entrypoint — mirroring how the migrate init container
# reuses the same image. It talks to Postgres directly, so it needs the
# same dbEnv block the server + migrate containers use.
#
# istio injection is DISABLED: a Job with an istio sidecar never terminates
# (the sidecar keeps the pod Running forever), and the DB connection to CNPG
# bypasses the mesh anyway (the server excludes outbound 5432). No sidecar
# keeps the Job short-lived and clean.
#
# concurrencyPolicy=Forbid: the sweep self-bounds to a 2-minute context
# deadline, well under the 5-minute schedule, so overlap should not happen;
# idempotency keys make overlap safe even if it did.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-refund-sweep
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-refund-sweep
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: cron
spec:
  schedule: {{ .Values.refundSweepCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      # Slightly above the binary's own 2-minute (120s) self-deadline so a
      # healthy run finishes on its own; a hung run is killed before the
      # next tick. concurrencyPolicy=Forbid is the primary guard.
      activeDeadlineSeconds: 150
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.name }}-refund-sweep
            app.kubernetes.io/part-of: mark8ly
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.name }}
          imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refund-sweep
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/refund-sweep-cron"]
              env:
{{ include "mark8ly-marketplace-api-admin.dbEnv" . | indent 16 }}
                # Carrier credential resolution (mark8ly#166). Until now this
                # CronJob had ONLY dbEnv, so the sweeper could not resolve the
                # gsm:// reference stored on payment_gateway_configs — it
                # handed the raw reference string to the gateway, which 401s,
                # and every gateway re-drive from the sweep failed silently.
                #
                # These mirror the deployment's values exactly. The binary
                # reads them through config.LoadCarrierSecretJob(), a NARROW
                # loader: it deliberately does NOT require
                # MARKETPLACE_FGA_API_URL, the internal-auth secret or the
                # customer-session secret, none of which a refund sweeper
                # uses — injecting them here would widen their blast radius
                # for nothing. It shares validateShippingSecretStore() with
                # the API so the two cannot drift on the part that matters.
                #
                # ENCRYPTION_* are genuinely needed: the store decodes legacy
                # inline (noop:/aes:) references with the same encryptor.
                - name: SHIPPING_SECRET_STORE
                  value: {{ .Values.carrierSecretStore | default "inline" | quote }}
                - name: GCP_PROJECT_ID
                  value: {{ .Values.gcpProjectId | quote }}
                - name: SECRET_NAME_PREFIX
                  value: {{ .Values.carrierSecretPrefix | default "mark8ly-dev" | quote }}
                - name: ENCRYPTION_MODE
                  value: {{ .Values.encryptionMode | quote }}
                - name: ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.encryptionKey.secretName }}
                      key: {{ .Values.encryptionKey.secretKey }}
                # OpenBao settings are consulted only when
                # SHIPPING_SECRET_STORE is "gcpsm" or "bao" (both construct a
                # ChainStore). Harmless while the mode is "inline".
                - name: OPENBAO_ADDR
                  value: {{ .Values.openBaoAddr | default "http://openbao-active.openbao.svc.cluster.local:8200" | quote }}
                - name: OPENBAO_ROLE
                  value: {{ .Values.openBaoRole | default "" | quote }}
                - name: OPENBAO_KV_MOUNT
                  value: {{ .Values.openBaoKvMount | default "kv" | quote }}
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
