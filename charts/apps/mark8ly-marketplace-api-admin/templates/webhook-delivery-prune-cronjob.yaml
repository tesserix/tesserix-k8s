{{- if .Values.webhookDeliveryPruneCron.enabled }}
# Outbound webhook delivery pruner (mark8ly#587) — daily, deletes
# webhook_deliveries rows past the 30-day retention window.
#
# webhook_deliveries carries the delivery bodies for merchant-configured
# OUTBOUND webhooks (mark8ly#562). Every attempt writes a row, retries
# included, so the table grows faster than order volume — on a shared
# db-f1-micro that is pure storage cost once a row is old enough that
# nobody will replay it. Without this CronJob the 30-day retention
# decision is unenforced and the table grows without bound.
#
# NOT internal/webhookprune. That is an unrelated IN-PROCESS job inside
# cmd/marketplace-api which prunes webhook_events — the raw INBOUND
# provider (Stripe) event log — on a different 30/90-day age split. Two
# jobs, near-identical names, different tables. The entrypoint below must
# be webhook-delivery-prune-cron.
#
# Runs the marketplace-api Go IMAGE directly with the bundled
# webhook-delivery-prune-cron entrypoint, exactly as refund-sweep does. It
# talks to Postgres directly, so it needs the same dbEnv block the server
# + migrate containers use.
#
# istio injection is DISABLED: a Job with an istio sidecar never terminates
# (the sidecar keeps the pod Running forever), and the DB connection to CNPG
# bypasses the mesh anyway. No sidecar keeps the Job short-lived and clean.
#
# Daily rather than every-5-minutes (contrast refundSweepCron): a missed
# run costs only dead rows that the next run picks up, not money that has
# not moved. Pruning is idempotent — a deleted row stays deleted — so
# overlap is harmless, but Forbid keeps it tidy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-webhook-delivery-prune
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-webhook-delivery-prune
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: cron
spec:
  schedule: {{ .Values.webhookDeliveryPruneCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      # Slightly above the binary's own 2-minute (120s) self-deadline so a
      # healthy run finishes on its own; a hung run is killed well before
      # the next daily tick.
      activeDeadlineSeconds: 150
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.name }}-webhook-delivery-prune
            app.kubernetes.io/part-of: mark8ly
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.name }}
          imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: webhook-delivery-prune
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/webhook-delivery-prune-cron"]
              env:
{{ include "mark8ly-marketplace-api-admin.dbEnv" . | indent 16 }}
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
