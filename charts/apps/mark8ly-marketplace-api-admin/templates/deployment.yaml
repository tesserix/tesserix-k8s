apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: backend
spec:
  # Replicas controlled by KEDA ScaledObject when enabled.
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Migrations run every pod startup. Server refuses to boot on schema
      # mismatch (AssertVersion check in cmd/marketplace-api), so a failed
      # migrate container blocks the rollout — by design.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.migrateTarget }}:{{ .Values.image.tag }}"
          command: ["/usr/local/bin/migrate", "up"]
          env:
{{ include "mark8ly-marketplace-api-admin.dbEnv" . | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: ENV
              value: "prod"
            - name: MODE
              value: {{ .Values.mode | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
{{ include "mark8ly-marketplace-api-admin.dbEnv" . | indent 12 }}
            # Service discovery
            - name: MARKETPLACE_FGA_API_URL
              value: {{ .Values.fgaApiUrl | quote }}
            - name: MARKETPLACE_PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            - name: AUTH_BFF_URL
              value: {{ .Values.authBffUrl | quote }}
            - name: GIP_PROJECT_ID
              value: {{ .Values.gipProjectId | quote }}
            - name: MARKETPLACE_GCS_BUCKET
              value: {{ .Values.gcsBucket | quote }}
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalAuthSecret.secretName }}
                  key: {{ .Values.internalAuthSecret.secretKey }}
                  optional: true
            - name: CUSTOMER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerSessionSecret.secretName }}
                  key: {{ .Values.customerSessionSecret.secretKey }}
                  optional: true
            # P0: Security
            - name: ENCRYPTION_MODE
              value: {{ .Values.encryptionMode | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.corsAllowedOrigins | quote }}
            # P1: Observability
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            {{- if .Values.sentryDsn }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sentryDsn.secretName }}
                  key: {{ .Values.sentryDsn.secretKey }}
                  optional: true
            {{- end }}
            # S3: Stripe Billing
            {{- if .Values.stripeBilling }}
            - name: STRIPE_BILLING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripeBilling.secretName }}
                  key: {{ .Values.stripeBilling.secretKeyKey }}
                  optional: true
            - name: STRIPE_BILLING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripeBilling.secretName }}
                  key: {{ .Values.stripeBilling.webhookSecretKey }}
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
