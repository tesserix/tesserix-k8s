apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: backend
spec:
  # Replicas controlled by KEDA ScaledObject when enabled.
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Migrations run every pod startup. Server refuses to boot on schema
      # mismatch (AssertVersion check in cmd/marketplace-api), so a failed
      # migrate container blocks the rollout — by design.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.migrateTarget }}:{{ .Values.image.tag }}"
          command: ["/usr/local/bin/migrate", "up"]
          env:
{{ include "mark8ly-marketplace-api-admin.dbEnv" . | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: ENV
              value: "prod"
            - name: MODE
              value: {{ .Values.mode | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
            # Kill switch for the order-refund payment-gateway wiring.
            # Default "false" keeps refunds dark; flip per-environment via
            # refundGatewayEnabled in values (UAT true, prod gated on UAT).
            - name: REFUND_GATEWAY_ENABLED
              value: {{ .Values.refundGatewayEnabled | default "false" | quote }}
            # Kill switch for auto reverse-pickup of DELIVERED shipments on a
            # full refund/cancel (creates a live carrier reverse pickup /
            # return label). Default "false"; flip per-environment via
            # reversePickupEnabled in values.
            - name: REVERSE_PICKUP_ENABLED
              value: {{ .Values.reversePickupEnabled | default "false" | quote }}
{{ include "mark8ly-marketplace-api-admin.dbEnv" . | indent 12 }}
            # Service discovery
            - name: MARKETPLACE_FGA_API_URL
              value: {{ .Values.fgaApiUrl | quote }}
            - name: MARKETPLACE_PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            # Outbound X-Internal-Auth header for platform-api /internal/*
            # calls. Must match platform-api's INTERNAL_AUTH_SECRET.
            - name: MARKETPLACE_PLATFORM_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformApiSecret.secretName }}
                  key: {{ .Values.platformApiSecret.secretKey }}
            - name: AUTH_BFF_URL
              value: {{ .Values.authBffUrl | quote }}
            - name: GIP_PROJECT_ID
              value: {{ .Values.gipProjectId | quote }}
            # Full Google API Keys v2 resource name. Pulled from the
            # mark8ly-gip K8s secret (synced from GCP Secret Manager)
            # instead of inlining the UUID-bearing string in chart
            # values — GitGuardian flags that as a high-entropy
            # secret. `optional: true` keeps local dev / UAT (no
            # secret entry) functional: when the key is empty, the
            # marketplace-api binary falls back to gipkey.Noop and
            # the custom-domain integration is a no-op rather than
            # an error.
            - name: GIP_WEB_API_KEY_RESOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: mark8ly-gip
                  key: GIP_WEB_API_KEY_RESOURCE_NAME
                  optional: true
            - name: MARKETPLACE_GCS_BUCKET
              value: {{ .Values.gcsBucket | quote }}
            {{- with .Values.gcpServiceAccount }}
            # Required on GKE Workload Identity: ADC has no private key,
            # so the V4-signed upload URL path uses IAM Credentials
            # SignBlob against this SA. The KSA is bound to the same SA
            # via iam.gke.io/gcp-service-account; the SA has
            # roles/iam.serviceAccountTokenCreator on itself.
            - name: MARKETPLACE_GCS_SIGNER_SA_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mediaPublicBaseURL }}
            - name: MARKETPLACE_MEDIA_PUBLIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mediaCacheControl }}
            - name: MARKETPLACE_MEDIA_CACHE_CONTROL
              value: {{ . | quote }}
            {{- end }}
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalAuthSecret.secretName }}
                  key: {{ .Values.internalAuthSecret.secretKey }}
            # Platform console admin surface HMAC key (mark8ly#275).
            # optional:true so the pod still starts before the
            # ExternalSecret is provisioned — the surface then answers
            # 503 not_configured rather than crashlooping.
            {{- with .Values.platformAdminSecret }}
            - name: MARKETPLACE_PLATFORM_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: true
            {{- end }}
            # Narrow secret gating ONLY /internal/audit-events. When the
            # ExternalSecret hasn't been provisioned (no GCP SM entry),
            # the secretKeyRef returns empty thanks to optional: true and
            # the audit ingest endpoint runs in permissive mode — safe.
            - name: AUDIT_INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auditIngest.secretName }}
                  key: AUDIT_INGEST_SECRET
                  optional: true
            - name: CUSTOMER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerSessionSecret.secretName }}
                  key: {{ .Values.customerSessionSecret.secretKey }}
                  optional: true
            # P0: Security
            - name: ENCRYPTION_MODE
              value: {{ .Values.encryptionMode | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryptionKey.secretName }}
                  key: {{ .Values.encryptionKey.secretKey }}
            # Per-tenant carrier credentials — GCP Secret Manager.
            # "gcpsm" writes/reads one secret per (tenant, domain,
            # provider, field). Legacy rows with noop:/aes: refs still
            # resolve via the HybridStore fallback and lazy-migrate on
            # first read.
            # OpenBao — required whenever SHIPPING_SECRET_STORE is not
            # "inline". marketplace-api validates this at STARTUP and panics
            # without it, deliberately: ChainStore routes bao:// references to
            # OpenBao by prefix in ANY mode, so a gcpsm deployment that has
            # ever had a row migrated still needs a working role to resolve it.
            # A rollback from bao to gcpsm that dropped the role would leave
            # those credentials unresolvable.
            #
            # The role name matches this app's ServiceAccount, which is what
            # the OpenBao Kubernetes auth role binds (see the openbao chart's
            # bootstrap.kubernetesRoles).
            - name: OPENBAO_ADDR
              value: {{ .Values.openBaoAddr | default "http://openbao-active.openbao.svc.cluster.local:8200" | quote }}
            - name: OPENBAO_ROLE
              value: {{ .Values.openBaoRole | default .Values.name | quote }}
            - name: OPENBAO_KV_MOUNT
              value: {{ .Values.openBaoKvMount | default "kv" | quote }}
            - name: SHIPPING_SECRET_STORE
              value: {{ .Values.carrierSecretStore | default "inline" | quote }}
            # GCP_PROJECT_ID is now ONLY the merchant-push Pub/Sub project
            # (see pushevents.NewPublisher). It has nothing to do with carrier
            # secrets since mark8ly#621 retired GCP Secret Manager. Do NOT
            # remove it: an empty value skips push publishing with only a log
            # line, so merchant notifications would stop silently while the
            # deployment stayed green.
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcpProjectId | quote }}
            # Merchant device push (mobile-admin). Setting the topic enables
            # publishing; the OIDC vars gate the /pubsub/merchant-push delivery
            # endpoint so only our push subscription can invoke it.
            - name: MARKETPLACE_PUSH_TOPIC
              value: {{ .Values.pushEventsTopic | default "" | quote }}
            - name: PUSH_OIDC_AUDIENCE
              value: {{ .Values.pushOidcAudience | default "" | quote }}
            - name: PUSH_OIDC_SERVICE_ACCOUNT
              value: {{ .Values.pushOidcServiceAccount | default "" | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.corsAllowedOrigins | quote }}
            # P1: Observability
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            {{- if and .Values.otel .Values.otel.exporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.sentryDsn }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sentryDsn.secretName }}
                  key: {{ .Values.sentryDsn.secretKey }}
                  optional: true
            {{- end }}
            # Console plan-catalog parallel run (mark8ly#304).
            # Every value optional: absent, no console read is attempted and
            # prices come from the compiled catalog exactly as before.
            {{- if .Values.consoleCatalog }}
            - name: CONSOLE_CATALOG_URL
              value: {{ .Values.consoleCatalog.url | quote }}
            - name: CONSOLE_CATALOG_TOKEN_URL
              value: {{ .Values.consoleCatalog.tokenUrl | quote }}
            - name: CONSOLE_CATALOG_SCOPE
              value: {{ .Values.consoleCatalog.scope | quote }}
            - name: CONSOLE_CATALOG_MODE
              value: {{ .Values.consoleCatalog.mode | quote }}
            - name: CONSOLE_CATALOG_INTERVAL
              value: {{ .Values.consoleCatalog.interval | quote }}
            - name: CONSOLE_CATALOG_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.consoleCatalog.secretName }}
                  key: {{ .Values.consoleCatalog.clientIdKey }}
                  optional: true
            - name: CONSOLE_CATALOG_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.consoleCatalog.secretName }}
                  key: {{ .Values.consoleCatalog.clientSecretKey }}
                  optional: true
            # Promo-code catalog (mark8ly#726). A SECOND endpoint on the same
            # console, read with the SAME machine identity: the console gates it
            # on the `read-promo-catalog` role, which rides in the token's roles
            # claim alongside `read-plan-catalog`. Verified 2026-09-06 — a token
            # minted from this client carries both roles and the endpoint
            # answers 200. So there is deliberately no second client id, secret,
            # token URL or scope here; only the path differs.
            #
            # Gated on the value rather than only on `consoleCatalog`, so an
            # installation with the plan catalog configured but not this one
            # leaves the promo ingest a no-op instead of pointing it at an
            # empty string.
            {{- if .Values.consoleCatalog.promoUrl }}
            - name: CONSOLE_PROMO_CATALOG_URL
              value: {{ .Values.consoleCatalog.promoUrl | quote }}
            {{- end }}
            {{- end }}
            # S3: Stripe Billing
            {{- if .Values.stripeBilling }}
            - name: STRIPE_BILLING_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripeBilling.secretName }}
                  key: {{ .Values.stripeBilling.secretKeyKey }}
                  optional: true
            - name: STRIPE_BILLING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stripeBilling.secretName }}
                  key: {{ .Values.stripeBilling.webhookSecretKey }}
                  optional: true
            {{- end }}
            # Marketing M4 — Campaign email dispatch.
            #
            # SENDGRID_API_KEY is deliberately NOT set. internal/email builds
            # its provider chain from whichever keys are non-empty, so wiring
            # a SendGrid key put SendGrid in the chain behind Resend — and
            # that account answers "401 Maximum credits exceeded". A dead
            # fallback is worse than none: a Resend outage would fail over
            # to it and lose the mail instead of failing loudly.
            {{- if .Values.sendgrid }}
            - name: EMAIL_FROM
              value: {{ .Values.sendgrid.emailFrom | quote }}
            {{- end }}
            # Resend — second email provider; chain order is configured
            # below via EMAIL_PRIMARY_PROVIDER.
            {{- if .Values.resend }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resend.secretName }}
                  key: {{ .Values.resend.apiKeyKey }}
                  optional: true
            {{- if .Values.resend.webhookSecretKey }}
            # Inbound delivery-event verification (mark8ly#348B). optional:true
            # so a cluster without the secret still starts — marketplace-api
            # mounts the endpoint regardless and answers 503 not_configured,
            # which is diagnosable, rather than crash-looping on a missing env.
            - name: RESEND_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resend.secretName }}
                  key: {{ .Values.resend.webhookSecretKey }}
                  optional: true
            {{- end }}
            {{- end }}
            # Orders the provider chain: the named provider sends first,
            # every other configured provider is its per-message fallback.
            # Flip to "sendgrid" to restore SendGrid-primary — config only.
            {{- if .Values.email }}
            - name: EMAIL_PRIMARY_PROVIDER
              value: {{ .Values.email.primaryProvider | quote }}
            {{- end }}
            # Otto support-chat bridge — merchant->platform support (#119).
            # Same shared otto + INTERNAL_AUTH_SECRET the Next.js apps use;
            # optional so the platform-support routes degrade to 503 when
            # otto isn't wired.
            - name: OTTO_URL
              value: "http://{{ .Values.otto.serviceName }}.{{ .Values.otto.serviceNamespace }}.svc.cluster.local:{{ .Values.otto.servicePort }}"
            - name: OTTO_INTERNAL_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otto.secretName }}
                  key: {{ .Values.otto.secretKey }}
                  optional: true
            - name: OTTO_WS_PUBLIC_BASE
              value: {{ .Values.otto.wsPublicBase | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
