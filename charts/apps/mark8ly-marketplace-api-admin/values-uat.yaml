# UAT overlay for mark8ly-marketplace-api-admin.
namespace: mark8ly-uat
name: mark8ly-uat-marketplace-api-admin

keda:
  minReplicaCount: 1
  maxReplicaCount: 1   # admin engine pinned to 1 replica (per-user rate limiter, see prod values)
pdb:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 96Mi

database:
  host: mark8ly-uat-postgres-rw.mark8ly-uat.svc.cluster.local
  port: 5432
  name: mark8ly_marketplace_api
  secretName: mark8ly-uat-postgres-marketplace-api
  sslmode: require

# In-cluster service discovery — UAT siblings only.
fgaApiUrl: "http://mark8ly-uat-openfga.mark8ly-uat.svc.cluster.local:8080"
platformApiUrl: "http://mark8ly-uat-platform-api.mark8ly-uat.svc.cluster.local:8086"

# Cross-service secret references (matches paths in values.yaml).
marketplaceInternalAuthSecret:
  secretName: mark8ly-uat-marketplace-api-internal-auth
platformInternalAuthSecret:
  secretName: mark8ly-uat-platform-api-internal-auth
sessionSecret:
  secretName: mark8ly-uat-session
encryptionKey:
  secretName: mark8ly-uat-marketplace-api-encryption
sentry:
  secretName: mark8ly-uat-sentry
stripeBilling:
  secretName: mark8ly-uat-stripe-billing
sendgrid:
  secretName: mark8ly-uat-sendgrid

# (correct key names — values.yaml uses these exact paths)
internalAuthSecret:
  secretName: mark8ly-uat-marketplace-api-internal-auth
platformApiSecret:
  secretName: mark8ly-uat-platform-api-internal-auth
customerSessionSecret:
  secretName: mark8ly-uat-session
sentryDsn:
  secretName: mark8ly-uat-sentry
auditIngest:
  secretName: mark8ly-uat-audit-ingest

# UAT-only GCS bucket — separates UAT-uploaded media from prod's
# tesseracthub-480811-mark8ly-media so test data can't pollute the
# prod CDN cache or rack up cost there. Bucket created 2026-05-07
# with objectAdmin granted to the shared marketplace SA.
gcsBucket: "tesseracthub-480811-mark8ly-media-uat"

# UAT doesn't have its own CDN domain set up yet — use the bucket's
# public-virtual-host URL directly. cdn.mark8ly.com is prod-only;
# pointing UAT writes there would cache-poison prod CDN edges.
mediaPublicBaseURL: "https://storage.googleapis.com/tesseracthub-480811-mark8ly-media-uat"
