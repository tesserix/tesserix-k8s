namespace: mark8ly
name: mark8ly-marketplace-api-admin
# Kill switch for the order-refund payment-gateway wiring. "false" keeps
# refunds dark (admin/return/paid-cancel refunds return 503 refunds_disabled).
# Prod stays "false" until UAT validates a refund per gateway; UAT overlay
# flips it to "true". Quoted string — consumed as a bool env by the binary.
refundGatewayEnabled: "true"
# Auto reverse-pickup of delivered shipments on full refund/cancel. Creates a
# live carrier reverse pickup / return label. Delhivery/ShipEngine payloads are
# doc-derived — watch the first real delivered-order refund on the carrier
# dashboard; roll back by setting this to "false".
reversePickupEnabled: "true"
# marketplace-api-admin and marketplace-api-storefront deploy from the SAME
# image (mark8ly-marketplace-api) — one Go binary, two Deployment
# instances differentiated by the MODE env var. See spec §14.8.
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io to avoid
  # Cloud NAT data-processing charges on every image pull. See
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-marketplace-api
  tag: "sha-493c3652c68d"
  pullPolicy: IfNotPresent
  # Same image, different entrypoint via Dockerfile target. The migrate
  # init container uses the `migrate` target; the main container uses
  # the `runtime` target.
  migrateTarget: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-marketplace-api
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
# Slice 1: in-memory rate limiter pinned to a single replica to avoid
# the per-replica bucket multiplication problem (spec §14.8 + §14.16).
# TODO(slice-2): unpin once Redis-backed rate limiter ships. Tracking
# issue: <SLICE2_TICKET_TBD>.
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 1
  # Min=max=1, so the trigger never scales anything — it exists only to
  # give the ScaledObject a valid spec.
  #
  # It must still be a trigger that RESOLVES. The previous prometheus
  # trigger pointed at a Prometheus that is not running (the
  # prometheus-server Service has no endpoints), leaving this object in
  # TriggerError and the KEDA metrics apiserver logging a failure every
  # 15s. Memory always resolves and costs nothing here.
  prometheus:
    enabled: false
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
# Postgres connection (CNPG cluster, marketplace_api role)
#
# Note on naming: prod uses `mark8ly_marketplace_api` as the database name
# (matching the platform-api convention of `mark8ly_<service>`). Local dev
# uses `marketplace_db` via docker-compose. This local/prod divergence
# mirrors platform-api's `platform_api` → `mark8ly_platform_api` pattern
# and is documented in services/marketplace-api/README.md.
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_marketplace_api
  secretName: mark8ly-postgres-marketplace-api
  sslmode: require
# MODE selects which Gin engine the binary constructs. See
# services/marketplace-api/internal/mode and spec §14.8.
mode: admin
# ── Service discovery ─────────────────────────────────────────────
# Internal URLs for service-to-service calls.
fgaApiUrl: "http://mark8ly-openfga.mark8ly.svc.cluster.local:8080"
platformApiUrl: "http://mark8ly-platform-api.mark8ly.svc.cluster.local:8086"
authBffUrl: "http://mark8ly-auth-bff.mark8ly.svc.cluster.local:8087"
# ── Secrets (from ExternalSecret) ─────────────────────────────────
# Inbound — platform-api / auth-bff / otto authenticate against this
# value when calling marketplace-api's /internal/* surface.
internalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Outbound — X-Internal-Auth header sent on calls to platform-api's
# /internal/* endpoints (SlugCache slug → store_id + tenant_id, plus
# any other platform-api internal calls the admin engine makes). Must
# match platform-api's INTERNAL_AUTH_SECRET. Required since
# mark8ly@889e595 gated platform-api /internal/* on the header.
platformApiSecret:
  secretName: mark8ly-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Platform console admin surface (mark8ly#275). Shared HMAC key the
# Tesserix console signs /api/v1/platform/admin/* requests with. Empty
# does NOT mean permissive here — the surface fails closed with
# 503 not_configured until this is populated.
platformAdminSecret:
  secretName: mark8ly-marketplace-api-platform-admin
  secretKey: PLATFORM_ADMIN_SECRET
customerSessionSecret:
  secretName: mark8ly-session
  secretKey: SESSION_ENCRYPT_KEY
encryptionKey:
  secretName: mark8ly-marketplace-api-encryption
  secretKey: ENCRYPTION_KEY
# ── Mobile platform-support bridge (#119) ─────────────────────────
# Shared otto in support-platform (same target + secret as the Next.js
# apps). INTERNAL_AUTH_SECRET is synced into the mark8ly-otto K8s secret.
otto:
  serviceName: support-platform-otto
  serviceNamespace: support-platform
  servicePort: 8089
  secretName: mark8ly-otto
  secretKey: INTERNAL_AUTH_SECRET
  wsPublicBase: "wss://api.mark8ly.com"
gipProjectId: "tesseracthub-480811"
# GIP_WEB_API_KEY_RESOURCE_NAME (the full Google API Keys v2 resource
# name of the browser API key) is now sourced from the mark8ly-gip
# ExternalSecret — see external-secrets/prod/mark8ly/externalsecret.yaml
# and templates/deployment.yaml. The chart no longer carries the value.
# The marketplace SA still needs roles/serviceusage.apiKeysAdmin on
# tesseracthub-480811 for the gipkey integration to actually patch
# the key.
gcsBucket: "tesseracthub-480811-mark8ly-media"
# GCP service account used (a) as the Workload Identity target and (b)
# as the signer for V4-signed GCS upload URLs (IAM SignBlob path).
gcpServiceAccount: "app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com"
# Public base URL prepended to product_media.url. Served by the
# Cloudflare Worker `mark8ly-media-cdn` (route cdn.mark8ly.com/*) which
# fetches from the GCS bucket and edge-caches with cf:cacheEverything.
mediaPublicBaseURL: "https://cdn.mark8ly.com"
# Cache-Control stamped on uploaded media objects after finalize. Keys
# are content-addressed so cache-forever-immutable is safe.
mediaCacheControl: "public, max-age=31536000, immutable"
# ── P0: Security & encryption ────────────────────────────────────
encryptionMode: "aes"
# Carrier credentials (Delhivery, Razorpay, TaxJar, etc.).
#
# "bao" (mark8ly#319 phase 2): NEW WRITES go to OpenBao at
# kv/data/mark8ly/marketplace-api/tenants/<tenant>/<domain>/<provider>/<field>
# and persist a bao:// reference. Existing gsm:// rows keep resolving through
# GCP Secret Manager — ChainStore routes on the reference PREFIX, not on this
# mode, so old and new coexist and nothing needs migrating up front.
#
# Only this ADMIN deployment writes credentials. The storefront is left on
# "gcpsm" deliberately: its OpenBao role is read-only by design, it still
# resolves bao:// references by prefix, and leaving it here halves the blast
# radius of this flip.
#
# ROLLBACK: set this back to "gcpsm" and LEAVE OPENBAO_ROLE/OPENBAO_ADDR SET.
# Any row already migrated still carries a bao:// reference and still routes
# to OpenBao; dropping the role would make those credentials unresolvable.
# On the next save, MaybeRewrap migrates such a row back to gsm://.
carrierSecretStore: "bao"
gcpProjectId: "tesseracthub-480811"
# Merchant device push (mobile-admin). Empty topic = publishing off.
# The OIDC values must match the Pub/Sub push subscription's
# --push-auth-token-audience and --push-auth-service-account.
pushEventsTopic: "mp-merchant-push"
pushOidcAudience: "https://api.mark8ly.com/pubsub/merchant-push"
pushOidcServiceAccount: "mp-pubsub-push@tesseracthub-480811.iam.gserviceaccount.com"
corsAllowedOrigins: "https://*.mark8ly.com"
# ── P1: Observability ────────────────────────────────────────────
metricsPort: 9090
sentryDsn:
  secretName: mark8ly-sentry
  secretKey: SENTRY_DSN
# OpenTelemetry — traces + metrics exported over OTLP gRPC to the
# in-cluster collector. The binary no-ops OTel when this is empty, so
# clearing it disables tracing without a code change.
otel:
  exporterOtlpEndpoint: "http://otel-gateway.observability.svc.cluster.local:4317"
# ── S3: Stripe Billing ──────────────────────────────────────────
stripeBilling:
  secretName: mark8ly-stripe-billing
  secretKeyKey: STRIPE_BILLING_SECRET_KEY
  webhookSecretKey: STRIPE_BILLING_WEBHOOK_SECRET
# ── Console plan-catalog parallel run (mark8ly#304 / #392) ──────
# Reads the console's published plan catalog and compares it against the
# catalog compiled into marketplace-api, logging differences. It DECIDES
# NOTHING — prices still come from the compiled Go catalog. The cutover is a
# separate change, gated on this reporting durably zero.
#
# Runs on its own ticker, never on a request path: BACKLOG §P requires that
# nothing on a customer payment path depend on the console being reachable.
# Remove this block and the parallel run simply does not start.
#
# The scope carries BOTH the project-audience scope (which puts the project
# in the token's aud, proving it was minted for this route) and the roles
# scope (without which the token verifies but holds no capability).
consoleCatalog:
  url: https://console.tesserix.app/api/v1/plan-catalog
  tokenUrl: https://auth.tesserix.app/oauth/v2/token
  scope: "openid urn:zitadel:iam:org:project:id:386377618200461939:aud urn:zitadel:iam:org:projects:roles"
  mode: test
  interval: 15m
  secretName: mark8ly-console-catalog
  clientIdKey: CONSOLE_CATALOG_CLIENT_ID
  clientSecretKey: CONSOLE_CATALOG_CLIENT_SECRET
# ── Marketing M4: Campaign email dispatch ───────────────────────
# SendGrid API key shared with platform-api. Email from noreply@tesserix.app.
sendgrid:
  secretName: mark8ly-sendgrid
  apiKeyKey: SENDGRID_API_KEY
  emailFrom: noreply@tesserix.app
# Resend — second email provider. Backed by the platform-wide
# prod-resend-api-key GCP secret via mark8ly-resend.
resend:
  secretName: mark8ly-resend
  apiKeyKey: RESEND_API_KEY
  # Verifies INBOUND delivery-event webhooks (mark8ly#348B). A different
  # credential from apiKeyKey and not interchangeable: the API key
  # authenticates us calling Resend, this verifies Resend calling us.
  #
  # Syncing it into the secret is NOT enough on its own — the deployment has
  # to reference the key too, or the pod never sees it and the endpoint
  # answers 503 not_configured forever.
  webhookSecretKey: RESEND_WEBHOOK_SECRET
# Email provider chain order. The named provider sends first; every other
# configured provider is its per-message fallback. Valid: resend | sendgrid
# (or a comma-separated preference list). Flip to sendgrid to restore
# SendGrid-primary — no code change needed.
email:
  primaryProvider: resend
# ── Tracking sync CronJob ───────────────────────────────────────
# Hits /api/v1/internal/shipments/tracking/sync on the admin engine
# every 2 minutes. Advances every open shipment's status from the
# carrier's tracking API — the production answer for real-time
# customer-facing delivery timelines when a Delhivery webhook isn't
# configured. Disable by flipping enabled=false; the background
# webhook path will still work for merchants that configure it.
trackingSyncCron:
  enabled: true
  schedule: "*/2 * * * *"
  # Staleness alerting replaces the old "any non-2xx fails the Job, which
  # makes the whole Application Degraded" design — see the CronJob's exit
  # policy and mark8ly#651.
  prometheusRule:
    enabled: true
    # 15 minutes = 7 consecutive missed ticks.
    staleAfterSeconds: 900

# Stuck-refund sweeper — runs the marketplace-api image with the
# refund-sweep-cron entrypoint (bundled at /usr/local/bin/refund-sweep-cron)
# every 5 minutes to re-drive refund_transactions rows stuck in 'pending'
# (the never-lost guarantee). Gated by enabled so it only runs on images
# that carry the binary. Prod stays disabled until the prod image tag is
# bumped to a build that includes the binary; UAT overlay enables it.
# The sweeper always runs with enabled=true internally — it is the recovery
# path for the refundGatewayEnabled kill switch, independent of that flag.
refundSweepCron:
  enabled: true
  schedule: "*/5 * * * *"

# Expired stock-hold sweeper (mark8ly#229/#231). Housekeeping only:
# availability is computed from LIVE holds, so an expired row already
# reduces it by nothing and a missed run costs only dead rows. Hourly is
# ample — contrast refundSweepCron above, which is every 5 minutes because
# a stuck refund is money that has not moved.
stockHoldSweepCron:
  enabled: true
  schedule: "17 * * * *"
  # Bounded per run, deleted FOR UPDATE SKIP LOCKED, so a backlog drains
  # over several runs rather than in one long-held lock.
  batch: 500

# Outbound webhook delivery pruner (mark8ly#587). Enforces the 30-day
# webhook_deliveries retention window; the window itself lives in Go
# (webhook.RetentionWindow), not here — this only decides how often the
# binary runs. Daily off-peak: a missed run costs dead rows, not money.
webhookDeliveryPruneCron:
  enabled: true
  schedule: "41 3 * * *"

# Product Admin Integration Contract conformance (mark8ly#290). Runs the
# published suite against this service's own platform admin surface and fails
# the Job on any declared endpoint that deviates.
adminConformanceCron:
  enabled: true
  # 06:20 UTC daily, offset off the hour so it does not queue behind
  # everything else in the estate that runs at :00.
  schedule: "20 6 * * *"
  # Node only — the suite is fetched from npm at run time.
  image: "node:22-alpine"
  # `>=0.5.0 <1.0.0`, NOT `^0.5.0`.
  #
  # This was `^0.4.0`, and that was wrong in the exact way the comment claimed
  # to avoid. For a 0.x package npm's caret allows PATCHES ONLY — `^0.4.0`
  # matches 0.4.9 and excludes 0.5.0 — while every contract amendment this
  # suite has shipped was a minor bump (0.2 -> 0.3 -> 0.4 -> 0.5). So the range
  # did precisely what a pin does: quietly stop enforcing anything added after
  # it, which on a conformance job means going green while checking an older
  # contract.
  #
  # The explicit range takes minors and stops at 1.0.0, where a breaking change
  # would land and deserves a deliberate read rather than an overnight surprise.
  #
  # 0.5.0 was not optional when this floor was written: it added the check that
  # fails an endpoint a product SERVES but does not declare — the one that
  # closes the drift between this chart's declaration and the product's own
  # admin-conformance.json.
  #
  # The floor is now 0.8.1, because the declaration below moved to contract v3:
  #
  #   - 0.8.0 (design-system#40) added the eight v3 endpoint ids this chart
  #     declares — outbox, email-sends, notifications, break-glass,
  #     conversions, onboarding/funnel, onboarding/sessions, tenant-purge.
  #     parseEndpoints THROWS on an id it does not recognise, and a throw at
  #     declaration-parse time fails the ENTIRE run, not the one entry. So a
  #     resolved 0.5.x here would take every endpoint down, not just the new
  #     ones.
  #   - 0.8.1 (design-system#43) corrected onboarding/funnel's envelope to
  #     `free`. 0.8.0 had inferred `data-flat-map` and reported two FALSE §4.1
  #     failures against a mark8ly handler that was correct and unchanged.
  #     Resolving to 0.8.0 would fail this job nightly on a contract defect.
  #
  # npm resolves the newest match, so today this range and the old one both
  # land on 0.8.1 — the floor matters when something pins or caches an older
  # resolution, which is exactly when nobody is watching.
  version: ">=0.8.1 <1.0.0"
  # MUST stay in step with mark8ly's own admin-conformance.json — see the
  # ConfigMap template for why nothing enforces that and what the risk is.
  declaration:
    slug: mark8ly
    contractVersion: 3
    endpoints:
      audit-logs: true
      health: true
      # §3.2, mark8ly#415.
      #
      # slaKinds, not slaDeclared, and the two are mutually exclusive —
      # declaring both is a parse error. mark8ly's queue merges five kinds
      # and only sea_manual_review is time-bound (a 5-business-day SLA that
      # pauses the subscription validation clock). slaDeclared is a
      # per-QUEUE promise requiring due_at on EVERY item, so `true` would
      # force mark8ly to fabricate a deadline erasure_request deliberately
      # refuses to model, and `false` understated a real commitment.
      # design-system#36 added slaKinds for exactly this case. It needs
      # suite >=0.7.0 — NOT 0.6.0: the feature commit left the package at
      # 0.6.0 in source and the release carrying it is the next version
      # bump, published as 0.7.0. Confirmed against the published tarballs
      # (0.6.0 has no occurrence of slaKinds; 0.7.0 has it throughout).
      # This matters because declaration.ts throws on an unrecognised
      # option, and a throw at parse time fails the ENTIRE run, not just
      # inbox. The version range above resolves to the newest release, so
      # it satisfies this today — but do not pin below 0.7.0.
      #
      # ORDERING: this block is only safe once mark8ly is DEPLOYED serving
      # the contract's { items, total } envelope on /admin/inbox. It served
      # the house { data, pagination } shape until mark8ly#415; declaring
      # ahead of that deploy fails the run on the envelope instead.
      inbox:
        slaKinds:
          - sea_manual_review
      kpis: true
      entities:
        types:
          - tenants
          # Added with mark8ly #278. MUST land no later than the mark8ly
          # deploy that starts serving /admin/entities/users: suite >=0.5.0
          # fails an endpoint a product SERVES but does not declare.
          - users
      "billing/subscriptions": true
      "billing/trials": true
      "tenant-lifecycle": true
      "lifecycle/reason-codes": true
      # contract v3 (design-system#40, 2026-08-29). break-glass CAN be
      # declared, unlike the earlier assumption recorded here: it is gated
      # on EXACT STRING EQUALITY against a capability value
      # (rotate-credentials) plus a non-empty operator — there is no grant
      # list and no identity that must "hold" anything
      # (marketplace-api/internal/handlers/platformadmin/middleware.go:
      # 367-385). The admin-conformance-cronjob.yaml template's npx
      # invocation now passes --operator and --capability rotate-credentials
      # on every run so this probe gets a real 200 instead of a
      # correctly-issued 403 read as a conformance failure.
      "outbox": true
      "email-sends": true
      "notifications": true
      "break-glass": true
      "conversions": true
      "onboarding/funnel": true
      "onboarding/sessions": true
      "tenant-purge": true

# Audit-ingest secret consumed by the marketplace-api admin engine.
# Override in values-uat.yaml to point at mark8ly-uat-audit-ingest.
auditIngest:
  secretName: mark8ly-audit-ingest

# Replace before surging, so a rollout frees a pod's memory before it
# needs the replacement's (#709).
#
# The default is 25%/25%, which on a single-replica Deployment rounds to
# maxSurge=1, maxUnavailable=0: the new pod must SCHEDULE BEFORE the old
# one dies, so a roll needs double the pod's memory at once. On a cluster
# whose memory requests sit near 100% (while actual usage is around half
# that) the new pod pends forever and the rollout deadlocks — with the
# Deployment still reporting Available=True, because the old pod keeps
# serving. On 2026-08-30 that left seven mark8ly deployments stuck and
# production a day behind main, with nothing alerting.
#
# The cost is honest and accepted: on a single-replica service this is a
# brief 503 during each rollout, where surge-first gave none. Deploys that
# always complete are worth more than a few seconds of downtime on an
# operator-timed rollout. Same remedy as temporal (#538) and devai (#600).
#
# At 2+ replicas there is no downtime at all: one pod stays up while the
# other is replaced.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
