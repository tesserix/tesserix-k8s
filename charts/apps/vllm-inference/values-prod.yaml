# Production overrides for vLLM inference server
# Model: DeepSeek-R1 8B (distilled) — best reasoning model for stock analysis

vllm:
  model: deepseek-ai/DeepSeek-R1-Distill-Llama-8B

# Production resource allocation for T4 GPU node
resources:
  limits:
    nvidia.com/gpu: 1
    memory: 28Gi
    cpu: 6
  requests:
    nvidia.com/gpu: 1
    memory: 28Gi
    cpu: 6

# GCP production configuration
gcp:
  projectId: tesseracthub-480811
  secretManager:
    enabled: true
    secretPrefix: "prod"
    secretStore: gcp-secret-store
  workloadIdentity:
    gcpServiceAccount: app-secrets-ai-inference-prod@tesseracthub-480811.iam.gserviceaccount.com
