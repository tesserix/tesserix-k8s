{{- if .Values.istioAuth.enabled }}
---
# Allow ingress only from specified namespaces
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "vllm-inference.fullname" . }}-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "vllm-inference.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    # Allow from explicitly configured namespaces
    {{- range .Values.istioAuth.allowedNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ . }}
    {{- end }}
    # Allow from istio-system (control plane)
    - from:
        - source:
            namespaces:
              - istio-system
    # Allow internal namespace traffic
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}
---
# Allow monitoring to scrape /metrics
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "vllm-inference.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "vllm-inference.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - monitoring
      to:
        - operation:
            paths:
              - "/metrics"
{{- end }}
