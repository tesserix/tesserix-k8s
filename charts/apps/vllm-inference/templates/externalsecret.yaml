{{- if .Values.gcp.secretManager.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.vllm.apiKey.secretName }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.gcp.secretManager.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.vllm.apiKey.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.vllm.apiKey.key }}
      remoteRef:
        key: {{ printf "%s-stockpilot-ai-api-key" .Values.gcp.secretManager.secretPrefix }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.huggingface.tokenSecretName }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.gcp.secretManager.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.huggingface.tokenSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.huggingface.tokenKey }}
      remoteRef:
        key: {{ printf "%s-stockpilot-hf-token" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
