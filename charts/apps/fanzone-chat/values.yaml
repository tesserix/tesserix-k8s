# =============================================================================
# FanZone Chat - Go Chat Service (Message History API)
# Serves chat message history from MongoDB with cursor-based pagination
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-chat
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8085

ingress:
  enabled: false

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 15

# Environment configuration
env:
  SERVER_PORT: "8085"
  MONGO_URL: "mongodb://mongodb-fanzone.mongodb-fanzone.svc.cluster.local:27017"

# GCP configuration
gcp:
  projectId: ""
  secretManager:
    secretPrefix: "devtest"

# KEDA ScaledObject
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minreplicaCount: 1
  maxReplicaCount: 12
  triggers:
    # Memory-only: this platform sets no cpu requests, and KEDA's webhook
    # rejects a cpu trigger when the target container has none.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
