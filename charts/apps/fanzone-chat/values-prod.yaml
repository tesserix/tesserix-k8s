# Production overrides for fanzone-chat
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

knative:
  enabled: true
  minScale: 0
  maxScale: 10
  scaleDownDelay: "60s"

# Workload Identity annotation for GCP SA binding
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# Disable KEDA — Knative handles autoscaling
keda:
  enabled: false
