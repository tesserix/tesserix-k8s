# Default values for yes-hospital
replicaCount: 2

image:
  # Pulled directly from ghcr.io with the namespace ghcr-secret. The image
  # lives in the Tesseract-Nexus org (private) which the shared GAR ghcr.io
  # mirror token (tesserix-scoped) can't read, so we pull direct rather than
  # via asia-south1-docker.pkg.dev/.../ghcr-remote like the tesserix-org apps.
  repository: ghcr.io/tesseract-nexus/yes-hospital
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Kong ingress DISABLED 2026-07-26. Kong is decommissioned: there are zero
# Kong pods and no IngressClass resources in the cluster, so nothing ever
# populated status.loadBalancer and ArgoCD reported the app Progressing
# forever. Routing is Istio VirtualService + the shared gateway, the same
# way observability.tesserix.app works.
ingress:
  enabled: false
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: yes-hospital.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: yes-hospital-tls
      hosts:
        - yes-hospital.tesserix.app

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  # Disabled: a static marketing site runs a fixed 2 replicas. (HPA also
  # can't bootstrap a Deployment up from 0 replicas, which previously left
  # this stuck at 0.) replicaCount above is authoritative.
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 75

# KEDA ScaledObject configuration
keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

# ConfigMap for additional configuration
configMap:
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  enabled: false
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true
