{{- if .Values.authorizationPolicy.enabled }}
# This namespace is enrolled in the default-ambient Istio mesh, which has a
# mesh-wide `deny-all-default` (istio-system). Without an explicit allow the
# ingress gateway is rejected with "RBAC: access denied". This mirrors the
# allow-ingress-to-<ns> policies the other product namespaces (global,
# fanzone, homechef, ...) get from the istio-config chart.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yes-hospital.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress
{{- end }}
