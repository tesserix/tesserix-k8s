knative:
  enabled: true
  minScale: 1

# Production overrides for tenant-router-service

image:
  repository: ghcr.io/tesserix/tenant-router-service
  tag: "1.3.3"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Production resource allocation - lightweight routing service
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"
  BASE_DOMAIN: "mark8ly.com"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"tenant-router-service\"}[2m]))"
    requestRateThreshold: "30"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  enabled: true
  minScale: 1
