knative:
  enabled: true
  minScale: 1
  scaleToZeroDelay: "120s"
  stableWindow: "300s"

# Production overrides for tenant-router-service

image:
  repository: ghcr.io/tesserix/tenant-router-service
  tag: "1.3.3"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Production resource allocation - lightweight routing service
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Database - use global PostgreSQL
database:
  host: "postgresql.postgresql-global.svc.cluster.local"
  name: "tenant_router_db"

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"
  BASE_DOMAIN: "mark8ly.com"
  SERVICE_AUTH_MODE: "mesh"
  CLOUDFLARE_ACCOUNT_ID: "6fe6e1aa18c221b529ce76c9631ba4e0"
  CLOUDFLARE_KV_NAMESPACE_ID: "1e14da3d238548fd8fa50982395d538d"
  CLOUDFLARE_ZONE_ID: "396425160cf0c851c83dd9f8699c502c"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"tenant-router-service\"}[2m]))"
    requestRateThreshold: "30"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
