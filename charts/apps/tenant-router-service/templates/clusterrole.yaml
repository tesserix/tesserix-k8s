{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tenant-router-service.fullname" . }}
  labels:
    {{- include "tenant-router-service.labels" . | nindent 4 }}
rules:
  # VirtualService management (create/delete for tenant-specific VS)
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Gateway management (create/delete dedicated gateways for custom domains)
  - apiGroups: ["networking.istio.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # AuthorizationPolicy management (create/delete dedicated policies for custom domains)
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Certificate management (cert-manager) — patch needed for server-side apply
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Secret access for certificate status
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Service access for reading LoadBalancer IPs (e.g., custom domain gateway)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
{{- end }}
