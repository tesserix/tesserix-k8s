{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-router-service.fullname" . }}-config
  labels:
    {{- include "tenant-router-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | default "5432" | quote }}
  DB_NAME: {{ .Values.database.name | default "tenant_router_db" | quote }}
  DB_USER: {{ .Values.database.user | default "postgres" | quote }}
  DB_SSLMODE: {{ .Values.database.sslmode | default "require" | quote }}
  DB_SSL_MODE: {{ .Values.database.sslmode | default "require" | quote }}
  PORT: "8089"
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
