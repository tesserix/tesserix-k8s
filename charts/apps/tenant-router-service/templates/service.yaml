{{- if not .Values.knative.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenant-router-service.fullname" . }}
  labels:
    {{- include "tenant-router-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8080
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "tenant-router-service.selectorLabels" . | nindent 4 }}
{{- end }}
