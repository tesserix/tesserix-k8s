# Default values for tenant-router-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly/tenant-router-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# RBAC for managing Istio and cert-manager resources
rbac:
  create: true

podAnnotations:
  # Disable Istio sidecar injection for tenant-router-service
  # This service needs direct access to K8s API for cert-manager and Istio CRD operations
  # Istio proxy interferes with K8s API calls causing TLS handshake timeouts
  sidecar.istio.io/inject: "false"
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8089
  targetPort: 8089

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  SERVER_PORT: "8089"
  GIN_MODE: "release"

  # Database config is in database: section below

  # Redis (for caching platform settings like gateway IP)
  REDIS_HOST: "redis.redis-marketplace.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # NATS (for tenant events)
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # Kubernetes configuration
  K8S_NAMESPACE: "marketplace"
  ISTIO_NAMESPACE: "istio-ingress"
  GATEWAY_NAME: "tesseract-gateway"
  ADMIN_VS_NAME: "admin-vs"
  STOREFRONT_VS_NAME: "storefront-vs"
  API_VS_NAME: "api-vs"

  # Custom domain gateway configuration
  CUSTOM_DOMAIN_GATEWAY: "custom-ingressgateway"
  CUSTOM_DOMAIN_GATEWAY_NS: "istio-ingress"
  CUSTOM_DOMAIN_CLUSTER_ISSUER: "letsencrypt-custom-domain"

  # Shared AuthorizationPolicy for custom domain RBAC
  # When custom domains are provisioned, their hosts are added to this policy
  SHARED_AUTH_POLICY_NAME: "allow-frontend-apps-public-custom"
  SHARED_AUTH_POLICY_NAMESPACE: "istio-ingress"
  SHARED_AUTH_POLICY_SELECTOR: "custom-ingressgateway"

  # cert-manager configuration
  CLUSTER_ISSUER: "letsencrypt-prod"

  # Domain configuration
  BASE_DOMAIN: "tesserix.app"

  # Logging
  LOG_LEVEL: "info"

# Keycloak integration for redirect URI management
# When tenants are created/deleted, their hosts are added/removed from Keycloak OIDC clients
keycloak:
  enabled: true
  adminUrl: "http://keycloak.identity-customer.svc.cluster.local:8080"
  realm: "tesserix-customer"
  clientId: "admin-cli"
  clientIDs: "storefront-web,marketplace-dashboard"
  existingSecret: "keycloak-admin-credentials"
  existingSecretKey: "clientSecret"

# Redis secret configuration
redis:
  existingSecret: "redis"
  existingSecretKey: "redis-password"

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration (used by deployment template)
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "tesseract_hub"
  user: "postgres"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
