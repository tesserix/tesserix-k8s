apiVersion: v2
name: mcp-gateway
description: |
  Per-tenant MCP server backed by the shared mcp-gateway image. Same
  per-product hostname the slm-router config references
  (e.g. fanzone-mcp.fanzone.svc.cluster.local:8765/mcp); the
  MCP_TENANT env var selects which tool group is exposed.

  Replaces the nginx-served mcp-stub chart. Same chart instance gets
  deployed per product, only the `tenant` + `namespace` values differ.
type: application
version: 0.1.5
appVersion: "0.1.0"
