apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "mcp-gateway.name" . }}-deny-untrusted
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/agentgateway-system/sa/agentgateway-mcp
              - cluster.local/ns/support-platform/sa/support-platform-slm-router
      to:
        - operation:
            ports: ["8765"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "mcp-gateway.name" . }}-allow-callers
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/agentgateway-system/sa/agentgateway-mcp
              - cluster.local/ns/support-platform/sa/support-platform-slm-router
      to:
        - operation:
            ports: ["8765"]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "mcp-gateway.name" . }}-strict-mtls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
