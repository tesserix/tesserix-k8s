apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: support-platform
        mcp.tesserix.app/tenant: {{ .Values.tenant }}
    spec:
      serviceAccountName: {{ include "mcp-gateway.name" . }}
      automountServiceAccountToken: false
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: MCP_TENANT
              value: {{ .Values.tenant | quote }}
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8765"
            - name: EMBEDDER_URL
              value: {{ .Values.embedderURL | quote }}
            # pgvector DSN composed from the CNPG app password secret
            # so the secret never lands in the chart values directly.
            # Optional — the pgvector secret lives in support-platform.
            # Cross-namespace secret refs aren't supported, so for now
            # the search_knowledge_base tool runs only inside the
            # support-platform namespace's MCP instance (if we add
            # one). Other tenants get a 'kb not configured' error from
            # that tool and the agent proceeds without it. Replicate
            # the secret per-namespace via ExternalSecret to enable.
            - name: VECTOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vectorDBPasswordSecret }}
                  key: {{ .Values.vectorDBPasswordKey }}
                  optional: true
            - name: VECTOR_DB_DSN
              value: "postgres://{{ .Values.vectorDBUser }}:$(VECTOR_DB_PASSWORD)@{{ .Values.vectorDBHost }}:{{ .Values.vectorDBPort }}/{{ .Values.vectorDBName }}?sslmode=require"
            - name: MONGO_URL
              value: {{ .Values.mongoURL | quote }}
            - name: MONGO_DB
              value: {{ .Values.mongoDB | quote }}
            {{- if .Values.mcpAuthKeySecret.enabled }}
            - name: MCP_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpAuthKeySecret.name | default (printf "%s-mcp-auth" .Values.tenant) }}
                  key: {{ .Values.mcpAuthKeySecret.key | default "MCP_AUTH_KEY" }}
            {{- end }}
            {{- if or .Values.marketplaceInternalAuthSecret.enabled (eq .Values.tenant "mark8ly") }}
            # Shared secret for marketplace-api /internal routes — lets the
            # create_support_ticket tool POST to the from-conversation endpoint.
            # Auto-enabled for mark8ly (other tenants opt in via the value).
            # Driven by the CHART (not app helm parameters) so Kargo's image
            # promotion can't drop it from the Application spec.
            - name: MARKETPLACE_INTERNAL_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplaceInternalAuthSecret.name | default (printf "%s-marketplace-api-internal-auth" .Values.tenant) }}
                  key: {{ .Values.marketplaceInternalAuthSecret.key }}
            {{- end }}
            {{- if or .Values.homechefBffHmacSecret.enabled (eq .Values.tenant "homechef") }}
            # Shared HMAC key for HomeChef's BFF auth — lets the homechef order
            # tools sign requests the way the BFF does so they can act for a
            # verified customer (the backend scopes each order to that user).
            # Auto-enabled for homechef; driven by the CHART (not app helm
            # parameters) so Kargo's image promotion can't drop it.
            - name: HOMECHEF_BFF_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homechefBffHmacSecret.name | default "homechef-api-secrets" }}
                  key: {{ .Values.homechefBffHmacSecret.key }}
            {{- end }}
            {{- if or .Values.allowMutations (has .Values.tenant (list "homechef" "mark8ly" "platform")) }}
            # Gateway registers mutating tools only when this is set. Driven by
            # the CHART so Kargo's image promotion can't drop it.
            - name: MCP_ALLOW_MUTATIONS
              value: "true"
            {{- end }}
            {{- if or .Values.koraInternalKeySecret.enabled (eq .Values.tenant "kora") }}
            - name: KORA_API_URL
              value: {{ .Values.koraAPIURL | quote }}
            # Service key for kora-api GET /internal/v1/foods (search_nutrition).
            - name: KORA_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.koraInternalKeySecret.name | default "kora-mcp-internal" }}
                  key: {{ .Values.koraInternalKeySecret.key }}
                  optional: true
            {{- end }}
            {{- if .Values.openapi.headers.secret.enabled }}
            # Project the secret value as an env var so the
            # MCP_OPENAPI_HEADERS template below can interpolate it
            # via the K8s `$(NAME)` syntax — the literal secret never
            # appears in the chart values.
            - name: {{ .Values.openapi.headers.secret.envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openapi.headers.secret.name }}
                  key: {{ .Values.openapi.headers.secret.key }}
            {{- end }}
            {{- if .Values.openapi.urls }}
            - name: MCP_OPENAPI_URLS
              value: {{ .Values.openapi.urls | quote }}
            {{- end }}
            {{- if .Values.openapi.fileEnabled }}
            # Phase 4 bootstrap: load the per-tenant spec baked into
            # the image. The file path is derived from the tenant
            # name so the chart doesn't need a per-tenant override.
            - name: MCP_OPENAPI_FILES
              value: "/app/openapi/{{ .Values.tenant }}/spec.yaml"
            {{- end }}
            {{- if .Values.openapi.headers.template }}
            - name: MCP_OPENAPI_HEADERS
              value: {{ .Values.openapi.headers.template | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # uvicorn + httpx temp dirs.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
