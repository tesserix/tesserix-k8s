tenant: REQUIRED-OVERRIDE
namespace: REQUIRED-OVERRIDE

image:
  # GHCR remote pull-through. Built by ci-mcp-gateway in
  # slm-support-platform; one shared image for every tenant.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/slm-support-platform/mcp-gateway
  # Default is "main"; the per-tenant ArgoCD apps override
  # `image.tag` via helm parameters and Kargo
  # (kargo-support-platform/prod stage) writes the newest main-<sha>
  # there on every CI build. Always-pull means a pod restart pulls
  # the new digest as soon as ArgoCD syncs.
  tag: "main"
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    memory: 96Mi
  limits:
    memory: 256Mi

service:
  port: 8765

# Cross-tenant tool config. Optional — if unset the corresponding
# tool returns an explanatory error and the agent proceeds without it.
embedderURL: http://support-platform-embedder.support-platform.svc.cluster.local:8001
vectorDBHost: support-platform-postgres-rw.support-platform.svc.cluster.local
vectorDBPort: 5432
vectorDBUser: support_platform
vectorDBName: support_platform
vectorDBPasswordSecret: support-platform-postgres-app
vectorDBPasswordKey: password
mongoURL: mongodb://support-platform-mongo-0.support-platform-mongo.support-platform.svc.cluster.local:27017/?replicaSet=rs0&directConnection=true
mongoDB: otto

# Optional bearer auth (X-MCP-Key). Default unset (open within the
# namespace; cluster NetworkPolicy locks the surface). To turn on, set
# `mcpAuthKeySecret.enabled: true` and create the secret with the key
# `MCP_AUTH_KEY`. slm-router's routes.yaml carries the matching key
# in the corresponding `authEnvVar` env var.
mcpAuthKeySecret:
  enabled: false
  name: ""
  key: MCP_AUTH_KEY

# OpenAPI auto-tool discovery. When `openapi.urls` is non-empty,
# mcp-gateway fetches each spec at startup and registers every
# operation tagged `x-mcp-expose: customer-read` as an MCP tool the
# SLM can call. This is how we expand the SLM's read coverage of a
# product's API surface without hand-coding a tool per endpoint.
#
# `openapi.headers.template` is the literal `MCP_OPENAPI_HEADERS`
# CSV that the gateway parses (`Key: Value, Other: Value2`). When
# `openapi.headers.secret.enabled` is true we additionally project
# a secret into the pod as `$STOREFRONT_KEY` (or whatever env name
# the chart user picks) so the template can interpolate it without
# the literal secret value ever appearing in this values file.
openapi:
  urls: ""  # CSV of full URLs, e.g. "http://api.svc/openapi.json"
  headers:
    # Literal value used for `MCP_OPENAPI_HEADERS`. Plain text is
    # fine for non-sensitive headers. To inject a secret, leave a
    # `$(NAME)` placeholder here and configure `secret` below — K8s
    # will substitute at pod start.
    template: ""
    secret:
      enabled: false
      envVar: ""   # name the projected env var (referenced via $(NAME) in `template`)
      name: ""     # Kubernetes Secret name
      key: ""      # Secret key
