# Lowercase so rendered names stay DNS-1123/1035 valid — `helm lint` renders
# with base values alone. Every consumer overrides these.
tenant: required-override
namespace: required-override

image:
  # GHCR remote pull-through. Built by ci-mcp-gateway in
  # slm-support-platform; one shared image for every tenant.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/slm-support-platform/mcp-gateway
  # Default is "main"; the per-tenant ArgoCD apps override
  # `image.tag` via helm parameters and Kargo
  # (kargo-support-platform/prod stage) writes the newest main-<sha>
  # there on every CI build. Always-pull means a pod restart pulls
  # the new digest as soon as ArgoCD syncs.
  tag: "main"
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    memory: 96Mi
  limits:
    memory: 256Mi

service:
  port: 8765

# Cross-tenant tool config. Optional — if unset the corresponding
# tool returns an explanatory error and the agent proceeds without it.
embedderURL: http://support-platform-embedder.support-platform.svc.cluster.local:8001
vectorDBHost: support-platform-postgres-rw.support-platform.svc.cluster.local
vectorDBPort: 5432
vectorDBUser: support_platform
vectorDBName: support_platform
vectorDBPasswordSecret: support-platform-postgres-app
vectorDBPasswordKey: password
mongoURL: mongodb://support-platform-mongo-0.support-platform-mongo.support-platform.svc.cluster.local:27017/?replicaSet=rs0&directConnection=true
mongoDB: otto

# Per-request bearer auth (X-MCP-Key). Production gateways fail closed when
# the tenant-specific Secret is absent. slm-router carries the matching key in
# the corresponding route authEnvVar.
mcpAuthKeySecret:
  enabled: true
  name: ""
  key: MCP_AUTH_KEY

# Shared secret for marketplace-api /internal routes, injected as
# MARKETPLACE_INTERNAL_AUTH so the create_support_ticket tool can POST the
# from-conversation ticket endpoint. Enable per-tenant (mark8ly) pointing at
# the existing marketplace-api internal-auth secret.
marketplaceInternalAuthSecret:
  enabled: false
  name: ""
  key: INTERNAL_AUTH_SECRET

# Shared HMAC key for HomeChef's BFF auth. Auto-enabled when tenant ==
# "homechef" (see deployment.yaml); lets the homechef order tools sign requests
# exactly the way the BFF does so they act for a verified customer. Defaults to
# the secret homechef-api already syncs (homechef-api-secrets →
# BFF_INTERNAL_HMAC_KEY); no new GCP secret needed.
homechefBffHmacSecret:
  enabled: false
  name: ""
  key: BFF_INTERNAL_HMAC_KEY

# Write tools (refund request, contact lead, support ticket) stay hidden
# unless MCP_ALLOW_MUTATIONS=true. homechef, mark8ly and platform keep them
# via deployment.yaml; any other tenant opts in here.
allowMutations: false

# Shared key for kora-api /internal/v1 routes so search_nutrition can
# bypass Firebase end-user auth. Auto-enabled for kora (deployment.yaml).
koraInternalKeySecret:
  enabled: false
  name: ""
  key: KORA_MCP_INTERNAL_KEY

# OpenAPI auto-tool discovery. When `openapi.urls` is non-empty,
# mcp-gateway fetches each spec at startup and registers every
# operation tagged `x-mcp-expose: customer-read` as an MCP tool the
# SLM can call. This is how we expand the SLM's read coverage of a
# product's API surface without hand-coding a tool per endpoint.
#
# `openapi.headers.template` is the literal `MCP_OPENAPI_HEADERS`
# CSV that the gateway parses (`Key: Value, Other: Value2`). When
# `openapi.headers.secret.enabled` is true we additionally project
# a secret into the pod as `$STOREFRONT_KEY` (or whatever env name
# the chart user picks) so the template can interpolate it without
# the literal secret value ever appearing in this values file.
openapi:
  urls: ""  # CSV of full URLs, e.g. "http://api.svc/openapi.json"
  # When true, the deployment looks for a per-tenant spec at
  # /app/openapi/<tenant>/spec.yaml inside the image and loads it
  # via MCP_OPENAPI_FILES. The loader is fail-soft: a missing file
  # logs a warning and the pod starts clean with zero auto-tools,
  # so it's safe to default this to true — any tenant whose spec
  # is checked in gets it automatically, others are no-ops. This
  # default also matters because Kargo's argocd-update step
  # rewrites the helm.parameters list on every image promotion,
  # so per-Application overrides don't survive a Kargo bump.
  fileEnabled: true
  headers:
    # Literal value used for `MCP_OPENAPI_HEADERS`. Plain text is
    # fine for non-sensitive headers. To inject a secret, leave a
    # `$(NAME)` placeholder here and configure `secret` below — K8s
    # will substitute at pod start.
    template: ""
    secret:
      enabled: false
      envVar: ""   # name the projected env var (referenced via $(NAME) in `template`)
      name: ""     # Kubernetes Secret name
      key: ""      # Secret key
