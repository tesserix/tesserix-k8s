# Production overrides for bookkeeping-tax-service
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  GIN_MODE: "release"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: false
  minAvailable: 0
