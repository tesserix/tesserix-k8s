# Default values for bookkeeping-tax-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/bookkeeping-app/tax-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  # Exclude NATS port from Istio sidecar to fix JetStream timeout issues
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15

# Vertical Pod Autoscaler
vpa:
  # Workload Identity is always enabled
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  controlledValues: "RequestsAndLimits"
  excludeIstioProxy: true

# KEDA - Event-driven autoscaling
keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  idleReplicaCount: 0
  restoreToOriginalReplicaCount: false
  fallback:
    failureThreshold: 3
    replicas: 2
  scaleDown:
    stabilizationWindowSeconds: 300
    percentValue: 50
    periodSeconds: 60
  scaleUp:
    stabilizationWindowSeconds: 0
    percentValue: 100
    podsValue: 4
    periodSeconds: 15
  prometheus:
    enabled: true
    serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
    requestRateQuery: sum(rate(istio_requests_total{destination_canonical_service="bookkeeping-tax-service",reporter="destination"}[2m]))
    requestRateThreshold: "100"
    latencyEnabled: false
    latencyQuery: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{destination_canonical_service="bookkeeping-tax-service",reporter="destination"}[2m])) by (le))
    latencyThreshold: "500"
  cpu:
    enabled: true
    threshold: "80"
  memory:
    enabled: true
    threshold: "80"
  nats:
    # Workload Identity is always enabled
    monitoringEndpoint: "nats.nats.svc.cluster.local:8222"
    account: "$G"
    stream: "BOOKKEEPING"
    consumer: "tax-service"
    lagThreshold: "10"
  triggers: []

# PodDisruptionBudget
pdb:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: IfHealthyBudget

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8080"
  GIN_MODE: "release"

  # Database (DB_HOST set via database.host to avoid duplicates)
  DB_PORT: "5432"
  DB_NAME: "bookkeep_tax"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"

  # Redis for caching
  REDIS_HOST: "redis.redis-marketplace.svc.cluster.local"
  REDIS_PORT: "6379"

  # NATS for events
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # Internal Service URLs
  AUTH_SERVICE_URL: "http://bookkeeping-auth-service.bookkeeping.svc.cluster.local:8080"
  INVOICE_SERVICE_URL: "http://bookkeeping-invoice-service.bookkeeping.svc.cluster.local:8080"

  # India GST Configuration
  DEFAULT_COUNTRY: "IN"
  GST_API_ENV: "sandbox"
  E_INVOICE_THRESHOLD: "5000000"  # ₹50 Lakh in paise
  EWAY_BILL_THRESHOLD: "5000000"  # ₹50,000 in paise

# Redis password
redis:
  enabled: true
  existingSecret: "redis-password"
  existingSecretKey: "redis-password"

# GST Portal API credentials
gst:
  # Workload Identity is always enabled
  existingSecret: "bookkeeping-gst-secrets"
  keys:
    clientId: "gst-client-id"
    clientSecret: "gst-client-secret"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "bookkeeping"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
