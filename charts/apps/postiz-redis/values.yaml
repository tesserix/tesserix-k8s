# postiz-redis — single-replica Redis used by Postiz (sessions, OAuth state cache)
namespace: postiz

image:
  repository: redis
  tag: "7.2-alpine"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

storage:
  size: 5Gi
  storageClass: standard-rwo-retain

# When auth is enabled, the password is sourced from GCP Secret Manager via
# ExternalSecrets — store it as `prod-postiz-redis-password`.
auth:
  enabled: true
  gcpSecretName: prod-postiz-redis-password

service:
  port: 6379
