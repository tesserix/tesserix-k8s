apiVersion: v1
kind: Service
metadata:
  name: postiz-redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postiz-redis
    app.kubernetes.io/part-of: postiz
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: redis
      name: redis
  selector:
    app.kubernetes.io/name: postiz-redis
