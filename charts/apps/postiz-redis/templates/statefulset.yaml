apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postiz-redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postiz-redis
    app.kubernetes.io/part-of: postiz
    app.kubernetes.io/component: cache
spec:
  serviceName: postiz-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz-redis
        app.kubernetes.io/part-of: postiz
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.auth.enabled }}
          command:
            - sh
            - -c
            - |
              exec redis-server \
                --appendonly yes \
                --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postiz-redis-auth
                  key: password
          {{- else }}
          args: ["--appendonly", "yes"]
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                {{- if .Values.auth.enabled }}
                - 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG'
                {{- else }}
                - 'redis-cli ping | grep -q PONG'
                {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
