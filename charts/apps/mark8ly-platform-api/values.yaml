namespace: mark8ly
name: mark8ly-platform-api
image:
  repository: ghcr.io/tesserix/mark8ly-platform-api
  tag: "sha-eacc100358db" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
  migrateTarget: ghcr.io/tesserix/mark8ly-platform-api # same image, different entrypoint via Dockerfile target
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8086
# Locked at 1/1 until the outbox drainer gets FOR UPDATE SKIP LOCKED.
# See mark8ly_deploy_state.md "Locked decisions" for rationale.
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
pdb:
  enabled: true
  minAvailable: 1
# Postgres connection (CNPG cluster, platform_api role)
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_platform_api
  secretName: mark8ly-postgres-platform-api
  sslmode: require
openfga:
  apiUrl: "http://mark8ly-openfga:8080"
  # Empty → auto-discovered by platform-api using store name "mark8ly-platform"
  storeId: ""
# Base URLs for generating tenant-scoped links in notifications.
# The {slug} placeholder is expanded at runtime by the notification templates.
adminBaseUrlTemplate: "https://{slug}-admin.mark8ly.com"
storefrontBaseUrlTemplate: "https://{slug}.mark8ly.com"
emailFrom: "noreply@mark8ly.com"
gcsBucket: ""
# Run the seed binary once after initial install (countries/states/currencies/timezones).
seed:
  enabled: true
