namespace: mark8ly
name: mark8ly-platform-api
# GSA the KSA impersonates via Workload Identity. Must hold
# roles/identityplatform.admin so the claim-writer can set tenant_id custom
# claims on GIP users. The KSA→GSA binding (roles/iam.workloadIdentityUser
# for serviceAccount:tesseracthub-480811.svc.id.goog[mark8ly/mark8ly-platform-api])
# lives in IAM — track it in tesserix-infra terraform (applied manually
# 2026-07-22 while TF is out of date).
gcpServiceAccount: mp-tenant-service-sa@tesseracthub-480811.iam.gserviceaccount.com
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-platform-api
  tag: "sha-493c3652c68d" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
  migrateTarget: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-platform-api # same image, different entrypoint via Dockerfile target
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8086
# Outbox drainer now uses SELECT … FOR UPDATE SKIP LOCKED with an in_flight
# visibility timeout (mark8ly@b3f745b+), so multiple replicas no longer race
# on the same row. Safe to scale horizontally.
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger.
    memory: 128Mi
  limits:
    memory: 256Mi
pdb:
  enabled: true
  maxUnavailable: 1
# Postgres connection (CNPG cluster, platform_api role)
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_platform_api
  secretName: mark8ly-postgres-platform-api
  sslmode: require
openfga:
  apiUrl: "http://mark8ly-openfga:8080"
  # Empty → service runs DiscoverStoreID() at startup and resolves by name
  # (FGAStoreName = "mark8ly-platform"). Robust to OpenFGA store recreations
  # (data wipes, fga-init re-runs). Pinning the ID was the root cause of the
  # 2026-04-29 onboarding outage after the test-data wipe.
  storeId: ""
# marketplace-api admin Service URL — used by platform-api for the
# onboarding-time EnsureSelfVendor call and the cross-service audit
# emitter. Port MUST match the marketplace-api-admin chart's
# service.port (8080). Pinned here so the code-level default can never
# drift away unnoticed.
marketplaceApiUrl: "http://mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080"
marketplaceInternalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Shared secret that gates this service's own /internal/* surface.
# In-cluster callers (admin BFF, auth-bff, marketplace-api when it
# pulls store-by-slug) must forward this as X-Internal-Auth or get a 401.
# Sourced from GCP Secret Manager via the matching ExternalSecret in
# external-secrets/prod/mark8ly/externalsecret.yaml.
internalAuthSecret:
  secretName: mark8ly-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Base URLs for generating tenant-scoped links in notifications.
# The {slug} placeholder is expanded at runtime by the notification
# templates (services/platform-api/internal/onboarding/service.go).
adminBaseUrlTemplate: "https://{slug}-admin.mark8ly.com"
storefrontBaseUrlTemplate: "https://{slug}.mark8ly.com"
# Onboarding funnel base URL. Used for the magic-link verification URL
# in the email_verification template. Flat host — no per-slug shape,
# since the onboarding funnel is not tenant-scoped.
onboardingBaseUrl: "https://mark8ly.com"
emailFrom: "noreply@tesserix.app"
gcsBucket: "tesseracthub-480811-mark8ly-media"
# OpenTelemetry OTLP/gRPC collector endpoint. The service ships traces +
# metrics here from its observability bootstrap. Empty disables telemetry
# (the Go code no-ops when OTEL_EXPORTER_OTLP_ENDPOINT is unset).
otel:
  exporterEndpoint: "http://otel-gateway.observability.svc.cluster.local:4317"
# Canonical admin origin used for the reset-password landing page
# link embedded in the branded reset email. Flat (non-slug) host —
# users can navigate to their own subdomain after completing the
# reset.
adminResetBaseUrl: "https://admin.mark8ly.com"
# GIP (Google Identity Platform) admin settings used by the branded
# password-reset flow. projectId is the GCP project, tenantId is
# the GIP tenant pool merchants live in, and the web API key is
# read from the mark8ly-gip secret at runtime.
gip:
  projectId: "tesseracthub-480811"
  tenantId: "MP-Internal-e986p"
  webApiKeySecret:
    name: mark8ly-gip
    key: GIP_WEB_API_KEY
  # Unrestricted server key for GIP admin calls (password reset, teardown).
  # Only set once prod-mark8ly-gip-server-api-key exists in Secret Manager
  # AND the ExternalSecret maps it — otherwise the pod cannot start.
  serverApiKeySecret:
    name: mark8ly-gip
    key: GIP_SERVER_API_KEY
# Run the seed binary once after initial install (countries/states/currencies/timezones).
seed:
  enabled: true

# Secret resource names — overridden in values-uat.yaml so the UAT
# overlay can swap to `mark8ly-uat-*` Secrets without retemplating.
secrets:
  sendgrid: mark8ly-sendgrid
  resend: mark8ly-resend
  auditIngest: mark8ly-audit-ingest

# Email provider chain order. The named provider sends first; every other
# configured provider is its per-message fallback. Valid: resend | sendgrid
# (or a comma-separated preference list). Flip to sendgrid to restore
# SendGrid-primary — no code change needed.
email:
  primaryProvider: resend

# Replace before surging, so a rollout frees a pod's memory before it
# needs the replacement's (#709).
#
# The default is 25%/25%, which on a single-replica Deployment rounds to
# maxSurge=1, maxUnavailable=0: the new pod must SCHEDULE BEFORE the old
# one dies, so a roll needs double the pod's memory at once. On a cluster
# whose memory requests sit near 100% (while actual usage is around half
# that) the new pod pends forever and the rollout deadlocks — with the
# Deployment still reporting Available=True, because the old pod keeps
# serving. On 2026-08-30 that left seven mark8ly deployments stuck and
# production a day behind main, with nothing alerting.
#
# The cost is honest and accepted: on a single-replica service this is a
# brief 503 during each rollout, where surge-first gave none. Deploys that
# always complete are worth more than a few seconds of downtime on an
# operator-timed rollout. Same remedy as temporal (#538) and devai (#600).
#
# At 2+ replicas there is no downtime at all: one pod stays up while the
# other is replaced.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Zitadel identity. platform-api owns password reset, account deletion and —
# since #679 — provisioning invited teammates (Zitadel user + project grant +
# FGA tuples). It was left on GIP when admin/storefront flipped, so those
# paths were still talking to GIP for users that only exist in Zitadel.
#
# `enabled` makes config.ValidateZitadel mandatory: issuer, login-client
# token, org id and adminProjectId must all be present or the pod refuses to
# boot. That is deliberate — the optional-config failure mode IS the bug
# (accept succeeds, grant silently skipped, teammate cannot sign in).
zitadel:
  enabled: true
  issuer: https://auth.tesserix.app
  # TESSERIX org on the shared instance.
  orgId: "386377229942128837"
  # mark8ly-admin project. Has projectRoleCheck=true, so every user needs a
  # grant on it or OIDC finalize returns 403 AFTER a successful password check.
  adminProjectId: "389070376568619523"
  # staffRoleKey defaults to mark8ly.staff in code; override here if it changes.
  # Credentials come from the existing mark8ly-zitadel ExternalSecret.
  secretName: mark8ly-zitadel
