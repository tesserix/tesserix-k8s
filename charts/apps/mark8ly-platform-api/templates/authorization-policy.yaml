# Only auth-bff, the three Next.js apps, and tesserix-home (for the
# email-templates /internal/* refresh + test-send pings) may call
# platform-api. External traffic should always transit auth-bff first.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-platform-api-callers
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-auth-bff"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-onboarding"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-admin"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-storefront"
              # tesserix-home (super-admin) — needed for /internal/templates/refresh
              # and /internal/templates/:key/test calls when an operator saves an
              # email template or fires a test-send via the admin UI.
              - "cluster.local/ns/tesserix/sa/company"
