{{- if .Values.seed.enabled }}
# One-shot seed Job. Populates reference data (countries, states, currencies,
# timezones). Idempotent — safe to re-run on every sync.
#
# Modeled as an ArgoCD PostSync hook with hook-delete-policy=BeforeHookCreation
# so the previous Job is deleted before each sync renders a new one. This
# sidesteps the immutable-selector problem: when the rendered manifest omits
# spec.selector and spec.template.metadata.labels (so K8s can auto-generate
# them), `kubectl replace` (Replace=true) fails on every subsequent sync with
# "spec.selector: field is immutable" because the live object has the auto-
# generated selector but the desired manifest has null. Hook + delete-before-
# create avoids the diff entirely.
#
# PostSync runs after the Sync wave finishes (Deployment healthy + migrations
# applied), which is exactly when the seed binary is safe to run. It does not
# block the rollout: a hook failure surfaces as a Sync failure but the
# Deployment stays healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-seed
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-seed
        app.kubernetes.io/part-of: mark8ly
        # postgres NetworkPolicy (managed by mark8ly-postgres chart) allows
        # ingress from pods labeled `app.kubernetes.io/component: database-init`.
        # Without it the seed pod's connect to mark8ly-postgres-rw:5432 times
        # out, the PostSync hook hangs, and ArgoCD never reaches Synced —
        # which means template changes (env vars, secret refs) never roll
        # out to the platform-api Deployment until someone deletes the seed
        # pod by hand.
        app.kubernetes.io/component: database-init
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/seed"]
          env:
{{ include "mark8ly-platform-api.dbEnv" . | indent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
