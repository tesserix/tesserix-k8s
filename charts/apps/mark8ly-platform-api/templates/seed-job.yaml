{{- if .Values.seed.enabled }}
# One-shot seed Job. Populates reference data (countries, states, currencies,
# timezones). Idempotent — safe to re-run. ArgoCD PostSync hook ensures it
# runs AFTER the Deployment is healthy (so migrations are already applied).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}-seed
  namespace: {{ .Values.namespace }}
  annotations:
    # Regular resource (not PostSync hook) so the deployment rollout doesn't
    # deadlock waiting on a hook that needs the deployment to be healthy.
    # Seed binary is idempotent (upserts countries/states/currencies).
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 5
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/seed"]
          env:
{{ include "mark8ly-platform-api.dbEnv" . | indent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
