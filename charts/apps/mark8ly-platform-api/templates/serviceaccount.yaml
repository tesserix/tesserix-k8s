apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  {{- if .Values.gcpServiceAccount }}
  annotations:
    # Workload Identity: impersonate a GSA that holds
    # roles/identityplatform.admin so the onboarding/invite claim-writer
    # (internal/gipadmin) can set the tenant_id custom claim on GIP users.
    # Without this the claim outbox fails with INSUFFICIENT_PERMISSION and
    # every newly-onboarded merchant is claim-less → the mobile admin app
    # 404s on /mobile/admin/stores ("Couldn't load your store").
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
