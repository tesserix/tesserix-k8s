apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: backend
spec:
  # Replicas controlled by KEDA ScaledObject when enabled.
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Migrations run every pod startup. Server refuses to boot on schema
      # mismatch, so a failed migrate container blocks the rollout (by design).
      initContainers:
        - name: migrate
          image: "{{ .Values.image.migrateTarget }}:{{ .Values.image.tag }}"
          command: ["/migrate", "up"]
          env:
{{ include "mark8ly-platform-api.dbEnv" . | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENV
              value: "prod"
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
{{ include "mark8ly-platform-api.dbEnv" . | indent 12 }}
            - name: FGA_API_URL
              value: {{ .Values.openfga.apiUrl | quote }}
            - name: FGA_STORE_ID
              value: {{ .Values.openfga.storeId | quote }}
            - name: ADMIN_BASE_URL_TEMPLATE
              value: {{ .Values.adminBaseUrlTemplate | quote }}
            - name: STOREFRONT_BASE_URL_TEMPLATE
              value: {{ .Values.storefrontBaseUrlTemplate | quote }}
            - name: ONBOARDING_BASE_URL
              value: {{ .Values.onboardingBaseUrl | quote }}
            - name: EMAIL_FROM
              value: {{ .Values.emailFrom | quote }}
            - name: GCS_BUCKET
              value: {{ .Values.gcsBucket | quote }}
            # OpenTelemetry OTLP/gRPC collector. Empty disables telemetry —
            # the service no-ops when this is unset.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sendgrid }}
                  key: SENDGRID_API_KEY
            # Resend — always-on fallback email provider behind SendGrid.
            # Optional so the pod still starts before the secret syncs;
            # the service then runs SendGrid-only and logs a warning.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.resend }}
                  key: RESEND_API_KEY
                  optional: true
            # Orders the provider chain: the named provider sends first,
            # every other configured provider is its per-message fallback.
            # Flip to "sendgrid" to restore SendGrid-primary — config only.
            - name: EMAIL_PRIMARY_PROVIDER
              value: {{ .Values.email.primaryProvider | quote }}
            - name: ADMIN_RESET_BASE_URL
              value: {{ .Values.adminResetBaseUrl | quote }}
            - name: GIP_PROJECT_ID
              value: {{ .Values.gip.projectId | quote }}
            - name: GIP_TENANT_ID
              value: {{ .Values.gip.tenantId | quote }}
            - name: GIP_WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gip.webApiKeySecret.name }}
                  key: {{ .Values.gip.webApiKeySecret.key }}
            # Cross-service calls into marketplace-api (self-vendor
            # ensure/update on onboarding + audit emit on staff events).
            # Pin the URL here so a code-level default change can't
            # silently re-introduce the 8086/8080 port mismatch that
            # broke onboarding self-vendor creation in prod.
            - name: MARKETPLACE_API_URL
              value: {{ .Values.marketplaceApiUrl | quote }}
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplaceInternalAuthSecret.secretName }}
                  key: {{ .Values.marketplaceInternalAuthSecret.secretKey }}
            - name: AUDIT_INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.auditIngest }}
                  key: AUDIT_INGEST_SECRET
                  optional: true
            # Self-gate for /internal/*. The Go service treats an empty
            # value as permissive (matching the rollout pattern used by
            # marketplace-api / auth-bff / otto), so the deploy is safe
            # even before the ExternalSecret has finished syncing.
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalAuthSecret.secretName }}
                  key: {{ .Values.internalAuthSecret.secretKey }}
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
