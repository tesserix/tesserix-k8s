# UAT overlay for mark8ly-platform-api.
namespace: mark8ly-uat
name: mark8ly-uat-platform-api

keda:
  minReplicaCount: 1
  maxReplicaCount: 2
pdb:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 96Mi

database:
  host: mark8ly-uat-postgres-rw.mark8ly-uat.svc.cluster.local
  port: 5432
  name: mark8ly_platform_api
  secretName: mark8ly-uat-postgres-platform-api
  sslmode: require

openfga:
  apiUrl: "http://mark8ly-uat-openfga:8080"
  storeId: ""

# In-cluster sibling URLs — UAT-only.
marketplaceApiUrl: "http://mark8ly-uat-marketplace-api-admin.mark8ly-uat.svc.cluster.local:8080"
marketplaceInternalAuthSecret:
  secretName: mark8ly-uat-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
internalAuthSecret:
  secretName: mark8ly-uat-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

# Tenant-scoped link templates that go in notification emails.
#
# Prod uses the bare apex (mark8ly.com) for the onboarding entry point;
# UAT can't claim the apex so it has its own subdomain
# (onboarding-uat.mark8ly.com) that the platform-api must point at —
# otherwise verify links land on the storefront and 404.
adminBaseUrlTemplate: "https://{slug}-admin-uat.mark8ly.com"
storefrontBaseUrlTemplate: "https://{slug}-uat.mark8ly.com"
onboardingBaseUrl: "https://onboarding-uat.mark8ly.com"
emailFrom: "noreply@mark8ly.com"
gcsBucket: "tesseracthub-480811-mark8ly-media-uat"
adminResetBaseUrl: "https://admin-uat.mark8ly.com"

# Override secret names to the UAT-side ExternalSecret targets.
secrets:
  sendgrid: mark8ly-uat-sendgrid
  auditIngest: mark8ly-uat-audit-ingest

# GIP webApiKey secret — chart uses `.gip.webApiKeySecret.name`,
# distinct from the `secrets.gip` path used by other charts.
gip:
  webApiKeySecret:
    name: mark8ly-uat-gip
