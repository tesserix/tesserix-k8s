apiVersion: batch/v1
kind: Job
metadata:
  # Hash the resource version so re-syncing creates a new Job (Kubernetes
  # Jobs are immutable). The .Release.Revision-based suffix means
  # `argocd app sync` always produces a runnable new Job.
  name: devai-registry-bootstrap-{{ .Release.Revision | default "1" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devai-registry-bootstrap.labels" . | nindent 4 }}
  annotations:
    # Re-run on every sync; aregistry POSTs are idempotent.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    # Bump `reseedNonce` in values to force a fresh seed sync: it changes the
    # rendered manifest so ArgoCD goes OutOfSync and Replace re-runs the
    # clone+POST. Lets us pull new/changed registry seeds (e.g. a newly
    # labelled agent) without any other infra change.
    devai.io/reseed: {{ .Values.reseedNonce | default "" | quote }}
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "devai-registry-bootstrap.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: OnFailure
      initContainers:
        # Step 1: shallow-clone the DevAI repo to /workspace.
        #
        # The repo is private. We mount the .gitconfig from a Secret
        # (synced from prod-devai-github-pat in GCP SM) at /etc/gitconfig
        # so `git clone` picks up the `url.<base>.insteadOf` rewrite
        # without ever passing the token on the command line. GIT_CONFIG_*
        # env points the in-image git at /etc/gitconfig (the image runs
        # as a non-root user; the default $HOME is `/git/.gitconfig` which
        # we can't easily own at chart-render time).
        - name: fetch-seeds
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Resilient clone: try the credentialed clone first (private repo via
          # the url.insteadOf rewrite in the mounted .gitconfig). If the PAT is
          # missing/expired AND the repo is public, fall back to an anonymous
          # clone so the seed sync is never blocked on token rotation. Once the
          # repo is private again with a valid PAT, the first path is used.
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              REPO="{{ .Values.seedSource.repoUrl }}"
              REF="{{ .Values.seedSource.ref }}"
              if GIT_CONFIG_GLOBAL=/workspace/.gitconfig \
                   git clone --depth=1 --branch="$REF" "$REPO" /workspace/devai 2>/tmp/clone.err; then
                echo "fetch-seeds: cloned (authenticated)"
              else
                echo "fetch-seeds: authenticated clone failed — falling back to anonymous (public repo)"
                sed 's/x-access-token:[^@]*@/x-access-token:***@/g' /tmp/clone.err || true
                rm -rf /workspace/devai
                GIT_CONFIG_GLOBAL=/dev/null \
                  git clone --depth=1 --branch="$REF" "$REPO" /workspace/devai
                echo "fetch-seeds: cloned (anonymous)"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: gitconfig
              mountPath: /workspace/.gitconfig
              subPath: .gitconfig
              readOnly: true
      containers:
        # Step 2: walk architecture/registry-seeds/ and POST each entry to the
        # registry. The seeds are full apiVersion/kind/metadata/spec envelopes,
        # and our agentic-registry accepts them AS-IS at POST /v0/apply
        # (decodeMultiDoc parses the YAML, Normalized() canonicalizes the
        # apiVersion, store.Apply upserts on kind/namespace/name/tag). So no
        # per-kind flattening is needed — we just POST each file's raw YAML.
        # Order matters: projects + skills + prompts + servers must land before
        # agents (which reference them). Auth is anonymous (mesh-gated), so no
        # Authorization header.
        - name: upsert
          image: python:3.12-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              # Only `requests` is needed — we POST the seed YAML verbatim, so
              # no client-side YAML parsing. Pip-install at boot keeps the image
              # tiny (~100KB wheel, well under a second).
              pip install --quiet --no-cache-dir 'requests==2.*'

              cat > /tmp/upsert.py <<'PYEOF'
              import os, sys, pathlib, requests

              SEEDS = pathlib.Path(os.environ["SEEDS_DIR"])
              ENDPOINT = os.environ["AREGISTRY_ENDPOINT"].rstrip("/")

              # The seeds are full apiVersion/kind/metadata/spec envelopes; our
              # agentic-registry accepts them as-is at POST /v0/apply
              # (decodeMultiDoc parses YAML, Normalized() canonicalizes the
              # apiVersion, store.Apply upserts on kind/namespace/name/tag).
              SESSION = requests.Session()
              SESSION.headers.update({
                  "Authorization": f"Bearer {os.environ['AREGISTRY_DEPLOY_KEY']}",
                  "Content-Type": "application/yaml",
              })

              # Apply in dependency order: projects + skills + prompts + servers
              # before agents (which reference them). Any other *.yaml under the
              # seeds tree is swept up by the rglob fallback.
              ORDER = ["projects", "skills", "prompts", "mcp-servers", "agents"]
              ordered, seen = [], set()
              for d in ORDER:
                  p = SEEDS / d
                  if p.is_dir():
                      for f in sorted(p.glob("*.yaml")):
                          ordered.append(f); seen.add(f)
              for f in sorted(SEEDS.rglob("*.yaml")):
                  if f not in seen:
                      ordered.append(f)

              ok = err = 0
              for f in ordered:
                  label = str(f.relative_to(SEEDS))
                  try:
                      r = SESSION.post(f"{ENDPOINT}/v0/apply", data=f.read_bytes(), timeout=30)
                  except Exception as e:
                      print(f"  ERROR {label}: {e}"); err += 1; continue
                  if r.status_code == 200:
                      print(f"  ok {label}"); ok += 1
                  elif r.status_code == 207:
                      # MultiStatus — at least one object in the doc had an issue.
                      print(f"  partial (207) {label}: {r.text[:200]}"); errors += 1
                  else:
                      print(f"  FAIL ({r.status_code}) {label}: {r.text[:200]}"); err += 1

              print(f"registry bootstrap complete: {ok} applied, {err} failed")
              # Soft success: a stray non-seed/template file shouldn't wedge the
              # whole catalog (the app's health gates on this Job). Fail only if
              # nothing landed at all.
              sys.exit(0 if ok > 0 else 1)
              PYEOF

              SEEDS_DIR=/workspace/devai/{{ .Values.seedSource.subdir }} \
                AREGISTRY_ENDPOINT={{ .Values.aregistry.endpoint }} \
                python /tmp/upsert.py
          env:
            - name: AREGISTRY_DEPLOY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aregistry.deployKeySecret.name }}
                  key: {{ .Values.aregistry.deployKeySecret.key }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: gitconfig
          secret:
            secretName: {{ .Values.github.gitconfigSecret }}
            defaultMode: 0400
            items:
              - key: .gitconfig
                path: .gitconfig
