apiVersion: batch/v1
kind: Job
metadata:
  # Hash the resource version so re-syncing creates a new Job (Kubernetes
  # Jobs are immutable). The .Release.Revision-based suffix means
  # `argocd app sync` always produces a runnable new Job.
  name: devai-registry-bootstrap-{{ .Release.Revision | default "1" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "devai-registry-bootstrap.labels" . | nindent 4 }}
  annotations:
    # Re-run on every sync; aregistry POSTs are idempotent.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "devai-registry-bootstrap.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: OnFailure
      initContainers:
        # Step 1: shallow-clone the DevAI repo to /workspace.
        #
        # The repo is private. We mount the .gitconfig from a Secret
        # (synced from prod-devai-github-pat in GCP SM) at /etc/gitconfig
        # so `git clone` picks up the `url.<base>.insteadOf` rewrite
        # without ever passing the token on the command line. GIT_CONFIG_*
        # env points the in-image git at /etc/gitconfig (the image runs
        # as a non-root user; the default $HOME is `/git/.gitconfig` which
        # we can't easily own at chart-render time).
        - name: fetch-seeds
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # `git` reads $GIT_CONFIG_GLOBAL as the user-level config; we
            # point it at the Secret-projected file under /workspace
            # (writable tmpfs the workload owns). The image's default
            # /etc/gitconfig is a regular file owned by root, so a file-
            # over-directory mount fails — using a fresh path under
            # /workspace avoids that and keeps file mode at 0400.
            - name: GIT_CONFIG_GLOBAL
              value: /workspace/.gitconfig
          args:
            - clone
            - --depth=1
            - --branch={{ .Values.seedSource.ref }}
            - {{ .Values.seedSource.repoUrl }}
            - /workspace/devai
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: gitconfig
              mountPath: /workspace/.gitconfig
              subPath: .gitconfig
              readOnly: true
      containers:
        # Step 2: walk architecture/registry-seeds/ and POST each entry
        # to aregistry's v0 HTTP API. The on-disk seeds use a K8s-CRD-
        # like envelope (apiVersion / kind / metadata.name / spec) for
        # readability + future reconciler use, but aregistry's API
        # expects flat JSON bodies whose schemas it documents in
        # /openapi.json. So we translate inline: load YAML, project
        # metadata + spec into one flat dict, POST as application/json.
        #
        # Directory → endpoint map (verified live against /openapi.json
        # on 2026-05-25):
        #   skills/      → POST /v0/skills    (SkillJSON)
        #   prompts/     → POST /v0/prompts   (PromptJSON)
        #   mcp-servers/ → POST /v0/servers   (McpServerType)
        #   agents/      → POST /v0/agents    (AgentJSON)
        # `projects/` is NOT a real aregistry resource — those YAMLs
        # describe DevAI's catalogue membership in tree-only form and
        # are skipped here. Order matters: servers + skills + prompts
        # must land before agents (which reference them).
        - name: upsert
          image: python:3.12-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              # PyYAML + requests aren't in the base image; pip-install at
              # boot keeps the image size small at the cost of ~10s pod
              # startup. Cache could be wired in via an emptyDir, but a
              # ~50KB / ~100KB wheel pair downloads in well under a second.
              pip install --quiet --no-cache-dir 'pyyaml==6.*' 'requests==2.*'

              cat > /tmp/upsert.py <<'PYEOF'
              import os, sys, time, json, glob, pathlib, yaml, requests

              SEEDS = pathlib.Path(os.environ["SEEDS_DIR"])
              ENDPOINT = os.environ["AREGISTRY_ENDPOINT"].rstrip("/")
              JWT = os.environ["AREGISTRY_JWT"]
              # `mcp-servers/` on disk → `/v0/servers` on the wire (aregistry's
              # endpoint name; `mcp-servers` was Fiber's old reconciler name).
              DIR_TO_PATH = {
                  "skills":      "/v0/skills",
                  "prompts":     "/v0/prompts",
                  "mcp-servers": "/v0/servers",
                  "agents":      "/v0/agents",
              }
              SESSION = requests.Session()
              # aregistry is configured with enableAnonymousAuth=true on
              # this cluster (single-tenant, mesh-gated). Sending an
              # Authorization header makes aregistry try to verify it as
              # a real signed JWT, which fails because the secret we
              # have on disk is the SIGNING key, not a minted token —
              # 401 even though anonymous would have allowed the call.
              # So we deliberately omit the header.
              SESSION.headers.update({
                  "Content-Type": "application/json",
              })
              _ = JWT  # retained for the day we switch back to signed-token auth

              # aregistry's schemas are deliberately slim (verified from
              # /openapi.json on 2026-05-25). DevAI's seed YAML carries
              # richer metadata (tools, handoverSchema, contextKeys,
              # limits, runtime, …) that the registry's API doesn't accept
              # — POSTing those triggers HTTP 422 "unexpected property".
              # The rich fields stay in the on-disk YAML; DevAI's Python
              # registry client layers them in at runtime when the loader
              # falls back to local seeds. Here we project only the
              # schema-allowed subset onto the wire body.
              ALLOWED = {
                  "Skill":     {"name","description","version","category","packages","remotes","repository","status","title","websiteUrl"},
                  # MCPServer body is validated against the upstream
                  # ModelContextProtocol server descriptor schema —
                  # aregistry's own OpenAPI shows {type, name} as
                  # required but the runtime additionally enforces a
                  # top-level $schema discriminator. Allow it through
                  # the projection filter so we can inject it.
                  # `description` + `version` are required by the runtime
                  # MCP server schema (not surfaced by OpenAPI). Allowing
                  # them through the projection filter lets the per-kind
                  # defaults below land them in the body.
                  "MCPServer": {"$schema","name","description","version","type","args","build","command","env","headers","image","registryServerName","registryServerPreferRemote","registryServerVersion","registryURL","url"},
                  "Agent":     {"name","description","version","image","language","framework","modelProvider","modelName","mcpServers","packages","prompts","remotes","repository","skills","status","telemetryEndpoint","title","updatedAt","websiteUrl"},
                  "Prompt":    {"name","version","content","description"},
              }

              def translate(doc, kind):
                  spec = doc.get("spec") or {}
                  name = doc.get("metadata", {}).get("name") or spec.get("name")
                  src = {**spec, "name": name}
                  # Per-kind defaults the schema requires but the seed
                  # may not carry.
                  if kind == "Skill":
                      src.setdefault("version", "1")
                      src.setdefault("title", spec.get("displayName") or name)
                  elif kind == "Prompt":
                      src.setdefault("version", "1")
                      src.setdefault("content", spec.get("template") or spec.get("body") or "")
                  elif kind == "MCPServer":
                      # aregistry uses `type` = remote|local|registry to
                      # discriminate. Our seeds describe an HTTP endpoint
                      # → remote with url. The MCP server descriptor
                      # requires a $schema URL identifying the JSON
                      # schema version it conforms to, plus description
                      # and version fields (enforced by the runtime,
                      # not surfaced in OpenAPI).
                      src.setdefault("type", "remote")
                      src.setdefault(
                          "$schema",
                          "https://modelcontextprotocol.io/schemas/draft/2025-07-09/server.schema.json",
                      )
                      desc = (src.get("description") or spec.get("description") or name).strip()
                      # Runtime cap: description ≤ 100 chars. Our seeds
                      # carry rich prose for humans; truncate at the
                      # boundary so it still reads as a phrase.
                      # We overwrite (not setdefault) because the seed
                      # already populated `description` from spec.* —
                      # setdefault would skip the truncation in that
                      # case, which was the bug behind the 422 loop.
                      if len(desc) > 100:
                          desc = desc[:97].rstrip() + "..."
                      src["description"] = desc
                      src.setdefault("version", "1")
                      if "endpoint" in spec and "url" not in src:
                          src["url"] = spec["endpoint"]
                  elif kind == "Agent":
                      src.setdefault("version", "1")
                      # Required-by-schema fields with safe defaults so we
                      # don't fail on incomplete seeds. Override later by
                      # editing the YAML.
                      src.setdefault("description", spec.get("description") or name)
                      src.setdefault("image", "ghcr.io/tesserix/devai/devai:latest")
                      src.setdefault("language", "python")
                      src.setdefault("framework", "langgraph")
                      llm = spec.get("llm") or {}
                      src.setdefault("modelProvider", llm.get("provider") or "claude")
                      src.setdefault("modelName", llm.get("model") or "claude-sonnet-4-20250514")
                  allowed = ALLOWED.get(kind, set())
                  out = {k: v for k, v in src.items() if k in allowed and v is not None}
                  # aregistry insists on string version; YAML parses
                  # `version: 1` as an int. Cast every kind uniformly.
                  if "version" in out:
                      out["version"] = str(out["version"])
                  return out

              def post(path, body, label):
                  for attempt in range(3):
                      r = SESSION.post(f"{ENDPOINT}{path}", data=json.dumps(body), timeout=20)
                      if 200 <= r.status_code < 300:
                          print(f"  ok ({r.status_code}) {label}")
                          return
                      # 409 conflict OR 400 with the registry's
                      # "duplicate version" detail both mean the resource
                      # already exists at the same version — exactly what
                      # we want on idempotent re-runs.
                      if r.status_code == 409 or (
                          r.status_code == 400 and "duplicate version" in r.text
                      ):
                          print(f"  exists ({r.status_code}) {label}")
                          return
                      print(f"  attempt {attempt+1} HTTP {r.status_code} {label}: {r.text[:200]}")
                      time.sleep(2 ** attempt)
                  print(f"  FAILED {label}")
                  sys.exit(1)

              total = 0
              for dirname in ("skills", "prompts", "mcp-servers", "agents"):
                  d = SEEDS / dirname
                  if not d.is_dir():
                      continue
                  print(f"--- {dirname} ---")
                  for f in sorted(d.glob("*.yaml")):
                      doc = yaml.safe_load(f.read_text()) or {}
                      kind = doc.get("kind", dirname.rstrip("s").title())
                      body = translate(doc, kind)
                      label = f"{dirname}/{f.name}"
                      post(DIR_TO_PATH[dirname], body, label)
                      total += 1
              print(f"registry bootstrap complete: {total} entries upserted")
              PYEOF

              SEEDS_DIR=/workspace/devai/{{ .Values.seedSource.subdir }} \
                AREGISTRY_ENDPOINT={{ .Values.aregistry.endpoint }} \
                AREGISTRY_JWT="${AREGISTRY_JWT}" \
                python /tmp/upsert.py
          env:
            - name: AREGISTRY_JWT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aregistry.jwtSecret.name }}
                  key: {{ .Values.aregistry.jwtSecret.key }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: workspace
          emptyDir: {}
        - name: gitconfig
          secret:
            secretName: {{ .Values.github.gitconfigSecret }}
            defaultMode: 0400
            items:
              - key: .gitconfig
                path: .gitconfig
