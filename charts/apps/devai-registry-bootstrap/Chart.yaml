apiVersion: v2
name: devai-registry-bootstrap
description: >-
  One-shot bootstrap Job that POSTs every YAML under
  architecture/registry-seeds/ (in the DevAI repo) to the live aregistry's
  v0 API. Runs every time the ArgoCD app re-syncs; idempotent because
  aregistry upserts by (kind, name, namespace).

  The seed manifests are pulled from a git checkout container that clones
  the DevAI repo at the configured ref. The push step uses curl with
  the JWT minted from the aregistry-jwt secret.

type: application
version: 0.1.1
appVersion: "1.0.0"
keywords:
  - devai
  - registry
  - bootstrap
maintainers:
  - name: tesserix-platform
