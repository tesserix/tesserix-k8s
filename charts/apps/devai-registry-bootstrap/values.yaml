# devai-registry-bootstrap — defaults
#
# The Job clones the DevAI repo (configurable below), walks
# architecture/registry-seeds/, and POSTs each YAML to aregistry's v0
# API. Re-runs are safe: aregistry upserts on (kind, name, namespace).

namespace: devai

# Where the registry seeds live. Default points at the production DevAI
# repo; override for testing.
seedSource:
  repoUrl: https://github.com/tesserix/devai.git
  ref: main
  subdir: architecture/registry-seeds

# Connection to aregistry. The Service exposes the HTTP API on 12121
# (chart upstream — verified live: kubectl get svc -n agentregistry-system
# agentregistry → ports{http: 12121 → targetPort 8080}). Pointing at
# :8080 directly fails because that's the container port, not the
# Service port we route through. Auth is anonymous (mesh-gated) — no JWT
# secret is wired (the old aregistry.jwtSecret was dead config).
aregistry:
  endpoint: http://agentregistry.agentregistry-system.svc.cluster.local:12121

# Authenticated git clone — the source repo (tesserix/devai) is private,
# so we drop in the `devai-github-pat-gitconfig` ExternalSecret (managed
# in external-secrets/prod/devai/) at $HOME/.gitconfig. The rewrite rule
# (`url.https://<token>@github.com/.insteadOf https://github.com/`)
# makes plain `git clone https://github.com/tesserix/devai.git` work
# without token-pasting on the command line.
github:
  gitconfigSecret: devai-github-pat-gitconfig

# fetch-seeds (clone) image — alpine + git is all we need. There is no
# values-prod.yaml for this chart, so THIS file's values render in prod; set
# `digest` to pin immutably once a known-good digest is recorded.
image:
  repository: alpine/git
  tag: v2.40.1
  # digest: "sha256:<pin-here>"   # when set, takes precedence over tag
  pullPolicy: IfNotPresent

# upsert (POST seeds) image. Prefer a small internal image with `requests`
# pre-baked over installing it from PyPI at every Job start (supply-chain +
# availability risk; the script still falls back to a pip install only if
# requests isn't importable). Pin by digest in prod.
upsertImage:
  repository: python
  tag: "3.12-alpine"
  # digest: "sha256:<pin-here>"   # when set, takes precedence over tag
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 256Mi

# Run via Argo as a normal sync (we won't use Argo's `hook` lifecycle so
# the dashboard can see the Job in the ai-apps app-of-apps tree).
job:
  ttlSecondsAfterFinished: 86400  # 24h — let operators inspect logs after success
  backoffLimit: 3
  activeDeadlineSeconds: 600

serviceAccount:
  create: true
  name: devai-registry-bootstrap
