namespace: mark8ly
name: mark8ly-fga-init

openfgaUrl: "http://mark8ly-openfga:8080"
storeName: "mark8ly-platform"

# Plain alpine + apk-add curl/jq at runtime. The Job drops the
# readOnlyRootFilesystem constraint (see job.yaml) because curlimages/curl
# does not bundle jq and other curl+jq images don't run rootless cleanly.
# Acceptable trade-off — this is a one-shot init that only talks HTTP to
# the in-cluster OpenFGA service.
image:
  # Pulled via the in-region Artifact Registry mirror of Docker Hub — see
  # docs/artifact-registry-mirror.md. Official Docker Hub images live under
  # the `library/` namespace on AR.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/alpine
  tag: "3.19"
