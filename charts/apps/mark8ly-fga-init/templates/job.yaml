apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: authz-bootstrap
  annotations:
    # Re-run on every ArgoCD sync so a model change to the ConfigMap is applied.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.name }}
      containers:
        - name: fga-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "/scripts/fga-init.sh"]
          env:
            - name: OPENFGA_URL
              value: {{ .Values.openfgaUrl | quote }}
            - name: STORE_NAME
              value: {{ .Values.storeName | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: model
              mountPath: /models
          securityContext:
            # alpine apk-add at runtime requires root + writable rootfs.
            # Acceptable tradeoff for this one-shot init Job — see values.yaml.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: {{ .Values.name }}-script
            defaultMode: 0755
        - name: model
          configMap:
            name: {{ .Values.name }}-model
