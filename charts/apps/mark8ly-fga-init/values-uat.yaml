# UAT overlay for mark8ly-fga-init.
namespace: mark8ly-uat
name: mark8ly-uat-fga-init

# UAT runs its own openfga instance with isolated data, but the store
# name has to match the constant baked into the marketplace-api binary
# (`FGAStoreName = "mark8ly-platform"` in services/marketplace-api).
# Each env uses the same store name inside its own openfga cluster.
openfgaUrl: "http://mark8ly-uat-openfga.mark8ly-uat.svc.cluster.local:8080"
storeName: "mark8ly-platform"
