apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: helivanta
    app.kubernetes.io/component: authz
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: helivanta
      annotations:
        # Decorative on this cluster: GCP Managed Prometheus (see
        # k8s/cluster/monitoring/gcp-managed-prometheus.yaml) does not honour
        # annotation-based discovery — it is driven entirely by
        # `PodMonitoring` objects, and none exists for the `helivanta`
        # namespace. These three annotations currently have no reader. See
        # prometheusrule.yaml for the full picture and what would need to
        # exist for OpenFGA's metrics to actually be collected.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.name }}
      securityContext:
        runAsNonRoot: true
        # > 10000 to satisfy Trivy KSV0020/KSV0021 ("Runs with UID/GID <=
        # 10000"). Verified live on tesseract-prod-in-gke before this change
        # was committed: rendered Deployment applied directly, rollout
        # completed, pod Ready, GET /stores responded, and the migrate Job
        # re-run to Complete — the openfga image has no filesystem paths
        # owned by 4000 that this breaks, including under
        # readOnlyRootFilesystem: true.
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openfga
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: OPENFGA_DATASTORE_URI
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.service.httpPort }}"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:{{ .Values.service.grpcPort }}"
            - name: OPENFGA_METRICS_ADDR
              value: "0.0.0.0:{{ .Values.service.metricsPort }}"
            - name: OPENFGA_DATASTORE_METRICS_ENABLED
              value: "true"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # Explicit container-level runAsGroup: KSV0021 checks this field
            # specifically, the pod-level fsGroup above does not satisfy it.
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
