apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.name }}-alerts
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: authz
    role: alert-rules
spec:
  groups:
    - name: {{ .Values.name }}.rules
      rules:
        # Unreachable means every guarded write on the platform is refused
        # (deny-on-unreachable, ADR-0020) - that is an outage, not a warning.
        - alert: OpenFGADown
          expr: absent(up{namespace={{ .Values.namespace | quote }}, pod=~"{{ .Values.name }}-.*"}) or up{namespace={{ .Values.namespace | quote }}, pod=~"{{ .Values.name }}-.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "OpenFGA is down - all guarded writes are being denied"
            description: "No healthy {{ .Values.name }} pod for 2 minutes; the API fails closed, so checks are denying platform-wide."

        # The check budget: p99 <= {{ .Values.latency.p99Seconds }}s in-cluster.
        - alert: OpenFGACheckLatencyBudget
          expr: histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{grpc_method="Check", namespace={{ .Values.namespace | quote }}}[5m])) by (le)) > {{ .Values.latency.p99Seconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenFGA Check p99 above budget"
            description: "p99 Check latency has exceeded {{ .Values.latency.p99Seconds }}s for 10 minutes; every guarded request carries this."
