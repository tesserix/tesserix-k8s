{{- if and .Values.backup.enabled (not .Values.hibernate) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helivanta-postgres-backup-metadata
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
{{- end }}
