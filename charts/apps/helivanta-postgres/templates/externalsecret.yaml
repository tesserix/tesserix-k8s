{{- /*
CNPG requires a basic-auth secret with 'username' and 'password' keys.

This is dwellm8-postgres's externalsecret.yaml shape, with the store swapped:
dwellm8 reads from GCP Secret Manager via a ClusterSecretStore
(gcp-secret-store); Helivanta reads from OpenBao via the namespaced
SecretStore Task 2/#864 already created here (openbao-helivanta-api,
Valid/Ready) — never GCP Secret Manager, per this slice's design.
Consequently there is no `gcpSecretName`-equivalent key anywhere in this
chart: a leftover one would be a silent no-op that misleads the next reader.

Two other departures from dwellm8's template, both required by the Vault
provider rather than stylistic:
  - `kind: SecretStore` (namespaced), not `kind: ClusterSecretStore` — the
    store this references is scoped to the helivanta namespace.
  - `remoteRef` carries no `version: latest`. That field is GCP Secret
    Manager's versioning scheme; OpenBao's Vault KV v2 provider has no
    equivalent field on remoteRef, and omitting it reads the current
    version, which is the only version these paths ever hold.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.bootstrap.secret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-helivanta-api
    kind: SecretStore
  target:
    name: {{ .Values.bootstrap.secret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.bootstrap.owner | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.bootstrap.openbaoPath }}
{{- range .Values.applicationRoles }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-helivanta-api
    kind: SecretStore
  target:
    name: {{ .secret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .name | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .openbaoPath }}
{{- end }}
