{{- /*
CNPG requires a basic-auth secret with 'username' and 'password' keys.

This is dwellm8-postgres's externalsecret.yaml shape, with the store swapped:
dwellm8 reads from GCP Secret Manager via a ClusterSecretStore
(gcp-secret-store); Helivanta reads from OpenBao via the namespaced
SecretStore Task 2/#864 already created here (openbao-helivanta-api,
Valid/Ready) — never GCP Secret Manager, per this slice's design.
Consequently there is no `gcpSecretName`-equivalent key anywhere in this
chart: a leftover one would be a silent no-op that misleads the next reader.

Two other departures from dwellm8's template, both required by the Vault
provider rather than stylistic:
  - `kind: SecretStore` (namespaced), not `kind: ClusterSecretStore` — the
    store this references is scoped to the helivanta namespace.
  - `remoteRef` carries no `version: latest`. That field is GCP Secret
    Manager's versioning scheme; OpenBao's Vault KV v2 provider has no
    equivalent field on remoteRef, and omitting it reads the current
    version, which is the only version these paths ever hold.

`remoteRef.key` is built as `{namespace}/{openbao.app}/{openbaoName}` rather
than a single path string per role — see values.yaml's `openbao.app`
comment for why the app segment (`helivanta-api`) is fixed by the generated
OpenBao policy (`kv/data/{namespace}/{app}/*`) and must not be "simplified"
to something like `postgres`.

`remoteRef.property: password` is REQUIRED, not decorative. Each OpenBao
path holds a single-key KV v2 payload (`{"password": "..."}`); without
`property`, ESO's Vault provider returns the entire payload as the value, so
`secretKey: password` would receive the literal JSON blob
`{"password":"<the actual password>"}` instead of the password itself — and
this fails silently: the ExternalSecret still reports SecretSynced, the
Secret still gets a non-empty `password` key, and only CNPG's downstream
Postgres auth would ever surface the mistake. The known-working precedent is
`cloudflared/cloudflare-tunnel-token` (production, SecretSynced), which
pairs `secretKey: "token"` with `remoteRef.property: "token"` for exactly
this reason.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.bootstrap.secret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-helivanta-api
    kind: SecretStore
  target:
    name: {{ .Values.bootstrap.secret }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Without this CNPG never watches the secret, so a rotated
          # password silently never reaches the database role.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.bootstrap.owner | quote }}
        password: "{{ "{{" }} .password | trim {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/%s/%s" .Values.namespace .Values.openbao.app .Values.bootstrap.openbaoName }}
        # See the file-level comment above: without this, ESO returns the
        # whole KV v2 payload as JSON instead of just the password.
        property: password
{{- range (concat .Values.applicationRoles .Values.systemRoles) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-helivanta-api
    kind: SecretStore
  target:
    name: {{ .secret }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Without this CNPG never watches the secret, so a rotated
          # password silently never reaches the database role.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: {{ .name | quote }}
        password: "{{ "{{" }} .password | trim {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/%s/%s" $.Values.namespace $.Values.openbao.app .openbaoName }}
        # See the file-level comment above: without this, ESO returns the
        # whole KV v2 payload as JSON instead of just the password.
        property: password
{{- end }}
