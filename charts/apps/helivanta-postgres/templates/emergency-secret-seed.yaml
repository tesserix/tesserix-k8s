{{- if .Values.emergencyWorker.seed.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helivanta-emergency-secret-seed
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helivanta-emergency-secret-seed
  namespace: {{ .Values.namespace }}
data:
  seed.py: |
{{ .Files.Get "files/emergency-seed.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: helivanta-emergency-secret-seed-{{ printf "%s:%s" (.Files.Get "files/emergency-seed.py") .Values.emergencyWorker.seed.image | sha256sum | trunc 8 }}
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "true"
        app.kubernetes.io/name: helivanta-emergency-secret-seed
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
        sidecar.istio.io/proxyCPU: 25m
        sidecar.istio.io/proxyCPULimit: 100m
        sidecar.istio.io/proxyMemory: 32Mi
        sidecar.istio.io/proxyMemoryLimit: 64Mi
    spec:
      serviceAccountName: helivanta-emergency-secret-seed
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: {{ .Values.emergencyWorker.seed.image | quote }}
          command: [python, -B, /scripts/seed.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/openbao, readOnly: true}
      volumes:
        - name: script
          configMap: {name: helivanta-emergency-secret-seed}
        - name: token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helivanta-emergency-secret-seed
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: helivanta-emergency-secret-seed}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock: {cidr: 10.30.0.10/32}
        - ipBlock: {cidr: 169.254.20.10/32}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openbao}
          podSelector:
            matchLabels: {app.kubernetes.io/name: openbao}
      ports: [{port: 8200, protocol: TCP}, {port: 15008, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: istio-system}
          podSelector:
            matchLabels: {app: istiod}
      ports: [{port: 15012, protocol: TCP}]
{{- end }}
