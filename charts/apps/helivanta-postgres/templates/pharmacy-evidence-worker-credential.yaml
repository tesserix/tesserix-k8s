{{- if .Values.pharmacyEvidenceWorker.credentials.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-helivanta-pharmacy-evidence-worker
  namespace: {{ .Values.namespace }}
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-helivanta-pharmacy-evidence-worker-production
          serviceAccountRef:
            name: helivanta-pharmacy-evidence-worker
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.pharmacyEvidenceWorker.credentials.secretName }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: openbao-helivanta-pharmacy-evidence-worker
  target:
    name: {{ .Values.pharmacyEvidenceWorker.credentials.secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: helivanta_pharmacy_evidence_worker
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.pharmacyEvidenceWorker.credentials.remoteKey }}
        property: password
{{- end }}
