{{- /*
The ServiceAccount all three ExternalSecrets in this chart authenticate to
OpenBao as. `SecretStore/openbao-helivanta-api`
(charts/thirdparty/openbao/templates/app-secret-stores.yaml) references it
via `serviceAccountRef.name: helivanta-api`, fed from
`charts/thirdparty/openbao/values.yaml`'s `namespaceWhitelist` entry for this
namespace.

Until now this object existed only by hand (#864) — no manifest in this repo
created it. If it were lost (namespace rebuild, cleanup, DR), ESO would fail
`SecretSyncedError` while the existing Secrets kept their last-synced values
(creationPolicy: Owner, refreshInterval: 1h) — a stale-but-working password
that only breaks at the next rotation. Owning it here, in the first chart
this namespace syncs (wave -5), closes that gap.

This chart is the natural owner: it is the only chart in this slice that
consumes the SecretStore this ServiceAccount authenticates, it syncs before
every other Application in the namespace, and it already carries the
ExternalSecrets that depend on the object being present.

No labels or annotations: the live object (created by hand in #864) carries
none, and this manifest is written to match it exactly so adopting it does
not produce a spurious first diff.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helivanta-api
  namespace: {{ .Values.namespace }}
