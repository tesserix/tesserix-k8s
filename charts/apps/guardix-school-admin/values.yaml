name: guardix-school-admin
namespace: guardix

image:
  repository: ghcr.io/tesserix/guardix-school-admin
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  name: ""
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-guardix-prod@tesseracthub-480811.iam.gserviceaccount.com

knative:
  minScale: 1
  maxScale: 10
  containerConcurrency: 0
  timeoutSeconds: 300
  scaleDownDelay: "60s"

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "8080"
  HOSTNAME: "0.0.0.0"

podAnnotations: {}

networkPolicy:
  enabled: true
  podCIDR: "10.0.0.0/8"
