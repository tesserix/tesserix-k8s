# postsocial-redis — single-replica Redis used by PostSocial (sessions, OAuth state cache)
namespace: scrapper

image:
  repository: redis
  tag: "7.2-alpine"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

storage:
  size: 5Gi
  storageClass: standard-rwo-retain

# When auth is enabled, the password is sourced from GCP Secret Manager via
# ExternalSecrets — store it as `prod-postsocial-redis-password`.
auth:
  enabled: true
  gcpSecretName: prod-postsocial-redis-password

service:
  port: 6379
