# UAT overlay for mark8ly-otto.
namespace: mark8ly-uat
name: mark8ly-uat-otto

# Otto stays single-replica even in UAT — WebSocket stickiness > replica
# count for chat workloads.
replicaCount: 1
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 1
  # Scale-to-zero in UAT via istio request-rate. Cold start: first request
  # returns 503, prometheus picks it up within pollingInterval (30s), KEDA
  # scales the deployment 0->1. Subsequent requests succeed once pod ready.
  prometheus:
    enabled: true
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    threshold: "0.01"
    query: 'sum(rate(istio_requests_total{destination_canonical_service="mark8ly-uat-otto",reporter="source"}[1m]))'
pdb:
  enabled: false
resources:
  requests:
    memory: 96Mi

# MongoDB → mark8ly-uat-mongodb (same StatefulSet name, different ns).
mongo:
  url: "mongodb://mark8ly-uat-mongodb-mark8ly-mongodb.mark8ly-uat.svc.cluster.local:27017"
  database: "otto"

# Cookie domain stays `.mark8ly.com` (covers `uat.mark8ly.com`,
# `*-uat.mark8ly.com`).
session:
  cookieName: "otto_session"
  cookieDomain: ".mark8ly.com"
  cookieSecure: true

cors:
  # Same wildcard as prod — covers all `*.mark8ly.com` UAT subdomains
  # (admin-uat, uat, otto-uat, etc.) without a UAT-specific list.
  allowedOrigins: "https://*.mark8ly.com"

# OTP email runs against the same SendGrid sandbox as prod for now.
otp:
  fromEmail: "noreply@mark8ly.com"
  fromName: "Otto Support (UAT)"
  codeTtlSeconds: 600
  maxAttempts: 5
  resendCooldownSeconds: 45

# Override secret names to the UAT-side ExternalSecret targets.
secrets:
  otto: mark8ly-uat-otto
  sendgrid: mark8ly-uat-sendgrid
