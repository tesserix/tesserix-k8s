apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mark8ly-otto.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mark8ly-otto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mark8ly-otto.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        # MongoDB traffic is gRPC-ish over TCP; Envoy adds latency but keeps
        # it in-mesh for audit. Exclude the wire port from outbound capture.
        traffic.sidecar.istio.io/excludeOutboundPorts: "27017"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENV
              value: "prod"
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: MONGO_URL
              value: {{ .Values.mongo.url | quote }}
            - name: MONGO_DATABASE
              value: {{ .Values.mongo.database | quote }}
            - name: CUSTOMER_SESSION_COOKIE
              value: {{ .Values.session.cookieName | quote }}
            - name: CUSTOMER_COOKIE_DOMAIN
              value: {{ .Values.session.cookieDomain | quote }}
            - name: CUSTOMER_COOKIE_SECURE
              value: {{ .Values.session.cookieSecure | quote }}
            - name: CUSTOMER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.otto }}
                  key: CUSTOMER_SESSION_SECRET
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.otto }}
                  key: INTERNAL_AUTH_SECRET
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.cors.allowedOrigins | quote }}
            # OTP email verification — SendGrid key is shared with
            # marketplace-api. Optional so the pod still starts if the
            # secret is not yet provisioned; service falls back to a
            # stdout log mailer and logs a warning.
            # SENDGRID_API_KEY deliberately unset — the key is dead
            # ("401 Maximum credits exceeded"). See the admin chart.
            # Resend is now the only configured provider.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.resend }}
                  key: RESEND_API_KEY
                  optional: true
            # Orders the provider chain: the named provider sends first,
            # every other configured provider is its per-message fallback.
            # Flip to "sendgrid" to restore SendGrid-primary — config only.
            - name: EMAIL_PRIMARY_PROVIDER
              value: {{ .Values.email.primaryProvider | quote }}
            - name: OTP_FROM_EMAIL
              value: {{ .Values.otp.fromEmail | quote }}
            - name: OTP_FROM_NAME
              value: {{ .Values.otp.fromName | quote }}
            - name: OTP_CODE_TTL_SECONDS
              value: {{ .Values.otp.codeTtlSeconds | quote }}
            - name: OTP_MAX_ATTEMPTS
              value: {{ .Values.otp.maxAttempts | quote }}
            - name: OTP_RESEND_COOLDOWN_SECONDS
              value: {{ .Values.otp.resendCooldownSeconds | quote }}
            # OpenTelemetry OTLP/gRPC collector endpoint. Empty disables
            # instrumentation (the service no-ops on traces + metrics).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
