namespace: mark8ly
name: mark8ly-otto
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-otto
  tag: "sha-493c3652c68d" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8089
# Real-time chat needs persistent WebSocket connections, so Otto runs as a
# plain Deployment to avoid scale-to-zero cold starts and
# preserve long-lived sockets across replicas. A single replica is fine at
# v1 traffic; KEDA scales on memory when contention appears.
replicaCount: 1
keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3
resources:
  requests:
    # Set even though keda.enabled=false — keeps parity with sibling
    # charts and unblocks future autoscaling without a chart edit.
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
# MongoDB in-cluster. Matches the service created by the mark8ly-mongodb
# chart installed in the same namespace.
mongo:
  url: "mongodb://mark8ly-mongodb.mark8ly.svc.cluster.local:27017"
  database: "otto"
# Customer-session cookie that binds an anonymous visitor to their own
# thread. Cookie name + domain match the mark8ly storefront convention.
session:
  cookieName: "otto_session"
  cookieDomain: ".mark8ly.com"
  cookieSecure: true
cors:
  # Storefront + admin both call otto directly for WebSocket upgrades.
  # REST calls go via Next.js same-origin proxies so no browser CORS.
  allowedOrigins: "https://*.mark8ly.com"
# OTP email verification. SENDGRID_API_KEY is pulled from the existing
# mark8ly-sendgrid ExternalSecret that already serves transactional email
# for marketplace-api; RESEND_API_KEY (mark8ly-resend, platform-wide key)
# is the always-on fallback provider. If both secrets are missing the
# service falls back to a log mailer and OTP emails do NOT reach real
# inboxes — acceptable in dev, never in prod.
otp:
  fromEmail: "noreply@tesserix.app"
  fromName: "Otto Support"
  codeTtlSeconds: 600
  maxAttempts: 5
  resendCooldownSeconds: 45

# Secret resource names — overridden in values-uat.yaml so the UAT
# overlay can swap to `mark8ly-uat-*` Secrets without retemplating.
secrets:
  otto: mark8ly-otto
  sendgrid: mark8ly-sendgrid
  resend: mark8ly-resend

# Email provider chain order. The named provider sends first; every other
# configured provider is its per-message fallback. Valid: resend | sendgrid
# (or a comma-separated preference list). Flip to sendgrid to restore
# SendGrid-primary — no code change needed.
email:
  primaryProvider: resend

# OpenTelemetry — traces + metrics over OTLP/gRPC to the in-cluster
# collector. Empty disables instrumentation (the service no-ops).
observability:
  otlpEndpoint: "http://otel-gateway.observability.svc.cluster.local:4317"
