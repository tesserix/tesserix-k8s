# NATS for Helivanta.
#
# The event backbone the rebranded API publishes to — the local dev stack
# runs `nats:2.10-alpine` with `-js -sd /data` (docker-compose.dev.yml), and
# the stream the API writes to is named HELIVANTA. A stream is a JetStream
# object, so JetStream must be enabled here, not left at a connectable-but-
# inert default.
#
# One replica. JetStream clustering needs three for quorum, and a single node
# with a file store loses nothing on a restart; it is unavailable during one,
# which is an acceptable posture at this stage of the product.
namespace: helivanta
fullnameOverride: helivanta-nats

replicaCount: 1

jetstream:
  enabled: true
  storage:
    size: 5Gi
    storageClass: standard-rwo-retain
  # Raw bytes, not Kubernetes quantities. This block is rendered into
  # nats.conf, where `256Mi` is a parse error and NATS exits on boot — the PVC
  # size above IS a Kubernetes quantity, and having both units in one file is
  # exactly how that gets mixed up.
  maxMemory: 268435456   # 256 MiB
  maxFile: 4294967296    # 4 GiB, under the 5Gi volume so the disk never fills

# CPU declared explicitly, and set here rather than in the chart's own
# values.yaml because this chart is shared — dwellm8-nats and
# planning-poker-nats render from the same templates and their namespaces
# have different quota shapes. Only Helivanta's needs constraining.
#
# Without this, the helivanta LimitRange's derived `default.cpu` assigns this
# broker 4 cores — half the namespace's `limits.cpu: 8` ceiling — for a
# process measured at 3m (`kubectl top pod`, 2026-08-19). That single
# allocation is the root cause of #891: it is what left no room to re-admit
# Postgres, which was merely the pod that would have noticed first.
#
# 500m is ~166x the measured steady state, with room for a JetStream replay
# or a publish burst. If this broker ever legitimately needs more than half a
# core, that is a capacity finding worth surfacing rather than absorbing
# silently into an unbounded limit.
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
