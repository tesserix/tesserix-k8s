apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civiclens-api-ai-gateway-egress
  labels:
    {{- include "civiclens-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "civiclens-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.aiGateway.namespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.aiGateway.gatewayName }}
      ports:
        - port: {{ .Values.aiGateway.port }}
          protocol: TCP
        - port: 15008
          protocol: TCP
