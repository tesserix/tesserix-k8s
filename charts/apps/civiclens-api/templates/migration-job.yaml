apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "civiclens-api.fullname" . }}-migrate
  labels:
    {{- include "civiclens-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civiclens-api-migrate
        app.kubernetes.io/part-of: civiclens
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "civiclens-api.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "civiclens-api.podSecurityContext" . | nindent 8 }}
      volumes:
        {{- include "civiclens-api.configVolumes" (dict "values" .Values "secret" "civiclens-migration-config") | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "civiclens-api.image" . | quote }}
          args: [migrate]
          env:
            - name: CIVICLENS_ENV
              value: production
            {{- include "civiclens-api.configEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "civiclens-api.configMounts" . | nindent 12 }}
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- include "civiclens-api.containerSecurityContext" . | nindent 12 }}
