apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civiclens-api-ai-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: civiclens-api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: civiclens-ai
      ports: [{port: 8080, protocol: TCP}, {port: 15008, protocol: TCP}]
