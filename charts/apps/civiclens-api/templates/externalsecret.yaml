{{- $url := printf "@%s:5432/%s?sslmode=verify-full" .Values.database.host .Values.database.name }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: civiclens-api-config
  labels:
    {{- include "civiclens-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-civiclens-production
    kind: SecretStore
  target:
    name: civiclens-api-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.json: >-
          {"civiclens-database-url":"postgresql://civiclens_runtime:{{ "{{" }} .password | urlquery {{ "}}" }}{{ $url }}","civiclens-identity-key":{{ "{{" }} .identityKey | toJson {{ "}}" }}}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.runtimePassword }}
        property: value
    - secretKey: identityKey
      remoteRef:
        key: {{ .Values.secrets.identityKey }}
        property: value
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: civiclens-migration-config
  labels:
    {{- include "civiclens-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-civiclens-production
    kind: SecretStore
  target:
    name: civiclens-migration-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Config validation needs an identity key; migrations never use it, so the migrator gets no read on the real one.
        secrets.json: >-
          {"civiclens-database-url":"postgresql://civiclens_migrator:{{ "{{" }} .password | urlquery {{ "}}" }}{{ $url }}","civiclens-identity-key":"unused-by-migrations-placeholder-identity-key"}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.migratorPassword }}
        property: value
