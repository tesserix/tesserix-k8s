{{- if .Values.gcp.secretManager.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gameverse-shell.fullname" . }}-secrets
  labels:
    {{- include "gameverse-shell.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "gameverse-shell.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: {{ printf "%s-gameverse-auth-secret" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
