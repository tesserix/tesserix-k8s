# Default values for scrapper-web

replicaCount: 1

image:
  repository: ghcr.io/tesserix/social-media-scrapper/scrapper-web
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# The web app talks to the API service within the same namespace
api:
  # In-cluster service URL (same namespace)
  internalUrl: "http://scrapper-api:8000"
  # Public URL (for browser-side API calls)
  publicUrl: "http://localhost:8000"
  publicWsUrl: "ws://localhost:8000"

env:
  NODE_ENV: "development"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

podAnnotations:
    holdApplicationUntilProxyStarts: true

podLabels: {}
