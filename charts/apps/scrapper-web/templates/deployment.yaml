apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scrapper-web.fullname" . }}
  labels:
    {{- include "scrapper-web.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scrapper-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "scrapper-web.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "scrapper-web.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # API connection — browser-side calls use public URL, SSR uses internal
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.api.publicUrl | quote }}
            - name: NEXT_PUBLIC_WS_URL
              value: {{ .Values.api.publicWsUrl | quote }}
            - name: API_INTERNAL_URL
              value: {{ .Values.api.internalUrl | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.auth.nextauthUrl | default "http://localhost:3000" | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: ALLOWED_EMAILS
              value: {{ .Values.auth.allowedEmails | default "samyak.rout@gmail.com,mahesh.sangawar@gmail.com" | quote }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ .Values.auth.keycloakInternalUrl | default "http://keycloak.identity-internal.svc.cluster.local:8080" | quote }}
            - name: KEYCLOAK_PUBLIC_URL
              value: {{ .Values.auth.keycloakPublicUrl | default "https://internal-identity.tesserix.app" | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.auth.keycloakRealm | default "social-scrapper" | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.auth.keycloakClientId | default "social-scrapper-web" | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scrapper-auth-secrets
                  key: KEYCLOAK_CLIENT_SECRET
                  optional: true
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: scrapper-auth-secrets
                  key: NEXTAUTH_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
