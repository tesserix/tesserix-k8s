# Production overrides for scrapper-web

replicaCount: 1

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

env:
  NODE_ENV: "production"

api:
  internalUrl: "http://scrapper-api:8000"
  publicUrl: "https://social-scrapper.tesserix.app/api"
  publicWsUrl: "wss://social-scrapper.tesserix.app/api/ws"

auth:
  nextauthUrl: "https://social-scrapper.tesserix.app"
  allowedEmails: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"
  keycloakIssuer: "https://internal-identity.tesserix.app/realms/social-scrapper"
  keycloakClientId: "social-scrapper-web"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 80

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
