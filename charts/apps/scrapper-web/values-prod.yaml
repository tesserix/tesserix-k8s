# Production overrides for scrapper-web

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

env:
  NODE_ENV: "production"

api:
  internalUrl: "http://scrapper-api:8000"
  publicUrl: "https://scrapper.tesserix.app/api"
  publicWsUrl: "wss://scrapper.tesserix.app/api/ws"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
