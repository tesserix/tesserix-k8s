# Production overrides for platform-api.
# Use with: helm upgrade --values values.yaml --values ../global-config-prod.yaml --values values-prod.yaml
#
# ORDER IS LOAD-BEARING — see the note in argocd/prod/apps/global/platform-api.yaml.

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-platform-api
  tag: "latest"

# Two replicas, as the console runs: a single replica black-holes the surface
# for the length of an image pull on every deploy and every node drain.
replicaCount: 2

# Zero-downtime rollout. maxUnavailable 0 means something here because the
# readiness probe is a real /ready check rather than a bare TCP accept — the
# old pod keeps serving until the new one can actually reach the database.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Preferred, not required: a hard rule would leave the surge pod unschedulable
# when only one node has room.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-api

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 128Mi

env:
  APP_ENV: "production"
  PORT: "8080"
  PLATFORM_API_AUTH_ENABLED: "true"
  ZITADEL_ISSUER: "https://auth.tesserix.app"
  ZITADEL_PROJECT_ID: "386377618200461939"

  # The console's OIDC client id — how this API tells an operator from a
  # service, for the audit trail only.
  #
  # It used to infer that from the presence of an `email` claim. A real
  # operator ACCESS token carries no `email` at all (Zitadel puts profile
  # claims in the ID token and on the userinfo endpoint), so every human was
  # recorded as a service (tesserix-home#450). `client_id` is present on both
  # kinds of token, is signed by the issuer, and is compared against this
  # explicitly configured value rather than guessed at from which claims
  # happen to be present — claim presence varies with the SCOPES a caller
  # requests, not only with who the caller is.
  #
  # Same value as the console's own ZITADEL_CLIENT_ID. Optional by design: it
  # decides audit labelling and never authorisation, so an unset value must not
  # be able to take the service down. Unset, every principal is recorded as a
  # service and the API says so once at startup, at WARN.
  ZITADEL_CONSOLE_CLIENT_ID: "386382971877196703"
  # Turns the health module's Kubernetes reads ON. Set only now that the
  # Role/RoleBinding from #591/#592 are confirmed live in the cluster —
  # `auth can-i list deployments --as=system:serviceaccount:tesserix:platform-api`
  # answers yes. Set before the grant, this would have made the module log a
  # warning and serve `unmeasured` to every operator, which from the console is
  # indistinguishable from the failure it exists to report.
  #
  # Absent or any value other than exactly "true" leaves cluster reads off, and
  # the service still boots: a health check that cannot read the cluster is a
  # degraded signal, not an outage.
  PLATFORM_API_CLUSTER_READ_ENABLED: "true"

# The service makes no GCP API calls. Blanked deliberately so the KSA is not
# annotated to impersonate global-config-prod.yaml's shared
# app-secrets-marketplace-prod account — the trap documented at length in
# charts/apps/company/values-prod.yaml.
gcp:
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "prod"

pdb:
  enabled: true

# Namespace-scoped read on Deployments and CNPG Clusters, for the console's
# health module.
#
# It lives HERE and not as an `image.tag`-style Helm parameter on the ArgoCD
# Application, even though that is where it reads most naturally. Every
# app-of-apps in this repo sets
#   ignoreDifferences: [{kind: Application, jsonPointers: [/spec/source/helm/parameters]}]
# with RespectIgnoreDifferences=true, because Kargo owns that array and rewrites
# it on every promotion. A parameter added to it in git is therefore never
# reconciled and never applied — and the Application still reports Synced,
# because the field is excluded from the comparison. Silent no-op.
#
# values-prod.yaml is applied LAST in the valueFiles chain, so it wins, and it
# is outside the ignored path.
clusterRead:
  enabled: true

# Federation: mark8ly only (tesserix-home#334). Turning this on is what makes
# the estate audit log read a second source; until it was set, LoadRegistry
# returned an empty registry and the client was dormant.
#
# The base URL ends in /api/v1/platform because that is where mark8ly mounts
# this surface. In-cluster the call goes sidecar-to-sidecar and never reaches
# istio-ingress, so the AuthorizationPolicy that denies un-JWT'd /api/v1/admin/*
# at the edge is not what is being avoided here — the prefix is simply the
# route. What DOES gate this path is the mesh policy in
# charts/apps/mark8ly-marketplace-api-admin, which had to learn the
# platform-api principal in this same change.
#
# The secret is the same GCP Secret Manager value marketplace-api itself reads,
# mirrored in by the mark8ly-federation ExternalSecret. Both ends of an HMAC
# must hold identical bytes.
federation:
  enabled: true
  products:
    mark8ly:
      baseURL: "http://mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080/api/v1/platform"
      secretName: mark8ly-federation
      secretKey: FEDERATION_MARK8LY_SECRET
      # The §3.4 entity types mark8ly serves. Read by
      # federation.Registry.SlugsServing, which the tenants module uses instead
      # of Slugs() — `{type}` is product-defined, so a product federating audit
      # logs does not necessarily have tenants, and asking one that does not
      # would answer 404 and surface to an operator as a failed source.
      #
      # `tenants` only, for now: mark8ly#277 shipped and is conformance-passing
      # against production, while its entities/users counterpart (mark8ly#278)
      # is unblocked but not built. Adding `users` here before that endpoint
      # exists would turn a missing feature into a failed source.
      #
      # Without this line the tenants surface answers 501 not_implemented,
      # which is the intended fail-closed behaviour rather than an empty list:
      # an unconfigured deployment must not be able to impersonate "the estate
      # has no tenants".
      entities:
        - tenants
      # §3.2. Read by federation.Registry.SlugsImplementing, which is a
      # SEPARATE list from mark8ly's admin-conformance.json: the conformance
      # declaration governs what the nightly conformance suite checks against
      # mark8ly; this list governs what platform-api will actually call in
      # production. mark8ly declared `outbox` in its conformance manifest
      # first, but that declaration alone changes nothing here — a reader who
      # assumes one implies the other will be wrong, and the failure is
      # silent: SlugsImplementing("outbox") just returns an empty list and
      # the console renders what looks like a healthy, empty outbox.
      #
      # Registered here now that mark8ly mounts the route (mark8ly outbox
      # task, this workstream).
      #
      # `onboarding` added 2026-08-30 for tesserix-home#404, and the same
      # "declared is not mounted" discipline was applied before adding it:
      # mark8ly's `GET /admin/onboarding/funnel` was probed in production and
      # answered 401 (mounted, signature rejected) against a control 404 for a
      # made-up path under the same prefix. Implemented, declared AND wired —
      # the three states `platformadmin/routes.go`'s `if deps.X != nil` mounts
      # keep separate.
      #
      # UNTIL THIS LANDED, `/platform/onboarding` RENDERED PARKED. platform-api
      # answers 501 for an undeclared endpoint, and the console's funnel page
      # narrows that to "Onboarding is not federated here" rather than to an
      # empty funnel — so the surface shipped honest, and this entry is what
      # makes it answer. That ordering is deliberate: the page could be
      # reviewed and deployed without this, and this is reversible without
      # touching the page.
      endpoints:
        - outbox
        - onboarding

    # Kora (kora#430, kora#458). Registered 2026-08-26.
    #
    # Serves the contract's five reads: audit-logs, inbox, entities/{type},
    # health, kpis. kpis answers a deliberate 501 not_implemented — Kora is
    # pre-launch and kora#43 has not settled which numbers are headline, and
    # §3.1 is explicit that 501 is a legitimate answer while `{}` is not.
    kora:
      # MUST end in /v1, and the service is kora-api-DIRECT.
      #
      # The client calls {BaseURL}/admin/<endpoint> and signs the DECODED
      # URL.Path, including whatever prefix BaseURL carries. Kora mounts
      # everything under /v1, so the signed path is /v1/admin/audit-logs. Point
      # this at the bare host and every call 401s with a signature mismatch —
      # the same class of trap as mark8ly's /api/v1/platform prefix above,
      # reached by a different route.
      #
      # There is no Service named `kora-api`; `kora-api-direct` is the one that
      # exists. Verified 2026-08-26 by curling /health from a pod in this
      # namespace: 200.
      baseURL: "http://kora-api-direct.kora.svc.cluster.local:8080/v1"
      secretName: kora-federation
      secretKey: FEDERATION_KORA_SECRET
      # Both types are implemented and tested (kora#433). The warning on
      # mark8ly above applies in reverse here: declaring a type before its
      # endpoint exists turns a missing feature into a failed source, and
      # these two exist.
      #
      # `users` is what closes the coverage gap kora#433 was opened for —
      # "a HomeChef or Kora user cannot be found from global search at all".
      entities:
        - users
        - foods
      # §3.2. Kora is the estate's ONLY implementer — mark8ly does not mount
      # /admin/inbox at all, which is why this is declared per product rather
      # than assumed of everyone.
      #
      # Kora's queue merges two sources: `feedback` rows in open/in_progress,
      # and food_resolution_outcomes whose kind NeedsHuman() (only
      # `below_floor` and `no_match`). Both halves verified wired against the
      # deployed code and the live database in kora#474 — the queue is empty
      # today because both tables are at zero rows, not because anything is
      # unplugged. It fills the moment closed-beta testers arrive.
      endpoints:
        - inbox
