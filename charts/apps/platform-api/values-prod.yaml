# Production overrides for platform-api.
# Use with: helm upgrade --values values.yaml --values ../global-config-prod.yaml --values values-prod.yaml
#
# ORDER IS LOAD-BEARING — see the note in argocd/prod/apps/global/platform-api.yaml.

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-platform-api
  tag: "latest"

# Two replicas, as the console runs: a single replica black-holes the surface
# for the length of an image pull on every deploy and every node drain.
replicaCount: 2

# Zero-downtime rollout. maxUnavailable 0 means something here because the
# readiness probe is a real /ready check rather than a bare TCP accept — the
# old pod keeps serving until the new one can actually reach the database.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Preferred, not required: a hard rule would leave the surge pod unschedulable
# when only one node has room.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-api

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 128Mi

env:
  APP_ENV: "production"
  PORT: "8080"
  PLATFORM_API_AUTH_ENABLED: "true"
  ZITADEL_ISSUER: "https://auth.tesserix.app"
  ZITADEL_PROJECT_ID: "386377618200461939"
  # Turns the health module's Kubernetes reads ON. Set only now that the
  # Role/RoleBinding from #591/#592 are confirmed live in the cluster —
  # `auth can-i list deployments --as=system:serviceaccount:tesserix:platform-api`
  # answers yes. Set before the grant, this would have made the module log a
  # warning and serve `unmeasured` to every operator, which from the console is
  # indistinguishable from the failure it exists to report.
  #
  # Absent or any value other than exactly "true" leaves cluster reads off, and
  # the service still boots: a health check that cannot read the cluster is a
  # degraded signal, not an outage.
  PLATFORM_API_CLUSTER_READ_ENABLED: "true"

# The service makes no GCP API calls. Blanked deliberately so the KSA is not
# annotated to impersonate global-config-prod.yaml's shared
# app-secrets-marketplace-prod account — the trap documented at length in
# charts/apps/company/values-prod.yaml.
gcp:
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "prod"

pdb:
  enabled: true

# Namespace-scoped read on Deployments and CNPG Clusters, for the console's
# health module.
#
# It lives HERE and not as an `image.tag`-style Helm parameter on the ArgoCD
# Application, even though that is where it reads most naturally. Every
# app-of-apps in this repo sets
#   ignoreDifferences: [{kind: Application, jsonPointers: [/spec/source/helm/parameters]}]
# with RespectIgnoreDifferences=true, because Kargo owns that array and rewrites
# it on every promotion. A parameter added to it in git is therefore never
# reconciled and never applied — and the Application still reports Synced,
# because the field is excluded from the comparison. Silent no-op.
#
# values-prod.yaml is applied LAST in the valueFiles chain, so it wins, and it
# is outside the ignored path.
clusterRead:
  enabled: true

# Federation: mark8ly only (tesserix-home#334). Turning this on is what makes
# the estate audit log read a second source; until it was set, LoadRegistry
# returned an empty registry and the client was dormant.
#
# The base URL ends in /api/v1/platform because that is where mark8ly mounts
# this surface. In-cluster the call goes sidecar-to-sidecar and never reaches
# istio-ingress, so the AuthorizationPolicy that denies un-JWT'd /api/v1/admin/*
# at the edge is not what is being avoided here — the prefix is simply the
# route. What DOES gate this path is the mesh policy in
# charts/apps/mark8ly-marketplace-api-admin, which had to learn the
# platform-api principal in this same change.
#
# The secret is the same GCP Secret Manager value marketplace-api itself reads,
# mirrored in by the mark8ly-federation ExternalSecret. Both ends of an HMAC
# must hold identical bytes.
federation:
  enabled: true
  products:
    mark8ly:
      baseURL: "http://mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080/api/v1/platform"
      secretName: mark8ly-federation
      secretKey: FEDERATION_MARK8LY_SECRET
