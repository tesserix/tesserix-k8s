# Default values for platform-api (Tesserix Platform API).
#
# The Go service decided in ADR-003 D2 — one deployable, internally modularised
# by domain. Scaffolded by tesserix-home#277: today it serves /health and /ready
# and composes no domain modules. This chart exists so the delivery path is
# proven while the only thing at risk is a health check.
#
# Smaller than charts/apps/console, which is itself smaller than company. No
# HPA, no VPA, no KEDA, no CronJob — absent rather than present-and-disabled, so
# anything in this file reads as something the service actually needs.
replicaCount: 1

image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md. Built and pushed by tesserix-home CI
  # (.github/workflows/platform-api.yml, IMAGE_NAME: tesserix-platform-api) as a
  # single-arch linux/amd64 image tagged `main-<sha7>` and `latest`.
  #
  # The effective tag in prod is the `image.tag` Helm parameter on the ArgoCD
  # Application, which Kargo (kargo-tesserix-home:prod) rewrites. The value
  # here is only the chart default.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-platform-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image is distroless:nonroot, whose baked-in user is 65532. These values
# must agree with it: a runAsUser that does not match means the binary is owned
# by someone the process is not, and the container fails to exec.
podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
  # Unlike the console's Next.js image, this one is a single static binary that
  # writes nothing to disk, so the root filesystem can genuinely be read-only.
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# NO INGRESS, NO VIRTUALSERVICE — deliberately.
#
# The platform API is cluster-internal only. Its first consumer is the console's
# server-side route handlers over the in-namespace ClusterIP, exactly as they
# call the web app's admin API today (WEB_INTERNAL_ORIGIN).
#
# Products calling it directly — the service principal in ADR-003 D8 — will need
# a public path, but not before that authentication exists (tesserix-home#278).
# Exposing an unauthenticated API to the internet in the meantime is the kind of
# thing that is easy to add and awkward to discover you have added.
ingress:
  enabled: false

# Memory only — no CPU requests/limits, per project convention. A Go service at
# rest holds far less than the Node surfaces: this is sized for the scaffold and
# should be revisited when the first module lands.
resources:
  requests:
    memory: 64Mi
  limits:
    memory: 128Mi

# Both probes are real HTTP endpoints here, which is the difference from the
# console — it has no health route, so its readiness falls back to tcpSocket.
#
# LIVENESS hits /health, which deliberately does NOT touch the database. That is
# the whole reason the service has two endpoints: a liveness probe that fails
# during a database outage asks Kubernetes to restart a working process, which
# cannot bring the database back and adds restart churn to an incident.
livenessProbe:
  enabled: true
  httpGet:
    path: /health
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

# READINESS hits /ready, which DOES check the database. A pod that cannot reach
# Postgres should leave the rotation without being killed.
readinessProbe:
  enabled: true
  httpGet:
    path: /ready
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

env:
  APP_ENV: production
  PORT: "8080"

  # ---------------------------------------------------------------------
  # Zitadel — how this API authenticates its callers (ADR-003 D8).
  #
  # Landed BEFORE the first module rather than with it. The service refuses to
  # register a domain module while authentication is off
  # (`httpx.RegisterModule` panics), so without these variables in place the
  # tickets module (tesserix-home#269) could not deploy at all — and
  # discovering that at merge time is the ordering mistake this estate has
  # already made three times over: the Kargo warehouse, the RBAC grants, and
  # the GAR mirror.
  #
  # Enabling it today changes nothing observable. The service composes no
  # modules, and /health and /ready are deliberately NOT authenticated — the
  # kubelet has no token, and a probe that needed one would fail the pod.
  # ---------------------------------------------------------------------
  PLATFORM_API_AUTH_ENABLED: "true"

  ZITADEL_ISSUER: "https://auth.tesserix.app"

  # The Platform Console project — the SAME id the console uses. It is both the
  # audience this API requires and the project whose roles it reads.
  #
  # No separate Zitadel application: the console already requests
  # `urn:zitadel:iam:org:project:id:{projectId}:aud`, so its tokens already
  # carry this audience. A second application would mean a second client id and
  # secret to manage for no gain.
  ZITADEL_PROJECT_ID: "386377618200461939"

  # The console's OIDC client id — how this API tells an operator from a
  # service, for the audit trail only.
  #
  # It used to infer that from the presence of an `email` claim. A real
  # operator ACCESS token carries no `email` at all (Zitadel puts profile
  # claims in the ID token and on the userinfo endpoint), so every human was
  # recorded as a service (tesserix-home#450). `client_id` is present on both
  # kinds of token, is signed by the issuer, and is compared against this
  # explicitly configured value rather than guessed at from which claims
  # happen to be present — claim presence varies with the SCOPES a caller
  # requests, not only with who the caller is.
  #
  # Same value as the console's own ZITADEL_CLIENT_ID. Optional by design: it
  # decides audit labelling and never authorisation, so an unset value must not
  # be able to take the service down. Unset, every principal is recorded as a
  # service and the API says so once at startup, at WARN.
  ZITADEL_CONSOLE_CLIENT_ID: "386382971877196703"

# No ExternalSecret. The service's only credential is the tesserix-postgres
# Secret below, which CNPG generates in-cluster — nothing here comes from GCP
# Secret Manager yet. That changes with tesserix-home#278 (Zitadel), and the
# ExternalSecret should be added then rather than pre-created empty.
externalSecrets:
  enabled: false

gcp:
  projectId: ""
  namespace: "tesserix"
  # The service makes no GCP API calls. Blanked deliberately so the KSA is not
  # annotated to impersonate global-config-prod.yaml's shared
  # app-secrets-marketplace-prod account — see the long note in
  # charts/apps/console/values-prod.yaml for how that bit the company chart.
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

configMap:
  enabled: false
  data: {}

# No minAvailable: with a single replica, minAvailable: 1 pins
# disruptionsAllowed at 0 and blocks every node drain. The template falls back
# to maxUnavailable: 1.
pdb:
  enabled: true

# tesserix-postgres — the SAME database, with the SAME Secret, that the console
# and the web app already read. apps/console/lib/db/tesserix.ts says so in its
# own header.
#
# Nothing new is provisioned. ADR-003 D7 makes this service the eventual sole
# writer for the domains it absorbs; today it only proves it can connect.
# Calling other products' platform admin APIs on the operator's behalf
# (tesserix-home#334). OFF here: a chart default that reached out to another
# product would be a surprising thing for a `helm install` to do.
#
# `products` is a map keyed by estate slug. Its keys become FEDERATION_PRODUCTS,
# which is the whole declaration mechanism on the Go side — a product is
# callable because it is named there, not because its URL happens to be set, so
# configuration left behind by a rollback cannot quietly re-enable one.
federation:
  enabled: false
  products: {}

database:
  tesserix:
    enabled: true
    host: tesserix-postgres-rw.tesserix.svc.cluster.local
    port: 5432
    name: tesserix_admin
    secretName: tesserix-postgres-tesserix-admin
    # `require` = encrypt, do not verify. It matches what the console already
    # negotiates: `ssl: { rejectUnauthorized: false }`, because CNPG self-signs
    # and rotates internally, so pinning a CA would break on every rotation.
    #
    # Do NOT "improve" this to verify-full without also solving CA distribution.
    sslMode: require
    # ADR-003 D2a treats the pool constraint as measured, not theoretical: ~30
    # services share a small Postgres and the console's own pool is max 2,
    # written into its code as the reason a check shares its caller's
    # transaction rather than opening a second connection.
    #
    # Starting at 2 makes the migration net-neutral: this rises as modules land
    # while the console's falls as its data layer retires under D7.
    maxConns: 2

# Read-only access to Deployments and CNPG Clusters in this namespace, for the
# health module. Off by default: enabling it grants cluster credentials, which
# should be an explicit line in the ArgoCD Application rather than an implicit
# consequence of a chart bump.
clusterRead:
  enabled: false
