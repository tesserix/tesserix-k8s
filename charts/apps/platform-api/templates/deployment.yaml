apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-api.fullname" . }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "platform-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "platform-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "platform-api.fullname" . }}-secrets
          {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcp.projectId | quote }}
            {{- end }}
            {{- if .Values.database.tesserix.enabled }}
            # tesserix-postgres. Host/port/name/sslmode are static; user and
            # password come from the CNPG-generated Secret, the SAME one the
            # console and the web app read.
            #
            # These names are read verbatim by the Go service
            # (platform-api/internal/platform/config), and they match the
            # console's chart deliberately — one credential should not have two
            # spellings across two deployments.
            - name: TESSERIX_DB_HOST
              value: {{ .Values.database.tesserix.host | quote }}
            - name: TESSERIX_DB_PORT
              value: {{ .Values.database.tesserix.port | quote }}
            - name: TESSERIX_DB_NAME
              value: {{ .Values.database.tesserix.name | quote }}
            - name: TESSERIX_DB_SSLMODE
              value: {{ .Values.database.tesserix.sslMode | quote }}
            - name: TESSERIX_DB_MAX_CONNS
              value: {{ .Values.database.tesserix.maxConns | quote }}
            - name: TESSERIX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.tesserix.secretName | quote }}
                  key: username
            - name: TESSERIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.tesserix.secretName | quote }}
                  key: password
            {{- end }}
            {{- if .Values.federation.enabled }}
            # Federation (tesserix-home#334). All three variables per product
            # are emitted from ONE guard on purpose: LoadRegistry fails closed,
            # so a product named in FEDERATION_PRODUCTS whose BASE_URL or
            # SECRET is empty aborts startup. Splitting the plain values into
            # `env:` and the secret into its own block would make a half-
            # configured deploy expressible, and its symptom is a crashloop
            # rather than a degraded feature.
            - name: FEDERATION_PRODUCTS
              value: {{ keys .Values.federation.products | sortAlpha | join "," | quote }}
            {{- range $slug, $cfg := .Values.federation.products }}
            # `upper` and nothing else. The Go side computes this prefix as
            # "FEDERATION_" + strings.ToUpper(slug) + "_", which does NOT
            # translate hyphens. Helpfully replacing "-" with "_" here would
            # emit FEDERATION_FOO_BAR_BASE_URL while the service looks up
            # FEDERATION_FOO-BAR_BASE_URL, and the pod would crashloop on a
            # variable that is visibly present in the manifest.
            - name: FEDERATION_{{ $slug | upper }}_BASE_URL
              value: {{ $cfg.baseURL | quote }}
            - name: FEDERATION_{{ $slug | upper }}_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $cfg.secretName | quote }}
                  key: {{ $cfg.secretKey | quote }}
            {{- if $cfg.entities }}
            # Optional, unlike BASE_URL and SECRET: a product that federates
            # audit logs and serves no §3.4 entity type is a normal
            # configuration, so an absent list must not be an empty string —
            # LoadRegistry treats "" as "serves none", which is the same
            # answer, but emitting the variable at all would suggest a
            # declaration was made.
            - name: FEDERATION_{{ $slug | upper }}_ENTITIES
              value: {{ join "," $cfg.entities | quote }}
            {{- end }}
            {{- if $cfg.endpoints }}
            # Which CONTRACT ENDPOINTS this product implements beyond the ones
            # every federating product serves — today only `inbox`.
            #
            # Optional for the same reason ENTITIES is, and load-bearing for a
            # sharper one: §3.2 is required of products that ADOPT it, not of
            # every product at once. mark8ly does not mount /admin/inbox, so a
            # fan-out that included it would answer 404 and render to an
            # operator as "mark8ly could not be read" — on the one surface
            # where a red entry means something is wrong with the estate.
            #
            # Absence means "implements none", so a product stays out of the
            # estate queue until declared in. An under-declared product is a
            # visibly missing source; an over-declared one is a permanent red
            # failure on a surface operators are meant to trust.
            - name: FEDERATION_{{ $slug | upper }}_ENDPOINTS
              value: {{ join "," $cfg.endpoints | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- if and .Values.livenessProbe .Values.livenessProbe.enabled }}
          # /health does not touch the database, on purpose. Restarting a pod
          # because Postgres is unreachable cannot bring Postgres back.
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 5 }}
          {{- end }}
          {{- if and .Values.readinessProbe .Values.readinessProbe.enabled }}
          # /ready DOES check the database, so a pod that cannot serve leaves
          # the rotation without being killed.
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 3 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
