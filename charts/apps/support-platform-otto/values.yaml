namespace: support-platform
name: support-platform-otto

# Built by the slm-support-platform CI (ci-otto.yml). Pulled via the
# in-region GAR mirror per the org-wide image policy.
image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/slm-support-platform/otto
  tag: "main"  # Kargo bumps this to main-<sha> as CI publishes images
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8089

# Plain Deployment (not Knative) to preserve long-lived WebSocket
# connections from the chat widget. KEDA scales on connection count
# once a metric exists.
replicaCount: 1

keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

pdb:
  enabled: true
  maxUnavailable: 1

# Shared support-mongo in the same namespace.
mongo:
  url: "mongodb://support-platform-mongo-0.support-platform-mongo.support-platform.svc.cluster.local:27017/?replicaSet=rs0&directConnection=true"
  database: "otto"

# Queue-event bridge: the change-stream watcher publishes conversation
# lifecycle transitions (created / escalated / accepted / closed) to
# <subjectPrefix>.<tenant>.<event> on the shared NATS. homechef-api's
# SUPPORT JetStream stream captures otto.support.> and drives staff
# notifications + the Temporal SLA workflow. Empty url ⇒ feature dark.
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
  subjectPrefix: "otto.support"

# Multi-tenant cookies. Otto resolves the cookie's Domain attribute
# per request:
#  1. trust the `X-Cookie-Domain` header (product proxy sets e.g.
#     ".fanzonebattleground.com" to cover www. + apex), else
#  2. fall back to `cookieDomain` below — and we DELIBERATELY leave
#     that empty so the cookie becomes host-only (scoped to the exact
#     origin the widget called). Host-only means a fanzone session
#     cookie is unreachable from mark8ly and vice versa, which is the
#     isolation guarantee the multi-product setup needs.
#
# DO NOT set a static value here ("./tesserix.app", ".mark8ly.com",
# etc.) — it would leak the session cookie to whichever product
# happens to share that suffix and breaks every other product whose
# domain doesn't match.
session:
  cookieName: "otto_session"
  cookieDomain: ""
  cookieSecure: true

# Allow all three product domains. Otto's CORS middleware does suffix
# matching against this list. WebSocket upgrades hit Otto directly from
# the product frontends; REST calls go via Next.js same-origin proxies
# so no browser CORS for those.
cors:
  allowedOrigins: "https://*.mark8ly.com,https://*.fanzonebattleground.com,https://*.fe3dr.com"

otp:
  fromEmail: "noreply@tesserix.app"
  fromName: "Otto Support"
  codeTtlSeconds: 600
  maxAttempts: 5
  resendCooldownSeconds: 45

# OpenTelemetry — OTLP/gRPC export to the in-cluster collector. Otto's
# observability bootstrap no-ops when this endpoint is empty, so traces
# and metrics only flow once the collector address is set here.
otel:
  endpoint: "http://otel-gateway.observability.svc.cluster.local:4317"

secrets:
  otto: support-platform-otto       # CUSTOMER_SESSION_SECRET, INTERNAL_AUTH_SECRET
  sendgrid: support-platform-sendgrid  # SENDGRID_API_KEY (shared across products)
  resend: support-platform-resend   # RESEND_API_KEY (platform-wide fallback key)
