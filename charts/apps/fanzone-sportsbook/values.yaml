replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-sportsbook
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8091

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

env:
  GO_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  FEED_CACHE_TTL_MIN: "15"
  GCS_BUCKET_NAME: "fanzone-prod-sportsbook-in"
  GCS_PROJECT_ID: "tesseracthub-480811"
  MAX_IMAGES_PER_POST: "4"
  MAX_IMAGE_SIZE_MB: "5"
  MAX_VIDEO_DURATION_S: "15"
  MAX_VIDEO_SIZE_MB: "15"
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  POST_TTL_DAYS: "60"
  REDIS_HOST: "global-valkey-cache.global.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "3"
  SIGNED_URL_EXPIRY_H: "24"
  TRENDING_REFRESH_MIN: "5"
  # MONGO_URL comes from ESO secrets

# Knative Serving configuration
knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"
