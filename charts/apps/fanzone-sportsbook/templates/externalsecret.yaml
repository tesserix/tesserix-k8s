{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fanzone-sportsbook.fullname" . }}-secrets
  labels:
    {{- include "fanzone-sportsbook.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "fanzone-sportsbook.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- if .Values.nats.auth.enabled }}
    # NATS FANZONE-account credentials (.creds) for operator/JWT auth
    # (Home-Chef-App#758-fanzone). Mounted as a file; read via NATS_CREDS.
    - secretKey: NATS_CREDS_FILE
      remoteRef:
        key: {{ printf "%s-nats-creds-fanzone" .Values.gcp.secretManager.secretPrefix }}
    {{- end }}
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod-fanzone-postgresql-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod-fanzone-jwt-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: prod-fanzone-redis-password
    - secretKey: MONGO_URL
      remoteRef:
        key: prod-fanzone-mongodb-url
{{- end }}
