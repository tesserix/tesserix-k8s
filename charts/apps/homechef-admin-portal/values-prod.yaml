# Production overrides for homechef-admin-portal
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Bump this timestamp when you need to force a fresh :latest pull. The
# ghcr-remote pull-through cache in Artifact Registry can hold a stale
# :latest manifest; a spec change is the cheapest way to break it out.
podAnnotations:
  homechef.fe3dr.com/redeploy-at: "2026-04-19T13:00:00Z"

# Knative disabled — migrated to a plain Deployment + KEDA: always >=1 pod
# (no scale-to-zero, no Knative references). Scaling config lives under keda:.
knative:
  enabled: false

# Baseline replicas; KEDA's ScaledObject owns the live count (min 1, max 7).
replicaCount: 1

# Production resource allocation — memory only (no CPU, per platform policy),
# request + limit. Static SPA on nginx; bump if it gets memory-pressured.
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# Production environment
env:
  NODE_ENV: "production"
  # Same-origin BFF path. Istio on admin.fe3dr.com routes /bff/* to the
  # homechef-auth-bff service with x-auth-context: admin so the BFF uses
  # the internal Keycloak realm (tesserix-internal).
  VITE_BFF_URL: "https://admin.fe3dr.com/bff"

# The chart's own HPA stays off — KEDA's ScaledObject owns autoscaling.
autoscaling:
  enabled: false

# No VerticalPodAutoscaler — it would fight KEDA's memory trigger and override
# the explicit memory request/limit. KEDA owns replica scaling; resources are
# fixed and memory-only.
vpa:
  enabled: false

# Prod ingress is the Istio VirtualService (manifests/homechef-istio), not a
# k8s Ingress. The chart's Ingress is a dev-host artifact — keep it off in prod.
ingress:
  enabled: false

# KEDA autoscaling — replaces Knative. Everything here is values-driven, so
# scaling up later is a one-line change:
#   • raise maxReplicaCount to allow more pods,
#   • raise minReplicaCount for a bigger always-on floor,
#   • lower the prometheus threshold to add pods sooner under traffic.
# KEDA scales to the MAX of all triggers. No CPU triggers (platform is
# memory-only); traffic is the primary signal, memory the safety net.
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1   # always at least 1 pod
  maxReplicaCount: 7   # ceiling — bump to scale higher
  triggers:
    # Traffic: Istio requests/sec to this service (Prometheus). threshold is
    # the target req/s PER replica, so replicas ≈ total_rps / threshold.
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
        threshold: "50"
        query: 'sum(rate(istio_requests_total{destination_service_name="homechef-admin-portal",destination_service_namespace="homechef",reporter="source"}[2m]))'
    # Memory safety net (utilization %). Adds pods if memory climbs.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
