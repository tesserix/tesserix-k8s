# LOCAL / kind overlay for homechef-admin-portal. Use with:
#   helm upgrade --install homechef-admin-portal charts/apps/homechef-admin-portal \
#     -n homechef -f charts/apps/homechef-admin-portal/values-local.yaml
#
# Build + load the image into kind first (no registry push):
#   docker build -t homechef-admin-portal:local -f apps/admin-portal/Dockerfile .
#   kind load docker-image homechef-admin-portal:local
# Reach the SPA via:
#   kubectl -n homechef port-forward svc/homechef-admin-portal 8080:80
#
# Note: VITE_* values are baked into the SPA at BUILD time (set as build args).
image:
  repository: homechef-admin-portal
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}

env:
  VITE_API_URL: "http://localhost:8080/api/v1"
  VITE_BFF_URL: "http://localhost:8090/bff"
  VITE_APP_NAME: "HomeChef Admin Portal (local)"
  VITE_APP_ENV: "local"

gcp:
  projectId: ""
  secretManager:
    secretPrefix: "local"

keda:
  enabled: false
autoscaling:
  enabled: false
vpa:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: false

knative:
  enabled: false
