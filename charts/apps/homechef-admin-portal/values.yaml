# Default values for homechef-admin-portal
replicaCount: 1

image:
  repository: ghcr.io/tesserix/home-chef-app/homechef-admin-portal
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
    holdApplicationUntilProxyStarts: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: dev-admin-homechef.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: homechef-admin-portal-tls
      hosts:
        - dev-admin-homechef.tesserix.app

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

knative:
  enabled: false
  minScale: 1
  maxScale: 10
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

livenessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - homechef-admin-portal
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  VITE_API_URL: "https://dev-admin-homechef.tesserix.app/api/v1"
  # Same-origin BFF path. Istio routes /bff/* on the admin host to the
  # homechef-auth-bff service with x-auth-context: admin (internal Keycloak realm).
  VITE_BFF_URL: "https://dev-admin-homechef.tesserix.app/bff"
  VITE_APP_NAME: "HomeChef Admin Portal"
  VITE_APP_ENV: "development"

configMap:
  data: {}

vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

gcp:
  projectId: ""
  namespace: "homechef"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
