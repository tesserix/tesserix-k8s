{{- if .Values.serviceAccount.create }}
{{- /*
The shell's OWN identity, and deliberately not helivanta-api's.

helivanta-api's chart borrows the `helivanta-api` ServiceAccount because its
ExternalSecrets authenticate to OpenBao as it — there, the ServiceAccount IS
the credential. The shell reads nothing from OpenBao and holds no credential
at all, so borrowing that identity would only widen what a compromised shell
pod could ask for. See values.yaml's serviceAccount block.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helivanta-shell.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-shell.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
