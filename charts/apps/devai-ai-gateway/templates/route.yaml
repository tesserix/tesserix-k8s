apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devai-ai
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: public
  rules:
    {{- range $route := .Values.routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.prefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $route.backend }}
          weight: 1
    {{- end }}
