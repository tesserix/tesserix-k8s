{{- if and (not .Values.externalSecrets.enabled) .Values.localSecret.create }}
# LOCAL ONLY — plain Secret standing in for the GCP-Secret-Manager-backed
# ExternalSecret (templates/externalsecret.yaml) when running on kind / sandbox,
# where there is no External Secrets Operator and no gcp-secret-store.
#
# Mutually exclusive with the ExternalSecret: exactly one of the two renders,
# keyed on .Values.externalSecrets.enabled —
#   prod  : externalSecrets.enabled=true  -> ExternalSecret (this file is skipped)
#   local : externalSecrets.enabled=false -> this plain Secret
#
# Values come from .Values.localSecret and are empty by default so nothing
# sensitive lands in git. Inject real keys at deploy time, e.g.:
#   --set localSecret.anthropicApiKey=$(gcloud secrets versions access latest \
#          --secret=prod-devai-anthropic-api-key --project=tesseracthub-480811)
# (the gateway stays Healthy with empty keys; it just can't proxy real LLM
# calls until they're set).
apiVersion: v1
kind: Secret
metadata:
  name: devai-ai-gateway-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: devai-ai-gateway
    app.kubernetes.io/part-of: devai
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.localSecret.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.localSecret.openaiApiKey | quote }}
{{- end }}
