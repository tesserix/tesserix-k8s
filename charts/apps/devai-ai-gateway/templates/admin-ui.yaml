apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}-admin
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
spec:
  type: ClusterIP
  selector:
    gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
  ports:
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: {{ .Values.admin.port }}
      protocol: TCP
