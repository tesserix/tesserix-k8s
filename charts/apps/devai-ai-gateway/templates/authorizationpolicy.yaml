apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range .Values.authorizationPolicy.allowedPrincipals }}
              - {{ . | quote }}
              {{- end }}
      to:
      - operation:
          ports:
            - {{ .Values.gateway.port | quote }}
    - from:
        - source:
            principals:
              - {{ .Values.authorizationPolicy.publicPrincipal | quote }}
      to:
        - operation:
            ports:
              - {{ .Values.gateway.publicPort | quote }}
    - to:
        - operation:
            notPorts:
              - {{ .Values.gateway.port | quote }}
              - {{ .Values.gateway.publicPort | quote }}
