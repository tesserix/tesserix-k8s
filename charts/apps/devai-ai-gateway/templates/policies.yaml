{{- if not .Values.registryOwnership.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-public-oauth
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: public
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: {{ .Values.oauth.issuer }}
          audiences:
            - {{ .Values.oauth.audience | quote }}
          jwks:
            remote:
              jwksPath: {{ .Values.oauth.jwks.path }}
              cacheDuration: {{ .Values.oauth.jwks.cacheDuration }}
              backendRef:
                group: agentgateway.dev
                kind: AgentgatewayBackend
                name: ai-zitadel-jwks
                port: 443
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - {{ printf "%q in jwt[%q]" .Values.oauth.machineRole .Values.oauth.roleClaim | quote }}
    rateLimit:
      global:
        backendRef:
          name: {{ .Values.publicRateLimit.backend }}
          port: {{ .Values.publicRateLimit.port }}
        domain: {{ .Values.publicRateLimit.domain }}
        failureMode: FailClosed
        descriptors:
          - entries:
              - name: gateway
                expression: '"models"'
              - name: oauth_subject
                expression: jwt.sub
            unit: Requests
          - entries:
              - name: oauth_subject_tokens
                expression: jwt.sub
            unit: Tokens
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: devai-ai-traffic
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: devai-ai
  traffic:
    rateLimit:
      local:
        - requests: {{ .Values.limits.requestsPerMinute }}
          unit: Minutes
          burst: {{ .Values.limits.requestBurst }}
        - tokens: {{ printf "%.0f" .Values.limits.tokensPerHour }}
          unit: Hours
    timeouts:
      request: {{ .Values.limits.requestTimeout }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: devai-ai-routes
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: devai-ai
  backend:
    ai:
      routes:
        /v1/chat/completions: Completions
        /v1/embeddings: Embeddings
        /v1/messages: Messages
        /v1/messages/count_tokens: AnthropicTokenCount
        /v1/models: Models
        /v1/responses: Responses
        "*": Detect
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-public-observability
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: public
  frontend:
    accessLog:
      attributes:
        add:
          - name: auth.subject
            expression: jwt.sub
          - name: auth.client_id
            expression: jwt.client_id
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: devai-ai-observability
  labels:
    {{- include "devai-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  frontend:
    accessLog:
      attributes:
        add:
          - name: devai.tenant_id
            expression: '"x-devai-tenant-id" in request.headers ? request.headers["x-devai-tenant-id"] : ""'
          - name: devai.user_id
            expression: '"x-devai-user-id" in request.headers ? request.headers["x-devai-user-id"] : ""'
          - name: devai.run_id
            expression: '"x-devai-run-id" in request.headers ? request.headers["x-devai-run-id"] : ""'
          - name: devai.agent
            expression: '"x-devai-agent" in request.headers ? request.headers["x-devai-agent"] : ""'
          - name: devai.provider
            expression: '"x-devai-provider" in request.headers ? request.headers["x-devai-provider"] : ""'
    # Spans go to the AI usage ingest, which writes the console's cost ledger.
    # Not to the observability estate: that is parked at zero pods, and a cost
    # figure sourced from a stack nobody runs is a figure nobody can check.
    tracing:
      backendRef:
        kind: Service
        name: {{ .Values.tracing.serviceName }}
        namespace: {{ .Values.tracing.namespace }}
        port: {{ .Values.tracing.port }}
      protocol: HTTP
      path: /v1/traces
      # Every request, both listeners. A sampled ledger is not a bill.
      clientSampling: "1.0"
      randomSampling: "1.0"
      attributes:
        add:
          # The gateway cannot learn the product from the request, and a
          # client-supplied header cannot be trusted with the answer.
          - name: tesserix.product
            expression: "'devai'"
          - name: tesserix.gateway
            expression: "'{{ .Values.gateway.name }}'"
          # Guarded: bare map access throws "No such key" when the header is
          # absent, and an unset capability must not cost us the whole span.
          - name: tesserix.capability
            expression: '"x-devai-agent" in request.headers ? request.headers["x-devai-agent"] : ""'
{{- end }}
