{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-ai-gateway-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: devai-ai-gateway
    app.kubernetes.io/part-of: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: devai-ai-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.anthropicKey) }}
        key: {{ default (.Values.externalSecrets.anthropicKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: OPENAI_API_KEY
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.openaiKey) }}
        key: {{ default (.Values.externalSecrets.openaiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: VERTEX_API_KEY
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecrets.vertexKey) }}
        key: {{ default (.Values.externalSecrets.vertexKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
{{- end }}
