# devai-ai-gateway — defaults
namespace: agentgateway-system

# Rootless nginx — the unprivileged image runs as uid 101, listens on 8080,
# and writes its pid/temp under /tmp + /var/cache, so the pod can run
# non-root with a read-only root fs (see deployment securityContext). Drop-in
# config-compatible with stock nginx:alpine (same envsubst + gettext).
image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

replicaCount: 1

resources:
  requests:
    memory: 32Mi
  limits:
    memory: 128Mi

# ExternalSecret pulls both LLM keys (Anthropic + OpenAI) from GCP SM.
# PROD default: enabled. Local/kind overlays (values-local.yaml /
# values-sandbox.yaml) flip this to false — see localSecret below.
externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  anthropicKey: prod-devai-anthropic-api-key
  openaiKey: prod-devai-openai-api-key
  vertexKey: prod-devai-vertex-api-key

# LOCAL ONLY — when externalSecrets.enabled=false (kind/sandbox, no External
# Secrets Operator) the chart renders a plain devai-ai-gateway-secrets Secret
# from these values instead of an ExternalSecret (templates/secret.yaml).
# Keys stay empty in git; inject real values at deploy time via --set (see
# values-local.yaml). In prod this stays create=false and the ExternalSecret
# is authoritative, so prod rendering is unchanged.
localSecret:
  create: false
  anthropicApiKey: ""
  openaiApiKey: ""

# Service account — no special IAM today; future SPIFFE identity will
# pin the gateway as the only egress channel from devai → external LLMs.
serviceAccount:
  create: true
  name: devai-ai-gateway
