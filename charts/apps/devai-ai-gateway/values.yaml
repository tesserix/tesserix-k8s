namespace: agentgateway-system

# Registry is the production owner of the provider, route, and policy CRs.
# Set false only for the documented rollback path that restores Helm rendering.
registryOwnership:
  enabled: true

gateway:
  name: ai-gateway
  port: 8080
  publicPort: 8081
  replicas: 2
  serviceAccount:
    gcpServiceAccount: agentgateway-llm@tesseracthub-480811.iam.gserviceaccount.com
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

admin:
  address: 0.0.0.0:15000
  port: 15000
  oauth2Proxy:
    name: agentgateway-admin-ui-oauth2-proxy
    principal: cluster.local/ns/agentgateway-system/sa/agentgateway-admin-ui-oauth2-proxy
    replicas: 2
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      digest: sha256:f6a4aa83a27e316114bf79664302b1ffb2cc8ce697fb479273af4feb3fb16fe3
    issuerUrl: https://auth.tesserix.app
    redirectUrl: https://agentgateway.tesserix.app/oauth2/callback
    backendLogoutUrl: "https://auth.tesserix.app/oidc/v1/end_session?id_token_hint={id_token}"
    scope: "openid profile email urn:zitadel:iam:org:project:id:387190457387450503:aud urn:zitadel:iam:org:projects:roles"
    # oauth2-proxy routes by upstream path: Registry owns the default/admin UI,
    # while Solo keeps its native runtime UI and read-only XDS endpoints.
    upstreams:
      - http://agentregistry.agentregistry-system.svc.cluster.local:12121/
      - http://ai-gateway-admin.agentgateway-system.svc.cluster.local:15000/ui/
      - http://ai-gateway-admin.agentgateway-system.svc.cluster.local:15000/api/
      - http://ai-gateway-admin.agentgateway-system.svc.cluster.local:15000/config_dump
    cookieName: _tesserix_agentgateway_admin
    allowedEmails:
      - samyak.rout@gmail.com
      - mahesh.sangawar@gmail.com
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    externalSecret:
      secretStore: gcp-secret-store
      refreshInterval: 1h
      clientId: prod-agentgateway-admin-ui-client-id
      clientSecret: prod-agentgateway-admin-ui-client-secret
      cookieSecret: prod-agentgateway-admin-ui-cookie-secret

providers:
  vertex:
    projectId: tesseracthub-480811
    region: global
  groq:
    host: api.groq.com
  openrouter:
    host: openrouter.ai
  nemoclaw:
    host: nemoclaw-inference.devai.svc.cluster.local
    port: 8000

routes:
  - prefix: /anthropic
    backend: devai-anthropic
  - prefix: /openai
    backend: devai-openai
  - prefix: /vertex
    backend: devai-vertex-api-key
  - prefix: /gemini
    backend: devai-gemini
  - prefix: /groq
    backend: devai-groq
  - prefix: /openrouter
    backend: devai-openrouter
  - prefix: /nemoclaw
    backend: devai-nemoclaw

# Where this gateway exports its LLM spans. The AI usage ingest turns them into
# the console's cost and token ledger; a ReferenceGrant in that namespace is what
# permits this cross-namespace reference.
tracing:
  serviceName: ai-usage-ingest
  namespace: tesserix
  port: 4318

limits:
  requestsPerMinute: 600
  requestBurst: 100
  tokensPerHour: 10000000
  requestTimeout: 15m

authorizationPolicy:
  # API/worker share devai-api; dispatched Jobs use devai-runner.
  allowedPrincipals:
    - cluster.local/ns/devai/sa/devai-api
    - cluster.local/ns/devai/sa/devai-runner
  publicPrincipal: cluster.local/ns/istio-ingress/sa/istio-ingressgateway

oauth:
  issuer: https://auth.tesserix.app
  audience: "387190457387450503"
  jwks:
    host: auth.tesserix.app
    path: /oauth/v2/keys
    cacheDuration: 15m
  humanEmails:
    - samyak.rout@gmail.com
    - mahesh.sangawar@gmail.com
  roleClaim: "urn:zitadel:iam:org:project:387190457387450503:roles"
  machineRole: agentgateway.models

publicRateLimit:
  backend: agentgateway-ratelimit
  port: 8081
  domain: agentgateway-public

# Retain mirrored platform keys for tested rollback paths. Native backends use
# caller credential passthrough or GCP Workload Identity and do not read these
# values in the active production route.
externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  anthropicKey: prod-devai-anthropic-api-key
  openaiKey: prod-devai-openai-api-key
  vertexKey: prod-devai-vertex-api-key

localSecret:
  create: false
  anthropicApiKey: ""
  openaiApiKey: ""
