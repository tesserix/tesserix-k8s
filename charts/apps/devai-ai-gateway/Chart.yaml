apiVersion: v2
name: devai-ai-gateway
description: |
  Lightweight HTTP forwarder that lives in the agentgateway-system
  namespace and proxies LLM traffic from DevAI workloads to the public
  Anthropic + OpenAI APIs. Injects the Authorization / x-api-key header
  from secrets so the workload pods never carry the LLM credentials —
  the same auth-injection contract Solo.io's agentgateway proxy uses,
  expressed today in plain nginx because we run agentgateway in
  controller-only mode.

  Routes:
    /anthropic/* → https://api.anthropic.com/* (header: x-api-key)
    /openai/*    → https://api.openai.com/*    (header: Authorization: Bearer …)
    /health      → liveness

  When the full Solo.io data plane is deployed later, this chart can be
  retired by pointing the same Service name at the AgentgatewayBackend
  data plane.
type: application
version: 0.1.0
appVersion: "1.27"
