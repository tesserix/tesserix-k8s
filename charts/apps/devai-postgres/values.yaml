hibernate: false

namespace: devai
clusterName: devai-postgres

# The devai namespace is an Istio ambient namespace that binds an L7 waypoint
# (istio.io/use-waypoint=waypoint). The waypoint mangles raw PostgreSQL traffic:
# clients connect but the stream is closed mid-handshake ("connection was closed
# in the middle of operation"), and the CNPG operator can't reach the instance
# status endpoint either. Routing DB traffic L4-only (ztunnel) via this label —
# propagated by CNPG to the cluster pods AND the rw/ro/r services — bypasses the
# waypoint and restores connectivity.
inheritedLabels:
  istio.io/use-waypoint: none

instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

storageSize: 10Gi
storageClass: standard-rwo-retain
# WAL volume sized to comfortably hold the inactive-slot retention cap
# (max_slot_wal_keep_size below) plus headroom for checkpoint/archive lag.
walStorageSize: 10Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

bootstrap:
  database: devai_db
  owner: devai
  secret: devai-postgres-app-credentials
  gcpSecretName: prod-devai-postgresql-password
  postInitSQL: []

postgresql:
  max_connections: "200"
  shared_buffers: "256MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots.
  # Kept well below walStorageSize (10Gi) so a stuck/inactive replication slot
  # is force-trimmed before it can fill the WAL volume and crash the instance
  # (the cause of the 2026-06 outage where the 10GB cap exceeded a 5Gi PVC).
  max_slot_wal_keep_size: "2GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

backup:
  enabled: true
  schedule: "0 0 3 * * *"
  destinationPath: "gs://tesseract-prod-backups-in/devai-postgres"
  # Fresh archive serverName: the default (cluster name "devai-postgres")
  # collided with a deleted incarnation's archive (base backups dated
  # 2026-04-15) left in the bucket, so barman refused to archive and WAL filled
  # the disk. Archiving to a clean path fixes ContinuousArchiving. The orphaned
  # .../devai-postgres/devai-postgres/ prefix can be deleted at leisure.
  serverName: "devai-postgres-v2"
  retentionPolicy: "3d"
  serviceAccount: "app-secrets-devai-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 1
  maxClientConn: "1000"
  defaultPoolSize: "20"

monitoring:
  enablePodMonitor: true

affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 0
  maxSyncReplicas: 0
