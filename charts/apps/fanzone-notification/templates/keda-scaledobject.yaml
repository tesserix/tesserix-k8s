{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "fanzone-notification.fullname" . }}
  labels:
    {{- include "fanzone-notification.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "fanzone-notification.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 3 }}
  triggers:
    {{- range .Values.keda.triggers }}
    - type: {{ .type }}
      metricType: {{ .metricType }}
      metadata:
        {{- toYaml .metadata | nindent 8 }}
    {{- end }}
{{- end }}
