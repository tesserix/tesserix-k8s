# =============================================================================
# FanZone Notification - Notification Service with NATS JetStream
# Handles match reminder scheduling, notification CRUD, and NATS publishing
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-notification
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  # Exclude GCP metadata server from Istio for Workload Identity
  # Istio sidecar configuration
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8086

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []

affinity: {}

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 7
  triggers:
    # Memory-only: this platform sets no cpu requests, and KEDA's webhook
    # rejects a cpu trigger when the target container has none.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Graceful shutdown
terminationGracePeriodSeconds: 30

# Environment configuration
env:
  GO_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

  # Server config
  SERVER_PORT: "8086"

  # NATS JetStream
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  NATS_STREAM_NAME: "FANZONE_NOTIFICATIONS"

  # NATS Prediction Subscriber
  NATS_PREDICTION_STREAM_NAME: "FANZONE_PREDICTION"
  NATS_PREDICTION_CONSUMER_NAME: "notification-predictions"

  # NATS Quiz Subscriber
  NATS_QUIZ_STREAM_NAME: "FANZONE_QUIZ"
  NATS_QUIZ_CONSUMER_NAME: "notification-quiz"

  # NATS Sportsbook Subscriber
  NATS_SPORTSBOOK_STREAM_NAME: "fanzone-sportsbook"
  NATS_SPORTSBOOK_CONSUMER_NAME: "notification-sportsbook"

  # NATS Game Subscriber
  NATS_GAME_STREAM_NAME: "FANZONE_GAME"
  NATS_GAME_CONSUMER_NAME: "notification-game"

  # Scheduler config
  SCHEDULER_INTERVAL: "1m"
  REMINDER_LEAD_TIME: "30m"

# Secret resource names for the email providers (SendGrid primary, Resend
# always-on fallback). Overridden in values-local.yaml for the kind overlay.
secrets:
  sendgrid: fanzone-sendgrid
  resend: fanzone-resend

# Outbound from-identity. The address lives on tesserix.app — the one
# domain verified with the email providers; the display name keeps the
# FanZone branding.
email:
  fromEmail: "noreply@tesserix.app"
  fromName: "FanZone Battle Ground"

# PostgreSQL configuration (fanzone database — has match_reminders, matches, notifications tables)
database:
  host: "fanzone-postgres-rw.fanzone.svc.cluster.local"
  port: "5432"
  user: "fanzone"
  name: "fanzone"
  sslmode: "require"
  passwordSecretName: "fanzone-postgres-app-credentials"
  passwordSecretKey: "password"

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
