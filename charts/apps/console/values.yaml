# Default values for console (Tesserix Platform Console).
#
# Deliberately smaller than charts/apps/company. There is no traffic on this
# surface yet, so HPA, VPA, KEDA, the uptime-probe CronJob and the rollout RBAC
# that the company chart carries are all intentionally ABSENT rather than
# present-and-disabled: anything in this chart should read as something the
# console actually needs. Add them when there is load to justify them.
replicaCount: 1

image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md. Built and pushed by tesserix-home CI
  # (.github/workflows/ci.yml, CONSOLE_IMAGE_NAME: tesserix-console) as a
  # single-arch linux/amd64 image tagged `main-<sha7>` and `latest`.
  #
  # The effective tag in prod is the `image.tag` Helm parameter on the ArgoCD
  # Application, which Kargo (kargo-tesserix-home:prod) rewrites to the newest
  # main-<sha7>. The value here is only the chart default.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-console
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Kong is decommissioned cluster-wide (see charts/apps/company/values.yaml) —
# routing is the Istio VirtualService below. The Ingress object is kept only so
# `ingress.hosts[0].host` remains the single place the hostname is declared;
# the VirtualService reads it from there.
ingress:
  enabled: false
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: console.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: console-tls
      hosts:
        - console.tesserix.app
  backendServices: []

# Memory only — no CPU requests/limits, per project convention.
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

# The console has no /api/health route — apps/console has no API routes at all,
# and every path is session-gated.
#
# LIVENESS stays off deliberately. Restarting a wedged pod is a decision that
# genuinely wants a real health check; a TCP accept succeeds happily while the
# event loop is blocked, so a tcpSocket liveness probe would be a check that
# can never fail usefully. Enable it when the console grows /api/health.
#
# READINESS is on in prod (values-prod.yaml) as a tcpSocket probe. It needs no
# application change, and without it a pod counts as available the instant the
# container starts — which, with replicaCount: 2 and maxUnavailable: 0, lets a
# rollout retire the old pod while Next.js is still binding its port. The
# template falls back to tcpSocket whenever readinessProbe.httpGet is unset, so
# pointing it at a real path later is a values-only change.
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

# The web app (tesserix-home) this console reads from and hands login off to.
# Deployed by charts/apps/company as Deployment/Service `company` in this same
# namespace. Used by the AuthorizationPolicy and NetworkPolicy templates; the
# URLs the app itself consumes are the WEB_* entries under `env` below.
web:
  serviceName: company
  # Path prefix the console's dashboard client calls on the web app.
  adminApiPath: /api/admin

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Session cookie. MUST match charts/apps/company/values.yaml exactly — the
  # console does not mint sessions, it only verifies the cookie the web app
  # issued, and the cookie is only visible here because the domain is the
  # shared parent `.tesserix.app` rather than either host.
  SESSION_COOKIE_NAME: "tx_session"
  SESSION_COOKIE_DOMAIN: ".tesserix.app"

  # Public origin of the web app. The console has no /login of its own, so its
  # middleware redirects unauthenticated visitors to `${NEXT_PUBLIC_WEB_URL}/login`
  # (apps/console/middleware.ts). Unset, that falls back to http://localhost:3002
  # — i.e. a production console that redirects operators to their own laptop.
  NEXT_PUBLIC_WEB_URL: "https://tesserix.app"

  # Cluster-internal origin of the web app. The dashboard client reads this
  # name EXACTLY (apps/console/lib/platform-api.ts: process.env.WEB_INTERNAL_ORIGIN)
  # and calls ${WEB_INTERNAL_ORIGIN}/api/admin/dashboard. ClusterIP, so the
  # dashboard read never egresses to the public internet and never meets an
  # ingress gateway policy. Same localhost:3002 dev fallback caveat as above.
  WEB_INTERNAL_ORIGIN: "http://company.tesserix.svc.cluster.local"

  # The platform API (charts/apps/platform-api), cluster-internal in this same
  # namespace. Unset, every surface that reads it — AI usage, CRM, tickets
  # without the apps/web fallback — renders its unavailable state instead of
  # data, with nothing in the console to say why.
  PLATFORM_API_ORIGIN: "http://platform-api.tesserix.svc.cluster.local"

  # ---------------------------------------------------------------------
  # Zitadel — the console's own OIDC login.
  #
  # NOT ACTIVE YET. Every value below is inert until AUTH_PROVIDER=zitadel is
  # set (see the commented line at the end of this block). Until then the
  # console keeps redirecting to the web app's /login exactly as before, so
  # deploying this chart change on its own is a no-op — which is the point:
  # config lands first, is verified in place, and the switch is one variable.
  # ---------------------------------------------------------------------

  ZITADEL_ISSUER: "https://auth.tesserix.app"

  # The OIDC application registered under the `platform-console` project.
  # Public value — it travels in the authorization URL regardless.
  ZITADEL_CLIENT_ID: "386382971877196703"

  # Must be listed verbatim under the application's Redirect URIs in Zitadel.
  # A mismatch fails at the token exchange with redirect_uri_mismatch, which
  # the callback surfaces in its error log rather than as a blank page.
  ZITADEL_REDIRECT_URI: "https://console.tesserix.app/auth/callback"

  # Ends the ZITADEL session at sign-out, not just ours.
  #
  # `app/auth/logout/route.ts` builds an `end_session` redirect only when this
  # is set; unset, it clears `tx_session` and redirects to `/auth/login`, which
  # immediately starts a fresh authorization request against an IdP session
  # that is STILL ALIVE. Sign-out then appears to work while leaving the
  # operator authenticated at Zitadel — and on a shared machine the next person
  # to click sign-in lands as the previous operator, holding their
  # capabilities. Observed on the live console: a sign-out followed by a
  # `session minted` with no interaction in between.
  #
  # Must match a `postLogoutRedirectUris` entry on the application VERBATIM,
  # trailing slash included — Zitadel validates it and refuses anything else.
  # Confirmed against the live instance: this value answers 302 to itself,
  # while an unregistered URI answers 400 `post_logout_redirect_uri invalid`.
  ZITADEL_POST_LOGOUT_REDIRECT_URI: "https://console.tesserix.app/"

  # Organization check — DELIBERATELY UNSET.
  #
  # The callback compares the token's `urn:zitadel:iam:org:id` claim against
  # this value when it is set. That claim only appears when the authorization
  # request carries an org scope, and the console does NOT send one: scoping
  # login to an organization made Zitadel try to authenticate operators as
  # members of an org none of them belong to, failing with
  # `409 User already exists` (tesserix/tesserix-home#170).
  #
  # So the claim is always absent, and setting this would refuse every login
  # regardless of roles — a gate that can never open.
  #
  # Nothing meaningful is lost. ROLE POSSESSION IS THE CONTROL: the console
  # requires `read` on the platform-console project, granted per user, and
  # Zitadel independently enforces `project_role_check` (a user without a grant
  # cannot authenticate at all). `iam-admin` holds no roles and stays out.
  # ZITADEL_INTERNAL_ORG_ID: ""

  # Platform Console project. Requested as an audience scope so the project's
  # roles are guaranteed to appear in the token's role claim. The project and
  # application settings are meant to ensure this too, but those are UI
  # checkboxes and this is one string in code — and when they are wrong the
  # token is perfectly valid and simply carries no roles, which reads as an
  # application bug rather than a configuration gap.
  ZITADEL_PROJECT_ID: "386377618200461939"

  # Expected `aud` on a MACHINE access token — a Zitadel service user calling
  # /api/v1/plan-catalog (tesserix-home#427). Read off a real token minted for
  # `mark8ly-catalog-reader`, not inferred: a client_credentials token requested
  # with the reserved `…:project:<id>:aud` scope carries the PROJECT id here.
  #
  # It equals ZITADEL_PROJECT_ID above, and that is a coincidence of this
  # deployment rather than a rule — `aud` says who a token is for, the project
  # id says whose roles it carries. They are separate variables so that a future
  # deployment where they diverge does not silently authenticate the wrong thing.
  #
  # Deliberately NOT ZITADEL_CLIENT_ID: that is console-web's OIDC client id,
  # what an OPERATOR's browser token carries. Defaulting this to it would let a
  # browser-flow token that reached the machine path pass as a service
  # credential. `verifyMachineAuthHeader` refuses to start without this value
  # and refuses again if it is empty, because jose skips the `aud` comparison
  # entirely when the configured audience is falsy.
  ZITADEL_MACHINE_AUDIENCE: "386377618200461939"

  # ZITADEL_ORG_ID pins login to the operators' organization.
  #
  # # Why it is set, after being set and reverted once
  #
  # An unscoped login resolves the login name in the INSTANCE DEFAULT
  # ORGANIZATION. When this was written that default was `ZITADEL`
  # (386261254651576970), held there deliberately by charts/apps/zitadel-bootstrap.
  #
  # CORRECTED 2026-08-28: it is now `TESSERIX` (386377229942128837).
  # zitadel-bootstrap declares `defaultOrg: TESSERIX` and the live instance
  # agrees, so the paragraph below describing a mismatch between the default org
  # and where the operators live no longer applies.
  #
  # Keep this pin anyway. It is what makes the console's login independent of an
  # instance-wide setting a bootstrap job reconciles on its own schedule — which
  # is exactly the property #290's acceptance asked for. Unpinning it would make
  # console login break the next time the default org moves.
  #
  # The operators live in `TESSERIX` (386377229942128837). So without this
  # scope the console asks Zitadel to find an operator in an organization that
  # does not contain one, and with "Ignore unknown Usernames" enabled on the
  # login policy that failure has no error text: it accepts the password and
  # returns to the password screen.
  #
  # # Why the first attempt looked like it made things worse
  #
  # It was reverted on the evidence that setting it produced exactly that
  # symptom. The symptom was real; the cause was not the scope. Verified
  # against the live instance on 2026-08-19:
  #
  #   - There is exactly ONE user for the operator's email, and it is in
  #     TESSERIX. Not a duplicate, not in the default org.
  #   - It holds all eleven platform-console roles, so the project's
  #     "Only authorized users can authenticate" check (projectRoleCheck=True)
  #     passes.
  #
  #     CORRECTED 2026-08-28: platform-console now reads projectRoleCheck=FALSE
  #     on the live instance, so Zitadel no longer refuses a role-less user a
  #     token for this project. The console is not open as a result — the
  #     middleware below independently requires the `read` capability — but the
  #     Zitadel-side half of that gate is off, and this comment should not be
  #     read as evidence that it is on.
  #   - It has no passkey, no IdP link and no MFA factor, so a password is its
  #     only credential — and `passwordChanged` is 05:10:42Z on 2026-08-19,
  #     AFTER the scope was set, tested and reverted.
  #
  # The account had no usable password at the moment it was tested. That is the
  # runbook's first trap — removing an IdP link before setting a password
  # leaves no credential — landing on the diagnosis rather than on the login.
  #
  # # The reference that argued against it does not argue against it
  #
  # helivanta authenticates the same operator on the same instance with no org
  # scope. It differs in the one way that matters: its application is on
  # Login V2 (`loginVersion: loginV2`, baseUri https://helivanta.app), which
  # resolves the organization from the application's own project. `console-web`
  # is on Login V1, which uses the instance default. Same org, same user, two
  # different resolution paths — so "helivanta works without it" was never
  # evidence that the console could.
  #
  # # What this buys
  #
  # The console stops depending on an instance-wide setting that a bootstrap
  # job actively holds at the wrong value for it. #290's acceptance asks for
  # exactly that, and for the property to be verified by changing the instance
  # default and confirming login still works.

  ZITADEL_ORG_ID: "386377229942128837"

  # THE SWITCH — now on. Comment out to revert; reverting takes effect on the
  # next pod restart and needs no code rollback.
  #
  # Two things change when this is set:
  #   1. Unauthenticated visitors go to the console's OWN /auth/login (Zitadel)
  #      instead of being bounced to the web app's login.
  #   2. The middleware starts REQUIRING the `read` capability on every request,
  #      rather than accepting any valid `.tesserix.app` session. That is the
  #      internal-only gate: the cookie is scoped to the shared parent domain,
  #      so without this any session the web app mints would be accepted here.
  #
  # Verified against prod before enabling (a real login completed end to end):
  #   - project "Return user roles during authentication" ON
  #   - application Token Settings: "User roles inside ID token" ON,
  #     "User Info inside ID token" ON  (without the latter the token carries
  #     no email and verification fails with `invalid_id_token`)
  #   - project org-restriction OFF — operators live in a different org from the
  #     project, so it rejected everyone with `ProjectRequired`
  #   - both operators hold all seven roles on platform-console
  #
  # ANYONE WITHOUT THE `read` ROLE LOSES ACCESS THE MOMENT THIS DEPLOYS.
  AUTH_PROVIDER: "zitadel"

  # Recover a callback that arrives with no `state` cookie by bouncing it ONCE
  # through /auth/login, instead of dead-ending on `{"error":"state_mismatch"}`.
  #
  # WHY IT WAS OFF, AND WHY THAT REASON HAS EXPIRED. `auth/callback/route.ts`
  # makes this opt-in "because the writer of the guard (/auth/login) may not be
  # on every pod yet during a rollout" — a half-rolled deployment could bounce a
  # browser to a pod that does not set the cookie, and loop. That was a rollout
  # concern, not a permanent one: the route has been on every console pod since
  # tesserix-home#295 (2026-08-20), and both pods now run the same image.
  #
  # WHAT IT FIXES, observed 2026-08-30. An operator reaching
  # /login?authRequest=... directly — a bookmark, a tab left open, or Zitadel
  # resuming an earlier auth request — never passes through /auth/login, so no
  # `state` cookie is ever written. The callback then sees `cookieNames:
  # ['cf_clearance']` and refuses. The login was otherwise entirely valid; the
  # only thing missing was the CSRF guard for a leg the browser never started.
  #
  # THE LOOP GUARDS STAY. `retryRefusal()` still refuses when a retry has
  # already happened (`state.retried`, which rides inside Zitadel's `state` and
  # so survives the cookieless request being recovered from — a cookie marker
  # would be absent on exactly those requests, fail open, and spin forever),
  # and when the request is a speculative prefetch rather than a navigation.
  # At most ONE extra round trip, then the same error as before.
  CONSOLE_CALLBACK_RETRY: "true"

# External Secrets Configuration (GCP Secret Manager → K8s Secrets)
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# GCP Secret Manager configuration
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "tesserix"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# ConfigMap for additional non-secret configuration. Empty by default; kept so
# operator tweaks have somewhere to land without a chart change.
configMap:
  enabled: false
  data: {}

# Pod Disruption Budget — no minAvailable: with a single replica,
# minAvailable: 1 pins disruptionsAllowed at 0 and blocks every node
# drain/scale-down. The template falls back to maxUnavailable: 1.
pdb:
  enabled: true

# tesserix-postgres — the console's own store.
#
# Same cluster, same database and the SAME Secret the company deployment reads
# (charts/apps/company/values.yaml). Nothing new is provisioned here: the
# console is a second reader of a store it co-owns, not a new tenant of it.
#
# Used for the notification bell's per-operator last-seen timestamp, and for
# reading the ticket/reply rows the bell derives its feed from. Everything else
# the console shows still comes through the web app's admin API.
#
# .enabled gates the env block, so the chart still renders where the Secret is
# absent — and the console degrades to a quiet, disabled bell rather than
# failing to start.
database:
  tesserix:
    enabled: true
    host: tesserix-postgres-rw.tesserix.svc.cluster.local
    port: 5432
    name: tesserix_admin
    secretName: tesserix-postgres-tesserix-admin

# ---------------------------------------------------------------------------
# Plan-catalog parity check (#326 P1a) — the nightly CronJob.
#
# WHAT TURNING THIS ON STARTS. It is not "enable a job". Flipping `enabled` to
# true does two irreversible-ish things at once:
#
#   1. It STARTS THE 7-DAY CLOCK. Each nightly run writes one row into
#      `plan_catalog_parity_runs`, and #327 revokes mark8ly's Stripe WRITE key
#      on the evidence of seven consecutive clean days of those rows. The first
#      run is day one; there is no dry-run mode, because a run that did not
#      record would not be a run.
#   2. It ADDS the per-mode STRIPE_RESTRICTED_READ_KEY_* entries to the
#      ExternalSecret, which means ESO starts resolving them in GCP Secret
#      Manager.
#
# PRECONDITION, AND IT IS A LIVE-SYSTEM STATE RATHER THAN A MERGED PR: every
# GSM secret named below must already EXIST in project tesseracthub-480811, as
# a Stripe restricted key with read on Prices and nothing else. ESO resolves
# the ExternalSecret's `data` as a unit — one missing remoteRef parks the whole
# thing in SecretSyncedError. The already synced Secret is retained, so the
# console keeps serving, but it STOPS REFRESHING: a later SESSION_ENCRYPT_KEY
# rotation would then never reach the console, and that failure looks like an
# unexplained login loop rather than an error. Create the GSM secret first,
# confirm it, then name it here.
#
# THAT IS WHY EACH MODE IS NAMED SEPARATELY AND EMPTY MEANS "NOT WIRED": test
# and live are separate Stripe accounts with separately provisioned
# credentials, and as of 2026-08-27 only test's exists. One combined switch
# would make wiring test wait on a live key that is nobody's decision here
# (mark8ly#371) — and pointing at the absent live secret anyway is exactly the
# SecretSyncedError above.
#
# Off by default so the chart renders — and this key's absence stays harmless —
# anywhere that is not prod. Prod turns it on in values-prod.yaml.
parityCheck:
  enabled: false

  # GSM secrets holding the per-mode restricted keys, one per Stripe mode.
  # Named here rather than inlined in the template so a rotation to a
  # differently-named secret is a values change. Only read when `enabled`.
  #
  # ONE VARIABLE PER MODE, AND THE SUFFIX IS NOT COSMETIC. #378 split the
  # check across both Stripe modes, and `stripe-read.ts`'s KEY_ENV names
  # STRIPE_RESTRICTED_READ_KEY_TEST and STRIPE_RESTRICTED_READ_KEY_LIVE. An
  # unsuffixed STRIPE_RESTRICTED_READ_KEY is read by NOTHING: the check throws
  # `... is not set` for both modes and writes two `failed` rows a night,
  # forever, while looking correctly configured. That is what this chart
  # shipped between 0293afa6 and this change.
  #
  # EMPTY STRING MEANS "NOT WIRED YET" — the entry is omitted from the
  # ExternalSecret and the CronJob entirely, rather than referencing a GSM
  # secret that does not exist. See the ESO note above for why a dangling
  # reference is worse than an absent one.
  #
  # A mode with no key still gets a row: `failed`, naming its own variable.
  # That is deliberate (`stripe-read.ts`: the two modes are independently
  # optional) — live having no credential for months must cost live's row and
  # nothing else, because taking test down with it would forfeit every clean
  # day test has accumulated.
  stripeSecretKeyTest: prod-tesserix-stripe-restricted-read-key-test

  # The MAIN Tesserix account's live mode, `acct_1SgwbFCyiazmanuP`, confirmed
  # against the dashboard on 2026-08-28 rather than inferred from a secret's
  # name — which matters here more than usual, because this key names the
  # account a future bootstrap would create 42 real prices in.
  #
  # THE NAME `prod-tesserix-stripe-restricted-read-key` MISLED FOR A WHILE.
  # It holds this same `rk_live_` key, and an earlier note recorded its account
  # as a legacy "test mode" one holding nothing — a description of that
  # account's TEST side, not of the account. A Stripe account is one id with
  # both modes; `acct_1SgwbFCyiazmanuP` is the main account, and
  # `acct_1SgwbhE1SGxvhzVd` ("Tesserix sandbox") is a sandbox hanging off it.
  #
  # WHICH ACCOUNT HOLDS THE CATALOG DEPENDS ON THE MODE, and this note used to
  # say only "the sandbox holds the 42-price catalog today", which reads as
  # though live's catalog lived there too. Both keys were probed on
  # 2026-08-30, and each reports its own account:
  #
  #   ..._LIVE -> acct_1SgwbFCyiazmanuP   42 active prices, all 42 mark8ly-keyed
  #   ..._TEST -> acct_1SgwbhE1SGxvhzVd   43 active prices, 42 mark8ly-keyed
  #
  # So the sandbox holds the TEST catalog and the main account's LIVE mode
  # holds the live one. That matches the cutover runbook, which says the 42
  # prices were bootstrapped into acct_1SgwbFCyiazmanuP; the two documents
  # were not in conflict, they were describing different modes.
  #
  # The sandbox's 43rd price is a GBP price carrying NO lookup key. It is not
  # ours and is not an orphan: `findOrphans` intersects "archived in our log"
  # with "active in Stripe", and our log has never touched it. It is the
  # reason MARK8LY_LOOKUP_KEY_PREFIX filtering is load-bearing rather than
  # decorative — the account is genuinely shared.
  #
  # Live reads as `not_bootstrapped` until the catalog is bootstrapped there:
  # zero `mark8ly_` prices, verified through this key. That is the honest
  # "nothing here yet" and it exits 0, so the nightly Job stops showing red for
  # a mode nobody has launched.
  stripeSecretKeyLive: prod-tesserix-stripe-restricted-read-key-live

  # Daily, 02:15 UTC. See the long note in
  # templates/parity-check-cronjob.yaml for why the cadence is exactly one run
  # per day and why the timezone is pinned rather than inherited from
  # kube-controller-manager.
  schedule: "15 2 * * *"
  timeZone: "Etc/UTC"

  # A day of finished pods, so the morning after can read the job's single JSON
  # log line without going to the table.
  ttlSecondsAfterFinished: 86400

  # Backstop for a Stripe socket that never answers — not the exit mechanism,
  # which the script owns. Ten minutes: far above a real run (seconds), far
  # below the next tick.
  activeDeadlineSeconds: 600

  # Enough history to answer "did last week hold?" from kubectl alone.
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7

  # Memory only, per project convention. One pg connection and one page of
  # Stripe Prices at a time.
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

# Publishing the plan catalog to Stripe (tesserix-home#327).
#
# SEPARATE FROM `parityCheck` ON PURPOSE. The parity check OBSERVES Stripe and
# must never be able to change it; publishing is the one path that does change
# it. Folding the write key into `parityCheck` would put the credential that
# mutates Stripe under a flag whose whole meaning is "watch Stripe", and the
# next person reading `parityCheck.enabled: true` would have no reason to
# suspect it also granted write. Two concerns, two switches.
#
# OFF BY DEFAULT, and on only where an overlay says so. `enabled: false` here
# means no non-prod environment mounts a live write key by inheriting a
# default, which is the failure this default exists to prevent.
#
# TURNING THIS ON IS THE ACT OF UNBLOCKING LIVE PUBLISHING. Two other things
# must already be true or it will not help:
#   1. `plan_catalog_publish_attempts` / `_operations` must be owned by the
#      console's DB role. They were owned by `postgres` with no grants until
#      tesserix-home#437, so a publish failed at its FIRST WRITE with a
#      Postgres permission error, before Stripe was ever called. Provisioning
#      a Stripe key would not have helped.
#   2. The operator must hold the `publish-catalog` capability; `actions.ts`
#      re-checks it server-side regardless of what the UI offers.
#
# ROLLOUT IS REQUIRED. The Deployment receives this through `envFrom`, which
# the kubelet resolves once at container start — updating the Secret does not
# mutate a running container's environment. ESO's refreshInterval is 1h, so
# worst case is that hour plus a `kubectl rollout restart deploy/console`.
publishCatalog:
  enabled: false
  # GSM secret holding the live-mode Stripe WRITE key, in
  # tesseracthub-480811. VERIFIED 2026-08-30 against the live API, without
  # creating anything: it is an `rk_live_` restricted key on
  # acct_1SgwbFCyiazmanuP (the prod account), it is a DIFFERENT credential
  # from `prod-tesserix-stripe-restricted-read-key-live` (different SHA256),
  # and it holds write on both Products and Prices — `POST /v1/products` with
  # an empty body answers `Missing required param: name`, a validation error,
  # where a read-only key answers `more_permissions_required`.
  #
  # `stripe-write.ts`'s `announcedMode()` refuses a key whose prefix
  # contradicts its slot, so an `rk_test_` value here fails loudly with
  # "holds a test mode key but is read as the live mode credential" rather
  # than publishing the live catalog into a sandbox.
  stripeWriteKeyLive: prod-tesserix-stripe-write-key-live

# Rollout strategy. Unset, Kubernetes defaults to 25%/25%, which for any small
# replica count rounds to maxSurge 1 / maxUnavailable 0 — the surge-first shape
# that deadlocks a rollout on a memory-saturated cluster (#709), silently,
# while the Deployment still reports Available=True because the old pods keep
# serving. Defaulted here so an overlay that says nothing inherits the safe
# behaviour rather than the deadlocking one; `values-prod.yaml` restates it
# explicitly, with the replica-count reasoning that makes it free there.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
