{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "console.fullname" . }}-secrets
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "console.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # SHARED SECRET — TWO CONSUMERS. This is the ONLY secret the console needs,
    # and it is deliberately the same GSM key the company deployment reads
    # (charts/apps/company/templates/externalsecret.yaml, same secretKey).
    #
    # WHY THEY MUST MATCH. The web app (Deployment/company, tesserix.app) mints
    # the tx_session cookie; the console (Deployment/console,
    # console.tesserix.app) only ever VERIFIES it — see
    # packages/platform-auth/src/session-jwt.ts, which derives the JWE key from
    # SESSION_ENCRYPT_KEY in both processes. Different values means the console
    # rejects every cookie the web app issued and bounces the operator back to
    # /login in a loop, with no error anywhere to explain it.
    #
    # ROTATION: rotating prod-tesserix-session-encrypt-key rotates it for BOTH
    # `company` and `console` at once. Roll both Deployments together — a
    # restart of one alone leaves the pair on different keys and silently
    # breaks console login until the other catches up. (Same coupling, and the
    # same rule, as INTERNAL_API_TOKEN shared between tesserix-home and
    # mark8ly-admin.)
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-tesserix-session-encrypt-key
    # Zitadel OIDC client secret for the `console-web` application.
    #
    # NOT shared with anything else, deliberately. The web app's Google client
    # secret (prod-mark8ly-oauth-client-secret) already serves three consumers
    # — apps/web, mark8ly and the mobile admin sign-in — so rotating it is a
    # coordinated outage. The console's front door should be rotatable on its
    # own.
    #
    # Inert until AUTH_PROVIDER=zitadel: the login and callback routes read it
    # only on that path, so syncing it early is safe and lets the secret be
    # verified in place before the cutover.
    - secretKey: ZITADEL_CLIENT_SECRET
      remoteRef:
        key: prod-zitadel-console-client-secret
    # Encrypts the Zitadel access and refresh tokens at rest in
    # `operator_api_tokens` (tesserix-home migration 0029).
    #
    # WHY THERE IS A SECOND KEY AT ALL. The obvious move is to reuse
    # SESSION_ENCRYPT_KEY, and it would work — and it would couple two things
    # that must be rotatable apart. SESSION_ENCRYPT_KEY is SHARED WITH
    # `company` above: rotating it signs every operator out of both surfaces at
    # once. The token key is the console's alone, so rotating it costs only the
    # platform API, and a leak of one key does not hand over the other.
    #
    # ROTATION IS NOT FREE, and it is not symmetric with the key above.
    # Every row in operator_api_tokens is sealed with AES-256-GCM under the old
    # value; after a rotation every one of them fails its auth tag and decrypts
    # to null. That is the correct fail-closed behaviour, not a bug — but it
    # means a rotation should be paired with `DELETE FROM operator_api_tokens`,
    # or the logs fill with decrypt failures and operators silently lose
    # platform-API access until each of them signs in again. Sessions themselves
    # survive: identity lives in the cookie, not in this table.
    #
    # Inert until the console reads it: `lib/auth/operator-token-store.ts`
    # degrades to null when this is unset rather than throwing, so syncing it
    # early is safe and lets the value be verified in place before the code
    # that needs it deploys.
    - secretKey: OPERATOR_TOKEN_ENCRYPT_KEY
      remoteRef:
        key: prod-console-operator-token-key
    # Drives Zitadel's session API for the console's OWN login page
    # (apps/console/app/login, read by lib/auth/zitadel-login-client.ts).
    #
    # WHAT THIS TOKEN IS. A PAT for the `console-login-client` machine user,
    # which holds the instance-level IAM_LOGIN_CLIENT role. That role mints
    # sessions WITHOUT a password, for ANY user in the instance. It is the most
    # privileged credential the console holds — treat a leak as "rotate now",
    # not "rotate at the next window".
    #
    # WHY NOT REUSE `helivanta-login-client`. It exists, in this same org, with
    # this same role, and it would work. It is deliberately not reused: its PAT
    # lives in OpenBao rather than GSM, so sharing would mean a second copy that
    # drifts on rotation; rotating either product's token would break the
    # other's login; and a compromise of either namespace would yield
    # session-minting power for both. Helivanta holds patient records and the
    # console gates payment-key rotation — neither should be able to mint the
    # other's sessions. Same argument the ZITADEL_CLIENT_SECRET comment above
    # makes, with a larger blast radius.
    #
    # INERT UNTIL ZITADEL ROUTES TO US. The `/login` page only serves when the
    # `console-web` application is on Login V2 with base URI
    # https://console.tesserix.app; until then Zitadel uses its own hosted UI at
    # /ui/login/login and nothing reads this. `loginClientConfig()` returns null
    # when it is unset, so syncing it early is safe and lets the value be
    # verified in place before the cutover.
    - secretKey: ZITADEL_LOGIN_CLIENT_TOKEN
      remoteRef:
        key: prod-console-login-client-token
{{- if .Values.parityCheck.enabled }}
    # Stripe credential for the plan-catalog parity check (#326 P1a), read by
    # BOTH consumers of `performParityCheck()`: the nightly CronJob
    # (templates/parity-check-cronjob.yaml) and the operator-triggered
    # `POST /api/internal/parity-check` on the Deployment. Unset, the check
    # still runs and still records a row — a `failed` one, every single time,
    # which is a week of holes in the window rather than a visible outage.
    #
    # A RESTRICTED KEY, WITH READ ON PRICES AND NOTHING ELSE. Not an oversight
    # and not merely least-privilege hygiene: #327 revokes mark8ly's Stripe
    # WRITE key on the strength of a clean 7-day window from this check. A
    # check that could itself write to Stripe would be evidence that the
    # catalog and Stripe agree only because the checker can make them agree —
    # it would undercut the very argument it exists to support. The read-only
    # property therefore has to hold at the CREDENTIAL layer, where it is a
    # fact about the key rather than a claim about the code.
    #
    # ROTATION IS CHEAP, unlike the two keys above. Nothing is encrypted under
    # it and no session depends on it: a stale value costs one `failed` row per
    # night until the pods pick up the new one, and the next clean run resumes
    # the window. Rotate freely.
    #
    # ONE ENTRY PER STRIPE MODE, EACH GATED ON ITS OWN NAME BEING SET, BECAUSE
    # THE GSM SECRETS ARE PROVISIONED SEPARATELY AND MAY NOT EXIST. ESO
    # resolves `data` as a unit: one unresolvable remoteRef puts the whole
    # ExternalSecret into SecretSyncedError, and while the existing target
    # Secret is retained (creationPolicy: Owner, deletionPolicy Retain, so
    # nothing here goes dark), it STOPS REFRESHING — a later rotation of
    # SESSION_ENCRYPT_KEY would then never reach the console, and the failure
    # mode of that is a silent login loop, not an error.
    #
    # So an empty name omits the entry rather than referencing an absent
    # secret, and setting a name is the assertion that it has been created in
    # tesseracthub-480811. Check the precondition, not the merge.
    #
    # THE `_TEST` / `_LIVE` SUFFIXES MATCH `stripe-read.ts`'s KEY_ENV EXACTLY.
    # An unsuffixed STRIPE_RESTRICTED_READ_KEY is read by nothing and yields
    # two `failed` rows a night while looking configured.
    {{- if .Values.parityCheck.stripeSecretKeyTest }}
    - secretKey: STRIPE_RESTRICTED_READ_KEY_TEST
      remoteRef:
        key: {{ .Values.parityCheck.stripeSecretKeyTest | quote }}
    {{- end }}
    {{- if .Values.parityCheck.stripeSecretKeyLive }}
    - secretKey: STRIPE_RESTRICTED_READ_KEY_LIVE
      remoteRef:
        key: {{ .Values.parityCheck.stripeSecretKeyLive | quote }}
    {{- end }}
{{- end }}
{{- end }}
