{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "console.fullname" . }}-secrets
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "console.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # SHARED SECRET — TWO CONSUMERS. This is the ONLY secret the console needs,
    # and it is deliberately the same GSM key the company deployment reads
    # (charts/apps/company/templates/externalsecret.yaml, same secretKey).
    #
    # WHY THEY MUST MATCH. The web app (Deployment/company, tesserix.app) mints
    # the tx_session cookie; the console (Deployment/console,
    # console.tesserix.app) only ever VERIFIES it — see
    # packages/platform-auth/src/session-jwt.ts, which derives the JWE key from
    # SESSION_ENCRYPT_KEY in both processes. Different values means the console
    # rejects every cookie the web app issued and bounces the operator back to
    # /login in a loop, with no error anywhere to explain it.
    #
    # ROTATION: rotating prod-tesserix-session-encrypt-key rotates it for BOTH
    # `company` and `console` at once. Roll both Deployments together — a
    # restart of one alone leaves the pair on different keys and silently
    # breaks console login until the other catches up. (Same coupling, and the
    # same rule, as INTERNAL_API_TOKEN shared between tesserix-home and
    # mark8ly-admin.)
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-tesserix-session-encrypt-key
    # Zitadel OIDC client secret for the `console-web` application.
    #
    # NOT shared with anything else, deliberately. The web app's Google client
    # secret (prod-mark8ly-oauth-client-secret) already serves three consumers
    # — apps/web, mark8ly and the mobile admin sign-in — so rotating it is a
    # coordinated outage. The console's front door should be rotatable on its
    # own.
    #
    # Inert until AUTH_PROVIDER=zitadel: the login and callback routes read it
    # only on that path, so syncing it early is safe and lets the secret be
    # verified in place before the cutover.
    - secretKey: ZITADEL_CLIENT_SECRET
      remoteRef:
        key: prod-zitadel-console-client-secret
    # Encrypts the Zitadel access and refresh tokens at rest in
    # `operator_api_tokens` (tesserix-home migration 0029).
    #
    # WHY THERE IS A SECOND KEY AT ALL. The obvious move is to reuse
    # SESSION_ENCRYPT_KEY, and it would work — and it would couple two things
    # that must be rotatable apart. SESSION_ENCRYPT_KEY is SHARED WITH
    # `company` above: rotating it signs every operator out of both surfaces at
    # once. The token key is the console's alone, so rotating it costs only the
    # platform API, and a leak of one key does not hand over the other.
    #
    # ROTATION IS NOT FREE, and it is not symmetric with the key above.
    # Every row in operator_api_tokens is sealed with AES-256-GCM under the old
    # value; after a rotation every one of them fails its auth tag and decrypts
    # to null. That is the correct fail-closed behaviour, not a bug — but it
    # means a rotation should be paired with `DELETE FROM operator_api_tokens`,
    # or the logs fill with decrypt failures and operators silently lose
    # platform-API access until each of them signs in again. Sessions themselves
    # survive: identity lives in the cookie, not in this table.
    #
    # Inert until the console reads it: `lib/auth/operator-token-store.ts`
    # degrades to null when this is unset rather than throwing, so syncing it
    # early is safe and lets the value be verified in place before the code
    # that needs it deploys.
    - secretKey: OPERATOR_TOKEN_ENCRYPT_KEY
      remoteRef:
        key: prod-console-operator-token-key
    # Keys the HMAC that lets an erased CRM contact STAY erased across a
    # re-import (tesserix-home#226).
    #
    # `eraseContact` destroys the email and instagram handle — deliberately,
    # because the unique index is partial and nulling frees the address for a
    # legitimate future contact at the same business. That left no key to match
    # a returning erased person against, so the next CSV import re-created them
    # as a new organisation with a fresh opportunity and no trace of the
    # erasure. What is retained instead is an HMAC of the destroyed
    # identifiers, in `crm_erased_identifiers` — a table with no contact and no
    # organisation column, so it can refuse a match and cannot rebuild who the
    # person was.
    #
    # HMAC rather than salt-then-hash: a per-row random salt cannot be matched
    # against an incoming value, so the key is necessarily fixed and
    # application-wide, and HMAC is the right primitive for a keyed comparison.
    #
    # NOT INERT, unlike OPERATOR_TOKEN_ENCRYPT_KEY above. `eraseContact` THROWS
    # when this is unset: an erasure that succeeds without recording the hash
    # silently loses the ability to enforce itself, and a "forget me" the next
    # import undoes is worse than a refused erasure the operator retries. Sync
    # this before the code that reads it deploys.
    #
    # ROTATION DESTROYS THE REGISTER. Every hash in crm_erased_identifiers was
    # computed under the old key and will never match again — the rows survive
    # and silently protect nobody. There is no re-derivation: the identifiers
    # they were made from were destroyed on purpose. Treat rotation as a
    # decision to abandon every erasure recorded so far, not as routine
    # hygiene.
    - secretKey: CRM_ERASURE_HASH_KEY
      remoteRef:
        key: prod-console-crm-erasure-hash-key
    # Keys the TOTP attempt cooldown (tesserix-home#457): the console counts
    # failed codes per login name and, past a threshold, declines to forward
    # the next attempt to Zitadel — so `maxOtpAttempts: 10` can never be
    # reached fast enough to weaponise the lockout against an operator.
    #
    # ITS OWN KEY, not a share of CRM_ERASURE_HASH_KEY above. Two subsystems on
    # one HMAC key means rotating either invalidates the other's stored values,
    # and these two have nothing in common beyond needing a keyed equality
    # comparison.
    #
    # ROTATION IS CHEAP HERE, unlike the erasure key. The rows this keys live
    # for fifteen minutes; rotating simply resets every in-flight cooldown,
    # which is a nuisance for at most one operator mid-login and not a loss of
    # anything.
    #
    # WITHOUT IT THE COOLDOWN IS SIMPLY NOT IN FORCE. `lib/db/login-throttle.ts`
    # fails OPEN on a missing key, so the symptom is a log line and an absent
    # control rather than a broken login — which is the right direction (a
    # limiter outage must not lock every operator out at once) and also why a
    # missing key is easy not to notice. The GSM secret
    # `prod-console-login-throttle-hash-key` was created before this reference
    # was added, deliberately: ESO resolves `data` as a UNIT, so one dangling
    # remoteRef parks the WHOLE ExternalSecret and takes SESSION_ENCRYPT_KEY
    # down with it.
    - secretKey: LOGIN_THROTTLE_HASH_KEY
      remoteRef:
        key: prod-console-login-throttle-hash-key
    # Drives Zitadel's session API for the console's OWN login page
    # (apps/console/app/login, read by lib/auth/zitadel-login-client.ts).
    #
    # WHAT THIS TOKEN IS. A PAT for the `console-login-client` machine user,
    # which holds the instance-level IAM_LOGIN_CLIENT role. That role mints
    # sessions WITHOUT a password, for ANY user in the instance. It is the most
    # privileged credential the console holds — treat a leak as "rotate now",
    # not "rotate at the next window".
    #
    # WHY NOT REUSE `helivanta-login-client`. It exists, in this same org, with
    # this same role, and it would work. It is deliberately not reused: its PAT
    # lives in OpenBao rather than GSM, so sharing would mean a second copy that
    # drifts on rotation; rotating either product's token would break the
    # other's login; and a compromise of either namespace would yield
    # session-minting power for both. Helivanta holds patient records and the
    # console gates payment-key rotation — neither should be able to mint the
    # other's sessions. Same argument the ZITADEL_CLIENT_SECRET comment above
    # makes, with a larger blast radius.
    #
    # INERT UNTIL ZITADEL ROUTES TO US. The `/login` page only serves when the
    # `console-web` application is on Login V2 with base URI
    # https://console.tesserix.app; until then Zitadel uses its own hosted UI at
    # /ui/login/login and nothing reads this. `loginClientConfig()` returns null
    # when it is unset, so syncing it early is safe and lets the value be
    # verified in place before the cutover.
    - secretKey: ZITADEL_LOGIN_CLIENT_TOKEN
      remoteRef:
        key: prod-console-login-client-token
    # PAT for the `console-identity-reader` machine user (tesserix-home#211,
    # feeding #134), read by the console's cross-product identity lookup.
    #
    # WHAT THIS TOKEN IS NOT. Unlike ZITADEL_LOGIN_CLIENT_TOKEN above, this is
    # deliberately narrow: the user holds ORG_OWNER_VIEWER on TESSERIX only —
    # read-only Management API access, verified against the live instance to
    # list TESSERIX users, and verified DENIED at the instance level
    # (/admin/v1/members/_search) and denied writing (a self-grant of
    # IAM_OWNER returned 403). A leak of this token cannot mint sessions or
    # write anything; it can only read who is in TESSERIX. See
    # docs/zitadel.md.
    #
    # ALREADY PROVISIONED, so this entry is safe to add unconditionally the
    # way ZITADEL_LOGIN_CLIENT_TOKEN is above — not gated behind a values
    # flag the way the parityCheck / publishCatalog Stripe keys below are.
    # ESO resolves `data` as a unit (see the note at the bottom of this file):
    # naming a GSM key that does not exist yet would park the whole
    # ExternalSecret and silently stop SESSION_ENCRYPT_KEY from refreshing
    # too. prod-console-identity-reader-pat already exists (version 1,
    # enabled), so that risk does not apply here.
    - secretKey: ZITADEL_IDENTITY_READER_PAT
      remoteRef:
        key: prod-console-identity-reader-pat
{{- if .Values.parityCheck.enabled }}
    # Stripe credential for the plan-catalog parity check (#326 P1a), read by
    # BOTH consumers of `performParityCheck()`: the nightly CronJob
    # (templates/parity-check-cronjob.yaml) and the operator-triggered
    # `POST /api/internal/parity-check` on the Deployment. Unset, the check
    # still runs and still records a row — a `failed` one, every single time,
    # which is a week of holes in the window rather than a visible outage.
    #
    # A RESTRICTED KEY, WITH READ ON PRICES AND NOTHING ELSE. Not an oversight
    # and not merely least-privilege hygiene: #327 revokes mark8ly's Stripe
    # WRITE key on the strength of a clean 7-day window from this check. A
    # check that could itself write to Stripe would be evidence that the
    # catalog and Stripe agree only because the checker can make them agree —
    # it would undercut the very argument it exists to support. The read-only
    # property therefore has to hold at the CREDENTIAL layer, where it is a
    # fact about the key rather than a claim about the code.
    #
    # ROTATION IS CHEAP, unlike the two keys above. Nothing is encrypted under
    # it and no session depends on it: a stale value costs one `failed` row per
    # night until the pods pick up the new one, and the next clean run resumes
    # the window. Rotate freely.
    #
    # ONE ENTRY PER STRIPE MODE, EACH GATED ON ITS OWN NAME BEING SET, BECAUSE
    # THE GSM SECRETS ARE PROVISIONED SEPARATELY AND MAY NOT EXIST. ESO
    # resolves `data` as a unit: one unresolvable remoteRef puts the whole
    # ExternalSecret into SecretSyncedError, and while the existing target
    # Secret is retained (creationPolicy: Owner, deletionPolicy Retain, so
    # nothing here goes dark), it STOPS REFRESHING — a later rotation of
    # SESSION_ENCRYPT_KEY would then never reach the console, and the failure
    # mode of that is a silent login loop, not an error.
    #
    # So an empty name omits the entry rather than referencing an absent
    # secret, and setting a name is the assertion that it has been created in
    # tesseracthub-480811. Check the precondition, not the merge.
    #
    # THE `_TEST` / `_LIVE` SUFFIXES MATCH `stripe-read.ts`'s KEY_ENV EXACTLY.
    # An unsuffixed STRIPE_RESTRICTED_READ_KEY is read by nothing and yields
    # two `failed` rows a night while looking configured.
    {{- if .Values.parityCheck.stripeSecretKeyTest }}
    - secretKey: STRIPE_RESTRICTED_READ_KEY_TEST
      remoteRef:
        key: {{ .Values.parityCheck.stripeSecretKeyTest | quote }}
    {{- end }}
    {{- if .Values.parityCheck.stripeSecretKeyLive }}
    - secretKey: STRIPE_RESTRICTED_READ_KEY_LIVE
      remoteRef:
        key: {{ .Values.parityCheck.stripeSecretKeyLive | quote }}
    {{- end }}
{{- end }}
{{- if .Values.publishCatalog.enabled }}
    # Stripe WRITE credential for publishing the plan catalog (#327), read by
    # `stripe-write.ts`'s WRITE_KEY_ENV. Mounted ONLY by the Deployment.
    #
    # THIS IS A DELIBERATE POLICY CHANGE, and the note it replaces said so in
    # the other direction: until 2026-08-30 this chart mounted no write key at
    # all, so a console publish could not reach Stripe even in principle. That
    # was the correct posture while live publishing was blocked. Turning it on
    # is #327's actual intent, and `publishCatalog.enabled` is the switch that
    # makes it an explicit act in an overlay rather than a side effect of a
    # value happening to be non-empty.
    #
    # THE PARITY CHECKER STILL CANNOT WRITE, and that is structural, not a
    # promise. #327 revokes mark8ly's write key on the strength of 7 clean
    # parity days, and that evidence is only worth anything if the checker
    # could not have made the two sides agree itself. The property survives
    # this change because the two consumers of `console-secrets` project it
    # DIFFERENTLY:
    #
    #   - the CronJob (`parity-check-cronjob.yaml`) enumerates its environment
    #     explicitly, one `secretKeyRef` per variable, and names only the two
    #     STRIPE_RESTRICTED_READ_KEY_* keys. A key added here does not reach
    #     it. That template already refuses `envFrom` on purpose, to keep
    #     ZITADEL_LOGIN_CLIENT_TOKEN away from an unattended job; the same
    #     refusal is what keeps the write key away from the checker.
    #   - the Deployment projects every key via `envFrom`, which is how the
    #     console — the thing an operator drives, behind the
    #     `publish-catalog` capability — receives it.
    #
    # If the CronJob is ever switched to `envFrom`, this separation dies
    # silently and #327's revocation argument dies with it. Do not.
    #
    # THE `_TEST` SIBLING NOW EXISTS (tesserix-home#540). This block used to
    # say there was none, because no GSM secret backed STRIPE_WRITE_KEY_TEST
    # and a publish to test therefore failed before it started — the mode
    # meant to be the safe rehearsal was the only one that did not work.
    #
    # It is gated on the value being set, not merely on `publishCatalog`, so
    # the precondition that comment insisted on is enforced by the chart
    # rather than remembered: an installation without the GSM secret leaves
    # the value empty and emits no entry. That matters because ESO resolves
    # `data` as a unit — one dangling remoteRef parks the whole
    # ExternalSecret and stops it refreshing SESSION_ENCRYPT_KEY.
    #
    # The CronJob separation above is unaffected: it enumerates its own
    # environment and names only the two read keys, so neither write key
    # reaches the parity checker. That is what keeps #327's revocation
    # argument true, and it stays structural rather than a promise.
    - secretKey: STRIPE_WRITE_KEY_LIVE
      remoteRef:
        key: {{ .Values.publishCatalog.stripeWriteKeyLive | quote }}
{{- if .Values.publishCatalog.stripeWriteKeyTest }}
    - secretKey: STRIPE_WRITE_KEY_TEST
      remoteRef:
        key: {{ .Values.publishCatalog.stripeWriteKeyTest | quote }}
{{- end }}
{{- end }}
{{- end }}
