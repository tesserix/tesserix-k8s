apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "console.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 3000 }}
              protocol: TCP
          {{- if .Values.externalSecrets.enabled }}
          # SESSION_ENCRYPT_KEY arrives here — see templates/externalsecret.yaml
          # for why it must be the same value the company deployment gets.
          #
          # STRIPE_RESTRICTED_READ_KEY_TEST / _LIVE ARRIVE HERE TOO, and they
          # are needed on THIS pod as well as on the CronJob's. `POST /api/internal/parity-check`
          # (app/api/internal/parity-check/route.ts) is the operator-triggered
          # "run it now", and it calls the SAME `performParityCheck()` the
          # nightly job does. Without the key on the Deployment that route does
          # not error politely — it records a `failed` row in
          # plan_catalog_parity_runs on every press, polluting the 7-day window
          # that #327's revocation decision reads.
          #
          # They need no entries of their own below: this envFrom projects EVERY key
          # in the console-secrets Secret, so the key appears the moment the
          # ExternalSecret syncs them, and they are simply absent while
          # parityCheck.enabled is false or a mode's secret name is empty. An explicit `env` + secretKeyRef with
          # optional: true would render the identical result and add a second
          # place to keep in step with the ExternalSecret, so it is deliberately
          # not written.
          envFrom:
            - secretRef:
                name: {{ include "console.fullname" . }}-secrets
          {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcp.projectId | quote }}
            {{- end }}
            {{- if .Values.database.tesserix.enabled }}
            # tesserix-postgres — notification state + the bell's feed.
            # Host/port/name are static; user+password come from the
            # tesserix-postgres-tesserix-admin Secret synced by ESO.
            - name: TESSERIX_DB_HOST
              value: {{ .Values.database.tesserix.host | quote }}
            - name: TESSERIX_DB_PORT
              value: {{ .Values.database.tesserix.port | quote }}
            - name: TESSERIX_DB_NAME
              value: {{ .Values.database.tesserix.name | quote }}
            - name: TESSERIX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.tesserix.secretName | quote }}
                  key: username
            - name: TESSERIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.tesserix.secretName | quote }}
                  key: password
            {{- end }}
          {{- if and .Values.livenessProbe .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 5 }}
          {{- end }}
          {{- if and .Values.readinessProbe .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.readinessProbe.httpGet }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: http
            {{- else }}
            # tcpSocket, not httpGet: the console has no health route, and
            # every real path is session-gated. A successful TCP accept is
            # exactly the signal a rollout needs — "Next.js is listening" —
            # and needs no application change to obtain.
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
