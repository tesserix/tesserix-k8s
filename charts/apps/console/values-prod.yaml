# Production overrides for console (Tesserix Platform Console).
# Use with: helm upgrade --values values.yaml --values ../global-config-prod.yaml --values values-prod.yaml
#
# ORDER IS LOAD-BEARING — see the note in argocd/prod/apps/global/console.yaml.

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-console
  tag: "latest"

# Two replicas so a deploy or a node drain does not black-hole the surface for
# the length of an image pull, which is what a single replica did to
# tesserix.app (see charts/apps/company/values-prod.yaml).
replicaCount: 2

# Replace before surging, so a rollout frees a pod's memory before it needs the
# replacement's (#709) — the same remedy as mark8ly (#725), temporal (#538) and
# devai (#600).
#
# THIS BLOCK USED TO SAY maxUnavailable 0 / maxSurge 1, described as
# "zero-downtime". The intent was right and the mechanism was wrong ABOVE ONE
# REPLICA: maxSurge 1 means the new pod must SCHEDULE BEFORE any old one dies,
# so a roll transiently needs three pods' worth of memory for a two-pod
# Deployment. On a cluster whose memory requests sit near 100% the third pod
# pends forever and the rollout deadlocks — while the Deployment still reports
# Available=True, because the old pods keep serving. That is exactly what
# happened on 2026-08-30: `console` sat at `0/6 nodes are available:
# Insufficient memory` with `max node group size reached`, and needed manual
# intervention that briefly dropped it to one available replica.
#
# STILL ZERO-DOWNTIME HERE, and that is the point — this is not the tradeoff
# #725 accepted for its single-replica services. `replicaCount: 2` above means
# maxUnavailable 1 takes exactly one pod down at a time and ALWAYS leaves one
# serving. The rollout never needs capacity beyond what the Deployment already
# occupies, so it completes on a full cluster instead of hanging on it. A
# single-replica service would pay a brief 503 for this; a two-replica one
# pays nothing.
#
# IF replicaCount EVER DROPS TO 1, this becomes the honest tradeoff #725
# documents rather than a free win: deploys that always complete, at the cost
# of a short gap. Do not "restore" maxSurge 1 to avoid that gap — the deadlock
# it reintroduces is silent, and a stuck rollout is worse than a visible blip.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Preferred, not required: with a hard rule a replacement pod would be
# unschedulable if only one node had room. (This note used to say "the surge
# pod"; with maxSurge 0 there is no surge pod, but the reasoning is unchanged
# for the replacement that takes a terminated pod's place.)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: console

# Readiness is what makes maxUnavailable: 0 mean anything: without it a pod
# counts as available the moment the container starts, so the rollout swaps
# traffic onto a Next.js server that is not listening yet and 503s exactly as
# an unguarded rollout would. No `httpGet` key, so the template renders a
# tcpSocket probe against the container port — no health route required. See
# the note in values.yaml for why liveness stays off.
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  NODE_ENV: "production"
  NEXT_PUBLIC_WEB_URL: "https://tesserix.app"
  WEB_INTERNAL_ORIGIN: "http://company.tesserix.svc.cluster.local"
  PLATFORM_API_ORIGIN: "http://platform-api.tesserix.svc.cluster.local"

# The console makes no GCP API calls of its own — its secrets arrive as env
# vars via the ExternalSecret, which ESO resolves with its own credentials.
# Blanking this overrides global-config-prod.yaml's shared
# app-secrets-marketplace-prod account (project-level secretmanager.admin over
# every secret in the project) so the KSA is not annotated to impersonate an
# account it neither needs nor is trusted by. See the long note in
# charts/apps/company/values-prod.yaml for how that bit the company chart.
gcp:
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "prod"

pdb:
  enabled: true

# The plan-catalog parity check runs in prod, and ONLY in prod — it is the only
# environment with a real Stripe account to compare the catalog against.
#
# ON PURPOSE IN THIS FILE, NOT AS AN ARGOCD HELM PARAMETER. A parameter added
# to an Application's `helm.parameters` in git is a silent no-op that still
# reports Synced, which is how this estate has lost changes before. Values files
# are what the Application actually renders (see the ordering note at the top of
# this file), so this is the only place the flag can be trusted to take effect.
#
# READ THE PRECONDITION IN values.yaml BEFORE CHANGING. Both GSM secrets named
# by `stripeSecretKeyTest` / `stripeSecretKeyLive` must exist in
# tesseracthub-480811 before they are named here — ESO resolves `data` as a
# unit, so a dangling reference parks the whole ExternalSecret.
#
# SATISFIED AS OF 2026-08-28: both exist, both are restricted keys that were
# verified UNABLE TO WRITE, and both modes report `clean`. Day one of the 7-day
# window #327's Stripe write-key revocation rests on is 2026-08-27 (test) and
# 2026-08-28 (live).
#
# The read-only property is checked at the CREDENTIAL, not claimed by the code:
# a checker that could write to Stripe would be evidence that the catalog and
# Stripe agree only because the checker can make them agree. The live write key
# is a SEPARATE credential (`prod-tesserix-stripe-write-key-live`).
#
# UNTIL 2026-08-30 THIS CHART MOUNTED THAT KEY NOWHERE, and this note said so.
# It is now mounted, by `publishCatalog.enabled` below — tesserix-home#327's
# whole point is that the console can publish the live catalog. What has NOT
# changed is the sentence above it: the parity CHECKER still cannot write.
# That is structural rather than a promise, because the CronJob enumerates its
# environment explicitly and names only the two read keys, while the
# Deployment takes everything via `envFrom`. See the block in
# `templates/externalsecret.yaml`, which spells out why switching the CronJob
# to `envFrom` would silently destroy #327's own evidence.
#
# `prod-tesserix-stripe-restricted-read-key`, named here until 2026-08-28, no
# longer exists: it held a live key that was later widened to write, which made
# a read-only name actively misleading. It was deleted once its value lived in
# the write secret. Do not resurrect the unsuffixed name.
parityCheck:
  enabled: true

# Live catalog publishing — ON here and nowhere else. See `values.yaml`'s
# `publishCatalog` block for what this grants, what else has to be true for a
# publish to succeed, and why it is not folded into `parityCheck`.
publishCatalog:
  enabled: true
