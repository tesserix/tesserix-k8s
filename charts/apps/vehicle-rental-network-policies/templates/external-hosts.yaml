{{- /*
The named external destinations. The NetworkPolicy next door lets nothing off
the cluster except through istio-egress; these are what may travel that route.

A ServiceEntry is a declaration, not a lock — the lock is the NetworkPolicy. Its
value is that the list of who we talk to is written down, reviewable in a diff,
and visible in the mesh's telemetry rather than inferred from an incident.
*/ -}}
{{- range .Values.externalHosts }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: vehicle-rental-{{ .name }}
  namespace: {{ $.Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  hosts:
    {{- toYaml .hosts | nindent 4 }}
  location: MESH_EXTERNAL
  # DNS, not NONE: these hosts sit behind CDNs whose addresses change, which is
  # the reason the allow-list could not be written as CIDRs in the first place.
  resolution: DNS
  ports:
    - number: 443
      name: https
      protocol: TLS
{{- end }}
