{{- /*
The lock that matters: nothing outside vehicle-rental may reach
vehicle-rental-data. Not another product, not the platform console, not a
debugging pod. Cross-namespace database access is how a "temporary" dependency
becomes permanent.

cnpg-system is in here because it is not optional — without it the operator
cannot reach pods on 8000 and replicas are simply never created, which presents
as a cluster that stays at one instance for no visible reason.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.dataNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-plane-and-operator
  namespace: {{ .Values.dataNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespace }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 27017
    # CNPG operator and the instances' own replication/status traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dataNamespace }}
    # Prometheus scrapes the CNPG exporter and the pooler metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 9127
---
{{/*
Egress from the data plane is narrow on purpose: DNS, intra-namespace
replication, and the object store the backups go to. A database that can reach
the internet is a database that can exfiltrate to it.

Both GKE metadata endpoints stay reachable — Standard clusters expose the
node-local server at 169.254.169.252:988, while Autopilot/newer dataplanes can
use the Compute-compatible 169.254.169.254:80 address. The plugin sidecar
authenticates to GCS with Workload Identity through one of these endpoints.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-replication-backup
  namespace: {{ .Values.dataNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: {{ .Values.dnsServiceIP }}/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dataNamespace }}
    # GKE's metadata server answers on 80, not 443 — omitting it fails Workload
    # Identity token minting and every backup silently stops archiving.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    # GKE Metadata Server's node-local endpoint on Standard clusters.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 443
