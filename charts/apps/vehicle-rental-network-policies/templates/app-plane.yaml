{{- /*
The app plane is reachable from the edge by design — the storefront is a public
website. So the lock here is weaker than the data plane's on purpose, and the
real boundary is data-plane.yaml.

This chart does NOT own either Namespace object; istio-config does, because it
labels them for the mesh. A prune of this app must not be able to take the
database's PVCs with it.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # No rules: NetworkPolicies are additive, so this is the floor the rules below
  # build on rather than something they override.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-and-platform
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespace }}
        {{- range .Values.allowedSources }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
{{- if .Values.hbone.enabled }}
---
{{/*
Ambient HBONE. istio-config enrols vehicle-rental as ambient, so ztunnel tunnels
every pod-to-pod call over 15008. Without this rule the default-deny above eats
that tunnel and calls time out with no error logged anywhere.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone-15008
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
      from:
        - ipBlock:
            cidr: {{ .Values.podCIDR }}
  egress:
    - ports:
        - protocol: TCP
          port: 15008
      to:
        - ipBlock:
            cidr: {{ .Values.podCIDR }}
{{- end }}
---
{{/*
Default-deny egress. Everything the app plane may reach is enumerated in the
policy below and in values.yaml; there is no 0.0.0.0/0 rule and adding one is a
review failure (vehicle-rental-app#15).

Note what this closes that an ingress-only lock does not: a compromised pod
cannot post the customer table to an address of its choosing, and cannot resolve
a name through a resolver of its choosing either — DNS is pinned to kube-system,
so DNS tunnelling has nowhere to tunnel to.

The metadata IP is not part of this general allow-list. The API has one narrow,
pod-selected exception below because fleet media uses its bound Workload
Identity to write sanitized images to GCS. No web or worker pod can mint a token.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-named
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # The api, the three web apps and the worker talk to each other.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespace }}
    {{- range .Values.egress.inCluster }}
    # {{ .name }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
        {{- if .viaDNSClusterIP }}
        - ipBlock:
            cidr: {{ $.Values.dnsServiceIP }}/32
        {{- end }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
    {{- if .Values.egress.gateway.enabled }}
    # The only route off-cluster. See externalHosts for what may travel it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.egress.gateway.namespace }}
      ports:
        {{- toYaml .Values.egress.gateway.ports | nindent 8 }}
    {{- end }}
---
{{/*
Fleet media is the only app-plane path that needs a Google access token. GKE
Standard exposes the node-local metadata server on 169.254.169.252:988 while
the Compute-compatible endpoint is 169.254.169.254:80. Limit both destinations
to the API pods; NetworkPolicies are additive, so this does not broaden their
remaining egress or grant metadata access to any frontend.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gke-metadata
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vehicle-rental-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
