{{- if .Values.conformance.enabled }}
{{- /*
A policy nobody tested is a policy nobody has. This runs after every sync and
fails the app if either lock has come undone.

It runs in `default` — a third namespace, which is the point: it stands in for
any other product's pod that should not be able to open the rental database.

The assertions are inverted, so read them carefully: this job succeeds when the
connections FAIL. A `nc` that returns 0 here is the incident.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: vehicle-rental-netpol-conformance
  namespace: {{ .Values.conformance.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: vehicle-rental-app
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: {{ .Values.conformance.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              fail=0

              # Each probe is given {{ .Values.conformance.timeoutSeconds }}s. A
              # refused connection returns immediately; a dropped one hangs,
              # which is what a working default-deny looks like.
              refused() {
                if nc -z -w {{ .Values.conformance.timeoutSeconds }} "$1" "$2" 2>/dev/null; then
                  echo "FAIL: reached $1:$2 from {{ .Values.conformance.namespace }} — it should be unreachable"
                  fail=1
                else
                  echo "ok: $1:$2 unreachable"
                fi
              }

              echo "--- the database must not be reachable from another namespace"
              refused {{ .Values.postgres.poolerHost }} 6432
              refused {{ .Values.postgres.clusterHost }} 5432
              refused {{ .Values.postgres.mongoHost }} 27017

              exit $fail
---
{{/*
The other half: from inside the app plane, an unlisted destination must be
unreachable. If this passes while the job above fails, the egress list has been
widened; if it fails on its own, someone added a catch-all.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: vehicle-rental-egress-conformance
  namespace: {{ .Values.appNamespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: vehicle-rental-app
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: {{ .Values.conformance.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              fail=0

              # The app plane is an ambient mesh namespace: ztunnel accepts the
              # pod's outbound TCP inside the pod, so a handshake succeeds even
              # when the packets never leave. Only a completed fetch proves it.
              unreachable() {
                if wget -q -T {{ .Values.conformance.timeoutSeconds }} -O /dev/null "$1" 2>/dev/null; then
                  echo "FAIL: fetched $1 from {{ .Values.appNamespace }} — egress is wider than the allow-list"
                  fail=1
                else
                  echo "ok: $1 unreachable"
                fi
              }

              echo "--- an unlisted external host must be unreachable"
              {{- range .Values.conformance.mustNotReach }}
              unreachable {{ . }}
              {{- end }}

              # An allowed destination, same tool: a wget that cannot succeed
              # would make every check above pass for the wrong reason.
              echo "--- an allowed destination must stay reachable"
              if wget -q -T {{ .Values.conformance.timeoutSeconds }} -O /dev/null {{ .Values.conformance.mustReach }} 2>/dev/null; then
                echo "ok: {{ .Values.conformance.mustReach }} reachable"
              else
                echo "FAIL: {{ .Values.conformance.mustReach }} unreachable — the probes above prove nothing"
                fail=1
              fi

              # The metadata server is link-local and served by a node-local
              # DaemonSet, so it is reached before any NetworkPolicy is
              # consulted — no policy can close the port. What must hold is the
              # thing that actually matters: it hands this pod no token,
              # because its service account is bound to no Google identity.
              echo "--- the metadata server must issue no token"
              if wget -q -T {{ .Values.conformance.timeoutSeconds }} -O - \
                   --header 'Metadata-Flavor: Google' \
                   'http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token' \
                   2>/dev/null | grep -q access_token; then
                echo "FAIL: the metadata server issued an access token to {{ .Values.appNamespace }}"
                fail=1
              else
                echo "ok: no token issued"
              fi

              # NodeLocal DNSCache answers from the node rather than from a
              # kube-system pod, so a namespaceSelector alone leaves DNS dead
              # and every hostname in the app becomes unreachable at once.
              echo "--- cluster DNS must resolve"
              if nslookup {{ .Values.postgres.poolerHost }} >/dev/null 2>&1; then
                echo "ok: {{ .Values.postgres.poolerHost }} resolves"
              else
                echo "FAIL: cluster DNS does not resolve from {{ .Values.appNamespace }}"
                fail=1
              fi

              exit $fail
{{- end }}
