# Hospital Management System - Vitals Service
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/hospital-management/vitals-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  # Exclude NATS port from Istio sidecar to fix JetStream timeout issues
  # Exclude GCP metadata server from Istio for Workload Identity
  # Prometheus metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

autoscaling:
  # Workload Identity is always enabled
  minReplicas: 0
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  HMS_SERVER_PORT: "8080"
  HMS_SERVER_ENVIRONMENT: "devtest"
  HMS_SERVER_DEVELOPMENT_ENABLED: "true"
  HMS_LOGGER_LEVEL: "info"
  # JWT Configuration
  HMS_JWT_ISSUER: "hospital-management"
  # Database
  HMS_DATABASE_HOST: "postgresql.database.svc.cluster.local"
  HMS_DATABASE_PORT: "5432"
  HMS_DATABASE_DBNAME: "hms_vitals"
  HMS_DATABASE_USER: "postgres"
  HMS_DATABASE_SSLMODE: "disable"
  # Redis (for caching and real-time updates)
  HMS_REDIS_HOST: "redis.redis.svc.cluster.local"
  HMS_REDIS_PORT: "6379"
  HMS_REDIS_DB: "0"
  # NATS (for event streaming)
  HMS_NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  HMS_NATS_CLUSTER_ID: "hospital-cluster"
  HMS_NATS_CLIENT_ID: "vitals-service"
  # Vitals configuration
  HMS_VITALS_ALERT_THRESHOLD_CRITICAL: "true"
  HMS_VITALS_ALERT_THRESHOLD_WARNING: "true"
  HMS_VITALS_DATA_RETENTION_DAYS: "365"
  HMS_VITALS_MAX_BATCH_SIZE: "100"
  # IoT device integration
  HMS_IOT_DEVICE_TIMEOUT_SECONDS: "30"
  HMS_IOT_SYNC_INTERVAL_MINUTES: "5"
  # Notification service URL for vitals alerts
  HMS_NOTIFICATION_SERVICE_URL: "http://notification-service.marketplace.svc.cluster.local:8080"
  # Patient service URL for patient data lookup
  HMS_PATIENT_SERVICE_URL: "http://patient-service.marketplace.svc.cluster.local:8080"

# Database configuration
  existingSecret: "jwt-secret"
  secretKey: "jwt-secret"

# Health checks
livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "hms"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
