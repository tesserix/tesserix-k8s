namespace: hms
clusterName: hms-postgres

# 3 instances: 1 primary + 2 sync replicas for production HA.
# Automatic failover is handled by the CNPG operator.
# Hibernated — all pods scaled to 0, PVCs and data preserved.
# Set hibernate to false and instances to 3 to restore full HA.
hibernate: true

instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Storage — separate WAL volume for I/O isolation
# Actual data ~8MB, but 10Gi for growth headroom.
storageSize: 10Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

# Bootstrap — primary database for the HMS namespace
bootstrap:
  database: hms_db
  owner: hms
  # Secret must contain 'username' and 'password' keys (CNPG basic-auth format).
  # Created by ExternalSecret from GCP Secret Manager.
  secret: hms-postgres-app-credentials
  gcpSecretName: prod-hms-postgresql-password
  # No additional databases needed — single DB.
  postInitSQL: []

# PostgreSQL tuning
postgresql:
  max_connections: "200"
  shared_buffers: "256MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots
  max_slot_wal_keep_size: "10GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/hms-postgres"
  retentionPolicy: "30d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-hms-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 2
  maxClientConn: "1000"
  defaultPoolSize: "20"

# Monitoring — CNPG built-in Prometheus exporter on port 9187
monitoring:
  enablePodMonitor: true

# Replication — disabled while hibernated (single instance).
# Set back to 1/1 when scaling back to 3 instances.
replication:
  minSyncReplicas: 0
  maxSyncReplicas: 0
