# Default values for homechef-vendor-portal
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-vendor-portal
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration — hold the app container until the proxy is
  # ready so early outbound calls are not dropped.
  holdApplicationUntilProxyStarts: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

service:
  # Set during the Knative migration only (the canonical name is still owned by
  # the Knative Route). Cleared once the ksvc is removed.
  nameOverride: ""
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: dev-vendors-homechef.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: homechef-vendor-portal-tls
      hosts:
        - dev-vendors-homechef.tesserix.app

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  # Memory only. The prometheus request-rate trigger was removed (#906): the
  # monitoring namespace is scaled to zero, so prometheus-server has no
  # endpoints, the HPA could not compute the external metric, and the resulting
  # Degraded ScaledObject failed Kargo's health gate — silently blocking every
  # production promotion while CI stayed green. Restore the prometheus trigger
  # here if monitoring comes back.
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - homechef-vendor-portal
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  VITE_API_URL: "https://dev-vendors-homechef.tesserix.app/api/v1"
  VITE_WS_URL: "wss://dev-vendors-homechef.tesserix.app/ws"
  VITE_APP_NAME: "HomeChef Vendor Portal"
  VITE_APP_ENV: "development"

# ConfigMap for additional configuration
configMap:
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "homechef"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
