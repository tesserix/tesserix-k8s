# obs-ui — defaults. Prod overrides go inline in
# argocd/prod/infrastructure/obs-ui.yaml.

replicaCount: 2

image:
  repository: ghcr.io/tesserix/observability/obs-ui
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

port: 3010

# Memory-only per platform policy: no CPU requests or limits anywhere.
# A Next.js standalone server serving a handful of routes is small.
resources:
  requests:
    memory: 192Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  workload: observability

tolerations:
  - key: workload
    operator: Equal
    value: observability
    effect: NoSchedule
