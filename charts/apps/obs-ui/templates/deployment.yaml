apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-ui
  labels:
    app.kubernetes.io/name: obs-ui
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: tesserix
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obs-ui
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: tesserix
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: obs-ui
                topologyKey: kubernetes.io/hostname
      containers:
        - name: obs-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: PORT
              value: "{{ .Values.port }}"
            - name: HOSTNAME
              value: "0.0.0.0"
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          # Next.js writes its image-optimisation cache and temp files at
          # runtime, so an immutable root filesystem needs these two mounts or
          # the server crashes on first render.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
