apiVersion: v2
name: obs-ui
description: |
  obs-ui — the observability explorer: log search with live tail, trace
  waterfalls, and a service-health overview.

  Holds no credentials and talks to no database. Authentication is obs-api's
  job; this app calls /api/me and shows a sign-in screen on 401. Istio splits
  the single host by path, so /api and /auth reach obs-api directly rather than
  being proxied through Next.js — proxying buffers Server-Sent Events and
  freezes the live tail.

  Source: https://github.com/tesserix/observability
type: application
version: 1.0.1
appVersion: "1.0.0"
