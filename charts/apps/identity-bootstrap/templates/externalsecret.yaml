{{- if .Values.gcp.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-idp-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-idp-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.targets }}
    {{- range .identityProviders }}
    {{- if .gcpSecretClientId }}
    - secretKey: {{ .alias }}-client-id
      remoteRef:
        key: {{ .gcpSecretClientId }}
    - secretKey: {{ .alias }}-client-secret
      remoteRef:
        key: {{ .gcpSecretClientSecret }}
    {{- end }}
    {{- end }}
    {{- end }}
---
{{- $hasClientSecrets := false }}
{{- range .Values.targets }}
{{- range .clients }}
{{- if .gcpSecretClientSecret }}
{{- $hasClientSecrets = true }}
{{- end }}
{{- end }}
{{- end }}
{{- if $hasClientSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-client-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-client-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.targets }}
    {{- range .clients }}
    {{- if .gcpSecretClientSecret }}
    - secretKey: {{ .clientId }}-secret
      remoteRef:
        key: {{ .gcpSecretClientSecret }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
