{{- if .Values.gcp.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-idp-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-idp-secrets
    creationPolicy: Owner
  data:
    {{- /* Dedupe by alias: multiple targets (e.g. two Keycloak realms) may
           declare the same IdP (google) with the same GCP secret. The
           ExternalSecret is a single secret, so each alias must appear once —
           duplicates are rejected by the ESO webhook and break the projected
           volume mount in the CronJob. */ -}}
    {{- $seen := dict }}
    {{- range .Values.targets }}
    {{- range .identityProviders }}
    {{- if and .gcpSecretClientId (not (hasKey $seen .alias)) }}
    {{- $_ := set $seen .alias true }}
    - secretKey: {{ .alias }}-client-id
      remoteRef:
        key: {{ .gcpSecretClientId }}
    - secretKey: {{ .alias }}-client-secret
      remoteRef:
        key: {{ .gcpSecretClientSecret }}
    {{- end }}
    {{- end }}
    {{- end }}
---
{{- $hasClientSecrets := false }}
{{- range .Values.targets }}
{{- range .clients }}
{{- if .gcpSecretClientSecret }}
{{- $hasClientSecrets = true }}
{{- end }}
{{- end }}
{{- end }}
{{- if $hasClientSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-client-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-client-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.targets }}
    {{- range .clients }}
    {{- if .gcpSecretClientSecret }}
    - secretKey: {{ .clientId }}-secret
      remoteRef:
        key: {{ .gcpSecretClientSecret }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
