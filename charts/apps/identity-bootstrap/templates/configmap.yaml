apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
data:
  bootstrap.py: |
    #!/usr/bin/env python3
    """Idempotent Keycloak identity bootstrap — realms, clients, IdPs, admin users.

    Runs per-product (e.g., fanzone, homechef). Each product defines which
    Keycloak instances (customer, internal) it uses and what realms/clients/IdPs
    to provision.

    Fully idempotent — safe to run every 30 minutes via CronJob.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request


    class KeycloakAdmin:
        def __init__(self, base_url, username, password):
            self.base_url = base_url.rstrip("/")
            self.token = None
            self._authenticate(username, password)

        def _authenticate(self, username, password):
            data = urllib.parse.urlencode({
                "grant_type": "password",
                "client_id": "admin-cli",
                "username": username,
                "password": password,
            }).encode()
            for attempt in range(5):
                try:
                    req = urllib.request.Request(
                        f"{self.base_url}/realms/master/protocol/openid-connect/token",
                        data=data,
                    )
                    resp = urllib.request.urlopen(req, timeout=10)
                    self.token = json.loads(resp.read())["access_token"]
                    return
                except Exception as e:
                    log(f"  Auth attempt {attempt + 1} failed: {e}")
                    time.sleep(5)
            log("FATAL: Cannot authenticate")
            sys.exit(1)

        def _request(self, method, path, json_data=None):
            headers = {"Authorization": f"Bearer {self.token}"}
            data = None
            if json_data is not None:
                data = json.dumps(json_data).encode()
                headers["Content-Type"] = "application/json"
            req = urllib.request.Request(
                f"{self.base_url}{path}", data=data, headers=headers, method=method
            )
            try:
                resp = urllib.request.urlopen(req, timeout=30)
                body = resp.read().decode()
                return resp.status, json.loads(body) if body else {}
            except urllib.error.HTTPError as e:
                return e.code, e.read().decode()

        def get(self, path):
            return self._request("GET", path)

        def post(self, path, data):
            return self._request("POST", path, data)

        def put(self, path, data):
            return self._request("PUT", path, data)

        def ensure_realm(self, name, display_name, registration, email_login, reset_pwd):
            code, _ = self.get(f"/admin/realms/{name}")
            if code == 200:
                log(f"  Realm '{name}': exists")
                return "exists"
            code, _ = self.post("/admin/realms", {
                "realm": name,
                "enabled": True,
                "displayName": display_name,
                "registrationAllowed": registration,
                "loginWithEmailAllowed": email_login,
                "resetPasswordAllowed": reset_pwd,
                "sslRequired": "none",
                "accessTokenLifespan": 3600,
            })
            log(f"  Realm '{name}': {'created' if code == 201 else f'FAILED ({code})'}")
            return "created" if code == 201 else "failed"

        def ensure_client(self, realm, config, client_secret=None):
            cid = config["clientId"]
            code, clients = self.get(f"/admin/realms/{realm}/clients?clientId={cid}")
            if code == 200 and clients:
                log(f"  Client '{cid}': exists")
                return "exists"
            payload = {
                "clientId": cid,
                "enabled": True,
                "protocol": "openid-connect",
                "publicClient": config.get("publicClient", True),
                "standardFlowEnabled": True,
                "directAccessGrantsEnabled": True,
                "rootUrl": config.get("rootUrl", ""),
                "redirectUris": config.get("redirectUris", []),
                "webOrigins": config.get("webOrigins", []),
            }
            if client_secret and not config.get("publicClient", True):
                payload["secret"] = client_secret
            code, _ = self.post(f"/admin/realms/{realm}/clients", payload)
            log(f"  Client '{cid}': {'created' if code == 201 else f'FAILED ({code})'}")
            return "created" if code == 201 else "failed"

        def ensure_auto_link_flow(self, realm):
            """Create an 'auto-link-by-email' first broker login flow that silently
            links accounts sharing the same verified email — no Keycloak UI shown."""
            flow_alias = "auto-link-by-email"
            code, flows = self.get(f"/admin/realms/{realm}/authentication/flows")
            if code == 200 and any(f.get("alias") == flow_alias for f in flows):
                log(f"  Auth flow '{flow_alias}': exists")
                return flow_alias
            # Create top-level flow
            code, _ = self.post(f"/admin/realms/{realm}/authentication/flows", {
                "alias": flow_alias, "providerId": "basic-flow",
                "description": "Auto-link accounts by verified email", "topLevel": True, "builtIn": False,
            })
            if code not in (201, 409):
                log(f"  Auth flow '{flow_alias}': FAILED to create ({code})")
                return "first broker login"
            # Add 'idp-create-user-if-unique' execution
            self.post(f"/admin/realms/{realm}/authentication/flows/{flow_alias}/executions/execution",
                       {"provider": "idp-create-user-if-unique"})
            # Add 'idp-auto-link' execution (auto-links when email matches)
            self.post(f"/admin/realms/{realm}/authentication/flows/{flow_alias}/executions/execution",
                       {"provider": "idp-auto-link"})
            # Set both to ALTERNATIVE requirement
            code, execs = self.get(f"/admin/realms/{realm}/authentication/flows/{flow_alias}/executions")
            if code == 200:
                for ex in execs:
                    if ex.get("requirement") != "ALTERNATIVE":
                        ex["requirement"] = "ALTERNATIVE"
                        self.put(f"/admin/realms/{realm}/authentication/executions/{ex['id']}", ex)
            log(f"  Auth flow '{flow_alias}': created")
            return flow_alias

        def ensure_idp(self, realm, alias, provider_id, display_name, client_id, client_secret, scope):
            # Ensure auto-link flow exists so users never see the Keycloak "Account already exists" page
            flow_alias = self.ensure_auto_link_flow(realm)
            code, existing = self.get(f"/admin/realms/{realm}/identity-provider/instances/{alias}")
            idp_config = {
                "alias": alias,
                "displayName": display_name,
                "providerId": provider_id,
                "enabled": True,
                "trustEmail": True,
                "storeToken": False,
                "firstBrokerLoginFlowAlias": flow_alias,
                "config": {
                    "clientId": client_id,
                    "clientSecret": client_secret,
                    "defaultScope": scope,
                    "syncMode": "IMPORT",
                },
            }
            if code == 200:
                code, _ = self.put(f"/admin/realms/{realm}/identity-provider/instances/{alias}", idp_config)
                log(f"  IdP '{alias}': updated")
                return "updated"
            code, _ = self.post(f"/admin/realms/{realm}/identity-provider/instances", idp_config)
            log(f"  IdP '{alias}': {'created' if code == 201 else f'FAILED ({code})'}")
            return "created" if code == 201 else "failed"

        def ensure_admin_user(self, realm, email, first_name, last_name):
            code, users = self.get(f"/admin/realms/{realm}/users?email={email}&exact=true")
            if code == 200 and users:
                user_id = users[0]["id"]
                log(f"  User '{email}': exists")
            else:
                code, _ = self.post(f"/admin/realms/{realm}/users", {
                    "username": email,
                    "email": email,
                    "emailVerified": True,
                    "enabled": True,
                    "firstName": first_name,
                    "lastName": last_name,
                })
                if code != 201:
                    log(f"  User '{email}': FAILED ({code})")
                    return "failed"
                log(f"  User '{email}': created")
                _, users = self.get(f"/admin/realms/{realm}/users?email={email}&exact=true")
                if not users:
                    return "failed"
                user_id = users[0]["id"]

            # Ensure admin role exists
            _, roles = self.get(f"/admin/realms/{realm}/roles")
            if not any(r["name"] == "admin" for r in roles):
                self.post(f"/admin/realms/{realm}/roles", {"name": "admin", "description": "Full admin access"})
            _, roles = self.get(f"/admin/realms/{realm}/roles")
            admin_role = next((r for r in roles if r["name"] == "admin"), None)
            if admin_role:
                self.post(f"/admin/realms/{realm}/users/{user_id}/role-mappings/realm", [admin_role])

            # Assign all realm-management roles
            _, clients = self.get(f"/admin/realms/{realm}/clients?clientId=realm-management")
            if clients:
                rm_id = clients[0]["id"]
                _, available = self.get(
                    f"/admin/realms/{realm}/users/{user_id}/role-mappings/clients/{rm_id}/available"
                )
                if available:
                    self.post(f"/admin/realms/{realm}/users/{user_id}/role-mappings/clients/{rm_id}", available)
                    log(f"    {len(available)} realm-management roles assigned")
            return "ok"


    def log(msg):
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        print(f"[{ts}] {msg}")


    def read_secret(path):
        try:
            with open(path) as f:
                return f.read().strip()
        except FileNotFoundError:
            return ""


    def main():
        config_path = os.environ.get("CONFIG_PATH", "/config/config.json")
        with open(config_path) as f:
            config = json.load(f)

        app = config.get("app", "unknown")
        stats = {"realms": 0, "clients": 0, "idps": 0, "users": 0, "errors": 0}

        log(f"Identity bootstrap starting for: {app}")

        for target in config.get("targets", []):
            tname = target["name"]
            url = target["url"]
            admin_user = read_secret(f"/secrets/{tname}/username")
            admin_pass = read_secret(f"/secrets/{tname}/password")

            if not admin_user or not admin_pass:
                log(f"[{tname}] SKIP — no credentials at /secrets/{tname}/")
                continue

            log(f"")
            log(f"{'=' * 50}")
            log(f"[{tname}] {url}")
            log(f"{'=' * 50}")

            kc = KeycloakAdmin(url, admin_user, admin_pass)
            realm = target.get("realm", {})
            realm_name = realm.get("name", "")
            if not realm_name:
                log(f"[{tname}] SKIP — no realm name configured")
                continue

            # Realm
            result = kc.ensure_realm(
                realm_name,
                realm.get("displayName", realm_name),
                realm.get("registrationAllowed", False),
                realm.get("loginWithEmailAllowed", True),
                realm.get("resetPasswordAllowed", True),
            )
            stats["realms"] += 1
            if result == "failed":
                stats["errors"] += 1

            # Clients
            for client_def in target.get("clients", []):
                cid = client_def["clientId"]
                csecret = read_secret(f"/secrets/client/{cid}-secret")
                result = kc.ensure_client(realm_name, client_def, csecret or None)
                stats["clients"] += 1
                if result == "failed":
                    stats["errors"] += 1

            # Identity Providers
            for idp_def in target.get("identityProviders", []):
                alias = idp_def["alias"]
                cid = read_secret(f"/secrets/idp/{alias}-{app}-client-id")
                csecret = read_secret(f"/secrets/idp/{alias}-{app}-client-secret")
                if not cid or not csecret:
                    log(f"  IdP '{alias}': SKIP — no credentials")
                    continue
                result = kc.ensure_idp(
                    realm_name, alias, idp_def["providerId"],
                    idp_def.get("displayName", alias), cid, csecret,
                    idp_def.get("defaultScope", "openid email profile"),
                )
                stats["idps"] += 1
                if result == "failed":
                    stats["errors"] += 1

            # Admin Users
            for user_def in target.get("adminUsers", []):
                result = kc.ensure_admin_user(
                    realm_name, user_def["email"],
                    user_def.get("firstName", ""), user_def.get("lastName", ""),
                )
                stats["users"] += 1
                if result == "failed":
                    stats["errors"] += 1

        log(f"")
        log(f"{'=' * 50}")
        log(f"SUMMARY ({app})")
        log(f"  Realms:  {stats['realms']}")
        log(f"  Clients: {stats['clients']}")
        log(f"  IdPs:    {stats['idps']}")
        log(f"  Users:   {stats['users']}")
        log(f"  Errors:  {stats['errors']}")
        log(f"{'=' * 50}")
        log(f"RESULT: {'SUCCESS' if stats['errors'] == 0 else 'PARTIAL — check errors above'}")

        sys.exit(1 if stats["errors"] > 0 else 0)


    if __name__ == "__main__":
        main()
