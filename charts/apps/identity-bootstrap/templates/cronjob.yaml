apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: identity-bootstrap
    app.kubernetes.io/part-of: {{ .Values.app }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        sidecar.istio.io/inject: "false"
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 3
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Release.Name }}
          containers:
            - name: bootstrap
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["python3", "/scripts/bootstrap.py"]
              env:
                - name: CONFIG_PATH
                  value: /config/config.json
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-script
                defaultMode: 0755
            - name: config
              configMap:
                name: {{ .Release.Name }}-config
            - name: secrets
              projected:
                sources:
                  {{- range .Values.targets }}
                  - secret:
                      name: {{ .adminSecretName }}
                      items:
                        - key: username
                          path: {{ .name }}/username
                        - key: password
                          path: {{ .name }}/password
                  {{- range .identityProviders }}
                  {{- if .gcpSecretClientId }}
                  - secret:
                      name: {{ $.Release.Name }}-idp-secrets
                      optional: true
                      items:
                        - key: {{ .alias }}-client-id
                          path: idp/{{ .alias }}-{{ $.Values.app }}-client-id
                        - key: {{ .alias }}-client-secret
                          path: idp/{{ .alias }}-{{ $.Values.app }}-client-secret
                  {{- end }}
                  {{- end }}
                  {{- end }}
