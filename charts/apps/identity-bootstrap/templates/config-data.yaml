apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  config.json: |
    {
      "app": {{ .Values.app | quote }},
      "targets": [
        {{- range $i, $target := .Values.targets }}
        {{- if $i }},{{ end }}
        {
          "name": {{ $target.name | quote }},
          "url": {{ $target.url | quote }},
          "realm": {
            "name": {{ $target.realm.name | quote }},
            "displayName": {{ $target.realm.displayName | default $target.realm.name | quote }},
            "registrationAllowed": {{ $target.realm.registrationAllowed | default false }},
            "loginWithEmailAllowed": {{ $target.realm.loginWithEmailAllowed | default true }},
            "resetPasswordAllowed": {{ $target.realm.resetPasswordAllowed | default true }}
          },
          "clients": {{ $target.clients | default list | toJson }},
          "identityProviders": [
            {{- range $k, $idp := $target.identityProviders }}
            {{- if $k }},{{ end }}
            {
              "alias": {{ $idp.alias | quote }},
              "providerId": {{ $idp.providerId | quote }},
              "displayName": {{ $idp.displayName | default $idp.alias | quote }},
              "defaultScope": {{ $idp.defaultScope | default "openid email profile" | quote }}
            }
            {{- end }}
          ],
          "adminUsers": {{ $target.adminUsers | default list | toJson }}
        }
        {{- end }}
      ]
    }
