{{- range .Values.targets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .adminSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .adminSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prod-keycloak-{{ .name }}-admin-username
    - secretKey: password
      remoteRef:
        key: prod-keycloak-{{ .name }}-admin-password
{{- end }}
