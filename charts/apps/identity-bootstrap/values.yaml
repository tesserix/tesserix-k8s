# Per-product identity bootstrap
# Each product deploys its own instance via ArgoCD (like db-schema-bootstrap)

app: ""  # Product name: fanzone, homechef, etc.

schedule: "*/30 * * * *"

image:
  repository: python
  tag: 3.12-alpine

# Keycloak targets this product uses
# Each target is a Keycloak instance (customer, internal, or both)
targets:
  - name: customer
    url: http://keycloak.identity-customer.svc.cluster.local:8080
    adminSecretName: keycloak-customer-admin
    adminSecretNamespace: identity-customer
    realm:
      name: ""              # e.g. fanzone, homechef
      displayName: ""
      registrationAllowed: true
      loginWithEmailAllowed: true
      resetPasswordAllowed: true
    clients: []
    # - clientId: fanzone-bff
    #   publicClient: true
    #   rootUrl: https://fanzonebattleground.com
    #   redirectUris: [...]
    #   webOrigins: [...]
    # - clientId: blog-bff
    #   publicClient: false           # confidential client
    #   gcpSecretClientSecret: prod-blog-keycloak-client-secret  # GCP SM key
    #   rootUrl: https://blog.tesserix.app
    #   redirectUris: [...]
    #   webOrigins: [...]
    identityProviders: []
    # - alias: google
    #   providerId: google
    #   displayName: Google
    #   clientIdSecret: google-client-id       # key in the product secrets
    #   clientSecretSecret: google-client-secret
    #   defaultScope: "openid email profile"
    adminUsers: []
    # - email: samyak.rout@gmail.com
    #   firstName: Samyak
    #   lastName: Rout

# GCP Secret Manager (alternative to K8s secrets for IdP credentials)
gcp:
  enabled: false
  project: ""
  secrets: {}
