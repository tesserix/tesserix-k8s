knative:
  enabled: false

# Production overrides for location-service

image:
  repository: ghcr.io/tesserix/mark8ly-location-service

# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 1

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  # Production Keycloak configuration
  KEYCLOAK_ISSUER_URL: "https://identity.fanzonebattleground.com/realms/tesserix-customer"
  GIN_MODE: "release"
  ENVIRONMENT: "production"
  BASE_DOMAIN: "mark8ly.com"
  # OpenFGA authorization
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local:8080"
  OPENFGA_AUTH_MODE: "preshared"
  OPENFGA_MARKETPLACE_STORE_ID: "01KMS970NNJPJP97MR7XNZSVD3"
  SERVICE_AUTH_MODE: "mesh"

# Production database configuration — location_db lives on global PostgreSQL
database:
  host: "postgresql.postgresql-global.svc.cluster.local"
  name: "location_db"
  sslmode: "require"

# Production service account with Workload Identity
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  namespace: "global"
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"location-service\"}[2m]))"
    requestRateThreshold: "30"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
