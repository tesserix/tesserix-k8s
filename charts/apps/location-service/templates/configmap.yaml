{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "location-service.fullname" . }}-config
  labels:
    {{- include "location-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: "postgresql.postgresql-global.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "location_db"
  DB_USER: "postgres"
  DB_SSLMODE: "require"
  DB_SSL_MODE: "require"
  PGSSLMODE: "require"
  PORT: "8080"
{{- end }}
