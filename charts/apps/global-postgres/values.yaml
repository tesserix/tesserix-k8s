hibernate: false

namespace: global
clusterName: global-postgres

# 1 instance: single-primary for low-traffic prod environment.
# Was 3 (primary + 2 replicas) but replicas could not start on the 5Gi WAL
# volume due to CNPG's WAL-space pre-flight check requiring ~2× the
# max_slot_wal_keep_size free. Re-enable replicas once the cluster has real
# traffic and the WAL volume is sized appropriately (≥ 16Gi).
instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Storage — separate WAL volume for I/O isolation
# Actual data ~120MB across all 12 databases, but 20Gi for growth headroom.
storageSize: 20Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi

resources:
  requests:
    memory: 1Gi
  limits:
    memory: 4Gi

# Bootstrap — primary database for the Global namespace
bootstrap:
  database: global_db
  owner: global
  # Secret must contain 'username' and 'password' keys (CNPG basic-auth format).
  # Created by ExternalSecret from GCP Secret Manager.
  secret: global-postgres-app-credentials
  gcpSecretName: prod-global-postgresql-password
  # Post-init SQL runs once after the cluster is created (idempotent).
  # Global PG hosts 12 databases: global_db (bootstrap) + 11 additional below.
  postInitSQL:
    - "CREATE DATABASE keycloak_customer OWNER global"
    - "CREATE DATABASE keycloak_internal OWNER global"
    - "CREATE DATABASE tenants_db OWNER global"
    - "CREATE DATABASE notifications_db OWNER global"
    - "CREATE DATABASE subscriptions_db OWNER global"
    - "CREATE DATABASE documents_db OWNER global"
    - "CREATE DATABASE verifications_db OWNER global"
    - "CREATE DATABASE onboarding_content_db OWNER global"
    - "CREATE DATABASE custom_domains_db OWNER global"
    - "CREATE DATABASE location_db OWNER global"
    - "CREATE DATABASE tenant_router_db OWNER global"

# PostgreSQL tuning
postgresql:
  max_connections: "300"
  shared_buffers: "512MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # Server-side TCP keepalives — GKE Dataplane V2 / Cilium conntrack
  # evicts idle flows after ~5 min, which was killing Keycloak's JDBC
  # pool every time the pool sat between Agroal validation cycles.
  # Have Postgres push a keepalive probe every 60s (first after 60s,
  # then every 30s, giving up after 6 missed) so the flow is never
  # quiet long enough for conntrack to drop it. Affects all clients
  # of this cluster (Keycloak, auth-bff, etc.) which is the right
  # blast radius — every consumer benefits.
  tcp_keepalives_idle: "60"
  tcp_keepalives_interval: "30"
  tcp_keepalives_count: "6"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots.
  # CNPG's pre-start disk check requires ~2x this value free on the WAL volume
  # (formula: 2 * walSegmentSize * keep_size_in_segments + margin). For a 5Gi
  # WAL volume, keep this ≤ 1GB so the threshold (~2GB) stays safely under the
  # ~4.6G usable capacity. Going higher makes CNPG refuse to start replicas.
  max_slot_wal_keep_size: "1GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/global-postgres"
  retentionPolicy: "30d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 2
  maxClientConn: "1000"
  defaultPoolSize: "25"

# Monitoring — CNPG built-in Prometheus exporter on port 9187
monitoring:
  enablePodMonitor: true

# Replication
affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 0
  maxSyncReplicas: 0
