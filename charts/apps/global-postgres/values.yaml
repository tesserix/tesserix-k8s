hibernate: false

namespace: global
clusterName: global-postgres

# 1 instance: single-primary for low-traffic prod environment.
# Was 3 (primary + 2 replicas) but replicas could not start on the 5Gi WAL
# volume due to CNPG's WAL-space pre-flight check requiring ~2× the
# max_slot_wal_keep_size free. Re-enable replicas once the cluster has real
# traffic and the WAL volume is sized appropriately (≥ 16Gi).
instances: 1
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Storage — separate WAL volume for I/O isolation
# Actual data ~120MB across all 12 databases, but 20Gi for growth headroom.
storageSize: 20Gi
storageClass: standard-rwo-retain
walStorageSize: 5Gi

resources:
  requests:
    memory: 1Gi
  limits:
    memory: 4Gi

# Bootstrap — primary database for the Global namespace
bootstrap:
  database: global_db
  owner: global
  # Secret must contain 'username' and 'password' keys (CNPG basic-auth format).
  # Created by ExternalSecret from GCP Secret Manager.
  secret: global-postgres-app-credentials
  gcpSecretName: prod-global-postgresql-password
  # Post-init SQL runs once after the cluster is created (idempotent).
  # Global PG hosts 11 databases: global_db (bootstrap) + 10 additional below.
  postInitSQL:
    - "CREATE DATABASE tenants_db OWNER global"
    - "CREATE DATABASE notifications_db OWNER global"
    - "CREATE DATABASE subscriptions_db OWNER global"
    - "CREATE DATABASE documents_db OWNER global"
    - "CREATE DATABASE verifications_db OWNER global"
    - "CREATE DATABASE onboarding_content_db OWNER global"
    - "CREATE DATABASE custom_domains_db OWNER global"
    - "CREATE DATABASE location_db OWNER global"
    - "CREATE DATABASE tenant_router_db OWNER global"
    # kora_db (Kora product — food memory / nutrition logging). Distinct
    # owner role (not "global") so the app's own credentials are scoped to
    # its one database, same isolation the dedicated cluster gave it.
    # Role LOGIN only — no CREATEDB/CREATEROLE/SUPERUSER, matching the
    # least-privilege posture in docs/cross-db-admin.md. Password is
    # reconciled continuously by managed.roles below (works on this
    # already-running cluster, unlike postInitSQL which only fires on a
    # fresh bootstrap — see docs/postgres-cluster-policy.md).
    - "CREATE ROLE kora LOGIN"
    - "CREATE DATABASE kora_db OWNER kora"
    # onboarding_db (onboard.tesserix.app). Owned by "global", not by the
    # application's own role: onboarding-service connects as "onboarding" and
    # must NOT own audit_events, or it could re-grant itself the UPDATE and
    # DELETE the schema revokes. See docs/onboarding-api.md § 5.
    - "CREATE ROLE onboarding LOGIN"
    - "CREATE DATABASE onboarding_db OWNER global"
    # agentgateway_config / agentgateway_logs (agentgateway console). The
    # gateway migrates its own tables; it needs only the databases and an
    # owning role.
    - "CREATE ROLE agentgateway LOGIN"
    - "CREATE DATABASE agentgateway_config OWNER agentgateway"
    - "CREATE DATABASE agentgateway_logs OWNER agentgateway"
  # Runs once against template1 at cluster creation; every database
  # subsequently CREATEd (including from postInitSQL above) inherits
  # whatever is installed here via Postgres's normal template-copy
  # semantics — no privilege needed by the inheriting database's owner.
  # This is how kora_db gets pgvector without the "kora" role ever needing
  # CREATE EXTENSION privilege (see managed.roles comment on cluster.yaml
  # for why that matters — its own migration's `CREATE EXTENSION IF NOT
  # EXISTS vector` becomes a privilege-safe no-op). Same trick mark8ly's
  # cluster uses for pgcrypto/citext.
  postInitTemplateSQL:
    - "CREATE EXTENSION IF NOT EXISTS vector"

# CNPG-managed roles — reconciled continuously by the operator (not just at
# bootstrap), so this is what actually creates/updates a role's password on
# this already-running cluster. The operator runs internally as the postgres
# superuser regardless of enableSuperuserAccess, so password reconciliation
# works even for a role that never has direct superuser access. Same pattern
# as mark8ly-postgres's `openfga` / `marketplace_api` secondary roles.
managedRoles:
  # "global" is the bootstrap owner role and is already managed in every other
  # sense; it is listed here only for createdb. Without it db-schema-bootstrap
  # cannot provision a new database on this cluster at all — it connects as
  # "global", and CNPG creates the app role without CREATEDB, so every
  # postInitSQL database added after bootstrap (onboarding_db) silently never
  # appeared. The passwordSecret is the same app secret CNPG generated, so
  # reconciling it changes nothing.
  - name: global
    passwordSecret: global-postgres-app-credentials
    createdb: true
  - name: onboarding
    passwordSecret: global-postgres-onboarding
  - name: kora
    passwordSecret: global-postgres-kora
    # Secret created by ExternalSecret in external-secrets/prod/global/
    # (external-secrets.io ExternalSecret "global-postgres-kora"),
    # sourced from GCP Secret Manager key prod-kora-postgresql-password.
    # This password MUST match whatever is embedded in the
    # prod-kora-database-url secret kora-api reads its DATABASE_URL from —
    # a human coordination point, not something GitOps can enforce.
  - name: agentgateway
    passwordSecret: global-postgres-agentgateway
    comment: agentgateway console config and log stores

# PostgreSQL tuning
postgresql:
  max_connections: "300"
  shared_buffers: "512MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  # Query safety nets
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  # Server-side TCP keepalives — GKE Dataplane V2 / Cilium conntrack
  # evicts idle flows after ~5 min, which was killing long-lived JDBC
  # pools that sat idle between validation cycles.
  # Have Postgres push a keepalive probe every 60s (first after 60s,
  # then every 30s, giving up after 6 missed) so the flow is never
  # quiet long enough for conntrack to drop it. Affects all clients
  # of this cluster (auth-bff, etc.) which is the right
  # blast radius — every consumer benefits.
  tcp_keepalives_idle: "60"
  tcp_keepalives_interval: "30"
  tcp_keepalives_count: "6"
  # SSD-optimized planner (GKE PD-SSD)
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  # Slow query logging (queries > 1s)
  log_min_duration_statement: "1000"
  # Replica query safety
  hot_standby_feedback: "on"
  # WAL safety cap — prevent unbounded growth from inactive slots.
  # CNPG's pre-start disk check requires ~2x this value free on the WAL volume
  # (formula: 2 * walSegmentSize * keep_size_in_segments + margin). For a 5Gi
  # WAL volume, keep this ≤ 1GB so the threshold (~2GB) stays safely under the
  # ~4.6G usable capacity. Going higher makes CNPG refuse to start replicas.
  max_slot_wal_keep_size: "1GB"
  # Performance monitoring (CNPG auto-loads extension)
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

# Continuous backup to GCS via Barman Cloud
backup:
  enabled: true
  # Staggered: base backups are IO-heavy and the estate shares Spot nodes.
  schedule: "0 10 2 * * *"
  destinationPath: "gs://tesseract-prod-backups-in/global-postgres"
  retentionPolicy: "3d"
  # GCP Service Account for Workload Identity. Must have
  # roles/storage.objectAdmin on the backup bucket.
  serviceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"

# PgBouncer connection pooling
pooler:
  enabled: true
  instances: 2
  maxClientConn: "1000"
  defaultPoolSize: "25"

# Monitoring — CNPG built-in Prometheus exporter on port 9187
monitoring:
  enablePodMonitor: true

# Replication
affinity:
  podAntiAffinityType: preferred

replication:
  minSyncReplicas: 0
  maxSyncReplicas: 0

# Databases managed by CNPG Database CRs. postInitSQL only fires on a fresh
# bootstrap and db-schema-bootstrap applies DDL only on the run that creates the
# database, so neither can fix ownership for a role created afterwards.
databases:
  - name: agentgateway_config
    owner: agentgateway
  - name: agentgateway_logs
    owner: agentgateway
