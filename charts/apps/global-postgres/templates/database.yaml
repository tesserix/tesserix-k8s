{{- /* agentgateway_config and agentgateway_logs are reconciled continuously so
       ownership survives a role that appears after the database does. */}}
{{- range .Values.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Values.clusterName }}-{{ .name | replace "_" "-" }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  name: {{ .name }}
  owner: {{ .owner }}
  cluster:
    name: {{ $.Values.clusterName }}
  ensure: present
  databaseReclaimPolicy: retain
{{- end }}
