apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-platform-reranker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "support-platform-reranker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "support-platform-reranker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: support-platform
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # See embedder chart: TEI 0.3.2 hf-hub crate fails on the main
      # config.json download. Pre-populate the cache via huggingface_hub.
      initContainers:
        - name: model-prefetch
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/python:3.11-slim
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -e
              MODEL="{{ .Values.model.id }}"
              CACHE=/data
              if find "$CACHE/models--$(echo $MODEL | tr / -)/snapshots" -type d -mindepth 1 -maxdepth 1 2>/dev/null | head -1 | grep -q .; then
                echo "  cache hit, skipping"; exit 0
              fi
              pip install --no-cache-dir --quiet huggingface_hub==0.27.1
              python - <<EOF
              from huggingface_hub import snapshot_download
              snapshot_download(repo_id="$MODEL", cache_dir="$CACHE")
              EOF
          volumeMounts:
            - name: cache
              mountPath: /data
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--model-id"
            - "{{ .Values.model.id }}"
            - "--port"
            - "80"
            - "--max-concurrent-requests"
            - "{{ .Values.model.maxConcurrentRequests }}"
            - "--max-batch-tokens"
            - "{{ .Values.model.maxBatchTokens }}"
            - "--huggingface-hub-cache"
            - "/data"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: HF_ENDPOINT
              value: "https://huggingface.co"
            - name: HUGGINGFACE_HUB_URL
              value: "https://huggingface.co"
            {{- if .Values.huggingfaceTokenSecret.enabled }}
            # See embedder chart: TEI fails on a non-empty placeholder
            # token. Only inject when a real token is configured.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.huggingfaceTokenSecret.name }}
                  key: {{ .Values.huggingfaceTokenSecret.key }}
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-cache
          {{- else }}
          emptyDir:
            sizeLimit: 3Gi
          {{- end }}
