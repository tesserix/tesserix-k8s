namespace: support-platform
name: support-platform-reranker

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: "cpu-1.5"
  pullPolicy: IfNotPresent

# TEI auto-detects reranker vs embedder from the model card.
model:
  id: BAAI/bge-reranker-base
  maxConcurrentRequests: 16
  maxBatchTokens: 8192

service:
  type: ClusterIP
  port: 8002

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 5Gi

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300

huggingfaceTokenSecret:
  name: support-platform-hf-token
  key: HF_TOKEN
