namespace: support-platform
name: support-platform-reranker

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: "cpu-1.8"
  pullPolicy: IfNotPresent

# TEI auto-detects reranker vs embedder from the model card.
model:
  id: BAAI/bge-reranker-base
  maxConcurrentRequests: 16
  maxBatchTokens: 8192

service:
  type: ClusterIP
  port: 8002

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1500Mi
  # bge-reranker-base + TEI overhead exceeded the prior 2Gi cap and was
  # OOMKilled at boot. Cross-encoders use more memory than dual-encoders
  # for the same param count because of attention over concatenated
  # (query, doc) sequences.
  limits:
    memory: 3Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 5Gi

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300

huggingfaceTokenSecret:
  # Flip to true once a real HF token is provisioned (see embedder chart
  # comment). bge-reranker-base is a public model so anonymous pull works.
  enabled: false
  name: support-platform-hf-token
  key: HF_TOKEN
