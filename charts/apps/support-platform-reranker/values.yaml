namespace: support-platform
name: support-platform-reranker

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: "cpu-1.8"
  pullPolicy: IfNotPresent

# TEI auto-detects reranker vs embedder from the model card.
model:
  id: BAAI/bge-reranker-base
  maxConcurrentRequests: 16
  # Cross-encoder attention over concatenated (query, doc) pairs makes
  # max_batch_tokens the dominant memory driver. 8192 OOMed even at 3Gi;
  # 4096 keeps peak memory under 4Gi and only slightly reduces throughput.
  maxBatchTokens: 4096

service:
  type: ClusterIP
  port: 8002

# PARKED 2026-08-01 for cost. support-platform-slm-router has had ZERO Service
# endpoints since 2026-07-29 (its binary dies on an otel semconv conflict), so
# nothing could reach this tier. Restore to 1 together with the router fix.
replicaCount: 0

resources:
  requests:
    memory: 2Gi
  # bge-reranker-base + TEI's ONNX runtime overhead OOMed at 3Gi during
  # initial model load. Cross-encoders use more memory than dual-encoders
  # because the attention matrix is over concatenated (query, doc)
  # sequences. Combined with reducing max_batch_tokens to 4096, 4Gi has
  # comfortable headroom.
  limits:
    memory: 4Gi

persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 5Gi

keda:
  # Disabled while parked: a memory trigger cannot scale to zero, and it
  # scaled the reranker to 2 on idle baseline memory alone.
  enabled: false
  # See support-platform-embedder — KEDA rejects minReplicaCount=0
  # on cpu/memory triggers and the reranker is on the hot path.
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300

huggingfaceTokenSecret:
  # Flip to true once a real HF token is provisioned (see embedder chart
  # comment). bge-reranker-base is a public model so anonymous pull works.
  enabled: false
  name: support-platform-hf-token
  key: HF_TOKEN
