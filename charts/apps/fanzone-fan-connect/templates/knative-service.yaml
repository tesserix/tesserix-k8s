{{- if .Values.knative.enabled }}
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "fanzone-fan-connect.fullname" . }}
  labels:
    {{- include "fanzone-fan-connect.labels" . | nindent 4 }}
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/disableAutoTLS: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | default "0" | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | default "5" | quote }}
        autoscaling.knative.dev/target: {{ .Values.knative.concurrencyTarget | default "100" | quote }}
        {{- if .Values.knative.scaleDownDelay }}
        autoscaling.knative.dev/scale-down-delay: {{ .Values.knative.scaleDownDelay | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fanzone-fan-connect.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containerConcurrency: {{ .Values.knative.containerConcurrency | default 0 }}
      timeoutSeconds: {{ .Values.knative.timeoutSeconds | default 300 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fanzone-fan-connect.serviceAccountName" . }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default 8091 }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            {{- if ne $key "PORT" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fanzone-fan-connect.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fanzone-fan-connect.fullname" . }}-secrets
                  key: AUTH_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fanzone-fan-connect.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fanzone-fan-connect.fullname" . }}-secrets
                  key: NATS_URL
            # GCP Secret Manager Configuration
            {{- if .Values.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcp.projectId | quote }}
            {{- end }}
            - name: GCP_SECRET_PREFIX
              value: {{ .Values.gcp.secretManager.secretPrefix | quote }}
            - name: USE_GCP_SECRET_MANAGER
              value: "true"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
{{- end }}
