# Production overrides for devai-mcp-hub.

replicaCount: 1

# Bump to roll the Deployment so :latest is re-pulled.
podAnnotations:
  deployedAt: "phase4"

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

gcp:
  projectId: "tesseracthub-480811"
  # CHART-14: the hub previously reused the devai-sre-monitor GCP SA via Workload
  # Identity, bleeding that SA's monitoring/secret access into a hub pod that
  # only needs the registry, Redis, and its mounted ExternalSecret K8s Secret
  # (devai-api-secrets) — none of which require a GCP identity. Disable WI so the
  # pod has no GCP credential. If the hub ever needs direct GCP SM access, give
  # it its OWN minimal SA (e.g. devai-mcp-hub@...) rather than reusing SRE's.
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

registry:
  url: "http://agentregistry.agentregistry-system.svc.cluster.local:12121"
  defaultTenant: "devai"

# Downstream authMode=jwt service token, synced via the existing devai-api
# ExternalSecret (key optional — pod starts cleanly if absent).
serviceToken:
  secret:
    name: "devai-api-secrets"
    key: "DEVAI_MCP_HUB_SERVICE_TOKEN"
