# scrapper-mcp — runs the same image as scrapper-api but starts the MCP server
# (`python -m src.mcp.main`) instead of the FastAPI app. Reuses the same
# database/redis/secrets so it can serve every scraper, publisher, and AI tool
# that the main app already exposes.

replicaCount: 1

image:
  # Always via the GAR mirror (org policy — never ghcr.io directly).
  # Use `:latest`; the CI workflow restarts the deployment after each push so
  # the imagePullPolicy:Always pull surfaces the new image.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/social-media-scrapper/scrapper-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8765
  targetPort: 8765

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  PYTHONUNBUFFERED: "1"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8765"
  MCP_PATH: "/mcp"
  MCP_REQUIRE_AUTH: "true"
  MCP_PUBLIC_URL: "https://scrapper-mcp.tesserix.app"
  MCP_LOG_LEVEL: "INFO"
  RATE_LIMIT_REQUESTS: "30"

# Same database / redis / GCP project as scrapper-api.
database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "scrapper"
  name: "scrapper_db"
  sslmode: "require"

redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

mcp:
  # Name of the K8s secret created by the MCP_API_KEY ExternalSecret.
  apiKeySecret:
    name: scrapper-mcp-secrets
    key: MCP_API_KEY

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

podAnnotations:
  holdApplicationUntilProxyStarts: "true"

podLabels: {}
