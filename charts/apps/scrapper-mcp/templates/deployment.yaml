apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scrapper-mcp.fullname" . }}
  labels:
    {{- include "scrapper-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "scrapper-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "scrapper-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "scrapper-mcp.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Override the API CMD with the MCP entrypoint — same image, different process.
          command: ["python", "-m", "src.mcp.main"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Database (password fetched at runtime from GCP SM via Workload Identity)
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: GCP_PROJECT
              value: {{ .Values.gcp.projectId | default "" | quote }}
            # Bearer token used by the MCP auth middleware (service-to-service).
            # Provisioned by the scrapper-mcp-secrets ExternalSecret.
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.apiKeySecret.name }}
                  key: {{ .Values.mcp.apiKeySecret.key }}
                  optional: true
            # NextAuth secret — same value used by scrapper-web/api so the MCP
            # middleware can verify SSO-issued JWTs signed by the web frontend
            # via /api/mcp/token. Without this, SSO JWT auth silently falls
            # back to MCP_API_KEY-only mode.
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: scrapper-auth-secrets
                  key: NEXTAUTH_SECRET
            # Email allowlist — same one src/api/auth.py uses; the MCP
            # middleware re-checks every JWT against this list.
            - name: ALLOWED_EMAILS
              value: {{ .Values.allowedEmails | default "samyak.rout@gmail.com,mahesh.sangawar@gmail.com" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
