apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockpilot-api.fullname" . }}
  labels:
    {{- include "stockpilot-api.labels" . | nindent 4 }}
spec:
  {{- if and (not .Values.autoscaling.enabled) (not .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stockpilot-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stockpilot-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stockpilot-api.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Database — app resolves password from GCP SM via Workload Identity
            - name: POSTGRES_HOST
              value: {{ .Values.database.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.database.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            # Redis — app resolves password from GCP SM via Workload Identity
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            # Valkey ACL user confining this app to its own key prefix; it is
            # nopass, so the password fetched from SM is accepted and ignored.
            - name: REDIS_USER
              value: {{ .Values.redis.user | default "" | quote }}
            # GCP project — app reads GROQ_API_KEY, DB password, Redis password from SM
            - name: GCP_PROJECT
              value: {{ .Values.gcp.projectId | default "" | quote }}
            # Shared secret with the Next.js BFF proxy. The backend trusts
            # X-User-Email only when X-Internal-Secret matches this value.
            # Same value MUST be on stockpilot-web. Without this, browser
            # API calls 401 because the backend ignores X-User-Email.
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockpilot-auth-secrets
                  key: INTERNAL_AUTH_SECRET
                  optional: true
            # NEXTAUTH_SECRET is referenced by the backend for any direct
            # Authorization: Bearer <jwt> path that bypasses the BFF
            # (e.g. WebSocket auth handshake, system-to-system calls).
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockpilot-auth-secrets
                  key: NEXTAUTH_SECRET
                  optional: true
          # /health does DB+Redis+LLM round-trips, so it can take several
          # seconds while the agent graph is running its tool loops on the
          # event loop. Probe timeouts must comfortably exceed that or
          # kubelet kills in-flight requests with "connection termination".
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 8
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if and .Values.ibGateway .Values.ibGateway.enabled }}
        # IB Gateway sidecar — provides IBKR API on localhost:4001
        - name: ib-gateway
          image: {{ .Values.ibGateway.image | default "ghcr.io/gnzsnz/ib-gateway:latest" }}
          ports:
            - containerPort: {{ .Values.ibGateway.port | default 4001 }}
              protocol: TCP
          env:
            - name: TWS_USERID
              valueFrom:
                secretKeyRef:
                  name: ibkr-credentials
                  key: TWS_USERID
            - name: TWS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ibkr-credentials
                  key: TWS_PASSWORD
            - name: TRADING_MODE
              value: "live"
            - name: TWS_PORT
              value: {{ .Values.ibGateway.port | default "4001" | quote }}
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        {{- end }}
