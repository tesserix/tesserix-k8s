# Default values for stockpilot-api

replicaCount: 1

image:
  repository: ghcr.io/tesserix/stock-analysis/stockpilot-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  PYTHONUNBUFFERED: "1"
  ACCOUNT_MODE: "demo"
  LLM_PROVIDER: "groq"
  SKIP_AUTH: "false"

database:
  host: "timescaledb.timescaledb.svc.cluster.local"
  port: "5432"
  user: "stockpilot"
  name: "stockpilot"
  sslmode: "require"

redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80

keda:
  enabled: false

podAnnotations:
    holdApplicationUntilProxyStarts: true

podLabels: {}

# IB Gateway sidecar (disabled by default)
ibGateway:
  enabled: false
  image: ghcr.io/gnzsnz/ib-gateway:latest
  port: 4001
