# Production overrides for stockpilot-api

replicaCount: 2

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

env:
  PYTHONUNBUFFERED: "1"
  ACCOUNT_MODE: "demo"
  LLM_PROVIDER: "groq"
  SKIP_AUTH: "false"
  ALLOWED_EMAILS: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"
  CORS_ORIGINS: "https://stockpilot.tesserix.app"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"

database:
  host: "timescaledb.timescaledb-stockpilot.svc.cluster.local"
  port: "5432"
  user: "stockpilot"
  name: "stockpilot"
  sslmode: "require"

redis:
  host: "redis.redis-stockpilot.svc.cluster.local"
  port: "6379"
