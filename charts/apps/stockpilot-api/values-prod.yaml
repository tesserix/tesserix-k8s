# Production overrides for stockpilot-api

# Pin to the immutable per-commit tag so deploys cannot be silently
# served stale by the GCP Artifact Registry remote-pull mirror's
# tag-to-digest cache (which has bitten us with `:latest` before).
# The CI workflow at .github/workflows/stockpilot-api-build.yml emits
# `<branch>-<sha>` via docker/metadata-action; bump this on each
# rollout. Once the workflow is updated to also `kustomize edit set
# image` here on each green build, this can become a tracked field.
image:
  tag: "main-63e1bc0"
replicaCount: 0  # parked — product scaled down
resources:
  requests:
    memory: 384Mi
  limits:
    memory: 1Gi
env:
  PYTHONUNBUFFERED: "1"
  ACCOUNT_MODE: "demo"
  LLM_PROVIDER: "groq"
  SKIP_AUTH: "false"
  # Open signup: empty allowlist => any authenticated identity is accepted.
  # Per-user isolation is enforced downstream — repos scope by user_id and
  # the LLM router only reads stockpilot-user-{uid8}-* GCP SM secrets.
  ALLOWED_EMAILS: ""
  # NOTE: ADMIN_EMAILS is intentionally NOT set here. The application
  # resolves it at boot from GCP Secret Manager via Workload Identity:
  #   secret name: prod-stockpilot-admin-emails
  #   project:     tesseracthub-480811
  # Keeping the admin allow-list out of any source-controlled file means
  # a PR to either tesserix/stock-analysis or tesserix/tesserix-k8s cannot
  # add an email to the admin set — only an operator with write access on
  # the SM secret (rotation procedure: `gcloud secrets versions add
  # prod-stockpilot-admin-emails --project=tesseracthub-480811
  # --data-file=-`) can.
  CORS_ORIGINS: "https://stockpilot.tesserix.app"
  # Alpaca Broker API — credentials resolved from GCP SM via Workload Identity
  ALPACA_BROKER_URL: "https://broker-api.sandbox.alpaca.markets"
  ALPACA_AUTH_URL: "https://authx.sandbox.alpaca.markets"
  ALPACA_DATA_URL: "https://data.sandbox.alpaca.markets"
  # IBKR — IB Gateway runs as sidecar on localhost:4001
  IBKR_HOST: "127.0.0.1"
  IBKR_PORT: "4001"
  IBKR_CLIENT_ID: "1"
# IB Gateway sidecar — runs alongside stockpilot-api on localhost:4001.
# Disabled: ibkr-credentials secret is not provisioned, causing the sidecar
# to fail every pod start with CreateContainerConfigError. Re-enable after
# wiring up an ExternalSecret with real TWS credentials.
ibGateway:
  enabled: false
  image: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/gnzsnz/ib-gateway:latest
  port: 4001
autoscaling:
  enabled: false # Replaced by KEDA
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80
keda:
  enabled: false  # parked — cpu/memory triggers cannot scale to zero
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3
  prometheus:
    enabled: true
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    requestRateQuery: 'sum(rate(istio_requests_total{destination_canonical_service="stockpilot-api",reporter="destination"}[2m]))'
    requestRateThreshold: "10"
  memory:
    enabled: true
    threshold: "80"
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
database:
  host: "stockpilot-postgres-rw.stockpilot.svc.cluster.local"
  port: "5432"
  user: "stockpilot"
  name: "stockpilot"
  sslmode: "require"
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  user: "stockpilot"
