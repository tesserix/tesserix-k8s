# Default values for gameverse-server
replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/gameverse-server
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
  # Prometheus metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "8090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: dev-gameverse.tesserix.app
      paths:
        - path: /ws
          pathType: Prefix
        - path: /healthz
          pathType: Prefix
  tls:
    - secretName: gameverse-server-tls
      hosts:
        - dev-gameverse.tesserix.app

resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi


autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

livenessProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gameverse-server
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  PORT: "8090"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://dev-gameverse.tesserix.app"

# ConfigMap for additional configuration
configMap:
  # Workload Identity is always enabled
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "2Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database connection settings
database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "gameverse"
  name: "gameverse"
  sslmode: "require"

# Redis connection settings
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "gameverse"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-gameverse@project.iam.gserviceaccount.com
  secretManager:
    enabled: false
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
