# Production overrides for gameverse-server
# Use with: helm upgrade --values values.yaml --values values-prod.yaml


replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 2Gi
  requests:
    memory: 512Mi

# Production environment
env:
  LOG_LEVEL: "warn"

# HPA and KEDA disabled
autoscaling:
  enabled: false

keda:
  enabled: false

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    enabled: true
    secretPrefix: "prod"

# Production database
database:
  host: "gameverse-postgres-rw.gameverse.svc.cluster.local"
  port: "5432"
  user: "gameverse"
  name: "gameverse"
  sslmode: "require"

# Production Redis
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
