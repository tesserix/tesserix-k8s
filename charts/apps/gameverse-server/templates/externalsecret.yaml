{{- if .Values.gcp.secretManager.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "gameverse-server.fullname" . }}-secrets
  labels:
    {{- include "gameverse-server.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "gameverse-server.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ printf "%s-gameverse-postgresql-password" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: {{ printf "%s-gameverse-mongo-password" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
