# Prod overlay for GKE (tesseract-prod-in-gke). Base defaults live in values.yaml.
# Local/kind uses values-local.yaml instead.
#
# This is our own agentic-registry occupying the aregistry.tesserix.app slot —
# it REPLACES the former third-party agentregistry-dev deployment. To keep the
# existing service and machine routes stable while adding Zitadel SSO, the
# rendered Service must match what the Istio policies and consumers expect:
#   Service `agentregistry` : port 12121, namespace agentregistry-system.
# The ArgoCD app (argocd/prod/apps/ai-apps/agentic-registry.yaml) pins the
# namespace; this overlay pins the name + port via fullnameOverride/service.port.
fullnameOverride: agentregistry

image:
  # Pull via the in-project GAR pull-through mirror of GHCR (same pattern as
  # devai-*): GKE nodes have artifactregistry.reader, so no GHCR pull secret is
  # needed, and Kargo's Warehouse watches this same path for new main-<sha> tags.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/agentic-registry
  # Fallback only — the ArgoCD app pins image.tag and Kargo (kargo-devai:prod)
  # rewrites it to the promoted main-<sha> on every build.
  tag: latest

service:
  type: ClusterIP
  # The OAuth proxy and machine consumers use agentregistry:12121. The
  # container still listens on 8080; the Service maps 12121 -> targetPort http.
  port: 12121

config:
  storeBackend: postgres
  autoMigrate: "false"        # schema owned by db-schema-bootstrap (app agentic-registry-db-schema-bootstrap)
  # Zitadel access tokens carried by the Registry and AgentGateway OAuth
  # proxies share the AgentGateway project audience and administration role.
  # Machine publication/reconciliation keeps using independent tenant-scoped
  # deploy keys. Public reads remain anonymous; every write fails closed
  # without a verified human token or deploy key.
  authMode: jwks
  authJwksUrl: "https://auth.tesserix.app/oauth/v2/keys"
  authIssuer: "https://auth.tesserix.app"
  authAudience: "386930054896026901"
  authGroupsClaim: "urn:zitadel:iam:org:project:386930054896026901:roles"
  authTenantClaim: "urn:zitadel:iam:org:id"
  authAdminEmails: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"
  authAdminRole: "agentregistry.admin"
  authAnonymousRole: read
  publicBaseUrl: "https://aregistry.tesserix.app"
  # Lock CORS to the registry's own public origin (the UI is served same-origin
  # behind the OAuth proxy, so no other browser origin legitimately calls /v0). The base
  # default is "*", which reflects any Origin — fine for local, wrong for prod.
  corsOrigins: "https://aregistry.tesserix.app"
  identityControlPlaneUrl: "http://onboarding-api.onboarding.svc.cluster.local:8080"
  # Agent Registry owns the authorized semantic index in its Postgres catalog;
  # pgvector 0.8.0, vector(256), and the HNSW cosine index are provisioned by
  # agentic-registry-db-schema-bootstrap before this is enabled.
  vectorSearch: "true"
  seedExamples: "false"
  immutableTags: "true"
  # OFF: devai-registry-bootstrap re-POSTs its 1,363 untagged seeds on every
  # ArgoCD sync, and auto-versioning minted a fresh semver row each time —
  # 91 revisions per skill, 116k rows, and an OOMKilled registry. Untagged
  # publishes now upsert tag 'latest'; explicit tags still version normally.
  autoVersion: "false"
  signingDev: "false"         # prod injects a stable Ed25519 SIGNING_PRIVATE_KEY via ESO

database:
  mode: externalSecret

externalSecret:
  enabled: true
  databaseUrlKey: prod-agentic-registry-database-url
  signingKeyEnabled: true
  signingKeyKey: prod-agentic-registry-signing-key
  deployKeysEnabled: true
  koraDeployKeyDigestKey: prod-agentic-registry-kora-deploy-key-sha256
  devaiDeployKeyDigestKey: prod-agentic-registry-devai-deploy-key-sha256
  cliClientIdEnabled: true
  cliClientIdKey: prod-agentregistry-cli-client-id
  forceSync: kora-deploy-key-v3

postgresql:
  enabled: false              # prod reuses the devai CNPG cluster (registry schema in devai_db)

serviceAccount:
  create: true
  name: agentregistry
  # No workload identity needed — the registry reads DATABASE_URL +
  # SIGNING_PRIVATE_KEY from a K8s Secret synced by the central
  # gcp-secret-store ClusterSecretStore, not directly from GCP.
  gcpServiceAccount: ""

keda:
  enabled: true

oauth2Proxy:
  enabled: true
  # Public self-service sign-in. Registry authorization still comes from the
  # verified tenant/project claims; the separate auth.adminEmails list grants
  # the two platform operators global administration.
  projectId: "386930054896026901"
  allowedEmails: []

# Public ingress is owned by manifests/agentic-istio (aregistry.tesserix.app
# -> agentregistry-ui-oauth2-proxy -> agentregistry:12121). The chart's own direct
# VirtualService (registry.tesserix.app, no auth) is intentionally OFF in prod.
istio:
  enabled: false
