# Prod overlay for GKE (tesseract-prod-in-gke). Base defaults live in values.yaml.
# Local/kind uses values-local.yaml instead.
#
# This is our own agentic-registry occupying the aregistry.tesserix.app slot —
# it REPLACES the former third-party agentregistry-dev deployment. To keep the
# existing front door working unchanged (devai-auth-bff SSO + Istio VS +
# AuthorizationPolicies), the rendered Service must match what those expect:
#   Service `agentregistry` : port 12121, namespace agentregistry-system.
# The ArgoCD app (argocd/prod/apps/ai-apps/agentic-registry.yaml) pins the
# namespace; this overlay pins the name + port via fullnameOverride/service.port.
fullnameOverride: agentregistry

image:
  # Pull via the in-project GAR pull-through mirror of GHCR (same pattern as
  # devai-*): GKE nodes have artifactregistry.reader, so no GHCR pull secret is
  # needed, and Kargo's Warehouse watches this same path for new main-<sha> tags.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/agentic-registry
  # Fallback only — the ArgoCD app pins image.tag and Kargo (kargo-devai:prod)
  # rewrites it to the promoted main-<sha> on every build.
  tag: latest

service:
  type: ClusterIP
  # The devai-auth-bff upstream points at agentregistry:12121 — keep this in
  # lockstep with charts/apps/devai-auth-bff/values.yaml
  # (DEVAI_BFF_AREGISTRY_UPSTREAM_URL). The container still listens on 8080;
  # the Service maps 12121 -> targetPort http.
  port: 12121

config:
  storeBackend: postgres
  autoMigrate: "false"        # schema owned by db-schema-bootstrap (app agentic-registry-db-schema-bootstrap)
  # AUTH_MODE=anonymous — the security boundary is the mesh + the BFF, NOT the
  # app's own token check (this mirrors how the replaced solo.io registry ran
  # with enableAnonymousAuth=true):
  #   * Public UI  -> devai-auth-bff (GIP SSO) gates every human request,
  #     then reverse-proxies in.
  #   * In-cluster -> Istio AuthorizationPolicies (manifests/agentic-istio)
  #     restrict /v0 WRITES to the devai-registry-bootstrap SA and READS to the
  #     devai / kagent-system / agentgateway-system namespaces.
  # The agent control plane (devai-registry-bootstrap writes, agentgateway +
  # kagent reads) authenticates with the shared HMAC jwt-secret, which a
  # Keycloak JWKS check would reject — so flipping authMode to "jwks" here would
  # break catalog seeding + internal reads. Native per-user JWKS on the external
  # API is a follow-up: it needs a hybrid auth mode (try-bearer, else trust the
  # mesh) plus an M2M Keycloak token for the bootstrap Job. JWKS endpoints are
  # left wired below for that flip.
  authMode: anonymous
  authJwksUrl: "https://identity-devai.tesserix.app/realms/devai/protocol/openid-connect/certs"
  authIssuer: "https://identity-devai.tesserix.app/realms/devai"
  authAudience: agentic-registry
  # Single-org (tesserix) registry behind anonymous auth — the BFF + mesh are
  # the security boundary. Namespace is just an optional grouping/uniqueness
  # key: an unscoped list (no ?namespace=) returns every readable row, while
  # the DevAI catalog is seeded under and read with namespace 'devai'.
  # (There is no MULTI_TENANT knob — it was inert and has been removed; the
  # registry has no separate single/multi-tenant list mode.)
  publicBaseUrl: "https://aregistry.tesserix.app"
  # Lock CORS to the registry's own public origin (the UI is served same-origin
  # behind the BFF, so no other browser origin legitimately calls /v0). The base
  # default is "*", which reflects any Origin — fine for local, wrong for prod.
  corsOrigins: "https://aregistry.tesserix.app"
  # devai-postgres (ghcr.io/cloudnative-pg/postgresql:16.4) has no pgvector,
  # so semantic ranking is off. Re-enable when the cluster image carries the
  # extension (and restore the embedding column in the devai schema variant).
  vectorSearch: "false"
  seedExamples: "false"
  immutableTags: "true"
  # OFF: devai-registry-bootstrap re-POSTs its 1,363 untagged seeds on every
  # ArgoCD sync, and auto-versioning minted a fresh semver row each time —
  # 91 revisions per skill, 116k rows, and an OOMKilled registry. Untagged
  # publishes now upsert tag 'latest'; explicit tags still version normally.
  autoVersion: "false"
  signingDev: "false"         # prod injects a stable Ed25519 SIGNING_PRIVATE_KEY via ESO

database:
  mode: externalSecret

externalSecret:
  enabled: true
  databaseUrlKey: prod-agentic-registry-database-url
  signingKeyEnabled: true
  signingKeyKey: prod-agentic-registry-signing-key

postgresql:
  enabled: false              # prod reuses the devai CNPG cluster (registry schema in devai_db)

serviceAccount:
  create: true
  name: agentregistry
  # No workload identity needed — the registry reads DATABASE_URL +
  # SIGNING_PRIVATE_KEY from a K8s Secret synced by the central
  # gcp-secret-store ClusterSecretStore, not directly from GCP.
  gcpServiceAccount: ""

keda:
  enabled: true

# Public ingress is owned by manifests/agentic-istio (aregistry.tesserix.app
# -> devai-auth-bff -> agentregistry:12121). The chart's own direct
# VirtualService (registry.tesserix.app, no auth) is intentionally OFF in prod.
istio:
  enabled: false
