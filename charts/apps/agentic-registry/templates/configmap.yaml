apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-registry.fullname" . }}-config
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
data:
  ADDR: ":8080"
  STORE_BACKEND: {{ .Values.config.storeBackend | quote }}
  AUTO_MIGRATE: {{ .Values.config.autoMigrate | quote }}
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  AUTH_JWKS_URL: {{ .Values.config.authJwksUrl | quote }}
  AUTH_ISSUER: {{ .Values.config.authIssuer | quote }}
  AUTH_AUDIENCE: {{ .Values.config.authAudience | quote }}
  AUTH_GROUPS_CLAIM: {{ .Values.config.authGroupsClaim | quote }}
  AUTH_TRUSTED_PROXY: {{ .Values.config.authTrustedProxy | quote }}
  MULTI_TENANT: {{ .Values.config.multiTenant | quote }}
  PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  WEB_DIR: {{ .Values.config.webDir | quote }}
