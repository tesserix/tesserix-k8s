{{- if .Values.postgresql.enabled -}}
# Bundled PostgreSQL for LOCAL / kind only. Prod uses an external CNPG cluster
# (postgresql.enabled=false) and never renders this. The password is read from
# the same Secret as DATABASE_URL so there is a single source of local secrets.
{{- if eq .Values.postgresql.persistence "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentic-registry.fullname" . }}-postgresql
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-registry.fullname" . }}-postgresql
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "agentic-registry.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-registry.fullname" . }}-postgresql
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentic-registry.name" . }}-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentic-registry.name" . }}-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres uid in the alpine image
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.passwordSecret.name | quote }}
                  key: {{ .Values.postgresql.passwordSecret.key | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if eq .Values.postgresql.persistence "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "agentic-registry.fullname" . }}-postgresql
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
