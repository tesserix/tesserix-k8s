{{- if .Values.externalSecret.enabled -}}
# Syncs the Postgres DSN from GCP Secret Manager into a K8s Secret. The registry
# DB credential never lives in git or in the registry's own database.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agentic-registry.fullname" . }}-secrets
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
  {{- with .Values.externalSecret.forceSync }}
  annotations:
    force-sync: {{ . | quote }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "agentic-registry.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.databaseUrlKey }}
    {{- if .Values.externalSecret.signingKeyEnabled }}
    # Stable base64 Ed25519 key so Agent Cards keep a verifiable signature
    # across pod restarts (prod replaces the ephemeral SIGNING_DEV key).
    - secretKey: SIGNING_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.externalSecret.signingKeyKey }}
    {{- end }}
    {{- if .Values.externalSecret.deployKeysEnabled }}
    - secretKey: KORA_DEPLOY_KEY_SHA256
      remoteRef:
        key: {{ .Values.externalSecret.koraDeployKeyDigestKey }}
    - secretKey: DEVAI_DEPLOY_KEY_SHA256
      remoteRef:
        key: {{ .Values.externalSecret.devaiDeployKeyDigestKey }}
    {{- end }}
    {{- if .Values.externalSecret.cliClientIdEnabled }}
    - secretKey: AUTH_CLI_CLIENT_ID
      remoteRef:
        key: {{ .Values.externalSecret.cliClientIdKey }}
    {{- end }}
{{- end }}
