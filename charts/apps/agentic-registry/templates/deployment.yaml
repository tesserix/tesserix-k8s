apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-registry.fullname" . }}
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
  {{- if .Values.externalSecret.enabled }}
  annotations:
    secret.reloader.stakater.com/reload: {{ include "agentic-registry.fullname" . }}-secrets
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "agentic-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agentic-registry.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentic-registry.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000           # `aregistry` user baked into the image (see deploy/Dockerfile)
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgresql.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "agentic-registry.fullname" . }}-postgresql -p 5432 -U {{ .Values.postgresql.user }}; do echo waiting for postgres; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: registry
          image: {{ include "agentic-registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "agentic-registry.fullname" . }}-config
          env:
            {{- if and .Values.oauth2Proxy.enabled (empty .Values.config.authAudience) }}
            - name: AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2Proxy.name }}
                  key: client-id
            {{- end }}
            {{- if eq .Values.database.mode "externalSecret" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-registry.fullname" . }}-secrets
                  key: DATABASE_URL
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name | quote }}
                  key: {{ .Values.database.existingSecret.key | quote }}
            {{- end }}
            {{- if and .Values.externalSecret.enabled .Values.externalSecret.signingKeyEnabled }}
            - name: SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-registry.fullname" . }}-secrets
                  key: SIGNING_PRIVATE_KEY
            {{- end }}
            {{- if and .Values.externalSecret.enabled .Values.externalSecret.deployKeysEnabled }}
            - name: KORA_DEPLOY_KEY_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-registry.fullname" . }}-secrets
                  key: KORA_DEPLOY_KEY_SHA256
            - name: DEVAI_DEPLOY_KEY_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-registry.fullname" . }}-secrets
                  key: DEVAI_DEPLOY_KEY_SHA256
            - name: AUTH_DEPLOY_KEYS
              value: "kora=$(KORA_DEPLOY_KEY_SHA256),devai=$(DEVAI_DEPLOY_KEY_SHA256)"
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          # Memory-only resources — no CPU keys (platform policy).
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # readOnlyRootFilesystem ⇒ writable scratch via emptyDir (no provisioner).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
