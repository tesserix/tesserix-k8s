{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentic-registry.serviceAccountName" . }}
  labels: {{- include "agentic-registry.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.gcpServiceAccount .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
