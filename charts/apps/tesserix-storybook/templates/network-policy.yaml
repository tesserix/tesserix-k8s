apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tesserix-storybook.fullname" . }}-allow-istio-ingress
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tesserix-storybook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tesserix-storybook.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
