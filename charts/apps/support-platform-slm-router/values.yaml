namespace: support-platform
name: support-platform-slm-router

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/slm-support-platform/slm-router
  tag: "main"  # ArgoCD overrides via image.tag parameter; Kargo
  # support-platform/prod writes the newest main-<sha> on every CI
  # build, so no manual bump needed.
  # IfNotPresent: the pod crashloops on an OTel schema conflict, and with
  # Always it re-pulled the full image from ghcr on every restart, driving
  # Cloud NAT cost. New Kargo-promoted tags are still pulled (different tag).
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8090

replicaCount: 1

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  # Use pod-DNS via the headless support-platform-mongo Service so the
  # hostname mongod thinks it has matches what the driver resolves to.
  # ?replicaSet=rs0&directConnection=true keeps the driver from trying
  # discovery (the headless DNS would round-robin in a multi-pod
  # cluster, which we don't run yet).
  MONGO_URI: "mongodb://support-platform-mongo-0.support-platform-mongo.support-platform.svc.cluster.local:27017/?replicaSet=rs0&directConnection=true"
  MONGO_DATABASE: "otto"
  INFERENCE_URL: "http://support-platform-slm-inference.support-platform.svc.cluster.local:8000"
  EMBEDDER_URL: "http://support-platform-embedder.support-platform.svc.cluster.local:8001"
  RERANKER_URL: "http://support-platform-reranker.support-platform.svc.cluster.local:8002"
  ROUTES_FILE: "/etc/slm-router/routes.yaml"
  ROUTE_RELOAD_INTERVAL: "60s"
  # OpenTelemetry: OTLP/gRPC endpoint for the in-cluster collector.
  # slm-router exports traces + metrics here. Empty disables telemetry.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-gateway.observability.svc.cluster.local:4317"

# pgvector DSN. The userPassword secret is created by the CNPG cluster
# bootstrap; we mount it via secretKeyRef.
vectorDB:
  host: support-platform-postgres-rw.support-platform.svc.cluster.local
  port: 5432
  user: support_platform
  database: support_platform
  sslmode: require
  passwordSecret: support-platform-postgres-app   # CNPG-managed
  passwordKey: password

# Per-tenant routing rules. Mounted as a ConfigMap at ROUTES_FILE.
# Edit this values block to add/change tenant config — reload happens
# every ROUTE_RELOAD_INTERVAL without a restart.
routes:
  # Fallback product used when X-Tenant-Id on an Otto message doesn't
  # match any Products key or alias. mark8ly's storefront sends
  # platform-api UUIDs (one per store) that aren't enumerated below —
  # the default catches them so AI replies still happen. Set to "" to
  # make unknown tenants escalate instead.
  defaultTenant: mark8ly
  products:
    mark8ly:
      systemPromptFile: /etc/slm-router/prompts/mark8ly.md
      ragNamespace: mark8ly
      mcpServers:
        - name: mark8ly-mcp
          url: http://mark8ly-mcp.mark8ly.svc.cluster.local:8765/mcp
          authHeader: X-MCP-Key
          authEnvVar: MARK8LY_MCP_KEY
      escalation:
        confidenceThreshold: 0.6
        # "refund"/"cancellation" are normal questions the AI should answer
        # first (explain policy via the knowledge base, then file a refund
        # REQUEST via create_refund_request). Only genuinely human/legal
        # matters hard-escalate immediately.
        keywords: ["lawyer", "ombudsman", "legal action", "chargeback"]
        maxToolFailures: 2
        # Let the AI try to resolve the query for a few turns before it
        # hands a low-confidence chat to a human. The customer can still
        # force a handoff anytime ("talk to a human") and hard keywords
        # above always escalate immediately.
        minTurns: 5
      # On every escalation, POST the conversation context to
      # marketplace-api so a durable ticket lands in the merchant's
      # dashboard. Idempotent on conversation_id; safe to retry.
      escalationHook:
        # marketplace-api moved to the mark8ly namespace + per-mode services;
        # the old marketplace-api.marketplace host no longer resolves (the
        # hook was failing with "no such host"). Point at the admin engine,
        # which registers /internal/v1/tickets/from-conversation.
        url: http://mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080/internal/v1/tickets/from-conversation
        authHeader: X-Internal-Auth
        authEnvVar: MARKETPLACE_INTERNAL_AUTH
    fanzone:
      systemPromptFile: /etc/slm-router/prompts/fanzone.md
      ragNamespace: fanzone
      mcpServers:
        - name: fanzone-mcp
          url: http://fanzone-mcp.fanzone.svc.cluster.local:8765/mcp
          authHeader: X-MCP-Key
          authEnvVar: FANZONE_MCP_KEY
      escalation:
        confidenceThreshold: 0.65
        keywords: ["refund", "chargeback"]
        maxToolFailures: 2
    homechef:
      systemPromptFile: /etc/slm-router/prompts/homechef.md
      ragNamespace: homechef
      # Chef/vendor chats (mobile-vendor app) arrive as tenant
      # "homechef-vendor" — same brain + hooks until a dedicated vendor
      # KB namespace ships.
      aliases: ["homechef-vendor"]
      mcpServers:
        - name: homechef-mcp
          url: http://homechef-mcp.homechef.svc.cluster.local:8765/mcp
          authHeader: X-MCP-Key
          authEnvVar: HOMECHEF_MCP_KEY
      escalation:
        confidenceThreshold: 0.6
        keywords: ["food poisoning", "allergic reaction", "lawyer"]
        maxToolFailures: 2
      # On needs_human, materialise a durable ticket in homechef's own DB
      # so the escalation shows in the admin Support desk. Idempotent on
      # conversation_id; safe to retry.
      escalationHook:
        # homechef-api's ClusterIP is `homechef-api-direct` (the plain
        # `homechef-api` name belongs to the retired Knative route and does
        # not resolve).
        url: http://homechef-api-direct.homechef.svc.cluster.local:8080/internal/support/tickets/from-conversation
        authHeader: X-Internal-Auth
        authEnvVar: HOMECHEF_SUPPORT_HOOK_SECRET
    stockpilot:
      systemPromptFile: /etc/slm-router/prompts/stockpilot.md
      ragNamespace: stockpilot
      mcpServers:
        - name: stockpilot-mcp
          url: http://stockpilot-mcp.stockpilot.svc.cluster.local:8765/mcp
          authHeader: X-MCP-Key
          authEnvVar: STOCKPILOT_MCP_KEY
      # Lower threshold: a wrong financial answer is high blast radius —
      # escalate to a human aggressively. "regulator" / "complaint" /
      # "ASIC" force a human regardless of confidence.
      escalation:
        confidenceThreshold: 0.7
        keywords: ["regulator", "complaint", "asic", "fraud", "lawyer"]
        maxToolFailures: 2
    gameverse:
      systemPromptFile: /etc/slm-router/prompts/gameverse.md
      ragNamespace: gameverse
      mcpServers:
        - name: gameverse-mcp
          url: http://gameverse-mcp.gameverse.svc.cluster.local:8765/mcp
          authHeader: X-MCP-Key
          authEnvVar: GAMEVERSE_MCP_KEY
      escalation:
        confidenceThreshold: 0.6
        keywords: ["cheater", "ban appeal", "harassment", "lawyer"]
        maxToolFailures: 2
    horoscope:
      systemPromptFile: /etc/slm-router/prompts/horoscope.md
      ragNamespace: horoscope
      mcpServers:
        - name: horoscope-mcp
          url: http://horoscope-mcp.horoscope.svc.cluster.local:8765/mcp
          authHeader: X-MCP-Key
          authEnvVar: HOROSCOPE_MCP_KEY
      # Higher threshold + "for entertainment only" guardrail —
      # medical / financial / legal questions ALWAYS escalate so the
      # SLM never poses as a professional.
      escalation:
        confidenceThreshold: 0.75
        keywords: ["medical", "doctor", "legal", "lawyer", "investment", "suicide", "self-harm"]
        maxToolFailures: 2
    # scrapper — DECOMMISSIONED 2026-07-26. This tenant pointed at
    # scrapper-mcp.scrapper.svc.cluster.local:8765, a Service that did not
    # exist even before the namespace was removed, so the route was
    # already dead config.
    # Admin -> Tesserix-employee support surface. The customer here is
    # NOT a shopper — it's a merchant admin asking for platform help
    # (billing, store setup, downtime, etc.). No MCP yet; chat-only
    # answers come from the platform RAG namespace. Tighter escalation
    # threshold so unfamiliar platform asks go to a Tesserix employee
    # quickly instead of being made up.
    platform:
      systemPromptFile: /etc/slm-router/prompts/platform.md
      ragNamespace: platform
      # tesserix-home (the company app) chats route here. platform-mcp
      # serves company overview + contact-lead capture. Auth is left to
      # the NetworkPolicy (gateway runs open within support-platform), so
      # no authHeader/authEnvVar is needed.
      mcpServers:
        - name: platform-mcp
          url: http://platform-mcp.support-platform.svc.cluster.local:8765/mcp
      escalation:
        confidenceThreshold: 0.8
        keywords: ["billing dispute", "outage", "incident", "data deletion", "gdpr", "lawsuit", "subpoena"]
        maxToolFailures: 0

# MCP API keys are injected as env vars (referenced by name in the
# routes config above). The ExternalSecret for support-platform-slm-router
# materialises these from GCP Secret Manager.
mcpKeysSecret: support-platform-slm-router-mcp-keys
