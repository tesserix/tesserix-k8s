# Per-tenant routing rules mounted into the pod at ROUTES_FILE.
# slm-router reloads this file every ROUTE_RELOAD_INTERVAL; a values
# edit + ArgoCD sync takes effect without a pod restart.
#
# Camel-case keys in values.yaml are converted to snake_case here to match
# the Go YAML tags in services/slm-router/internal/config/config.go.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-routes
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-platform-slm-router.labels" . | nindent 4 }}
data:
  routes.yaml: |
    {{- if .Values.routes.defaultTenant }}
    default_tenant: {{ .Values.routes.defaultTenant | quote }}
    {{- end }}
    products:
{{- range $tenant, $cfg := .Values.routes.products }}
      {{ $tenant }}:
        system_prompt_file: {{ $cfg.systemPromptFile | quote }}
        rag_namespace: {{ $cfg.ragNamespace | quote }}
        {{- if $cfg.aliases }}
        aliases:
        {{- range $cfg.aliases }}
          - {{ . | quote }}
        {{- end }}
        {{- end }}
        mcp_servers:
        {{- range $cfg.mcpServers }}
          - name: {{ .name | quote }}
            url: {{ .url | quote }}
            auth_header: {{ .authHeader | quote }}
            auth_env_var: {{ .authEnvVar | quote }}
        {{- end }}
        escalation:
          confidence_threshold: {{ $cfg.escalation.confidenceThreshold }}
          keywords:
          {{- range $cfg.escalation.keywords }}
            - {{ . | quote }}
          {{- end }}
          max_tool_failures: {{ $cfg.escalation.maxToolFailures }}
        {{- if $cfg.escalationHook }}
        # Per-tenant ticket-creation hook fired after needs_human flips
        # true. mark8ly points this at marketplace-api's internal route
        # so a durable ticket lands in the merchant's dashboard.
        escalation_hook:
          url: {{ $cfg.escalationHook.url | quote }}
          auth_header: {{ $cfg.escalationHook.authHeader | default "" | quote }}
          auth_env_var: {{ $cfg.escalationHook.authEnvVar | default "" | quote }}
        {{- end }}
        {{- if $cfg.chatStartedHook }}
        # Per-tenant new-chat hook fired on the FIRST customer message
        # of every conversation. Lets the product backend log "new chat
        # started" in its own DB so the team has visibility outside
        # Otto's admin inbox. Endpoint must be idempotent on
        # conversation_id.
        chat_started_hook:
          url: {{ $cfg.chatStartedHook.url | quote }}
          auth_header: {{ $cfg.chatStartedHook.authHeader | default "" | quote }}
          auth_env_var: {{ $cfg.chatStartedHook.authEnvVar | default "" | quote }}
        {{- end }}
{{- end }}
