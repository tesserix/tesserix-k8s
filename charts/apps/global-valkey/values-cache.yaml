# global-valkey-cache — evictable, non-durable. Losing a key here costs a
# cache miss, so AOF is off and memory pressure evicts rather than errors.
nameOverride: global-valkey-cache

valkey:
  maxmemory: 512mb
  maxmemoryPolicy: allkeys-lru
  appendonly: "no"

persistence:
  enabled: false

acl:
  enabled: true
  users:
    - name: devai
      prefix: devai
    - name: homechef
      prefix: homechef
    - name: marketplace
      prefix: marketplace
    - name: tesserix
      prefix: tesserix

networkPolicy:
  enabled: true
  allowedNamespaces:
    - devai
    - homechef
    - marketplace
    - social
