apiVersion: v1
kind: Service
metadata:
  name: {{ include "global-valkey.headless" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-valkey.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Sentinel must reach a pod by its stable DNS name before it is Ready,
  # otherwise the cluster can never bootstrap a primary.
  publishNotReadyAddresses: true
  selector:
    {{- include "global-valkey.selectorLabels" . | nindent 4 }}
  ports:
    - name: valkey
      port: {{ .Values.valkey.port }}
      targetPort: valkey
    {{- if .Values.sentinel.enabled }}
    - name: sentinel
      port: {{ .Values.sentinel.port }}
      targetPort: sentinel
    {{- end }}
---
{{- if .Values.sentinel.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "global-valkey.name" . }}-sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-valkey.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "global-valkey.selectorLabels" . | nindent 4 }}
  ports:
    - name: sentinel
      port: {{ .Values.sentinel.port }}
      targetPort: sentinel
{{- end }}
