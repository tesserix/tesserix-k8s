# Sentinel needs 2 of 3 members to hold quorum, so never let voluntary
# disruption take more than one at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "global-valkey.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-valkey.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "global-valkey.selectorLabels" . | nindent 6 }}
---
{{- if .Values.haproxy.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "global-valkey.name" . }}-haproxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-valkey.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "global-valkey.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: haproxy
{{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "global-valkey.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-valkey.labels" . | nindent 4 }}
{{- end }}
