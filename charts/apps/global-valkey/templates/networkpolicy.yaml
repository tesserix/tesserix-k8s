{{- if .Values.networkPolicy.enabled }}
# With no password on the data path, this policy is the access control. Only
# named consumer namespaces and the instance's own pods may reach the ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "global-valkey.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "global-valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "global-valkey.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "global-valkey.selectorLabels" . | nindent 14 }}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.valkey.port }}
        {{- if .Values.sentinel.enabled }}
        - protocol: TCP
          port: {{ .Values.sentinel.port }}
        {{- end }}
{{- end }}
