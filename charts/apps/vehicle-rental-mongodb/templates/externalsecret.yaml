{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: chat-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ "{{" }} .username {{ "}}" }}"
        password: "{{ "{{" }} .password {{ "}}" }}"
        # The connection string the chat-gateway consumes, assembled here so no
        # workload has to concatenate credentials itself.
        MONGODB_URI: "mongodb://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password {{ "}}" }}@{{ .Values.fullnameOverride }}.{{ .Values.namespace }}.svc.cluster.local:27017/{{ .Values.database }}?authSource=admin"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.usernameSecret }}
        version: latest
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.passwordSecret }}
        version: latest
{{- end }}
