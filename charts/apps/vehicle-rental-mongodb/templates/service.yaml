apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: chat-store
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
