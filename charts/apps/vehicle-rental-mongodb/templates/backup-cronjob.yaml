{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fullnameOverride }}-backup
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: chat-store
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.backup.serviceAccount }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.fullnameOverride }}-backup
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vehicle-rental-app
    app.kubernetes.io/component: chat-store
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          annotations:
            # Workload Identity needs the metadata server reachable.
            traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
          labels:
            app.kubernetes.io/part-of: vehicle-rental-app
        spec:
          serviceAccountName: {{ .Values.fullnameOverride }}-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: {{ .Values.backup.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.externalSecret.secretName }}
                      key: MONGODB_URI
                # Non-root with a read-only root: gcloud/gsutil state goes to /tmp.
                - name: HOME
                  value: /tmp
                - name: CLOUDSDK_CONFIG
                  value: /tmp/gcloud
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mongodump --uri="$MONGODB_URI" --archive=/tmp/dump.gz --gzip
                  gsutil cp /tmp/dump.gz {{ .Values.backup.destination }}/${stamp}.gz
                  # Prune by age here: GCS lifecycle rules are bucket-wide and this
                  # bucket also holds Postgres WAL on a different retention.
                  cutoff=$(date -u -d "{{ .Values.backup.retentionDays }} days ago" +%Y%m%d)
                  gsutil ls {{ .Values.backup.destination }}/ | while read -r obj; do
                    name=$(basename "$obj" .gz)
                    [ "${name%%T*}" -lt "$cutoff" ] && gsutil rm "$obj" || true
                  done
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
