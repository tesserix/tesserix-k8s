# Chatbot conversation store. ADR-0012: `conversation` and `message` documents,
# nothing else, ever. Losing this loses chat history and must not lose a booking,
# a rupee or a ticket — which is why it is sized and backed up like a cache and
# Postgres is not.

namespace: vehicle-rental-data
fullnameOverride: vehicle-rental-mongodb

replicaCount: 1

image:
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

database: vehicle_rental_chat

# Memory only — the platform sets no CPU requests or limits.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

persistence:
  enabled: true
  size: 20Gi
  storageClassName: standard-rwo-retain

# Root credentials come from GCP Secret Manager: platform-owned infrastructure
# credentials, not tenant data (tesserix-k8s/CLAUDE.md § Secret stores).
externalSecret:
  enabled: true
  secretName: vehicle-rental-mongodb-credentials
  usernameSecret: prod-vehicle-rental-mongodb-username
  passwordSecret: prod-vehicle-rental-mongodb-password

# Nightly logical dump to the same bucket as the Postgres backups. RPO 1h/RTO 4h
# per infrastructure.md — derived, non-critical data.
backup:
  enabled: true
  schedule: "30 3 * * *"
  destination: "gs://tesseract-prod-backups-in/vehicle-rental-mongodb"
  image: "google/cloud-sdk:slim"
  serviceAccount: "app-secrets-infra-prod@tesseracthub-480811.iam.gserviceaccount.com"
  retentionDays: 14
