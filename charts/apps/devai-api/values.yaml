# Default values for devai-api

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai
  pullPolicy: Always
  # CHART-7: no floating :latest. Immutable release seed; Kargo
  # (kargo-devai:prod) overwrites this via the ArgoCD app's helm parameter on
  # every promotion, with ignoreDifferences keeping selfHeal from reverting it.
  tag: "fix-multi-provider-user-routing-c5d89ea@sha256:b7c12bce32ce5ed8712034f73bf2688ba26ce1a963a430c1e689777e2704772e"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

rbac:
  create: true  # ClusterRole for ArgoCD CRDs, K8s resources, Istio, cert-manager

# Namespaced Role/RoleBinding letting devai-api spawn the SDD runtime's Jobs/
# Deployments/Services/VirtualServices (runtime-rbac.yaml). Default off so a
# bare `helm template` renders; values-prod.yaml enables it in prod.
k8sRuntime:
  enabled: false

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  DEVAI_HOST: "0.0.0.0"
  DEVAI_PORT: "8080"
  DEVAI_LOG_LEVEL: "info"
  DEVAI_SCM_PROVIDER: "github"
  # NB: DEVAI_SCM_AUTH_METHOD is set explicitly to "pat" further down in
  # deployment.yaml so the SCM factory dials GitHub via the PAT (which
  # the devai-github-pat External Secret syncs). Keeping the variable
  # in both places caused a duplicate-env error in ArgoCD strict diff.
  DEVAI_GITHUB_ORG: "tesserix"
  DEVAI_AUTH_PROVIDER: "gip"
  DEVAI_CLAUDE_MODEL: "claude-sonnet-4-20250514"
  DEVAI_OPENAI_MODEL: "o3"
  DEVAI_GROQ_MODEL: "llama-3.3-70b-versatile"
  DEVAI_NEMOCLAW_ENDPOINT: "http://nemoclaw-inference.devai.svc.cluster.local:8000/v1"
  DEVAI_NEMOCLAW_MODEL: "nvidia/nemotron-3-super-120b-a12b"
  DEVAI_NEMOCLAW_FALLBACK_TO_GROQ: "true"
  DEVAI_LANGCHAIN_TRACING_V2: "true"
  DEVAI_LANGCHAIN_PROJECT: "devai"
  # Platform owners — granted the "admin" role on every authenticated
  # request (identity._apply_admin_role). bff-stamped principals carry no
  # roles, so without this nobody is admin and the analytics global/by-user
  # views are unreachable.
  DEVAI_ADMIN_EMAILS: "samyak.rout@gmail.com,mahesh.sangawar@gmail.com"
  # OpenTelemetry — export traces + metrics (HTTP requests, pipeline stages,
  # LLM calls) to the in-cluster collector over OTLP/HTTP. Metrics land in
  # Prometheus (when re-enabled) via the collector's scrape endpoint; the
  # dashboard /analytics page reads collector health.
  # Parked as "noop" while otel-gateway/otel-cluster sit at replicaCount: 0 —
  # the adapter only degrades on a build failure, not on a dead endpoint, so
  # "otel" here means every batch retries and floods the logs with
  # "Failed to export span batch / Connection reset by peer".
  # Flip back to "otel" in the same commit that scales the collectors up.
  DEVAI_TELEMETRY_PROVIDER: "noop"
  DEVAI_OTEL_ENDPOINT: "http://otel-gateway.observability.svc.cluster.local:4318"
  DEVAI_OTEL_SERVICE_NAME: "devai-api"
  # Browser-facing Grafana base — powers the analytics "Open agent traces in
  # Grafana" deep link (Tempo datasource). Agent → stage → llm-call spans are
  # exported via the collector to Tempo and queryable here. Canonical host is
  # grafana.tesserix.app (Istio-routed); mark8ly is the legacy alias.
  DEVAI_GRAFANA_PUBLIC_URL: "https://grafana.tesserix.app"
  # Log archive (dashboard /logs page). The devai-log-archiver CronJob writes
  # this bucket; devai-api only LISTS it (WIF SA has objectViewer). Purge days
  # mirrors the bucket lifecycle delete rule + the purge CronJob.
  DEVAI_LOG_ARCHIVE_BUCKET: "devai-prod-logs-in"
  DEVAI_LOG_PURGE_DAYS: "15"
  DEVAI_PIPELINE_LABEL: "devai:automate"
  DEVAI_MAX_REVIEW_ITERATIONS: "3"
  # Onboarding integrity check — the in-process reconcile poller re-scans
  # every onboarded repo for its .platform/devai.yaml marker on this cadence,
  # adopting newly-marked repos and dropping ones whose marker (or repo) was
  # deleted. Hourly per ops requirement; the Repos page "Re-scan" button runs
  # the same reconcile on demand.
  DEVAI_ONBOARDING_RECONCILE_INTERVAL_SECONDS: "3600"
  DEVAI_DASHBOARD_BASE_URL: "https://devai.tesserix.app"
  # Mount per-domain downstream MCP servers (/mcp/scm, /mcp/sample) so the
  # devai-mcp-hub federates real runnable tools (docs/agentic/MCP-HUB.md §8).
  DEVAI_MCP_DOWNSTREAM_SERVERS_ENABLED: "true"
  DEVAI_GKE_CLUSTER: "tesseract-prod-in-gke"
  DEVAI_GKE_REGION: "asia-south1"
  DEVAI_GKE_PROJECT: "tesseracthub-480811"
  DEVAI_GKE_USE_IN_CLUSTER: "true"
  DEVAI_ARGOCD_NAMESPACE: "argocd"
  DEVAI_ARGOCD_SYNC_TIMEOUT: "300"
  DEVAI_ARGOCD_HEALTH_TIMEOUT: "120"

database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "devai"
  name: "devai_db"

# LOCAL/sandbox schema bootstrap. OFF by default — in prod the schema is applied
# by the db-schema-bootstrap CronJob (tesserix-k8s). values-local.yaml flips this
# on so a fresh kind cluster gets devai_db's tables via an init container.
schemaBootstrap:
  enabled: false
  image: "postgres:16-alpine"

# LOCAL/sandbox username-password auth seed. OFF by default — in prod auth is
# terminated by the auth-bff (GIP). When enabled, the auth-seed init container
# upserts `users` into devai_local_users and the local_db identity adapter
# authenticates against that table.
localAuth:
  enabled: false
  image: "postgres:16-alpine"
  users: []

redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  # Valkey ACL user; empty means password-only auth (local sandbox).
  user: ""

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
  # NATS operator/JWT account credentials (devai side of Home-Chef-App#758).
  # OFF by default — the app connects anonymously while this is false, so the
  # whole block stays inert until the cluster enforces NATS auth. When enabled
  # (together with gcp.secretManager.enabled), the chart mounts the DevAI
  # account .creds file and points DEVAI_NATS_CREDS at it.
  auth:
    enabled: false

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""
  # ExternalSecret-backed sync of the NATS .creds file (see externalsecret.yaml).
  # OFF by default. devai-api's primary secrets come from the standalone
  # ExternalSecret in external-secrets/prod/devai/; this block only governs the
  # dedicated, gated NATS-creds ExternalSecret this chart renders when NATS auth
  # is turned on, so it never touches the existing devai-api-secrets Secret.
  secretManager:
    enabled: false
    secretPrefix: "devtest"  # prod overrides to "prod" (GCP SM keys are prod-*)
    secretStore: "gcp-secret-store"
    refreshInterval: "1h"

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

keda:
  enabled: false

podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-04-08T05:22:00Z"
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

podLabels: {}

# ─── Durable orchestration (Temporal) ───────────────────────────────────────
# Leave `temporal` unset → devai-api executes blueprints IN-PROCESS (the default,
# unchanged). Define it (see values-prod.yaml) to route every blueprint through
# the ONE generic BlueprintWorkflow on the Temporal cluster. The same config is
# shared by devai-api (enqueues runs) and devai-worker (executes them) via the
# `devai-api.containerEnv` helper, so the two can never drift.
#
# PREREQUISITE: the devai image must include the `temporalio` SDK. It is a hard
# dependency in pyproject.toml, so any image built after that change ships it —
# just rebuild/push the devai image, then enable. (devai-api degrades to
# in-process automatically if temporalio is somehow absent; the worker pod imports
# it at startup, so only enable `worker` once the image actually ships it.)
#
# temporal:
#   provider: temporal                                    # temporal | inproc | noop
#   host: temporal-frontend.temporal-system.svc.cluster.local:7233
#   podCIDR: <cluster-pod-cidr>
#   namespace: default
#   taskQueue: devai
#   tlsEnabled: false
#   failClosed: false
#   payloadEncryptionRequired: false
#   payloadEncryptionSecret: {}
#   maxConcurrentActivities: 50
#   maxStageAttempts: 3
#   workerDependenciesRequired: false
#   workerVersioningEnabled: false
#   workerDeploymentName: devai
#   workerBuildId: ""
#   workerGracefulShutdownSeconds: 60
#   adminToolsImage: temporalio/admin-tools:1.31.2
#   versionPromotion:
#     enabled: false

# devai-worker Deployment — runs `python -m devai.orchestration.worker`. OFF by
# default; enable together with the `temporal` block above.
worker:
  enabled: false
  replicaCount: 1
  terminationGracePeriodSeconds: 90
  # resources: {}   # falls back to the API's `resources` when unset

# LLM gateway / provider routing.
#
# Real values live in values-prod.yaml and values-local.yaml. This block exists
# so the chart renders with base values alone — the templates dereference
# .Values.llm.* unguarded, so without it `helm lint` (and any plain
# `helm template`) fails with:
#   nil pointer evaluating interface {}.anthropicBaseUrl
# Every key is inert here; the per-environment files override what they need.
llm:
  gatewayBaseUrl: ""
  gatewayRequired: false
  anthropicBaseUrl: ""
  openaiBaseUrl: ""
  vertexBaseUrl: ""
  vertexEnabled: false
  vertexProject: ""
  vertexLocation: ""
  vertexGeminiModel: ""
  provider: ""
  fallbackProvider: ""
  systemPrincipal: ""
  requireUserConnector: false
  trialTokenBudget: ""
  tierLight: ""
  tierStandard: ""
  tierHeavy: ""
  tierFrontier: ""

objectStore:
  provider: "noop"
  bucket: ""
  prefix: "devai"
