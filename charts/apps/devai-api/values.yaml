# Default values for devai-api

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

rbac:
  create: true  # ClusterRole for ArgoCD CRDs, K8s resources, Istio, cert-manager

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

env:
  DEVAI_HOST: "0.0.0.0"
  DEVAI_PORT: "8080"
  DEVAI_LOG_LEVEL: "info"
  DEVAI_SCM_PROVIDER: "github"
  # NB: DEVAI_SCM_AUTH_METHOD is set explicitly to "pat" further down in
  # deployment.yaml so the SCM factory dials GitHub via the PAT (which
  # the devai-github-pat External Secret syncs). Keeping the variable
  # in both places caused a duplicate-env error in ArgoCD strict diff.
  DEVAI_GITHUB_ORG: "tesserix"
  DEVAI_AUTH_PROVIDER: "keycloak"
  DEVAI_KEYCLOAK_URL: "https://internal-identity.tesserix.app"
  DEVAI_KEYCLOAK_REALM: "tesserix-internal"
  DEVAI_KEYCLOAK_CLIENT_ID: "devai-dashboard"
  DEVAI_CLAUDE_MODEL: "claude-sonnet-4-20250514"
  DEVAI_OPENAI_MODEL: "o3"
  DEVAI_GROQ_MODEL: "llama-3.3-70b-versatile"
  DEVAI_NEMOCLAW_ENDPOINT: "http://nemoclaw-inference.devai.svc.cluster.local:8000/v1"
  DEVAI_NEMOCLAW_MODEL: "nvidia/nemotron-3-super-120b-a12b"
  DEVAI_NEMOCLAW_FALLBACK_TO_GROQ: "true"
  DEVAI_LANGCHAIN_TRACING_V2: "true"
  DEVAI_LANGCHAIN_PROJECT: "devai"
  DEVAI_PIPELINE_LABEL: "devai:automate"
  DEVAI_MAX_REVIEW_ITERATIONS: "3"
  DEVAI_DASHBOARD_BASE_URL: "https://devai.tesserix.app"
  DEVAI_GKE_CLUSTER: "tesseract-prod-in-gke"
  DEVAI_GKE_REGION: "asia-south1"
  DEVAI_GKE_PROJECT: "tesseracthub-480811"
  DEVAI_GKE_USE_IN_CLUSTER: "true"
  DEVAI_ARGOCD_NAMESPACE: "argocd"
  DEVAI_ARGOCD_SYNC_TIMEOUT: "300"
  DEVAI_ARGOCD_HEALTH_TIMEOUT: "120"

database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "devai"
  name: "devai_db"

redis:
  host: "redis.redis.svc.cluster.local"
  port: "6379"

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

keda:
  enabled: false

podAnnotations:
  kubectl.kubernetes.io/restartedAt: "2026-04-08T05:22:00Z"
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

podLabels: {}
