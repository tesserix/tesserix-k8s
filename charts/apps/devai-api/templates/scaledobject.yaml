{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "devai-api.fullname" . }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "devai-api.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 3 }}
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    {{- if .Values.keda.prometheus.enabled }}
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.keda.prometheus.serverAddress | quote }}
        metricName: istio_requests_per_second
        query: {{ .Values.keda.prometheus.requestRateQuery | quote }}
        threshold: {{ .Values.keda.prometheus.requestRateThreshold | quote }}
    {{- end }}
    {{- if .Values.keda.memory.enabled }}
    - type: memory
      metricType: Utilization
      metadata:
        value: {{ .Values.keda.memory.threshold | default "80" | quote }}
    {{- end }}
{{- end }}
