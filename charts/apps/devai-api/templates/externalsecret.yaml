{{- if and .Values.gcp.secretManager.enabled .Values.nats.auth.enabled }}
# Dedicated, gated ExternalSecret for the NATS account .creds file
# (devai side of Home-Chef-App#758).
#
# devai-api's PRIMARY secrets (LLM keys, GitHub App, Keycloak, ...) are synced by
# the standalone ExternalSecret in external-secrets/prod/devai/externalsecret.yaml
# (the `devai-api-secrets` Secret). That file is a plain kustomize manifest, so it
# can't be Helm-gated; folding the creds key in there would make the whole Secret
# fail to sync until the GCP SM entry exists. Instead this chart renders a
# separate Secret, only when NATS auth is explicitly turned on, so the existing
# devai-api-secrets Secret is never touched and the default path is fully inert.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "devai-api.fullname" . }}-nats-creds
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore | default "gcp-secret-store" }}
  target:
    name: {{ include "devai-api.fullname" . }}-nats-creds
    creationPolicy: Owner
  data:
    # NATS DEVAI-account credentials (.creds file) for operator/JWT auth.
    # Mounted as a file by the deployment/worker; the app reads it via
    # DEVAI_NATS_CREDS and passes it to nats.connect(user_credentials=...).
    - secretKey: NATS_CREDS_FILE
      remoteRef:
        key: {{ printf "%s-nats-creds-devai" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
