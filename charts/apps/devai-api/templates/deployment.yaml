apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devai-api.fullname" . }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
spec:
  {{- if and (not .Values.autoscaling.enabled) (not .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devai-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "devai-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Stop Kubernetes from injecting legacy Docker-link service env vars
      # (e.g. DEVAI_MCP_HUB_PORT=tcp://<ip>:8095 from the devai-mcp-hub
      # Service). With env_prefix=DEVAI_, those collide with typed Settings
      # fields (mcp_hub_port:int) and crash pydantic on startup. The app reads
      # everything it needs from explicit env, never service links.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devai-api.serviceAccountName" . }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      {{- if or .Values.schemaBootstrap.enabled .Values.localAuth.enabled }}
      # LOCAL init (sandbox/kind only). schema-bootstrap applies the devai_db
      # schema; auth-seed seeds the username/password roster. Both idempotent,
      # both OFF in prod (schemas come from the db-schema-bootstrap CronJob and
      # auth is terminated by the auth-bff).
      initContainers:
        {{- if .Values.schemaBootstrap.enabled }}
        - name: schema-bootstrap
          image: {{ .Values.schemaBootstrap.image | default "postgres:16-alpine" | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[schema-bootstrap] waiting for {{ .Values.database.host }}:{{ .Values.database.port }} ..."
              for i in $(seq 1 30); do
                if pg_isready -h "{{ .Values.database.host }}" -p "{{ .Values.database.port }}" -U "{{ .Values.database.user }}" >/dev/null 2>&1; then
                  break
                fi
                echo "  postgres not ready ($i/30)"; sleep 3
              done
              echo "[schema-bootstrap] applying schema to {{ .Values.database.name }} as {{ .Values.database.user }} ..."
              PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                -h "{{ .Values.database.host }}" -p "{{ .Values.database.port }}" \
                -U "{{ .Values.database.user }}" -d "{{ .Values.database.name }}" \
                -f /schema/devai_db.sql
              echo "[schema-bootstrap] done."
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-devai-password
                  key: password
          volumeMounts:
            - name: schema-sql
              mountPath: /schema
              readOnly: true
        {{- end }}
        {{- if .Values.localAuth.enabled }}
        - name: auth-seed
          image: {{ .Values.localAuth.image | default "postgres:16-alpine" | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[auth-seed] waiting for {{ .Values.database.host }}:{{ .Values.database.port }} ..."
              for i in $(seq 1 30); do
                if pg_isready -h "{{ .Values.database.host }}" -p "{{ .Values.database.port }}" -U "{{ .Values.database.user }}" >/dev/null 2>&1; then
                  break
                fi
                echo "  postgres not ready ($i/30)"; sleep 3
              done
              echo "[auth-seed] seeding devai_local_users into {{ .Values.database.name }} ..."
              PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
                -h "{{ .Values.database.host }}" -p "{{ .Values.database.port }}" \
                -U "{{ .Values.database.user }}" -d "{{ .Values.database.name }}" \
                -f /auth-seed/seed.sql
              echo "[auth-seed] done."
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-devai-password
                  key: password
          volumeMounts:
            - name: auth-seed
              mountPath: /auth-seed
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container hardening — drop all caps, no privilege escalation,
          # RuntimeDefault seccomp. (readOnlyRootFilesystem is NOT set: the
          # app/runtime writes to paths that aren't emptyDir-backed here.)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "devai-api.containerEnv" . | trimPrefix "\n" | nindent 12 }}
          {{- if and .Values.settings .Values.settings.brokerTokenFile }}
          volumeMounts:
            - name: secret-service-token
              mountPath: /var/run/secrets/devai/secret-service
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.schemaBootstrap.enabled .Values.localAuth.enabled (and .Values.settings .Values.settings.brokerTokenFile) }}
      volumes:
        {{- if .Values.schemaBootstrap.enabled }}
        - name: schema-sql
          configMap:
            name: {{ include "devai-api.fullname" . }}-schema
        {{- end }}
        {{- if .Values.localAuth.enabled }}
        - name: auth-seed
          configMap:
            name: {{ include "devai-api.fullname" . }}-auth-seed
        {{- end }}
        {{- if and .Values.settings .Values.settings.brokerTokenFile }}
        - name: secret-service-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.settings.brokerAudience | default "secret-service" | quote }}
                  expirationSeconds: 600
                  path: token
        {{- end }}
      {{- end }}
