apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-api-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-api
  action: ALLOW
  rules:
    # Allow Istio ingress gateway (external traffic via VirtualService)
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]
    # Allow devai-dashboard (frontend SSR calls)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-dashboard"]
    # Allow devai-sre (inter-service communication)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-sre"]
    # Allow self
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-api"]
    # Allow Prometheus scraping
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/metrics"]
            methods: ["GET"]
    # Allow health checks
    - to:
        - operation:
            paths: ["/healthz", "/readyz"]
            methods: ["GET"]
    # Allow GitHub webhook
    - to:
        - operation:
            paths: ["/webhook/github"]
            methods: ["POST"]
