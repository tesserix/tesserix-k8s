{{- if .Values.worker.enabled }}
# ─────────────────────────────────────────────────────────────────────────────
# devai-worker — the Temporal worker that executes blueprint runs durably.
#
# Same image, same StageDeps, same blueprint stages as devai-api — it just runs
# `python -m devai.orchestration.worker` instead of the API server, polls the
# Temporal task queue, and runs the ONE generic BlueprintWorkflow + run_stage
# activity. Because that workflow is blueprint-agnostic, this single worker
# executes every blueprint (and every future one) with no per-blueprint code.
#
# The container env is the shared `devai-api.containerEnv` helper, so the worker
# and the API can never drift. Its selector carries an extra `-worker` name so it
# never overlaps the API Deployment's pods.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devai-api.fullname" . }}-worker
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devai-api.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "devai-api.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: temporal-worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # See devai-api deployment: avoid K8s service-link env (DEVAI_MCP_HUB_PORT
      # =tcp://...) crashing the typed pydantic Settings on startup.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 90 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "devai-api.name" . }}-worker
              app.kubernetes.io/instance: {{ .Release.Name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "devai-api.name" . }}-worker
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devai-api.serviceAccountName" . }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container hardening — drop all caps, no privilege escalation,
          # RuntimeDefault seccomp. Mirrors the API container.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # The worker requires temporalio, which is a hard dependency of the
          # devai package — any freshly built devai image ships it.
          command: ["python", "-m", "devai.orchestration.worker"]
          env:
            {{- include "devai-api.containerEnv" . | trimPrefix "\n" | nindent 12 }}
            {{- if .Values.nats.auth.enabled }}
            {{- /* Worker shares the API's event-bus adapter, so it needs the same creds. */}}
            - name: DEVAI_NATS_CREDS
              value: /etc/nats-creds/nats.creds
            {{- end }}
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if or (and .Values.settings .Values.settings.brokerTokenFile) .Values.nats.auth.enabled }}
            {{- if and .Values.settings .Values.settings.brokerTokenFile }}
            - name: secret-service-token
              mountPath: /var/run/secrets/devai/secret-service
              readOnly: true
            {{- end }}
            {{- if .Values.nats.auth.enabled }}
            - name: nats-creds
              mountPath: /etc/nats-creds
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.worker.resources | default .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if or (and .Values.settings .Values.settings.brokerTokenFile) .Values.nats.auth.enabled }}
        {{- if and .Values.settings .Values.settings.brokerTokenFile }}
        - name: secret-service-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.settings.brokerAudience | default "secret-service" | quote }}
                  expirationSeconds: 600
                  path: token
        {{- end }}
        {{- if .Values.nats.auth.enabled }}
        - name: nats-creds
          secret:
            secretName: {{ include "devai-api.fullname" . }}-nats-creds
            items:
              - key: NATS_CREDS_FILE
                path: nats.creds
        {{- end }}
      {{- end }}
{{- end }}
