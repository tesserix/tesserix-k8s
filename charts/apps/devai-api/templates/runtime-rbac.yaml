{{- if and .Values.rbac.create .Values.k8sRuntime.enabled }}
# devai-api needs to spawn Jobs, Deployments, Services, and VirtualServices
# in the devai namespace for the SDD runtime. Keep this Role NAMESPACED —
# the api should never gain cluster-wide write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devai-api.fullname" . }}-runtime
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
rules:
  # Job lifecycle — JobRunnerStage creates one Job per agent run.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Long-lived preview pods (live app workflow) — Deployments + Services
  # backed by an Istio VirtualService at preview-<run_id>.<preview_domain>.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  # Pods + logs — read-only so JobWatcher can fetch the final stdout for
  # triage. The api never mutates pods directly; the Job controller does.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Istio VirtualServices for routing preview-<id> + editor-<id> hosts.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  # Events — the dashboard surfaces failures with kubectl-describe-style
  # output, which means reading the Pod's events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devai-api.fullname" . }}-runtime
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devai-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "devai-api.fullname" . }}-runtime
  apiGroup: rbac.authorization.k8s.io
---
# Service account used by the spawned runner pods themselves. Doesn't
# need cluster permissions — its only job is to be a non-root identity
# so the runner Pod can use a Workload-Identity-bound SA if we later
# need GCP Secret Manager access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.k8sRuntime.runnerServiceAccount | default "devai-runner" }}
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
{{- end }}
