{{- if and .Values.rbac.create .Values.k8sRuntime.enabled }}
# devai-api needs to spawn Jobs, Deployments, Services, and VirtualServices
# in the devai namespace for the SDD runtime. Keep this Role NAMESPACED —
# the api should never gain cluster-wide write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devai-api.fullname" . }}-runtime
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
rules:
  # Job lifecycle — JobRunnerStage creates one Job per agent run.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Long-lived preview pods (live app workflow) — Deployments + Services
  # backed by an Istio VirtualService at preview-<run_id>.<preview_domain>.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  # Pods + logs — read-only so JobWatcher can fetch the final stdout for
  # triage. The api never mutates pods directly; the Job controller does.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Istio VirtualServices for routing preview-<id> + editor-<id> hosts.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  # Events — the dashboard surfaces failures with kubectl-describe-style
  # output, which means reading the Pod's events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # Per-sandbox isolation objects — created when an agent sandbox is
  # provisioned and deleted with it. Namespaced, like everything else here.
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  # Per-sandbox workspace: the volume it works in, the pod serving shell +
  # file, its Service, and the Secret holding that workspace's capability
  # token — which the api reads at call time rather than storing anywhere.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devai-api.fullname" . }}-runtime
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devai-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "devai-api.fullname" . }}-runtime
  apiGroup: rbac.authorization.k8s.io
---
# Service account used by the spawned runner pods themselves. Doesn't
# need cluster permissions — its only job is to be a non-root identity
# so the runner Pod can use a Workload-Identity-bound SA if we later
# need GCP Secret Manager access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.k8sRuntime.runnerServiceAccount | default "devai-runner" }}
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- if and .Values.gcp .Values.gcp.workloadIdentity .Values.gcp.workloadIdentity.enabled }}
  annotations:
    # Workload Identity: in-Job agents mint ADC for Vertex/Secret Manager.
    # The IAM-side binding ([devai/devai-runner] → this GSA) is owned by
    # terraform-new/stacks/12-vertex.
    iam.gke.io/gcp-service-account: {{ .Values.gcp.workloadIdentity.gcpServiceAccount }}
  {{- end }}
---
# Identity for sandboxed agent runs. Deliberately has no Workload Identity
# annotation and no RoleBinding: a sandbox must not be able to mint ADC for
# the production GSA. Sandbox pods also run with automountServiceAccountToken
# disabled, so this is belt-and-braces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.k8sRuntime.sandboxServiceAccount | default "devai-sandbox" }}
  namespace: {{ .Values.k8sRuntime.namespace | default .Release.Namespace }}
  labels:
    {{- include "devai-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
{{- end }}
