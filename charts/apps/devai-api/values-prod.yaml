# Production overrides for devai-api

replicaCount: 1

# CHART-7: prod must never resolve to a floating :latest. Concrete main-<sha>
# seed; the ArgoCD app's helm parameter (also pinned) is what Kargo overwrites
# per promotion, and ignoreDifferences on /spec/source/helm/parameters keeps
# selfHeal from reverting it.
image:
  tag: "main-922249b"

# ─── Auth gate (DELIBERATE FLIP — sequence AFTER new images ship) ────────────
# Turns the in-app auth check from advisory into blocking so anonymous mutating
# pipeline / scm / onboarding / preview / approval calls are rejected (401)
# instead of falling through with a synthetic principal. This is the chart half
# of CODE-1; the matching DEVAI_AUTH_BFF_SHARED_SECRET (wired in
# templates/_helpers.tpl from the devai-auth-bff-secrets ExternalSecret) lets
# the X-Forwarded-* trust path be validated. Per the runbook this values flip is
# applied ONLY after the auth-aware images are rolled, otherwise legitimate
# unauthenticated callers break.
# WAVE-2 flip — keep FALSE until the auth-aware images are live, then set true
# (tesserix-k8s/docs/devai-security-hardening-runbook.md §5). Flipping before
# the new images roll WILL break login.
# WAVE-2 ENABLED 2026-06-08: the auth-aware image (CODE-1) is live and principals
# resolve from the bff session cookie (DEVAI_BFF_SESSION_ENCRYPT_KEY wired), so
# authenticated dashboard users pass and anonymous mutating calls get 401.
requireAuth: true

# Bumping this annotation rolls the deployment so :main gets re-pulled.
# fee0326 = drawio fix; carries everything since e417d62 including:
#   - c450608 feat(agentic): aregistry profile + agentgateway wiring
#   - 296050c feat(identity): Principal + trace_id end-to-end
#   - afd5b02 feat(dashboard): per-run detail with Repo viewer
#   - 4ae693f feat(catalog): tools/blueprints/specializations/stages
podAnnotations:
  # Bump to roll the pod so it switches SCM auth from PAT to the GitHub App
  # (reads the now-populated DEVAI_GITHUB_APP_* creds).
  deployedAt: "github-app-auth"

resources:
  requests:
    # Bumped from 128Mi: devai-api now runs as a single replica (see keda
    # below) so this one pod carries all dashboard + webhook + pipeline-worker
    # load. 128Mi was also so small that KEDA's memory trigger read ~146% and
    # pinned the deployment at max replicas.
    memory: 384Mi
  limits:
    memory: 768Mi

autoscaling:
  enabled: false

keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  # PINNED TO 1: the dashboard's live observability — the per-stage SSE log
  # stream, the events ring buffer, the A2A timeline, and the in-memory run
  # snapshot — all live in ONE pod's process (whichever pod claimed the run
  # from the durable Redis queue). With >1 replica the dashboard's polls + SSE
  # round-robin across pods, so ~2/3 of requests hit a pod with no live state
  # and the UI flickers / shows "Events (0)" / "Waiting for agent…" / resets on
  # refresh. A single replica gives one source of truth. Run durability is
  # unaffected: the Redis reliable-queue + boot reconcile already survive pod
  # rolls. (Re-enable scaling only once SSE/events are Redis pub/sub backed.)
  maxReplicaCount: 1
  prometheus:
    # Off: prometheus-server is scaled to zero on this cluster, so the scaler
    # errors, KEDA marks the ScaledObject Degraded and every Kargo promotion
    # times out waiting on devai-api's health. Nothing is lost — replicas are
    # pinned at 1 above. Re-enable together with Prometheus.
    enabled: false
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    requestRateQuery: 'sum(rate(istio_requests_total{destination_canonical_service="devai-api",reporter="destination"}[2m]))'
    requestRateThreshold: "10"
  memory:
    enabled: true
    threshold: "80"

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-devai-prod@tesseracthub-480811.iam.gserviceaccount.com"

database:
  host: "devai-postgres-rw.devai.svc.cluster.local"
  port: "5432"
  user: "devai"
  name: "devai_db"

# Shared Valkey. The Service is HAProxy, which only routes to the node
# reporting role:master, so a Sentinel failover needs no client awareness.
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  user: "devai"

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"

# ─── Fiber-style blueprint runtime + adapters (new) ──────────────────
# Master switch for the YAML-blueprint runtime that coexists alongside
# the legacy LangGraph orchestrator. Flip to "false" to revert.
pipeline:
  enabled: true
  blueprintDir: "blueprints"
  defaultBlueprint: "alm-pipeline"
  prReviewBlueprint: "pr-review"
  sreBlueprint: "sre-monitor"
  concurrency: 4
  defaultStageTimeout: 900

specializations:
  enabled: true
  dir: "specializations"

# ─── K8s Job runtime (Spec-Driven Development) ─────────────────────
# When enabled, each blueprint stage that declares `stage: run_as_job`
# spawns a Pod in the devai namespace via the JobRunnerStage. The Pod
# pulls its agent metadata + skills from aregistry, executes, and
# writes RESULT::<json> on stdout that the api parses back into a
# StageResult. RBAC lives in templates/runtime-rbac.yaml.
k8sRuntime:
  enabled: true
  namespace: "devai"
  runnerServiceAccount: "devai-runner"
  pullSecretName: ""
  jobTtlSeconds: 3600
  jobBackoffLimit: 0
  # Runner base image — set DYNAMICALLY by the Kargo prod Stage to the GAR
  # mirror at main-<commit sha7> (see kargo-manifests/projects/devai/stages/prod.yaml,
  # var `runnerImage`). This value is only the fallback before the first Kargo
  # promotion. MUST be the asia-south1 GAR mirror, never ghcr.io — runner Job
  # pods pull via the node GCP SA (no ghcr pull secret), so a ghcr image
  # ImagePullBackOffs and the stage times out.
  runnerImage: "asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-runner:latest"
  # Empty so the runner resolves to the single (Kargo-managed) runnerImage above
  # for every stack. Populate only if per-stack runner variants ship; until then
  # a non-empty map here would shadow the dynamic runnerImage.
  runnerImagePerStack: '{}'
  previewDomain: "tesserix.app"
  previewNamespace: "devai-previews"
  editorBridgeImage: "asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-editor-bridge:main"

# Memory adapter — qdrant is the production store; Postgres (CNPG) keeps
# the lifecycle and audit tables, not the vectors. The agent_memories rows
# pgvector holds are NOT migrated by this switch — they stay readable only
# by flipping back to "pgvector".
# Swap with one env var: noop | redis | pgvector | qdrant | mem0 | zep | hondo.
# Embeddings ride the existing DEVAI_OPENAI_API_KEY; set
# embeddingProvider: "none" to force keyword-only recall.
memory:
  provider: "qdrant"
  embeddingProvider: "auto"
  embeddingModel: "text-embedding-3-small"
  embeddingDimensions: 1536
  qdrantUrl: "http://qdrant.ai-database.svc.cluster.local:6333"
  qdrantCollection: "devai_memories"

objectStore:
  provider: "gcs"
  bucket: "devai-prod-evaluations-in"
  prefix: "devai"

# Settings capability — per-user/per-tenant connector values are read from
# OpenBao by DevAI and written blindly through the secret-service broker.
settings:
  enabled: true
  secretsProvider: "openbao"
  openbaoAddress: "http://openbao.openbao.svc.cluster.local:8200"
  openbaoMount: "kv"
  openbaoRole: "read-devai-api"
  openbaoAuthMount: "kubernetes"
  brokerUrl: "http://secret-service-api.secret-service.svc.cluster.local:8080"
  brokerAudience: "secret-service"
  brokerTokenFile: "/var/run/secrets/devai/secret-service/token"

# Agentic control planes — these URLs become valid once the
# infrastructure/agentregistry, agentgateway, kagent ArgoCD apps sync.
# Port 12121 is aregistry's HTTP API (verified live 2026-05-25); 8080
# was the container port and isn't routed by the Service.
#
# Three distinct URLs the devai-api reads:
#   aregistryUrl     — agent catalog (read-only profile lookups)
#   agentgatewayUrl  — solo.io MCP dispatch (rewrites /mcp/<name>)
#   kagentUrl        — kagent lifecycle controller (future A2A path)
#
# ai-gateway is a SEPARATE service used only for LLM calls — wired
# below under `llm:`. Don't conflate it with the agentgateway.
agenticControlPlane:
  aregistryUrl: "http://agentregistry.agentregistry-system.svc.cluster.local:12121"
  registryDeployKeySecret:
    name: "agentic-registry-deploy-key"
    key: "API_KEY"
  # Publish-on-author — agents/skills/tools/blueprints composed in the
  # dashboard are published back to the shared registry. Writes are
  # mesh-gated to the devai-api SA (see manifests/agentic-istio). On boot,
  # re-publish every stored authored artifact so the catalog self-heals
  # after a registry wipe or a devai redeploy.
  registryPublishEnabled: true
  registryDefaultTenant: "devai"
  registryPublishOnBoot: true
  # agentgateway in this cluster is CONTROL PLANE ONLY — the agentgateway
  # Service exposes 9978 (xDS gRPC), 9093 (health), 9092 (metrics).
  # There is NO HTTP data-plane port for /mcp/<name> traffic; solo.io
  # agentgateway-1.x is an xDS server that configures an Envoy data
  # plane separately, and we have not deployed that Envoy yet.
  #
  # Leaving this empty makes the runner fall back to dialing each MCP
  # server's own Service directly (URL comes from aregistry's
  # /v0/servers record). That's the correct degraded mode until the
  # agentgateway-proxy data plane is rolled.
  #
  # When the data plane is added (future PR in tesserix-k8s), flip
  # this to the proxy's Service URL — devai-runner picks it up on the
  # next Job dispatch with no code change.
  agentgatewayUrl: "http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080"
  # Platform default: kagent A2A dispatch is OFF — every agent runs as a K8s
  # Job. Turn it on platform-wide here, or let a user/team/org/tenant enable it
  # for themselves via the Settings "kagent" connector (resolved per run).
  kagentEnabled: false
  # kagent-controller HTTP API. The dispatcher reaches an agent over
  # A2A here when the agent's registry record is labelled
  # `devai.io/runtime=kagent` (the same agents kagent-agent-sync
  # reconciles into Deployments); all other agents stay Job-dispatched.
  # Non-kagent agents are unaffected by this URL being set.
  kagentUrl: "http://kagent-controller.kagent-system.svc.cluster.local:8083"
  # Per-user keys: the kagent ModelConfig (kagent-agent-sync) is
  # apiKeyPassthrough, so DevAI forwards each user's own LLM key as the A2A
  # Bearer token. Provider must match that ModelConfig (Anthropic).
  kagentPassthrough: true
  kagentModelProvider: "anthropic"
  # MUST mirror kagent-agent-sync values.kagentModels (providers lowercased).
  # DevAI maps the user's chosen (provider, model) → the variant <agent>-<suffix>,
  # then their fallback_model, then the rest.
  kagentCatalog:
    - suffix: anthropic
      provider: anthropic
      model: claude-sonnet-4-5-20250929
    - suffix: anthropic-sonnet-4-6
      provider: anthropic
      model: claude-sonnet-4-6
    - suffix: anthropic-opus
      provider: anthropic
      model: claude-opus-4-8
    - suffix: openai
      provider: openai
      model: gpt-4.1
    - suffix: openai-gpt-5-4
      provider: openai
      model: gpt-5.4
    - suffix: openai-gpt-5-5
      provider: openai
      model: gpt-5.5
    - suffix: openai-gpt-4o
      provider: openai
      model: gpt-4o
    - suffix: openai-o3
      provider: openai
      model: o3
    - suffix: openai-o4-mini
      provider: openai
      model: o4-mini
    - suffix: openai-o3-mini
      provider: openai
      model: o3-mini
    - suffix: openai-gpt-4-1-mini
      provider: openai
      model: gpt-4.1-mini

# LLM routing — when set, the Anthropic/OpenAI adapters dial these
# URLs instead of api.anthropic.com / api.openai.com. The gateway
# (devai-ai-gateway in agentgateway-system) injects the auth headers
# itself so devai-api pods don't need to read the secret directly.
llm:
  gatewayBaseUrl: "http://ai-gateway.agentgateway-system.svc.cluster.local:8080"
  gatewayRequired: true
  anthropicBaseUrl: "http://ai-gateway.agentgateway-system.svc.cluster.local:8080/anthropic"
  openaiBaseUrl: "http://ai-gateway.agentgateway-system.svc.cluster.local:8080/openai"
  # Vertex AI (Gemini) — keyless via the pod's Workload Identity GSA
  # (app-secrets-devai-prod has roles/aiplatform.user) and VPC-private via
  # the PSC endpoint (terraform-new/stacks/12-vertex). Project defaults to
  # gcp.projectId. asia-south1 is validated end to end; "global" also works.
  vertexEnabled: true
  # Canonical provider order (user-directed): Vertex Gemini is the
  # primary (keyless, VPC-private), then groq → openrouter → anthropic
  # pick up failed calls in that order. Unconfigured links (e.g.
  # openrouter until a key exists) are skipped automatically.
  provider: "vertex_gemini"
  # Human users must configure their own keys in Settings; shared platform
  # secrets serve only system/webhook automation and the fallback chain.
  requireUserConnector: true
  # New users may spend this many tokens on the shared chain to try DevAI;
  # at exhaustion the common keys are permanently revoked for them.
  trialTokenBudget: 100000
  # SRE + automation run on this principal's Settings connector (set up a
  # tenant connector under this email to keep automation off the shared
  # keys). Empty until provisioned → automation uses the fallback chain.
  systemPrincipal: ""
  fallbackProvider: "groq,openrouter,anthropic"
  vertexLocation: "global"
  vertexGeminiModel: "gemini-2.5-flash"
  vertexBaseUrl: "http://ai-gateway.agentgateway-system.svc.cluster.local:8080/vertex"
  # Cost tiers — "provider:model". light/standard ride Vertex Gemini;
  # heavy/frontier stay on Claude/o3 via the same gateway. Only
  # gemini-2.5-flash is model-enabled in the project today; after enabling
  # more models in console (Agent Platform → Models) flip:
  #   light    → vertex_gemini:gemini-3.1-flash-lite
  #   standard → vertex_gemini:gemini-3.5-flash
  #   heavy    → vertex_gemini:gemini-3.1-pro-preview (or keep Claude)
  tierLight: "vertex_gemini:gemini-2.5-flash"
  tierStandard: "vertex_gemini:gemini-2.5-flash"
  tierHeavy: "anthropic:claude-sonnet-4-20250514"
  tierFrontier: "openai:o3"

# ─── Durable orchestration (Temporal) ───────────────────────────────────────
temporal:
  provider: temporal
  host: temporal-frontend.temporal-system.svc.cluster.local:7233
  namespace: devai
  taskQueue: devai
  tlsEnabled: false
  failClosed: true
  payloadEncryptionRequired: true
  payloadEncryptionSecret:
    name: devai-api-secrets
    key: DEVAI_TEMPORAL_PAYLOAD_ENCRYPTION_KEY
  maxConcurrentActivities: 50
  maxStageAttempts: 3
  workerDependenciesRequired: true
  workerVersioningEnabled: true
  workerDeploymentName: devai
  workerGracefulShutdownSeconds: 60
  adminToolsImage: "asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/third-party/temporal-admin-tools:1.31.2"
  versionPromotion:
    enabled: true

worker:
  enabled: true
  replicaCount: 2
  terminationGracePeriodSeconds: 90
