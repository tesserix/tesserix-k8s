# =============================================================================
# infra-postgres — HA PostgreSQL for TEMPORAL and SRE tooling.
#
# READ THIS BEFORE ADDING A DATABASE HERE.
#
# This is NOT the general shared platform cluster. That is `global-postgres`,
# which already hosts twelve platform databases (keycloak_customer,
# keycloak_internal, tenants_db, notifications_db, subscriptions_db,
# documents_db, verifications_db, onboarding_content_db, custom_domains_db,
# location_db, tenant_router_db, global_db). A new platform service belongs
# THERE, not here.
#
# This cluster exists because Temporal is a genuinely different workload, not
# because the estate needed a second shared cluster. Temporal alone runs ~36
# connections and dominates the write rate — measured against 11 connections
# across all twelve of global's databases combined. Putting that load on the
# shared platform cluster means a Temporal write storm degrades auth for
# every product. Keeping it separate is a blast-radius decision.
#
# WHY IT IS HA
#
# Temporal previously ran on a bespoke single-replica Postgres StatefulSet on
# Spot-only nodes, so every preemption produced:
#
#   ListNamespaces operation failed ... database connection lost:
#   read tcp ...:5432: read: connection reset by peer
#
# A primary plus a synchronous replica with required anti-affinity and CNPG
# unsupervised failover turns a lost node into a leader election instead of an
# outage.
#
# WHAT BELONGS HERE
#
#   - Temporal (temporal, temporal_visibility)
#   - SRE / observability tooling that needs relational state
#
# Anything else goes to global-postgres. If you are about to add a product or
# platform database here, you are in the wrong file.
# =============================================================================

hibernate: false

namespace: infra
clusterName: infra-postgres

# 1 primary + 1 synchronous replica, on separate nodes.
#
# Three would be preferable and is what this should return to. It is 2 today
# because the cluster is genuinely full: two nodes sit at the 110-pod ceiling,
# the optimized-v2 node group is at max size, and the autoscaler reports
# "3 max node group size reached". A third instance stays Pending forever and
# leaves the Cluster in "Waiting for the instances to become active", which
# hides real problems behind a permanent warning.
#
# Two with REQUIRED anti-affinity is stronger than three with preferred: a
# primary and a synchronous replica on different nodes survive any single node
# loss, whereas three instances that the scheduler is free to co-locate can
# lose quorum to one preemption — which is exactly what it did on the first
# deploy here.
#
# RAISE THIS TO 3 once the node group can grow.
instances: 2
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

# Sized for many small tenants rather than one large one. The entire estate's
# Postgres data is under a gigabyte; 20Gi leaves years of headroom while
# staying honest about what is actually stored. PVCs grow in place, so
# starting modest costs nothing later — whereas the 200Gi and 100Gi volumes
# already provisioned elsewhere for 40MB and 24MB cannot be shrunk without a
# dump and restore.
storageSize: 20Gi
storageClass: standard-rwo-retain
walStorageSize: 8Gi

# Memory-only per platform policy — never CPU requests or limits.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

bootstrap:
  # Temporal's main store.
  database: temporal
  owner: temporal
  secret: infra-postgres-app
  # Reuses the existing Temporal credential so the migration did not also have
  # to rotate a password.
  gcpSecretName: prod-temporal-postgresql-password
  postInitSQL:
    # Temporal needs a second database for its visibility store.
    - "CREATE DATABASE temporal_visibility OWNER temporal"
    # SRE tooling that needs relational state goes here. Anything that is not
    # Temporal or SRE belongs on global-postgres — see the header.
    #
    # NOTE: postInitSQL runs ONCE, at cluster creation. Adding a line here does
    # not create the database on the running cluster; it only makes a rebuild
    # reproduce it. Provision it directly as well, or it will exist in git and
    # nowhere else.

# Reconciled continuously by CNPG, including on the existing cluster.
managedRoles:
  - name: langfuse
    passwordSecret: infra-postgres-langfuse
    gcpSecretName: prod-langfuse-postgresql-password
    comment: Langfuse application and schema migration owner

databases:
  - name: langfuse
    owner: langfuse

postgresql:
  # Sized for several tenants each holding a pool, not for one. Temporal alone
  # (multi-service × replicas × pool) accounts for a few hundred; the pooler
  # below is what keeps this from having to grow with every new adopter.
  max_connections: "400"
  shared_buffers: "256MB"
  effective_cache_size: "1536MB"
  work_mem: "4MB"
  maintenance_work_mem: "128MB"
  wal_level: "logical"
  max_replication_slots: "10"
  max_wal_senders: "10"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  log_min_duration_statement: "1000"
  hot_standby_feedback: "on"
  max_slot_wal_keep_size: "10GB"
  pg_stat_statements.track: "all"
  pg_stat_statements.max: "10000"

  # Probe idle client sockets. Temporal (the only consumer, connecting to -rw
  # directly — see the pooler note below) holds ~30 connections with
  # maxIdleConns == maxConns, so almost all of them sit idle indefinitely. With
  # keepalives off, an idle socket carries NO traffic and neither end notices if
  # the flow is dropped: Postgres logs "could not receive data from client:
  # Connection reset by peer" and Temporal only finds out when it next writes,
  # surfacing as "database connection lost: connection reset by peer" and a
  # retried operation. Server-side probes keep the flow warm and detect a truly
  # dead peer in ~2 min (60 + 6×10) instead of never.
  #
  # All three are context=user, so CNPG applies them by reload — no failover and
  # no instance restart.
  tcp_keepalives_idle: "60"
  tcp_keepalives_interval: "10"
  tcp_keepalives_count: "6"

# OFF. The only consumer cannot use it.
#
# CNPG's poolers run PgBouncer in `transaction` mode, which does not carry
# prepared statements across a transaction boundary. Temporal's postgres12
# driver prepares and reuses them, so it connects to the -rw service directly
# — leaving four pooler pods with zero clients and zero connections routed
# through them, verified before removing.
#
# Re-enable if an SRE component lands here that holds a large idle pool and
# tolerates transaction pooling. Until then this is four pods of pure cost.
pooler:
  enabled: false
  instances: 2
  maxClientConn: 500
  defaultPoolSize: 25

# Backups ON, unlike the Temporal-only chart this derives from.
#
# That chart could skip them because Temporal state is re-derivable at the app
# layer — schedules re-register and workflows retry. A SHARED cluster cannot
# assume that about its future tenants, and the moment one stores something
# that is not re-derivable, "we chose not to back this up" becomes a very bad
# sentence.
backup:
  enabled: true
  schedule: "0 0 2 * * *"
  # Same bucket and layout as every other cluster here; GKE workload identity
  # supplies the credentials (googleCredentials.gkeEnvironment in the template).
  destinationPath: "gs://tesseract-prod-backups-in/infra-postgres"
  retentionPolicy: "3d"
  # The GSA the cluster's ServiceAccount impersonates to reach the bucket.
  #
  # Follows the app-secrets-<tenant>-prod convention the other clusters use.
  # It needs roles/storage.objectAdmin + roles/storage.legacyBucketReader on
  # the backup bucket, and a workloadIdentityUser binding for
  # serviceAccount:tesseracthub-480811.svc.id.goog[infra/infra-postgres].
  serviceAccount: "app-secrets-infra-prod@tesseracthub-480811.iam.gserviceaccount.com"

monitoring:
  enablePodMonitor: true

affinity:
  # REQUIRED, not preferred.
  #
  # With `preferred` the scheduler put instances 2 and 3 on the same node, so a
  # single Spot preemption would have taken two of three replicas at once and
  # cost quorum — defeating the entire reason this cluster has three. Every
  # node pool in this cluster is preemptible, so co-location is not a
  # theoretical risk.
  #
  # The trade-off is real and accepted: with `required` an instance stays
  # Pending rather than sharing a node. For a cluster whose whole job is
  # surviving node loss, a visibly Pending replica is the better failure than a
  # silently redundant one.
  podAntiAffinityType: required

# Synchronous replication for a shared cluster: a tenant that has not thought
# about durability should not silently get the weakest guarantee. Temporal
# tolerates async, but it is no longer the only user.
replication:
  minSyncReplicas: 1
  maxSyncReplicas: 1
