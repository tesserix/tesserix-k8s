{{- if .Values.gcp.secretManager.enabled }}
{{/*
One pull secret for the namespace, owned by the API chart because it syncs
first (wave -1). The three web charts reference it by name and do not
duplicate it.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore }}
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.gcp.secrets.registryUsername }}
    - secretKey: token
      remoteRef:
        key: {{ .Values.gcp.secrets.registryToken }}
{{- end }}
