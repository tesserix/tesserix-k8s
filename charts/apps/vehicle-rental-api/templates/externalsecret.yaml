{{- if .Values.gcp.secretManager.enabled }}
{{/*
The connection strings are assembled here rather than in the pod so no password
is ever a container env var of its own. The CNPG cluster's own app secret lives
in vehicle-rental-data and this namespace cannot read it — ESO reconciles the
same value from Secret Manager instead.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-db
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore }}
  target:
    name: {{ .Values.name }}-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgresql://{{ .Values.database.user }}:{{ `{{ .password | urlquery }}` }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}
        PLATFORM_DATABASE_URL: >-
          postgresql://{{ .Values.database.platformUser }}:{{ `{{ .platformPassword | urlquery }}` }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}
        MONGODB_URI: >-
          mongodb://{{ `{{ .mongoUsername | urlquery }}` }}:{{ `{{ .mongoPassword | urlquery }}` }}@{{ .Values.mongodb.host }}:{{ .Values.mongodb.port }}/{{ .Values.mongodb.database }}?authSource=admin
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.gcp.secrets.dbPassword }}
    - secretKey: platformPassword
      remoteRef:
        key: {{ .Values.gcp.secrets.platformDbPassword }}
    - secretKey: mongoUsername
      remoteRef:
        key: {{ .Values.gcp.secrets.mongoUsername }}
    - secretKey: mongoPassword
      remoteRef:
        key: {{ .Values.gcp.secrets.mongoPassword }}
{{- end }}
