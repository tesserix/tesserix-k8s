{{- if .Values.gcp.secretManager.enabled }}
{{/*
Its own secret rather than a key on -db: the estate-wide Resend key rotates on a
different schedule from the database passwords, and a mail rotation should not
restage a connection string.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-mail
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  refreshInterval: {{ .Values.gcp.secretManager.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.gcp.secretManager.secretStore }}
  target:
    name: {{ .Values.name }}-mail
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ .Values.gcp.secrets.resendApiKey }}
{{- end }}
