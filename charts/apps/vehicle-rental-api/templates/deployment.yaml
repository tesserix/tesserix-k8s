apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: {{ .Values.partOf }}
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      # A booking write in flight must land or roll back before the pod goes.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: AUTH_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            - name: AUTH_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            - name: AUTH_DISABLED
              value: {{ .Values.auth.disabled | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-db
                  key: DATABASE_URL
            - name: PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-db
                  key: PLATFORM_DATABASE_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-db
                  key: MONGODB_URI
            - name: MAIL_FROM
              value: {{ .Values.mail.from | quote }}
            - name: ONBOARDING_BASE_URL
              value: {{ .Values.mail.onboardingBaseUrl | quote }}
            - name: MEDIA_BUCKET
              value: {{ .Values.media.bucket | quote }}
            - name: PUBLIC_MEDIA_BASE_URL
              value: {{ .Values.media.publicBaseUrl | quote }}
            # Optional so the pod starts before ESO first syncs. Without it the
            # API logs the verify link instead of mailing it, which is the right
            # behaviour locally and a loud one in production.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-mail
                  key: RESEND_API_KEY
                  optional: true
          # /healthz is process liveness only. /readyz checks the pools, because
          # unlike the storefront an API with no database has nothing to serve.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
