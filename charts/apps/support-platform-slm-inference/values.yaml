namespace: support-platform
name: support-platform-slm-inference

# llama.cpp publishes their server image at ghcr.io/ggml-org/llama.cpp.
# Tags I confirmed: 'server' (latest server build, multi-arch), 'full',
# 'server-cuda'. The 'server-b4382' tag I'd guessed doesn't exist on
# that registry path. Pin to 'server' for now; switch to digest pinning
# when reproducible builds matter.
image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: "server"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Model is downloaded from Hugging Face at boot (cached on the PVC).
# Qwen2.5-1.5B-Instruct quantized to Q4_K_M — best CPU quality at the
# 1.5B size on the CPU node pool.
model:
  huggingfaceRepo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
  filename: qwen2.5-1.5b-instruct-q4_k_m.gguf
  # llama.cpp splits contextWindow across `parallel` slots — each slot
  # only gets contextWindow/parallel tokens. 8192/4=2048 was STILL
  # overflowing real prompts (system prompt + RAG chunks + history +
  # tool results measured ~2132 tokens -> inference HTTP 400 ->
  # spurious "inference_failed" escalation to a human). Bump to 16384
  # so each of the 4 slots gets 4096 tokens (KV cache ~1GB, well within
  # the 6Gi limit).
  contextWindow: 16384
  threads: 4
  parallel: 4

service:
  type: ClusterIP
  port: 8000

# Single replica with KEDA-driven scale-up. The model load takes 5-15s
# so we keep minReplicas=1 (no scale-to-zero).
# PARKED 2026-08-01 for cost. support-platform-slm-router has had ZERO Service
# endpoints since 2026-07-29 (its binary dies on an otel semconv conflict), so
# nothing could reach this tier. Restore to 1 together with the router fix.
replicaCount: 1

# Big — int4 1.5B is ~1GB on disk, fp32 logits + KV cache need more RAM.
resources:
  requests:
    memory: 4Gi
  limits:
    memory: 6Gi

# Model cache PVC — re-pulling the GGUF on every restart is expensive.
persistence:
  enabled: true
  storageClassName: standard-rwo
  size: 10Gi

keda:
  # Disabled while parked: a memory trigger cannot scale to zero, and it
  # scaled the reranker to 2 on idle baseline memory alone.
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 3
  # Scale on a Prometheus metric — set up once the metric exists.
  # Until then KEDA holds at minReplicaCount.
  pollingInterval: 30
  cooldownPeriod: 300

# HF token is OPTIONAL for the Qwen GGUF (it's a public repo) but
# required for gated models. Keep the secret reference in case we
# switch.
huggingfaceTokenSecret:
  name: support-platform-hf-token
  key: HF_TOKEN
