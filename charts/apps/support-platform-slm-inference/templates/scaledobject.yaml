{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-platform-slm-inference.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ .Values.name }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  # Placeholder memory trigger — replace with the slm-router queue-depth
  # Prometheus metric once it exists. Keeps the ScaledObject Ready so
  # KEDA controller stays happy.
  triggers:
    # memory, not cpu. The platform sets NO cpu requests anywhere, and an
    # HPA cannot compute CPU utilisation without a request to divide by --
    # it reports FailedGetResourceMetric and the ScaledObject goes
    # Degraded. memory works because memory requests ARE set.
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
{{- end }}
