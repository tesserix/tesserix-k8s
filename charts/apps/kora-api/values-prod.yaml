# Production overrides for kora-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml
#
# The base values.yaml is already prod-shaped (image pulls
# from the ghcr-remote mirror, GSA email pinned). This file is reserved
# for the small delta we want to be able to tweak without editing
# values.yaml: a redeploy timestamp to break the :latest manifest cache,
# and any future prod-only resource bumps.

# Bump this timestamp when you need to force a new
# Revision (re-pulls :latest fresh). The ghcr-remote pull-through cache
# can hold a stale :latest manifest; a spec change is the cheapest way
# to break it out.
podAnnotations:
  kora.tesserix.app/redeploy-at: "2026-07-28T00:00:00Z"
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

aiGateway:
  # Production cutover is explicit here; set false for the one-step rollback.
  enabled: true

env:
  GIN_MODE: "release"
  # VERTEX_* is deliberately UNSET — see kora#202.
  #
  # Vertex was enabled on 2026-08-16 and rolled back within minutes: every
  # /v1/resolve/text 500'd after 28.8s. The Vertex primary missed IdentifyText's
  # 1500ms textBudget (most likely acquiring a metadata-server token on the
  # first call, where an API key is just a header), fell through to the NVIDIA
  # fallback, and that ran until the request was cancelled. No ai_usage_events
  # row was written at all, which is consistent with the primary dying before it
  # recorded anything.
  #
  # Setting VERTEX_PROJECT is ALL it takes to switch the engine over — cmd/api
  # prefers it to GEMINI_API_KEY — so leaving it here would re-break production
  # the moment any newer image is deployed. The IAM grant
  # (kora-api-prod@ -> roles/aiplatform.user) and the provider code stay in
  # place; only this switch is off.
