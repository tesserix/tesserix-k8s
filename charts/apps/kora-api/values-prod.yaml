# Production overrides for kora-api
# Use with: helm upgrade --values values.yaml --values values-prod.yaml
#
# The base values.yaml is already prod-shaped (image pulls
# from the ghcr-remote mirror, GSA email pinned). This file is reserved
# for the small delta we want to be able to tweak without editing
# values.yaml: a redeploy timestamp to break the :latest manifest cache,
# and any future prod-only resource bumps.

# Bump this timestamp when you need to force a new
# Revision (re-pulls :latest fresh). The ghcr-remote pull-through cache
# can hold a stale :latest manifest; a spec change is the cheapest way
# to break it out.
podAnnotations:
  kora.tesserix.app/redeploy-at: "2026-07-28T00:00:00Z"
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

aiGateway:
  # Production is Gateway-only. Setting false disables model-backed behavior;
  # the chart does not mount direct provider models or credentials.
  enabled: true

env:
  GIN_MODE: "release"

  # Profile pictures (kora#449). The bucket is public-read at unguessable
  # paths (avatars/{user_id}/{uuid}.jpg): the avatar is already visible to
  # anyone holding the user's handle, and signed URLs would mean re-signing
  # on every render of every friend row for no privacy gain.
  #
  # Until these were set, internal/assets selected assets.Noop: uploads
  # returned 200, avatar_path was written to the users row, and every
  # avatar_url came back "" — the handle half live, the picture half inert.
  ASSETS_BUCKET: "kora-prod-assets-in"
  ASSETS_PUBLIC_BASE_URL: "https://storage.googleapis.com/kora-prod-assets-in"
