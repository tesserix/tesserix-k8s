# Default values for kora-api (Go + Gin backend)
replicaCount: 1

image:
  # Pull through GCP Artifact Registry's ghcr-remote cache — mirrors
  # ghcr.io/tesserix/kora/kora-api on first pull and serves subsequent
  # pulls from-region (asia-south1 → tesseract-prod-in-gke = same region
  # = no egress, faster cold-starts). Same convention as horoscope-api /
  # homechef-api.
  #
  # TODO(ci): Kora's CI (.github/workflows/ci.yml :: build-image) currently
  # pushes to asia-south1-docker.pkg.dev/tesserix-app/services/kora-api —
  # a different GCP project entirely, not this fleet's mirror source. CI
  # must be changed to push to ghcr.io/tesserix/kora/kora-api instead (auth
  # via a GHCR PAT, same as every other product in this repo); this
  # `repository` value is that image's ghcr-remote mirror path and will
  # 404 on pull until CI is repointed.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/kora/kora-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: true

podAnnotations:
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Distinct name from the workload so the ClusterIP never collides with a
  # Knative-created `kora-api` route Service during the cutover, and so the
  # VirtualService routes to a stable, obviously-direct host. Mirrors
  # homechef-api-direct — the working ambient-mesh reference in this repo.
  nameOverride: kora-api-direct

# Knative Serving — DISABLED. Kora is the only service that ran on Knative;
# the rest of the fleet uses plain Deployments behind ClusterIP Services in
# the Istio ambient mesh, and Knative's ingress (knative-local-gateway +
# activator) does not compose with ambient (ztunnel + waypoint). Converted
# to a plain Deployment (templates/deployment.yaml) + ClusterIP Service
# (templates/service.yaml), routed to directly by the kora-istio
# VirtualService — mirroring homechef-api. The knative-service.yaml template
# is gated on this flag and renders nothing while it is false; kept in-tree
# for reference / rollback only.
knative:
  enabled: false
  minScale: 0
  maxScale: 3
  scaleDownDelay: "120s"
  containerConcurrency: 0
  # Retained for the (disabled) Knative template. The plain Deployment has
  # no request-timeout knob of its own — long LLM round-trips are bounded by
  # the VirtualService `timeout: 600s`, which matches this value.
  timeoutSeconds: 600

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Plain env (non-secret). Anything secret must go in `secretEnv` below
# and be sourced from the ExternalSecret target.
env:
  GIN_MODE: "release"
  # NOTE: do NOT set PORT here. Knative Serving reserves the PORT env
  # var and INJECTS it itself based on the container port. Defining it
  # in the manifest causes the validation webhook to reject:
  #   "PORT" is a reserved environment variable
  # Firebase JWTs are signed by Google; this is the project ID that the
  # backend's auth.Verifier expects in the `aud` claim.
  #
  # MUST match the project the mobile client authenticates against — see
  # kora/apps/mobile/.env (EXPO_PUBLIC_FIREBASE_PROJECT_ID). kora-app-e6d38 is
  # Kora's own Firebase project and holds the "kora-mobile" web app and the
  # "kora-ios" app the client is built from.
  #
  # This previously pointed at tesseracthub-480811, the shared platform
  # project, which has ZERO apps registered — no Kora client could ever obtain
  # a token it would accept, so every authenticated request 401'd and the prod
  # users table sat at 0 rows.
  FIREBASE_PROJECT_ID: "kora-app-e6d38"
  # OpenAI-compatible chat/parse model. Per docs/superpowers/HANDOFF-phase3.md
  # the free-tier fallback used in dev is NVIDIA's OpenAI-compatible
  # endpoint — carried forward here as the prod default until a paid
  # OpenAI key + model is decided. Gemini (secretEnv: GEMINI_API_KEY)
  # remains the primary provider for embeddings regardless of this value.
  OPENAI_BASE_URL: "https://integrate.api.nvidia.com/v1"
  OPENAI_MODEL: "meta/llama-3.3-70b-instruct"
  OPENAI_JSON_OBJECT: "true"
  # Inert-by-default (see docs/superpowers/plans/2026-07-27-kora-push-notifications.md):
  # OS push go-live is a user-owned step (eas init, APNs creds, physical
  # device test). Flip to "true" only after that's done.
  PUSH_ENABLED: "false"

# Each entry maps an env var name to a key in the k8s Secret created by
# the ExternalSecret. Keep this in sync with externalsecret.yaml.
secretEnv:
  DATABASE_URL: database_url
  GEMINI_API_KEY: gemini_api_key
  OPENAI_API_KEY: openai_api_key
  EXPO_ACCESS_TOKEN: expo_access_token

# GCP / Workload Identity — annotates the SA with the matching GSA email.
# GSA itself, its IAM bindings, and the WIF binding are provisioned by the
# human out-of-band (terraform-new), same as every other product's
# app-secrets-<product>-prod GSA.
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-kora-prod@tesseracthub-480811.iam.gserviceaccount.com"

# ExternalSecret config — pulls all secrets from GCP Secret Manager via
# the cluster-wide gcp-secret-store ClusterSecretStore.
# TODO(secrets): the prod-kora-* GCP Secret Manager entries referenced
# below must exist with real values before this ExternalSecret can sync —
# that's a human, out-of-band step (see report).
externalSecret:
  create: true
  refreshInterval: "1h"
  store:
    name: gcp-secret-store
    kind: ClusterSecretStore
  remoteRefs:
    database_url: prod-kora-database-url
    gemini_api_key: prod-kora-gemini-api-key
    openai_api_key: prod-kora-openai-api-key
    expo_access_token: prod-kora-expo-access-token

# ArgoCD PreSync migrate Job — runs Kora's migrate binary (same image,
# command override) before the Knative Service rolls, so the API never
# starts against a schema older than the code expects.
#
# TODO(ci): requires the controller's planned Dockerfile change shipping
# /usr/local/bin/migrate (Kora's cmd/migrate as a separate binary) in the
# same image as the API. Until that lands, this Job will exec-fail with
# "no such file or directory" — gate stays on so the failure is loud and
# visible in ArgoCD rather than silently skipped.
migrate:
  enabled: true
  command:
    - /usr/local/bin/migrate

# Populates food_items — the table the resolver reads to build candidates.
# Prod ran with this table EMPTY, so every capture failed and nothing could be
# logged. See templates/seed-job.yaml for the full story.
#
# All three binaries are idempotent (a re-run inserts 0 rows; embed only fills
# rows whose embedding is still NULL), so running this on every sync is safe.
# ingest takes absolute paths because its relative defaults assume the repo
# layout, not the image's.
#
# embed runs LAST, after the index is fully populated, and backfills
# food_items.embedding — the ONLY source of sub-0.70 resolver match scores.
# Without it the embedding tier is dead: everything scores 0.70-0.99 via
# full-text, so `follow_up` is unreachable. It needs GEMINI_API_KEY (wired in
# templates/seed-job.yaml); without the key it logs and exits 0, so a missing
# secret degrades to "no embeddings" rather than a crashlooping Job.
#
# Requires the image to ship /usr/local/bin/{seed,ingest,embed} and the AFCD /
# USDA / SR Legacy / curated JSON at /usr/local/share/kora/food (kora PR #67
# for seed+ingest, and the embed + SR Legacy + curated PR after it). Until that
# image is promoted the Job exec-fails loudly, matching the migrate Job's
# convention of a visible failure over a silent skip.
seed:
  enabled: true
  command:
    - /bin/sh
    - -c
    - >-
      /usr/local/bin/seed &&
      /usr/local/bin/ingest
      -afcd /usr/local/share/kora/food/afcd_staples.json
      -usda /usr/local/share/kora/food/usda_common.json
      -sr /usr/local/share/kora/food/usda_sr_legacy.json
      -curated /usr/local/share/kora/food/au_in_dishes.json &&
      /usr/local/bin/embed

# Prometheus metrics. Scraped in-cluster by GCP Managed Prometheus via the
# PodMonitoring below; deliberately NOT exposed through the Istio gateway.
metrics:
  enabled: true
  port: 9090
  interval: 30s
