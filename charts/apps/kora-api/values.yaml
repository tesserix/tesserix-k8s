# Default values for kora-api (Go + Gin backend)
replicaCount: 1

image:
  # Pull through GCP Artifact Registry's ghcr-remote cache — mirrors
  # ghcr.io/tesserix/kora/kora-api on first pull and serves subsequent
  # pulls from-region (asia-south1 → tesseract-prod-in-gke = same region
  # = no egress, faster cold-starts). Same convention as horoscope-api /
  # homechef-api.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/kora/kora-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: true

podAnnotations:
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Distinct name from the workload so the ClusterIP never collides with a
  # legacy `kora-api` route Service during the cutover, and so the
  # VirtualService routes to a stable, obviously-direct host. Mirrors
  # homechef-api-direct — the working ambient-mesh reference in this repo.
  nameOverride: kora-api-direct

aiGateway:
  # Production enables this in values-prod.yaml. Kora sends only this logical
  # model; Agent Gateway owns every concrete provider model and location.
  enabled: false
  baseURL: http://kora-ai.agentgateway-system.svc.cluster.local:8080/v1
  model: kora-auto
  agentTimeout: 24s
  clientSecret:
    create: true
    name: kora-ai-gateway-client-credentials
    key: kora-api
    refreshInterval: 1h
    store:
      name: gcp-secret-store
      kind: ClusterSecretStore
    remoteRef: prod-kora-ai-gateway-api-key
  networkPolicy:
    enabled: true
    namespace: agentgateway-system
    gatewayName: kora-ai
    port: 8080

# Emergency/local compatibility only. GitOps environments keep this disabled:
# disabling Agent Gateway must not silently bypass it with provider credentials.
legacyDirectAI:
  enabled: false

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Plain env (non-secret). Anything secret must go in `secretEnv` below
# and be sourced from the ExternalSecret target.
env:
  GIN_MODE: "release"
  # Without this the Go config default wins and the prod pod logged
  # {"msg":"api listening","env":"development"} — see kora#163.
  #
  # Today this is ONLY a log label: `cfg.Env` is read in exactly one place
  # (cmd/api/main.go's startup line) and nothing branches on it, so the audit
  # that issue asked for came back clean — no permissive auth, no debug
  # routes, and GIN_MODE was already "release". It is still worth setting:
  # log-based filtering by environment was silently wrong, anyone reading prod
  # logs had reason to doubt what they were looking at, and the first piece of
  # code to branch on Env would otherwise take the development path in
  # production without anyone noticing.
  ENV: "production"
  # NOTE: PORT is set by the container spec, not here.
  # var and INJECTS it itself based on the container port. Defining it
  # in the manifest causes the validation webhook to reject:
  #   "PORT" is a reserved environment variable
  # Firebase JWTs are signed by Google; this is the project ID that the
  # backend's auth.Verifier expects in the `aud` claim.
  #
  # MUST match the project the mobile client authenticates against — see
  # kora/apps/mobile/.env (EXPO_PUBLIC_FIREBASE_PROJECT_ID). kora-app-e6d38 is
  # Kora's own Firebase project and holds the "kora-mobile" web app and the
  # "kora-ios" app the client is built from.
  #
  # This previously pointed at tesseracthub-480811, the shared platform
  # project, which has ZERO apps registered — no Kora client could ever obtain
  # a token it would accept, so every authenticated request 401'd and the prod
  # users table sat at 0 rows.
  FIREBASE_PROJECT_ID: "kora-app-e6d38"
  # Inert-by-default (see docs/superpowers/plans/2026-07-27-kora-push-notifications.md):
  # OS push go-live is a user-owned step (eas init, APNs creds, physical
  # device test). Flip to "true" only after that's done.
  PUSH_ENABLED: "false"
  # Set EXPLICITLY rather than leaning on the Go default
  # (redis://localhost:6379/0, api/internal/config/config.go). Relying on that
  # implicit default is precisely how kora#105 went unnoticed: nothing in this
  # chart said Redis was expected, so its absence flagged nothing and every
  # resolve silently cost a Gemini call. Points at the sidecar below.
  REDIS_URL: "redis://localhost:6379/0"

# Each entry maps an env var name to a key in the k8s Secret created by
# the ExternalSecret. Keep this in sync with externalsecret.yaml.
secretEnv:
  DATABASE_URL: database_url
  EXPO_ACCESS_TOKEN: expo_access_token
  # Task 3 (kora repo, api/internal/config) reads this directly via
  # os.Getenv("KORA_BFF_HMAC_KEY") — gates whether /v1/admin/* mounts at all.
  # Without this line the ExternalSecret still creates the k8s Secret key
  # below, but the Deployment only injects env vars listed in this map, so
  # the container would never see it and the admin surface would stay
  # permanently unmounted (404, not 401).
  KORA_BFF_HMAC_KEY: KORA_BFF_HMAC_KEY
  # kora-api REFUSES TO START if APPLE_PRIVATE_KEY is set while either of the
  # other two is empty (api/internal/config/config.go). That is deliberate: a
  # partial config would otherwise mount /v1/me/apple-authorization and have
  # every exchange fail, silently making every Apple user permanently
  # unrevokable while looking like success from the app. So these three land
  # together or not at all.
  #
  # With all three unset the endpoint is simply not mounted and the mobile
  # client's capture call 404s, which it swallows on a path proven non-fatal.
  APPLE_TEAM_ID: apple_team_id
  APPLE_KEY_ID: apple_key_id
  APPLE_PRIVATE_KEY: apple_private_key

# GCP / Workload Identity — annotates the SA with the matching GSA email.
#
# This previously named app-secrets-kora-prod, following the
# app-secrets-<product>-prod convention and the note above that the GSA is
# "provisioned by the human out-of-band". It never was: verified on
# 2026-08-08 against `gcloud iam service-accounts list`, no such account
# exists in tesseracthub-480811. So this pod has been annotated to
# impersonate an account that does not exist.
#
# That cost nothing until now, because kora-api made no GCP API calls:
# Firebase ID token VERIFICATION reads Google's public JWKS and needs no
# IAM, and DB credentials arrive as a Kubernetes Secret via ESO. Account
# deletion (#106) is the first code path that calls a GCP API — it deletes
# the user's Firebase identity — so from here a missing GSA means every
# deletion leaves a live identity behind. The account's Kora data is still
# destroyed correctly; the person can simply sign in again and be
# re-provisioned by EnsureUser as a fresh empty account.
#
# kora-api-prod holds ONE permission, via the custom role
# projects/tesseracthub-480811/roles/koraFirebaseUserDelete:
# firebaseauth.users.delete. Deliberately NOT roles/firebaseauth.admin,
# which would also grant create/update/list over every identity in the
# project. If a future code path needs more, add the permission to that
# custom role deliberately rather than widening to the predefined one.
#
# Not in Terraform — created out-of-band like the other app-secrets-*
# accounts, which is exactly how the original went missing. Fold both this
# account and its custom role into IaC to stop it drifting.
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "kora-api-prod@tesseracthub-480811.iam.gserviceaccount.com"

# ExternalSecret config — pulls all secrets from GCP Secret Manager via
# the cluster-wide gcp-secret-store ClusterSecretStore.
# TODO(secrets): the prod-kora-* GCP Secret Manager entries referenced
# below must exist with real values before this ExternalSecret can sync —
# that's a human, out-of-band step (see report).
externalSecret:
  create: true
  refreshInterval: "1h"
  store:
    name: gcp-secret-store
    kind: ClusterSecretStore
  remoteRefs:
    database_url: prod-kora-database-url
    expo_access_token: prod-kora-expo-access-token
    KORA_BFF_HMAC_KEY: prod-kora-bff-internal-hmac-key
    # Sign in with Apple. Required for account deletion (#106): Apple has
    # mandated since June 2022 that an app offering Sign in with Apple revoke
    # the user's refresh token when their account is deleted, and Firebase
    # never exposes that token -- it is obtained by exchanging the one-time
    # authorization code the native sign-in returns.
    #
    # ESO fails the WHOLE ExternalSecret if any remoteRef key is missing in
    # Secret Manager, so all three secrets must exist in tesseracthub-480811
    # BEFORE this is synced, or database_url stops re-syncing with them.
    apple_team_id: prod-kora-apple-team-id
    apple_key_id: prod-kora-apple-key-id
    apple_private_key: prod-kora-apple-private-key

# Schema migration. Runs as the Deployment's `migrate` initContainer (same
# image, command override), so the API container cannot start — and the pod
# cannot become Ready — against a schema older than the code expects.
#
# This was a separate ArgoCD wave -1 Job until kora#118; the wave barrier was
# timing-dependent and was observed letting the new pod win. See the long
# comment on the initContainer in templates/deployment.yaml.
#
# Requires the image to ship /usr/local/bin/migrate (Kora's cmd/migrate as a
# separate binary) alongside the API binary. If it is missing the initContainer
# exec-fails with "no such file or directory" and the pod never starts — loud
# and visible, and the OLD pod keeps serving, rather than a silent skip.
#
# Setting enabled:false removes the initContainer, which means the API can
# start against an unmigrated schema. Only do that deliberately.
migrate:
  enabled: true
  command:
    - /usr/local/bin/migrate

# Populates food_items — the table the resolver reads to build candidates.
# Prod ran with this table EMPTY, so every capture failed and nothing could be
# logged. See templates/seed-job.yaml for the full story.
#
# All three binaries are idempotent (a re-run inserts 0 rows; embed only fills
# rows whose embedding is still NULL), so running this on every sync is safe.
# ingest takes an absolute -food-dir because its relative default assumes the
# repo layout, not the image's.
#
# embed runs LAST, after the index is fully populated, and backfills
# food_items.embedding — the ONLY source of sub-0.70 resolver match scores.
# Without it the embedding tier is dead: everything scores 0.70-0.99 via
# full-text, so `follow_up` is unreachable. It uses Agent Gateway with the same
# logical `kora-auto` model and client credential as the API.
#
# Note it now exits NON-ZERO when it gives up with rows outstanding (kora#97) —
# a run that embedded some rows and then hit a fully-failed batch used to exit
# 0, which is how the index sat at 42% embedded with this Job and ArgoCD both
# green. Draining the queue, or having nothing to do, is still green.
#
# Requires the image to ship /usr/local/bin/{seed,ingest,embed} and the AFCD /
# USDA / SR Legacy / curated JSON at /usr/local/share/kora/food (kora PR #67
# for seed+ingest, and the embed + SR Legacy + curated PR after it). Until that
# image is promoted the Job exec-fails loudly, matching the migrate Job's
# convention of a visible failure over a silent skip.
seed:
  enabled: true
  # -food-dir is the ONLY path this command needs. Adding a food source to
  # cmd/ingest requires NO change here.
  #
  # It used to be a flag per source, nine of them, whose defaults are
  # repo-relative (data/food/*.json) while the image mounts the data at
  # /usr/local/share/kora/food — so every source had to be repeated here as an
  # absolute path, and one that was not made the Job exit 1 and crash-loop.
  # That was forgotten THREE TIMES in one day (kora#215's -ifct, the AUSNUT
  # ingest, the alias layer), each crash-looping prod until someone noticed,
  # and the third was found only while fixing the second. The warning comment
  # written after the first did not prevent the other two, so the fix had to be
  # structural rather than documentary.
  #
  # Which files are read now lives in a table in api/internal/nutrition/ingest/
  # sources.go, next to the loader, and TestSourceFilesExist fails CI if a
  # declared file was never committed. The Dockerfile already copies the whole
  # data/food directory, so the image side needs nothing either.
  #
  # -backfill-usda-brands MUST stay on this command line. cmd/ingest runs it
  # before the load, in-process, which is the required order: the loader emits
  # ("FILET-O-FISH", "McDONALD'S") while an un-backfilled table still holds
  # ("McDONALD'S, FILET-O-FISH", ""), and ingest dedupes on name+brand, so
  # without it the load inserts 310 duplicate rows instead of recognising them.
  # That happened in prod on 2026-08-17 and had to be cleaned up by hand.
  # The flag is idempotent, so leaving it on every run costs nothing.
  command:
    - /bin/sh
    - -c
    - >-
      /usr/local/bin/seed &&
      /usr/local/bin/ingest
      -backfill-usda-brands
      -food-dir /usr/local/share/kora/food &&
      /usr/local/bin/embed

# Resolve-cache Redis, as a SIDECAR in the kora-api pod (kora#105).
#
# Disabling this does not break the API — the resolver degrades to
# ai.NoCache{} — but it returns the service to paying for a Gemini call on
# every single resolve, and makes the generation-counter invalidation a
# silent no-op. Turn it off deliberately, never incidentally.
#
# maxmemory-policy is pinned to volatile-lru in the Deployment, NOT here:
# it is a correctness precondition of the cache design (the generation key
# has no TTL and must survive eviction), not a tuning knob.
redis:
  enabled: true
  # Alpine variant: this is a cache with no persistence and no modules, so the
  # smaller image is strictly better on a cost-constrained node.
  image: "redis:7.4-alpine"
  # Bounds a day of cached resolutions (entries carry a 24h TTL, set in
  # cmd/api/main.go). Raise only with evidence of eviction pressure.
  maxmemory: "64mb"
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      # Must exceed maxmemory with headroom for Redis' own overhead, or the
      # container is OOMKilled before its own eviction policy ever engages.
      memory: 96Mi

# Prometheus metrics. Scraped in-cluster by GCP Managed Prometheus via the
# PodMonitoring below; deliberately NOT exposed through the Istio gateway.
metrics:
  enabled: true
  port: 9090
  interval: 30s
