{{- if .Values.firebaseAccountStatus.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-firebase-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-kora-production
    kind: SecretStore
  target:
    name: kora-firebase-client
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kora/app/kora-firebase-api-key
        property: value
{{- end }}
