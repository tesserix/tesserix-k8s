{{- if .Values.externalSecret.create }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kora-api.fullname" . }}-secrets
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.store.name }}
    kind: {{ .Values.externalSecret.store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "kora-api.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- $directProviderSecrets := dict "gemini_api_key" true "openai_api_key" true }}
    {{- $directProvidersEnabled := and (not .Values.aiGateway.enabled) .Values.legacyDirectAI.enabled }}
    {{- /*
      Stripe refs are withheld until stripe.enabled. ESO fails the ENTIRE
      ExternalSecret when any remoteRef names a key absent from Secret Manager,
      so listing these before they exist would stop database_url re-syncing and
      take kora-api down (kora#478).
    */}}
    {{- $stripeSecrets := dict "stripe_secret_key" true "stripe_webhook_secret" true }}
    {{- $stripeEnabled := and .Values.stripe .Values.stripe.enabled }}
    {{- range $secretKey, $smName := .Values.externalSecret.remoteRefs }}
    {{- if and (or $directProvidersEnabled (not (hasKey $directProviderSecrets $secretKey))) (or $stripeEnabled (not (hasKey $stripeSecrets $secretKey))) }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $smName }}
    {{- end }}
    {{- end }}
{{- end }}
