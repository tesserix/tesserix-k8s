{{- if and .Values.aiGateway.enabled .Values.aiRegistry.baseURL .Values.aiRegistry.deployKey.create }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.aiRegistry.deployKey.name }}
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.aiRegistry.deployKey.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.aiRegistry.deployKey.store.name }}
    kind: {{ .Values.aiRegistry.deployKey.store.kind }}
  target:
    name: {{ .Values.aiRegistry.deployKey.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.aiRegistry.deployKey.key }}
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.aiRegistry.deployKey.remoteRef) }}
        key: {{ default (.Values.aiRegistry.deployKey.remoteRef) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-{{ if hasPrefix "kora-development/" $bao }}development{{ else }}production{{ end }}
          kind: SecretStore
{{- end }}
{{- end }}
