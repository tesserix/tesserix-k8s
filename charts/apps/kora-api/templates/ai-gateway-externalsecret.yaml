{{- if .Values.aiGateway.clientSecret.create }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.aiGateway.clientSecret.name }}
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.aiGateway.clientSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.aiGateway.clientSecret.store.name }}
    kind: {{ .Values.aiGateway.clientSecret.store.kind }}
  target:
    name: {{ .Values.aiGateway.clientSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.aiGateway.clientSecret.key }}
      remoteRef:
        key: {{ .Values.aiGateway.clientSecret.remoteRef }}
{{- end }}
