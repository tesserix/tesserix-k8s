{{- if .Values.migrate.enabled }}
# Runs Kora's migrate binary (cmd/migrate, shipped alongside the API binary
# in the same image at /usr/local/bin/migrate) before the Knative Service
# rolls, so the API never starts against a schema older than the code
# expects. Same shape as homechef-api's temporal-namespace-job.yaml.
#
# PreSync (not PostSync/sync-wave): migrations must land before the new
# revision's pods start serving, not after.
#
# TODO(ci): requires the controller's planned Dockerfile change to ship
# /usr/local/bin/migrate in the kora-api image. Until then this Job fails
# loudly with "exec: no such file or directory" — intentional, so a missing
# migrate binary blocks the sync instead of silently deploying stale schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kora-api.fullname" . }}-migrate
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "kora-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "kora-api.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrate.command | nindent 12 }}
          env:
            # DATABASE_URL is the only env cmd/migrate needs — sourced
            # from the same ExternalSecret-backed Secret as the API.
            {{- $secretName := printf "%s-secrets" (include "kora-api.fullname" .) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index .Values.secretEnv "DATABASE_URL" }}
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
