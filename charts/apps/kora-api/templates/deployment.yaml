# Plain Deployment for kora-api — replaces the legacy Service (which does not
# compose with the Istio ambient mesh this fleet runs). Mirrors homechef-api:
# a long-lived Deployment behind a ClusterIP Service, joined to ambient via the
# namespace's istio.io/dataplane-mode label (no sidecar, no queue-proxy). The
# kora-istio VirtualService routes to the ClusterIP directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kora-api.fullname" . }}
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # Roll pods when a referenced Secret/ConfigMap actually changes. Env sourced
    # via secretKeyRef is read once at start, so rotating a secret (e.g. the
    # ExternalSecret re-syncing DATABASE_URL) otherwise has no effect on running
    # pods. stakater/reloader triggers only on referenced resources that change.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "kora-api.selectorLabels" . | nindent 6 }}
      # Extra stack label keeps this Deployment's Service (and any leftover
      # legacy revision pods, which carry the same app.kubernetes.io labels)
      # from cross-selecting during the cutover window.
      kora.tesserix.app/stack: deployment
  template:
    metadata:
      labels:
        {{- include "kora-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        kora.tesserix.app/stack: deployment
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kora-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.migrate.enabled .Values.redis.enabled }}
      initContainers:
      {{- if .Values.migrate.enabled }}
        # Schema migration runs HERE, not as a separate ArgoCD wave -1 Job.
        #
        # WHY: as a Job the ordering was timing-dependent and was observed
        # landing both ways (kora#118). ArgoCD advances past a wave once its
        # resources report Healthy, and a Job is Healthy when Complete — but
        # `Replace=true,Force=true` (needed because a Job's spec.template is
        # immutable, so a chart-version bump would abort the sync) means the
        # PREVIOUS sync's already-Complete Job can be what health is read
        # against. Wave -1 then looks satisfied instantly and the Deployment
        # rolls while the real migration is still starting. On 2026-08-06 the
        # new pod won by one second.
        #
        # That is dangerous asymmetrically: a migration that adds a column the
        # new code's GORM struct maps (e.g. 000024's users.apple_refresh_token)
        # makes a new-code pod against an old schema fail EnsureUser, which
        # ResolveMiddleware runs on every authenticated route — so every
        # authenticated request 500s until the migration lands. The reverse
        # (old pod, new schema) is safe for additive migrations.
        #
        # As an initContainer the ordering stops being a scheduling policy and
        # becomes structural: kubelet will not start the api container until
        # this exits 0, so a pod cannot be Ready before its own migration
        # completed. A failing migration crash-loops the NEW pod while the old
        # one keeps serving — the correct failure mode. This also removes the
        # Job entirely, and with it the immutability workaround.
        #
        # No sidecar-blocks-initContainer hazard: this namespace is ambient
        # (istio.io/dataplane-mode), so there is no sidecar to wait for.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrate.command | nindent 12 }}
          env:
            # DATABASE_URL is the only env cmd/migrate needs. Deliberately NOT
            # `optional: true` (unlike the api container below): an unpopulated
            # Secret must fail the pod loudly rather than let migrate run
            # against an empty URL and report success.
            {{- $secretName := printf "%s-secrets" (include "kora-api.fullname" .) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index .Values.secretEnv "DATABASE_URL" }}
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      {{- if .Values.redis.enabled }}
        # Resolve-cache Redis, as a NATIVE SIDECAR (kora#105).
        #
        # An initContainer with restartPolicy: Always, NOT an entry under
        # `containers`. That distinction is the whole fix.
        #
        # As a normal container this raced and lost: Kubernetes starts regular
        # containers in PARALLEL, kora-api probes Redis exactly once at boot,
        # and on the first deploy the API dialled 127.0.0.1:6379 at 04:30:36
        # while Redis only reached "Ready to accept connections" at 04:30:39.
        # The API logged "redis unreachable, cache disabled" and ran the whole
        # pod lifetime with no cache — the sidecar present and healthy, and
        # completely unused.
        #
        # A native sidecar is started BEFORE the app containers and kubelet
        # waits for its startupProbe, so the API cannot boot until Redis
        # answers PING. Listed after the migrate initContainer so a failed
        # migration still fails fast without spinning Redis up first.
        - name: redis
          restartPolicy: Always
          image: "{{ .Values.redis.image }}"
          imagePullPolicy: IfNotPresent
          args:
            # maxmemory-policy is NOT a default worth accepting. The resolve
            # cache's generation counter (ai:resolve-cache:generation) is
            # deliberately persistent with NO TTL, so under allkeys-lru or
            # allkeys-random Redis is free to evict it under memory pressure
            # like any other key — silently breaking invalidation. The OPS
            # PRECONDITION on api/internal/ai/cache.go:117 requires a
            # TTL-respecting policy. Verified empirically: filling to the
            # memory ceiling evicts ~800 TTL'd entries under volatile-lru and
            # the counter survives, while allkeys-lru destroys it.
            - "--maxmemory-policy"
            - "volatile-lru"
            # A hard ceiling so the cache can never compete with the API for
            # the pod's memory. Entries carry a 24h TTL (cmd/api/main.go), so
            # this bounds a day of resolutions, not unbounded growth.
            - "--maxmemory"
            - "{{ .Values.redis.maxmemory }}"
            # No persistence: every entry is reconstructible from the AI
            # provider, so RDB/AOF would buy nothing and cost disk I/O.
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # THE gate: kubelet will not start kora-api until this passes, which
          # is what closes the race described above.
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            failureThreshold: 3
      {{- end }}
      {{- end }}
      containers:
        - name: kora-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 9090 }}
              protocol: TCP
          env:
            # PORT is set explicitly now that the legacy runtime (which reserved and
            # injected it) is gone. Kora's config defaults to 8080 when unset
            # (internal/config/config.go), so this just makes the listen port
            # match the container/Service port unambiguously.
            - name: PORT
              value: {{ .Values.service.targetPort | default 8080 | quote }}
            {{- if .Values.aiGateway.enabled }}
            - name: AI_GATEWAY_ENABLED
              value: "true"
            - name: AI_GATEWAY_BASE_URL
              value: {{ .Values.aiGateway.baseURL | quote }}
            - name: AI_GATEWAY_MODEL
              value: {{ .Values.aiGateway.model | quote }}
            - name: AI_AGENT_TIMEOUT
              value: {{ .Values.aiGateway.agentTimeout | quote }}
            - name: AI_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiGateway.clientSecret.name }}
                  key: {{ .Values.aiGateway.clientSecret.key }}
                  optional: true
            {{- if .Values.aiRegistry.baseURL }}
            # Agent cards are resolved from the registry per request. The deploy
            # key is its OWN credential, not the gateway's: the registry matches
            # sha256(bearer) against its `kora=` AUTH_DEPLOY_KEYS entry, so the
            # gateway key authenticates as nobody and every lookup 401s.
            - name: AI_REGISTRY_BASE_URL
              value: {{ .Values.aiRegistry.baseURL | quote }}
            - name: AI_REGISTRY_TTL
              value: {{ .Values.aiRegistry.ttl | default "5m" | quote }}
            {{- if .Values.aiRegistry.deployKey.create }}
            - name: AI_REGISTRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiRegistry.deployKey.name }}
                  key: {{ .Values.aiRegistry.deployKey.key }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- end }}
            # Plain (non-secret) env from values.yaml :: env
            {{- $directProviderEnv := dict "VERTEX_PROJECT" true "VERTEX_LOCATION" true "OPENAI_BASE_URL" true "OPENAI_MODEL" true "OPENAI_JSON_OBJECT" true }}
            {{- $directProvidersEnabled := and (not .Values.aiGateway.enabled) .Values.legacyDirectAI.enabled }}
            {{- range $key, $value := .Values.env }}
            {{- if or $directProvidersEnabled (not (hasKey $directProviderEnv $key)) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            # Secret env from values.yaml :: secretEnv — each maps an env var
            # name to a key in the <fullname>-secrets Secret created by the
            # ExternalSecret. `optional: true` lets pods boot before a value is
            # populated.
            {{- $secretName := printf "%s-secrets" (include "kora-api.fullname" .) -}}
            {{- $directProviderSecrets := dict "GEMINI_API_KEY" true "OPENAI_API_KEY" true }}
            {{- range $envName, $secretKey := .Values.secretEnv }}
            {{- if or $directProvidersEnabled (not (hasKey $directProviderSecrets $envName)) }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- range .Values.extraSecretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              # Kora exposes /health (liveness) and /ready (readiness) —
              # see api/internal/server/router.go.
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # /ready gates traffic on DB connectivity (returns 503 with the
              # error envelope until the DB is reachable — ready_test.go).
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
