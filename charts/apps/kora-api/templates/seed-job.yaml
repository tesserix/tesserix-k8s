{{- if .Values.seed.enabled }}
# Populates food_items, the table the resolver reads to build candidates for
# every capture (text, photo, voice, barcode).
#
# WHY THIS EXISTS: prod ran with an EMPTY food index. `GET /v1/foods?q=egg`
# returned null and `POST /v1/resolve/text` returned 200 with
# `candidates: null`, so every capture failed with "Something went wrong while
# I looked at that." Nothing could be logged at all. cmd/seed and cmd/ingest
# had existed all along but were not shipped in the image, so there was no way
# to run them in-cluster.
#
# sync-wave "1": strictly AFTER the Deployment (wave 0), because seeding writes
# to a table the migration creates and the migration now runs as the
# Deployment's `migrate` initContainer (kora#118 — it used to be a wave -1 Job,
# and this Job sat at wave 0 to follow it). ArgoCD does not advance to wave 1
# until the Deployment reports Healthy, and a Deployment is only Healthy once
# its pods are Ready — which kubelet will not allow until the initContainer has
# exited 0. So this ordering is now a stronger guarantee than the old one, not
# a weaker one. Both binaries are idempotent — a re-run inserts 0 rows and
# leaves the count unchanged (verified against a fresh database) — so it is
# safe for this Job to run again on every sync.
#
# Runs seed, then ingest, then embed in one container via `sh -c`; the runtime
# base is alpine, so /bin/sh is present. ingest is given ABSOLUTE paths because
# its relative flag defaults (data/food/*.json) assume the repo layout, not the
# image's /usr/local/share/kora/food.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kora-api.fullname" . }}-seed
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # A Job's spec.template is IMMUTABLE. Any change to it — including a
    # chart version bump, which lands in the template's helm.sh/chart label —
    # makes a patch fail with "field is immutable" and aborts the whole sync
    # at this wave. Replace+Force makes ArgoCD delete and recreate the Job
    # instead of patching it. Safe here: this Job is idempotent by design.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "kora-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: seed
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      # NOTE: hostNetwork was tried here (chart 0.1.11) to reach the Vertex PSC
      # endpoint, which accepts the node netns but rejects a Pod's. It DID fix
      # the network — the error moved from "connection reset by peer" to a
      # Vertex HTTP 403 — but it broke auth, because GKE's Workload Identity
      # metadata server runs on the POD network. A hostNetwork pod bypasses it,
      # picks up the node's default service account, and every call fails with
      # "Request had insufficient authentication scopes". hostNetwork and
      # Workload Identity are mutually exclusive here, so it was reverted in
      # 0.1.12. Do not reintroduce it without solving the identity side.
      serviceAccountName: {{ include "kora-api.serviceAccountName" . }}
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.seed.command | nindent 12 }}
          env:
            # DATABASE_URL is what seed/ingest/embed all need — sourced from the
            # same ExternalSecret-backed Secret as the API and the migrate Job,
            # so prod credentials are never handled outside the cluster.
            {{- $secretName := printf "%s-secrets" (include "kora-api.fullname" .) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index .Values.secretEnv "DATABASE_URL" }}
            # embed prefers Vertex over GEMINI_API_KEY when VERTEX_PROJECT is
            # set, authenticated by the workload-identity service account this
            # pod already runs under (kora-api-prod@, roles/aiplatform.user) —
            # no key. That lifts the free-tier ceiling of 1,000 embeddings per
            # project per day, which is what stalled the backfill (kora#97):
            # GEMINI_API_KEY belongs to kora-app-e6d38, where billing is
            # DISABLED, while tesseracthub-480811 already pays.
            #
            # Scoped to THIS Job on purpose. VERTEX_* must NOT go into
            # .Values.env, which only the API Deployment consumes (see
            # values-prod.yaml) — setting it there switches the resolve engine
            # over too, and that is exactly what kora#202 rolled back: the
            # Vertex primary missed IdentifyText's 1500ms textBudget and every
            # /v1/resolve/text 500'd. A batch backfill has no such budget, so
            # it can move ahead of the resolve path rather than wait on it.
            #
            # Location is "global" for the reason kora#202 recorded:
            # asia-south1 serves gemini-embedding-001 but 404s on
            # gemini-3.5-flash-lite, so "global" is the one location that
            # serves every model this image uses.
            {{- if and .Values.gcp.workloadIdentity.enabled .Values.seed.useVertex }}
            - name: VERTEX_PROJECT
              value: {{ .Values.gcp.projectId | quote }}
            - name: VERTEX_LOCATION
              value: "global"
            {{- end }}
            # Retained as the fallback for environments without workload
            # identity. cmd/embed takes VERTEX_PROJECT over this when both are
            # present, and with neither it logs and exits 0 — so a missing
            # secret still degrades to "no embeddings" rather than a
            # crashlooping Job.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ index .Values.secretEnv "GEMINI_API_KEY" }}
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
