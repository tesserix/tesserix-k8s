{{- if and .Values.aiGateway.enabled .Values.aiGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kora-ai-gateway-egress
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
spec:
  # Both stacks dial the gateway: the API for captures, the seed Job for
  # cmd/embed. allow-kora-egress (istio-config) selects every pod in the
  # namespace and does not allowlist agentgateway-system, so a pod NOT matched
  # here has no route to the gateway at all — the seed Job failed every embed
  # call with "connection reset by peer" until it was added.
  podSelector:
    matchLabels:
      {{- include "kora-api.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: kora.tesserix.app/stack
        operator: In
        values: ["deployment", "seed"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.aiGateway.networkPolicy.namespace }}
          podSelector:
            matchExpressions:
              - key: gateway.networking.k8s.io/gateway-name
                operator: In
                values:
                  - {{ .Values.aiGateway.networkPolicy.gatewayName }}
                  {{- range .Values.aiGateway.networkPolicy.additionalGatewayNames }}
                  - {{ . }}
                  {{- end }}
      ports:
        - port: {{ .Values.aiGateway.networkPolicy.port }}
          protocol: TCP
        - port: 15008
          protocol: TCP
{{- end }}
