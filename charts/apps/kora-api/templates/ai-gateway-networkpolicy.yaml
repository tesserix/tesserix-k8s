{{- if and .Values.aiGateway.enabled .Values.aiGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kora-ai-gateway-egress
  labels:
    {{- include "kora-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kora-api.selectorLabels" . | nindent 6 }}
      kora.tesserix.app/stack: deployment
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.aiGateway.networkPolicy.namespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.aiGateway.networkPolicy.gatewayName }}
      ports:
        - port: {{ .Values.aiGateway.networkPolicy.port }}
          protocol: TCP
        - port: 15008
          protocol: TCP
{{- end }}
