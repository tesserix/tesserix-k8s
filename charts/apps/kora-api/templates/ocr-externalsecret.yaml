{{- if .Values.ocr.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-ocr-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-kora-production
    kind: SecretStore
  target:
    name: kora-ocr-client
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        signing-key: >-
          {{`{{- $entry := regexFind "(^|,)kora-prod-v1=kora:[a-fA-F0-9]{64}(,|$)" .identities -}}`}}
          {{`{{- if eq $entry "" -}}{{ fail "Kora production OCR signing key missing or invalid" }}{{- end -}}`}}
          {{`{{- trimPrefix "kora-prod-v1=kora:" (trimAll "," $entry) -}}`}}
  data:
    - secretKey: identities
      remoteRef:
        key: kora/app/kora-ocr-workload-identity-keys
        property: value
{{- end }}
