# Default values for devai-sre

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/devai/devai-sre
  pullPolicy: Always
  tag: "fix-multi-provider-user-routing-c5d89ea@sha256:23feec0dc1c04f25cfdc79864edbe45accd8aab6cc308a5b9f5b7dfc53516f6a"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

mcpServices:
  - name: sre-mcp
    path: /mcp/sre

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: false

env:
  DEVAI_HOST: "0.0.0.0"
  DEVAI_PORT: "8090"
  DEVAI_LOG_LEVEL: "info"
  DEVAI_CLAUDE_MODEL: "claude-sonnet-4-20250514"
  DEVAI_GROQ_MODEL: "llama-3.3-70b-versatile"
  DEVAI_NEMOCLAW_ENDPOINT: "http://nemoclaw-inference.devai.svc.cluster.local:8000/v1"
  DEVAI_NEMOCLAW_MODEL: "nvidia/nemotron-3-super-120b-a12b"
  DEVAI_NEMOCLAW_FALLBACK_TO_GROQ: "true"
  DEVAI_LANGCHAIN_TRACING_V2: "true"
  DEVAI_LANGCHAIN_PROJECT: "devai-sre"
  # OpenTelemetry — export SRE API traces + metrics to the in-cluster collector
  # over OTLP/HTTP. Parked as "noop" while the collectors sit at
  # replicaCount: 0; "otel" against a dead endpoint retries forever and floods
  # the logs. Flip back when the collectors scale up.
  DEVAI_TELEMETRY_PROVIDER: "noop"
  DEVAI_OTEL_ENDPOINT: "http://otel-gateway.observability.svc.cluster.local:4318"
  DEVAI_OTEL_SERVICE_NAME: "devai-sre"
  DEVAI_PROMETHEUS_URL: "http://prometheus-server.monitoring.svc.cluster.local:80"
  DEVAI_GRAFANA_URL: "http://grafana.monitoring.svc.cluster.local:80"

database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: "5432"
  user: "devai"
  name: "devai_db"

redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  # Valkey ACL user; empty means password-only auth (local sandbox).
  user: ""

gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  enabled: false

keda:
  enabled: false

podAnnotations:
  holdApplicationUntilProxyStarts: "true"

podLabels: {}

llm:
  gatewayBaseUrl: ""
  gatewayRequired: false
