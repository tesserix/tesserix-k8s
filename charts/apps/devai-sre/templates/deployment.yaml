apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devai-sre.fullname" . }}
  labels:
    {{- include "devai-sre.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devai-sre.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "devai-sre.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devai-sre.serviceAccountName" . }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Database — password must be defined before URL for $(VAR) expansion
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-devai-password
                  key: password
            - name: DEVAI_DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            # Redis — password must be defined before URL for $(VAR) expansion
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-devai-password
                  key: password
            - name: DEVAI_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            # GCP project
            - name: GCP_PROJECT
              value: {{ .Values.gcp.projectId | default "" | quote }}
            # Secrets from ExternalSecret
            - name: DEVAI_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_ANTHROPIC_API_KEY
            - name: DEVAI_GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_GROQ_API_KEY
            - name: DEVAI_LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_LANGCHAIN_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
