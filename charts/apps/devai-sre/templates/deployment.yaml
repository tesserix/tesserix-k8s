apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devai-sre.fullname" . }}
  labels:
    {{- include "devai-sre.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devai-sre.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "devai-sre.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Avoid K8s legacy service-link env injection (DEVAI_MCP_HUB_PORT=
      # tcp://...) colliding with typed Settings fields and crashing pydantic.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devai-sre.serviceAccountName" . }}
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container hardening — drop all caps, no privilege escalation,
          # RuntimeDefault seccomp.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Database — password must be defined before URL for $(VAR) expansion
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-devai-password
                  key: password
            - name: DEVAI_DATABASE_URL
              # ?sslmode=disable: intra-cluster TLS is handled by Istio mesh;
              # asyncpg's auto-SSL upgrade against CNPG's pooler fails
              # with "Connection reset by peer" during startTLS. Skip it.
              value: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=disable"
            # redis.user is the Valkey ACL user confining this app to its own
            # key prefix. The user is nopass and the literal below is discarded,
            # but clients skip AUTH when the password is empty.
            - name: DEVAI_REDIS_URL
              value: "redis://{{ with .Values.redis.user }}{{ . }}:nopass@{{ end }}{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            # ─── Auth gate ────────────────────────────────────────
            # DEVAI_REQUIRE_AUTH flips the in-app enforce_auth check from
            # advisory to blocking (401 on anonymous mutating / sensitive
            # SRE calls). Default false preserves current behavior; the
            # deliberate prod flip lives in values-prod.yaml, sequenced
            # AFTER the new images ship.
            - name: DEVAI_REQUIRE_AUTH
              value: {{ .Values.requireAuth | default false | quote }}
            # Shared secret the auth-bff stamps as X-Auth-Bff-Secret so the
            # X-Forwarded-* trust path can be validated. Sourced from the
            # same secret the auth-bff is provisioned from; optional so the
            # pod still starts before the key lands in the
            # devai-auth-bff-secrets ExternalSecret (auth-bff lane owns it).
            - name: DEVAI_AUTH_BFF_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: devai-auth-bff-secrets
                  key: DEVAI_AUTH_BFF_SHARED_SECRET
                  optional: true
            # The secret above is optional, so an ExternalSecret failure
            # silently empties it — and an empty shared secret means "trust
            # X-Forwarded-* from anyone". false makes that fail closed
            # instead. Only rendered when set, so an explicit false survives.
            {{- if hasKey .Values "trustForwardedWithoutSecret" }}
            - name: DEVAI_TRUST_FORWARDED_WITHOUT_SECRET
              value: {{ .Values.trustForwardedWithoutSecret | quote }}
            {{- end }}
            # ─── Fiber-style blueprint runtime + adapters ─────────
            {{- if .Values.pipeline }}
            - name: DEVAI_PIPELINE_ENABLED
              value: {{ .Values.pipeline.enabled | default false | quote }}
            - name: DEVAI_PIPELINE_BLUEPRINT_DIR
              value: {{ .Values.pipeline.blueprintDir | default "blueprints" | quote }}
            - name: DEVAI_PIPELINE_SRE_BLUEPRINT
              value: {{ .Values.pipeline.sreBlueprint | default "sre-monitor" | quote }}
            - name: DEVAI_PIPELINE_CONCURRENCY
              value: {{ .Values.pipeline.concurrency | default 2 | quote }}
            - name: DEVAI_PIPELINE_DEFAULT_STAGE_TIMEOUT
              value: {{ .Values.pipeline.defaultStageTimeout | default 900 | quote }}
            {{- end }}
            {{- if .Values.specializations }}
            - name: DEVAI_SPECIALIZATIONS_ENABLED
              value: {{ .Values.specializations.enabled | default true | quote }}
            - name: DEVAI_SPECIALIZATIONS_DIR
              value: {{ .Values.specializations.dir | default "specializations" | quote }}
            {{- end }}
            {{- if .Values.memory }}
            - name: DEVAI_MEMORY_PROVIDER
              value: {{ .Values.memory.provider | default "noop" | quote }}
            # Embeddings for memory writes from the SRE learn stage —
            # records written here must be searchable by the same model
            # the API side queries with (text-embedding-3-small, 1536d).
            - name: DEVAI_EMBEDDING_PROVIDER
              value: {{ .Values.memory.embeddingProvider | default "auto" | quote }}
            - name: DEVAI_EMBEDDING_MODEL
              value: {{ .Values.memory.embeddingModel | default "text-embedding-3-small" | quote }}
            - name: DEVAI_EMBEDDING_DIMENSIONS
              value: {{ .Values.memory.embeddingDimensions | default 1536 | quote }}
            # Qdrant — same store and collection as devai-api, so a scan's
            # learnings are recallable from the ALM side.
            - name: DEVAI_QDRANT_URL
              value: {{ .Values.memory.qdrantUrl | default "" | quote }}
            - name: DEVAI_QDRANT_COLLECTION
              value: {{ .Values.memory.qdrantCollection | default "devai_memories" | quote }}
            - name: DEVAI_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_QDRANT_API_KEY
                  optional: true
            {{- end }}
            {{- if .Values.agenticControlPlane }}
            - name: DEVAI_AREGISTRY_URL
              value: {{ .Values.agenticControlPlane.aregistryUrl | default "" | quote }}
            - name: DEVAI_AGENTGATEWAY_URL
              value: {{ .Values.agenticControlPlane.agentgatewayUrl | default "" | quote }}
            {{- end }}
            {{- if .Values.llm }}
            - name: DEVAI_LLM_GATEWAY_BASE_URL
              value: {{ .Values.llm.gatewayBaseUrl | default "" | quote }}
            - name: DEVAI_LLM_GATEWAY_REQUIRED
              value: {{ .Values.llm.gatewayRequired | default false | quote }}
            {{- end }}
            # GCP project
            - name: GCP_PROJECT
              value: {{ .Values.gcp.projectId | default "" | quote }}
            # Secrets from ExternalSecret
            - name: DEVAI_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_ANTHROPIC_API_KEY
            - name: DEVAI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_OPENAI_API_KEY
            - name: DEVAI_GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_GROQ_API_KEY
            - name: DEVAI_LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_LANGCHAIN_API_KEY
            # SCM (GitHub) — lets the SRE code_remediator read a failing
            # service's repo, open a fix PR, and file a classified issue.
            # Creds are the same GitHub App the ALM side uses (devai-api-secrets).
            - name: DEVAI_SCM_PROVIDER
              value: "github"
            - name: DEVAI_SCM_AUTH_METHOD
              value: "github_app"
            - name: DEVAI_GITHUB_ORG
              value: {{ .Values.github | default dict | dig "org" "tesserix" | quote }}
            - name: DEVAI_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_GITHUB_APP_ID
            - name: DEVAI_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_GITHUB_APP_PRIVATE_KEY
            - name: DEVAI_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: DEVAI_GITHUB_APP_INSTALLATION_ID
            # ── Observability connectors (Datadog / New Relic / CloudWatch /
            # Azure Monitor / Elasticsearch / Grafana). Configured in DevAI
            # Settings → Observability, which writes the secret to GCP Secret
            # Manager. To light a provider up: add the matching key to the
            # `devai-api-secrets` ExternalSecret (external-secrets/prod/devai/)
            # and restart — the env var populates and the fan-out starts using
            # it. Every ref is `optional: true`, so the pod starts cleanly while
            # a provider is unconfigured (the adapter just treats it as absent).
            # In-cluster Prometheus + Grafana URLs are already set as plain
            # values above (.Values.env), so they're intentionally NOT repeated
            # here — listing a name twice (once value:, once valueFrom:) makes
            # the strategic-merge patch fuse them into one invalid entry and the
            # Deployment is rejected. Only keys NOT in .Values.env belong here.
            {{- $obsKeys := list
                "DEVAI_PROMETHEUS_TOKEN"
                "DEVAI_DATADOG_API_KEY" "DEVAI_DATADOG_APP_KEY" "DEVAI_DATADOG_SITE"
                "DEVAI_NEWRELIC_API_KEY" "DEVAI_NEWRELIC_ACCOUNT_ID"
                "DEVAI_AWS_REGION" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "DEVAI_CLOUDWATCH_LOG_GROUP"
                "DEVAI_AZURE_WORKSPACE_ID" "DEVAI_AZURE_RESOURCE_ID"
                "DEVAI_ELASTICSEARCH_URL" "DEVAI_ELASTICSEARCH_API_KEY" "DEVAI_ELASTICSEARCH_USERNAME" "DEVAI_ELASTICSEARCH_PASSWORD" "DEVAI_ELASTICSEARCH_INDEX"
                "DEVAI_GRAFANA_TOKEN" "DEVAI_GRAFANA_DATASOURCE_UID"
            }}
            {{- range $obsKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: devai-api-secrets
                  key: {{ . }}
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
