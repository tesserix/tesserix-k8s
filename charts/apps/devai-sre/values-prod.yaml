# Production overrides for devai-sre

replicaCount: 1

resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "devai-sre-monitor@tesseracthub-480811.iam.gserviceaccount.com"

rbac:
  create: true

database:
  host: "postgresql.postgresql-devai.svc.cluster.local"
  port: "5432"
  user: "devai"
  name: "devai_db"

redis:
  host: "redis.redis-devai.svc.cluster.local"
  port: "6379"
