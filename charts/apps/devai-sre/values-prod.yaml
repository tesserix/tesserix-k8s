# Production overrides for devai-sre

replicaCount: 1

# ─── Auth gate (DELIBERATE FLIP — sequence AFTER new images ship) ────────────
# Blocks anonymous mutating / sensitive SRE reads (costs/incidents/topology)
# instead of falling through with a synthetic principal. Chart half of CODE-1;
# DEVAI_AUTH_BFF_SHARED_SECRET (wired in templates/deployment.yaml from the
# devai-auth-bff-secrets ExternalSecret) validates the X-Forwarded-* trust
# path. Applied per runbook only after the auth-aware images are rolled.
# WAVE-2 flip — keep FALSE until the auth-aware images are live (runbook §5).
# WAVE-2 ENABLED 2026-06-08: the auth-aware image (CODE-1) is live.
requireAuth: true

# Bumping this annotation rolls the deployment so :latest gets re-pulled.
podAnnotations:
  # WAVE-2: bump to roll the pod so it picks up the synced shared secret.
  deployedAt: "wave2-shared-secret"

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi

gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "devai-sre-monitor@tesseracthub-480811.iam.gserviceaccount.com"

rbac:
  create: true

database:
  host: "devai-postgres-rw.devai.svc.cluster.local"
  port: "5432"
  user: "devai"
  name: "devai_db"

# Shared Valkey. The Service is HAProxy, which only routes to the node
# reporting role:master, so a Sentinel failover needs no client awareness.
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  user: "devai"

# ─── Fiber-style blueprint runtime + adapters (new) ──────────────────
# When pipeline.enabled is true the SRE server dispatches its scans
# through `sre-monitor.yaml` blueprint instead of the hardcoded
# SREOrchestrator. Falls back automatically if the runtime fails to
# start.
pipeline:
  enabled: true
  blueprintDir: "blueprints"
  defaultBlueprint: "sre-monitor"
  sreBlueprint: "sre-monitor"
  concurrency: 2
  defaultStageTimeout: 900

specializations:
  enabled: true
  dir: "specializations"

# Memory adapter — SRE uses the same qdrant store for the "learn"
# stage (writes episodic memories about each scan). Provider, store
# and embedding settings must match devai-api or SRE-written records
# are invisible to the API side's queries.
memory:
  provider: "qdrant"
  embeddingProvider: "auto"
  embeddingModel: "text-embedding-3-small"
  embeddingDimensions: 1536
  qdrantUrl: "http://qdrant.ai-database.svc.cluster.local:6333"
  qdrantCollection: "devai_memories"

# Agentic control planes (read-only for SRE — it doesn't create agents).
agenticControlPlane:
  # CHART-14: the registry Service exposes HTTP on 12121 (-> targetPort 8080),
  # not 8080. Port 8080 is the container port and is unrouted, so SRE registry
  # reads silently failed. Match the route-sync / registry-bootstrap endpoints.
  aregistryUrl: "http://agentregistry.agentregistry-system.svc.cluster.local:12121"
  # MCP dispatch data plane. LLM routing uses DEVAI_LLM_GATEWAY_BASE_URL and
  # must never be conflated with this control-plane URL.
  agentgatewayUrl: "http://agentgateway-mcp.agentgateway-system.svc.cluster.local:8080"

llm:
  gatewayBaseUrl: "http://ai-gateway.agentgateway-system.svc.cluster.local:8080"
  gatewayRequired: true
