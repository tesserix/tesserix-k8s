{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fanzone-commentary.fullname" . }}-secrets
  labels:
    {{- include "fanzone-commentary.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "fanzone-commentary.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod-fanzone-postgresql-url
    - secretKey: FANZONE_DATABASE_URL
      remoteRef:
        key: prod-fanzone-postgresql-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod-fanzone-jwt-secret
    - secretKey: NATS_URL
      remoteRef:
        key: prod-fanzone-nats-url
    - secretKey: CLOUDFLARE_CALLS_APP_ID
      remoteRef:
        key: prod-fanzone-cloudflare-calls-app-id
    - secretKey: CLOUDFLARE_CALLS_APP_SECRET
      remoteRef:
        key: prod-fanzone-cloudflare-calls-app-secret
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: prod-fanzone-cloudflare-account-id
    - secretKey: CLOUDFLARE_COMMENTATOR_PRESET_ID
      remoteRef:
        key: prod-fanzone-cloudflare-commentator-preset-id
    - secretKey: CLOUDFLARE_LISTENER_PRESET_ID
      remoteRef:
        key: prod-fanzone-cloudflare-listener-preset-id
{{- end }}
