# Production overrides for stockpilot-worker — isolated LLM/AI task processor

# Pin to the same per-commit tag as stockpilot-api: the worker runs the
# same backend image with a different uvicorn entrypoint. The api CI
# workflow (.github/workflows/stockpilot-api-build.yml) bumps this in
# lockstep with stockpilot-api/values-prod.yaml on every green build,
# so leaving this on `:latest` would silently lag main behind the api.
image:
  tag: "main-63e1bc0"
replicaCount: 0  # parked — product scaled down
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 2Gi
env:
  PYTHONUNBUFFERED: "1"
  ACCOUNT_MODE: "demo"
  LLM_PROVIDER: "groq"
  SKIP_AUTH: "false"
  # Open signup: worker iterates every user from the DB now (UserRepository
  # .list_all) instead of trusting an env-side allowlist.
  ALLOWED_EMAILS: ""
  # Worker doesn't serve external requests, no CORS needed
  # Alpaca Broker API — credentials resolved from GCP SM via Workload Identity
  ALPACA_BROKER_URL: "https://broker-api.sandbox.alpaca.markets"
  ALPACA_AUTH_URL: "https://authx.sandbox.alpaca.markets"
  ALPACA_DATA_URL: "https://data.sandbox.alpaca.markets"
# No IB Gateway sidecar on worker
ibGateway:
  enabled: false
# Scale worker horizontally when many users trigger scans simultaneously
autoscaling:
  enabled: false # Replaced by KEDA
keda:
  enabled: false  # parked — cpu/memory triggers cannot scale to zero
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  prometheus:
    enabled: false # Worker doesn't serve external traffic
  memory:
    enabled: true
    threshold: "75"
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-global-prod@tesseracthub-480811.iam.gserviceaccount.com"
database:
  host: "stockpilot-postgres-rw.stockpilot.svc.cluster.local"
  port: "5432"
  user: "stockpilot"
  name: "stockpilot"
  sslmode: "require"
redis:
  host: "global-valkey-cache.global.svc.cluster.local"
  port: "6379"
  user: "stockpilot"
