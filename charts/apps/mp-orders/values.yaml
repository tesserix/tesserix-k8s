serviceType: go
port: 8080
healthPath: /health
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/tesserix/mp-orders
  tag: latest

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

probes:
  startup:
    failureThreshold: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 15

serviceAccount:
  create: true
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

db:
  enabled: true
  host: postgresql.postgresql-marketplace.svc.cluster.local
  port: "5432"
  name: mp_orders_db
  user: mp_orders_user
  sslmode: require
  secretKey: mp-orders-db-password

openfga:
  enabled: true
  url: http://openfga.marketplace.svc.cluster.local
  authMode: mesh
  apiKeySecret: true
  storeId: "01KKNQENND85P9T01YCBCTRDHV"

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  refreshInterval: 15m

extraSecrets: []

env:
  INVENTORY_SERVICE_URL: http://mp-inventory.marketplace.svc.cluster.local
  PAYMENT_SERVICE_URL: http://mp-payments.marketplace.svc.cluster.local
  NOTIFICATION_SERVICE_URL: http://notification-service.marketplace.svc.cluster.local
  PRODUCTS_SERVICE_URL: http://mp-products.marketplace.svc.cluster.local
  CUSTOMERS_SERVICE_URL: http://mp-customers.marketplace.svc.cluster.local
  VENDORS_SERVICE_URL: http://mp-vendors.marketplace.svc.cluster.local
  COUPONS_SERVICE_URL: http://mp-coupons.marketplace.svc.cluster.local
  SHIPPING_SERVICE_URL: http://mp-shipping.marketplace.svc.cluster.local
  TAX_SERVICE_URL: http://mp-tax.marketplace.svc.cluster.local
  TENANT_SERVICE_URL: http://tenant-service.marketplace.svc.cluster.local

gcp:
  projectId: ""
