apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: zitadel
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}

  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.database }}
      owner: {{ .Values.bootstrap.owner }}
      encoding: UTF8
      localeCType: C
      localeCollate: C

  storage:
    size: {{ .Values.storageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  walStorage:
    size: {{ .Values.walStorageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  resources:
    {{- toYaml .Values.resources | nindent 4 }}

  postgresql:
    parameters:
      {{- range $key, $value := .Values.postgresql }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}

  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: "_cnpg_"
    updateInterval: 30

  # Zitadel's setup Job connects as the superuser to CREATE DATABASE, CREATE
  # ROLE and GRANT before the API ever starts; it cannot bootstrap itself
  # without one. CNPG publishes it as zitadel-postgres-superuser.
  enableSuperuserAccess: true

  {{- if .Values.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      googleCredentials:
        gkeEnvironment: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: true
        jobs: 2
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
    target: prefer-standby

  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ .Values.backup.serviceAccount }}
  {{- end }}

  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
    disableDefaultQueries: false

  inheritedMetadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      traffic.sidecar.istio.io/excludeInboundPorts: "5432,8000"
      traffic.istio.io/excludeInboundPorts: "5432,8000"

  affinity:
    podAntiAffinityType: {{ .Values.affinity.podAntiAffinityType }}

  primaryUpdateStrategy: unsupervised
  failoverDelay: 0
  switchoverDelay: 3600

  enablePDB: true
