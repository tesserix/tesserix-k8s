{{- if .Values.networkPolicy.enabled }}
# cnpg-system must be in the ingress policy of any namespace hosting a
# cluster, or the operator cannot reach the instance manager on 8000 and
# replicas are never created (docs/postgres-cluster-policy.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    # Selecting these pods at all makes them deny-by-default, so the namespace's
    # own workloads need an explicit rule. Under ambient the connection arrives
    # on the HBONE port, not 5432, and blocking it surfaces as a Postgres TLS
    # reset rather than anything network-shaped.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 15008
{{- end }}
