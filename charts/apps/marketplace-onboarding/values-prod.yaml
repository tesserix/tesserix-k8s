serviceType: nextjs
port: 3000
servicePort: 80
healthPath: /api/health
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly/mark8ly-onboarding
  tag: "latest"

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  concurrencyTarget: 50
  containerConcurrency: 50
  timeoutSeconds: 60

probes:
  startup:
    failureThreshold: 15
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

db:
  enabled: true
  host: ""
  port: ""
  name: ""
  user: ""
  sslmode: ""
  secretKey: mp-onboarding-db-password

openfga:
  enabled: false
  url: ""
  authMode: ""
  apiKeySecret: false
  storeId: "01KMS970NNJPJP97MR7XNZSVD3"

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
  refreshInterval: 15m

extraSecrets:
  - secretKey: CONTENT_DB_PASSWORD
    remoteKey: prod-global-postgresql-password

env:
  CONTENT_DB_HOST: postgresql.postgresql-global.svc.cluster.local
  CONTENT_DB_PORT: "5432"
  CONTENT_DB_NAME: onboarding_content_db
  CONTENT_DB_USER: postgres
  CONTENT_DB_SSLMODE: require
  CONTENT_DB_SSL_REJECT_UNAUTHORIZED: "false"
  CONTENT_DB_PASSWORD_SECRET_NAME: prod-global-postgresql-password
  AUTH_BFF_URL: http://auth-bff.marketplace.svc.cluster.local:8080
  TENANT_SERVICE_URL: http://tenant-service.marketplace.svc.cluster.local:8080
  LOCATION_SERVICE_URL: http://location-service.marketplace.svc.cluster.local:8080
  VERIFICATION_SERVICE_URL: http://verification-service.marketplace.svc.cluster.local:8080
  TENANT_ROUTER_SERVICE_URL: http://tenant-router-service.marketplace.svc.cluster.local:8089
  INTERNAL_SERVICE_KEY_SECRET_NAME: prod-internal-service-key
  CSRF_ALLOWED_DOMAINS: mark8ly.com

gcp:
  projectId: tesseracthub-480811
  secretManager:
    secretPrefix: prod
directServicePort: 80
