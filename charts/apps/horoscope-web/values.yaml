# Default values for horoscope-web (Next.js 15 frontend)
replicaCount: 1

image:
  # Pull through GCP Artifact Registry's ghcr-remote cache — mirrors
  # ghcr.io/tesserix/tesserix-horoscope/horoscope-web on first pull and
  # serves subsequent pulls from-region (no egress, faster cold-starts).
  # Same convention as homechef-web.
  #
  # Tag policy: pin to commit SHA, NOT :latest. The AR pull-through cache
  # has a stale-tag problem where it keeps serving the previous digest
  # for :latest until manually purged. Pinning by SHA forces the AR
  # cache to fetch fresh from GHCR for that specific tag, sidestepping
  # the cache. Bump this on every release; Kargo will eventually
  # automate it the way it does for homechef.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-horoscope/horoscope-web
  pullPolicy: Always
  tag: "a543cbe5280a9dce06517fa7b9272542622ee023"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: true

podAnnotations:
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Knative Serving — one warm replica, autoscale up to 3 under load.
knative:
  enabled: true
  minScale: 1
  maxScale: 3
  scaleDownDelay: "120s"
  containerConcurrency: 0
  timeoutSeconds: 60

resources:
  limits:
    memory: 384Mi
  requests:
    memory: 96Mi
    cpu: 50m

# Runtime env. Note: NEXT_PUBLIC_* vars are baked into the client bundle
# at BUILD time by the GitHub Actions workflow — these settings here are
# for any server-side env Next.js reads at runtime (currently none).
# The runtime flip in lib/api.ts that swaps to relative URLs when the
# host isn't localhost is what makes a single image work in dev + prod.
env:
  NODE_ENV: "production"
  HOSTNAME: "0.0.0.0"

# Workload Identity (lets the SA mount any future GCS bucket directly).
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-horoscope-prod@tesseracthub-480811.iam.gserviceaccount.com"
