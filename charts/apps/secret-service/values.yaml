# Platform policy: memory requests/limits only — NEVER set CPU requests/limits.

namespace: secret-service

api:
  image:
    # Built from tesserix-home/secrets-api — the Go backend moved into that
    # repository so the console and its API ship from one place (#274).
    repository: ghcr.io/tesserix/tesserix-secrets-api
    tag: main-59a317b
    # The tag is immutable, so the digest behind it never changes and there is
    # nothing for a re-pull to discover. Bump the tag to deploy (#468).
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

# Which stores the console can drive, and which one it opens on. A backend
# absent from `enabled` cannot be reached by any request, whatever it asks for.
backends:
  enabled:
    - openbao
    - gcpsm
  default: openbao

# Google Secret Manager backend. Authentication is Workload Identity: the API's
# ServiceAccount impersonates this GSA, which holds the write-blind custom role
# from terraform-new/stacks/06-workload-identity — no key file exists.
gcpSecretManager:
  projectId: tesseracthub-480811
  serviceAccount: secret-service@tesseracthub-480811.iam.gserviceaccount.com
  # Empty asks Google to replicate automatically.
  locations: []

openbao:
  address: http://openbao.openbao.svc.cluster.local:8200
  mount: kv
  # Matches `bootstrap.kubernetesRoles[name=secret-service]` in the openbao chart.
  kubernetesRole: secret-service
  kubernetesMount: kubernetes

# The console holds the login and the per-operator token; secrets-api only
# verifies it. Same Zitadel project as platform-api, so the same operator
# token that authorises the rest of the console works here unchanged (no new
# OIDC client, no second login) — see the cutover design §5/§6.
zitadel:
  issuer: https://auth.tesserix.app
  projectId: "386377618200461939"
  consoleClientID: "386382971877196703"

workloadSecretBroker:
  enabled: true
  audience: secret-service
  allowedSubjects:
    - system:serviceaccount:devai:devai-api
  namespace: devai
  app: devai-api

# Whitelisting an app is a pull request against this repository, never a write
# to the cluster: main is protected, so the second administrator still reviews
# it. The token needs contents:write and pull_requests:write, nothing more.
gitops:
  owner: tesserix
  repo: tesserix-k8s
  branch: main
  valuesPath: charts/thirdparty/openbao/values.yaml

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  # Set to "" once the App identity is verified in production; the service
  # ignores GITHUB_TOKEN whenever GITHUB_APP_ID is set, so leaving both during
  # the cutover is safe and gives a values-only rollback.
  githubTokenSecret: prod-secret-service-github-token
  githubApp:
    # Flip to true only after the three secrets below exist in Secret Manager.
    # ESO fails the whole ExternalSecret if any referenced key is missing, which
    # would take GITHUB_TOKEN down with it and stop proposals entirely.
    enabled: true
    appIdSecret: prod-secret-service-github-app-id
    installationIdSecret: prod-secret-service-github-app-installation-id
    privateKeySecret: prod-secret-service-github-app-private-key

istio:
  enabled: true
  gateways:
    - istio-ingress/tesseract-gateway
    - istio-ingress/custom-domain-gateway

networkPolicy:
  enabled: true
  # kube-dns ClusterIP — NodeLocal DNSCache answers locally, so a kube-system
  # namespaceSelector never matches on its own.
  dnsServiceIP: 10.30.0.10
  # Cluster pod CIDR for the ambient HBONE rule. A wrong value silently kills
  # all east-west traffic for the namespace.
  podCIDR: 10.20.0.0/16
  # GKE metadata server, which mints the Workload Identity token. Only the API
  # pod may reach it, and only while the Secret Manager backend is enabled.
  metadataServerIP: 169.254.169.254
  # The metadata server also answers from elsewhere in the link-local range.
  linkLocalCIDR: 169.254.0.0/16
  apiServerServiceIP: 10.30.0.1

pdb:
  enabled: true
  minAvailable: 1

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
