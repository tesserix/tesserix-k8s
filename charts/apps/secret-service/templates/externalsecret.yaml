{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secret-service-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "secret-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: secret-service-api
    creationPolicy: Owner
  data:
{{- if .Values.externalSecret.githubTokenSecret }}
    # The personal-access-token identity. Kept so that reverting to it is a
    # values change rather than a redeploy of older code — but it attributes
    # every console-raised pull request to the token's owner (#464), so it is
    # the fallback, not the target.
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.githubTokenSecret }}
{{- end }}
{{- if .Values.externalSecret.githubApp.enabled }}
    # The GitHub App identity. Scope the app to tesserix-k8s with
    # contents:write + pull_requests:write and NOT admin, and do not add it to
    # either ruleset's bypass_actors — the point of #464 is that branch
    # protection binds the service rather than merely advising it.
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: {{ .Values.externalSecret.githubApp.appIdSecret }}
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: {{ .Values.externalSecret.githubApp.installationIdSecret }}
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: {{ .Values.externalSecret.githubApp.privateKeySecret }}
{{- end }}
{{- end }}
