{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: secret-service-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "secret-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: secret-service-api
    creationPolicy: Owner
  data:
    - secretKey: SESSION_KEY
      remoteRef:
        key: {{ .Values.externalSecret.sessionKeySecret }}
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: {{ .Values.externalSecret.googleClientIDSecret }}
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.externalSecret.googleClientSecret }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.githubTokenSecret }}
{{- end }}
