{{- if .Values.istio.enabled }}
{{/* The mesh-wide deny-all-default reaches this ambient namespace too, so the
     API needs an explicit ALLOW or every caller gets "RBAC: access denied".

     ADMITTED BY PRINCIPAL. An earlier version of this comment said a principal
     rule "can never match" the console, because `tesserix` carries
     `istio-injection=disabled` and no `istio.io/dataplane-mode`, so the caller
     would present no SPIFFE identity and writing one here would deny the
     console outright. The namespace label is still exactly that — but the
     conclusion is no longer true: the console PODS are enrolled individually
     (`istio.io/dataplane-mode: ambient`, `ambient.istio.io/redirection:
     enabled`), and ztunnel records every call to this service as
     `src.identity="spiffe://cluster.local/ns/tesserix/sa/console"`. Ambient
     enrolment happened at the pod level, not the namespace level, which is
     what made the namespace observation misleading. The old comment named
     this tightening as the thing to do "at which point `tesserix` joins the
     mesh"; it has.

     WHY THIS MATTERS. `namespaces: ["tesserix"]` admitted eight workloads —
     company, platform-api, tesserix-auth-bff, tesserix-blog, tesserix-docs,
     tesserix-storybook, ai-usage-ingest, console — to the service holding
     OpenBao write access and a GitHub App credential. Only the console has
     any business here, and a namespace rule is a check on where a packet came
     from rather than on who sent it (tesserix-home#520, #274).

     OBSERVED BEFORE NARROWING, not assumed: across all six ztunnel pods, every
     connection to this service came from that one identity — 146 of 146. No
     `monitoring` traffic appeared, and there is no ServiceMonitor or
     PodMonitor referencing this service anywhere, nor any metrics port on it
     (the Service exposes `http:8080` alone), so the `monitoring` allowance is
     dropped as serving nothing.

     `secret-service` is KEPT deliberately. It holds only this workload, and
     the intra-namespace allowance covers health and ztunnel traffic that
     network-policies.yaml already carries. Removing it saves nothing and
     risks readiness, which is the one failure here that would be an outage
     rather than a refusal.

     IF THIS IS WRONG, ztunnel says so: it logs RBAC decisions, so a caller
     that should have been admitted appears as a denial rather than as silence.
     Rollback is restoring the namespace rule. */}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: secret-service-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "secret-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/tesserix/sa/console
    - from:
        - source:
            namespaces: ["secret-service"]
    - from:
        - source:
            principals:
              - cluster.local/ns/devai/sa/devai-api
{{- end }}
