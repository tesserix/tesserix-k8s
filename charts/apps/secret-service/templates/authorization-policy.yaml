{{- if .Values.istio.enabled }}
{{/* The mesh-wide deny-all-default reaches this ambient namespace too, so the
     API needs an explicit ALLOW or every caller gets "RBAC: access denied".

     This is admitted by NAMESPACE, not principal, and that is a deliberate
     downgrade from what the cutover design (§7) actually wants. The console
     (namespace `tesserix`) has no ztunnel sidecar and no ambient label —
     verified live: `istio-injection=disabled`, no `istio.io/dataplane-mode`
     — so it presents no SPIFFE identity and a principal rule can never match
     it; writing one here would deny the console outright. Namespace is the
     strongest selector available until `tesserix` joins the mesh, at which
     point this should tighten to the console's service account principal.
     Until then this rule is a namespace check, not an identity check — it
     does not authenticate the caller, only where the packet came from.

     `istio-ingress`/`istio-system` are dropped: the VirtualService is gone,
     so accepting gateway traffic here is no longer correct. `secret-service`
     stays for the intra-namespace health/ztunnel traffic network-policies.yaml
     already carries, and `monitoring` stays for Prometheus scrape. */}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: secret-service-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "secret-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["secret-service", "monitoring", "tesserix"]
    - from:
        - source:
            principals:
              - cluster.local/ns/devai/sa/devai-api
{{- end }}
