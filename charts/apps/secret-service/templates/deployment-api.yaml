apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-service-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "secret-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secret-service.labels" . | nindent 8 }}
        {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: secret-service-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: APP_BASE_URL
              value: https://{{ .Values.host }}
            - name: ALLOWED_ORIGINS
              value: https://{{ .Values.host }}
            - name: SESSION_TTL
              value: {{ .Values.sessionTTL | quote }}
            - name: ADMIN_EMAILS
              value: {{ join "," .Values.adminEmails | quote }}
            - name: SECRET_BACKENDS
              value: {{ join "," .Values.backends.enabled | quote }}
            - name: SECRET_BACKEND_DEFAULT
              value: {{ .Values.backends.default | quote }}
            {{- if has "gcpsm" .Values.backends.enabled }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcpSecretManager.projectId | quote }}
            - name: GCP_SM_LOCATIONS
              value: {{ join "," .Values.gcpSecretManager.locations | quote }}
            {{- end }}
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.address | quote }}
            - name: OPENBAO_MOUNT
              value: {{ .Values.openbao.mount | quote }}
            - name: OPENBAO_K8S_ROLE
              value: {{ .Values.openbao.kubernetesRole | quote }}
            - name: OPENBAO_K8S_MOUNT
              value: {{ .Values.openbao.kubernetesMount | quote }}
            - name: WORKLOAD_SECRET_BROKER_ENABLED
              value: {{ .Values.workloadSecretBroker.enabled | quote }}
            - name: WORKLOAD_SECRET_AUDIENCE
              value: {{ .Values.workloadSecretBroker.audience | quote }}
            - name: WORKLOAD_SECRET_ALLOWED_SUBJECTS
              value: {{ join "," .Values.workloadSecretBroker.allowedSubjects | quote }}
            - name: WORKLOAD_SECRET_NAMESPACE
              value: {{ .Values.workloadSecretBroker.namespace | quote }}
            - name: WORKLOAD_SECRET_APP
              value: {{ .Values.workloadSecretBroker.app | quote }}
            - name: GITHUB_OWNER
              value: {{ .Values.gitops.owner | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.gitops.repo | quote }}
            - name: GITHUB_BRANCH
              value: {{ .Values.gitops.branch | quote }}
            - name: GITHUB_VALUES_PATH
              value: {{ .Values.gitops.valuesPath | quote }}
          envFrom:
            - secretRef:
                name: secret-service-api
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
