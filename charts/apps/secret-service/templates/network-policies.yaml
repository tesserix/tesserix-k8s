{{- if .Values.networkPolicy.enabled }}
# Default deny for the namespace — every allow below is additive.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# The console (namespace `tesserix`) calls the API directly now that the
# VirtualService is gone — see authorization-policy.yaml for why that policy
# admits it by namespace rather than principal. `allow-hbone-15008` below does
# NOT cover this traffic: that rule is for HBONE-tunnelled east-west traffic
# between ambient-mesh workloads, and the console sends plain TCP because
# `tesserix` isn't in the mesh. Don't fold this into that rule or "simplify"
# it away — they gate genuinely different paths.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-console
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesserix
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
# The UI talks to the API through the gateway, but ztunnel still routes some
# health traffic in-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-devai-broker
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: devai-api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
---
# Ambient HBONE. Without 15008 open both ways every east-west connection
# through ztunnel fails with no log on either side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone-15008
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.podCIDR }}
      ports:
        - protocol: TCP
          port: 15008
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.podCIDR }}
      ports:
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-openbao-google-dns
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # NodeLocal DNSCache answers from the node, so the kube-dns service IP
    # needs its own allow alongside the namespaceSelector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: {{ .Values.networkPolicy.dnsServiceIP }}/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # Google token exchange and JWKS, and the GKE control plane for discovery —
    # both are 443 outside the cluster network. The metadata server is excluded:
    # nothing here needs it, and it hands out node-scoped credentials.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - {{ .Values.networkPolicy.podCIDR }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.apiServerServiceIP }}/32
      ports:
        - protocol: TCP
          port: 443
{{- if has "gcpsm" .Values.backends.enabled }}
---
# Workload Identity tokens come from the GKE metadata server, which the blanket
# 443 egress rule above deliberately excludes. Only the API pod gets it, and
# under Workload Identity it hands out this ServiceAccount's GSA token rather
# than the node's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-gke-metadata
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "secret-service.selectorLabels" (dict "component" "secret-service-api" "release" .Release.Name) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # The whole link-local range and no port restriction, as in the openbao and
    # homechef policies: with only .254 on 80/988 the token fetch hangs until
    # the client deadline and every Secret Manager call fails.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.metadataServerIP }}/32
        - ipBlock:
            cidr: {{ .Values.networkPolicy.linkLocalCIDR }}
{{- end }}
{{- end }}
