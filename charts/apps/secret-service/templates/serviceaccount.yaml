{{/* The OpenBao Kubernetes auth role binds this exact name in this exact
     namespace, so renaming it silently revokes the API's vault access. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-service-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "secret-service.labels" . | nindent 4 }}
  {{- if has "gcpsm" .Values.backends.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcpSecretManager.serviceAccount }}
  {{- end }}
automountServiceAccountToken: true
