podAnnotations:
  homechef.fe3dr.com/redeploy-at: "2026-04-19T16:00:00Z"

# Production overrides for homechef-web
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# Production environment
env:
  NODE_ENV: "production"

# KEDA drives autoscaling (request-rate + memory). HPA stays off: the platform
# runs memory-only resources with no CPU requests, so a CPU-target HPA cannot work.
autoscaling:
  enabled: false
# Production GCP configuration
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 10

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# Canonical Service name for the Deployment. Kept as <svc>-direct: the bare
# name was owned by the legacy route Service and is not reclaimed.
service:
  nameOverride: "homechef-web-direct"

# The legacy Service never rendered a securityContext, so these nginx SPAs have
# always run as root in prod. The Deployment template does render one, and
# runAsUser 1001 makes nginx fail at startup:
#   nginx: [emerg] mkdir() "/var/cache/nginx/client_temp" failed (13: Permission denied)
# Cleared here to preserve the exact runtime the ksvc had. Running these
# non-root needs writable /var/cache/nginx, /var/run and /etc/nginx/conf.d
# (emptyDir mounts or an nginx-unprivileged base image) — tracked separately so
# the migration stays behaviour-preserving.
# (null, not {} — Helm deep-merges maps, so {} would not clear the base values.)
podSecurityContext: null
securityContext: null

# No Kong in this cluster — `kubectl get ingressclass` returns nothing, so these
# Ingress objects have sat with an empty status.loadBalancer since creation.
# ArgoCD blocks on their health, which stalled the sync that prunes the legacy
# Services. HomeChef serves through the Istio Gateway + VirtualServices in
# manifests/homechef-istio, not through an Ingress controller.
ingress:
  enabled: false
