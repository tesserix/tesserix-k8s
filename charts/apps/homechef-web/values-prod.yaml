# Production overrides for homechef-web
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Knative Serving - always-on for SPA stability
knative:
  enabled: true
  minScale: 1
  maxScale: 10
  scaleDownDelay: "60s"

replicaCount: 2

# Production resource allocation
resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

# Production environment
env:
  NODE_ENV: "production"

# Disable HPA and KEDA — Knative handles autoscaling
autoscaling:
  enabled: false
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
