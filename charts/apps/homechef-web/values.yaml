# Default values for homechef-web
replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/home-chef-app/homechef-web
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  # Rollout nonce — see homechef-api values for the 2026-08-02 re-tag race.
  homechef.fe3dr.dev/image-nonce: "e1818a0-rebuild-1"
  # Exclude ports from Istio sidecar for proper connectivity
  # Exclude GCP metadata server from Istio for Workload Identity
  # Istio sidecar configuration
  proxy.istio.io/holdApplicationUntilProxyStarts: "true"
  # Prometheus metrics
  prometheus.io/scrape: "true"
  prometheus.io/port: "80"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

service:
  # Legacy override from the Deployment migration; cleared once the old
  # route Service is gone.
  nameOverride: ""
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: dev-homechef.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: homechef-web-tls
      hosts:
        - dev-homechef.tesserix.app

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

keda:
  enabled: true
  # Workload Identity is always enabled
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
  # Memory only. The prometheus request-rate trigger was removed (#906): the
  # monitoring namespace is scaled to zero, so prometheus-server has no
  # endpoints, the HPA could not compute the external metric, and the resulting
  # Degraded ScaledObject failed Kargo's health gate — silently blocking every
  # production promotion while CI stayed green. Restore the prometheus trigger
  # here if monitoring comes back.
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - homechef-web
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  VITE_API_URL: "https://dev-homechef.tesserix.app/api/v1"
  VITE_WS_URL: "wss://dev-homechef.tesserix.app/ws"
  VITE_APP_NAME: "HomeChef"
  VITE_APP_ENV: "development"

  # Otto support-chat — shared Otto in support-platform. nginx.conf in
  # the homechef-web image runs envsubst on this so /api/otto/* proxies
  # to the cross-namespace service.
  OTTO_URL: "http://support-platform-otto.support-platform.svc.cluster.local:8089"

# Secret-backed env vars. Kept separate from the plain env map so values
# stay free of secret material. The K8s Secret itself is materialised by
# ExternalSecrets outside this chart (see external-secrets/prod/homechef/).
envFromSecrets:
  - name: OTTO_INTERNAL_AUTH
    secret: homechef-otto
    key: INTERNAL_AUTH_SECRET
    optional: true

# ConfigMap for additional configuration
configMap:
  # Workload Identity is always enabled
  data: {}

# Secret references

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "homechef"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod
