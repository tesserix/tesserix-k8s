# Local / kind overlay for devai-dashboard (Next.js). Use with:
#   helm upgrade --install devai-dashboard charts/apps/devai-dashboard \
#     -n devai -f charts/apps/devai-dashboard/values-local.yaml
#
# Pure frontend — no DB or secrets. Only flips image / WI / API URL. The chart
# already mounts emptyDir at /tmp and /app/.next/cache for readOnlyRootFilesystem,
# so no extra volumes are needed here.

# Image: built + pushed to the in-cluster registry by `sandboxctl deploy`
# (the devai repo's sandboxctl.yaml builds `devai-dashboard`). pullPolicy:
# Always because :latest is a moving target across rebuilds.
image:
  repository: localhost:5050/devai-dashboard
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

# This is the ONLY ALM component that gets a public sandbox.app URL.
# The browser only ever talks to THIS origin — the Next.js server proxies
# /api/* server-side to the internal devai-api Service (see next.config.ts,
# which reads DEVAI_API_INTERNAL_URL). So devai-api stays internal: the
# browser never hits it directly.
#
# Per-chart `sandboxctl deploy` lands devai-api in namespace `devai-api`, so
# the dashboard (namespace `devai-dashboard`) reaches it cross-namespace via
# the fully-qualified in-cluster service DNS name.
env:
  NODE_ENV: "production"
  HOSTNAME: "0.0.0.0"
  DEVAI_API_INTERNAL_URL: "http://devai-api.devai-api.svc.cluster.local:8080"

# No GCP Workload Identity in kind.
gcp:
  projectId: ""
  workloadIdentity:
    enabled: false
    gcpServiceAccount: ""

# Public URL after `sandboxctl deploy --chart .../devai-dashboard
#   --name devai-dashboard`:  https://devai-dashboard.sandbox.app:8443
# Or port-forward: kubectl port-forward svc/devai-dashboard 3100:3100 -n devai-dashboard
