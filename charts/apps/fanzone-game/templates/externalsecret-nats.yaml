{{- if .Values.nats.auth.enabled }}
# NATS FANZONE-account credentials (.creds file) for operator/JWT auth
# (Home-Chef-App#758-fanzone). Inert until nats.auth.enabled=true AND
# {secretPrefix}-nats-creds-fanzone exists in GCP Secret Manager. Synced into
# a dedicated secret and projected as a file at /etc/nats-creds/nats.creds.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fanzone-game.fullname" . }}-nats-creds
  labels:
    {{- include "fanzone-game.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ (.Values.externalSecrets).secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "fanzone-game.fullname" . }}-nats-creds
    creationPolicy: Owner
  data:
    - secretKey: NATS_CREDS_FILE
      remoteRef:
        key: {{ printf "%s-nats-creds-fanzone" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
