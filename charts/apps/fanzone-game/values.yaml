# =============================================================================
# FanZone Game - Super Trump Card Game Service
# Multiplayer cricket trump card game with Redis state, NATS notifications,
# PostgreSQL persistence, and cricdata API integration
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-game
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  # Exclude GCP metadata server from Istio for Workload Identity
  # Istio sidecar configuration
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8088

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3


autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []

affinity: {}

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    # Memory-only: this platform sets no cpu requests, and KEDA's webhook
    # rejects a cpu trigger when the target container has none.
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

# Graceful shutdown
terminationGracePeriodSeconds: 30

# Environment configuration
env:
  GO_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

  # Server config
  PORT: "8088"

  # NATS JetStream
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  NATS_STREAM_NAME: "FANZONE_GAME"

  # Redis config
  REDIS_HOST: "global-valkey-cache.global.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "3"

  # Game settings
  TURN_TIMEOUT_SECONDS: "30"
  MAX_PLAYERS_PER_ROOM: "5"
  MIN_PLAYERS_TO_START: "2"
  DECK_SIZE: "52"
  MATCHMAKER_INTERVAL: "5s"

  # Timeouts
  READ_TIMEOUT: "15s"
  WRITE_TIMEOUT: "15s"
  SHUTDOWN_TIMEOUT: "30s"

# Redis password from secret
redis:
  passwordSecretName: "redis-fanzone-password"
  passwordSecretKey: "password"

# PostgreSQL configuration
database:
  host: "fanzone-postgres-rw.fanzone.svc.cluster.local"
  port: "5432"
  user: "fanzone"
  name: "fanzone"
  sslmode: "require"
  passwordSecretName: "fanzone-postgres-app-credentials"
  passwordSecretKey: "password"

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
