# =============================================================================
# FanZone Game - Super Trump Card Game Service
# Multiplayer cricket trump card game with Redis state, NATS notifications,
# PostgreSQL persistence, and cricdata API integration
# =============================================================================

replicaCount: 1

image:
  repository: ghcr.io/tesserix/fanzone-battle-ground/fanzone-game
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  # Exclude ports from Istio sidecar for proper connectivity
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432,6379"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  # Istio sidecar configuration
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8088

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []

affinity: {}

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"

# Graceful shutdown
terminationGracePeriodSeconds: 30

# Environment configuration
env:
  GO_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

  # Server config
  PORT: "8088"

  # NATS JetStream
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  NATS_STREAM_NAME: "FANZONE_GAME"

  # Redis config
  REDIS_HOST: "redis.redis-fanzone.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "3"

  # Game settings
  TURN_TIMEOUT_SECONDS: "30"
  MAX_PLAYERS_PER_ROOM: "5"
  MIN_PLAYERS_TO_START: "2"
  DECK_SIZE: "52"
  MATCHMAKER_INTERVAL: "5s"

  # Timeouts
  READ_TIMEOUT: "15s"
  WRITE_TIMEOUT: "15s"
  SHUTDOWN_TIMEOUT: "30s"

# Redis password from secret
redis:
  passwordSecretName: "redis-fanzone-password"
  passwordSecretKey: "password"

# PostgreSQL configuration
database:
  host: "postgresql.postgresql-fanzone.svc.cluster.local"
  port: "5432"
  user: "postgres"
  name: "fanzone"
  sslmode: "require"
  passwordSecretName: "postgresql-fanzone-password"
  passwordSecretKey: "password"

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"
