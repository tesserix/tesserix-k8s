# Production overrides for fanzone-game
# Knative Serving — scale-to-zero enabled (request-driven game engine)

image:
  pullPolicy: IfNotPresent

knative:
  enabled: true
  minScale: 0
  maxScale: 10
  scaleDownDelay: "60s"

# Disable KEDA — Knative handles autoscaling
keda:
  enabled: false

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
