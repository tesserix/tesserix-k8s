replicaCount: 1

image:
  repository: ghcr.io/tesserix/fanzone-battle-ground/fanzone-moderation
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8087

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

env:

# Knative Serving configuration
knative:
  enabled: false
  minScale: 0
  maxScale: 3
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"
