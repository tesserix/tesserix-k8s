# UAT overlay for mark8ly-auth-bff.
namespace: mark8ly-uat
name: mark8ly-uat-auth-bff

keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 1
  # Scale-to-zero in UAT via istio request-rate. Cold start: first request
  # returns 503, prometheus picks it up within pollingInterval (30s), KEDA
  # scales the deployment 0->1. Subsequent requests succeed once pod ready.
  prometheus:
    enabled: true
    serverAddress: "http://prometheus-server.monitoring.svc.cluster.local:80"
    threshold: "0.01"
    query: 'sum(rate(istio_requests_total{destination_service_name="mark8ly-uat-auth-bff",reporter="source"}[2m]))'
pdb:
  enabled: false
resources:
  requests:
    memory: 96Mi

# Postgres → mark8ly-uat CNPG primary.
database:
  host: mark8ly-uat-postgres-rw.mark8ly-uat.svc.cluster.local
  port: 5432
  name: mark8ly_platform_api
  secretName: mark8ly-uat-postgres-platform-api
  sslmode: require

openfga:
  apiUrl: "http://mark8ly-uat-openfga:8080"
  storeId: ""

# Mirrors the build-time NEXT_PUBLIC_GIP_*_TENANT_ID values baked
# into the admin / onboarding / storefront client bundles by CI.
# Until those tenants get lifted out of the bundle (Phase 7
# GIP-isolation refactor — see runbook), UAT runtime must keep
# pointing at the same prod tenants the bundle uses or the
# server-side id_token verify rejects the tokens minted against
# the prod tenants.
gip:
  projectId: "tesseracthub-480811"
  projectNumber: "849928263410"
  internalTenantId: "MP-Internal-e986p"
  customerTenantId: "MP-Customer-39opy"
  platformTenantId: "Platform-9bu14"

# Same OAuth client. Phase 4 will add a UAT-specific OAuth client
# with `admin-uat.mark8ly.com`, `uat.mark8ly.com` redirect URIs.
oauth:
  clientId: "849928263410-eq63i2v34j61mbaghf0opu9fubmrkqua.apps.googleusercontent.com"

# Cookie domain `.mark8ly.com` already covers `*-uat.mark8ly.com` and
# `uat.mark8ly.com` since both are under the same parent.
session:
  cookieName: "m8_session"
  cookieDomain: ".mark8ly.com"

marketplaceApiUrl: "http://mark8ly-uat-marketplace-api-admin.mark8ly-uat.svc.cluster.local:8080"
marketplaceInternalAuthSecret:
  secretName: mark8ly-uat-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

# Override secret names to the UAT-side ExternalSecret targets.
secrets:
  gip: mark8ly-uat-gip
  oauth: mark8ly-uat-oauth
  session: mark8ly-uat-session
  auditIngest: mark8ly-uat-audit-ingest
