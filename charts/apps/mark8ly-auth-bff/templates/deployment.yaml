apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: auth
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: migrate
          image: "{{ .Values.image.migrateTarget }}:{{ .Values.image.tag }}"
          command: ["/migrate", "up"]
          env:
{{ include "mark8ly-auth-bff.dbEnv" . | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENV
              value: "prod"
            # Code default is 8080 — HTTP_PORT override keeps the chart
            # convention of one port per service (see mark8ly docs port map).
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
{{ include "mark8ly-auth-bff.dbEnv" . | indent 12 }}
            - name: GIP_PROJECT_ID
              value: {{ .Values.gip.projectId | quote }}
            - name: GIP_PROJECT_NUMBER
              value: {{ .Values.gip.projectNumber | quote }}
            - name: GIP_INTERNAL_TENANT_ID
              value: {{ .Values.gip.internalTenantId | quote }}
            - name: GIP_CUSTOMER_TENANT_ID
              value: {{ .Values.gip.customerTenantId | quote }}
            - name: GIP_PLATFORM_TENANT_ID
              value: {{ .Values.gip.platformTenantId | quote }}
            - name: GIP_WEB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gip }}
                  key: GIP_WEB_API_KEY
            - name: OAUTH_CLIENT_ID
              value: {{ .Values.oauth.clientId | quote }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oauth }}
                  key: OAUTH_CLIENT_SECRET
            - name: SESSION_COOKIE_NAME
              value: {{ .Values.session.cookieName | quote }}
            - name: SESSION_COOKIE_DOMAIN
              value: {{ .Values.session.cookieDomain | quote }}
            - name: SESSION_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.session }}
                  key: SESSION_ENCRYPT_KEY
            - name: FGA_API_URL
              value: {{ .Values.openfga.apiUrl | quote }}
            - name: FGA_STORE_ID
              value: {{ .Values.openfga.storeId | quote }}
            # OpenTelemetry OTLP/gRPC collector endpoint. Empty disables
            # traces + metrics (observability.Init no-ops).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            # Cross-service audit emit. URL points at marketplace-api's
            # admin service; secret is optional (permissive when
            # empty — ExternalSecret may not be provisioned yet).
            - name: MARKETPLACE_API_URL
              value: {{ .Values.marketplaceApiUrl | quote }}
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplaceInternalAuthSecret.secretName }}
                  key: {{ .Values.marketplaceInternalAuthSecret.secretKey }}
            - name: AUDIT_INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.auditIngest }}
                  key: AUDIT_INGEST_SECRET
                  optional: true
            # Sign-in code + new-device alert delivery via platform-api.
            - name: PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            - name: PLATFORM_API_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformApiInternalAuthSecret.secretName }}
                  key: {{ .Values.platformApiInternalAuthSecret.secretKey }}
            - name: NOTIFICATION_SUPPORT_EMAIL
              value: {{ .Values.notification.supportEmail | quote }}
            - name: NOTIFICATION_SECURITY_URL
              value: {{ .Values.notification.securityUrl | quote }}
            - name: EMAIL_OTP_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emailOtp.secretName }}
                  key: {{ .Values.emailOtp.secretKey }}
                  optional: true
            # Zitadel identity. ZITADEL_ENABLED mounts the Zitadel login
            # routes AND makes config.ValidateZitadel mandatory — every
            # value in this block must be present or the pod refuses to
            # boot by design.
            - name: ZITADEL_ENABLED
              value: {{ .Values.zitadel.enabled | quote }}
            - name: ZITADEL_ORG_ID
              value: {{ .Values.zitadel.orgId | quote }}
            - name: ZITADEL_GOOGLE_IDP_ID
              value: {{ .Values.zitadel.googleIdpId | quote }}
            - name: ZITADEL_APPLE_IDP_ID
              value: {{ .Values.zitadel.appleIdpId | quote }}
            # Kept separate on purpose: a merchant-provisioned storefront
            # origin must never be a valid successUrl for an ADMIN sign-in.
            - name: ZITADEL_RETURN_URL_ALLOWED_HOSTS_ADMIN
              value: {{ .Values.zitadel.returnUrlAllowedHostsAdmin | quote }}
            - name: ZITADEL_RETURN_URL_ALLOWED_SUFFIXES_STOREFRONT
              value: {{ .Values.zitadel.returnUrlAllowedSuffixesStorefront | quote }}
            - name: ZITADEL_ISSUER
              value: {{ .Values.zitadel.issuer | quote }}
            - name: ZITADEL_ADMIN_PROJECT_ID
              value: {{ .Values.zitadel.adminProjectId | quote }}
            - name: ZITADEL_STOREFRONT_PROJECT_ID
              value: {{ .Values.zitadel.storefrontProjectId | quote }}
            # Mobile token issuance (mark8ly#686). The mobile login routes
            # exchange the completed login's authorization code for OAuth
            # tokens, because marketplace-api verifies a bearer JWT and a
            # native client can use neither a session cookie nor a callback
            # URL. That exchange authenticates as the mark8ly-admin
            # confidential client, so it needs this id/secret pair.
            #
            # These two were removed in #1007 as "env vars no code reads",
            # which was true at that moment: mark8ly#709 established that
            # nothing consumed them. mark8ly#740 makes auth-bff the first
            # reader, so they come back — please do not drop them again
            # without checking `ZitadelAdminClientID` in auth-bff's config.
            - name: ZITADEL_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zitadel.secretName }}
                  key: ZITADEL_ADMIN_CLIENT_ID
                  optional: true
            - name: ZITADEL_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zitadel.secretName }}
                  key: ZITADEL_ADMIN_CLIENT_SECRET
                  optional: true
            # MUST byte-match the redirect the auth request is created with
            # or Zitadel refuses the exchange with a bare invalid_grant that
            # names nothing. It is the admin WEB client's registered
            # redirect: no browser is involved on the mobile path, so this
            # is never navigated to — it only has to agree on both calls.
            - name: ZITADEL_ADMIN_REDIRECT_URI
              value: {{ .Values.zitadel.adminRedirectUri | quote }}
            - name: ZITADEL_LOGIN_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zitadel.secretName }}
                  key: ZITADEL_LOGIN_CLIENT_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
