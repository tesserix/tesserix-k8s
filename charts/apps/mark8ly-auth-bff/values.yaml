namespace: mark8ly
name: mark8ly-auth-bff
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-auth-bff
  tag: "sha-493c3652c68d" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
  migrateTarget: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-auth-bff
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8087
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  # Floor of 2, not 1: a single pod means any restart, node drain or
  # rollout is a total auth outage, and a cold start in front of an OTP
  # submission is a failed login rather than a slow one. Everything above
  # 2 is decided by the triggers below, not pinned here.
  minReplicaCount: 2
  maxReplicaCount: 40
  # Scale-down is deliberately slower than scale-up (cooldownPeriod
  # above) so a burst of logins does not thrash replicas.
  #
  # Prometheus is intentionally OFF. There is no Prometheus running in
  # this cluster — the prometheus-server Service in the monitoring
  # namespace has no endpoints — so a prometheus trigger resolves to
  # TriggerError and the HPA stops computing replicas altogether. That
  # is the live failure on mark8ly-marketplace-api-admin. Turn this on
  # only once monitoring is actually deployed.
  prometheus:
    enabled: false
  # CPU is the real load signal for this service: token verification,
  # HMAC and TLS all burn CPU in proportion to logins, while memory sits
  # flat near 11% and never crosses an 80% memory target. 60% leaves
  # burst headroom on a latency-sensitive path.
  cpu:
    enabled: true
    threshold: "60"
  # Kept as a secondary trigger so a memory leak still forces scale-out.
  memory:
    enabled: true
    threshold: "80"
resources:
  requests:
    # Required by the KEDA cpu trigger — the vscaledobject admission
    # webhook rejects a cpu trigger when this is absent.
    cpu: 200m
    memory: 256Mi
  limits:
    # Memory only. No CPU limit, deliberately: CFS throttling on an auth
    # hot path adds tail latency, and the HPA already caps total draw.
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
# Shares the platform_api database — auth-bff is read-only against the
# tenancy tables and writes to its own session/outbox schema.
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_platform_api
  secretName: mark8ly-postgres-platform-api
  sslmode: require
openfga:
  apiUrl: "http://mark8ly-openfga:8080"
  # Empty → service runs DiscoverStoreID() at startup and resolves by name
  # (FGAStoreName = "mark8ly-platform"). Robust to OpenFGA store recreations.
  storeId: ""
gip:
  projectId: "tesseracthub-480811"
  projectNumber: "849928263410"
  internalTenantId: "MP-Internal-e986p"
  customerTenantId: "MP-Customer-39opy"
  # Platform-2c9z0 was a zombie dupe deleted in the 2026-04-29 wipe.
  # Platform-9bu14 is the live platform-admin tenant.
  platformTenantId: "Platform-9bu14"
oauth:
  clientId: "849928263410-eq63i2v34j61mbaghf0opu9fubmrkqua.apps.googleusercontent.com"
session:
  cookieName: "m8_session"
  cookieDomain: ".mark8ly.com"
# OpenTelemetry — OTLP/gRPC export to the in-cluster collector. Set the
# endpoint to "" to disable traces + metrics for this service.
otel:
  endpoint: "http://otel-gateway.observability.svc.cluster.local:4317"
marketplaceApiUrl: "http://mark8ly-marketplace-api-admin.mark8ly.svc.cluster.local:8080"
marketplaceInternalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET

# platform-api's /internal/notifications/send — carries the sign-in code
# and the new-device alert. Empty URL disables both.
platformApiUrl: "http://mark8ly-platform-api.mark8ly.svc.cluster.local:8086"
platformApiInternalAuthSecret:
  secretName: mark8ly-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
notification:
  supportEmail: "help@mark8ly.com"
  securityUrl: "https://admin.mark8ly.com/settings/security"
# Pepper for the email-OTP challenge on unrecognised devices. Mounted
# optional so a missing Secret degrades to "alert but don't challenge"
# rather than taking the whole auth path down.
emailOtp:
  secretName: mark8ly-email-otp
  secretKey: EMAIL_OTP_PEPPER

# Secret resource names — overridden in values-uat.yaml so the UAT
# overlay can swap to `mark8ly-uat-*` Secrets without retemplating.
secrets:
  gip: mark8ly-gip
  oauth: mark8ly-oauth
  session: mark8ly-session
  auditIngest: mark8ly-audit-ingest

# Replace before surging, so a rollout frees a pod's memory before it
# needs the replacement's (#709).
#
# The default is 25%/25%, which on a single-replica Deployment rounds to
# maxSurge=1, maxUnavailable=0: the new pod must SCHEDULE BEFORE the old
# one dies, so a roll needs double the pod's memory at once. On a cluster
# whose memory requests sit near 100% (while actual usage is around half
# that) the new pod pends forever and the rollout deadlocks — with the
# Deployment still reporting Available=True, because the old pod keeps
# serving. On 2026-08-30 that left seven mark8ly deployments stuck and
# production a day behind main, with nothing alerting.
#
# The cost is honest and accepted: on a single-replica service this is a
# brief 503 during each rollout, where surge-first gave none. Deploys that
# always complete are worth more than a few seconds of downtime on an
# operator-timed rollout. Same remedy as temporal (#538) and devai (#600).
#
# At 2+ replicas there is no downtime at all: one pod stays up while the
# other is replaced.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
