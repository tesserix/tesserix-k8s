namespace: mark8ly
name: mark8ly-auth-bff
image:
  repository: ghcr.io/tesserix/mark8ly-auth-bff
  tag: "sha-c2347abf7f85" # overridden per-release by CI bump job
  pullPolicy: IfNotPresent
  migrateTarget: ghcr.io/tesserix/mark8ly-auth-bff
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8087
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 10
