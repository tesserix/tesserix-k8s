{{/*
VirtualServices for the mark8ly-uat environment.

Three host bindings — admin, storefront, onboarding — mirroring the
prod routing pattern but pointed at mark8ly-uat-* services. Each VS
attaches to the existing tesseract-gateway in istio-ingress (which
already terminates TLS for *.mark8ly.com via the wildcard cert).

UAT does NOT do per-tenant subdomain routing today — Istio Gateway
hosts can only do prefix-wildcards (`*.mark8ly.com`) so per-tenant
slugs would need either a new wildcard cert pattern or path-based
routing on the apex. Defer until UAT actually has multi-tenant test
data; the single-tenant routing here unblocks smoke + acceptance.
*/}}
---
# admin-uat.mark8ly.com -> mark8ly-uat-admin (Next.js) with /bff/* and
# /api/* path-based routing into auth-bff and marketplace-api-admin,
# matching how prod admin.mark8ly.com is wired.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mark8ly-uat-admin-vs
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    environment: uat
spec:
  hosts:
    - "{{ .Values.hosts.admin }}.{{ .Values.domain }}"
  gateways:
    - {{ .Values.gateway.ref }}
  http:
    - name: bff-routes
      match:
        - uri:
            prefix: /bff/
      route:
        - destination:
            host: {{ .Values.services.authBff.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.authBff.port }}
      timeout: {{ .Values.timeout.api }}
    - name: api-routes
      match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: {{ .Values.services.marketplaceApiAdmin.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.marketplaceApiAdmin.port }}
      timeout: {{ .Values.timeout.api }}
    - name: platform-routes
      match:
        - uri:
            prefix: /platform-api/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ .Values.services.platformApi.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.platformApi.port }}
      timeout: {{ .Values.timeout.api }}
    - name: default
      route:
        - destination:
            host: {{ .Values.services.admin.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.admin.port }}
      timeout: {{ .Values.timeout.default }}
---
# uat.mark8ly.com -> mark8ly-uat-storefront (Next.js) with API/storefront
# and Otto WebSocket path-based routing.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mark8ly-uat-storefront-vs
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    environment: uat
spec:
  hosts:
    - "{{ .Values.hosts.storefront }}.{{ .Values.domain }}"
  gateways:
    - {{ .Values.gateway.ref }}
  http:
    - name: storefront-api
      match:
        - uri:
            prefix: /api/v1/storefront/
      route:
        - destination:
            host: {{ .Values.services.marketplaceApiStorefront.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.marketplaceApiStorefront.port }}
      timeout: {{ .Values.timeout.api }}
    - name: otto-ws
      match:
        - uri:
            prefix: /api/v1/otto/
      route:
        - destination:
            host: {{ .Values.services.otto.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.otto.port }}
      timeout: {{ .Values.timeout.websocket }}
    - name: bff-routes
      match:
        - uri:
            prefix: /bff/
      route:
        - destination:
            host: {{ .Values.services.authBff.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.authBff.port }}
      timeout: {{ .Values.timeout.api }}
    - name: default
      route:
        - destination:
            host: {{ .Values.services.storefront.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.storefront.port }}
      timeout: {{ .Values.timeout.default }}
---
# onboarding-uat.mark8ly.com -> mark8ly-uat-onboarding (Next.js).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mark8ly-uat-onboarding-vs
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    environment: uat
spec:
  hosts:
    - "{{ .Values.hosts.onboarding }}.{{ .Values.domain }}"
  gateways:
    - {{ .Values.gateway.ref }}
  http:
    - name: bff-routes
      match:
        - uri:
            prefix: /bff/
      route:
        - destination:
            host: {{ .Values.services.authBff.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.authBff.port }}
      timeout: {{ .Values.timeout.api }}
    - name: platform-routes
      match:
        - uri:
            prefix: /api/v1/platform/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ .Values.services.platformApi.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.platformApi.port }}
      timeout: {{ .Values.timeout.api }}
    - name: default
      route:
        - destination:
            host: {{ .Values.services.onboarding.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.onboarding.port }}
      timeout: {{ .Values.timeout.default }}
---
# uat-landing.mark8ly.com -> mark8ly-uat-onboarding (landing page).
# Mirrors prod where mark8ly.com (bare apex) serves the onboarding
# Next.js app's marketing/landing route. UAT can't claim the apex from
# a different namespace, so it gets its own subdomain instead.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mark8ly-uat-landing-vs
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    environment: uat
spec:
  hosts:
    - "{{ .Values.hosts.landing }}.{{ .Values.domain }}"
  gateways:
    - {{ .Values.gateway.ref }}
  http:
    - name: bff-routes
      match:
        - uri:
            prefix: /bff/
      route:
        - destination:
            host: {{ .Values.services.authBff.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.authBff.port }}
      timeout: {{ .Values.timeout.api }}
    - name: platform-routes
      match:
        - uri:
            prefix: /api/v1/platform/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ .Values.services.platformApi.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.platformApi.port }}
      timeout: {{ .Values.timeout.api }}
    - name: default
      route:
        - destination:
            host: {{ .Values.services.onboarding.name }}.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.services.onboarding.port }}
      timeout: {{ .Values.timeout.default }}
