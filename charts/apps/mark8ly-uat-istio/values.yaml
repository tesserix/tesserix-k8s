namespace: mark8ly-uat
domain: mark8ly.com

# UAT subdomain plan (single-level only, all under *.mark8ly.com cert):
#   admin-uat.mark8ly.com         -> mark8ly-uat-admin
#   uat.mark8ly.com               -> mark8ly-uat-storefront (apex equivalent)
#   onboarding-uat.mark8ly.com    -> mark8ly-uat-onboarding
hosts:
  admin: admin-uat
  storefront: uat
  onboarding: onboarding-uat

# Service ports — match the chart values.yaml port settings on the
# corresponding mark8ly-* charts so this stays a single source of
# truth for UAT routing.
services:
  admin:
    name: mark8ly-uat-admin
    port: 4202
  authBff:
    name: mark8ly-uat-auth-bff
    port: 8087
  marketplaceApiAdmin:
    name: mark8ly-uat-marketplace-api-admin
    port: 8080
  marketplaceApiStorefront:
    name: mark8ly-uat-marketplace-api-storefront
    port: 8080
  onboarding:
    name: mark8ly-uat-onboarding
    port: 4201
  otto:
    name: mark8ly-uat-otto
    port: 8089
  platformApi:
    name: mark8ly-uat-platform-api
    port: 8086
  storefront:
    name: mark8ly-uat-storefront
    port: 4203

gateway:
  # Existing shared Gateway in istio-ingress that already exposes
  # *.mark8ly.com via the storefront-wildcard server.
  ref: "istio-ingress/tesseract-gateway"

timeout:
  default: 30s
  api: 60s
  websocket: 3600s
