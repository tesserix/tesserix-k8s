apiVersion: v2
name: mark8ly-uat-istio
description: |
  Istio routing + AuthorizationPolicies specific to the mark8ly-uat
  environment. Coexists with charts/thirdparty/istio-config (which keeps
  doing prod) so that UAT changes can't accidentally break prod traffic.

  The existing tesseract-gateway in istio-ingress already exposes
  `*.mark8ly.com` via its `https-storefront-wildcard` server, which is
  backed by the `*.mark8ly.com` wildcard cert — so no new Gateway
  server / certificate is required for UAT hostnames. This chart just
  adds VirtualServices that bind UAT hosts to the mark8ly-uat-* services
  and the AuthorizationPolicy that allows istio-ingress + intra-namespace
  traffic into the mark8ly-uat namespace.
type: application
version: 0.1.0
appVersion: "1.0.0"
