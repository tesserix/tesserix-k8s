replicaCount: 1

image:
  repository: ghcr.io/tesserix/fanzone-battle-ground/fanzone-micro-prediction
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  sidecar.istio.io/inject: "true"
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432,6379,443"
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8093

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

env:
  GO_ENV: "production"
  LOG_LEVEL: "warn"
  LOG_FORMAT: "json"
  NATS_STREAM_NAME: "FANZONE_MICRO"
  REDIS_HOST: "redis.redis-fanzone.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "9"

# Knative Serving configuration
knative:
  enabled: false
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

# GCP Secret Manager configuration
gcp:
  projectId: ""
  namespace: "fanzone"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Configuration
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"
