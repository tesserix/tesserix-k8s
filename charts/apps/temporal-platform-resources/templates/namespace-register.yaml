apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace-register
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/part-of: temporal-platform
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: temporal-platform
    spec:
      restartPolicy: Never
      serviceAccountName: temporal-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: {{ .Values.adminTools.image }}
          env:
            - name: HOME
              value: /home/temporal
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export TEMPORAL_ADDRESS="{{ .Values.adminTools.frontendAddress }}"

              host="${TEMPORAL_ADDRESS##*/}"
              getent hosts "${host%%:*}" || echo "no dns record for ${host%%:*}"

              until temporal --address "${TEMPORAL_ADDRESS}" operator cluster health; do
                echo "waiting for ${TEMPORAL_ADDRESS}"
                sleep 5
              done

              for entry in {{ range .Values.temporalNamespaces }}{{ .name }}:{{ .retention }} {{ end }}; do
                name="${entry%%:*}"
                retention="${entry##*:}"
                if temporal --address "${TEMPORAL_ADDRESS}" \
                  operator namespace describe --namespace "${name}" >/dev/null 2>&1; then
                  echo "${name} already exists"
                  continue
                fi
                temporal --address "${TEMPORAL_ADDRESS}" \
                  operator namespace create \
                  --namespace "${name}" \
                  --retention "${retention}"
                echo "${name} registered with retention ${retention}"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/temporal
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: home
          emptyDir: {}
