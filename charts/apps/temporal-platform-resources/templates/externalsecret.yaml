apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.credentialsSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: temporal-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: {{ .Values.database.credentialsSecret }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: {{ .Values.database.owner | quote }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.credentialsRemoteKey }}
