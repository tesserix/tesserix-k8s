apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-platform
  namespace: {{ .Values.database.namespace }}
  labels:
    app.kubernetes.io/part-of: temporal-platform
    app.kubernetes.io/component: database
spec:
  name: {{ .Values.database.names.default }}
  owner: {{ .Values.database.owner }}
  cluster:
    name: {{ .Values.database.clusterName }}
  ensure: present
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-platform-visibility
  namespace: {{ .Values.database.namespace }}
  labels:
    app.kubernetes.io/part-of: temporal-platform
    app.kubernetes.io/component: database
spec:
  name: {{ .Values.database.names.visibility }}
  owner: {{ .Values.database.owner }}
  cluster:
    name: {{ .Values.database.clusterName }}
  ensure: present
  databaseReclaimPolicy: retain
