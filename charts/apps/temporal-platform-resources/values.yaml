namespace: temporal-system
podCIDR: 10.20.0.0/16

database:
  namespace: infra
  clusterName: infra-postgres
  owner: temporal
  credentialsSecret: temporal-db-credentials
  credentialsRemoteKey: prod-temporal-postgresql-password
  names:
    default: temporal_platform
    visibility: temporal_platform_visibility

# Temporal namespaces the platform serves. Registration is idempotent and runs
# as a PostSync hook — see templates/namespace-register.yaml.
temporalNamespaces:
  - name: devai
    retention: 7d
  - name: document-intelligence-sandbox
    retention: 7d
  - name: document-intelligence-prod
    retention: 30d
  - name: mark8ly
    retention: 7d
  - name: homechef
    retention: 7d
  - name: dwellm8
    retention: 30d
  - name: postiz
    retention: 7d
  - name: kora
    retention: 7d
  - name: agentic-registry
    retention: 7d

adminTools:
  image: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/third-party/temporal-admin-tools:1.31.2
  frontendAddress: passthrough:///temporal-frontend.temporal-system.svc.cluster.local:7233

clients:
  - namespace: devai
    serviceAccount: devai-api
  - namespace: document-intelligence
    serviceAccount: kora-dev-doc-scanner
  - namespace: document-intelligence
    serviceAccount: kora-dev-doc-worker
  - namespace: document-intelligence
    serviceAccount: kora-doc-scanner
  - namespace: document-intelligence
    serviceAccount: kora-doc-worker
  - namespace: mark8ly
  - namespace: homechef
  - namespace: dwellm8
  - namespace: postiz
  - namespace: kora
  - namespace: agentregistry-system
