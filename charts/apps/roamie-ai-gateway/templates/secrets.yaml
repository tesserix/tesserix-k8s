apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: roamie-typesafe-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-roamie-production
    kind: SecretStore
  target:
    name: roamie-typesafe-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: roamie/app/roamie-typesafe-api-key
        property: value
