# Default values for document-service
replicaCount: 1

image:
  repository: ghcr.io/tesserix/mark8ly/document-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations:
    iam.gke.io/gcp-service-account: document-service-sa@tesseracthub-480811.iam.gserviceaccount.com
  name: ""

podAnnotations:
  # Exclude ports from Istio sidecar for proper connectivity
  traffic.sidecar.istio.io/excludeOutboundPorts: "4222,5432"
  # Exclude GCP metadata server from Istio for Workload Identity
  traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
  # Istio sidecar configuration - wait for proxy before starting app
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  PORT: "8080"
  GIN_MODE: "release"

  # Database config is in database: section below

  # NATS for event publishing
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # Storage configuration - GCS for production
  STORAGE_PROVIDER: "gcp"
  GOOGLE_CLOUD_PROJECT: "tesseracthub-480811"

  # Default bucket for onboarding/shared assets (legacy)
  STORAGE_DEFAULT_BUCKET: "tesseracthub-devtest-assets"

  # ==========================================================================
  # Regional Bucket Configuration (Dynamic Selection)
  # ==========================================================================
  # document-service selects the appropriate bucket based on X-Region header
  # Bucket naming: marketplace-{environment}-assets-{region}
  # Fallback: STORAGE_DEFAULT_BUCKET if region not recognized
  # ==========================================================================
  STORAGE_BUCKET_AU: "marketplace-devtest-assets-au"
  STORAGE_BUCKET_IN: "marketplace-devtest-assets-in"

  # Enable dynamic bucket selection based on tenant region
  ENABLE_REGIONAL_BUCKETS: "true"

  # ==========================================================================
  # Public Bucket Configuration (CDN-cacheable assets)
  # ==========================================================================
  # Public bucket for marketplace assets (products, categories, banners)
  # These are directly accessible via GCS without presigned URLs
  # Bucket naming: marketplace-{environment}-public-{region}
  # ==========================================================================
  STORAGE_PUBLIC_BUCKET: "marketplace-devtest-public-au"
  STORAGE_PUBLIC_BUCKET_URL: "https://storage.googleapis.com/marketplace-devtest-public-au"

  # ==========================================================================
  # Redis Cache Configuration
  # ==========================================================================
  # Caches presigned URLs to reduce GCS signature operations
  # If Redis is unavailable, service gracefully falls back to no-op cache
  # Redis password is loaded from GCP Secret Manager via REDIS_PASSWORD_SECRET_NAME
  # ==========================================================================
  CACHE_ENABLED: "true"
  REDIS_HOST: "redis.redis-marketplace.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD_SECRET_NAME: "devtest-marketplace-redis-password"
  CACHE_PRESIGNED_URL_TTL: "3300"   # 55 minutes (URLs expire in 1 hour)
  CACHE_METADATA_TTL: "300"         # 5 minutes

  # Security - disable auth for dev environment
  ENABLE_AUTH: "false"

  # ==========================================================================
  # Multi-Product Support Configuration
  # ==========================================================================
  # document-service supports multiple products with isolated bucket access
  # Products send X-Product-ID header (defaults to "marketplace")
  # Bucket access is validated: bucket must start with {product}-
  # Redis cache keys are prefixed with product ID for isolation
  # ==========================================================================
  ENABLE_MULTI_PRODUCT: "true"
  VALID_PRODUCTS: "marketplace,bookkeeping,hms,fanzone,homechef,global"

# Persistent Volume for document storage
persistence:
  # Workload Identity is always enabled
  storageClass: ""
  size: 10Gi
  accessMode: ReadWriteOnce

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"  # InPlaceOrRecreate (no-restart), Auto, Recreate, Initial, or Off
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true  # Don't let VPA manage istio-proxy

# Database configuration (used by deployment template)
database:
  host: "postgresql.postgresql-marketplace.svc.cluster.local"
  port: "5432"
  name: "document_db"
  user: "postgres"
  sslmode: "require"

# GCP Secret Manager configuration
# When enabled, secrets are fetched from GCP Secret Manager via Workload Identity
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "marketplace"  # Override if different from release namespace
  workloadIdentity:
    # Workload Identity is always enabled
    gcpServiceAccount: ""  # e.g., app-secrets-marketplace@project.iam.gserviceaccount.com
  secretManager:
    # Workload Identity is always enabled
    secretPrefix: "devtest"  # Environment prefix: dev, staging, prod

knative:
  enabled: false
  minScale: 1
  maxScale: 5
  concurrencyTarget: 100
  containerConcurrency: 100
  timeoutSeconds: 30

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
