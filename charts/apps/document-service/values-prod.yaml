knative:
  enabled: false

# Production overrides for document-service

image:
  repository: ghcr.io/tesserix/mark8ly/document-service

# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 1

# Production resource allocation - handles file uploads
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 256Mi

# Production service account - needs GCS write access for image uploads
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

# Production environment
env:
  GIN_MODE: "release"
  # Auth disabled at service level - handled by Istio AuthorizationPolicies
  ENABLE_AUTH: "false"

  # Production bucket configuration
  GOOGLE_CLOUD_PROJECT: "tesseracthub-480811"
  STORAGE_DEFAULT_BUCKET: "tesseracthub-prod-assets"
  STORAGE_BUCKET_AU: "marketplace-prod-assets-au"
  STORAGE_BUCKET_IN: "marketplace-prod-assets-in"
  ENABLE_REGIONAL_BUCKETS: "true"

  # Production Redis configuration
  REDIS_PASSWORD_SECRET_NAME: "prod-marketplace-redis-password"

  # Production public bucket
  STORAGE_PUBLIC_BUCKET: "marketplace-prod-public-au"
  STORAGE_PUBLIC_BUCKET_URL: "https://storage.googleapis.com/marketplace-prod-public-au"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"document-service\"}[2m]))"
    requestRateThreshold: "50"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
