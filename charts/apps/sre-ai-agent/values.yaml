enabled: true

replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/ai-agents-sre
  tag: main
  digest: sha256:2cb69bdd73ee5c002ee268386efbbaeaf77670e81db5cdc81d7441c275281216
  pullPolicy: IfNotPresent

service:
  port: 8080

serviceAccount:
  name: sre-ai-agent

config:
  tenantId: tesserix
  gatewayBaseUrl: http://ai-gateway.agentgateway-system.svc.cluster.local:8080/vertex/v1
  gatewayModel: gemini-2.5-flash
  namespaces: "[]"
  maxPromptChars: "12000"
  requestTimeoutSeconds: "45"
  clusterTimeoutSeconds: "20"

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

pdb:
  minAvailable: 1

externalSecret:
  storeName: gcp-secret-store
  refreshInterval: 1h
  upstreamToken: prod-sre-ai-upstream-token
  gatewayApiKey: prod-sre-ai-gateway-api-key

gateway:
  namespace: agentgateway-system
  name: agentgateway-mcp
  host: sre-ai-agent.ai-agents.svc.cluster.local
  pathPrefix: /a2a/v1/sre-investigator

monitoring:
  alerts:
    enabled: true
    restartThreshold: 3
