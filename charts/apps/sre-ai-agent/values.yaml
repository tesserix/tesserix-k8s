# Staged off until the merged ai-agents main image is pinned by digest.
enabled: false

replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/ai-agents-sre
  tag: main
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

serviceAccount:
  name: sre-ai-agent

config:
  tenantId: tesserix
  gatewayBaseUrl: http://ai-gateway.agentgateway-system.svc.cluster.local:8080/vertex/v1
  gatewayModel: gemini-2.5-flash
  namespaces: "[]"
  maxPromptChars: "12000"
  requestTimeoutSeconds: "45"
  clusterTimeoutSeconds: "20"

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

pdb:
  minAvailable: 1

externalSecret:
  storeName: gcp-secret-store
  refreshInterval: 1h
  upstreamToken: prod-sre-ai-upstream-token
  gatewayApiKey: prod-sre-ai-gateway-api-key

gateway:
  namespace: agentgateway-system
  name: agentgateway-mcp
  host: sre-ai-agent.ai-agents.svc.cluster.local
  pathPrefix: /a2a/v1/sre-investigator
  requestTimeout: 90s
  oauth:
    issuer: https://auth.tesserix.app
    audience: "387190457387450503"
    roleClaim: "urn:zitadel:iam:org:project:387190457387450503:roles"
    role: agentgateway.runtime
    jwksHost: auth.tesserix.app
    jwksPath: /oauth/v2/keys
    jwksCacheDuration: 15m
  rateLimit:
    requestsPerMinutePerReplica: 60
    burst: 10
    backend: agentgateway-ratelimit
    port: 8081
    domain: agentgateway-public

monitoring:
  alerts:
    enabled: true
    restartThreshold: 3
