{{- if .Values.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-ai-agent
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "sre-ai-agent.selectorLabels" . | nindent 6 }}
{{- end }}
