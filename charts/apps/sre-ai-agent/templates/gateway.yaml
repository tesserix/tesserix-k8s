{{- if .Values.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: sre-ai-agent
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  a2a:
    host: {{ .Values.gateway.host | quote }}
    port: {{ .Values.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sre-ai-agent
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: runtime
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | quote }}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: sre-ai-agent
          weight: 1
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: sre-ai-agent
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: sre-ai-agent
  backend:
    auth:
      secretRef:
        name: sre-ai-agent-upstream
        key: token
      location:
        header:
          name: Authorization
          prefix: "Bearer "
{{- end }}
