{{- if .Values.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sre-ai-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: sre-ai-agent
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: {{ .Values.externalSecret.upstreamToken }}
    - secretKey: GATEWAY_API_KEY
      remoteRef:
        key: {{ .Values.externalSecret.gatewayApiKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sre-ai-agent-upstream
  namespace: agentgateway-system
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: sre-ai-agent-upstream
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.externalSecret.upstreamToken }}
{{- end }}
