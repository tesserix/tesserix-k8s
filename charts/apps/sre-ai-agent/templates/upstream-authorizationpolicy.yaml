{{- if .Values.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: sre-ai-agent-upstream-l4
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sre-ai-agent.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    # The non-mesh AgentGateway has no SPIFFE principal at ztunnel. Source
    # restriction is enforced by the gateway-pod NetworkPolicy and API token.
    - to:
        - operation:
            ports: [{{ .Values.service.port | quote }}]
{{- end }}
