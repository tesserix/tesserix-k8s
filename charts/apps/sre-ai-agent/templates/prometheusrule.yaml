{{- if and .Values.enabled .Values.monitoring.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-ai-agent
  labels:
    {{- include "sre-ai-agent.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: ai-agents.sre-investigator
      rules:
        - alert: SREAIInvestigatorUnavailable
          expr: 'max(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="sre-ai-agent"}) < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="sre-ai-agent"})'
          for: 2m
          labels: {severity: critical, owner: ai-platform}
          annotations:
            summary: The SRE AI investigator has no available replicas
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/sre-ai-agent.md
        - alert: SREAIInvestigatorHADegraded
          expr: 'max(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="sre-ai-agent"}) < 2 and max(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="sre-ai-agent"}) > 0'
          for: 5m
          labels: {severity: warning, owner: ai-platform}
          annotations:
            summary: The SRE AI investigator has lost redundancy
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/sre-ai-agent.md
        - alert: SREAIInvestigatorRestarting
          expr: 'sum(increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="sre-agent"}[15m])) > {{ .Values.monitoring.alerts.restartThreshold }}'
          for: 5m
          labels: {severity: warning, owner: ai-platform}
          annotations:
            summary: The SRE AI investigator is restarting repeatedly
            runbook_url: https://github.com/tesserix/tesserix-k8s/blob/main/docs/runbooks/sre-ai-agent.md
{{- end }}
