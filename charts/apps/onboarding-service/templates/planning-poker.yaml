{{- if .Values.planningPoker.projectID }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-planning-poker-company-onboarding
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onboarding-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: planning-poker
          podSelector:
            matchLabels:
              app.kubernetes.io/name: planning-poker-api
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
