{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: onboarding-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "onboarding-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "onboarding-service.selectorLabels" (dict "component" "onboarding-api" "release" .Release.Name) | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: onboarding-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "onboarding-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "onboarding-service.selectorLabels" (dict "component" "onboarding-web" "release" .Release.Name) | nindent 6 }}
{{- end }}
