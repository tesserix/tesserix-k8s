{{- if .Values.helivantaEmailAccess.enabled }}
{{- range $mode := list "writer" "reader" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helivanta-onboarding-email-{{ $mode }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "onboarding-service.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
