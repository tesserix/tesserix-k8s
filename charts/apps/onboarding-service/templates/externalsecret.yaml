{{- if .Values.externalSecret.enabled }}
{{- $credential := .Values.externalSecret.credential }}
{{- if not (has $credential (list "machineKey" "pat")) }}
{{- fail (printf "externalSecret.credential must be machineKey or pat, got %q" $credential) }}
{{- end }}
{{/* DATABASE_URL is assembled here rather than stored whole, so rotating the
     CNPG password in Secret Manager needs no change to this chart. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: onboarding-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "onboarding-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: onboarding-api
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://{{ .Values.database.user }}:{{ `{{ .password | urlquery }}` }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require
        {{- if eq $credential "machineKey" }}
        ZITADEL_MACHINE_KEY: "{{ `{{ .machineKey }}` }}"
        {{- else }}
        ZITADEL_PAT: "{{ `{{ .pat }}` }}"
        {{- end }}
        SESSION_KEY: "{{ `{{ .sessionKey }}` }}"
        GOOGLE_CLIENT_SECRET: "{{ `{{ .googleClientSecret }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.passwordSecret }}
    {{- if eq $credential "machineKey" }}
    - secretKey: machineKey
      remoteRef:
        key: {{ .Values.externalSecret.machineKeySecret }}
    {{- else }}
    - secretKey: pat
      remoteRef:
        key: {{ .Values.externalSecret.patSecret }}
    {{- end }}
    - secretKey: sessionKey
      remoteRef:
        key: {{ .Values.externalSecret.sessionKeySecret }}
    - secretKey: googleClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.googleClientSecret }}
{{- end }}
