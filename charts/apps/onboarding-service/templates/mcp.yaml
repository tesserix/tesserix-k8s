{{- if .Values.mcp.gatewayProjectId }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onboarding-mcp-client
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-onboarding-mcp-gateway
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onboarding-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway-mcp
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
{{- end }}
