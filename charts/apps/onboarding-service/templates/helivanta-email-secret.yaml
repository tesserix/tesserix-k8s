{{- if .Values.helivantaEmailAccess.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: helivanta-onboarding-email
  namespace: {{ .Values.namespace }}
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: helivanta-onboarding-email-reader
          serviceAccountRef:
            name: helivanta-onboarding-email-reader
            audiences: [vault]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: onboarding-helivanta-resend
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: helivanta-onboarding-email
    kind: SecretStore
  target:
    name: onboarding-helivanta-resend
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: helivanta/prod/app/helivanta-onboarding-resend-api-key
        property: value
{{- end }}
