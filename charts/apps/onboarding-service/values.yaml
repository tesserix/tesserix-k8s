namespace: onboarding
host: onboard.tesserix.app

api:
  image:
    repository: ghcr.io/tesserix/onboarding-api
    # Pinned to the source commit. `latest` never rolls out: the manifest does
    # not change, so ArgoCD has nothing to sync and pods keep the old image.
    tag: eb5f577495ac3872330bed2c93330ae57f2cd051
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

web:
  image:
    repository: ghcr.io/tesserix/onboarding-web
    tag: eb5f577495ac3872330bed2c93330ae57f2cd051
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 3500
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 512Mi

zitadel:
  issuer: https://auth.tesserix.app
  # TESSERIX owns every product project and so is the only org that can grant
  # one. The API resolves its numeric id from this name at boot and refuses to
  # start on anything but one exact match; platformOrgId is an escape hatch for
  # an environment where the name is ambiguous.
  platformOrgName: TESSERIX
  platformOrgId: ""
  audience: onboarding-api

console:
  # Console humans sign in with Google; Zitadel stays the authority for product
  # machine tokens. The client id is public, its secret half lives in Secret
  # Manager (externalSecret.googleClientSecret).
  googleClientId: ""
  # Who may hold a console session, checked at sign-in and on every request.
  # Kept in git rather than a secret so granting or revoking console access is a
  # reviewed PR and an ArgoCD sync, not an unlogged edit in Secret Manager.
  adminEmails: []

database:
  host: global-postgres-rw.global.svc.cluster.local
  port: 5432
  name: onboarding_db
  user: onboarding
  maxConns: 10

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  passwordSecret: prod-onboarding-postgresql-password
  sessionKeySecret: prod-onboarding-session-key
  googleClientSecret: prod-onboarding-google-client-secret
  # machineKey is the scoped, expiring credential; pat is break-glass only and
  # is instance-wide. Exactly one is mounted — the API refuses to start on both.
  credential: machineKey
  machineKeySecret: prod-onboarding-zitadel-machine-key
  patSecret: prod-onboarding-zitadel-pat

istio:
  enabled: true
  gateways:
    - istio-ingress/tesseract-gateway

networkPolicy:
  enabled: true
  dnsServiceIP: 10.30.0.10
  podCIDR: 10.20.0.0/16

pdb:
  enabled: true
  minAvailable: 1

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
