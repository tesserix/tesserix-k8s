namespace: onboarding
host: onboard.tesserix.app

api:
  image:
    repository: ghcr.io/tesserix/onboarding-api
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  port: 8080
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi

web:
  image:
    repository: ghcr.io/tesserix/onboarding-web
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  port: 3500
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 512Mi

zitadel:
  issuer: https://auth.tesserix.app
  # Numeric ID of TESSERIX, the org that owns every product project and so the
  # only org that can grant one. Set per environment in values-prod.yaml; the
  # template requires it rather than defaulting, because a wrong value would
  # make every caller an org admin of the wrong tenant.
  platformOrgId: ""
  audience: onboarding-api
  consoleClientId: ""

database:
  host: global-postgres-rw.global.svc.cluster.local
  port: 5432
  name: onboarding_db
  user: onboarding
  maxConns: 10

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  passwordSecret: prod-onboarding-postgresql-password
  patSecret: prod-onboarding-zitadel-pat
  sessionKeySecret: prod-onboarding-session-key

istio:
  enabled: true
  gateways:
    - istio-ingress/tesseract-gateway

networkPolicy:
  enabled: true
  dnsServiceIP: 10.30.0.10
  podCIDR: 10.20.0.0/16

pdb:
  enabled: true
  minAvailable: 1

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
