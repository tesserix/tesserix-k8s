# Environment-specific identity wiring. Both values come from Zitadel and are
# left blank on purpose: the deployment template `required`s platformOrgId, so
# a blank one fails the render rather than silently making every caller an
# admin of the wrong organization.
#
#   platformOrgId   GET /management/v1/orgs/me with the iam-admin PAT -> .org.id
#   consoleClientId the onboard.tesserix.app OIDC application in TESSERIX
zitadel:
  platformOrgId: ""
  consoleClientId: ""

api:
  replicaCount: 2
web:
  replicaCount: 2
