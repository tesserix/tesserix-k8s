# The console's OIDC application in TESSERIX. Left blank on purpose: the
# deployment template `required`s it, so a missing one fails the render rather
# than shipping a console nobody can log in to.
#
# Zitadel console -> TESSERIX -> Projects -> Onboarding -> onboard.tesserix.app
# -> Configuration -> Client ID.
#
# The platform org id is deliberately absent: the API resolves it from
# zitadel.platformOrgName at boot, so there is no hand-copied id to go stale.
zitadel:
  consoleClientId: ""

api:
  replicaCount: 2
web:
  replicaCount: 2
