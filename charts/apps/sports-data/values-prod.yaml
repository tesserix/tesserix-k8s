# Production overrides for sports-data
# Migrated to Knative Serving (scale-to-zero)

image:
  pullPolicy: IfNotPresent


# Disable HPA and KEDA (Knative handles autoscaling)
autoscaling:
  enabled: false

keda:
  enabled: false

# PDB not needed — Knative manages pod lifecycle
podDisruptionBudget:
  enabled: false

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "info"
  USE_SPORTMONKS: "true"
  SPORTMONKS_CACHE_TTL: "1s"
  SPORTMONKS_LEAGUE_IDS: ""
  USE_CRICKETDATA: "true"
  CRICKETDATA_CACHE_TTL: "1s"
  REFRESH_INTERVAL: "30s"
  WRITE_TIMEOUT: "0"
  USE_REDIS_CACHE: "true"
  REDIS_HOST: "global-valkey-cache.global.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  REDIS_POOL_SIZE: "50"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
