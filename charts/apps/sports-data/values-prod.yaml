# Production overrides for sports-data
# Migrated to Knative Serving (scale-to-zero)

# Knative replaces Deployment + HPA
knative:
  enabled: true
  minScale: 1
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 300

# Disable HPA and KEDA (Knative handles autoscaling)
autoscaling:
  enabled: false

keda:
  enabled: false

# PDB not needed — Knative manages pod lifecycle
podDisruptionBudget:
  enabled: false

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "info"
  USE_MOCK_DATA: "false"
  USE_SPORTMONKS: "true"
  SPORTMONKS_CACHE_TTL: "15s"
  SPORTMONKS_LEAGUE_IDS: "1"  # 1=IPL — restrict to purchased leagues to stay within rate limits
  USE_CRICKETDATA: "false"
  REFRESH_INTERVAL: "30s"
  CRICKETDATA_CACHE_TTL: "1s"
  WRITE_TIMEOUT: "0"
  USE_REDIS_CACHE: "true"
  REDIS_HOST: "redis.redis-fanzone.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  REDIS_POOL_SIZE: "50"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
