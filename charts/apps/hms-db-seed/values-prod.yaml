# HMS Database Seed - Production Environment Values
# Development mode DISABLED - only essential initial data

developmentEnabled: false
environment: prod

database:
  host: "hms-postgres-rw.hms.svc.cluster.local"
  port: "5432"
  user: "hms"
  sslmode: "require"
  existingSecret: "hms-postgres-app-credentials"
  secretKey: "password"

job:
  enabled: true
  restartPolicy: Never
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400

# Production seed data - minimal initial configuration
seed:
  tenant:
    id: "11111111-1111-1111-1111-111111111111"
    name: "Production Hospital"
    status: "active"

  hospital:
    id: "22222222-2222-2222-2222-222222222222"
    name: "Production Hospital"
    code: "PROD01"
    type: "general"
    registrationNumber: ""
    email: ""
    phone: ""
    addressLine1: ""
    city: ""
    state: ""
    pincode: ""
    country: "India"
    timezone: "Asia/Kolkata"

  # Empty arrays for production - no demo data
  departments: []
  patients: []

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"
