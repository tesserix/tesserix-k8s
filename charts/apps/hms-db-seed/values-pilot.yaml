# HMS Database Seed - Pilot Environment Values
# Development mode enabled with dummy data for testing

developmentEnabled: true
environment: pilot

database:
  host: "postgresql.database.svc.cluster.local"
  port: "5432"
  user: "postgres"
  sslmode: "disable"
  existingSecret: "postgresql-password"
  secretKey: "postgresql-password"

job:
  enabled: true
  restartPolicy: Never
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
