namespaceOverride: zitadel

schedule: "*/30 * * * *"
suspend: false
concurrencyPolicy: Forbid
# A day, so an overnight failure is still readable in the morning. The history
# limits below cap how many jobs are kept, not this.
ttlSecondsAfterFinished: 86400
backoffLimit: 3
activeDeadlineSeconds: 300
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

image:
  python: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/python@sha256:78098ea6a3a9c6a7727a5d4674e4a44e57e01fac878ee9cb4d24a86bd93916ff

serviceAccount:
  create: true
  name: ""
  annotations: {}

zitadel:
  # In-cluster, so the Host header carries the instance domain instead.
  api: http://zitadel.zitadel.svc.cluster.local:8080
  host: auth.tesserix.app
  patSecret:
    name: iam-admin-pat
    key: pat

# Serialised to /config/desired.json and reconciled field by field. Anything not
# listed here is left alone, so console-set fields survive.
desired:
  labelPolicy:
    primaryColor: "#5B5FD6"
    primaryColorDark: "#8E91F4"
    backgroundColor: "#fafafa"
    backgroundColorDark: "#111827"
    warnColor: "#cd3d56"
    warnColorDark: "#ff3b5b"
    fontColor: "#000000"
    fontColorDark: "#ffffff"
    disableWatermark: true
    themeMode: THEME_MODE_AUTO

  # Keys are the asset path segment under /assets/v1/instance/policy/label/.
  assets:
    logo: logo-light.png
    logo/dark: logo-dark.png

  loginPolicy:
    allowUsernamePassword: true
    allowExternalIdp: true
    # Self-registration is how an unrelated Google account got an admin-console
    # login once before; tenants are provisioned by the platform, not by anyone
    # who can reach the hostname.
    allowRegister: false
    forceMfa: false
    hidePasswordReset: false
    ignoreUnknownUsernames: true
    allowDomainDiscovery: true
    passwordlessType: PASSWORDLESS_TYPE_ALLOWED

  # Granted IAM_OWNER if they exist. A federated admin only exists after their
  # first sign-in, so a missing user is skipped, not an error.
  admins:
    - unidevidp@gmail.com
    - samyak.rout@gmail.com
    - mahesh.sangawar@gmail.com

  # Where new users and every product project belong. Held on ZITADEL until one
  # instance-level Google IdP replaces the per-org ones: an unscoped login
  # resolves the default org's IdP, and every human is linked to ZITADEL's.
  defaultOrg: ZITADEL

  # Orgs that supply their own logo and palette. Every other org is held on the
  # instance skin, so a stray console edit cannot fork the platform look.
  selfBrandedOrgs: []

  platformProjects:
    - org: ZITADEL
      name: AgentGateway
      expectedId: "386889024519799084"
      roles:
        - key: agentgateway.mcp
          displayName: MCP
          group: gateway-access
        - key: agentgateway.models
          displayName: Models
          group: gateway-access
      # These confidential clients were created once so their one-time secrets
      # could be written directly to GCP Secret Manager. The reconciler asserts
      # their non-secret configuration and fails closed on drift.
      oidcApps:
        - name: agentgateway-mcp-ui
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          redirectUris:
            - https://mcp.tesserix.app/oauth2/callback
          postLogoutRedirectUris:
            - https://mcp.tesserix.app
        - name: agentgateway-admin-ui
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          redirectUris:
            - https://agentgateway.tesserix.app/oauth2/callback
          postLogoutRedirectUris:
            - https://agentgateway.tesserix.app
      humanGrants:
        - login: samyak.rout@gmail.com
          roles: [agentgateway.mcp, agentgateway.models]
        - login: mahesh.sangawar@gmail.com
          roles: [agentgateway.mcp, agentgateway.models]

  # The instance's initial org. It cannot be deleted or deactivated: it owns the
  # ZITADEL project (console, Admin/Management/Auth APIs), platform control-plane
  # projects, the iam-admin service user behind this job's PAT, and the
  # break-glass password admin.
  reservedOrg:
    name: ZITADEL
    allowedProjects:
      - ZITADEL
      - AgentGateway

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
