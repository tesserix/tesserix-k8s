namespaceOverride: zitadel

schedule: "*/30 * * * *"
suspend: false
concurrencyPolicy: Forbid
# A day, so an overnight failure is still readable in the morning. The history
# limits below cap how many jobs are kept, not this.
ttlSecondsAfterFinished: 86400
backoffLimit: 3
activeDeadlineSeconds: 300
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

image:
  python: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/python@sha256:78098ea6a3a9c6a7727a5d4674e4a44e57e01fac878ee9cb4d24a86bd93916ff

serviceAccount:
  create: true
  name: ""
  annotations: {}

zitadel:
  # In-cluster, so the Host header carries the instance domain instead.
  api: http://zitadel.zitadel.svc.cluster.local:8080
  host: auth.tesserix.app
  patSecret:
    name: iam-admin-pat
    key: pat

# Serialised to /config/desired.json and reconciled field by field. Anything not
# listed here is left alone, so console-set fields survive.
desired:
  labelPolicy:
    primaryColor: "#5B5FD6"
    primaryColorDark: "#8E91F4"
    backgroundColor: "#fafafa"
    backgroundColorDark: "#111827"
    warnColor: "#cd3d56"
    warnColorDark: "#ff3b5b"
    fontColor: "#000000"
    fontColorDark: "#ffffff"
    disableWatermark: true
    themeMode: THEME_MODE_AUTO

  # Keys are the asset path segment under /assets/v1/instance/policy/label/.
  assets:
    logo: logo-light.png
    logo/dark: logo-dark.png

  loginPolicy:
    allowUsernamePassword: true
    allowExternalIdp: true
    # Self-registration is how an unrelated Google account got an admin-console
    # login once before; tenants are provisioned by the platform, not by anyone
    # who can reach the hostname.
    allowRegister: false
    forceMfa: false
    hidePasswordReset: false
    ignoreUnknownUsernames: true
    allowDomainDiscovery: true
    passwordlessType: PASSWORDLESS_TYPE_ALLOWED

    # HOW LONG A COMPLETED CHECK STAYS VALID. Declared because every one of
    # these was 0s on this instance, and 0s means "expired the instant it is
    # made".
    #
    # That single fact is why the console could not be logged into. The V1
    # login checks the password, writes user.human.password.check.succeeded,
    # then re-evaluates what the auth request still needs — and with
    # passwordCheckLifetime at 0s the check it just completed is already
    # expired, so the next required step is the password again. The browser
    # goes back to the password screen with no error, forever. It is not a
    # failure path: it is the policy working exactly as configured.
    #
    # helivanta was unaffected and that is what made this so hard to see. Its
    # application is on Login V2, which authenticates through the session API
    # and does not consult these V1 lifetimes at all. Same instance, same org,
    # same user, same password — one works and one loops.
    #
    # Why they were 0s: drift_between's own docstring explains it. Zitadel
    # serialises protobuf defaults by omission, so a zero duration comes back
    # ABSENT from the live policy; strip_readonly(live) therefore carries
    # nothing for it, and the PUT that follows re-asserts zero. Undeclared, it
    # can never climb out of that state on its own. Declaring them is what
    # breaks the cycle.
    #
    # The values are Zitadel's own defaults, restated rather than inherited so
    # that this file is the answer to "how long is a check good for".
    #
    # Unquoted deliberately, and it is not a style preference. These are plain
    # YAML scalars — 864000s is not a number, so it parses as the string the
    # API wants either way — but wrapping the first one in quotes makes the
    # line match GitGuardian's generic-password heuristic, which reads a
    # key ending in "password" assigned a quoted string as a hardcoded
    # credential and fails the pull request.
    #
    # Leaving them bare keeps secret scanning strict on this chart rather than
    # teaching it to skip a file that also configures an admin bootstrap. Do
    # not add quotes back.
    passwordCheckLifetime: 864000s         # 240h
    externalLoginCheckLifetime: 864000s    # 240h
    mfaInitSkipLifetime: 2592000s          # 720h
    secondFactorCheckLifetime: 64800s      # 18h
    multiFactorCheckLifetime: 43200s       # 12h

  # Granted IAM_OWNER if they exist. A federated admin only exists after their
  # first sign-in, so a missing user is skipped, not an error.
  admins:
    - unidevidp@gmail.com
    - samyak.rout@gmail.com
    - mahesh.sangawar@gmail.com

  # Where new users and every product project belong.
  defaultOrg: TESSERIX

  # Orgs that supply their own logo and palette. Every other org is held on the
  # instance skin, so a stray console edit cannot fork the platform look.
  selfBrandedOrgs: []

  # Outbound email, asserted but never created from here.
  #
  # Email is the only recovery path instance-admin has, and a provider that gets
  # deactivated or repointed stops password reset with no error anywhere — nobody
  # finds out until someone is locked out. Hence requireActive.
  #
  # The password is NOT declared. It lives in prod-zitadel-resend-api-key and was
  # entered once through /admin/v1/smtp; omitting the field on update preserves
  # the stored value, verified against the eventstore (the change event carries no
  # password key and mail kept sending).
  #
  # Port 587 + STARTTLS, not 465: Zitadel's `tls` flag drives STARTTLS, and 465
  # expects implicit TLS. The mismatch fails silently.
  #
  # `description` is deliberately absent from the asserted set. Zitadel writes it
  # to the eventstore but never projects it to the read model — a day after being
  # changed, GET still returned the value set at creation — so comparing it would
  # report drift no write can clear.
  smtp:
    expectedId: "388266420867171601"
    senderAddress: auth@tesserix.app
    senderName: Tesserix
    host: smtp.resend.com:587
    user: resend
    tls: true
    description: Resend
    requireActive: true

  # Federated sign-in connectors, asserted but never created from here.
  #
  # The client secret is NOT declared and never reaches this job. It was written
  # once when the provider was created and lives only in Zitadel's encrypted
  # eventstore; the reconciler omits the field on update, which leaves the stored
  # value untouched. Sending an empty string would blank it — that is the
  # difference, and it is why a missing provider, an unexpected id or a changed
  # clientId fails the run instead of being "fixed" from git.
  #
  # Deliberately org-level, not instance-level. An instance connector is
  # inherited by every org that does not override it, including future tenant
  # orgs — and tenants bring their own IdP, so a Tesserix-owned Google button on
  # their login page is wrong. The reason instance-level was once wanted (an
  # unscoped login resolving the default org's connector) disappeared when
  # defaultOrg became TESSERIX, where the humans already are.
  idps:
    - org: TESSERIX
      name: Google
      expectedId: "386381087862948767"
      clientId: 849928263410-ctrdo7o0sj68r4sddbf942bolunplc4e.apps.googleusercontent.com
      scopes:
        - openid
        - profile
        - email
      options:
        # Linking on, creation off: an existing human links by verified email,
        # a stranger with a Google account gets nothing. Auto-creation on is how
        # an unrelated account could self-provision, which allowRegister: false
        # exists to prevent.
        isLinkingAllowed: true
        isCreationAllowed: false
        isAutoCreation: false
        # OFF, and it must stay off. On, Zitadel rewrites the linked user's
        # profile from Google's claims at every sign-in — instance-admin's
        # display name was edited twice in the console, reported saved both
        # times, and reverted on the next login. The form was never the problem.
        isAutoUpdate: false
        autoLinking: AUTO_LINKING_OPTION_EMAIL

  platformProjects:
    - org: TESSERIX
      name: AgentGateway
      expectedId: "387190457387450503"
      roles:
        - key: agentgateway.mcp
          displayName: MCP
          group: gateway-access
        - key: agentgateway.models
          displayName: Models
          group: gateway-access
      # These confidential clients were created once so their one-time secrets
      # could be written directly to GCP Secret Manager. The reconciler asserts
      # their non-secret configuration and fails closed on drift.
      oidcApps:
        - name: agentgateway-mcp-ui
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          loginBaseUri: https://auth.tesserix.app/ui/v2/login
          redirectUris:
            - https://mcp.tesserix.app/oauth2/callback
          postLogoutRedirectUris:
            - https://mcp.tesserix.app
        - name: agentgateway-admin-ui
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          loginBaseUri: https://auth.tesserix.app/ui/v2/login
          redirectUris:
            # Standalone AgentGateway's native OIDC callback.
            - https://agentgateway.tesserix.app/oauth/callback
            # Retained until the private legacy xDS admin proxy is removed.
            - https://agentgateway.tesserix.app/oauth2/callback
          postLogoutRedirectUris:
            - https://agentgateway.tesserix.app
      humanGrants:
        - login: samyak.rout@gmail.com
          roles: [agentgateway.mcp, agentgateway.models]
        - login: mahesh.sangawar@gmail.com
          roles: [agentgateway.mcp, agentgateway.models]
    - org: TESSERIX
      name: AgentRegistry
      expectedId: "386930054896026901"
      oidcApps:
        - name: agentregistry-ui
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          loginBaseUri: https://auth.tesserix.app/ui/v2/login
          redirectUris:
            - https://aregistry.tesserix.app/oauth2/callback
          postLogoutRedirectUris:
            - https://aregistry.tesserix.app/
        - name: agentregistry-cli
          appType: OIDC_APP_TYPE_NATIVE
          authMethodType: OIDC_AUTH_METHOD_TYPE_NONE
          redirectUris:
            - http://127.0.0.1/callback
          postLogoutRedirectUris: []
      roles:
        - key: agentregistry.admin
          displayName: Agent Registry Administrator
          group: Agent Registry
        - key: registry.reader
          displayName: Registry Reader
          group: Registry Publisher
        - key: registry.publisher
          displayName: Registry Publisher
          group: Registry Publisher
        - key: registry.deleter
          displayName: Registry Deleter
          group: Registry Publisher
      humanGrants:
        - login: samyak.rout@gmail.com
          roles:
            - agentregistry.admin
            - registry.reader
            - registry.publisher
            - registry.deleter
        - login: mahesh.sangawar@gmail.com
          roles:
            - agentregistry.admin
            - registry.reader
            - registry.publisher
            - registry.deleter
    - org: TESSERIX
      name: Atlantis
      expectedId: "387690151817511174"
      roles:
        - key: atlantis.admin
          displayName: Atlantis Admin
          group: terraform-automation
      oidcApps:
        - name: atlantis-ui
          appType: OIDC_APP_TYPE_WEB
          authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
          loginBaseUri: https://auth.tesserix.app/ui/v2/login
          redirectUris:
            - https://atlantis.tesserix.app/oauth2/callback
          postLogoutRedirectUris:
            - https://atlantis.tesserix.app
      # oauth2-proxy terminates the session and Atlantis never sees the token,
      # so these grants only bite once the project's projectRoleCheck is on.
      # They are declared first so turning that flag on cannot lock both
      # operators out.
      humanGrants:
        - login: samyak.rout@gmail.com
          roles: [atlantis.admin]
        - login: mahesh.sangawar@gmail.com
          roles: [atlantis.admin]

  # The instance's initial org. It cannot be deleted or deactivated: it owns the
  # ZITADEL project (console, Admin/Management/Auth APIs), the iam-admin service
  # user behind this job's PAT, and the break-glass password admin.
  reservedOrg:
    name: ZITADEL
    allowedProjects:
      - ZITADEL

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
