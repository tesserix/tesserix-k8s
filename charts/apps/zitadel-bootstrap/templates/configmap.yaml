apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zitadel-bootstrap.fullname" . }}-scripts
  namespace: {{ include "zitadel-bootstrap.namespace" . }}
  labels:
    {{- include "zitadel-bootstrap.labels" . | nindent 4 }}
data:
  bootstrap.py: |-
    {{- .Files.Get "files/bootstrap.py" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zitadel-bootstrap.fullname" . }}-config
  namespace: {{ include "zitadel-bootstrap.namespace" . }}
  labels:
    {{- include "zitadel-bootstrap.labels" . | nindent 4 }}
data:
  desired.json: {{ .Values.desired | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zitadel-bootstrap.fullname" . }}-assets
  namespace: {{ include "zitadel-bootstrap.namespace" . }}
  labels:
    {{- include "zitadel-bootstrap.labels" . | nindent 4 }}
binaryData:
  {{- range $name, $file := .Values.desired.assets }}
  {{ $file }}: {{ $.Files.Get (printf "files/%s" $file) | b64enc }}
  {{- end }}
