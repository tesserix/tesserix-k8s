# Single ExternalSecret bundles every PostSocial "secret" env value:
#   - JWT_SECRET                       (PostSocial cookie/JWT signing key)
#   - POSTSOCIAL_OAUTH_CLIENT_SECRET       (Keycloak client secret for the `postsocial` client)
#   - OPENAI_API_KEY                   (used for PostSocial built-in copilot/dall-e — optional)
#   - per-platform OAuth client secrets (X_API_SECRET, LINKEDIN_CLIENT_SECRET, ...)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postsocial-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postsocial.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postsocial-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod-postsocial-jwt-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prod-postsocial-openai-api-key
    - secretKey: X_API_SECRET
      remoteRef:
        key: prod-postsocial-x-api-secret
    - secretKey: LINKEDIN_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-linkedin-client-secret
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef:
        key: prod-postsocial-facebook-app-secret
    - secretKey: THREADS_APP_SECRET
      remoteRef:
        key: prod-postsocial-threads-app-secret
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-youtube-client-secret
    - secretKey: TIKTOK_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-tiktok-client-secret
    - secretKey: PINTEREST_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-pinterest-client-secret
    - secretKey: REDDIT_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-reddit-client-secret
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-discord-client-secret
    - secretKey: DISCORD_BOT_TOKEN_ID
      remoteRef:
        key: prod-postsocial-discord-bot-token
    - secretKey: SLACK_SECRET
      remoteRef:
        key: prod-postsocial-slack-secret
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: prod-postsocial-slack-signing-secret
    - secretKey: MASTODON_CLIENT_SECRET
      remoteRef:
        key: prod-postsocial-mastodon-client-secret
