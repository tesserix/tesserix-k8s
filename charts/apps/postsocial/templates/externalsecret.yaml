# Single ExternalSecret bundles every PostSocial env value sourced from GCP SM,
# including BOTH per-platform OAuth client IDs and client secrets. Keeping the
# IDs in SM (instead of plaintext in values.yaml) lets the scraper-api settings
# UI manage them at runtime via roles/secretmanager.* on the Workload Identity
# SA, with no git churn per credential update.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postsocial-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "postsocial.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postsocial-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: prod-postsocial-jwt-secret }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: prod-postsocial-openai-api-key }

    # X / Twitter
    - secretKey: X_API_KEY
      remoteRef: { key: prod-postsocial-x-api-key }
    - secretKey: X_API_SECRET
      remoteRef: { key: prod-postsocial-x-api-secret }

    # LinkedIn
    - secretKey: LINKEDIN_CLIENT_ID
      remoteRef: { key: prod-postsocial-linkedin-client-id }
    - secretKey: LINKEDIN_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-linkedin-client-secret }

    # Facebook
    - secretKey: FACEBOOK_APP_ID
      remoteRef: { key: prod-postsocial-facebook-app-id }
    - secretKey: FACEBOOK_APP_SECRET
      remoteRef: { key: prod-postsocial-facebook-app-secret }

    # Threads
    - secretKey: THREADS_APP_ID
      remoteRef: { key: prod-postsocial-threads-app-id }
    - secretKey: THREADS_APP_SECRET
      remoteRef: { key: prod-postsocial-threads-app-secret }

    # YouTube
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef: { key: prod-postsocial-youtube-client-id }
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-youtube-client-secret }

    # TikTok
    - secretKey: TIKTOK_CLIENT_ID
      remoteRef: { key: prod-postsocial-tiktok-client-id }
    - secretKey: TIKTOK_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-tiktok-client-secret }

    # Pinterest
    - secretKey: PINTEREST_CLIENT_ID
      remoteRef: { key: prod-postsocial-pinterest-client-id }
    - secretKey: PINTEREST_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-pinterest-client-secret }

    # Reddit
    - secretKey: REDDIT_CLIENT_ID
      remoteRef: { key: prod-postsocial-reddit-client-id }
    - secretKey: REDDIT_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-reddit-client-secret }

    # Discord
    - secretKey: DISCORD_CLIENT_ID
      remoteRef: { key: prod-postsocial-discord-client-id }
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-discord-client-secret }
    - secretKey: DISCORD_BOT_TOKEN_ID
      remoteRef: { key: prod-postsocial-discord-bot-token }

    # Slack
    - secretKey: SLACK_ID
      remoteRef: { key: prod-postsocial-slack-id }
    - secretKey: SLACK_SECRET
      remoteRef: { key: prod-postsocial-slack-secret }
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef: { key: prod-postsocial-slack-signing-secret }

    # Mastodon
    - secretKey: MASTODON_CLIENT_ID
      remoteRef: { key: prod-postsocial-mastodon-client-id }
    - secretKey: MASTODON_CLIENT_SECRET
      remoteRef: { key: prod-postsocial-mastodon-client-secret }

    # Email (SendGrid via SMTP relay)
    - secretKey: SENDGRID_API_KEY
      remoteRef: { key: prod-postsocial-sendgrid-api-key }

    # Sentry
    - secretKey: SENTRY_DSN
      remoteRef: { key: prod-postsocial-sentry-dsn }

    # URL shorteners (one-of)
    - secretKey: DUB_TOKEN
      remoteRef: { key: prod-postsocial-dub-token }
    - secretKey: SHORT_IO_SECRET_KEY
      remoteRef: { key: prod-postsocial-short-io-secret }
    - secretKey: KUTT_API_KEY
      remoteRef: { key: prod-postsocial-kutt-api-key }
    - secretKey: LINK_DRIP_API_KEY
      remoteRef: { key: prod-postsocial-link-drip-api-key }

    # Polotno design canvas
    - secretKey: POLOTNO_KEY
      remoteRef: { key: prod-postsocial-polotno-key }
