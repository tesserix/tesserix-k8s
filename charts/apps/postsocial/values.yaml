# postsocial — upstream image proxied through Artifact Registry, integrated into scrapper namespace.

namespace: scrapper

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/gitroomhq/postiz-app
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

serviceAccount:
  create: true
  name: ""
  automount: true

# Mounted under the main scraper hostname — no separate user-facing domain.
# OAuth callbacks from social platforms come through Istio at this prefix
# and get proxied to postsocial.scrapper.svc.cluster.local:5000 internally.
publicUrl: "https://social-scrapper.tesserix.app/api/postsocial"

# Internal datastore endpoints (managed by sibling charts)
database:
  host: "postsocial-postgres-rw.scrapper.svc.cluster.local"
  port: "5432"
  user: "postsocial-user"
  database: "postsocial-db-local"
  passwordSecret:
    name: postsocial-postgres-app-credentials
    key: password

redis:
  host: "postsocial-redis.scrapper.svc.cluster.local"
  port: "6379"
  passwordSecret:
    name: postsocial-redis-auth
    key: password

temporal:
  address: "temporal.scrapper.svc.cluster.local:7233"

# PostSocial expects /uploads to be writable. PVC provides persistence across restarts.
# economy-rwo-retain (pd-standard, Retain) — user uploads, infrequent IO.
uploads:
  pvc:
    size: 20Gi
    storageClass: economy-rwo-retain
    accessMode: ReadWriteOnce

# Misc PostSocial tunables (full unlock — Stripe absent → ULTIMATE tier in code).
# notSecured: "true" lets the bootstrap step read the JWT from the `auth`
# response header (over an in-cluster connection only — never user-facing).
flags:
  isGeneral: "true"
  notSecured: "true"
  disableRegistration: "true"
  apiLimit: "10000"
  storageProvider: "local"

# Per-platform OAuth credentials (BOTH client IDs AND secrets) live in GCP
# Secret Manager and are pulled in via the postsocial-secrets ExternalSecret.
# Don't put them in this file — the scraper-api settings UI manages them at
# runtime by writing new versions to GCP SM directly.
#
# MASTODON_URL is the only literal value (no creds; just the instance URL).
mastodonUrl: "https://mastodon.social"

# Email — using SendGrid via NodeMailer SMTP relay (Postiz supports
# resend/nodemailer/empty, and SendGrid speaks plain SMTP). Set
# email.enabled=true once prod-postsocial-sendgrid-api-key holds the SG
# key. EMAIL_HOST/PORT/USER are non-secret; password is mounted from
# postsocial-secrets via SENDGRID_API_KEY.
#
# Resend is the always-on fallback provider behind SendGrid: the platform-wide
# prod-resend-api-key is mounted as RESEND_API_KEY so a SendGrid outage is
# recoverable by switching these email settings to Postiz's resend provider
# (no new secret plumbing needed).
email:
  enabled: true
  # Root tesserix.app — the domain verified with the email providers.
  # (Subdomains need their own Resend verification, so don't use one.)
  fromAddress: "noreply@tesserix.app"
  fromName: "Tesserix Social Scrapper"
  host: "smtp.sendgrid.net"
  port: "587"
  secure: "false"
  user: "apikey"  # literal SendGrid SMTP username

# Optional Sentry monitoring — populate prod-postsocial-sentry-dsn to enable
sentry:
  enabled: false
  spotlight: false

# Optional URL shorteners (Postiz auto-detects which is configured)
# Populate the matching prod-postsocial-* secrets to enable.
shortLinks:
  dub:
    enabled: false
    apiEndpoint: "https://api.dub.co"
    domain: "dub.sh"
  shortIo:
    enabled: false
  kutt:
    enabled: false
    apiEndpoint: "https://kutt.it/api/v2"
    domain: "kutt.it"
  linkDrip:
    enabled: false
    apiEndpoint: "https://api.linkdrip.com/v1/"
    domain: "dripl.ink"

# Optional Polotno design canvas — populate prod-postsocial-polotno-key to enable
polotnoEnabled: false

resources:
  requests:
    memory: 1Gi
  limits:
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

podAnnotations:
  holdApplicationUntilProxyStarts: "true"
podLabels: {}
