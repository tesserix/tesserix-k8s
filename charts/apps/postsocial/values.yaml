# postsocial — upstream image proxied through Artifact Registry, integrated into scrapper namespace.

namespace: scrapper

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/gitroomhq/postiz-app
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

serviceAccount:
  create: true
  name: ""
  automount: true

# Mounted under the main scraper hostname — no separate user-facing domain.
# OAuth callbacks from social platforms come through Istio at this prefix
# and get proxied to postsocial.scrapper.svc.cluster.local:5000 internally.
publicUrl: "https://social-scrapper.tesserix.app/api/postsocial"

# Internal datastore endpoints (managed by sibling charts)
database:
  host: "postsocial-postgres-rw.scrapper.svc.cluster.local"
  port: "5432"
  user: "postsocial-user"
  database: "postsocial-db-local"
  passwordSecret:
    name: postsocial-postgres-app-credentials
    key: password

redis:
  host: "postsocial-redis.scrapper.svc.cluster.local"
  port: "6379"
  passwordSecret:
    name: postsocial-redis-auth
    key: password

temporal:
  address: "temporal.scrapper.svc.cluster.local:7233"

# PostSocial expects /uploads to be writable. PVC provides persistence across restarts.
uploads:
  pvc:
    size: 20Gi
    storageClass: standard-rwo-retain
    accessMode: ReadWriteOnce

# PostSocial is invisible to end users — they never visit its UI.
# The scraper backend bootstraps a single internal admin and uses the org
# API key for all calls. No SSO/OIDC needed.
keycloak:
  enabled: false

# Misc PostSocial tunables (full unlock — Stripe absent → ULTIMATE tier in code).
# notSecured: "true" lets the bootstrap step read the JWT from the `auth`
# response header (over an in-cluster connection only — never user-facing).
flags:
  isGeneral: "true"
  notSecured: "true"
  disableRegistration: "true"
  apiLimit: "10000"
  storageProvider: "local"

# Per-platform OAuth client IDs are *non-secret* values. Drop them here so they
# render into the Deployment cleanly. Secrets are mounted from a single
# ExternalSecret at /etc/postsocial/secrets via env mapping below.
platformOauth:
  X_API_KEY: ""
  LINKEDIN_CLIENT_ID: ""
  FACEBOOK_APP_ID: ""
  THREADS_APP_ID: ""
  YOUTUBE_CLIENT_ID: ""
  TIKTOK_CLIENT_ID: ""
  PINTEREST_CLIENT_ID: ""
  REDDIT_CLIENT_ID: ""
  DISCORD_CLIENT_ID: ""
  SLACK_ID: ""
  MASTODON_URL: "https://mastodon.social"
  MASTODON_CLIENT_ID: ""

resources:
  requests:
    memory: 1Gi
  limits:
    memory: 4Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

podAnnotations:
  holdApplicationUntilProxyStarts: "true"
podLabels: {}
