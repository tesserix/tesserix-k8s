apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-postgres-auth
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- if .Values.postgres.auth.openbaoSecretPath }}
    name: {{ .Values.postgres.auth.openbaoSecretStore }}
    kind: SecretStore
    {{- else }}
    name: gcp-secret-store
    kind: ClusterSecretStore
    {{- end }}
  target:
    name: temporal-postgres-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        {{- if .Values.postgres.auth.openbaoSecretPath }}
        key: {{ .Values.postgres.auth.openbaoSecretPath }}
        property: value
        {{- else }}
        key: {{ .Values.postgres.auth.gcpSecretName }}
        version: latest
        {{- end }}
