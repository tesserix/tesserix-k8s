apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-postgres-auth
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/component: database
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.postgres.auth.openbaoSecretStore }}
    kind: SecretStore
  target:
    name: temporal-postgres-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgres.auth.openbaoSecretPath }}
        property: value
