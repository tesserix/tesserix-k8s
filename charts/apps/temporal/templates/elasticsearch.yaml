{{- if .Values.elasticsearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-elasticsearch
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal-elasticsearch
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/component: search
spec:
  serviceName: temporal-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-elasticsearch
        app.kubernetes.io/part-of: temporal
        app.kubernetes.io/component: search
    spec:
      initContainers:
        # ES insists on certain kernel sysctls; the chown init also
        # ensures the data dir is writable by the elasticsearch user (uid 1000).
        - name: fix-permissions
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: {{ .Values.elasticsearch.image.pullPolicy }}
          env:
            - name: discovery.type
              value: "single-node"
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "true"
            - name: cluster.routing.allocation.disk.watermark.low
              value: "512mb"
            - name: cluster.routing.allocation.disk.watermark.high
              value: "256mb"
            - name: cluster.routing.allocation.disk.watermark.flood_stage
              value: "128mb"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: xpack.security.enabled
              value: "false"
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.elasticsearch.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-elasticsearch
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal-elasticsearch
    app.kubernetes.io/part-of: temporal
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: temporal-elasticsearch
{{- end }}
