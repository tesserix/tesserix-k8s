{{- if not .Values.postgres.external.enabled }}
# The embedded single-replica Postgres.
#
# Suppressed entirely when postgres.external.enabled — an instance pointed at
# the shared cluster in `infra` must not also run this, or the StatefulSet
# keeps a stale copy of the data alive next to the real one and a
# misconfiguration silently reads from the wrong database.
#
# The PVC is deliberately NOT removed with it: `standard-rwo-retain` keeps the
# volume after the StatefulSet goes, which is the rollback path for a
# migration that has to be undone.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal-postgres
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/component: database
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-postgres
        app.kubernetes.io/part-of: temporal
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal-postgres
    app.kubernetes.io/part-of: temporal
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    app.kubernetes.io/name: temporal-postgres
{{- end }}
