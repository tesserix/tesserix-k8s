apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: temporal
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: temporal
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-auth
                  key: password
            - name: POSTGRES_SEEDS
              value: "temporal-postgres.{{ .Values.namespace }}.svc.cluster.local"
            - name: TEMPORAL_NAMESPACE
              value: default
            # SQL-based visibility — no Elasticsearch needed for our footprint
            - name: ENABLE_ES
              value: "false"
            - name: SKIP_DEFAULT_NAMESPACE_CREATION
              value: "false"
          ports:
            - name: frontend
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: frontend
      name: frontend
  selector:
    app.kubernetes.io/name: temporal
