apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/component: server
spec:
  # Configurable so the server can be quiesced through git rather than with a
  # `kubectl scale` that selfHeal would undo mid-operation. Set to 0 to stop
  # writes for a database migration, then back to 1 after the cutover.
  #
  # NOT `default 1` — Go templates treat 0 as empty, so `0 | default 1` is 1
  # and the scale-down silently does nothing. The value is defined in
  # values.yaml instead, which makes 0 mean zero.
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: temporal
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.server.keepAliveMaxConnectionAge }}
      # Bake the frontend gRPC keepAliveMaxConnectionAge into the image's own
      # config_template.yaml BEFORE dockerize renders it, so it lands in the
      # rendered docker.yaml. (A separate base.yaml overlay does NOT work: temporal
      # loads base.yaml then docker.yaml, and docker.yaml's services.frontend map
      # entry REPLACES base.yaml's, dropping the keepalive.) Temporal's 5-min
      # default recycles the connection and resets the worker's in-flight
      # long-poll streams — pointless on a single-frontend instance.
      initContainers:
        - name: inject-keepalive
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              awk -v age='{{ .Values.server.keepAliveMaxConnectionAge }}' '
                /^[[:space:]]*httpPort:/ && !done {
                  print
                  print "            keepAliveServerConfig:"
                  print "              keepAliveServerParameters:"
                  print "                maxConnectionAge: \"" age "\""
                  done = 1
                  next
                }
                { print }
              ' /etc/temporal/config/config_template.yaml > /render/config_template.yaml
              echo "inject-keepalive: set frontend maxConnectionAge={{ .Values.server.keepAliveMaxConnectionAge }}"
              grep -n "keepAliveServerConfig" /render/config_template.yaml
          volumeMounts:
            - name: config-render
              mountPath: /render
      {{- end }}
      containers:
        - name: temporal
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres-auth
                  key: password
            - name: POSTGRES_SEEDS
              {{- if .Values.postgres.external.enabled }}
              # Points at the shared cluster's -rw service, NOT its pooler.
              #
              # The CNPG poolers run PgBouncer in `transaction` mode, which
              # does not carry prepared statements across a transaction
              # boundary. Temporal's postgres12 driver prepares statements and
              # reuses them, so pooling it in transaction mode surfaces as
              # sporadic "prepared statement does not exist" errors under load
              # rather than a clean failure at startup — the worst kind to
              # debug. The -rw service follows the primary through failover,
              # which is the property that actually matters here.
              value: {{ .Values.postgres.external.host | quote }}
              {{- else }}
              value: "temporal-postgres.{{ .Values.namespace }}.svc.cluster.local"
              {{- end }}
            {{- if .Values.postgres.external.enabled }}
            # The auto-setup entrypoint issues CREATE DATABASE on boot. That
            # worked when Temporal owned its own Postgres, but on the shared
            # cluster `temporal` is an ordinary tenant role and the server
            # crash-looped on:
            #
            #   Unable to create SQL database. {"error": "pq: permission
            #   denied to create database"}
            #
            # Skipping the create is the correct fix rather than granting
            # CREATEDB: the databases are provisioned by the infra-postgres
            # chart, and a tenant role on a multi-tenant cluster has no
            # business creating more of them. Schema setup and versioned
            # upgrades still run — they operate inside the existing database.
            - name: SKIP_DB_CREATE
              value: "true"
            {{- end }}
            - name: TEMPORAL_NAMESPACE
              value: default
            {{- if .Values.elasticsearch.enabled }}
            # ES-backed visibility — required for PostSocial's custom Text
            # search attributes (organizationId, postId), which exceed SQL's
            # 3-Text-column limit.
            - name: ENABLE_ES
              value: "true"
            - name: ES_SEEDS
              value: "temporal-elasticsearch.{{ .Values.namespace }}.svc.cluster.local"
            - name: ES_VERSION
              value: "v7"
            {{- else }}
            - name: ENABLE_ES
              value: "false"
            {{- end }}
            - name: SKIP_DEFAULT_NAMESPACE_CREATION
              value: "false"
          ports:
            - name: frontend
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if .Values.server.keepAliveMaxConnectionAge }}
          volumeMounts:
            # Use the keepalive-injected template the init container produced,
            # in place of the image's baked-in config_template.yaml. subPath so
            # only this one file is replaced (docker.yaml is still rendered here).
            - name: config-render
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
          {{- end }}
      {{- if .Values.server.keepAliveMaxConnectionAge }}
      volumes:
        - name: config-render
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal
    # The scrapper namespace enrolls all its Services behind an L7 waypoint
    # (istio.io/use-waypoint: waypoint). The Temporal frontend speaks gRPC
    # (HTTP/2) on 7233; an L7 waypoint without an appProtocol hint mishandles
    # the long-lived gRPC stream and cross-namespace clients (e.g. homechef)
    # time out with "context deadline exceeded". Temporal is an internal
    # control-plane service that does its own auth, so opt it out of the
    # waypoint — traffic still gets L4 mTLS + L4 authz via ztunnel directly.
    istio.io/use-waypoint: "none"
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: frontend
      name: frontend
      appProtocol: grpc
  selector:
    app.kubernetes.io/name: temporal
