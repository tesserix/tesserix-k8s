# Single-node Temporal with auto-setup, backed by an in-cluster postgres
# (state + SQL visibility for system attributes) and a single-node
# Elasticsearch (visibility for arbitrary custom search attributes — required
# by PostSocial which registers `organizationId` and `postId`, exceeding the
# 3-Text-column limit of Temporal's SQL visibility).

namespace: scrapper

service:
  frontendPort: 7233

server:
  image:
    repository: temporalio/auto-setup
    tag: "1.28.1"
    pullPolicy: IfNotPresent
  # Bumped for multi-product load — HomeChef + PostSocial + future products now
  # share this cluster. Memory-only per platform policy (no cpu requests/limits).
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 3Gi

# Embedded Postgres for Temporal state.
postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storage:
    size: 10Gi
    storageClass: standard-rwo-retain
  # Temporal's primary datastore — bumped so persistence keeps up under
  # multi-product workflow/history write load.
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 2Gi
  auth:
    user: temporal
    database: temporal
    gcpSecretName: prod-temporal-postgresql-password

# Single-node Elasticsearch for custom search-attribute visibility.
elasticsearch:
  enabled: true
  image:
    repository: elasticsearch
    tag: "7.17.27"
    pullPolicy: IfNotPresent
  storage:
    size: 5Gi
    storageClass: standard-rwo-retain
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi
  javaOpts: "-Xms512m -Xmx512m"

ui:
  enabled: false
  image:
    repository: temporalio/ui
    tag: "2.34.0"
  port: 8080
