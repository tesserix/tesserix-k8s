{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "homechef-web-app.fullname" . }}
  labels:
    {{- include "homechef-web-app.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "homechef-web-app.selectorLabels" . | nindent 6 }}
      homechef.tesserix.io/stack: deployment
{{- end }}
