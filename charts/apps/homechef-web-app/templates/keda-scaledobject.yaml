{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "homechef-web-app.fullname" . }}
  labels:
    {{- include "homechef-web-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "homechef-web-app.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 10 }}
  triggers:
    {{- if .Values.keda.triggers }}
    {{- toYaml .Values.keda.triggers | nindent 4 }}
    {{- else }}
    # Istio request-rate (prometheus) + memory, NOT cpu. The platform runs
    # memory-only resources (no CPU requests), so a KEDA `cpu` trigger is
    # invalid — the admission webhook rejects it when the target container has
    # no cpu request. Mirrors the proven homechef-auth-bff config.
    # `triggers` is required by the KEDA CRD, so this block must never be empty.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        query: sum(rate(istio_requests_total{destination_service_name="{{ include "homechef-web-app.fullname" . }}",destination_service_namespace="{{ .Release.Namespace }}",reporter="source"}[2m]))
        threshold: "50"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
    {{- end }}
{{- end }}
