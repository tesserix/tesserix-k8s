namespace: mark8ly
name: mark8ly-openfga

image:
  # Pulled via the in-region Artifact Registry mirror of Docker Hub — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/openfga/openfga
  tag: v1.5.5
  pullPolicy: IfNotPresent

# Two replicas: OpenFGA gates every admin API call (mobile /stores included),
# so a single-replica restart is a total outage of that path.
replicaCount: 2

pdb:
  enabled: true
  maxUnavailable: 1

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 8081

# Postgres connection details — resolved against the CNPG cluster.
# Username/password are read from mark8ly-postgres-openfga (basic-auth shape).
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_openfga
  secretName: mark8ly-postgres-openfga

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi
