# UAT overlay for mark8ly-openfga.
namespace: mark8ly-uat
name: mark8ly-uat-openfga

# Postgres connection points to the UAT CNPG cluster, not prod.
database:
  host: mark8ly-uat-postgres-rw.mark8ly-uat.svc.cluster.local
  port: 5432
  name: mark8ly_openfga
  secretName: mark8ly-uat-postgres-openfga

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 128Mi

# UAT-specific allowed callers — uses the mark8ly-uat-* SA names that
# the values-uat.yaml overlays for those services bake in.
# tesserix-auth-bff is dropped: tesserix-home doesn't query the UAT
# OpenFGA, only the prod one.
allowedPrincipals:
  - "cluster.local/ns/mark8ly-uat/sa/mark8ly-uat-platform-api"
  - "cluster.local/ns/mark8ly-uat/sa/mark8ly-uat-auth-bff"
  - "cluster.local/ns/mark8ly-uat/sa/mark8ly-uat-marketplace-api-admin"
  - "cluster.local/ns/mark8ly-uat/sa/mark8ly-uat-marketplace-api-storefront"
  - "cluster.local/ns/mark8ly-uat/sa/mark8ly-uat-fga-init"
