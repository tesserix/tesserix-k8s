apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: authz
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
        # Distinguishes these pods from the migrate Job's, which share the
        # name label; the PDB must not select a Job (no scale subresource).
        app.kubernetes.io/component: authz
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
    spec:
      serviceAccountName: {{ .Values.name }}
      # Best-effort spread — the cluster is memory-tight, so a hard constraint
      # would leave the second replica Pending instead of merely co-located.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 4000
        fsGroup: 4000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openfga
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: OPENFGA_DATASTORE_URI
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.service.httpPort }}"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:{{ .Values.service.grpcPort }}"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
          # /healthz reports DATASTORE health, so an HTTP liveness probe turns
          # a Postgres failover into a restart loop that cannot fix anything
          # (10 restarts on 2026-08-13). Liveness now only asks whether the
          # process is up; readiness still uses /healthz, so a pod that cannot
          # reach Postgres leaves the Service instead of being killed.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
