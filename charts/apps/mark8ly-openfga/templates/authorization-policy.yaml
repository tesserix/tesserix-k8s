# Only platform-api, auth-bff, and tesserix-auth-bff (cross-namespace
# super-admin gateway for tesserix.app) are allowed to call OpenFGA.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-openfga-callers
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-platform-api"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-auth-bff"
              - "cluster.local/ns/{{ .Values.namespace }}/sa/mark8ly-fga-init"
              - "cluster.local/ns/tesserix/sa/tesserix-auth-bff"
