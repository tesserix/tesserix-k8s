apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Must apply at or before the migrate Job's sync wave (-5),
    # otherwise the Job lands first and pod creation is rejected
    # with "service account not found" — observed on the first
    # mark8ly-uat sync. Prod was bootstrapped before the migrate
    # Job carried a sync-wave so this hadn't surfaced.
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
automountServiceAccountToken: true
