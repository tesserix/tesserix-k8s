{{- if not .Values.hibernate }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}

  # Primary database bootstrap. Secondary + tertiary roles/databases
  # are created by the postInitSQL block below (initdb runs them as the
  # postgres superuser, so role/database creation always succeeds).
  # Passwords are then reconciled by the operator via spec.managed.roles
  # — postInitSQL itself can't reference Kubernetes secrets.
  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.primaryDatabase }}
      owner: {{ .Values.bootstrap.primaryOwner }}
      secret:
        name: {{ .Values.bootstrap.primarySecret }}
      # Install required extensions on template1 so EVERY database
      # CREATEd from postInitSQL (openfga, marketplace_api, ...)
      # inherits them. Without this, marketplace-api migration 058
      # (`gen_random_bytes`) fails on a fresh cluster, leaving the
      # schema dirty and the deployment stuck — fixed manually in
      # prod, automated here so UAT and any future bootstrap is
      # reproducible.
      postInitTemplateSQL:
        - "CREATE EXTENSION IF NOT EXISTS pgcrypto"
        - "CREATE EXTENSION IF NOT EXISTS citext"
      postInitSQL:
        # openfga (used by mark8ly-openfga)
        - "CREATE ROLE {{ .Values.bootstrap.secondaryOwner }} LOGIN"
        - "CREATE DATABASE {{ .Values.bootstrap.secondaryDatabase }} OWNER {{ .Values.bootstrap.secondaryOwner }}"
        # marketplace_api (used by mark8ly-marketplace-api-{admin,storefront})
        - "CREATE ROLE marketplace_api LOGIN"
        - "CREATE DATABASE mark8ly_marketplace_api OWNER marketplace_api"

  storage:
    size: {{ .Values.storageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  walStorage:
    size: {{ .Values.walStorageSize }}
    storageClass: {{ .Values.storageClass }}
    resizeInUseVolumes: true

  resources:
{{ toYaml .Values.resources | indent 4 }}

  # Drop extra capabilities, non-root UID is enforced by CNPG.
  postgresql:
    parameters:
      max_connections: {{ .Values.postgresql.maxConnections | quote }}
      shared_buffers: {{ .Values.postgresql.sharedBuffers | quote }}
      effective_cache_size: {{ .Values.postgresql.effectiveCacheSize | quote }}
      work_mem: {{ .Values.postgresql.workMem | quote }}
      wal_level: "logical"
      ssl_min_protocol_version: "TLSv1.3"
      ssl_max_protocol_version: "TLSv1.3"
      # Query safety nets
      idle_in_transaction_session_timeout: "300000"
      statement_timeout: "120000"
      # SSD-optimized planner (GKE PD-SSD)
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      # Slow query logging (queries > 1s)
      log_min_duration_statement: "1000"
      # WAL safety cap. Was 10GB on a 20Gi WAL volume — half the disk
      # reservable for slot retention, leaving little room for live WAL
      # + archive lag. Tightened to 5GB (25% of WAL volume) on
      # 2026-05-04 after a sibling cluster (tesserix-postgres) hit the
      # WAL-full failure mode. The CNPGWALVolumeUtilization* alerts
      # in cnpg-storage.yaml now also catch impending fills regardless
      # of this setting.
      max_slot_wal_keep_size: "5GB"
      # Performance monitoring (CNPG auto-loads extension)
      pg_stat_statements.track: "all"
      pg_stat_statements.max: "10000"
      # P19 §24 sync commit — TEMPORARILY DISABLED (2026-04-19 incident).
      # The prior config (synchronous_commit=on + synchronous{method:any,
      # number:1}) deadlocked writes when postgres-1 was killed for a
      # resource resize and could not be recreated (PVC filesystem expand
      # required a running pod). Without a sync standby, every commit
      # hung waiting for an ack that would never arrive. Re-enable AFTER
      # postgres-1 is rebuilt as a healthy replica. See
      # docs/runbooks/cnpg-primary-failover.md (mark8ly repo).
      #
      # synchronous_standby_names is a CNPG fixed parameter — the operator
      # manages it directly from the spec.postgresql.synchronous block and
      # rejects any user-supplied value (admission webhook denies sync with
      # "Can't set fixed configuration parameter"). Omitting it (no sync
      # block + no override) leaves it empty, which is exactly what we want
      # while sync replication is disabled.
      synchronous_commit: "local"
    # Synchronous replication block REMOVED temporarily. Restore once
    # postgres-1 is healthy. Gate:
    #   {{ "{{" }}- if gt (int .Values.instances) 1 }}
    #   synchronous:
    #     method: any
    #     number: 1
    #   {{ "{{" }}- end }}

  {{- if .Values.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      googleCredentials:
        gkeEnvironment: true
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        immediateCheckpoint: true
        jobs: 2
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  {{- end }}

  serviceAccountTemplate:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: {{ .Values.backup.serviceAccount }}

  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enablePodMonitor }}
    disableDefaultQueries: false

  enableSuperuserAccess: false

  # CNPG-managed roles. The operator runs SQL as the postgres superuser
  # internally, so password reconciliation works even though
  # enableSuperuserAccess is false above. This replaced two PostSync
  # Jobs that connected as platform_api and tried to ALTER ROLE openfga
  # / marketplace_api — those failed with "permission denied to alter
  # role" because platform_api lacks CREATEROLE + ADMIN OPTION.
  managed:
    roles:
      - name: {{ .Values.bootstrap.secondaryOwner }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.bootstrap.secondarySecret }}
      - name: marketplace_api
        ensure: present
        login: true
        passwordSecret:
          name: {{ .Values.bootstrap.tertiarySecret | default "mark8ly-postgres-marketplace-api" }}

  primaryUpdateStrategy: unsupervised
  # Use switchover (promote replica first, then rebuild old primary) instead
  # of the default "restart" (delete primary, wait, recreate). Avoids the
  # deadlock where a resource change + PVC resize deletes the primary and
  # the operator can't recreate it until filesystem-expand completes — which
  # itself requires a running pod. See 2026-04-19 incident + docs/runbooks.
  primaryUpdateMethod: switchover
  failoverDelay: 0
  switchoverDelay: 3600
{{- end }}
