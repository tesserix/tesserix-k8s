{{- if not .Values.hibernate }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.clusterName }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  policyTypes:
    - Ingress
  ingress:
    # PostgreSQL clients: app pods, OpenFGA, PgBouncer, and CNPG peers.
    # The list of allowed app names is values-driven so UAT (mark8ly-uat-*
    # SAs) can reuse this chart by overriding `allowedAppNames` in
    # values-uat.yaml. Default = the prod-shaped name list.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                {{- range (.Values.allowedAppNames | default (list "mark8ly-auth-bff" "mark8ly-platform-api" "mark8ly-marketplace-api-admin" "mark8ly-marketplace-api-storefront" "mark8ly-openfga")) }}
                  - {{ . }}
                {{- end }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.clusterName }}
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ .Values.clusterName }}-pooler-rw
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-init
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.allowedCrossNamespaceSources }}
    # Cross-namespace clients (defaults to none — set in values-prod-style
    # overrides only when needed). Prod allows tesserix.* services into
    # mark8ly_platform_api as part of the super-admin path; UAT keeps
    # this empty so the test env stays self-contained.
    {{- range .Values.allowedCrossNamespaceSources }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                {{- range .appNames }}
                  - {{ . }}
                {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- end }}
    # Allow the CNPG operator to manage and probe instances.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
    # Preserve Prometheus scraping of CNPG metrics when ingress isolation
    # is enabled for the database pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - protocol: TCP
          port: 9187
{{- end }}
