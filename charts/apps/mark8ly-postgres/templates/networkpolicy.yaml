{{- if not .Values.hibernate }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.clusterName }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  policyTypes:
    - Ingress
  ingress:
    # PostgreSQL clients: app pods, OpenFGA, PgBouncer, and CNPG peers.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mark8ly-auth-bff
                  - mark8ly-platform-api
                  - mark8ly-marketplace-api-admin
                  - mark8ly-marketplace-api-storefront
                  - mark8ly-openfga
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.clusterName }}
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ .Values.clusterName }}-pooler-rw
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-init
      ports:
        - protocol: TCP
          port: 5432
    # Cross-namespace clients in the tesserix namespace. tesserix-auth-bff
    # connects to mark8ly_platform_api as its app role; tesserix-home and
    # tesserix-admin-api connect as mark8ly_platform_admin (CRUD super-admin
    # role) for cross-product reads/writes. Without an explicit
    # namespaceSelector, the in-namespace rule above matches only mark8ly
    # pods, so any tesserix pod's TCP SYN to 5432 is silently dropped.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tesserix
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tesserix-auth-bff
                  - tesserix-home
                  - tesserix-admin-api
      ports:
        - protocol: TCP
          port: 5432
    # Allow the CNPG operator to manage and probe instances.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
    # Preserve Prometheus scraping of CNPG metrics when ingress isolation
    # is enabled for the database pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - protocol: TCP
          port: 9187
{{- end }}
