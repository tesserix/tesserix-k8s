{{- if not .Values.hibernate }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.clusterName }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  policyTypes:
    - Ingress
  ingress:
    # PostgreSQL clients: app pods, OpenFGA, PgBouncer, and CNPG peers.
    # The list of allowed app names is values-driven so UAT (mark8ly-uat-*
    # SAs) can reuse this chart by overriding `allowedAppNames` in
    # values-uat.yaml. Default = the prod-shaped name list.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                {{- range (.Values.allowedAppNames | default (list "mark8ly-auth-bff" "mark8ly-platform-api" "mark8ly-marketplace-api-admin" "mark8ly-marketplace-api-storefront" "mark8ly-openfga")) }}
                  - {{ . }}
                {{- end }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.clusterName }}
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ .Values.clusterName }}-pooler-rw
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-init
      ports:
        - protocol: TCP
          port: 5432
        # Ambient: ztunnel reaches this pod on HBONE 15008 and forwards to
        # 5432 internally, PRESERVING the original client pod IP as the
        # source. So each source allowed 5432 needs 15008 too — and an
        # istio-system selector does NOT work, because the packets do not
        # appear to come from ztunnel.
        - protocol: TCP
          port: 15008
    {{- if .Values.allowedCrossNamespaceSources }}
    # Cross-namespace clients (defaults to none — set in values-prod-style
    # overrides only when needed). Prod allows tesserix.* services into
    # mark8ly_platform_api as part of the super-admin path; UAT keeps
    # this empty so the test env stays self-contained.
    {{- range .Values.allowedCrossNamespaceSources }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                {{- range .appNames }}
                  - {{ . }}
                {{- end }}
      ports:
        - protocol: TCP
          port: 5432
        # Ambient: ztunnel reaches this pod on HBONE 15008 and forwards to
        # 5432 internally, PRESERVING the original client pod IP as the
        # source. So each source allowed 5432 needs 15008 too — and an
        # istio-system selector does NOT work, because the packets do not
        # appear to come from ztunnel.
        - protocol: TCP
          port: 15008
    {{- end }}
    {{- end }}
    # Allow the CNPG operator to manage and probe instances.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        # Ambient: ztunnel reaches this pod on HBONE 15008 and forwards to
        # 5432 internally, PRESERVING the original client pod IP as the
        # source. So each source allowed 5432 needs 15008 too — and an
        # istio-system selector does NOT work, because the packets do not
        # appear to come from ztunnel.
        - protocol: TCP
          port: 15008
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
    # Istio ambient: ztunnel does NOT connect to the app port. It tunnels
    # every mesh connection to these pods over HBONE (15008) and only then
    # forwards to 5432 inside the pod. So none of the app-port rules above
    # are ever reached for mesh traffic, and without this the connection
    # dies at ztunnel with "connection timed out, maybe a NetworkPolicy is
    # blocking HBONE port 15008".
    #
    # This surfaced the moment the namespace moved to ambient: every NEW
    # pod's migrate init container failed with "failed to open database",
    # while pods created minutes earlier kept working on their existing
    # connections — so it looked like an app regression, not a mesh change.
    # Preserve Prometheus scraping of CNPG metrics when ingress isolation
    # is enabled for the database pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - protocol: TCP
          port: 9187
{{- end }}
