hibernate: false

namespace: mark8ly
clusterName: mark8ly-postgres

# P19 §22.2 / §24 — sync-standby at the 100-merchant tier. One primary +
# one synchronous standby; synchronous_commit=on waits for the standby
# fsync before ACKing a write, giving RPO=0 / RTO≤2min per spec. The
# template wires spec.postgresql.synchronous only when instances>1; at
# instances=1 the synchronous_commit parameter is inert and the cluster
# behaves as before.
#
# Cost delta: doubles PVC spend + reserves 1 full vCPU per pod. Target
# tier's storage (200Gi) is 10× the v0.1 value — stage this via ArgoCD
# staging sync before merging to prod.
#
# Restored to 2 for the 1000-user tier. At instances=1 any node drain or
# zone event is a total outage with no failover target, which that tier
# cannot absorb.
#
# The 8d incident that forced this back to 1 was a PVC resize race:
# replica-1 had PVC.spec=200Gi but PVC.status=20Gi, so the pod could not
# start to finish fs expansion. storageSize is now already 200Gi, so a
# freshly provisioned replica is created at final size and does not
# re-enter that path. Watch the replica reach streaming state before
# considering this settled.
#
# Note: a standby adds availability, not read throughput — applications
# connect to -rw. Routing reads to -ro is a separate change.
instances: 2
imageName: ghcr.io/cloudnative-pg/postgresql:16.4
storageSize: 200Gi
storageClass: standard-rwo-retain
walStorageSize: 20Gi

# §24 staircase — 1 CPU / 4 GiB at the 100-merchant tier. Current ask
# sizes primary + standby identically so either can serve writes after
# an auto-failover (liveness-probe-driven, see primaryUpdateStrategy).
#
# Raised to 8Gi: max_connections goes 100→400 below, and per-backend
# memory plus a 2GB shared_buffers does not fit in 4Gi.
resources:
  requests:
    memory: 8Gi
  limits:
    memory: 8Gi

# Server-side tuning. maxConnections must stay above the pooler's worst
# case (see pooler below) with headroom for superuser, replication and
# migration sessions.
postgresql:
  maxConnections: "400"
  sharedBuffers: "2GB"
  effectiveCacheSize: "6GB"
  # Deliberately modest — work_mem is per sort/hash node, not per
  # connection, so a large value times 400 sessions is an OOM risk.
  workMem: "16MB"

# Databases to create at bootstrap. CNPG's initdb stanza only seeds one
# db/role directly, so we rely on a post-init SQL script for the second
# database. The initdb owner is "platform_api" (the primary app).
bootstrap:
  primaryDatabase: mark8ly_platform_api
  primaryOwner: platform_api
  # Secret created by ExternalSecret (external-secrets/prod/mark8ly/externalsecret.yaml).
  primarySecret: mark8ly-postgres-platform-api
  secondaryDatabase: mark8ly_openfga
  secondaryOwner: openfga
  secondarySecret: mark8ly-postgres-openfga

# WAL archive → GCS. The CNPG operator uses the cluster ServiceAccount
# (Workload Identity) to write to the bucket. Provision the bucket separately;
# it is referenced here by name.
# Continuous backup to GCS via Barman Cloud (shared bucket, per-cluster dir)
backup:
  enabled: true
  schedule: "0 40 2 * * *"
  destinationPath: "gs://tesseract-prod-backups-in/mark8ly-postgres"
  retentionPolicy: "3d"
  serviceAccount: "app-secrets-mark8ly-prod@tesseracthub-480811.iam.gserviceaccount.com"

# Monitoring
monitoring:
  enablePodMonitor: true

# PgBouncer connection pooling (transaction mode).
#
# Connection budget — default_pool_size is per (user, database) pair PER
# pooler pod, so the server-side worst case is:
#
#   instances x (default_pool_size + reserve_pool_size) x pairs
#   3 x (25 + 5) x 3 = 270  server connections
#
# against max_connections=400, leaving ~130 for superuser, replication
# and migration sessions. Raising instances or defaultPoolSize without
# raising maxConnections will exhaust the server and refuse logins.
#
# Client side: 3 x 2500 = 7500 slots, far above the 1000-user target.
# One pooler pod was also a single point of failure in front of an HA
# database, which defeated the point of the standby.
pooler:
  enabled: true
  instances: 3
  maxClientConn: "2500"
  defaultPoolSize: "25"
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

# NetworkPolicy `<clusterName>-ingress` — list of in-namespace app
# pods (matched by `app.kubernetes.io/name`) allowed to talk to the
# CNPG primary on 5432. Defaults to the prod set; the UAT overlay
# overrides to the `mark8ly-uat-*` sibling names.
allowedAppNames:
  - mark8ly-auth-bff
  - mark8ly-platform-api
  - mark8ly-marketplace-api-admin
  - mark8ly-marketplace-api-storefront
  - mark8ly-openfga
  # Stuck-refund sweeper CronJob (admin chart). Runs the marketplace-api
  # image with the refund-sweep-cron entrypoint; istio-injection off, so
  # it needs an explicit NetworkPolicy allowance to reach CNPG on 5432.
  - mark8ly-marketplace-api-admin-refund-sweep
  # Expired stock-hold sweeper CronJob (admin chart, mark8ly#229/#231).
  # Same shape as refund-sweep above: marketplace-api image, its own
  # entrypoint, istio-injection off — so it needs its own allowance here.
  #
  # Its absence is a SILENT failure, not a loud one: the connection is
  # dropped rather than refused, so the binary sits in db.Open's retry
  # loop producing no output until activeDeadlineSeconds kills the Job.
  # That is how this was found — a live run, not a review.
  - mark8ly-marketplace-api-admin-stock-hold-sweep
  # Outbound webhook delivery pruner CronJob (admin chart, mark8ly#587).
  # Third instance of the same shape, and it hit the exact failure the
  # comment above warns about: the CronJob shipped without this entry and
  # every run died on activeDeadlineSeconds after db.Open retried a
  # silently-dropped connection ten times. Found by running the Job, which
  # is the only way this is ever found.
  #
  # Adding a marketplace-api CronJob? It needs an entry HERE as well as its
  # own manifest. The chart that defines the CronJob and the chart that
  # grants it database access are different charts.
  - mark8ly-marketplace-api-admin-webhook-delivery-prune

# Cross-namespace clients allowed into postgres. Prod allows the
# tesserix super-admin Next.js + APIs; UAT defaults to none (test env
# stays self-contained inside its own namespace).
allowedCrossNamespaceSources:
  - namespace: tesserix
    appNames:
      - tesserix-auth-bff
      - company
      - tesserix-home
      - tesserix-admin-api
