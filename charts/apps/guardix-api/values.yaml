name: guardix-api
namespace: guardix

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/guardix-api
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

serviceAccount:
  create: true
  name: ""
  annotations:
    iam.gke.io/gcp-service-account: app-secrets-guardix-prod@tesseracthub-480811.iam.gserviceaccount.com

knative:
  minScale: 1
  maxScale: 10
  containerConcurrency: 0
  timeoutSeconds: 300
  scaleDownDelay: "60s"

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

env:
  GUARDIX_ENV: production
  PORT: "8080"
  GUARDIX_AUTOMIGRATE: "false"
  CORS_ORIGINS: "https://school.guardix.in,https://app.guardix.in,https://admin.guardix.in"

database:
  host: guardix-postgres-rw.guardix.svc.cluster.local
  port: "5432"
  user: guardix
  name: guardix
  sslmode: require
  passwordSecretName: guardix-postgres-app-credentials
  passwordSecretKey: password

redis:
  enabled: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Ambient-mode NetworkPolicy: allow TCP 15008 (HBONE) to/from pod CIDR
# per feedback_ambient_hbone_netpol; otherwise mesh traffic silently fails.
networkPolicy:
  enabled: true
  podCIDR: "10.0.0.0/8"
