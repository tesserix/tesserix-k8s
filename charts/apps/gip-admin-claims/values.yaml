namespace: global
name: gip-admin-claims

# The GIP project + the full set of admin-class tenants the allow-list
# applies to. Each tenant is one product's admin/internal user namespace.
# Customer-class tenants are deliberately omitted — customers never carry
# the admin claim. The CronJob will, per tenant:
#   - grant admin=true to every allow-list email that EXISTS in the tenant
#     (grant-only — missing users are skipped, never created; creating
#     credential-less accounts squatted emails and broke onboarding)
#   - revoke admin from any other user that happens to carry it (drift)
gip:
  projectId: tesseracthub-480811
  adminTenants:
    - id: MP-Internal-e986p     # mark8ly admin
      product: mark8ly
    - id: Platform-9bu14        # cross-product platform admin (tesserix-internal)
      product: platform
    - id: DevAI-1mh9c           # DevAI admin (devai + devai-sre)
      product: devai
    - id: StockPilot-37yur      # StockPilot internal users
      product: stockpilot
    - id: Social-tuhg7          # Social scrapper admin
      product: social
  # Legacy single-tenant key kept for compatibility with older renders.
  # The new script reads adminTenants; this stays so a partial revert
  # cannot ever silently miss the mark8ly tenant.
  internalTenantId: MP-Internal-e986p

# Workload Identity: this GSA already holds firebaseauth.admin +
# identitytoolkit.admin on the project. The KSA's WI annotation +
# the project-side roles/iam.workloadIdentityUser binding let the Job
# pod call the Firebase Admin SDK with no static JSON key in cluster.
gcpServiceAccount: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

# K8s Secret name carrying the comma-separated admin email allow-list.
# Materialised by external-secrets/prod/global/. Updating the GCP
# secret value rolls through ESO within the refresh interval; the
# CronJob's next firing applies it.
secrets:
  adminEmails:
    name: gip-admin-emails
    key: ADMIN_EMAILS

# How often to reconcile. Every 6h is more than enough — the job only
# fixes drift introduced by ad-hoc Firebase Console edits.
schedule: "0 */6 * * *"

# python:3.12-slim + pip install at startup keeps the chart fully
# self-contained while the proper baked image is being built in
# slm-support-platform.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 256Mi
  limits:
    # pip install firebase-admin pulls ~150Mi of deps, plus the runtime
    # itself and a few tenants to iterate. 256Mi was OOMed mid-run; 512Mi
    # has comfortable headroom and still rounds to nothing at scale.
    memory: 512Mi
