namespace: global
name: gip-admin-claims

# The GIP project + Internal tenant the admin allow-list applies to.
# Customer tenant is unaffected — every customer authenticates with no
# admin claim regardless.
gip:
  projectId: tesseracthub-480811
  internalTenantId: MP-Internal-e986p

# Workload Identity: this GSA already holds firebaseauth.admin +
# identitytoolkit.admin on the project. The KSA's WI annotation +
# the project-side roles/iam.workloadIdentityUser binding let the Job
# pod call the Firebase Admin SDK with no static JSON key in cluster.
gcpServiceAccount: app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com

# K8s Secret name carrying the comma-separated admin email allow-list.
# Materialised by external-secrets/prod/global/. Updating the GCP
# secret value rolls through ESO within the refresh interval; the
# CronJob's next firing applies it.
secrets:
  adminEmails:
    name: gip-admin-emails
    key: ADMIN_EMAILS

# How often to reconcile. Every 6h is more than enough — the job only
# fixes drift introduced by ad-hoc Firebase Console edits.
schedule: "0 */6 * * *"

# python:3.12-slim + pip install at startup keeps the chart fully
# self-contained while the proper baked image is being built in
# slm-support-platform.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
