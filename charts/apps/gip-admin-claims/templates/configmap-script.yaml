# Inline Python script the CronJob runs. Lives in a ConfigMap so the
# rendered helm template carries the full source — auditable in the
# repo without chasing a separate image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-script
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gip-admin-claims.labels" . | nindent 4 }}
data:
  sync.py: |
    """Enforce the admin allow-list across every admin-class GIP tenant.

    Auth: Application Default Credentials via Workload Identity. The
    pod's KSA is bound to a GSA that holds firebaseauth.admin +
    identitytoolkit.admin on the project, so no static SA JSON key
    sits in the cluster.

    Inputs (env):
      GIP_PROJECT_ID     — Firebase project (same as the GCP project).
      GIP_ADMIN_TENANTS  — comma-separated tenant IDs to enforce on
                           (e.g. "MP-Internal-e986p,Platform-9bu14,
                           DevAI-1mh9c,StockPilot-37yur,Social-tuhg7").
                           Every product's admin/internal tenant goes
                           in this list. Customer-class tenants stay
                           out — they never carry the admin claim.
      ADMIN_EMAILS       — comma-separated email allow-list, from a
                           K8s secret backed by GCP Secret Manager.

    Per tenant the job will:
      1. For every email in ADMIN_EMAILS, ensure a user exists in the
         tenant. If missing, create it (email_verified=True so first
         social-login auto-links the IdP identity).
      2. Set {"admin": True} in the user's custom claims if not
         already present.
      3. For every OTHER user in the tenant, strip the admin claim if
         present (drift correction — e.g. claims granted ad-hoc via
         the Firebase Console).
      4. Exit non-zero on partial failures.

    No-op fast path: a user that already has admin=True is skipped, so
    re-runs every 6h are cheap.
    """
    import os
    import sys
    import time

    # We run as a non-root user (uid 1000, securityContext) so the system
    # site-packages dir is read-only. Direct pip into a tmpfs-writable
    # PYTHONUSERBASE so the cold-start install path works without root.
    os.environ.setdefault("HOME", "/tmp/home")
    os.environ.setdefault("PYTHONUSERBASE", "/tmp/python-user")
    os.makedirs(os.environ["HOME"], exist_ok=True)
    os.makedirs(os.environ["PYTHONUSERBASE"], exist_ok=True)
    user_site = os.path.join(
        os.environ["PYTHONUSERBASE"], "lib",
        f"python{sys.version_info.major}.{sys.version_info.minor}", "site-packages",
    )
    if user_site not in sys.path:
        sys.path.insert(0, user_site)

    try:
        import firebase_admin
        from firebase_admin import auth, credentials, tenant_mgt
    except ImportError:
        # Cold-start path on python:3.12-slim — install just-in-time
        # into the writable user-base. The proper image bakes firebase-admin in.
        import subprocess
        subprocess.check_call([
            sys.executable, "-m", "pip", "install", "--quiet", "--no-cache-dir",
            "--user", "firebase-admin==6.5.0",
        ])
        import firebase_admin
        from firebase_admin import auth, credentials, tenant_mgt

    PROJECT_ID = os.environ["GIP_PROJECT_ID"]
    tenant_ids = [
        t.strip() for t in os.environ.get("GIP_ADMIN_TENANTS", "").split(",") if t.strip()
    ]
    if not tenant_ids:
        # Backward-compat: fall back to the legacy single-tenant env.
        legacy = os.environ.get("GIP_INTERNAL_TENANT_ID", "").strip()
        if legacy:
            tenant_ids = [legacy]

    raw_emails = os.environ.get("ADMIN_EMAILS", "")
    allow_emails = {e.strip().lower() for e in raw_emails.split(",") if e.strip()}

    if not allow_emails:
        print("[error] ADMIN_EMAILS is empty — refusing to run", file=sys.stderr)
        sys.exit(2)
    if not tenant_ids:
        print("[error] GIP_ADMIN_TENANTS is empty — refusing to run", file=sys.stderr)
        sys.exit(2)

    print(f"[start] project={PROJECT_ID} tenants={tenant_ids} allow={sorted(allow_emails)}")

    app = firebase_admin.initialize_app(
        credentials.ApplicationDefault(),
        {"projectId": PROJECT_ID},
    )

    overall_failures = 0
    overall_totals = {"granted": 0, "already": 0, "revoked": 0, "created": 0}

    for tenant_id in tenant_ids:
        print(f"\n--- tenant={tenant_id} ---")
        try:
            client = tenant_mgt.auth_for_tenant(tenant_id, app=app)
        except Exception as e:
            overall_failures += 1
            print(f"[error] cannot bind tenant {tenant_id}: {e}", file=sys.stderr)
            continue

        per_failures = 0
        granted = already = revoked = created = 0
        allow_uids = set()

        # --- 1. Ensure allow-list users have admin=True ----------------
        for email in allow_emails:
            try:
                try:
                    user = client.get_user_by_email(email)
                except auth.UserNotFoundError:
                    user = client.create_user(email=email, email_verified=True)
                    created += 1
                    print(f"  created {email} -> uid={user.uid}")
                allow_uids.add(user.uid)
                current = (user.custom_claims or {}).get("admin")
                if current is True:
                    already += 1
                    continue
                new_claims = {**(user.custom_claims or {}), "admin": True}
                client.set_custom_user_claims(user.uid, new_claims)
                granted += 1
                print(f"  granted admin to {email} (uid={user.uid})")
            except Exception as e:
                per_failures += 1
                print(f"[error] {tenant_id}/{email}: {e}", file=sys.stderr)

        # --- 2. Revoke admin from anyone else in the tenant ------------
        page = client.list_users()
        while page:
            for user in page.users:
                if user.uid in allow_uids:
                    continue
                claims = user.custom_claims or {}
                if claims.get("admin"):
                    try:
                        new_claims = {k: v for k, v in claims.items() if k != "admin"}
                        client.set_custom_user_claims(user.uid, new_claims or None)
                        revoked += 1
                        print(
                            f"  revoked admin from uid={user.uid} "
                            f"email={user.email or '<no email>'}"
                        )
                    except Exception as e:
                        per_failures += 1
                        print(f"[error] revoke {tenant_id}/{user.uid}: {e}", file=sys.stderr)
            page = page.get_next_page()

        print(
            f"  [{tenant_id}] created={created} granted={granted} "
            f"already={already} revoked={revoked} failures={per_failures}"
        )
        overall_failures += per_failures
        overall_totals["granted"] += granted
        overall_totals["already"] += already
        overall_totals["revoked"] += revoked
        overall_totals["created"] += created

    print(
        f"\n[done] {overall_totals} failures={overall_failures} at {int(time.time())}"
    )
    sys.exit(1 if overall_failures else 0)
