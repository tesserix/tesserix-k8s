apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: ai-database
    # Ambient, not sidecar: Qdrant's raft p2p (6335) and long-lived gRPC
    # streams avoid the per-pod Envoy hop and the port-exclusion annotations
    # a sidecar would need.
    istio.io/dataplane-mode: ambient
