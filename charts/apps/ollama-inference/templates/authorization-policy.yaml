{{- if .Values.istioAuth.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ollama-inference-allow
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-inference
  action: ALLOW
  rules:
    {{- range .Values.istioAuth.allowedNamespaces }}
    - from:
        - source:
            namespaces:
              - {{ . | quote }}
    {{- end }}
{{- end }}
