{{- if .Values.knative.enabled }}
# Direct ClusterIP service for Istio ingress gateway routing.
# Knative creates ExternalName services that Istio gateways can't resolve.
# This service selects the actual Knative pods via queue-proxy port 8012,
# allowing the fanzone-web VirtualService to route traffic directly.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fanzone-media.fullname" . }}-direct
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fanzone-media.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    serving.knative.dev/service: {{ include "fanzone-media.fullname" . }}
  ports:
    - name: http
      port: 80
      targetPort: 8012
      protocol: TCP
{{- end }}
