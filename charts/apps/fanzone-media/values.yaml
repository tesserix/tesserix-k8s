# =============================================================================
# FanZone Media - Go Media Service (Emoji Catalog + GIF Proxy)
# Serves OpenMoji emoji catalog and proxies Klipy GIF API with Redis caching
# =============================================================================

replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/fanzone-battle-ground/fanzone-media
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8086

ingress:
  enabled: false

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 64Mi

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false


autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 15

# Environment configuration
env:
  SERVER_PORT: "8086"

# Secrets from existing K8s secrets
secretEnv:
  - name: REDIS_PASSWORD
    secretName: redis-fanzone-password
    secretKey: password
  # GIPHY_API_KEY is injected via ExternalSecret when externalSecrets.enabled=true

# Redis URL constructed with password
redisURL: "redis://:$(REDIS_PASSWORD)@global-valkey-cache.global.svc.cluster.local:6379/3"

# PostgreSQL for GIF catalog
database:
  enabled: true
  host: "fanzone-postgres-rw.fanzone.svc.cluster.local"
  port: "5432"
  name: "fanzone"
  user: "fanzone"
  sslmode: "require"
  secretName: "fanzone-postgres-app-credentials"
  secretKey: "password"

# GCP configuration
gcp:
  projectId: ""
  secretManager:
    secretPrefix: "devtest"

# External Secrets Operator (ESO) — creates K8s secrets from GCP Secret Manager
externalSecrets:
  enabled: false
  secretStoreRef: "gcp-secret-store"

# KEDA ScaledObject
keda:
  enabled: false
