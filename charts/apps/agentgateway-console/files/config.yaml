config:
  logging:
    format: json
    level: info
    fields:
      add:
        auth.subject: jwt.sub
        auth.client_id: jwt.client_id
        api_key.product: 'has(api_key.metadata.product) ? api_key.metadata.product : ""'
        devai.tenant_id: 'request.headers["x-devai-tenant-id"]'
        devai.user_id: 'request.headers["x-devai-user-id"]'
        devai.run_id: 'request.headers["x-devai-run-id"]'
        devai.agent: 'request.headers["x-devai-agent"]'
        kora.capability: 'request.headers["x-kora-ai-capability"]'
    database:
      url: postgres://agentgateway:{{ .pgPassword }}@global-postgres-rw.global.svc.cluster.local:5432/agentgateway_logs
  database:
    url: postgres://agentgateway:{{ .pgPassword }}@global-postgres-rw.global.svc.cluster.local:5432/agentgateway_config
  storage:
    mode: hybrid

gateways:
  mesh:
    port: 8080
  public:
    port: 8081
    jwtAuth:
      mode: strict
      providers:
        - issuer: https://auth.tesserix.app
          audiences: ["387190457387450503"]
          jwks:
            url: https://auth.tesserix.app/oauth/v2/keys
    authorization:
      rules:
        - require: '"agentgateway.models" in jwt["urn:zitadel:iam:org:project:387190457387450503:roles"]'
  console:
    port: 8082

ui:
  gateways: [console]
  policies:
    oidc:
      issuer: https://auth.tesserix.app
      clientId: "{{ .oidcClientId }}"
      clientSecret: "{{ .oidcClientSecret }}"
      redirectURI: https://agentgateway.tesserix.app/oauth/callback
      scopes:
        - profile
        - email
        - urn:zitadel:iam:org:project:id:387190457387450503:aud
        - urn:zitadel:iam:org:projects:roles
    authorization:
      rules:
        - require: '"agentgateway.models" in jwt["urn:zitadel:iam:org:project:387190457387450503:roles"]'

llm:
  gateways: [mesh, public]
  policies:
    jwtAuth:
      mode: strict
      location:
        header:
          name: authorization
          prefix: "Bearer "
      providers:
        - issuer: https://auth.tesserix.app
          audiences: ["387190457387450503"]
          jwks:
            url: https://auth.tesserix.app/oauth/v2/keys
    authorization:
      rules:
        - require: '"agentgateway.models" in jwt["urn:zitadel:iam:org:project:387190457387450503:roles"]'
    apiKey:
      mode: strict
      location:
        header:
          name: x-tesserix-virtual-api-key
      keys: []
    guardrails:
      streaming: Enabled
      request:
        - regex:
            action: reject
            rules:
              - builtin: creditCard
              - builtin: ssn
          rejection:
            status: 400
            body: request rejected by data guardrails
        - regex:
            action: mask
            rules:
              - builtin: email
              - builtin: phoneNumber
        - regex:
            action: reject
            rules:
              - pattern: '(?i)\b(ignore|disregard)\s+(all\s+)?(previous|prior|system|developer)\s+instructions?\b'
              - pattern: '(?i)\b(reveal|print|show)\s+(the\s+)?(system|developer)\s+prompt\b'
          rejection:
            status: 400
            body: request rejected by instruction guardrails
      response:
        - regex:
            action: mask
            rules:
              - builtin: creditCard
              - builtin: email
              - builtin: phoneNumber
              - builtin: ssn
    localRateLimit:
      - fillInterval: 60s
        maxTokens: 600
        tokensPerFill: 600
        type: requests
      - fillInterval: 3600s
        maxTokens: 10000000
        tokensPerFill: 10000000
        type: tokens
  providers:
    - name: anthropic
      provider: anthropic
      params:
        apiKey: $ANTHROPIC_API_KEY
    - name: openai
      provider: openai
      params:
        apiKey: $OPENAI_API_KEY
    - name: gemini
      provider: gemini
      params:
        apiKey: $GEMINI_API_KEY
    - name: vertex
      provider: vertex
      params:
        vertexProject: tesseracthub-480811
        vertexRegion: global
      defaults:
        auth:
          gcp: {}
  models:
    - name: anthropic/*
      provider:
        reference: anthropic
      transformation:
        model: llmRequest.model.stripPrefix("anthropic/")
    - name: openai/*
      provider:
        reference: openai
      transformation:
        model: llmRequest.model.stripPrefix("openai/")
    - name: gemini/*
      provider:
        reference: gemini
      transformation:
        model: llmRequest.model.stripPrefix("gemini/")
    - name: vertex/*
      provider:
        reference: vertex
      transformation:
        model: llmRequest.model.stripPrefix("vertex/")

routes:
  - name: devai-anthropic-mesh
    gateways: [mesh]
    matches:
      - path:
          pathPrefix: /anthropic
    policies:
      urlRewrite:
        path:
          prefix: /
      timeout:
        requestTimeout: 15m
      ai: {}
    backends:
      - ai:
          name: anthropic
          provider:
            anthropic: {}
          policies:
            backendAuth:
              passthrough: {}
            backendTLS: {}
  - name: devai-anthropic-public
    gateways: [public]
    matches:
      - path:
          pathPrefix: /anthropic
    policies:
      urlRewrite:
        path:
          prefix: /
      timeout:
        requestTimeout: 15m
      ai: {}
      remoteRateLimit:
        host: agentgateway-ratelimit.agentgateway-system.svc.cluster.local:8081
        domain: agentgateway-public
        failureMode: failClosed
        descriptors:
          - entries:
              - key: subject
                value: jwt.sub
            type: requests
          - entries:
              - key: subject
                value: jwt.sub
            type: tokens
    backends:
      - ai:
          name: anthropic
          provider:
            anthropic: {}
          policies:
            backendAuth:
