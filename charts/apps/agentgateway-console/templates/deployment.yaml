apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    secret.reloader.stakater.com/reload: {{ .Values.name }}-config
  labels:
    {{- include "agentgateway-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        {{- include "agentgateway-console.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.yaml" | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
      containers:
        - name: agentgateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: ["-f", "/etc/agentgateway/config.yaml"]
          env:
            - name: ADMIN_ADDR
              value: "0.0.0.0:{{ .Values.ports.admin }}"
            - name: RUST_LOG
              # The startup command logs the fully rendered config at info,
              # including Secret-backed PostgreSQL URLs. Keep normal info
              # telemetry while suppressing only that config-dump scope.
              value: info,agentgateway_app::commands::run=warn
            - name: OIDC_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-config
                  key: oidcCookieSecret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-config
                  key: anthropicApiKey
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-config
                  key: openaiApiKey
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-config
                  key: geminiApiKey
          ports:
            - name: http-mesh
              containerPort: {{ .Values.ports.mesh }}
            - name: http-public
              containerPort: {{ .Values.ports.public }}
            - name: http-console
              containerPort: {{ .Values.ports.console }}
            - name: admin
              containerPort: {{ .Values.ports.admin }}
            - name: readiness
              containerPort: {{ .Values.ports.readiness }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: {{ .Values.ports.readiness }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: {{ .Values.ports.readiness }}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10101
            runAsGroup: 10101
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.name }}-config
        - name: tmp
          emptyDir: {}
