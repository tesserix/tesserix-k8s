apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-console.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http-mesh
      port: {{ .Values.ports.mesh }}
      targetPort: {{ .Values.ports.mesh }}
    - name: http-public
      port: {{ .Values.ports.public }}
      targetPort: {{ .Values.ports.public }}
    - name: http-console
      port: {{ .Values.ports.console }}
      targetPort: {{ .Values.ports.console }}
