{{- /* files/config.yaml is passed through Helm untouched so its {{ }} placeholders reach ESO */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-console.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
{{ .Files.Get "files/config.yaml" | indent 10 }}
  data:
    - secretKey: pgPassword
      remoteRef:
        key: {{ .Values.externalSecret.pgPassword }}
    - secretKey: oidcClientId
      remoteRef:
        key: {{ .Values.externalSecret.oidcClientId }}
    - secretKey: oidcClientSecret
      remoteRef:
        key: {{ .Values.externalSecret.oidcClientSecret }}
