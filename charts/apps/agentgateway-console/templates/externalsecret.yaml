{{- /* files/config.yaml is passed through Helm untouched so its {{ }} placeholders reach ESO */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentgateway-console.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        oidcCookieSecret: {{ `"{{ .oidcCookieSecret }}"` }}
        anthropicApiKey: {{ `"{{ .anthropicApiKey }}"` }}
        openaiApiKey: {{ `"{{ .openaiApiKey }}"` }}
        geminiApiKey: {{ `"{{ .geminiApiKey }}"` }}
        config.yaml: |
{{ .Files.Get "files/config.yaml" | indent 10 }}
  data:
    - secretKey: pgPassword
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.pgPassword) }}
        key: {{ default (.Values.externalSecret.pgPassword) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: oidcClientId
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.oidcClientId) }}
        key: {{ default (.Values.externalSecret.oidcClientId) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: oidcClientSecret
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.oidcClientSecret) }}
        key: {{ default (.Values.externalSecret.oidcClientSecret) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: oidcCookieSecret
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.oidcCookieSecret) }}
        key: {{ default (.Values.externalSecret.oidcCookieSecret) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: anthropicApiKey
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.anthropicApiKey) }}
        key: {{ default (.Values.externalSecret.anthropicApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: openaiApiKey
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.openaiApiKey) }}
        key: {{ default (.Values.externalSecret.openaiApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
    - secretKey: geminiApiKey
      remoteRef:
{{- $bao := index (default dict $.Values.openbao) (.Values.externalSecret.geminiApiKey) }}
        key: {{ default (.Values.externalSecret.geminiApiKey) $bao }}
{{- if $bao }}
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
{{- end }}
