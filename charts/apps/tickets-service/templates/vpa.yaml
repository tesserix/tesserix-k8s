{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "tickets-service.fullname" . }}
  labels:
    {{- include "tickets-service.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tickets-service.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Chart.Name }}
        minAllowed:
          memory: {{ .Values.vpa.minAllowed.memory | quote }}
        maxAllowed:
          memory: {{ .Values.vpa.maxAllowed.memory | quote }}
        controlledResources: ["cpu", "memory"]
      {{- if .Values.vpa.excludeIstioProxy }}
      - containerName: istio-proxy
        mode: "Off"
      {{- end }}
{{- end }}
