apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # At or before the migrate Job's wave (-5), or the Job's pod is rejected
    # with "service account not found" — observed on mark8ly-uat's first sync.
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: dwellm8
automountServiceAccountToken: true
