{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devai-mcp-bridge.serviceAccountName" . }}
  labels:
    {{- include "devai-mcp-bridge.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.gcp .Values.gcp.workloadIdentity .Values.gcp.workloadIdentity.enabled }}
    iam.gke.io/gcp-service-account: {{ .Values.gcp.workloadIdentity.gcpServiceAccount }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount | default true }}
{{- end }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "devai-mcp-bridge.fullname" . }}-authz
  labels:
    {{- include "devai-mcp-bridge.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "devai-mcp-bridge.name" . }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- range .Values.allowedCallers }}
              - "cluster.local/ns/{{ $.Release.Namespace }}/sa/{{ . }}"
              {{- end }}
