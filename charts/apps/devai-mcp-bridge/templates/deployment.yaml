apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devai-mcp-bridge.fullname" . }}
  labels:
    {{- include "devai-mcp-bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "devai-mcp-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "devai-mcp-bridge.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "devai-mcp-bridge.serviceAccountName" . }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Hardening: drop all caps, no privilege escalation, read-only root
          # FS. The only writable surfaces are the npm cache + sandbox
          # workspace (emptyDir below) — a spawned stdio server can't touch
          # anything else.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DEVAI_REGISTRY_URL
              value: {{ .Values.registry.url | quote }}
            - name: DEVAI_AREGISTRY_URL
              value: {{ .Values.registry.url | quote }}
            - name: DEVAI_REGISTRY_DEFAULT_TENANT
              value: {{ .Values.registry.defaultTenant | default "devai" | quote }}
            - name: HOME
              value: /home/devai
            - name: NPM_CONFIG_CACHE
              value: /home/devai/.npm
          volumeMounts:
            - name: npm-cache
              mountPath: /home/devai/.npm
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: npm-cache
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
