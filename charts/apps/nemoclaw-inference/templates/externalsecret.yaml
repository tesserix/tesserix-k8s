{{- if .Values.primary.huggingfaceToken.secretName }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.primary.huggingfaceToken.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.primary.huggingfaceToken.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: {{ .Values.primary.huggingfaceToken.gcpSecretKey }}
        version: latest
{{- end }}
