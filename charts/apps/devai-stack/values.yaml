# devai-stack — component toggles (defaults).
#
# Each key matches a dependency in Chart.yaml; `<name>.enabled` gates whether
# that child renders. The real local configuration (images, infra endpoints,
# GCP-off, etc.) lives in values-local.yaml — always deploy with `-f values-local.yaml`.
#
# There is intentionally NO database component: locally DevAI connects to the
# SHARED local-infra CNPG Postgres + Redis. Deploy local-infra first.

devai-api:
  enabled: true
devai-sre:
  enabled: true
devai-dashboard:
  enabled: true
devai-sre-dashboard:
  enabled: true
devai-ai-gateway:
  enabled: true
# Optional locally — the login flow needs sandbox.app routing + GIP tenants.
# Enable in values-local.yaml (or --set) once that's set up.
devai-auth-bff:
  enabled: false
# Seeds the agentic-registry catalog. Enable AFTER agentic-registry is up.
devai-registry-bootstrap:
  enabled: false
