apiVersion: v2
name: devai-stack
description: |
  Umbrella chart that brings up the full DevAI application stack on a local kind
  cluster as ONE Helm release: devai-api, devai-sre, both dashboards, the
  auth-bff, the ai-gateway, and the registry-seed Job.

  Deliberately EXCLUDES the database — locally DevAI uses the SHARED local-infra
  CNPG Postgres + Redis (deploy the local-infra chart first); there is no
  bundled/own Postgres here. Every child is wired for kind via
  values-local.yaml (no External Secrets Operator, no Workload Identity, no
  KEDA, no Istio).

  Prod is unchanged: it keeps using the per-chart ArgoCD app-of-apps. This
  umbrella is a local-only convenience so the whole stack comes up (and down)
  with a single command.
type: application
version: 0.1.5
appVersion: "0.3.0"

# file:// deps resolve against sibling chart dirs. Run `helm dependency build`
# once (vendors them into charts/) before installing. Each is gated by a
# `<name>.enabled` condition so you can bring components up selectively.
#
# Versions are CARET RANGES, not exact pins. An exact pin breaks this umbrella
# every time a sibling chart is bumped — `helm dependency build` cannot resolve
# the stale version, vendors nothing, and `helm lint --strict` then fails with a
# misleading "chart directory is missing these dependencies". ^0.1.0 accepts any
# 0.1.x, so a sibling patch/build bump is absorbed, while a deliberate 0.2.0
# break still surfaces here.
dependencies:
  - name: devai-api
    version: "^0.1.0"
    repository: "file://../devai-api"
    condition: devai-api.enabled
  - name: devai-sre
    version: "^0.1.0"
    repository: "file://../devai-sre"
    condition: devai-sre.enabled
  - name: devai-dashboard
    version: "^0.1.0"
    repository: "file://../devai-dashboard"
    condition: devai-dashboard.enabled
  - name: devai-sre-dashboard
    version: "^0.1.0"
    repository: "file://../devai-sre-dashboard"
    condition: devai-sre-dashboard.enabled
  - name: devai-ai-gateway
    version: "^0.1.0"
    repository: "file://../devai-ai-gateway"
    condition: devai-ai-gateway.enabled
  - name: devai-auth-bff
    version: "^0.1.0"
    repository: "file://../devai-auth-bff"
    condition: devai-auth-bff.enabled
  - name: devai-registry-bootstrap
    version: "^0.1.0"
    repository: "file://../devai-registry-bootstrap"
    condition: devai-registry-bootstrap.enabled
