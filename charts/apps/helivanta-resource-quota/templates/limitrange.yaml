apiVersion: v1
kind: LimitRange
metadata:
  name: helivanta-compute-defaults
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: helivanta
    app.kubernetes.io/component: resource-governance
spec:
  limits:
    - type: Container
      min:
{{ toYaml .Values.limitRange.min | indent 8 }}
      max:
{{ toYaml .Values.limitRange.max | indent 8 }}
      default:
{{ toYaml .Values.limitRange.default | indent 8 }}
      defaultRequest:
{{ toYaml .Values.limitRange.defaultRequest | indent 8 }}
