{{/*
Authorization policies for the company website in the tesserix namespace.
Allows ingress from istio-ingress gateway and internal namespace traffic.
*/}}
---
# Allow ingress from istio-ingress gateway to company pods
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-tesserix
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "company.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    # Allow from Istio ingress gateway
    - from:
        - source:
            namespaces:
              - istio-ingress
    # Allow internal tesserix namespace traffic
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}
    # Allow from monitoring and istio-system
    - from:
        - source:
            namespaces:
              - monitoring
              - istio-system
{{/*
NOTE: `public-endpoints-tesserix` is intentionally NOT declared here. It is
owned platform-wide by the istio-config chart (public-endpoints-{{ "{{" }} $key {{ "}}" }}
over .Values.appNamespaces; tesserix is not in skipAuthPolicyNamespaces).
istio-config's version is a superset (also allows /healthz). Declaring it here
too made both the `company` and `istio-config` ArgoCD apps co-own the resource
— a SharedResourceWarning that kept the `company` app permanently OutOfSync and
caused Kargo promotions to time out.
*/}}
