{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "company.fullname" . }}-secrets
  labels:
    {{- include "company.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "company.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: {{ printf "%s-internal-service-key" .Values.gcp.secretManager.secretPrefix }}
    # Shared bearer token used by product admin apps (mark8ly admin, future
    # homechef admin) to call /api/internal/platform-tickets and
    # /api/internal/platform-announcements. The same secret is mounted into
    # mark8ly-admin's pod via its own ExternalSecret pointing at the same
    # GSM key. Rotating means rotating both at once.
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: prod-tesserix-internal-api-token
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ printf "%s-github-token" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: ONBOARDING_ADMIN_API_KEY
      remoteRef:
        key: {{ printf "%s-marketplace-content-admin-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: {{ printf "%s-argocd-auth-token" .Values.gcp.secretManager.secretPrefix }}
    # Self-hosted Google OAuth flow at /auth/login → /auth/callback. The
    # OAuth client ID lives in plain env values.yaml (it's public — it's
    # in the redirect URL anyway). Only the client secret + the session
    # encryption key are sensitive.
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        # Reuses the mark8ly OAuth client (same Google OAuth credentials
        # registered for the platform). Must already exist in GCP SM.
        key: prod-mark8ly-oauth-client-secret
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        # Same value tesserix-auth-bff consumes — keeps cookie crypto
        # consistent across any future re-merger of the two surfaces.
        key: prod-tesserix-session-encrypt-key
    # SendGrid Event Webhook signing key (ECDSA public). Used by the
    # /webhooks/sendgrid receiver in tesserix-home to verify event
    # payloads. The GSM secret value should be the PEM-encoded public
    # key SendGrid issues when the Event Webhook is enabled in the
    # SendGrid console (Settings → Mail Settings → Event Webhook →
    # Verification Key). Until the secret exists, the receiver
    # rejects every event with `signature_invalid` — so the secret
    # MUST be created in GSM before this ExternalSecret syncs:
    #
    #   gcloud secrets create prod-tesserix-sendgrid-webhook-secret \
    #     --replication-policy=automatic \
    #     --data-file=- < /path/to/ecdsa-public-key.pem
    #
    # See .planning/SMOKE-TEMPLATES.md for the full activation sequence.
    - secretKey: SENDGRID_WEBHOOK_PUBLIC_KEY
      remoteRef:
        key: prod-tesserix-sendgrid-webhook-secret
    # HomeChef/Fe3dr admin gateway — tesserix-home signs requests to the HomeChef
    # Go /admin/* API as a trusted BFF (lib/api/homechef-admin.ts). This MUST be
    # the SAME HMAC key the homechef-api uses (homechef ns BFF_INTERNAL_HMAC_KEY,
    # same GSM key) or the API returns 401. Mounted via envFrom on the company
    # deployment; the admin reads it as HOMECHEF_BFF_HMAC_KEY.
    - secretKey: HOMECHEF_BFF_HMAC_KEY
      remoteRef:
        key: prod-homechef-bff-internal-hmac-key
    # Otto support-chat trust header — tesserix-home's /api/otto proxy sends
    # this as X-Internal-Auth. MUST equal the value the shared Otto reads from
    # prod-support-platform-otto-internal-auth or otto rejects the header.
    # Consumed (via envFrom) as OTTO_INTERNAL_AUTH.
    - secretKey: OTTO_INTERNAL_AUTH
      remoteRef:
        key: prod-support-platform-otto-internal-auth
    # Kora admin gateway — tesserix-home signs requests to kora-api's
    # /v1/admin/* as a trusted BFF (lib/api/kora-admin.ts). This MUST be the
    # SAME HMAC key kora-api reads as KORA_BFF_HMAC_KEY, from the same GSM
    # secret, or the API returns 401. Mounted via envFrom on the company
    # deployment.
    - secretKey: KORA_BFF_HMAC_KEY
      remoteRef:
        key: prod-kora-bff-internal-hmac-key
{{- end }}
