{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "company.fullname" . }}-secrets
  labels:
    {{- include "company.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "company.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: {{ printf "%s-internal-service-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ printf "%s-github-token" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: ONBOARDING_ADMIN_API_KEY
      remoteRef:
        key: {{ printf "%s-marketplace-content-admin-key" .Values.gcp.secretManager.secretPrefix }}
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: {{ printf "%s-argocd-auth-token" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
