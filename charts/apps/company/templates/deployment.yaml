apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "company.fullname" . }}
  labels:
    {{- include "company.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "company.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "company.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "company.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 3000 }}
              protocol: TCP
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "company.fullname" . }}-secrets
          {{- end }}
          env:
            {{- if .Values.openpanel.enabled }}
            # Written into this namespace by the openpanel project-init job;
            # optional so a first deploy doesn't block on the job finishing.
            - name: OPENPANEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openpanel.secretName }}
                  key: {{ .Values.openpanel.clientIdKey }}
                  optional: true
            - name: OPENPANEL_API_URL
              value: {{ .Values.openpanel.apiUrl | quote }}
            # Without this the SDK loads its script from openpanel.dev's CDN.
            - name: OPENPANEL_SCRIPT_URL
              value: {{ .Values.openpanel.scriptUrl | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # GCP Secret Manager Configuration
            {{- if .Values.gcp.projectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcp.projectId | quote }}
            {{- end }}
            - name: GCP_SECRET_PREFIX
              value: {{ .Values.gcp.secretManager.secretPrefix | quote }}
            - name: USE_GCP_SECRET_MANAGER
              value: "true"
            {{- if .Values.database.tesserix.enabled }}
            # tesserix-postgres connection (own DB — apps registry + leads).
            # Host/port/name are static; user+password come from the
            # tesserix-postgres-tesserix-admin Secret synced by ESO.
            - name: TESSERIX_DB_HOST
              value: {{ .Values.database.tesserix.host | quote }}
            - name: TESSERIX_DB_PORT
              value: {{ .Values.database.tesserix.port | quote }}
            - name: TESSERIX_DB_NAME
              value: {{ .Values.database.tesserix.name | quote }}
            - name: TESSERIX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.tesserix.secretName | quote }}
                  key: username
            - name: TESSERIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.tesserix.secretName | quote }}
                  key: password
            {{- end }}
            {{- if .Values.database.mark8ly.enabled }}
            # mark8ly-postgres cross-namespace read/write (super-admin).
            # Connects as mark8ly_platform_admin (CRUD, no DDL/superuser).
            # The DB name is chosen per-query in app code (platform_api
            # vs marketplace_api), so it's not pinned here.
            - name: MARK8LY_DB_HOST
              value: {{ .Values.database.mark8ly.host | quote }}
            - name: MARK8LY_DB_PORT
              value: {{ .Values.database.mark8ly.port | quote }}
            - name: MARK8LY_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.mark8ly.secretName | quote }}
                  key: username
            - name: MARK8LY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.mark8ly.secretName | quote }}
                  key: password
            {{- end }}
            {{- if .Values.clickhouseOtel.enabled }}
            # Dedicated OTel ClickHouse (clickhouse-otel.observability) — powers
            # the platform Observability page (read-only service health/traces).
            # Password from the tesserix-clickhouse-otel Secret (synced by ESO).
            - name: CLICKHOUSE_OTEL_URL
              value: {{ .Values.clickhouseOtel.url | quote }}
            - name: CLICKHOUSE_OTEL_USER
              value: {{ .Values.clickhouseOtel.user | quote }}
            - name: CLICKHOUSE_OTEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouseOtel.secretName | quote }}
                  key: password
            {{- end }}
            {{- if .Values.database.homechef.enabled }}
            # homechef-postgres cross-namespace read/write (super-admin).
            # Connects as homechef_platform_admin (CRUD, no DDL/superuser).
            # Single database (homechef_db), so the name is pinned here.
            # Gated by .enabled — keep false until the role + secret exist
            # (see Home-Chef-App/docs/ops/CUTOVER-RUNBOOK.md), else the pod
            # would crash on a missing secretKeyRef.
            - name: HOMECHEF_DB_HOST
              value: {{ .Values.database.homechef.host | quote }}
            - name: HOMECHEF_DB_PORT
              value: {{ .Values.database.homechef.port | quote }}
            - name: HOMECHEF_DB_NAME
              value: {{ .Values.database.homechef.name | quote }}
            - name: HOMECHEF_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.homechef.secretName | quote }}
                  key: username
            - name: HOMECHEF_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.homechef.secretName | quote }}
                  key: password
            {{- end }}
            # Otto support-chat — the /api/otto proxy forwards to the shared
            # otto in support-platform. OTTO_INTERNAL_AUTH arrives via envFrom
            # (company-secrets, synced from prod-support-platform-otto-internal-auth).
            - name: OTTO_URL
              value: {{ .Values.otto.url | default "http://support-platform-otto.support-platform.svc.cluster.local:8089" | quote }}
            - name: OTTO_SESSION_COOKIE
              value: {{ .Values.otto.sessionCookie | default "otto_session_tesserix" | quote }}
          {{- if .Values.livenessProbe }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path | default "/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
