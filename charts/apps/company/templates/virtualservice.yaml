apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "company.fullname" . }}-vs
  labels:
    {{- include "company.labels" . | nindent 4 }}
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - {{ (index .Values.ingress.hosts 0).host }}
  http:
    # Auth error page — served by Next.js (must be before /auth prefix)
    - match:
        - uri:
            prefix: /auth/error
      route:
        - destination:
            {{- if .Values.cloudRun.enabled }}
            host: {{ .Values.cloudRun.frontend.host }}
            port:
              number: {{ .Values.cloudRun.frontend.port }}
            {{- else }}
            host: {{ include "company.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
            {{- end }}
      timeout: 30s

    # /auth/* — self-hosted Google OAuth flow lives in the company app
    # itself: app/auth/login (redirect to Google), /auth/callback
    # (exchange code, mint cookie), /auth/logout (clear cookie),
    # /auth/session (JSON read of local cookie).
    #
    # Previously we routed this prefix to tesserix-auth-bff for the
    # legacy OIDC server-side flow, but that auth-bff binary no longer
    # exposes /auth/login or /auth/callback (the new mark8ly flow is
    # client-initiated via Firebase SDK + POST /auth/auto-login).
    # Tesserix-home now owns its session minting end-to-end.
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            {{- if .Values.cloudRun.enabled }}
            host: {{ .Values.cloudRun.frontend.host }}
            port:
              number: {{ .Values.cloudRun.frontend.port }}
            {{- else }}
            host: {{ include "company.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
            {{- end }}
      timeout: 30s

    # Otto support-chat realtime — the WebSocket (and SSE) leave the Next.js
    # app and connect straight to the shared otto in support-platform, with a
    # long timeout for the long-lived stream. REST otto calls go through the
    # app's /api/otto proxy (which injects the internal-auth secret), so only
    # the realtime path needs this direct route. Must precede the catch-all.
    - match:
        - uri:
            regex: ^/api/v1/storefront/otto/conversations/[^/]+/(ws|sse)$
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s

    # Default route to company frontend
    - route:
        - destination:
            {{- if .Values.cloudRun.enabled }}
            host: {{ .Values.cloudRun.frontend.host }}
            port:
              number: {{ .Values.cloudRun.frontend.port }}
            {{- else }}
            host: {{ include "company.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
            {{- end }}
      timeout: 30s
