apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: company-openbao-key-health
spec:
  podSelector:
    matchLabels:
      {{- include "company.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - {protocol: TCP, port: 8200}
