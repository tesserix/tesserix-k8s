# Default values for company (Tesserix Homepage & Admin Portal)
replicaCount: 1

# Cloud Run routing — when enabled, VirtualService routes to Cloud Run
# instead of K8s services. Set in values-prod.yaml.
cloudRun:
  enabled: false
  frontend:
    host: ""
    port: 443
  authBff:
    host: ""
    port: 443

image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-home
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  # Exclude GCP metadata server from Istio for Workload Identity
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: company.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: company-tls
      hosts:
        - company.tesserix.app

  # Backend services exposed via ingress (if needed)
  backendServices: []

resources:
  # KEDA ScaledObject uses a CPU trigger. With no cpu request defined,
  # the % trigger has nothing to compute against and the
  # vscaledobject admission webhook rejects the deploy. Keep this in sync
  # with values-prod.yaml whenever resource shape changes.
  requests:
    cpu: "50m"
    memory: 256Mi
  limits:
    cpu: "500m"
    memory: 512Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Site URL
  NEXT_PUBLIC_SITE_URL: "https://company.tesserix.app"

  # Public onboarding URL (for "Start your free year" CTA)
  NEXT_PUBLIC_ONBOARDING_SITE_URL: "https://mark8ly.com"

  # Session cookie name — must match auth-bff's SESSION_COOKIE_NAME.
  # The Next.js middleware reads this when looking up the cookie for
  # session validation. Mismatch silently 401s every authenticated page.
  SESSION_COOKIE_NAME: "tx_session"

  # In-cluster auth-bff URL. Middleware proxies GET /auth/session to
  # validate cookies; auth-bff returns 200 on success, 401 on failure.
  AUTH_BFF_INTERNAL_URL: "http://tesserix-auth-bff.tesserix.svc.cluster.local:8087"

  # NOTE: legacy mark8ly per-microservice URLs (auth-bff, tenant-service,
  # tickets, settings, subscription, audit, status-dashboard, feature-flags,
  # notification, tenant-onboarding) were removed when the legacy stack was
  # retired. The company portal that consumed them needs to be re-pointed
  # at the new mark8ly v2 platform-api once the company-side features that
  # depend on them are reimplemented.

  # ArgoCD (for release management sync)
  ARGOCD_API_URL: "http://argocd-server.argocd.svc.cluster.local"

  # Trust K8s cluster CA for in-cluster API calls
  NODE_EXTRA_CA_CERTS: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

# External Secrets Configuration (GCP Secret Manager → K8s Secrets)
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# Database connections.
# - `tesserix`: this app's own Postgres (tesserix-postgres CNPG cluster
#   in the tesserix namespace). Owns leads + apps registry.
# - `mark8ly`: cross-namespace elevated read/write into mark8ly's CNPG
#   cluster as the mark8ly_platform_admin role (CRUD, NOT superuser/DDL —
#   see tesserix-k8s/docs/cross-db-admin.md).
# Each block is opt-in via .enabled so the chart still renders for
# environments without the role/secret yet.
database:
  tesserix:
    enabled: true
    host: tesserix-postgres-rw.tesserix.svc.cluster.local
    port: 5432
    name: tesserix_admin
    secretName: tesserix-postgres-tesserix-admin
  mark8ly:
    enabled: true
    host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
    port: 5432
    secretName: mark8ly-platform-admin

# ConfigMap for additional configuration
configMap:
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  enabled: true
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "64Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

# GCP Secret Manager configuration
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "tesserix"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# RBAC for cross-namespace operations
rbac:
  rolloutRestart:
    enabled: true
    namespaces:
      - tesserix
