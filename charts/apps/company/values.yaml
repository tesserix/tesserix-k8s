# Default values for company (Tesserix Homepage & Admin Portal)
replicaCount: 1

# Cloud Run routing — when enabled, VirtualService routes to Cloud Run
# instead of K8s services. Set in values-prod.yaml.
cloudRun:
  enabled: false
  frontend:
    host: ""
    port: 443
  authBff:
    host: ""
    port: 443

image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io — see
  # docs/artifact-registry-mirror.md.
  #
  # Tag is a per-commit SHA tag. CI's "set image" step on every push
  # to main updates this manifest with the new tag, mirroring the
  # mark8ly-admin chart pattern. Avoid `latest` because the GAR
  # remote-repo proxy doesn't accept write/move operations from
  # gcloud, so a stale `latest` digest can't be rolled forward
  # without going through GHCR.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-home
  pullPolicy: IfNotPresent
  tag: "main-5f1ac14"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  # Istio sidecar configuration - wait for proxy before starting app
  # Exclude GCP metadata server from Istio for Workload Identity
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Kong ingress DISABLED 2026-07-26. Kong is decommissioned: there are zero
# Kong pods and no IngressClass resources in the cluster, so nothing ever
# populated status.loadBalancer and ArgoCD reported the app Progressing
# forever. Routing is Istio VirtualService + the shared gateway, the same
# way observability.tesserix.app works.
ingress:
  enabled: false
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: company.tesserix.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: company-tls
      hosts:
        - company.tesserix.app

  # Backend services exposed via ingress (if needed)
  backendServices: []

# Memory only — no CPU requests/limits per project convention. KEDA/HPA CPU
# triggers are disabled in this chart; memory-based scaling only.
resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetMemoryUtilizationPercentage: 80

# KEDA ScaledObject configuration
keda:
  enabled: true
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

nodeSelector: {}
tolerations: []
affinity: {}

# Environment configuration
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Site URL
  NEXT_PUBLIC_SITE_URL: "https://company.tesserix.app"

  # Public onboarding URL (for "Start your free year" CTA)
  NEXT_PUBLIC_ONBOARDING_SITE_URL: "https://mark8ly.com"

  # Session cookie name. Tesserix-home now mints its own JWE-encrypted
  # session cookie via the self-hosted Google OAuth flow at /auth/login
  # → /auth/callback. auth-bff is no longer involved for super-admin
  # login. Cookie domain is .tesserix.app via SESSION_COOKIE_DOMAIN.
  SESSION_COOKIE_NAME: "tx_session"
  SESSION_COOKIE_DOMAIN: ".tesserix.app"

  # Self-hosted OAuth redirect URI. Must be added to the Google OAuth
  # client's "Authorized redirect URIs" in GCP Console:
  #   APIs & Services → Credentials → OAuth 2.0 Client IDs → tesserix
  #   client → Authorized redirect URIs → add "https://tesserix.app/auth/callback".
  OAUTH_REDIRECT_URI: "https://tesserix.app/auth/callback"

  # Email allowlist for super-admin login. Comma-separated, case-insensitive.
  # An empty value FAILS CLOSED (everyone rejected) so a misconfigured
  # chart can't silently let the world in.
  ALLOWED_ADMIN_EMAILS: "mahesh.sangawar@gmail.com,samyak.rout@gmail.com,unidevidp@gmail.com"

  # Origins permitted to issue cookie-authenticated writes to this app's API.
  #
  # The platform console calls /api/admin/* server-side, forwarding the
  # operator's session cookie so the reply is attributed to the human who wrote
  # it rather than to a service account. A server-to-server request carries no
  # browser Origin, and evaluateCsrf blocks a cookie-bearing mutation that has
  # neither Origin nor Referer — so the console sends its own public origin and
  # this declares that origin trusted.
  #
  # This is an allowlist, not a bypass: the check still runs, and any origin not
  # named here (or matching this app's own host) is still refused. Adding an
  # entry here is granting write access to this API — treat it as such.
  #
  # Retires with apps/web's admin: once the console owns these surfaces, there
  # is no cross-origin write to permit.
  CSRF_ALLOWED_DOMAINS: "console.tesserix.app"

  # Google OAuth client (public — same client mark8ly uses). The matching
  # OAUTH_CLIENT_SECRET comes via ExternalSecret. Register the redirect
  # URI (OAUTH_REDIRECT_URI above) under "Authorized redirect URIs"
  # in GCP Console for this client before deploy.
  OAUTH_CLIENT_ID: "849928263410-eq63i2v34j61mbaghf0opu9fubmrkqua.apps.googleusercontent.com"

  # Google OAuth client ids whose id_tokens the mobile admin sign-in accepts
  # (/api/auth/mobile/google verifies the id_token `aud` against this list).
  # Comma-separated, public client ids (no secret). Includes:
  #   - the NEW native iOS client (bundle app.tesserix.admin) — the `aud` a
  #     standalone/dev iOS build's id_token actually carries, so it MUST be here;
  #   - the reused web client above — the id_token `aud` when signing via the web
  #     client (also already covered by the OAUTH_CLIENT_ID fallback in the route).
  # If unset, /api/auth/mobile/google returns 503 "mobile sign-in is not configured".
  GOOGLE_MOBILE_CLIENT_IDS: "849928263410-rbk6kuskqgurberff8ppl5enqdn9b0ph.apps.googleusercontent.com,849928263410-eq63i2v34j61mbaghf0opu9fubmrkqua.apps.googleusercontent.com"

  # NOTE: legacy mark8ly per-microservice URLs (auth-bff, tenant-service,
  # tickets, settings, subscription, audit, status-dashboard, feature-flags,
  # notification, tenant-onboarding) were removed when the legacy stack was
  # retired. The company portal that consumed them needs to be re-pointed
  # at the new mark8ly v2 platform-api once the company-side features that
  # depend on them are reimplemented.

  # ArgoCD (for release management sync)
  ARGOCD_API_URL: "http://argocd-server.argocd.svc.cluster.local"

  # Trust K8s cluster CA for in-cluster API calls
  NODE_EXTRA_CA_CERTS: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

  # Prometheus and OpenCost — for the per-product/per-tenant resource and
  # cost dashboards under /admin/apps/<product>. In-cluster services, no
  # auth required (Prometheus is open within mesh; OpenCost is reachable
  # once the network-policy egress allows opencost namespace, see
  # templates/network-policy.yaml).
  PROMETHEUS_URL: "http://prometheus-server.monitoring"
  OPENCOST_URL: "http://opencost.opencost:9003"

# External Secrets Configuration (GCP Secret Manager → K8s Secrets)
externalSecrets:
  enabled: true
  secretStoreRef: "gcp-secret-store"

# Otto support-chat. The /api/otto proxy in tesserix-home forwards to this
# shared otto in support-platform; OTTO_INTERNAL_AUTH is synced via the
# ExternalSecret. The realtime WS/SSE path is routed directly to otto by the
# VirtualService.
otto:
  url: "http://support-platform-otto.support-platform.svc.cluster.local:8089"
  sessionCookie: "otto_session_tesserix"

# Database connections.
# - `tesserix`: this app's own Postgres (tesserix-postgres CNPG cluster
#   in the tesserix namespace). Owns leads + apps registry.
# - `mark8ly`: cross-namespace elevated read/write into mark8ly's CNPG
#   cluster as the mark8ly_platform_admin role (CRUD, NOT superuser/DDL —
#   see tesserix-k8s/docs/cross-db-admin.md).
# Each block is opt-in via .enabled so the chart still renders for
# environments without the role/secret yet.
database:
  tesserix:
    enabled: true
    host: tesserix-postgres-rw.tesserix.svc.cluster.local
    port: 5432
    name: tesserix_admin
    secretName: tesserix-postgres-tesserix-admin
  mark8ly:
    enabled: true
    host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
    port: 5432
    secretName: mark8ly-platform-admin
  # Home Chef super-admin (CRUD, no DDL) for the tesserix-home payout/orders/
  # delivery admin pages. KEEP enabled:false until the homechef_platform_admin
  # role + GCP secret + the `homechef-platform-admin` ExternalSecret exist — see
  # Home-Chef-App/docs/ops/CUTOVER-RUNBOOK.md §1. Flip to true in the same change
  # that adds the ExternalSecret, then cut a tesserix-home release.
  homechef:
    enabled: true  # role + GCP secret + ExternalSecret provisioned 2026-06-12
    host: homechef-postgres-rw.homechef.svc.cluster.local
    port: 5432
    name: homechef_db
    secretName: homechef-platform-admin

# OTel ClickHouse for the platform Observability page — read-only service
# health/traces. URL is the in-cluster service; password from the
# tesserix-clickhouse-otel ExternalSecret.
#
# Was clickhouse-otel.observability, which is decommissioned — no such Service
# exists in the namespace, so every read from this page failed. PR #97 in
# tesserix-home moved the CODE default to clickhouse.observability and
# deliberately left the chart alone (committing here auto-deploys), which left
# the two disagreeing silently. This is the other half (tesserix-home#106).
#
# Verified before changing: `clickhouse` is Running in observability, and the
# credential in tesserix-clickhouse-otel authenticates against it
# (`SELECT 1` over 8123 as `default` returns 1).
clickhouseOtel:
  enabled: true
  url: http://clickhouse.observability.svc.cluster.local:8123
  user: default
  secretName: tesserix-clickhouse-otel

# ConfigMap for additional configuration
configMap:
  data: {}

# Vertical Pod Autoscaler configuration
vpa:
  # Disabled: VPA was down-sizing the pod to 2m cpu / 83Mi memory based
  # on historical usage that predated the new Next.js admin pages, which
  # left the pod unable to serve requests (every external call timed
  # out). The KEDA memory trigger handles real load now; VPA is moot.
  enabled: false
  updateMode: "InPlaceOrRecreate"
  minAllowed:
    memory: "256Mi"
  maxAllowed:
    memory: "1Gi"
  excludeIstioProxy: true

# GCP Secret Manager configuration
gcp:
  projectId: ""  # Inherited from global-config.yaml if empty
  namespace: "tesserix"
  workloadIdentity:
    gcpServiceAccount: ""
  secretManager:
    secretPrefix: "devtest"

# M1 — synthetic uptime probe driver. CronJob in this namespace fires
# a curl at the company pod's /api/internal/uptime/probe endpoint on
# the configured schedule, which actually runs the probes and persists
# results into tenant_uptime_probes. Disable by setting enabled=false.
uptimeProbe:
  enabled: true
  # Every 5 minutes — matches the per-probe rolling window assumed by
  # the /admin/uptime page's "24h uptime" calculation.
  schedule: "*/5 * * * *"
  # Hard cap on the trigger Job's lifetime. The probe sweep itself
  # uses a 5s per-target timeout in lib/uptime/runner.ts, so a sweep
  # of N tenants finishes well under this even when half are down.
  timeoutSeconds: 90
  # Curl timeout — generous so a slow first-tenant doesn't fail the
  # whole sweep. Must be ≤ timeoutSeconds.
  curlTimeoutSeconds: 75

# RBAC for cross-namespace operations
rbac:
  rolloutRestart:
    enabled: true
    namespaces:
      - tesserix

# Page-view analytics via the self-hosted OpenPanel at analytics.tesserix.app.
# The client ID is a public write key, so it lives in a Secret only because the
# project-init job is what mints it — nothing here is confidential.
openpanel:
  enabled: true
  secretName: openpanel-client-ids
  clientIdKey: tesserix-home-client-id
  apiUrl: https://analytics.tesserix.app/api
  scriptUrl: https://analytics.tesserix.app/op1.js
