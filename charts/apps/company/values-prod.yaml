# Production overrides for company (Tesserix Homepage & Admin Portal)

image:
  repository: ghcr.io/tesserix/tesserix-home
  tag: "latest"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 2

# Production resource allocation - handles Next.js SSR
resources:
  limits:
    memory: 1Gi
  requests:
    memory: 512Mi

# Cloud Run routing — disabled. Legacy mark8ly Cloud Run hosts removed
# along with the legacy stack.
cloudRun:
  enabled: false

# Production environment
env:
  NODE_ENV: "production"

  # Production site URL
  NEXT_PUBLIC_SITE_URL: "https://tesserix.app"

  # Public onboarding URL (for "Start your free year" CTA)
  NEXT_PUBLIC_ONBOARDING_SITE_URL: "https://mark8ly.com"

  # NOTE: legacy mark8ly per-microservice URLs (auth-bff, tenant-service,
  # tickets, settings, subscription, audit, status-dashboard, feature-flags,
  # notification, tenant-onboarding) were removed when the legacy stack was
  # retired. The company portal that consumed them needs to be re-pointed
  # at the new mark8ly v2 platform-api once the company-side features that
  # depend on them are reimplemented.

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

# KEDA autoscaling - production
keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"company\"}[2m]))"
    requestRateThreshold: "50"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1
