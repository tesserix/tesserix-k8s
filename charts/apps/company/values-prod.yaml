# Production overrides for company (Tesserix Homepage & Admin Portal)

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-home
  tag: "latest"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 1

# Production resource allocation — memory only per project convention.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 1Gi

# Cloud Run routing — disabled. Legacy mark8ly Cloud Run hosts removed
# along with the legacy stack.
cloudRun:
  enabled: false

# Production environment
env:
  NODE_ENV: "production"

  # Production site URL
  NEXT_PUBLIC_SITE_URL: "https://tesserix.app"

  # Public onboarding URL (for "Start your free year" CTA)
  NEXT_PUBLIC_ONBOARDING_SITE_URL: "https://mark8ly.com"

  # HomeChef/Fe3dr admin → HomeChef Go API base URL (in-cluster). The admin
  # section signs requests to ${HOMECHEF_API_URL}/api/v1/admin/* as a trusted
  # BFF (HMAC key from HOMECHEF_BFF_HMAC_KEY in the -secrets ExternalSecret).
  HOMECHEF_API_URL: "http://homechef-api-direct.homechef.svc.cluster.local:8080"

  # kora-api's ClusterIP Service (charts/apps/kora-api service.nameOverride).
  # In-cluster and therefore NOT through the Istio gateway, so no Firebase JWT
  # is involved — the HMAC signature is the whole credential.
  KORA_API_URL: "http://kora-api-direct.kora.svc.cluster.local:8080"

  # NOTE: legacy mark8ly per-microservice URLs (auth-bff, tenant-service,
  # tickets, settings, subscription, audit, status-dashboard, feature-flags,
  # notification, tenant-onboarding) were removed when the legacy stack was
  # retired. The company portal that consumed them needs to be re-pointed
  # at the new mark8ly v2 platform-api once the company-side features that
  # depend on them are reimplemented.

# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

# KEDA autoscaling - production
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"company\"}[2m]))"
    requestRateThreshold: "50"
  triggers:
    # cpu trigger removed: Next.js SSR cpu usage is bursty and unrelated
    # to actual request load. Memory tracks load more reliably for this app.
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget — no minAvailable: with a single replica,
# minAvailable: 1 pins disruptionsAllowed at 0 and blocks every node
# drain/scale-down. The template falls back to maxUnavailable: 1.
pdb:
  enabled: true
