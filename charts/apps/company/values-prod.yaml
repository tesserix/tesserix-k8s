# Production overrides for company (Tesserix Homepage & Admin Portal)

image:
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/tesserix-home
  tag: "latest"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

# Two, not one. tesserix.app is the admin portal, and a single replica meant
# every deploy served "no healthy upstream" for as long as the new image took to
# pull — measured at 3m11s on a cold tag.
replicaCount: 2

# Zero-downtime rollout. maxUnavailable 0 keeps the old pod serving until the new
# one is READY, and maxSurge 1 allows the extra pod needed to do that.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Both replicas landed on one node without this, so a node drain still took the
# whole site down. Preferred rather than required: with 5 nodes it spreads in
# practice, but a hard rule would leave the surge pod unschedulable during a
# rollout if only one node had room.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: company

# Readiness is what makes the above mean anything: without it a pod counts as
# available the moment the container starts, so the rollout would swap traffic
# onto a Next.js server that is not listening yet and 503 exactly as before.
readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Liveness restarts a wedged pod. Deliberately slower and more forgiving than
# readiness — a slow response should take a pod out of rotation, not kill it.
livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

# Production resource allocation — memory only per project convention.
resources:
  requests:
    memory: 512Mi
  limits:
    memory: 1Gi

# Cloud Run routing — disabled. Legacy mark8ly Cloud Run hosts removed
# along with the legacy stack.
cloudRun:
  enabled: false

# Production environment
env:
  NODE_ENV: "production"

  # Production site URL
  NEXT_PUBLIC_SITE_URL: "https://tesserix.app"

  # Public onboarding URL (for "Start your free year" CTA)
  NEXT_PUBLIC_ONBOARDING_SITE_URL: "https://mark8ly.com"

  # HomeChef/Fe3dr admin → HomeChef Go API base URL (in-cluster). The admin
  # section signs requests to ${HOMECHEF_API_URL}/api/v1/admin/* as a trusted
  # BFF (HMAC key from HOMECHEF_BFF_HMAC_KEY in the -secrets ExternalSecret).
  HOMECHEF_API_URL: "http://homechef-api-direct.homechef.svc.cluster.local:8080"

  # kora-api's ClusterIP Service (charts/apps/kora-api service.nameOverride).
  # In-cluster and therefore NOT through the Istio gateway, so no Firebase JWT
  # is involved — the HMAC signature is the whole credential.
  KORA_API_URL: "http://kora-api-direct.kora.svc.cluster.local:8080"

  # NOTE: legacy mark8ly per-microservice URLs (auth-bff, tenant-service,
  # tickets, settings, subscription, audit, status-dashboard, feature-flags,
  # notification, tenant-onboarding) were removed when the legacy stack was
  # retired. The company portal that consumed them needs to be re-pointed
  # at the new mark8ly v2 platform-api once the company-side features that
  # depend on them are reimplemented.

# Production GCP configuration
gcp:
  # Overrides the shared default from global-config-prod.yaml
  # (app-secrets-marketplace-prod), which that file's own comment invites:
  # "override per namespace in ArgoCD apps".
  #
  # Two reasons this override exists.
  #
  # 1. It was BROKEN. The KSA tesserix/company carried the shared GSA's
  #    annotation, but that GSA's roles/iam.workloadIdentityUser binding listed
  #    42 members and none from the tesserix namespace — so the KSA was
  #    annotated to impersonate an account that did not trust it back. Every
  #    call 403'd with "Permission 'iam.serviceAccounts.getAccessToken'
  #    denied", and the Kora overview reported "AI keys configured: 0" under a
  #    hint reading "should be 2" while both keys were present and kora-api
  #    (which refuses to boot without them) was serving traffic.
  #
  # 2. The shared GSA is wildly over-scoped for this. It holds PROJECT-LEVEL
  #    roles/secretmanager.admin — admin over every secret in
  #    tesseracthub-480811, including mark8ly's and homechef's — to support a
  #    portal feature that reads two secrets' version metadata.
  #
  # kora-key-health-prod holds roles/secretmanager.viewer on exactly
  # prod-kora-gemini-api-key and prod-kora-openai-api-key. Note viewer, NOT
  # secretAccessor: lib/secrets/key-health.ts calls listSecretVersions and
  # never accessSecretVersion, so the portal cannot read a key's VALUE even if
  # someone later adds a "reveal" affordance — the IAM denies it, not just the
  # code. If Kora key ROTATION is ever built (see the 2026-08-05 spec), it
  # needs secretmanager.secretVersionAdder added here deliberately.
  #
  # The portal uses @google-cloud/secret-manager in exactly one file, so this
  # narrower account costs it no other capability.
  #
  # NOT yet codified in Terraform — the app-secrets-* accounts live in
  # tesserix-infra. Created out-of-band; fold into IaC to stop it drifting.
  workloadIdentity:
    gcpServiceAccount: "kora-key-health-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# KEDA autoscaling - production
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"company\"}[2m]))"
    requestRateThreshold: "50"
  triggers:
    # cpu trigger removed: Next.js SSR cpu usage is bursty and unrelated
    # to actual request load. Memory tracks load more reliably for this app.
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget — no minAvailable: with a single replica,
# minAvailable: 1 pins disruptionsAllowed at 0 and blocks every node
# drain/scale-down. The template falls back to maxUnavailable: 1.
pdb:
  enabled: true
