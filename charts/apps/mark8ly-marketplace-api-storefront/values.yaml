namespace: mark8ly
name: mark8ly-marketplace-api-storefront
# Kill switch for the order-refund payment-gateway wiring. "false" keeps
# storefront-initiated refunds (return-driven / paid-cancel auto-refund)
# dark. Prod stays "false" until UAT validates; UAT overlay flips to "true".
refundGatewayEnabled: "true"
# Auto reverse-pickup of delivered shipments on full refund/cancel. Creates a
# live carrier reverse pickup / return label; roll back by setting "false".
reversePickupEnabled: "true"
# Same image as mark8ly-marketplace-api-admin — one Go binary, two
# Deployment instances differentiated by MODE. See spec §14.8.
image:
  # Pulled via the in-region Artifact Registry mirror of ghcr.io to avoid
  # Cloud NAT data-processing charges on every image pull. See
  # docs/artifact-registry-mirror.md.
  repository: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-marketplace-api
  tag: "sha-493c3652c68d"
  pullPolicy: IfNotPresent
  migrateTarget: asia-south1-docker.pkg.dev/tesseracthub-480811/ghcr-remote/tesserix/mark8ly-marketplace-api
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
# Storefront serves anonymous read-only traffic; scales normally.
# The rate limiter is per-client-IP so replica multiplication is
# acceptable here (unlike admin where it's per-user and would leak).
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  # Floor of 2, deliberately, NOT a surge change.
  #
  # strategy is maxSurge:0 / maxUnavailable:1 — kept that way on purpose
  # (#709: cluster memory requests sit at 98-99%, so surging deadlocked
  # seven deployments on 2026-08-30). The cost that comment accepts is
  # downtime on a SINGLE-replica service, and with minReplicaCount:1 that
  # is exactly what every rollout did: the one pod was terminated before
  # its replacement started. Three deploys on 2026-09-21 took the
  # customer-facing path down three times in 51 minutes.
  #
  # A floor of 2 removes the outage without surging: one pod drains while
  # the other serves. Steady-state cost is one extra 128Mi request, not a
  # rollout-time burst, so it does not reintroduce the #709 deadlock.
  minReplicaCount: 2
  maxReplicaCount: 5
resources:
  requests:
    # Required by the KEDA cpu-utilization trigger.
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
# Shared CNPG role with the admin engine — both engines read/write the
# same database; they differ only in which Gin router they expose.
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_marketplace_api
  secretName: mark8ly-postgres-marketplace-api
  sslmode: require
mode: storefront
# Storefront trust-boundary shared secret — consumed by the storefront
# engine to validate requests from the mark8ly-storefront Next.js app
# before serving any response. See spec §13.1.2 + §14.8.
storefrontKey:
  secretName: mark8ly-marketplace-api-storefront-key
  secretKey: STOREFRONT_KEY
# ── Email (gift-card delivery + order documents) ───────────────────
# Same SendGrid/Resend pair as the admin engine. SendGrid primary,
# Resend always-on fallback via the platform-wide prod-resend-api-key.
sendgrid:
  secretName: mark8ly-sendgrid
  apiKeyKey: SENDGRID_API_KEY
  emailFrom: noreply@tesserix.app
resend:
  secretName: mark8ly-resend
  apiKeyKey: RESEND_API_KEY
# Email provider chain order. The named provider sends first; every other
# configured provider is its per-message fallback. Valid: resend | sendgrid
# (or a comma-separated preference list). Flip to sendgrid to restore
# SendGrid-primary — no code change needed.
email:
  primaryProvider: resend
# ── Service discovery ─────────────────────────────────────────────
fgaApiUrl: "http://mark8ly-openfga.mark8ly.svc.cluster.local:8080"
platformApiUrl: "http://mark8ly-platform-api.mark8ly.svc.cluster.local:8086"
# X-Internal-Auth header sent on outbound calls to platform-api's
# /internal/* endpoints (used by SlugCache to resolve store slug →
# store_id + tenant_id). Must match platform-api's INTERNAL_AUTH_SECRET.
# Required since mark8ly@889e595 gated platform-api /internal/* on the
# header — empty value here makes the entire /api/v1/storefront/stores/
# :slug/* surface 404 because every request short-circuits on the
# slug-resolution step.
platformApiSecret:
  secretName: mark8ly-platform-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
# Outbound X-Internal-Auth header for the storefront's own /api/internal/*
# routes — used by the invoice/receipt mailer to fetch the rendered PDF so it
# can attach it to the email. Empty disables the PDF fetcher entirely, so
# invoice emails silently ship link-only. Must match the storefront Next app's
# MARKETPLACE_INTERNAL_AUTH_SECRET (same secret object).
internalAuthSecret:
  secretName: mark8ly-marketplace-api-internal-auth
  secretKey: INTERNAL_AUTH_SECRET
customerSessionSecret:
  secretName: mark8ly-session
  secretKey: SESSION_ENCRYPT_KEY
encryptionKey:
  secretName: mark8ly-marketplace-api-encryption
  secretKey: ENCRYPTION_KEY
# ── P0: Security ─────────────────────────────────────────────────
corsAllowedOrigins: "https://*.mark8ly.com"
encryptionMode: "aes"
# Carrier credentials — OpenBao. Must match the admin variant exactly so
# both deployments read the same tenant secrets.
#
# The storefront never writes a credential, so this value does not change
# which secrets it can reach: ChainStore routes by reference prefix, and
# every stored reference is already bao://. Two things do change, and both
# are why this is set rather than left on gcpsm:
#   1. A gsm:// fall-through read is only counted when the primary backend
#      is bao (see ChainStore.Get). On gcpsm the storefront's fall-through
#      reads are invisible to carriersecrets_events_total, which would make
#      the phase-5 "counter is zero" evidence meaningless for this engine.
#   2. bao mode wraps the store in CachingStore (60s TTL); gcpsm does not.
carrierSecretStore: "bao"
gcpProjectId: "tesseracthub-480811"
# Merchant device push — checkout publishes new-order notifications here.
# Empty = publishing off. Delivery runs on the admin engine.
pushEventsTopic: "mp-merchant-push"
# Workload Identity → GCP SA. Carrier credentials now come from
# OpenBao, not GCP Secret Manager (mark8ly#621), and the SA's
# roles/secretmanager.admin binding has been revoked. The annotation
# is still required: the storefront publishes new-order notifications
# to Pub/Sub at checkout, which needs roles/pubsub.publisher on this
# SA.
gcpServiceAccount: "app-secrets-marketplace-prod@tesseracthub-480811.iam.gserviceaccount.com"
# ── Mobile support-chat bridge (#118) ─────────────────────────────
# GIP project for verifying mobile customers' Firebase ID tokens.
gipProjectId: "tesseracthub-480811"
# Shared otto in support-platform (same target as the Next.js apps).
# INTERNAL_AUTH_SECRET is synced into the mark8ly-otto K8s secret from
# GCP prod-support-platform-otto-internal-auth.
otto:
  serviceName: support-platform-otto
  serviceNamespace: support-platform
  servicePort: 8089
  secretName: mark8ly-otto
  secretKey: INTERNAL_AUTH_SECRET
  # Public WebSocket origin the mobile app dials for live chat. Routed
  # to otto by the *.mark8ly.com wildcard VirtualService's otto path rule.
  wsPublicBase: "wss://api.mark8ly.com"
# ── P1: Observability ────────────────────────────────────────────
metricsPort: 9090
# OpenTelemetry OTLP endpoint (in-cluster collector). Clearing it disables
# tracing/metrics export without a code change. Matches the admin deploy.
otel:
  exporterOtlpEndpoint: "http://otel-gateway.observability.svc.cluster.local:4317"
sentryDsn:
  secretName: mark8ly-sentry
  secretKey: SENTRY_DSN

# Replace before surging, so a rollout frees a pod's memory before it
# needs the replacement's (#709).
#
# The default is 25%/25%, which on a single-replica Deployment rounds to
# maxSurge=1, maxUnavailable=0: the new pod must SCHEDULE BEFORE the old
# one dies, so a roll needs double the pod's memory at once. On a cluster
# whose memory requests sit near 100% (while actual usage is around half
# that) the new pod pends forever and the rollout deadlocks — with the
# Deployment still reporting Available=True, because the old pod keeps
# serving. On 2026-08-30 that left seven mark8ly deployments stuck and
# production a day behind main, with nothing alerting.
#
# The cost is honest and accepted: on a single-replica service this is a
# brief 503 during each rollout, where surge-first gave none. Deploys that
# always complete are worth more than a few seconds of downtime on an
# operator-timed rollout. Same remedy as temporal (#538) and devai (#600).
#
# At 2+ replicas there is no downtime at all: one pod stays up while the
# other is replaced.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# 30 minutes, up from the Kubernetes default of 600s.
#
# A promotion updates all eight mark8ly apps at once and kubelet pulls
# images one at a time per node, so whichever app is last in that queue
# waits behind the rest. On 2026-09-23 platform-api's pull reported
# "6m16s (17m39s including waiting)": it blew the 600s deadline while the
# pull was still running, Argo reported "exceeded its progress deadline",
# the sync failed and the Kargo promotion errored — on a rollout that was
# progressing normally and went on to succeed. Any of the eight can draw
# that short straw, so the deadline is raised on all of them rather than
# only the one that did (#1068 raised platform-api first).
#
# The cost is honest: a genuinely stuck rollout now takes 30 minutes to be
# declared failed rather than 10. That is the right trade while a cold pull
# can legitimately take 18, and it should come back down once image pulls
# are fixed at the source — pre-pulling, parallel pulls on the node, or
# publishing to Artifact Registry directly instead of through the
# ghcr-remote pull-through cache.
progressDeadlineSeconds: 1800
