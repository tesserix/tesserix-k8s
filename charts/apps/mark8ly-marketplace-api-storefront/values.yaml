namespace: mark8ly
name: mark8ly-marketplace-api-storefront
# Same image as mark8ly-marketplace-api-admin — one Go binary, two
# Deployment instances differentiated by MODE. See spec §14.8.
image:
  repository: ghcr.io/tesserix/mark8ly-marketplace-api
  tag: "sha-d57ccc5c790f"
  pullPolicy: IfNotPresent
  migrateTarget: ghcr.io/tesserix/mark8ly-marketplace-api
imagePullSecrets:
  - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
# Storefront serves anonymous read-only traffic; scales normally.
# The rate limiter is per-client-IP so replica multiplication is
# acceptable here (unlike admin where it's per-user and would leak).
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
resources:
  requests:
    memory: 128Mi
  limits:
    memory: 512Mi
pdb:
  enabled: true
  maxUnavailable: 1
# Shared CNPG role with the admin engine — both engines read/write the
# same database; they differ only in which Gin router they expose.
database:
  host: mark8ly-postgres-rw.mark8ly.svc.cluster.local
  port: 5432
  name: mark8ly_marketplace_api
  secretName: mark8ly-postgres-marketplace-api
  sslmode: require
mode: storefront
# Storefront trust-boundary shared secret — consumed by the storefront
# engine to validate requests from the mark8ly-storefront Next.js app
# before serving any response. See spec §13.1.2 + §14.8.
storefrontKey:
  secretName: mark8ly-marketplace-api-storefront-key
  secretKey: STOREFRONT_KEY
# ── Service discovery ─────────────────────────────────────────────
fgaApiUrl: "http://mark8ly-openfga.mark8ly.svc.cluster.local:8080"
platformApiUrl: "http://mark8ly-platform-api.mark8ly.svc.cluster.local:8086"
customerSessionSecret:
  secretName: mark8ly-session
  secretKey: SESSION_ENCRYPT_KEY
# ── P0: Security ─────────────────────────────────────────────────
corsAllowedOrigins: "https://*.mark8ly.com"
encryptionMode: "noop"
# ── P1: Observability ────────────────────────────────────────────
metricsPort: 9090
sentryDsn:
  secretName: mark8ly-sentry
  secretKey: SENTRY_DSN
