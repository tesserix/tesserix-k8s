# UAT overlay for mark8ly-marketplace-api-storefront.
namespace: mark8ly-uat
name: mark8ly-uat-marketplace-api-storefront

keda:
  minReplicaCount: 1
  maxReplicaCount: 2
pdb:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 96Mi

database:
  host: mark8ly-uat-postgres-rw.mark8ly-uat.svc.cluster.local
  port: 5432
  name: mark8ly_marketplace_api
  secretName: mark8ly-uat-postgres-marketplace-api
  sslmode: require

storefrontKey:
  secretName: mark8ly-uat-marketplace-api-storefront-key
  secretKey: STOREFRONT_KEY

fgaApiUrl: "http://mark8ly-uat-openfga.mark8ly-uat.svc.cluster.local:8080"

# Cross-service secret references (matches paths in values.yaml).
platformInternalAuthSecret:
  secretName: mark8ly-uat-platform-api-internal-auth
sessionSecret:
  secretName: mark8ly-uat-session
encryptionKey:
  secretName: mark8ly-uat-marketplace-api-encryption
sentry:
  secretName: mark8ly-uat-sentry

# (correct key names — values.yaml uses these exact paths)
platformApiSecret:
  secretName: mark8ly-uat-platform-api-internal-auth
customerSessionSecret:
  secretName: mark8ly-uat-session
sentryDsn:
  secretName: mark8ly-uat-sentry
