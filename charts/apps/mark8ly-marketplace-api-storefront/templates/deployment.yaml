apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # NOTE: No migrate init container here. The marketplace-api-admin
      # chart runs migrations on every rollout; running the same migrations
      # from the storefront chart would either race-condition against admin
      # (if they roll at the same time) or double-apply no-ops. The server
      # itself still calls AssertVersion on startup and refuses to boot on
      # schema mismatch, so storefront pods stay down until admin has
      # finished migrating.

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: ENV
              value: "prod"
            - name: MODE
              value: {{ .Values.mode | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
            # Kill switch for the order-refund payment-gateway wiring.
            # Default "false" keeps refunds dark; flip per-environment via
            # refundGatewayEnabled in values (UAT true, prod gated on UAT).
            - name: REFUND_GATEWAY_ENABLED
              value: {{ .Values.refundGatewayEnabled | default "false" | quote }}
            # Kill switch for auto reverse-pickup of DELIVERED shipments on a
            # full refund/cancel (creates a live carrier reverse pickup /
            # return label). Default "false"; flip per-environment via
            # reversePickupEnabled in values.
            - name: REVERSE_PICKUP_ENABLED
              value: {{ .Values.reversePickupEnabled | default "false" | quote }}
            {{- if and .Values.otel .Values.otel.exporterOtlpEndpoint }}
            # OpenTelemetry — OTLP traces+metrics to the in-cluster collector
            # (internal/observability no-ops when empty). Shared image with
            # the admin deploy, which is instrumented identically.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint | quote }}
            {{- end }}
{{ include "mark8ly-marketplace-api-storefront.dbEnv" . | indent 12 }}
            - name: STOREFRONT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storefrontKey.secretName }}
                  key: {{ .Values.storefrontKey.secretKey }}
            # Email — the storefront engine sends gift-card deliveries and
            # order documents (invoices/receipts) too. SendGrid primary,
            # Resend always-on fallback; both optional so the pod starts
            # before the secrets sync (the engine then log-mails and warns).
            {{- if .Values.sendgrid }}
            # SENDGRID_API_KEY deliberately unset — the key is dead
            # ("401 Maximum credits exceeded") and setting it only put a
            # broken provider in the fallback chain. See the admin chart.
            - name: EMAIL_FROM
              value: {{ .Values.sendgrid.emailFrom | quote }}
            {{- end }}
            {{- if .Values.resend }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resend.secretName }}
                  key: {{ .Values.resend.apiKeyKey }}
                  optional: true
            {{- end }}
            # Orders the provider chain: the named provider sends first,
            # every other configured provider is its per-message fallback.
            # Flip to "sendgrid" to restore SendGrid-primary — config only.
            {{- if .Values.email }}
            - name: EMAIL_PRIMARY_PROVIDER
              value: {{ .Values.email.primaryProvider | quote }}
            {{- end }}
            # Service discovery
            - name: MARKETPLACE_FGA_API_URL
              value: {{ .Values.fgaApiUrl | quote }}
            - name: MARKETPLACE_PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            # Outbound X-Internal-Auth header for platform-api /internal/*
            # calls. Must match platform-api's INTERNAL_AUTH_SECRET; an
            # empty value would silently no-op the auth header and 401
            # every SlugCache call.
            - name: MARKETPLACE_PLATFORM_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformApiSecret.secretName }}
                  key: {{ .Values.platformApiSecret.secretKey }}
            # Outbound X-Internal-Auth for the storefront's own /api/internal/*
            # PDF render route. Empty disables the invoice/receipt PDF fetcher,
            # so those emails silently go out link-only (no attachment).
            - name: MARKETPLACE_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalAuthSecret.secretName }}
                  key: {{ .Values.internalAuthSecret.secretKey }}
            - name: CUSTOMER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerSessionSecret.secretName }}
                  key: {{ .Values.customerSessionSecret.secretKey }}
                  optional: true
            # P0: Security
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.corsAllowedOrigins | quote }}
            - name: ENCRYPTION_MODE
              value: {{ .Values.encryptionMode | quote }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryptionKey.secretName }}
                  key: {{ .Values.encryptionKey.secretKey }}
            # Per-tenant carrier credentials — GCP Secret Manager.
            - name: SHIPPING_SECRET_STORE
              value: {{ .Values.carrierSecretStore | default "inline" | quote }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcpProjectId | quote }}
            # Merchant device push — storefront checkout publishes new-order
            # notifications to this topic; delivery runs on the admin engine.
            - name: MARKETPLACE_PUSH_TOPIC
              value: {{ .Values.pushEventsTopic | default "" | quote }}
            - name: SECRET_NAME_PREFIX
              value: {{ .Values.carrierSecretPrefix | default "mark8ly-dev" | quote }}
            # P1: Observability
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            {{- if .Values.sentryDsn }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sentryDsn.secretName }}
                  key: {{ .Values.sentryDsn.secretKey }}
                  optional: true
            {{- end }}
            # GIP project — verifies mobile customers' Firebase ID tokens
            # for the support-chat BFF (#118). Empty disables the mount.
            - name: GIP_PROJECT_ID
              value: {{ .Values.gipProjectId | quote }}
            # Otto support-chat bridge (mobile BFF #118). Same shared otto +
            # INTERNAL_AUTH_SECRET the Next.js apps use; optional so the
            # support routes degrade to 503 when otto isn't wired.
            - name: OTTO_URL
              value: "http://{{ .Values.otto.serviceName }}.{{ .Values.otto.serviceNamespace }}.svc.cluster.local:{{ .Values.otto.servicePort }}"
            - name: OTTO_INTERNAL_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otto.secretName }}
                  key: {{ .Values.otto.secretKey }}
                  optional: true
            - name: OTTO_WS_PUBLIC_BASE
              value: {{ .Values.otto.wsPublicBase | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
