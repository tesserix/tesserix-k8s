apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.keda.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: mark8ly
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.name }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # NOTE: No migrate init container here. The marketplace-api-admin
      # chart runs migrations on every rollout; running the same migrations
      # from the storefront chart would either race-condition against admin
      # (if they roll at the same time) or double-apply no-ops. The server
      # itself still calls AssertVersion on startup and refuses to boot on
      # schema mismatch, so storefront pods stay down until admin has
      # finished migrating.

      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENV
              value: "prod"
            - name: MODE
              value: {{ .Values.mode | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
{{ include "mark8ly-marketplace-api-storefront.dbEnv" . | indent 12 }}
            - name: STOREFRONT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storefrontKey.secretName }}
                  key: {{ .Values.storefrontKey.secretKey }}
            # Service discovery
            - name: MARKETPLACE_FGA_API_URL
              value: {{ .Values.fgaApiUrl | quote }}
            - name: MARKETPLACE_PLATFORM_API_URL
              value: {{ .Values.platformApiUrl | quote }}
            - name: CUSTOMER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customerSessionSecret.secretName }}
                  key: {{ .Values.customerSessionSecret.secretKey }}
                  optional: true
            # P0: Security
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.corsAllowedOrigins | quote }}
            - name: ENCRYPTION_MODE
              value: {{ .Values.encryptionMode | quote }}
            # P1: Observability
            - name: METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            {{- if .Values.sentryDsn }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sentryDsn.secretName }}
                  key: {{ .Values.sentryDsn.secretKey }}
                  optional: true
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
