apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: mark8ly
  {{- with .Values.gcpServiceAccount }}
  annotations:
    # Workload Identity → GCP SA. Required so the storefront can
    # read carrier credentials from GCP Secret Manager during
    # /checkout/shipping-rates, payment-methods etc.
    iam.gke.io/gcp-service-account: {{ . | quote }}
  {{- end }}
