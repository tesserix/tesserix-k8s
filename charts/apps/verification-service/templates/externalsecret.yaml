{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "verification-service.fullname" . }}-secrets
  labels:
    {{- include "verification-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "verification-service.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: verifications-db-password
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: shared-internal-service-key
    - secretKey: API_KEY
      remoteRef:
        key: shared-internal-service-key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: verification-encryption-key
{{- end }}
