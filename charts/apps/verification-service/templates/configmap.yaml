{{- if .Values.knative.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "verification-service.fullname" . }}-config
  labels:
    {{- include "verification-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: {{ .Values.gcp.projectId | default "tesseracthub-480811" | quote }}
  DB_HOST: {{ .Values.database.host | default "postgresql.postgresql-global.svc.cluster.local" | quote }}
  DB_PORT: {{ .Values.database.port | default "5432" | quote }}
  DB_NAME: {{ .Values.database.name | default "verifications_db" | quote }}
  DB_USER: {{ .Values.database.user | default "postgres" | quote }}
  DB_SSLMODE: {{ .Values.database.sslmode | default "require" | quote }}
  DB_SSL_MODE: {{ .Values.database.sslmode | default "require" | quote }}
  PGSSLMODE: {{ .Values.database.sslmode | default "require" | quote }}
  PORT: "8080"
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
