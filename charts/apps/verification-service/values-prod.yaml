knative:
  enabled: true
  minScale: 0
  scaleToZeroDelay: "120s"

# Production overrides for verification-service

image:
  repository: ghcr.io/tesserix/verification-service
  tag: "1.3.3"
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

replicaCount: 0

# Production resource allocation
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 128Mi

# Production environment
env:
  GIN_MODE: "release"
  EMAIL_FROM: "no-reply@mark8ly.com"
  EMAIL_FROM_NAME: "Mark8ly"
  BASE_DOMAIN: "mark8ly.com"

# KEDA autoscaling - enabled for production
# Production GCP configuration
gcp:
  secretManager:
    secretPrefix: "prod"

keda:
  enabled: false
  minReplicaCount: 0
  maxReplicaCount: 0
  pollingInterval: 30
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://prometheus.monitoring.svc.cluster.local:9090"
    requestRateQuery: "sum(rate(istio_requests_total{destination_service_name=\"verification-service\"}[2m]))"
    requestRateThreshold: "30"
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"

# Pod Disruption Budget - enabled for production HA
pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreRef: gcp-secret-store
