apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocr-sandbox-bootstrap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-sandbox-bootstrap
data:
  bootstrap.py: |
    {{- .Files.Get "files/bootstrap.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ocr-sandbox-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app: ocr-sandbox-bootstrap}
    spec:
      serviceAccountName: ocr-sandbox-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrapImage }}
          command: [python3, /scripts/bootstrap.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {memory: 64Mi}, limits: {memory: 128Mi}}
          volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
      volumes: [{name: scripts, configMap: {name: ocr-sandbox-bootstrap}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocr-sandbox-bootstrap
spec:
  podSelector: {matchLabels: {app: ocr-sandbox-bootstrap}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.30.0.10/32}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openbao}}}]
      ports: [{port: 8200}, {port: 15008}]
