{{- /*
Path routing for helivanta.app, done AT THE INGRESS and not in the shell.

Dockerfile.shell bakes a rewrite table into the Next build (next.config.ts):
/api/:path* -> API_URL/:path*. That rewrite exists for `next dev`, where one
process fronts everything. Production deliberately bypasses it: /api/v1/ is
routed below, straight to the API, so a request never takes a Next.js hop it
does not need.

There are no zone routes and none are coming. MediCore, Pharmacy and Lab are
routes of the shell app itself since helivanta#933 (ADR-0010): one Next app,
one image, one Deployment. They reach the shell through the catch-all below,
like every other page. A product needing its own app again would be a new
decision with its own ADR, and would add its route here, ahead of the
catch-all.
*/ -}}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: helivanta
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helivanta-istio.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.host | quote }}
  gateways:
    {{- toYaml .Values.istio.gateways | nindent 4 }}
  http:
    {{- /* Narrowest first: Istio takes the first matching entry. */}}
    {{- with .Values.shell.reservedPrefixes }}
    # Next PAGES that live under /api and must never reach the Go backend —
    # /api/auth/callback is Zitadel's registered redirect_uri. See
    # values.yaml's shell.reservedPrefixes.
    - match:
        {{- range . }}
        - uri:
            prefix: {{ . | quote }}
        {{- end }}
      route:
        - destination:
            host: {{ $.Values.shell.service }}
            port:
              number: {{ $.Values.shell.port }}
      timeout: {{ $.Values.shell.timeout }}
    {{- end }}
    # Workload tokens are verified by the API, without a browser session.
    - match:
        - uri:
            exact: /api/internal/v1/hospital-enrolments
      rewrite:
        uri: /internal/v1/hospital-enrolments
      route:
        - destination:
            host: {{ .Values.api.service }}
            port:
              number: {{ .Values.api.port }}
      timeout: {{ .Values.api.timeout }}
    # THE PREFIX STRIP. {{ .Values.api.matchPrefix }} on the wire becomes
    # {{ .Values.api.rewritePrefix }} at the pod: rewrite.uri replaces the
    # matched prefix, so /api/v1/foo reaches the backend as /v1/foo, which is
    # where it mounts its routes. Without the rewrite the backend 404s every
    # call while the route itself looks correct.
    - match:
        - uri:
            prefix: {{ .Values.api.matchPrefix | quote }}
      rewrite:
        uri: {{ .Values.api.rewritePrefix | quote }}
      route:
        - destination:
            host: {{ .Values.api.service }}
            port:
              number: {{ .Values.api.port }}
      timeout: {{ .Values.api.timeout }}
    # Everything else is the shell's: pages, /_next/* assets, /login, /logout.
    # Same origin as the API above, which is the point — the session cookie is
    # first-party and CORS never enters the picture.
    - route:
        - destination:
            host: {{ .Values.shell.service }}
            port:
              number: {{ .Values.shell.port }}
      timeout: {{ .Values.shell.timeout }}
  exportTo:
    - "*"
