{{- /* CNPG requires a basic-auth secret with 'username' and 'password' keys */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.bootstrap.secret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.bootstrap.secret }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Without this CNPG never watches the secret, so a rotated
          # password silently never reaches the database role.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.bootstrap.owner | quote }}
        password: "{{ "{{" }} .password | trim {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.bootstrap.gcpSecretName }}
        version: latest
{{- range .Values.applicationRoles }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.clusterName }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .secret }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Without this CNPG never watches the secret, so a rotated
          # password silently never reaches the database role.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: {{ .name | quote }}
        password: "{{ "{{" }} .password | trim {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .gcpSecretName }}
        version: latest
{{- end }}
