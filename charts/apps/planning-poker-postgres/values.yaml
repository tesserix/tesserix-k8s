namespace: planning-poker
clusterName: planning-poker-postgres

# One primary and one standby; backup restore verified before rollout.
instances: 2
imageName: ghcr.io/cloudnative-pg/postgresql:16.4

storageSize: 10Gi
storageClass: standard-rwo-retain
walStorageSize: 2Gi

resources:
  requests:
    memory: 384Mi
  limits:
    memory: 1Gi

bootstrap:
  database: planning_poker_db
  owner: planning_poker

# The API talks to the -rw service directly, never a pooler: pgx prepares
# statements and PgBouncer in transaction mode drops them across a boundary
# (docs/postgres-cluster-policy.md).
postgresql:
  max_connections: "100"
  shared_buffers: "128MB"
  effective_cache_size: "512MB"
  work_mem: "8MB"
  maintenance_work_mem: "64MB"
  ssl_min_protocol_version: "TLSv1.3"
  ssl_max_protocol_version: "TLSv1.3"
  idle_in_transaction_session_timeout: "300000"
  statement_timeout: "120000"
  random_page_cost: "1.1"
  effective_io_concurrency: "200"

monitoring:
  enablePodMonitor: true

affinity:
  podAntiAffinityType: required

# Workload Identity is declared in stacks/06-workload-identity/planning-poker-database.tf.
backup:
  enabled: true
  destinationPath: "gs://tesseract-prod-backups-in/planning-poker-postgres"
  retentionPolicy: "3d"
  serviceAccount: "app-secrets-infra-prod@tesseracthub-480811.iam.gserviceaccount.com"
  schedule: "0 20 3 * * *"

istio:
  enabled: true

networkPolicy:
  enabled: true
