apiVersion: apps/v1
kind: Deployment
metadata:
  name: portkey-gateway
  labels: { app: portkey-gateway, app.kubernetes.io/part-of: local-infra }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: portkey-gateway }
  template:
    metadata:
      labels: { app: portkey-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: {{ .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          readinessProbe:
            tcpSocket: { port: {{ .Values.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: {{ .Values.port }} }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Memory-only resources (platform policy).
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portkey-gateway
  labels: { app: portkey-gateway, app.kubernetes.io/part-of: local-infra }
spec:
  selector: { app: portkey-gateway }
  ports:
    - { name: http, port: {{ .Values.port }}, targetPort: {{ .Values.port }} }
