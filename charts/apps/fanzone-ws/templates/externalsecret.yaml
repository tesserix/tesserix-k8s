{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fanzone-ws.fullname" . }}-secrets
  labels:
    {{- include "fanzone-ws.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | default "gcp-secret-store" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "fanzone-ws.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- if .Values.nats.auth.enabled }}
    # NATS FANZONE-account credentials (.creds) for operator/JWT auth
    # (Home-Chef-App#758-fanzone). Mounted as a file; read via NATS_CREDS.
    - secretKey: NATS_CREDS_FILE
      remoteRef:
        key: {{ printf "%s-nats-creds-fanzone" .Values.gcp.secretManager.secretPrefix }}
    {{- end }}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ printf "%s-fanzone-anthropic-api-key" .Values.gcp.secretManager.secretPrefix }}
{{- end }}
