# Production overrides for fanzone-ws (WebSocket service)
# Migrated to Knative Serving (scale-to-zero)

# Knative replaces Deployment + HPA + KEDA
knative:
  enabled: true
  minScale: 0
  maxScale: 5
  scaleDownDelay: "60s"
  concurrencyTarget: 100
  containerConcurrency: 0
  timeoutSeconds: 3600  # Long timeout for WebSocket connections

# Disable HPA and KEDA (Knative handles autoscaling)
autoscaling:
  enabled: false

keda:
  enabled: false

# PDB not needed — Knative manages pod lifecycle
podDisruptionBudget:
  enabled: false

# Production resource allocation - scaled for high concurrency WS workloads
resources:
  limits:
    memory: 2Gi
  requests:
    memory: 512Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
