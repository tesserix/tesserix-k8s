# Production overrides for fanzone-ws (WebSocket service)

image:
  pullPolicy: IfNotPresent


# Disable HPA and KEDA (Knative handles autoscaling)
autoscaling:
  enabled: false

keda:
  enabled: false

# PDB not needed — Knative manages pod lifecycle
podDisruptionBudget:
  enabled: false

# Production resource allocation - scaled for high concurrency WS workloads
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 64Mi

# Production environment
env:
  GIN_MODE: "release"
  LOG_LEVEL: "warn"

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"
