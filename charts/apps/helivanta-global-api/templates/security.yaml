apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: helivanta-global-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helivanta-global-api
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: helivanta-global-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helivanta-global-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-ingress/sa/istio-ingressgateway
              - cluster.local/ns/{{ .Release.Namespace }}/sa/helivanta-shell
      to:
        - operation:
            ports: ["{{ .Values.service.port }}"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: helivanta-global-api-to-owner
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helivanta-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ .Release.Namespace }}/sa/helivanta-global-api
      to:
        - operation:
            ports: ["8080"]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: helivanta-global-api-owner
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helivanta-api
  mtls:
    mode: STRICT
{{- if .Values.enforceOwnerBoundary }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: helivanta-owner-requires-global-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helivanta-api
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/{{ .Release.Namespace }}/sa/helivanta-global-api
      to:
        - operation:
            ports: ["8080"]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helivanta-global-api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helivanta-global-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: helivanta-shell
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        - protocol: TCP
          port: 15008
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: helivanta-api
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
