namespace: support-platform

# python:3.12-slim + pgvector + httpx is enough to call the embedder
# and write rows. Job runs to completion in seconds for the starter
# content; image is pulled once and reused for every re-seed.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi

# Service URLs inside the cluster — match the existing slm-router env.
embedderURL: http://support-platform-embedder.support-platform.svc.cluster.local:8001
postgresHost: support-platform-postgres-rw.support-platform.svc.cluster.local
postgresPort: 5432
postgresUser: support_platform
postgresDB: support_platform
postgresPasswordSecret: support-platform-postgres-app
postgresPasswordKey: password

# Per-tenant starter content. Each key is the slm-router rag_namespace,
# value is a list of {id, text, metadata} entries. Real product
# documentation is layered on top later — this is just enough so the
# SLM's first answer cites SOMETHING from each tenant.
content:
  # ==========================================================================
  # platform — admin <-> Tesserix-employee help surface. Knowledge is
  # platform-operations level (billing, store setup, KYC, downtime).
  # No MCP; everything the SLM answers comes from here. ESCALATION
  # threshold is high so anything unfamiliar reaches a real employee.
  # ==========================================================================
  platform:
    - id: platform-overview
      text: |
        The Tesserix Platform support surface is for MERCHANT ADMINS
        (the owner/admin of a store), not end shoppers. Customers of
        a storefront use the Otto widget inside that storefront; the
        platform widget lives in the merchant's admin app under
        /support/platform and routes to Tesserix employees, not the
        merchant themselves.
      metadata: {section: "overview"}
    - id: platform-billing-cycle
      text: |
        ISSUE: "When is my Tesserix invoice charged?"
        ANSWER: Tesserix invoices auto-charge on the calendar day the
        store was activated, every month, in the store's default
        currency. The card on file is charged at 00:05 UTC. If the
        primary card fails the platform retries the secondary
        payment method (if any) the next morning, then suspends the
        store after 3 failed attempts and emails the owner.
        ESCALATE: 3-attempt suspension already happened, OR card was
        charged but invoice shows unpaid.
      metadata: {section: "billing"}
    - id: platform-domain-takeover
      text: |
        ISSUE: "Custom domain is verified but storefront still shows the
        platform subdomain."
        ANSWER: Custom-domain takeover is a 2-step flow:
        (1) DNS records published + verified (status = verified) and
        (2) certificate provisioned. Cert issuance can take up to 15
        minutes after verification. If it's been longer, check the
        Tesserix Cert dashboard for the store's domain — if status is
        "pending DNS challenge" the CAA record may be blocking it.
        ESCALATE: cert pending >2 hours OR cert status = "failed".
      metadata: {section: "domains"}
    - id: platform-staff-invite
      text: |
        ISSUE: "Staff invitation email didn't arrive."
        ANSWER: Staff invites go through Tesserix's transactional email
        path (SendGrid). They expire in 7 days. The invitation email
        comes from staff@tesserix.app — ask the invitee to check spam
        and add the sender to their contacts. The owner can re-send
        the invitation from Settings -> Team without canceling first.
        ESCALATE: Resend doesn't arrive either, OR the invitee's
        domain has a strict DMARC reject policy.
      metadata: {section: "team"}
    - id: platform-incidents
      text: |
        ISSUE: "Storefront / admin is down — is it just me?"
        ANSWER: Check status.tesserix.app for current platform status.
        Component-level: storefront, admin, checkout, payment, and
        webhook delivery each have their own status. Acknowledged
        incidents post updates every 15 minutes. If status is green
        but you're seeing errors, capture the request ID from the
        admin's bottom-right footer and report it.
        ESCALATE: Status is green AND you can reproduce the error
        with a fresh request_id.
      metadata: {section: "incidents"}
    - id: platform-data-export
      text: |
        ISSUE: "How do I export all my store data?"
        ANSWER: Settings -> Data Export -> "Create export". The
        platform packages products, orders, customers, reviews and
        gift-cards into a single zipped CSV bundle and emails a
        signed S3 link valid for 7 days. Generation can take up to
        an hour for stores >10k orders. Customer PII is included only
        if the admin explicitly checks "Include PII" — that flag is
        audit-logged.
        ESCALATE: Export never arrives, OR a regulator is requesting
        data on the customer's behalf (GDPR Article 15 / DPA SAR).
      metadata: {section: "data"}
    - id: platform-payments-setup
      text: |
        ISSUE: "How do I connect Stripe / Razorpay to my store?"
        ANSWER: Settings -> Payments -> "Connect Stripe" (or Razorpay).
        Stripe uses OAuth — the customer is redirected to Stripe's
        Connect screen and back. Razorpay uses API key + secret entered
        directly. The platform encrypts the keys at rest. Test by
        placing a 1 INR / 1 USD order in test mode before going live.
        ESCALATE: OAuth callback fails repeatedly, OR live-mode payments
        report "Gateway not configured" despite the store admin
        confirming credentials are saved.
      metadata: {section: "payments"}
    - id: platform-kyc
      text: |
        ISSUE: "My store is in 'pending KYC' status."
        ANSWER: KYC is required before the platform processes live
        payouts. Owner needs to upload company registration, ID, and
        bank statement under Settings -> Compliance. Reviews take
        2-3 business days. The platform doesn't share KYC docs with
        third parties — they're stored in a separate compliance
        bucket with role-restricted access.
        ESCALATE: KYC submitted >5 business days ago with no decision,
        OR documents were rejected and the reason is unclear.
      metadata: {section: "kyc"}

  mark8ly:
    # ==== Overview =========================================================
    - id: mark8ly-overview
      text: |
        Mark8ly is a multi-tenant SaaS marketplace. Each store runs on its own
        subdomain (storename.mark8ly.com). Customers reach support via the chat
        bubble at the bottom-right of any storefront page. Common areas: account/
        sign-in, browsing, cart & checkout, payment, orders & shipping, returns
        & refunds, coupons, gift cards, reviews.
      metadata: {section: "overview"}

    # ==== Account & sign-in ================================================
    - id: mark8ly-account-session-expired
      text: |
        ISSUE: Session expired ("Your session has expired" or redirect to /login
        even right after signing in).
        CAUSE: HttpOnly session cookie reached its 24h expiry, browser cleared
        cookies, or customer is on a different store's subdomain.
        SOLUTION: Tell the customer to clear cookies and sign in again on the
        EXACT store subdomain shown in the URL (e.g. storename.mark8ly.com — not
        a sibling store's domain). Cookies are scoped per store.
        ESCALATE: Same-subdomain re-login still fails, OR shared browser session.
      metadata: {section: "account", issue_id: "session-expired"}
    - id: mark8ly-account-email-verify-expired
      text: |
        ISSUE: "This verification link is invalid or has expired."
        CAUSE: Email verification tokens are single-use and expire after 7 days.
        SOLUTION: Customer should click "Request a new verification email" on the
        signup or account page and check spam/junk. Each link can only be used once.
        ESCALATE: Original email never arrived AND resend doesn't either after 5min.
      metadata: {section: "account", issue_id: "email-verify-expired"}
    - id: mark8ly-account-password-reset-expired
      text: |
        ISSUE: Password reset link says "invalid or expired".
        CAUSE: Reset tokens are single-use and expire 1 hour after issue.
        SOLUTION: Re-enter email on the forgot-password page, request a fresh
        link, then use it within 1 hour.
        ESCALATE: Customer clicks reset within minutes and still gets "expired",
        or reset email never arrives.
      metadata: {section: "account", issue_id: "password-reset-expired"}
    - id: mark8ly-account-mfa-already-enabled
      text: |
        ISSUE: "MFA is already enabled — disable it first to re-enrol."
        CAUSE: Customer enrolled TOTP previously, reset their device, and is now
        trying to enrol again without disabling.
        SOLUTION: Account Settings → Security → Disable MFA (needs existing
        authenticator code), then re-enrol with the new device.
        ESCALATE: Lost access to the old authenticator and can't complete the
        disable flow — needs staff to reset MFA on the account.
      metadata: {section: "account", issue_id: "mfa-already-enabled"}
    - id: mark8ly-account-mfa-invalid-code
      text: |
        ISSUE: "Verification code is incorrect."
        CAUSE: Wrong 6-digit code, device clock skew, or code rotated mid-entry
        (codes change every 30s).
        SOLUTION: Wait 3-5 seconds for a fresh code, then re-enter. Ensure phone
        time is set to Auto (Settings → Date & Time).
        ESCALATE: Phone clock is correct and customer is using the right account
        in the authenticator app, but still rejected on multiple tries.
      metadata: {section: "account", issue_id: "mfa-invalid-code"}

    # ==== Browsing & search ================================================
    - id: mark8ly-browse-product-not-found
      text: |
        ISSUE: "I can't find the product I saw yesterday."
        CAUSE: Product was unpublished by the merchant, went out of stock, or
        the customer is on the wrong store's subdomain.
        SOLUTION: Search by exact product name or SKU. Confirm the store slug in
        the URL matches the original link. "In stock only" filters can hide
        unavailable items.
        ESCALATE: Customer has the exact name/SKU and recently bought it — the
        product may have been removed in error.
      metadata: {section: "browse", issue_id: "product-not-found"}
    - id: mark8ly-browse-store-not-found
      text: |
        ISSUE: "This store doesn't exist" / 404 on a store subdomain.
        CAUSE: Mistyped subdomain, store voluntarily closed, store suspended for
        billing, or subdomain was renamed.
        SOLUTION: Verify the URL with the store owner. Stores can be temporarily
        closed; the customer should retry later or contact the store directly.
        ESCALATE: Store admin says it should be live and customer URL is correct.
      metadata: {section: "browse", issue_id: "store-not-found"}

    # ==== Cart & checkout ==================================================
    - id: mark8ly-checkout-currency-mismatch
      text: |
        ISSUE: "Item currency does not match store currency" at checkout.
        CAUSE: Storefront sent the price in the wrong currency — usually a
        frontend cache issue.
        SOLUTION: Refresh the page and rebuild the cart. All item prices should
        be in the store's default currency (shown on product pages).
        ESCALATE: Persists after a hard refresh, or only happens for specific
        products on the same store.
      metadata: {section: "checkout", issue_id: "currency-mismatch"}
    - id: mark8ly-checkout-too-many-addresses
      text: |
        ISSUE: "You've reached the maximum of 5 saved addresses."
        CAUSE: v1 caps each customer at 5 saved shipping addresses.
        SOLUTION: Account → Saved Addresses → delete an unused address, then add
        the new one.
        ESCALATE: Never — this is enforced by design.
      metadata: {section: "checkout", issue_id: "too-many-addresses"}
    - id: mark8ly-checkout-idempotency-conflict
      text: |
        ISSUE: "Idempotency key was previously used with a different payload."
        CAUSE: Customer modified the cart (qty/price) and retried with the same
        idempotency key the frontend already used.
        SOLUTION: If an order exists, do not retry — they already have it. If
        not, start a fresh checkout so a new key is generated. Don't manually
        retry with the same key.
        ESCALATE: Two orders exist when the customer meant to place one, OR
        payment was charged twice.
      metadata: {section: "checkout", issue_id: "idempotency-conflict"}
    - id: mark8ly-checkout-address-validation-failed
      text: |
        ISSUE: "Shipping address is invalid" at checkout.
        CAUSE: Postal code format wrong for the country, missing required field
        (city/region/phone), or address not in the validation service's DB yet.
        SOLUTION: Confirm postal-code format (US 12345, India 123456 etc.). Fill
        every required field. Try slightly different spellings for very new
        addresses.
        ESCALATE: Address is verifiably correct but validation keeps rejecting.
      metadata: {section: "checkout", issue_id: "address-validation"}

    # ==== Payment ==========================================================
    - id: mark8ly-payment-gateway-not-configured
      text: |
        ISSUE: "Gateway not configured" or "Payment service unavailable" on the
        payment step.
        CAUSE: Store owner hasn't activated Stripe/Razorpay yet, or their
        encrypted gateway secrets are missing/corrupted.
        SOLUTION: Contact the store owner — checkout won't work on this store
        until they finish payment setup. Offer to come back once they confirm.
        ESCALATE: Store says they configured the gateway but customers still see
        the error.
      metadata: {section: "payment", issue_id: "gateway-not-configured"}
    - id: mark8ly-payment-razorpay-signature-mismatch
      text: |
        ISSUE: "Signature mismatch" / "Payment verification failed" after the
        Razorpay widget closes.
        CAUSE: Stale Razorpay config in the browser cache after the store rotated
        its webhook secret, or rarely, a corporate proxy tampering with the body.
        SOLUTION: Hard-refresh the browser (Cmd-Shift-R / Ctrl-Shift-R) and retry
        the payment. Customer wasn't debited — pending payments are released by
        the bank within minutes.
        ESCALATE: Hard refresh doesn't help, OR multiple customers on the same
        store report identical errors at once.
      metadata: {section: "payment", issue_id: "razorpay-signature"}

    # ==== Orders & shipping ================================================
    - id: mark8ly-order-cannot-cancel
      text: |
        ISSUE: "This order is not in a state where it can be cancelled."
        CAUSE: Order has shipped (carrier already has it), OR order is still
        "pending payment" (resolve payment or cancel from there, not the order
        page).
        SOLUTION: Orders cancel only between "paid" and "shipped". If shipped,
        customer should open a return after delivery instead.
        ESCALATE: Order is clearly not shipped but the cancel button is greyed,
        or customer has a receipt showing it was placed minutes ago.
      metadata: {section: "orders", issue_id: "cannot-cancel"}
    - id: mark8ly-order-no-shipping-rates
      text: |
        ISSUE: "Unable to calculate shipping rates" / no shipping options shown.
        CAUSE: PIN / postal code is outside the store's serviceable area, OR a
        required field is missing (India needs phone), OR address invalid.
        SOLUTION: Confirm the PIN code matches the country and that phone is
        filled for India. Check the store's shipping FAQ for supported regions.
        ESCALATE: A serviceable PIN returns no rates, or rates were previously
        available for the same PIN but now aren't.
      metadata: {section: "orders", issue_id: "no-shipping-rates"}
    - id: mark8ly-order-late-delivery
      text: |
        ISSUE: "My order is late, where is it?"
        CAUSE: Carrier delay (weather, ops, last-mile congestion). Tracking can
        also lag the actual location by 24-48h.
        SOLUTION: Share the tracking link on the order page. Delivery estimates
        are not guarantees — carrier delays of 2-5 days are common during peak.
        If tracking shows "out for delivery" but it doesn't arrive within 24h,
        come back and we'll escalate.
        ESCALATE: Marked "delivered" but never received, OR tracking stuck on
        "pending" for >7 days.
      metadata: {section: "orders", issue_id: "late-delivery"}
    - id: mark8ly-order-missing-or-damaged
      text: |
        ISSUE: "Item didn't arrive" or "Arrived broken."
        CAUSE: Missing-from-shipment, transit damage, wrong item picked, or
        delivered to the wrong address.
        SOLUTION: Open a return from the order page (Request Return), pick the
        matching reason, and attach photos if available. The store reviews and
        responds within 5 business days. Refund or replacement follows.
        ESCALATE: Return is rejected and customer disputes the assessment, OR
        package was visibly tampered (different sealing).
      metadata: {section: "orders", issue_id: "missing-or-damaged"}

    # ==== Returns & refunds ================================================
    - id: mark8ly-return-cant-return
      text: |
        ISSUE: "This order can't be returned in its current state."
        CAUSE: Returns only fire on shipped/delivered orders. Pending or
        cancelled orders use the cancel flow instead.
        SOLUTION: If the order hasn't shipped, use Cancel Order. If it has,
        Return becomes available after delivery is marked.
        ESCALATE: Order shipped >50 days ago and customer just noticed — store
        policy may need to be checked.
      metadata: {section: "returns", issue_id: "cant-return"}
    - id: mark8ly-return-already-open
      text: |
        ISSUE: "A return request already exists for this order."
        CAUSE: v1 only allows one open return per order at a time.
        SOLUTION: Customer should check the existing return's status. They can
        file another only after the first is resolved or rejected.
        ESCALATE: Customer needs to amend an open return (add items) — that
        path doesn't exist in v1 and needs a staff override.
      metadata: {section: "returns", issue_id: "already-open"}
    - id: mark8ly-return-rejected
      text: |
        ISSUE: "Your return was rejected."
        CAUSE: Item outside policy (custom / final-sale), return window expired,
        or item appears used / damaged by the customer.
        SOLUTION: Read the rejection reason in return details. If customer
        disagrees, ask them to reply with photos of the item's current condition
        and the store will review.
        ESCALATE: Rejection reason is vague, OR a refund was promised in writing.
      metadata: {section: "returns", issue_id: "rejected"}
    - id: mark8ly-return-refund-not-received
      text: |
        ISSUE: "I returned the item but no refund yet."
        CAUSE: Either still pending approval, OR approved within the last 10
        business days, OR refunded to wallet vs card.
        SOLUTION: Approved returns refund in 5-10 business days to the original
        payment method. Bank settlement adds 2-3 more days. Confirm the customer
        is checking the same card they paid with.
        ESCALATE: Approved >10 business days ago and nothing on the card, OR
        refund went to wallet without the customer's consent.
      metadata: {section: "returns", issue_id: "refund-not-received"}

    # ==== Vendor / multi-tenant ============================================
    - id: mark8ly-tenant-wrong-store
      text: |
        ISSUE: "I placed an order on Store A but it shows on Store B."
        CAUSE: Customer has accounts on both stores and signed in to the wrong
        one. Each store has its own account + order list — they don't bleed.
        SOLUTION: Sign out completely, clear cookies, sign back in on the SAME
        subdomain where the order was placed.
        ESCALATE: Customer has only one account and orders genuinely appear
        on a different store.
      metadata: {section: "tenant", issue_id: "wrong-store"}
    - id: mark8ly-tenant-store-closed
      text: |
        ISSUE: "This store doesn't exist" or "Store temporarily unavailable."
        CAUSE: Store owner paused/closed the store, store subscription expired,
        or subdomain was renamed.
        SOLUTION: Contact the store owner directly. The mark8ly platform doesn't
        force stores open.
        ESCALATE: Store owner says they did not close it.
      metadata: {section: "tenant", issue_id: "store-closed"}

    # ==== Coupons / discounts ==============================================
    - id: mark8ly-coupon-not-found
      text: |
        ISSUE: "Coupon CODE not found."
        CAUSE: Typo or wrong case — coupon codes are case-sensitive.
        SOLUTION: Copy-paste the code directly from the email/ad to avoid typos.
        ESCALATE: Customer has the email with the exact code and store confirms
        it should be valid.
      metadata: {section: "coupons", issue_id: "not-found"}
    - id: mark8ly-coupon-expired
      text: |
        ISSUE: "Coupon has expired."
        CAUSE: Past the campaign end date or the store ended the campaign early.
        SOLUTION: Ask the store for a replacement code if the original email
        promised a longer window.
        ESCALATE: Email explicitly says "valid until <future date>" but system
        says expired.
      metadata: {section: "coupons", issue_id: "expired"}
    - id: mark8ly-coupon-usage-limit
      text: |
        ISSUE: "Coupon has reached its usage limit."
        CAUSE: Store-set max total uses, or max uses per customer, has been hit.
        SOLUTION: This specific code is no longer redeemable. Ask the store for
        an alternate code.
        ESCALATE: Never — usage caps are working as intended.
      metadata: {section: "coupons", issue_id: "usage-limit"}
    - id: mark8ly-coupon-min-purchase
      text: |
        ISSUE: "Coupon requires a minimum purchase of X."
        CAUSE: Subtotal is below the minimum spend the coupon requires.
        SOLUTION: Add items so the cart subtotal hits the threshold. The discount
        applies automatically once you do.
        ESCALATE: Never — this is by design.
      metadata: {section: "coupons", issue_id: "min-purchase"}

    # ==== Gift cards / loyalty =============================================
    - id: mark8ly-giftcard-not-found
      text: |
        ISSUE: "Gift card not found."
        CAUSE: Wrong card number, copy-paste error, or store revoked the card.
        SOLUTION: Copy the number directly from the email/receipt. Confirm with
        the store if the card should still be valid.
        ESCALATE: Customer has the receipt and store confirms the card was
        issued.
      metadata: {section: "giftcard", issue_id: "not-found"}
    - id: mark8ly-giftcard-expired
      text: |
        ISSUE: "Gift card has expired."
        CAUSE: Past the expiry the store set when the card was issued.
        SOLUTION: If it was a promotional card the store may reissue — customer
        should ask. Purchased cards usually have longer windows.
        ESCALATE: Card expired recently and no expiry warning email was sent.
      metadata: {section: "giftcard", issue_id: "expired"}
    - id: mark8ly-giftcard-insufficient
      text: |
        ISSUE: "Gift card balance is too low to complete purchase."
        CAUSE: Prior redemptions reduced the balance below the order total.
        SOLUTION: Check the live balance on the store's gift-card balance page.
        Pay the difference with another method, or combine multiple cards.
        ESCALATE: Customer says the balance should be higher than shown.
      metadata: {section: "giftcard", issue_id: "insufficient"}
    - id: mark8ly-loyalty-points-not-credited
      text: |
        ISSUE: "My loyalty points didn't increase after a purchase."
        CAUSE: Customer isn't enrolled, OR points are batch-credited after the
        order moves from "paid" to "confirmed" (up to 48h delay), OR the order
        was refunded so points reversed.
        SOLUTION: Enrol in Account → Loyalty if not already. Points credit after
        order confirmation, not order placement. Check Points History for the
        most recent ledger row.
        ESCALATE: Points disappeared on a confirmed order, OR customer is
        enrolled and confirmed orders show no credit for >48h.
      metadata: {section: "loyalty", issue_id: "points-not-credited"}
    - id: mark8ly-loyalty-insufficient-points
      text: |
        ISSUE: "You don't have enough points to redeem this."
        CAUSE: Balance below the redemption threshold, or points already
        expired off the balance.
        SOLUTION: Show the customer the current balance in Account → Loyalty.
        They need more points before this redemption is available.
        ESCALATE: Never — this is the expected behaviour when balance is low.
      metadata: {section: "loyalty", issue_id: "insufficient-points"}

    # ==== Reviews ==========================================================
    - id: mark8ly-review-already-reviewed
      text: |
        ISSUE: "You have already reviewed this product."
        CAUSE: Customer already submitted a review — one review per
        customer per product.
        SOLUTION: Find the existing review on the product page (or My Reviews).
        Edit or delete it (within the edit window) and resubmit.
        ESCALATE: Customer insists they never reviewed it AND no review shows
        — the review may be sitting in moderation.
      metadata: {section: "reviews", issue_id: "already-reviewed"}
    - id: mark8ly-review-validation-failed
      text: |
        ISSUE: "Posting review blocked" / validation error.
        CAUSE: Review body >5000 chars, title >300 chars, empty content, or
        rating not in 1-5.
        SOLUTION: Trim to under the limits and use a 1-5 star rating, then
        resubmit.
        ESCALATE: Customer claims the body was well under 5000 chars and still
        rejected — the profanity filter may be over-matching.
      metadata: {section: "reviews", issue_id: "validation-failed"}
    - id: mark8ly-review-not-appearing
      text: |
        ISSUE: "I posted a review but I can't see it."
        CAUSE: Review is awaiting store moderation (24-48h is normal) or was
        held by the spam filter.
        SOLUTION: My Reviews page shows the current approval status. Approved
        reviews appear publicly within minutes of approval.
        ESCALATE: Pending >5 days, OR auto-rejected and customer disputes the
        reason.
      metadata: {section: "reviews", issue_id: "not-appearing"}

    - id: mk-order-how-to-place
      text: |
        How to place an order

        Add the items you want to your cart, then go to checkout and enter your shipping address, choose a delivery option, and pay using one of the payment methods the store offers. Your order is confirmed once payment succeeds, and you will see an order confirmation on screen and usually by email. If checkout fails or you are unsure whether payment went through, do not place the order again right away, as you may be charged twice; instead check your order history or email for a confirmation first. Available payment methods, shipping options, and delivery areas are set by each individual store, so they can differ from one storefront to another.
      metadata:
        section: order
    - id: mk-order-status-meanings
      text: |
        What order statuses mean

        An order typically moves through a few stages: pending payment (placed but payment not yet completed), paid or confirmed (payment received and the store is preparing it), shipped or out for delivery (handed to the carrier and on the way), and delivered (received at the destination). It may also show cancelled (the order was stopped before shipping) or refunded (money returned to you). The exact status names and any extra steps can vary by store, so always check the status shown on your specific order in your account. If a status seems stuck for an unusually long time, open your order details to see the latest update before reaching out.
      metadata:
        section: order
    - id: mk-order-tracking
      text: |
        Tracking your order

        Open your account and go to your orders, then select the order to view its current status and, once it has shipped, any tracking link or number provided. Tracking information appears only after the store hands the package to the carrier, so a freshly placed order will not have it yet. Carrier tracking can lag behind the package's real location by 24 to 48 hours, so brief gaps in updates are normal. Whether a tracking link is available depends on the store and the carrier they use; if none is shown after the order is marked shipped, check your order details or contact the store.
      metadata:
        section: order
    - id: mk-order-modify
      text: |
        Changing an order after placing it

        Whether you can change an order (for example the items, quantity, or shipping address) depends on the store and how far along the order is. Changes are generally only possible before the order ships, since once it is with the carrier the details are locked in. If your order has not shipped yet, check your order page for an edit option, and if there is none, contact the store as soon as possible with your order number and the change you need. If the order has already shipped, you usually cannot modify it and would instead refuse delivery or request a return once it arrives.
      metadata:
        section: order
    - id: mk-order-cancel
      text: |
        Cancelling an order

        An order can typically be cancelled only after it is paid and before it has shipped; once it is with the carrier, cancellation is no longer possible. If your order is still in a cancellable state, look for a cancel option on the order page; if the option is greyed out, the order has likely already shipped or is still pending payment. If the order has shipped and you no longer want it, wait for delivery and then request a return instead. Cancellation rules, timing, and any fees are set by each store, so check your order details or the store's policy for specifics.
      metadata:
        section: order
    - id: mk-order-cancel-refund-timing
      text: |
        Refund timing after a cancellation or return

        When an order is cancelled or a return is approved, the refund normally goes back to your original payment method. Refunds usually take a few business days to several business days to appear, depending on your bank or card provider, and bank settlement can add a little more time on top of that. Some stores may issue the refund as store credit or to a wallet instead of your card, so check what method was used in your order details. If a refund was approved but has not appeared after the expected window, reach out with your order number so it can be checked.
      metadata:
        section: order
    - id: mk-order-missing-items
      text: |
        Missing items from your order

        If part of your order is missing, first check whether it shipped separately, as stores sometimes split an order into multiple packages that arrive at different times. Review your order details to confirm which items were included in the package you received versus what is still in transit. If an item that should have been in the delivered package is genuinely missing, report it from your order page (look for a report a problem or request return option) and include details about what is missing. The store reviews these reports and responds within its stated timeframe, then arranges a refund or replacement as appropriate.
      metadata:
        section: order
    - id: mk-order-wrong-item
      text: |
        Received the wrong item

        If you received an item that does not match what you ordered, keep the item and any packaging and do not discard it, as the store may need it returned. Open the order on your account and use the report a problem or request return option, selecting the reason that you received the wrong item, and add photos if you can to speed up the review. The store will assess the report and arrange a replacement, the correct item, or a refund according to its policy. Response times and whether you get a replacement or a refund are determined by each store.
      metadata:
        section: order
    - id: mk-order-damaged-item
      text: |
        Item arrived damaged or defective

        If your item arrived broken, defective, or with visible package damage, document it with photos of the item and the packaging as soon as you can. Report the issue from your order page using the request return or report a problem option, choose the damaged reason, and attach the photos. The store reviews the claim and typically offers a replacement or a refund based on its policy and its stated review window. If the outer package looked clearly tampered with or opened on arrival, mention that in your report, as it may affect how the claim is handled.
      metadata:
        section: order
    - id: mk-order-not-received
      text: |
        Order not received or marked delivered but missing

        If your order is overdue, first check the tracking and status on your order page, keeping in mind that estimated delivery dates are not guarantees and carrier delays of a few days are common, especially during busy periods. If tracking shows the order as delivered but you do not have it, look around your delivery location, check with neighbours or building reception, and wait up to a day, as carriers sometimes mark items delivered slightly early. If it still does not turn up, or if tracking has been stuck for an extended period (for example a week or more with no movement), report it from your order page or contact the store with your order number. The store will investigate with the carrier and resolve it according to its policy.
      metadata:
        section: order
    - id: mk-order-confirmation-missing
      text: |
        No order confirmation or unsure if the order went through

        If you did not get a confirmation, first check your account's order history, since an order that completed will appear there even if the email did not arrive. Also check your spam or junk folder, as confirmation emails sometimes land there. Avoid placing the order a second time until you have confirmed the first one did not go through, to prevent being charged twice. If no order appears in your history and no payment was taken, the order likely did not complete and you can safely try checkout again; if a payment was taken but no order shows, contact the store with the payment details so it can be reconciled.
      metadata:
        section: order
    - id: mk-shipping-rates-overview
      text: |
        How shipping rates are calculated

        Shipping rates on this store are set by the merchant and can depend on your delivery address, the size and weight of your items, the shipping method you choose at checkout, and the order total. Many stores offer multiple options (such as standard or express), each with its own price shown at checkout before you pay. Some merchants offer free shipping above a minimum order value or run promotional free-shipping periods. Your exact shipping cost is calculated and displayed during checkout and itemized on your order confirmation, so check there for the amount that applies to your order.
      metadata:
        section: shipping
    - id: mk-delivery-timeframes
      text: |
        Estimated delivery timeframes

        Delivery timeframes vary by store, by the shipping method you select, and by your destination, so always treat any estimate as approximate. The store typically shows an estimated delivery window at checkout and on your order confirmation; standard shipping is usually slower and cheaper than express options. The clock generally starts after the order is processed and dispatched, not at the moment you place it, so processing or handling time is in addition to the shipping time. For the most accurate estimate for your purchase, check the delivery date or window listed in your order details.
      metadata:
        section: delivery
    - id: mk-track-shipment
      text: |
        How to track your shipment

        Once your order ships, the store usually sends a tracking number and a link by email or makes it available in your account order history. Open your order details to find the carrier name and tracking number, then use the carrier's tracking page or the link provided to see the latest status. Tracking information can take a little while to update after a label is created, so if it shows no movement right after dispatch, give it some time. If you can't find a tracking number or it isn't updating after a few days, contact the store and reference your order number.
      metadata:
        section: track
    - id: mk-no-tracking-updates
      text: |
        Tracking shows no updates or hasn't moved

        It's normal for tracking to stay quiet for a short period right after a label is created or while a package moves between carrier facilities, so a lack of scans doesn't always mean a problem. Updates can also lag during weekends, holidays, or high-volume periods. If your tracking hasn't changed for several days, or it's past the estimated delivery date with no movement, reach out to the store with your order number so they can investigate with the carrier. The merchant manages the carrier relationship and can open an inquiry or trace on your behalf.
      metadata:
        section: no
    - id: mk-international-shipping
      text: |
        International shipping, customs, and duties

        Whether a store ships internationally, to which countries, and at what cost is decided by the merchant, so check the store's shipping options at checkout for your country. International deliveries usually take longer than domestic ones and can be delayed by customs processing. Import duties, taxes, or customs fees may apply on arrival and are typically the responsibility of the recipient unless the store states otherwise; these charges are set by your country's customs authority, not the store. If you're unsure whether your country is supported or what fees might apply, confirm with the merchant before ordering.
      metadata:
        section: international
    - id: mk-carriers
      text: |
        Which carrier delivers your order

        The shipping carrier is chosen by the merchant and can differ from store to store and even from order to order, depending on your location and the shipping method selected. The carrier handling your package is shown in your order details or tracking information once the order is dispatched. Different carriers have their own delivery practices, such as where they leave packages or whether a signature is required. If you have a carrier-specific request like a delivery instruction or a hold-for-pickup, the carrier's own tracking page is usually the best place to manage it once tracking is active.
      metadata:
        section: carriers
    - id: mk-delivery-delays
      text: |
        What to do if your delivery is delayed

        Deliveries can run late due to carrier backlogs, weather, customs, incorrect address details, or high-demand periods, and the actual time depends on the carrier and your location. First, check your tracking for the latest status and any notices from the carrier, since many delays resolve on their own within a day or two. If your order is well past its estimated delivery date, the tracking is stuck, or the carrier reports an issue, contact the store with your order number so they can follow up with the carrier. The merchant sets the policy for delayed, lost, or stuck shipments, so they can advise on a reshipment, refund, or claim.
      metadata:
        section: delivery
    - id: mk-change-delivery-address
      text: |
        Changing your delivery address after ordering

        Whether you can change the delivery address depends on how far along your order is and the store's policy, so act as quickly as possible. If the order hasn't been dispatched yet, contact the store right away with your order number and the corrected address; many merchants can update it before it ships. Once a package is in transit, the store often can't change the address, but the carrier may offer redirect, reschedule, or hold-for-pickup options through their own tracking tools. If a package was sent to a wrong or outdated address, reach out to the store to discuss the best resolution.
      metadata:
        section: change
    - id: mk-shipping-methods-at-checkout
      text: |
        Choosing a shipping method at checkout

        At checkout the store displays the shipping methods it offers for your address, such as standard, express, or local options, each with its own price and estimated delivery window. Faster methods generally cost more, while standard shipping is usually the most economical. The methods and prices available are configured by the merchant and can vary based on your destination and the items in your cart. Pick the option that fits your timing and budget; the method and estimate you selected will appear on your order confirmation.
      metadata:
        section: shipping
    - id: mk-missing-or-lost-package
      text: |
        Package marked delivered but not received

        If tracking says your package was delivered but you can't find it, first check around your delivery location, with neighbors or building reception, and any safe-drop spots, since carriers sometimes leave packages out of plain sight. Give it up to a day, as items occasionally scan as delivered slightly before they arrive. If it still hasn't turned up, contact the store with your order number so they can verify the delivery details and, if needed, open an investigation or claim with the carrier. The merchant sets the policy for lost or missing packages, including whether a replacement or refund is offered.
      metadata:
        section: missing
    - id: mk-partial-and-split-shipments
      text: |
        Orders that arrive in multiple shipments

        Sometimes an order ships in more than one package, for example when items are stocked in different locations or some items are ready before others. When this happens you may receive separate tracking numbers and the packages may arrive on different days. Check your order details, where each shipment and its tracking are usually listed separately, so a missing item may simply be in a later package still on its way. If part of your order is past its estimated delivery date with no tracking progress, contact the store with your order number for an update.
      metadata:
        section: partial
    - id: mk-payment-accepted-methods
      text: |
        What payment methods are accepted

        Accepted payment methods are set by each individual store, so the exact options vary from one merchant to another. Common choices include credit and debit cards plus digital wallets, and depending on the store you may also see options like UPI, PayPal, or cash/pay-on-delivery. The methods available to you appear on the checkout page for the store you are shopping on. If you do not see your preferred method, it means this particular merchant has not enabled it, and you can ask the store to confirm what they support.
      metadata:
        section: payment
    - id: mk-payment-failed-or-declined
      text: |
        Payment failed or was declined at checkout

        A declined payment is most often caused by the card issuer or bank rather than the store, for example insufficient funds, an expired card, a wrong CVV or billing detail, or a bank fraud block on an online or international charge. First re-check the card number, expiry, CVV, and billing address, then try again or use a different payment method. If the charge needed bank approval (such as an OTP or 3-D Secure step) and it timed out, simply restart checkout. A failed attempt usually leaves no completed order, so if you still see a pending hold it is typically an authorization that the bank releases on its own within a few business days.
      metadata:
        section: payment
    - id: mk-payment-duplicate-charge
      text: |
        I think I was charged twice / duplicate charge

        Seeing two charges does not always mean you paid twice. A common cause is a temporary authorization hold from a first attempt sitting alongside the real charge; the hold is not a true debit and the bank drops it automatically, usually within a few business days. To tell the difference, check your order history for the store: if there is only one confirmed order, you were charged once even if your bank statement temporarily shows two lines. If you actually have two separate confirmed orders for the same items, or a real duplicate charge remains after several business days, contact the store with the order numbers and charge dates so they can refund the extra payment.
      metadata:
        section: payment
    - id: mk-payment-when-charged
      text: |
        When is my card actually charged

        In most cases your payment is captured at the time you place the order and complete checkout, and you receive an order confirmation once it succeeds. Some banks first place a short-lived authorization hold to verify the card before the actual charge settles, which can make the amount look pending on your statement for a short time. The order confirmation in your account is the reliable signal that payment went through. Exact billing behavior can depend on the store's payment provider, so if you are unsure, check your order details or ask the merchant.
      metadata:
        section: payment
    - id: mk-returns-window-eligibility
      text: |
        Return window and what is eligible for return

        Each store sets its own return policy, including how many days you have to return an item and which products qualify, so always check the return or refund policy on the store you ordered from. Returns typically become available only after an order has shipped or been delivered, not while it is still being prepared. Some items are commonly excluded, such as final-sale, clearance, personalized or custom-made goods, perishables, and certain hygiene-sensitive products, and many stores require items to be unused and in original packaging. To see the rules and the deadline that apply to your purchase, open the order in your account and review the store's policy details.
      metadata:
        section: returns
    - id: mk-returns-how-to-start
      text: |
        How to start a return

        To begin a return, open your order in your account on the store where you bought it and choose the return option for the item you want to send back. You will usually select a reason and, for damaged, defective, or wrong-item cases, add photos to help the store review your request. After you submit, the merchant reviews it and, if approved, provides return instructions such as a shipping label or drop-off details. Approval times and shipping arrangements vary by store, so follow the specific instructions shown for your return request.
      metadata:
        section: returns
    - id: mk-returns-exchanges
      text: |
        Exchanges (different size, color, or item)

        Whether exchanges are offered, and for which items, depends on the individual store's policy, so check the order or the store's return policy to confirm. When a direct exchange is not available, a common approach is to return the original item for a refund and place a new order for the size, color, or product you want. If you need an exchange, start from the order in your account and select the exchange or return option if the store provides it, then follow the instructions. For sizing or fit questions before requesting an exchange, the product page or the merchant can confirm what is in stock.
      metadata:
        section: returns
    - id: mk-refunds-method-and-timeline
      text: |
        How refunds are issued and how long they take

        Once a return or refund is approved, the money is normally sent back to your original payment method, for example the same card, wallet, or account you paid with. Some stores may instead offer store credit or a wallet balance depending on their policy, which is shown when the refund is processed. After the store issues the refund, it commonly takes on the order of several business days to a couple of weeks to appear, because your bank or card provider adds its own processing time. Exact timelines and any store-credit option are set by the merchant and your payment provider, so check your order details or the store's refund policy for specifics.
      metadata:
        section: refunds
    - id: mk-refunds-not-received
      text: |
        Refund approved but I have not received it yet

        If your refund has been approved but you do not see it, the most common reason is normal processing time at your bank or card provider, which can add several business days after the store sends the refund. Confirm where the refund was issued, since it goes to your original payment method by default but some stores refund to store credit or a wallet instead. It also helps to check the statement of the exact card or account you used and to allow for your bank's settlement delay before assuming something is wrong. If a meaningful amount of time has passed beyond the store's stated refund window with nothing showing, contact the merchant with your order number so they can confirm the refund status and reference.
      metadata:
        section: refunds
    - id: mk-product-out-of-stock
      text: |
        Product is out of stock or unavailable

        If an item shows "Out of stock," "Sold out," or "Unavailable," the store currently has no inventory for that product or that specific variant (size, color, or style). Try selecting a different variant, since stock is tracked separately per option. Some stores offer a "Notify me" or "Back in stock" option that emails you when inventory returns, but availability and restock timing are set by the merchant and vary by store. If you need a firm restock date, ask the store directly through their contact page or support chat.
      metadata:
        section: product
    - id: mk-product-availability-varies
      text: |
        Why a product I saw earlier is no longer showing

        Products can disappear from a storefront because they sold out, the merchant unpublished or removed them, or an "In stock only" filter is hiding them. Each store on the platform is independent, so make sure you are browsing the same store (check the store name and web address) where you originally saw the item. Try searching by the exact product name and clearing any active filters. If you recently purchased it and it has vanished, contact the store, as the merchant controls what stays listed.
      metadata:
        section: product
    - id: mk-product-sizing
      text: |
        Sizing and fit guidance

        Sizing is set by each merchant, so there is no single platform-wide size chart. Look for a "Size guide," "Size chart," or "Fit" link on the product page, which usually lists measurements and how the item runs (small, true to size, or large). Measurements can be in different units or regional sizing depending on the store, so compare against the chart rather than assuming your usual size. If a size you want is greyed out, that variant is likely out of stock; if you are unsure of fit, ask the store before ordering.
      metadata:
        section: product
    - id: mk-product-care-instructions
      text: |
        Product care and material information

        Care instructions (washing, drying, storage, cleaning) and material composition are provided by the merchant on the product page or on the item's printed label or tag. Look in the product description or a dedicated "Care," "Materials," or "Specifications" section for details. Follow the label that comes with the product, as it is the most authoritative source. If care details are missing or unclear, contact the store directly, since requirements vary by material and by store.
      metadata:
        section: product
    - id: mk-product-warranty
      text: |
        Warranty and guarantee coverage

        Warranty terms, length, and what they cover are set by each merchant and sometimes by the original manufacturer, so they vary by store and by product. Check the product page, your order confirmation, or the store's warranty or policy page for the specific terms that apply to your item. To make a warranty claim, you typically need your order number or proof of purchase, which is in your order history or confirmation email. If you cannot find the warranty terms, contact the store, as the platform itself does not set a universal warranty.
      metadata:
        section: product
    - id: mk-account-sign-in
      text: |
        Trouble signing in to your account

        Each store on the platform keeps its own separate account and session, so sign in on the exact store web address where you have an account, not a different store's site. Make sure you are using the same email address you registered with, and check for typos or caps lock in your password. If sign-in still fails, use the "Forgot password" link to reset, or clear your browser cookies and try again. If you never received a verification email after signing up, request a new one and check your spam folder.
      metadata:
        section: account
    - id: mk-account-session-expired
      text: |
        Session expired or you were logged out

        You may be logged out automatically after a period of inactivity, if your session reached its expiry, or if browser cookies were cleared. Sessions are scoped to a single store, so being signed in on one store does not keep you signed in on another. Simply sign back in on the same store web address to continue. If you are repeatedly logged out right after signing in, clear your cookies, disable cookie-blocking extensions for the site, and try once more.
      metadata:
        section: account
    - id: mk-account-password-reset
      text: |
        Resetting a forgotten password

        Use the "Forgot password" link on the sign-in page, enter your account email, and follow the reset link sent to your inbox. Reset links are time-limited and single-use, so request a fresh one if it says the link is invalid or expired, and use it promptly. Check your spam or junk folder if the email does not arrive within a few minutes, and confirm you entered the same email you registered with. If no reset email ever arrives, contact the store to confirm which email is on your account.
      metadata:
        section: account
    - id: mk-account-mfa
      text: |
        Two-factor authentication (MFA) issues

        If your authentication code is rejected, it is usually because the code already rotated (they change roughly every 30 seconds) or your phone's clock is out of sync, so wait for a fresh code and set your phone time to automatic. Make sure you are reading the code for the correct account in your authenticator app. To switch devices, disable MFA in your account security settings using your current code, then re-enroll on the new device. If you have lost access to your authenticator and cannot complete the disable step, contact the store for a manual reset.
      metadata:
        section: account
    - id: mk-account-update-profile-addresses
      text: |
        Updating your profile and saved addresses

        You can edit your name, email, password, and contact details in your account or profile settings while signed in to the store. Saved shipping and billing addresses are managed under an "Addresses" or "Saved addresses" section, where you can add, edit, or delete entries and set a default. Stores may cap how many addresses you can save, so delete an old one if you cannot add a new entry. Update an address before placing a new order, since changes do not retroactively alter the shipping address on orders already submitted.
      metadata:
        section: account
    - id: mk-promo-discount-codes
      text: |
        Applying a promotion or discount code

        Enter your discount or coupon code in the "Promo code," "Coupon," or "Discount" field at checkout, then apply it before paying. Codes are often case-sensitive, so copy and paste directly from the email or ad to avoid typos. A code may be rejected if it has expired, reached its usage limit, does not meet a minimum purchase amount, or does not apply to the items in your cart, since these rules are set by the merchant. If a code from the store should be valid but will not apply, contact the store with the exact code and your cart details.
      metadata:
        section: promo
    - id: mk-gift-cards
      text: |
        Using and checking gift cards

        Enter your gift card number (and PIN if one was issued) in the gift card or payment field at checkout to apply its balance toward your order. Gift cards are specific to the store that issued them and cannot be used on other stores on the platform. If your balance does not cover the full total, you can usually pay the remainder with another payment method or combine multiple cards, depending on the store's setup. Terms such as expiry dates and reissue policies are set by the merchant, so check your gift card email or the store's policy, and contact the store if the balance looks wrong.
      metadata:
        section: gift
    - id: mk-store-info-general
      text: |
        General store information and policies

        Each merchant on the platform runs an independent storefront and sets its own policies for shipping, returns, refunds, taxes, payment methods, contact details, and operating regions. Look for these in the store's footer links or dedicated pages such as "Shipping," "Returns," "FAQ," "About," or "Contact," since they vary from store to store. Your order confirmation email and order history page also list the specifics that applied to your purchase. For anything not covered here, contact the store directly, as the platform does not impose a single universal policy across all merchants.
      metadata:
        section: store
    - id: mk-store-contact
      text: |
        How to contact a store for help

        Reach a merchant through the contact options on their storefront, which may include a contact form, support email, phone number, or the in-store support chat. Have your order number ready (it is in your confirmation email and order history) so the store can find your purchase quickly. Response times and support hours are set by each merchant and vary by store. For order-specific questions such as delivery status, refunds, or warranty claims, the store that fulfilled your order is the right point of contact.
      metadata:
        section: store
  fanzone:
    - id: fanzone-overview
      text: |
        FanZone Battle Ground is a cricket fan engagement platform.
        Real-time match chat, prediction games, IPL coverage, leaderboards
        and points. Users sign in with Google or Meta via Firebase.
      metadata: {source: "starter-seed", section: "overview"}
    - id: fanzone-points
      text: |
        Points are earned by predicting match outcomes correctly,
        chatting in active battle rooms during live matches, and daily
        login streaks. The leaderboard refreshes hourly. Points are NOT
        redeemable for real money; they unlock badges, predictions of
        higher stake, and ranking on the fan leaderboard.
      metadata: {source: "starter-seed", section: "points"}
    - id: fanzone-predictions
      text: |
        Predictions close at the toss of the match. Once locked, a
        prediction can't be changed. If a match is abandoned without
        a result, the prediction is voided and the staked points
        returned. If a match is rain-affected with a DLS result, the
        prediction is settled against the DLS winner.
      metadata: {source: "starter-seed", section: "predictions"}

  # HomeChef / fe3dr.com — the full support KB. The homechef-vendor
  # tenant aliases to this namespace, so chef-side (audience: chef) and
  # driver-side entries live here too. Facts mirror the Home-Chef-App
  # code (cancellation_policy.go, document.go, account_lifecycle.go,
  # docs_deadline_cron.go, payout gate) — update this file when those
  # policies change.
  homechef:
    # kb revision marker — bumping re-hashes the ConfigMap, which renames
    # and re-runs the seed Job (the 2026-08-02.1 run failed against a
    # scaled-to-zero embedder).
    - id: homechef-kb-meta
      text: |
        HomeChef support knowledge base, revision 2026-08-02.2.
        Maintained in tesserix-k8s (support-platform-kb-seed); keep in
        sync with Home-Chef-App policy code.
      metadata: {source: "support-kb", section: "meta", audience: "all"}
    # ── Customer: basics ────────────────────────────────────────────
    - id: homechef-overview
      text: |
        HomeChef (fe3dr.com) connects customers with verified home
        chefs in their neighbourhood for fresh home-cooked food,
        delivered. Browse local chefs, order single meals, subscribe
        to tiffin meal plans, place group/office orders, or request
        catering. Track delivery live in the app or on the website.
        Available in selected cities in India and Australia.
      metadata: {source: "support-kb", section: "overview", audience: "customer"}
    - id: homechef-ordering
      text: |
        HOW TO ORDER: Browse Chefs -> pick a chef (check the Open
        badge and delivery radius) -> add dishes to the cart -> choose
        delivery address and time -> pay. The chef must ACCEPT the
        order before cooking starts; you'll see the status move
        pending -> accepted -> preparing -> ready -> picked up ->
        delivering -> delivered. If a chef shows "Closed" they are not
        taking orders right now — try another chef or check their
        opening hours on the profile.
      metadata: {source: "support-kb", section: "ordering", audience: "customer"}
    - id: homechef-delivery
      text: |
        Delivery windows are 30-45 minutes typical; the order page
        shows a live ETA and driver position. Drivers send status
        updates and a final delivery photo as proof. ISSUE: "My order
        is late." ANSWER: check the live ETA first — traffic updates
        move it. If the order is more than 20 minutes past the ETA,
        contact support and we'll expedite it or refund the delivery
        fee. ESCALATE: no driver movement for 15+ minutes or the app
        shows delivered but nothing arrived.
      metadata: {source: "support-kb", section: "delivery", audience: "customer"}
    - id: homechef-order-cancellation
      text: |
        ISSUE: "I want to cancel my order." ANSWER: it depends on how
        far the order has progressed. (1) Chef has NOT accepted yet
        (status pending), or the chef rejected/cancelled: cancelling
        gives an automatic full refund of the food amount (the small
        platform fee is not refunded). (2) Chef accepted or is already
        preparing: the cancellation goes to the chef to confirm, and
        the refund amount follows the chef's cancellation tiers shown
        at request time. (3) Order is ready, picked up, or on its way:
        it can no longer be cancelled in-app — contact support.
      metadata: {source: "support-kb", section: "cancellation", audience: "customer"}
    - id: homechef-refunds
      text: |
        Refunds are processed for missing items, incorrect orders,
        cancelled orders, and food-safety concerns, back to the
        original payment method. Wallet-credit portions return to the
        wallet instantly; gateway refunds (UPI/card/net banking)
        usually settle in 3-7 business days depending on the bank. If
        a refund is approved but delayed, it is retried automatically
        — you do not need to re-request it. ESCALATE: refund shows
        processed for more than 7 business days with nothing received.
      metadata: {source: "support-kb", section: "refunds", audience: "customer"}
    - id: homechef-food-safety
      text: |
        URGENT — FOOD SAFETY: if you feel unwell after a meal or find
        a foreign object, STOP eating immediately, photograph the dish
        and packaging, and contact support right away (chat is
        fastest — ask for a human). We refund the full order and
        escalate to the chef and our food-safety process within 1
        hour. Keep the food if possible; it may be needed for the
        investigation.
      metadata: {source: "support-kb", section: "food-safety", audience: "customer", urgent: true}
    - id: homechef-payments
      text: |
        Payments are processed by Cashfree: UPI, credit/debit cards,
        and net banking, plus HomeChef wallet credits. ISSUE: "Money
        was debited but the order shows unpaid/failed." ANSWER: the
        app re-checks the payment status automatically for a few
        minutes; a genuinely failed charge is auto-reversed by the
        bank, typically within 3-5 business days. Do NOT pay twice —
        if a second attempt is needed the first hold will be reversed.
        ESCALATE: debit visible in your bank after 24h with the order
        still unpaid, or a double charge on one order.
      metadata: {source: "support-kb", section: "payments", audience: "customer"}
    - id: homechef-promos-wallet
      text: |
        Promo codes are applied at checkout — one code per order, and
        expired or already-used codes are rejected with the reason
        shown. Wallet credits (from refunds or rewards) auto-apply
        toward the payable amount; any remainder is charged to your
        payment method. Loyalty points accrue on delivered orders and
        convert to wallet credit from the Rewards screen. ISSUE:
        "Promo code not working." ANSWER: check expiry, minimum order
        value, first-order-only conditions, and that the code matches
        this app (customer codes don't work in the chef app).
      metadata: {source: "support-kb", section: "promotions", audience: "customer"}
    - id: homechef-meal-plans
      text: |
        Meal plans (tiffin subscriptions) deliver on a recurring
        schedule from one chef. You can SKIP a day from the plan
        screen before the chef's cut-off: skips inside the allowed
        window apply instantly and the chef is notified; requests
        outside the window go to review. Plan changes and pauses take
        effect from the next billing cycle. ISSUE: "I was charged for
        a skipped day." ANSWER: approved skips are credited to your
        wallet automatically; check the wallet ledger first.
      metadata: {source: "support-kb", section: "meal-plans", audience: "customer"}
    - id: homechef-group-catering
      text: |
        GROUP ORDERS: one person starts a group order and shares the
        link; everyone adds their own items and pays their share. If
        the group order is cancelled, every participant is refunded
        individually. CATERING: submit a catering request from the
        chef's profile with the event date, headcount and menu
        preferences; the chef sends a quote you can accept or decline
        — payment is only taken after you accept the quote.
      metadata: {source: "support-kb", section: "group-catering", audience: "customer"}
    - id: homechef-confirm-receipt
      text: |
        After delivery the app asks you to confirm you received the
        order. If you don't respond, the order auto-confirms after the
        reminder window so the chef can be paid. If something was
        wrong with the order, tap "Report a problem" (or open a
        support chat) BEFORE it auto-confirms where possible — but a
        confirmed order can still be disputed through support.
      metadata: {source: "support-kb", section: "confirm-receipt", audience: "customer"}
    - id: homechef-login-issues
      text: |
        ISSUE: "Can't log in." ANSWER: (1) Password reset links/codes
        expire after 15 minutes — request a fresh one if it says
        expired or invalid. (2) With two-factor enabled, use the OTP
        sent to your email; on a trusted device the prompt is skipped.
        Lost access to email? Use one of your backup codes from when
        2FA was set up. (3) Social sign-in (Google/Facebook/Apple)
        accounts must use the same provider each time — the email
        alone won't work with a password it never had. ESCALATE: no
        backup codes and no email access (identity re-verification
        needed).
      metadata: {source: "support-kb", section: "account", audience: "customer"}
    - id: homechef-account-deletion
      text: |
        Delete your account from Settings -> Account. The account
        deactivates immediately and personal data is purged after the
        retention window. You can RESTORE the account within 360 days
        by signing in again and following the restore prompt (the
        restore link is valid for 15 minutes once requested). After
        360 days the account and its data are permanently removed and
        cannot be recovered.
      metadata: {source: "support-kb", section: "account", audience: "customer"}

    # ── Chef / vendor ──────────────────────────────────────────────
    - id: homechef-chef-onboarding
      text: |
        BECOME A CHEF: download the Fe3dr Chef app and sign up (two
        quick steps — about you, then a password). Onboarding then
        walks through kitchen profile, menu, service area, documents
        and payout details. Documents and payout setup CAN be skipped
        at first so you can finish the rest — but verification (and
        going live) needs the documents, and payouts stay on hold
        until payout details are added. Questions during onboarding:
        chef-onboarding@fe3dr.com or the in-app chat.
      metadata: {source: "support-kb", section: "chef-onboarding", audience: "chef"}
    - id: homechef-chef-documents
      text: |
        CHEF DOCUMENTS required for verification: ID proof (PAN /
        Aadhaar / passport), FSSAI license, address proof (a gas or
        electricity bill for the kitchen address, dated within the
        last 3 months), food safety certificate, cancelled cheque,
        three kitchen photos and a profile photo. A recent bank
        statement is OPTIONAL and only speeds up payout verification.
        The app pre-checks uploads (readability, dates) before
        submission — a bill older than 3 months or an expired FSSAI
        license is rejected at upload with the reason shown.
      metadata: {source: "support-kb", section: "chef-documents", audience: "chef"}
    - id: homechef-chef-docs-deadline
      text: |
        If you skipped documents during onboarding you have 30 DAYS
        from submitting your application to upload them. A reminder
        goes out around day 25, and an application still missing
        documents after 30 days is withdrawn automatically — you can
        re-apply, but you start over. Upload early: verification
        review time is separate from the 30-day window.
      metadata: {source: "support-kb", section: "chef-documents", audience: "chef"}
    - id: homechef-chef-verification
      text: |
        After documents are submitted the Tesserix team reviews the
        application (typically 2-3 business days). Status shows in the
        chef app under Review. The kitchen cannot take live orders
        until verification passes — menus and profile can be prepared
        meanwhile. If the review team needs more information you get
        an in-app request + email; respond there rather than starting
        a new application. ESCALATE: verification pending more than 5
        business days with no request for information.
      metadata: {source: "support-kb", section: "chef-verification", audience: "chef"}
    - id: homechef-chef-fssai
      text: |
        Every HomeChef kitchen in India needs a valid FSSAI license
        (basic registration is sufficient for home kitchens under the
        turnover threshold). The platform tracks your license expiry
        and reminds you 30, 15 and 7 days before it lapses — an
        expired license pauses the kitchen until a renewed license is
        uploaded and re-verified.
      metadata: {source: "support-kb", section: "chef-fssai", audience: "chef"}
    - id: homechef-chef-payouts
      text: |
        PAYOUTS: add bank details (account + IFSC) in the chef app
        under Payouts. Setup can be deferred during onboarding —
        earnings still accrue on every delivered order but are HELD
        until payout details are added and verified (reminder around
        day 25). Payouts run on the platform settlement schedule with
        weekly statements in the app; an optional recent bank
        statement upload speeds verification. ISSUE: "My payout didn't
        arrive." ANSWER: check Payouts -> status first (bank
        validation can take a business day); failed transfers are
        retried automatically. ESCALATE: payout marked paid but not
        received after 2 business days.
      metadata: {source: "support-kb", section: "chef-payouts", audience: "chef"}
    - id: homechef-chef-orders
      text: |
        Managing orders: new orders need your ACCEPT before the
        customer is committed — you get reminder nudges, and
        repeatedly ignoring orders hurts visibility. Set daily
        capacity and slots so the app stops taking orders when you're
        full; pausing the kitchen auto-resumes on your schedule.
        Cancelling an accepted order refunds the customer per the
        cancellation tiers and can carry a penalty — if you truly
        can't fulfil, cancel as early as possible.
      metadata: {source: "support-kb", section: "chef-orders", audience: "chef"}
    - id: homechef-chef-earnings
      text: |
        The Earnings screen shows per-order earnings, settlements and
        downloadable statements (including a financial-year statement
        for tax filing). Track kitchen costs in Expenses — entries can
        be linked to orders. Rewards: the referral program pays a
        bonus when a chef you refer goes live, and loyalty incentives
        accrue on completed orders; both are visible under Rewards.
      metadata: {source: "support-kb", section: "chef-earnings", audience: "chef"}
    - id: homechef-chef-support
      text: |
        Chef support channels: the in-app "Chat with support" (this
        assistant answers instantly and hands off to the Tesserix team
        when needed — say "talk to a human" any time), or raise a
        ticket under Support for slower, tracked issues (app problems,
        payouts, account, orders). A chat can be converted into a
        ticket with "Create a support ticket" so nothing is lost.
        Email: chef-onboarding@fe3dr.com for onboarding,
        support@fe3dr.com for everything else.
      metadata: {source: "support-kb", section: "chef-support", audience: "chef"}

    # ── Delivery driver ────────────────────────────────────────────
    - id: homechef-driver-onboarding
      text: |
        BECOME A DRIVER: sign up in the Fe3dr Driver app — personal
        details, vehicle details, documents, payout details, then
        review. Documents required: driving license, vehicle RC,
        insurance, Aadhaar, PAN, a profile photo, police verification,
        and vehicle photos (front, back, left, right, top). Your
        application is reviewed after submission; you can start
        accepting deliveries once approved.
      metadata: {source: "support-kb", section: "driver-onboarding", audience: "driver"}
    - id: homechef-driver-deliveries
      text: |
        Driver flow: go online -> accept an available delivery -> pick
        up from the chef -> navigate with in-app maps -> photograph
        the handover as delivery proof. Earnings (including customer
        tips) appear per-delivery under Earnings with the same weekly
        settlement rhythm as chefs. ISSUE: "Customer unreachable at
        drop-off." ANSWER: use the in-app call button and wait the
        grace period shown; then follow the app's return prompt —
        support is notified automatically.
      metadata: {source: "support-kb", section: "driver-deliveries", audience: "driver"}

    # ── Support channels (all audiences) ───────────────────────────
    - id: homechef-support-channels
      text: |
        Getting help on HomeChef/fe3dr: (1) LIVE CHAT — the "Chat with
        support" button (web) or Profile -> Chat with support
        (customer app) / Support -> Chat (chef app). The assistant
        answers instantly from this knowledge base; asking for a
        human, or words like "refund", queue you to the Tesserix
        support team — every conversation gets a case ID (CS-...) you
        can quote later. (2) TICKETS — created in-app (or from a chat
        via "Create a support ticket"); tracked with a ticket number
        and email updates. (3) EMAIL — support@fe3dr.com for
        assistance, grievance@fe3dr.com for formal complaints and
        grievance escalation, hello@fe3dr.com for general/partnership
        queries.
      metadata: {source: "support-kb", section: "support-channels", audience: "all"}

  # Chefs run the HomeChef Chefs app, whose screens differ from the customer
  # app. Kept in its own namespace so a chef is never told to tap a customer
  # screen. Every chunk names the exact tap-path.
  homechef-vendor:
    - id: hcv-kb-meta
      text: |
        HomeChef Chefs (vendor) support knowledge base, revision
        2026-08-02.1. Maintained in tesserix-k8s
        (support-platform-kb-seed).
      metadata: {source: "support-kb", section: "meta", audience: "chef"}
    - id: hcv-navigation-map
      text: |
        CHEF APP NAVIGATION. The bottom tabs are Dashboard, Orders,
        Menu and More. Almost everything else lives under More:
        Kitchen — More -> Meal plans, More -> Capacity, More ->
        Catering, More -> Reviews, More -> ChefBook.
        Money — More -> Earnings, More -> Payout, More -> Rewards,
        More -> Expenses, More -> Analytics.
        Requests — More -> Cancellations, More -> Admin requests,
        More -> Documents.
        Account — More -> Profile, More -> Notifications, More ->
        Language, More -> Settings, More -> Help & support,
        More -> Legal.
      metadata: {source: "support-kb", section: "navigation", audience: "chef"}
    - id: hcv-payout-bank-account
      text: |
        ISSUE: "How do I change the bank account my payouts go to?"
        ANSWER: More -> Payout. That screen holds the bank account
        earnings are paid into — account number and IFSC. Do NOT send
        a chef to Earnings for this; Earnings only shows money that
        has already moved. After changing the account the details are
        re-verified before the next payout runs, so a payout landing
        in that window can be held until verification clears.
      metadata: {source: "support-kb", section: "payouts", audience: "chef"}
    - id: hcv-payout-timing
      text: |
        ISSUE: "When do I get paid?" / "Where is my payout?" ANSWER:
        check More -> Earnings, which lists payouts and transactions
        with their status. Settled earnings reach the registered bank
        account within 2 business days of settlement. If Earnings
        shows a payout as sent but the bank has nothing after 2
        business days, escalate to a human with the payout reference.
        If no payout appears at all, check More -> Payout has a
        verified bank account — an unverified account holds earnings.
      metadata: {source: "support-kb", section: "payouts", audience: "chef"}
    - id: hcv-orders
      text: |
        Incoming orders arrive on the Orders tab and on Dashboard. A
        chef must ACCEPT an order before cooking; unaccepted orders
        expire and hurt the acceptance rate. Move an order along with
        the status buttons on the order: accepted -> preparing ->
        ready. A driver then collects it. To stop new orders without
        going offline entirely, use More -> Capacity to set daily caps
        and order cutoffs. Auto-accept is under More -> Settings.
      metadata: {source: "support-kb", section: "orders", audience: "chef"}
    - id: hcv-menu
      text: |
        Dishes live on the Menu tab. Add one with the add button on
        Menu; edit or unpublish by tapping the dish. Price, portion,
        prep time and photos are all on the dish form. A dish stays
        hidden from customers until the kitchen is verified and the
        dish is marked available.
      metadata: {source: "support-kb", section: "menu", audience: "chef"}
    - id: hcv-verification-documents
      text: |
        ISSUE: "My documents expired" / "I'm asked to re-upload."
        ANSWER: More -> Documents. Chefs must keep FSSAI registration,
        ID and address proof current; bills used as address proof must
        be under 3 months old and FSSAI must not be past expiry.
        Requests from the review team appear under More -> Admin
        requests. An unverified or lapsed kitchen cannot take orders,
        so treat an expiry warning as urgent.
      metadata: {source: "support-kb", section: "verification", audience: "chef"}
    - id: hcv-cancellations
      text: |
        ISSUE: "A customer wants to cancel." ANSWER: More ->
        Cancellations lists customer cancellation requests waiting on
        the chef. If the chef has not accepted yet the cancellation is
        automatic; once preparing, the chef confirms and the refund
        follows the cancellation tiers shown at request time. Chef-side
        cancellations after accepting affect standing, so cancel only
        when the food genuinely cannot be made.
      metadata: {source: "support-kb", section: "cancellation", audience: "chef"}
    - id: hcv-earnings-expenses
      text: |
        More -> Earnings shows payouts and transactions. More ->
        Expenses records gas, ingredients and other costs and produces
        the FY tax statement. More -> Analytics shows orders, revenue
        and trends over time. More -> Rewards covers points, cashback
        and referring another chef.
      metadata: {source: "support-kb", section: "earnings", audience: "chef"}
    - id: hcv-meal-plans
      text: |
        Tiffin and subscription cooking lives under More -> Meal
        plans: the weekly and daily menus, prep lists, and refund
        decisions for missed or rejected deliveries. Set what the
        kitchen can handle per day under More -> Capacity so meal-plan
        demand does not oversubscribe the kitchen.
      metadata: {source: "support-kb", section: "meal-plans", audience: "chef"}
    - id: hcv-account
      text: |
        Kitchen name, cuisines and chef details are under More ->
        Profile. Notification categories and quiet hours are under
        More -> Notifications. Language (English / हिन्दी) is under
        More -> Language. Account controls including auto-accept,
        pausing the kitchen and password changes are under More ->
        Settings. Support is More -> Help & support.
      metadata: {source: "support-kb", section: "account", audience: "chef"}
    - id: hcv-support-channels
      text: |
        Getting help as a chef: More -> Help & support opens live chat
        and tickets. The assistant answers instantly from this
        knowledge base; asking for a human queues the chat to the
        Tesserix support team, and every conversation gets a case ID
        (CS-...) worth quoting later. Email chef-onboarding@fe3dr.com
        for onboarding and verification, support@fe3dr.com for general
        assistance, grievance@fe3dr.com for formal complaints.
      metadata: {source: "support-kb", section: "support-channels", audience: "chef"}

  stockpilot:
    - id: stockpilot-overview
      text: |
        StockPilot is an AI stock-analysis and trading platform. It
        runs multi-agent research workflows (LangGraph) backed by
        Alpaca Markets for execution. Demo mode uses paper trading
        with a $100K virtual balance; live mode requires a connected
        Alpaca brokerage account.
      metadata: {source: "starter-seed", section: "overview"}
    - id: stockpilot-disclaimer
      text: |
        StockPilot is NOT a financial adviser. The AI agents produce
        analysis and trade ideas; you decide whether to act. Past
        performance does not predict future results. Markets can move
        against an agent's thesis without warning. Never invest more
        than you can afford to lose.
      metadata: {source: "starter-seed", section: "disclaimer", regulated: true}
    - id: stockpilot-broker
      text: |
        Broker connection is done via Alpaca Markets OAuth. Sandbox
        uses broker-api.sandbox.alpaca.markets; production uses
        broker-api.alpaca.markets. If your portfolio shows "broker
        disconnected", re-authenticate from Settings -> Broker.
        Open positions are not affected by a transient disconnection.
      metadata: {source: "starter-seed", section: "broker"}

  gameverse:
    - id: gameverse-overview
      text: |
        GameVerse is a multiplayer board-games platform — Ludo, Chess,
        Checkers, Snakes & Ladders, Word Stack, and more. The shell
        app is the lobby; each game is a standalone module that loads
        in the same shell so your sign-in, ratings and friends stay
        consistent across games.
      metadata: {source: "starter-seed", section: "overview"}
    - id: gameverse-rules
      text: |
        Game-specific rules live on each game's lobby page. Server-side
        engines run the authoritative game state — dice, shuffles, and
        AI opponents all run on the server in Rust, so client
        modifications cannot influence outcomes.
      metadata: {source: "starter-seed", section: "rules"}
    - id: gameverse-matchmaking
      text: |
        Multiplayer pairing is Glicko-2-rating based. New accounts
        start at rating 1500; each win/loss against a rated opponent
        adjusts your rating. If a match-up is taking too long, the
        rating window widens automatically every 30 seconds. Manual
        room codes bypass matchmaking — share a code with friends.
      metadata: {source: "starter-seed", section: "matchmaking"}

  horoscope:
    - id: horoscope-overview
      text: |
        Tesserix Horoscope offers natal charts, daily/weekly/monthly
        transits, and palm + face readings across Western, Vedic
        (sidereal) and Mian Xiang traditions. Sign in with Google,
        fill in birth details, and the chart engine produces your
        personalised reading.
      metadata: {source: "starter-seed", section: "overview"}
    - id: horoscope-disclaimer
      text: |
        Charts and readings are for entertainment and self-reflection
        ONLY. They are NOT medical, legal, psychological, financial,
        romantic, or safety advice. If you are facing a health,
        financial, legal or safety concern, consult an appropriately
        qualified professional. In Australia, Lifeline is available
        24/7 at 13 11 14 for crisis support.
      metadata: {source: "starter-seed", section: "disclaimer", regulated: true}
    - id: horoscope-providers
      text: |
        Chart compute is provider-agnostic. By default the internal
        Keplerian engine answers; if the operator sets
        ASTROLOGY_PRIMARY to prokerala / astrologyapi / freeastro the
        dispatcher prefers that provider with the internal engine as
        an always-available fallback.
      metadata: {source: "starter-seed", section: "providers"}

  scrapper:
    - id: scrapper-overview
      text: |
        Social Media Scrapper is a marketing-intelligence platform.
        Scrape public profiles across Instagram / X / Facebook /
        Reddit / LinkedIn / TikTok, analyse audiences with Groq, and
        publish campaigns back across the same set of platforms via
        the operator's connected accounts.
      metadata: {source: "starter-seed", section: "overview"}
    - id: scrapper-jobs
      text: |
        A scrape job runs the platform-specific scraper, persists
        profiles in Postgres, and emits a marketing report. Jobs can
        be cancelled mid-run; partial profiles already collected are
        kept. Failed scrapers retry with exponential backoff up to
        three times before the job is marked failed.
      metadata: {source: "starter-seed", section: "jobs"}
    - id: scrapper-tos
      text: |
        The scraper only collects PUBLIC profile data. It does not
        bypass authentication, scrape private posts, or collect DMs.
        Each platform's terms of service apply — if a platform issues
        a takedown, the scraper for that platform is paused until the
        operator confirms compliance.
      metadata: {source: "starter-seed", section: "tos", regulated: true}
