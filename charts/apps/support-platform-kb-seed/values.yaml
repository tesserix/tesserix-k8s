namespace: support-platform

# python:3.12-slim + pgvector + httpx is enough to call the embedder
# and write rows. Job runs to completion in seconds for the starter
# content; image is pulled once and reused for every re-seed.
image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi

# Service URLs inside the cluster — match the existing slm-router env.
embedderURL: http://support-platform-embedder.support-platform.svc.cluster.local:8001
postgresHost: support-platform-postgres-rw.support-platform.svc.cluster.local
postgresPort: 5432
postgresUser: support_platform
postgresDB: support_platform
postgresPasswordSecret: support-platform-postgres-app
postgresPasswordKey: password

# Per-tenant starter content. Each key is the slm-router rag_namespace,
# value is a list of {id, text, metadata} entries. Real product
# documentation is layered on top later — this is just enough so the
# SLM's first answer cites SOMETHING from each tenant.
content:
  mark8ly:
    # ==== Overview =========================================================
    - id: mark8ly-overview
      text: |
        Mark8ly is a multi-tenant SaaS marketplace. Each store runs on its own
        subdomain (storename.mark8ly.com). Customers reach support via the chat
        bubble at the bottom-right of any storefront page. Common areas: account/
        sign-in, browsing, cart & checkout, payment, orders & shipping, returns
        & refunds, coupons, gift cards, reviews.
      metadata: {section: "overview"}

    # ==== Account & sign-in ================================================
    - id: mark8ly-account-session-expired
      text: |
        ISSUE: Session expired ("Your session has expired" or redirect to /login
        even right after signing in).
        CAUSE: HttpOnly session cookie reached its 24h expiry, browser cleared
        cookies, or customer is on a different store's subdomain.
        SOLUTION: Tell the customer to clear cookies and sign in again on the
        EXACT store subdomain shown in the URL (e.g. storename.mark8ly.com — not
        a sibling store's domain). Cookies are scoped per store.
        ESCALATE: Same-subdomain re-login still fails, OR shared browser session.
      metadata: {section: "account", issue_id: "session-expired"}
    - id: mark8ly-account-email-verify-expired
      text: |
        ISSUE: "This verification link is invalid or has expired."
        CAUSE: Email verification tokens are single-use and expire after 7 days.
        SOLUTION: Customer should click "Request a new verification email" on the
        signup or account page and check spam/junk. Each link can only be used once.
        ESCALATE: Original email never arrived AND resend doesn't either after 5min.
      metadata: {section: "account", issue_id: "email-verify-expired"}
    - id: mark8ly-account-password-reset-expired
      text: |
        ISSUE: Password reset link says "invalid or expired".
        CAUSE: Reset tokens are single-use and expire 1 hour after issue.
        SOLUTION: Re-enter email on the forgot-password page, request a fresh
        link, then use it within 1 hour.
        ESCALATE: Customer clicks reset within minutes and still gets "expired",
        or reset email never arrives.
      metadata: {section: "account", issue_id: "password-reset-expired"}
    - id: mark8ly-account-mfa-already-enabled
      text: |
        ISSUE: "MFA is already enabled — disable it first to re-enrol."
        CAUSE: Customer enrolled TOTP previously, reset their device, and is now
        trying to enrol again without disabling.
        SOLUTION: Account Settings → Security → Disable MFA (needs existing
        authenticator code), then re-enrol with the new device.
        ESCALATE: Lost access to the old authenticator and can't complete the
        disable flow — needs staff to reset MFA on the account.
      metadata: {section: "account", issue_id: "mfa-already-enabled"}
    - id: mark8ly-account-mfa-invalid-code
      text: |
        ISSUE: "Verification code is incorrect."
        CAUSE: Wrong 6-digit code, device clock skew, or code rotated mid-entry
        (codes change every 30s).
        SOLUTION: Wait 3-5 seconds for a fresh code, then re-enter. Ensure phone
        time is set to Auto (Settings → Date & Time).
        ESCALATE: Phone clock is correct and customer is using the right account
        in the authenticator app, but still rejected on multiple tries.
      metadata: {section: "account", issue_id: "mfa-invalid-code"}

    # ==== Browsing & search ================================================
    - id: mark8ly-browse-product-not-found
      text: |
        ISSUE: "I can't find the product I saw yesterday."
        CAUSE: Product was unpublished by the merchant, went out of stock, or
        the customer is on the wrong store's subdomain.
        SOLUTION: Search by exact product name or SKU. Confirm the store slug in
        the URL matches the original link. "In stock only" filters can hide
        unavailable items.
        ESCALATE: Customer has the exact name/SKU and recently bought it — the
        product may have been removed in error.
      metadata: {section: "browse", issue_id: "product-not-found"}
    - id: mark8ly-browse-store-not-found
      text: |
        ISSUE: "This store doesn't exist" / 404 on a store subdomain.
        CAUSE: Mistyped subdomain, store voluntarily closed, store suspended for
        billing, or subdomain was renamed.
        SOLUTION: Verify the URL with the store owner. Stores can be temporarily
        closed; the customer should retry later or contact the store directly.
        ESCALATE: Store admin says it should be live and customer URL is correct.
      metadata: {section: "browse", issue_id: "store-not-found"}

    # ==== Cart & checkout ==================================================
    - id: mark8ly-checkout-currency-mismatch
      text: |
        ISSUE: "Item currency does not match store currency" at checkout.
        CAUSE: Storefront sent the price in the wrong currency — usually a
        frontend cache issue.
        SOLUTION: Refresh the page and rebuild the cart. All item prices should
        be in the store's default currency (shown on product pages).
        ESCALATE: Persists after a hard refresh, or only happens for specific
        products on the same store.
      metadata: {section: "checkout", issue_id: "currency-mismatch"}
    - id: mark8ly-checkout-too-many-addresses
      text: |
        ISSUE: "You've reached the maximum of 5 saved addresses."
        CAUSE: v1 caps each customer at 5 saved shipping addresses.
        SOLUTION: Account → Saved Addresses → delete an unused address, then add
        the new one.
        ESCALATE: Never — this is enforced by design.
      metadata: {section: "checkout", issue_id: "too-many-addresses"}
    - id: mark8ly-checkout-idempotency-conflict
      text: |
        ISSUE: "Idempotency key was previously used with a different payload."
        CAUSE: Customer modified the cart (qty/price) and retried with the same
        idempotency key the frontend already used.
        SOLUTION: If an order exists, do not retry — they already have it. If
        not, start a fresh checkout so a new key is generated. Don't manually
        retry with the same key.
        ESCALATE: Two orders exist when the customer meant to place one, OR
        payment was charged twice.
      metadata: {section: "checkout", issue_id: "idempotency-conflict"}
    - id: mark8ly-checkout-address-validation-failed
      text: |
        ISSUE: "Shipping address is invalid" at checkout.
        CAUSE: Postal code format wrong for the country, missing required field
        (city/region/phone), or address not in the validation service's DB yet.
        SOLUTION: Confirm postal-code format (US 12345, India 123456 etc.). Fill
        every required field. Try slightly different spellings for very new
        addresses.
        ESCALATE: Address is verifiably correct but validation keeps rejecting.
      metadata: {section: "checkout", issue_id: "address-validation"}

    # ==== Payment ==========================================================
    - id: mark8ly-payment-gateway-not-configured
      text: |
        ISSUE: "Gateway not configured" or "Payment service unavailable" on the
        payment step.
        CAUSE: Store owner hasn't activated Stripe/Razorpay yet, or their
        encrypted gateway secrets are missing/corrupted.
        SOLUTION: Contact the store owner — checkout won't work on this store
        until they finish payment setup. Offer to come back once they confirm.
        ESCALATE: Store says they configured the gateway but customers still see
        the error.
      metadata: {section: "payment", issue_id: "gateway-not-configured"}
    - id: mark8ly-payment-razorpay-signature-mismatch
      text: |
        ISSUE: "Signature mismatch" / "Payment verification failed" after the
        Razorpay widget closes.
        CAUSE: Stale Razorpay config in the browser cache after the store rotated
        its webhook secret, or rarely, a corporate proxy tampering with the body.
        SOLUTION: Hard-refresh the browser (Cmd-Shift-R / Ctrl-Shift-R) and retry
        the payment. Customer wasn't debited — pending payments are released by
        the bank within minutes.
        ESCALATE: Hard refresh doesn't help, OR multiple customers on the same
        store report identical errors at once.
      metadata: {section: "payment", issue_id: "razorpay-signature"}

    # ==== Orders & shipping ================================================
    - id: mark8ly-order-cannot-cancel
      text: |
        ISSUE: "This order is not in a state where it can be cancelled."
        CAUSE: Order has shipped (carrier already has it), OR order is still
        "pending payment" (resolve payment or cancel from there, not the order
        page).
        SOLUTION: Orders cancel only between "paid" and "shipped". If shipped,
        customer should open a return after delivery instead.
        ESCALATE: Order is clearly not shipped but the cancel button is greyed,
        or customer has a receipt showing it was placed minutes ago.
      metadata: {section: "orders", issue_id: "cannot-cancel"}
    - id: mark8ly-order-no-shipping-rates
      text: |
        ISSUE: "Unable to calculate shipping rates" / no shipping options shown.
        CAUSE: PIN / postal code is outside the store's serviceable area, OR a
        required field is missing (India needs phone), OR address invalid.
        SOLUTION: Confirm the PIN code matches the country and that phone is
        filled for India. Check the store's shipping FAQ for supported regions.
        ESCALATE: A serviceable PIN returns no rates, or rates were previously
        available for the same PIN but now aren't.
      metadata: {section: "orders", issue_id: "no-shipping-rates"}
    - id: mark8ly-order-late-delivery
      text: |
        ISSUE: "My order is late, where is it?"
        CAUSE: Carrier delay (weather, ops, last-mile congestion). Tracking can
        also lag the actual location by 24-48h.
        SOLUTION: Share the tracking link on the order page. Delivery estimates
        are not guarantees — carrier delays of 2-5 days are common during peak.
        If tracking shows "out for delivery" but it doesn't arrive within 24h,
        come back and we'll escalate.
        ESCALATE: Marked "delivered" but never received, OR tracking stuck on
        "pending" for >7 days.
      metadata: {section: "orders", issue_id: "late-delivery"}
    - id: mark8ly-order-missing-or-damaged
      text: |
        ISSUE: "Item didn't arrive" or "Arrived broken."
        CAUSE: Missing-from-shipment, transit damage, wrong item picked, or
        delivered to the wrong address.
        SOLUTION: Open a return from the order page (Request Return), pick the
        matching reason, and attach photos if available. The store reviews and
        responds within 5 business days. Refund or replacement follows.
        ESCALATE: Return is rejected and customer disputes the assessment, OR
        package was visibly tampered (different sealing).
      metadata: {section: "orders", issue_id: "missing-or-damaged"}

    # ==== Returns & refunds ================================================
    - id: mark8ly-return-cant-return
      text: |
        ISSUE: "This order can't be returned in its current state."
        CAUSE: Returns only fire on shipped/delivered orders. Pending or
        cancelled orders use the cancel flow instead.
        SOLUTION: If the order hasn't shipped, use Cancel Order. If it has,
        Return becomes available after delivery is marked.
        ESCALATE: Order shipped >50 days ago and customer just noticed — store
        policy may need to be checked.
      metadata: {section: "returns", issue_id: "cant-return"}
    - id: mark8ly-return-already-open
      text: |
        ISSUE: "A return request already exists for this order."
        CAUSE: v1 only allows one open return per order at a time.
        SOLUTION: Customer should check the existing return's status. They can
        file another only after the first is resolved or rejected.
        ESCALATE: Customer needs to amend an open return (add items) — that
        path doesn't exist in v1 and needs a staff override.
      metadata: {section: "returns", issue_id: "already-open"}
    - id: mark8ly-return-rejected
      text: |
        ISSUE: "Your return was rejected."
        CAUSE: Item outside policy (custom / final-sale), return window expired,
        or item appears used / damaged by the customer.
        SOLUTION: Read the rejection reason in return details. If customer
        disagrees, ask them to reply with photos of the item's current condition
        and the store will review.
        ESCALATE: Rejection reason is vague, OR a refund was promised in writing.
      metadata: {section: "returns", issue_id: "rejected"}
    - id: mark8ly-return-refund-not-received
      text: |
        ISSUE: "I returned the item but no refund yet."
        CAUSE: Either still pending approval, OR approved within the last 10
        business days, OR refunded to wallet vs card.
        SOLUTION: Approved returns refund in 5-10 business days to the original
        payment method. Bank settlement adds 2-3 more days. Confirm the customer
        is checking the same card they paid with.
        ESCALATE: Approved >10 business days ago and nothing on the card, OR
        refund went to wallet without the customer's consent.
      metadata: {section: "returns", issue_id: "refund-not-received"}

    # ==== Vendor / multi-tenant ============================================
    - id: mark8ly-tenant-wrong-store
      text: |
        ISSUE: "I placed an order on Store A but it shows on Store B."
        CAUSE: Customer has accounts on both stores and signed in to the wrong
        one. Each store has its own account + order list — they don't bleed.
        SOLUTION: Sign out completely, clear cookies, sign back in on the SAME
        subdomain where the order was placed.
        ESCALATE: Customer has only one account and orders genuinely appear
        on a different store.
      metadata: {section: "tenant", issue_id: "wrong-store"}
    - id: mark8ly-tenant-store-closed
      text: |
        ISSUE: "This store doesn't exist" or "Store temporarily unavailable."
        CAUSE: Store owner paused/closed the store, store subscription expired,
        or subdomain was renamed.
        SOLUTION: Contact the store owner directly. The mark8ly platform doesn't
        force stores open.
        ESCALATE: Store owner says they did not close it.
      metadata: {section: "tenant", issue_id: "store-closed"}

    # ==== Coupons / discounts ==============================================
    - id: mark8ly-coupon-not-found
      text: |
        ISSUE: "Coupon CODE not found."
        CAUSE: Typo or wrong case — coupon codes are case-sensitive.
        SOLUTION: Copy-paste the code directly from the email/ad to avoid typos.
        ESCALATE: Customer has the email with the exact code and store confirms
        it should be valid.
      metadata: {section: "coupons", issue_id: "not-found"}
    - id: mark8ly-coupon-expired
      text: |
        ISSUE: "Coupon has expired."
        CAUSE: Past the campaign end date or the store ended the campaign early.
        SOLUTION: Ask the store for a replacement code if the original email
        promised a longer window.
        ESCALATE: Email explicitly says "valid until <future date>" but system
        says expired.
      metadata: {section: "coupons", issue_id: "expired"}
    - id: mark8ly-coupon-usage-limit
      text: |
        ISSUE: "Coupon has reached its usage limit."
        CAUSE: Store-set max total uses, or max uses per customer, has been hit.
        SOLUTION: This specific code is no longer redeemable. Ask the store for
        an alternate code.
        ESCALATE: Never — usage caps are working as intended.
      metadata: {section: "coupons", issue_id: "usage-limit"}
    - id: mark8ly-coupon-min-purchase
      text: |
        ISSUE: "Coupon requires a minimum purchase of X."
        CAUSE: Subtotal is below the minimum spend the coupon requires.
        SOLUTION: Add items so the cart subtotal hits the threshold. The discount
        applies automatically once you do.
        ESCALATE: Never — this is by design.
      metadata: {section: "coupons", issue_id: "min-purchase"}

    # ==== Gift cards / loyalty =============================================
    - id: mark8ly-giftcard-not-found
      text: |
        ISSUE: "Gift card not found."
        CAUSE: Wrong card number, copy-paste error, or store revoked the card.
        SOLUTION: Copy the number directly from the email/receipt. Confirm with
        the store if the card should still be valid.
        ESCALATE: Customer has the receipt and store confirms the card was
        issued.
      metadata: {section: "giftcard", issue_id: "not-found"}
    - id: mark8ly-giftcard-expired
      text: |
        ISSUE: "Gift card has expired."
        CAUSE: Past the expiry the store set when the card was issued.
        SOLUTION: If it was a promotional card the store may reissue — customer
        should ask. Purchased cards usually have longer windows.
        ESCALATE: Card expired recently and no expiry warning email was sent.
      metadata: {section: "giftcard", issue_id: "expired"}
    - id: mark8ly-giftcard-insufficient
      text: |
        ISSUE: "Gift card balance is too low to complete purchase."
        CAUSE: Prior redemptions reduced the balance below the order total.
        SOLUTION: Check the live balance on the store's gift-card balance page.
        Pay the difference with another method, or combine multiple cards.
        ESCALATE: Customer says the balance should be higher than shown.
      metadata: {section: "giftcard", issue_id: "insufficient"}
    - id: mark8ly-loyalty-points-not-credited
      text: |
        ISSUE: "My loyalty points didn't increase after a purchase."
        CAUSE: Customer isn't enrolled, OR points are batch-credited after the
        order moves from "paid" to "confirmed" (up to 48h delay), OR the order
        was refunded so points reversed.
        SOLUTION: Enrol in Account → Loyalty if not already. Points credit after
        order confirmation, not order placement. Check Points History for the
        most recent ledger row.
        ESCALATE: Points disappeared on a confirmed order, OR customer is
        enrolled and confirmed orders show no credit for >48h.
      metadata: {section: "loyalty", issue_id: "points-not-credited"}
    - id: mark8ly-loyalty-insufficient-points
      text: |
        ISSUE: "You don't have enough points to redeem this."
        CAUSE: Balance below the redemption threshold, or points already
        expired off the balance.
        SOLUTION: Show the customer the current balance in Account → Loyalty.
        They need more points before this redemption is available.
        ESCALATE: Never — this is the expected behaviour when balance is low.
      metadata: {section: "loyalty", issue_id: "insufficient-points"}

    # ==== Reviews ==========================================================
    - id: mark8ly-review-already-reviewed
      text: |
        ISSUE: "You have already reviewed this product."
        CAUSE: Customer already submitted a review — one review per
        customer per product.
        SOLUTION: Find the existing review on the product page (or My Reviews).
        Edit or delete it (within the edit window) and resubmit.
        ESCALATE: Customer insists they never reviewed it AND no review shows
        — the review may be sitting in moderation.
      metadata: {section: "reviews", issue_id: "already-reviewed"}
    - id: mark8ly-review-validation-failed
      text: |
        ISSUE: "Posting review blocked" / validation error.
        CAUSE: Review body >5000 chars, title >300 chars, empty content, or
        rating not in 1-5.
        SOLUTION: Trim to under the limits and use a 1-5 star rating, then
        resubmit.
        ESCALATE: Customer claims the body was well under 5000 chars and still
        rejected — the profanity filter may be over-matching.
      metadata: {section: "reviews", issue_id: "validation-failed"}
    - id: mark8ly-review-not-appearing
      text: |
        ISSUE: "I posted a review but I can't see it."
        CAUSE: Review is awaiting store moderation (24-48h is normal) or was
        held by the spam filter.
        SOLUTION: My Reviews page shows the current approval status. Approved
        reviews appear publicly within minutes of approval.
        ESCALATE: Pending >5 days, OR auto-rejected and customer disputes the
        reason.
      metadata: {section: "reviews", issue_id: "not-appearing"}

  fanzone:
    - id: fanzone-overview
      text: |
        FanZone Battle Ground is a cricket fan engagement platform.
        Real-time match chat, prediction games, IPL coverage, leaderboards
        and points. Users sign in with Google or Meta via Firebase.
      metadata: {source: "starter-seed", section: "overview"}
    - id: fanzone-points
      text: |
        Points are earned by predicting match outcomes correctly,
        chatting in active battle rooms during live matches, and daily
        login streaks. The leaderboard refreshes hourly. Points are NOT
        redeemable for real money; they unlock badges, predictions of
        higher stake, and ranking on the fan leaderboard.
      metadata: {source: "starter-seed", section: "points"}
    - id: fanzone-predictions
      text: |
        Predictions close at the toss of the match. Once locked, a
        prediction can't be changed. If a match is abandoned without
        a result, the prediction is voided and the staked points
        returned. If a match is rain-affected with a DLS result, the
        prediction is settled against the DLS winner.
      metadata: {source: "starter-seed", section: "predictions"}

  homechef:
    - id: homechef-overview
      text: |
        HomeChef (fe3dr.com) connects customers with home chefs in
        their neighbourhood for fresh home-cooked food, delivered.
        Browse local chefs, place an order, and track delivery in real
        time. Available in selected cities in India and Australia.
      metadata: {source: "starter-seed", section: "overview"}
    - id: homechef-delivery
      text: |
        Delivery windows are 30-45 minutes typical; the order page
        shows a live ETA. Drivers send status updates and a final
        delivery photo. If a delivery is more than 20 minutes past
        the ETA, contact support and we'll either expedite or refund
        the delivery fee.
      metadata: {source: "starter-seed", section: "delivery"}
    - id: homechef-refunds
      text: |
        Refunds are processed for missing items, incorrect orders,
        and food-safety concerns. If you feel unwell after a meal,
        STOP eating it, photograph the dish, and contact support
        immediately. We refund the full order and escalate to the
        chef and our food-safety partner within 1 hour.
      metadata: {source: "starter-seed", section: "refunds", urgent: true}

  stockpilot:
    - id: stockpilot-overview
      text: |
        StockPilot is an AI stock-analysis and trading platform. It
        runs multi-agent research workflows (LangGraph) backed by
        Alpaca Markets for execution. Demo mode uses paper trading
        with a $100K virtual balance; live mode requires a connected
        Alpaca brokerage account.
      metadata: {source: "starter-seed", section: "overview"}
    - id: stockpilot-disclaimer
      text: |
        StockPilot is NOT a financial adviser. The AI agents produce
        analysis and trade ideas; you decide whether to act. Past
        performance does not predict future results. Markets can move
        against an agent's thesis without warning. Never invest more
        than you can afford to lose.
      metadata: {source: "starter-seed", section: "disclaimer", regulated: true}
    - id: stockpilot-broker
      text: |
        Broker connection is done via Alpaca Markets OAuth. Sandbox
        uses broker-api.sandbox.alpaca.markets; production uses
        broker-api.alpaca.markets. If your portfolio shows "broker
        disconnected", re-authenticate from Settings -> Broker.
        Open positions are not affected by a transient disconnection.
      metadata: {source: "starter-seed", section: "broker"}

  gameverse:
    - id: gameverse-overview
      text: |
        GameVerse is a multiplayer board-games platform — Ludo, Chess,
        Checkers, Snakes & Ladders, Word Stack, and more. The shell
        app is the lobby; each game is a standalone module that loads
        in the same shell so your sign-in, ratings and friends stay
        consistent across games.
      metadata: {source: "starter-seed", section: "overview"}
    - id: gameverse-rules
      text: |
        Game-specific rules live on each game's lobby page. Server-side
        engines run the authoritative game state — dice, shuffles, and
        AI opponents all run on the server in Rust, so client
        modifications cannot influence outcomes.
      metadata: {source: "starter-seed", section: "rules"}
    - id: gameverse-matchmaking
      text: |
        Multiplayer pairing is Glicko-2-rating based. New accounts
        start at rating 1500; each win/loss against a rated opponent
        adjusts your rating. If a match-up is taking too long, the
        rating window widens automatically every 30 seconds. Manual
        room codes bypass matchmaking — share a code with friends.
      metadata: {source: "starter-seed", section: "matchmaking"}

  horoscope:
    - id: horoscope-overview
      text: |
        Tesserix Horoscope offers natal charts, daily/weekly/monthly
        transits, and palm + face readings across Western, Vedic
        (sidereal) and Mian Xiang traditions. Sign in with Google,
        fill in birth details, and the chart engine produces your
        personalised reading.
      metadata: {source: "starter-seed", section: "overview"}
    - id: horoscope-disclaimer
      text: |
        Charts and readings are for entertainment and self-reflection
        ONLY. They are NOT medical, legal, psychological, financial,
        romantic, or safety advice. If you are facing a health,
        financial, legal or safety concern, consult an appropriately
        qualified professional. In Australia, Lifeline is available
        24/7 at 13 11 14 for crisis support.
      metadata: {source: "starter-seed", section: "disclaimer", regulated: true}
    - id: horoscope-providers
      text: |
        Chart compute is provider-agnostic. By default the internal
        Keplerian engine answers; if the operator sets
        ASTROLOGY_PRIMARY to prokerala / astrologyapi / freeastro the
        dispatcher prefers that provider with the internal engine as
        an always-available fallback.
      metadata: {source: "starter-seed", section: "providers"}

  scrapper:
    - id: scrapper-overview
      text: |
        Social Media Scrapper is a marketing-intelligence platform.
        Scrape public profiles across Instagram / X / Facebook /
        Reddit / LinkedIn / TikTok, analyse audiences with Groq, and
        publish campaigns back across the same set of platforms via
        the operator's connected accounts.
      metadata: {source: "starter-seed", section: "overview"}
    - id: scrapper-jobs
      text: |
        A scrape job runs the platform-specific scraper, persists
        profiles in Postgres, and emits a marketing report. Jobs can
        be cancelled mid-run; partial profiles already collected are
        kept. Failed scrapers retry with exponential backoff up to
        three times before the job is marked failed.
      metadata: {source: "starter-seed", section: "jobs"}
    - id: scrapper-tos
      text: |
        The scraper only collects PUBLIC profile data. It does not
        bypass authentication, scrape private posts, or collect DMs.
        Each platform's terms of service apply — if a platform issues
        a takedown, the scraper for that platform is paused until the
        operator confirms compliance.
      metadata: {source: "starter-seed", section: "tos", regulated: true}
