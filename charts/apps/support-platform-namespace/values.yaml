namespace: support-platform

# Namespaces whose workloads are allowed to call INTO support-platform.
# - istio-ingress lets edge traffic reach Otto via tesseract-gateway.
# - mark8ly / fanzone / homechef / tesserix Next.js proxies call Otto and the
#   slm-router over the in-mesh service DNS.
# - The product MCP servers live in the product namespaces; slm-router calls
#   THEM, so the per-product NetworkPolicies on the MCP charts open the
#   reverse direction.
allowedSources:
  - istio-ingress
  - support-platform
  - mark8ly
  - fanzone
  - homechef
  # tesserix-home (company app) proxies /api/otto to the shared Otto.
  - tesserix
  # Every remaining product that mounts the Otto widget: its server-side
  # proxy dials otto over in-mesh DNS, so it needs L3 ingress here. Each
  # is a tenant in slm-router's routes + the kb-seed namespaces.
  - marketplace
  - gameverse
  - stockpilot
  - scrapper
  - kora

# Cluster pod CIDR for the HBONE NetworkPolicy. tesseract-prod-in-gke uses
# the default GKE pod CIDR for the asia-south1 region. If this is wrong the
# whole namespace silently loses east-west connectivity (the silent-failure
# trap documented in the ambient memory).
podCIDR: 10.20.0.0/16
