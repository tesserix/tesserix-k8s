# Permissive mTLS by default — ambient is providing the wire encryption.
# Per the ambient public-app checklist memory, ISTIO_MUTUAL strict mode
# on a namespace with public Next.js proxies coming in over plain HTTP
# from the ingress gateway is a footgun.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ .Values.namespace }}
spec:
  mtls:
    mode: PERMISSIVE
