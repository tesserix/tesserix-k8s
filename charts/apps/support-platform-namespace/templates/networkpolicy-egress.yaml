# Broad egress allow for support-platform pods.
#
# Why broad: slm-inference's init container downloads a 1GB GGUF model
# from huggingface.co at first boot; TEI does the same. ArgoCD-managed
# CNPG bootstrap pulls images from ghcr.io. Lots of external hosts on
# transient first-boot paths. A tight allow-list is rebuild-by-rebuild
# maintenance; the trust boundary here is the namespace AuthorizationPolicy
# (ingress) rather than egress filtering.
#
# Excluded: GKE metadata IP 169.254.169.254 — only reachable via
# Workload Identity, never via direct curl from a pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-broad
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
