# Ambient HBONE allow-list. Without this, all east-west traffic through
# the ztunnel silently fails (the 2026-04-12 auth outage was caused by a
# missing 15008 rule on an ambient namespace). Allow TCP 15008 to/from the
# cluster pod CIDR explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbone-15008
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
      from:
        - ipBlock:
            cidr: {{ .Values.podCIDR }}
  egress:
    - ports:
        - protocol: TCP
          port: 15008
      to:
        - ipBlock:
            cidr: {{ .Values.podCIDR }}
---
# In-namespace traffic + allowed sources. We don't use the in-mesh-only
# trick because we have a few non-meshed components (CNPG operator probes
# from cnpg-system) that need to reach pods on management ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-in-namespace-and-sources
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.allowedSources }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        # cnpg-system operator must reach CNPG pods on port 8000 (probes).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        # ESO controller reads/writes Secret objects.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
