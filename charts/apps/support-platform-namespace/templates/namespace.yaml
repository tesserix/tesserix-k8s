apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: support-platform
    # Ambient mode (NOT sidecar). Otto's WebSocket connections and
    # slm-router's long-lived inference calls work better without the
    # per-pod Envoy hop.
    istio.io/dataplane-mode: ambient
    # TIG deletion guard — VAP lives in k8s/cluster/namespace-protection.yaml
    tesserix.io/protected: "true"
    tesserix.io/tier: application
