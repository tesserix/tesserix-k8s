{{- /* Generate ServiceEntry + DestinationRule for each external backend (Cloud Run) */ -}}
{{- $seen := dict -}}
{{- range .Values.ingress.backendServices }}
{{- if .externalHost }}
{{- if not (hasKey $seen .externalHost) }}
{{- $_ := set $seen .externalHost true }}
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: ext-{{ .externalHost | replace "." "-" | trunc 63 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fanzone-web.labels" $ | nindent 4 }}
spec:
  hosts:
    - {{ .externalHost }}
  location: MESH_EXTERNAL
  ports:
    - number: {{ .externalPort | default 443 }}
      name: https
      protocol: TLS
  resolution: DNS
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ext-{{ .externalHost | replace "." "-" | trunc 63 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fanzone-web.labels" $ | nindent 4 }}
spec:
  host: {{ .externalHost }}
  trafficPolicy:
    tls:
      mode: SIMPLE
      sni: {{ .externalHost }}
{{- end }}
{{- end }}
{{- end }}
