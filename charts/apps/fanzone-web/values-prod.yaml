# Production overrides for fanzone-web
# Use with: helm upgrade --values values.yaml --values values-prod.yaml

image:
  pullPolicy: IfNotPresent

# Knative Serving — always-on (minScale: 1, never scales to zero)
knative:
  enabled: true
  minScale: 0
  maxScale: 10
  scaleDownDelay: "60s"

# Disable traditional Deployment-based autoscaling — Knative handles it
autoscaling:
  enabled: false

keda:
  enabled: false

# =============================================================================
# Backend Service Routing (Istio VirtualService)
# =============================================================================
# Knative services use knative: true — routes through the Knative local gateway
# for scale-to-zero support (activator stays in the data path).
# GKE services use serviceName/servicePort (direct in-cluster routing).
# Order matters: Istio matches top-to-bottom, first match wins.
# =============================================================================
ingress:
  backendServices:
    # ---------------------------------------------------------
    # SportsBook service routes — GKE Knative (scale-to-zero)
    # MUST be before /api/v1/sports to avoid prefix collision
    # ---------------------------------------------------------
    - path: /api/v1/sportsbook
      pathType: Prefix
      knative: true
      serviceName: fanzone-sportsbook
    # ---------------------------------------------------------
    # Sports Data routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/sports
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/cricket
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/nfl
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/nba
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/nhl
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/mlb
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/ratings
      pathType: Prefix
      knative: true
      serviceName: sports-data
    - path: /api/v1/admin/hot-game
      pathType: Prefix
      knative: true
      serviceName: sports-data
    # ---------------------------------------------------------
    # User service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/users
      pathType: Prefix
      knative: true
      serviceName: fanzone-user
    - path: /api/v1/user
      pathType: Prefix
      knative: true
      serviceName: fanzone-user
    - path: /api/v1/leaderboard
      pathType: Prefix
      knative: true
      serviceName: fanzone-user
    - path: /api/v1/rooms
      pathType: Prefix
      knative: true
      serviceName: fanzone-user
    # ---------------------------------------------------------
    # Notification service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/notifications
      pathType: Prefix
      knative: true
      serviceName: fanzone-notification
    # ---------------------------------------------------------
    # Prediction service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/predictions
      pathType: Prefix
      knative: true
      serviceName: fanzone-prediction
    - path: /api/v1/admin/predictions
      pathType: Prefix
      knative: true
      serviceName: fanzone-prediction
    # ---------------------------------------------------------
    # Admin pool routes — GKE Knative (user service)
    # ---------------------------------------------------------
    - path: /api/v1/admin/pool
      pathType: Prefix
      knative: true
      serviceName: fanzone-user
    # ---------------------------------------------------------
    # Admin point config routes — GKE Knative (user service)
    # ---------------------------------------------------------
    - path: /api/v1/admin/point-config
      pathType: Prefix
      knative: true
      serviceName: fanzone-user
    # ---------------------------------------------------------
    # Chat service routes — GKE Knative (scale-to-zero via local gateway)
    # ---------------------------------------------------------
    - path: /api/rooms
      pathType: Prefix
      knative: true
      serviceName: fanzone-chat
    # ---------------------------------------------------------
    # Media service routes — GKE Knative (scale-to-zero via local gateway)
    # ---------------------------------------------------------
    - path: /api/media
      pathType: Prefix
      knative: true
      serviceName: fanzone-media
    # ---------------------------------------------------------
    # Docs route — GKE Knative (fanzone-api)
    # ---------------------------------------------------------
    - path: /docs
      pathType: Prefix
      knative: true
      serviceName: fanzone-api
    # ---------------------------------------------------------
    # Commentary service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /commentary/
      pathType: Prefix
      knative: true
      serviceName: fanzone-commentary
      rewrite: /
    # ---------------------------------------------------------
    # Fan Connect service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/fan-connect
      pathType: Prefix
      knative: true
      serviceName: fanzone-fan-connect
    # ---------------------------------------------------------
    # Quest service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/quest
      pathType: Prefix
      knative: true
      serviceName: fanzone-quest
    # ---------------------------------------------------------
    # Micro Prediction service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /api/v1/micro
      pathType: Prefix
      knative: true
      serviceName: fanzone-micro-prediction
    # ---------------------------------------------------------
    # Otto support-chat — Next.js [...path] proxy in fanzone-web.
    # MUST sit above the generic /api catch-all or the Go fanzone-api
    # eats /api/otto/* and returns 404.
    # ---------------------------------------------------------
    - path: /api/otto
      pathType: Prefix
      knative: true
      serviceName: fanzone-web
    # ---------------------------------------------------------
    # Otto WebSocket + REST passthrough — the widget opens
    # wss://fanzonebattleground.com/api/v1/storefront/otto/.../ws
    # directly against the otto pod (bypasses the Next.js proxy so
    # WS upgrades aren't terminated by Knative's queue-proxy). The
    # otto service lives in the support-platform namespace, so we
    # route via externalHost.
    # ---------------------------------------------------------
    - path: /api/v1/storefront/otto
      pathType: Prefix
      externalHost: support-platform-otto.support-platform.svc.cluster.local
      externalPort: 8089
      websocket: true
    - path: /api/v1/admin/otto
      pathType: Prefix
      externalHost: support-platform-otto.support-platform.svc.cluster.local
      externalPort: 8089
      websocket: true
    # ---------------------------------------------------------
    # Generic API route — GKE Knative (fanzone-api catch-all)
    # ---------------------------------------------------------
    - path: /api
      pathType: Prefix
      knative: true
      serviceName: fanzone-api
    # ---------------------------------------------------------
    # Game service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /game/
      pathType: Prefix
      knative: true
      serviceName: fanzone-game
      rewrite: /
    # ---------------------------------------------------------
    # Book Cricket service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /book-cricket/
      pathType: Prefix
      knative: true
      serviceName: fanzone-book-cricket
      rewrite: /
    # ---------------------------------------------------------
    # Cricket Quiz service routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /cricket-quiz/
      pathType: Prefix
      knative: true
      serviceName: fanzone-cricket-quiz
      rewrite: /
    # ---------------------------------------------------------
    # Auth BFF routes — GKE Knative (scale-to-zero)
    # ---------------------------------------------------------
    - path: /bff/
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth-bff
      rewrite: /
    # ---------------------------------------------------------
    # Auth service routes — GKE Knative (always-on, minScale: 1)
    # ---------------------------------------------------------
    - path: /auth/me
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/username
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/profile
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/avatars
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /avatars/
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/admin
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/logout
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/refresh
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/phone
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/providers
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/stats
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/track
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/google
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/instagram
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    - path: /auth/twitter
      pathType: Prefix
      knative: true
      serviceName: fanzone-auth
    # /ws and /events are handled by virtualService sections below (no retries, 3600s timeout)

# =============================================================================
# WebSocket + SSE Routing (Istio VirtualService — long-lived connections)
# =============================================================================
virtualService:
  websocket:
    path: "/ws"
    knative: true
    serviceName: fanzone-ws
  sse:
    path: "/events"
    knative: true
    serviceName: fanzone-ws

# Default route: fanzone-web on GKE Knative (always-on, minScale: 1)
defaultRoute:
  knative: true
  serviceName: fanzone-web

# API subdomain VirtualService (api.fanzonebattleground.com)
apiVirtualService:
  enabled: true
  hosts:
    - "api.fanzonebattleground.com"
  defaultService:
    name: "fanzone-api"
    port: 80
    knative: true

# Pod Disruption Budget - disabled (Knative manages pods)
pdb:
  enabled: false

# Production GCP configuration
gcp:
  projectId: "tesseracthub-480811"
  workloadIdentity:
    enabled: true
    gcpServiceAccount: "app-secrets-fanzone-prod@tesseracthub-480811.iam.gserviceaccount.com"
  secretManager:
    secretPrefix: "prod"

# GIP Web API key is intentionally NOT shipped through Helm/runtime env.
# Next.js bakes NEXT_PUBLIC_* into the static client bundle at `next
# build` — runtime env on the ksvc never reaches the already-shipped
# JS. The key is supplied as a Docker build-arg in
# FanZone-Battle-Ground/.github/workflows/fanzone-web-build.yml, where
# it is read from the GitHub Actions secret NEXT_PUBLIC_GIP_API_KEY
# (which is sourced from GCP Secret Manager: prod-gip-web-api-key).
# Keeping it out of this file removes a public-repo leak vector that
# triggered a Google Security 'Publicly accessible API key' alert on
# 2026-05-13.
