apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: civiclens-api-vertex
  labels:
    {{- include "civiclens-ai-gateway.labels" . | nindent 4 }}
spec:
  ai:
    groups:
    - providers:
      - name: vertex
        vertexai:
          projectId: {{ .Values.providers.vertex.projectId }}
          region: {{ .Values.providers.vertex.region }}
          model: {{ .Values.providers.vertex.model | quote }}
        policies:
          auth:
            gcp: {}
          tls: {}
  policies:
    ai:
      routes:
        /v1/chat/completions: Completions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: civiclens-api-model
  labels:
    {{- include "civiclens-ai-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    sectionName: http
  rules:
  - matches:
    - path:
        type: Exact
        value: /v1/chat/completions
      method: POST
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Authorization
        - Cookie
        set:
        - name: Accept-Encoding
          value: identity
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: civiclens-api-vertex
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: civiclens-api-model-traffic
  labels:
    {{- include "civiclens-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: civiclens-api-model
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ .Values.clientKey.secretName }}
    authorization:
      action: Require
      policy:
        matchExpressions:
        - request.method == "POST" && json(request.body).model == "civiclens-compose"
    rateLimit:
      local:
      - requests: {{ .Values.limits.requestsPerMinute }}
        burst: {{ .Values.limits.requestBurst }}
        unit: Minutes
      - tokens: {{ printf "%.0f" .Values.limits.tokensPerHour }}
        unit: Hours
    timeouts:
      request: {{ .Values.timeout }}
    buffer:
      request:
        maxBytes: 16Mi
        failureMode: FailClosed
  backend:
    ai:
      promptGuard:
        request:
        - regex:
            action: Reject
            builtins:
            - CreditCard
            - Ssn
          response:
            message: Remove sensitive identifiers before trying again.
            statusCode: 400
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: civiclens-api-observability
  labels:
    {{- include "civiclens-ai-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
  frontend:
    http:
      maxBufferSize: 16Mi
    tracing:
      backendRef:
        kind: Service
        name: {{ .Values.tracing.serviceName }}
        namespace: {{ .Values.tracing.namespace }}
        port: {{ .Values.tracing.port }}
      protocol: HTTP
      path: /v1/traces
      clientSampling: '1.0'
      randomSampling: '1.0'
      attributes:
        add:
        - name: tesserix.product
          expression: '''civiclens'''
        - name: tesserix.service
          expression: '''civiclens-api'''
        - name: tesserix.gateway
          expression: '''{{ .Values.gateway.name }}'''
        - name: http.response.status_code
          expression: response.code
