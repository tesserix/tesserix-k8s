apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: civiclens-ai-clients
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao-civiclens-production
  target:
    name: civiclens-ai-clients
    creationPolicy: Owner
  data:
    - secretKey: civiclens-api
      remoteRef:
        key: civiclens/prod/app/civiclens-ai-gateway-key
        property: value
