apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.clientKey.secretName }}
  labels:
    {{- include "civiclens-ai-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-civiclens-production
    kind: SecretStore
  target:
    name: {{ .Values.clientKey.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: civiclens-api
      remoteRef:
        key: {{ .Values.clientKey.remoteKey }}
        property: value
