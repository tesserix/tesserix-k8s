{{- /*
Edge traffic. helivanta.com and its subdomains route through the Istio
gateway in istio-ingress before reaching any pod here (Task 7's app-of-apps
and Slice 1b's helivanta-api/helivanta-shell). The gateway only routes what
VirtualServices declare, and each app authenticates its own requests, so
admitting the whole namespace is the same trade dwellm8's publicIngress rule
makes.

Unlike dwellm8, this rule is unconditional rather than gated behind a
values.yaml toggle — the brief for this task calls for it outright, since
Slice 1b's frontends need it from day one. See task-2-report.md for this
divergence from the dwellm8 reference.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.istioIngressNamespace }}
