{{- /*
External calls, plus the one in-cluster call that is not same-namespace:
Zitadel.

The 443/TCP rule below is dwellm8's egress shape narrowed to a single port —
dwellm8 opens 0.0.0.0/0 on every port because it has no namespace-scoped
in-cluster dependency; helivanta's only such dependency is Zitadel, which
this chart names explicitly instead of widening the CIDR rule to cover it.

Zitadel's own NetworkPolicy (charts/thirdparty/zitadel/templates/
networkpolicy.yaml) already admits every mesh namespace on 8080 for token
exchange and validation — the same in-cluster path vehicle-rental-network-
policies uses — so this chart adds the matching egress allow rather than
routing that traffic back out through the public gateway.

OpenBao is deliberately absent here. See values.yaml's `zitadel` /
OpenBao comment: OpenBao's own NetworkPolicy only admits `external-secrets`
and `secret-service` as callers, so an egress allow from helivanta to
OpenBao would reach a namespace whose own ingress policy drops it — ESO
already reads OpenBao on this namespace's behalf via the existing
SecretStore/openbao-helivanta-api.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.externalEgress.excludeCIDRs }}
              - {{ . }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.externalEgress.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.zitadel.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.zitadel.port }}
