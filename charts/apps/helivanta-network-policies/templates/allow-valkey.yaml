# The API sidecar tunnels HBONE to HAProxy; global's STRICT mTLS rejects plaintext 6379.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-helivanta-api-valkey
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: helivanta-api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: global
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: global-valkey-cache
              app.kubernetes.io/component: haproxy
      ports:
        - protocol: TCP
          port: 15008
