{{- /*
Same-namespace traffic: helivanta-api → CNPG Postgres, → NATS, → OpenFGA,
and any pod-to-pod call the later Applications in this project add. Mirrors
dwellm8's and onboarding-service's allow-intra-namespace policy exactly.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [helivanta-clamav, helivanta-document-worker, helivanta-supply-evidence-worker]
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [helivanta-global-api]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
