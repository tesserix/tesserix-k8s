# Sets up + migrates the Temporal SQL schema on the CNPG database. Runs as an
# ArgoCD PreSync hook so the schema exists before the history/matching pods start
# (they FATAL without it). Idempotent: setup-schema is tolerated-if-present and
# update-schema only applies missing migrations. Retries (backoffLimit) until the
# CNPG DB is reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-ha-schema
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: temporal-ha
    app.kubernetes.io/component: schema
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
# NO ttlSecondsAfterFinished — see homechef-api/temporal-namespace-job.yaml: a TTL that
# deletes a PreSync hook Job out from under ArgoCD wedges the whole app sync.
spec:
  backoffLimit: 15
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: temporal-ha
        app.kubernetes.io/component: schema
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: {{ .Values.adminToolsImage | quote }}
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: {{ .Values.db.seeds | quote }}
            - name: SQL_PORT
              value: {{ .Values.db.port | quote }}
            - name: SQL_USER
              value: {{ .Values.db.user | quote }}
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecret }}
                  key: {{ .Values.db.passwordKey }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "== main store ({{ .Values.db.name }}) =="
              temporal-sql-tool --db {{ .Values.db.name }} setup-schema -v 0.0 || echo "setup-schema (main): already present or DB not ready"
              temporal-sql-tool --db {{ .Values.db.name }} update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
              echo "== visibility store ({{ .Values.db.visibilityName }}) =="
              temporal-sql-tool --db {{ .Values.db.visibilityName }} setup-schema -v 0.0 || echo "setup-schema (visibility): already present or DB not ready"
              temporal-sql-tool --db {{ .Values.db.visibilityName }} update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
              echo "schema setup complete"
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
