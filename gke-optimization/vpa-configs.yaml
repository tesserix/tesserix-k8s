# =============================================================================
# Vertical Pod Autoscaler (VPA) Configurations
# =============================================================================
# VPA adjusts memory requests only — this platform sets no cpu requests.
# Mode: "Auto" - automatically updates pods, "Off" - just recommends
# =============================================================================

---
# VPA for Core Services (Critical - use Auto mode cautiously)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: auth-service-vpa
  namespace: devtest
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: auth-service
        minAllowed:
          memory: 64Mi
        maxAllowed:
          memory: 1Gi
        controlledResources: ["memory"]
      - containerName: istio-proxy
        mode: "Off"  # Don't touch istio sidecar

