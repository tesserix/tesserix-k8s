apiVersion: v1
kind: ServiceAccount
metadata:
  name: devai-sandbox-operator
  namespace: devai
imagePullSecrets: [{name: ghcr-secret}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: devai-sandbox-operator}
rules:
  - apiGroups: [devai.tesserix.io]
    resources: [sandboxdatasyncs]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: devai-sandbox-operator}
subjects: [{kind: ServiceAccount, name: devai-sandbox-operator, namespace: devai}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: devai-sandbox-operator}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: devai-sandbox-operator, namespace: devai}
spec:
  replicas: 1
  selector: {matchLabels: {app: devai-sandbox-operator}}
  template:
    metadata: {labels: {app: devai-sandbox-operator}}
    spec:
      serviceAccountName: devai-sandbox-operator
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: manager
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/global/devai-sandbox-operator@sha256:88161801bc369d09f9a5bb95bc9d3805292fc31d2bc6b302104eda8951aacce0
          args: [--sync-image=asia-south1-docker.pkg.dev/tesseracthub-480811/global/devai-sandbox-sync@sha256:03f9060c6cecc76295dd19f9309e197411ceab2f70dfc389b19a90cc5bc831e0]
          ports: [{name: healthz, containerPort: 8081}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
          livenessProbe: {httpGet: {path: /healthz, port: healthz}}
          readinessProbe: {httpGet: {path: /readyz, port: healthz}}
