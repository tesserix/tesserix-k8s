apiVersion: devai.tesserix.io/v1alpha1
kind: SandboxDataSync
metadata: {name: kora-evals, namespace: kora}
spec:
  schedule: "0 2 * * *"
  source: {secretRef: {name: kora-sandbox-sync, key: source-url}}
  target: {secretRef: {name: kora-sandbox-sync, key: target-url}}
  anonymizationSaltSecretRef: {name: kora-sandbox-sync, key: anonymization-salt}
  # Target is devai_evals_db on global-postgres — one schema per product.
  tables:
    - source: public.users
      target: kora.users
      columns:
        - {name: id, transform: preserve}
        - {name: firebase_uid, transform: hash}
        - {name: email, transform: email}
        - {name: display_name, transform: name}
        - {name: apple_refresh_token, transform: redact}
