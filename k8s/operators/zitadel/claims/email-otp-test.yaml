apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: email-otp-test
  namespace: identity-operator
  labels: {app.kubernetes.io/part-of: email-otp-test}
spec:
  displayName: Tesserix Email OTP Test
  organization: Tesserix Email OTP Test
  access: {mode: public}
  consumerOrganization:
    initialAdminUserId: "387369508416782636"
    emailOtp: false
    providers: []
    primaryColor: "#3858F5"
    backgroundColor: "#F7F8FA"
    fontColor: "#151923"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: email-otp-test-native
  namespace: identity-operator
  labels: {app.kubernetes.io/part-of: email-otp-test}
spec:
  projectRef: {name: email-otp-test}
  displayName: Email OTP isolated PKCE test
  applicationType: native
  refreshToken: false
  idTokenUserinfoAssertion: true
  loginBaseUri: https://auth.tesserix.app/ui/v2/login/
  redirectUris: ["http://127.0.0.1:18085/callback"]
