apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: planning-poker
  namespace: identity-operator
spec:
  displayName: Planning Poker
  organization: TESSERIX
  access:
    mode: public
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: planning-poker-web
  namespace: identity-operator
spec:
  projectRef:
    name: planning-poker
  displayName: Planning Poker Web
  applicationType: user_agent
  loginBaseUri: https://auth.tesserix.app/ui/v2/login
  refreshToken: false
  idTokenUserinfoAssertion: true
  redirectUris:
    - https://planningpoker.tesserix.app/login/callback
  postLogoutRedirectUris:
    - https://planningpoker.tesserix.app/login
