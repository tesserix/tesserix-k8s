apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: roamie
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: roamie
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  displayName: Roamie
  organization: TESSERIX
  access:
    mode: public
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: roamie-ios
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: roamie
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: roamie
  displayName: Roamie iOS
  applicationType: native
  refreshToken: true
  redirectUris:
    - "roamie:/auth/callback"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: roamie-android
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: roamie
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: roamie
  displayName: Roamie Android
  applicationType: native
  refreshToken: true
  redirectUris:
    - "roamie:/auth/callback"
