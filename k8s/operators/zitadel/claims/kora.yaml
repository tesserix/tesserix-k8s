apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: kora
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  displayName: Kora
  organization: TESSERIX
  access:
    mode: public
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: kora-ios
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: kora
  displayName: Kora iOS
  applicationType: native
  refreshToken: true
  redirectUris:
    - "com.tesserix.kora:/auth/callback"
  postLogoutRedirectUris:
    - "com.tesserix.kora:/auth/logout"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: kora-android
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: kora
  displayName: Kora Android
  applicationType: native
  refreshToken: true
  redirectUris:
    - "com.tesserix.kora:/auth/callback"
  postLogoutRedirectUris:
    - "com.tesserix.kora:/auth/logout"
---
# kora-api's ZITADEL_DELETER_TOKEN: deletes a Kora user's Zitadel identity on
# DELETE /v1/me and on the admin delete. The operator grants no roles; this
# user holds ORG_USER_MANAGER on TESSERIX, granted by hand and asserted by
# zitadel-bootstrap's desired.orgMemberships. See docs/zitadel.md.
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelMachineUser
metadata:
  name: kora-account-deleter
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  organization: TESSERIX
  userName: kora-account-deleter
  displayName: Kora account deleter
  credential: personalAccessToken
---
# cmd/aieval's KORA_EVAL_CLIENT_SECRET (client ID kora-eval). Gets Kora-audience
# JWTs through client_credentials for gated AI evals.
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelMachineUser
metadata:
  name: kora-eval
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  organization: TESSERIX
  userName: kora-eval
  displayName: Kora eval
  credential: clientSecret
