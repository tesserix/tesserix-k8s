apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: kora
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  displayName: Kora
  organization: TESSERIX
  access:
    mode: public
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: kora-ios
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: kora
  displayName: Kora iOS
  applicationType: native
  refreshToken: true
  redirectUris:
    - "com.tesserix.kora:/auth/callback"
  postLogoutRedirectUris:
    - "com.tesserix.kora:/auth/logout"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: kora-android
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: kora
  displayName: Kora Android
  applicationType: native
  refreshToken: true
  redirectUris:
    - "com.tesserix.kora:/auth/callback"
  postLogoutRedirectUris:
    - "com.tesserix.kora:/auth/logout"
