apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelprojects.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelProject
    listKind: ZitadelProjectList
    plural: zitadelprojects
    singular: zitadelproject
    shortNames:
      - zproject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - displayName
                - organization
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                organization:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: organization is immutable
                  minLength: 1
                  maxLength: 200
                access:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - public
                        - restricted
                        - organization
                    members:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required:
                          - email
                        properties:
                          email:
                            type: string
                            minLength: 3
                            maxLength: 320
                          roles:
                            type: array
                            maxItems: 20
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
            status:
              type: object
              properties:
                projectId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelapplications.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelApplication
    listKind: ZitadelApplicationList
    plural: zitadelapplications
    singular: zitadelapplication
    shortNames:
      - zapp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectRef, displayName, applicationType, redirectUris]
              properties:
                projectRef:
                  type: object
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: projectRef is immutable
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                applicationType:
                  type: string
                  enum: [native, user_agent, web]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: applicationType is immutable
                loginBaseUri:
                  type: string
                  maxLength: 2000
                  description: Product-hosted HTTPS Login V2 base URI. Empty selects the instance Login V2 UI; omission preserves adopted settings.
                refreshToken:
                  type: boolean
                  description: Controls refresh grants. Omission preserves an adopted client's refresh grant; all other declared OIDC settings are reconciled.
                accessTokenType:
                  type: string
                  enum: [jwt, bearer]
                  description: Defaults to jwt. Opaque bearer tokens require introspection when used for API authentication.
                idTokenUserinfoAssertion:
                  type: boolean
                  description: Defaults to true for existing BFF consumers. False keeps email/profile out of the ID token when an access token is also issued.
                redirectUris:
                  type: array
                  minItems: 1
                  maxItems: 100
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
                postLogoutRedirectUris:
                  type: array
                  maxItems: 100
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
            status:
              type: object
              properties:
                appId:
                  type: string
                clientId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelmachineusers.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelMachineUser
    listKind: ZitadelMachineUserList
    plural: zitadelmachineusers
    singular: zitadelmachineuser
    shortNames:
      - zmu
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [organization, userName, displayName, credential]
              properties:
                organization:
                  type: string
                  maxLength: 200
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: organization is immutable
                  minLength: 1
                userName:
                  type: string
                  pattern: '^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: userName is immutable
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                credential:
                  type: string
                  enum: [personalAccessToken, clientSecret]
                  description: The credential published to the claim's reviewed OpenBao path. Never written to the claim.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: credential is immutable
            status:
              type: object
              properties:
                userId:
                  type: string
                clientId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-operator-machine-key
  namespace: identity-operator
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target: {name: zitadel-operator-machine-key, creationPolicy: Owner}
  data:
    - secretKey: machine-key.json
      remoteRef: {key: prod-onboarding-zitadel-machine-key}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-operator
  namespace: identity-operator
  annotations:
    iam.gke.io/gcp-service-account: zitadel-operator-gip-migrator@tesseracthub-480811.iam.gserviceaccount.com
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: zitadel-operator, namespace: identity-operator}
rules:
  - apiGroups: [identity.tesserix.app]
    resources: [zitadelprojects, zitadelapplications, zitadelmachineusers, zitadelorganizations]
    verbs: [get, list, watch]
  - apiGroups: [identity.tesserix.app]
    resources: [zitadelprojects/status, zitadelapplications/status, zitadelmachineusers/status, zitadelorganizations/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: zitadel-operator, namespace: identity-operator}
subjects: [{kind: ServiceAccount, name: zitadel-operator, namespace: identity-operator}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zitadel-operator}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-operator
  namespace: identity-operator
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: {matchLabels: {app.kubernetes.io/name: zitadel-operator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: zitadel-operator}}
    spec:
      serviceAccountName: zitadel-operator
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: ghcr.io/tesserix/zitadel-operator
          args:
            - --watch-namespace=identity-operator
            # Each pair publishes one ZitadelMachineUser credential to
            # <product>/app/<claim>. OpenBao role zitadel-machine-user-writer
            # must list exactly the same paths.
            - --openbao-machine-users=kora/kora-account-deleter,kora/kora-eval,kora/kora-login-client,helivanta/prod/helivanta-onboarding-client
            - --organization-products=helivanta/helivanta
            - --onboarding-archive-bucket=tesseracthub-480811-onboarding-records-prod
            - --onboarding-api-url=http://onboarding-api.onboarding.svc.cluster.local:8080
          ports: [{name: healthz, containerPort: 8081}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: healthz}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: healthz}, initialDelaySeconds: 10}
          volumeMounts:
            - {name: machine-key, mountPath: /var/run/zitadel-admin, readOnly: true}
            - {name: onboarding-identity, mountPath: /var/run/onboarding, readOnly: true}
      volumes:
        - name: onboarding-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: onboarding-provisioning
                  expirationSeconds: 600
                  path: token
        - name: machine-key
          secret: {secretName: zitadel-operator-machine-key, defaultMode: 256}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelorganizations.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelOrganization
    listKind: ZitadelOrganizationList
    plural: zitadelorganizations
    singular: zitadelorganization
    shortNames: [zorg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [product, tenantId, displayName, initialAdminUserId]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Hospital identity bindings are immutable; use a reviewed migration.
                - rule: '!has(self.preserveLoginPolicy) || !self.preserveLoginPolicy || has(self.organizationId)'
                  message: Policy preservation is adoption-only.
              properties:
                initialAdminUserId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,200}$'
                product:
                  type: string
                  maxLength: 25
                  pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
                tenantId:
                  type: string
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                organizationId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,200}$'
                preserveLoginPolicy:
                  type: boolean
            status:
              type: object
              properties:
                activated: {type: boolean}
                organizationId: {type: string}
                projectId: {type: string}
                archiveObject: {type: string}
                archiveGeneration: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
