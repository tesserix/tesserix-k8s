apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelprojects.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names: {kind: ZitadelProject, plural: zitadelprojects, singular: zitadelproject}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName, organization]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 200}
                organization: {type: string, minLength: 1, maxLength: 200}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelapplications.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names: {kind: ZitadelApplication, plural: zitadelapplications, singular: zitadelapplication}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [projectRef, displayName, applicationType, redirectUris]
              properties:
                projectRef: {type: object}
                displayName: {type: string, minLength: 1, maxLength: 200}
                applicationType: {type: string, enum: [native, user_agent]}
                redirectUris: {type: array, minItems: 1, items: {type: string, minLength: 1, maxLength: 2000}}
                postLogoutRedirectUris: {type: array, items: {type: string, minLength: 1, maxLength: 2000}}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-operator-machine-key
  namespace: identity-operator
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target: {name: zitadel-operator-machine-key, creationPolicy: Owner}
  data:
    - secretKey: machine-key.json
      remoteRef: {key: prod-onboarding-zitadel-machine-key}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: zitadel-operator, namespace: identity-operator}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: zitadel-operator, namespace: identity-operator}
rules:
  - apiGroups: [identity.tesserix.app]
    resources: [zitadelprojects, zitadelapplications]
    verbs: [get, list, watch]
  - apiGroups: [identity.tesserix.app]
    resources: [zitadelprojects/status, zitadelapplications/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: zitadel-operator, namespace: identity-operator}
subjects: [{kind: ServiceAccount, name: zitadel-operator, namespace: identity-operator}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zitadel-operator}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-operator
  namespace: identity-operator
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: zitadel-operator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: zitadel-operator}}
    spec:
      serviceAccountName: zitadel-operator
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: operator
          image: ghcr.io/tesserix/zitadel-operator@sha256:376327c72dd5f53935105068a06722601c78e5fdf46c1bc4f389c94426bef4d6
          args: [--watch-namespace=identity-operator]
          ports: [{name: healthz, containerPort: 8081}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: healthz}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: healthz}, initialDelaySeconds: 10}
          volumeMounts: [{name: machine-key, mountPath: /var/run/zitadel-admin, readOnly: true}]
      volumes:
        - name: machine-key
          secret: {secretName: zitadel-operator-machine-key, defaultMode: 256}
