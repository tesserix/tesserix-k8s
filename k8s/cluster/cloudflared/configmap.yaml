apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: ingress
data:
  config.yaml: |
    tunnel: 6a756e3d-b7e6-492b-ab01-7e6f7d727951
    credentials-file: /etc/cloudflared/credentials/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      # Cluster tools (direct to service, bypasses Istio)
      - hostname: argocd.tesserix.app
        service: http://argocd-server.argocd.svc.cluster.local:80
      # Platform
      - hostname: tesserix.app
        service: http://istio-ingressgateway.istio-system.svc.cluster.local:80
      - hostname: "*.tesserix.app"
        service: http://istio-ingressgateway.istio-system.svc.cluster.local:80

      # Marketplace
      # NOTE (P12, 2026-04-19): *.mark8ly.com is fronted by the
      # `storefront-gate` Cloudflare Worker (workers/storefront-gate/).
      # The Worker intercepts requests for store_closed / pending_hard_delete
      # subscriptions and serves a branded HTTP 200 + noindex page (or 404 for
      # hard_deleted), then `fetch()`es this tunnel for live and
      # expired-in-grace stores. The tunnel itself is unchanged — the Worker
      # decision happens before traffic reaches us. See spec §5.4.
      - hostname: mark8ly.com
        service: http://istio-ingressgateway.istio-system.svc.cluster.local:80
      - hostname: "*.mark8ly.com"
        service: http://istio-ingressgateway.istio-system.svc.cluster.local:80

      # Catch-all
      - service: http_status:404
