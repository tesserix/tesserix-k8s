# =============================================================================
# ALERTMANAGER ROUTING — subscription observability
# =============================================================================
# This file was REJECTED WHOLESALE for 19 days. The prometheus-operator's own
# words, from its log:
#
#   AlertmanagerConfig subscription-routes was rejected due to invalid
#   configuration: unable to get secret "slack-webhooks": secrets
#   "slack-webhooks" not found
#
# An AlertmanagerConfig is all-or-nothing. One missing secret reference did
# not disable one receiver; it threw away the whole tree — the severity
# fan-out, the security branch, both PagerDuty paths. Nothing here had ever
# taken effect. What delivered instead was only kube-prometheus-stack's own
# inline config: Watchdog, severity=critical in four namespaces, and three
# alerts routed by name. Everything else reached the "null" receiver.
#
# That is why "Alertmanager discards every severity: warning" looked true
# from the outside. It was not a policy. It was this file never loading.
#
# So every secret named below is one that EXISTS IN THE CLUSTER and is
# verified synced, rather than one that ought to. The single webhook is the
# one Alertmanager already posts criticals to, so a warning and a critical
# now land in the same place instead of one landing nowhere.
#
# Route tree (top-to-bottom; `continue: true` on security):
#   0. component=~subscription|billing|api → #mark8ly-supports (own webhook)
#   1. security="true"   → #falco-events, tagged [SECURITY], falls through
#   2. severity=critical → #falco-events, 1h repeat
#   3. severity=warning  → #falco-events, 4h repeat
#   4. severity=info     → #falco-events, 24h repeat
#   * default            → #falco-events
#
# Secret (synced by ESO from GCP Secret Manager, ExternalSecret
# `alertmanager-slack` in this namespace):
#   - Secret `alertmanager-slack-webhook` — key: SLACK_WEBHOOKURL
#   - Secret `alertmanager-slack-mark8ly-webhook` — key: SLACK_WEBHOOKURL
#
# DELIBERATELY NO PAGERDUTY. The previous version routed criticals to
# `pagerduty-keys`, a secret that does not exist in the cluster or in GCP
# Secret Manager, and that reference is half of why this file never loaded.
# A PagerDuty path that cannot resolve its routing key is not redundancy; it
# is the same failure one layer down. Restore it in one commit when the keys
# are actually provisioned.
#
# NOTE ON CHANNEL: every receiver posts to the channel the webhook itself is
# bound to. A Slack incoming webhook has a fixed destination, so `channel:`
# here is documentation, not a selector — it cannot redirect the message.
# =============================================================================
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: subscription-routes
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: subscription-observability
    app.kubernetes.io/component: alerting
    product: mark8ly
spec:
  route:
    receiver: platform-slack
    groupBy:
      - alertname
      - component
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # --- Product alerts go to the product channel. ------------------------
      # First, and WITHOUT continue.
      #
      # Split on COMPONENT, not namespace. Namespace answers "where does
      # this run", which is not the question: a crash-looping pod and an
      # unreconciled subscription both live in `mark8ly`, and they want
      # different people. component answers "what is this about".
      #
      #   subscription  trials, dunning, cancellation, reconciliation drift
      #   billing       catalog and Stripe price parity
      #   api           HTTP error rate on the merchant-facing surface
      #
      # Everything else — cnpg, ingress, monitoring, and the whole
      # kube-prometheus-stack default set, which carries no component label
      # at all — falls through to the severity fan-out and lands in
      # #falco-events. That is the infrastructure channel and this is the
      # product one.
      #
      # These three labels are load-bearing, so a new product rule must set
      # one or it routes to infra by default. That failure is at least
      # visible: the alert still arrives, in the wrong channel, rather than
      # vanishing.
      - matchers:
          - name: component
            matchType: =~
            value: "subscription|billing|api"
        receiver: mark8ly-slack
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h

      # --- Security-flagged alerts get their own, louder message. -----------
      # `continue: true` lets the alert fall through to the severity tree, so
      # a security+critical event is announced twice rather than swallowed by
      # whichever branch matched first.
      - matchers:
          - name: security
            value: "true"
        receiver: security-slack
        continue: true

      - matchers:
          - name: severity
            value: critical
        receiver: platform-slack
        groupWait: 10s
        groupInterval: 5m
        repeatInterval: 1h

      - matchers:
          - name: severity
            value: warning
        receiver: platform-slack
        repeatInterval: 4h

      - matchers:
          - name: severity
            value: info
        receiver: platform-slack
        repeatInterval: 24h

  receivers:
    # -----------------------------------------------------------------------
    # platform-slack — the one webhook that is actually synced. Also the
    # root receiver, so an alert carrying no severity label is announced
    # rather than silently dropped.
    # -----------------------------------------------------------------------
    - name: platform-slack
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-webhook
            key: SLACK_WEBHOOKURL
          channel: "#falco-events"
          sendResolved: true
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}*{{ .Annotations.summary }}*
            {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }} | *Component:* {{ .Labels.component }}
            {{ if .Labels.runbook }}*Runbook:* {{ .Labels.runbook }}{{ end }}
            {{ end }}

    # -----------------------------------------------------------------------
    # mark8ly-slack — #mark8ly-supports, via its OWN webhook.
    #
    # A separate secret, not a different `channel:` on the shared one: a
    # Slack incoming webhook has a fixed destination baked into the URL, so
    # `channel` here is documentation and cannot redirect anything. Pointing
    # it at a channel the webhook does not serve would read as configured
    # and deliver to the wrong place.
    # -----------------------------------------------------------------------
    - name: mark8ly-slack
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-mark8ly-webhook
            key: SLACK_WEBHOOKURL
          channel: "#mark8ly-supports"
          sendResolved: true
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}*{{ .Annotations.summary }}*
            {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }} | *Namespace:* {{ .Labels.namespace }}
            {{ if .Labels.runbook }}*Runbook:* {{ .Labels.runbook }}{{ end }}
            {{ end }}

    # -----------------------------------------------------------------------
    # security-slack — same webhook, distinct [SECURITY] title so the branch
    # is visible in the channel. It used to point at #security-alerts via a
    # secret that does not exist, which meant security-flagged alerts went
    # nowhere at all. One channel that works beats two that do not.
    # -----------------------------------------------------------------------
    - name: security-slack
      slackConfigs:
        - apiURL:
            name: alertmanager-slack-webhook
            key: SLACK_WEBHOOKURL
          channel: "#falco-events"
          sendResolved: true
          title: '[SECURITY] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}*{{ .Annotations.summary }}*
            {{ .Annotations.description }}
            *Component:* {{ .Labels.component }} | *Severity:* {{ .Labels.severity }}
            {{ if .Labels.runbook }}*Runbook:* {{ .Labels.runbook }}{{ end }}
            {{ end }}
