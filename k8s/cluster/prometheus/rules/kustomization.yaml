# =============================================================================
# PrometheusRule kustomization — subscription observability rules.
# Applied by the `subscription-observability` ArgoCD Application.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - subscription.yaml
  - cnpg.yaml
  - cnpg-storage.yaml
  - white_label_app.yaml
  # tesserix-home#328 gap 3 — the plan-catalog parity monitor had metrics but
  # no alert, so a difference reached a log nothing watches.
  - catalog_parity.yaml
  # tesserix-home#579 — the console's catalog<->Stripe parity had a badge and a
  # database row and no alert. NOT the same check as catalog_parity.yaml above;
  # that one never touches Stripe. See this file's header for the distinction.
  - console_stripe_parity.yaml
