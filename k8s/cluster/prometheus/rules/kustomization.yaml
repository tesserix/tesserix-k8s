# =============================================================================
# PrometheusRule kustomization — subscription observability rules.
# Applied by the `subscription-observability` ArgoCD Application.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - subscription.yaml
  - cnpg.yaml
  - cnpg-storage.yaml
  - white_label_app.yaml
  # tesserix-home#328 gap 3 — the plan-catalog parity monitor had metrics but
  # no alert, so a difference reached a log nothing watches.
  - catalog_parity.yaml
  # tesserix-k8s#1018 — every rule above compares a metric to a threshold, and
  # an absent metric never fires. These two alert on `up`, which Prometheus
  # emits itself, so a scrape that stops is loud instead of quiet.
  - scrape_health.yaml
