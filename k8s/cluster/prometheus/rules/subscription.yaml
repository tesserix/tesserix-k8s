# =============================================================================
# SUBSCRIPTION OBSERVABILITY — recording + alert rules
# =============================================================================
# Scope: P17 infra-only slice. Rules reference ONLY metrics actually registered
# by marketplace-api in services/marketplace-api/internal/metrics/registry.go.
#
# Metrics referenced (all P4/P5/P6 work — shipped):
#   http_requests_total{method,path,status}
#   http_request_duration_seconds_bucket{method,path}
#   orders_created_total{store_id}
#   webhook_received_total{provider,event_type}
#   outbox_events_pending
#   outbox_events_published_total
#   mark8ly_trial_signup_anomaly_alerts_total
#   mark8ly_trial_activation_day30_total
#   mark8ly_subscription_dunning_emails_sent_total{day}
#   mark8ly_subscription_payment_action_reminders_sent_total{offset}
#   mark8ly_subscription_dunning_suppressed_refund_window_total
#
# The plan (2026-04-18-p17-observability.md) enumerates a broader metric set
# (subscription_state_count, webhook_processing_duration_seconds_bucket,
# subscription_arbitrage_flagged, reconciliation_drift, etc.) that belongs to
# Tasks 1/2/3/10/11 — deferred to a later round. Rules/alerts that depend on
# those metrics are intentionally NOT authored here; they will land alongside
# the Go collectors they reference.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: subscription-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    app.kubernetes.io/part-of: subscription-observability
    app.kubernetes.io/component: monitoring
    product: mark8ly
spec:
  groups:
    # -----------------------------------------------------------------------
    # Recording rules — derived series anchored on shipped collectors.
    # Dashboard panels reference THESE names (not raw metrics) so a rename
    # forces both files to update in lockstep.
    # -----------------------------------------------------------------------
    - name: subscription.recording
      interval: 30s
      rules:
        # Dunning email throughput. Labeled by day (day_5, day_7).
        - record: subscription:dunning_emails:rate5m
          expr: |
            sum by (day) (rate(mark8ly_subscription_dunning_emails_sent_total[5m]))

        # SCA reminder throughput. Labeled by offset (t_minus_14/7/1).
        - record: subscription:sca_reminders:rate5m
          expr: |
            sum by (offset) (rate(mark8ly_subscription_payment_action_reminders_sent_total[5m]))

        # Cumulative refund-window suppressions. Unlabeled counter — expose
        # the raw total so dashboards can stat-display it and alerts can
        # rate() over a long window.
        - record: subscription:refund_window_suppressions:total
          expr: mark8ly_subscription_dunning_suppressed_refund_window_total

        # 1h rate of refund-window suppressions — alert anchor.
        - record: subscription:refund_window_suppressions:rate1h
          expr: rate(mark8ly_subscription_dunning_suppressed_refund_window_total[1h])

        # Trial activation cumulative count (day-30 successes).
        - record: subscription:trial_activation_day30:total
          expr: mark8ly_trial_activation_day30_total

        # Daily rate of trial activations — dashboard + absence alert.
        - record: subscription:trial_activation_day30:rate1d
          expr: rate(mark8ly_trial_activation_day30_total[1d])

        # Trial signup anomaly alerts cumulative count.
        - record: subscription:trial_signup_anomalies:total
          expr: mark8ly_trial_signup_anomaly_alerts_total

        # 24h rate of trial signup anomaly alerts — used by pager alert.
        - record: subscription:trial_signup_anomalies:rate24h
          expr: rate(mark8ly_trial_signup_anomaly_alerts_total[24h])

        # Webhook receive rate by event_type. Provider label preserved for
        # breakdowns in dashboards.
        - record: webhook:received:rate5m
          expr: |
            sum by (provider, event_type) (rate(webhook_received_total[5m]))

        # HTTP request rate by status class (2xx/4xx/5xx).
        - record: http:requests:rate5m
          expr: |
            sum by (status) (rate(http_requests_total[5m]))

        # HTTP error rate — 5xx fraction of total. Anchor for webhook/API
        # failure alerts given the path-agnostic nature of outbox/webhook
        # endpoints on marketplace-api.
        - record: http:error_rate:ratio5m
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 1)

        # Outbox publish throughput.
        - record: outbox:published:rate5m
          expr: rate(outbox_events_published_total[5m])

        # ---------------------------------------------------------------
        # P8 / P9 / P10 / P17-Go backfill — all metrics below are now
        # emitted by marketplace-api. Recording rules + alerts added so
        # the Grafana dashboards populate and the dead-man's-switches arm.
        # ---------------------------------------------------------------

        # State-machine transitions — rate by (from, to) so dashboards can
        # render heatmaps and alerts can spot unexpected fan-out.
        - record: subscription:state_transitions:rate5m
          expr: |
            sum by (from_status, to_status, reason) (rate(mark8ly_subscription_state_transitioned_total[5m]))

        # Webhook processing p95 latency — histogram-derived.
        - record: subscription:webhook_latency_p95:5m
          expr: |
            histogram_quantile(0.95,
              sum by (event_type, le) (rate(mark8ly_stripe_webhook_processing_duration_seconds_bucket[5m]))
            )

        # Webhook failure rate by event_type + classified reason.
        - record: subscription:webhook_failures:rate5m
          expr: |
            sum by (event_type, reason) (rate(mark8ly_stripe_webhook_failed_total[5m]))

        # Promo application outcome rate — applied vs each rejection path.
        - record: subscription:promo_applied:rate5m
          expr: |
            sum by (outcome, plan, currency) (rate(mark8ly_subscription_promo_applied_total[5m]))

        # Refund issuance rate by currency. Low-volume — alert anchor.
        - record: subscription:refunds_issued:rate1h
          expr: |
            sum by (currency, reason) (rate(mark8ly_subscription_refund_issued_total[1h]))

        # Arbitrage flag emissions — §8 anti-arbitrage gate (P8).
        - record: subscription:arbitrage_flagged:rate1h
          expr: |
            sum by (reason) (rate(mark8ly_subscription_arbitrage_flagged_total[1h]))

        # Stripe reconciliation drift — P17-Go T10. Zero is expected.
        - record: subscription:reconciliation_drift:rate1h
          expr: |
            sum by (drift_type) (rate(mark8ly_subscription_reconciliation_drift_total[1h]))

        # Billing archive throughput — should track hard-delete cron runs.
        - record: subscription:billing_archive_created:rate1d
          expr: rate(mark8ly_billing_archive_created_total[1d])

        # MRR gauge pass-through — dashboard references this name directly.
        - record: subscription:mrr_usd:sum
          expr: |
            sum by (plan, currency) (mark8ly_subscription_mrr_usd)

    # -----------------------------------------------------------------------
    # Alert rules — covers the metrics that exist today. Alerts for
    # new P8/P9/P10/P17-Go counters are included in the second group below.
    # -----------------------------------------------------------------------
    - name: subscription.alerts
      interval: 30s
      rules:
        # §16.5 refund-window suppression is supposed to fire rarely. A
        # sustained >0 rate signals either a clock-skew bug or a logic
        # regression in the dunning ladder.
        - alert: DunningSuppressedRefundWindowSpike
          expr: subscription:refund_window_suppressions:rate1h > 0.01
          for: 30m
          labels:
            severity: warning
            component: subscription
            runbook: https://runbooks.mark8ly.internal/subscription/refund-window-spike
          annotations:
            summary: "Refund-window dunning suppressions firing >1/100s over 1h"
            description: "Rate: {{ $value }}/s. Expected near-zero — investigate clock skew or §16.5 logic regression."

        # 5xx fraction on the HTTP surface. Also trips when webhook handlers
        # 500 back to Stripe (they share the http_requests_total counter).
        - alert: HTTPErrorRateHigh
          expr: http:error_rate:ratio5m > 0.05
          for: 15m
          labels:
            severity: warning
            component: api
          annotations:
            summary: "HTTP 5xx rate >5% over 15m"
            description: "Current: {{ $value | humanizePercentage }}. Break down by path via http_requests_total."

        # Dead-man's switch on the dunning cron. P6 emits at least one email
        # per cycle per tenant in arrears; an absence beyond 48h indicates
        # the cron is dead or the tenants-in-arrears query broke.
        # GUARDED SO "NEVER STARTED" DOES NOT READ AS "STOPPED".
        #
        # `mark8ly_subscription_dunning_emails_sent_total` is a CounterVec
        # labelled by `day` (internal/metrics/registry.go). A CounterVec with no
        # observed label combination publishes NO series at all — unlike a plain
        # Counter, which publishes 0 — so before the first dunning email is ever
        # sent, `absent_over_time` is true and this alert fires from the moment
        # the rule loads. Measured against production on 2026-09-04: the metric
        # had no series, and the unguarded expression returned a result.
        #
        # The `count_over_time(...[7d]) > 0` term requires the metric to have
        # existed at some point in the retention window, so the alert means "the
        # cron was working and stopped" rather than "the cron has never run".
        #
        # THE TRADE, and it is bounded by retention: Prometheus here retains 7d
        # (kps-kube-prometheus-stack-prometheus `retention=7d`). A stoppage that
        # outlasts the window stops alerting, because the evidence it ever ran
        # ages out. It fires for the days in between, which is when a dead cron
        # is still news. Raising retention widens this automatically.
        - alert: NoDunningEmailsFor48h
          expr: absent_over_time(mark8ly_subscription_dunning_emails_sent_total[48h])
              and on()
            (count(count_over_time(mark8ly_subscription_dunning_emails_sent_total[7d])) > 0)
          for: 0m
          labels:
            severity: warning
            component: subscription
            runbook: https://runbooks.mark8ly.internal/subscription/dunning-cron-dead
          annotations:
            summary: "No dunning emails emitted in 48h — cron likely dead"
            description: "mark8ly_subscription_dunning_emails_sent_total is absent. Check P6 dunning CronJob and the tenants-in-arrears query."

        # Dead-man's switch on trial activation counter. Even at low volume
        # we expect at least one activation every 7d in production.
        - alert: NoTrialActivationsFor7d
          expr: absent_over_time(mark8ly_trial_activation_day30_total[7d])
          for: 0m
          labels:
            severity: info
            component: subscription
            strategy: "true"
          annotations:
            summary: "No trial-to-paid activations in 7d"
            description: "Either the day-30 counter is not being incremented (P5 bug) or genuinely no-one activated. Check signups volume + activation job logs."

        # Trial abuse signal (P5 Task 13). Any anomaly alert firing in a
        # 24h window pages security because the threshold logic already
        # filters noise.
        - alert: TrialSignupAnomaly
          expr: subscription:trial_signup_anomalies:rate24h > 0
          for: 15m
          labels:
            severity: warning
            component: subscription
            security: "true"
          annotations:
            summary: "Trial signup anomaly threshold tripped in 24h window"
            description: "Rate: {{ $value }}/s. Check arbitrage flags + IP distribution. §5.1 flags >50/day as anomalous at our stage."

    # -----------------------------------------------------------------------
    # P8 / P10 / P17-Go alerts — metrics just shipped by marketplace-api.
    # -----------------------------------------------------------------------
    - name: subscription.alerts.new
      interval: 30s
      rules:
        # Webhook latency regression — p95 above 2s over 15m signals either
        # a Stripe API slowdown or a handler regression.
        - alert: StripeWebhookP95LatencyHigh
          expr: subscription:webhook_latency_p95:5m > 2
          for: 15m
          labels:
            severity: warning
            component: subscription
          annotations:
            summary: "Stripe webhook p95 latency >2s for 15m"
            description: "event_type={{ $labels.event_type }} p95={{ $value }}s. Check handler + DB contention."

        # Webhook failure rate — any sustained stream of non-CAS errors is
        # a dispatcher bug.
        - alert: StripeWebhookFailureRateHigh
          expr: |
            sum by (event_type) (subscription:webhook_failures:rate5m{reason!~"cas_conflict|invalid_transition"}) > 0.01
          for: 15m
          labels:
            severity: warning
            component: subscription
          annotations:
            summary: "Stripe webhook failure rate >1/100s (excluding CAS races)"
            description: "event_type={{ $labels.event_type }} rate={{ $value }}/s. Check handler logs."

        # Reconciliation drift — should be zero in steady state. Any drift
        # indicates our local status has fallen out of sync with Stripe.
        - alert: StripeReconciliationDrift
          expr: subscription:reconciliation_drift:rate1h > 0
          for: 1h
          labels:
            severity: warning
            component: subscription
            runbook: https://runbooks.mark8ly.internal/subscription/reconciliation-drift
          annotations:
            summary: "Stripe↔local subscription drift detected"
            description: "drift_type={{ $labels.drift_type }} rate={{ $value }}/s over 1h. Investigate via audit.subscription.reconciliation_drift rows."

        # Arbitrage flag spike — §8. Sustained flagging suggests a fraud
        # attack or a legitimate traffic pattern that needs policy review.
        - alert: ArbitrageFlagSpike
          expr: subscription:arbitrage_flagged:rate1h > 0.01
          for: 30m
          labels:
            severity: warning
            component: subscription
            security: "true"
            runbook: https://runbooks.mark8ly.internal/subscription/arbitrage-spike
          annotations:
            summary: "Arbitrage flagging rate >1/100s over 30m"
            description: "reason={{ $labels.reason }}. §8 triangulation is tripping — review flagged rows in subscription_arbitrage_audit."

        # Billing archive retention gauge — P17-Go T11. Alerts ops to
        # run the sweeper before rows actually expire.
        - alert: BillingArchiveExpirySoon
          expr: mark8ly_billing_archive_expiry_soon > 0
          for: 1h
          labels:
            severity: info
            component: subscription
          annotations:
            summary: "Billing archive rows within 30d of expiry"
            description: "Count: {{ $value }}. Archive sweeper should handle these on its next run — if count grows, sweeper may be dead."

        - alert: BillingArchiveExpired
          expr: mark8ly_billing_archive_expired > 0
          for: 6h
          labels:
            severity: warning
            component: subscription
            runbook: https://runbooks.mark8ly.internal/subscription/archive-expired
          annotations:
            summary: "Billing archive rows past expiry — sweeper may be dead"
            description: "Count: {{ $value }}. Sweeper runs daily; sustained non-zero indicates cron failure or §23.2 retention misconfiguration."

        # Refund spike — unusual on our scale; any sustained rate flags
        # potential abuse or a refund-flow regression.
        - alert: RefundIssuanceSpike
          expr: sum by (currency) (subscription:refunds_issued:rate1h) > 0.01
          for: 1h
          labels:
            severity: warning
            component: subscription
          annotations:
            summary: "Refund issuance rate >1/100s over 1h"
            description: "currency={{ $labels.currency }}. Check §8 refund abuse patterns + card-fingerprint reuse."
