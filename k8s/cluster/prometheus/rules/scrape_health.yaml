# =============================================================================
# SCRAPE HEALTH — the alerts that make every other alert believable
# =============================================================================
# Every rule in this directory is written as `metric <comparison> threshold`.
# That shape has one blind spot, and it is total: PromQL evaluates a comparison
# against an ABSENT series to an empty vector, and an empty vector never fires.
# So a metric that stops arriving does not look wrong — it looks quiet, which
# is exactly what "healthy" looks like.
#
# This is not hypothetical. On 2026-09-04 the `monitoring` namespace lost the
# ability to scrape TEN ambient namespaces at once (tesserix-k8s#1018): mesh
# wide mTLS is STRICT, Prometheus had no mesh identity, and ztunnel refused
# every plaintext scrape. mark8ly ran 32h with no metrics at all. Not one alert
# fired — including `CatalogParityStale`, the rule written specifically to
# catch "the monitor has stopped checking". Its expression is
#
#     time() - mark8ly_catalog_parity_last_success_timestamp_seconds > 7200
#
# and with the series absent there was nothing to subtract from. The gap was
# found by hand, days later, while investigating something else.
#
# `catalog_parity.yaml` reasons carefully about a gauge that HOLDS A STALE
# VALUE and adds a staleness alert to cover it. This file is the level above:
# what covers the staleness alert. Nothing else in this directory does.
#
# WHY `up` AND NOT `absent()` PER METRIC. `absent(foo)` needs one rule per
# metric, and the rule for a metric nobody has added yet cannot exist. `up`
# is emitted by Prometheus ITSELF for every configured target, so it cannot
# go absent while the target is configured — it goes to 0. That makes it the
# one signal in the stack that is not vulnerable to the failure it detects.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scrape-health-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    app.kubernetes.io/part-of: subscription-observability
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: scrape.health.alerts
      interval: 30s
      rules:
        # A single target that has been unscrapeable for 15m.
        #
        # `for: 15m` rather than something tighter because a rolling deploy
        # legitimately leaves a target down while the old pod goes and the new
        # one boots, and Kargo plus an ArgoCD sync can span several minutes.
        # A check that fires on every deploy is one people mute, and a muted
        # scrape alert would have hidden #1018 just as effectively as no alert.
        - alert: TargetDown
          expr: up == 0
          for: 15m
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "Prometheus cannot scrape {{ $labels.job }} in {{ $labels.namespace }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.job }}) has been
              unscrapeable for 15m, so every alert that reads its metrics is now silent
              rather than satisfied. DO: check the scrape error on
              /targets first. If it is "connection reset by peer" or "EOF" on an
              ambient-enrolled namespace, it is the mesh, not the app — confirm with
              `kubectl logs -n istio-system <ztunnel-on-that-node> | grep 'src.namespace="monitoring"'`,
              which names the exact policy doing the rejecting. See tesserix-k8s#1018.

        # A WHOLE NAMESPACE has gone dark. Separate from TargetDown on purpose:
        # one dead pod is an application problem and its owner should look at
        # it, while every pod in a namespace failing at once is infrastructure
        # — a mesh policy, a NetworkPolicy, or a scrape-config change. #1018
        # was the second kind, and it presented as ten of these simultaneously.
        #
        # Warning, not critical: nothing is DOWN, it is unobserved. The
        # distinction matters because the on-call action is different — this
        # one is "you are flying blind", not "the product is broken".
        - alert: NamespaceScrapeBlackout
          expr: |
            count by (namespace) (up == 0)
              == on (namespace) group_left()
            count by (namespace) (up)
          for: 15m
          labels:
            severity: warning
            component: observability
          annotations:
            summary: "Every Prometheus target in {{ $labels.namespace }} is down"
            description: >-
              All {{ $value }} target(s) in {{ $labels.namespace }} are unscrapeable, so
              every metric and every alert for that namespace is absent rather than
              healthy. A whole namespace failing together is almost never the workloads:
              look at mesh enrollment (istio.io/dataplane-mode), PeerAuthentication mode,
              and any AuthorizationPolicy with an empty spec, which denies everything not
              explicitly allowed. See tesserix-k8s#1018 for the worked example.
