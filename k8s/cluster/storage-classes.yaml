# Retain StorageClasses for stateful workloads (databases, caches, messaging)
# These prevent GCP disks from being deleted when PVCs are removed,
# protecting data from accidental namespace deletion.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-rwo-retain
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-balanced
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: premium-rwo-retain
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# Cost-optimised StorageClass for non-IO-sensitive workloads:
# ML model caches, file uploads, read-mostly assets, dashboards.
# pd-standard is ~65% cheaper than pd-balanced per GiB-month.
# Do NOT use for databases, queues, or search indexes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: economy-rwo
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-standard
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: economy-rwo-retain
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-standard
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
