# Horoscope namespace authorization rules.
#
# Pattern: cluster-wide deny-all is the default; explicit ALLOW rules
# below whitelist the legitimate ingress paths.
#
# Path map (mTLS):
#   istio-system           → horoscope            (Cloudflare Tunnel + ingress gateway)
#   horoscope              → horoscope            (intra-namespace east-west,
#                                                  including API → CNPG Postgres
#                                                  which lives in the same ns)
#
# horoscope uses Firebase Authentication directly.

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-gateway
  namespace: horoscope
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-system"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-horoscope-internal
  namespace: horoscope
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["horoscope"]

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: horoscope
spec:
  mtls:
    mode: STRICT
