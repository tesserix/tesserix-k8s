# HomeChef namespace authorization rules.
#
# Pattern: deny-all is set in deny-all.yaml; explicit ALLOW rules below
# whitelist the legitimate ingress paths for the HomeChef app stack.
#
# Path map (mTLS, ambient or sidecar):
#   istio-system            → all homechef workloads (Cloudflare Tunnel + ingress gateway)
#   homechef                → homechef            (intra-namespace east-west)
#   homechef                → postgresql-homechef (API → Postgres only)
#   identity-customer       → homechef            (Keycloak callback to auth-bff)
#   identity-internal       → homechef            (Keycloak admin realm)

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-gateway
  namespace: homechef
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-system"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-homechef-internal
  namespace: homechef
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["homechef"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-identity-to-homechef
  namespace: homechef
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["identity-customer", "identity-internal"]
---
# Postgres reachable ONLY from the homechef API workload's service account.
# This is intentionally tighter than namespace-wide allow.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-homechef-api-to-postgres
  namespace: postgresql-homechef
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["homechef"]
      to:
        - operation:
            ports: ["5432", "6432"] # 6432 covers PgBouncer pooler
---
# Strict mTLS for the homechef + DB namespaces. Belt-and-suspenders
# alongside the cluster-wide PeerAuthentication if one exists.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: homechef
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: postgresql-homechef
spec:
  mtls:
    mode: STRICT
