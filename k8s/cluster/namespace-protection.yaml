# ValidatingAdmissionPolicy to prevent accidental deletion of
# database, cache, messaging, and application namespaces.
# To delete a protected namespace, first remove the
# "tesserix.io/protected: true" label from the namespace.
#
# OWNERSHIP: a namespace may be declared by exactly ONE ArgoCD app. Mesh
# namespaces (anything the istio-config chart renders in sidecar-injection.yaml)
# get their tesserix.io/protected + tier labels from that chart's
# `sidecarInjection.protectedTiers` — never re-declare them here. Both apps
# apply as the same SSA field manager, so a duplicate strips the other app's
# labels on every sync and flaps ambient enrollment (prod outage 2026-08-02).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: prevent-protected-namespace-deletion
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: is-protected
      expression: "has(oldObject.metadata.labels) && 'tesserix.io/protected' in oldObject.metadata.labels && oldObject.metadata.labels['tesserix.io/protected'] == 'true'"
  validations:
    - expression: "false"
      message: "Namespace is protected from deletion. Remove the 'tesserix.io/protected: true' label first."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: prevent-protected-namespace-deletion
spec:
  policyName: prevent-protected-namespace-deletion
  validationActions:
    - Deny
---
# Protected namespaces NOT managed by the istio-config chart.
# NOTE: postgresql-* namespaces removed — all products use CloudNativePG
# clusters in their app namespaces (e.g., homechef-postgres in homechef ns).
# FanZone decommissioned 2026-07-23 — namespaces pruned to reclaim capacity.
apiVersion: v1
kind: Namespace
metadata:
  name: yes-hospital
  labels:
    tesserix.io/protected: "true"
    tesserix.io/tier: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: mongodb-blog
  labels:
    tesserix.io/protected: "true"
    tesserix.io/tier: database
