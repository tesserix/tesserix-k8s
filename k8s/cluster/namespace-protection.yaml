# ValidatingAdmissionPolicy to prevent accidental deletion of
# database, cache, messaging, and application namespaces.
# To delete a protected namespace, first remove the
# "tesserix.io/protected: true" label from the namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: prevent-protected-namespace-deletion
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: is-protected
      expression: "has(object.metadata.labels) && 'tesserix.io/protected' in object.metadata.labels && object.metadata.labels['tesserix.io/protected'] == 'true'"
  validations:
    - expression: "false"
      message: "Namespace is protected from deletion. Remove the 'tesserix.io/protected: true' label first."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: prevent-protected-namespace-deletion
spec:
  policyName: prevent-protected-namespace-deletion
  validationActions:
    - Deny
---
