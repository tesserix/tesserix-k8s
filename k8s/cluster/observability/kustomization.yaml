# =============================================================================
# Subscription observability aggregator — applied by the
# `subscription-observability` ArgoCD Application.
#
# Bundles:
#   1. PrometheusRule   (k8s/cluster/prometheus/rules)
#   2. AlertmanagerConfig (k8s/cluster/alertmanager)
#   3. Grafana dashboard ConfigMap (k8s/cluster/grafana/dashboards)
#
# All three land in the `monitoring` namespace.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../prometheus/rules
  - ../alertmanager
  - ../grafana/dashboards
