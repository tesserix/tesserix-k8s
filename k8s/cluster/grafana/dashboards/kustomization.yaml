# =============================================================================
# Grafana dashboard ConfigMap generator
# =============================================================================
# Grafana's sidecar (grafana-sc-dashboard, enabled in argocd/prod/infrastructure/grafana.yaml)
# watches ConfigMaps with label grafana_dashboard=1 and auto-loads them into
# the /tmp/dashboards provider. disableNameSuffixHash keeps the name stable
# so ArgoCD doesn't thrash on each kustomize build.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: subscription-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: subscription-observability
        product: mark8ly
    files:
      - ../../../../grafana/dashboards/subscription-health.json
      - ../../../../grafana/dashboards/webhook-pipeline.json
      - ../../../../grafana/dashboards/trial-activation-funnel.json
      - ../../../../grafana/dashboards/arbitrage-operations.json
      - ../../../../grafana/dashboards/white-label-app.json

  # DevAI — agent/LLM/pipeline/memory observability (devai_* OTel metrics
  # via the collector) + a pointer to agent traces in Tempo.
  - name: devai-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: devai
        product: devai
    files:
      - ../../../../grafana/dashboards/devai-observability.json

  # mark8ly — platform health from the istio mesh (admin/storefront/onboarding).
  - name: mark8ly-platform-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: mark8ly
        product: mark8ly
    files:
      - ../../../../grafana/dashboards/mark8ly-platform.json

  # fe3dr / HomeChef — app metrics (homechef_*): HTTP, DB, and business KPIs.
  - name: fe3dr-homechef-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: homechef
        product: fe3dr
    files:
      - ../../../../grafana/dashboards/fe3dr-homechef.json

generatorOptions:
  disableNameSuffixHash: true
