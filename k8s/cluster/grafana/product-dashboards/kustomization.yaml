# =============================================================================
# Product Grafana dashboards — DevAI, mark8ly, fe3dr (HomeChef)
# =============================================================================
# Self-contained: the dashboard JSON files live IN this directory, so the
# configMapGenerator references them with no `../` escape — no load-restrictor
# loosening needed (unlike the older subscription set under ../dashboards/).
# Grafana's sidecar (label grafana_dashboard=1) auto-loads each ConfigMap.
# disableNameSuffixHash keeps names stable so ArgoCD doesn't thrash.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  # DevAI — agent/LLM/pipeline/memory observability (devai_* OTel metrics) +
  # a pointer to agent traces in Tempo.
  - name: devai-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: devai
        product: devai
    files:
      - devai-observability.json

  # mark8ly — platform health from the istio mesh (admin/storefront/onboarding).
  - name: mark8ly-platform-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: mark8ly
        product: mark8ly
    files:
      - mark8ly-platform.json

  # fe3dr / HomeChef — app metrics (homechef_*): HTTP, DB, and business KPIs.
  - name: fe3dr-homechef-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: homechef
        product: fe3dr
    files:
      - fe3dr-homechef.json

  # Subscription observability — the five dashboards that pair with
  # k8s/cluster/prometheus/rules/subscription.yaml and white_label_app.yaml.
  #
  # These lived at the REPO ROOT and were generated from a kustomization under
  # k8s/cluster/grafana/dashboards/ via `../../../../`. Kustomize refuses that
  # ("security; file ... is not in or below"), and the LoadRestrictionsNone
  # option meant to permit it was declared under `syncPolicy.syncOptions`,
  # which ArgoCD does not read for that purpose — `kustomize.buildOptions` in
  # argocd-cm is the real setting and is empty here. The result: these five
  # never shipped. Verified from the Application's own ComparisonError on
  # 2026-09-04, the first time it ever attempted a sync.
  #
  # Kept here, beside the dashboards that already work, so there is no `../`
  # escape and no flag to remember.
  - name: subscription-dashboards
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: subscription-observability
        product: mark8ly
    files:
      - subscription-health.json
      - webhook-pipeline.json
      - trial-activation-funnel.json
      - arbitrage-operations.json
      - white-label-app.json

generatorOptions:
  disableNameSuffixHash: true
