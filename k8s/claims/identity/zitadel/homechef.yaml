apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: homechef
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  displayName: HomeChef
  organization: TESSERIX
  # Open product: anyone may sign up and sign in (explicit form of the default).
  access:
    mode: public
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: homechef-web
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: homechef
  displayName: HomeChef Web
  applicationType: user_agent
  redirectUris:
    - "https://fe3dr.com/auth/callback"
  postLogoutRedirectUris:
    - "https://fe3dr.com/"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: homechef-vendor-web
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: homechef
  displayName: HomeChef Vendor Web
  applicationType: user_agent
  redirectUris:
    - "https://vendors.fe3dr.com/auth/callback"
  postLogoutRedirectUris:
    - "https://vendors.fe3dr.com/"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: homechef-admin-web
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: homechef
  displayName: HomeChef Admin Web
  applicationType: user_agent
  redirectUris:
    - "https://admin.fe3dr.com/auth/callback"
  postLogoutRedirectUris:
    - "https://admin.fe3dr.com/"
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: homechef-customer-mobile
  namespace: identity-operator
  labels:
    app.kubernetes.io/part-of: homechef
    app.kubernetes.io/managed-by: zitadel-onboarding-operator
spec:
  projectRef:
    name: homechef
  displayName: HomeChef Customer Mobile
  applicationType: native
  redirectUris:
    - "homechef-customer:/auth/callback"
---
apiVersion: identity.tesserix.app/v1alpha1
