# Reference only. Do not add this file to kustomization.yaml.
---
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelProject
metadata:
  name: product-slug
  namespace: identity-operator
spec:
  displayName: Product name
  organization: TESSERIX
---
# Add only after redirect URIs and the audience contract are approved.
apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: product-slug-native
  namespace: identity-operator
spec:
  projectRef:
    name: product-slug
  displayName: Product native application
  applicationType: native
  redirectUris:
    - com.example.product:/oauth/callback
  postLogoutRedirectUris:
    - com.example.product:/oauth/logout
