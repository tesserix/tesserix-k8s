apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
      labels:
        app.kubernetes.io/name: openfga
    spec:
      serviceAccountName: openfga
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: openfga
          image: openfga/openfga:v1.8.2
          args: ["run"]
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: "postgres"
            - name: OPENFGA_AUTHN_METHOD
              value: "preshared"
          envFrom:
            - secretRef:
                name: openfga-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
