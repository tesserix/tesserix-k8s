apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openfga-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: openfga-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENFGA_DATASTORE_URI
      remoteRef:
        key: prod-mp-openfga-db-uri
    - secretKey: OPENFGA_AUTHN_PRESHARED_KEYS
      remoteRef:
        key: prod-mp-openfga-preshared-key
