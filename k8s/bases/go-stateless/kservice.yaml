apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: SERVICE_NAME
  labels:
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/disableAutoTLS: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "100"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: SERVICE_NAME
      imagePullSecrets:
        - name: ghcr-secret
      containerConcurrency: 100
      timeoutSeconds: 30
      containers:
        - name: app
          image: PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"
          envFrom:
            - configMapRef:
                name: SERVICE_NAME-config
                optional: true
            - secretRef:
                name: SERVICE_NAME-secrets
                optional: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
