# =============================================================================
# APPLICATIONSETS — auto-discovers services from k8s/apps/ directories
# =============================================================================
# Single set per namespace group, all watching main branch.
# Adding a new service = adding a directory in k8s/apps/<namespace>/<service>.
#
# Legacy mark8ly's `shared-services` and `marketplace-services` AppSets were
# removed when the legacy stack was retired. The new mark8ly v2 stack lives
# under its own `mark8ly-*` AppSet — see argocd/prod/apps/mark8ly/.
# =============================================================================

# ---------------------------------------------------------------------------
# Platform services
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        revision: main
        directories:
          - path: k8s/apps/platform/*
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: platform
      source:
        repoURL: https://github.com/tesserix/tesserix-k8s.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: tesserix
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
