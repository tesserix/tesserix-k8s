apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform services (tesserix-home)
  sourceRepos:
    - https://github.com/tesserix/tesserix-k8s.git
  destinations:
    - namespace: tesserix
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: external-secrets.io
      kind: ExternalSecret
