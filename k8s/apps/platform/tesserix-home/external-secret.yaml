apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-home-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-home-secrets
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_SERVICE_KEY
      remoteRef:
        key: prod-internal-service-key
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: prod-github-token
    - secretKey: ONBOARDING_ADMIN_API_KEY
      remoteRef:
        key: prod-marketplace-content-admin-key
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: prod-argocd-auth-token
