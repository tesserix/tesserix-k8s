apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-bff-config
data:
  PORT: "8080"
  APP_ENV: "production"
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: "tesserix-app"

  # Keycloak OIDC
  KEYCLOAK_URL: "https://internal-idp.tesserix.app"
  KEYCLOAK_INTERNAL_URL: "http://keycloak.identity-internal.svc.cluster.local:8080"
  INTERNAL_REALM: "tesserix-internal"
  CUSTOMER_REALM: "customers"

  # WebAuthn
  WEBAUTHN_RP_ID: "tesserix.app"
  WEBAUTHN_RP_NAME: "Tesserix"

  # Redis
  REDIS_URL: "redis://redis.redis-tesserix.svc.cluster.local:6379"

  # NATS
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # Internal service URLs
  TENANT_SERVICE_URL: "http://tenant-service.marketplace.svc.cluster.local:8080"
  VERIFICATION_SERVICE_URL: "http://verification-service.marketplace.svc.cluster.local:8080"

  # Rate limiting
  RATE_LIMIT_RPM: "300"

  # Service auth
  SERVICE_AUTH_MODE: "mesh"
  OPENFGA_AUTH_MODE: "mesh"
  OPENFGA_URL: "http://openfga.shared.svc.cluster.local"
