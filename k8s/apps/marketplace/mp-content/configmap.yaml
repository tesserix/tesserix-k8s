apiVersion: v1
kind: ConfigMap
metadata:
  name: mp-content-config
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: "tesserix-app"
  DB_HOST: "postgresql.postgresql-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "marketplace_db"
  DB_USER: "postgres"
  DB_SSLMODE: "require"
  SERVICE_AUTH_MODE: "mesh"
  STAFF_SERVICE_URL: "http://mp-staff.marketplace.svc.cluster.local"
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local"
  OPENFGA_AUTH_MODE: "mesh"
