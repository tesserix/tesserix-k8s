apiVersion: v1
kind: ConfigMap
metadata:
  name: mp-categories-config
data:
  ENVIRONMENT: "production"
  GCP_PROJECT_ID: "tesserix-app"
  DB_HOST: "postgresql.postgresql-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "categories_db"
  DB_USER: "postgres"
  DB_SSLMODE: "require"
  SERVICE_AUTH_MODE: "mesh"
  OPENFGA_AUTH_MODE: "mesh"
  OPENFGA_URL: "http://openfga.marketplace.svc.cluster.local"
  APPROVALS_SERVICE_URL: "http://mp-approvals.marketplace.svc.cluster.local"
