name: GHCR Cleanup (5-day retention)

# For every container package in ghcr.io/tesserix:
#   * always retain any version whose tag is pinned by a chart under charts/;
#   * always retain the newest 3 package versions;
#   * retain every version updated within the last 5 days; and
#   * delete all other tagged and untagged versions.
#
# The chart keep-list is not optional. Age does not imply "unused": an app that
# simply has not been rebuilt in months is still running, and deleting its image
# is silent until a node is replaced. On a 100% preemptible pool that is a matter
# of days. Deleting the 13-14 May pins for tesserix-auth-bff, tesserix-docs and
# tesserix-storybook took all three down the next time GKE recycled their nodes,
# months after the deletions, with nothing linking cause to effect.
#
# A GHCR package version can carry multiple tags and GitHub deletes the complete
# version, so the newest-3 rule applies to versions rather than individual tag
# aliases.
#
# REQUIRES a GitHub App installed on the tesserix organization with access to
# all repositories and Packages: write permission:
#   * variable GHCR_CLEANUP_APP_CLIENT_ID
#   * secret   GHCR_CLEANUP_APP_PRIVATE_KEY
# GitHub currently returns HTTP 400 when an installation token lists container
# packages for some organizations. Until GitHub fixes that API defect, the
# workflow automatically falls back to:
#   * secret   GHCR_CLEANUP_TOKEN (classic PAT with read:packages,
#              delete:packages, and read:org)
#
# GitHub App installation tokens use an installation-specific rate-limit bucket
# and expire after one hour. Each run stops after 50 minutes and dispatches a
# continuation with a fresh token if more work remains.

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC; small incremental cleanups avoid backlogs.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview deletions without deleting'
        type: boolean
        default: false
      resume-after:
        description: 'Internal continuation cursor; leave empty for a normal run'
        type: string
        default: ''

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # The installation token expires after one hour. The script stops at 50m
    # and leaves 10m for summary generation and continuation dispatch.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GHCR_CLEANUP_APP_CLIENT_ID }}
          private-key: ${{ secrets.GHCR_CLEANUP_APP_PRIVATE_KEY }}
          # With an owner and no repository list, the token covers every
          # repository available to this organization installation.
          owner: tesserix
          permission-packages: write

      - name: Select a working GitHub Packages token
        id: package-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        shell: bash
        run: |
          probe_token() {
            local token="$1"
            local output_file="$2"
            curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header "Authorization: Bearer $token" \
              --output "$output_file" \
              --write-out '%{http_code}' \
              'https://api.github.com/orgs/tesserix/packages?package_type=container&per_page=1'
          }

          app_response="$RUNNER_TEMP/ghcr-app-probe.json"
          app_status="$(probe_token "$APP_TOKEN" "$app_response" || echo 000)"
          if [[ "$app_status" == "200" ]]; then
            selected_token="$APP_TOKEN"
            token_source="github-app"
          elif [[ "$app_status" == "400" ]]; then
            echo "::warning::GitHub rejected container package listing with the App installation token (HTTP 400); using the classic PAT fallback."
            if [[ -z "$PAT_TOKEN" ]]; then
              echo "::error::GHCR_CLEANUP_TOKEN is required while GitHub's Packages API rejects installation tokens."
              exit 1
            fi
            pat_response="$RUNNER_TEMP/ghcr-pat-probe.json"
            pat_status="$(probe_token "$PAT_TOKEN" "$pat_response" || echo 000)"
            if [[ "$pat_status" != "200" ]]; then
              message="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("message", "unknown error"))' "$pat_response" 2>/dev/null || echo 'unreadable response')"
              echo "::error::The fallback GHCR_CLEANUP_TOKEN failed package discovery (HTTP $pat_status: $message)."
              exit 1
            fi
            selected_token="$PAT_TOKEN"
            token_source="classic-pat-fallback"
          else
            message="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("message", "unknown error"))' "$app_response" 2>/dev/null || echo 'unreadable response')"
            echo "::error::The GitHub App token failed package discovery (HTTP $app_status: $message)."
            exit 1
          fi

          echo "::add-mask::$selected_token"
          echo "token=$selected_token" >> "$GITHUB_OUTPUT"
          echo "source=$token_source" >> "$GITHUB_OUTPUT"
          echo "Using package API credential source: $token_source"

      - name: Delete stale GHCR package versions
        id: cleanup
        env:
          GHCR_TOKEN: ${{ steps.package-token.outputs.token }}
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry-run || false }}
          CUT_OFF: 5d
          RESUME_AFTER: ${{ inputs.resume-after || '' }}
        run: |
          args=(
            --org tesserix
            --cut-off "$CUT_OFF"
            --keep 3
            --resume-after "$RESUME_AFTER"
            --soft-timeout-seconds 3000
            --protect-tags-from charts
            # Kargo pins live image tags in Application helm parameters.
            --protect-tags-from argocd
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/ghcr_cleanup.py "${args[@]}"

      - name: Dispatch continuation before the hard timeout
        if: steps.cleanup.outputs.status == 'partial'
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry-run || false }}
          RESUME_AFTER: ${{ steps.cleanup.outputs.resume-after }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ghcr-cleanup.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                'dry-run': process.env.DRY_RUN,
                'resume-after': process.env.RESUME_AFTER
              }
            });
            core.notice(`Continuation dispatched after package: ${process.env.RESUME_AFTER || '<start>'}`);

      - name: Summary
        if: always()
        env:
          STATUS: ${{ steps.cleanup.outputs.status || 'failed' }}
          PACKAGES_DISCOVERED: ${{ steps.cleanup.outputs.packages-discovered || '0' }}
          PACKAGES_PROCESSED: ${{ steps.cleanup.outputs.packages-processed || '0' }}
          VERSIONS_EXAMINED: ${{ steps.cleanup.outputs.versions-examined || '0' }}
          VERSIONS_DELETED: ${{ steps.cleanup.outputs.versions-deleted || '0' }}
          VERSIONS_WOULD_DELETE: ${{ steps.cleanup.outputs.versions-would-delete || '0' }}
          RESUME_AFTER: ${{ steps.cleanup.outputs.resume-after || '' }}
          TOKEN_SOURCE: ${{ steps.package-token.outputs.source || 'unavailable' }}
          CUT_OFF: 5d
        run: |
          {
            echo "## GHCR cleanup"
            echo
            echo "- Status: **$STATUS**"
            echo "- Package API credential: **$TOKEN_SOURCE**"
            echo "- Packages processed: **$PACKAGES_PROCESSED / $PACKAGES_DISCOVERED**"
            echo "- Versions examined: **$VERSIONS_EXAMINED**"
            echo "- Versions deleted: **$VERSIONS_DELETED**"
            echo "- Versions eligible in dry run: **$VERSIONS_WOULD_DELETE**"
            echo "- Policy: retain every version newer than **$CUT_OFF** and always retain the newest 3 per package."
            if [[ "$STATUS" == "partial" ]]; then
              echo "- A continuation was dispatched after: **${RESUME_AFTER:-<start>}**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
