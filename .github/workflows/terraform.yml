name: Terraform Static Validation

'on':
  pull_request:
    branches: [main]
    paths:
      - terraform-new/**
      - atlantis.yaml
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - terraform-new/**
      - atlantis.yaml
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

jobs:
  format:
    name: terraform-fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive terraform-new

  validate:
    name: terraform-validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - 00-state-bootstrap
          - 01-foundation
          - 02-network
          - 03-storage
          - 04-gke
          - 05-k8s-bootstrap
          - 06-workload-identity
          - 07-app-secrets
          - 08-communication-services
          - 09-github-arc
          - 11-identity-platform
          - 12-vertex
          - 13-document-intelligence-iam
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Initialize without remote state
        working-directory: terraform-new/stacks/${{ matrix.stack }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: terraform-new/stacks/${{ matrix.stack }}
        run: terraform validate
