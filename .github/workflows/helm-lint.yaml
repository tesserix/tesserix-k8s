# =============================================================================
# Helm Chart Linting Workflow
# Runs on PRs and pushes to validate Helm charts
# =============================================================================
name: Helm Lint

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yaml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  HELM_VERSION: '3.14.0'

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo add istio https://istio-release.storage.googleapis.com/charts
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo add zitadel https://charts.zitadel.com
          helm repo update

      - name: Build chart dependencies
        # NOT `|| true`. Swallowing a dependency-build failure does not skip the
        # problem, it defers it: nothing gets vendored into charts/, and the next
        # step fails with "chart directory is missing these dependencies" — which
        # names the symptom and hides the cause. devai-stack sat broken on main
        # this way. Collect every failure, print the real error, then fail.
        run: |
          set -uo pipefail
          failed=0
          for chart in charts/apps/*/ charts/infrastructure/*/ charts/thirdparty/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            grep -q "^dependencies:" "$chart/Chart.yaml" || continue
            echo "Building dependencies for $chart..."
            if ! helm dependency build "$chart" 2>&1 | tee /tmp/dep.log; then
              echo "::error file=${chart}Chart.yaml::helm dependency build failed — $(grep -m1 -i 'error' /tmp/dep.log || echo 'see log above')"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more charts could not resolve their dependencies (see errors above)."
            echo "For a file:// dependency this usually means the declared version no longer"
            echo "matches the sibling chart's Chart.yaml version."
            exit 1
          fi

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml 2>/dev/null || echo "")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed charts:"
            echo "$changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No chart changes detected"
          fi

      - name: Lint all charts
        run: |
          echo "Linting all charts in charts/apps/"
          for chart in charts/apps/*/; do
            chart_name=$(basename "$chart")
            # Skip the common library chart (library charts don't need linting)
            if [ "$chart_name" = "common" ]; then
              echo "Skipping library chart: $chart_name"
              continue
            fi
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart" --strict
            fi
          done
          echo "Linting all charts in charts/infrastructure/"
          for chart in charts/infrastructure/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart" --strict
            fi
          done
          echo "Linting all charts in charts/thirdparty/"
          for chart in charts/thirdparty/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              helm lint "$chart" --strict
            fi
          done

      - name: Run chart-testing lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

  validate:
    name: Validate Helm Templates
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add Helm repositories and build dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo add istio https://istio-release.storage.googleapis.com/charts
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo add zitadel https://charts.zitadel.com
          helm repo update
          for chart in charts/apps/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency build "$chart" || true
            fi
          done

      - name: Template all charts
        run: |
          echo "Validating templates for all charts..."
          for chart in charts/apps/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              # Skip the common library chart
              if [ "$chart_name" = "common" ]; then
                echo "Skipping library chart: $chart_name"
                continue
              fi
              echo "Templating $chart_name..."
              helm template "$chart_name" "$chart" > /dev/null
              if [ $? -eq 0 ]; then
                echo "✓ $chart_name templates valid"
              else
                echo "✗ $chart_name template validation failed"
                exit 1
              fi
            fi
          done
          echo "All chart templates are valid!"

      - name: Validate Kubernetes manifests
        run: |
          # Install kubeconform for manifest validation
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

          echo "Validating Kubernetes manifests..."
          for chart in charts/apps/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              # Skip the common library chart
              if [ "$chart_name" = "common" ]; then
                continue
              fi
              echo "Validating $chart_name manifests..."
              helm template "$chart_name" "$chart" | kubeconform -strict -summary || true
            fi
          done

  security-scan:
    name: Security Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add Helm repositories and build dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo add istio https://istio-release.storage.googleapis.com/charts
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add qdrant https://qdrant.github.io/qdrant-helm
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo add zitadel https://charts.zitadel.com
          helm repo update
          for chart in charts/apps/*/; do
            if [ -f "$chart/Chart.yaml" ] && grep -q "dependencies:" "$chart/Chart.yaml"; then
              helm dependency build "$chart" || true
            fi
          done

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'charts/'
          format: 'table'
          exit-code: '0'  # Don't fail on vulnerabilities, just report
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: charts/
          framework: helm
          soft_fail: true
          output_format: cli
