# =============================================================================
# Chart Testing Configuration
# Used by chart-testing (ct) for linting and testing Helm charts
# =============================================================================

# Target branch for comparison
target-branch: main

# Chart directories to search
chart-dirs:
  - charts/apps

# Exclude charts from testing (if any)
excluded-charts: []

# Lint configuration
lint-conf: .github/lintconf.yaml

# Helm options
helm-extra-args: --timeout 600s

# Validation settings
validate-maintainers: false
validate-chart-schema: true

# Check version increment
check-version-increment: true

# Chart repositories to add (if charts have dependencies)
chart-repos: []
