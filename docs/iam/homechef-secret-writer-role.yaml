# Custom role replacing project-level roles/secretmanager.admin on
# app-secrets-homechef-prod@tesseracthub-480811.iam.gserviceaccount.com
#
# Why the app needs write access at all: HomeChef provisions per-vendor and
# per-driver payment credentials as individual Secret Manager secrets
# (`<env>-homechef-{vendor,driver}-payment-<id>-<field>`, see
# apps/api/services/secrets.go) and destroys them on DPDP account deletion.
# Read-only access would break vendor onboarding and the deletion flow.
#
# Why roles/secretmanager.admin was wrong: it also carries
# secretmanager.secrets.setIamPolicy, which lets the service account grant
# itself — or anyone else — access to EVERY secret in the project, across all
# Tesserix products. An RCE or SSRF in homechef-api would have escalated to the
# whole estate. It also carries secrets.update and secrets.list, neither of
# which the code uses.
#
# Why not an IAM condition on the name prefix: secretmanager.secrets.create is
# authorised against the PARENT PROJECT, not the not-yet-existent secret, so a
# `resource.name.startsWith("...prod-homechef-")` condition would reject every
# create. Scoping by name is not achievable for creation; dropping the
# dangerous verbs is.
#
# Permissions below are exactly the four operations present in the codebase
# (CreateSecret, AddSecretVersion, AccessSecretVersion, DeleteSecret) plus
# secrets.get for existence checks.

title: "HomeChef Secret Writer"
description: >-
  Create/version/delete Secret Manager secrets without the ability to modify
  IAM policy. Replaces roles/secretmanager.admin for the HomeChef app SA.
stage: GA
includedPermissions:
  - secretmanager.secrets.create
  - secretmanager.secrets.delete
  - secretmanager.secrets.get
  - secretmanager.versions.add
  - secretmanager.versions.access
  - secretmanager.versions.get
  - secretmanager.versions.destroy
