# Stages configuration - DevTest only uses dev stage
# All services deploy to a single stage-specific namespace
stages:
  dev:
    enabled: true
    autoPromotion: true
    namespace: "devtest"
  staging:
    enabled: false
    autoPromotion: false
    namespace: "staging"
  production:
    enabled: false
    autoPromotion: false
    namespace: "production"

# Warehouse configuration
warehouse:
  freightCreationPolicy: Automatic
  # NewestBuild selects the most recently pushed image (by timestamp)
  # This ensures main-<sha> tags are picked up in order of creation
  imageSelectionStrategy: NewestBuild
  # Only allow main-<sha> tags for devtest (e.g., main-a9630c0, main-a83d7d1)
  allowTagsRegexes:
    - "^main-[a-f0-9]{7,8}$"
  platform: "linux/amd64"
  # Poll interval for checking new images (default is 60s)
  interval: "60s"
  # Disable Git subscription for devtest - Git repo is private and requires credentials
  # Only track image updates for now
  gitSubscription: false
