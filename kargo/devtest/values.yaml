# Kargo Project Configuration for DevTest Environment
project:
  name: tesseract-hub-devtest

# Git repository configuration
git:
  repoURL: "https://github.com/tesserix/tesserix-k8s.git"
  branch: "main"

# Container registry configuration
registry:
  url: "ghcr.io"
  owner: "tesserix"
  repoPrefix: "tesseract-hub"

# ArgoCD configuration
argocd:
  namespace: "argocd"

# Services with published images in GHCR (26 packages total)
# - 14 Backend Services (Go - Port 8080)
# - 3 Frontend Applications (tenant-onboarding, admin, storefront)
# - 9 Micro-Frontend (MFE) Applications
# Image URL format: ghcr.io/tesserix/tesseract-hub/<service-name>
# Pull Policy: Always
services:
