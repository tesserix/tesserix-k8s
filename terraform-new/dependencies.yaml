# Canonical Terraform stack graph for the production control plane.
#
# This file is consumed by the local orchestrator and mirrored by atlantis.yaml.
# State prefixes deliberately match the existing GCS objects; changing one is a
# state migration, not a naming cleanup.
version: "2.0"

project:
  id: tesseracthub-480811
  number: "849928263410"
  environment: prod
  region: asia-south1

state:
  bucket: tesseract-terraform-states
  location: australia-southeast1
  storage_class: STANDARD
  acknowledged_orphans:
    cloud-run:
      state_prefix: stacks/prod/cloud-run
      managed: false
      reason: State exists in GCS but there is no corresponding source stack.
      disposition: Preserve until an explicit adoption or retirement decision.
    legacy-state-devtest:
      state_prefix: state/devtest
      managed: false
      reason: Legacy state exists outside the terraform-new stack graph.
      disposition: Preserve until an explicit adoption or retirement decision.
    legacy-state-prod:
      state_prefix: state/prod
      managed: false
      reason: Legacy state exists outside the terraform-new stack graph.
      disposition: Preserve until an explicit adoption or retirement decision.
    legacy-terraform-devtest:
      state_prefix: terraform/devtest
      managed: false
      reason: Legacy state exists outside the terraform-new stack graph.
      disposition: Preserve until an explicit adoption or retirement decision.
    legacy-terraform-state:
      state_prefix: terraform/state
      managed: false
      reason: Legacy state exists outside the terraform-new stack graph.
      disposition: Preserve until an explicit adoption or retirement decision.
    tesserix-governance:
      state_prefix: tesserix-governance
      managed: false
      reason: Governance state is owned outside the terraform-new stack graph.
      disposition: Preserve under its existing owner.

naming:
  pattern: "{prefix}-{environment}-{resource}"
  prefix: tesseract
  scope: New resources only; existing names remain unchanged to avoid replacements.
  exceptions:
    state_bucket: tesseract-terraform-states

stacks:
  00-state-bootstrap:
    name: state-bootstrap
    description: Existing GCS Terraform state bucket ownership and protection
    path: stacks/00-state-bootstrap
    state_prefix: stacks/prod/state-bootstrap
    dependencies: []
    timeout: 10m

  01-foundation:
    name: foundation
    description: Required GCP APIs
    path: stacks/01-foundation
    state_prefix: stacks/prod/foundation
    dependencies: [00-state-bootstrap]
    timeout: 10m

  02-network:
    name: network
    description: VPC, subnets, NAT, and firewall rules
    path: stacks/02-network
    state_prefix: stacks/prod/network
    dependencies: [01-foundation]
    timeout: 15m

  03-storage:
    name: storage
    description: GCS buckets, Secret Manager, and KMS
    path: stacks/03-storage
    state_prefix: stacks/prod/storage
    dependencies: [01-foundation]
    timeout: 10m

  04-gke:
    name: gke
    description: GKE cluster and node pools
    path: stacks/04-gke
    state_prefix: stacks/prod/gke
    dependencies: [02-network]
    timeout: 30m

  05-k8s-bootstrap:
    name: k8s-bootstrap
    description: Kubernetes and Argo CD bootstrap resources
    path: stacks/05-k8s-bootstrap
    state_prefix: stacks/prod/k8s-bootstrap
    dependencies: [04-gke]
    timeout: 20m

  06-workload-identity:
    name: workload-identity
    description: Google service accounts and GKE Workload Identity bindings
    path: stacks/06-workload-identity
    state_prefix: stacks/prod/workload-identity
    dependencies: [03-storage, 04-gke]
    timeout: 10m

  07-app-secrets:
    name: app-secrets
    description: Application secrets in Secret Manager
    path: stacks/07-app-secrets
    state_prefix: stacks/prod/app-secrets
    dependencies: [04-gke, 06-workload-identity]
    timeout: 10m

  08-communication-services:
    name: communication-services
    description: Email, SMS, push, and Pub/Sub services
    path: stacks/08-communication-services
    state_prefix: stacks/prod/communication-services
    dependencies: [01-foundation]
    timeout: 10m

  09-github-arc:
    name: github-arc
    description: GitHub Actions Runner Controller resources retained in state
    path: stacks/09-github-arc
    state_prefix: stacks/prod/github-arc
    dependencies: [05-k8s-bootstrap]
    timeout: 15m

  11-identity-platform:
    name: identity-platform
    description: Google Identity Platform tenant configuration
    path: stacks/11-identity-platform
    state_prefix: stacks/prod/identity-platform
    dependencies: [01-foundation]
    timeout: 10m

  12-vertex:
    name: vertex
    description: Vertex AI private connectivity, DNS, and gateway IAM
    path: stacks/12-vertex
    state_prefix: stacks/prod/vertex
    dependencies: [02-network]
    timeout: 15m

execution_order:
  - phase: 1
    stacks: [00-state-bootstrap]
  - phase: 2
    stacks: [01-foundation]
  - phase: 3
    stacks: [02-network, 03-storage, 08-communication-services, 11-identity-platform]
  - phase: 4
    stacks: [04-gke, 12-vertex]
  - phase: 5
    stacks: [05-k8s-bootstrap, 06-workload-identity]
  - phase: 6
    stacks: [07-app-secrets]
  - phase: 7
    stacks: [09-github-arc]

destroy_order:
  - 09-github-arc
  - 07-app-secrets
  - 06-workload-identity
  - 05-k8s-bootstrap
  - 12-vertex
  - 04-gke
  - 11-identity-platform
  - 08-communication-services
  - 03-storage
  - 02-network
  - 01-foundation
  - 00-state-bootstrap
