# Terraform Stack Dependencies Configuration
# Multi-Region Support with Dynamic Environment Resolution

version: "1.0"

# =============================================================================
# Project Configuration
# =============================================================================
# Naming Convention:
#   All environments (devtest, pilot, prod) use the same GCP project: tesseracthub-480811
#   devtest: tesseract-devtest-*
#   pilot:   tesseract-pilot-*
#   prod:    tesseract-prod-*
# =============================================================================

projects:
  devtest:
    name: tesseracthub
    id: tesseracthub-480811
    number: "480811"
    admin_user: unidevidp@gmail.com
    naming_prefix: tesseract

  pilot:
    name: tesseracthub
    id: tesseracthub-480811
    number: "480811"
    admin_user: unidevidp@gmail.com
    naming_prefix: tesseract

  prod:
    name: tesseracthub
    id: tesseracthub-480811
    number: "480811"
    admin_user: unidevidp@gmail.com
    naming_prefix: tesseract

# =============================================================================
# Multi-Region Configuration
# =============================================================================
# Each region has its own infrastructure stack (VPC, GKE, etc.)
# State bucket is ALWAYS in Australia for data sovereignty
# =============================================================================

regions:
  # Australia - Primary for DevTest and state storage
  au:
    code: au
    gcp_region: australia-southeast1
    zones:
      - australia-southeast1-a
      - australia-southeast1-b
      - australia-southeast1-c
    compliance: privacy-act
    description: Australia - Primary development region

  # India - Primary for Production
  in:
    code: in
    gcp_region: asia-south1
    zones:
      - asia-south1-a
      - asia-south1-b
      - asia-south1-c
    compliance: dpdpa
    description: India - Primary production region

# =============================================================================
# State Management Configuration
# =============================================================================
# State bucket location: Australia (australia-southeast1) for all environments
# This ensures state files are stored in a compliant location
# =============================================================================

state:
  # State bucket is ALWAYS in Australia regardless of deployment region
  bucket_location: australia-southeast1
  bucket_storage_class: STANDARD

  # Naming pattern: {project_prefix}-terraform-states
  bucket_names:
    devtest: tesseract-terraform-states
    pilot: tesseract-terraform-states
    prod: tesseract-terraform-states

  # State prefix pattern: stacks/{environment}/{region}/{stack_name}
  prefix_pattern: "stacks/{environment}/{region}/{stack_name}"

# =============================================================================
# Stack Definitions with Dependencies
# =============================================================================
# Each stack is deployed per-region with its own state file
# Pattern: stacks/{env}/{region}/{stack}/
# Example: stacks/prod/in/gke/ (Production GKE in India)
# =============================================================================

stacks:
  # Layer 1: Foundation - No dependencies
  01-foundation:
    name: foundation
    description: Enable required GCP APIs
    path: stacks/01-foundation
    state_prefix: foundation
    dependencies: []
    outputs:
      - apis_enabled
      - project_id
      - region
    timeout: 10m
    per_region: false  # Foundation is project-wide, not per-region

  # Layer 2: Network - Depends on Foundation (PER REGION)
  02-network:
    name: network
    description: VPC, Subnets, NAT Gateway, Firewall Rules
    path: stacks/02-network
    state_prefix: network
    dependencies:
      - 01-foundation
    outputs:
      - vpc_id
      - vpc_name
      - vpc_self_link
      - subnet_id
      - subnet_name
      - pods_ip_range_name
      - services_ip_range_name
    timeout: 15m
    per_region: true  # Each region has its own VPC

  # Layer 3: Storage - Depends on Foundation (CAN BE MULTI-REGION)
  03-storage:
    name: storage
    description: GCS Buckets, Secret Manager, KMS
    path: stacks/03-storage
    state_prefix: storage
    dependencies:
      - 01-foundation
    outputs:
      - bucket_names
      - bucket_urls
      - secret_ids
      - kms_keyring_id
    timeout: 10m
    per_region: true  # Regional buckets for compliance

  # Layer 4: GKE - Depends on Network (PER REGION)
  04-gke:
    name: gke
    description: GKE Cluster and Node Pools
    path: stacks/04-gke
    state_prefix: gke
    dependencies:
      - 02-network
    outputs:
      - cluster_id
      - cluster_name
      - cluster_endpoint
      - cluster_ca_certificate
    timeout: 30m
    per_region: true  # Each region has its own GKE cluster

  # Layer 5: Kubernetes Bootstrap - Depends on GKE
  05-k8s-bootstrap:
    name: k8s-bootstrap
    description: Kong, Cert-Manager, ArgoCD, External Secrets
    path: stacks/05-k8s-bootstrap
    state_prefix: k8s-bootstrap
    dependencies:
      - 04-gke
    outputs:
      - kong_proxy_ip
      - argocd_server_url
    timeout: 20m
    per_region: true

  # Layer 6: Workload Identity - Depends on GKE and Storage
  06-workload-identity:
    name: workload-identity
    description: Service Accounts and Workload Identity Bindings
    path: stacks/06-workload-identity
    state_prefix: workload-identity
    dependencies:
      - 04-gke
      - 03-storage
    outputs:
      - service_account_emails
    timeout: 10m
    per_region: true

  # Layer 7: App Secrets - Depends on GKE
  07-app-secrets:
    name: app-secrets
    description: Application Secrets in Secret Manager
    path: stacks/07-app-secrets
    state_prefix: app-secrets
    dependencies:
      - 04-gke
      - 06-workload-identity
    outputs:
      - secret_ids
    timeout: 10m
    per_region: true

  # Layer 8: Communication Services - Depends on Foundation
  08-communication-services:
    name: communication-services
    description: Email, SMS, Push Notification Services
    path: stacks/08-communication-services
    state_prefix: communication-services
    dependencies:
      - 01-foundation
    outputs:
      - pubsub_topic_ids
    timeout: 10m
    per_region: false  # Project-wide, not per-region

  # Layer 9: GitHub ARC - Depends on K8s Bootstrap
  09-github-arc:
    name: github-arc
    description: GitHub Actions Runner Controller
    path: stacks/09-github-arc
    state_prefix: github-arc
    dependencies:
      - 05-k8s-bootstrap
    outputs:
      - arc_controller_ready
    timeout: 15m
    per_region: true  # Runners per region for locality

  # Layer 11: Identity Platform - Depends on Foundation (APIs)
  11-identity-platform:
    name: identity-platform
    description: Google Identity Platform multi-tenant configuration (Platform, Marketplace)
    path: stacks/11-identity-platform
    state_prefix: identity-platform
    dependencies:
      - 01-foundation
    outputs:
      - tenant_ids
      - tenant_display_names
    timeout: 10m
    per_region: false  # Identity Platform is project-wide

# =============================================================================
# Execution Order (Topologically Sorted)
# =============================================================================

execution_order:
  - phase: 1
    parallel: false
    stacks: [01-foundation]

  - phase: 2
    parallel: true
    stacks: [02-network, 03-storage, 08-communication-services, 11-identity-platform]

  - phase: 3
    parallel: false
    stacks: [04-gke]

  - phase: 4
    parallel: true
    stacks: [05-k8s-bootstrap, 06-workload-identity]

  - phase: 5
    parallel: false
    stacks: [07-app-secrets]

  - phase: 6
    parallel: true
    stacks: [09-github-arc]

# Destroy Order (reverse of execution)
destroy_order:
  - 11-identity-platform
  - 09-github-arc
  - 07-app-secrets
  - 06-workload-identity
  - 05-k8s-bootstrap
  - 04-gke
  - 08-communication-services
  - 03-storage
  - 02-network
  - 01-foundation

# =============================================================================
# GitHub Actions Workflow Configuration
# =============================================================================

github_actions:
  # Required GitHub Secrets for each project
  required_secrets:
    common:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ZONE_ID
      - LETSENCRYPT_EMAIL
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - ARGOCD_GITHUB_APP_ID
      - ARGOCD_GITHUB_APP_INSTALLATION_ID
      - ARGOCD_GITHUB_APP_PRIVATE_KEY

    devtest:
      - GCP_DEVTEST_PROJECT_ID
      - GCP_DEVTEST_SA_KEY  # or use Workload Identity
      - GCP_DEVTEST_WIF_PROVIDER
      - GCP_DEVTEST_WIF_SA_EMAIL

    prod:
      - GCP_PROD_PROJECT_ID
      - GCP_PROD_SA_KEY  # or use Workload Identity
      - GCP_PROD_WIF_PROVIDER
      - GCP_PROD_WIF_SA_EMAIL

  # Workload Identity Federation (recommended over SA keys)
  workload_identity:
    devtest:
      provider: projects/tesseracthub-480811/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
    pilot:
      provider: projects/tesseracthub-480811/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
    prod:
      provider: projects/tesseracthub-480811/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
