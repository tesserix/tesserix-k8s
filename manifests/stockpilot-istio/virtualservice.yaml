##############################################################################
# StockPilot Istio VirtualService Configuration
# Routes: stockpilot.tesserix.app → stockpilot-api / stockpilot-web
# Plain Kubernetes Deployments with ClusterIP Services
##############################################################################
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: stockpilot-platform
  namespace: stockpilot
  labels:
    app.kubernetes.io/part-of: stock-analysis
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - stockpilot.tesserix.app
  http:
    # Health check → stockpilot-api
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: stockpilot-api.stockpilot.svc.cluster.local
            port:
              number: 8000
      timeout: 10s

    # WebSocket agent chat → stockpilot-api
    - match:
        - uri:
            prefix: /api/agents/ws
      route:
        - destination:
            host: stockpilot-api.stockpilot.svc.cluster.local
            port:
              number: 8000
      timeout: 3600s

    # Otto support-chat — WebSocket + REST passthrough to
    # support-platform-otto. MUST come before the /api catch-all.
    - match:
        - uri:
            prefix: /api/v1/storefront/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s
    - match:
        - uri:
            prefix: /api/v1/admin/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s

    # Auth routes → stockpilot-web (must be before /api catch-all).
    # The BFF proxy (/api/auth/proxy/*) routes user requests through
    # the Next.js server before they reach the FastAPI backend, so a
    # rolling deploy of stockpilot-web can briefly hand a request to
    # a terminating pod. Retry on connection-level failures only —
    # never on 5xx, because POST /api/trades isn't idempotent and we
    # don't want duplicate fills.
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: stockpilot-web.stockpilot.svc.cluster.local
            port:
              number: 3000
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 20s
        retryOn: connect-failure,refused-stream,reset

    # Long-running synchronous AI/agent endpoints — TradingAgents debate graph,
    # DCA monthly run, prediction generation, multi-stock comparison can each
    # take ~60-180s end-to-end. The default /api retry policy (perTryTimeout
    # 30s, attempts 3) terminates these mid-flight; carve them out into their
    # own route with a single attempt and a generous wall-clock timeout so the
    # in-process asyncio.wait_for in run_trading_graph (110s) is what enforces
    # the cutoff.
    - match:
        - uri:
            prefix: /api/agents/research
        - uri:
            prefix: /api/agents/compare
        - uri:
            prefix: /api/agents/chat/stream
        - uri:
            prefix: /api/dca/run
        - uri:
            prefix: /api/predictions/generate
        - uri:
            prefix: /api/polymarket/scan
        - uri:
            prefix: /api/agents/fno
        - uri:
            prefix: /api/agents/ipo
      route:
        - destination:
            host: stockpilot-api.stockpilot.svc.cluster.local
            port:
              number: 8000
      timeout: 300s
      retries:
        attempts: 1
        perTryTimeout: 300s
        retryOn: connect-failure,refused-stream
      corsPolicy: &stockpilot-cors-long
        allowOrigins:
          - exact: "https://stockpilot.tesserix.app"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
        allowCredentials: true
        maxAge: "86400s"

    # Generic API routes → stockpilot-api service
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: stockpilot-api.stockpilot.svc.cluster.local
            port:
              number: 8000
      timeout: 120s
      retries:
        attempts: 3
        perTryTimeout: 30s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy: &stockpilot-cors
        allowOrigins:
          - exact: "https://stockpilot.tesserix.app"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
        allowCredentials: true
        maxAge: "86400s"

    # All other routes → stockpilot-web frontend
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: stockpilot-web.stockpilot.svc.cluster.local
            port:
              number: 3000
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
