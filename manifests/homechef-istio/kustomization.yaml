apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Note: no top-level `namespace:` directive — the authorizationpolicy lives
# in istio-ingress (same namespace as the gateway pod it selects), while
# gateway.yaml and virtualservice.yaml stay in homechef. Each resource
# carries an explicit `metadata.namespace`.
resources:
  - gateway.yaml
  - virtualservice.yaml
  - networkpolicy-observability-egress.yaml
  - networkpolicy-infra-egress.yaml
  - authorizationpolicy.yaml
