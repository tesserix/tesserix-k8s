##############################################################################
# HomeChef Istio VirtualService Configuration
# All services run in-cluster as plain Deployments behind ClusterIP Services
# All portals authenticate via Google Identity Platform (homechef tenant)
##############################################################################

# --- Customer-facing SPA (fe3dr.com / www.fe3dr.com) ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-web
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: frontend
  # external-dns CNAME target for fe3dr.com is the homechef Cloudflare Tunnel,
  # NOT the shared mark8ly tunnel set as --default-targets in external-dns.
  # Tunnel ID decoded from prod-homechef-cloudflare-tunnel-token.
  annotations:
    external-dns.alpha.kubernetes.io/target: "03e498ae-dad7-4e6a-9744-6fa782956861.cfargotunnel.com"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    # Dual-bind during the dedicated-gateway cutover so both code paths
    # serve fe3dr.com while we flip the Cloudflare tunnel hostname from
    # istio-ingressgateway → homechef-ingressgateway. Remove the legacy
    # binding in a follow-up commit once the tunnel is pointed at the
    # new gateway and we've confirmed traffic is flowing through it.
    - istio-ingress/tesseract-gateway
    - homechef/homechef-gateway
  hosts:
    - fe3dr.com
    - www.fe3dr.com
  http:
    # GIP auth-bff via legacy /bff/* prefix — frontend (auth-service.ts)
    # uses /bff as its same-origin base. Rewrite /bff/* → /* and route to
    # the same upstream as /auth/*.
    - match:
        - uri:
            prefix: /bff/
      rewrite:
        uri: /
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s

    # GIP auth-bff — handles /auth/login, /auth/callback, /auth/logout,
    # /auth/refresh, /auth/whoami. Replaces the legacy /bff/* and
    # /driver-bff/* legacy prefixes (deleted 2026-05-15 cutover).
    # Routes directly to the homechef-auth-bff ClusterIP service (8080),
    # mirroring mark8ly-auth-bff. No retries — auth callbacks consume
    # state on first read (non-idempotent).
    - match:
        - uri:
            prefix: /auth/
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
      corsPolicy: &homechef-cors
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # Otto support-chat WebSocket — direct passthrough to the
    # support-platform-otto pod. Ticket auth is checked inside Otto;
    # the WS handler is mounted on a no-middleware group so it does
    # NOT need X-Internal-Auth. MUST be the most-specific match so
    # /api/v1/storefront/otto/conversations/.../ws beats the REST
    # rule below. 3600s timeout, no retries (retrying a half-upgraded
    # stream corrupts it).
    - match:
        - uri:
            regex: ^/api/v1/storefront/otto/conversations/[^/]+/ws$
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s
    - match:
        - uri:
            prefix: /api/v1/admin/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s

    # Otto REST — proxied through the homechef-web nginx so the
    # X-Internal-Auth + X-Tenant-Id + X-Store-Id headers Otto's
    # CustomerContext middleware requires are injected server-side
    # (the secret must never reach the browser). nginx rewrites
    # /api/otto/* -> /api/v1/storefront/otto/* and forwards to
    # support-platform-otto. Long timeout for the SSE-shaped queue
    # poll, no retries.
    - match:
        - uri:
            prefix: /api/otto/
      route:
        - destination:
            host: homechef-web-direct.homechef.svc.cluster.local
            port:
              number: 80
      timeout: 120s

    # API routes -> HomeChef API service
    - match:
        - uri:
            prefix: /api
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-api-direct.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 60s

    # WebSocket routes -> API service
    - match:
        - uri:
            prefix: /ws
      route:
        - destination:
            host: homechef-api-direct.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 3600s

    # Customer ordering SPA (apps/web) -> homechef-web-app.
    #
    # fe3dr.com is split by path between two apps on one origin: the Next.js
    # marketing/SEO landing keeps everything not listed here (/, /explore,
    # /chef/<slug>, /cuisine/<slug>, /area/<slug>, /download, and the legal
    # pages), while the signed-in ordering app owns the routes below. One
    # origin matters — auth-bff mints the session cookie for fe3dr.com and
    # auth-service.ts calls /bff same-origin, so a separate host would break
    # login.
    #
    # /assets/ is load-bearing: Vite emits the SPA's JS/CSS there. Without it
    # the app's HTML loads and then fetches its bundle from the landing and
    # 404s. The landing is Next.js and serves /_next/, so the two never
    # collide.
    #
    # Deliberately NOT routed here even though the SPA also defines them:
    # /privacy, /terms, /refund. The landing ships the canonical public copies
    # at those URLs and they are indexed; routing them to the SPA would serve
    # different legal text depending on how the user arrived.
    - match:
        - uri:
            prefix: /assets/
        # The SPA's own public/ files. Without these they fall through to the
        # catch-all and the LANDING answers 404 — which left the app with no
        # favicon and a manifest that never loaded. The landing serves its own
        # icon from /icon.svg and ships no manifest, so none of these collide.
        - uri:
            exact: /favicon.svg
        - uri:
            exact: /logo-icon.svg
        - uri:
            exact: /manifest.json
        - uri:
            exact: /sw.js
        - uri:
            exact: /offline.html
        # Same rule, same trap: these were added to the SPA's public/ but not
        # here, so they 404'd from the LANDING while sitting perfectly well in
        # the SPA image. /favicon.ico is the fallback every crawler and OS
        # shortcut tile probes for, /icons/ backs the PWA install prompt and the
        # push-notification badge, and the service worker precaches all three —
        # cache.addAll is atomic, so a single 404 here fails the whole install.
        - uri:
            exact: /favicon.ico
        - uri:
            exact: /safari-pinned-tab.svg
        - uri:
            prefix: /icons/
        - uri:
            prefix: /login
        - uri:
            prefix: /register
        - uri:
            prefix: /forgot-password
        - uri:
            prefix: /user-info
        - uri:
            prefix: /chefs
        - uri:
            prefix: /cart
        - uri:
            prefix: /checkout
        - uri:
            prefix: /orders
        - uri:
            prefix: /profile
        - uri:
            prefix: /wallet
        - uri:
            prefix: /loyalty
        - uri:
            prefix: /referral
        - uri:
            prefix: /favorites
        - uri:
            prefix: /social
        - uri:
            prefix: /feed
        # ChefBook — the customer-facing article reader. Without this the SPA
        # route exists but the edge falls through to the marketing app, so a
        # shared article link 404s.
        - uri:
            prefix: /chefbook
        - uri:
            prefix: /bakery
        - uri:
            prefix: /subscriptions
        # Tiffin meal plans — a DIFFERENT product from /subscriptions (a one-off
        # pre-booked week paid as an advance, vs a recurring daily tiffin), so it
        # needs its own prefix. Without this the SPA route exists but the edge
        # falls through to the marketing app and /meal-plans 404s, which is what
        # every other entry in this list has been added to fix.
        - uri:
            prefix: /meal-plans
        - uri:
            prefix: /catering
        - uri:
            prefix: /group-orders
        - uri:
            prefix: /group
        - uri:
            prefix: /settings
        - uri:
            prefix: /data-privacy
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-web-app-direct.homechef.svc.cluster.local
            port:
              number: 80
      timeout: 30s

    # All other routes -> the marketing landing (homechef-web slot).
    - match:
        - uri:
            prefix: /
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-web-direct.homechef.svc.cluster.local
            port:
              number: 80
      timeout: 30s
---
# --- Vendor Portal (vendors.fe3dr.com) - Chef/vendor dashboard ---
