spec:
  gateways:
    - istio-ingress/tesseract-gateway
    - homechef/homechef-gateway
  hosts:
    - admin.fe3dr.com
  http:
    # GIP auth-bff via legacy /bff/* prefix — admin portal frontend uses
    # /bff as its same-origin base. Rewrite /bff/* → /* before routing.
    - match:
        - uri:
            prefix: /bff/
      rewrite:
        uri: /
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s

    # GIP auth-bff — handles /auth/* for the admin portal. The BFF resolves
    # the internal GIP tenant (HomeChef-Internal-gyofe) from the request
    # Host header (admin.fe3dr.com) — which now flows through unmodified.
    - match:
        - uri:
            prefix: /auth/
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
          - exact: "https://internal-identity.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # API routes -> API Service (direct)
    - match:
        - uri:
            prefix: /api
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-api.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 60s

    # WebSocket routes -> homechef-api directly (bypass BFF, which can't
    # proxy WS upgrades). 3600s timeout to keep long-lived connections open.
    - match:
        - uri:
            prefix: /ws
      route:
        - destination:
            host: homechef-api.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 3600s

    # All other routes -> Admin Portal SPA (direct)
    - match:
        - uri:
            prefix: /
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-admin-portal.homechef.svc.cluster.local
            port:
              number: 80
      timeout: 30s
