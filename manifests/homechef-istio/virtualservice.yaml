##############################################################################
# HomeChef Istio VirtualService Configuration
# All services run in-cluster via Knative Serving
# Traffic routes through knative-local-gateway with Host header rewriting
# All portals authenticate via customer Keycloak realm (homechef)
##############################################################################

# --- Customer-facing SPA (fe3dr.com / www.fe3dr.com) ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-web
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: frontend
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - fe3dr.com
    - www.fe3dr.com
  http:
    # BFF auth routes -> Auth BFF Knative service (via /bff/ prefix)
    - match:
        - uri:
            prefix: /bff/
      rewrite:
        uri: /
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy: &homechef-cors
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # Auth callback route -> Auth BFF (Keycloak redirects back here)
    - match:
        - uri:
            prefix: /auth/
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # API routes -> HomeChef API Knative service
    - match:
        - uri:
            prefix: /api
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # WebSocket routes -> API Knative service
    - match:
        - uri:
            prefix: /ws
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 3600s

    # All other routes -> Web SPA Knative service
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            Host: homechef-web.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 30s
