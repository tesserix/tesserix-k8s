# --- Delivery Portal (delivery.fe3dr.com) - Delivery partner dashboard ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-delivery-portal
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: delivery-portal
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - delivery.fe3dr.com
  http:
    # BFF auth routes -> Auth BFF (customer Keycloak realm)
    # Both /bff/ (staff) and /driver-bff/ (driver) now use the customer realm.
    # Staff are 3rd party fleet managers, NOT platform admins — they register
    # and authenticate via the homechef realm alongside drivers.
    # Platform admins use admin.fe3dr.com (separate VirtualService + internal realm).
    - match:
        - uri:
            prefix: /bff/
      rewrite:
        uri: /
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: delivery.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # Driver BFF auth routes -> Auth BFF (customer Keycloak realm)
    # Unlike /bff/ which uses x-auth-context: admin (internal realm),
    # /driver-bff/ omits x-auth-context so the BFF defaults to the customer realm (homechef)
    - match:
        - uri:
            prefix: /driver-bff/
      rewrite:
        uri: /
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: delivery.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # Auth callback route -> Auth BFF (customer realm)
    - match:
        - uri:
            prefix: /auth/
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: delivery.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # API routes
    - match:
        - uri:
            prefix: /api
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # WebSocket routes (for delivery tracking)
    - match:
        - uri:
            prefix: /ws
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 3600s

    # All other routes -> Delivery Portal SPA
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            Host: homechef-delivery-portal.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 30s
