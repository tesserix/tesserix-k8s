          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # Auth callback route -> Auth BFF (Keycloak redirects back here)
    - match:
        - uri:
            prefix: /auth/
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: analytics.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # API routes
    - match:
        - uri:
            prefix: /api
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # All other routes -> Analytics Portal SPA
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            Host: homechef-analytics.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 30s

# NOTE: internal-identity.fe3dr.com is handled by the identity-internal Keycloak
# VirtualService (in identity-internal namespace), NOT by the homechef BFF.
# The admin portal auth flow uses admin.fe3dr.com/bff/* -> auth-bff -> Keycloak.
# The browser then visits internal-identity.fe3dr.com/realms/* for login pages.
