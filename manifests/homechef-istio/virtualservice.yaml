# --- Admin Portal (admin.fe3dr.com) - App owner admin panel ---
# Uses INTERNAL Keycloak realm (tesserix-internal) via internal-identity.fe3dr.com
# This is separate from the customer/vendor auth at identity.fe3dr.com
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-admin-portal
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: admin-portal
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - admin.fe3dr.com
  http:
    # BFF auth routes -> Auth BFF (INTERNAL Keycloak realm)
    # x-forwarded-host set to admin.fe3dr.com so BFF detects this as an admin host
    # and uses the internal Keycloak realm (tesserix-internal) for authentication
    - match:
        - uri:
            prefix: /bff/
      rewrite:
        uri: /
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: admin.fe3dr.com
            x-forwarded-proto: https
            x-auth-context: admin
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://admin.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
          - exact: "https://internal-identity.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # Auth callback route -> Auth BFF (internal realm)
    - match:
        - uri:
            prefix: /auth/
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: admin.fe3dr.com
            x-forwarded-proto: https
            x-auth-context: admin
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # API routes
    - match:
        - uri:
            prefix: /api
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s

    # WebSocket routes -> homechef-api directly (bypass BFF, which can't
    # proxy WS upgrades). 3600s timeout to keep long-lived connections open.
    - match:
        - uri:
            prefix: /ws
      headers:
        request:
          set:
            Host: homechef-api.homechef.svc.cluster.local
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 3600s

    # All other routes -> Admin Portal SPA
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            Host: homechef-admin-portal.homechef.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 30s
