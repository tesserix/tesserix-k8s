# --- Identity (identity.fe3dr.com) - GIP auth via homechef-auth-bff ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-identity
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: identity
  annotations:
    external-dns.alpha.kubernetes.io/target: "03e498ae-dad7-4e6a-9744-6fa782956861.cfargotunnel.com"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    # Dual-bind during the dedicated-gateway cutover so both code paths
    # serve fe3dr.com while we flip the Cloudflare tunnel hostname from
    # istio-ingressgateway → homechef-ingressgateway. Remove the legacy
    # binding in a follow-up commit once the tunnel is pointed at the
    # new gateway and we've confirmed traffic is flowing through it.
    - istio-ingress/tesseract-gateway
    - homechef/homechef-gateway
  hosts:
    - identity.fe3dr.com
  http:
    # The /realms/, /resources/ and /robots.txt routes are gone with Keycloak:
    # homechef-auth-bff has been on GIP since the BFF cutover, and the
    # identity-customer namespace has had no workload behind those three routes
    # for months, so every request to them answered 503. There is no login page
    # to serve at this host any more — the BFF owns the whole redirect flow.
    #
    # Auth BFF routes — handles /auth/*, /bff/* for OIDC redirect flows
    # NOTE: No retry policy — auth callbacks consume state on first read (non-idempotent).
    # Retrying causes invalid_state errors because the state is deleted after retrieval.
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: identity.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 60s
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"
---
# --- Analytics (analytics.fe3dr.com) - Analytics dashboard ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-analytics
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: analytics
  annotations:
    external-dns.alpha.kubernetes.io/target: "03e498ae-dad7-4e6a-9744-6fa782956861.cfargotunnel.com"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    # Dual-bind during the dedicated-gateway cutover so both code paths
    # serve fe3dr.com while we flip the Cloudflare tunnel hostname from
    # istio-ingressgateway → homechef-ingressgateway. Remove the legacy
    # binding in a follow-up commit once the tunnel is pointed at the
    # new gateway and we've confirmed traffic is flowing through it.
    - istio-ingress/tesseract-gateway
    - homechef/homechef-gateway
  hosts:
    - analytics.fe3dr.com
  http:
    # GIP auth-bff — handles /auth/* for the analytics portal. Replaces
    # the legacy /bff/* prefix (deleted 2026-05-15 cutover).
    - match:
        - uri:
            prefix: /auth/
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # API routes
    - match:
        - uri:
            prefix: /api
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-api-direct.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 60s

    # No catch-all: there is no homechef-analytics workload in the cluster and
    # no chart produces one, so this route pointed at a host that never existed
    # and analytics.fe3dr.com/ already returned 404. Dropped rather than left
    # dangling. The /auth/ and /api routes above
    # are real and still work; re-add a catch-all when an analytics SPA ships.

# NOTE: internal-identity.fe3dr.com no longer routes anywhere — the
# internal identity host it named never had a VirtualService and the admin
# portal now authenticates through admin.fe3dr.com/bff/* -> auth-bff -> GIP.
# The hostname stays in the gateway allowlist only until DNS is retired.
