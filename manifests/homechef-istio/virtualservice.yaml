# --- Identity (identity.fe3dr.com) - Keycloak auth (customer realm) ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: homechef-identity
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: identity
  annotations:
    external-dns.alpha.kubernetes.io/target: "03e498ae-dad7-4e6a-9744-6fa782956861.cfargotunnel.com"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    # Dual-bind during the dedicated-gateway cutover so both code paths
    # serve fe3dr.com while we flip the Cloudflare tunnel hostname from
    # istio-ingressgateway → homechef-ingressgateway. Remove the legacy
    # binding in a follow-up commit once the tunnel is pointed at the
    # new gateway and we've confirmed traffic is flowing through it.
    - istio-ingress/tesseract-gateway
    - homechef/homechef-gateway
  hosts:
    - identity.fe3dr.com
  http:
    # Keycloak realm endpoints — must go DIRECTLY to Keycloak (not BFF)
    # Browser visits these for login pages, token exchange, OIDC discovery
    - match:
        - uri:
            prefix: /realms/
      headers:
        request:
          set:
            x-forwarded-host: identity.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: 60s
    # Keycloak resources (JS, CSS, images for login pages)
    - match:
        - uri:
            prefix: /resources/
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
    # Keycloak robots.txt
    - match:
        - uri:
            exact: /robots.txt
      route:
        - destination:
            host: keycloak.identity-customer.svc.cluster.local
            port:
              number: 8080
    # Auth BFF routes — handles /auth/*, /bff/* for OIDC redirect flows
    # NOTE: No retry policy — auth callbacks consume state on first read (non-idempotent).
    # Retrying causes invalid_state errors because the state is deleted after retrieval.
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            Host: homechef-auth-bff.homechef.svc.cluster.local
            x-forwarded-host: identity.fe3dr.com
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      corsPolicy:
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://delivery.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"
