kind: VirtualService
metadata:
  name: homechef-vendor-portal
  namespace: homechef
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: vendor-portal
  annotations:
    external-dns.alpha.kubernetes.io/target: "03e498ae-dad7-4e6a-9744-6fa782956861.cfargotunnel.com"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    # Dual-bind during the dedicated-gateway cutover so both code paths
    # serve fe3dr.com while we flip the Cloudflare tunnel hostname from
    # istio-ingressgateway → homechef-ingressgateway. Remove the legacy
    # binding in a follow-up commit once the tunnel is pointed at the
    # new gateway and we've confirmed traffic is flowing through it.
    - istio-ingress/tesseract-gateway
    - homechef/homechef-gateway
  hosts:
    - vendors.fe3dr.com
  http:
    # GIP auth-bff via legacy /bff/* prefix — vendor portal frontend uses
    # /bff as its same-origin base. Rewrite /bff/* → /* before routing.
    - match:
        - uri:
            prefix: /bff/
      rewrite:
        uri: /
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s

    # GIP auth-bff — handles /auth/* for the vendor portal. Replaces the
    # legacy /bff/* prefix (deleted 2026-05-15 cutover). Routes
    # directly to the homechef-auth-bff ClusterIP service (8080).
    - match:
        - uri:
            prefix: /auth/
      route:
        - destination:
            host: homechef-auth-bff.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
      corsPolicy: &homechef-cors
        allowOrigins:
          - exact: "https://fe3dr.com"
          - exact: "https://www.fe3dr.com"
          - exact: "https://vendors.fe3dr.com"
          - exact: "https://analytics.fe3dr.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
          - x-auth-context
          - x-csrf-token
          - x-auth-token
        allowCredentials: true
        maxAge: "86400s"

    # API routes
    - match:
        - uri:
            prefix: /api
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-api-direct.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 60s
      corsPolicy: *homechef-cors

    # WebSocket routes
    - match:
        - uri:
            prefix: /ws
      route:
        - destination:
            host: homechef-api-direct.homechef.svc.cluster.local
            port:
              number: 8080
      timeout: 3600s

    # All other routes -> Vendor Portal SPA
    - match:
        - uri:
            prefix: /
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: homechef-vendor-portal-direct.homechef.svc.cluster.local
            port:
              number: 80
      timeout: 30s
