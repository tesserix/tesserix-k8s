# =============================================================================
# AuthorizationPolicy — homechef-ingressgateway
# =============================================================================
# Istio's root namespace (istio-system) carries `deny-all-default`, which
# applies cluster-wide. The shared `istio-ingressgateway` and
# `custom-ingressgateway` workloads each have their own ALLOW policies
# generated by the istio-auth-policies Helm chart (frontend-allow,
# public-api, payment, etc.) so traffic flows. The new
# `homechef-ingressgateway` workload has no policy matching its label, so
# the root-namespace deny-all wins and every request returns 403.
#
# This policy is the explicit ALLOW that unblocks the dedicated gateway.
# It's scoped tightly to the homechef-owned hosts so we don't accidentally
# turn the new gateway into an open relay for other tenants.
#
# Lives in `istio-ingress` namespace — same as the gateway pod — because
# AuthorizationPolicy selects workloads in its own namespace.
# =============================================================================
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-homechef-ingressgateway-public
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: home-chef-app
    app.kubernetes.io/component: gateway-authz
spec:
  selector:
    matchLabels:
      istio: homechef-ingressgateway
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts:
              - fe3dr.com
              - "*.fe3dr.com"
