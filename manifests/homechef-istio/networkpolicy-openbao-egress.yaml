apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homechef-api-to-openbao-egress
  namespace: homechef
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homechef-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
