# EnvoyFilter to fix x-forwarded-proto for Auth BFF
# The double-proxy chain (Istio gateway → knative-local-gateway → BFF sidecar)
# causes x-forwarded-proto to be set to 'http' (since inter-proxy connections
# are HTTP). This filter overrides it to 'https' at the BFF sidecar level
# since all external traffic arrives via HTTPS (Cloudflare terminates TLS).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: fix-forwarded-proto-auth-bff
  namespace: homechef
spec:
  workloadSelector:
    labels:
      serving.knative.dev/service: homechef-auth-bff
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: |
              function envoy_on_request(request_handle)
                request_handle:headers():replace("x-forwarded-proto", "https")
              end
