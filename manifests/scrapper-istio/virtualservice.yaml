##############################################################################
# Social Media Scrapper Istio VirtualService Configuration
# Routes: social-scrapper.tesserix.app → scrapper-api / scrapper-web
# Plain Kubernetes Deployments with ClusterIP Services
##############################################################################
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: scrapper-platform
  namespace: scrapper
  labels:
    app.kubernetes.io/part-of: social-media-scrapper
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - social-scrapper.tesserix.app
  http:
    # NextAuth routes → scrapper-web (must come before /api catch-all)
    - match:
        - uri:
            prefix: /api/auth/nextauth
      route:
        - destination:
            host: scrapper-web.scrapper.svc.cluster.local
            port:
              number: 3000
      timeout: 30s

    # API proxy routes → scrapper-web (Next.js adds JWT and forwards to Python)
    - match:
        - uri:
            prefix: /api/proxy
      route:
        - destination:
            host: scrapper-web.scrapper.svc.cluster.local
            port:
              number: 3000
      timeout: 120s

    # PostSocial publishing engine — exposed only as a path prefix on the same
    # hostname, never as a separate subdomain. Used for OAuth callbacks from
    # social platforms (X, LinkedIn, etc.) and any direct browser traffic the
    # PostSocial frontend assets need. Users never visit this directly — our
    # Next.js publishing pages call this through the scraper API.
    - match:
        - uri:
            prefix: /api/postsocial/
      rewrite:
        uri: /
      route:
        - destination:
            host: postsocial.scrapper.svc.cluster.local
            port:
              number: 5000
      timeout: 120s
      retries:
        attempts: 3
        perTryTimeout: 30s
        retryOn: gateway-error,connect-failure,refused-stream

    # API routes → scrapper-api service
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: scrapper-api.scrapper.svc.cluster.local
            port:
              number: 8000
      timeout: 120s
      retries:
        attempts: 3
        perTryTimeout: 30s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy: &scrapper-cors
        allowOrigins:
          - exact: "https://social-scrapper.tesserix.app"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
        allowCredentials: true
        maxAge: "86400s"

    # WebSocket chat → scrapper-api service
    - match:
        - uri:
            prefix: /api/ws
      route:
        - destination:
            host: scrapper-api.scrapper.svc.cluster.local
            port:
              number: 8000
      timeout: 3600s

    # SSE event streams → scrapper-api service
    - match:
        - uri:
            regex: "/api/jobs/.*/stream"
      route:
        - destination:
            host: scrapper-api.scrapper.svc.cluster.local
            port:
              number: 8000
      timeout: 300s

    # All other routes → scrapper-web frontend
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: scrapper-web.scrapper.svc.cluster.local
            port:
              number: 3000
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
