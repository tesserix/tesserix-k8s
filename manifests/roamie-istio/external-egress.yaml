apiVersion: v1
kind: ConfigMap
metadata:
  name: roamie-egress-options
  namespace: roamie
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
data:
  deployment: "spec:\n  replicas: 2\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n\
    \      maxUnavailable: 0\n      maxSurge: 1\n  template:\n    spec:\n      securityContext:\n\
    \        runAsNonRoot: true\n        seccompProfile:\n          type: RuntimeDefault\n\
    \      topologySpreadConstraints:\n      - maxSkew: 1\n        topologyKey: kubernetes.io/hostname\n\
    \        whenUnsatisfiable: ScheduleAnyway\n        labelSelector:\n         \
    \ matchLabels:\n            gateway.networking.k8s.io/gateway-name: roamie-egress\n\
    \      containers:\n      - name: istio-proxy\n        resources:\n          requests:\n\
    \            memory: 128Mi\n            cpu: null\n          limits:\n       \
    \     memory: 512Mi\n            cpu: null\n        securityContext:\n       \
    \   allowPrivilegeEscalation: false\n          readOnlyRootFilesystem: true\n\
    \          capabilities:\n            drop:\n            - ALL\n"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: roamie-egress
  namespace: roamie
  labels:
    istio.io/waypoint-for: service
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ''
      kind: ConfigMap
      name: roamie-egress-options
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: roamie-egress
  namespace: roamie
spec:
  minAvailable: 1
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: roamie-egress
