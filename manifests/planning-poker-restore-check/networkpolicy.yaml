apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: planning-poker-restore-check-identity
  namespace: planning-poker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: planning-poker-restore-check
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
