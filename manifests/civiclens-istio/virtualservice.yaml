apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: civiclens-api
  namespace: civiclens
  labels:
    app.kubernetes.io/part-of: civiclens
    app.kubernetes.io/component: networking
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - civiclns-api.tesserix.app
  http:
    - match:
        - uri:
            exact: /v1/reports
          method:
            exact: POST
        - uri:
            regex: ^/v1/reports/[0-9a-fA-F-]+/share-package$
          method:
            exact: POST
      headers:
        request:
          set:
            x-forwarded-host: civiclns-api.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: civiclens-api.civiclens.svc.cluster.local
            port:
              number: 8080
      timeout: 90s
      retries:
        attempts: 0
    - match:
        - uri:
            prefix: /v1/
        - uri:
            exact: /.well-known/apple-app-site-association
        - uri:
            exact: /.well-known/assetlinks.json
        - uri:
            regex: ^/community/[0-9a-fA-F-]{36}$
        - uri:
            exact: /assets/civiclens.png
      headers:
        request:
          set:
            x-forwarded-host: civiclns-api.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: civiclens-api.civiclens.svc.cluster.local
            port:
              number: 8080
      timeout: 30s
      retries:
        attempts: 0
