##############################################################################
# GameVerse Istio VirtualService Configuration
# Routes straight to the in-cluster ClusterIP services.
##############################################################################

# --- GameVerse Platform (stayandplays.com) ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gameverse-platform
  namespace: gameverse
  labels:
    app.kubernetes.io/part-of: gameverse-platform
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - stayandplays.com
  http:
    # Otto support-chat — WebSocket + REST passthrough to
    # support-platform-otto. Comes before the generic /api routes so
    # /api/v1/storefront/otto/* doesn't fall through to gameverse-server.
    - match:
        - uri:
            prefix: /api/v1/storefront/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s
    - match:
        - uri:
            prefix: /api/v1/admin/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s

    # WebSocket routes -> Game Server
    - match:
        - uri:
            prefix: /ws
      headers:
        request:
          set:
            x-forwarded-host: stayandplays.com
            x-forwarded-proto: https
      route:
        - destination:
            host: gameverse-server.gameverse.svc.cluster.local
            port:
              number: 8090
      timeout: 3600s

    # Chat WebSocket routes -> Game Server
    - match:
        - uri:
            prefix: /chat
      headers:
        request:
          set:
            x-forwarded-host: stayandplays.com
            x-forwarded-proto: https
      route:
        - destination:
            host: gameverse-server.gameverse.svc.cluster.local
            port:
              number: 8090
      timeout: 3600s

    # Health check routes -> Game Server
    - match:
        - uri:
            prefix: /healthz
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: gameverse-server.gameverse.svc.cluster.local
            port:
              number: 8090
      timeout: 30s

    # Room management routes -> Game Server
    - match:
        - uri:
            prefix: /rooms
      headers:
        request:
          set:
            x-forwarded-host: stayandplays.com
            x-forwarded-proto: https
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: gameverse-server.gameverse.svc.cluster.local
            port:
              number: 8090
      timeout: 60s
      corsPolicy:
        allowOrigins:
          - exact: "https://stayandplays.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
        allowCredentials: true
        maxAge: "86400s"

    # All other routes -> Shell SPA
    - match:
        - uri:
            prefix: /
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: gameverse-shell.gameverse.svc.cluster.local
            port:
              number: 3100
      timeout: 30s
