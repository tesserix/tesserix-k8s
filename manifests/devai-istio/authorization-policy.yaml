##############################################################################
# DevAI AuthorizationPolicy — Istio L7 access control
#
# devai-api: Only allow traffic from:
#   - Istio ingress gateway (for webhooks only — VirtualService limits paths)
#   - devai-dashboard (frontend SSR → API calls)
#   - devai-sre-dashboard (SRE frontend → API calls)
#   - devai-sre (SRE backend → ALM API cross-calls)
#   - Self (A2A internal communication)
#   - Monitoring namespace (Prometheus scraping)
#
# devai-sre: Only allow traffic from:
#   - devai-sre-dashboard (frontend SSR → SRE API)
#   - devai-api (ALM → SRE cross-calls)
#   - Self (internal)
#   - Monitoring namespace
##############################################################################

# --- devai-api Authorization ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-api-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-api
  action: ALLOW
  rules:
    # Rule 1: Istio ingress gateway (webhooks come through here)
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]
      to:
        - operation:
            paths: ["/webhook/*"]
            methods: ["POST"]

    # Rule 2: ALM dashboard (SSR API calls)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-dashboard"]

    # Rule 3: SRE dashboard (cross-platform API calls)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-sre-dashboard"]

    # Rule 4: SRE backend (SRE → ALM cross-calls)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-sre"]

    # Rule 5: Self (A2A inter-agent, internal health checks)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-api"]

    # Rule 5b: MCP Hub (devai-mcp-hub federates the /mcp/<domain> downstream
    # servers mounted here — /mcp/scm, /mcp/sample, /mcp/analyst, /mcp/devai)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-mcp-hub"]

    # Rule 5d: AgentGateway data-plane traffic. This Service bypasses the
    # waypoint, so ztunnel can enforce only the source principal. DevAI still
    # requires separate dedicated upstream bearers for MCP and A2A requests.
    - from:
        - source:
            principals: ["cluster.local/ns/agentgateway-system/sa/agentgateway-mcp"]

    # Ambient fallback for the Gateway hop: ztunnel preserves the source
    # namespace but does not expose a workload principal on this path. The
    # NetworkPolicy admits only pods with the agentgateway-mcp Gateway label;
    # application-layer upstream bearers remain mandatory.
    - from:
        - source:
            namespaces: ["agentgateway-system"]

    # Rule 5c: kagent-agent-sync (kagent-system) curls /api/settings/kagent/
    # active-variants to learn which model variants users enabled in Settings,
    # so it provisions exactly those Agent pods on demand. ztunnel enforces only
    # the L4 principal here; the endpoint itself requires the shared service
    # bearer (identity._principal_from_service_bearer), so this is principal-only.
    - from:
        - source:
            principals: ["cluster.local/ns/kagent-system/sa/kagent-agent-sync"]

    # Rule 6: Prometheus scraping
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/metrics"]
            methods: ["GET"]

    # Rule 7: Kubelet health probes (no source identity)
    - to:
        - operation:
            paths: ["/healthz", "/readyz"]
            methods: ["GET"]
---
# --- devai-sre Authorization ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-sre-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-sre
  action: ALLOW
  rules:
    # Rule 1: SRE dashboard (SSR API calls)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-sre-dashboard"]

    # Rule 2: ALM backend (ALM → SRE cross-calls)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-api"]

    # Rule 3: Self (internal SRE autonomous scanner)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-sre"]

    # Rule 3b: MCP Hub (devai-mcp-hub federates the /mcp/sre downstream server)
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-mcp-hub"]

    # Rule 3c: Registry-approved MCP calls through the AgentGateway data plane.
    # The upstream service bearer remains mandatory at the application layer.
    - from:
        - source:
            principals: ["cluster.local/ns/agentgateway-system/sa/agentgateway-mcp"]
      to:
        - operation:
            paths: ["/mcp/*"]
            methods: ["GET", "POST", "DELETE"]

    # Ambient fallback for the same Gateway hop. NetworkPolicy still limits
    # admission to the labelled agentgateway-mcp data-plane pods.
    - from:
        - source:
            namespaces: ["agentgateway-system"]
      to:
        - operation:
            paths: ["/mcp/*"]
            methods: ["GET", "POST", "DELETE"]

    # Rule 4: Prometheus scraping
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/metrics"]
            methods: ["GET"]

    # Rule 5: Kubelet health probes
    - to:
        - operation:
            paths: ["/healthz", "/readyz"]
            methods: ["GET"]
---
# --- devai-dashboard Authorization (public, but only serves static files) ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-dashboard-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-dashboard
  action: ALLOW
  rules:
    # Allow Istio ingress (public access to dashboard UI)
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]

    # Kubelet health probes
    - to:
        - operation:
            paths: ["/healthz", "/_next/*", "/"]
            methods: ["GET"]
---
# --- devai-sre-dashboard Authorization (public, static files only) ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-sre-dashboard-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-sre-dashboard
  action: ALLOW
  rules:
    # Allow Istio ingress (public access to SRE dashboard UI)
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]

    # Kubelet health probes
    - to:
        - operation:
            paths: ["/healthz", "/_next/*", "/"]
            methods: ["GET"]
---
# --- devai-auth-bff Authorization ---
#
# Sees traffic for all four public DevAI hostnames:
#   * devai.tesserix.app/auth/* + /bff/*  (called by the ALM dashboard)
#   * sre.tesserix.app/auth/* + /bff/*    (called by the SRE dashboard)
#   * kagent.tesserix.app/                (full reverse-proxy)
#   * aregistry.tesserix.app/             (full reverse-proxy)
#
# Plus intra-namespace dashboard SSR calls to /auth/me.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-auth-bff-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-auth-bff
  action: ALLOW
  rules:
    # Istio ingress for all four hostnames terminates here.
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]
    # Dashboards may call /auth/me from server components (SSR) — same NS.
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-dashboard"]
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-sre-dashboard"]
    # Kubelet health probes.
    - to:
        - operation:
            paths: ["/healthz", "/readyz"]
            methods: ["GET"]
---
# --- devai-postgres Authorization ---
#
# The mesh baseline is deny-all (istio-system/deny-all-default). Once the devai
# namespace runs under ambient, ztunnel enforces that baseline at L4 — so the
# CloudNativePG Postgres workload needs an explicit allow or every connection is
# rejected ("connection closed due to policy rejection: allow policies exist,
# but none allowed"). Without this, devai-api / devai-sre / devai-auth-bff can't
# reach 5432 and the CNPG operator can't reach the instance status endpoint
# (8000), so the DB looks down and DB-backed routes (e.g. the Repos onboarding
# catalog) return 502. Selecting cnpg.io/cluster covers both the instance pods
# and the PgBouncer pooler pods.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-postgres-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: devai-postgres
  action: ALLOW
  # Allow all mesh-internal sources, matching the other CNPG clusters in this
  # cluster (e.g. allow-mesh-internal-homechef). A namespace/principal-scoped
  # rule can't authorize the CloudNativePG operator: it runs in cnpg-system
  # outside the ambient mesh, so its connection to the instance status endpoint
  # (:8000) carries no SPIFFE identity and matches no source selector — leaving
  # the cluster permanently in "Instance Status Extraction Error". PostgreSQL
  # password auth remains the real access control for 5432; this only lifts the
  # mesh-layer deny-all so the operator can manage the cluster.
  rules:
    - {}
---
# --- devai-mcp-hub Authorization ---
#
# The MCP Hub (the one /mcp surface multiplexing every registry MCP server)
# accepts calls only from the DevAI workloads that consume tools: the ALM
# api (chat + agents), the SRE backend, runner jobs, and the dashboards'
# SSR. Without this policy the namespace waypoint's allow-list denies every
# pod→hub request (503) — the Hub could dial its downstreams but nothing
# could dial the Hub.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: devai-mcp-hub-authz
  namespace: devai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devai-mcp-hub
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/devai/sa/devai-api"
              - "cluster.local/ns/devai/sa/devai-sre"
              - "cluster.local/ns/devai/sa/devai-runner"
              - "cluster.local/ns/devai/sa/devai-dashboard"
              - "cluster.local/ns/devai/sa/devai-sre-dashboard"
              - "cluster.local/ns/devai/sa/devai-mcp-hub"
    # Monitoring namespace (Prometheus scraping), same as the other services.
    - from:
        - source:
            namespaces: ["monitoring"]
