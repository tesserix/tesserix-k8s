##############################################################################
# DevAI Istio VirtualService Configuration
#
# PUBLIC routes (through Istio gateway):
#   - devai.tesserix.app/           → devai-dashboard (ALM UI, auth-protected)
#   - devai.tesserix.app/bff/*      → devai-auth-bff (OIDC auth flows)
#   - devai.tesserix.app/auth/*     → devai-auth-bff (OIDC callbacks)
#   - devai.tesserix.app/webhook/*  → devai-api (SCM webhooks)
#   - sre.tesserix.app/             → devai-sre-dashboard (SRE UI, auth-protected)
#   - sre.tesserix.app/bff/*        → devai-auth-bff (OIDC auth flows)
#   - sre.tesserix.app/auth/*       → devai-auth-bff (OIDC callbacks)
#
# INTERNAL routes (cluster-only, no gateway):
#   - devai-api.devai.svc.cluster.local:8080  → all API endpoints
#   - devai-sre.devai.svc.cluster.local:8090  → all SRE API endpoints
##############################################################################

# ALM Platform: devai.tesserix.app
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-platform
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - devai.tesserix.app
  http:
    # Auth BFF — OIDC login/logout/callback
    - match:
        - uri:
            prefix: /bff/
      headers:
        request:
          set:
            x-forwarded-host: devai.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 30s

    # Auth callbacks (IdP redirects here after login)
    - match:
        - uri:
            prefix: /auth/
      headers:
        request:
          set:
            x-forwarded-host: devai.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 30s

    # GitHub/GitLab/ADO webhook → devai-api (must be public for SCM providers)
    - match:
        - uri:
            prefix: /webhook
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 60s

    # Chat API — proxied through dashboard, needs longer timeout for LLM calls
    - match:
        - uri:
            prefix: /chat/api
      route:
        - destination:
            host: devai-dashboard.devai.svc.cluster.local
            port:
              number: 3100
      timeout: 300s

    # API → dashboard (which proxies to devai-api). The catch-all below retries
    # 3× at a 10s per-try timeout, which is wrong for the API: most /api calls
    # are POSTs (create repo, trigger run, author artifacts) and several
    # (create-and-onboard scaffolds ~13 files) legitimately take 10–20s. A
    # retried POST double-executes — that's what made a created repo report
    # "already exists" and 504 at 30s. So give /api a generous timeout and
    # DISABLE retries; the app surfaces errors itself.
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: devai-dashboard.devai.svc.cluster.local
            port:
              number: 3100
      timeout: 120s
      retries:
        attempts: 0

    # All other routes → devai-dashboard frontend
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: devai-dashboard.devai.svc.cluster.local
            port:
              number: 3100
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
---
# SRE Platform: sre.tesserix.app
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-sre-platform
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - sre.tesserix.app
  http:
    # Auth BFF — OIDC login/logout/callback (uses internal/SRE realm)
    - match:
        - uri:
            prefix: /bff/
      headers:
        request:
          set:
            x-forwarded-host: sre.tesserix.app
            x-forwarded-proto: https
            x-auth-context: admin
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 30s

    # Auth callbacks (uses internal/SRE realm)
    - match:
        - uri:
            prefix: /auth/
      headers:
        request:
          set:
            x-forwarded-host: sre.tesserix.app
            x-forwarded-proto: https
            x-auth-context: admin
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 30s

    # Chat API — proxied through dashboard, needs longer timeout for LLM calls
    - match:
        - uri:
            prefix: /api/chat
      route:
        - destination:
            host: devai-sre-dashboard.devai.svc.cluster.local
            port:
              number: 3200
      timeout: 300s

    # All other routes → devai-sre-dashboard frontend
    - match:
        - uri:
            prefix: /
      headers:
        response:
          # Edge override of the SRE dashboard CSP — same hash-vs-unsafe-inline
          # bug as the ALM dashboard (a script-src hash makes browsers ignore
          # 'unsafe-inline', blocking Next.js inline scripts -> blank screen).
          # Overwrite with a working CSP (no hash; frame-src 'none' since the SRE
          # dashboard frames nothing). Remove once the corrected app image ships.
          set:
            content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.tesserix.app wss://*.tesserix.app https://cloudflareinsights.com; frame-src 'self' https://*.firebaseapp.com https://apis.google.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
      route:
        - destination:
            host: devai-sre-dashboard.devai.svc.cluster.local
            port:
              number: 3200
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
---
# Internal-only VirtualService for devai-api (mesh traffic, no gateway)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-api-internal
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  hosts:
    - devai-api.devai.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: /chat/ws
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 3600s

    - match:
        - uri:
            prefix: /chat
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 300s

    - match:
        - uri:
            prefix: /dashboard/api
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 120s

    - match:
        - uri:
            exact: /healthz
        - uri:
            exact: /readyz
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 10s

    - route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 120s
---
# Internal-only VirtualService for devai-sre
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-sre-internal
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  hosts:
    - devai-sre.devai.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: /api/chat
      route:
        - destination:
            host: devai-sre.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 300s

    - route:
        - destination:
            host: devai-sre.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 120s
