##############################################################################
# DevAI Istio VirtualService Configuration
#
# PUBLIC routes (through Istio gateway → internet):
#   - devai.tesserix.app/           → devai-dashboard (ALM UI)
#   - devai.tesserix.app/webhook/*  → devai-api (GitHub/GitLab/ADO webhooks)
#   - sre.tesserix.app/             → devai-sre-dashboard (SRE UI)
#
# INTERNAL routes (cluster-only, no gateway):
#   - devai-api.devai.svc.cluster.local:8080  → all API endpoints
#   - devai-sre.devai.svc.cluster.local:8090  → all SRE API endpoints
#
# API endpoints (/api/*, /chat/*, /healthz, /readyz, /dashboard/api/*)
# are NOT exposed through the gateway. Dashboards call APIs via internal
# K8s service DNS using server-side rendering.
##############################################################################

# ALM Platform: devai.tesserix.app
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-platform
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - devai.tesserix.app
  http:
    # GitHub/GitLab/ADO webhook → devai-api (must be public for SCM providers)
    - match:
        - uri:
            prefix: /webhook
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 60s

    # All other routes → devai-dashboard frontend
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: devai-dashboard.devai.svc.cluster.local
            port:
              number: 3100
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
---
# Internal-only VirtualService for devai-api (mesh traffic, no gateway)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-api-internal
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  # No gateway — mesh-only (internal K8s service traffic)
  hosts:
    - devai-api.devai.svc.cluster.local
  http:
    # Chat WebSocket (long-lived connections from dashboard)
    - match:
        - uri:
            prefix: /chat/ws
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 3600s

    # Chat API (REST + SSE)
    - match:
        - uri:
            prefix: /chat
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 300s

    # Dashboard API
    - match:
        - uri:
            prefix: /dashboard/api
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 120s

    # Health/readiness probes
    - match:
        - uri:
            exact: /healthz
        - uri:
            exact: /readyz
      route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 10s

    # Catch-all for API
    - route:
        - destination:
            host: devai-api.devai.svc.cluster.local
            port:
              number: 8080
      timeout: 120s
---
# SRE Platform: sre.tesserix.app
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-sre-platform
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - sre.tesserix.app
  http:
    # All routes → devai-sre-dashboard frontend
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: devai-sre-dashboard.devai.svc.cluster.local
            port:
              number: 3200
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
---
# Internal-only VirtualService for devai-sre (mesh traffic, no gateway)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devai-sre-internal
  namespace: devai
  labels:
    app.kubernetes.io/part-of: devai
    app.kubernetes.io/component: routing
spec:
  hosts:
    - devai-sre.devai.svc.cluster.local
  http:
    - route:
        - destination:
            host: devai-sre.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 120s
