##############################################################################
# Tesserix Horoscope — Istio VirtualService
#
# Single domain: astronomy.tesserix.app.
#   /api/* and /healthz → horoscope-api  (Knative)
#   everything else     → horoscope-web  (Knative)
#
# Both services run in-cluster as Knative cluster-local Services. We forward
# traffic to the shared knative-local-gateway with a Host header rewrite so
# the right Knative Service receives the request.
#
# DNS: this VirtualService has NO `external-dns.alpha.kubernetes.io/target`
# annotation. external-dns will fall back to its --default-targets value,
# which on this cluster points at the shared (mark8ly) Cloudflare Tunnel —
# correct for any *.tesserix.app subdomain. Do not add a target annotation
# unless you've provisioned a dedicated tunnel.
##############################################################################
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: horoscope-web
  namespace: horoscope
  labels:
    app.kubernetes.io/part-of: tesserix-horoscope
    app.kubernetes.io/component: networking
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - astronomy.tesserix.app
  http:
    # ----- Otto support-chat (WS + REST) — MUST come before the
    # generic /api/ catch-all or horoscope-api would 404 the Otto path.
    - match:
        - uri:
            prefix: /api/v1/storefront/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s
    - match:
        - uri:
            prefix: /api/v1/admin/otto
      headers:
        request:
          set:
            Host: support-platform-otto.support-platform.svc.cluster.local
      route:
        - destination:
            host: support-platform-otto.support-platform.svc.cluster.local
            port:
              number: 8089
      timeout: 3600s

    # ----- API path: /api/v1/... → horoscope-api -----
    - match:
        - uri:
            prefix: /api/
      headers:
        request:
          set:
            Host: horoscope-api.horoscope.svc.cluster.local
            x-forwarded-host: astronomy.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 15s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy: &horoscope-cors
        allowOrigins:
          - exact: "https://astronomy.tesserix.app"
          - exact: "http://localhost:3000"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
        allowCredentials: true
        maxAge: "86400s"

    # ----- Healthz at the API root, also routed to the API service -----
    - match:
        - uri:
            exact: /healthz
      headers:
        request:
          set:
            Host: horoscope-api.horoscope.svc.cluster.local
            x-forwarded-host: astronomy.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 5s

    # ----- Everything else: Next.js frontend -----
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            Host: horoscope-web.horoscope.svc.cluster.local
            x-forwarded-host: astronomy.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: knative-local-gateway.istio-ingress.svc.cluster.local
            port:
              number: 80
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy: *horoscope-cors
