apiVersion: batch/v1
kind: CronJob
metadata:
  name: homechef-identity-bootstrap
  namespace: homechef
spec:
  suspend: true
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: bootstrap
              image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/python:3.12-alpine
              command: ["python", "-c", "pass"]
              resources:
                requests:
                  memory: 16Mi
                limits:
                  memory: 32Mi
