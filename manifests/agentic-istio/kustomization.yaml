apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - virtualservice.yaml
  - authorization-policy.yaml
  - publisher-route.yaml
  # Port-scoped egress so agentgateway + kagent can poll the registry API
  # (tcp/12121 only); reads stay allowed at the waypoint, writes stay denied.
  - networkpolicy-consumer-egress.yaml
  # Namespace-wide egress allowlist (adopted from live) + PSC 443 for Vertex.
  - networkpolicy-agentgateway-egress.yaml
  - ratelimit.yaml
