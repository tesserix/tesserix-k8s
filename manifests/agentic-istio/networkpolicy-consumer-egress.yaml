##############################################################################
# Let the agentic control-plane consumers reach the registry API.
#
# agentgateway (agentgateway-system) and kagent (kagent-system) poll the
# catalog from agentregistry.agentregistry-system.svc:12121, and the registry's
# ingress + the L7 AuthorizationPolicy already permit their (read-only) calls.
# But their egress NetworkPolicies (allow-agentgateway-egress /
# allow-kagent-egress) don't list agentregistry-system, so the traffic was
# dropped before reaching the waypoint (curl saw HTTP 000).
#
# These ADDITIVE egress policies allow the consumers to reach
# agentregistry-system. Note: this is full-namespace egress (all ports), which
# matches devai's working allow-devai-egress rule — Istio ambient routes app
# traffic over ztunnel HBONE (tcp/15008), so a port-scoped 12121-only rule is
# dropped before it ever reaches the registry. The actual access control is NOT
# the network port here but the defense-in-depth above it:
#   * mTLS    — ztunnel auto-mTLS between consumer and registry.
#   * waypoint AuthorizationPolicy — GETs on /v0/* allowed for these namespaces;
#     all writes DENIED (agentregistry-deny-writes-from-non-bootstrap). So the
#     consumers get a strict READ-ONLY role.
#   * DB creds — the registry's Postgres needs credentials the consumers don't
#     hold, so reaching tcp/5432 buys nothing.
#
# Delivered via the agentic-istio app (not istio-config) to keep it scoped.
##############################################################################
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentgateway-to-registry-egress
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentregistry-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kagent-to-registry-egress
  namespace: kagent-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentregistry-system
---
# The MCP data plane brokers calls to DevAI's API and SRE MCP endpoints. DevAI
# is ambient-mesh enrolled, so the egress rule must admit the namespace rather
# than only the application ports; ztunnel carries the connection over HBONE.
# Restrict the source to the MCP Gateway pods. DevAI's destination-side
# NetworkPolicies and AuthorizationPolicies still allow only the
# agentgateway-mcp service account; DevAI separately verifies protocol-scoped
# upstream bearers for MCP and A2A.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentgateway-mcp-to-devai-egress
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: agentgateway-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devai
---
# The Gateway exports only MCP servers registered for gateway use. Permit its
# data-plane pods to reach the namespaces that currently host those product
# MCP backends; destination-side policy and mesh authorization remain the L7
# enforcement boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentgateway-mcp-to-product-mcp-egress
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: agentgateway-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homechef
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mark8ly
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stockpilot
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: support-platform
---
# kagent-agent-sync also curls devai-api (devai namespace) for the active
# variant set — the union of every user's Settings-enabled models — so it can
# provision exactly those Agent pods on demand. Same additive, full-namespace
# pattern as the registry egress above (devai-api isn't in the ambient mesh, so
# this is plain pod-to-pod; the L7 gate is devai-api's service-bearer check).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kagent-to-devai-egress
  namespace: kagent-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devai
---
# The kagent controller dials the Agent Substrate API (ate-system: api:443 +
# atenet-router:80) to schedule SandboxAgents as gVisor Actors. kagent-system
# egress is default-deny, so without this the controller's dial to the ate-api
# times out ("context deadline exceeded") and the substrate-enabled controller
# CrashLoopBackOffs. Same additive full-namespace pattern as the registry/devai
# egress above (ate-system isn't in the mesh — plain pod-to-pod; the ate-api has
# its own token auth).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kagent-to-ate-egress
  namespace: kagent-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
