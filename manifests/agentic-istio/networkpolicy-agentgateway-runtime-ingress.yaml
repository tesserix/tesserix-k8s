apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agentgateway-runtime-ingress
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: networking
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: agentgateway-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8082
          protocol: TCP
