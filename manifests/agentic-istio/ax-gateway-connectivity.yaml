apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ax-gateway-hbone
  namespace: agentgateway-system
spec:
  podSelector:
    matchExpressions:
    - key: gateway.networking.k8s.io/gateway-name
      operator: In
      values: [waypoint, ai-gateway]
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ax-system
      podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: [ax-server, atenet-egress]
    ports:
    - protocol: TCP
      port: 15008
