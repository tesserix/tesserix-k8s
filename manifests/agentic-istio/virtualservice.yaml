##############################################################################
# Agentic UIs — Istio VirtualService configuration
#
# Human Registry traffic uses its dedicated Zitadel OAuth proxy. Machine APIs
# retain independent routes and credentials so an identity outage cannot block
# GitHub publication or catalog export.
##############################################################################

# kagent UI
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kagent-ui
  namespace: kagent-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - kagent.tesserix.app
  http:
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: kagent.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 120s
      retries:
        attempts: 2
        perTryTimeout: 30s
        retryOn: reset,connect-failure,refused-stream,5xx
---
# Tesserix MCP Gateway. Machine MCP calls go to AgentGateway's authenticated
# public listener; every browser path goes through the isolated Zitadel proxy
# to the Tesserix-owned registry UI.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mcp-agentgateway
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agentic-routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - mcp.tesserix.app
  http:
    - match:
        - uri:
            exact: /mcp
        - uri:
            prefix: /mcp/
      headers:
        request:
          set:
            x-forwarded-host: mcp.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: agentgateway-mcp.agentgateway-system.svc.cluster.local
            port:
              number: 8081
      timeout: 15m
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: mcp.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: mcp-gateway-ui-oauth2-proxy.agentgateway-system.svc.cluster.local
            port:
              number: 4180
      timeout: 120s
---
# Solo AgentGateway model calls go to the authenticated xDS data plane. Browser
# paths go to the standalone AgentGateway listener, which performs its own OIDC
# login and exposes the writable LLM/MCP console without XDS_ADDRESS. The
# controller/xDS Service on 9978 is never referenced by a public route.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: solo-agentgateway
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: agentic-routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - agentgateway.tesserix.app
  http:
    - match:
        - uri:
            exact: /anthropic
        - uri:
            prefix: /anthropic/
        - uri:
            exact: /openai
        - uri:
            prefix: /openai/
        - uri:
            exact: /vertex
        - uri:
            prefix: /vertex/
        - uri:
            exact: /gemini
        - uri:
            prefix: /gemini/
        - uri:
            exact: /groq
        - uri:
            prefix: /groq/
        - uri:
            exact: /openrouter
        - uri:
            prefix: /openrouter/
        - uri:
            exact: /nemoclaw
        - uri:
            prefix: /nemoclaw/
      headers:
        request:
          set:
            x-forwarded-host: agentgateway.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: ai-gateway.agentgateway-system.svc.cluster.local
            port:
              number: 8081
      timeout: 15m
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: agentgateway.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: agentgateway-console.agentgateway-system.svc.cluster.local
            port:
              number: 8082
      timeout: 120s
---
# Agent Registry UI
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aregistry-ui
  namespace: agentregistry-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - aregistry.tesserix.app
  http:
    # CI publishers bypass the browser session proxy only for the idempotent apply
    # endpoint. The registry validates a tenant-scoped deploy key and runs with
    # anonymous=read, so the route alone grants no write capability.
    - match:
        - uri:
            exact: /v0/apply
          method:
            exact: POST
      route:
        - destination:
            host: agentregistry.agentregistry-system.svc.cluster.local
            port:
              number: 12121
      timeout: 30s
    # Public runtime discovery is intentionally independent from human SSO.
    # Registry still filters Agent Cards by artifact visibility.
    - match:
        - uri:
            exact: /healthz
          method:
            exact: GET
        - uri:
            exact: /v0/health
          method:
            exact: GET
        - uri:
            exact: /v0/signing-key
          method:
            exact: GET
        - uri:
            regex: '^/v0/agents/[^/]+/(card|\.well-known/agent-card\.json)$'
          method:
            exact: GET
        - uri:
            regex: '^/v0/agents/[^/]+/[^/]+/card$'
          method:
            exact: GET
      route:
        - destination:
            host: agentregistry.agentregistry-system.svc.cluster.local
            port:
              number: 12121
      timeout: 30s
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: aregistry.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: agentregistry-ui-oauth2-proxy.agentregistry-system.svc.cluster.local
            port:
              number: 4180
      timeout: 120s
