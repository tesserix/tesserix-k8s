##############################################################################
# Agentic UIs — Istio VirtualService configuration
#
# Both hostnames route through devai-auth-bff (cross-namespace destination
# in `devai`). The BFF inspects the devai_session cookie:
#   * present + valid + email allow-listed → reverse-proxy to the upstream
#   * missing/invalid → 302 to https://devai.tesserix.app/login?return_to=…
#
# That's a single SSO for all four DevAI hostnames (devai, sre, kagent,
# aregistry), all backed by the same GIP project (tesseracthub-480811)
# and ALM-tenant pool.
##############################################################################

# kagent UI
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kagent-ui
  namespace: kagent-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - kagent.tesserix.app
  http:
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: kagent.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 120s
      retries:
        attempts: 2
        perTryTimeout: 30s
        retryOn: reset,connect-failure,refused-stream,5xx
---
# Agent Registry UI
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aregistry-ui
  namespace: agentregistry-system
  labels:
    app.kubernetes.io/part-of: tesserix
    app.kubernetes.io/component: routing
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - aregistry.tesserix.app
  http:
    # CI publishers bypass the browser BFF only for the idempotent apply
    # endpoint. The registry validates a tenant-scoped deploy key and runs with
    # anonymous=read, so the route alone grants no write capability.
    - match:
        - uri:
            exact: /v0/apply
          method:
            exact: POST
      route:
        - destination:
            host: agentregistry.agentregistry-system.svc.cluster.local
            port:
              number: 12121
      timeout: 30s
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: aregistry.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: devai-auth-bff.devai.svc.cluster.local
            port:
              number: 8090
      timeout: 120s
      retries:
        attempts: 2
        perTryTimeout: 30s
        retryOn: reset,connect-failure,refused-stream,5xx
