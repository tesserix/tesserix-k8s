##############################################################################
# Agentic — Istio AuthorizationPolicies (ambient + waypoint)
#
# In Istio ambient mode, AuthorizationPolicies attach to one of two layers:
#
#   * ztunnel — per-node L4 proxy. Sees source / destination identities
#     but NOT HTTP attributes (methods, paths, headers). A policy without
#     targetRefs binds here by default.
#
#   * waypoint — per-namespace L7 proxy. Sees the full request and
#     enforces method / path rules. A policy binds here via:
#         spec.targetRefs:
#           - kind: Gateway
#             group: gateway.networking.k8s.io
#             name: waypoint
#
# Every policy below that uses HTTP attributes carries targetRefs so it
# enforces at the waypoint. Skipping targetRefs is the silent foot-gun
# that bit us once already: the policy looks correct in YAML, gets
# accepted by ztunnel with status "ZtunnelAccepted: HTTP attributes
# stripped", and ends up wide-open at L7.
#
# Traversal for browser traffic:
#   istio-ingressgateway → devai-auth-bff (devai ns) → kagent-ui / agentregistry
##############################################################################

# --- kagent-ui — only devai-auth-bff (cross-namespace) + probes ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kagent-ui-authz
  namespace: kagent-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    # Authenticated traffic forwarded by devai-auth-bff
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
    # kagent-controller may read the UI for some internal metadata
    - from:
        - source:
            principals: ["cluster.local/ns/kagent-system/sa/kagent-controller"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/api/health", "/healthz", "/api/ready"]
            methods: ["GET"]
---
# --- agentregistry — devai-auth-bff (UI path) + catalog-API readers ---
#
# READ vs WRITE split — GETs allowed from any agentic-stack consumer;
# POST / PUT / PATCH / DELETE locked to the bootstrap Job's SA. The
# write restriction is also reinforced by an explicit DENY further down
# because the cluster-wide allow-mesh-internal baseline would otherwise
# defeat this ALLOW-only rule.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-authz
  namespace: agentregistry-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    # UI traffic comes via devai-auth-bff — full HTTP surface (Next.js
    # UI and /v0/* live on the same port; the bff is the only caller
    # and is already gated by GIP auth, so it gets the wide pass).
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
    # Catalog READS — any agentic-stack consumer may GET /v0/*.
    - from:
        - source:
            namespaces: ["agentgateway-system", "kagent-system", "devai"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v0/*"]
    # Catalog WRITES — only the registry-bootstrap Job's SA may
    # POST / PUT / PATCH / DELETE. A compromised devai-api pod cannot
    # publish fake agents / MCP servers.
    - from:
        - source:
            principals:
              - "cluster.local/ns/devai/sa/devai-registry-bootstrap"
      to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths: ["/v0/*"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/v0/health", "/healthz"]
            methods: ["GET"]
---
# --- agentgateway (solo.io xDS) — devai-api + kagent + probes ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentgateway-authz
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    # devai-api dials this for status probes (/api/agentic/status) and
    # — when the data plane lands — for MCP traffic.
    - from:
        - source:
            namespaces: ["devai"]
    # kagent reads from agentgateway when dispatching agents to its
    # MCP backends.
    - from:
        - source:
            namespaces: ["kagent-system"]
    # Metrics scrape from the monitoring stack on :9092.
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9092"]
    # Kubelet health probes.
    - to:
        - operation:
            paths: ["/healthz", "/metrics"]
            methods: ["GET"]
---
# --- ai-gateway (nginx LLM proxy) — devai-api + runners only ---
#
# ai-gateway holds the Anthropic / OpenAI API keys server-side. Any
# workload that reaches :8080 effectively gets a free LLM credit-card.
# Lock to devai workloads (the api and ephemeral runner Jobs both
# live in the devai namespace).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-authz
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["devai"]
      to:
        - operation:
            paths: ["/anthropic/*", "/openai/*", "/healthz"]
    # Probes
    - to:
        - operation:
            paths: ["/healthz"]
            methods: ["GET"]
---
##############################################################################
# DENY policies — explicit closures over the wide-open allow-mesh-internal
# baseline (`ALLOW: {}`) that the istio-auth-policies chart applies to every
# appNamespace. DENY takes precedence over ALLOW, so even if
# allow-mesh-internal would have let a workload through, a matching DENY
# rule overrides it.
##############################################################################

# Catalog WRITE protection — only devai-registry-bootstrap (and the bff
# for authenticated human edits) may mutate the catalog.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-deny-writes-from-non-bootstrap
  namespace: agentregistry-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/devai/sa/devai-registry-bootstrap"
              - "cluster.local/ns/devai/sa/devai-auth-bff"
      to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths: ["/v0/*"]
---
# ai-gateway DENY — close access from anything outside devai.
# allow-mesh-internal would let intra-cluster pods (including pods in
# agentgateway-system itself) hit /anthropic + /openai and burn our API
# budget. ai-gateway exists exclusively to serve devai workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-deny-non-devai
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: DENY
  rules:
    - from:
        - source:
            notNamespaces: ["devai", "kube-system", "istio-system", "monitoring"]
      to:
        - operation:
            paths: ["/anthropic/*", "/openai/*"]
