##############################################################################
# Agentic UIs — Istio AuthorizationPolicies
#
# kagent.tesserix.app and aregistry.tesserix.app traverse:
#
#   istio-ingressgateway → devai-auth-bff (devai NS) → kagent-ui / agentregistry
#
# The BFF is the only thing that can reach the upstream UIs; istio-ingress
# cannot bypass the BFF and hit them directly. devai-auth-bff already has
# its own AuthorizationPolicy in manifests/devai-istio that lets the
# gateway talk to it on port 8090.
##############################################################################

# --- kagent-ui — only devai-auth-bff (cross-namespace) + probes ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kagent-ui-authz
  namespace: kagent-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: ui
  action: ALLOW
  rules:
    # Authenticated traffic forwarded by devai-auth-bff
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
    # kagent-controller may read the UI for some internal metadata
    - from:
        - source:
            principals: ["cluster.local/ns/kagent-system/sa/kagent-controller"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/api/health", "/healthz", "/api/ready"]
            methods: ["GET"]
---
# --- agentregistry — devai-auth-bff (UI path) + catalog-API readers ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-authz
  namespace: agentregistry-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentregistry
  action: ALLOW
  rules:
    # UI traffic comes via devai-auth-bff
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
    # agentgateway data plane reads agent + skill catalog (machine API)
    - from:
        - source:
            namespaces: ["agentgateway-system"]
      to:
        - operation:
            paths: ["/v0/*"]
    # kagent controller reads Agent CRs from aregistry
    - from:
        - source:
            namespaces: ["kagent-system"]
      to:
        - operation:
            paths: ["/v0/*"]
    # devai pipeline writes registry seeds (bootstrap job)
    - from:
        - source:
            namespaces: ["devai"]
      to:
        - operation:
            paths: ["/v0/*"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/v0/health", "/healthz"]
            methods: ["GET"]
