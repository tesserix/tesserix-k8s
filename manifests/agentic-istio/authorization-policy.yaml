##############################################################################
# Agentic — Istio AuthorizationPolicies (ambient + waypoint)
#
# In Istio ambient mode, AuthorizationPolicies attach to one of two layers:
#
#   * ztunnel — per-node L4 proxy. Sees source / destination identities
#     but NOT HTTP attributes (methods, paths, headers). A policy without
#     targetRefs binds here by default.
#
#   * waypoint — per-namespace L7 proxy. Sees the full request and
#     enforces method / path rules. A policy binds here via:
#         spec.targetRefs:
#           - kind: Gateway
#             group: gateway.networking.k8s.io
#             name: waypoint
#
# Every policy below that uses HTTP attributes carries targetRefs so it
# enforces at the waypoint. Skipping targetRefs is the silent foot-gun
# that bit us once already: the policy looks correct in YAML, gets
# accepted by ztunnel with status "ZtunnelAccepted: HTTP attributes
# stripped", and ends up wide-open at L7.
#
# Registry browser traversal:
#   istio-ingressgateway → agentregistry-ui-oauth2-proxy → agentregistry
##############################################################################

# --- kagent (UI + controller, single policy on the waypoint) ---
#
# Istio ambient quirk: when a policy uses spec.targetRefs to attach to
# a Gateway (waypoint), it CANNOT also have spec.selector — the API
# rejects with "only one of targetRefs or selector can be set". So the
# old per-workload split (kagent-ui-authz vs kagent-controller-authz
# with different selectors) doesn't work here.
#
# Solution: a single policy bound to the waypoint, with rules that
# scope by ports (UI is :8080, controller is :8083) instead of by
# workload label. Same security envelope, fits the waypoint model.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kagent-authz
  namespace: kagent-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    # UI access — only via devai-auth-bff (which itself is gated by
    # GIP OAuth at the ingress). Port 8080 is the kagent-ui Service.
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
      to:
        - operation:
            ports: ["8080"]
    # controller access — devai-api probes /api/agentic/status and (in
    # future) posts A2A handoffs. Port 8083.
    - from:
        - source:
            namespaces: ["devai"]
      to:
        - operation:
            ports: ["8083"]
    # intra-namespace — kagent-controller reads its own UI, dispatches
    # to its sub-agents (cilium-manager, helm-agent, k8s-agent, etc.)
    # and the tools / kmcp-controller-manager. Open both ports.
    - from:
        - source:
            namespaces: ["kagent-system"]
    # Kubelet probes (no source identity — kubelet doesn't get SPIFFE)
    - to:
        - operation:
            paths: ["/healthz", "/livez", "/readyz", "/api/health", "/api/ready", "/version"]
            methods: ["GET"]
---
# --- agentregistry — Zitadel UI proxy + catalog-API readers ---
#
# READ vs WRITE split — GETs allowed from any agentic-stack consumer;
# POST / PUT / PATCH / DELETE locked to the bootstrap Job's SA. The
# write restriction is also reinforced by an explicit DENY further down
# because the cluster-wide allow-mesh-internal baseline would otherwise
# defeat this ALLOW-only rule.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-authz
  namespace: agentregistry-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    # Public browser traffic terminates only at the Zitadel session proxy.
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]
      to:
        - operation:
            ports: ["4180"]
    # The proxy forwards the verified Zitadel access token. Registry performs the
    # final email + project-role authorization for every mutation.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentregistry-system/sa/agentregistry-ui-oauth2-proxy"
      to:
        - operation:
            ports: ["12121"]
    # The dedicated mcp.tesserix.app Zitadel proxy may render the UI and read
    # its catalog. Registry mutations remain denied below.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/mcp-gateway-ui-oauth2-proxy"
      to:
        - operation:
            methods: ["GET"]
    # agentgateway.tesserix.app serves the Registry control-plane UI as its
    # default upstream. oauth2-proxy admits only the two approved emails and
    # forwards the verified Zitadel access token for Registry authorization.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-admin-ui-oauth2-proxy"
      to:
        - operation:
            methods: ["GET"]
        - operation:
            methods: ["PUT", "DELETE"]
            paths: ["/v0/agentgateway/*"]
    # The ownership handoff and steady-state reconciler can import once and
    # read the desired export. Its deploy key is independently verified by the
    # Registry; no other Registry mutation is admitted for this identity.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-route-sync"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v0/export/agentgateway"]
        - operation:
            methods: ["POST"]
            paths: ["/v0/agentgateway/import"]
    # The capability prober reads the catalog to learn which servers exist and
    # writes back only what it observed. Status is derived server-side from the
    # raw observation, so a compromised prober cannot assert readiness for a
    # server it never reached.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentic-probe"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v0/mcpservers", "/v0/mcpservers/*"]
        - operation:
            methods: ["PUT"]
            paths: ["/v0/mcpservers/*/status"]
    # Catalog READS — any agentic-stack consumer may GET /v0/* and /v0.1/*
    # (the v0.1 MCP-interop read surface mirrors v0).
    - from:
        - source:
            namespaces: ["agentgateway-system", "kagent-system", "devai", "kora"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v0/*", "/v0.1/*"]
    # Catalog WRITES — the registry-bootstrap Job's SA (seed reconcile)
    # and the devai-api SA (publish-on-author: when an operator composes
    # an agent / skill / tool / blueprint in the dashboard, devai-api
    # publishes it to the shared catalog). Both are mesh-identified SAs;
    # a workload outside this list cannot publish fake artifacts. Paths
    # cover the full write surface (/v0/*, /v0.1/*, /mcp) so the matching
    # DENY below can't strand a legitimate writer.
    - from:
        - source:
            principals:
              - "cluster.local/ns/devai/sa/devai-registry-bootstrap"
              - "cluster.local/ns/devai/sa/devai-api"
      to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths: ["/v0/*", "/v0.1/*", "/mcp", "/mcp/*"]
    # The public ingress may reach only POST /v0/apply. Application auth still
    # requires a tenant-scoped deploy key; anonymous identity is read-only.
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/istio-ingressgateway"
      to:
        - operation:
            methods: ["POST"]
            paths: ["/v0/apply"]
    # The DNS-only publisher gateway is independently authenticated with an
    # exact GitHub OIDC repository/ref before Registry deploy-key validation.
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/custom-ingressgateway"
      to:
        - operation:
            methods: ["POST"]
            paths: ["/v0/apply"]
    # Public health, signing key, and A2A Agent Cards are runtime discovery,
    # not human administration. Application visibility checks still apply.
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/istio-ingressgateway"
      to:
        - operation:
            methods: ["GET"]
            paths:
              - "/healthz"
              - "/v0/health"
              - "/v0/signing-key"
              - "/v0/auth/config"
              - "/v0/agents/{*}/card"
              - "/v0/agents/{*}/.well-known/agent-card.json"
              - "/v0/agents/{*}/{*}/card"
    # CLI bearer requests bypass browser SSO but remain subject to Registry's
    # issuer, audience, scope, role, tenant, namespace, and kind checks.
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/istio-ingressgateway"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v0/*"]
      when:
        - key: request.headers[authorization]
          values: ["Bearer *"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/v0/health", "/healthz"]
            methods: ["GET"]
---
# --- agentgateway (solo.io xDS) — devai-api + kagent + probes ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentgateway-authz
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    # DevAI and Kora workloads consume the internal MCP and shared A2A routes.
    - from:
        - source:
            namespaces: ["devai", "kora"]
      to:
        - operation:
            ports: ["8080"]
    # kagent reads from agentgateway when dispatching agents to its
    # MCP backends.
    - from:
        - source:
            namespaces: ["kagent-system"]
      to:
        - operation:
            ports: ["8080"]
    # The capability prober dials the same mesh data-plane port the platform's
    # own callers use, so it measures the path agents actually take.
    - from:
        - source:
            principals: ["cluster.local/ns/agentgateway-system/sa/agentic-probe"]
      to:
        - operation:
            ports: ["8080"]
    # Public MCP traffic is admitted only from the shared ingress. The data
    # plane then performs strict Zitadel JWT authentication and authorization.
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]
      to:
        - operation:
            ports: ["8081"]
    # Browser requests terminate at one of the isolated OAuth proxies.
    - from:
        - source:
            principals: ["cluster.local/ns/istio-ingress/sa/istio-ingressgateway"]
      to:
        - operation:
            ports: ["4180"]
    # The agentgateway DATA PLANE (Gateway "agentgateway-mcp", SA
    # agentgateway-mcp in this namespace) dials the controller's xDS on
    # :9978 for its routing config. Without this the waypoint returns
    # "RBAC: access denied" on every XDS pull (controller shows clients:0)
    # and the data-plane pod crashloops, so MCP traffic never flows.
    - from:
        - source:
            principals: ["cluster.local/ns/agentgateway-system/sa/agentgateway-mcp"]
      to:
        - operation:
            ports: ["9978"]
    # Metrics scrape from the monitoring stack on :9092.
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9092"]
    # Kubelet health probes.
    - to:
        - operation:
            paths: ["/healthz", "/metrics"]
            methods: ["GET"]
---
# --- native AgentGateway LLM data plane — DevAI API/worker/runners only ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-authz
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/devai/sa/devai-api"
              - "cluster.local/ns/devai/sa/devai-runner"
              - "cluster.local/ns/ai-agents/sa/sre-ai-agent"
      to:
        - operation:
            ports: ["8080"]
            paths:
              - "/anthropic/*"
              - "/openai/*"
              - "/vertex/*"
              - "/gemini/*"
              - "/groq/*"
              - "/openrouter/*"
              - "/nemoclaw/*"
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/istio-ingressgateway"
      to:
        - operation:
            ports: ["8081"]
            paths:
              - "/anthropic/*"
              - "/openai/*"
              - "/vertex/*"
              - "/gemini/*"
              - "/groq/*"
              - "/openrouter/*"
              - "/nemoclaw/*"
    # Solo's native admin server is private to its Zitadel session proxy.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-admin-ui-oauth2-proxy"
      to:
        - operation:
            ports: ["15000"]
    # Probes
    - to:
        - operation:
            paths: ["/healthz"]
            methods: ["GET"]
---
##############################################################################
# DENY policies — explicit closures over the wide-open allow-mesh-internal
# baseline (`ALLOW: {}`) that the istio-auth-policies chart applies to every
# appNamespace. DENY takes precedence over ALLOW, so even if
# allow-mesh-internal would have let a workload through, a matching DENY
# rule overrides it.
##############################################################################

# Catalog WRITE protection — only explicitly named workload identities may
# mutate their narrowly assigned surfaces. The extra identity-specific rules
# below close paths and methods that the cluster-wide allow-mesh-internal
# baseline would otherwise admit after the principal exception.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-deny-writes-from-non-bootstrap
  namespace: agentregistry-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: DENY
  rules:
    # /v0.1/* carries the same write surface as /v0/* (publish, status
    # PATCH, MCP interop). With the app at anonymous=admin, scoping the
    # DENY to only /v0/* left /v0.1/publish and PATCH /v0.1/.../status
    # reachable by any in-mesh workload (CHART-5). /mcp is included too so
    # an in-mesh caller can't drive mutating hub tools without going
    # through an allowed writer SA.
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/devai/sa/devai-registry-bootstrap"
              - "cluster.local/ns/devai/sa/devai-api"
              - "cluster.local/ns/agentregistry-system/sa/agentregistry-ui-oauth2-proxy"
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-admin-ui-oauth2-proxy"
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-route-sync"
              - "cluster.local/ns/agentgateway-system/sa/agentic-probe"
              - "cluster.local/ns/istio-ingress/sa/istio-ingressgateway"
              - "cluster.local/ns/istio-ingress/sa/custom-ingressgateway"
      to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths: ["/v0/*", "/v0.1/*", "/mcp", "/mcp/*"]
    # Human AgentGateway admins may write only the CRUD endpoints exposed by
    # the dedicated UI. POST/PATCH are not part of that contract.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-admin-ui-oauth2-proxy"
      to:
        - operation:
            methods: ["POST", "PATCH"]
            paths: ["/v0/*", "/v0.1/*", "/mcp", "/mcp/*"]
        - operation:
            methods: ["PUT", "DELETE"]
            notPaths: ["/v0/agentgateway/*"]
    # CI publishers enter through the public ingress and may only call the
    # deploy-key-authenticated, idempotent apply endpoint.
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/istio-ingressgateway"
      to:
        - operation:
            methods: ["PUT", "PATCH", "DELETE"]
        - operation:
            methods: ["POST"]
            notPaths: ["/v0/apply"]
    # The external publisher gateway has the same destination restriction as
    # the public ingress, enforced independently for policy auditability.
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-ingress/sa/custom-ingressgateway"
      to:
        - operation:
            methods: ["PUT", "PATCH", "DELETE"]
        - operation:
            methods: ["POST"]
            notPaths: ["/v0/apply"]
    # The prober's write surface is one path. Everything else it could reach
    # through the baseline exception above is closed here.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentic-probe"
      to:
        - operation:
            methods: ["PUT"]
            notPaths: ["/v0/mcpservers/*/status"]
        - operation:
            methods: ["POST", "PATCH", "DELETE"]
    # Route-sync may POST only the one-time/import reconciliation endpoint.
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentgateway-system/sa/agentgateway-route-sync"
      to:
        - operation:
            methods: ["PUT", "PATCH", "DELETE"]
        - operation:
            methods: ["POST"]
            notPaths: ["/v0/agentgateway/import"]
---
# ai-gateway DENY — close provider routes to the two DevAI identities and the
# standalone read-only SRE investigator.
# allow-mesh-internal would let intra-cluster pods (including pods in
# agentgateway-system itself) hit /anthropic + /openai and burn our API
# budget. ai-gateway exists exclusively to serve devai workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-deny-non-devai
  namespace: agentgateway-system
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/devai/sa/devai-api"
              - "cluster.local/ns/devai/sa/devai-runner"
              - "cluster.local/ns/ai-agents/sa/sre-ai-agent"
      to:
        - operation:
            ports: ["8080"]
            paths:
              - "/anthropic/*"
              - "/openai/*"
              - "/vertex/*"
              - "/gemini/*"
              - "/groq/*"
              - "/openrouter/*"
              - "/nemoclaw/*"
