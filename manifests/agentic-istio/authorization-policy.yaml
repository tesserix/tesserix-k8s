##############################################################################
# Agentic UIs — Istio AuthorizationPolicies
#
# kagent.tesserix.app and aregistry.tesserix.app traverse:
#
#   istio-ingressgateway → devai-auth-bff (devai NS) → kagent-ui / agentregistry
#
# The BFF is the only thing that can reach the upstream UIs; istio-ingress
# cannot bypass the BFF and hit them directly. devai-auth-bff already has
# its own AuthorizationPolicy in manifests/devai-istio that lets the
# gateway talk to it on port 8090.
##############################################################################

# --- kagent-ui — only devai-auth-bff (cross-namespace) + probes ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kagent-ui-authz
  namespace: kagent-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: ui
  action: ALLOW
  rules:
    # Authenticated traffic forwarded by devai-auth-bff
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
    # kagent-controller may read the UI for some internal metadata
    - from:
        - source:
            principals: ["cluster.local/ns/kagent-system/sa/kagent-controller"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/api/health", "/healthz", "/api/ready"]
            methods: ["GET"]
---
# --- agentregistry — devai-auth-bff (UI path) + catalog-API readers ---
#
# Split into READ vs WRITE rules. With the new waypoint proxy on
# agentregistry-system, L7 method/path matching is actually enforced —
# previously every rule below was silently L4-stripped down to source-
# namespace match by ztunnel, which meant any pod in devai could POST
# new agents to the catalog. Now POST is restricted to the bootstrap
# Job's SA explicitly.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-authz
  namespace: agentregistry-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentregistry
  action: ALLOW
  rules:
    # UI traffic comes via devai-auth-bff — full HTTP surface (the UI
    # is a Next.js app on the same host as /v0/*; the bff is the only
    # caller and is gated by GIP auth, so it gets the wide pass).
    - from:
        - source:
            principals: ["cluster.local/ns/devai/sa/devai-auth-bff"]
    # Catalog READS — any agentic-stack consumer can GET /v0/*.
    # Kept namespace-scoped (not principal-scoped) so per-MCP / per-Job
    # SAs do not each need an entry.
    - from:
        - source:
            namespaces: ["agentgateway-system", "kagent-system", "devai"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v0/*"]
    # Catalog WRITES — only the registry-bootstrap Job's SA may POST /
    # PUT / DELETE. The Job runs hourly and re-seeds from
    # architecture/registry-seeds/. Locking writes to exactly one
    # principal closes the catalog-pollution path: a compromised
    # devai-api pod can no longer publish fake agents / MCP servers.
    - from:
        - source:
            principals:
              - "cluster.local/ns/devai/sa/devai-registry-bootstrap"
      to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths: ["/v0/*"]
    # Kubelet probes
    - to:
        - operation:
            paths: ["/v0/health", "/healthz"]
            methods: ["GET"]
---
# --- agentgateway (solo.io xDS) — devai-api only + probes ---
#
# Today agentgateway is control-plane only (xDS on :9978). Once the
# data-plane Envoy is added, it will accept /mcp/<name> from devai
# runner pods on a separate port; that rule goes here too. For now we
# lock the controller down so a stray workload cannot enumerate the
# xDS config or scrape the metrics port without going through the
# expected callers.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentgateway-authz
  namespace: agentgateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  action: ALLOW
  rules:
    # devai-api dials this for status probes (/api/agentic/status) and
    # — when the data plane lands — for MCP traffic.
    - from:
        - source:
            namespaces: ["devai"]
    # kagent reads from agentgateway when dispatching agents to its
    # MCP backends.
    - from:
        - source:
            namespaces: ["kagent-system"]
    # Kubelet probes (health on :9093, metrics scrape on :9092 from
    # the monitoring stack).
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9092"]
    - to:
        - operation:
            paths: ["/healthz", "/metrics"]
            methods: ["GET"]
---
# --- ai-gateway (nginx LLM proxy) — devai-api + runners only ---
#
# ai-gateway holds the Anthropic / OpenAI API keys server-side; any
# workload that reaches :8080 effectively gets a free LLM credit-card.
# Lock to devai workloads (the api and ephemeral runner Jobs both
# live in the devai namespace).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-authz
  namespace: agentgateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["devai"]
      to:
        - operation:
            paths: ["/anthropic/*", "/openai/*", "/healthz"]
    # Probes
    - to:
        - operation:
            paths: ["/healthz"]
            methods: ["GET"]
---
##############################################################################
# DENY policies — explicit closures over the wide-open allow-mesh-internal
# baseline (`ALLOW: {}`) that the istio-auth-policies chart applies to every
# appNamespace. In Istio AuthZ, DENY takes precedence over ALLOW — so even if
# allow-mesh-internal would have let a workload through, a matching DENY rule
# overrides it. This is the minimal-invasive way to close real exposure
# without rewriting the mesh-internal baseline (which would affect every
# namespace on the cluster).
##############################################################################
#
# Catalog WRITE protection — only devai-registry-bootstrap may mutate the
# catalog. Without this, the only thing stopping a compromised pod in any
# of {devai, agentgateway-system, kagent-system} from POSTing fake agents is
# allow-mesh-internal's `ALLOW: {}` rule, which lets them right through.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agentregistry-deny-writes-from-non-bootstrap
  namespace: agentregistry-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentregistry
  action: DENY
  rules:
    - from:
        - source:
            # Anything NOT the bootstrap SA or the bff (which proxies
            # UI-driven writes from authenticated humans) …
            notPrincipals:
              - "cluster.local/ns/devai/sa/devai-registry-bootstrap"
              - "cluster.local/ns/devai/sa/devai-auth-bff"
      to:
        - operation:
            # …attempting to mutate the catalog…
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths: ["/v0/*"]
---
# ai-gateway DENY — close access from anything outside devai.
# allow-mesh-internal would let intra-cluster pods (including pods in
# agentgateway-system itself) hit /anthropic + /openai and burn our API
# budget. ai-gateway exists exclusively to serve devai workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ai-gateway-deny-non-devai
  namespace: agentgateway-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  action: DENY
  rules:
    - from:
        - source:
            notNamespaces: ["devai", "kube-system", "istio-system", "monitoring"]
      to:
        - operation:
            paths: ["/anthropic/*", "/openai/*"]
