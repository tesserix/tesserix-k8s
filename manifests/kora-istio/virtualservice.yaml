##############################################################################
# Kora — Istio VirtualService
#
# Single domain: kora-api.tesserix.app — API only, no separate web frontend
# chart (mobile app talks to this directly).
#
# kora-api runs in-cluster as a plain Deployment behind the ClusterIP Service
# `kora-api-direct` (see charts/apps/kora-api). We route to it DIRECTLY — no
# knative-local-gateway hop, no Host header rewrite — mirroring homechef-api.
# Knative was removed because its ingress (knative-local-gateway + activator)
# does not compose with this cluster's Istio ambient mesh (ztunnel + waypoint).
#
# DNS: this VirtualService has NO `external-dns.alpha.kubernetes.io/target`
# annotation. external-dns will fall back to its --default-targets value,
# which on this cluster points at the shared (mark8ly) Cloudflare Tunnel —
# correct for any *.tesserix.app subdomain. Do not add a target annotation
# unless a dedicated tunnel has been provisioned.
##############################################################################
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kora-api
  namespace: kora
  labels:
    app.kubernetes.io/part-of: kora
    app.kubernetes.io/component: networking
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  gateways:
    - istio-ingress/tesseract-gateway
  hosts:
    - kora-api.tesserix.app
  http:
    - match:
        - uri:
            prefix: /
      headers:
        request:
          set:
            x-forwarded-host: kora-api.tesserix.app
            x-forwarded-proto: https
      route:
        - destination:
            host: kora-api-direct.kora.svc.cluster.local
            port:
              number: 8080
      # LLM round-trips (Gemini embeddings + OpenAI-compatible parse) can
      # chain, so hold a generous request timeout. The plain Deployment has
      # no request-timeout of its own; this bound replaces the former Knative
      # timeoutSeconds: 600.
      timeout: 600s
      retries:
        attempts: 3
        perTryTimeout: 30s
        retryOn: gateway-error,connect-failure,refused-stream
      corsPolicy:
        allowOrigins:
          - exact: "https://kora-api.tesserix.app"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowHeaders:
          - content-type
          - authorization
          - accept
          - x-request-id
        allowCredentials: true
        maxAge: "86400s"
