# GCP Secret Manager → Kubernetes secrets for the `social` namespace (devtest).
#
# Every key referenced by `remoteRef.key` is provisioned in step 9 of
# docs/setup/gip.md (dev-social-* family in project tesseracthub-480811).
# Until those secrets exist in SM, ESO retries every 1h — Deployments
# referencing the targets stay in CrashLoop.
---
# GHCR pull secret. Mirrors the pattern used by every other tesserix product.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# Google Identity Platform — Web API key + OAuth client credentials.
# Read by social-auth-bff (deployment.yaml: GIP_WEB_API_KEY,
# OAUTH_CLIENT_SECRET).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-gip
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-gip
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: dev-social-gip-web-api-key
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: dev-social-oauth-client-secret
---
# Session cookie encryption key — 32-byte hex (openssl rand -hex 32).
# Read by social-auth-bff (deployment.yaml: SESSION_SECRET).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-session
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: dev-social-session-secret
---
# Service-to-service JWT secret — auth-bff mints, platform-api verifies.
# Both services reference this same K8s Secret name.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-internal-jwt
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-internal-jwt
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: dev-social-internal-jwt-secret
---
# LLM provider API keys for reports-agent. All three keys land in one
# Secret; reports-agent reads whichever the LLM_PROVIDER env points at.
# `optional: true` on the deployment side means the agent boots even
# if a key is missing (relevant for one-provider deploys).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-llm
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-llm
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: dev-social-anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: dev-social-openai-api-key
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: dev-social-openrouter-api-key
---
# CloudNativePG bootstrap password for the `platform_api` role. CNPG
# expects basic-auth shape (username/password keys).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-postgres-platform-api
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-postgres-platform-api
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: dev-social-platform-api-db-password
---
# CloudNativePG bootstrap password for the `auth_bff` role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-postgres-auth-bff
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-postgres-auth-bff
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "auth_bff"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: dev-social-auth-bff-db-password
