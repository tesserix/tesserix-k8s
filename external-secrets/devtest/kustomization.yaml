apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DevTest External Secrets - Creates secrets from GCP Secret Manager
resources:
  - cert-manager
  - db-backup-and-restore
  - email
  - tesserix
  - external-dns
  - growthbook
  - identity
  - identity-customer
  - identity-internal
  - postgresql-bookkeeping
  - postgresql-fanzone
  - postgresql-global
  - postgresql-homechef
  - translation
  - typesense
  - yes-hospital
