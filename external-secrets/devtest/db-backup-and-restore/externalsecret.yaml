# External Secrets for db-backup-and-restore namespace
# Syncs PostgreSQL passwords and GHCR credentials from GCP Secret Manager
---
# GHCR Pull Secret for db-backup-tools image
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: db-backup-and-restore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: devtest-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: devtest-ghcr-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-global-password
  namespace: db-backup-and-restore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-global-password
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: devtest-global-postgresql-password
