apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-password
  namespace: postgresql-bookkeeping
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-password
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: devtest-bookkeeping-postgresql-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-ssl-certs
  namespace: postgresql-bookkeeping
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-ssl-certs
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: devtest-postgresql-bookkeeping-ca-cert
    - secretKey: server.crt
      remoteRef:
        key: devtest-postgresql-bookkeeping-server-cert
    - secretKey: server.key
      remoteRef:
        key: devtest-postgresql-bookkeeping-server-key
