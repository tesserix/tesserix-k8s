apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-credentials
  namespace: email
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mysql-credentials
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: devtest-global-postgresql-password
    - secretKey: mautic-password
      remoteRef:
        key: devtest-mautic-api-password
    - secretKey: postal-password
      remoteRef:
        key: devtest-postal-api-key
---
