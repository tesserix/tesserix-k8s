apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-production-reader
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-clickhouse-production
  namespace: observability
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-clickhouse-observability-production
          serviceAccountRef:
            name: clickhouse-production-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-production-reader
  namespace: tesserix
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-clickhouse-production
  namespace: tesserix
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-clickhouse-tesserix-production
          serviceAccountRef:
            name: clickhouse-production-reader
