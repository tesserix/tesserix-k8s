apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-qdrant
  namespace: devai
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-qdrant-devai
          serviceAccountRef:
            name: devai-production-reader
