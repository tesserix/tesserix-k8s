---
# GitHub OAuth credentials for ArgoCD's bundled Dex server.
# The same GitHub App (Tesserix Platform SSO) is shared with Kargo —
# kept under product-specific GCP Secret Manager keys so either side
# can be swapped to a different App without disturbing the other.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-github-oauth
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-github-oauth
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # REQUIRED: Argo CD only loads a secret for `$argocd-github-oauth:key`
          # substitution in the Dex config (SSO) if it carries this label.
          # Without it, Dex sends an empty client_secret and GitHub returns
          # incorrect_client_credentials -> "Login failed".
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-id
      remoteRef:
        key: prod-argocd-github-client-id
    - secretKey: client-secret
      remoteRef:
        key: prod-argocd-github-client-secret
---
# ArgoCD repository credential for tesserix/kargo-manifests (private).
# Mirrors the existing manually-created tesserix-new-k8s-repo Secret
# format. Username is the bot/PAT user; password is the GitHub PAT
# from `prod-ghcr-token` (already has `repo` scope).
#
# `argocd.argoproj.io/secret-type=repository` tells the argocd-server
# pod to register this as a Git repository credential rather than a
# normal Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-kargo-manifests-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-kargo-manifests-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/tesserix/kargo-manifests.git
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
---
# ArgoCD repository credential for tesserix/tesserix-governance (private).
# Same PAT as kargo-manifests; TIG claims/policies are synced from this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-governance-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-governance-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/tesserix/tesserix-governance.git
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
