---
# GitHub OAuth credentials for ArgoCD's bundled Dex server.
# The same GitHub App (Tesserix Platform SSO) is shared with Kargo —
# kept under product-specific GCP Secret Manager keys so either side
# can be swapped to a different App without disturbing the other.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-github-oauth
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-github-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: prod-argocd-github-client-id
    - secretKey: client-secret
      remoteRef:
        key: prod-argocd-github-client-secret
