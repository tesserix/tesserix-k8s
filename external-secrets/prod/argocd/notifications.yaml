# Slack bot token for argocd-notifications-controller. ESO syncs the
# `prod-argocd-notifications-slack-token` GCP SM entry into the
# argocd-notifications-secret K8s Secret with key `slack-token`, which
# the helm-managed argocd-notifications-cm references via $slack-token.
#
# Used by the mark8ly-uat-smoke-failed trigger to post into the Slack
# channel `#mark8ly-smoke-test-verification` whenever the e2e Job
# Argo CD App goes Degraded after the Job hits backoffLimit.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-slack-token
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        slack-token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: prod-argocd-notifications-slack-token
