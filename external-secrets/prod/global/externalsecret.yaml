# Identity-platform secrets for the GIP admin-claims sync CronJob.
# Lives in the `global` namespace because the job manages tenant-wide
# state (the GIP Internal tenant), not anything product-specific.
#
# The Firebase Admin SDK auth piece used to live here as
# `gip-firebase-sa` (a static SA JSON). It is no longer needed — the
# CronJob now authenticates via Workload Identity (KSA gip-admin-claims
# → GSA app-secrets-marketplace-prod, which holds firebaseauth.admin +
# identitytoolkit.admin). Keeping zero long-lived SA keys in cluster.

---
# Comma-separated admin email allow-list. Editing the GCP secret value
# propagates here within ESO's refresh interval and the next CronJob
# firing applies it. Membership change = one secret rotate, no chart
# edit needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gip-admin-emails
  namespace: global
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: gip-admin-emails
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_EMAILS
      remoteRef:
        key: prod-platform-admin-emails
---
# CloudNativePG password for the `kora` role (Kora product's database on
# the shared global-postgres cluster — see charts/apps/global-postgres
# managedRoles + docs/postgres-cluster-policy.md). This password MUST
# match whatever the human embeds in the prod-kora-database-url secret
# kora-api reads DATABASE_URL from (not enforced by GitOps).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: global-postgres-kora
  namespace: global
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: global-postgres-kora
    creationPolicy: Owner
    # CNPG managed.roles expects basic-auth shape (username/password).
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "kora"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-kora-postgresql-password
---
# CloudNativePG password for the `planning_poker` role. The planning-poker
# chart reads the SAME GCP key into its own namespace and assembles
# DATABASE_URL from it, so both ends move together on a rotation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: global-postgres-planning-poker
  namespace: global
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: global-postgres-planning-poker
    creationPolicy: Owner
    # CNPG managed.roles expects basic-auth shape (username/password).
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "planning_poker"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-planning-poker-postgresql-password
