# Identity-platform secrets for the GIP admin-claims sync CronJob.
# Lives in the `global` namespace because the job manages tenant-wide
# state (the GIP Internal tenant), not anything product-specific.

---
# Firebase Admin SDK service-account JSON. Same secret the rest of the
# auth-bff fleet uses for token verification; here we use the management
# capability (set custom claims on users).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gip-firebase-sa
  namespace: global
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: gip-firebase-sa
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_ACCOUNT_JSON
      remoteRef:
        key: prod-firebase-sa-key
---
# Comma-separated admin email allow-list. Editing the GCP secret value
# propagates here within ESO's refresh interval and the next CronJob
# firing applies it. Membership change = one secret rotate, no chart
# edit needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gip-admin-emails
  namespace: global
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: gip-admin-emails
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_EMAILS
      remoteRef:
        key: prod-platform-admin-emails
