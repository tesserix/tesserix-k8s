    # CNPG managed.roles expects basic-auth shape (username/password).
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "onboarding"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-onboarding-postgresql-password

