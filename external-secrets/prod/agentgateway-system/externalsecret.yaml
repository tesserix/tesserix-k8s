apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    # Same JWT signing key as agentregistry — they must match so signed
    # tokens minted by aregistry validate at the gateway boundary.
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
