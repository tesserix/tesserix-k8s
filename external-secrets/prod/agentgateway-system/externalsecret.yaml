apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    # Same JWT signing key as agentregistry — they must match so signed
    # tokens minted by aregistry validate at the gateway boundary.
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-mcp-upstream
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-mcp-upstream
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: prod-devai-mcp-hub-service-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: product-mcp-upstream-keys
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: product-mcp-upstream-keys
    creationPolicy: Owner
  data:
    - secretKey: HOMECHEF_MCP_KEY
      remoteRef:
        key: prod-support-platform-homechef-mcp-key
    - secretKey: MARK8LY_MCP_KEY
      remoteRef:
        key: prod-support-platform-mark8ly-mcp-key
    - secretKey: PLATFORM_MCP_KEY
      remoteRef:
        key: prod-support-platform-platform-mcp-key
    - secretKey: STOCKPILOT_MCP_KEY
      remoteRef:
        key: prod-support-platform-stockpilot-mcp-key
    - secretKey: KORA_MCP_KEY
      remoteRef:
        key: prod-support-platform-kora-mcp-key
