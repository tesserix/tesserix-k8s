apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    # Same JWT signing key as agentregistry — they must match so signed
    # tokens minted by aregistry validate at the gateway boundary.
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-mcp-upstream
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-mcp-upstream
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: devai/app/devai-mcp-hub-service-token
        property: value
      sourceRef:
        storeRef: {name: openbao-devai-production, kind: SecretStore}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: product-mcp-upstream-keys
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: product-mcp-upstream-keys
    creationPolicy: Owner
  data:
    - secretKey: HOMECHEF_MCP_KEY
      sourceRef:
        storeRef:
          kind: SecretStore
          name: openbao-fe3dr-shared
      remoteRef:
        key: homechef/homechef-api/fe3dr-mcp-key
        property: value
    - secretKey: MARK8LY_MCP_KEY
      sourceRef:
        storeRef:
          name: openbao-mark8ly-production
          kind: SecretStore
      remoteRef:
        key: mark8ly/app/mark8ly-mcp-key
        property: value
    - secretKey: PLATFORM_MCP_KEY
      remoteRef:
        key: prod-support-platform-platform-mcp-key
    - secretKey: STOCKPILOT_MCP_KEY
      remoteRef:
        key: prod-support-platform-stockpilot-mcp-key
    - secretKey: KORA_MCP_KEY
      remoteRef:
        key: kora/app/kora-mcp-key
        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-production
          kind: SecretStore
    - secretKey: ROAMIE_TRAVEL_MCP_KEY
      sourceRef:
        storeRef:
          name: openbao-roamie-production
          kind: SecretStore
      remoteRef:
        key: roamie/app/roamie-travel-mcp-key
        property: value
