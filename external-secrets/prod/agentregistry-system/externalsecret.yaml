apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: agentregistry-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    # Both keys come from the same GCP SM secret. The upstream
    # agentregistry chart expects AGENT_REGISTRY_JWT_PRIVATE_KEY;
    # agentgateway + kagent read jwt-secret from the mirrored secret.
    - secretKey: AGENT_REGISTRY_JWT_PRIVATE_KEY
      remoteRef:
        key: prod-aregistry-jwt-secret
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
---
# CNPG bootstrap credentials for the aregistry-pg cluster. CNPG accepts
# a basic-auth Secret with `username` + `password`; the postgres-password
# is reused from the devai-postgres pattern, but stored under its own
# GCP SM key so a rotation in one doesn't cascade into the other.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-pg-credentials
  namespace: agentregistry-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-pg-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: agentregistry
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-aregistry-pg-password
---
# Credentials for oauth2-proxy-aregistry (in front of aregistry.tesserix.app).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-oauth2-proxy
  namespace: agentregistry-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: prod-aregistry-oauth2-client-id
    - secretKey: client-secret
      remoteRef:
        key: prod-keycloak-aregistry-oauth2-proxy-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: prod-aregistry-oauth2-cookie-secret
