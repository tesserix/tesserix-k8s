# scrapper namespace — the scrapper PRODUCT is decommissioned, but Temporal
# still runs here and pulls private images, so this namespace keeps its
# registry credentials. Everything else that lived here is gone.
#
# Removed with the product: postgresql-scrapper-password, scrapper-auth-secrets, scrapper-web-secrets, scrapper-mcp-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username
          .ghcr_token | b64enc }}"}}}'
  data:
  - secretKey: ghcr_username
    remoteRef:
      key: prod-ghcr-username
  - secretKey: ghcr_token
    remoteRef:
      key: prod-ghcr-token
