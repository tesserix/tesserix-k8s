# GHCR image pull secret for scrapper namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# PostgreSQL password for scrapper app services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-scrapper-password
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-scrapper-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-scrapper-postgresql-password
---
# Redis password for scrapper app services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-scrapper-password
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-scrapper-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-scrapper-redis-password
