---
# Keycloak + NextAuth secrets for scrapper web frontend
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scrapper-auth-secrets
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: scrapper-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: prod-scrapper-keycloak-client-secret
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: prod-scrapper-nextauth-secret
---
# Polotno design canvas license — read by scrapper-web at build/runtime.
# Same underlying GCP SM secret as postsocial uses (prod-postsocial-polotno-key)
# so a single update lights up both sides.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scrapper-web-secrets
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: scrapper-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: POLOTNO_KEY
      remoteRef:
        key: prod-postsocial-polotno-key
---
# MCP server bearer token for the scrapper-mcp deployment.
# Provision the GCP SM secret named `prod-scrapper-mcp-api-key` with a long random
# value before this ExternalSecret can sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scrapper-mcp-secrets
  namespace: scrapper
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: scrapper-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: MCP_API_KEY
      remoteRef:
        key: prod-scrapper-mcp-api-key
