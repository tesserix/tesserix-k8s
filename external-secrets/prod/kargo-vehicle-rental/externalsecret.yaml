---
# GHCR image-read credentials for the vehicle-rental Kargo Project.
# Same PAT as fanzone, but scoped to vehicle-rental-* image repos under
# ghcr.io/tesserix/.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-image-creds
  namespace: kargo-vehicle-rental
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-image-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: '^ghcr\.io/tesserix/vehicle-rental-.*'
        repoURLIsRegex: "true"
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
