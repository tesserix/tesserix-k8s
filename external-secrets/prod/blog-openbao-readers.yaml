apiVersion: v1
kind: ServiceAccount
metadata:
  name: blog-production-reader
  namespace: tesserix
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-blog-production
  namespace: tesserix
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-blog-tesserix-production
          serviceAccountRef:
            name: blog-production-reader
---
