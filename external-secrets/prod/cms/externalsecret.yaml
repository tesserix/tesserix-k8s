# Runtime config for tesserix-cms (charts/apps/tesserix-cms), from OpenBao via
# the namespace-bound reader in external-secrets/prod/tesserix-cms-openbao-readers.yaml.
#
# DATABASE_URL is assembled from the `cms` role password rather than stored
# whole, so the URL and the CNPG role (external-secrets/prod/global/
# externalsecret.yaml, global-postgres-cms) can never disagree.
# uselibpqcompat: node-postgres otherwise reads sslmode=require as verify-full,
# which fails against CNPG's self-signed CA.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-cms
  namespace: cms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tesserix-cms-production
    kind: SecretStore
  target:
    name: tesserix-cms
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: >-
          postgres://cms:{{ .dbPassword | urlquery }}@global-postgres-rw.global.svc.cluster.local:5432/cms_db?uselibpqcompat=true&sslmode=require
        PAYLOAD_SECRET: "{{ .payloadSecret }}"
        RESEND_API_KEY: "{{ .resendApiKey }}"
        # Shared with the YES Hospital site's revalidate endpoint; read only by
        # the one-off seed Job (SEED_WEBHOOK_SECRET), never by the server.
        YES_HOSPITAL_WEBHOOK_SECRET: "{{ .yesHospitalWebhookSecret }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: tesserix-cms/app/tesserix-cms-db-password
        property: value
    - secretKey: payloadSecret
      remoteRef:
        key: tesserix-cms/app/tesserix-cms-payload-secret
        property: value
    - secretKey: resendApiKey
      remoteRef:
        key: tesserix-cms/app/tesserix-cms-resend-api-key
        property: value
    - secretKey: yesHospitalWebhookSecret
      remoteRef:
        key: tesserix-cms/app/tesserix-cms-yes-hospital-webhook-secret
        property: value
