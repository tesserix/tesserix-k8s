apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DevTest External Secrets - Creates secrets from GCP Secret Manager
resources:
  - cert-manager
  - email
  - tesserix
  - external-dns
  - fanzone
  - homechef
  - growthbook
  - identity
  - identity-customer
  - identity-internal
  # postgresql-* external secrets removed — CNPG clusters use their own
  # ExternalSecrets in the app namespace (via {product}-postgres chart)
  - typesense
  - logging
  - openpanel
  - db-backup-and-restore
  - scrapper
  - stockpilot
  - redis-scrapper
  - redis-stockpilot

  # tesserix-social — uncomment once prod-social-* secrets are provisioned
  # in GCP Secret Manager (see docs/setup/gip.md in the tesserix-social
  # repo). Until then, ESO would just retry-loop on missing remote keys.
  # - social
