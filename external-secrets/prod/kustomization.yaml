apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DevTest External Secrets - Creates secrets from GCP Secret Manager
resources:
  - cert-manager
  # email/ (Postal mail stack) was purged in 83096ec4 but this reference was
  # left dangling, breaking `kustomize build external-secrets/prod` — masked
  # until now by a stale ArgoCD manifest cache. Removed to restore the build.
  - tesserix
  - external-dns
  # fanzone — decommissioned 2026-07-23, namespace gone, so all eight of its
  # ExternalSecrets sat Missing. Directory stays as a recovery manifest, same
  # pattern as `social` and `kargo-fanzone` below.
  # - fanzone
  - yes-hospital
  - homechef
  - growthbook
  # postgresql-* external secrets removed — CNPG clusters use their own
  # ExternalSecrets in the app namespace (via {product}-postgres chart)
  - typesense
  - logging
  # observability — clickhouse-otel password for the OTel pipeline
  # (clickhouse-otel-secrets in the observability ns).
  - observability
  - openpanel
  - db-backup-and-restore
  - stockpilot

  # falco — Slack incoming-webhook URL for falcosidekick runtime alerts
  - falco

  # devai — ALM + SRE platform. The devai-postgres chart ships its
  # own basic-auth ExternalSecret (devai-postgres-app-credentials);
  # this directory adds the rest (postgresql-devai-password,
  # devai-api-secrets, ghcr-secret).
  - devai

  # tesserix-social — decommissioned per CLAUDE.md "Decommissioned
  # Products" list (its prod-social-* GCP SM secrets were purged for
  # cost). The directory stays in tree as a recovery manifest, but the
  # ExternalSecret can't apply when the `social` namespace doesn't
  # exist — re-enable when the product is rebuilt.
  # - social

  # support-platform — shared SLM support platform (Otto, slm-router,
  # inference, RAG) serving mark8ly + fanzone + homechef tenants.
  - support-platform

  # global — GIP admin-claims sync (Firebase SA + admin allow-list).
  # Lives in the `global` namespace because it manages tenant-wide
  # state rather than anything product-specific.
  - global

  # Kargo — GitHub OAuth + API token signing key
  - kargo

  # ArgoCD — GitHub OAuth (shared GitHub App with Kargo)
  - argocd

  # monitoring — Grafana GitHub OAuth (reuses the shared Tesserix Platform
  # SSO GitHub App, same as ArgoCD/Kargo) for grafana.tesserix.app login.
  - monitoring

  # Per-Kargo-Project image-read credentials for GHCR. Each lives in
  # the kargo-<project> namespace and is consumed by the Warehouse.
  #
  # fanzone / scrapper / stockpilot / gameverse are scaled down (kept for a
  # future go/no-go decision); their kargo-<project> namespaces no longer
  # exist, so these ExternalSecrets can't apply and were failing the whole
  # external-secrets-resources sync. Commented out (directories stay in tree
  # as recovery manifests — re-enable when a product is brought back), same
  # pattern as `- social` above.
  # - kargo-fanzone
  - kargo-mark8ly
  - kargo-homechef
  # devai — git read creds for the `services` Warehouse's tesserix/devai
  # `deploy`-branch subscription. Was missing, so the Warehouse could only
  # clone while the repo was public; deploys stalled when it went private.
  - kargo-devai
  # kora — same missing credential as devai above: the Warehouse stalled on
  # `could not read Username` as soon as CI returned the repo to private.
  - kargo-kora
  - kargo-tesserix-blog
  - kargo-planning-poker
  #  # - kargo-stockpilot
  # - kargo-gameverse
  - kargo-infra
  - kargo-support-platform
  - kargo-zitadel-operator
  - kargo-analytics-onboarding

  # Agentic control planes — aregistry-jwt mirrored into all three
  # namespaces so agentgateway and kagent can authenticate against
  # the aregistry catalog.
  - agentregistry-system
  - agentgateway-system
  - kagent-system
  # Retains only ghcr-secret, for the Temporal workload still in this ns.
  - scrapper
