apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DevTest External Secrets - Creates secrets from GCP Secret Manager
resources:
  - cert-manager
  - email
  - tesserix
  - external-dns
  - fanzone
  - homechef
  - mark8ly-uat
  - growthbook
  - identity
  - identity-customer
  - identity-internal
  # postgresql-* external secrets removed — CNPG clusters use their own
  # ExternalSecrets in the app namespace (via {product}-postgres chart)
  - typesense
  - logging
  - openpanel
  - db-backup-and-restore
  - scrapper
  - stockpilot
  - redis-scrapper
  - redis-stockpilot

  # tesserix-social — AI-powered social media scheduler & analytics.
  - social

  # support-platform — shared SLM support platform (Otto, slm-router,
  # inference, RAG) serving mark8ly + fanzone + homechef tenants.
  - support-platform

  # Kargo — GitHub OAuth + API token signing key
  - kargo

  # ArgoCD — GitHub OAuth (shared GitHub App with Kargo)
  - argocd

  # Per-Kargo-Project image-read credentials for GHCR. Each lives in
  # the kargo-<project> namespace and is consumed by the Warehouse.
  - kargo-fanzone
  - kargo-mark8ly
  - kargo-homechef
  - kargo-tesserix-blog
  - kargo-scrapper
  - kargo-stockpilot
  - kargo-gameverse
  - kargo-support-platform
