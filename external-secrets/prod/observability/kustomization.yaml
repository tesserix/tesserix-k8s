apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # clickhouse-otel-secrets removed 2026-07-26 with the single-node
  # ClickHouse it authenticated. The replicated cluster uses
  # clickhouse-secrets below.
  # Replicated ClickHouse (clickhouse-ha chart) + obs-api's read-only user.
  - clickhouse-secrets.yaml
  # obs-api session key + its dedicated Google OAuth client.
  # NOTE: the two google-client GCP secrets are a manual prerequisite --
  # see docs/observability-oauth-setup.md.
  - obs-api-secrets.yaml
  - langfuse-secrets.yaml
  # Registry credentials for the private obs-api / obs-ui images.
  - ghcr-secret.yaml
