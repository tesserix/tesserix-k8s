apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-secrets
  namespace: observability
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-clickhouse-production
    kind: SecretStore
  target:
    name: clickhouse-secrets
    creationPolicy: Owner
  data:
    # The `default` user. Read by three components that must all agree:
    #   - the clickhouse-ha StatefulSet (entrypoint applies it on first boot)
    #   - cluster.xml, so replicas authenticate to each other
    #   - the otel-ingest clickhouseexporter
    # All consumers share the same reviewed OpenBao value.
    - secretKey: clickhouse-password
      remoteRef:
        key: clickhouse/app/clickhouse-otel-password
        property: value
    # Read-only user for obs-api. Created by the bootstrap SQL, not by the
    # chart, because a password cannot be hashed at Helm template time.
    - secretKey: observer-password
      remoteRef:
        key: clickhouse/app/clickhouse-observer-password
        property: value
    # Incident writer for obs-api's SRE audit trail. A separate identity from
    # observer, whose readonly profile forbids INSERT outright -- that profile
    # is what guarantees obs-api cannot alter telemetry, so it is preserved
    # rather than relaxed. sre_writer has no access to `otel` at all.
    - secretKey: sre-writer-password
      remoteRef:
        key: clickhouse/app/clickhouse-sre-writer-password
        property: value
