apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: obs-api-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: obs-api-secrets
    creationPolicy: Owner
  data:
    # HMAC key signing session cookies. obs-api refuses to start if this is
    # under 32 bytes, because a short key makes the signature brute-forceable
    # and anyone could then mint a session for an allowlisted address.
    # Rotating this value signs everyone out, which is the intended lever --
    # sessions are stateless and cannot be revoked individually.
    - secretKey: session-secret
      remoteRef:
        key: prod-obs-api-session-secret

    # Dedicated Google OAuth client, NOT the shared prod-google-client-*.
    # A dedicated client keeps the redirect URI list scoped to this app, so
    # adding observability.tesserix.app cannot affect anything else.
    #
    # MANUAL PREREQUISITE: these two GCP secrets must be created and populated
    # before this ExternalSecret can sync. See
    # docs/observability-oauth-setup.md.
    - secretKey: google-client-id
      remoteRef:
        key: prod-obs-api-google-client-id
    - secretKey: google-client-secret
      remoteRef:
        key: prod-obs-api-google-client-secret
