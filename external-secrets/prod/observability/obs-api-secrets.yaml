apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: obs-api-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: obs-api-secrets
    creationPolicy: Owner
  data:
    # HMAC key signing session cookies. obs-api refuses to start if this is
    # under 32 bytes, because a short key makes the signature brute-forceable
    # and anyone could then mint a session for an allowlisted address.
    # Rotating this value signs everyone out, which is the intended lever --
    # sessions are stateless and cannot be revoked individually.
    - secretKey: session-secret
      remoteRef:
        key: prod-obs-api-session-secret

    # Dedicated Google OAuth client, NOT the shared prod-google-client-*.
    # A dedicated client keeps the redirect URI list scoped to this app, so
    # adding observability.tesserix.app cannot affect anything else.
    #
    # MANUAL PREREQUISITE: these two GCP secrets must be created and populated
    # before this ExternalSecret can sync. See
    # docs/observability-oauth-setup.md.
    - secretKey: google-client-id
      remoteRef:
        key: prod-obs-api-google-client-id
    - secretKey: google-client-secret
      remoteRef:
        key: prod-obs-api-google-client-secret

    # GitHub App credentials for trace-to-code, which walks a log record back
    # to the commit that produced it.
    #
    # A dedicated App (tesserix-obs-traceability), NOT the ghcr-retention-
    # cleaner: that one holds packages:write, which on GHCR includes delete.
    # Handing an internet-facing API the ability to delete every image in the
    # registry to satisfy a read-only feature is not a trade worth making.
    # This App has exactly contents:read, pull_requests:read and metadata:read.
    #
    # The private key is mounted as a FILE rather than an env var: a multi-line
    # PEM through the environment is a dependable source of mangled-newline
    # bugs that surface as an unparseable key at startup.
    - secretKey: github-app-id
      remoteRef:
        key: prod-obs-github-app-id
    - secretKey: github-installation-id
      remoteRef:
        key: prod-obs-github-app-installation-id
    - secretKey: github-app-key.pem
      remoteRef:
        key: prod-obs-github-app-private-key
