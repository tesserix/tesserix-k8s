apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-otel-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: clickhouse-otel-secrets
    creationPolicy: Owner
  data:
    # Password for the dedicated OTel ClickHouse (clickhouse-otel chart).
    # Read by BOTH the ClickHouse StatefulSet (auth.existingSecret /
    # auth.secretKey = clickhouse-otel-secrets / clickhouse-password) and the
    # otel-collector's clickhouse exporter (CLICKHOUSE_PASSWORD), so they
    # share one source of truth. Backed by GCP SM prod-clickhouse-otel-password.
    - secretKey: clickhouse-password
      remoteRef:
        key: prod-clickhouse-otel-password
