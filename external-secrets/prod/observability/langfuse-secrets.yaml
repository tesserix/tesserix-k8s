apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: langfuse-secrets, namespace: observability}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: gcp-secret-store, kind: ClusterSecretStore}
  target: {name: langfuse-secrets, creationPolicy: Owner}
  data:
    - {secretKey: postgres-password, remoteRef: {key: prod-langfuse-postgresql-password}}
    - {secretKey: clickhouse-password, remoteRef: {key: prod-clickhouse-otel-password}}
    - {secretKey: salt, remoteRef: {key: prod-langfuse-salt}}
    - {secretKey: encryption-key, remoteRef: {key: prod-langfuse-encryption-key}}
    - {secretKey: nextauth-secret, remoteRef: {key: prod-langfuse-nextauth-secret}}
    - {secretKey: google-client-id, remoteRef: {key: prod-langfuse-google-client-id}}
    - {secretKey: google-client-secret, remoteRef: {key: prod-langfuse-google-client-secret}}
    - {secretKey: project-public-key, remoteRef: {key: prod-devai-langfuse-public-key}}
    - {secretKey: project-secret-key, remoteRef: {key: prod-devai-langfuse-secret-key}}
    - {secretKey: init-user-password, remoteRef: {key: prod-langfuse-init-user-password}}
