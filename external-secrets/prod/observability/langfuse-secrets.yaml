apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: langfuse-secrets, namespace: observability}
spec:
  refreshInterval: 5m
  secretStoreRef: {name: openbao-langfuse-production, kind: SecretStore}
  target: {name: langfuse-secrets, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - {secretKey: postgres-password, remoteRef: {key: langfuse/app/langfuse-postgresql-password, property: value}}
    - {secretKey: clickhouse-password, remoteRef: {key: clickhouse/app/clickhouse-otel-password, property: value}, sourceRef: {storeRef: {name: openbao-clickhouse-production, kind: SecretStore}}}
    - {secretKey: salt, remoteRef: {key: langfuse/app/langfuse-salt, property: value}}
    - {secretKey: encryption-key, remoteRef: {key: langfuse/app/langfuse-encryption-key, property: value}}
    - {secretKey: nextauth-secret, remoteRef: {key: langfuse/app/langfuse-nextauth-secret, property: value}}
    - {secretKey: project-public-key, remoteRef: {key: devai/app/devai-langfuse-public-key, property: value}, sourceRef: {storeRef: {name: openbao-devai-production, kind: SecretStore}}}
    - {secretKey: project-secret-key, remoteRef: {key: devai/app/devai-langfuse-secret-key, property: value}, sourceRef: {storeRef: {name: openbao-devai-production, kind: SecretStore}}}
    - {secretKey: init-user-password, remoteRef: {key: langfuse/app/langfuse-init-user-password, property: value}}
    - {secretKey: zitadel-client-id, remoteRef: {key: langfuse/app/langfuse-zitadel-client-id, property: value}}
    - {secretKey: zitadel-client-secret, remoteRef: {key: langfuse/app/langfuse-zitadel-client-secret, property: value}}
