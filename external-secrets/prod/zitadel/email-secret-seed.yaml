apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-email-secret-seed
  namespace: zitadel
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-email-secret-seed
  namespace: zitadel
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: zitadel-email-secret-seed}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 10.30.0.10/32}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openbao}}, podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}}]
      ports: [{port: 8200, protocol: TCP}, {port: 15008, protocol: TCP}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-email-secret-seed-v1
  namespace: zitadel
spec:
  backoffLimit: 8
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/name: zitadel-email-secret-seed}
    spec:
      serviceAccountName: zitadel-email-secret-seed
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: asia-south1-docker.pkg.dev/tesseracthub-480811/docker-remote/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python, -B, /scripts/seed.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/openbao, readOnly: true}
      volumes:
        - name: script
          configMap: {name: zitadel-email-secret-seed}
        - name: token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken: {path: token, audience: openbao, expirationSeconds: 600}
