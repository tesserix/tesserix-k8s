apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: zitadel-masterkey
    creationPolicy: Owner
  data:
    # Exactly 32 bytes, and immutable: every encryption key in the eventstore
    # is derived from it, so rotating it orphans the existing data.
    - secretKey: masterkey
      remoteRef:
        key: prod-zitadel-masterkey
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
  data:
    # The `zitadel` role is created by Zitadel's own init Job with this
    # password, so CNPG never sees it and there is no generated Secret to read.
    - secretKey: password
      remoteRef:
        key: prod-zitadel-db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-admin-password
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: zitadel-admin-password
    creationPolicy: Owner
  data:
    # Only ever read once, when the first instance is created. Changing it
    # afterwards has no effect — rotate through the console.
    - secretKey: password
      remoteRef:
        key: prod-zitadel-admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-login-service-key
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: zitadel-login-service-key
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  # The chart would generate this keypair itself, but it guards regeneration
  # with `lookup`, which returns nothing under Argo CD's client-side
  # templating — every sync would rotate the login client's signing key.
  data:
    - secretKey: tls.crt
      remoteRef:
        key: prod-zitadel-login-service-crt
    - secretKey: tls.key
      remoteRef:
        key: prod-zitadel-login-service-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-smtp
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: zitadel-smtp
    creationPolicy: Owner
  # Without SMTP there is no email verification and no password reset, so a
  # user who loses their password has no route back in.
  data:
    - secretKey: password
      remoteRef:
        key: prod-zitadel-smtp-password
