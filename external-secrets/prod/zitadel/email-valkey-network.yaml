apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: zitadel-email-valkey-identity
  namespace: zitadel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-email-valkey
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/zitadel/sa/zitadel-login
              - cluster.local/ns/zitadel/sa/zitadel-email-valkey
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-email-valkey-hbone
  namespace: zitadel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-email-valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-login-email-egress
  namespace: zitadel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-login
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel-email-valkey
              app.kubernetes.io/component: haproxy
      ports:
        - protocol: TCP
          port: 6379
