apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-production-reader
  namespace: homechef
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-temporal-production
  namespace: homechef
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-temporal-homechef-production
          serviceAccountRef:
            name: temporal-production-reader
