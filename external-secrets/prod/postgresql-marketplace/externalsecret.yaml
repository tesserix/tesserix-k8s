apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-password
  namespace: postgresql-marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-password
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: prod-marketplace-postgresql-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-ssl-certs
  namespace: postgresql-marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-ssl-certs
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: prod-postgresql-marketplace-ca-cert
    - secretKey: server.crt
      remoteRef:
        key: prod-postgresql-marketplace-server-cert
    - secretKey: server.key
      remoteRef:
        key: prod-postgresql-marketplace-server-key
