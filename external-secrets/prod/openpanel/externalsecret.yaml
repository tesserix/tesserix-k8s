apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openpanel-secrets
  namespace: openpanel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: openpanel-secrets
    creationPolicy: Owner
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: prod-openpanel-cookie-secret
    - secretKey: postgresql-password
      remoteRef:
        key: prod-openpanel-db-password
    - secretKey: admin-email
      remoteRef:
        key: prod-openpanel-admin-email
    - secretKey: admin-password
      remoteRef:
        key: prod-openpanel-admin-password
