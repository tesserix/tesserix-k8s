apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openpanel-secrets
  namespace: openpanel
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-openpanel-production
    kind: SecretStore
  target:
    name: openpanel-secrets
    creationPolicy: Owner
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: openpanel/app/openpanel-cookie-secret
        property: value
    - secretKey: postgresql-password
      remoteRef:
        key: openpanel/app/openpanel-db-password
        property: value
    - secretKey: admin-email
      remoteRef:
        key: openpanel/app/openpanel-admin-email
        property: value
    - secretKey: admin-password
      remoteRef:
        key: openpanel/app/openpanel-admin-password
        property: value
    # Same shared secret marketplace-api gates /internal on — the cors-sync
    # CronJob reads the merchant custom-domain list with it.
    - secretKey: marketplace-internal-auth
      sourceRef:
        storeRef:
          name: openbao-mark8ly-production
          kind: SecretStore
      remoteRef:
        key: mark8ly/app/mark8ly-audit-ingest-secret
        property: value
    - secretKey: root-client-id
      remoteRef:
        key: openpanel/app/openpanel-root-client-id
        property: value
    - secretKey: root-client-secret
      remoteRef:
        key: openpanel/app/openpanel-root-client-secret
        property: value
