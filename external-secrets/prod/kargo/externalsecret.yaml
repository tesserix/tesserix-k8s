---
# GitHub OAuth credentials consumed by the built-in Dex GitHub connector
# in Kargo. Created in GCP Secret Manager BEFORE first sync — see
# docs/kargo-deployment.md for setup steps.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-github-oauth
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kargo-github-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: prod-kargo-github-client-id
    - secretKey: client-secret
      remoteRef:
        key: prod-kargo-github-client-secret
---
# Backing Secret for `api.secret.name` in the Kargo Helm chart.
# The chart reads ADMIN_ACCOUNT_TOKEN_SIGNING_KEY (used to sign API
# tokens) and ADMIN_ACCOUNT_PASSWORD_HASH (unused since admin login is
# disabled, but the key still has to exist for the chart to render).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-api-secret
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kargo-api-secret
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: prod-kargo-admin-token-signing-key
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: prod-kargo-admin-password-hash
