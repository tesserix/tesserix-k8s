##############################################################################
# Dwellm8 — GHCR pull-token secret.
#
# The dwellm8-api ExternalSecret (for app configuration) lives INSIDE the Helm chart at
# charts/apps/dwellm8-api/templates/externalsecret.yaml — that keeps app
# secrets close to the chart that consumes them.
#
# This file is for cluster-level pull credentials only. The database password
# comes from the CNPG chart's own ExternalSecret, next to the cluster it opens.
##############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: dwellm8
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .ghcr_username }}",
                "password": "{{ .ghcr_token }}",
                "auth": "{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
