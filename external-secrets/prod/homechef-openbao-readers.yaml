apiVersion: v1
kind: ServiceAccount
metadata:
  name: homechef-production-reader
  namespace: document-intelligence
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-homechef-production
  namespace: document-intelligence
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-homechef-document-intelligence-production
          serviceAccountRef:
            name: homechef-production-reader
---
