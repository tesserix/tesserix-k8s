      remoteRef:
        key: prod-mark8ly-oauth-client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-session
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
