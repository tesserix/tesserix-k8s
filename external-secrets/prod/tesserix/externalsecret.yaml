apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# tesserix-auth-bff secrets (forked from mark8ly-auth-bff to serve tesserix.app).
# Reuses GCP secrets from the mark8ly family where the value is the same
# (GIP web API key, OAuth client secret, marketplace internal-auth, postgres
# platform_api password). Only the session-encryption key is tesserix-specific.
#
# Required GCP Secret Manager keys (project tesseracthub-480811):
#   - prod-mark8ly-gip-web-api-key            (existing — same GIP project)
#   - prod-mark8ly-oauth-client-secret        (existing — same Google client)
#   - prod-mark8ly-marketplace-api-internal-auth (existing)
#   - prod-mark8ly-platform-api-db-password   (existing — same CNPG cluster)
#   - prod-tesserix-session-encrypt-key       (NEW — generate via:
#       openssl rand -hex 32 | gcloud secrets create prod-tesserix-session-encrypt-key \
#         --project=tesseracthub-480811 --data-file=- )
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-gip
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-gip
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: prod-mark8ly-gip-web-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-oauth
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-oauth
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-mark8ly-oauth-client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-session
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-tesserix-session-encrypt-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-marketplace-api-internal-auth
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-marketplace-api-internal-auth
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-mark8ly-marketplace-api-internal-auth
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-postgres-platform-api
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-postgres-platform-api
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-platform-api-db-password
