---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-postgres-platform-api
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-postgres-platform-api
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-platform-api-db-password
---
# Bootstrap credentials for the tesserix-postgres CNPG cluster
# (charts/apps/tesserix-postgres). CNPG's initdb stanza consumes a
# basic-auth-shaped secret to create the primary role + database.
#
# Required GCP Secret Manager key:
#   - prod-tesserix-postgres-tesserix-admin-password
#     (32 ASCII chars, generated via:
#        openssl rand -base64 24 | tr -d '\n' | \
#          gcloud secrets versions add prod-tesserix-postgres-tesserix-admin-password \
#          --project=tesseracthub-480811 --data-file=- )
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-postgres-tesserix-admin
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-postgres-tesserix-admin
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "tesserix_admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-tesserix-postgres-tesserix-admin-password
---
# Cross-DB elevated credentials. tesserix-home (and the future
# tesserix-admin-api Go service) connect to mark8ly-postgres-rw.mark8ly
# as the mark8ly_platform_admin role for super-admin CRUD across the
# mark8ly_platform_api and mark8ly_marketplace_api databases. The role
# is provisioned by docs/cross-db-admin.md (one-time SQL ops).
#
# Required GCP Secret Manager key:
#   - prod-mark8ly-platform-admin-password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-platform-admin
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-platform-admin
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "mark8ly_platform_admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-platform-admin-password
---
