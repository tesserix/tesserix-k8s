---
# ClickHouse-OTel read password for the tesserix-home (company) Observability
# page. Same GCP SM value the observability ns uses (prod-clickhouse-otel-password),
# mirrored into the tesserix ns so the company deploy can query the dedicated
# OTel ClickHouse (clickhouse-otel.observability) for service health/traces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-clickhouse-otel
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-clickhouse-otel
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-clickhouse-otel-password
---
# The HMAC key platform-api signs federated calls to mark8ly with
# (tesserix-home#334).
#
# It points at the SAME GCP Secret Manager entry mark8ly's own
# marketplace-api reads (prod-mark8ly-marketplace-api-platform-admin), rather
# than a copy. Both sides of an HMAC must hold byte-identical key material, and
# two secrets that are "the same value" are exactly the thing that drifts on
# the first rotation — silently, because every rejection on that surface is one
# opaque status.
#
# The key is named for the env var the Go service reads, so the chart's
# secretKeyRef needs no translation layer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-federation
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-federation
    creationPolicy: Owner
  data:
    - secretKey: FEDERATION_MARK8LY_SECRET
      remoteRef:
        key: prod-mark8ly-marketplace-api-platform-admin
---
# Kora's half of the same arrangement (kora#430, kora#458).
#
# The SAME GCP value kora-api itself reads as KORA_PLATFORM_ADMIN_SECRET, via
# charts/apps/kora-api's own ExternalSecret. Both ends of an HMAC must hold
# identical bytes; a rotation that updates one side and not the other fails
# every federated call with one opaque 401, and Kora's own logs will say
# `bffauth: rejected request` for the OTHER scheme while this one reports
# `platformauth: rejected request reason=signature_mismatch`.
#
# The key is named for the env var platform-api reads, so the chart's
# secretKeyRef needs no translation layer — same convention as mark8ly above.
#
# NOTE the value is a raw string, not base64. Kora's config.go reads
# KORA_PLATFORM_ADMIN_SECRET without decoding (deliberately unlike
# KORA_BFF_HMAC_KEY, which it base64-decodes), and federation.Sign takes a
# string. Storing the base64 TEXT is fine; base64-DECODING it on either side
# is not.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-federation
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kora-federation
    creationPolicy: Owner
  data:
    - secretKey: FEDERATION_KORA_SECRET
      remoteRef:
        key: prod-kora-api-platform-admin
