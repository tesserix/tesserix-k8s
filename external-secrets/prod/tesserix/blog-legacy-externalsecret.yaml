# Retain the dormant consumer; its old identity-bootstrap chart was removed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: blog-identity-bootstrap-client-secrets
  namespace: tesserix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao-blog-legacy
  target:
    name: blog-identity-bootstrap-client-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: blog-bff-secret
    remoteRef:
      key: blog/app/blog-keycloak-client-secret
      property: value
