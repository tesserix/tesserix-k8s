##############################################################################
# Kora — GHCR pull-token secret.
#
# The kora-api ExternalSecret (for app config like the Gemini / OpenAI /
# Expo keys and DATABASE_URL) lives INSIDE the Helm chart at
# charts/apps/kora-api/templates/externalsecret.yaml — that keeps app
# secrets close to the chart that consumes them.
#
# This file is for cluster-level pull credentials only.
##############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: kora
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .ghcr_username }}",
                "password": "{{ .ghcr_token }}",
                "auth": "{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# Bearer key the kora-mcp gateway requires on X-MCP-Key. The same GCP
# secret feeds product-mcp-upstream-keys in agentgateway-system.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-mcp-auth
  namespace: kora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kora-mcp-auth
    creationPolicy: Owner
  data:
    - secretKey: MCP_AUTH_KEY
      remoteRef:
        key: prod-support-platform-kora-mcp-key
---
# Shared key for kora-api's /internal/v1 routes, read by both kora-api and
# kora-mcp. Kept out of kora-api-secrets so a missing GCP value cannot stall
# that ExternalSecret (ESO fails the whole object on any missing remoteRef).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-mcp-internal
  namespace: kora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kora-mcp-internal
    creationPolicy: Owner
  data:
    - secretKey: KORA_MCP_INTERNAL_KEY
      remoteRef:
        key: prod-kora-mcp-internal-key
