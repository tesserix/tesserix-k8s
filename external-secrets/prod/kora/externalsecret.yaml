        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-production
          kind: SecretStore
---
# kora-api's Document Intelligence identity for label reads (kora#559). The key is the same
# value the document-intelligence-prod release loads as kora-api-v1.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-label-ocr
  namespace: kora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kora-label-ocr
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OCR_UPLOAD_URL: http://document-intelligence-prod-upload-api.document-intelligence.svc.cluster.local:8080
        OCR_JOB_URL: http://document-intelligence-prod-job-api.document-intelligence.svc.cluster.local:8080
        OCR_KEY_ID: kora-api-v1
        OCR_TENANT: ten_kora_public
        OCR_KEY_SECRET: '{{ .key | trim }}'
  data:
    - secretKey: key
      remoteRef:
        key: kora/app/kora-api-ocr-key
        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-production
          kind: SecretStore
