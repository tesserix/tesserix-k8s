  name: kora-ai-trace-user-key
  namespace: kora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kora-ai-trace-user-key
    creationPolicy: Owner
  data:
    - secretKey: KORA_AI_TRACE_USER_KEY
      remoteRef:
        key: kora/app/kora-ai-trace-user-key
        property: value
      sourceRef:
        storeRef:
          name: openbao-kora-production
          kind: SecretStore
---
