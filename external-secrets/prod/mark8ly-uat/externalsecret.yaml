# GCP Secret Manager → Kubernetes secrets for the mark8ly-uat namespace.
# Mirrors the prod externalsecret.yaml shape — same secret keys, same
# template structure — but every GCP SM key is `prod-mark8ly-uat-*`
# and every K8s Secret is created in the `mark8ly-uat` namespace with
# a `mark8ly-uat-*` name. Provisioning script for the UAT-side GCP SM
# secrets lives in the commit message of the first push of this file.
# All UAT-side secrets are independent of prod (separate DB passwords,
# separate session keys, separate internal-auth tokens, etc.) so a UAT
# data-loss exercise can't taint prod credentials.
---
# GHCR pull secret — mirrors the pattern used by every other tesserix product.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# Google Identity Platform — browser-exposed Web API key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-gip
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-gip
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: prod-mark8ly-uat-gip-web-api-key
---
# OAuth client secret for the "Sign in with Google" flow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-oauth
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-oauth
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-mark8ly-uat-oauth-client-secret
---
# Cross-service audit ingest secret. Shared by marketplace-api (which
# enforces it on /internal/audit-events) and the auth-bff + platform-api
# clients that POST audit events. The secret is a 32-byte random value
# stored as a hex string in GCP Secret Manager.
#
# To provision (one-time):
#   openssl rand -hex 32 | gcloud secrets create prod-mark8ly-audit-ingest-secret \
#       --project=tesseracthub-480811 --data-file=-
#
# Until that secret exists in SM, the ExternalSecret keeps failing
# to sync; the Kubernetes Secret therefore doesn't exist; and the
# `optional: true` secretKeyRef in each deployment yields an empty env
# var. marketplace-api's middleware treats empty as permissive, so
# audit ingest keeps working end-to-end during the rollout window.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-audit-ingest
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-audit-ingest
    creationPolicy: Owner
  data:
    - secretKey: AUDIT_INGEST_SECRET
      remoteRef:
        key: prod-mark8ly-uat-audit-ingest-secret
---
# SendGrid — transactional email provider.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-sendgrid
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-sendgrid
    creationPolicy: Owner
  data:
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: prod-mark8ly-uat-sendgrid-api-key
---
# auth-bff encrypted session cookie key (32 bytes, random).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-session
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-mark8ly-uat-session-encrypt-key
---
# marketplace-api AES-256-GCM key. Must be a 32-byte key encoded as
# 64 hex characters or standard base64 with padding.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-marketplace-api-encryption
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-marketplace-api-encryption
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: prod-mark8ly-uat-marketplace-api-encryption-key
---
# CloudNativePG bootstrap password for the platform_api role (24 chars).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-postgres-platform-api
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-postgres-platform-api
    creationPolicy: Owner
    # CNPG expects basic-auth shape (username/password).
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-uat-platform-api-db-password
---
# CloudNativePG bootstrap password for the openfga role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-postgres-openfga
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-postgres-openfga
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "openfga"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-uat-openfga-db-password
---
# CloudNativePG bootstrap password for the marketplace_api role.
# The role and database (mark8ly_marketplace_api) are created by the
# marketplace-api bootstrap Job in the mark8ly-postgres chart; this
# ExternalSecret provides the password that Job reads.
#
# REQUIRES: GCP Secret Manager secret `prod-mark8ly-marketplace-api-db-password`
#           (24+ random chars, generated once, see M1.5 deploy runbook).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-postgres-marketplace-api
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-postgres-marketplace-api
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "marketplace_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-uat-marketplace-api-db-password
---
# Storefront trust-boundary shared secret (spec §13.1.2 + §14.8).
# Read by the marketplace-api storefront engine to validate requests
# from the mark8ly-storefront Next.js app before serving any response.
# Rotatable; slice 1 uses a single long-lived value.
#
# REQUIRES: GCP Secret Manager secret `prod-mark8ly-marketplace-api-storefront-key`
#           (base64 32+ random bytes, see M1.5 deploy runbook).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-marketplace-api-storefront-key
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-marketplace-api-storefront-key
    creationPolicy: Owner
  data:
    - secretKey: STOREFRONT_KEY
      remoteRef:
        key: prod-mark8ly-uat-marketplace-api-storefront-key
---
# marketplace-api internal-trust header secret (admin engine).
# Used by auth-bff and admin Next.js to authenticate against the admin API.
#
# REQUIRES: GCP Secret Manager secret `prod-mark8ly-marketplace-api-internal-auth`
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-marketplace-api-internal-auth
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-marketplace-api-internal-auth
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-mark8ly-uat-marketplace-api-internal-auth
---
# platform-api internal-trust header secret. Mirrors the marketplace-api
# pattern above: gates platform-api's /internal/* surface (tenant lookup,
# store lookup, invitations, password-reset) against any caller that
# can't prove it knows the shared secret.
#
# Read by:
#   - mark8ly-platform-api → INTERNAL_AUTH_SECRET (gate side)
#   - mark8ly-admin       → PLATFORM_INTERNAL_AUTH_SECRET (caller side,
#                            forwarded as X-Internal-Auth on every
#                            server-side fetch into platform-api/internal/*)
#
# 32-byte random hex generated via:
#   openssl rand -hex 32 | gcloud secrets create \
#       prod-mark8ly-platform-api-internal-auth \
#       --project=tesseracthub-480811 --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-platform-api-internal-auth
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-platform-api-internal-auth
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-mark8ly-uat-platform-api-internal-auth
---
# Sentry DSN for error tracking (marketplace-api + Next.js apps).
# Optional — pods start without it (secretKeyRef.optional: true).
#
# REQUIRES: GCP Secret Manager secret `prod-mark8ly-sentry-dsn`
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-sentry
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-sentry
    creationPolicy: Owner
  data:
    - secretKey: SENTRY_DSN
      remoteRef:
        key: prod-mark8ly-uat-sentry-dsn
---
# Otto support-chat service — HMAC secret for signed customer-session
# cookies + shared internal-auth secret between otto and the Next.js apps
# (storefront + admin). Both values are 32-byte random strings.
#
# REQUIRES: GCP Secret Manager secrets
#   - prod-mark8ly-otto-session-secret
#   - prod-mark8ly-otto-internal-auth
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-otto
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-otto
    creationPolicy: Owner
  data:
    - secretKey: CUSTOMER_SESSION_SECRET
      remoteRef:
        key: prod-mark8ly-uat-otto-session-secret
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-mark8ly-uat-otto-internal-auth
---
# Stripe Billing keys for subscription management (S3).
# Optional — subscription endpoints return errors when unconfigured.
#
# REQUIRES: GCP Secret Manager secrets:
#   - `prod-mark8ly-stripe-billing-secret-key`
#   - `prod-mark8ly-stripe-billing-webhook-secret`
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-stripe-billing
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-stripe-billing
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_BILLING_SECRET_KEY
      remoteRef:
        key: prod-mark8ly-uat-stripe-billing-secret-key
    - secretKey: STRIPE_BILLING_WEBHOOK_SECRET
      remoteRef:
        key: prod-mark8ly-uat-stripe-billing-webhook-secret
---
# Playwright e2e credentials for the Kargo smoke-stage Job. JSON payload
# from the prod-mark8ly-uat-playwright-creds GCP SM entry is split into
# the email + password env keys the suite expects. Never embedded in
# code or chart values; the Job mounts the K8s Secret as env-from.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-uat-playwright-creds
  namespace: mark8ly-uat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-uat-playwright-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        MARK8LY_ADMIN_EMAIL: "{{ .email }}"
        MARK8LY_ADMIN_PASSWORD: "{{ .password }}"
  data:
    - secretKey: email
      remoteRef:
        key: prod-mark8ly-uat-playwright-creds
        property: email
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-uat-playwright-creds
        property: password
