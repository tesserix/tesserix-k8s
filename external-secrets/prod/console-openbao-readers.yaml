apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-production-reader
  namespace: tesserix
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-console-production
  namespace: tesserix
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-console-tesserix-production
          serviceAccountRef:
            name: console-production-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-migration-writer
  namespace: tesserix
automountServiceAccountToken: false
