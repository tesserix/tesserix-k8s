---
# Kargo read access to the private roamie repo (deploy branch) for the roamie Warehouse.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: roamie-git-creds
  namespace: kargo-roamie
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: roamie-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/roamie.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
