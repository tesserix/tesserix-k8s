# Slack incoming-webhook URL for falcosidekick. ESO syncs the
# `prod-falco-slack-webhook` GCP SM entry into the `falcosidekick-secrets`
# K8s Secret; falcosidekick consumes it via `config.existingSecret`, which
# expects env-var-style keys (SLACK_WEBHOOKURL).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: falcosidekick-slack
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: falcosidekick-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOKURL
      remoteRef:
        key: prod-falco-slack-webhook
