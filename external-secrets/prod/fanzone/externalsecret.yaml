# Otto support-chat shared-secret. Must match the value the shared Otto in
# support-platform reads from prod-support-platform-otto-internal-auth or
# the X-Internal-Auth header gate fails.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fanzone-otto
  namespace: fanzone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: fanzone-otto
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-support-platform-otto-internal-auth
---
# GHCR image pull secret for fanzone namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: fanzone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
