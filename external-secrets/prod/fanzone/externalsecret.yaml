---
# pgvector connection secret — replicates the support-platform-postgres-app
# Kubernetes Secret into this namespace so mcp-gateway pods running here
# can authenticate to the shared support-platform pgvector for the
# search_knowledge_base + lookup_conversation tools. Sources from the
# same GCP Secret Manager keys as the original support-platform copy,
# so credentials stay in sync via the standard 1h refresh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-postgres-app
  namespace: fanzone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-support-platform-postgres-username
    - secretKey: password
      remoteRef:
        key: prod-support-platform-postgres-password
---
# Resend — transactional email fallback provider (SendGrid stays primary).
# prod-resend-api-key is the platform-wide Resend key shared by all
# products, so there is no fanzone-specific GCP secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fanzone-resend
  namespace: fanzone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: fanzone-resend
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: prod-resend-api-key
---
