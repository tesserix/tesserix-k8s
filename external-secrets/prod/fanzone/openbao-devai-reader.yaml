apiVersion: v1
kind: ServiceAccount
metadata:
  name: devai-production-reader
  namespace: fanzone
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-devai-production
  namespace: fanzone
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-devai-fanzone-production
          serviceAccountRef:
            name: devai-production-reader
