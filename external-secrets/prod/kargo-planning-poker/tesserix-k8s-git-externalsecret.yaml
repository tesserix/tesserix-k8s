---
# Git read credentials for the planning-poker Kargo Project, used by the
# Warehouse's `git:` subscription on tesserix/tesserix-k8s. Kargo clones
# the repo to detect commits that touch this product's Helm chart, values,
# or Argo CD Application YAML — the same PAT Argo CD already uses to read
# manifests from this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-k8s-git-creds
  namespace: kargo-planning-poker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-k8s-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/tesserix-k8s.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
