---
# Git read credentials for the planning-poker Kargo Project's `services`
# Warehouse, which subscribes to the tesserix/planning-poker commit graph
# (the `deploy` branch) to drive image-tag promotion. Kargo clones the repo
# to read the newest deploy-branch commit; the prod Stage derives
# api/web image.tag = main-<sha7> from it. The commit graph, not image
# discovery — Artifact Registry paginates tag lists at 100 and NewestBuild
# flaps prod backwards once a repo passes that (see the Warehouse).
#
# Match: the kargo.akuity.io/cred-type=git label tells Kargo this Secret is
# a git credential, and `repoURL` is the literal URL Kargo's git
# subscription points at.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: planning-poker-git-creds
  namespace: kargo-planning-poker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: planning-poker-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/planning-poker.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
