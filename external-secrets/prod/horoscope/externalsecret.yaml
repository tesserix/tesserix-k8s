##############################################################################
# Tesserix Horoscope — GHCR pull-token secret.
#
# The horoscope-api / horoscope-web ExternalSecrets (for app config like
# the Anthropic / AstrologyAPI / Prokerala keys) live INSIDE the Helm
# chart at charts/apps/horoscope-api/templates/externalsecret.yaml — that
# keeps app secrets close to the chart that consumes them.
#
# This file is for cluster-level pull credentials only.
##############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: horoscope
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .ghcr_username }}",
                "password": "{{ .ghcr_token }}",
                "auth": "{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
