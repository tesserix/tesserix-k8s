apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: growthbook-secrets
  namespace: growthbook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: growthbook-secrets
    creationPolicy: Owner
  data:
    - secretKey: encryption-key
      remoteRef:
        key: prod-encryption-key
    - secretKey: jwt-secret
      remoteRef:
        key: prod-jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: growthbook-admin-secret
  namespace: growthbook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: growthbook-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: prod-growthbook-admin-password
