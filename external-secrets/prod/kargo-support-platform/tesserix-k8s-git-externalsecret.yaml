---
# Git read credentials for the support-platform Kargo Project — same
# shape as kargo-scrapper. Kargo clones tesserix-k8s to detect commits
# touching this product's Helm charts / values / ArgoCD Applications.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-k8s-git-creds
  namespace: kargo-support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-k8s-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/tesserix-k8s.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
