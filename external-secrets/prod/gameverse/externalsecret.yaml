apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: gameverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# pgvector connection secret — replicates the support-platform-postgres-app
# Kubernetes Secret into this namespace so mcp-gateway pods running here
# can authenticate to the shared support-platform pgvector for the
# search_knowledge_base + lookup_conversation tools. Sources from the
# same GCP Secret Manager keys as the original support-platform copy,
# so credentials stay in sync via the standard 1h refresh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-postgres-app
  namespace: gameverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-support-platform-postgres-username
    - secretKey: password
      remoteRef:
        key: prod-support-platform-postgres-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gameverse-mcp-auth
  namespace: gameverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: gameverse-mcp-auth
    creationPolicy: Owner
  data:
    - secretKey: MCP_AUTH_KEY
      remoteRef:
        key: prod-support-platform-gameverse-mcp-key
