apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: fe3dr-appdeps-reader
  namespace: gameverse
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-fe3dr-appdeps
  namespace: gameverse
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-fe3dr-appdeps-gameverse
          serviceAccountRef:
            name: fe3dr-appdeps-reader
      path: kv
      server: http://openbao.openbao.svc.cluster.local:8200
      version: v2
