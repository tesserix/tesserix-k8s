apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: prod-cloudflare-api-token
---
# Cloudflare API token for fanzonebattleground.com domain
# Separate from marketplace token (different CF account/zone)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-fanzone-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-fanzone-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: prod-fanzone-cloudflare-api-token
