# DevAI API secrets (LLM providers, GitHub App, LangSmith)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-api-secrets
  namespace: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DEVAI_OPENAI_API_KEY
      remoteRef:
        key: prod-devai-openai-api-key
    - secretKey: DEVAI_ANTHROPIC_API_KEY
      remoteRef:
        key: prod-devai-anthropic-api-key
    - secretKey: DEVAI_GROQ_API_KEY
      remoteRef:
        key: prod-devai-groq-api-key
    - secretKey: DEVAI_GITHUB_APP_ID
      remoteRef:
        key: prod-devai-github-app-id
    - secretKey: DEVAI_GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: prod-devai-github-app-private-key
    - secretKey: DEVAI_GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: prod-devai-github-app-installation-id
    - secretKey: DEVAI_GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: prod-devai-github-webhook-secret
    - secretKey: DEVAI_GITHUB_OAUTH_CLIENT_ID
      remoteRef:
        key: prod-devai-github-oauth-client-id
    - secretKey: DEVAI_GITHUB_OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-devai-github-oauth-client-secret
    - secretKey: DEVAI_LANGCHAIN_API_KEY
      remoteRef:
        key: prod-devai-langsmith-api-key
    - secretKey: DEVAI_CLOUDFLARE_API_TOKEN
      remoteRef:
        key: prod-devai-cloudflare-api-token
    - secretKey: DEVAI_CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: prod-devai-cloudflare-account-id
    # Gemini — the devai-api chart's env block references this; absence
    # of the key in the Secret yields CreateContainerConfigError.
    - secretKey: DEVAI_GEMINI_API_KEY
      remoteRef:
        key: prod-devai-gemini-api-key
    # MCP Hub ↔ devai-api shared service bearer. The Hub PRESENTS it toward
    # authMode=jwt downstreams (/mcp/scm, /mcp/gitops); devai-api ACCEPTS it
    # (identity._principal_from_service_bearer). One key, one rotation.
    - secretKey: DEVAI_MCP_HUB_SERVICE_TOKEN
      remoteRef:
        key: prod-devai-mcp-hub-service-token
    # Qdrant (ai-database) — read/write key for the qdrant memory backend.
    # Same GCP SM source the qdrant chart itself uses, so one rotation.
    - secretKey: DEVAI_QDRANT_API_KEY
      remoteRef:
        key: prod-qdrant-api-key
    # ── SRE Observability connectors ──────────────────────────────────
    # Configured in DevAI Settings → Observability (which creates the GCP SM
    # secret). To light a provider up, create the GCP SM secret then UNCOMMENT
    # its line(s) here. The devai-sre deployment reads these with
    # optional:true, so the pod runs fine while they're commented out — the
    # observability fan-out simply treats that provider as not connected.
    # In-cluster Prometheus needs NOTHING here (it's the default source).
    #
    # Datadog:
    # - secretKey: DEVAI_DATADOG_API_KEY
    #   remoteRef: { key: prod-devai-datadog-api-key }
    # - secretKey: DEVAI_DATADOG_APP_KEY
    #   remoteRef: { key: prod-devai-datadog-app-key }
    # New Relic:
    # - secretKey: DEVAI_NEWRELIC_API_KEY
    #   remoteRef: { key: prod-devai-newrelic-api-key }
    # - secretKey: DEVAI_NEWRELIC_ACCOUNT_ID
    #   remoteRef: { key: prod-devai-newrelic-account-id }
    # AWS CloudWatch (or use IRSA on the SA instead of static keys):
    # - secretKey: AWS_ACCESS_KEY_ID
    #   remoteRef: { key: prod-devai-aws-access-key-id }
    # - secretKey: AWS_SECRET_ACCESS_KEY
    #   remoteRef: { key: prod-devai-aws-secret-access-key }
    # - secretKey: DEVAI_AWS_REGION
    #   remoteRef: { key: prod-devai-aws-region }
    # - secretKey: DEVAI_CLOUDWATCH_LOG_GROUP
    #   remoteRef: { key: prod-devai-cloudwatch-log-group }
    # Azure Monitor / App Insights (or use workload identity on the SA):
    # - secretKey: DEVAI_AZURE_WORKSPACE_ID
    #   remoteRef: { key: prod-devai-azure-workspace-id }
    # - secretKey: DEVAI_AZURE_RESOURCE_ID
    #   remoteRef: { key: prod-devai-azure-resource-id }
    # Elasticsearch:
    # - secretKey: DEVAI_ELASTICSEARCH_URL
    #   remoteRef: { key: prod-devai-elasticsearch-url }
    # - secretKey: DEVAI_ELASTICSEARCH_API_KEY
    #   remoteRef: { key: prod-devai-elasticsearch-api-key }
    # Grafana:
    # - secretKey: DEVAI_GRAFANA_URL
    #   remoteRef: { key: prod-devai-grafana-url }
    # - secretKey: DEVAI_GRAFANA_TOKEN
    #   remoteRef: { key: prod-devai-grafana-token }
    # - secretKey: DEVAI_GRAFANA_DATASOURCE_UID
    #   remoteRef: { key: prod-devai-grafana-datasource-uid }
---
# aregistry JWT for the devai-registry-bootstrap Job and any DevAI
# service that authenticates to the agent catalog. The same key lives
# in agentregistry-system / agentgateway-system / kagent-system —
# mirrored here so cross-namespace pod-runs in `devai` can read it
# without RBAC into another namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
---
# GitHub PAT for DevAI workloads that need to read repos (registry
# bootstrap clones tesserix/devai for seeds; SCM client reads/writes
# webhooks, issues, PRs; the chat agent's repo tools call the GitHub
# API). Single PAT, single rotation surface in GCP SM
# (prod-devai-github-pat).
#
# Two K8s representations emitted from the same source key:
#  1. `devai-github-pat`           plain Opaque secret with `token` key,
#                                   consumed by Python services via
#                                   DEVAI_GITHUB_TOKEN env.
#  2. `devai-github-pat-gitconfig` Opaque with `.gitconfig` containing
#                                   a credential rewrite so plain
#                                   `git clone` of a private tesserix
#                                   repo works without token-pasting.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-github-pat
  namespace: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-github-pat
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: prod-devai-github-pat
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-github-pat-gitconfig
  namespace: devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-github-pat-gitconfig
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Drop into $HOME of the workload pod. `git clone https://github.com/...`
        # is rewritten to embed the token via the credential helper-less
        # `url.<base>.insteadOf` pattern. Keeps the token out of process
        # args + history.
        .gitconfig: |
          [url "https://{{ .token }}:x-oauth-basic@github.com/"]
            insteadOf = https://github.com/
  data:
    - secretKey: token
      remoteRef:
        key: prod-devai-github-pat
