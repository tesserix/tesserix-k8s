---
# Git read credentials for the stockpilot Kargo Project, used by the
# Warehouse's `git:` subscription on tesserix/stock-analysis. The
# subscription drives auto-promotion: every new commit on `main` of
# the source app repo creates a Freight whose ID[0:7] becomes the
# image.tag (`main-<sha7>`) the prod Stage writes to the Argo Apps.
#
# Reuses prod-ghcr-token (the same PAT Argo CD / npm pull use). Its
# `repo` scope lets Kargo's git client clone and list main-branch
# commits on the private tesserix/stock-analysis repo.
#
# Match: kargo.akuity.io/cred-type=git tells Kargo the Secret is for
# git, and `repoURL` is the literal subscription URL.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stock-analysis-git-creds
  namespace: kargo-stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: stock-analysis-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/stock-analysis.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
