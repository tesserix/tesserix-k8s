# GHCR image pull secret for stockpilot namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# PostgreSQL password for stockpilot app services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-stockpilot-password
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-stockpilot-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-stockpilot-postgresql-password
---
# NextAuth secrets for stockpilot web frontend
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stockpilot-auth-secrets
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: stockpilot-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: prod-stockpilot-nextauth-secret
    # INTERNAL_AUTH_SECRET — shared between the Next.js BFF proxy
    # (server-side; sets X-Internal-Secret on cluster-internal calls)
    # and FastAPI (validates X-User-Email only when this matches).
    # MUST inject into both stockpilot-api and stockpilot-web pods.
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-stockpilot-internal-auth-secret
---
# Zitadel OIDC client secret for the stockpilot-web application. Deliberately a
# separate ExternalSecret: one missing remoteRef fails the whole object, and
# folding this into stockpilot-auth-secrets would take NEXTAUTH_SECRET and
# INTERNAL_AUTH_SECRET down with it until prod-stockpilot-oidc-client-secret
# exists. See docs/zitadel-onboarding.md Part 1 Step 2.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stockpilot-oidc-secrets
  namespace: stockpilot
spec:
  # Shorter than the hour used elsewhere: this is the credential that rotates
  # when the app moves org, and Reloader restarts the pod as soon as it lands.
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: stockpilot-oidc-secrets
    creationPolicy: Owner
  data:
    - secretKey: ZITADEL_CLIENT_SECRET
      remoteRef:
        key: prod-stockpilot-oidc-client-secret
---
