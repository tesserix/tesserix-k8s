---
# IBKR IB Gateway credentials for the sidecar container
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ibkr-credentials
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ibkr-credentials
    creationPolicy: Owner
  data:
