# GHCR image pull secret for stockpilot namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# PostgreSQL password for stockpilot app services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-stockpilot-password
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgresql-stockpilot-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-stockpilot-postgresql-password
---
# Redis password for stockpilot app services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-stockpilot-password
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-stockpilot-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-stockpilot-redis-password
---
# NextAuth secrets for stockpilot web frontend
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stockpilot-auth-secrets
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: stockpilot-auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: prod-stockpilot-nextauth-secret
    # INTERNAL_AUTH_SECRET — shared between the Next.js BFF proxy
    # (server-side; sets X-Internal-Secret on cluster-internal calls)
    # and FastAPI (validates X-User-Email only when this matches).
    # MUST inject into both stockpilot-api and stockpilot-web pods.
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-stockpilot-internal-auth-secret
---
# IBKR IB Gateway credentials for the sidecar container
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ibkr-credentials
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ibkr-credentials
    creationPolicy: Owner
  data:
    - secretKey: TWS_USERID
      remoteRef:
        key: prod-stockpilot-ibkr-tws-userid
    - secretKey: TWS_PASSWORD
      remoteRef:
        key: prod-stockpilot-ibkr-tws-password
---
# pgvector connection secret — replicates the support-platform-postgres-app
# Kubernetes Secret into this namespace so mcp-gateway pods running here
# can authenticate to the shared support-platform pgvector for the
# search_knowledge_base + lookup_conversation tools. Sources from the
# same GCP Secret Manager keys as the original support-platform copy,
# so credentials stay in sync via the standard 1h refresh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-postgres-app
  namespace: stockpilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-support-platform-postgres-username
    - secretKey: password
      remoteRef:
        key: prod-support-platform-postgres-password
