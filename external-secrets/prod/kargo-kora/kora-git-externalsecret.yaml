# Git read credentials for the kora Kargo Project's `services` Warehouse, which
# subscribes to the tesserix/kora `deploy` branch to drive image-tag promotion.
#
# Same gap devai had: without this the Warehouse can only clone while the repo
# is PUBLIC, so discovery dies with `could not read Username for github.com`
# the moment CI flips it back to private and no Freight is ever created.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kora-git-creds
  namespace: kargo-kora
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kora-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/kora.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
