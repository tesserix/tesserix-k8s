apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: kagent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    # kagent's controller reads Agent CRs from aregistry; needs the same
    # JWT signing key to authenticate its catalog API calls.
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
