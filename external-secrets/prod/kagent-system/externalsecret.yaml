# DevAI active-variants service bearer. The kagent-agent-sync render step
# PRESENTS this toward devai-api's /api/settings/kagent/active-variants, which
# accepts it via identity._principal_from_service_bearer (service role). Same
# GCP SM key the MCP Hub uses (DEVAI_MCP_HUB_SERVICE_TOKEN) — one key, one
# rotation. With this, enabling a model in DevAI Settings drives kagent to spin
# the variant pod up; the last user disabling it reaps the pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-agent-sync-devai-token
  namespace: kagent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kagent-agent-sync-devai-token
    creationPolicy: Owner
  data:
    - secretKey: DEVAI_MCP_HUB_SERVICE_TOKEN
      remoteRef:
        key: prod-devai-mcp-hub-service-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aregistry-jwt
  namespace: kagent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: aregistry-jwt
    creationPolicy: Owner
  data:
    # kagent's controller reads Agent CRs from aregistry; needs the same
    # JWT signing key to authenticate its catalog API calls.
    - secretKey: jwt-secret
      remoteRef:
        key: prod-aregistry-jwt-secret
---
# kagent's bundled `default-model-config` ModelConfig CR (created by
# the upstream chart) references this Secret + key. Without it the 10
# sample Agent CRs (helm-agent, istio-agent, promql-agent, etc.)
# stay Pending with "failed to get secret kagent-openai: not found".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kagent-openai
  namespace: kagent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kagent-openai
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prod-devai-openai-api-key
