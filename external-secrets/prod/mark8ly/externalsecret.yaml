---
# CloudNativePG bootstrap password for the platform_api role (24 chars).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-postgres-platform-api
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-postgres-platform-api
    creationPolicy: Owner
    # CNPG expects basic-auth shape (username/password).
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-platform-api-db-password
---
