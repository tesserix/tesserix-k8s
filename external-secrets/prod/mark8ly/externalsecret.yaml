---
# auth-bff encrypted session cookie key (32 bytes, random).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-session
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
