# GCP Secret Manager → Kubernetes secrets for the mark8ly namespace.
# All six secrets referenced here were provisioned in Step 2 of the deploy plan
# (prod-mark8ly-* family in project tesseracthub-480811).
---
# GHCR pull secret — mirrors the pattern used by every other tesserix product.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# Google Identity Platform — browser-exposed Web API key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-gip
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-gip
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: prod-mark8ly-gip-web-api-key
    # Server-to-server GIP key, with NO HTTP-referrer restriction.
    #
    # GIP_WEB_API_KEY above is the value the admin browser bundle embeds, so
    # it is referrer-restricted by construction. A server sends no Referer,
    # and GIP rejects referrer-restricted admin calls with
    # "Requests from referer <empty> are blocked" (403) — which is what broke
    # password-reset confirm. Relaxing the web key is not an option: it is
    # public. platform-api prefers this key and falls back to the web one.
    - secretKey: GIP_SERVER_API_KEY
      remoteRef:
        key: prod-mark8ly-gip-server-api-key
    # GIP API-key resource name — projects/<num>/locations/global/keys/<uid>.
    # Sourced from Secret Manager so the UUID-bearing string doesn't sit
    # in the chart values (GitGuardian flags the high-entropy UUID even
    # though it isn't a credential). Consumed by marketplace-api-admin's
    # gipkey integration to know which browser API key to patch when a
    # merchant custom domain is verified.
    - secretKey: GIP_WEB_API_KEY_RESOURCE_NAME
      remoteRef:
        key: prod-mark8ly-gip-web-api-key-resource-name
---
# OAuth client secret for the "Sign in with Google" flow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-oauth
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-oauth
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-mark8ly-oauth-client-secret
---
# Cross-service audit ingest secret. Shared by marketplace-api (which
# enforces it on /internal/audit-events) and the auth-bff + platform-api
# clients that POST audit events. The secret is a 32-byte random value
# stored as a hex string in GCP Secret Manager.
#
# To provision (one-time):
#   openssl rand -hex 32 | gcloud secrets create prod-mark8ly-audit-ingest-secret \
#       --project=tesseracthub-480811 --data-file=-
#
# Until that secret exists in SM, the ExternalSecret keeps failing
# to sync; the Kubernetes Secret therefore doesn't exist; and the
# `optional: true` secretKeyRef in each deployment yields an empty env
# var. marketplace-api's middleware treats empty as permissive, so
# audit ingest keeps working end-to-end during the rollout window.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-audit-ingest
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-audit-ingest
    creationPolicy: Owner
  data:
    - secretKey: AUDIT_INGEST_SECRET
      remoteRef:
        key: prod-mark8ly-audit-ingest-secret
---
# SendGrid — transactional email provider.
# Resend — the transactional email provider for mark8ly. SendGrid was
# removed: its key answered "401 Maximum credits exceeded", so keeping it
# configured only placed a dead provider in the fallback chain.
# prod-resend-api-key is the platform-wide Resend key shared by all
# products, so there is no mark8ly-specific GCP secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-resend
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-resend
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: prod-resend-api-key
    # Webhook signing secret for inbound delivery events (mark8ly#348B).
    #
    # A DIFFERENT credential from the API key above and not interchangeable:
    # the key authenticates us calling Resend, this verifies Resend calling
    # us. Product-prefixed because the webhook belongs to mark8ly, whereas
    # prod-resend-api-key is the platform-wide shared key.
    #
    # Absent, marketplace-api mounts the endpoint but answers 503
    # not_configured — diagnosable, rather than a 404 that reads as a wrong
    # URL.
    - secretKey: RESEND_WEBHOOK_SECRET
      remoteRef:
        key: prod-mark8ly-resend-webhook-secret
---
