---
# Platform console admin surface HMAC key (mark8ly#275). Shared symmetric
# secret: the Tesserix platform console signs each /api/v1/platform/admin/*
# request with it, and marketplace-api verifies the signature.
#
# NOT interchangeable with INTERNAL_AUTH_SECRET above — different caller,
# different trust model (signed per-request with operator identity, replay
# window and single-use nonce, rather than a bare shared header).
#
# Unlike the internal-auth secrets, an EMPTY value here does not degrade to
# permissive mode: the platform admin surface fails closed and answers
# 503 not_configured until this is populated.
#
# REQUIRES: GCP Secret Manager secret `prod-mark8ly-marketplace-api-platform-admin`
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-marketplace-api-platform-admin
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-marketplace-api-platform-admin
    creationPolicy: Owner
  data:
    - secretKey: PLATFORM_ADMIN_SECRET
      remoteRef:
        key: prod-mark8ly-marketplace-api-platform-admin
---
# platform-api internal-trust header secret. Mirrors the marketplace-api
# pattern above: gates platform-api's /internal/* surface (tenant lookup,
# store lookup, invitations, password-reset) against any caller that
# can't prove it knows the shared secret.
#
# Read by:
#   - mark8ly-platform-api → INTERNAL_AUTH_SECRET (gate side)
#   - mark8ly-admin       → PLATFORM_INTERNAL_AUTH_SECRET (caller side,
#                            forwarded as X-Internal-Auth on every
#                            server-side fetch into platform-api/internal/*)
#
# 32-byte random hex generated via:
#   openssl rand -hex 32 | gcloud secrets create \
#       prod-mark8ly-platform-api-internal-auth \
#       --project=tesseracthub-480811 --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-platform-api-internal-auth
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-platform-api-internal-auth
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-mark8ly-platform-api-internal-auth
---
# Server-side pepper mixed into every stored email-OTP hash, so a dump of
# auth_login_codes alone yields no usable sign-in codes. Rotating it
# invalidates all in-flight codes — harmless, they live 5 minutes.
#
# Read by:
#   - mark8ly-auth-bff → EMAIL_OTP_PEPPER. Unset leaves the new-device
#     challenge disabled: logins still work, unrecognised devices are
#     still alerted about, but they are not challenged.
#
# 32-byte random hex generated via:
#   openssl rand -hex 32 | gcloud secrets create \
#       prod-mark8ly-email-otp-pepper \
#       --project=tesseracthub-480811 --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-email-otp
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-email-otp
    creationPolicy: Owner
  data:
    - secretKey: EMAIL_OTP_PEPPER
      remoteRef:
        key: prod-mark8ly-email-otp-pepper
---
