# GCP Secret Manager → Kubernetes secrets for the mark8ly namespace.
# All six secrets referenced here were provisioned in Step 2 of the deploy plan
# (prod-mark8ly-* family in project tesseracthub-480811).
---
# GHCR pull secret — mirrors the pattern used by every other tesserix product.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# Google Identity Platform — browser-exposed Web API key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-gip
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-gip
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: prod-mark8ly-gip-web-api-key
---
# OAuth client secret for the "Sign in with Google" flow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-oauth
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-oauth
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-mark8ly-oauth-client-secret
---
# SendGrid — transactional email provider.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-sendgrid
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-sendgrid
    creationPolicy: Owner
  data:
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: prod-mark8ly-sendgrid-api-key
---
# auth-bff encrypted session cookie key (32 bytes, random).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-session
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-mark8ly-session-encrypt-key
---
# CloudNativePG bootstrap password for the platform_api role (24 chars).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-postgres-platform-api
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-postgres-platform-api
    creationPolicy: Owner
    # CNPG expects basic-auth shape (username/password).
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-platform-api-db-password
---
# CloudNativePG bootstrap password for the openfga role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-postgres-openfga
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-postgres-openfga
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "openfga"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-mark8ly-openfga-db-password
