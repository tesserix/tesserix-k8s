---
# Zitadel machine credential for reading the plan catalog from the Tesserix
# console (mark8ly#304, tesserix-home#427).
#
# The console is becoming the single source of truth for plan prices;
# marketplace-api currently compiles them into internal/billing/pricing/
# catalog.go. This credential is what lets it read them instead.
#
# Identity: Zitadel service user `mark8ly-catalog-reader`, holding the
# `read-plan-catalog` project role on project 386377618200461939. That role
# grants reading PUBLISHED prices and nothing else — deliberately not the
# console's `billing` surface, which would hand a price reader wallets,
# refunds, payouts and subscription state.
#
# Proven end to end 2026-08-30 against console.tesserix.app: unauthenticated
# 401, real token 200, If-None-Match 304, 78 prices in each of test and live.
#
# # ABSENT IS A SUPPORTED STATE, AND IS WHY THIS IS SAFE TO LAND FIRST
#
# BACKLOG §P's invariant: nothing on the request path of a customer payment
# may depend on the console being reachable. So the consumer reads through a
# cache that fails open to last-known, with the compiled catalog as a
# baked-snapshot fallback on a cold start. An empty or missing credential
# therefore degrades to exactly today's behaviour — prices come from the Go
# catalog — rather than failing a checkout.
#
# That is also why this ExternalSecret lands before the code that reads it:
# an unused Kubernetes Secret changes nothing, and the deployment env wiring
# arrives with the consumer, so the variable names are defined once.
#
# # Token minting (for anyone reproducing this by hand)
#
#   POST https://auth.tesserix.app/oauth/v2/token
#   grant_type=client_credentials
#   scope=openid
#         urn:zitadel:iam:org:project:id:386377618200461939:aud
#         urn:zitadel:iam:org:projects:roles
#
# Both scopes are load-bearing. The `:aud` scope puts the project in the
# token's `aud`, and the audience check is the one thing proving the token
# was minted for this route rather than reused from elsewhere. The roles
# scope is what makes the token carry the project-scoped roles claim; without
# it the token verifies but holds no capability.
#
# The service user's Access Token Type must be JWT, not the default opaque
# Bearer — the console verifies the signature against JWKS, and an opaque
# token has nothing to verify. That misconfiguration surfaces as a flat 401
# that reads exactly like a wrong credential.
#
# REQUIRES: GCP Secret Manager secrets, project tesseracthub-480811
#   - prod-mark8ly-console-catalog-client-id
#   - prod-mark8ly-console-catalog-client-secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-console-catalog
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-console-catalog
    creationPolicy: Owner
  data:
    - secretKey: CONSOLE_CATALOG_CLIENT_ID
      remoteRef:
        key: prod-mark8ly-console-catalog-client-id
    - secretKey: CONSOLE_CATALOG_CLIENT_SECRET
      remoteRef:
        key: prod-mark8ly-console-catalog-client-secret
---
