---
# Stripe Billing keys for subscription management (S3).
# Optional — subscription endpoints return errors when unconfigured.
#
# REQUIRES: GCP Secret Manager secrets:
#   - `prod-mark8ly-stripe-billing-secret-key-test`
#   - `prod-mark8ly-stripe-billing-webhook-secret-test`
#
# ONE SECRET PER (SERVICE, STRIPE MODE) — the `-test` suffix is the point.
#
# These used to read `prod-mark8ly-stripe-billing-secret-key`, with no mode in
# the name. On 2026-09-03 a restricted key was created in Stripe's LIVE mode
# and added as a new VERSION of that secret. ESO reads the latest version, so
# a rotation silently became an environment switch: the admin pod restarted
# onto a live key and, for six minutes, mark8ly's billing pointed at the real
# Stripe account. Nothing called Stripe in that window and no customer,
# charge or subscription was created — but nothing about the secret's name,
# or about adding a version to it, made the switch visible.
#
# Versions exist to ROTATE ONE CREDENTIAL. Using them to hold two different
# modes conflates rotation history with environment identity, and it makes
# rollback dangerous in a way rollback must never be: `versions access <n>`
# on an older version can hand back a different Stripe account entirely.
#
# The mode now lives in the secret NAME, so it is visible at every point a
# human touches it — writing it, reading it, and here. A live key cannot be
# added to a `-test` secret by accident; it has nowhere to go.
#
# The `prod-` prefix is the DEPLOYMENT environment and is unrelated: mark8ly
# production runs against Stripe test mode, and has since it was set up
# (tesserix-home#327 records this). `prod-…-test` is not a contradiction —
# it is production, on Stripe test. That pairing being surprising is exactly
# why the mode belongs in the name rather than in a version's payload.
#
# The webhook secret is renamed alongside it deliberately, though it caused
# no incident. It is mode-specific too: a Stripe endpoint's signing secret
# belongs to one mode, so switching the API key without switching the webhook
# secret produces charges that succeed while the events confirming them fail
# verification. Naming them as a matched pair makes that dependency legible
# rather than something to remember.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-stripe-billing
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mark8ly-stripe-billing
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_BILLING_SECRET_KEY
      remoteRef:
        key: prod-mark8ly-stripe-billing-secret-key-test
    - secretKey: STRIPE_BILLING_WEBHOOK_SECRET
      remoteRef:
        key: prod-mark8ly-stripe-billing-webhook-secret-test
---
