apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-rocketchat-onboarding
  namespace: mark8ly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-mark8ly-production
    kind: SecretStore
  target:
    name: mark8ly-rocketchat-onboarding
    creationPolicy: Owner
  data:
    - secretKey: ROCKETCHAT_AUTH_TOKEN
      remoteRef:
        key: mark8ly/app/mark8ly-rocketchat-onboarding
        property: token
    - secretKey: ROCKETCHAT_USER_ID
      remoteRef:
        key: mark8ly/app/mark8ly-rocketchat-onboarding
        property: user_id
    - secretKey: ROCKETCHAT_ONBOARDING_ROOM_ID
      remoteRef:
        key: mark8ly/app/mark8ly-rocketchat-onboarding
        property: room_id
