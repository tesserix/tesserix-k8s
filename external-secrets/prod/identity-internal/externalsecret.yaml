apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-credentials
  namespace: identity-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prod-keycloak-internal-admin-username
    - secretKey: password
      remoteRef:
        key: prod-keycloak-internal-admin-password
---
