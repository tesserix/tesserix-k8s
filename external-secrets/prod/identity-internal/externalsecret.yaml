apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-client-secrets
  namespace: identity-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: keycloak-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-bff-client-secret
      remoteRef:
        key: prod-keycloak-admin-bff-client-secret
    - secretKey: token-exchange-client-secret
      remoteRef:
        key: prod-keycloak-token-exchange-client-secret
    - secretKey: admin-client-secret
      remoteRef:
        key: prod-keycloak-internal-admin-client-secret
    - secretKey: dashboard-client-secret
      remoteRef:
        key: prod-keycloak-internal-dashboard-client-secret
    - secretKey: stockpilot-web-client-secret
      remoteRef:
        key: prod-stockpilot-keycloak-client-secret
    - secretKey: homechef-admin-bff-client-secret
      remoteRef:
        key: prod-homechef-internal-keycloak-client-secret
    - secretKey: secret-service-client-secret
      remoteRef:
        key: prod-secret-service-oidc-client-secret
