# Slack incoming-webhook URL for Alertmanager (mark8ly#644, phase 3).
#
# Reuses the SAME GCP Secret Manager entry falcosidekick uses
# (`prod-falco-slack-webhook`), so alerts land in the existing falco-events
# channel rather than standing up a new app, webhook and channel for a
# receiver that has yet to prove itself.
#
# An incoming webhook is bound to its channel, so Alertmanager's `channel:`
# field is not set — the webhook decides where the message goes.
#
# Alertmanager reads the value from a FILE (`api_url_file`) rather than
# inlining it, so the URL never appears in the Application manifest, in
# `helm template` output, or in ArgoCD's rendered diff.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOKURL
      remoteRef:
        key: prod-falco-slack-webhook
