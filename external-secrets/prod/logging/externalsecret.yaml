# Elasticsearch credentials - synced from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: elastic-credentials
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: elastic-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod-elastic-password
---
# Elasticsearch master credentials - required by Kibana 8.x pre-install hook
# Uses the same password as elastic-credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: elasticsearch-master-credentials
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: elasticsearch-master-credentials
    creationPolicy: Owner
    template:
      data:
        username: elastic
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-elastic-password
---
# Kibana encryption keys - required for saved objects, sessions, and reporting
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kibana-encryption-keys
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kibana-encryption-keys
    creationPolicy: Owner
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: prod-kibana-encryption-key
