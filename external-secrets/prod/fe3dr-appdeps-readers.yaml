apiVersion: v1
kind: ServiceAccount
metadata:
  name: fe3dr-appdeps-reader
  namespace: homechef
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-fe3dr-appdeps
  namespace: homechef
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-fe3dr-appdeps-homechef
          serviceAccountRef:
            name: fe3dr-appdeps-reader
---
