# Otto support-chat shared-secret. Must match the value the shared Otto
# in support-platform reads from prod-support-platform-otto-internal-auth
# or the X-Internal-Auth header gate fails.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homechef-otto
  namespace: homechef
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: homechef-otto
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-support-platform-otto-internal-auth
    # slm-router → homechef-api escalation hook (ticket-from-conversation).
    # Same value lands in support-platform-slm-router-mcp-keys as
    # HOMECHEF_SUPPORT_HOOK_SECRET.
    - secretKey: SUPPORT_HOOK_SECRET
      remoteRef:
        key: prod-homechef-support-hook-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: homechef
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# homechef-auth-bff GIP/OIDC + session secrets. Replaces the legacy
# secret bundle (homechef-auth-bff-secrets sourced via the Helm chart template
# pre-2026-05 cutover). All seven keys live in GCP Secret Manager under the
# prod-homechef-* family — see the Phase 5 deploy runbook.
#
# IMPORTANT: BFF_INTERNAL_HMAC_KEY MUST match the value the homechef-api pod
# reads from the same secret manager entry (mirrored into its own
# homechef-api-secrets ExternalSecret). If the two sides drift, every
# BFF→API request 401s on the trust-header check.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homechef-auth-bff-secrets
  namespace: homechef
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: homechef-auth-bff-secrets
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: prod-homechef-gip-web-api-key
    - secretKey: HOMECHEF_CUSTOMER_CLIENT_SECRET
      remoteRef:
        key: prod-homechef-customer-client-secret
    - secretKey: HOMECHEF_BUSINESS_CLIENT_SECRET
      remoteRef:
        key: prod-homechef-business-client-secret
    - secretKey: HOMECHEF_INTERNAL_CLIENT_SECRET
      remoteRef:
        key: prod-homechef-internal-client-secret
    - secretKey: SESSION_ENCRYPT_KEY
      remoteRef:
        key: prod-homechef-session-encrypt-key
    - secretKey: BFF_INTERNAL_HMAC_KEY
      remoteRef:
        key: prod-homechef-bff-internal-hmac-key
    - secretKey: HOMECHEF_ADMIN_ALLOWED_EMAILS
      remoteRef:
        key: prod-homechef-admin-allowed-emails
---
# pgvector connection secret — replicates the support-platform-postgres-app
# Kubernetes Secret into this namespace so mcp-gateway pods running here
# can authenticate to the shared support-platform pgvector for the
# search_knowledge_base + lookup_conversation tools. Sources from the
# same GCP Secret Manager keys as the original support-platform copy,
# so credentials stay in sync via the standard 1h refresh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-postgres-app
  namespace: homechef
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-support-platform-postgres-username
    - secretKey: password
      remoteRef:
        key: prod-support-platform-postgres-password
---
# GCS service-account key for Percona Backup for MongoDB (PBM). The Mongo
# replica set (homechef-mongodb, #53) streams scheduled backups to
# gs://tesseract-prod-backups-in/homechef-mongodb via PBM's native GCS
# storage, which requires explicit credentials (it cannot use Workload
# Identity). The two keys are the client_email + private_key of a
# least-privilege SA (storage.objectAdmin on the backups bucket only),
# stored in GCP Secret Manager. PBM reads exactly these key names.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homechef-mongodb-backup-gcs
  namespace: homechef
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: homechef-mongodb-backup-gcs
    creationPolicy: Owner
  data:
    - secretKey: GCS_CLIENT_EMAIL
      remoteRef:
        key: prod-homechef-mongodb-backup-gcs-client-email
    - secretKey: GCS_PRIVATE_KEY
      remoteRef:
        key: prod-homechef-mongodb-backup-gcs-private-key
