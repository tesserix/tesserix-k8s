---
# MongoDB Blog password for backup jobs
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-blog-password
  namespace: db-backup-and-restore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: mongodb-blog-password
    creationPolicy: Owner
  data:
    - secretKey: mongodb-password
      remoteRef:
        key: prod-blog-mongodb-root-password
