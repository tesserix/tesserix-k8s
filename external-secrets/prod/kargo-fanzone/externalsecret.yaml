---
# GHCR image-read credentials for the fanzone Kargo Project.
# Kargo's Warehouse uses this Secret (matched by the
# `kargo.akuity.io/cred-type=image` label) to list tags on
# ghcr.io/tesserix/fanzone-battle-ground/* — the same PAT that the
# Argo CD repo Secret already uses (prod-ghcr-token, scope: read:packages
# + repo).
#
# repoURL is a regex covering every fanzone GHCR package; repoURLIsRegex
# tells Kargo to treat repoURL as a regex rather than a literal.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-image-creds
  namespace: kargo-fanzone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-image-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: '^ghcr\.io/tesserix/fanzone-battle-ground/.*'
        repoURLIsRegex: "true"
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
