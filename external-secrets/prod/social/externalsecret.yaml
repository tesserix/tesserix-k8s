# GCP Secret Manager → Kubernetes secrets for the `social` namespace (prod).
#
# Every key referenced by `remoteRef.key` is provisioned in step 9 of
# docs/setup/gip.md (prod-social-* family in project tesseracthub-480811).
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-gip
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-gip
    creationPolicy: Owner
  data:
    - secretKey: GIP_WEB_API_KEY
      remoteRef:
        key: prod-social-gip-web-api-key
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod-social-oauth-client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-session
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: prod-social-session-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-internal-jwt
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-internal-jwt
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: prod-social-internal-jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-llm
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-llm
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: prod-social-anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prod-social-openai-api-key
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: prod-social-openrouter-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-postgres-platform-api
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-postgres-platform-api
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "platform_api"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-social-platform-api-db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-postgres-auth-bff
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: social-postgres-auth-bff
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "auth_bff"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prod-social-auth-bff-db-password
