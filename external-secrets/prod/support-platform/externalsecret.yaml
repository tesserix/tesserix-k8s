# GHCR image pull secret for support-platform namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-secret
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: ghcr_token
      remoteRef:
        key: prod-ghcr-token
---
# Otto session + internal-auth secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-otto
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-otto
    creationPolicy: Owner
  data:
    - secretKey: CUSTOMER_SESSION_SECRET
      remoteRef:
        key: prod-support-platform-otto-session-secret
    - secretKey: INTERNAL_AUTH_SECRET
      remoteRef:
        key: prod-support-platform-otto-internal-auth
---
# SendGrid for OTP email. Reuses the platform-wide SendGrid key — same
# sender domain works for all three product OTPs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-sendgrid
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-sendgrid
    creationPolicy: Owner
  data:
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: prod-support-platform-sendgrid-api-key
---
# Resend — transactional email fallback provider (SendGrid stays primary).
# prod-resend-api-key is the platform-wide Resend key shared by all
# products, so there is no support-platform-specific GCP secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-resend
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-resend
    creationPolicy: Owner
  data:
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: prod-resend-api-key
---
# Hugging Face token for slm-inference / embedder / reranker
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-hf-token
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-hf-token
    creationPolicy: Owner
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: prod-support-platform-hf-token
---
# Postgres app credentials for the support-platform-postgres CNPG
# cluster. CNPG reads this Secret on bootstrap to set the owner's
# password; slm-router reads it to build the pgvector DSN. Both expect
# the Secret to expose `username` and `password` keys (CNPG-style).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-postgres-app
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-support-platform-postgres-username
    - secretKey: password
      remoteRef:
        key: prod-support-platform-postgres-password
---
# Per-product MCP API keys consumed by slm-router. optional=true on the
# secretKeyRef in the slm-router Deployment means a missing key won't
# block the pod from starting.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: support-platform-slm-router-mcp-keys
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: support-platform-slm-router-mcp-keys
    creationPolicy: Owner
  data:
    - secretKey: MARK8LY_MCP_KEY
      remoteRef:
        key: prod-support-platform-mark8ly-mcp-key
    - secretKey: FANZONE_MCP_KEY
      remoteRef:
        key: prod-support-platform-fanzone-mcp-key
    - secretKey: HOMECHEF_MCP_KEY
      remoteRef:
        key: prod-support-platform-homechef-mcp-key
    - secretKey: STOCKPILOT_MCP_KEY
      remoteRef:
        key: prod-support-platform-stockpilot-mcp-key
    - secretKey: GAMEVERSE_MCP_KEY
      remoteRef:
        key: prod-support-platform-gameverse-mcp-key
    - secretKey: HOROSCOPE_MCP_KEY
      remoteRef:
        key: prod-support-platform-horoscope-mcp-key
    - secretKey: PLATFORM_MCP_KEY
      remoteRef:
        key: prod-support-platform-platform-mcp-key
    # Escalation hook secret for homechef-api /internal/support/tickets/
    # from-conversation — same GSM value the homechef-otto ES mirrors as
    # SUPPORT_HOOK_SECRET in the homechef namespace.
    - secretKey: HOMECHEF_SUPPORT_HOOK_SECRET
      remoteRef:
        key: prod-homechef-support-hook-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-mcp-auth
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: platform-mcp-auth
    creationPolicy: Owner
  data:
    - secretKey: MCP_AUTH_KEY
      remoteRef:
        key: prod-support-platform-platform-mcp-key
