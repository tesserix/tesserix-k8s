apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mark8ly-rocketchat-support
  namespace: support-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-support-platform-production
    kind: SecretStore
  target:
    name: mark8ly-rocketchat-support
    creationPolicy: Owner
  data:
    - secretKey: ROCKETCHAT_SUPPORT_AUTH_TOKEN
      remoteRef:
        key: support-platform/app/support-platform-mark8ly-rocketchat
        property: token
    - secretKey: ROCKETCHAT_SUPPORT_USER_ID
      remoteRef:
        key: support-platform/app/support-platform-mark8ly-rocketchat
        property: user_id
    - secretKey: ROCKETCHAT_SUPPORT_ROOM_ID
      remoteRef:
        key: support-platform/app/support-platform-mark8ly-rocketchat
        property: room_id
