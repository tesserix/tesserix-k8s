---
# Git read credentials for the devai Kargo Project's `services` Warehouse,
# which subscribes to the tesserix/devai commit graph (the `deploy` branch) to
# drive image-tag promotion. Kargo clones the repo to read the newest
# deploy-branch commit; the prod Stage derives image.tag = main-<sha7> from it.
#
# WHY THIS WAS MISSING (and why deploys silently stalled): every other Kargo
# project has this credential, devai did not. Without it the Warehouse could
# only clone tesserix/devai while the repo was PUBLIC (anonymous git). The
# moment the repo was made private, discovery failed with
#   fatal: could not read Username for 'https://github.com'
# so no Freight was created and the prod Stage stayed on the old commit. This
# untethers devai prod deploys from repo visibility.
#
# Same PAT (prod-ghcr-token, `repo` scope) as the other Kargo git creds — its
# scope lets Kargo's git client clone + list deploy-branch commits on the
# private tesserix/devai repo.
#
# Match: the kargo.akuity.io/cred-type=git label tells Kargo this Secret is a
# git credential, and `repoURL` is the literal URL the git subscription points at.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devai-git-creds
  namespace: kargo-devai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: devai-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/devai.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
