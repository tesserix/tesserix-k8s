---
# Git credentials for the kargo-infra Project — same shape as the product
# projects. The infra auto-upgrade stages WRITE here: they bump
# argocd/prod/infrastructure/<app>.yaml spec.source.targetRevision and
# push, so every automated upgrade lands as an auditable commit and Git
# stays the single source of truth.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-k8s-git-creds
  namespace: kargo-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-k8s-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/tesserix-k8s.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
