---
# GHCR image-read credentials for the kargo-infra Project.
#
# The chart warehouses here need no credentials — they poll public Helm
# repos. The observability-apps warehouse does: obs-api and obs-ui live in
# a private repo, so their GHCR packages are private and anonymous tag
# listing returns 403.
#
# Same PAT as the product projects (prod-ghcr-token), scoped by regex to
# the observability image repos only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-image-creds
  namespace: kargo-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-image-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: '^ghcr\.io/tesserix/observability/.*'
        repoURLIsRegex: "true"
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
