---
# Git read credentials for the beautyandcruor Kargo Project — same shape as
# kargo-support-platform. Kargo clones tesserix-k8s to detect commits touching
# this product's Helm chart, values and ArgoCD Application.
#
# Without it the Warehouse reports MissingCommits and creates no Freight at
# all — not even from the image subscriptions, which are fine on their own.
# One unreadable subscription holds up the whole Warehouse, so the project
# looked healthy while nothing was ever promoted.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tesserix-k8s-git-creds
  namespace: kargo-beautyandcruor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: tesserix-k8s-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/tesserix-k8s.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
