apiVersion: v1
kind: ServiceAccount
metadata:
  name: mark8ly-production-reader
  namespace: agentgateway-system
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-mark8ly-production
  namespace: agentgateway-system
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-mark8ly-agentgateway-system-production
          serviceAccountRef:
            name: mark8ly-production-reader
---
