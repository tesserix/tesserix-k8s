apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: typesense-secrets
  namespace: typesense
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-typesense-production
    kind: SecretStore
  target:
    name: typesense-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: typesense/app/typesense-api-key
        property: value
