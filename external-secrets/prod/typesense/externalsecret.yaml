apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: typesense-secrets
  namespace: typesense
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: typesense-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: prod-typesense-api-key
