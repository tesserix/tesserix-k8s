---
# Git read credentials for the homechef Kargo Project's `services`
# Warehouse, which subscribes to the tesserix/Home-Chef-App commit graph
# (the `deploy` branch) to drive image-tag promotion. Kargo clones the repo
# to read the newest deploy-branch commit; the prod Stage derives
# image.tag = main-<sha7> from it. (Image discovery was abandoned because
# the homechef-* repos have >100 main-<sha> tags and Artifact Registry
# paginates the tag list at 100, breaking NewestBuild — see the Warehouse.)
#
# Match: the kargo.akuity.io/cred-type=git label tells Kargo this Secret is
# a git credential, and `repoURL` is the literal URL Kargo's git
# subscription points at. Same PAT (prod-ghcr-token) as the tesserix-k8s
# git cred, just scoped to a different repoURL.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: home-chef-app-git-creds
  namespace: kargo-homechef
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: home-chef-app-git-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: 'https://github.com/tesserix/Home-Chef-App.git'
        username: '{{ .username }}'
        password: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef:
        key: prod-ghcr-username
    - secretKey: password
      remoteRef:
        key: prod-ghcr-token
