apiVersion: v1
kind: ServiceAccount
metadata:
  name: roamie-production-reader
  namespace: agentgateway-system
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-roamie-production
  namespace: agentgateway-system
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: read-roamie-agentgateway-system-production
          serviceAccountRef:
            name: roamie-production-reader
---
