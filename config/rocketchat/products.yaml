# Registration data for the future operator; no controller consumes this yet.
apiVersion: tesserix.app/v1alpha1
kind: ProductChatRegistry
workspace: https://rocketchat.tesserix.app
serviceIdentityRole:
  name: bot
  permissions:
    - view-joined-room
products:
  mark8ly:
    environment: production
    namespace: mark8ly
    channels:
      onboarding:
        name: onboarding-mark8ly
        id: 6adeda38dfe0bc336c6d4c03
        visibility: workspace
        trigger: completed-initial-tenant-and-store-onboarding
      support:
        name: support-mark8ly
        enabled: false
    serviceIdentity:
      username: mark8ly-onboarding-bot
      id: 2LnQXGYY2XPsJMCLZ
    credentials:
      openbaoPath: mark8ly/app/mark8ly-rocketchat-onboarding
      secretStore: openbao-mark8ly-production
      kubernetesSecret: mark8ly-rocketchat-onboarding
    delivery:
      eventKind: rocketchat.onboarding_completed
      messageIdTemplate: mark8ly-onboarding-<tenant-id>
      application: mark8ly-platform-api
